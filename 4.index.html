:root{--emerald:#0d6b52;--emerald2:#09523f;--gold:#caa34a;--gold2:#e1c574;--bg:#f7f3e9;--paper:#fffdf8;--text:#1f2a27;--muted:#72807a;--line:#e6ddc8;--shadow:0 12px 32px rgba(27,57,48,.10);--radius:22px;--reader-size:20px;--font:'Cairo',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% -10%,rgba(202,163,74,.18),transparent 28%),var(--bg);color:var(--text);font-family:var(--font);transition:.25s;background-color:var(--bg)}
body.dark{--bg:#101815;--paper:#17221e;--text:#f3f0e8;--muted:#aab5b0;--line:#2e4039;--shadow:0 14px 36px rgba(0,0,0,.25);background:radial-gradient(circle at 15% -10%,rgba(202,163,74,.10),transparent 28%),var(--bg)}
button,input,select{font:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--emerald);white-space:nowrap}.brandmark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--emerald),var(--emerald2));color:#fff;box-shadow:0 8px 20px rgba(13,107,82,.24)}
.search{position:relative;flex:1}.search input{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--text);padding:12px 44px 12px 14px;border-radius:16px;outline:0}.search i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--paper);color:var(--text);width:42px;height:42px;border-radius:14px;cursor:pointer;transition:.2s}.iconbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
main{max-width:1180px;margin:auto;padding:24px 18px 100px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--emerald2),var(--emerald));color:#fff;border-radius:30px;padding:34px;box-shadow:var(--shadow);margin-bottom:24px}.hero:after{content:'✦';position:absolute;left:28px;top:12px;font-size:120px;color:rgba(255,255,255,.07)}.hero .kicker{color:var(--gold2);font-weight:800}.hero h1{margin:8px 0 10px;font-family:'Amiri',serif;font-size:clamp(28px,5vw,48px);line-height:1.35}.hero p{max-width:760px;margin:0;color:#eaf5f1;line-height:2}.statsline{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:8px 12px;border-radius:999px;font-size:13px}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 14px}.section-title h2{margin:0;font-size:22px}.section-title span{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;box-shadow:0 5px 18px rgba(27,57,48,.05);transition:transform .22s,box-shadow .22s,border .22s}.card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}.card:active{transform:scale(.985)}.card-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:rgba(13,107,82,.10);color:var(--emerald);font-size:20px}.card h3{font-family:'Amiri',serif;font-size:23px;line-height:1.45;margin:14px 0 7px}.card p{color:var(--muted);line-height:1.9;font-size:14px;min-height:53px}.card-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:14px}.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(202,163,74,.22);animation:ripple .55s linear;pointer-events:none}@keyframes ripple{to{transform:scale(4);opacity:0}}
.view{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.reader-head{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:24px;margin-bottom:14px}.back{border:0;background:transparent;color:var(--emerald);cursor:pointer;font-weight:700}.reader-head h1{font-family:'Amiri',serif;font-size:clamp(28px,5vw,42px);line-height:1.5;margin:12px 0}.reader-stats{color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.tools{position:sticky;top:67px;z-index:30;display:flex;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);padding:10px;border-radius:18px;margin-bottom:14px}.tool{border:1px solid var(--line);background:var(--paper);color:var(--text);padding:9px 12px;border-radius:12px;cursor:pointer}.tool:hover{border-color:var(--gold)}.tool.active{background:var(--emerald);color:#fff;border-color:var(--emerald)}.reader{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:clamp(20px,5vw,46px);box-shadow:0 8px 28px rgba(27,57,48,.05);font-size:var(--reader-size);line-height:2.15}.reader p{margin:0 0 1.15em;white-space:pre-wrap}.reader .sep{text-align:center;color:var(--gold);letter-spacing:2px}.progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--emerald));width:0;z-index:100}.topbtn{position:fixed;left:20px;bottom:82px;width:46px;height:46px;border:0;border-radius:50%;background:var(--emerald);color:#fff;box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:.2s}.topbtn.show{opacity:1;pointer-events:auto}
.empty{background:var(--paper);border:1px dashed var(--line);padding:36px;border-radius:22px;text-align:center;color:var(--muted)}.settings{display:grid;gap:14px;max-width:760px}.setting{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}.setting label{display:block;font-weight:700;margin-bottom:10px}.setting select,.setting input[type=range]{width:100%}.reset{background:#8c3e3e;color:#fff;border:0;padding:12px 16px;border-radius:14px;cursor:pointer}
.bottomnav{position:fixed;right:50%;transform:translateX(50%);bottom:12px;z-index:45;display:flex;gap:6px;background:color-mix(in srgb,var(--paper) 95%,transparent);backdrop-filter:blur(14px);padding:7px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.navbtn{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:14px;cursor:pointer;display:flex;gap:7px;align-items:center}.navbtn.active{background:rgba(13,107,82,.12);color:var(--emerald);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:88px 18px 20px}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:16px}.result{padding:14px;border-radius:16px;cursor:pointer;border-bottom:1px solid var(--line)}.result:hover{background:rgba(13,107,82,.07)}.result h4{margin:0 0 5px}.result p{margin:0;color:var(--muted);font-size:13px;line-height:1.8}.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:82px;background:#1f2a27;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:120}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.brand span{display:none}}@media(max-width:600px){main{padding:16px 12px 94px}.topin{padding:10px 12px}.cards{grid-template-columns:1fr}.hero{padding:24px;border-radius:24px}.reader-head,.reader{border-radius:20px}.tools{top:63px;overflow:auto;flex-wrap:nowrap}.tool{white-space:nowrap}.bottomnav{bottom:8px;width:calc(100% - 18px);justify-content:space-around}.navbtn{flex-direction:column;font-size:11px;gap:3px;padding:7px 10px}.navbtn i{font-size:16px}}

<script>
const SECTIONS=[{"id":"s1","title":"مقدمة المؤلف","content":["الروائح الزكية في مولد خير البرية","في","مولد خير البريّة صلى الله عليه وسلم","--------------------------------------------------------------------------------","بسم الله الرحمن الرحيم","الحمد لله رب العالمين الذي أنعم علينا ببعثة سيدنا محمد صلى الله عليه وسلم وجعله سراجًا وإمامًا للمتقين، والصلاة والسلام على خاتم المرسلين وإمام الأنبياء الحاشر العاقب الأمين، وعلى ءاله وصحابته الطيبين.","أما بعد فإنَّ الله عزّ وجَلَّ قد كَرَّم َ النبي محمدًا وكرَّم أمته ورفع قدرها فوق الأمم السابقة، قال تعالى: }كنتم خيرَ أمةٍ أُخرجت للناس{ [سورة ءال عمران]. وما ارتفعت هذه الأمة إلا بنبيّها وما شَرُفت إلا به، لذلك كان الاعتناء ببيان مولد هذا النبي الكريم وما ظهر من الآيات عند ذلك وما أعطاه الله من المواهب والشمائل من مهمات الأمور، إذ يزداد المؤمن بذلك تعظيمًا ومعرفة بفضله صلى الله عليه وسلم.","ولما كان أغلب ما خُصّص من المصنفات للمولد مشتملاً على الكثير من الضعيف بل ويحوي أحيانًا الموضوع، صنفنا هذا الكتاب مستخرجًا من كتب السنة، فجاء فيه زبدة المرويّات في مشهور مصنفات الأئمة الحفاظ، طلبًا للأجر ورغبة فيما عند الله من جزيل الثواب.","والحمد لله رب العالمين."],"icon":"fa-book-open","description":"الروائح الزكية في مولد خير البرية"},{"id":"s2","title":"فصل في تحقيق معنى البدعة وحكمها","content":["اعلم أن البدعة لغة ما أحدث على غير مثال سابق يقال: جئت بأمر بديع أي محدث عجيب لم يعرف قبل ذلك. وفي الشرع المحدَثُ الذي لم ينص عليه القرءان ولا جاء في السنة، قال ابن العربي: \"ليست البدعة والمحدَث مذمومين للفظ بدعة ومحدث ولا معنييهما، وإنما يذم من البدعة ما يخالف السنة، ويذم من المحدثات ما دعا إلى الضلالة\" ا.هـ.","أقسام البدعة:","والبدعة تنقسم إلى قسمين:","بدعة ضلالة: وهي المحدَثة المخالفة للقرءان والسنة.","وبدعة هدى: وهي المحدَثة الموافقة للقرءان والسنة.","وهذا التقسيم مفهوم من حديث البخاري([5]) ومسلم([6]) عن عائشة رضي الله عنها قالت: قال رسول الله صلى الله عليه وسلم: \"مَن أحدث في أمرنا هذا ما ليس منه فهو رد\". ورواه مسلم([7]) بلفظ ءاخر وهو: \"من عمل عملا ليس عليه أمرنا فهو رد\". فأفهم رسول الله صلى الله عليه وسلم بقوله:\"ما ليس منه\" أن المحدَث إنما يكون ردًّا أي مردوداً إذا كان على خلاف الشريعة، وأن المحدَث الموافق للشريعة ليس مردودًا.","وهو مفهوم أيضًا مما رواه مسلم([8]) في صحيحه من حديث جرير بن عبد الله البجلي رضي الله عنه أنه قال: قال رسول الله صلى الله عليه وسلم : \"من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها بعده من غير أن ينقص من أجورهم شىء، ومن سن في الإسلام سنة سيئة كان عليه وزرها ووزر من عمل بها من بعده من غير أن ينقص من أوزارهم شىء\".","وفي صحيح البخاري([9]) في كتاب صلاة التراويح ما نصه: \"قال ابن شهاب: فتوفي رسول الله صلى الله عليه وسلم والناس على ذلك\"، قال الحافظ ابن حجر([10]): \"أي على ترك الجماعة في التراويح\". ثم قال ابن شهاب في تتمة كلامه: \"ثم كان الأمر على ذلك في خلافة أبي بكر وصدرًا من خلافة عمر رضي الله عنه\".","وفيه أيضًا([11]) تتميمًا لهذه الحادثة عن عبد الرحمن بن عبدٍ القاريّ أنه قال:خرجت مع عمر بن الخطاب رضي الله عنه ليلة في رمضان إلى المسجد، فإذا الناس أوزاع متفرقون يصلي الرجل لنفسه ويصلي الرجل فيصلي بصلاته الرهط، فقال عمر: إني أرى لو جمعت هؤلاء على قارىء واحد لكان أمثل، ثم عزم فجمعهم على أُبيّ بن كعب، ثم خرجت معه ليلة أخرى والناس يصلون بصلاة قارئهم قال عمر: \"نعم البدعة هذه\".ا.هـ. وفي الموطأ([12]) بلفظ: \"نِعمت البدعة هذه\".","قال الحافظ ابن حجر([13]): \"قوله قال عمر: \"نعم البدعة\" في بعض الروايات \"نعمت البدعة\" بزيادة التاء، والبدعة أصلها ما أحدث على غير مثال سابق، وتطلق في الشرع في مقابل السنة فتكون مذمومة، والتحقيق إن كانت مما تندرج تحت مستحسن في الشرع فهي حسنة، وإن كانت مما تندرج تحت مستقبح في الشرع فهي مستقبحة، وإلا فهي من قسم المباح، وقد تنقسم إلى الأحكام الخمسة\"ا.هـ. ومراده بالأحكام الخمسة: الفرض والمندوب والمباح والمكروه والحرام.","وأخرج البخاري([14]) في صحيحه عن رِفاعة بن رافع الزَّرقي قال: كنا يومًا نصلي وراء النبي صلى الله عليه وسلم، فلما رفع رأسه من الركعة قال: \"سمع الله لمن حمده\"، قال رجل وراءه: ربنا ولك الحمد حمدًا كثيراً طيبًا مباركًا فيه، فلما انصرف قال: \"من المتكلم\" قال: أنا، قال: \"رأيت بضعة وثلاثين ملكًا يبتدرونها أيهم يكتبها أول\".","قال الحافظ ابن حجر([15]) في الفتح في شرح هذا الحديث: \"واستدل به على جواز إحداث ذكر في الصلاة غير مأثور إذا كان غير مخالف للمأثور\" ا.هـ.","وروى أبو داود([16]) عن عبد الله بن عمر أنه كان يزيد في التشهد: \"وحده لا شريك له\"، ويقول: \"أنا زدتها\" ا.هـ.","وقال النووي في كتاب تهذيب الأسماء واللغات([17]) ما نصه: \"البدعة بكسر الباء في الشرع هي: إحداث ما لم يكن في عهد رسول الله صلّى الله عليه وءاله وسلم، وهي منقسمة إلى حسنة وقبيحة. قال الإمام الشيخ المجمع على إمامته وجلالته وتمكنه في أنواع العلوم وبراعته أبو محمد عبد العزيز ابن عبد السلام رحمه الله ورضي عنه في ءاخر كتاب القواعد: البدعة منقسمة إلى: واجبة ومحرمة ومندوبة ومكروهة ومباحة. قال: والطريق في ذلك أن تعرض البدعة على قواعد الشريعة، فإن دخلت في قواعد الإيجاب فهي واجبة أو في قواعد التحريم فمحرمة أو الندب فمندوبة أو المكروه فمكروهة أو المباح فمباحة\" ا.هـ. كلام النووي.","وقال ابن عابدين في رد المحتار([18]) ما نصه: \"فقد تكون البدعة واجبة، كنصب الأدلة للرد على أهل الفرق الضالة، وتعلم النحو المفهم للكتاب والسنة، ومندوبة كإحداث نحو رباط ومدرسة، وكل إحسان لم يكن في الصدر الأول، ومكروهة كزخرفة المساجد، ومباحة كالتوسع بلذيذ المآكل والمشارب والثياب\" ا.هـ.","وقال النووي في روضة الطالبين([19]) في دعاء القنوت ما نصه: \"هذا هو المروي عن النبي صلى الله عليه وسلم وزاد العلماء فيه: \"ولا يَعِزُّ من عاديت\" قبل: \"تباركت وتعاليت\" وبعده: \"فلك الحمد على ما قضيت أستغفرك وأتوب إليك\". قلت: قال أصحابنا: \"لا بأس بهذه الزيادة\". وقال أبو حامد والبَنْدَنِيجيُّ وءاخرون: مستحبة\" ا.هـ. كلام النووي.","وروى الحافظ البيهقي([20]) بإسناده في مناقب الشافعي عن الشافعي رضي الله عنه قال: \"المحدَثات من الأمور ضربان: أحدهما ما أحدث مما يخالف كتابًا أو سنةً أو أثرًا أو إجماعًا، فهذه البدعة الضلالة، والثانية: ما أحدث من الخير لا خلاف فيه لواحد من هذا، وهذه محدثة غير مذمومة\" اهـ.","من البدع المستحبة","* الرهبانية التي ابتدعها أتباع المسيح عليه السلام:","قال الله تبارك وتعالى في كتابه العزيز: }وجعلنا في قلوب الذين اتبعوه رأفةً ورحمةً ورهبانيةً ابتدعوها ما كتبناها عليهم إلا ابتغاء رضوان الله{ [سورة الحديد] فهذه الآية يستدل بها على البدعة الحسنة، لأن معناها مدح الذين كانوا من أمة عيسى المسلمين المؤمنين المتبعين له عليه السلام بالإيمان والتوحيد، فالله تعالى مدحهم لأنهم كانوا أهل رأفة ورحمة ولأنهم ابتدعوا رهبانية، والرهبانية هي الانقطاع عن الشهوات حتى إنهم انقطعوا عن الزواج رغبة في تجردهم للعبادة. فمعنى قوله تعالى: }ما كتبناها عليهم{ أي نحن ما فرضناها عليهم إنما هم أرادوا التقرب إلى الله، فالله تعالى مدحهم على ما ابتدعوا مما لم ينصَّ لهم عليه في الإنجيل ولا قال لهم المسيح بنص منه، إنما هم أرادوا المبالغة في طاعة الله تعالى والتجرد بترك الانشغال بالزواج ونفقة الزوجة والأهل، فكانوا يبنون الصوامع أي بيوتًا خفيفة من طين أو من غير ذلك على المواضع المنعزلة عن البلد ليتجردوا للعبادة.","* سن خبيب ركعتين عند القتل:","ومنها: إحداث خبيب بن عدي ركعتين عندما قُدِّم للقتل، كما روى ذلك البخاري في صحيحه([21]) قال ما نصه: \"حدثني إبراهيم بن موسى أخبرنا هشام بن يوسف عن معمر عن الزهري عن عمرو بن أبي سفيان الثقفي عن أبي هريرة رضي الله عنه قال: بعث النبي صلى الله عليه وسلم سرية عينًا وأمَّر عليهم عاصم بن ثابت وهو جد عاصم بن عمر بن الخطاب فانطلقوا حتى إذا كانوا بين عُسفان ومكة ذُكروا لحيّ من هُذيل يقال لهم بنو لحيان فتبعوهم بقريب من مائة رام فاقتصوا ءاثارهم حتى أتوا منزلا نزلوه فوجدوا فيه نوى تمر تزوّدوه من المدينة فقالوا هذا تمر يثرب، فتبعوا ءاثارهم حتى لحقوهم، فلما انتهى عاصم وأصحابه لجئوا إلى فَدْفَد([22])، وجاء القوم فأحاطوا بهم فقالوا: لكم العهد والميثاق إن نزلتم إلينا أن لا نقتل منكم رجلاً. فقال عاصم: أما أنا فلا أنزل في ذمة كافر اللّهم أخبر عنّا نبيك، فقاتلوهم حتى قتلوا عاصمًا في سبعة نفر بالنبل وبقي خبيب وزيد ورجل ءاخر فأعطوهم العهد والميثاق، فلما أعطوهم العهد والميثاق نزلوا إليهم، فلما استمكنوا منهم حلّوا أوتار قسيّهم فربطوهم بها، فقال الرجل الثالث الذي معهما هذا أول الغدر فأبى أن يصحبهم فجرروه وعالجوه على أن يصحبهم فلم يفعل، فقتلوه وانطلقوا بخبيب وزيد حتى باعوهما بمكة، فاشترى خبيبًا بنو الحرث بن عامر ابن نوفل، وكان خبيب هو قتل الحرث يوم بدر، فمكث عندهم أسيرًا حتى إذا أجمعوا قتله استعار موسى من بعض بنات الحرث ليستحد بها فأعارته،قالت: فغفلت عن صبي لي فدرج إليه حتى أتاه فوضعه على فخذه فلما رأيته فزعت فزعة عرف ذاك مني وفي يده الموسى فقال: أتخشين أن أقتله؟ ما كنت لأفعل ذاك إن شاء الله، وكانت تقول: ما رأيت أسيرًا قط خيرًا من خبيب، لقد رأيته يأكل من قطف عنب وما بمكة يومئذ ثمرة وإنه لموثق في الحديد، وما كان إلا رزقًا رزقه الله، فخرجوا به من الحرم ليقتلوه، فقال: دعوني أصلي ركعتين، ثم انصرف إليهم فقال: لولا أن تروا أن ما بي جزع من الموت لزدت، فكان أول من سن الركعتين عند القتل هو، ثم قال:اللَّهم احصهم عددًا ثم قال:","فلستُ أُبَالِي حينَ أُقْتَلُ مسلمًا","على أي شقّ كَانَ لله مصرعي","وذلك في ذاتِ الإله وإن يشأْ","يُبارك على أوصالِ شِلوٍ ممزّعِ","ثم قام إليه عقبة بن الحرث فقتله وبعثت قريش إلى عاصم ليؤتوا بشىء من جسده يعرفونه، وكان عاصم قتل عظيمًا من عظمائهم يوم بدر، فبعث الله عليه مثل الظلَّة من الدَّبر فحمته من رسلهم، فلم يقدروا منه على شىء\" ا.هـ.","* نقط يحيى بن يعمر المصاحف:","ومنها: نقط المصاحف وقد كان الصحابة الذين كتبوا الوحي الذي أملاه عليهم الرسول يكتبون الباء والتاء ونحوهما بلا نقط، وكذا عثمان بن عفان لما كتب ستة مصاحف وأرسل ببعضها إلى الآفاق إلى البصرة ومكة وغيرهما واستبقى عنده نسخة كان غير منقوط. وإنما أول من نقط المصاحف رجل من التابعين من أهل العلم والفضل والتقوى يقال له يحيى بن يعمر. روى ابن أبي داود السجستاني([23]) في كتابه المصاحف قال: \"حدثنا عبد الله، حدثنا محمد بن عبد الله المخزوميُّ، حدثنا أحمد بن نصر بن مالك، حدثنا الحسين بن الوليد، عن هارون بن موسى قال: \"أول من نقط المصاحف يحيى بن يعمر\" ا.هـ. وكان قبل ذلك يكتب بلا نقط. فلما فعل هذا لم ينكر العلماء عليه ذلك، مع أن الرسول ما أمر بنقط المصحف.","* زيادة عثمان رضي الله عنه أذانًا ثانيًا يوم الجمعة:","وهذه بدعة أحدثها عثمان رضي الله عنه ففي صحيح البخاري([24]) ما نصه: \"حدثنا ءادم قال: حدثنا ابن أبي ذئب عن الزهري عن السائب بن يزيد قال:\"كان النداء يوم الجمعة أوله إذا جلس الإمام على المنبر على عهد النبي صلى الله عليه وسلم وأبي بكر وعمر رضي الله عنهما، فلما كان عثمان رضي الله عنه وكثر الناس زاد النداءَ الثالث على الزَّوراء\"([25]).","قال الحافظ في الفتح ما نصه([26]): \"وله في رواية وكيع عن ابن أبي ذئب: كان الأذان على عهد رسول الله صلى الله عليه وسلم وأبي بكر وعمر أذانين يوم الجمعة، قال ابن خزيمة: قوله: \"أذانين\" يريد الأذان والإقامة، يعني تغليبًا، أو لاشتراكهما في الإعلام كما تقدم في أبواب الأذان\" ا.هـ.","ثم يقول: \"قوله \"زاد النداء الثالث\" في رواية وكيع عن ابن أبي ذئب فأمر عثمانُ بالأذان الأول، ونحوه للشافعي من هذا الوجه، ولا منافاة بينهما لأنه باعتبار كونه مزيدًا يسمى ثالثًا وباعتبار كونه جُعل مقدمًا على الأذان والإقامة يسمى أولاً، ولفظ رواية عقيل الآتية بعد بابين: \"أن التأذين بالثاني أمر به عثمان\". وتسميته ثانيًا أيضًا متوجه بالنظر إلى الأذان الحقيقي لا الإقامة.ا.هـ.","* الاحتفال بمولد النبي صلى الله عليه وسلم","وسيأتي الكلام عليه إن شاء الله تعالى في فصل خاص.","* الجهر بالصلاة على النبي بعد الأذان:","ومنها: الجهر بالصلاة على النبي صلى الله عليه وسلم بعد الأذان، وحدث هذا بعد سنة سبعمائة، وكانوا قبل ذلك لا يجهرون بها.","* كتابة (صلى الله عليه وسلم) عند كتابة اسم النبي:","ومنها: كتابة صلى الله عليه وسلم عند كتابة اسمه، ولم يكتب النبي ذلك في رسائله التي أرسل بها إلى الملوك والرؤساء وإنما كان يكتب من محمد رسول الله إلى فلان.","* الطرق التي أحدثها بعض الصالحين:","ومنها: الطرق التي أحدثها بعض أهل الله كالرفاعية والقادرية وغيرهما وهي نحو أربعين طريقة، فهذه الطرق أصلها بدع حسنة، ولكن شذ بعض المنتسبين إليها وهذا لا يقدح في أصلها.","بدعة الضلالة","وهي على نوعين: بدعة تتعلق بأصول الدين، وبدعة تتعلق بفروعه.","فأما البدعة التي تتعلق بأصول الدين: فهي التي حدثت في العقائد وهي مخالفة لما كان عليه الصحابة في المعتقد، وأمثلتها كثيرة منها:","* بدعة إنكار القدر: وأول من أظهرها معبد الجهني([27]) بالبصرة، كما في صحيح مسلم([28]) عن يحيى بن يعمر ويسمى هؤلاء القدرية([29])، فيزعمون أن الله لم يقدّر أفعال العباد الاختيارية ولم يخلقها وإنما هي بخلق العباد بزعمهم، ومنهم من يزعم أن الله قدَّر الخير ولم يقدّر الشرَّ، ويزعمون أن المرتكب للكبيرة ليس بمؤمن ولا كافر بل هو في منزلة بين المنزلتين، وينكرون الشفاعة في العصاة، ورؤية الله تعالى في الجنَّة.","* بدعة الجهمية: ويسمون الجبرية أتباع جهم بن صفوان([30]) يقولون: إن العبد مجبور في أفعاله لا اختيار له وإنما هو كالريشة المعلقة في الهواء يأخذها الهواء يمنة ويسرة.","* بدعة الخوارج([31]): الذين خرجوا على سيدنا علي رضي الله عنه، ويكفّرون مرتكب الكبيرة.","* بدعة القول بحوادث لا أول لها، وهي مخالفة لصريح العقل والنقل.","وأما البدعة التي تتعلق بالفروع فهي المنقسمة التقسيم المذكور ءانفًا.","ومن البدع السيئة العملية:","* كتابة (ص) عند كتابة اسم النبي صلى الله عليه وسلم، وأسوأ منه وأقبح (صلعم).","* ومنها تيمم بعض الناس على السجاد والوسائد التي ليس عليها غبار التراب.","* ومنها تحريف اسم الله كما يحصل من كثير من المنتسبين إلى الطرق، فإن بعضهم يبدءون بـ \"الله\" ثم إما أن يحذفوا الألف التي بين اللام والهاء فينطقون بها بلا مدّ، وإما أن يحذفوا الهاء نفسها فيقولون \"اللاَّ\"، ومنهم من يقول \"ءاه\" وهو لفظ موضوع للتوجع والشكاية بإجماع أهل اللغة، قال الخليل بن أحمد: لا يجوز حذف ألف المد من كلمة الله.","فإن قيل: أليس قال رسول الله صلى الله عليه وسلم فيما رواه أبو داود عن العرباض بن سارية([32]): \"وإياكم ومحدثات الأمور فإن كل محدثة بدعة وكل بدعة ضلالة\".","فالجواب: أن هذا الحديث لفظه عام ومعناه مخصوص بدليل الأحاديث السابق ذكرها فيقال: إن مراد النبي صلى الله عليه وسلم ما أحدث على خلاف الكتاب أو السنة أو الإجماع أو الأثر.","قال النووي في شرح صحيح مسلم([33]) ما نصه: \"قوله صلى الله عليه وسلم: \"وكل بدعة ضلالة\" هذا عام مخصوص والمراد به غالب البدع\".ا.هـ. ثم قسم البدعة إلى خمسة أقسام: واجبة ومندوبة ومحرمة ومكروهة ومباحة. وقال: \"فإذا عُرِف ما ذكرته عُلم أن الحديث من العام المخصوص، وكذا ما أشبهه من الأحاديث الواردة، ويؤيد ما قلناه قول عمر بن الخطاب رضي الله عنه في التراويح: \"نعمت البدعة\"، ولا يمنع من كون الحديث عاما مخصوصًا قوله: \"كل بدعة\" مؤكدًا بكل، بل يدخله التخصيص مع ذلك كقوله تعالى: }تدمر كل شىء{ [سورة الأحقاف]\" ا.هـ.","وهذا التقسيم ذكره الشيخ عبد العزيز بن عبد السلام في ءاخر كتاب القواعد مع شىء من التفصيل، ونقله عنه الحافظ في الفتح وسلّمه."],"icon":"fa-scale-balanced","description":"اعلم أن البدعة لغة ما أحدث على غير مثال سابق يقال: جئت بأمر بديع أي محدث عجيب لم يعرف قبل ذلك. وفي الشرع المحدَثُ الذي لم ينص عليه القرءان ولا جاء في …"},{"id":"s3","title":"فصل في الاحتفال بالمولد الشريف، وذكر أدلة جوازه","content":["من البدع الحسنة الاحتفال بمولد رسول الله صلى الله عليه وسلم، فهذا العمل لم يكن في عهد النبي صلى الله عليه وسلم ولا فيما يليه، إنما أحدث في أوائل القرن السابع للهجرة، وأول من أحدثه ملك إربل وكان عالمًا تقيًّا شجاعًا يقال له المظفر. جمع لهذا كثيرًا من العلماء فيهم من أهل الحديث والصوفيةالصادقين. فاستحسن ذلك العمل العلماء في مشارق الأرض ومغاربها، منهم الحافظ أحمد بن حجر العسقلاني، وتلميذه الحافظ السخاوي، وكذلك الحافظ السيوطي وغيرهم.","وذكر الحافظ السخاوي في فتاويه أن عمل المولد حدث بعد القرون الثلاثة، ثم لا زال أهل الإسلام من سائر الأقطار في المدن الكبار يعملون المولد ويتصدقون في لياليه بأنواع الصدقات، ويعتنون بقراءة مولده الكريم، ويظهر عليهم من بركاته كل فضل عميم.","وللحافظ السيوطي([34]) رسالة سماها \"حسن المقصد في عمل المولد\"، قال: \"فقد وقع السؤال عن عمل المولد النبوي في شهر ربيع الأول ما حكمه من حيث الشرع؟ وهل هو محمود أو مذموم؟ وهل يثاب فاعله أو لا؟ والجواب عندي: أن أصل عمل المولد الذي هو اجتماع الناس، وقراءة ما تيسر من القرءان، ورواية الأخبار الواردة في مبدإ أمر النبي صلى الله عليه وسلم وما وقع في مولده من الآيات ثم يمد لهم سماط يأكلونه وينصرفون من غير زيادة على ذلك هو من البدع الحسنة التي يثاب عليها صاحبها لما فيه من تعظيم قدر النبي صلى الله عليه وسلم وإظهار الفرح والاستبشار بمولده الشريف. وأول من أحدث فعل ذلك صاحب إربل الملك المظفر أبو سعيد كوكبري بن زين الدّين علي بن بكتكين أحد الملوك الأمجاد والكبراء الأجواد، وكان له ءاثار حسنة، وهو الذي عمَّر الجامع المظفري بسفح قاسيون\".ا.هـ.","قال ابن كثير([35]) في تاريخه: \"كان يعمل المولد الشريف - يعني الملك المظفر - في ربيع الأول ويحتفل به احتفالاً هائلاً، وكان شهمًا شجاعًا بطلاً عاقلاً عالمًا عادلاً رحمه الله وأكرم مثواه. قال: وقد صنف له الشيخ أبو الخطاب ابن دحية مجلدًا في المولد النبوي سماه \"التنوير في مولد البشير النذير\" فأجازه على ذلك بألف دينار، وقد طالت مدته في المُلك إلى أن مات وهو محاصر للفرنج بمدينة عكا سنة ثلاثين وستمائة محمود السيرة والسريرة\".ا.هـ.","ويذكر سبط ابن الجوزي في مرءاة الزمان أنه كان يحضر عنده في المولد أعيان العلماء والصوفية([36]).","وقال ابن خلكان([37]) في ترجمة الحافظ ابن دحية: \"كان من أعيان العلماء ومشاهير الفضلاء، قدم من المغرب فدخل الشام والعراق، واجتاز بإربل سنة أربع وستمائة فوجد ملكها المعظم مظفر الدين بن زين الدين يعتني بالمولد النبوي، فعمل له كتاب \"التنوير في مولد البشير النذير\"، وقرأه عليه بنفسه فأجازه بألف دينار\".ا.هـ.","قال الحافظ السيوطي: \"وقد استخرج له - أي المولد - إمام الحفاظ أبو الفضل أحمد بن حجر أصلاً من السنة، واستخرجت له أنا أصلاً ثانيًا...\"ا.هـ.","فتبين من هذا أن الاحتفال بالمولد النبوي بدعة حسنة فلا وجه لإنكاره، بل هو جدير بأن يسمى سنة حسنة لأنه من جملة ما شمله قول رسول الله صلى الله عليه وسلم: \"من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها بعده من غير أن ينقص من أجورهم شىء\" وإن كان الحديث واردًا في سبب معين وهو أن جماعة أدقع بهم الفقر جاءوا إلى رسول الله وهم يلبسون النِّمار مجتبيها أي خارقي وسطها، فأمر الرسول بالصدقة فاجتمع لهم شىء كثير فسرّ رسول الله لذلك فقال: \"من سنَّ في الإسلام ...\" الحديث.","وذلك لأن العبرة بعموم اللَّفظ لا بخصوص السبب كما هو مقرر عند الأصوليين، ومن أنكر ذلك فهو مكابر."],"icon":"fa-star-and-crescent","description":"من البدع الحسنة الاحتفال بمولد رسول الله صلى الله عليه وسلم، فهذا العمل لم يكن في عهد النبي صلى الله عليه وسلم ولا فيما يليه، إنما أحدث في أوائل القرن…"},{"id":"s4","title":"فصل في ذكر ما شرّف الله به نبيه صلى الله عليه وسلم من الآيات","content":["شرَّف الله عز وجل نبيه المصطفى بآيات كثيرة فمنها ما يدل على مكارم أخلاقه وشرف حاله وهو قوله تعالى: }وإنك لعلى خُلُقٍ عظيم{ [سورة القلم].","ومنها ما أبان سبحانه وتعالى به علوَّ شرف نسبه وعظيم قدره بقوله عز وجل: }لقد جاءكم رسولٌ من أنفسكم عزيزٌ عليه ما عنتم حريصٌ عليكم بالمؤمنين رءوفٌ رحيم{ [سورة التوبة].","ومنها ما كشف عن ثنائه تعالى عليه في كتبه المنزلة على أنبيائه وهو قوله عز وجل: }محمدٌ رسولُ الله والذين معه أشداء على الكفار رحماء بينهم تراهم ركعًا سجَّدًا يبتغون فضلا من الله ورضوانًا سيماهم في وجوههم من أثر السُّجود ذلك مثلهم في التوراة ومثلهم في الإنجيل كزرع أخرج شطئه فأزره فاستغلظ فاستوى على سوقه يعجب الزُّرَّاع ليغيظ بهم الكفار{ [سورة الفتح].","ومنها ما أوضح سبحانه أنه مقدَّم على النبيين وذلك في قوله عز وجل: }وإذ أخذ الله ميثاق النبيين لما ءاتيتكم من كتاب وحكمة ثم جاءكم رسول مصدق لما معكم لتؤمنن به ولتنصرنه قال ءأقررتم وأخذتم على ذلكم إصري قالوا أقررنا قال فاشهدوا وأنا معكم من الشاهدين{ [سورة ءال عمران].","ومنها ما يدل على وجوب احترامه وتوقيره وإجلاله كقوله تعالى: }إنَّ الذين ينادونك من وراء الحجرات أكثرهم لا يعقلون ولو أنهم صبروا حتى تخرج إليهم لكان خيرًا لهم والله غفور رحيم{ [سورة الحجرات]، وقولِه تعالى: }يا أيها الذين ءامنوا استجيبوا لله وللرسول إذا دعاكم لما يحييكم{ [سورة الأنفال]. وقوله تعالى }لا تجعلوا دعاء الرسول بينكم كدعاء بعضكم بعضًا{ [سورة النور].","ومنها ما يدل على دوام تعظيمه بعد وفاته صلى الله عليه وسلم وهو أنه تعالى جعل أزواجه الكريمات أمهاتِ المؤمنين قال تعالى: }النبيُّ أولى بالمؤمنين من أنفسهم وأزواجه أمهاتهم{ (سورة الأحزاب)، وقال تعالى: }ولا أن تنكحوا أزواجه من بعده أبدًا{ [سورة الأحزاب].","ومنها أنه تعالى أقسم بحياته فقال عز وجل: }لعمرك إنهم لفي سكرتهم يعمهون{ [سورة الحجر]."],"icon":"fa-link","description":"شرَّف الله عز وجل نبيه المصطفى بآيات كثيرة فمنها ما يدل على مكارم أخلاقه وشرف حاله وهو قوله تعالى: }وإنك لعلى خُلُقٍ عظيم{ [سورة القلم]."},{"id":"s5","title":"فصل في ذكر نسبه الشريف صلى الله عليه وسلم","content":["هو محمد بن عبد الله بن عبد المطلب بن هاشم بن عبد مَنَاف بن قُصَيّ بن كِلاب بن مُرّة بن كعب بن لُؤي بن غالب بن فِهر بن مالك بن النّضر بن كِنانة بن خُزيمة بن مُدرِكة بن إلياس بن مُضر بن نزار بن معدّ بن عدنان، أبو القاسم سيد ولد ءادم صلى الله عليه وسلم كلما ذكره الذاكرون وغفل عن ذكره الغافلون.","وجده الأعلى عدنان من سلالة إسماعيل نبي الله وهو الذبيح على الصحيح، ابن نبي الله إبراهيم خليل الرحمن صلى الله على سيدنا محمد وعلى جميع إخوانه الأنبياء والمرسلين.","فهو صلى الله عليه وسلم صاحب هذا النسب الشريف نخبة بني هاشم وعظيمُها، روى الإمام مسلم([38]) وغيره عن واثلة بن الأسقع قال: قال رسول الله صلى الله عليه وسلم: \"إن الله اصطفى كنانة من ولد إسمبعيل، واصطفى قريشًا من كنانة، واصطفى من قريش بني هاشم، واصطفاني من بني هاشم\".","وروى الترمذي([39]) بإسناده عنه قال: قال رسول الله صلى الله عليه وسلم: \"إن الله اصطفى من ولد إبراهيم إسمبعيل، واصطفى من ولد إسمبعيل كنانة، واصطفى من كنانة قريشًا، واصطفى من قريش بني هاشم، واصطفاني من بني هاشم\" قال أبو عيسى: هذا حديث حسن صحيح.","فهو صلى الله عليه وسلم خيار من خيار كما دلت عليه النقول والآثار."],"icon":"fa-heart","description":"هو محمد بن عبد الله بن عبد المطلب بن هاشم بن عبد مَنَاف بن قُصَيّ بن كِلاب بن مُرّة بن كعب بن لُؤي بن غالب بن فِهر بن مالك بن النّضر بن كِنانة بن خُزي…"},{"id":"s6","title":"فصل في حمل ءامنة برسول الله صلى الله عليه وسلم","content":["تزوج أبوه عبد الله من سيدة نساء بني زُهرة وهي ءامنة بنت وهب بن عبد مناف بن زهرة بن كلاب، فحملت بسيد الخلائق والأمم، وتفضل الله بإبرازه صلى الله عليه وسلم إلى الوجود نعمة على سائر العرب والعجم، وكان حملُه الشريف أولَ تباشير الأنوار لأهل البادية والحضر.","روى ابن سعد([40]) عن عمة يزيد بن عبد الله بن وهب بن زَمْعَة أنها قالت: \"كنا نسمع أن رسول الله صلى الله عليه وسلم لما حملت به ءامنة بنت وهب كانت تقول: ما شعرت أني حملت به، ولا وجدت له ثقلة كما تجد النساء، إلا أني قد أنكرت رفع حيضتي وربما كانت ترفعني وتعود، وأتاني ءات وأنا بين النائم واليقظان فقال: هل شعرتِ أنك حملت؟ فكأني أقول: ما أدري، فقال: إنك قد حملت بسيد هذه الأمة ونبيها، وذلك يوم الإثنين، قالت: فكان ذلك مما يقَّن عندي الحمل، ثم أمهلني حتى إذا دنا ولادتي أتاني ذلك الآتي فقال: قولي أعيذه بالواحد الصمد من شر كل حاسد، قالت: فكنت أقول ذلك\"."],"icon":"fa-sun","description":"تزوج أبوه عبد الله من سيدة نساء بني زُهرة وهي ءامنة بنت وهب بن عبد مناف بن زهرة بن كلاب، فحملت بسيد الخلائق والأمم، وتفضل الله بإبرازه صلى الله عليه و…"},{"id":"s7","title":"فصل في ذكر مولده الشريف","content":["روى أحمد والبيهقي وغيرهما([41]) عن العرباض بن سارية صاحب رسول الله صلى الله عليه وسلم أنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: \"إني عبد الله وخاتم النبيين، وإن ءادم لمنجدلٌ في طينته، وسأخبركم عن ذلك: دعوةُ أبي إبراهيم، وبشارة عيسى بي، ورؤيا أمي التي رأت، وكذلك أمهات النبيين يَرَيْنَ\"، وأن أم رسول الله صلى الله عليه وسلم رأت حين وضعته نورًا أضاءت له قصور الشام.","قال الحافظ البيهقي عقبه: قوله صلى الله عليه وسلم \"إني عبد الله وخاتم النبيين، وإن ءادم لمنجدل في طينته\" يريد به أنه كان كذلك في قضاء الله وتقديره قبل أن يكون أبو البشر وأول الأنبياء صلوات الله عليهم.ا.هـ.","وروى أحمد والبيهقي([42]) والطيالسي بإسنادهم عن أبي أمامة قال: قيل: يا رسول الله ما كان بدء أمرك؟ قال: \"دعوة أبي إبراهيم، وبشرى عيسى ابن مريم، ورأت أمي أنه خرج منها نور أضاءت منه قصور الشام\".","وروى ابن سعد([43]) أن النبي صلى الله عليه وسلم قال: \"رأت أمي حين وضعتني سَطَعَ منها نورٌ أضاءت له قصور بُصرى\"([44]).","ويروى أنه صلى الله عليه وسلم حين وضعته ءامنة وقع جاثيًا على ركبتيه، رافعًا رأسه إلى السماء، وخرج معه نورٌ أضاءت له قصور الشام، حتى رأت أمه أعناق الإبل ببُصرى.","أما قوله عليه الصلاة والسلام: \"دعوة أبي ابراهيم\" فهو أن إبراهيم عليه السلام لما بنى البيت دعا ربه فقال: }رب اجعل هذا بلدًا ءامنًا وارزق أهله من الثمرات من ءامن منهم بالله واليوم الآخر{ [سورة البقرة]،ثم قال: }ربنا وابعث فيهم رسولا منهم يتلوا عليهم ءاياتك ويعلمهم الكتاب والحكمة ويزكيهم إنك أنت العزيز الحكيم{ [سورة البقرة] فاستجاب الله تعالى دعاءه في نبينا صلى الله عليه وسلم وجعله الذي سأله إبراهيم عليه السلام.","وأما قوله عليه الصلاة والسلام: \"وبشرى عيسى ابن مريم\" فهو أن سيدنا عيسى عليه السلام بشّر قومه بسيدنا محمد صلى الله عليه وسلم كما أخبر القرءان الكريم حكاية عن عيسى عليه السلام }وإذ قال عيسى ابن مريم يا بني إسرائيل إني رسول الله إليكم مصدقًا لما بين يديَّ من التوراة ومبشرًا برسول يأتي من بعدي اسمه أحمد{ [سورة الصف].","والمقصود أن ليلة مولد الرسول صلى الله عليه وسلم ليلة شريفة عظيمة مباركة، ظاهرة الأنوار، جليلة المقدار، أبرز الله تعالى فيها سيدنا محمدًا إلى الوجود، فولدته ءامنة في هذه الليلة الشريفة من نكاح لا من سفاح، فظهر له من الفضل والخير والبركة ما بهر العقول والأبصار، كما شهدت بذلك الأحاديث والأخبار."],"icon":"fa-sparkles","description":"روى أحمد والبيهقي وغيرهما([41]) عن العرباض بن سارية صاحب رسول الله صلى الله عليه وسلم أنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: \"إني عبد الله و…"},{"id":"s8","title":"فصل فيما ظهر من الآيات لمولده صلى الله عليه وسلم","content":["ظهرت لمولد النبي صلى الله عليه وسلم ءايات كثيرة، منها ما رواه البيهقي وابن عساكر وغيرهما([45]) بإسنادهم إلى هانىء المخزومي قال: \"لما كانت الليلة التي ولد فيها رسول الله صلى الله عليه وسلم ارتجس إيوان كسرى، وسقط منه أربع عشرة شرفة،وخمدت نار الفرس، ولم تَخمُد قبل ذلك بألف عام، وغاضت بحيرة سَاوة([46])...\".","وفي سقوط أربع عشرة شرفة إشارة إلى أنه لم يبق من ملوك الفرس إلا أربعة عشرة ملكًا وكان ءاخرهم في خلافة عثمان رضي الله عنه.","وأما نار فارس التي كانوا يعبدونها من دون الله والتي كانت توقد وتضرم ليلاً ونهارًا فانطفأت.","وأما بحيرة ساوة التي كانت تسير فيها السفن فقد جف ماؤها.","ومن الآيات التي ظهرت لمولده صلى الله عليه وسلم أن الشياطين رميت وقذفت بالشهب من السماء، وحُجب عنها خبر السماء كما ذكر بعض العلماء، لكن المشهور والمحفوظ أن قَذف الشياطين بالشهب عند مبعثه صلى الله عليه وسلم.","ومنها أن إبليس حُجب عن خبر السماء فصاح ورنَّ رَنَّةً عظيمةً كما رنَّ حين لُعن، وحين أخرج من الجنة، وحين وُلد النبي صلى الله عليه وسلم، وحين نزلت الفاتحة.","ذكر ذلك الحافظ العراقي في المورد الهني عن بقي بن مَخْلَد.","ومنها ما سُمع من أجواف الأصنام ومن أصوات الهواتف بالبشارة بظهور الحق في وقت الزوال."],"icon":"fa-location-dot","description":"ظهرت لمولد النبي صلى الله عليه وسلم ءايات كثيرة، منها ما رواه البيهقي وابن عساكر وغيرهما([45]) بإسنادهم إلى هانىء المخزومي قال: \"لما كانت الليلة التي …"},{"id":"s9","title":"فصل في بيان زمان مولده صلى الله عليه وسلم ومكانه","content":["اختلف في عام ولادته صلى الله عليه وسلم والأكثر أنه عام الفيل، قال ابن عبد البر: \"ولد بعد قدوم الفيل بشهر، وقيل بأربعين يومًا، وقيل بخمسين يومًا\".","وروى البيهقي([47]) عن ابن عباس رضي الله عنهما أنه قال: ولد النبي صلى الله عليه وسلم عام الفيل.","أما يوم مولده فهو شهر ربيع الأول، وأما يوم مولده من الشهر فالمعتمد أنه كان لثنتي عشرة ليلة خلت من الشهر المذكور.","أما يوم مولده فهو يوم الإثنين بلا خلاف، فقد روى مسلم([48]) عن أبي قتادة الأنصاري رضي الله عنه أنه قال: سُئل رسول الله صلى الله عليه وسلم عن صوم يوم الإثنين فقال: \"ذاك يوم ولدت فيه، وأُنزل عليّ فيه\".","وأما مكان مولده فالصحيح المحفوظ أنه كان بمكة المشرفة، والأكثر أنه كان في المحل المشهور بسوق الليل وقد جعلته أم هارون الرشيد مسجدًا ذكر ذلك الحافظ العراقي وغيره، وقال الأزرقي: \"إنه ذلك البيت لا اختلاف فيه عند أهل مكة\" ا.هـ. ويُعْرف المكان اليوم بمحلة المولد."],"icon":"fa-signature","description":"اختلف في عام ولادته صلى الله عليه وسلم والأكثر أنه عام الفيل، قال ابن عبد البر: \"ولد بعد قدوم الفيل بشهر، وقيل بأربعين يومًا، وقيل بخمسين يومًا\"."},{"id":"s10","title":"فصل في أسماء الرسول صلى الله عليه وسلم وكنيته","content":["قال الله تعالى: }محمد رسول الله{ [سورة الفتح]، وقال حكاية عن قول عيسى: }ومبشرًا برسول يأتي من بعدي اسمه احمد{ [سورة الصف].","وروى البخاري ومسلم والترمذي وغيرهم([49]) عن جبير ابن مُطْعِم أنه قال: سمعت رسول الله صلى الله عليه وسلم يقول : \"إن لي أسماء: أنا محمدٌ، وأنا أحمدُ، وأنا الماحي الذي يمحو الله بي الكفر، وأنا الحاشرُ الذي يحشر الناس على قدمي، وأنا العاقبُ الذي ليس بعده أحد\".","وروى مسلم([50]) عن أبي موسى الأشعري رضي الله عنه أنه قال: كان رسول الله صلى الله عليه وسلم يُسمي لنا نفسه أسماء فقال: \"أنا محمدٌ، وأحمدُ، والمُقَفّي، والحاشر، ونبي التوبة، ونبي الرحمة\".","وروى الإمام أحمد([51]) عن جبير بن مطعم قال: سمعت النبي صلى الله عليه وسلم يقول: \"أنا محمد، وأنا أحمد، والحاشر، والماحي، والخاتِم، والعاقب\".","وروى البيهقي([52]) عن أبي هريرة رضيّ الله عنه أنه قال: قال رسول الله صلى الله عليه وسلم: \"إنما أنا رحمةٌ مُهداةٌ\"، وفي رواية: \"يا أيها الناس إنما أنا رحمة مهداة\".","وروى البيهقي والطيالسي([53]) عن جبير بن مطعم قال: سمعت رسول الله صلى الله عليه وسلم يقول: \"أنا محمد، وأحمد، والحاشر، ونبي التوبة، ونبي الملحمة\".","أما كنيته عليه الصلاة والسلام فقد روى البخاري ومسلم وغيرهما([54]) عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: \"تسمَّوا باسمي ولا تكتنوا بكنيتي\".","وروى البيهقي([55]) عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: \"لا تجمعوا بين اسمي وكنيتي، أنا أبو القاسم، الله يرزق وأنا أَقْسِمُ\".","وروى الحاكم([56]) عن أنس بن مالك رضي الله عنه قال: لما وُلد إبراهيمُ ابن مارية أتى جبريل رسول الله صلى الله عليه وسلم فقال له:\"السلام عليك يا أبا إبراهيم\".وحديث الحاكم في إسناده ابن لهيعة وهو ضعيف."],"icon":"fa-child-reaching","description":"قال الله تعالى: }محمد رسول الله{ [سورة الفتح]، وقال حكاية عن قول عيسى: }ومبشرًا برسول يأتي من بعدي اسمه احمد{ [سورة الصف]."},{"id":"s11","title":"فصل في قصة رضاعه وما يتصل به من شق صدره صلى الله عليه وسلم","content":["توفي والده صلى الله عليه وسلم عبد الله وهو ابن شهرين وقيل وهو حَمْلٌ وقيل غير ذلك، ثم أرضعته حليمة فكان من قصة رضاعه من حليمة ما يلي قالت حليمة:","\"خرجت في نسوة من بني سعد بن بكر نلتمس الرُّضَعَاء بمكة على أتان([57]) لي قَمْرَاء([58]) في سنةٍ شَهْبَاء([59]) لم تبق شيئًا، ومعي زوجي ومعنا شارف([60]) لنا، والله إن تَبِضّ([61]) لنا بقطرة من لبن، ومعي صبي لي لا ننام ليلتنا من بكائه ما في ثديي ما يغنيه، فلما قدمنا مكة لم يبق منا امرأة إلا عُرض عليها رسول الله صلى الله عليه وسلم فتأباه، وإنما كنا نرجو كرامة الرضاعة من والد المولود، وكان يتيمًا، وكنا نقول يتيمًا ما عسى أن تصنع أمه به، حتى لم يبق من صواحبي امرأة إلا أخذت صبيًّا غيري، فكرهت أن أرجع ولم ءاخذ شيئًا وقد أخذ صواحبي، فقلت لزوجي: والله لأَرجِعَنَّ إلى ذلك اليتيم فلآخذنه، قالت: فأتيته فأخذته ورجعت إلى رحلي، فقال زوجي: قد أخذتيه؟ فقلت: نعم والله، وذلك أني لم أجد غيره، فقال: أصبت فعسى الله أن يجعل فيه خيرًا، فقلت: فوالله ما هو إلا أن جعلته في حِجري فأقبل عليه ثديي بما شاء الله من اللبن فشرب حتى رَوِي وشرب أخوه - تعني ابنها - حتى رَوِيَ، وقام زوجي يلي شارفنا من الليل فإذا بها حافل([62]) فحلبنا من اللبن ما شئنا وشرب حتى روي، وشربت حتى رويت، وبتنا ليلتنا تلك شباعًا رواءً وقد نام صبياننا. قالت: قال أبوه \"تعني زوجها\": والله يا حليمة ما أراك إلا قد أصبحت نَسَمَةً مباركة قد نام صبياننا.","قالت: ثم خرجنا قالت: والله لَخرجت أتاني أمام الركب إنهم ليقولون: ويحكِ كُفّي عنا، أليست هذه بأتانك التي خرجت عليها؟ فأقول: بلى والله، وهي قِدَّامُنَا حتى قدمنا منازلنا من حاضر بني سعد بن بكر فقدمنا على أجدب أرض، والذي نفس حليمة بيده إن كانوا ليُسْرِحونَ أغنامهم إذا أصبحوا، ويُسرّح راعيّ غنمي فتروح بِطانًا لُبَّنًا حُفَّلاً([63])، وتروح أغنامهم جياعًا ما بها من لبن.","قالت: فنشرب ما شئنا من اللَّبن وما في الحاضر أحد يحلب قطرة ولا يجدها فيقولون لرعائهم: ويلكم ألا تُسَرّحُون حيث يُسرح راعي حليمة؟ فيُسَرّحون في الشّعب الذي نُسرح فتروح أغنامهم جياعًا ما بها من لبن، وتروح غنمي لُبَّنا حُفَّلاً. وكان صلى الله عليه وسلم يشب في اليوم شباب الصبي في الشهر، ويشب في الشهر شباب الصبي في سنة، فبلغ سنة وهو غلام جَفر([64])، قالت: فقدمنا على أمه فقلت لها أو قال لها أبوه: رُدي علينا ابني فلنرجع به فإنا نخشى عليه وباء مكة، قالت: ونحن أضنُّ شىء به مما رأينا من بركته. قالت: فلم نَزَلْ حتى قالت: ارجعا به ، فرجعنا به فمكث عندنا شهرين. قالت: فبينا هو وأخوه يومًا خلف البيوت يرعيان بَهْمًا لنا إذ جاء أخوه يشتد فقال لي ولأبيه: أدركا أخي القرشي فقد جاءه رجلان فأضجعاه وشقا بطنه، فخرجنا نشتد فانتهينا إليه وهو قائم منتقع اللون، فاعتنقه أبوه واعتنقته ثم قلنا: أيْ بنيّ، قال: أتاني رجلان عليهما ثياب بيض فأضجعاني ثم شقا بطني، فوالله ما أدري ما صنعا. قالت: فاحتملناه ورجعنا به، يقول أبوه: يا حليمة ما أرى هذا الغلام إلا قد أصيب، فانطلقي فلنرده إلى أهله قبل أن يظهر به ما نتخوف عليه قالت: فرجعنا به، قالت أمه: فما يردُّكما به وقد كنتما حريصين عليه، قالت: فقلت: لا والله إلا أنَّا قد كفلناه وأدينا الحق الذي يجب علينا فيه ثم تخوفنا الأحداث عليه، فقلنا يكون في أهله، قالت أمه: والله ما ذاك بكما فأخبراني خبركما وخبره، قالت: فوالله ما زالت بنا حتى أخبرناها خبره، قالت: فتخوفتما عليه؟ كلا والله إن لابني هذا شأنًا ألا أخبركما عنه؟ إني حملت به فلم أحمِل حملاً قط كان أخف عليّ ولا أعظم بركة منه ثم رأيت نورًا كأنه شِهاب خرج مني حين وضعته أضاءت له أعناق الإبل ببُصرى ثم وضعته فما وقع كما تقع الصبيان، وقع واضعًا يديه بالأرض رافعًا رأسه الى السماء، دعاه والحَقا شأنكما\".ا.هـ.","قال ابن حبان([65]) بعد إيراده هذه القصة بحروفها: \"قال وهب بن جرير بن حازم، عن أبيه، عن محمد بن إسحاق، حدثنا جهم بن أبي جهم نحوه، حدثناه عبد الله بن محمد، حدثنا اسحاق بن إبراهيم، أخبرنا وهب بن جرير\".","قال الحافظ العراقي([66]) بعد عزوه القصة لابن حبان وإيراده كلامه: \"...وهكذا رواه زياد بن عبد الله البَكَّائي، عن ابن إسحاق، فصرح بالتحديث إلا أنه شك في اتصاله كما أنا به عاليًا محمد بن علي بن عبد العزيز القطرواني، أنبا محمد بن ربيعة، أنا عبد القوي بن عبد العزيز بن الحباب، أنبا عبد الله ابن رِفاعة، أنا علي بن الحسن الخلعي، أنا عبد الرحمن بن عمر النحاس، ثنا عبد الله بن جعفر بن الورد، ثنا عبد الرحيم اليرقي، ثنا عبد الملك بن هشام، ثنا زياد بن عبد الله البكائي، ثنا محمد بن إسحاق، قال: حدثني جهم بن أبي جهم مولى الحارث بن حاطب الجُمَحي، عن عبد الله بن جعفر بن أبي طالب أو عمن حدثه عنه قال: كانت حليمة بنت أبي ذؤيب السعدية أم رسول الله صلى الله عليه وسلم التي أرضعته تحدث أنها خرجت من بلدها مع زوجها وابنٍ لها صغير ترضعه... فذكر نحوه مع اختلاف ألفاظ، وزاد: \"فلم يزل يتعرف من الله الزيادة والخير حتى مضت سنتاه، وكان يشِب شبابًا لا يَشبُّه الغلمان، فلم يبلغ سنتيه حتى كان غلامًا جفرًا...","كذا قال \"سنتيه\"([67]) وهو الصواب، وقول ابن حبان في روايته\"سنة\" غلط من بعض الرواة\"، انتهى كلام الحافظ العراقي بحروفه.","وروى مسلم وغيره([68]) عن أنس بن مالك رضي الله عنه قال: \"إن رسول الله صلى الله عليه وسلم أتاه جبريل وهو يلعب مع الغلمان، فأخذه فصرعه، فشق قلبه فاستخرج القلب فاستخرج منه علقة فقال: هذا حظُّ الشيطان منك، ثم غسله في طَسْت من ذهب بماء زمزم، ثم لَأَمَهُ، ثم أعاده في مكانه، وجاء الغلمان يسعون إلى أمه - يعني ظئَره - فقالوا: إن محمدًا قد قتل، فاستقبلوه وهو منتقع اللون\".","قال أنس: وقد كنت أرى أثر ذلك المخيط في صدره.","قال الحافظ البيهقي بعد عزوة لمسلم: \"وهو يوافق ما هو المعروف عند أهل المغازي\".","وروى مسلم([69]) أيضًا عن أنس قال: قال رسول الله صلى الله عليه وسلم: \"أُتيت وأنا في أهلي، فانطُلق بي إلى زمزم، فشُرح صدري ثم غُسل بماء زمزم، ثم أُتيت بطَست من ذهب ممتلئة إيمانًا وحكمة فحُشي بها صدري - قال أنس:ورسول الله يرينا أثره - فعَرج بي الملك إلى السماء الدنيا، فاستفتح الملك...\" وذكر حديث المعراج.","قال الحافظ البيهقي([70]) عقبه: \"ويحتمل أن ذلك كان مرتين، مرةً حين كان عند مرضعته حليمة، ومرة حين كان بمكة بعدما بعث ليلة المعراج\".ا.هـ.","ويؤيد هذا الكلام ما ذكره ابن حبان([71]) قال: \"شق صدر النبي صلى الله عليه وسلم وهو صبي يلعب مع الصبيان وأُخرج منه العلقة، ولما أراد الله جل وعلا الإسراء به أمر جبريل بشق صدره ثانيًا وأخرج قلبه فغسله ثم أعاده مكانه، مرتين في موضعين وهما غير متضادين\".ا.هـ"],"icon":"fa-user","description":"توفي والده صلى الله عليه وسلم عبد الله وهو ابن شهرين وقيل وهو حَمْلٌ وقيل غير ذلك، ثم أرضعته حليمة فكان من قصة رضاعه من حليمة ما يلي قالت حليمة:"},{"id":"s12","title":"فصل في بيان نبذة من صفاته الكريمة وشمائله الشريفة،","content":["وأخلاقه الطاهرة صلى الله عليه وسلم","روى البخارى ومسلم وغيرهما([72]) عن البراء بن عازب رضي الله عنه قال:\"كان رسول الله صلى الله عليه وسلم أحسنَ الناس وجهًا، وأحسنَه خلقًا، ليس بالطويل الذاهب، ولا بالقصير\".","وروى البيهقي والطبراني([73]) عن أبي عبيدة بن محمد بن عمار بن ياسر قال: قلت للرُّبيّع بنت مُعَوِّذ: صفي لي رسول الله صلى الله عليه وسلم، قالت: \"لو رأيته لقلت: الشمس طالعة\".","وروى الترمذي وأحمد([74]) عن أبي هريرة رضي الله عنه قال: \"ما رأيت شيئًا أحسنَ من النبي صلى الله عليه وسلم، كأن الشمس تجري في وجهه، وما رأيت أحدًا أسرَع في مشيه منه كأن الأرض تُطوى له، إنا لنجهد وإنه غير مكترث\".","وروى البخاري ومسلم والنسائي وغيرهم([75]) عن أنس بن مالك رضي الله عنه قال: \"كان شعر رسول الله صلى الله عليه وسلم يضرب منكبيه\"، وفي لفظ ءاخر عنه عند البخاري ومسلم([76]): \"كان شعر رسول الله صلى الله عليه وسلم إلى أنصاف أذنيه\".","وروى مسلم([77]) عن أنس بن مالك رضي الله عنه قال: \"ما شممت شيئًا قط مسكًا ولا عنبرًا أطيب من ريح رسول الله صلى الله عليه وسلم، ولا مسست شيئًا قط حريرًا ولا ديباجًا ألين مسًّا من كف رسول الله صلى الله عليه وسلم\".","وقال البراء بن عازب رضي الله عنه:\"كان رسول الله صلى الله عليه وسلم مربوعًا، بعيد مابين المنكبين، أعظمَ الناس، وأحسن الناس، جُمَّتُهُ إلى أذنيه، عليه حُلةٌ حمراء، ما رأيت شيئًا قط أحسن منه\" أخرجه الشيخان([78]).","وروى مسلم([79]) في صحيحه عن أنس بن مالك رضي الله عنه قال: \"كان رسول الله صلى الله عليه وسلم ليس بالطويل البائن([80])، ولا بالقصير، وليس بالأبيض الأمْهَقِ([81]) ولا بالآدَم([82])ِ، ولا بالجَعْد القَطِطِ([83]) ولا بالسَّبِطِ([84])، بعثه الله على رأس أربعين سنة، فأقام بمكة عشرَ سنين، وتوفاه الله على رأس الستين سنةً، وليس في رأسه ولحيته عشرون شعرةً بيضاء\".","وروى البيهقي([85]) أن ابن عمر رضي الله عنهما كثيرًا ما ينشد في مسجد رسول الله صلى الله عليه وسلم نعتَ عمه أبي طالب إياه في لونه حيث يقول:","وأبيضَ يُستسقى الغمامُ بوجهه","ثِمَالُ([86]) اليَتَامَى عِصْمَةٌ للأرامِل","ويقول كل من سمعه: هكذا كان النبي صلى الله عليه وسلم","وأخرج البزار([87]) بإسناد حسن عن عائشة رضي الله عنها قالت: تمثلت في أبي:","وأبيضَ يُستسقى الغمامُ بوجهه","رَبيعُ اليَتَامَى عِصْمَةٌ للأرامِل","فقال أبي: ذاك رسول الله صلى الله عليه وسلم.","وأما أخلاقه صلى الله عليه وسلم فقد دلت عليها الآية الكريمة }وإنك لعلى خلق عظيم{ [سورة القلم]، وعن عائشة رضي الله عنها قالت عندما سُئلت عن خلق رسول الله صلى الله عليه وسلم:\"فإن خُلُقَ رسول الله صلى الله عليه وسلم كان القرءان\" رواه مسلم في الصحيح([88]).","وعن عبد الله بن الزبير في قوله عز وجل }خُذ العفو{ [سورة الأعراف] قال: أمرَ الله نبيه صلى الله عليه وسلم أن يأخذ العفو من أخلاق الناس. أخرجه البخاري في الصحيح([89]) وغيرُه.","وعن عائشة رضي الله عنها قالت: \"ما خُيّرَ رسول الله صلى الله عليه وسلم بين أمرين إلا أخذ أيسرهما ما لم يكن إثمًا، فإن كان إثمًا كان أبعد الناس منه، وما انتقم رسول الله صلى الله عليه وسلم لنفسه إلا أن تُنْتَهَكَ حُرمة الله تعالى\"، وزاد القطان في روايته: \"فينتقم لله بها\" أخرجه الشيخان والبيهقي وغيرهم([90]).","وعن عائشة رضي الله عنها عندما سئلت عن خلق رسول الله صلى الله عليه وسلم قالت: \"لم يكن فاحشًا ولا مفتحشًا، ولا سخَّابًا في الأسواق، ولا يَجزي بالسيئة السيئة، ولكن يعفو ويصفح أو قالت: يعفو ويغفر\"، شك أبو داود([91]).","وعن أبي سعيد الخدري رضي الله عنه قال: \"كان رسول الله صلى الله عليه وسلم أشد حياء من العذراء في خِدْرِهَا، وكان إذا كره شيئًا عرفناه في وجهه\" أخرجه الشيخان([92]).","وعن المغيرة بن شعبة قال: قام رسول الله صلى الله عليه وسلم حتى تورمت قدماه، فقيل: يا رسول الله أليس قد غفر الله لك ما تقدم من ذنبك وما تأخر؟ قال: \"أفلا أكون عبدًا شكورًا\" أخرجاه في الصحيح([93]).","وإلى جانب هذه الصفات الحميدة كان شديدًا في أمر الله، شجاعًا، فقد روى أحمد([94]) بإسناده عن علي بن أبي طالب رضي الله عنه أنه قال: \"لما كان يوم بدر اتقينا المشركين برسول الله صلى الله عليه وسلم، وكان أشد الناس بأسًا\".","أما أخبار كرمه وسخائه فعديدة منها ما رواه مسلم([95]) عن أنس رضي الله عنه أنه قال: \"ما سُئل رسول الله صلى الله عليه وسلم على الإسلام شيئًا قط إلا أعطاه، فأتاه رجل فسأله، فأمر له بغنم بين جبلين، فأتى قومه فقال: أسلموا، فإن محمدًا يعطي عطاء من لا يخاف الفاقة\".","أما أخبار زهده وتواضعه واختياره الدار الآخرة فكثيرة منها ما رواه البيهقي والترمذي وابن ماجه([96]) عن عبد الله أنه قال: اضطجع النبي صلى الله عليه وسلم على حصير فأثَّر الحصير بجلده، فجعلتُ أمسحه عنه وأقول: بأبي أنت وأمي يا رسول الله، ألا أَذِنْتَنَا فنبسط لك شيئًا يقيك منه تنام عليه، فقال: \"ما لي وللدنيا، ما أنا والدنيا، إنما أنا والدنيا كراكب استظل تحت شجرة ثم راح وتركها\".","فقد كان صلى الله عليه وسلم متصفًا بصفات حسنة من الصدق، والأمانة، والصلة، والعفاف، والكرم، والشجاعة، وطاعة الله في كل حال وأوانٍ ولحظة ونفس، مع الفصاحة الباهرة والنصح التام، والرأفة والرحمة، والشفقة والإحسان، ومواساة الفقراء والأيتام والأرامل والضعفاء، وكان أشد الناس تواضعًا، يحب المساكين ويشهد جنائزهم، ويعود مرضاهم، هذا كله مع حسن السَّمت والصورة، والنسب العظيم، قال الله تعالى: }الله أعلمُ حيث يجعل رسالته{ [سورة الأنعام]."],"icon":"fa-shield-heart","description":"وأخلاقه الطاهرة صلى الله عليه وسلم"},{"id":"s13","title":"الخاتمة في التحذير من بعض ما أُلف في المولد","content":["اعلم أن رسول الله صلى الله عليه وسلم فضله ثابت في القرءان والأحاديث الثابتة، ولا يحتاج في إثبات فضله إلى ذكر ما فيه كذب وغلو، فقد روى أحمد وابن حبان([97]) عن عمر ابن الخطاب رضي الله عنه أنه قال: قال رسول الله صلى الله عليه وسلم: \"لا تُطْروني كما أطرت النصارى عيسى، فإنما أنا عبد، فقولوا عبد الله ورسوله\".","ثم إن الكذب على رسول الله صلى الله عليه وسلم ليس بالأمر الهين بل هو من كبائر الذنوب كما روى مسلم وغيره([98]) أن رسول الله صلى الله عليه وسلم قال: \"من حدَّث عني بحديث يَرى أنه كذب فهو أحد الكاذبين\"، وروى البخاري ومسلم وغيرهما([99]) أن رسول الله صلى الله عليه وسلم قال: \"من كذب عليَّ فليتبوأ مقعده من النار\".","فتبين أن وصف الرسول بما لم يصح عنه وبما فيه كذب هو من قبيل الغلو المذموم، ولا يُحتج لذلك أنه من قبيل أحاديث الفضائل، فإن أحاديث الفضائل يُتساهل فيها برواية الضعيف عند الجمهور، أما المكذوب فلا يُقبل في الفضائل بالإجماع.","* ومن المفاسد التي انتشرت، وأقبل على قراءتها كثير من العامة بعض الكتب التي أُلفت في المولد النبوي، وحُشيت بالأحاديث المكذوبة، والأخبار المعلولة، والغلو المذموم، والكذب على الدين، والتجسيم والتشبيه، فيحرم رواية تلك الأكاذيب من غير تبيين أمرها، ويجب التحذير منها.","ومن أشهر هذه الكتب المدسوسة الكتاب المسمى \"مولد العروس\" وفيه أن الله تعالى قبض قبضة من نور وجهه فقال لها كوني محمدًا فكانت محمدًا، وفي هذه العبارة نسبة الجزئية لله تعالى، وهو منزه عن الجزئية والانحلال، فهو لا يقبل التعدد والكثرة، ولا التجزء والانقسام، والله منزه عن ذلك لا يشبه شيئًا من خلقه ولا يشبهه شىء من خلقه }ليس كمثله شىء وهو السميع البصير{ [سورة الشورى]. وحكم من يعتقد أن محمدًا أو غيره جزء من الله تعالى التكفير قطعاً قال تعالى: }وجعلوا له من عباده جزءًا{ [سورة الزخرف]. وهذا الكتاب ليس من تأليف ابن الجوزي رحمه الله، بل هو منسوب إليه زورًا وبهتانًا، وما في كتب ابن الجوزي من تنزيه الله عن مشابهة المخلوقين ونفي التجسيم عن الله تعالى مخالف لما في هذا الكتاب المفترى، بل إن ركاكة ألفاظه، وضعف تركيب عباراته ما يدل على أنه ليس من تأليف ابن الجوزي المحدث الفقيه المفسّر الذي أُعطيَ باعًا قويًّا في الوعظ والإرشاد، فكان إذا تكلم حرك القلوب حتى إنه أسلم على يده مائة ألف أو يزيد وذلك بسبب قوة وعظه،وحسن تعبيره، وفصاحة منطِقه، فإنه كان رحمه الله على جانب كبير من الفصاحة وإتقان اللغة العربية. ولم ينسب إليه هذا الكتاب إلا المستشرق بروكلمان.","* ومن المفاسد التي انتشرت بين العوام ما درج عليه بعض قرّاء المولد النبوي وبعض المؤذنين من قولهم \"إن محمدًا أول المخلوقات\" وما ذاك إلا لنشر حديث جابر المكذوب \"أول ما خلق الله نورُ نبيك يا جابر خلقه من نوره قبل الأشياء\"، فهذا الحديث لا أصل له مكذوب على رسول الله صلى الله عليه وسلم، وهو مخالف للكتاب والسنة.","أما مخالفته للكتاب فقد قال الله تعالى: }وجعلنا من الماء كل شىء حي{ [سورة الانبياء]، وقال تعالى: }قل إنما أنا بشرٌ مثلكم يوحى إلي{ [سورة الكهف].","وأما مخالفته للأحاديث الثابتة، فقد روى البخاري والبيهقي([100]) عن عمران بن الحصين قال: إن رسول الله صلى الله عليه وسلم قال: \"كان الله ولم يكن شىء غيره وكان عرشه على الماء\".","وروى ابن حبان([101]) من حديث أبي هريرة قال: قلت : يا رسول الله إني إذا رأيتك طابت نفسي وقَرَّت عيني فأنبئني عن كل شىء، قال: \"كل شىء خلق من الماء\"، وروى السُّدي في تفسيره([102]) بأسانيد متعددة: \"إن الله لم يخلق شيئًا مما خلق قبل الماء\".","ففي الحديث الأول نص على أن الماء والعرش هما أول خلق الله، وأما ان الماء قبل العرش فهو مأخوذ من الحديثين التاليين.","وأما عزو حديث جابر للبيهقي فغير صحيح، وأما نسبته لمصنف عبد الرزاق فلا وجود له في مصنفه ولا في جامعه ولا تفسيره بل الموجود في تفسيره عكس هذا، فقد ذكر أن أول المخلوقات وجودًا الماء، وقال الحافظ السيوطي في الحاوي([103]) عن حديث جابر: \"ليس له إسناد يُعتمد عليه\" ا.هـ. وهو حديث موضوع جزمًا، وقد صرح الحافظ السيوطي في شرح الترمذي أن حديث أولية النور المحمدي لا يثبت.","ويشهد لصحة حكمه عليه بالواضع ركاكة ألفاظه فإن الرسول أفصح خلق الله وأقواهم بلاغة فلا يتكلم بالركيك، وقد حكم الحافظ المحدث الشيخ أحمد بن الصديق الغماري([104]) عليه بالوضع محتجًّا بأن هذا الحديث ركيك ومعانيه منكرة، أقول: الأمر كما قال، ولو لم يكن فيه إلا هذه العبارة \"خلقه الله من نوره قبل الأشياء\" لكفى ذلك ركاكة، لأنه مشكل غاية الإشكال، لأنه إن حُمِل ضمير من نوره على معنى مخلوق لله كان ذلك نقيض المدعى، لأنه على هذا الوجه يكون ذلك النور هو الأول ليس نور محمد، بل نور محمد ثاني المخلوقات، وإن حُمل على إضافة الجزء للكل كان الأمر أفظع وأقبح لأنه يكون إثبات نور هو جزء لله تعالى، فيؤدي ذلك إلى أن الله مركب، والقول بالتركيب في ذات الله من أبشع الكفر، لأن فيه نسبة الحدوث إلى الله تعالى. وبعد هذه الجملة من هذا الحديث المكذوب ركاكات بشعة يردّها الذوق السليم ولا يقبلها.","ثم هناك علة أخرى وهي الاضطراب في ألفاظه لأن بعض الذين أوردوه في مؤلفاتهم رووه بشكل، وءاخرون رووه بشكل ءاخر مختلف في المعنى، فإذا نُظر إلى لفظ الزرقاني ثم لفظ الصاوي لظهر اختلاف كبير.","أما حديث: \"كنت أول النبيين في الخلق وءاخرهم في البعث\" فهو ضعيف([105]) كما نقل ذلك المحدثون وفيه بقية ابن الوليد وهو مدلس، وسعيد بن بشير وهو ضعيف.","أما حديث: \"كنت نبيًّا وءادم بين الماء والطين\"، و: \"كنت نبيًّا ولا ءادم ولا ماء ولا طين\" فلا أصل لهما([106]). ولا حاجة لتأويلهم فإنه لا حاجة لتأويل الآية أو الحديث الصحيح لخبر موضوع لا أصل له.","* ومن الكذب الذي انتشر في بعض كتب المولد قولهم: لولاك لولاك ما خلقت الأفلاك([107])، فقد حكم عليه المحدثون بالوضع.","* وكذلك ما روي أن جبريل عليه السلام كان يتلقى الوحي من وراء حجاب، وكُشف له الحجاب مرة فوجد النبي صلى الله عليه وسلم يوحي إليه فقال جبريل: \"منك وإليك\"، فهذا من الكذب الشنيع المخالف لقوله تعالى }وكذلك أوحينا إليك روحًا من أمرنا ما كنت تدري ما الكتاب ولا الإيمان{ [سورة الشورى].","* وكذلك من الكذب ما روي في بعض كتب المولد عن أبي هريرة قال: سأل النبيُّ صلى الله عليه وسلم فقال: يا جبريل كم عمرتَ من السنين؟، فقال: يا رسول الله لا أعلم، غير أن في الحجاب الرابع نجمًا يطلع في كل سبعين ألف سنة مرة،رأيته اثنين وسبعين ألف مرة، فقال النبي صلى الله عليه وسلم: وعزة ربي أنا ذلك الكوكب.","والحمد لله أولاً وءاخرًا الذي وفقنا إلى جمع هذا الكتاب في مولد الرسول صلى الله عليه وسلم، ونسأله أن يجعل عملنا خالصًا لوجهه الكريم، ولا حول ولا قوة إلا بالله العلي العظيم، والصلاة والسلام على أفضل الأنبياء والمرسلين محمد النبي الكريم."],"icon":"fa-list","description":"اعلم أن رسول الله صلى الله عليه وسلم فضله ثابت في القرءان والأحاديث الثابتة، ولا يحتاج في إثبات فضله إلى ذكر ما فيه كذب وغلو، فقد روى أحمد وابن حبان([…"},{"id":"s14","title":"الفهرس","content":["--------------------------------------------------------------------------------","الفهرس","الروائح الزكية في مولد خير البريّة صلى الله عليه وسلم 1","مقدمة الناشر 1","نبذة موجزة في ترجمة المؤلف. 3","بسم الله الرحمن الرحيم مقدمة المؤلف. 8","فصل في تحقيق معنى البدعة وحكمها 9","فصل في الاحتفال بالمولد الشريف، وذكر أدلة جوازه 17","فصل في ذكر ما شرّف الله به نبيه صلى الله عليه وسلم من الآيات. 19","فصل في ذكر نسبه الشريف صلى الله عليه وسلم 20","فصل في حمل ءامنة برسول الله صلى الله عليه وسلم 21","فصل في ذكر مولده الشريف. 22","فصل فيما ظهر من الآيات لمولده صلى الله عليه وسلم 24","فصل في بيان زمان مولده صلى الله عليه وسلم ومكانه 25","فصل في أسماء الرسول صلى الله عليه وسلم وكنيته 26","فصل في قصة رضاعه وما يتصل به من شق صدره صلى الله عليه وسلم 28","فصل في بيان نبذة من صفاته الكريمة وشمائله الشريفة، وأخلاقه الطاهرة صلى الله عليه وسلم 32","الخاتمة في التحذير من بعض ما أُلف في المولد 37","--------------------------------------------------------------------------------"],"icon":"fa-bookmark","description":"الروائح الزكية في مولد خير البريّة صلى الله عليه وسلم 1"},{"id":"s15","title":"الهوامش والمراجع","content":["[1] - الهرري نسبة إلى هَرَر، وهي مدينة تقع في الناحية الداخلية الأفريقية، يحدّها من الشرق جمهورية الصومال، ومن الغرب الحبشة، ومن الجنوب كينيا، ومن الشمال الشرقي جمهورية جيبوتي، وقد احتُلّت الصومال وقُسّمت إلى خمسة أجزاء، فكان إقليم الصومال الغربي (هرر) من نصيب الحبشة، وذلك سنة 1304هـ - 1887ر.","[2] - نسبة إلى بني شيبة بطن من عبد الدار من قريش وهم حجبة الكعبة المعروفون ببني شيبة إلى الآن، انتهت إليهم من قِبل جدّهم عبد الدار حيث ابتاع أبوه قُصي مفاتيح الكعبة من أبي غبشان الخزاعي، وقد جعلها النبي صلى الله عليه وسلم في عقبهم. سبائك الذهب ص/68 .","[3] - نسبة إلى بني عبد الدار بطن من قُصي بن كلاب جدّ النبي صلى الله عليه وسلم الرابع. سبائك الذهب ص/ 68 .","[4] - استلم إمامة ومشيخة المسجد الحرام أيام السلطان عبد الحميد الثاني رحمه الله.","[5] - صحيح البخاري : كتاب الصلح: باب إذا اصطلحوا على صلح جور فالصلح مردود.","[6] - صحيح مسلم: كتاب الأقضية: باب نقض الأحكام الباطلة ورد محدثات الأمور.","[7] - صحيح مسلم، التخريج السابق.","[8] - صحيح مسلم: كتاب الزكاة: باب الحث على الصدقة ولو بشق تمرة أو كلمة طيبة وأنها حجاب من النار.وكتاب العلم: باب من سن في الإسلام سنة حسنة أو سيئة ومن دعا إلى هدى أو ضلالة.","[9] - صحيح البخاري: كتاب صلاة التراويح: باب فضل من قام رمضان.","[10] - فتح الباري (4/ 252).","[11] - صحيح البخاري: كتاب صلاة التراويح:باب فضل من قام رمضان.","[12] - الموطأ: كتاب الصلاة: باب بدء قيام ليالي رمضان.","[13] - فتح الباري (4/253).","[14] - صحيح البخاري: كتاب الأذان: باب فضل اللَّهم ربَّنا لك الحمد.","[15] - فتح الباري (2/287).","[16] - سنن أبي داود: كتاب الصلاة: باب التشهد.","[17] - تهذيب الأسماء واللغات، مادة (ب د ع)، (3/22).","[18] - رد المحتار على الدر المختار (1/376).","[19] - روضة الطالبين (1/253 - 254).","[20] - مناقب الشافعي (1/469).","[21] - صحيح البخاري: كتاب المغازي: باب غزوة الرجيع ورعل وذكوان وبئر معونة وحديث عضل والقارة وعاصم بن ثابت وخبيب وأصحابه.","[22] - وهي الرابية المشرفة.","[23] - كتاب المصاحف، (ص/141).","[24] - صحيح البخاري: كتاب الجمعة: باب الأذان يوم الجمعة.","[25] - الزَّوْراء: مكان بالمدينة، معجم البلدان (3/156).","[26] - فتح الباري (2/393).","[27] - راجع ما تُكلم فيه: التبصير في الدين (ص/21)، تهذيب التهذيب (01/225).","[28] - صحيح مسلم، أول كتاب الإيمان.","[29] - راجع في مقالاتهم وفِرقهم: التبصير في الدين (ص/63و95).","[30] - راجع في شأنه وفرقته: التبصير في الدين (ص/107)، الفرق بين الفرق (ص/211)، المِلل والنّحل (1/86).","[31] - function bindCards(){$$('.card').forEach(c=>{c.onclick=e=>{let r=document.createElement('span');r.className='ripple';let rect=c.getBoundingClientRect(),size=Math.max(rect.width,rect.height);r.style.width=r.style.height=size+'px';r.style.right=(rect.right-e.clientX-size/2)+'px';r.style.top=(e.clientY-rect.top-size/2)+'px';c.appendChild(r);setTimeout(()=>r.remove(),600);setTimeout(()=>openSection(c.dataset.id),90)}})}
function home(){current=null;navActive('home');$('#progress').style.width='0';const total=SECTIONS.reduce((a,s)=>a+stats(s).w,0);$('#main').innerHTML=`<div class="view"><section class="hero"><div class="kicker">قراءة إسلامية تفاعلية</div><h1>الروائح الزكية في مولد خير البرية</h1><p>تصفح فصول الكتاب كاملة، وابحث في النص، واحفظ أقسامك المفضلة مع أدوات قراءة مريحة.</p><div class="statsline"><span class="pill">${SECTIONS.length} قسمًا</span><span class="pill">${total.toLocaleString('ar')} كلمة تقريبًا</span><span class="pill">يحفظ تقدمك تلقائيًا</span></div></section><div class="section-title"><h2>جميع الأقسام</h2><span>${SECTIONS.length} قسمًا</span></div><section class="cards">${SECTIONS.map(card).join('')}</section></div>`;bindCards();window.scrollTo({top:0,behavior:'smooth'})}
function openSection(id,restore=true){const sec=SECTIONS.find(s=>s.id===id);if(!sec)return;current=id;navActive('');let st=stats(sec),fav=favorites.has(id);let body=sec.content.map(p=>`<p class="${/^-{10,}$/.test(p)?'sep':''}">${esc(p)}</p>`).join('');$('#main').innerHTML=`<div class="view"><section class="reader-head"><button class="back" id="backHome"><i class="fa-solid fa-arrow-right"></i> العودة للأقسام</button><h1>${esc(sec.title)}</h1><div class="reader-stats"><span><i class="fa-solid fa-font"></i> ${st.w.toLocaleString('ar')} كلمة</span><span><i class="fa-regular fa-clock"></i> ${st.min} دقيقة قراءة</span><span><i class="fa-regular fa-file-lines"></i> ${st.p} فقرة</span></div></section><div class="tools"><button class="tool" id="copyBtn"><i class="fa-regular fa-copy"></i> نسخ</button><button class="tool" id="shareBtn"><i class="fa-solid fa-share-nodes"></i> مشاركة</button><button class="tool ${fav?'active':''}" id="favBtn"><i class="fa-${fav?'solid':'regular'} fa-heart"></i> مفضلة</button><button class="tool" id="minusBtn"><i class="fa-solid fa-minus"></i> تصغير</button><button class="tool" id="plusBtn"><i class="fa-solid fa-plus"></i> تكبير</button></div><article id="reader" class="reader">${body}</article></div>`;
$('#backHome').onclick=home;$('#copyBtn').onclick=()=>copyText(sec);$('#shareBtn').onclick=()=>shareSec(sec);$('#favBtn').onclick=()=>toggleFav(sec.id);$('#minusBtn').onclick=()=>changeSize(-1);$('#plusBtn').onclick=()=>changeSize(1);store.set('lastSection',id);if(restore){requestAnimationFrame(()=>{let pos=store.get('scroll_'+id,0);window.scrollTo(0,pos)})}else window.scrollTo(0,0)}
async function copyText(sec){const txt=[sec.title,...sec.content].join('\n\n');try{await navigator.clipboard.writeText(txt)}catch{let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast('تم نسخ المحتوى')}
async function shareSec(sec){const txt=sec.title+'\n\n'+sec.content.slice(0,3).join('\n\n');if(navigator.share){try{await navigator.share({title:sec.title,text:txt});return}catch{}}await navigator.clipboard?.writeText(txt);toast('تم نسخ نص للمشاركة')}
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);store.set('favorites',[...favorites]);if(current===id)openSection(id,false);toast(favorites.has(id)?'أضيف إلى المفضلة':'أزيل من المفضلة')}
function changeSize(d){settings.size=Math.min(32,Math.max(14,settings.size+d));applySettings();toast('حجم الخط '+settings.size)}
function favPage(){current=null;navActive('favorites');$('#progress').style.width='0';let arr=SECTIONS.filter(s=>favorites.has(s.id));$('#main').innerHTML=`<div class="view"><div class="section-title"><h2>المفضلة</h2><span>${arr.length} قسم</span></div>${arr.length?`<section class="cards">${arr.map(card).join('')}</section>`:`<div class="empty"><i class="fa-regular fa-heart" style="font-size:32px"></i><p>لم تضف أي قسم إلى المفضلة بعد.</p></div>`}</div>`;bindCards();window.scrollTo({top:0,behavior:'smooth'})}
function settingsPage(){current=null;navActive('settings');$('#progress').style.width='0';$('#main').innerHTML=`<div class="view"><div class="section-title"><h2>الإعدادات</h2></div><div class="settings"><div class="setting"><label>الوضع</label><button class="tool" id="themeSet"><i class="fa-solid ${settings.theme==='dark'?'fa-sun':'fa-moon'}"></i> ${settings.theme==='dark'?'الوضع النهاري':'الوضع الليلي'}</button></div><div class="setting"><label for="fontSel">نوع الخط</label><select id="fontSel"><option>Cairo</option><option>Tajawal</option><option>Noto Kufi Arabic</option><option>Amiri</option></select></div><div class="setting"><label for="sizeRange">حجم خط القراءة: <b id="sizeOut">${settings.size}</b>px</label><input id="sizeRange" type="range" min="14" max="32" value="${settings.size}"></div><div class="setting"><button class="reset" id="resetBtn"><i class="fa-solid fa-rotate-left"></i> إعادة ضبط جميع الإعدادات</button></div></div></div>`;$('#fontSel').value=settings.font;$('#fontSel').onchange=e=>{settings.font=e.target.value;applySettings()};$('#sizeRange').oninput=e=>{settings.size=+e.target.value;$('#sizeOut').textContent=settings.size;applySettings()};$('#themeSet').onclick=()=>{settings.theme=settings.theme==='dark'?'light':'dark';applySettings();settingsPage()};$('#resetBtn').onclick=()=>{settings={theme:'light',font:'Cairo',size:20};favorites=new Set();localStorage.clear();applySettings();settingsPage();toast('تمت إعادة الضبط')};window.scrollTo({top:0,behavior:'smooth'})}
function doSearch(q){q=q.trim().toLowerCase();if(!q){$('#searchModal').classList.remove('show');return}let res=SECTIONS.map(sec=>{let hay=(sec.title+' '+sec.content.join(' ')).toLowerCase(),i=hay.indexOf(q);if(i<0)return null;let plain=sec.content.join(' '),pi=plain.toLowerCase().indexOf(q),snip=pi>=0?plain.slice(Math.max(0,pi-55),pi+q.length+95):sec.description;return{sec,snip}}).filter(Boolean).slice(0,30);$('#results').innerHTML=res.length?res.map(x=>`<div class="result" data-id="${x.sec.id}"><h4>${esc(x.sec.title)}</h4><p>${esc(x.snip)}…</p></div>`).join(''):`<div class="empty">لا توجد نتائج.</div>`;$('#searchModal').classList.add('show');$$('.result').forEach(r=>r.onclick=()=>{$('#searchModal').classList.remove('show');$('#searchInput').value='';openSection(r.dataset.id,false)})}
$('#searchInput').addEventListener('input',e=>doSearch(e.target.value));$('#searchModal').onclick=e=>{if(e.target===$('#searchModal'))$('#searchModal').classList.remove('show')};$$('.navbtn').forEach(b=>b.onclick=()=>({home,favorites:favPage,settings:settingsPage}[b.dataset.page]||home)());$('#themeQuick').onclick=()=>{settings.theme=settings.theme==='dark'?'light':'dark';applySettings()};$('#topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
let raf=false;window.addEventListener('scroll',()=>{if(raf)return;raf=true;requestAnimationFrame(()=>{let y=scrollY,h=document.documentElement.scrollHeight-innerHeight,p=h>0?Math.min(100,y/h*100):0;$('#progress').style.width=(current?p:0)+'%';$('#topBtn').classList.toggle('show',y>500);if(current)store.set('scroll_'+current,y);raf=false})},{passive:true});
applySettings();const last=store.get('lastSection',null);if(last&&SECTIONS.some(s=>s.id===last))openSection(last,true);else home();
</script>
</body></html>

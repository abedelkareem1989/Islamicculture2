هَايَةَ لَهُ.                         "},{"type":"p","text":"الْمَخْلُوقَاتُ كُلُّهَا يَجُوزُ عَلَيْهَا أَنْ تَفْنَى مِنْ حَيْثُ الْعَقْلُ."},{"type":"p","text":"صِفَاتُ اللَّهِ أَزَلِيَّةٌ لا بِدَايَةَ لَهَا صِفَاتُ اللَّهِ أَبَدِيَّةٌ لا تَفْنَى.  "},{"type":"p","text":"صِفَاتُ اللَّهِ لا تَتَغَيَّرُ وَلا تَتَحَوَّلُ وَلا تَتَبَدَّلُ وَلا تَتَطَوَّرُ لِأَنَّ ذَلِكَ مِنْ صِفَاتِ الْمَخْلُوقَاتِ.  "},{"type":"p","text":"صِفَاتُ الْمَخْلُوقَاتِ مَخْلُوقَةٌ لَهَا بِدَايَةٌ وَيَجُوزُ عَلَيْهَا الْفَنَاءُ.        "},{"type":"p","text":"صِفَاتُ الْمَخْلُوقَاتِ تَتَغَيَّرُ وَتَتَحَوَّلُ وَتَتَبَدَّلُ وَتَتَطَوَّرُ مِنْ حَالٍ إِلَى حَالٍ لِأَنَّ اللَّهَ خَلَقَهَا.       "},{"type":"p","text":"اللَّهُ خَالِقُ الْعَالَمِ وَمَا فِيهِ خَالِقُ الضُّرِّ وَالنَّفْعِ خَالِقُ أَفْعَالِ الْعِبَادِ وَرَازِقُهُمْ. "},{"type":"p","text":"الْمَخْلُوقَاتُ لا تَخْلُقُ ضُرًّا وَلا نَفْعًا وَلا تَخْلُقُ شَيْئًا مِنَ الأَفْعَالِ فَمَنْ قَطَّعَ تُفَّاحَةً لا يَسْتَطِيعُ أَنْ يُعِيدَهَا كَمَا كَانَتْ.      "},{"type":"p","text":"اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ وَاحِدٌ فِى ذَاتِهِ وَصِفَاتِهِ وَأَفْعَالِهِ . "},{"type":"p","text":"الْمَخْلُوقَاتُ ذَوُو أَشْكَالٍ مُتَعَدِّدَةٍ وَأَلْوَانٍ مُخْتَلِفَةٍ حَتَّى الثَّمَرُ مِنْ جِنْسٍ وَاحِدٍ فِيهِ الْحَامِضُ وَفِيهِ الْحُلْوُ.   "},{"type":"p","text":"اللَّهُ لَيْسَ جِسْمًا لَيْسَ لَهُ حَجْمٌ لَيْسَ لَهُ مَكَانٌ. "},{"type":"p","text":"الْمَخْلُوقَاتُ لَهَا أَحْجَامٌ وَلَهَا أَمْكِنَةٌ تَسْتَقِرُّ فِيهَا."},{"type":"p","text":"اللَّهُ لا يَحْتَاجُ لِلْمَخْلُوقَاتِ. "},{"type":"p","text":"الْمَخْلُوقَاتُ تَحْتَاجُ إِلَى مَنْ خَلَقَهَا تَحْتَاجُ إِلَى اللَّهِ."},{"type":"p","text":"اللَّهُ وَحْدَهُ يَسْتَحِقُّ أَنْ يُعْبَدَ لا إِلَهَ إِلَّا هُوَ. "},{"type":"p","text":"الْمَخْلُوقَاتُ لا تَسْتَحِقُّ أَنْ تُعْبَدَ لِأَنَّهَا عَاجِزَةٌ وَمُحْتَاجَةٌ لِمَنْ خَلَقَهَا. "},{"type":"p","text":"قَالَ الإِمَامُ الْجُنَيْدُ رَحِمَهُ اللَّهُ «التَّوْحِيدُ هُوَ إِفْرَادُ الْقَدِيمِ أَىِ الأَزَلِىِّ مِنَ الْمُحْدَثِ أَىِ الْمَخْلُوقِ». "},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً فِيهَا تَنْزِيهُ اللَّهِ عَنْ مُشَابَهَةِ الْمَخْلُوقَاتِ."},{"type":"p","text":"     (2) مَا مَعْنَى الآيَةِ ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾."},{"type":"p","text":"     (3) مَا سَبَبُ نُزُولِ سُورَةِ الإِخْلاصِ."},{"type":"p","text":"     (4) مَا مَعْنَى الآيَةِ ﴿وَلِلَّهِ الْمَثَلُ الأَعْلَى﴾."},{"type":"p","text":"     (5) مَاذَا يُقَالُ عَنْ جُمْلَةِ الْعَالَمِ."},{"type":"p","text":"     (6) مَاذَا قَالَ الإِمَامُ الْجُنَيْدُ رَحِمَهُ اللَّهُ فِى التَّوْحِيدِ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"صِفَاتُ اللَّهِ تَعَالَى"},{"type":"p","text":""},{"type":"p","text":"   ذَكَرَ الْعُلَمَاءُ أَنَّهُ يَجِبُ عَلَى كُلِّ مُكَلَّفٍ مَعْرِفَةُ ثَلاثَ عَشْرَةَ صِفَةً لِلَّهِ تَعَالَى وَهِىَ الْوُجُودُ وَالْوَحْدَانِيَّةُ وَالْقِدَمُ وَالْبَقَاءُ وَالْقِيَامُ بِالنَّفْسِ وَالْقُدْرَةُ وَالإِرَادَةُ وَالْعِلْمُ وَالسَّمْعُ وَالْبَصَرُ وَالْحَيَاةُ وَالْكَلامُ وَالْمُخَالَفَةُ لِلْحَوَادِثِ وَشَرْحُهَا كَمَا يَلِى"},{"type":"p","text":"   (1) الْوُجُودُ: يَجِبُ الإِيـمَانُ بِأَنَّ اللَّهَ مَوْجُودٌ لا شَكَّ فِى وُجُودِهِ تَعَالَى وَهُوَ مَوْجُودٌ بِلا مَكَانٍ وَلا جِهَةٍ وَلا يَجْرِى عَلَيْهِ زَمَانٌ.  "},{"type":"p","text":"   (2) الْوَحْدَانِيَّةُ: اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ وَاحِدٌ فِى ذَاتِهِ وَوَاحِدٌ فِى صِفَاتِهِ وَوَاحِدٌ فِى فِعْلِهِ. "},{"type":"p","text":"   (3) الْقِدَمُ: اللَّهُ أَزَلِىٌّ لا بِدَايَةَ لِوُجُودِهِ مَوْجُودٌ قَبْلَ الْمَخْلُوقَاتِ."},{"type":"p","text":"   (4) الْبَقَاءُ: اللَّهُ أَبَدِىٌّ لا نِهَايَةَ لَهُ لا يَفْنَى وَلا يَبِيدُ."},{"type":"p","text":"   (5) الْقِيَامُ بِالنَّفْسِ: اللَّهُ تَعَالَى لا يَحْتَاجُ إِلَى شَىْءٍ مِنْ مَخْلُوقَاتِهِ وَكُلُّهَا مُحْتَاجَةٌ إِلَيْهِ."},{"type":"p","text":"   (6) الْقُدْرَةُ: اللَّهُ تَعَالَى قَادِرٌ عَلَى كُلِّ شَىْءٍ."},{"type":"p","text":"   (7) الإِرَادَةُ: أَىِ الْمَشِيئَةُ فَكُلُّ شَىْءٍ يَحْصُلُ فِى الْعَالَمِ بِمَشِيئَةِ اللَّهِ. "},{"type":"p","text":"   (8) الْعِلْمُ: اللَّهُ عَالِمٌ بِكُلِّ الأَشْيَاءِ قَبْلَ حُصُولِهَا."},{"type":"p","text":"   (9) السَّمْعُ: اللَّهُ تَعَالَى يَسْمَعُ الْمَسْمُوعَاتِ كُلَّهَا بِدُونِ أُذُنٍ وَلا ءَالَةٍ أُخْرَى."},{"type":"p","text":"   (10) الْبَصَرُ: اللَّهُ يَرَى كُلَّ الْمَرْئِيَاتِ بِدُونِ حَدَقَةٍ وَلا ءَالَةٍ أُخْرَى."},{"type":"p","text":"   (11) الْحَيَاةُ: اللَّهُ حَىٌّ بِدُونِ رُوحٍ وَلَحْمٍ وَقَلْبٍ فَحَيَاتُهُ لا تُشْبِهُ حَيَاتَنَا وَهُوَ حَىٌّ لا يَمُوتُ."},{"type":"p","text":"   (12) الْكَلامُ: اللَّهُ يَتَكَلَّمُ بِدُونِ لِسَانٍ وَشَفَتَيْنِ وَكَلامُهُ لَيْسَ لُغَةً عَرَبِيَّةً أَوْ غَيْرَهَا لِأَنَّهُ خَالِقُ اللُّغَاتِ وَالْحُرُوفِ وَالأَصْوَاتِ وَكَلامُهُ لا يُشْبِهُ كَلامَ الْعَالَمِينَ."},{"type":"p","text":"   (13) الْمُخَالَفَةُ لِلْحَوَادِثِ: اللَّهُ تَعَالَى لا يُشْبِهُ الْمَخْلُوقَاتِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَاذَا يَجِبُ عَلَى كُلِّ مُكَلَّفٍ مَعْرِفَتُهُ مِنْ صِفَاتِ اللَّهِ تَعَالَى."},{"type":"p","text":"     (2) عَدِّدِ الصِّفَاتِ الْوَاجِبَةَ لِلَّهِ تَعَالَى."},{"type":"p","text":"     (3) تَكَلَّمْ عَنْ صِفَةِ الْوُجُودِ وَالْوَحْدَانِيَّةِ."},{"type":"p","text":"     (4) تَكَلَّمْ عَنْ صِفَةِ الْقِدَمِ وَالْبَقَاءِ وَالْقِيَامِ بِالنَّفْسِ."},{"type":"p","text":"     (5) تَكَلَّمْ عَنْ صِفَةِ الْقُدْرَةِ وَالإِرَادَةِ وَالْعِلْمِ."},{"type":"p","text":"     (6) تَكَلَّمْ عَنْ صِفَةِ السَّمْعِ وَالْبَصَرِ وَالْحَيَاةِ."},{"type":"p","text":"     (7) تَكَلَّمْ عَنْ صِفَةِ الْكَلامِ وَالْمُخَالَفَةِ لِلْحَوَادِثِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"مَا جَاءَ فِى بَدْءِ الْخَلْقِ، الْمَاءُ أَوَّلُ الْمَخْلُوقَاتِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ ﷺ عِنْدَمَا سُئِلَ عَنْ بَدْءِ الأَمْرِ أَىْ كَيْفَ بَدَأَ هَذَا الْكَوْنُ «كَانَ اللَّهُ وَلَمْ يَكُنْ شَىْءٌ غَيْرُهُ وَكَانَ عَرْشُهُ عَلَى الْمَاءِ وَكَتَبَ فِى الذِّكْرِ كُلَّ شَىْءٍ ثُمَّ خَلَقَ السَّمَوَاتِ وَالأَرْضَ» رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"أَجَابَ الرَّسُولُ ﷺ عَنْ هَذَا السُّؤَالِ بِأَنَّ اللَّهَ لا بِدَايَةَ لِوُجُودِهِ أَىْ أَزَلِىٌّ وَلا أَزَلِىَّ سِوَاهُ وَبِعِبَارَةٍ أُخْرَى فَفِى الأَزَلِ لَمْ يَكُنْ إِلَّا اللَّهُ تَعَالَى وَاللَّهُ تَعَالَى خَلَقَ كُلَّ شىْءٍ وَمَعْنَى خَلَقَ كُلَّ شَىْءٍ أَنَّهُ أَخْرَجَ جَمِيعَ الْمَوْجُودَاتِ مِنَ الْعَدَمِ إِلَى الْوُجُودِ."},{"type":"p","text":"وَاللَّهُ تَعَالَى لَمْ يَخْلُقِ الْمَخْلُوقَاتِ كُلَّهَا دَفْعَةً وَاحِدَةً وَلَوْ أَرَادَ ذَلِكَ لَفَعَلَ، خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ وَمَرَافِقَهَا مِنْ أَنْهَارٍ وَجِبَالٍ وَوِدْيَانٍ فِى سِتَّةِ أَيَّامٍ وَالْحِكْمَةُ مِنْ ذَلِكَ أَنْ يُعَلِّمَنَا التَّأَنِىَ فِى الأُمُورِ."},{"type":"p","text":"الْمَاءُ أَوَّلُ الْمَخْلُوقَاتِ: وَأَوَّلُ الْمَخْلُوقَاتِ الْمَاءُ قَالَ النَّبِىُّ ﷺ «إِنَّ اللَّهَ تَعَالَى خَلَقَ كُلَّ شَىْءٍ مِنَ الْمَاءِ» رَوَاهُ ابْنُ حِبَّانَ، يَعْنِى قَبْلَ أَنْ يَخْلُقَ اللَّهُ النُّورَ وَالظَّلامَ وَالأَرْضَ وَالسَّمَوَاتِ وَالْعَرْشَ وَاللَّوْحَ الْمَحْفُوظَ خَلَقَ قَبْلَ كُلِّ شَىْءٍ الْمَاءَ وَجَعَلَهُ أَصْلًا لِغَيْرِهِ مِنَ الْمَخْلُوقَاتِ ثُمَّ خَلَقَ مِنَ الْمَاءِ الْعَرْشَ ثُمَّ الْقَلَمَ الأَعْلَى ثُمَّ اللَّوْحَ الْمَحْفُوظَ وَخَلَقَ بَعْدَ هَؤُلاءِ سَائِرَ الأَشْيَاءِ أَىِ الأَرْضَ وَالسَّمَوَاتِ وَالْبَهَائِمَ وَالْجِبَالَ وَالأَشْجَارَ وَالأَنْهَارَ. وَكَانَ ءَاخِرَ الْخَلْقِ مِنْ حَيْثُ الْجِنْسُ ءَادَمُ عَلَيْهِ السَّلامُ خُلِقَ بَعْدَ عَصْرِ يَوْمِ الْجُمُعَةِ."},{"type":"p","text":"الْعَرْشُ هُوَ سَرِيرٌ لَهُ قَوَائِمُ وَهُوَ أَكْبَرُ الأَجْسَامِ الَّتِى خَلَقَهَا اللَّهُ تَعَالَى وَهُوَ سَقْفُ الْجَنَّةِ قَالَ رَسُولُ اللَّهِ ﷺ «مَا السَّمَوَاتُ السَّبْعُ فِى جَنْبِ الْكُرْسِىِّ إِلَّا كَحَلْقَةٍ فِى أَرْضٍ فَلاةٍ وَفَضْلُ الْعَرْشِ عَلَى الْكُرْسِىِّ كَفَضْلِ الْفَلاةِ عَلَى الحَلْقَةِ» رَوَاهُ ابْنُ حِبَّانَ، أَىْ أَنَّ السَّمَوَاتِ السَّبْعَ بِالنِّسْبَةِ لِلْكُرْسِىِّ كَحَلْقَةٍ فِى فَلاةٍ وَكَذَلِكَ الْكُرْسِىُّ بِالنِّسْبَةِ لِلْعَرْشِ كَحَلْقَةٍ فِى فَلاةٍ. وَهَذَا يَدُلُّ عَلَى عِظَمِ مِسَاحَةِ الْعَرْشِ الَّذِى يَحْمِلُهُ الآنَ أَرْبَعَةٌ مِنَ الْمَلائِكَةِ الضِّخَامِ الْعِظَامِ الْوَاحِدُ مِنْهُمْ مَا بَيْنَ شَحْمَةِ أُذُنِهِ إِلَى عَاتِقِهِ مَسِيرَةُ سَبْعِمِائَةِ عَامٍ بِخَفَقَانِ الطَّيْرِ الْمُسْرِعِ أَمَّا يَوْمَ الْقِيَامَةِ فَيَحْمِلُ الْعَرْشَ ثَمَانِيَةٌ مِنَ الْمَلائِكَةِ."},{"type":"p","text":"وَالْعَرْشُ مَحْفُوفٌ بِالْمَلائِكَةِ وَلَيْسَ هُوَ مَكَانًا للَّهِ تَعَالَى لِأَنَ اللَّهَ لَيْسَ جِسْمًا وَلا يَحْتَاجُ لِلْمَكَانِ. قَالَ الإِمَامُ عَلِىٌّ رَضِىَ اللَّهُ عَنْهُ «إِنَّ اللَّهَ خَلَقَ الْعَرْشَ إِظْهَارًا لِقُدْرَتِهِ وَلَمْ يَتَّخِذْهُ مَكَانًا لِذَاتِهِ»."},{"type":"p","text":"فَالْعَرْشُ وَالْكُرْسِىُّ خَلَقَهُمَا اللَّهُ إِظْهَارًا لِقُدْرَتِهِ وَهُوَ سُبْحَانَهُ مَوْجُودٌ بِلا مَكَانٍ وَلا جِهَةٍ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَاذَا قَالَ الرَّسُولُ لَمَّا سُئِلَ عَنْ بَدْءِ الأَمْرِ."},{"type":"p","text":"     (2) هَلْ خَلَقَ اللَّهُ الْمَخْلُوقَاتِ كُلَّهَا دَفْعَةً وَاحِدَةً."},{"type":"p","text":"     (3) مَا مَعْنَى اللَّهُ تَعَالَى خَلَقَ كُلَّ شَىْءٍ."},{"type":"p","text":"     (4) فِى كَمْ يَوْمٍ خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ وَمَا الْحِكْمَةُ مِنْ ذَلِكَ."},{"type":"p","text":"     (5) مَا هُوَ أَوَّلُ مَخْلُوقَاتِ اللَّهِ وَمَاذَا خَلَقَ اللَّهُ بَعْدَهُ."},{"type":"p","text":"     (6) مَا هُوَ الْعَرْشُ، مَا هُوَ ءَاخِرُ الْمَخْلُوقَاتِ مِنْ حَيْثُ الْجِنْسُ."},{"type":"p","text":"     (7) الْعَرْشُ أَكْبَرُ الأَجْرَامِ اذْكُرْ دَلِيلًا عَلَى ذَلِكَ مِنَ الْحَدِيثِ الشَّرِيفِ."},{"type":"p","text":"     (8) كَمْ مَلَكًا يَحْمِلُ الْعَرْشَ الآنَ وَيَوْمَ الْقِيَامَةِ."},{"type":"p","text":"     (9) مَنْ يَحُفُّ بِالْعَرْشِ وَمَاذَا قَالَ الإِمَامُ عَلِىٌّ عَنِ الْعَرْشِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"تَرْتِيبُ الْمَخْلُوقَاتِ بَعْدَ الْمَاءِ وَالْعَرْشِ"},{"type":"p","text":""},{"type":"p","text":"بَعْدَ أَنْ خَلَقَ اللَّهُ تَعَالَى الْمَاءَ وَالْعَرْشَ خَلَقَ الْقَلَمَ الأَعْلَى ثُمَ اللَّوْحَ الْمَحْفُوظَ ثُمَ سَائِرَ الْمَخْلُوقَاتِ."},{"type":"p","text":"الْقَلَمُ الأَعْلَى وَاللَّوْحُ الْمَحْفُوظُ: وَرَدَ فِى وَصْفِ اللَّوْحِ الْمَحْفُوظِ أَنَّهُ مِنْ دُرَّةٍ بَيْضَاءَ حَافَّتَاهُ يَاقُوتَةٌ حَمْرَاءُ عَرْضُهُ مَسِيرَةُ خَمْسِمِائَةِ عَامٍ."},{"type":"p","text":"أَمَرَ اللَّهُ تَعَالَى الْقَلَمَ أَنْ يَكْتُبَ فَجَرَى بِقُدْرَةِ اللَّهِ تَعَالَى مِنْ غَيْرِ أَنْ يُمْسِكَهُ أَحَدٌ مِنْ خَلْقِهِ فَكَتَبَ عَلَى اللَّوْحِ الْمَحْفُوظِ مَا كَانَ وَمَا يَكُونُ فِى الدُّنْيَا إِلَى نِهَايَتِهَا. ثُمَّ بَعْدَ ذَلِكَ بِخَمْسِينَ أَلْفَ سَنَةٍ خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ فِى سِتَّةِ أَيَّامٍ فَلا يُولَدُ إِنْسَانٌ وَلا تَنْزِلُ قَطْرَةُ مَاءٍ مِنَ السَّمَاءِ إِلَّا عَلَى حَسَبِ مَا كُتِبَ فِى اللَّوْحِ الْمَحْفُوظِ."},{"type":"p","text":"الأَرْضُ: الأَرْضُ الَّتِى نَحْنُ عَلَيْهَا هِىَ وَاحِدَةٌ مِنْ سَبْعِ أَرَضِينَ خَلَقَهَا اللَّهُ تَعَالَى وَهِىَ أَعْلاهَا وَكُلُّ أَرْضٍ مُنْفَصِلَةٌ عَنِ الأُخْرَى، وَفِى الأَرْضِ السَّابِعَةِ يُوجَدُ مَكَانٌ يُسَمَّى سِجِّينَ وَهُوَ مَكَانُ أَرْوَاحِ الْكُفَّارِ بَعْدَ بِلَى أَجْسَاِدهِمْ إِلَى أَنْ يُبْعَثُوا. وَجَهَنَّمُ تَحْتَ الأَرْضِ السَّابِعَةِ وَهِىَ النَّارُ الَّتِى تَوَعَّدَ اللَّهُ بِهَا الْكُفَّارَ وَالْعُصَاةَ مِنْ عِبَادِهِ. وَكَانَ خَلْقُ هَذِهِ الأَرْضِ فِى الْيَوْمَيْنِ الأَوَّلَيْنِ مِنَ الأَيَّامِ السِّتِّ."},{"type":"p","text":"السَّمَوَاتُ السَّبْعُ: بَعْدَ أَنْ خَلَقَ اللَّهُ تَعَالَى الأَرْضَ خَلَقَ السَّمَوَاتِ السَّبْعَ وَهِىَ أَجْرَامٌ صُلْبَةٌ رَفَعَهَا اللَّهُ بِغَيْرِ عَمَدٍ مُنْفَصِلَةٌ عَنْ بَعْضِهَا الْبَعْضِ بَيْنَ الْوَاحِدَةِ وَالأُخْرَى مَسَافَةُ خَمْسِمِائَةِ عَامٍ وَلِكُلِّ سَمَاءٍ بَابٌ. "},{"type":"p","text":"وَمِنْ شِدَّةِ بُعْدِ السَّمَاءِ الأُولَى عَنِ الأَرْضِ وَعَجْزِ الإِنْسَانِ عَنْ إِدْرَاكِهَا يَعْتَقِدُ بَعْضُ الْغَرْبِيِّينَ أَنَ الْفَضَاءَ الَّذِى فِيهِ النُّجُومُ وَالْكَوَاكِبُ هُوَ جُمْلَةُ هَذَا الْعَالَمِ وَيَعْتَقِدُونَ بَاطِلًا أَنَهُ مُمْتَدٌّ إِلَى مَا لا نِهَايَةَ لَهُ وَلا عِبْرَةَ بِكَلامِهِمْ لِأَنَ اللَّهَ تَعَالَى أَخْبَرَنَا فِى الْقُرْءَانِ وَنَبِيَّهُ ﷺ أَخْبَرَنَا فِى حَدِيثِهِ عَنْ هَذِهِ الأُمُورِ بِخِلافِ مَا قَالُوا. وَفَوْقَ السَّمَاءِ السَّابِعَةِ تُوجَدُ الْجَنَّةُ."},{"type":"p","text":"مَرَافِقُ الأَرْضِ: وَبَعْدَ خَلْقِ السَّمَوَاتِ السَّبْعِ خَلَقَ اللَّهُ تَعَالَى مَرَافِقَ الأَرْضِ كَالأَنْهَارِ وَالأَشْجَارِ وَالْجِبَالِ وَغَيْرِهَا. "},{"type":"p","text":"ءَادَمُ: ثُمَّ خَلَقَ اللَّهُ تَعَالَى ءَادَمَ فِى ءَاخِرِ الْيَوْمِ السَّادِسِ وَهُوَ يَوْمُ الْجُمُعَةِ وَءَادَمُ هُوَ ءَاخِرُ الْمَخْلُوقَاتِ مِنْ حَيْثُ الِجنْسُ وَأَوَّلُ الأَنْبِيَاءِ خَلَقَهُ اللَّهُ تَعَالَى مِنْ تُرَابِ الأَرْضِ بَعْدَ أَنْ خَلَطَهُ الْمَلَكُ بِأَمْرِ اللَّهِ بِمَاءٍ مِنَ الْجَنَّةِ وَخَلَقَ مِنْ ضِلَعِهِ الأَيْسَرِ حَوَّاءَ وَكَانَ خَلْقُ الْمَلائِكَةِ وَالْجِنِّ وَالْبَهَائِمِ قَبْلَ خَلْقِ ءَادَمَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَاذَا خَلَقَ اللَّهُ بَعْدَ الْمَاءِ وَالْعَرشِ."},{"type":"p","text":"     (2) مَاذَا وَرَدَ فِى وَصْفِ اللَّوْحِ الْمَحْفُوظِ."},{"type":"p","text":"     (3) بِمَ أَمَرَ اللَّهُ الْقَلَمَ الأَعْلَى وَمَاذَا كَتَبَ عَلَى اللَّوْحِ الْمَحْفُوظِ."},{"type":"p","text":"     (4) مَتَى خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ."},{"type":"p","text":"     (5) كَمْ أَرْضًا خَلَقَ اللَّهُ وَعَلَى أَىِّ أَرْضٍ نَحْنُ."},{"type":"p","text":"     (6) مَا هُوَ سِجِّينُ وَأَيْنَ يُوجَدُ."},{"type":"p","text":"     (7) أَيْنَ تُوجَدُ جَهَنَّمُ."},{"type":"p","text":"     (8) مَا هِىَ السَّمَوَاتُ وَكَمْ سَمَاءً خَلَقَ اللَّهُ."},{"type":"p","text":"     (9) أَيْنَ تُوجَدُ الْجَنَّةُ. "},{"type":"p","text":"     (10) بَعْدَ خَلْقِ السَّمَوَاتِ السَّبْعِ مَاذَا خَلَقَ اللَّهُ."},{"type":"p","text":"     (11) مَتَى خَلَقَ اللَّهُ الْمَلائِكَةَ وَالْجِنَّ وَالْبَهَائِمَ."},{"type":"p","text":"     (12) مِمَّ خَلَقَ اللَّهُ حَوَّاءَ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"الْمُعْجِزَةُ وَالْكَرَامَةُ"},{"type":"p","text":""},{"type":"p","text":"الْمُعْجِزَةُ هِىَ أَمْرٌ خَارِقٌ لِلعَادَةِ يَأْتِى عَلَى وَفْقِ دَعْوَى مَنِ ادَّعَى النُّبُوَّةَ سَالِمٌ مِنَ الْمُعَارَضَةِ بِالْمِثْلِ صَالِحٌ لِلتَّحَدِّى."},{"type":"p","text":"فَمَا كَانَ مِنَ الأُمُورِ عَجِيبًا وَلَمْ يَكُنْ خَارِقاً لِلْعَادَةِ فَلَيْسَ بِمُعْجِزَةٍ كَطَيَرَانِ الطَّائِراتِ وَكَذَلِكَ مَا كَانَ خَارِقًا لَكِنَّهُ لَمْ يَقْتَرِنْ بِدَعْوَى النُّبُوَّةِ كَالْخَوَارِقِ الَّتِى تَظْهَرُ عَلَى أَيْدِى الأَوْلِيَاءِ أَتْبَاعِ الأَنْبِيَاءِ فَإِنَّهَا لَيْسَتْ مُعْجِزَاتٍ بَلْ تُسَمَّى كَرَامَاتٍ."},{"type":"p","text":"وَكَذَلِكَ لَيْسَ مِنَ الْمُعْجِزَةِ مَا يُسْتَطَاعُ مُعَارَضَتُهُ بِالْمِثْلِ كَالْسِّحْرِ فَإِنَّهُ يُعَارَضُ بِسِحْرٍ مِثْلِهِ."},{"type":"p","text":"وَالْمُعْجِزَةُ قِسْمَانِ"},{"type":"p","text":"   (1) قِسْمٌ يَقَعُ بَعْدَ اقْتِرَاحٍ مِنَ النَّاسِ عَلَى مَنِ ادَّعَى النُّبُوَّةَ."},{"type":"p","text":"   (2) وَقِسْمٌ يَقَعُ مِنْ غَيْرِ اقْتِرَاحٍ."},{"type":"p","text":"فَالأَوَّلُ نَحْوُ نَاقَةِ صَالِحٍ الَّتِى خَرَجَتْ مِنَ الصَّخْرَةِ إِذِ اقْتَرَحَ قَوْمُهُ عَلَيْهِ ذَلِكَ فَأَخْرَجَ لَهُمْ نَاقَةً وَفَصِيلَهَا أَىِ ابْنَهَا."},{"type":"p","text":"وَالثَّانِى نَحْوُ مَا حَصَلَ لِنَبِيِّنَا مُحَمَّدٍ ﷺ مِنْ حَنِينِ الْجِذْعِ فَقَدْ رَوَى الْبُخَارِىُّ أَنَّ النَّبِىَّ ﷺ كَانَ يَقُومُ يَوْمَ الْجُمُعَةِ إِلَى شَجَرَةٍ أَوْ نَخْلَةٍ فَقَالَتِ امْرَأَةٌ مِنَ الأَنْصَارِ أَوْ رَجُلٌ يَا رَسُولَ اللَّهِ أَلا نَجْعَلُ لَكَ مِنْبَرًا قَالَ «إِنْ شِئْتُمْ» فَجَعَلُوا لَهُ مِنْبَرًا فَلَمَّا كَانَ يَوْمُ الْجُمُعَةِ صَعِدَ إِلَى الْمِنْبَرِ فَأَنَّتِ النَّخْلَةُ أَنِينَ الصَّبِىِّ ثُمَّ نَزَلَ النَّبِىُّ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فَضَمَّهَا إِلَيْهِ."},{"type":"p","text":"وَقَدْ كَانَ الْحَسَنُ بنُ عَلِىٍّ رَضِىَ اللَّهُ عَنْهُما إِذَا ذَكَرَ هَذِهِ الْمُعْجِزَةَ يَقُولُ يَا مَعْشَرَ الْمُسْلِمِينَ الْخَشَبَةُ تَحِنُّ إِلَى رَسُولِ اللَّهِ ﷺ شَوْقًا إِلَى لِقَائِهِ فَأَنْتُمْ أَحَقُّ أَنْ تَشْتَاقُوا إِلَيْهِ."},{"type":"p","text":"الْكَرَامَةُ: أَمَّا الْكَرَامَةُ فَهِىَ أَمْرٌ خَارِقٌ لِلْعَادَةِ تَظْهَرُ عَلَى يَدِ الْمُؤْمِنِ الْمُسْتَقِيمِ بِطَاعَةِ اللَّهِ أَىِ الْوَلِىِّ وَبِذَلِكَ تَفْتَرِقُ الْكَرَامَاتُ عَنِ السِّحْرِ وَالشَّعْوَذَةِ كَمَا حَصَلَ لِسَيِّدَتِنَا مَرْيَمَ وَالِدَةِ سَيِّدِنَا عِيسَى عَلَيْهِمَا السَّلامُ كَانَتْ كُلَّمَا دَخَلَ عَلَيْهَا نَبِىُّ اللَّهِ زَكَرِيَا وَكَانَ زَوْجَ أُخْتِهَا وَجَدَ عِنْدَهَا فَاكِهَةَ الصَّيْفِ فِى الشِّتَاءِ وَفَاكِهَةَ الشِّتَاءِ فِى الصَّيْفِ قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿كُلَّمَا دَخَلَ عَلَيْهَا زَكَرِيَّا الْمِحْرَابَ وَجَدَ عِنْدَهَا رِزْقًا قَالَ يَا مَرْيَمُ أَنَّى لَكِ هَذَا قَالَتْ هُوَ مِنْ عِنْدِ اللَّهِ﴾ [سُورَةَ ءَالِ عِمْرَان/37]."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ تَعْرِيفُ الْمُعْجِزَةِ."},{"type":"p","text":"     (2) مَاذَا تُسَمَّى الْخَوَارِقُ الَّتِى تَحْصُلُ عَلَى أَيْدِى الأَوْلِيَاءِ."},{"type":"p","text":"     (3) إِلَى كَمْ قِسْمٍ تُقْسَمُ الْمُعْجِزَةُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (4) اذْكُرْ مَا رَوَاهُ الْبُخَارِىُّ فِى مُعْجِزَةِ حَنِينِ الْجِذْعِ."},{"type":"p","text":"     (5) مَاذَا كَانَ يَقُولُ الْحَسَنُ بنُ عَلِىٍّ عِنْدَ ذِكْرِ هَذِهِ الْمُعْجِزَةِ."},{"type":"p","text":"     (6) مَا هِىَ الْكَرَامَةُ وَمَا الدَّلِيلُ عَلَى وجُودِهَا مِنَ الْقُرْءَانِ."},{"type":"p","text":"     (7) اذْكُرْ إِحْدَى كَرَامَاتِ السَّيِّدَةِ مَرْيَمَ عَلَيْهَا السَّلامُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"الإِيـمَانُ بِمَا جَاءَ عَنْ النَّبِىِّ ﷺ (1)"},{"type":"p","text":"عَذَابُ الْقَبْرِ وَنَعِيمُهُ وَسُؤَالُ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَمَا يَنْطِقُ عَنِ الْهَوَى إِنْ هُوَ إِلَّا وَحْىٌ يُوْحَى﴾ [سُورَةَ النَّجْمِ]."},{"type":"p","text":"أَرْسَلَ اللَّهُ تَعَالَى سَيِّدَنَا مُحَمَّدَ بنَ عَبْدِ اللَّهِ بنِ عَبْدِ الْمُطَّلِبِ بِدِينِ الْحَقِّ وَأَمَرَهُ بِتَبْلِيغِهِ إِلَى النَّاسِ فَأَدَّى الأَمَانَةَ وَبَلَّغَ الرِّسَالَةَ بِكُلِّ صِدْقٍ وَشَجَاعَةٍ. "},{"type":"p","text":"وَكُلُّ شَىْءٍ أَخْبَرَ بِهِ النَّبِىُّ ﷺ هُوَ حَقٌّ وَصِدْقٌ سَوَاءٌ كَانَ مِنْ أُمُورِ الْحَلالِ وَالْحَرَامِ أَوْ قَصَصِ الأَنْبِيَاءِ أَوِ الأُمُورِ الَّتِى تَحْدُثُ فِى الْمُسْتَقبَلِ فِى الدُّنْيَا وَالآخِرَةِ."},{"type":"p","text":"فَمِنَ الأُمُورِ الَّتِى أَخْبَرَنَا عَنْهَا سَيِّدُنَا مُحَمَّدٌ ﷺ عَذَابُ الْقَبْرِ وَنَعِيمُهُ وَسُؤَالُ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ."},{"type":"p","text":"   (1) عَذَابُ الْقَبْرِ: يَجِبُ الإِيـمَانُ بِأَنَّ اللَّهَ يُعَذِّبُ الْكُفَّارَ جَمِيعَهُمْ فِى قُبُورِهِمْ فَيَأْمُرُ حَشَرَاتٍ فِى الأَرْضِ مُؤْذِيَةً أَنْ تَأْكُلَ أَجْسَادَهُمْ وَيَأْمُرُ الأَرْضَ فَتَنْطَبِقُ عَلَيْهِمْ فَتَكُونُ قُبورُهُمْ حُفْرَةً مِنْ حُفَرِ النَّارِ إِلَى غَيْرِ ذَلِكَ مِنْ أَنْوَاعِ النَّكَدِ وَالْعَذَابِ أَمَا الْمُسْلِمُونَ الْعُصَاةُ مِنْ أَهْلِ الْكَبَائِرِ الَّذِينَ مَاتُوا مِنْ غَيْرِ تَوْبَةٍ فَهُمْ قِسْمَانِ"},{"type":"p","text":"قِسْمٌ يُعَذِّبُهُمُ اللَّهُ فِى قُبورِهِمْ."},{"type":"p","text":"وَقِسْمٌ يُعْفِيهُمُ اللَّهُ مِنْ عَذَابِ الْقَبْرِ وَقَدْ يَكُونُ هَذَا الْعَفْوُ بِسَبَبِ اسْتِغْفَارِ مُسْلِمٍ حَىٍّ لَهُ أَوْ قِرَاءَةِ الْقُرْءَانِ لَهُ."},{"type":"p","text":"   (2) وَنَعِيمُ الْقَبْرِ: يَجِبُ الإِيـمَانُ بِأَنَّ اللَّهَ يُنْعِمُ عَلَى عِبَادِهِ الْمُؤْمِنِينَ الْمُتَّقِينَ فِى قُبُورِهِمْ وَمِنْ هَذَا النَّعِيمِ أَنْ تُنَوَّرَ قُبُورُهُمْ بِنُورٍ كَنُورِ الْقَمَرِ لَيْلَةَ الْبَدْرِ وَأَنْ تُوَسَّعَ سَبْعِينَ ذِرَاعًا فِى سَبْعِينَ ذِرَاعًا وَتُمْلَأَ نُورًا إِلَى غَيْرِ ذَلِكَ مِنْ أَنْوَاعِ النَّعِيمِ."},{"type":"p","text":"   (3) وَسُؤَالُ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ: وَيَجِبُ الإِيـمَانُ بِمُنْكَرٍ وَنَكِيرٍ وَهُمَا مَلَكَانِ أَسْوَدَانِ أَزْرَقَانِ يَسأَلانِ الْمَيِّتَ فِى قَبْرِهِ مَا كُنْتَ تَقُولُ فِى هَذَا الرَّجُلِ مُحَمَّدٍ فَإِنْ كَانَ مُؤْمِنًا يَقُولُ أَشْهَدُ أَنَهُ عَبْدُ اللَّهِ وَرَسُولُهُ وَإِنْ كَانَ مِنْ أَهْلِ الْكُفْرِ لا يَنْطِقُ بِهَا فَيَضْرِبَانِهِ بِمِطْرَقَةٍ بَيْنَ أُذُنَيْهِ لَوْ طُرِقَتْ بِهَا الْجِبَالُ لَذَابَتْ."},{"type":"p","text":"وَسُؤَالُ الْمَلَكَيْنِ يَحْصُلُ لِلْمُؤْمِنِ وَالْكَافِرِ وَلَكِنَّ الْمُؤْمِنَ الْكَامِلَ لا يَلْحَقُهُ فَزَعٌ وَلا انْزِعَاجٌ مِنْ سُؤَالِهِمَا لِأَنَ اللَّهَ يُثَبِّتُ قَلْبَهُ فَلا يَرْتَاعُ مِنْ مَنْظَرِهِمَا الْمُخِيفِ وَيُسْتَثْنَى مِنْ هَذَا السُّؤَالِ الأَنْبِيَاءُ وَالشُّهَدَاءُ وَالأَطْفَالُ وَهُمُ الَّذِينَ مَاتُوا دُونَ الْبُلُوغِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ دَلِيلًا مِنَ الْقُرْءَانِ عَلَى صِدْقِ النَّبِىِّ فِيمَا بَلَّغَهُ عَنِ اللَّهِ."},{"type":"p","text":"     (2) عَدِّدْ بَعْضَ مَا أَخْبَرَ عَنْهُ النَّبِىُّ."},{"type":"p","text":"     (3) لِمَنْ يَحْصُلُ عَذَابُ الْقَبْرِ."},{"type":"p","text":"     (4) مَا هُوَ حَالُ الْمُسْلِمِينَ الْعُصَاةِ مِنْ أَهْلِ الْكَبَائِرِ فِى قُبُورِهِمْ."},{"type":"p","text":"     (5) لِمَنْ يَحْصُلُ نَعِيمُ الْقَبْرِ."},{"type":"p","text":"     (6) عَمَّنْ يُسْأَلُ الْعَبْدُ فِى الْقَبْرِ وَمَنْ هُمَا مَلَكَا السُّؤَالِ."},{"type":"p","text":"     (7) لِمَنْ يَحْصُلُ سُؤَالُ الْمَلَكَيْنِ فِى الْقَبْرِ وَمَنْ يُسْتَثْنَى مِنَ السُّؤَالِ فِى الْقَبْرِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"الإِيـمَانُ بِمَا جَاءَ عَنْ النَّبِىِّ ﷺ (2)"},{"type":"p","text":"الْيَوْمُ الآخِرُ وَالْبَعْثُ وَالْحَشْرُ"},{"type":"p","text":""},{"type":"p","text":"مِمَّا أَخْبَرَنَا بِهِ النَّبِىُّ ﷺ وَيَجِبُ الإِيـمَانُ بِهِ الْيَوْمُ الآخِرُ وَالْبَعْثُ وَالْحَشْرُ."},{"type":"p","text":"الْيَوْمُ الآخِرُ هُوَ يَوْمُ الْقِيَامَةِ وَأَوَّلُهُ مِنْ خُرُوجِ النَّاسِ مِنْ قُبُورِهِمْ إِلَى اسْتِقْرَارِ أَهْلِ الْجَنَّةِ فِى الْجَنَّةِ وأَهْلِ النَّارِ فِى النَّارِ وَفِى ذَلِكَ الْيَوْمِ تَدْنُو الشَّمْسُ مِنْ رُؤُوسِ الْعِبَادِ وَتَحْصُلُ فِيهِ أَحْوَالٌ صَعْبَةٌ يَنْجُو مِنْهَا الْمُؤْمِنُونَ الأَتْقِيَاءُ وَيُجْمَعُ النَّاسُ لِلْحِسَابِ فَتُعْرَضُ عَلَيْهِمْ أَعْمَالُهُمْ سَوَاءٌ كَانَتْ خَيْرًا أَمْ شَرًّا وَتُوزَنُ أَعْمَالُهُمْ بِمِيزَانٍ فَتُوضَعُ الْحَسَنَاتُ فِى كَفَّةٍ وَالْسَّيِّئَاتُ فِى الْكَفَّةِ الأُخْرَى."},{"type":"p","text":"الْبَعْثُ وَهُوَ انْشِقَاقُ الْقُبُورِ وَخُرُوجُ النَّاسِ مِنْهَا لِلْحِسَابِ بَعْدَ إِعَادَةِ الأَجْسَادِ الَّتِى أَكَلَهَا التُّرَابُ وَهِىَ أَجْسَادُ غَيْرِ الأَنْبِيَاءِ وَالْشُهَدَاءِ فَهَؤُلاءِ لا يَأْكُلُ التُّرَابُ أَجْسَادَهُمْ وَكَذَلِكَ بَعْضُ الأَوْلِيَاءِ لا يَأْكُلُ التُّرَابُ أَجْسَادَهُمْ."},{"type":"p","text":"الْحَشْرُ وَيَكُونُ بَعْدَ الْبَعْثِ حَيْثُ يُجْمَعُ النَّاسُ إِلَى مَكَانٍ لِيُسْأَلُوا عَنْ أَعْمَالِهمُ الَّتِى عَمِلُوهَا وَهَذَا الْمَكَانُ هُوَ الأَرْضُ الْمُبَدَّلَةُ فَهَذِهِ الأَرْضُ الَّتِى نَعِيشُ عَلَيْهَا تُدَكُّ يَوْمَ الْقِيَامَةِ وَيَخْلُقُ اللَّهُ أَرْضًا أُخْرَى لا جِبَالَ فِيهَا وَلا وِدْيَانَ. والنَّاسُ فِى الْحَشْرِ يَكُونُونَ عَلَى ثَلاثَةِ أَقْسَامٍ "},{"type":"p","text":"   (1) قِسْمٌ يُحْشَرُونَ طَاعِمِينَ رَاكِبِينَ كَاسِينَ وَهُمُ الأَتْقِيَاءُ أَىِ الَّذِينَ كَانُوا فِى الدُّنْيَا يُؤَدُّونَ الْوَاجِبَاتِ وَيَجْتَنِبُونَ الْمُحَرَّمَاتِ."},{"type":"p","text":"   (2) وَقِسْمٌ يُحْشَرُونَ حُفَاةً عُرَاةً وَهُمُ الْمُسْلِمُونَ مِنْ أَهْلِ الْكَبَائِرِ."},{"type":"p","text":"   (3) وَقِسْمٌ يُحْشَرُونَ وَهُمُ يُجَرُّونَ عَلَى وُجُوهِهِمْ وَهَؤُلاءِ هُمُ الْكُفَّارُ وَقَدْ وَرَدَ فِى عَذَابِ الْمُتَكَبِّرِينَ الَّذِينَ يَتَكَبَّرُونَ عَلَى عِبَادِ اللَّهِ أَنَّهُمْ يُحْشَرُونَ بِحَجْمِ النَّمْلِ الصَّغِيرِ بِصُورَةِ بَنِى ءَادَمَ فَيَدُوسُهُمُ النَّاسُ بِأَقْدَامِهِمْ إِهَانَةً لَهُمْ وَلا يَمُوتُونَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ الْيَوْمُ الآخِرُ."},{"type":"p","text":"     (2) بِمَ تُوزَنُ أَعْمَالُ الْعِبَادِ يَوْمَ الْقِيَامَةِ."},{"type":"p","text":"     (3) مَا هُوَ الْبَعْثُ."},{"type":"p","text":"     (4) أَجْسَادُ مَنْ لا يَأْكُلُهَا التُّرَابُ."},{"type":"p","text":"     (5) مَا هُوَ الْحَشْرُ وَأَيْنَ يُحْشَرُ النَّاسُ."},{"type":"p","text":"     (6) مَا هِىَ صِفَةُ أَرْضِ الْحَشْرِ وَعَلَى كَمْ قِسْمٍ يَكُونُ الْحَشْرُ."},{"type":"p","text":"     (7) كَيْفَ يُحْشَرُ الأَتْقِيَاءُ وَالْعُصَاةُ."},{"type":"p","text":"     (8) كَيْفَ يُحْشَرُ الْكُفَّارُ وَمَاذَا وَرَدَ فِى عَذَابِ الْمُتَكَبِّرِينَ عَلَى عِبَادِ اللَّهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"الإِيـمَانُ بِمَا جَاءَ عَنِ النَّبِىِّ ﷺ (3)"},{"type":"p","text":"الصِّرَاطُ وَالْحَوْضُ وَالشَّفَاعَةُ"},{"type":"p","text":""},{"type":"p","text":"مِنَ الأُمُورِ الَّتى أَخْبَرَ عَنْهَا النَّبِىُّ ﷺ وَيَجِبُ الإِيـمَانُ بِهَا الصِّرَاطُ وَالْحَوْضُ وَالشَّفَاعَةُ."},{"type":"p","text":"الصِّرَاطُ: هُوَ جِسْرٌ يُمَدُّ فَوْقَ جَهَنَّمَ يَرِدُهُ النَّاسُ أَحَدُ طَرَفَيْهِ فِى الأَرْضِ الْمُبَدَّلَةِ وَالطَّرَفُ الآخَرُ فِيمَا يَلِى الْجَنَّةَ بَعْدَ النَّارِ فَيَأْتِى النَّاسُ لِلْمُرُورِ عَلَيْهِ فَالْكُفَّارُ لا يَجْتَازُونَهُ أَمَّا الْمُؤْمِنُونَ فَهُمْ عَلَى قِسْمَيْنِ"},{"type":"p","text":"   (1) قِسْمٌ لا يَدُوسُونَهُ بِالْمَرَّةِ إِنَّمَا يَمُرُّونَ فِى هَوَائِهِ طَائِريِنَ."},{"type":"p","text":"   (2) وَقِسْمٌ يَدُوسُونَهُ فَمِنْهُمْ مَنْ يَقَعُ فِى النَّارِ وَمِنْهُمْ مَنْ يُنَجِّيهِمُ اللَّهُ فَيَخْلُصُونَ مِنْهَا."},{"type":"p","text":"الْحَوْضُ: وَهُوَ مَكَانٌ أَعَدَّ اللَّهُ فِيهِ شَرَابًا لِأَهْلِ الْجَنَّةِ يَشْرَبُونَ مِنْهُ قَبْلَ دُخُولِهِمُ الْجَنَّةَ وَلِكُلِّ نَبِىٍّ حَوْضٌ يَشْرَبُ مِنْهُ الْمُؤْمِنُونَ مِنْ أُمَّتِهِ وَأَكْبَرُ الأَحْوَاضِ حَوْضُ نَبِيِّنَا مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ يَنْصَبُّ فِيهِ مِنْ مَاءِ الْجَنَّةِ وَمَنْ شَرِبَ مِنْهُ لا يَعْطَشُ بَعْدَ ذَلِكَ أَبَدًا وَيَكُونُ شَرَابُهُمْ فِى الْجَنَّةِ لِلتَّلَذُّذِ. "},{"type":"p","text":"الشَّفَاعَةُ: الشَّفَاعَةُ هِىَ طَلَبُ الْخَيْرِ مِنْ الْغَيْرِ لِلْغَيْرِ وَمِمَّنْ يَشْفَعُ يَوْمَ الْقِيَامَةِ الأَنْبِيَاءُ وَالْعُلَمَاءُ الْعَامِلُونَ وَالْمَلائِكَةُ وَكَذَلِكَ الطِّفْلُ يَشْفَعُ لِأَبَوَيْهِ الْمُسْلِمَيْنِ وَالشَّهِيدُ يَشْفَعُ لِسَبْعِينَ مِنْ أَهْلِ بَيْتِهِ وَالشَّفَاعَةُ تَكُونُ لِلْمُؤْمِنِينَ الْعُصَاةِ مِنْ أَهْلِ الْكَبَائِرِ الَّذِينَ مَاتُوا مِنْ غَيْرِ أَنْ يَتُوبُوا قَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «شَفَاعَتِى لِأَهْلِ الْكَبَائِرِ مِنْ أُمَّتِى» رَوَاهُ أَبُو دَاوُدَ، وَلا شَفَاعَةَ يَوْمَ الْقِيَامَةِ لِأَىِّ كَاِفرٍ لِأَنَّ اللَّهَ تَعَالَى قَالَ ﴿وَلا يَشْفَعُونَ إِلَّا لِمَنِ ارْتَضَى﴾ [سُورَةَ الأَنْبِيَاء/28] أَىْ إِلَّا لِمَنْ مَاتَ عَلَى الإِيـمَانِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ الصِّرَاطُ وَهَلْ يَجْتَازُهُ الْكُفَّارُ."},{"type":"p","text":"     (2) الْمُؤْمِنُونَ عِنْدَ عُبُورِ الصِّرَاطِ عَلَى كَمْ قِسْمٍ يَكُونُونَ."},{"type":"p","text":"     (3) مَا هُوَ الْحَوْضُ وَمَنْ يَشْرَبُ مِنْهُ."},{"type":"p","text":"     (4) أَىُّ الأَحْوَاضِ أَكْبَرُ وَمِنْ أَيْنَ يَنْصَبُّ الْمَاءُ فِيهِ."},{"type":"p","text":"     (5) مَا هِىَ الشَّفَاعَةُ وَمَنْ يَشْفَعُ يَوْمَ الْقِيَامَةِ."},{"type":"p","text":"     (6) لِمَنْ تَكُونُ الشَّفَاعَةُ يَوْمَ الْقِيَامَةِ، اذْكُرْ حَدِيِثًا يَدُلُّ عَلَى ذَلِكَ."},{"type":"p","text":"     (7) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَهُ لا شَفَاعَةَ يَوْمَ الْقِيَامَةِ لِأَىِّ كَاِفرٍ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى عَشَرَ"},{"type":"p","text":"الإِيـمَانُ بِمَا جَاءَ عَنْ النَّبِىِّ ﷺ (4)"},{"type":"p","text":"الْجَنَّةُ وَالنَّارُ"},{"type":"p","text":""},{"type":"p","text":"وَمِنَ الأُمُورِ الَّتِى أَخْبَرَ عَنْهَا النَّبِىُّ ﷺ وَيَجِبُ الإِيـمَانُ بِهَا الْجَنَّةُ وَالنَّارُ."},{"type":"p","text":"   (1) الْجَنَّةُ هِىَ دَارُ السَّلامِ وَالنَّعِيمِ وَالسُّرُورِ أَعَدَّهَا اللَّهُ لِلْمُؤْمِنِينَ فِيهَا أَنْهَارٌ مِنْ عَسَلٍ مُصَفًّى وَمِنْ لَبَنٍ وَمِنْ خَمْرٍ لَيْسَ كَخَمْرِ الدُّنْيَا الَّذِى يُذْهِبُ الْعَقْلَ وَغَيْرُ ذَلِكَ مِنَ النَّعِيمِ الْمُقِيمِ."},{"type":"p","text":"وَالنَّعِيمُ فِيهَا حِسِّىٌّ بِالْجَسَدِ وَالرُّوحِ وَالْجَنَّةُ دَرَجَاتٌ بَعْضُهَا أَعْلَى مِنْ بَعْضٍ وَأَعْلَى دَرَجَةٍ هِىَ دَرَجَةُ الأَنْبِيَاءِ. وَأَهْلُ الْجَنَّةِ لا يَحْزَنُونَ وَلا يَمْرَضُونَ وَلا يَهْرَمُونَ وَلا يَمُوتُونَ خَالِدُونَ فِيهَا وَلا يَخْرُجُونَ مِنْهَا أَبَدًا وَهُمْ فِى نَعِيمٍ دَائِمٍ لا نِهايَةَ لَهُ."},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ «أَلا هَلْ مُشَمِّرٌ لِلْجَنَّةِ فَإِنَّ الْجَنَّةَ لا خَطَرَ لَهَا هِىَ وَرَبِّ الْكَعْبَةِ نُورٌ يَتَلَأْلَأُ وَرَيْحَانَةٌ تَهْتَزُّ وَقَصْرٌ مَشِيدٌ وَنَهْرٌ مُطَّرِدٌ وَفَاكِهَةٌ كَثِيرَةٌ نَضِيجَةٌ وَزَوْجَةٌ حَسْنَاءُ جَمِيلَةٌ وَحُلَلٌ كَثِيرَةٌ فِى مُقَامٍ أَبَدِىٍّ فِى حُبْرَةٍ وَنَضْرَةٍ فِى دَارٍ عَاِليَةٍ سَلِيمَةٍ بَهِيَّةٍ» رَوَاهُ ابْنُ حِبَّانَ."},{"type":"p","text":"   (2) النَّارُ أَىْ جَهَنَّمُ يَجِبُ الإِيـمَانُ بِأَنَّهَا دَارُ الشَّقَاءِ وَالْعَذَابِ وَأَنَّهَا لا تَفْنَى أَعَدَّهَا اللَّهُ لِلْكُفَّارِ الَّذِينَ اخْتَارُوا الْكُفْرَ وَأَعْرَضُوا عَنِ الإِسْلامِ وَالنَّارُ فِيهَا عَذَابٌ حِسِّىٌّ حَقِيقِىٌّ وَحَرُّهَا أَشَدُّ بِكَثِيرٍ مِنْ حَرِّ الدُّنْيَا وَبَرْدُهَا أَشَدُّ بِكَثِيرٍ مِنْ بَرْدِ الدُّنْيَا وَهِىَ مَوْجُودَةٌ الآنَ وَمَكَانُهَا تَحْتَ الأَرْضِ السَّابِعَةِ. وَالْكُفَّارُ خَالِدُونَ فِيهَا أَبَدًا لا يَخْرُجُونَ مِنْهَا."},{"type":"p","text":"وَأَمَا عُصَاةُ الْمُسْلِمِينَ مِنْ أَهْلِ الْكَبَائِرِ أَىِ الَّذِينَ كَانُوا يَفْعَلُونَ الْمَعَاصِىَ الْكَبِيرةَ وَمَاتُوا مِنْ غَيْرِ تَوْبَةٍ فَهَؤُلاءِ عَلَى قِسْمَيْنِ"},{"type":"p","text":"   (1) قِسْمٌ يُعْفِيهُمُ اللَّهُ مِنْ عَذَابِ النَّارِ بِشَفَاعَةِ النَّبِىِّ ﷺ أَوْ غَيْرِ ذَلِكَ وَيُدْخِلُهُمُ الْجَنَّةَ بِرَحْمَتِهِ بِلا عَذَابٍ."},{"type":"p","text":"   (2) وَقِسْمٌ يُعَذِبُهُمُ اللَّهُ فَتْرَةً فِى نَارِ جَهَنَّمَ ثُمَّ يُخْرِجُهُمْ مِنْهَا وَيُدْخِلُهُمُ الْجَنَّةَ لِأَنَهُمْ مَاتُوا عَلَى الإِيـمَان. "},{"type":"p","text":"   قَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ لَعَنَ الْكَافِرِينَ وَأَعَدَّ لَهُمْ سَعِيرًا خَالِدِينَ فِيهَا أَبَدًا لَّا يَجِدُونَ وَلِيًّا وَلا نَصِيرًا﴾ [سُورَةَ الأَحْزَاب]."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ الْجَنَّةُ وَلِمَنْ أَعَدَّهَا اللَّهُ."},{"type":"p","text":"     (2) مَاذَا يُقَالُ عَنِ النَّعِيمِ فِى الْجَنَّةِ."},{"type":"p","text":"     (3) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى وَصْفِ الْجَنَّةِ."},{"type":"p","text":"     (4) لِمَنْ أَعَدَّ اللَّهُ النَّارَ وَأَيْنَ هِىَ الآنَ وَمَنْ يُخَلَّدُ فِيهَا."},{"type":"p","text":"     (5) مَا هُوَ حَالُ الْعُصَاةِ مِنَ الْمُسْلِمِينَ مِمَّنْ مَاتُوا مِنْ غَيْرِ تَوْبَةٍ يَوْمَ الْقِيَامَةِ."},{"type":"p","text":"     (6) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى خُلُودِ الْكُفَّارِ فِى النَّارِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثَ عَشَرَ"},{"type":"p","text":"أَبْوَابُ الْكُفْرِ وَأَنْوَاعُ الْكَافِرِينَ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيلِ اللَّهِ ثُمَّ مَاتُوا وَهُمْ كُفَّارٌ فَلَنْ يَغْفِرَ اللَّهُ لَهُمْ﴾ [سُورَةَ مُحَمَّد/34]."},{"type":"p","text":"الْكُفْرُ نَقِيضُ الإِيـمَانِ كَمَا أَنَّ الْظَلامَ نَقِيضُ النُّورِ وَهُوَ ثَلاثَةُ أَبْوَابٍ التَّشْبِيهُ وَالتَّكْذِيبُ وَالتَّعْطِيلُ."},{"type":"p","text":"   (1) كُفْرُ التَّشْبِيهِ أَىْ تَشْبِيهُ اللَّهِ بِخَلْقِهِ كَالَّذِى يَصِفُ اللَّهَ بِأَنَهُ جَالِسٌ أَوْ أَنَّ لَهُ شَكْلًا وَهَيْئَةً أَوْ يَصِفُهُ بِأَنَّ لَهُ مَكَانًا أَوْ جِهَةً. "},{"type":"p","text":"   (2) كُفْرُ التَّكْذِيبِ أَىْ تَكْذِيبُ مَا وَرَدَ فِى الْقُرْءَانِ الْكَرِيمِ أَوْ مَا جَاءَ بِهِ الرَّسُولُ ﷺ عَلَى وَجْهٍ ثَابِتٍ كَإِنْكَارِ بَعْثِ الأَجْسَادِ وَالأَرْوَاحِ مَعًا وَإِنْكَارِ وُجُوبِ الصَّلاةِ وَالصِّيَامِ وَالزَّكَاةِ."},{"type":"p","text":"   (3) كُفْرُ التَّعْطِيلِ وَهُوَ نَفْىُ وُجُودِ اللَّهِ تَعَالَى وَهُوَ أَشَدُّ الْكُفْرِ."},{"type":"p","text":"وَالْكَافِرُ نَوْعَانِ إِمَّا كَافِرٌ أَصْلِىٌّ أَوْ مُرْتَدٌّ عَنِ الإِسْلامِ."},{"type":"p","text":"فَالْكَافِرُ الأَصْلِىُّ هُوَ مَنْ نَشَأَ مِنْ أَبَوَيْنِ كَافِرَيْنِ عَلَى الْكُفْرِ وَبَلَغَ عَلَى الْكُفْرِ."},{"type":"p","text":"أَمَّا الْمُرْتَدُّ فَهُوَ الشَّخْصُ الَّذِى كَانَ مُسْلِمًا وَوَقَعَ فِى أَحَدِ أَنْوَاعِ الرِّدَّةِ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿قُلْ أَبِاللَّهِ وَءَايَاتِهِ وَرَسُولِهِ كُنْتُمْ تَسْتَهْزِؤُونَ لا تَعْتَذِرُوا قَدْ كَفَرْتُمْ بَعْدَ إِيـمَانِكُمْ﴾ [سُورَةَ التَّوْبَة]."},{"type":"p","text":"وَالرِّدَّةُ هِىَ الْخُرُوجُ عَنِ الإِسْلامِ فَيَجِبُ عَلَى كُلِّ مُسْلِمٍ أَنْ يَحْفَظَ إِسْلامَهُ وَيَصُونَهُ عَنْ هَذِهِ الرِّدَّةِ الَّتِى تُفْسِدُهُ وَتُبْطِلُهُ وَتَقْطَعُهُ وَالعِياذُ بِاللَّهِ تَعَالَى."},{"type":"p","text":"أَقْسَامُ الرِّدَّةِ: الرِّدَّةُ ثَلاثَةُ أَقْسَامٍ كَمَا قَسَّمَهَا الْعُلَمَاءُ كُفْرٌ اعْتِقَادِىٌّ وَكُفْرٌ فِعْلِىٌّ وَكُفْرٌ قَوْلِىٌّ وَكلُّ قِسْمٍ مِنْ أَقْسَامِ الرِّدَّةِ يَدْخُلُ تَحْتَهُ شُعَبٌ كَثِيرَةٌ."},{"type":"p","text":"   (1) الْكُفْرُ الِاعْتِقَادِىُّ كَنَفْىِ وُجُودِ اللَّهِ تَعَالَى أَوِ اعْتِقَادِ أَنَّ اللَّهَ عَاجِزٌ أَوْ جَاهِلٌ أَوِ اعْتِقَادِ أَنَّ اللَّهَ جِسْمٌ أَوْ ضَوْءٌ أَوْ رُوحٌ أَوْ أَنَّهُ يَتَّصِفُ بِصِفَةٍ مِنْ صِفَاتِ الْخَلْقِ وَالْعِيَاذُ بِاللَّهِ تَعَالَى أَوِ اعْتِقَادِ أَنَّ شُرْبَ الْخَمْرِ حَلالٌ أَوْ أَنَّ السَّرِقَةَ حَلالٌ أَوِ اعْتِقَادِ أَنَّ اللَّهَ لَمْ يَفْرِضِ الصَّلَواتِ الْخَمْسَ أَوْ صِيَامَ شَهْرِ رَمَضَانَ أَوِ الزَّكَاةَ أَوِ الْحَجَّ."},{"type":"p","text":"   (2) الْكُفْرُ الفِعْلِىُّ كَإِلْقَاءِ الُمُصْحَفِ أَوْ أَوْرَاقِ الْعُلُومِ الشَّرْعِيَّةِ عَمْدًا فِى الْقَاذُورَاتِ أَوِ السُّجُودِ لِصَنَمٍ أَوْ لِشَمْسٍ أَوْ مَخْلُوقٍ ءَاخَرَ عَلَى وَجْهِ الْعِبَادَةِ لَهُ وَكَكِتَابَةِ الآيَاتِ الْقُرْءَانِيَّةِ بِالْبَوْلِ."},{"type":"p","text":"   (3) الْكُفْرُ الْقَوْلِىُّ كَسَبِّ اللَّهِ تَعَالَى أَوْ سَبِّ نَبِىٍّ مِنَ الأَنْبِيَاءِ أَوْ مَلَكٍ مِنَ الْمَلائِكَةِ أَوْ سَبِّ الإِسْلامِ أَوِ الْقُرْءَانِ أَوِ الِاسْتِهْزَاءِ بِالصَّلاةِ أَوِ الصِّيَامِ أَوِ الِاعْتِرَاضِ عَلَى اللَّهِ."},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ «إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ لا يَرَى بِهَا بَأْسًا يَهْوِى بِهَا فِى النَّارِ سَبْعِينَ خَرِيفًا» رَوَاهُ التِّرْمِذِىُّ، أَىْ مَسَافَةَ سَبْعِينَ عَامًا فِى النُّزُولِ وَذَلِكَ مُنْتَهَى قَعْرِ جَهَنَّمَ وَهُوَ خَاصٌّ بِالْكُفَّارِ وَهَذَا الْحَدِيثُ دَلِيلٌ عَلَى أَنَّهُ لا يُشْتَرَطُ فِى الْوُقُوعِ فِى الْكُفْرِ مَعْرِفَةُ الْحُكْمِ وَلا انْشِرَاحُ الصَّدْرِ وَلا اعْتِقَادُ مَعْنَى اللَّفْظِ وَلا نِيَّةُ الْكُفْرِ."},{"type":"p","text":"وَقَالَ رَسُولُ اللَّهِ ﷺ «أَكْثَرُ خَطَايَا ابْنِ ءَادَمَ مِنْ لِسَانِهِ» رَوَاهُ الطَّبَرَانِىُّ."},{"type":"p","text":"وَالْقَاعِدَةُ أَنَّ كُلَّ اعْتِقَادٍ أَوْ فِعْلٍ أَوْ قَوْلٍ يَدُلُّ عَلَى اسْتِخْفَافٍ بِاللَّهِ أَوْ كُتُبِهِ أَوْ رُسُلِهِ أَوْ مَلائِكَتِهِ أَوْ شَعَائِرِهِ أَوْ مَعَالِمِ دِينِهِ أَوْ أَحْكَامِهِ أَوْ وَعْدِهِ أَوْ وَعِيدِهِ كُفْرٌ فَلْيَحْذَرِ الإِنْسَانُ مِنْ ذَلِكَ جَهْدَهُ."},{"type":"p","text":"فَائِدَةٌ. قَالَ الْعُلَمَاءُ إِنْكَارُ مَا عُلِمَ مِنَ الدِّينِ بِالضَّرُورَةِ كُفْرٌ وَمَعْنَى كَوْنِ الأَمْرِ مَعْلُومًا مِنَ الدِّينِ بِالضَّرُورَةِ أَنْ يَكُونَ هَذَا الأَمْرُ مَعْلُومًا بَيْنَ الْمُسْلِمِينَ عُلَمَائِهِمْ وَعَوَامِّهِمْ لَيْسَ أَمْرًا لا يَعْرِفِهُ إِلَّا الْعُلَمَاءُ وَذَلِكَ كَوُجُوبِ الصَّلَوَاتِ الْخَمْسِ وَوُجُوبِ صَوْمِ رَمَضَانَ وَحِلِّ الْبَيْعِ وَالشِّرَاءِ وَحُرْمَةِ شُرْبِ الْخَمْرِ وَالسَّرِقَةِ فَإِنَّ هَذِهِ الأُمُورَ لا تَخْفَى عَلَى الْمُسْلِمِ مَهْمَا كَانَ جَاهِلًا."},{"type":"p","text":"وَلْيُعْلَمْ أَنَّ مَنْ كَفَرَ لا يَرْجِعُ إِلَى الإِسْلامِ إِلَّا بِالنُّطْقِ بِالشَّهَادَتَيْنِ بَعْدَ رُجُوعِهِ عَنِ الْكُفْرِ فَلا يَرْجِعُ الْكَافِرُ إِلَى الإِسْلامِ بِقَوْلِ أَسْتَغْفِرُ اللَّهَ بَلْ يَزِيدُهُ ذَلِكَ كُفْرًا وَلا تَنْفَعُهُ الشَّهَادَتَانِ مَا دَامَ عَلَى كُفْرِهِ لَمْ يَرْجِعْ عَنْهُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَّ اللَّهَ لا يَغْفِرُ الْكُفْرَ لِمَنْ مَاتَ عَلَيْهِ."},{"type":"p","text":"     (2) مَا هُوَ الْكُفْرُ وَمَا هِىَ أَبْوَابُهُ."},{"type":"p","text":"     (3) مَا هُوَ كُفْرُ التَّشْبِيهِ."},{"type":"p","text":"     (4) مَا هُوَ كُفْرُ التَّكْذِيبِ."},{"type":"p","text":"     (5) مَا هُوَ كُفْرُ التَّعْطِيلِ."},{"type":"p","text":"     (6) كَمْ نَوْعًا الْكُفَّارُ."},{"type":"p","text":"     (7) مَنْ هُوَ الْكَافِرُ الأَصْلِىُّ وَمَنْ هُوَ الْمُرْتَدُّ."},{"type":"p","text":"     (8) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَلَى ثُبُوتِ حُكْمُ الرِّدَّةِ عَلَى مَنِ اسْتَهْزَأَ بِاللَّهِ أَوْ رَسُولِهِ."},{"type":"p","text":"     (9) مَا هِىَ الرِّدَّةُ وَكَمْ قِسْمًا هِىَ."},{"type":"p","text":"     (10) اذْكُرْ بَعْضَ الأَمْثِلَةِ عَلَى الْكُفْرِ الِاعْتِقَادِىِّ."},{"type":"p","text":"     (11) اذْكُرْ بَعْضَ الأَمْثِلَةِ عَلَى الْكُفْرِ الْفِعْلِىِّ."},{"type":"p","text":"     (12) اذْكُرْ بَعْضَ الأَمْثِلَةِ عَلَى الْكُفْرِ الْقَوْلِىِّ."},{"type":"p","text":"     (13) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِيهِ دَلِيلٌ عَلَى أَنَّهُ لا يُشْتَرَطُ فِى الْوُقُوعِ فِى الْكُفْرِ مَعْرِفَةُ الْحُكْمِ."},{"type":"p","text":"     (14) كَيْفَ يَرْجِعُ مَنْ كَفَرَ إِلَى الإِسْلامِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعَ عَشَرَ"},{"type":"p","text":"الإِيـمَانُ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ تَعَالَى ﴿إِنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾ [سُورَةَ الْقَمَرِ/49]."},{"type":"p","text":"وَقَالَ ﷺ «الإِيـمَانُ أَنْ تُؤْمِنَ بِاللَّهِ وَمَلائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الآخِرِ وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ» رَوَاهُ مُسْلِمٌ."},{"type":"p","text":"قَدْ عَرَضْنَا فِى الدُّرُوسِ السَّابِقَةِ بَعْضَ الشُّرُوحِ لِمَا وَرَدَ فِى هَذَا الْحَدِيثِ وَهَذَا مِمَّا أَخْبَرَ عَنْهُ النَّبِىُّ ﷺ وَيَجِبُ التَّصْدِيقُ بِهِ."},{"type":"p","text":"وَالإِيمَانُ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ مَعْنَاهُ الإِيـمَانُ بِأَنَّ كُلَّ مَا دَخَلَ فِى الْوُجُودِ مِنْ خَيْرٍ وَشَرٍّ هُوَ بِتَقْدِيرِ اللَّهِ الأَزَلِىِّ فَالْخَيْرُ مِنْ أَعْمَالِ الْعِبَادِ بِتَقْدِيرِ اللَّهِ وَمَحَبَّتِهِ وَرِضَاهُ، وَالشَّرُّ مِنْ أَعْمَالِ الْعِبَادِ بِتَقْدِيرِ اللَّهِ وَخَلْقِهِ وَعِلْمِهِ وَلَكِنْ لَيْسَ بِمَحَبَّتِهِ وَلا بِرِضَاهُ."},{"type":"p","text":"   فَائِدَةٌ. قَالَ رَسُولُ اللَّهِ ﷺ لِابْنِ عَبَّاسٍ رَضِىَ اللَّهُ عَنْهُمَا «وَاعْلَمْ أَنَّ الأُمَّةَ لَوِ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوكَ بِشَىْءٍ لَمْ يَنْفَعُوكَ إِلَّا بِشَىْءٍ قَدْ كَتَبَهُ اللَّهُ لَكَ وَلَوِ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوكَ بِشَىْءٍ لَمْ يَضُرُّوكَ إِلَّا بِشَىْءٍ قَدْ كَتَبَهُ اللَّهُ عَلَيْكَ رُفِعَتِ الأَقْلامُ وَجَفَّتِ الصُّحُفُ» رَوَاهُ التِّرْمِذِىُّ وَقَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «كُلُّ شَىْءٍ بِقَدَرٍ حَتَى الْعَجْزُ وَالْكَيْسُ» رَوَاهُ مُسْلِمٌ، وَالْعَجْزُ هُوَ الْغَبَاءُ وَالْكَيْسُ الذَّكَاءُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"   (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الإِيـمَانِ بِالْقَدَرِ."},{"type":"p","text":"   (2) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ عَنِ الإِيـمَانِ بِالْقَدَرِ."},{"type":"p","text":"   (3) مَا مَعْنَى الإِيـمَانِ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ."},{"type":"p","text":"   (4) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ يَدُلُّ عَلَى أَنَّ اللَّهَ خَالِقُ النَّفْعِ وَالضَّرَرِ."},{"type":"p","text":"   (5) اذْكُرْ حَدِيثًا نَبَوِيًّا يَدُلُّ عَلَى أَنَّ كُلَّ شَىْءٍ بِتَقْدِيرِ اللَّهِ."},{"type":"p","text":""}],"paragraphCount":299,"wordCount":4848,"readingMinutes":27,"description":"المحتوى الكامل لـ فَصْلُ الْعَقَائِدِ من الجزء الخامس، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الْخَامِسُ فَصْلُ الْعَقَائِدِ فَصْلُ الْعَقَائِدِ\n\nالدَّرْسُ الأَوَّلُ\nالْعَقِيـدَةُ الْحَقَّـةُ\n\nقَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُّسْلِمُونَ﴾ [سُورَةَ ءَالِ عِمْرَان/102].\nالدِّينُ الإِسْلامِىُّ: الدِّينُ الإِسْلامِىُّ هُوَ الدِّينُ الْحَقُّ الَّذِى تُؤَيِّدُهُ الْعُقُولُ السَّلِيمَةُ الْمُنَاسِبُ لِكُلِّ زَمَانٍ وَهُوَ دِينُ جَمِيعِ الأَنْبِيَاءِ مِنْ أَوَّلِهِمْ ءَادَمَ إِلَى ءَاخِرِهِمْ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِمْ أَجْمَعِينَ وَسَلَّمَ الَّذِينَ أَرْسَلَهُمُ اللَّهُ لِهِدَايَةِ النَّاسِ إِلَى الْخَيْرِ وَالصَّلاحِ وَإِرْشَادِهِمْ إِلَى تَقْوَى اللَّهِ تَعَالَى وَالتَّمَسُّكِ بِهَذَا الدِّينِ إِلَى ءَاخِرِ الْعُمُرِ.\nالتَّقْوَى: تَقْوَى اللَّهِ تَكُونُ بِأَدَاءِ مَا افْتَرَضَ اللَّهُ تَعَالَى وَاجْتِنَابِ مَا حَرَّمَ فَمَنْ فَعَلَ ذَلِكَ يَكُونُ تَقِيًّا وَأَوَّلُ هَذِهِ الْوَاجِبَاتِ مَعْرِفَةُ اللَّهِ تَعَالَى وَمَعْرِفَةُ رَسُولِهِ مُحَمَّدٍ ﷺ مَعَ التَّصْدِيقِ بِذَلِكَ. \nالنُّطْقُ بِالشَّهَادَتَيْنِ: لا يَكُونُ الإِيـمَانُ مَقْبُولًا بِدُونِ النُّطْقِ بِالشَّهَادَتَيْنِ بِالنِّسْبَةِ لِلْكَافِرِ إِذَا أَرَادَ الدُّخُولَ فِى الإِسْلامِ أَمَّا الْمُسْلِمُ فَيَجِبُ أَنْ يَنْطِقَ بِالشَّهَادَتَيْنِ فِى كُلِّ صَلاةٍ لِصِحَّةِ الصَّلاةِ. وَالشَّهَادَتَانِ هُمَا أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ ﷺ.\nمَعْنَى الشَّهَادَتَيْنِ: وَمَعْنَى شَهَادَةِ أَنْ لا إِلَهَ إِلَّا اللَّهُ أَعْتَرِفُ بِلِسَانِى وَأَعْتَقِدُ بِقَلْبِى أَنْ لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ تَعَالَى.\nوَمَعْنَى شَهَادَةِ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ أَعْتَرِفُ بِلِسَانِى وَأُذْعِنُ بِقَلْبِى أَنَّ سَيِّدَنَا مُحَمَّدَ بنَ عَبْدِ اللَّهِ ﷺ مُرْسَلٌ مِنْ عِنْدِ اللَّهِ إِلَى كَافَّةِ الْعَالَمِينَ مِنْ إِنْسٍ وَجِنٍّ صَادِقٌ فِى كُلِّ مَا يُبَلِّغُهُ عَنِ اللَّهِ تَعَالَى لِيُؤْمِنُوا بِشَرِيعَتِهِ.\nالْمُرَادُ بِالشَّهَادَتَيْنِ: وَالْمُرَادُ بِالشَّهَادَتَيْنِ نَفْىُ الأُلُوهِيَّةِ عَمَّا سِوَى اللَّهِ وَإِثْبَاتُهَا لِلَّهِ تَعَالَى مَعَ الإِقْرَارِ بِرِسَالَةِ سَيِّدِنَا مُحَمَّدٍ ﷺ.\nقَالَ اللَّهُ تَعَالَى ﴿وَمَنْ لَّمْ يُؤْمِنْ بِاللَّهِ وَرَسُولِهِ فَإِنَّا أَعْتَدْنَا لِلْكَافِرِينَ سَعِيرًا﴾ [سُورَةَ الْفَتْح/13].\n \n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا الأَمْرُ بِالثَّبَاتِ عَلَى الإِسْلامِ.\n     (2) مَا هُوَ دِينُ كُلِّ الأَنْبِيَاءِ.\n     (3) لِمَ أَرْسَلَ اللَّهُ الأَنْبِيَاءَ.\n     (4) مَا مَعْنَى التَّقْوَى وَمَا هُوَ أَوَّلُ الْوَاجِبَاتِ.\n     (5) مَا مَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ.\n     (6) مَا مَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\n     (7) مَا الْمُرَادُ بِالشَّهَادَتَيْنِ.\n     (8) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى وُجُوبِ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ.\n\nالدَّرْسُ الثَّانِى\nمَنْ هُوَ الْمُكَلَّفُ\n\nالْمُكَلَّفُ شَرْعًا هُوَ الْبَالِغُ الْعَاقِلُ الَّذِى بَلَغَتْهُ دَعْوَةُ الإِسْلامِ وَالْبُلُوغُ يَكُونُ بِبُلُوغِ خَمْسَ عَشْرَةَ سَنَةً قَمَرِيَّةً أَوْ رُؤْيَةِ الْمَنِىِّ أَوْ رُؤْيَةِ دَمِ الْحَيْضِ وَأَمَّا الْعَاقِلُ فَهُوَ الَّذِى لَمْ يَذْهَبْ عَقْلُهُ.\nوَيُشْتَرَطُ بُلُوغُهُ دَعْوَةَ الإِسْلامِ يَعْنِى أَنَّهُ إِنْ كَانَ الْبُلُوغُ وَالْعَقْلُ فِى شَخْصٍ يَصِيرُ مُكَلَّفًا بِمُجَرَّدِ أَنْ يَبْلُغَهُ أَصْلُ الدَّعْوَةِ الإِسْلامِيَّةِ أَىْ أَنْ يَبْلُغَهُ أَنَّهُ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ فَمَنْ كَانَ بَلَغَهُ الإِسْلامُ فَهَذَا هُوَ الْمُكَلَّفُ الَّذِى هُوَ مُلْزَمٌ بِأَنْ يُسْلِمَ وَيَعْمَلَ بِشَرِيعَةِ الإِسْلامِ وَأَنْ يُؤَدِّىَ الْوَاجِبَاتِ كُلَّهَا وَيَجْتِنَبَ الْمُحَرَّمَاتِ كُلَّهَا.\nوَيُفْهَمُ مِنْ ذَلِكَ أَنَّ الطِّفْلَ الصَّغِيرَ لَيْسَ عَلَيْهِ مَسْؤُولِيَّةٌ فِى الآخِرَةِ حَتَّى يَبْلُغَ وَكَذَلِكَ الْمَجْنُونَ فِى حَالِ جُنُونِهِ وَكَذَلِكَ الَّذِى عَاشَ بَالِغًا وَلَمْ تَبْلُغْهُ دَعْوَةُ الإِسْلامِ.\nقَالَ اللَّهُ تَعَالَى ﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّى نَبْعَثَ رَسُولًا﴾ [سُورَةَ الإِسْرَاء/15].\nوَقَالَ رَسُولُ اللَّهِ ﷺ «رُفِعَ الْقَلَمُ عَنْ ثَلاثَةٍ عَنِ النَّائِمِ حَتَّى يَسْتَيْقِظَ وَعَنِ الصَّبِىِّ حَتَّى يَحْتَلِمَ وَعَنِ الْمَجْنُونِ حَتَّى يَعْقِلَ» رَوَاهُ أَبُو دَاوُدَ.\nفَائِدَةٌ. كَانَ رَسُولُ اللَّهِ ﷺ يَدْعُو الْعَرَبَ الْمُشْرِكِينَ فِى مَوْسِمِ الْحَجِّ حِينَ يَجْتَمِعُونَ مِنْ نَوَاحٍ شَتَّى إِلَى الإِسْلامِ وَيُسْمِعُهُمُ الشَّهَادَتَيْنِ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ ﷺ. وَكَانَ مُشْرِكُو الْعَرَبِ يَحُجُّونَ إِلَى الْكَعْبَةِ تَقْلِيدًا لِأَجْدَادِهِمُ الْمُسْلِمِينَ.\n\n     أَسْئِلَةٌ\n     (1) مَنْ هُوَ الْمُكَلَّفُ شَرْعًا وَبِمَ هُوَ مُلْزَمٌ.\n     (2) بِمَ يَكُونُ الْبُلُوغُ وَمَنْ هُوَ الْعَاقِلُ.\n     (3) مَنْ عَاشَ بَالِغًا وَلَمْ تَبْلُغْهُ دَعْوَةُ الإِسْلامِ هَلْ يَكُونُ مُكَلَّفًا وَمَا الدَّلِيلُ عَلَى ذَلِكَ.\n     (4) مَا الدَّلِيلُ عَلَى أَنَّ الطِّفْلَ الصَّغِيرَ لَيْسَ مُكَلَّفًا.\n\nالدَّرْسُ الثَّالِثُ\nاللَّهُ تَعَالَى خَالِقُ الْعَالَمِ\n\nقَالَ اللَّهُ تَعَالَى ﴿أَفِى اللَّهِ شَكٌّ﴾ [سُورَةَ إِبْرَاهِيم/10].\nإِنَّ أَوَّلَ وَاجِبٍ عَلَى الْمُكَلَّفِ هُوَ مَعْرِفَةُ اللَّهِ تَعَالَى فَهُوَ الْخَالِقُ لِجَمِيعِ الْمَوْجُودَاتِ الْمُدَبِّرُ لِهَذِهِ الْكَائِنَاتِ لِأَنَّنَا إِذَا تَأَمَّلْنَا جَمِيعَ الصَّنَائِعِ وَتَفَكَّرْنَا فِيهَا تَفَكُّرًا سَلِيمًا عَلِمْنَا أَنَّ لَهَا صَانِعًا خَلَقَهَا.\nالدَّلِيلُ الْعَقْلِيُّ عَلَى وُجُودِ اللَّهِ تَعَالَى\nنُدْرِكُ بِالْعَقْلِ السَّلِيمِ أَنَّ الْكِتَابَةَ لا بُدَّ لَهَا مِنْ كَاتِبٍ وَالضَّرْبَ لا بُدَّ لَهُ مِنْ ضَارِبٍ وَالْبِنَاءَ لا بُدَّ لَهُ مِنْ بَانٍ فَإِذًا هَذَا الْعَالَمُ بِمَا فِيهِ مِنْ مَخْلُوقَاتٍ لا بُدَّ لَهُ مِنْ خَالِقٍ حَىٍّ مُرِيدٍ عَالِمٍ قَدِيرٍ وَهُوَ اللَّهُ سُبْحَانَهُ وَتَعَالَى الَّذِى لا يُشْبِهُ شَيْئًا مِنْ مَخْلُوقَاتِهِ وَلا يُشَابِهُهُ شَىْءٌ لِأَنَّهُ لا يَصِحُّ فِى الْعَقْلِ وُجُودُ فِعْلٍ مَا بِدُونِ فَاعِلٍ.\nوَلا يَصِحُّ أَنْ يَكُونَ ذَلِكَ الْفَاعِلُ طَبِيعَةً لِأَنَّ الطَّبِيعَةَ لا إِرَادَةَ لَهَا فَكَيْفَ تَخْلُقُ.\nوَلا يَصِحُّ أَيْضًا أَنْ يَكُونَ الشَّىْءُ خَالِقًا لِنَفْسِهِ.\nوَكَذَلِكَ لا يَصِحُّ أَنْ يَخْلُقَ الشَّىْءُ مِثْلَهُ أَىْ مُشَابِهَهُ.\nفَالطِّفْلُ مَثَلًا يُولَدُ صَغِيرًا لا يَتَكَلَّمُ وَلا يَمْشِى ثُمَّ يَتَطَوَّرُ فَيَبْدَأُ بِالْكَلامِ وَالْمَشْىِ شَيْئًا فَشَيْئًا ثُمَّ يَنْمُو فَيَصِيرُ شَابًّا ثُمَّ كَهْلًا ثُمَّ هَرِمًا ثُمَّ يَمُوتُ فَمَنِ الَّذِى طَوَّرَهُ وَغَيَّرَهُ مِنْ حَالٍ إِلَى حَالٍ. اللَّهُ عَزَّ وَجَلَّ هُوَ الَّذِى خَلَقَهُ وَطَوَّرَهُ وَغَيَّرَهُ ثُمَّ أَمَاتَهُ. ثُمَّ الإِنْسَانُ لَوْ فَكَّرَ بِعَقْلِهِ لَعَلِمَ أَنَّ كُلَّ مُتَغَيِّرٍ لا بُدَّ لَهُ مِنْ مُغَيِّرٍ وَالْعَالَمُ مُتَغَيِّرٌ فَإِذًا الْعَالَمُ لا بُدَّ لَهُ مِنْ مُغَيِّرٍ.\n\nقِصَّةُ رَجُلٍ يُنْكِرُ وُجُودَ اللَّهِ\nيُرْوَى أَنَّ رَجُلًا مِنْ مُنْكِرِى وُجُودِ اللَّهِ أَتَى إِلَى أَحَدِ الْخُلَفَاءِ وَقَالَ لَهُ إِنَّ عُلَمَاءَ عَصْرِكَ يَقُولُونَ إِنَّ لِهَذَا الْكَوْنِ صَانِعًا وَأَنَا مُسْتَعِدٌّ أَنْ أُثْبِتَ لَهُمْ أَنَّ هَذَا الْكَوْنَ لا صَانِعَ لَهُ.\nفَبَعَثَ الْخَلِيفَةُ إِلَى عَالِمٍ كَبِيرٍ يُعْلِمُهُ بِالْخَبَرِ وَيَأْمُرُهُ بِالْحُضُورِ فَتَعَمَّدَ الْعَالِمُ أَنْ يَتَأَخَّرَ قَلِيلًا عَنِ الْوَقْتِ ثُمَّ حَضَرَ فَاسْتَقْبَلَهُ الْخَلِيفَةُ وَأَجْلَسَهُ فِى صَدْرِ الْمَجْلِسِ وَكَانَ قَدِ اجْتَمَعَ الْعُلَمَاءُ وَكِبَارُ النَّاسِ فَقَالَ الرَّجُلُ لِمَ تَأَخَّرْتَ فِى مَجِيئِكَ فَقَالَ الْعَالِمُ أَرَأَيْتَ لَوْ قُلْتُ لَكَ إِنَّهُ قَدْ حَصَلَ لِى أَمْرٌ عَجِيبٌ فَتَأَخَّرْتُ وَذَلِكَ أَنَّ بَيْتِىَ وَرَاءَ نَهْرِ دِجْلَةَ فَجِئْتُ لِأَعْبُرَ النَّهْرَ فَلَمْ أَجِدْ سِوَى سَفِينَةٍ عَتِيقَةٍ قَدْ تَكَسَّرَتْ أَلْوَاحُهَا الْخَشَبِيَّةُ وَلَمَّا وَقَعَ نَظَرِى عَلَيْهَا تَحَرَّكَتِ الأَلْوَاحُ وَاجْتَمَعَتْ وَاتَّصَلَ بَعْضُهَا بِبَعْضٍ وَصَارَتْ سَفِينَةً صَالِحَةً لِلسَّيْرِ بِلا مُبَاشَرَةِ نَجَّارٍ وَلا عَمَلِ عَامِلٍ فَقَعَدْتُ عَلَيْهَا وَعَبَرْتُ النَّهْرَ وَجِئْتُ إِلَى هَذَا الْمَكَانِ.\nفَقَالَ الرَّجُلُ اسْمَعُوا أَيُّهَا النَّاسُ مَا يَقُولُ عَالِمُكُمْ فَهَلْ سَمِعْتُمْ كَلامًا أَكْذَبَ مِنْ هَذَا كَيْفَ تُوجَدُ السَّفِينَةُ بِدُونِ أَنْ يَصْنَعَهَا نَجَّارٌ هَذَا كَذِبٌ مَحْضٌ.\nفَقَالَ الْعَالِمُ أَيُّهَا الْكَافِرُ إِذَا لَمْ يُعْقَلْ أَنْ تُوجَدَ سَفِينَةٌ بِلا صَانِعٍ وَلا نَجَّارٍ فَكَيْفَ تَقُولُ بِوُجُودِ الْعَالَمِ بِدُونِ صَانِعٍ. \nسَكَتَ الرَّجُلُ وَلَزِمَتْهُ الْحُجَّةُ وَعَاقَبَهُ الْخَلِيفَةُ لِسُوءِ اعْتِقَادِهِ.\n\n     أَسْئِلَةٌ\n     (1) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى وُجُودِ اللَّهِ تَعَالَى.\n     (2) مَا الدَّلِيلُ الْعَقْلِىُّ عَلَى وُجُودِ اللَّهِ.\n     (3) لِمَ لا يَصِحُّ أَنْ يَكُونَ الْفَاعِلُ طَبِيعَةً.\n\nالدَّرْسُ الرَّابِعُ\nتَوْحِيدُ اللَّهِ تَعَالَى\n\nقَالَ اللَّهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11] أَىْ أَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لا يُشْبِهُ الْمَخْلُوقَاتِ.\nوَرَدَ أَنَّ الْيَهُودَ أَتَوْا إِلَى النَّبِىِّ ﷺ فَقَالُوا يَا مُحَمَّدُ صِفْ لَنَا رَبَّكَ الَّذِى تَعْبُدُهُ فَنَزَلَتْ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ﴾ فَقَالَ رَسُولُ اللَّهِ ﷺ «هَذِهِ صِفَةُ رَبِى عَزَّ وَجَلَّ».\nوَقَدْ كَانَ سُؤَالُ الْيَهُودِ هَذَا تَعَنُّتًا وَاسْتِهْزَاءً وَلَيْسَ طَلَبًا لِلْعِلْمِ.\nوَهَذَا يَدُلُّ عَلَى أَنَّ اللَّهَ تَعَالَى مَوْصُوفٌ بِصِفَاتٍ وَكَمَا أَنَّهُ عَزَّ وَجَلَّ لا يُشْبِهُ الْمَخْلُوقَاتِ فَكَذَلِكَ صِفَاتُهُ لا تُشْبِهُ صِفَاتِ الْمَخْلُوقَاتِ فَهُوَ تَعَالَى مَوْصُوفٌ بِكُلِّ كَمَالٍ يَلِيقُ بِهِ مُنَزَّهٌ عَنْ كُلِّ نَقْصٍ فِى حَقِّهِ.\nقَالَ تَعَالَى ﴿وَلِلَّهِ الْمَثَلُ الأَعْلَى﴾ أَىِ الْوَصْفُ الَّذِى لا يُشْبِهُ وَصْفَ غَيْرِهِ فَكُلُّ مَا سِوَى اللَّهِ مَخْلُوقٌ وَهُوَ جُمْلَةُ الْعَالَمِ.\nأَمَّا اللَّهُ تَعَالَى فَهُوَ وَحْدَهُ الأَزَلِىُّ الَّذِى لا ابْتِدَاءَ لَهُ وَكَذَلِكَ صِفَاتُهُ أَزَلِيَّةٌ لا ابْتِدَاءَ لَهَا وَصِفَاتُ غَيْرِهِ مَخْلُوقَةٌ تَتَحَوَّلُ مِنْ حَالٍ إِلَى حَالٍ أَمَّا اللَّهُ تَعَالَى فَلا يَطْرَأُ عَلَيْهِ تَحَوُّلٌ وَلا تَغَّيُّرٌ فَهُوَ تَعَالَى يُغَيِّرُ وَلا يَتَغَيَّرُ وَيُطَوِّرُ وَلا يَتَطَوَّرُ.\nوَيُسَاعِدُ النَّظَرُ إِلَى الْعِبَارَاتِ التَّالِيَةِ فِى فَهْمِ هَذَا الْمَوْضُوعِ الَّذِى هُوَ مِنْ مَوَاضِيعِ التَّوْحِيدِ\nاللَّهُ أَزَلِىٌّ لا بِدَايَةَ لَهُ.                           \nالْمَخْلُوقَاتُ كُلُّهَا لَهَا بِدَايَةٌ اللَّهُ خَلَقَهَا.       \nاللَّهُ أَبَدِىٌّ لا نِهَايَةَ لَهُ.                         \nالْمَخْلُوقَاتُ كُلُّهَا يَجُوزُ عَلَيْهَا أَنْ تَفْنَى مِنْ حَيْثُ الْعَقْلُ.\nصِفَاتُ اللَّهِ أَزَلِيَّةٌ لا بِدَايَةَ لَهَا صِفَاتُ اللَّهِ أَبَدِيَّةٌ لا تَفْنَى.  \nصِفَاتُ اللَّهِ لا تَتَغَيَّرُ وَلا تَتَحَوَّلُ وَلا تَتَبَدَّلُ وَلا تَتَطَوَّرُ لِأَنَّ ذَلِكَ مِنْ صِفَاتِ الْمَخْلُوقَاتِ.  \nصِفَاتُ الْمَخْلُوقَاتِ مَخْلُوقَةٌ لَهَا بِدَايَةٌ وَيَجُوزُ عَلَيْهَا الْفَنَاءُ.        \nصِفَاتُ الْمَخْلُوقَاتِ تَتَغَيَّرُ وَتَتَحَوَّلُ وَتَتَبَدَّلُ وَتَتَطَوَّرُ مِنْ حَالٍ إِلَى حَالٍ لِأَنَّ اللَّهَ خَلَقَهَا.       \nاللَّهُ خَالِقُ الْعَالَمِ وَمَا فِيهِ خَالِقُ الضُّرِّ وَالنَّفْعِ خَالِقُ أَفْعَالِ الْعِبَادِ وَرَازِقُهُمْ. \nالْمَخْلُوقَاتُ لا تَخْلُقُ ضُرًّا وَلا نَفْعًا وَلا تَخْلُقُ شَيْئًا مِنَ الأَفْعَالِ فَمَنْ قَطَّعَ تُفَّاحَةً لا يَسْتَطِيعُ أَنْ يُعِيدَهَا كَمَا كَانَتْ.      \nاللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ وَاحِدٌ فِى ذَاتِهِ وَصِفَاتِهِ وَأَفْعَالِهِ . \nالْمَخْلُوقَاتُ ذَوُو أَشْكَالٍ مُتَعَدِّدَةٍ وَأَلْوَانٍ مُخْتَلِفَةٍ حَتَّى الثَّمَرُ مِنْ جِنْسٍ وَاحِدٍ فِيهِ الْحَامِضُ وَفِيهِ الْحُلْوُ.   \nاللَّهُ لَيْسَ جِسْمًا لَيْسَ لَهُ حَجْمٌ لَيْسَ لَهُ مَكَانٌ. \nالْمَخْلُوقَاتُ لَهَا أَحْجَامٌ وَلَهَا أَمْكِنَةٌ تَسْتَقِرُّ فِيهَا.\nاللَّهُ لا يَحْتَاجُ لِلْمَخْلُوقَاتِ. \nالْمَخْلُوقَاتُ تَحْتَاجُ إِلَى مَنْ خَلَقَهَا تَحْتَاجُ إِلَى اللَّهِ.\nاللَّهُ وَحْدَهُ يَسْتَحِقُّ أَنْ يُعْبَدَ لا إِلَهَ إِلَّا هُوَ. \nالْمَخْلُوقَاتُ لا تَسْتَحِقُّ أَنْ تُعْبَدَ لِأَنَّهَا عَاجِزَةٌ وَمُحْتَاجَةٌ لِمَنْ خَلَقَهَا. \nقَالَ الإِمَامُ الْجُنَيْدُ رَحِمَهُ اللَّهُ «التَّوْحِيدُ هُوَ إِفْرَادُ الْقَدِيمِ أَىِ الأَزَلِىِّ مِنَ الْمُحْدَثِ أَىِ الْمَخْلُوقِ». \n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً فِيهَا تَنْزِيهُ اللَّهِ عَنْ مُشَابَهَةِ الْمَخْلُوقَاتِ.\n     (2) مَا مَعْنَى الآيَةِ ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾.\n     (3) مَا سَبَبُ نُزُولِ سُورَةِ الإِخْلاصِ.\n     (4) مَا مَعْنَى الآيَةِ ﴿وَلِلَّهِ الْمَثَلُ الأَعْلَى﴾.\n     (5) مَاذَا يُقَالُ عَنْ جُمْلَةِ الْعَالَمِ.\n     (6) مَاذَا قَالَ الإِمَامُ الْجُنَيْدُ رَحِمَهُ اللَّهُ فِى التَّوْحِيدِ.\n\n\nالدَّرْسُ الْخَامِسُ\nصِفَاتُ اللَّهِ تَعَالَى\n\n   ذَكَرَ الْعُلَمَاءُ أَنَّهُ يَجِبُ عَلَى كُلِّ مُكَلَّفٍ مَعْرِفَةُ ثَلاثَ عَشْرَةَ صِفَةً لِلَّهِ تَعَالَى وَهِىَ الْوُجُودُ وَالْوَحْدَانِيَّةُ وَالْقِدَمُ وَالْبَقَاءُ وَالْقِيَامُ بِالنَّفْسِ وَالْقُدْرَةُ وَالإِرَادَةُ وَالْعِلْمُ وَالسَّمْعُ وَالْبَصَرُ وَالْحَيَاةُ وَالْكَلامُ وَالْمُخَالَفَةُ لِلْحَوَادِثِ وَشَرْحُهَا كَمَا يَلِى\n   (1) الْوُجُودُ: يَجِبُ الإِيـمَانُ بِأَنَّ اللَّهَ مَوْجُودٌ لا شَكَّ فِى وُجُودِهِ تَعَالَى وَهُوَ مَوْجُودٌ بِلا مَكَانٍ وَلا جِهَةٍ وَلا يَجْرِى عَلَيْهِ زَمَانٌ.  \n   (2) الْوَحْدَانِيَّةُ: اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ وَاحِدٌ فِى ذَاتِهِ وَوَاحِدٌ فِى صِفَاتِهِ وَوَاحِدٌ فِى فِعْلِهِ. \n   (3) الْقِدَمُ: اللَّهُ أَزَلِىٌّ لا بِدَايَةَ لِوُجُودِهِ مَوْجُودٌ قَبْلَ الْمَخْلُوقَاتِ.\n   (4) الْبَقَاءُ: اللَّهُ أَبَدِىٌّ لا نِهَايَةَ لَهُ لا يَفْنَى وَلا يَبِيدُ.\n   (5) الْقِيَامُ بِالنَّفْسِ: اللَّهُ تَعَالَى لا يَحْتَاجُ إِلَى شَىْءٍ مِنْ مَخْلُوقَاتِهِ وَكُلُّهَا مُحْتَاجَةٌ إِلَيْهِ.\n   (6) الْقُدْرَةُ: اللَّهُ تَعَالَى قَادِرٌ عَلَى كُلِّ شَىْءٍ.\n   (7) الإِرَادَةُ: أَىِ الْمَشِيئَةُ فَكُلُّ شَىْءٍ يَحْصُلُ فِى الْعَالَمِ بِمَشِيئَةِ اللَّهِ. \n   (8) الْعِلْمُ: اللَّهُ عَالِمٌ بِكُلِّ الأَشْيَاءِ قَبْلَ حُصُولِهَا.\n   (9) السَّمْعُ: اللَّهُ تَعَالَى يَسْمَعُ الْمَسْمُوعَاتِ كُلَّهَا بِدُونِ أُذُنٍ وَلا ءَالَةٍ أُخْرَى.\n   (10) الْبَصَرُ: اللَّهُ يَرَى كُلَّ الْمَرْئِيَاتِ بِدُونِ حَدَقَةٍ وَلا ءَالَةٍ أُخْرَى.\n   (11) الْحَيَاةُ: اللَّهُ حَىٌّ بِدُونِ رُوحٍ وَلَحْمٍ وَقَلْبٍ فَحَيَاتُهُ لا تُشْبِهُ حَيَاتَنَا وَهُوَ حَىٌّ لا يَمُوتُ.\n   (12) الْكَلامُ: اللَّهُ يَتَكَلَّمُ بِدُونِ لِسَانٍ وَشَفَتَيْنِ وَكَلامُهُ لَيْسَ لُغَةً عَرَبِيَّةً أَوْ غَيْرَهَا لِأَنَّهُ خَالِقُ اللُّغَاتِ وَالْحُرُوفِ وَالأَصْوَاتِ وَكَلامُهُ لا يُشْبِهُ كَلامَ الْعَالَمِينَ.\n   (13) الْمُخَالَفَةُ لِلْحَوَادِثِ: اللَّهُ تَعَالَى لا يُشْبِهُ الْمَخْلُوقَاتِ.\n\n     أَسْئِلَةٌ\n     (1) مَاذَا يَجِبُ عَلَى كُلِّ مُكَلَّفٍ مَعْرِفَتُهُ مِنْ صِفَاتِ اللَّهِ تَعَالَى.\n     (2) عَدِّدِ الصِّفَاتِ الْوَاجِبَةَ لِلَّهِ تَعَالَى.\n     (3) تَكَلَّمْ عَنْ صِفَةِ الْوُجُودِ وَالْوَحْدَانِيَّةِ.\n     (4) تَكَلَّمْ عَنْ صِفَةِ الْقِدَمِ وَالْبَقَاءِ وَالْقِيَامِ بِالنَّفْسِ.\n     (5) تَكَلَّمْ عَنْ صِفَةِ الْقُدْرَةِ وَالإِرَادَةِ وَالْعِلْمِ.\n     (6) تَكَلَّمْ عَنْ صِفَةِ السَّمْعِ وَالْبَصَرِ وَالْحَيَاةِ.\n     (7) تَكَلَّمْ عَنْ صِفَةِ الْكَلامِ وَالْمُخَالَفَةِ لِلْحَوَادِثِ.\n\nالدَّرْسُ السَّادِسُ\nمَا جَاءَ فِى بَدْءِ الْخَلْقِ، الْمَاءُ أَوَّلُ الْمَخْلُوقَاتِ\n\nقَالَ ﷺ عِنْدَمَا سُئِلَ عَنْ بَدْءِ الأَمْرِ أَىْ كَيْفَ بَدَأَ هَذَا الْكَوْنُ «كَانَ اللَّهُ وَلَمْ يَكُنْ شَىْءٌ غَيْرُهُ وَكَانَ عَرْشُهُ عَلَى الْمَاءِ وَكَتَبَ فِى الذِّكْرِ كُلَّ شَىْءٍ ثُمَّ خَلَقَ السَّمَوَاتِ وَالأَرْضَ» رَوَاهُ الْبُخَارِىُّ.\nأَجَابَ الرَّسُولُ ﷺ عَنْ هَذَا السُّؤَالِ بِأَنَّ اللَّهَ لا بِدَايَةَ لِوُجُودِهِ أَىْ أَزَلِىٌّ وَلا أَزَلِىَّ سِوَاهُ وَبِعِبَارَةٍ أُخْرَى فَفِى الأَزَلِ لَمْ يَكُنْ إِلَّا اللَّهُ تَعَالَى وَاللَّهُ تَعَالَى خَلَقَ كُلَّ شىْءٍ وَمَعْنَى خَلَقَ كُلَّ شَىْءٍ أَنَّهُ أَخْرَجَ جَمِيعَ الْمَوْجُودَاتِ مِنَ الْعَدَمِ إِلَى الْوُجُودِ.\nوَاللَّهُ تَعَالَى لَمْ يَخْلُقِ الْمَخْلُوقَاتِ كُلَّهَا دَفْعَةً وَاحِدَةً وَلَوْ أَرَادَ ذَلِكَ لَفَعَلَ، خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ وَمَرَافِقَهَا مِنْ أَنْهَارٍ وَجِبَالٍ وَوِدْيَانٍ فِى سِتَّةِ أَيَّامٍ وَالْحِكْمَةُ مِنْ ذَلِكَ أَنْ يُعَلِّمَنَا التَّأَنِىَ فِى الأُمُورِ.\nالْمَاءُ أَوَّلُ الْمَخْلُوقَاتِ: وَأَوَّلُ الْمَخْلُوقَاتِ الْمَاءُ قَالَ النَّبِىُّ ﷺ «إِنَّ اللَّهَ تَعَالَى خَلَقَ كُلَّ شَىْءٍ مِنَ الْمَاءِ» رَوَاهُ ابْنُ حِبَّانَ، يَعْنِى قَبْلَ أَنْ يَخْلُقَ اللَّهُ النُّورَ وَالظَّلامَ وَالأَرْضَ وَالسَّمَوَاتِ وَالْعَرْشَ وَاللَّوْحَ الْمَحْفُوظَ خَلَقَ قَبْلَ كُلِّ شَىْءٍ الْمَاءَ وَجَعَلَهُ أَصْلًا لِغَيْرِهِ مِنَ الْمَخْلُوقَاتِ ثُمَّ خَلَقَ مِنَ الْمَاءِ الْعَرْشَ ثُمَّ الْقَلَمَ الأَعْلَى ثُمَّ اللَّوْحَ الْمَحْفُوظَ وَخَلَقَ بَعْدَ هَؤُلاءِ سَائِرَ الأَشْيَاءِ أَىِ الأَرْضَ وَالسَّمَوَاتِ وَالْبَهَائِمَ وَالْجِبَالَ وَالأَشْجَارَ وَالأَنْهَارَ. وَكَانَ ءَاخِرَ الْخَلْقِ مِنْ حَيْثُ الْجِنْسُ ءَادَمُ عَلَيْهِ السَّلامُ خُلِقَ بَعْدَ عَصْرِ يَوْمِ الْجُمُعَةِ.\nالْعَرْشُ هُوَ سَرِيرٌ لَهُ قَوَائِمُ وَهُوَ أَكْبَرُ الأَجْسَامِ الَّتِى خَلَقَهَا اللَّهُ تَعَالَى وَهُوَ سَقْفُ الْجَنَّةِ قَالَ رَسُولُ اللَّهِ ﷺ «مَا السَّمَوَاتُ السَّبْعُ فِى جَنْبِ الْكُرْسِىِّ إِلَّا كَحَلْقَةٍ فِى أَرْضٍ فَلاةٍ وَفَضْلُ الْعَرْشِ عَلَى الْكُرْسِىِّ كَفَضْلِ الْفَلاةِ عَلَى الحَلْقَةِ» رَوَاهُ ابْنُ حِبَّانَ، أَىْ أَنَّ السَّمَوَاتِ السَّبْعَ بِالنِّسْبَةِ لِلْكُرْسِىِّ كَحَلْقَةٍ فِى فَلاةٍ وَكَذَلِكَ الْكُرْسِىُّ بِالنِّسْبَةِ لِلْعَرْشِ كَحَلْقَةٍ فِى فَلاةٍ. وَهَذَا يَدُلُّ عَلَى عِظَمِ مِسَاحَةِ الْعَرْشِ الَّذِى يَحْمِلُهُ الآنَ أَرْبَعَةٌ مِنَ الْمَلائِكَةِ الضِّخَامِ الْعِظَامِ الْوَاحِدُ مِنْهُمْ مَا بَيْنَ شَحْمَةِ أُذُنِهِ إِلَى عَاتِقِهِ مَسِيرَةُ سَبْعِمِائَةِ عَامٍ بِخَفَقَانِ الطَّيْرِ الْمُسْرِعِ أَمَّا يَوْمَ الْقِيَامَةِ فَيَحْمِلُ الْعَرْشَ ثَمَانِيَةٌ مِنَ الْمَلائِكَةِ.\nوَالْعَرْشُ مَحْفُوفٌ بِالْمَلائِكَةِ وَلَيْسَ هُوَ مَكَانًا للَّهِ تَعَالَى لِأَنَ اللَّهَ لَيْسَ جِسْمًا وَلا يَحْتَاجُ لِلْمَكَانِ. قَالَ الإِمَامُ عَلِىٌّ رَضِىَ اللَّهُ عَنْهُ «إِنَّ اللَّهَ خَلَقَ الْعَرْشَ إِظْهَارًا لِقُدْرَتِهِ وَلَمْ يَتَّخِذْهُ مَكَانًا لِذَاتِهِ».\nفَالْعَرْشُ وَالْكُرْسِىُّ خَلَقَهُمَا اللَّهُ إِظْهَارًا لِقُدْرَتِهِ وَهُوَ سُبْحَانَهُ مَوْجُودٌ بِلا مَكَانٍ وَلا جِهَةٍ.\n\n     أَسْئِلَةٌ\n     (1) مَاذَا قَالَ الرَّسُولُ لَمَّا سُئِلَ عَنْ بَدْءِ الأَمْرِ.\n     (2) هَلْ خَلَقَ اللَّهُ الْمَخْلُوقَاتِ كُلَّهَا دَفْعَةً وَاحِدَةً.\n     (3) مَا مَعْنَى اللَّهُ تَعَالَى خَلَقَ كُلَّ شَىْءٍ.\n     (4) فِى كَمْ يَوْمٍ خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ وَمَا الْحِكْمَةُ مِنْ ذَلِكَ.\n     (5) مَا هُوَ أَوَّلُ مَخْلُوقَاتِ اللَّهِ وَمَاذَا خَلَقَ اللَّهُ بَعْدَهُ.\n     (6) مَا هُوَ الْعَرْشُ، مَا هُوَ ءَاخِرُ الْمَخْلُوقَاتِ مِنْ حَيْثُ الْجِنْسُ.\n     (7) الْعَرْشُ أَكْبَرُ الأَجْرَامِ اذْكُرْ دَلِيلًا عَلَى ذَلِكَ مِنَ الْحَدِيثِ الشَّرِيفِ.\n     (8) كَمْ مَلَكًا يَحْمِلُ الْعَرْشَ الآنَ وَيَوْمَ الْقِيَامَةِ.\n     (9) مَنْ يَحُفُّ بِالْعَرْشِ وَمَاذَا قَالَ الإِمَامُ عَلِىٌّ عَنِ الْعَرْشِ.\n\nالدَّرْسُ السَّابِعُ\nتَرْتِيبُ الْمَخْلُوقَاتِ بَعْدَ الْمَاءِ وَالْعَرْشِ\n\nبَعْدَ أَنْ خَلَقَ اللَّهُ تَعَالَى الْمَاءَ وَالْعَرْشَ خَلَقَ الْقَلَمَ الأَعْلَى ثُمَ اللَّوْحَ الْمَحْفُوظَ ثُمَ سَائِرَ الْمَخْلُوقَاتِ.\nالْقَلَمُ الأَعْلَى وَاللَّوْحُ الْمَحْفُوظُ: وَرَدَ فِى وَصْفِ اللَّوْحِ الْمَحْفُوظِ أَنَّهُ مِنْ دُرَّةٍ بَيْضَاءَ حَافَّتَاهُ يَاقُوتَةٌ حَمْرَاءُ عَرْضُهُ مَسِيرَةُ خَمْسِمِائَةِ عَامٍ.\nأَمَرَ اللَّهُ تَعَالَى الْقَلَمَ أَنْ يَكْتُبَ فَجَرَى بِقُدْرَةِ اللَّهِ تَعَالَى مِنْ غَيْرِ أَنْ يُمْسِكَهُ أَحَدٌ مِنْ خَلْقِهِ فَكَتَبَ عَلَى اللَّوْحِ الْمَحْفُوظِ مَا كَانَ وَمَا يَكُونُ فِى الدُّنْيَا إِلَى نِهَايَتِهَا. ثُمَّ بَعْدَ ذَلِكَ بِخَمْسِينَ أَلْفَ سَنَةٍ خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ فِى سِتَّةِ أَيَّامٍ فَلا يُولَدُ إِنْسَانٌ وَلا تَنْزِلُ قَطْرَةُ مَاءٍ مِنَ السَّمَاءِ إِلَّا عَلَى حَسَبِ مَا كُتِبَ فِى اللَّوْحِ الْمَحْفُوظِ.\nالأَرْضُ: الأَرْضُ الَّتِى نَحْنُ عَلَيْهَا هِىَ وَاحِدَةٌ مِنْ سَبْعِ أَرَضِينَ خَلَقَهَا اللَّهُ تَعَالَى وَهِىَ أَعْلاهَا وَكُلُّ أَرْضٍ مُنْفَصِلَةٌ عَنِ الأُخْرَى، وَفِى الأَرْضِ السَّابِعَةِ يُوجَدُ مَكَانٌ يُسَمَّى سِجِّينَ وَهُوَ مَكَانُ أَرْوَاحِ الْكُفَّارِ بَعْدَ بِلَى أَجْسَاِدهِمْ إِلَى أَنْ يُبْعَثُوا. وَجَهَنَّمُ تَحْتَ الأَرْضِ السَّابِعَةِ وَهِىَ النَّارُ الَّتِى تَوَعَّدَ اللَّهُ بِهَا الْكُفَّارَ وَالْعُصَاةَ مِنْ عِبَادِهِ. وَكَانَ خَلْقُ هَذِهِ الأَرْضِ فِى الْيَوْمَيْنِ الأَوَّلَيْنِ مِنَ الأَيَّامِ السِّتِّ.\nالسَّمَوَاتُ السَّبْعُ: بَعْدَ أَنْ خَلَقَ اللَّهُ تَعَالَى الأَرْضَ خَلَقَ السَّمَوَاتِ السَّبْعَ وَهِىَ أَجْرَامٌ صُلْبَةٌ رَفَعَهَا اللَّهُ بِغَيْرِ عَمَدٍ مُنْفَصِلَةٌ عَنْ بَعْضِهَا الْبَعْضِ بَيْنَ الْوَاحِدَةِ وَالأُخْرَى مَسَافَةُ خَمْسِمِائَةِ عَامٍ وَلِكُلِّ سَمَاءٍ بَابٌ. \nوَمِنْ شِدَّةِ بُعْدِ السَّمَاءِ الأُولَى عَنِ الأَرْضِ وَعَجْزِ الإِنْسَانِ عَنْ إِدْرَاكِهَا يَعْتَقِدُ بَعْضُ الْغَرْبِيِّينَ أَنَ الْفَضَاءَ الَّذِى فِيهِ النُّجُومُ وَالْكَوَاكِبُ هُوَ جُمْلَةُ هَذَا الْعَالَمِ وَيَعْتَقِدُونَ بَاطِلًا أَنَهُ مُمْتَدٌّ إِلَى مَا لا نِهَايَةَ لَهُ وَلا عِبْرَةَ بِكَلامِهِمْ لِأَنَ اللَّهَ تَعَالَى أَخْبَرَنَا فِى الْقُرْءَانِ وَنَبِيَّهُ ﷺ أَخْبَرَنَا فِى حَدِيثِهِ عَنْ هَذِهِ الأُمُورِ بِخِلافِ مَا قَالُوا. وَفَوْقَ السَّمَاءِ السَّابِعَةِ تُوجَدُ الْجَنَّةُ.\nمَرَافِقُ الأَرْضِ: وَبَعْدَ خَلْقِ السَّمَوَاتِ السَّبْعِ خَلَقَ اللَّهُ تَعَالَى مَرَافِقَ الأَرْضِ كَالأَنْهَارِ وَالأَشْجَارِ وَالْجِبَالِ وَغَيْرِهَا. \nءَادَمُ: ثُمَّ خَلَقَ اللَّهُ تَعَالَى ءَادَمَ فِى ءَاخِرِ الْيَوْمِ السَّادِسِ وَهُوَ يَوْمُ الْجُمُعَةِ وَءَادَمُ هُوَ ءَاخِرُ الْمَخْلُوقَاتِ مِنْ حَيْثُ الِجنْسُ وَأَوَّلُ الأَنْبِيَاءِ خَلَقَهُ اللَّهُ تَعَالَى مِنْ تُرَابِ الأَرْضِ بَعْدَ أَنْ خَلَطَهُ الْمَلَكُ بِأَمْرِ اللَّهِ بِمَاءٍ مِنَ الْجَنَّةِ وَخَلَقَ مِنْ ضِلَعِهِ الأَيْسَرِ حَوَّاءَ وَكَانَ خَلْقُ الْمَلائِكَةِ وَالْجِنِّ وَالْبَهَائِمِ قَبْلَ خَلْقِ ءَادَمَ.\n\n     أَسْئِلَةٌ\n     (1) مَاذَا خَلَقَ اللَّهُ بَعْدَ الْمَاءِ وَالْعَرشِ.\n     (2) مَاذَا وَرَدَ فِى وَصْفِ اللَّوْحِ الْمَحْفُوظِ.\n     (3) بِمَ أَمَرَ اللَّهُ الْقَلَمَ الأَعْلَى وَمَاذَا كَتَبَ عَلَى اللَّوْحِ الْمَحْفُوظِ.\n     (4) مَتَى خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ.\n     (5) كَمْ أَرْضًا خَلَقَ اللَّهُ وَعَلَى أَىِّ أَرْضٍ نَحْنُ.\n     (6) مَا هُوَ سِجِّينُ وَأَيْنَ يُوجَدُ.\n     (7) أَيْنَ تُوجَدُ جَهَنَّمُ.\n     (8) مَا هِىَ السَّمَوَاتُ وَكَمْ سَمَاءً خَلَقَ اللَّهُ.\n     (9) أَيْنَ تُوجَدُ الْجَنَّةُ. \n     (10) بَعْدَ خَلْقِ السَّمَوَاتِ السَّبْعِ مَاذَا خَلَقَ اللَّهُ.\n     (11) مَتَى خَلَقَ اللَّهُ الْمَلائِكَةَ وَالْجِنَّ وَالْبَهَائِمَ.\n     (12) مِمَّ خَلَقَ اللَّهُ حَوَّاءَ.\n\n\nالدَّرْسُ الثَّامِنُ\nالْمُعْجِزَةُ وَالْكَرَامَةُ\n\nالْمُعْجِزَةُ هِىَ أَمْرٌ خَارِقٌ لِلعَادَةِ يَأْتِى عَلَى وَفْقِ دَعْوَى مَنِ ادَّعَى النُّبُوَّةَ سَالِمٌ مِنَ الْمُعَارَضَةِ بِالْمِثْلِ صَالِحٌ لِلتَّحَدِّى.\nفَمَا كَانَ مِنَ الأُمُورِ عَجِيبًا وَلَمْ يَكُنْ خَارِقاً لِلْعَادَةِ فَلَيْسَ بِمُعْجِزَةٍ كَطَيَرَانِ الطَّائِراتِ وَكَذَلِكَ مَا كَانَ خَارِقًا لَكِنَّهُ لَمْ يَقْتَرِنْ بِدَعْوَى النُّبُوَّةِ كَالْخَوَارِقِ الَّتِى تَظْهَرُ عَلَى أَيْدِى الأَوْلِيَاءِ أَتْبَاعِ الأَنْبِيَاءِ فَإِنَّهَا لَيْسَتْ مُعْجِزَاتٍ بَلْ تُسَمَّى كَرَامَاتٍ.\nوَكَذَلِكَ لَيْسَ مِنَ الْمُعْجِزَةِ مَا يُسْتَطَاعُ مُعَارَضَتُهُ بِالْمِثْلِ كَالْسِّحْرِ فَإِنَّهُ يُعَارَضُ بِسِحْرٍ مِثْلِهِ.\nوَالْمُعْجِزَةُ قِسْمَانِ\n   (1) قِسْمٌ يَقَعُ بَعْدَ اقْتِرَاحٍ مِنَ النَّاسِ عَلَى مَنِ ادَّعَى النُّبُوَّةَ.\n   (2) وَقِسْمٌ يَقَعُ مِنْ غَيْرِ اقْتِرَاحٍ.\nفَالأَوَّلُ نَحْوُ نَاقَةِ صَالِحٍ الَّتِى خَرَجَتْ مِنَ الصَّخْرَةِ إِذِ اقْتَرَحَ قَوْمُهُ عَلَيْهِ ذَلِكَ فَأَخْرَجَ لَهُمْ نَاقَةً وَفَصِيلَهَا أَىِ ابْنَهَا.\nوَالثَّانِى نَحْوُ مَا حَصَلَ لِنَبِيِّنَا مُحَمَّدٍ ﷺ مِنْ حَنِينِ الْجِذْعِ فَقَدْ رَوَى الْبُخَارِىُّ أَنَّ النَّبِىَّ ﷺ كَانَ يَقُومُ يَوْمَ الْجُمُعَةِ إِلَى شَجَرَةٍ أَوْ نَخْلَةٍ فَقَالَتِ امْرَأَةٌ مِنَ الأَنْصَارِ أَوْ رَجُلٌ يَا رَسُولَ اللَّهِ أَلا نَجْعَلُ لَكَ مِنْبَرًا قَالَ «إِنْ شِئْتُمْ» فَجَعَلُوا لَهُ مِنْبَرًا فَلَمَّا كَانَ يَوْمُ الْجُمُعَةِ صَعِدَ إِلَى الْمِنْبَرِ فَأَنَّتِ النَّخْلَةُ أَنِينَ الصَّبِىِّ ثُمَّ نَزَلَ النَّبِىُّ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فَضَمَّهَا إِلَيْهِ.\nوَقَدْ كَانَ الْحَسَنُ بنُ عَلِىٍّ رَضِىَ اللَّهُ عَنْهُما إِذَا ذَكَرَ هَذِهِ الْمُعْجِزَةَ يَقُولُ يَا مَعْشَرَ الْمُسْلِمِينَ الْخَشَبَةُ تَحِنُّ إِلَى رَسُولِ اللَّهِ ﷺ شَوْقًا إِلَى لِقَائِهِ فَأَنْتُمْ أَحَقُّ أَنْ تَشْتَاقُوا إِلَيْهِ.\nالْكَرَامَةُ: أَمَّا الْكَرَامَةُ فَهِىَ أَمْرٌ خَارِقٌ لِلْعَادَةِ تَظْهَرُ عَلَى يَدِ الْمُؤْمِنِ الْمُسْتَقِيمِ بِطَاعَةِ اللَّهِ أَىِ الْوَلِىِّ وَبِذَلِكَ تَفْتَرِقُ الْكَرَامَاتُ عَنِ السِّحْرِ وَالشَّعْوَذَةِ كَمَا حَصَلَ لِسَيِّدَتِنَا مَرْيَمَ وَالِدَةِ سَيِّدِنَا عِيسَى عَلَيْهِمَا السَّلامُ كَانَتْ كُلَّمَا دَخَلَ عَلَيْهَا نَبِىُّ اللَّهِ زَكَرِيَا وَكَانَ زَوْجَ أُخْتِهَا وَجَدَ عِنْدَهَا فَاكِهَةَ الصَّيْفِ فِى الشِّتَاءِ وَفَاكِهَةَ الشِّتَاءِ فِى الصَّيْفِ قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿كُلَّمَا دَخَلَ عَلَيْهَا زَكَرِيَّا الْمِحْرَابَ وَجَدَ عِنْدَهَا رِزْقًا قَالَ يَا مَرْيَمُ أَنَّى لَكِ هَذَا قَالَتْ هُوَ مِنْ عِنْدِ اللَّهِ﴾ [سُورَةَ ءَالِ عِمْرَان/37].\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ تَعْرِيفُ الْمُعْجِزَةِ.\n     (2) مَاذَا تُسَمَّى الْخَوَارِقُ الَّتِى تَحْصُلُ عَلَى أَيْدِى الأَوْلِيَاءِ.\n     (3) إِلَى كَمْ قِسْمٍ تُقْسَمُ الْمُعْجِزَةُ أَعْطِ مِثَالًا.\n     (4) اذْكُرْ مَا رَوَاهُ الْبُخَارِىُّ فِى مُعْجِزَةِ حَنِينِ الْجِذْعِ.\n     (5) مَاذَا كَانَ يَقُولُ الْحَسَنُ بنُ عَلِىٍّ عِنْدَ ذِكْرِ هَذِهِ الْمُعْجِزَةِ.\n     (6) مَا هِىَ الْكَرَامَةُ وَمَا الدَّلِيلُ عَلَى وجُودِهَا مِنَ الْقُرْءَانِ.\n     (7) اذْكُرْ إِحْدَى كَرَامَاتِ السَّيِّدَةِ مَرْيَمَ عَلَيْهَا السَّلامُ.\n\nالدَّرْسُ التَّاسِعُ\nالإِيـمَانُ بِمَا جَاءَ عَنْ النَّبِىِّ ﷺ (1)\nعَذَابُ الْقَبْرِ وَنَعِيمُهُ وَسُؤَالُ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَمَا يَنْطِقُ عَنِ الْهَوَى إِنْ هُوَ إِلَّا وَحْىٌ يُوْحَى﴾ [سُورَةَ النَّجْمِ].\nأَرْسَلَ اللَّهُ تَعَالَى سَيِّدَنَا مُحَمَّدَ بنَ عَبْدِ اللَّهِ بنِ عَبْدِ الْمُطَّلِبِ بِدِينِ الْحَقِّ وَأَمَرَهُ بِتَبْلِيغِهِ إِلَى النَّاسِ فَأَدَّى الأَمَانَةَ وَبَلَّغَ الرِّسَالَةَ بِكُلِّ صِدْقٍ وَشَجَاعَةٍ. \nوَكُلُّ شَىْءٍ أَخْبَرَ بِهِ النَّبِىُّ ﷺ هُوَ حَقٌّ وَصِدْقٌ سَوَاءٌ كَانَ مِنْ أُمُورِ الْحَلالِ وَالْحَرَامِ أَوْ قَصَصِ الأَنْبِيَاءِ أَوِ الأُمُورِ الَّتِى تَحْدُثُ فِى الْمُسْتَقبَلِ فِى الدُّنْيَا وَالآخِرَةِ.\nفَمِنَ الأُمُورِ الَّتِى أَخْبَرَنَا عَنْهَا سَيِّدُنَا مُحَمَّدٌ ﷺ عَذَابُ الْقَبْرِ وَنَعِيمُهُ وَسُؤَالُ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ.\n   (1) عَذَابُ الْقَبْرِ: يَجِبُ الإِيـمَانُ بِأَنَّ اللَّهَ يُعَذِّبُ الْكُفَّارَ جَمِيعَهُمْ فِى قُبُورِهِمْ فَيَأْمُرُ حَشَرَاتٍ فِى الأَرْضِ مُؤْذِيَةً أَنْ تَأْكُلَ أَجْسَادَهُمْ وَيَأْمُرُ الأَرْضَ فَتَنْطَبِقُ عَلَيْهِمْ فَتَكُونُ قُبورُهُمْ حُفْرَةً مِنْ حُفَرِ النَّارِ إِلَى غَيْرِ ذَلِكَ مِنْ أَنْوَاعِ النَّكَدِ وَالْعَذَابِ أَمَا الْمُسْلِمُونَ الْعُصَاةُ مِنْ أَهْلِ الْكَبَائِرِ الَّذِينَ مَاتُوا مِنْ غَيْرِ تَوْبَةٍ فَهُمْ قِسْمَانِ\nقِسْمٌ يُعَذِّبُهُمُ اللَّهُ فِى قُبورِهِمْ.\nوَقِسْمٌ يُعْفِيهُمُ اللَّهُ مِنْ عَذَابِ الْقَبْرِ وَقَدْ يَكُونُ هَذَا الْعَفْوُ بِسَبَبِ اسْتِغْفَارِ مُسْلِمٍ حَىٍّ لَهُ أَوْ قِرَاءَةِ الْقُرْءَانِ لَهُ.\n   (2) وَنَعِيمُ الْقَبْرِ: يَجِبُ الإِيـمَانُ بِأَنَّ اللَّهَ يُنْعِمُ عَلَى عِبَادِهِ الْمُؤْمِنِينَ الْمُتَّقِينَ فِى قُبُورِهِمْ وَمِنْ هَذَا النَّعِيمِ أَنْ تُنَوَّرَ قُبُورُهُمْ بِنُورٍ كَنُورِ الْقَمَرِ لَيْلَةَ الْبَدْرِ وَأَنْ تُوَسَّعَ سَبْعِينَ ذِرَاعًا فِى سَبْعِينَ ذِرَاعًا وَتُمْلَأَ نُورًا إِلَى غَيْرِ ذَلِكَ مِنْ أَنْوَاعِ النَّعِيمِ.\n   (3) وَسُؤَالُ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ: وَيَجِبُ الإِيـمَانُ بِمُنْكَرٍ وَنَكِيرٍ وَهُمَا مَلَكَانِ أَسْوَدَانِ أَزْرَقَانِ يَسأَلانِ الْمَيِّتَ فِى قَبْرِهِ مَا كُنْتَ تَقُولُ فِى هَذَا الرَّجُلِ مُحَمَّدٍ فَإِنْ كَانَ مُؤْمِنًا يَقُولُ أَشْهَدُ أَنَهُ عَبْدُ اللَّهِ وَرَسُولُهُ وَإِنْ كَانَ مِنْ أَهْلِ الْكُفْرِ لا يَنْطِقُ بِهَا فَيَضْرِبَانِهِ بِمِطْرَقَةٍ بَيْنَ أُذُنَيْهِ لَوْ طُرِقَتْ بِهَا الْجِبَالُ لَذَابَتْ.\nوَسُؤَالُ الْمَلَكَيْنِ يَحْصُلُ لِلْمُؤْمِنِ وَالْكَافِرِ وَلَكِنَّ الْمُؤْمِنَ الْكَامِلَ لا يَلْحَقُهُ فَزَعٌ وَلا انْزِعَاجٌ مِنْ سُؤَالِهِمَا لِأَنَ اللَّهَ يُثَبِّتُ قَلْبَهُ فَلا يَرْتَاعُ مِنْ مَنْظَرِهِمَا الْمُخِيفِ وَيُسْتَثْنَى مِنْ هَذَا السُّؤَالِ الأَنْبِيَاءُ وَالشُّهَدَاءُ وَالأَطْفَالُ وَهُمُ الَّذِينَ مَاتُوا دُونَ الْبُلُوغِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ دَلِيلًا مِنَ الْقُرْءَانِ عَلَى صِدْقِ النَّبِىِّ فِيمَا بَلَّغَهُ عَنِ اللَّهِ.\n     (2) عَدِّدْ بَعْضَ مَا أَخْبَرَ عَنْهُ النَّبِىُّ.\n     (3) لِمَنْ يَحْصُلُ عَذَابُ الْقَبْرِ.\n     (4) مَا هُوَ حَالُ الْمُسْلِمِينَ الْعُصَاةِ مِنْ أَهْلِ الْكَبَائِرِ فِى قُبُورِهِمْ.\n     (5) لِمَنْ يَحْصُلُ نَعِيمُ الْقَبْرِ.\n     (6) عَمَّنْ يُسْأَلُ الْعَبْدُ فِى الْقَبْرِ وَمَنْ هُمَا مَلَكَا السُّؤَالِ.\n     (7) لِمَنْ يَحْصُلُ سُؤَالُ الْمَلَكَيْنِ فِى الْقَبْرِ وَمَنْ يُسْتَثْنَى مِنَ السُّؤَالِ فِى الْقَبْرِ.\n\nالدَّرْسُ الْعَاشِرُ\nالإِيـمَانُ بِمَا جَاءَ عَنْ النَّبِىِّ ﷺ (2)\nالْيَوْمُ الآخِرُ وَالْبَعْثُ وَالْحَشْرُ\n\nمِمَّا أَخْبَرَنَا بِهِ النَّبِىُّ ﷺ وَيَجِبُ الإِيـمَانُ بِهِ الْيَوْمُ الآخِرُ وَالْبَعْثُ وَالْحَشْرُ.\nالْيَوْمُ الآخِرُ هُوَ يَوْمُ الْقِيَامَةِ وَأَوَّلُهُ مِنْ خُرُوجِ النَّاسِ مِنْ قُبُورِهِمْ إِلَى اسْتِقْرَارِ أَهْلِ الْجَنَّةِ فِى الْجَنَّةِ وأَهْلِ النَّارِ فِى النَّارِ وَفِى ذَلِكَ الْيَوْمِ تَدْنُو الشَّمْسُ مِنْ رُؤُوسِ الْعِبَادِ وَتَحْصُلُ فِيهِ أَحْوَالٌ صَعْبَةٌ يَنْجُو مِنْهَا الْمُؤْمِنُونَ الأَتْقِيَاءُ وَيُجْمَعُ النَّاسُ لِلْحِسَابِ فَتُعْرَضُ عَلَيْهِمْ أَعْمَالُهُمْ سَوَاءٌ كَانَتْ خَيْرًا أَمْ شَرًّا وَتُوزَنُ أَعْمَالُهُمْ بِمِيزَانٍ فَتُوضَعُ الْحَسَنَاتُ فِى كَفَّةٍ وَالْسَّيِّئَاتُ فِى الْكَفَّةِ الأُخْرَى.\nالْبَعْثُ وَهُوَ انْشِقَاقُ الْقُبُورِ وَخُرُوجُ النَّاسِ مِنْهَا لِلْحِسَابِ بَعْدَ إِعَادَةِ الأَجْسَادِ الَّتِى أَكَلَهَا التُّرَابُ وَهِىَ أَجْسَادُ غَيْرِ الأَنْبِيَاءِ وَالْشُهَدَاءِ فَهَؤُلاءِ لا يَأْكُلُ التُّرَابُ أَجْسَادَهُمْ وَكَذَلِكَ بَعْضُ الأَوْلِيَاءِ لا يَأْكُلُ التُّرَابُ أَجْسَادَهُمْ.\nالْحَشْرُ وَيَكُونُ بَعْدَ الْبَعْثِ حَيْثُ يُجْمَعُ النَّاسُ إِلَى مَكَانٍ لِيُسْأَلُوا عَنْ أَعْمَالِهمُ الَّتِى عَمِلُوهَا وَهَذَا الْمَكَانُ هُوَ الأَرْضُ الْمُبَدَّلَةُ فَهَذِهِ الأَرْضُ الَّتِى نَعِيشُ عَلَيْهَا تُدَكُّ يَوْمَ الْقِيَامَةِ وَيَخْلُقُ اللَّهُ أَرْضًا أُخْرَى لا جِبَالَ فِيهَا وَلا وِدْيَانَ. والنَّاسُ فِى الْحَشْرِ يَكُونُونَ عَلَى ثَلاثَةِ أَقْسَامٍ \n   (1) قِسْمٌ يُحْشَرُونَ طَاعِمِينَ رَاكِبِينَ كَاسِينَ وَهُمُ الأَتْقِيَاءُ أَىِ الَّذِينَ كَانُوا فِى الدُّنْيَا يُؤَدُّونَ الْوَاجِبَاتِ وَيَجْتَنِبُونَ الْمُحَرَّمَاتِ.\n   (2) وَقِسْمٌ يُحْشَرُونَ حُفَاةً عُرَاةً وَهُمُ الْمُسْلِمُونَ مِنْ أَهْلِ الْكَبَائِرِ.\n   (3) وَقِسْمٌ يُحْشَرُونَ وَهُمُ يُجَرُّونَ عَلَى وُجُوهِهِمْ وَهَؤُلاءِ هُمُ الْكُفَّارُ وَقَدْ وَرَدَ فِى عَذَابِ الْمُتَكَبِّرِينَ الَّذِينَ يَتَكَبَّرُونَ عَلَى عِبَادِ اللَّهِ أَنَّهُمْ يُحْشَرُونَ بِحَجْمِ النَّمْلِ الصَّغِيرِ بِصُورَةِ بَنِى ءَادَمَ فَيَدُوسُهُمُ النَّاسُ بِأَقْدَامِهِمْ إِهَانَةً لَهُمْ وَلا يَمُوتُونَ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ الْيَوْمُ الآخِرُ.\n     (2) بِمَ تُوزَنُ أَعْمَالُ الْعِبَادِ يَوْمَ الْقِيَامَةِ.\n     (3) مَا هُوَ الْبَعْثُ.\n     (4) أَجْسَادُ مَنْ لا يَأْكُلُهَا التُّرَابُ.\n     (5) مَا هُوَ الْحَشْرُ وَأَيْنَ يُحْشَرُ النَّاسُ.\n     (6) مَا هِىَ صِفَةُ أَرْضِ الْحَشْرِ وَعَلَى كَمْ قِسْمٍ يَكُونُ الْحَشْرُ.\n     (7) كَيْفَ يُحْشَرُ الأَتْقِيَاءُ وَالْعُصَاةُ.\n     (8) كَيْفَ يُحْشَرُ الْكُفَّارُ وَمَاذَا وَرَدَ فِى عَذَابِ الْمُتَكَبِّرِينَ عَلَى عِبَادِ اللَّهِ.\n\nالدَّرْسُ الْحَادِى عَشَرَ\nالإِيـمَانُ بِمَا جَاءَ عَنِ النَّبِىِّ ﷺ (3)\nالصِّرَاطُ وَالْحَوْضُ وَالشَّفَاعَةُ\n\nمِنَ الأُمُورِ الَّتى أَخْبَرَ عَنْهَا النَّبِىُّ ﷺ وَيَجِبُ الإِيـمَانُ بِهَا الصِّرَاطُ وَالْحَوْضُ وَالشَّفَاعَةُ.\nالصِّرَاطُ: هُوَ جِسْرٌ يُمَدُّ فَوْقَ جَهَنَّمَ يَرِدُهُ النَّاسُ أَحَدُ طَرَفَيْهِ فِى الأَرْضِ الْمُبَدَّلَةِ وَالطَّرَفُ الآخَرُ فِيمَا يَلِى الْجَنَّةَ بَعْدَ النَّارِ فَيَأْتِى النَّاسُ لِلْمُرُورِ عَلَيْهِ فَالْكُفَّارُ لا يَجْتَازُونَهُ أَمَّا الْمُؤْمِنُونَ فَهُمْ عَلَى قِسْمَيْنِ\n   (1) قِسْمٌ لا يَدُوسُونَهُ بِالْمَرَّةِ إِنَّمَا يَمُرُّونَ فِى هَوَائِهِ طَائِريِنَ.\n   (2) وَقِسْمٌ يَدُوسُونَهُ فَمِنْهُمْ مَنْ يَقَعُ فِى النَّارِ وَمِنْهُمْ مَنْ يُنَجِّيهِمُ اللَّهُ فَيَخْلُصُونَ مِنْهَا.\nالْحَوْضُ: وَهُوَ مَكَانٌ أَعَدَّ اللَّهُ فِيهِ شَرَابًا لِأَهْلِ الْجَنَّةِ يَشْرَبُونَ مِنْهُ قَبْلَ دُخُولِهِمُ الْجَنَّةَ وَلِكُلِّ نَبِىٍّ حَوْضٌ يَشْرَبُ مِنْهُ الْمُؤْمِنُونَ مِنْ أُمَّتِهِ وَأَكْبَرُ الأَحْوَاضِ حَوْضُ نَبِيِّنَا مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ يَنْصَبُّ فِيهِ مِنْ مَاءِ الْجَنَّةِ وَمَنْ شَرِبَ مِنْهُ لا يَعْطَشُ بَعْدَ ذَلِكَ أَبَدًا وَيَكُونُ شَرَابُهُمْ فِى الْجَنَّةِ لِلتَّلَذُّذِ. \nالشَّفَاعَةُ: الشَّفَاعَةُ هِىَ طَلَبُ الْخَيْرِ مِنْ الْغَيْرِ لِلْغَيْرِ وَمِمَّنْ يَشْفَعُ يَوْمَ الْقِيَامَةِ الأَنْبِيَاءُ وَالْعُلَمَاءُ الْعَامِلُونَ وَالْمَلائِكَةُ وَكَذَلِكَ الطِّفْلُ يَشْفَعُ لِأَبَوَيْهِ الْمُسْلِمَيْنِ وَالشَّهِيدُ يَشْفَعُ لِسَبْعِينَ مِنْ أَهْلِ بَيْتِهِ وَالشَّفَاعَةُ تَكُونُ لِلْمُؤْمِنِينَ الْعُصَاةِ مِنْ أَهْلِ الْكَبَائِرِ الَّذِينَ مَاتُوا مِنْ غَيْرِ أَنْ يَتُوبُوا قَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «شَفَاعَتِى لِأَهْلِ الْكَبَائِرِ مِنْ أُمَّتِى» رَوَاهُ أَبُو دَاوُدَ، وَلا شَفَاعَةَ يَوْمَ الْقِيَامَةِ لِأَىِّ كَاِفرٍ لِأَنَّ اللَّهَ تَعَالَى قَالَ ﴿وَلا يَشْفَعُونَ إِلَّا لِمَنِ ارْتَضَى﴾ [سُورَةَ الأَنْبِيَاء/28] أَىْ إِلَّا لِمَنْ مَاتَ عَلَى الإِيـمَانِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ الصِّرَاطُ وَهَلْ يَجْتَازُهُ الْكُفَّارُ.\n     (2) الْمُؤْمِنُونَ عِنْدَ عُبُورِ الصِّرَاطِ عَلَى كَمْ قِسْمٍ يَكُونُونَ.\n     (3) مَا هُوَ الْحَوْضُ وَمَنْ يَشْرَبُ مِنْهُ.\n     (4) أَىُّ الأَحْوَاضِ أَكْبَرُ وَمِنْ أَيْنَ يَنْصَبُّ الْمَاءُ فِيهِ.\n     (5) مَا هِىَ الشَّفَاعَةُ وَمَنْ يَشْفَعُ يَوْمَ الْقِيَامَةِ.\n     (6) لِمَنْ تَكُونُ الشَّفَاعَةُ يَوْمَ الْقِيَامَةِ، اذْكُرْ حَدِيِثًا يَدُلُّ عَلَى ذَلِكَ.\n     (7) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَهُ لا شَفَاعَةَ يَوْمَ الْقِيَامَةِ لِأَىِّ كَاِفرٍ.\n\nالدَّرْسُ الثَّانِى عَشَرَ\nالإِيـمَانُ بِمَا جَاءَ عَنْ النَّبِىِّ ﷺ (4)\nالْجَنَّةُ وَالنَّارُ\n\nوَمِنَ الأُمُورِ الَّتِى أَخْبَرَ عَنْهَا النَّبِىُّ ﷺ وَيَجِبُ الإِيـمَانُ بِهَا الْجَنَّةُ وَالنَّارُ.\n   (1) الْجَنَّةُ هِىَ دَارُ السَّلامِ وَالنَّعِيمِ وَالسُّرُورِ أَعَدَّهَا اللَّهُ لِلْمُؤْمِنِينَ فِيهَا أَنْهَارٌ مِنْ عَسَلٍ مُصَفًّى وَمِنْ لَبَنٍ وَمِنْ خَمْرٍ لَيْسَ كَخَمْرِ الدُّنْيَا الَّذِى يُذْهِبُ الْعَقْلَ وَغَيْرُ ذَلِكَ مِنَ النَّعِيمِ الْمُقِيمِ.\nوَالنَّعِيمُ فِيهَا حِسِّىٌّ بِالْجَسَدِ وَالرُّوحِ وَالْجَنَّةُ دَرَجَاتٌ بَعْضُهَا أَعْلَى مِنْ بَعْضٍ وَأَعْلَى دَرَجَةٍ هِىَ دَرَجَةُ الأَنْبِيَاءِ. وَأَهْلُ الْجَنَّةِ لا يَحْزَنُونَ وَلا يَمْرَضُونَ وَلا يَهْرَمُونَ وَلا يَمُوتُونَ خَالِدُونَ فِيهَا وَلا يَخْرُجُونَ مِنْهَا أَبَدًا وَهُمْ فِى نَعِيمٍ دَائِمٍ لا نِهايَةَ لَهُ.\nقَالَ رَسُولُ اللَّهِ ﷺ «أَلا هَلْ مُشَمِّرٌ لِلْجَنَّةِ فَإِنَّ الْجَنَّةَ لا خَطَرَ لَهَا هِىَ وَرَبِّ الْكَعْبَةِ نُورٌ يَتَلَأْلَأُ وَرَيْحَانَةٌ تَهْتَزُّ وَقَصْرٌ مَشِيدٌ وَنَهْرٌ مُطَّرِدٌ وَفَاكِهَةٌ كَثِيرَةٌ نَضِيجَةٌ وَزَوْجَةٌ حَسْنَاءُ جَمِيلَةٌ وَحُلَلٌ كَثِيرَةٌ فِى مُقَامٍ أَبَدِىٍّ فِى حُبْرَةٍ وَنَضْرَةٍ فِى دَارٍ عَاِليَةٍ سَلِيمَةٍ بَهِيَّةٍ» رَوَاهُ ابْنُ حِبَّانَ.\n   (2) النَّارُ أَىْ جَهَنَّمُ يَجِبُ الإِيـمَانُ بِأَنَّهَا دَارُ الشَّقَاءِ وَالْعَذَابِ وَأَنَّهَا لا تَفْنَى أَعَدَّهَا اللَّهُ لِلْكُفَّارِ الَّذِينَ اخْتَارُوا الْكُفْرَ وَأَعْرَضُوا عَنِ الإِسْلامِ وَالنَّارُ فِيهَا عَذَابٌ حِسِّىٌّ حَقِيقِىٌّ وَحَرُّهَا أَشَدُّ بِكَثِيرٍ مِنْ حَرِّ الدُّنْيَا وَبَرْدُهَا أَشَدُّ بِكَثِيرٍ مِنْ بَرْدِ الدُّنْيَا وَهِىَ مَوْجُودَةٌ الآنَ وَمَكَانُهَا تَحْتَ الأَرْضِ السَّابِعَةِ. وَالْكُفَّارُ خَالِدُونَ فِيهَا أَبَدًا لا يَخْرُجُونَ مِنْهَا.\nوَأَمَا عُصَاةُ الْمُسْلِمِينَ مِنْ أَهْلِ الْكَبَائِرِ أَىِ الَّذِينَ كَانُوا يَفْعَلُونَ الْمَعَاصِىَ الْكَبِيرةَ وَمَاتُوا مِنْ غَيْرِ تَوْبَةٍ فَهَؤُلاءِ عَلَى قِسْمَيْنِ\n   (1) قِسْمٌ يُعْفِيهُمُ اللَّهُ مِنْ عَذَابِ النَّارِ بِشَفَاعَةِ النَّبِىِّ ﷺ أَوْ غَيْرِ ذَلِكَ وَيُدْخِلُهُمُ الْجَنَّةَ بِرَحْمَتِهِ بِلا عَذَابٍ.\n   (2) وَقِسْمٌ يُعَذِبُهُمُ اللَّهُ فَتْرَةً فِى نَارِ جَهَنَّمَ ثُمَّ يُخْرِجُهُمْ مِنْهَا وَيُدْخِلُهُمُ الْجَنَّةَ لِأَنَهُمْ مَاتُوا عَلَى الإِيـمَان. \n   قَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ لَعَنَ الْكَافِرِينَ وَأَعَدَّ لَهُمْ سَعِيرًا خَالِدِينَ فِيهَا أَبَدًا لَّا يَجِدُونَ وَلِيًّا وَلا نَصِيرًا﴾ [سُورَةَ الأَحْزَاب].\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ الْجَنَّةُ وَلِمَنْ أَعَدَّهَا اللَّهُ.\n     (2) مَاذَا يُقَالُ عَنِ النَّعِيمِ فِى الْجَنَّةِ.\n     (3) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى وَصْفِ الْجَنَّةِ.\n     (4) لِمَنْ أَعَدَّ اللَّهُ النَّارَ وَأَيْنَ هِىَ الآنَ وَمَنْ يُخَلَّدُ فِيهَا.\n     (5) مَا هُوَ حَالُ الْعُصَاةِ مِنَ الْمُسْلِمِينَ مِمَّنْ مَاتُوا مِنْ غَيْرِ تَوْبَةٍ يَوْمَ الْقِيَامَةِ.\n     (6) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى خُلُودِ الْكُفَّارِ فِى النَّارِ.\n\nالدَّرْسُ الثَّالِثَ عَشَرَ\nأَبْوَابُ الْكُفْرِ وَأَنْوَاعُ الْكَافِرِينَ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيلِ اللَّهِ ثُمَّ مَاتُوا وَهُمْ كُفَّارٌ فَلَنْ يَغْفِرَ اللَّهُ لَهُمْ﴾ [سُورَةَ مُحَمَّد/34].\nالْكُفْرُ نَقِيضُ الإِيـمَانِ كَمَا أَنَّ الْظَلامَ نَقِيضُ النُّورِ وَهُوَ ثَلاثَةُ أَبْوَابٍ التَّشْبِيهُ وَالتَّكْذِيبُ وَالتَّعْطِيلُ.\n   (1) كُفْرُ التَّشْبِيهِ أَىْ تَشْبِيهُ اللَّهِ بِخَلْقِهِ كَالَّذِى يَصِفُ اللَّهَ بِأَنَهُ جَالِسٌ أَوْ أَنَّ لَهُ شَكْلًا وَهَيْئَةً أَوْ يَصِفُهُ بِأَنَّ لَهُ مَكَانًا أَوْ جِهَةً. \n   (2) كُفْرُ التَّكْذِيبِ أَىْ تَكْذِيبُ مَا وَرَدَ فِى الْقُرْءَانِ الْكَرِيمِ أَوْ مَا جَاءَ بِهِ الرَّسُولُ ﷺ عَلَى وَجْهٍ ثَابِتٍ كَإِنْكَارِ بَعْثِ الأَجْسَادِ وَالأَرْوَاحِ مَعًا وَإِنْكَارِ وُجُوبِ الصَّلاةِ وَالصِّيَامِ وَالزَّكَاةِ.\n   (3) كُفْرُ التَّعْطِيلِ وَهُوَ نَفْىُ وُجُودِ اللَّهِ تَعَالَى وَهُوَ أَشَدُّ الْكُفْرِ.\nوَالْكَافِرُ نَوْعَانِ إِمَّا كَافِرٌ أَصْلِىٌّ أَوْ مُرْتَدٌّ عَنِ الإِسْلامِ.\nفَالْكَافِرُ الأَصْلِىُّ هُوَ مَنْ نَشَأَ مِنْ أَبَوَيْنِ كَافِرَيْنِ عَلَى الْكُفْرِ وَبَلَغَ عَلَى الْكُفْرِ.\nأَمَّا الْمُرْتَدُّ فَهُوَ الشَّخْصُ الَّذِى كَانَ مُسْلِمًا وَوَقَعَ فِى أَحَدِ أَنْوَاعِ الرِّدَّةِ.\nقَالَ اللَّهُ تَعَالَى ﴿قُلْ أَبِاللَّهِ وَءَايَاتِهِ وَرَسُولِهِ كُنْتُمْ تَسْتَهْزِؤُونَ لا تَعْتَذِرُوا قَدْ كَفَرْتُمْ بَعْدَ إِيـمَانِكُمْ﴾ [سُورَةَ التَّوْبَة].\nوَالرِّدَّةُ هِىَ الْخُرُوجُ عَنِ الإِسْلامِ فَيَجِبُ عَلَى كُلِّ مُسْلِمٍ أَنْ يَحْفَظَ إِسْلامَهُ وَيَصُونَهُ عَنْ هَذِهِ الرِّدَّةِ الَّتِى تُفْسِدُهُ وَتُبْطِلُهُ وَتَقْطَعُهُ وَالعِياذُ بِاللَّهِ تَعَالَى.\nأَقْسَامُ الرِّدَّةِ: الرِّدَّةُ ثَلاثَةُ أَقْسَامٍ كَمَا قَسَّمَهَا الْعُلَمَاءُ كُفْرٌ اعْتِقَادِىٌّ وَكُفْرٌ فِعْلِىٌّ وَكُفْرٌ قَوْلِىٌّ وَكلُّ قِسْمٍ مِنْ أَقْسَامِ الرِّدَّةِ يَدْخُلُ تَحْتَهُ شُعَبٌ كَثِيرَةٌ.\n   (1) الْكُفْرُ الِاعْتِقَادِىُّ كَنَفْىِ وُجُودِ اللَّهِ تَعَالَى أَوِ اعْتِقَادِ أَنَّ اللَّهَ عَاجِزٌ أَوْ جَاهِلٌ أَوِ اعْتِقَادِ أَنَّ اللَّهَ جِسْمٌ أَوْ ضَوْءٌ أَوْ رُوحٌ أَوْ أَنَّهُ يَتَّصِفُ بِصِفَةٍ مِنْ صِفَاتِ الْخَلْقِ وَالْعِيَاذُ بِاللَّهِ تَعَالَى أَوِ اعْتِقَادِ أَنَّ شُرْبَ الْخَمْرِ حَلالٌ أَوْ أَنَّ السَّرِقَةَ حَلالٌ أَوِ اعْتِقَادِ أَنَّ اللَّهَ لَمْ يَفْرِضِ الصَّلَواتِ الْخَمْسَ أَوْ صِيَامَ شَهْرِ رَمَضَانَ أَوِ الزَّكَاةَ أَوِ الْحَجَّ.\n   (2) الْكُفْرُ الفِعْلِىُّ كَإِلْقَاءِ الُمُصْحَفِ أَوْ أَوْرَاقِ الْعُلُومِ الشَّرْعِيَّةِ عَمْدًا فِى الْقَاذُورَاتِ أَوِ السُّجُودِ لِصَنَمٍ أَوْ لِشَمْسٍ أَوْ مَخْلُوقٍ ءَاخَرَ عَلَى وَجْهِ الْعِبَادَةِ لَهُ وَكَكِتَابَةِ الآيَاتِ الْقُرْءَانِيَّةِ بِالْبَوْلِ.\n   (3) الْكُفْرُ الْقَوْلِىُّ كَسَبِّ اللَّهِ تَعَالَى أَوْ سَبِّ نَبِىٍّ مِنَ الأَنْبِيَاءِ أَوْ مَلَكٍ مِنَ الْمَلائِكَةِ أَوْ سَبِّ الإِسْلامِ أَوِ الْقُرْءَانِ أَوِ الِاسْتِهْزَاءِ بِالصَّلاةِ أَوِ الصِّيَامِ أَوِ الِاعْتِرَاضِ عَلَى اللَّهِ.\nقَالَ رَسُولُ اللَّهِ ﷺ «إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ لا يَرَى بِهَا بَأْسًا يَهْوِى بِهَا فِى النَّارِ سَبْعِينَ خَرِيفًا» رَوَاهُ التِّرْمِذِىُّ، أَىْ مَسَافَةَ سَبْعِينَ عَامًا فِى النُّزُولِ وَذَلِكَ مُنْتَهَى قَعْرِ جَهَنَّمَ وَهُوَ خَاصٌّ بِالْكُفَّارِ وَهَذَا الْحَدِيثُ دَلِيلٌ عَلَى أَنَّهُ لا يُشْتَرَطُ فِى الْوُقُوعِ فِى الْكُفْرِ مَعْرِفَةُ الْحُكْمِ وَلا انْشِرَاحُ الصَّدْرِ وَلا اعْتِقَادُ مَعْنَى اللَّفْظِ وَلا نِيَّةُ الْكُفْرِ.\nوَقَالَ رَسُولُ اللَّهِ ﷺ «أَكْثَرُ خَطَايَا ابْنِ ءَادَمَ مِنْ لِسَانِهِ» رَوَاهُ الطَّبَرَانِىُّ.\nوَالْقَاعِدَةُ أَنَّ كُلَّ اعْتِقَادٍ أَوْ فِعْلٍ أَوْ قَوْلٍ يَدُلُّ عَلَى اسْتِخْفَافٍ بِاللَّهِ أَوْ كُتُبِهِ أَوْ رُسُلِهِ أَوْ مَلائِكَتِهِ أَوْ شَعَائِرِهِ أَوْ مَعَالِمِ دِينِهِ أَوْ أَحْكَامِهِ أَوْ وَعْدِهِ أَوْ وَعِيدِهِ كُفْرٌ فَلْيَحْذَرِ الإِنْسَانُ مِنْ ذَلِكَ جَهْدَهُ.\nفَائِدَةٌ. قَالَ الْعُلَمَاءُ إِنْكَارُ مَا عُلِمَ مِنَ الدِّينِ بِالضَّرُورَةِ كُفْرٌ وَمَعْنَى كَوْنِ الأَمْرِ مَعْلُومًا مِنَ الدِّينِ بِالضَّرُورَةِ أَنْ يَكُونَ هَذَا الأَمْرُ مَعْلُومًا بَيْنَ الْمُسْلِمِينَ عُلَمَائِهِمْ وَعَوَامِّهِمْ لَيْسَ أَمْرًا لا يَعْرِفِهُ إِلَّا الْعُلَمَاءُ وَذَلِكَ كَوُجُوبِ الصَّلَوَاتِ الْخَمْسِ وَوُجُوبِ صَوْمِ رَمَضَانَ وَحِلِّ الْبَيْعِ وَالشِّرَاءِ وَحُرْمَةِ شُرْبِ الْخَمْرِ وَالسَّرِقَةِ فَإِنَّ هَذِهِ الأُمُورَ لا تَخْفَى عَلَى الْمُسْلِمِ مَهْمَا كَانَ جَاهِلًا.\nوَلْيُعْلَمْ أَنَّ مَنْ كَفَرَ لا يَرْجِعُ إِلَى الإِسْلامِ إِلَّا بِالنُّطْقِ بِالشَّهَادَتَيْنِ بَعْدَ رُجُوعِهِ عَنِ الْكُفْرِ فَلا يَرْجِعُ الْكَافِرُ إِلَى الإِسْلامِ بِقَوْلِ أَسْتَغْفِرُ اللَّهَ بَلْ يَزِيدُهُ ذَلِكَ كُفْرًا وَلا تَنْفَعُهُ الشَّهَادَتَانِ مَا دَامَ عَلَى كُفْرِهِ لَمْ يَرْجِعْ عَنْهُ.\n\n     أَسْئِلَةٌ\n     (1) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَّ اللَّهَ لا يَغْفِرُ الْكُفْرَ لِمَنْ مَاتَ عَلَيْهِ.\n     (2) مَا هُوَ الْكُفْرُ وَمَا هِىَ أَبْوَابُهُ.\n     (3) مَا هُوَ كُفْرُ التَّشْبِيهِ.\n     (4) مَا هُوَ كُفْرُ التَّكْذِيبِ.\n     (5) مَا هُوَ كُفْرُ التَّعْطِيلِ.\n     (6) كَمْ نَوْعًا الْكُفَّارُ.\n     (7) مَنْ هُوَ الْكَافِرُ الأَصْلِىُّ وَمَنْ هُوَ الْمُرْتَدُّ.\n     (8) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَلَى ثُبُوتِ حُكْمُ الرِّدَّةِ عَلَى مَنِ اسْتَهْزَأَ بِاللَّهِ أَوْ رَسُولِهِ.\n     (9) مَا هِىَ الرِّدَّةُ وَكَمْ قِسْمًا هِىَ.\n     (10) اذْكُرْ بَعْضَ الأَمْثِلَةِ عَلَى الْكُفْرِ الِاعْتِقَادِىِّ.\n     (11) اذْكُرْ بَعْضَ الأَمْثِلَةِ عَلَى الْكُفْرِ الْفِعْلِىِّ.\n     (12) اذْكُرْ بَعْضَ الأَمْثِلَةِ عَلَى الْكُفْرِ الْقَوْلِىِّ.\n     (13) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِيهِ دَلِيلٌ عَلَى أَنَّهُ لا يُشْتَرَطُ فِى الْوُقُوعِ فِى الْكُفْرِ مَعْرِفَةُ الْحُكْمِ.\n     (14) كَيْفَ يَرْجِعُ مَنْ كَفَرَ إِلَى الإِسْلامِ.\n\nالدَّرْسُ الرَّابِعَ عَشَرَ\nالإِيـمَانُ بِالْقَدَرِ خ

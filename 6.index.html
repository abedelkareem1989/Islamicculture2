بَعَةٍ وَتِسْعِينَ (194) لِيتْرًا إِذَا اعْتُبِرَ الذِّرَاعُ الشَّرْعِيُّ (46,2) سَنْتِمْ. أَمَّا الْمَاءُ الْقَلِيلُ فَهُوَ مَا كَانَ دُونَ الْقُلَّتَيْنِ.\n\n     أَسْئِلَةٌ.\n     (1) إِلَى كَمْ قِسْمٍ تُقْسَمُ الْمِيَاهُ.\n     (2) مَا هُوَ الْمَاءُ الطَّهُورُ أَعْطِ مِثَالًا.\n     (3) مَا هُوَ الْمَاءُ الْمُسْتَعْمَلُ.\n     (4) الْمَاءُ الطَّاهِرُ غَيْرُ الْمُطَهِّرِ هَلْ نَسْتَطِيعُ أَنْ نَسْتَعْمِلَهُ لِلْوُضُوءِ وَالْغُسْلِ.\n     (5) الْمَاءُ الطَّاهِرُ غَيْرُ الْمُطَهِّرِ هَلْ نَسْتَطِيعُ أَنْ نَسْتَعْمِلَهُ لِغَسْلِ الثِّيَابِ الْمُتَنَجِّسَةِ وَغَيْرِ الْمُتَنَجِّسَةِ.\n     (6) الْمَاءُ الْقَلِيلُ الَّذِى وَقَعَتْ فِيهِ نَجَاسَةٌ غَيْرُ مَعْفُوٍّ عَنْهَا مَاذَا يُعْتَبَرُ.\n     (7) مَتَى يَتَنَجَّسُ الْمَاءُ الْكَثِيرُ.\n     (8) مَا هُوَ الْمَاءُ الْكَثِيرُ وَمَا هُوَ الْمَاءُ الْقَلِيلُ.\n\nالدَّرْسُ الثَّانِى\nالتَّطْهِيرُ مِنَ النَّجَاسَاتِ\n\nالنَّجَاسَاتُ عَلَى نَوْعَيْنِ عَيْنِيَّةٌ وَحُكْمِيَّةٌ.\nالنَّجَاسَةُ الْعَيْنِيَّةُ هِىَ الَّتِى بَقِىَ جِرْمُهَا أَوِ الَّتِى يُدْرَكُ لَهَا لَوْنٌ أَوْ طَعْمٌ أَوْ رِيحٌ كَنُقْطَةِ دَمٍ عَلَى ثَوْبٍ وَتُزَالُ بِصَبِّ الْمَاءِ الطَّاهِرِ الْمُطَهِّرِ عَلَيْهَا إِلَى أَنْ يَذْهَبَ جِرْمُهَا وَأَوْصَافُهَا.\nالنَّجَاسَةُ الْحُكْمِيَةُ وَهِىَ النَّجَاسَةُ الَّتِى لَيْسَ لَهَا لَوْنٌ وَلا طَعْمٌ وَلا رِيحٌ كَبَوْلٍ أَصَابَ ثَوْبًا ثُمَّ جَفَّ فَذَهَبَ جِرْمُهُ وَانْقَطَعَ رِيحُهُ وَلَوْنُهُ وَطَعْمُهُ فَإِنَّهُ يَطْهُرُ بِإِجْرَاءِ الْمَاءِ الطَّاهِرِ الْمُطَهِّرِ عَلَيْهِ.\nثُمَّ إِذَا كَانَتِ النَّجَاسَةُ كَلْبِيَّةً أَوْ خِنْزِيرِيَّةً كَأَنْ أَصَابَ رِيقُ كَلْبٍ أَوْ خِنْزِيرٍ يَدَ إِنْسَانٍ أَوْ ثَوْبَهُ أَوْ وِعَاءَهُ فَإِنَّهُ يَطْهُرُ بِغَسْلِهِ سَبْعَ مَرَّاتٍ بِالْمَاءِ الطَّاهِرِ الْمُطَهِّرِ إِحْدَاهُنَّ مَمْزُوجَةٌ بِالتُّرَابِ الطَّهُورِ.\nوَهُنَاكَ نَجَاسَاتٌ مَعْفُوٌّ عَنْهَا كَرَشَاشِ بَوْلٍ لا يُرَى بِالْعَيْنِ الْمُجَرَّدَةِ إِذَا وَقَعَ فِى الْمَاءِ لا يُنَجِّسُهُ، وَمَيْتَةُ مَا لَيْسَ لَهُ دَمٌ يَسِيلُ إِذَا وَقَعَ فِى الْمَاءِ وَمَاتَ فِيهِ لا يُنَجِّسُهُ كَالذُّبَابِ وَالْبَرْغَشِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ النَّجَاسَةُ الْعَيْنِيَّةُ أَعْطِ مِثَالًا.\n     (2) كَيْفَ تُزَالُ النَّجَاسَةُ الْعَيْنِيَّةُ عَنِ الْمَوْضِعِ الَّذِى أَصَابَتْهُ.\n     (3) مَا هِىَ النَّجَاسَةُ الْحُكْمِيَّةُ أَعْطِ مِثَالًا.\n     (4) كَيْفَ نُطَهِّرُ الْمَوْضِعَ الْمُتَنَجِّسَ بِنَجَاسَةٍ حُكْمِيَّةٍ.\n     (5) كَيْفَ نُطَهِّرُ الْمَوْضِعَ الَّذِى أَصَابَتْهُ نَجَاسَةٌ كَلْبِيَّةٌ أَوْ خِنْزِيرِيَّةٌ.\n     (6) أَعْطِ مِثَالًا عَنْ نَجَاسَةٍ كَلْبِيَّةٍ.\n     (7) هَلْ هُنَاكَ نَجَاسَاتٌ مَعْفُوٌّ عَنْهَا أَعْطِ مِثَالًا.\n     (8) هَلْ يَتَنَجَّسُ الْمَاءُ إِذَا وَقَعَتْ فِيهِ نَجَاسَةٌ مَعْفُوٌّ عَنْهَا.\n\nالدَّرْسُ الثَّالِثُ\nشُرُوطُ الطَّهَارَةِ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [سُورَةَ الْبَقَرَةِ/222].\nوَقَالَ رَسُولُ اللَّهِ ﷺ »الطُّهُورُ شَطْرُ الإِيـمَانِ« رَوَاهُ مُسْلِمٌ.\nوَمَعْنَى الطُّهُورِ الطَّهَارَةُ مِنَ الْحَدَثَيْنِ الأَكْبَرِ وَالأَصْغَرِ وَمِنَ النَّجَاسَةِ. وَلِلطَّهَارَةِ شُرُوطٌ لا بُدَّ مِنْهَا حَتَّى تَكُونَ صَحِيحَةً وَهِىَ\n   (1) الإِسْلامُ أَىْ أَنْ يَكُونَ الشَّخْصُ مُسْلِمًا فَلا تَصِحُّ الطَّهَارَةُ مِنْ كَافِرٍ.\n   (2) وَالتَّمْيِيزُ وَهُوَ أَنْ يَبْلُغَ الْوَلَدُ مِنَ الْعُمُرِ إِلَى حَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ وَيَسْتَقِّلُ بِالأَكْلِ وَالشُّرْبِ وَيَتَجَنَّبُ النَّجَاسَاتِ وَغَالِبُ سِنِّ التَّمْيِيزِ سِتُّ أَوْ سَبْعُ سِنِينَ وَقَدْ يَكُونُ أَقَلَّ مِنْ ذَلِكَ.\n   (3) وَعَدَمُ وُجُودِ مَانِعٍ مِنْ وُصُولِ الْمَاءِ إِلَى الْعُضْوِ الْمَغْسُولِ كَالْبَويَا وَالشَّحْمِ وَطِلاءِ الأَظَافِرِ (الْمَنَاكِير).\n   (4) وَالسَّيَلانُ أَىْ أَنْ يَجْرِىَ الْمَاءُ بِطَبْعِهِ عَلَى الْعُضْوِ الْمَغْسُولِ فَلَوْ بَلَلْتَ يَدَكَ بِالْمَاءِ وَمَسَحْتَ بِهَا وَجْهَكَ أَوْ يَدَيْكَ فِى الْوُضُوءِ فَإِنَّهُ لا يَصِحُّ وُضُوؤُكَ.\n   (5) وَأَنْ يَكُونَ الْمَاءُ طَاهِرًا مُطَهِّرًا أَىْ غَيْرَ نَجِسٍ وَغَيْرَ مُسْتَعْمَلٍ فِى غُسْلٍ أَوْ وُضُوءٍ سَابِقٍ أَوْ فِى إِزَالَةِ نَجِسٍ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى أَمْرِ الطَّهَارَةِ.\n     (2) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى شَأْنِ الطُّهُورِ.\n     (3) مَا مَعْنَى الطُّهُورِ.\n     (4) عَدِّدْ شُرُوطَ الطَّهَارَةِ.\n     (5) مَا هُوَ التَّمْيِيزُ.\n     (6) أَعْطِ مِثَالًا عَنْ مَانِعٍ يَمْنَعُ مِنْ وُصُولِ الْمَاءِ إِلَى الْعُضْوِ الْمَغْسُولِ.\n     (7) مَا هُوَ السَّيَلانُ.\n\n\nالدَّرْسُ الرَّابِعُ\nالِاسْتِنْجَـــاءُ\n\nيَجِبُ الِاسْتِنْجَاءُ مِنْ خُرُوجِ رَطْبٍ نَجِسٍ مِنْ أَحَدِ السَّبِيلَيْنِ أَىِ الْقُبُلِ وَالدُّبُرِ، فَإِذَا خَرَجَ مِنَ الإِنْسَانِ بَوْلٌ أَوْ غَائِطٌ فَعَلَيْهِ أَنْ يَسْتَنْجِىَ قَبْلَ الصَّلاةِ لِتَصِحَّ صَلاتُهُ. وَلا يَجِبُ الِاسْتِنْجَاءُ لِخُرُوجِ الرِّيحِ.\nوَالِاسْتِنْجَاءُ إِمَّا أَنْ يَكُونَ بِالْمَاءِ وَإِمَّا أَنْ يَكُونَ بِشَىْءٍ طَاهِرٍ جَامِدٍ يَقْلَعُ النَّجَاسَةَ أَىْ يُزِيلُ عَيْنَهَا كَالْحَجَرِ أَوِ الْوَرَقِ غَيْرِ مُحْتَرَمٍ وَالْمُحْتَرَمُ كَوَرَقَةٍ مَكْتُوبٍ عَلَيْهَا عِلْمٌ شَرْعِىٌّ. \nوَالِاسْتِنْجَاءُ بِالْمَاءِ يَكُونُ بِصَبِّ الْمَاءِ الْمُطَهِّرِ عَلَى مَحَلِّ النَّجَاسَةِ حَتَّى يَطْهُرَ الْمَحَلُّ.\nوَأَمَّا الِاسْتِنْجَاءُ بِغَيْرِ الْمَاءِ كَالْحَجَرِ فَيَكُونُ بِمَسْحِ الْمَخْرَجِ ثَلاثَ مَسَحَاتٍ حَتَّى يَنْقَى الْمَحَلُّ فَإِنْ لَمْ يَنْقَ الْمَحَلُّ زَادَ عَلَى ثَلاثِ مَسَحَاتٍ حَتَّى يَنْقَى وَلا يَكْفِى أَقَلُّ مِنْ ثَلاثِ مَسَحَاتٍ وَلَوْ حَصَلَ النَّقَاءُ بِمَسْحَتَيْنِ.\n\nفَائِدَةٌ\nيُسَنُّ لِدَاخِلِ الْخَلاءِ أَنْ يَقُولَ عِنْدَ الدُّخُولِ بِسْمِ اللَّهِ اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنْ الْخُبُثِ وَالْخَبَائِثِ وَعِنْدَ الْخُرُوجِ غُفْرَانَكَ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى.\n\n     أَسْئِلَةٌ\n     (1) مِمَّ يَجِبُ الِاسْتِنْجَاءُ وَمَا مَعْنَى السَّبِيلَيْنِ.\n     (2) هَلْ يَجِبُ الِاسْتِنْجَاءُ لِخُرُوجِ الرِّيحِ، مَا هُوَ الْقُبُلُ وَمَا هُوَ الدُّبُرُ.\n     (3) بِمَ يَكُونُ الِاسْتِنْجَاءُ.\n     (4) مَا مَعْنَى شَىْءٌ يَقْلَعُ النَّجَاسَةَ وَأَعْطِ مِثَالًا.\n     (5) كَيْفَ يَكُونُ الِاسْتِنْجَاءُ بِالْمَاءِ.\n     (6) مَنْ أَرَادَ الِاسْتِنْجَاءَ بِغَيْرِ الْمَاءِ كَالْحَجَرِ كَمْ مَرَّةً يَمْسَحُ الْمَخْرَجَ.\n     (7) هَلْ يَكْفِى فِى الِاسْتِنْجَاءِ بِغَيْرِ الْمَاءِ أَقَلُّ مِنْ ثَلاثِ مَسَحَاتٍ.\n     (8) إِنْ مَسَحَ ثَلاثَ مَرَّاتٍ وَلَمْ يَنْقَ الْمَحَلُّ مَاذَا يَفْعَلُ.\n     (9) مَاذَا يُسَنُّ لِدَاخِلِ الْخَلاءِ أَنْ يَقُولَ.\n     (10) مَاذَا يُسَنُّ عِنْدَ الْخُرُوجِ مِنَ الْخَلاءِ أَنْ يَقُولَ.\nالدَّرْسُ الْخَامِسُ\nالْوُضُوءُ فَرَائِضُهُ وَسُنَنُهُ\n\nقَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُؤُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَينِ﴾ [سُورَةَ الْمَائِدَةِ/6].\nوَأَرْكَانُ الْوُضُوءِ سِتَّةٌ هِىَ\nالنِّيَّةُ بِالْقَلْبِ عِنْدَ غَسْلِ الْوَجْهِ فَيَقُولُ بِقَلْبِهِ مَثَلًا نَوَيْتُ الْوُضُوءَ.\nغَسْلُ الْوَجْهِ مِنْ مَنَابِتِ شَعَرِ الرَّأْسِ إِلَى أَسْفَلِ الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ.\nغَسْلُ الْيَدَيْنِ إِلَى الْمِرْفَقَيْنِ أَىْ يَغْسِلُ يَدَيْهِ مِنْ رُؤُوسِ الأَصَابِعِ إِلَى الْمِرْفَقَيْنِ وَالْمِرْفَقُ هُوَ الْعَظْمُ عِنْدَ مُلْتَقَى السَّاعِدِ وَالْعَضُدِ.\nمَسْحُ بَعْضِ الرَّأْسِ.\nغَسْلُ الرِّجْلَيْنِ إِلَى الْكَعْبَيْنِ أَىْ مَعَ الْكَعْبَيْنِ وَالْكَعْبَانِ هُمَا الْعَظْمَانِ النَّاتِئَانِ عِنْدَ جَانِبَىِ الْقَدَمِ.\nالتَّرْتِيبُ أَىْ أَنْ يَنْوِىَ عِنْدَ غَسْلِ الْوَجْهِ ثُمَّ يَغْسِلُ وَجْهَهُ ثُمَّ يَدَيْهِ ثُمَّ يَمْسَحُ بَعْضَ رَأْسِهِ ثُمَّ يَغْسِلُ رِجْلَيْهِ.\n\nوَمِنْ سُنَنِ الْوُضُوءِ \n   (1) التَّسْمِيَةُ أَىْ قَوْلُ بِسْمِ اللَّهِ عِنْدَ الْبَدْءِ.\t\n   (2) وَاسْتِعْمَالُ السِّوَاكِ.\n   (3) وَغَسْلُ الْكَفَّيْنِ.\n   (4) وَالْمَضْمَضَةُ.\n   (5) وَالِاسْتِنْشَاقُ.\n   (6) وَمَسْحُ جَمِيعِ الرَّأْسِ.\n   (7) وَمَسْحُ الأُذُنَيْنِ ظَاهِرِهِمَا وَبَاطِنِهِمَا بِمَاءٍ جَدِيدٍ.\n   (8) وَتَخْلِيلُ أَصَابِعِ الْيَدَيْنِ وَالرِّجْلَيْنِ.\n   (9) وَتَقْدِيمُ الْيُمْنَى عَلَى الْيُسْرَى.\n   (10) وَالطَّهَارَةُ ثَلاثًا ثَلاثًا.\n   (11) وَالدَّلْكُ.\n   (12) وَالْمُوَالاةُ وَهِىَ غَسْلُ الْعُضْوِ قَبْلَ أَنْ يَجِفَّ الْعُضْوُ الَّذِى قَبْلَهُ.\n   (13) وَتَقْلِيلُ الْمَاءِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ الآيَةُ الَّتِى تَدُلُّ عَلَى فَرْضِيَةِ الْوُضُوءِ.\n     (2) كَمْ هِىَ أَرْكَانُ الْوُضُوءِ عَدِّدْهَا.\n     (3) مَتَى تَنْوِى الْوُضُوءَ.\n     (4) مَا هُوَ الْقَدْرُ الْوَاجِبُ غَسْلُهُ مِنَ الْوَجْهِ.\n     (5) مَا هُوَ الْقَدْرُ الْوَاجِبُ غَسْلُهُ مِنَ الْيَدَيْنِ.\n     (6) مَا هُوَ الْمِرْفَقُ.\n     (7) مَا هُوَ الْقَدْرُ الْوَاجِبُ غَسْلُهُ مِنَ الرِّجْلَيْنِ.\n     (8) مَا هُمَا الْكَعْبَانِ.\n     (9) مَا مَعْنَى التَّرْتِيبِ.\n     (10) عَدِّدْ بَعْضَ سُنَنِ الْوُضُوءِ.\n\nالدَّرْسُ السَّادِسُ\nنَوَاقِضُ الْوُضُوءِ وَمَكْرُوهَاتُهُ\n\nمِنَ الأُمُورِ الَّتِى تَنْقُضُ الْوُضُوءَ\n   (1) خُرُوجُ شَىْءٍ مِنَ السَّبِيلَيْنِ كَخُرُوجِ الْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ أَوِ الدُّودِ.\n   (2) وَمَسُّ قُبُلِ الآدَمِىِّ أَوْ حَلْقَةِ دُبُرِهِ.\n   (3) وَالنَّوْمُ عَلَى غَيْرِ هَيْئَةِ الْمُتَمَكِّنِ أَىْ عَلَى غَيْرِ حَالَةِ الْقُعُودِ مَعَ إِلْصَاقِ دُبُرِهِ بِمَكَانِ جُلُوسِهِ بِحَيْثُ لا يَبْقَى تَجَافٍ بَيْنَهَا وَبَيْنَ مَكَانِ جُلُوسِهِ، أَمَّا النُّعَاسُ فَلا يَنْقُضُ الْوُضُوءَ وَالنُّعَاسُ هُوَ الَّذِى يُسْمَعُ فِيهِ الْكَلامُ لَكِنْ لا يُفْهَمُ وَلا تُرَى فِيهِ رُؤْيَا.\n   (4) زَوَالُ الْعَقْلِ فَمَنْ غَابَ عَقْلُهُ بِالْجُنُونِ أَوِ الإِغْمَاءِ انْتَقَضَ وُضُوؤُهُ.\n\nمِنْ مَكْرُوهَاتِ الْوُضُوءِ\n   (1) تَقْدِيمُ الْيُسْرَى عَلَى الْيُمْنَى.\n   (2) وَالزِّيَادَةُ عَلَى الثَّلاثِ فِى الغَسْلِ.\n   (3) وَالإِسْرَافُ فِى الْمَاءِ.\n   (4) وَالْكَلامُ الَّذِى لا خَيْرَ فِيهِ أَثْنَاءَ الْوُضُوءِ.\n   (5) وَتَرْكُ التَّسْمِيَةِ.\n\n     أَسْئِلَةٌ\n     (1) عَدِّدْ بَعْضَ مَا يَنْقُضُ الْوُضُوءَ.\n     (2) مَا مَعْنَى السَّبِيلَيْنِ.\n     (3) هَلِ النُّعَاسُ يَنْقُضُ الْوُضُوءَ وَمَا هُوَ النُّعَاسُ.\n     (4) مَا مَعْنَى زَوَالِ الْعَقْلِ.\n     (5) عَدِّدْ بَعْضَ مَكْرُوهَاتِ الْوُضُوءِ.\n\nالدَّرْسُ السَّابِعُ\nالأَذَانُ وَالإِقَامَـةُ\n\nإِذَا دَخَلَ وَقْتُ الصَّلاةِ يُسَنُّ أَنْ يَقُومَ أَحَدُ الْمُسْلِمِينَ بِالدَّعْوَةِ إِلَى أَدَائِهَا بِصَوْتٍ مُرْتَفِعٍ وَهَذَا يُسَمَّى الأَذَانَ، يَقِفُ الْمُؤَذِّنُ مُتَطَهِّرًا فِى مَكَانٍ مُرْتَفِعٍ مُتَوَجِّهًا إِلَى الْقِبْلَةِ وَيَقُولُ \nاللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ.\nأَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ، أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ.\nأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\nحَىَّ عَلَى الصَّلاةِ، حَىَّ عَلَى الصَّلاةِ. \nحَىَّ عَلَى الْفَلاحِ، حَىَّ عَلَى الْفَلاحِ.\nاللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، لا إِلَهَ إِلَّا اللَّهُ.\nوَفِى أَذَانِ الصُّبْحِ يَزِيدُ الْمُؤَذِّنُ بَعْدَ قَوْلِهِ حَىَّ عَلَى الْفَلاحِ الثَّانِيَةِ الصَّلاةُ خَيْرٌ مِنَ النَّوْمِ الصَّلاةُ خَيْرٌ مِنَ النَّوْمِ.\nوَيُسَنُّ لِلْمُسْتَمِعِينَ أَنْ يُرَدِّدُوا وَرَاءَ الْمُؤَذِّنِ مِثْلَمَا يَقُولُ وَلَكِنْ حِينَ يَقُولُ حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاحِ يَقُولُونَ لا حَوْلَ وَلا قُوَّةَ إِلَّا باللَّهِ. \nالإِقَامَةُ\nبَعْدَ أَنْ يَنْتَهِىَ الْمُؤَذِّنُ مِنَ الأَذَانِ وَيَجْتَمِعَ النَّاسُ لِتَأْدِيَةِ الصَّلاةِ الْمَفْرُوضَةِ يَتَوَلَّى أَحَدُهُمْ إِقَامَةَ الصَّلاةِ فَيَقُولُ\nاللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ. \nحَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاحِ، قَدْ قَامَتِ الصَّلاةُ قَدْ قَامَتِ الصَّلاةُ، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، لا إِلَهَ إِلَّا اللَّهُ.\nوَيُسَنُّ بَعْدَ الأَذَانِ وَالإِقَامَةِ الصَّلاةُ عَلَى النَّبِىِّ ﷺ.\n\n     أَسْئِلَةٌ\n     (1) إِذَا دَخَلَ وَقْتُ الصَّلاةِ مَاذَا يُسَنُّ قَبْلَ الدُّخُولِ فِيهَا.\n     (2) هَلْ تَحْفَظُ أَلْفَاظَ الأَذَانِ مَا هِىَ.\n     (3) مَاذَا يَزِيدُ الْمُؤَذِّنُ فِى أَذَانِ الصُّبْحِ.\n     (4) مَاذَا يُسَنُّ لِلْمُسْتَمِعِينَ لِلْمُؤَذِّنِ أَنْ يَقُولُوا.\n     (5) هَلْ تَحْفَظُ أَلْفَاظَ إِقَامَةِ الصَّلاةِ مَا هِيَ.\n     (6) مَاذَا يُسَنُّ بَعْدَ الأَذَانِ وَالإِقَامَةِ أَنْ تَقُولَ.\n\nالدَّرْسُ الثَّامِنُ\nالصَّلَوَاتُ الْمَفْرُوضَةُ وَأَوْقَاتُهَا\n\nالصَّلَوَاتُ الْمَفْرُوضَةُ فِى كُلِّ يَوْمٍ وَلَيْلَةٍ خَمْسٌ هِىَ \nالصُّبْحُ وَالظُّهْرُ وَالْعَصْرُ وَالْمَغْرِبُ وَالْعِشَاءُ. وَأَوْقَاتُ هَذِهِ الصَّلَوَاتِ هِىَ\n(1) الصُّبْحُ وَيَبْدَأُ وَقْتُهَا مِنْ طُلُوعِ الْفَجْرِ الصَّادِقِ وَهُوَ بَيَاضٌ يَظْهَرُ فِى عَرْضِ الأُفُقِ الشَّرْقِىِّ وَيَنْتَهِى بِطُلُوعِ الشَّمْسِ.\n(2) الظُّهْرُ وَيَبْدَأُ وَقْتُهَا إِذَا مَالَتِ الشَّمْسُ عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْعَصْرِ.\n(3) الْعَصْرُ وَيَبْدَأُ وَقْتُهَا إِذَا صَارَ ظِلُّ الشَّىْءِ مِثْلَهُ زَائِدًا عَلَى ظِلِّهِ لَمَّا كَانَتِ الشَّمْسُ فِى وَسَطِ السَّمَاءِ وَهُوَ ظِلُّ الِاسْتِوَاءِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْمَغْرِبِ.\n(4) الْمَغْرِبُ وَيَبْدَأُ وَقْتُهَا مِنْ مَغِيبِ الشَّمْسِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْعِشَاءِ.\n(5) الْعِشَاءُ وَيَبْدَأُ وَقْتُهَا مِنْ مَغِيبِ الشَّفَقِ الأَحْمَرِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الصُّبْحِ.\nفَيَجِبُ أَدَاءُ هَذِهِ الصَّلَوَاتِ فِى أَوْقَاتِهَا وَلا يَجُوزُ تَقْدِيمُهَا أَوْ تَأْخِيرُهَا عَنْ وَقْتِهَا إِلَّا لِعُذْرٍ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ الصَّلَوَاتُ الْمَفْرُوضَةُ فِى كُلِّ يَوْمٍ وَلَيْلَةٍ.\n     (2) كَيْفَ يَبْدَأُ وَقْتُ الصُّبْحِ وَكَيْفَ يَنْتَهِى.\n     (3) مَا هُوَ الْفَجْرُ الصَّادِقُ.\n     (4) مَتَى يَبْدَأُ وَقْتُ الظُّهْرِ وَمَتَى يَنْتَهِى.\n     (5) مَتَى يَبْدَأُ وَقْتُ الْعَصْرِ وَمَتَى يَنْتَهِى.\n     (6) مَتَى يَبْدَأُ وَقْتُ الْمَغْرِبِ وَمَتَى يَنْتَهِى.\n     (7) مَتَى يَبْدَأُ وَقْتُ الْعِشَاءِ وَمَتَى يَنْتَهِى.\n\nالدَّرْسُ التَّاسِعُ\nشُرُوطُ صِحَّةِ الصَّلاةِ\n\nشُرُوطُ صِحَّةِ الصَّلاةِ هِىَ الأُمُورُ الَّتِى يَجِبُ تَوَفُّرُهَا فِى الْمُصَلِّي قَبْلَ الشُّرُوعِ فِى الصَّلاةِ وَمِنْهَا\nالإِسْلامُ فَلا تَصِحُّ الصَّلاةُ مِنْ كَافِرٍ.\nوَالتَّمْيِيزُ وَهُوَ أَنْ يَكُونَ الْوَلَدُ وَصَلَ إِلَى سِنٍّ بِحَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ.\nوَالْوُضُوءُ أَىْ لا بُدَّ أَنْ يَكُونَ الشَّخْصُ مُتَوَضِّئًا وَإِلَّا فَلا تَصِحُّ صَلاتُهُ.\nوَطَهَارَةُ ثِيَابِ الْمُصَلِّى وَجِسْمِهِ وَالْمَكَانِ الَّذِى يُصَلِّى فِيهِ مِنَ النَّجَاسَةِ الَّتِى لا يُعْفَى عَنْهَا.\nوَسَتْرُ الْعَوْرَةِ أَىْ أَنْ يَسْتُرَ الرَّجُلُ مِنَ السُّرَّةِ إِلَى الرُّكْبَةِ أَمَّا الْمَرْأَةُ الْحُرَّةُ فَعَلَيْهَا أَنْ تَسْتُرَ جَمِيعَ بَدَنِهَا مَا عَدَا وَجْهَهَا وَكَفَّيْهَا.\nوَالْعِلْمُ بِدُخُولِ وَقْتِ الصَّلاةِ أَىْ أَنْ يَعْرِفَ الْمُصَلِّى أَنَّ وَقْتَ الصَّلاةِ قَدْ دَخَلَ.\nوَاسْتِقْبَالُ الْقِبْلَةِ أَىِ الْكَعْبَةِ الْمُشَرَّفَةِ الَّتِى فِى مَكَّةَ الْمُكَرَّمَةِ فَالْمُصَلِّى الَّذِى يُخِلُّ بِشَرْطٍ مِنْ هَذِهِ الشُّرُوطِ لا تَصِحُّ صَلاتُهُ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ شُرُوطُ صِحَّةِ الصَّلاةِ.\n     (2) عَدِّدْ شُرُوطَ صِحَّةِ الصَّلاةِ.\n     (3) مَا هُوَ التَّمْيِيزُ.\n     (4) هَلْ تَصِحُّ الصَّلاةُ بِدُونِ وُضُوءٍ.\n     (5) هَلْ تَصِحُّ الصَّلاةُ إِذَا كَانَ عَلَى ثِيَابِ الْمُصَلِّى نَجَاسَةٌ لا يُعْفَى عَنْهَا.\n     (6) مَا هِىَ عَوْرَةُ الرَّجُلِ وَعَوْرَةُ الْمَرْأَةِ الْحُرَّةِ.\n     (7) مَا مَعْنَى الْعِلْمِ بِدُخُولِ وَقْتِ الصَّلاةِ.\n     (8) مَا هِىَ الْقِبْلَةُ.\n     (9) مَنْ أَخَلَّ بِشَرْطٍ مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ مَا حُكْمُ صَلاتِهِ.\n\nالدَّرْسُ الْعَاشِرُ\nأَرْكَانُ الصَّلاةِ\n\nالصَّلاةُ لَهَا أَرْكَانٌ وَسُنَنٌ فَالأَرْكَانُ لا تَصِحُّ الصَّلاةُ بِدُونِهَا وَأَمَّا السُّنَنُ إِذَا تَرَكَهَا الشَّخْصُ فَتَصِحُّ صَلاتُهُ لَكِنْ يَفُوتُهُ ثَوَابُهَا.\nوَأَرْكَانُ الصَّلاةِ سَبْعَةَ عَشَرَ رُكْنًا هِىَ\nالنِّيَّةُ وَهِىَ أَنْ يَنْوِىَ بِقَلْبِهِ أَنَّهُ يُصَلِّى فَرْضَ الظُّهْرِ مَثَلًا مَعَ التَّكْبِيرِ فَيَقُولُ بِقَلْبِهِ أُصَلِّى فَرْضَ الظُّهْرِ.\nوَتَكْبِيرَةُ الإِحْرَامِ وَهِىَ التَّكْبِيرَةُ الأُولَى فِى الصَّلاةِ فَيَقُولُ بِحَيْثُ يُسْمِعُ نَفْسَهُ اللَّهُ أَكْبَرُ.\nوَالْقِيَامُ فِى الْفَرْضِ لِلْقَادِرِ أَىْ أَنَّهُ يُشْتَرَطُ الْقِيَامُ فِى صَلاةِ الْفَرْضِ لِلْقَادِرِ.\nوَقِرَاءَةُ الْفَاتِحَةِ بِالْبَسْمَلَةِ وَالتَّشْدِيدَاتِ وَتَجِبُ مُوَالاتُهَا وَإِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا.\nوَالرُّكُوعُ بِأَنْ يَنْحَنِىَ بِحَيْثُ تَنَالُ رَاحَتَاهُ رُكْبَتَيْهِ.\nوَالطُّمَأْنِينَةُ فِيهِ بِقَدْرِ سُبْحَانَ اللَّهِ وَهِىَ سُكُونُ الأَعْضَاءِ دَفْعَةً وَاحِدَةً.\nوَالِاعْتِدَالُ بِأَنْ يَنْتَصِبَ بَعْدَ الرُّكُوعِ قَائِمًا.\nوَالطُّمَأْنِينَةُ فِيهِ.\nوَالسُّجُودُ مَرَّتَيْنِ وَالسُّجُودُ يَكُونُ عَلَى سَبْعَةِ أَعْظُمٍ فَيَضَعُ شَيْئًا مِنَ الْجَبْهَةِ مَكْشُوفًا وَشَيْئًا مِنَ الرُّكْبَتَيْنِ وَمِنْ بُطُونِ الْكَفَّيْنِ وَمِنْ بُطُونِ أَصَابِعِ الرِّجْلَيْنِ.\nوَالطُّمَأْنِينَةُ فِيهِ.\nوَالْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ.\nوَالطُّمَأْنِينَةُ فِيهِ.\nوَالْجُلُوسُ الأَخِيرُ أَىْ لِلتَّشَهُّدِ الأَخِيرِ وَمَا بَعْدَهُ.\nوَالتَّشَهُّدُ الأَخِيرُ وَأَقَلُّهُ التَّحِيَّاتُ لِلَّهِ سَلامٌ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ سلامٌ عَلَيْنَا وَعَلَى عِبادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ. وَأَكْمَلُهُ التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\nوَالصَّلاةُ عَلَى النَّبِىِّ وَأَقَلُّهَا اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ.\nوَالسَّلامُ وَأَقَلُّهُ السَّلامُ عَلَيْكُمْ.\nوَالتَّرْتِيبُ أَىْ عَلَى مَا ذُكِرَ فَلَوْ سَجَدَ قَبْلَ رُكُوعِهِ عَمْدًا بَطَلَتْ صَلاتُهُ.\n\nشَرْحُ بَعْضِ أَلْفَاظِ الصَّلاةِ\nاللَّهُ أَكْبَرُ مَعْنَاهُ أَنَّ اللَّهَ أَكْبَرُ مِنْ كُلِّ كَبِيرٍ قَدْرًا وَعَظَمَةً لا حَجْمًا لِأَنَّ اللَّهَ مُنَزَّهٌ عَنِ الْحَجْمِ.\nالتَّحِيَّاتُ مَعْنَاهُ مَا يُحَيِّى بِهِ الْعِبَادُ بَعْضُهُمْ بَعْضًا.\nالْمُبَارَكَاتُ الأَعْمَالُ النَّامِيَةُ فِى الْخَيْرِ.\nوَأَمَّا الصَّلَوَاتُ فَهِىَ الصَّلَوَاتُ الْخَمْسُ.\nوَأَمَّا الطَّيِّبَاتُ فَمَعْنَاهَا الأَعْمَالُ الصَّالِحَةُ أَىْ أَنَّ كُلَّ ذَلِكَ مِلْكٌ لِلَّهِ تَعَالَى.\nوَأَمَّا السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ فَمَعْنَاهُ السَّلامَةُ مِنَ الآفَاتِ.\nسُبْحَانَ رَبِّىَ الأَعْلَى مَعْنَاهُ أُنَزِّهُ رَبِّىَ الأَعْلَى أَىْ عُلُوَّ قَدْرٍ مِنْ كُلِّ نَقْصٍ وَعَيْبٍ كَالْمَكَانِ وَالْجِهَةِ وَالْعَجْزِ وَالْجَهْلِ وَالتَّغَيُّرِ.\n\n     أَسْئِلَةٌ\n     (1) هَلْ تَصِحُّ الصَّلاةُ بِدُونِ الأَرْكَانِ.\n     (2) كَمْ هِىَ أَرْكَانُ الصَّلاةِ.\n     (3) عَدِّدْ أَرْكَانَ الصَّلاةِ بِدُونِ شَرْحٍ.\n     (4) مَا هِىَ النِّيَّةُ وَمَتَى يَنْوِى.\n     (5) مَا هِىَ تَكْبِيرَةُ الإِحْرَامِ.\n     (6) هَلِ النِّيَّةُ عَمَلٌ قَلْبِىٌّ أَمْ لِسَانِىٌّ.\n     (7) هَلِ التَّكْبِيرَةُ الأُولَى بِالْقَلْبِ أَمْ بِاللِّسَانِ.\n     (8) مَا مَعْنَى الْقِيَامِ فِى الْفَرْضِ لِلْقَادِرِ.\n     (9) مَا هُوَ الرُّكُوعُ.\n     (10) مَا هِىَ الطُّمَأْنِينَةُ وَبِأَىِّ قَدْرٍ تَجِبُ.\n     (11) مَا هُوَ الِاعْتِدَالُ.\n     (12) كَيْفَ يَكُونُ السُّجُودُ.\n     (13) مَا هُوَ أَقَلُّ التَّشَهُّدِ الأَخِيرِ.\n     (14) مَا هُوَ أَكْمَلُ التَّشَهُّدِ الأَخِيرِ.\n     (15) مَا هُوَ أَقَلُّ الصَّلاةِ عَلَى النَّبِىِّ.\n     (16) مَا هُوَ أَقَلُّ السَّلامِ.\n     (17) مَا مَعْنَى التَّرْتِيبِ.\n\nالدَّرْسُ الْحَادِى عَشَرَ\nسُنَنُ الصَّلاةِ\n\nسُنَنُ الصَّلاةِ كَثِيرَةٌ مَنْ تَرَكَهَا صَحَّتْ صَلاتُهُ وَلَكِنْ مَنْ فَعَلَهَا فَلَهُ ثَوَابٌ وَأَجْرٌ عِنْدَ اللَّهِ فَيَنْبَغِى لِلْمُصَلِّى أَنْ يُحَافِظَ عَلَيْهَا وَمِنْ هَذِهِ السُّنَنِ\nوَضْعُ الْيَدِ الْيُمْنَى عَلَى كُوعِ الْيُسْرَى فَوْقَ السُّرَّةِ وَتَحْتَ الصَّدْرِ.\nوَقِرَاءَةُ دُعَاءِ الِافْتِتَاحِ قَبْلَ قِرَاءَةِ الْفَاتِحَةِ فِى الرَّكْعَةِ الأُولَى.\nوَقِرَاءَةُ سُورَةٍ قَصِيرَةٍ بَعْدَ قِرَاءَةِ الْفَاتِحَةِ فِى الرَّكْعَتَيْنِ الأُولَى وَالثَّانِيَةِ لِغَيْرِ الْمَأْمُومِ فِى الصَّلاةِ الْجَهْرِيَةِ.\nوَالتَّكْبِيرَاتُ أَىْ قَوْلُ اللَّهُ أَكْبَرُ عِنْدَ الِانْتِقَالِ مِنْ رُكْنٍ فِعْلِىٍّ إِلَى رُكْنٍ ءَاخَرَ إِلَّا عِنْدَ الرَّفْعِ مِنَ الرُّكُوعِ فَيَقُولُ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ أَمَّا تَكْبِيرَةُ الإِحْرَامِ فَإِنَّهَا رُكْنٌ.\nوَقَوْلُ سُبْحَانَ رَبِّىَ الْعَظِيم ثَلاثَ مَرَّاتٍ فِى الرُّكُوعِ.\nوَقَوْلُ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ فِى الرَّفْعِ مِنَ الرُّكُوعِ.\nوَقَوْلُ رَبَّنَا وَلَكَ الْحَمْدُ فِى الِاعْتِدَالِ.\nوَقَوْلُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ فِى السُّجُودِ.\nوَقَوْلُ اللَّهُمَّ اغْفِرْ لِى وَارْحَمْنِى وَاهْدِنِى وَعَافِنِى وَارْزُقْنِى فِى الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ.\nوَالتَّشَهُّدُ الأَوَّلُ أَىْ بَعْدَ إِتْمَامِ الرَّكَعْتَيْنِ الأَوَّلِيَيْنِ فِى صَلاةِ الظُّهْرِ وَالْعَصْرِ وَالْمَغْرِبِ وَالْعِشَاءِ.\nوَقِرَاءَةُ الصَّلاةِ الإِبْرَاهِيمِيَّةِ بِأَكْمَلِهَا بَعْدَ التَّشَهُّدِ الأَخِيرِ.\nوَزِيَادَةُ وَرَحْمَةُ اللَّهِ فِى السَّلامِ فَيَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ.\nوَالتَّسْلِيمَةُ الثَّانِيَةُ.\nوَالِالْتِفَاتُ إِلَى الْيَمِينِ فِى التَّسْلِيمَةِ الأُولَى وَإِلَى الْيَسَارِ فِى التَّسْلِيمَةِ الثَّانِيَةِ.\n\n     أَسْئِلَةٌ.\n     (1) أَيْنَ يُسَنُّ وَضْعُ الْيَدِ الْيُمْنَى بَعْدَ تَكْبِيرَةِ الإِحْرَامِ.\n     (2) مَاذَا يُسَنُّ أَنْ نَقْرَأَ قَبْلَ الْفَاتِحَةِ.\n     (3) مَاذَا يُسَنُّ أَنْ نَقْرَأَ بَعْدَ الْفَاتِحَةِ وَفِى أَىِّ رَكْعَةٍ.\n     (4) مَاذَا يُسَنُّ عِنْدَ الِانْتِقَالِ مِنْ رُكْنٍ إِلَى رُكْنٍ.\n     (5) مَاذَا يُسَنُّ أَنْ نَقُولَ فِى الرُّكُوعِ وَفِى السُّجُودِ.\n     (6) مَاذَا يُسَنُّ أَنْ يُقَالَ فِى الرَّفْعِ مِنَ الرُّكُوعِ وَفِى الِاعْتِدَالِ.\n     (7) مَاذَا يُسَنُّ أَنْ يُقَالَ فِى الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ.\n     (8) مَاذَا يُسَنُّ أَنْ نَزِيدَ فِى السَّلامِ.\n     (9) أَىُّ التَّسْلِيمَتَيْنِ سُنَّةٌ وَأَىُّ التَّشَهُّدَيْنِ سُنَّةٌ.\n     (10) إِلَى أَىِّ جِهَةٍ يُسَنُّ الِالْتِفَاتُ فِى التَّسْلِيمَةِ الأُولَى وَالثَّانِيَةِ.\n\nالدَّرْسُ الثَّانِى عَشَرَ\nمُبْطِلاتُ الصَّلاةِ\n\nهُنَاكَ أُمُورٌ تُبْطِلُ الصَّلاةَ لا بُدَّ مِنْ مَعْرِفَتِهَا لِاجْتِنَابِهَا.\nمِنْ هَذِهِ الْمُبْطِلاتِ\n(1) الْكَلامُ الْعَمْدُ أَىْ إِذَا تَكَلَّمَ الْمُصَلِّى بِكَلامِ النَّاسِ بِحَرْفٍ مُفْهِمٍ أَوْ بِأَكْثَرَ عَامِدًا ذَاكِرًا أَنَّهُ فِى الصَّلاةِ بَطَلَتْ صَلاتُهُ أَمَّا ذِكْرُ اللَّهِ فَلا يُبْطِلُ الصَّلاةَ.\n(2) وَالأَكْلُ وَالشُّرْبُ فَإِذَا أَكَلَ الْمُصَلِّى أَوْ شَرِبَ عَامِدًا ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ كَانَ قَلِيلًا كَحَبَّةِ سِمْسِمٍ بَطَلَتْ صَلاتُهُ.\n(3) وَالأَفْعَالُ الْكَثِيرَةُ فَمَنْ فَعَلَ أَفْعَالًا كَثِيرَةً كَأَنْ تَحَرَّكَ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ فَإِنَّهُ تَبْطُلُ صَلاتُهُ.\n(4) وَالْحَرَكَةُ الْمُفْرِطَةُ كَالْوَثْبَةِ الْفَاحِشَةِ.\n(5) وَالْحَرَكَةُ الْوَاحِدَةُ لِلَّعِبِ كَتَحْرِيكِ اللِّسَانِ أَوِ الْجَفْنِ بِقَصْدِ اللَّعِبِ.\n(6) وَزِيَادَةُ رُكْنٍ كَأَنْ سَجَدَ ثَلاثَ مَرَّاتٍ فِى الرَّكْعَةِ الْوَاحِدَةِ عَمْدًا.\n(7) وَتَغْيِيرُ النِّيَّةِ فَإِذَا نَوَى قَطْعَ الصَّلاةِ أَوْ تَرَدَّدَ فِى قَطْعِهَا أَوْ عَلَّقَ قَطْعَهَا عَلَى شَىْءٍ كَأَنْ قَالَ فِى نَفْسِهِ إِنْ قُرِعَ الْبَابُ أَقْطَعُ الصَّلاةَ بَطَلَتْ فِى الْحَالِ.\n(8) وَالْحَدَثُ كَخُرُوجِ الرِّيحِ.\n\n     أَسْئِلَةٌ\n     (1) عَدِّدْ بَعْضَ مُبْطِلاتِ الصَّلاةِ.\n     (2) مَا مَعْنَى الْكَلامِ الْعَمْدِ.\n     (3) هَلْ ذِكْرُ اللَّهِ يُبْطِلُ الصَّلاةَ.\n     (4) مَا حُكْمُ مَنْ أَكَلَ أَوْ شَرِبَ وَلَوْ قَلِيلًا عَامِدًا ذَاكِرًا أَنَّهُ فِى الصَّلاةِ.\n     (5) أَعْطِ مِثَالًا عَنِ الأَفْعَالِ الْكَثِيرَةِ.\n     (6) أَعْطِ مِثَالًا عَنِ الْحَرَكَةِ الْمُفْرِطَةِ.\n     (7) أَعْطِ مِثَالًا عَنِ الْحَرَكَةِ الْوَاحِدَةِ لِلَّعِبِ.\n     (8) أَعْطِ مِثَالًا عَنْ زِيَادَةِ رُكْنٍ.\n     (9) مَا مَعْنَى تَغْيِيرِ النِّيَّةِ.\n     (10) مَا مَعْنَى طُرُوءِ الْحَدَثِ.\n\nالدَّرْسُ الثَّالِثَ عَشَرَ\nالصَّلاةُ السِّرِيَّةُ وَالصَّلاةُ الْجَهْرِيَّةُ\n\nالصَّلَوَاتُ الْجَهْرِيَّةُ الصُّبْحُ وَالْمَغْرِبُ وَالْعِشَاءُ\nوَيُجْهَرُ فِيهَا فِى الرَّكْعَتَيْنِ الأَوَّلِيَيْنِ فِى الْقِيَامِ فِى قِرَاءَةِ الْفَاتِحَةِ وَالتَّأْمِينِ وَمَا بَعْدَهُمَا كَالسُّورَةِ الْقَصِيرَةِ، هَذَا لِلْمُنْفَرِدِ وَلِلإِمَامِ.\nالصَّلاتَانِ السِّرِيَّتَانِ الظُّهْرُ وَالْعَصْرُ.\nوَمَنْ فَاتَتْهُ صَلاةٌ مِنْ هَذِهِ الصَّلَوَاتِ يَقْضِيهَا فَإِنْ كَانَتْ جَهْرِيَّةً قَضَاهَا فِى وَقْتِ صَلاةٍ سِرِيَّةٍ يُسِرُّ بِهَا كَأَنْ قَضَى الصُّبْحَ فِى وَقْتِ الظُّهْرِ أَمَّا إِنْ قَضَاهَا فِى وَقْتِ صَلاةٍ جَهْرِيَّةٍ جَهَرَ بِهَا كَأَنْ قَضَى الْمَغْرِبَ فِى وَقْتِ الْعِشَاءِ.\nوَإِنْ قَضَى السِّرِيَّةَ فِى وَقْتِ الْجَهْرِيَّةِ يَجْهَرُ كَأَنْ قَضَى الْعَصْرَ فِى وَقْتِ الْمَغْرِبِ.\nفَائِدَةٌ. إِذَا سَمِعَ الْمَأْمُومُ الإِمَامَ فِى الصَّلاةِ الْجَهْرِيَّةِ يَقْرَأُ ﴿أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ﴾ [سُورَةَ التِّينِ/8] يَقُولُ الْمَأْمُومُ بَلَى وَأَنَا عَلَى ذَلِكَ مِنَ الشَّاهِدِينَ، وَإِنْ كَانَ يَقْرَأُ الْفَاتِحَةَ يَقُولُ بَلَى ثُمَّ يُكْمِلُ الْفَاتِحَةَ وَإِذَا انْتَهَى الإِمَامُ مِنْ قِرَاءَةِ الْفَاتِحَةِ يَقُولُ الْمَأْمُومُ ءَامِين مَعَ الإِمَامِ. وَإِذَا سَمِعَ ءَايَةً فِيهَا اسْمُ النَّبِىِّ ﷺ فَيُصَلِى عَلَيْهِ كَأَنْ يَقُولَ اللَّهُمَّ صَلِّ عَلَيْهِ.\nأَمَّا لَوْ سَلَّمَ عَلَيْهِ رَجُلٌ وَهُوَ يُصَلِّى فَلا يَقُولُ لَهُ وَعَلَيْكُمُ السَّلامُ، فَإِنْ قَالَ لَهُ ذَلِكَ فَسَدَتْ صَلاتُهُ وَكَذَلِكَ إِذَا قَالَ لِلْعَاطِسِ يَرْحَمُكَ اللَّهُ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ الصَّلَوَاتُ الْجَهْرِيَّةُ بَيْنَ الصَّلَوَاتِ الْخَمْسِ.\n     (2) بِمَ يَجْهَرُ الْمُنْفَرِدُ فِى الصَّلاةِ الْجَهْرِيَّةِ.\n     (3) مَا هِىَ الصَّلَوَاتُ السِّرِيَّةُ بَيْنَ الصَّلَوَاتِ الْخَمْسِ.\n     (4) مَنْ فَاتَتْهُ صَلاةٌ مِنَ الصَّلَوَاتِ الْخَمْسِ مَاذَا يَفْعَلُ.\n     (5) مَنْ قَضَى الصَّلاةَ الْجَهْرِيَّةَ فِى وَقْتِ الصَّلاةِ السِّرِيَّةِ هَلْ يَجْهَرُ أَمْ يُسِرُّ أَعْطِ مِثَالًا.\n     (6) مَنْ قَضَى الصَّلاةَ السِّرِيَّةَ فِى وَقْتِ الصَّلاةِ الْجَهْرِيَّةِ هَلْ يَجْهَرُ أَمْ يُسِرُّ أَعْطِ مِثَالًا.\n\nالدَّرْسُ الرَّابِعَ عَشَرَ\nصَلاةُ الْجَمَاعَةِ\n\nيُصَلِّى الْمُسْلِمُونَ فِى كُلِّ يَوْمٍ فِى الْمَسَاجِدِ خَمْسَ صَلَوَاتٍ جَمَاعَةً وَلِصَلاةِ الْجَمَاعَةِ أُمُورٌ يَنْبَغِى مُرَاعَاتُهَا مِنْهَا\nأَنْ يَقِفَ الْمُصَلِّى خَلْفَ الإِمَامِ وَلا يُكَبِّرُ إِلَّا بَعْدَ أَنْ يُكَبِّرَ الإِمَامُ.\nأَنْ يَنْوِىَ الصَّلاةَ جَمَاعَةً فَيَقُولُ بِقَلْبِهِ مَثَلًا أُصَلِّى فَرْضَ الظُّهْرِ جَمَاعَةً.\nوَإِنْ كَانَ فِى صَلاةٍ سِرِيَّةٍ يَقْرَأُ الْفَاتِحَةَ وَالسُّورَةَ بَعْدَهَا سِرًّا وَأَمَّا فِى الصَّلاةِ الْجَهْرِيَّةِ فَيَقْرَأُ الْفَاتِحَةَ فَقَطْ مِنْ غَيْرِ أَنْ يَجْهَرَ وَيَسْتَمِعُ لِقِرَاءَةِ الإِمَامِ. أَمَّا الإِمَامُ فَيَجْهَرُ بِالْفَاتِحَةِ وَالتَّأْمِينِ وَالسُّورَةِ فِى الرَّكْعَتَيْنِ الأَوَّلِيَيْنِ وَبِكُلِّ التَّكْبِيرَاتِ وَبِقَوْلِ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ.\nأَنْ يَقُولَ ءَامِين مَعَ الإِمَامِ بَعْدَ أَنْ يَقْرَأَ الإِمَامُ ﴿غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلا الضَّالِّينَ﴾ [سُورَةَ الْفَاتِحَةِ/7].\nأَنْ يَتْبَعَ الإِمَامَ وَلا يَسْبِقَهُ فَيَرْكَعَ بَعْدَ رُكُوعِ الإِمَامِ وَيَعْتَدِلَ بَعْدَ اعْتِدَالِهِ وَيَسْجُدَ بَعْدَ سُجُودِهِ.\nوَإِذَا صَلَّى مُقْتَدِيًا وَلا مَأْمُومَ سِوَاهُ يَقِفُ إِلَى يَمِينِ الإِمَامِ مُتَأَخِّرًا عَنْهُ قَلِيلًا ثُمَّ إِذَا جَاءَ ثَالِثٌ رَجَعَ إِلَى خَلْفِ الإِمَامِ وَوَقَفَ مَعَ الْقَادِمِ فِى صَفٍّ وَاحِدٍ.\nأَنْ لا يُسَلِّمَ الْمَأْمُومُ قَبْلَ الإِمَامِ فَإِنَّهُ إِنْ فَعَلَ ذَلِكَ بَطَلَتْ صَلاتُهُ.\n\n     أَسْئِلَةٌ\n     (1) أَيْنَ يَقِفُ الْمُصَلِّى خَلْفَ الإِمَامِ وَمَتَى يُكَبِّرُ.\n     (2) مَاذَا يَنْوِى مَنْ أَرَادَ أَنْ يُصَلِّىَ خَلْفَ إِمَامٍ.\n     (3) مَتَى يَقُولُ الْمَأْمُومُ ءَامِين.\n     (4) مَتَى يَرْكَعُ الْمَأْمُومُ وَمَتَى يَعْتَدِلُ.\n     (5) مَتَى يُسَلِّمُ الْمَأْمُومُ وَمَا حُكْمُ صَلاتِهِ إِنْ سَلَّمَ عَمْدًا قَبْلَ الإِمَامِ.\n\nالدَّرْسُ الْخَامِسَ عَشَرَ\nصَلاةُ الْجُمُعَةِ\n\nصَلاةُ الْجُمُعَةِ فَرْضُ عَيْنٍ عَلَى الذُّكُورِ الأَحْرَارِ الْبَالِغِينَ الْعَاقِلِينَ الْمُقِيمِينَ غَيْرِ الْمَعْذُورِينَ إِذَا كَانُوا أَرْبَعِينَ مُسْتَوْطِنِينَ فِى أَبْنِيَةٍ فَلَوْ نَقَصُوا عَنِ الأَرْبَعِينَ أَوْ كَانُوا مُقِيمِينَ فِى الْخِيَامِ لَمْ تَجِبْ عَلَيْهِمْ فِى مَكَانِهِمْ. وَمِنَ الْعُذْرِ الشَّرْعِىِّ أَنْ يَكُونَ الْمُسْلِمُ مَرِيضًا مَرَضًا شَدِيدًا يَشُقُّ عَلَيْهِ مَعَهُ الذَّهَابُ إِلَى مَكَانِ الْجُمُعَةِ.\nوَصَلاةُ الْجُمُعَةِ رَكْعَتَانِ بَدَلَ صَلاةِ الظُّهْرِ يَجْهَرُ الإِمَامُ فِيهِمَا وَيُشْتَرَطُ فِيهَا\nأَنْ تُصَلَّى بَعْدَ دُخُولِ وَقْتِ الظُّهْرِ.\nوَأَنْ يَسْبِقَهَا خُطْبَتَانِ بَعْدَ دُخُولِ وَقْتِ الظُّهْرِ يَسْمَعُهُمَا الأَرْبَعُونَ.\nوَأَنْ تُصَلَّى جَمَاعَةً بِالأَرْبَعِينَ فَلَوْ نَقَصَ الأَرْبَعُونَ وَاحِدًا لَمْ يُصَلُّوا الْجُمُعَةَ بَلِ الظُّهْرَ.\nوَأَنْ تُقَامَ فِى مَكَانٍ وَاحِدٍ فِى الْبَلَدِ الْوَاحِدِ إِلَّا إِذَا عَسُرَ اجْتِمَاعُ النَّاسِ فَيَجُوزُ التَّعَدُّدُ بِمِقْدَارِ الْحَاجَةِ.\n\nوَأَرْكَانُ الْخُطْبَتَيْنِ\nحَمْدُ اللَّهِ.\nوَالصَّلاةُ عَلَى النَّبِىِّ.\nوَالْوَصِيَّةُ بِالتَّقْوَى كَأَنْ يَقُولَ أُوصِيكُمْ بِتَقْوَى اللَّهِ وَيَأْتِى الْخَطِيبُ بِهَذِهِ الأَرْكَانِ الثَّلاثَةِ فِى الْخُطْبَتَيْنِ الأُولَى وَالثَّانِيَةِ.\nوَءَايَةٌ مُفْهِمَةٌ فِى إِحْدَاهُمَا وَلَوْ كَانَتْ قَصِيرَةً كَآيَةِ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ وَالأَفْضَلُ أَنْ تَكُونَ فِى الْخُطْبَةِ الأُولَى.\nوَالدُّعَاءُ لِلْمُؤْمِنِينَ فِى الثَّانِيَةِ.\n   وَمَنْ فَاتَتْهُ صَلاةُ الْجَمَاعَةِ صَلَّى الظُّهْرَ لِأَنَّ الْجُمُعَةَ لا تُصَلَّى قَضَاءً جُمُعَةً.\n\n     أَسْئِلَةٌ\n     (1) عَلَى مَنْ تَجِبُ الْجُمُعَةُ.\n     (2) كَمْ رَكْعَةً صَلاةُ الْجُمُعَةِ.\n     (3) عَدِّدْ بَعْضَ شُرُوطِ الْجُمُعَةِ.\n     (4) مَا هِيَ أَرْكَانُ الْخُطْبَتَيْنِ.\n     (5) مَنْ فَاتَتْهُ صَلاةُ الْجُمُعَةِ مَاذَا يَفْعَلُ، لِمَاذَا.\n\nالدَّرْسُ السَّادِسَ عَشَرَ\nصَلاةُ الْمَسْبُوقِ\n\nحَثَّنَا الرَّسُولُ ﷺ عَلَى صَلاةِ الْجَمَاعَةِ وَبَيَّنَ فَضْلَهَا عَلَى صَلاةِ الْمُنْفَرِدِ فَقَالَ »صَلاةُ الْجَمَاعَةِ أَفْضَلُ مِنْ صَلاةِ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً« رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ.\nمَنْ هُوَ الْمَسْبُوقُ. \nالْمَسْبُوقُ هُوَ الَّذِى دَخَلَ فِى صَلاةِ الْجَمَاعَةِ بَعْدَ أَنْ بَدَأَ الإِمَامُ بِهَا بِحَيْثُ لَمْ يُدْرِكْ قَدْرَ الْفَاتِحَةِ مِنْ قِيَامِ الإِمَامِ أَوْ كَانَ الإِمَامُ فِى رُكْنٍ ءَاخَرَ مِنْ أَرْكَانِ الصَّلاةِ كَالرُّكُوعِ أَوِ الِاعْتِدَالِ أَوِ السُّجُودِ أَوِ التَّشَهُّدِ مَثَلًا.\nوَتُدْرَكُ فَضِيلَةُ الْجَمَاعَةِ بِإِدْرَاكِ جُزْءٍ مِنَ الصَّلاةِ مَعَ الإِمَامِ.\nمَاذَا يَفْعَلُ الْمَسْبُوقُ.\nيَدْخُلُ الْمَسْبُوقُ فِى الصَّلاةِ بِتَكْبِيرَةِ الإِحْرَامِ مَعَ النِّيَّةِ وَيُتَابِعُ الإِمَامَ فِيمَا هُوَ فِيهِ.\nفَإِذَا كَانَ الإِمَامُ فِى ءَاخِرِ الْفَاتِحَةِ يَبْدَأُ الْمَأْمُومُ بِالْقِرَاءَةِ فَإِذَا نَزَلَ الإِمَامُ لِلرُّكُوعِ يَقْطَعُ الْقِرَاءَةَ وَيَرْكَعُ مَعَهُ وَتَسْقُطُ عَنْهُ بَقِيَّةُ الْفَاتِحَةِ.\nوَإِذَا كَانَ الإِمَامُ فِى الرُّكُوعِ يَرْكَعُ الْمَأْمُومُ فَإِنِ اطْمَأَنَّ رَاكِعًا قَبْلَ أَنْ يَرْفَعَ الإِمَامُ تُحْسَبُ لَهُ الرَّكْعَةُ وَإِنْ لَمْ يَطْمَئِنْ يَأْتِى بِرَكْعَةٍ بَعْدَ سَلامِ الإِمَامِ.\nأَمَّا إِذَا كَانَ الإِمَامُ فِى مَا بَعْدَ الرُّكُوعِ فِى الِاعْتِدَالِ أَوِ السُّجُودِ أَوِ الْجُلُوسِ فَالْمَأْمُومُ يُتَابِعُهُ وَلا تُحْسَبُ لَهُ هَذِهِ الرَّكْعَةُ بَلْ يَأْتِى بِرَكْعَةٍ بَعْدَ سَلامِ الإِمَامِ.\nوَإِنْ دَخَلَ فِى الصَّلاةِ وَالإِمَامُ فِى التَّشَهُّدِ الأَخِيرِ تَابَعَهُ وَبَعْدَ أَنْ يُسَلِّمَ الإِمَامُ يَقُومُ وَيَأْتِى بِكُلِّ رَكَعَاتِ الصَّلاةِ.\nتَنْبِيهٌ. تَكْبِيرَةُ الإِحْرَامِ تُقَالُ فِى حَالِ الْوُقُوفِ وَلَوْ كَانَ الشَّخْصُ يُرِيدُ إِدْرَاكَ الصَّلاةِ مَعَ مُصَلٍّ رَاكِعٍ مَثَلًا.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ يُبَيِّنُ فَضْلَ صَلاةِ الْجَمَاعَةِ.\n     (2) مَنْ هُوَ الْمَسْبُوقُ.\n     (3) بِمَ تُدْرَكُ فَضِيلَةُ الْجَمَاعَةِ.\n     (4) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَكَانَ الإِمَامُ فِى ءَاخِرِ الْفَاتِحَةِ.\n     (5) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَكَانَ الإِمَامُ فِى الرُّكُوعِ.\n     (6) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَالإِمَامُ فِى الِاعْتِدَالِ أَوِ السُّجُودِ.\n     (7) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَالإِمَامُ فِى الْجُلُوسِ لِلتَّشَهُّدِ الأَخِيرِ.\n\nالدَّرْسُ السَّابِعَ عَشَرَ\nقَضَاءُ الصَّلَوَاتِ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »مَنْ نَامَ عَنْ صَلاةٍ أَوْ نَسِيَهَا فَلْيُصَلِّهَا إِذَا ذَكَرَهَا لا كَفَّارَةَ لَهَا إِلَّا ذَلِكَ« رَوَاهُ الْبُخَارِىُّ.\nفَمَنْ كَانَ نَائِمًا وَقْتَ الصَّلاةِ وَلَمْ يَسْتَيْقِظْ إِلَّا بَعْدَ انْتِهَاءِ وَقْتِهَا فَإِنَّهُ يَقْضِى تِلْكَ الصَّلاةَ وَإِذَا نَسِىَ الْمُسْلِمُ أَدَاءَ الصَّلاةِ وَلَمْ يَتَذَكَّرْهَا إِلَّا بَعْدَ انْتِهَاءِ الْوَقْتِ فَإِنَّهُ يَقْضِيهَا وَأَمَّا مَنْ فَاتَتْهُ صَلَوَاتٌ كَثِيرَةٌ لا يَعْلَمُ عَدَدَهَا بِالضَّبْطِ فَإِنَّهُ يَبْدَأُ بِقَضَاءِ هَذِهِ الصَّلَوَاتِ حَتَّى يَغْلِبَ عَلَى ظَنِّهِ أَنَّهُ قَضَاهَا كُلَّهَا.\nوَلا يُهْمِلُ الْمُسْلِمُ الْكَامِلُ قَضَاءَ مَا عَلَيْهِ مِنْ الصَّلَوَاتِ وَيُسْرِعُ فِى قَضَائِهَا وَلا يَتَقَاعَسُ عَنِ الْقَضَاءِ لِيَشْتَغِلَ بِأُمُورِ الْمَالِ وَالأَوْلادِ وَالتِّجَارَةِ وَنَحْوِ ذَلِكَ.\nوَيُسَنُّ تَرْتِيبُ قَضَاءِ الصَّلَوَاتِ الْفَائِتَةِ فَيَقْضِى الصُّبْحَ ثُمَّ الظُّهْرَ وَهَكَذَا.\nفَمَنْ مَاتَ وَلَمْ يُتِمَّ قَضَاءَ مَا عَلَيْهِ مِنَ الصَّلَوَاتِ وَكَانَ قَدْ بَاشَرَ بِقَضَائِهَا بِهِمَّةٍ وَفِى نِيَّتِهِ أَنْ يُكْمِلَهَا فَاللَّهُ لا يُعَذِّبُهُ عَلَيْهَا إِذَا لَمْ يَتَكَاسَلْ.\nوَلا تُصَلِّى الْمَرْأَةُ فِى حَالِ الْحَيْضِ أَوِ النِّفَاسِ وَلا يَجِبُ عَلَيْهَا قَضَاءُ مَا فَاتَهَا مِنْ صَلاةٍ أَثْنَاءَ الْحَيْضِ وَالنِّفَاسِ إِنَّمَا يَلْزَمُهَا قَضَاءُ مَا فَاتَهَا مِنَ الصِّيَامِ أَثْنَاءَ الْحَيْضِ وَالنِّفَاسِ.\n\n     أَسْئِلَةٌ\n     (1) مَا الدَّلِيلُ عَلَى لُزُومِ قَضَاءِ الصَّلَوَاتِ الْفَائِتَةِ اذْكُرِ الْحَدِيثَ.\n     (2) مَنْ كَانَ نَائِمًا وَقْتَ الصَّلاةِ ثُمَّ اسْتَيْقَظَ مَاذَا يَفْعَلُ.\n     (3) مَنْ نَسِىَ أَدَاءَ الصَّلاةِ مَاذَا يَفْعَلُ.\n     (4) مَاذَا يَفْعَلُ مَنْ فَاتَتْهُ صَلَوَاتٌ كَثِيرَةٌ لا يَعْلَمُ عَدَدَهَا.\n     (5) مَنْ كَانَ عَلَيْهِ قَضَاءُ الصُّبْحِ وَالظُّهْرِ مَثَلًا بِأَيِّهِمَا يَبْدَأُ.\n     (6) فِى أَىِّ حَالٍ لا تُصَلِّى الْمَرْأَةُ وَهَلْ يَجِبُ عَلَيْهَا الْقَضَاءُ.\n\nالدَّرْسُ الثَّامِنَ عَشَرَ\nصِيَامُ شَهْرِ رَمَضَانَ الْمَبَارَكِ\n\nقَالَ اللَّهُ تَعَالَى ﴿شَهْرُ رَمَضَانَ الَّذِى أُنْزِلَ فِيهِ الْقُرْءانُ هُدًى لِّلنَّاسِ وَبَيِّنَاتٍ مِّنَ الْهُدَى وَالْفُرْقَانِ فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ﴾ [سُورَةَ الْبَقَرَةِ/185].\nشَهْرُ الصِّيَامِ.\nالصِّيَامُ عِبَادَةٌ عَظِيمَةٌ فَرَضَهَا اللَّهُ عَلَى الْمُسْلِمِينَ لِيَقُومُوا بِهَا فِى شَهْرِ رَمَضَانَ مِنْ كُلِّ عَامٍ وَفِيهَا الثَّوَابُ الْجَزِيلُ مِنَ اللَّهِ سُبْحَانَهُ وَتَعَالَى.\nمَعْنَى الصِّيَامِ.\nوَالصِّيَامُ هُوَ الِامْتِنَاعُ عَنِ الأَكْلِ وَالشُّرْبِ وَسَائِرِ الْمُفَطِّرَاتِ مَعَ النِّيَّةِ مِنْ طُلُوعِ الْفَجْرِ إِلَى غُرُوبِ الشَّمْسِ فَيَقُولُ بِقَلْبِهِ نَوَيْتُ صِيَامَ يَوْمِ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانَ هَذِهِ السَّنَةِ إِيـمَانًا وَاحْتِسَابًا لِلَّهِ تَعَالَى.\nمُفْسِدَاتُ الصِّيَامِ.\nهُنَاكَ أُمُورٌ تُفْسِدُ الصِّيَامَ مِنْهَا\nالأَكْلُ وَالشُّرْبُ وَلَوْ قَلِيلًا إِذَا كَانَ ذَاكِرًا أَنَّهُ فِى الصِّيَامِ أَمَّا مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا لَمْ يُفْطِرْ وَلَوْ كَانَ صَائِمًا فِى غَيْرِ رَمَضَانَ وَذَلِكَ لِقَوْلِ النَّبِىِّ ﷺ »مَنْ نَسِىَ وَهُوَ صَائِمٌ فَأَكَلَ أَوْ شَرِبَ فَلْيُتِمَّ صَوْمَهُ فَإِنَّمَا أَطْعَمَهُ اللَّهُ وَسَقَاهُ« رَوَاهُ الْبُخَارِىُّ.\nوَإِذَا أَخْرَجَ الصَّائِمُ الْقَىْءَ عَمْدًا بِإِصْبَعِهِ مَثَلًا أَفْطَرَ وَأَمَّا إِنْ غَلَبَهُ الْقَىْءُ فَلا يُفْطِرُ.\nوَالْقَطْرَةُ فِى الأُذُنِ وَالأَنْفِ تُفَطِّرُ إِذَا وَصَلَ الْمَقْطُورُ إِلَى الْجَوْفِ أَمَّا الْقَطْرَةُ فِى الْعَيْنِ فَلا تُفَطِّرُ.\nهُنَاكَ حَالاتٌ يَجُوزُ فِيهَا الْفِطْرُ مِنْهَا.\nالْمَرِيضُ مَرَضًا يَخَافُ عَلَى نَفْسِهِ مَعَهُ الضَّرَرَ مِنَ الصَّوْمِ.\nوَالْمُسَافِرُ سَفَرًا طَوِيلًا كَالَّذِى يُسَافِرُ مِنْ بَيْرُوتَ إِلَى دِمْشَقَ.\nوَلا يَجُوزُ لِلْحَائِضِ وَالنُّفَسَاءِ الصَّوْمُ وَعَلَيْهِمَا الْقَضَاءُ بَعْدَ انْتِهَاءِ شَهْرِ رَمَضَانَ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى الأَمْرِ بِصَوْمِ شَهْرِ رَمَضَانَ.\n     (2) مَا هُوَ الصِّيَامُ.\n     (3) مَا هُوَ وَقْتُ الصِّيَامِ.\n     (4) مَا هُوَ كَمَالُ النِّيَّةِ فِى الصَّوْمِ.\n     (5) عَدِّدْ بَعْضَ مَا يُفْسِدُ الصِّيَامَ.\n     (6) مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا هَلْ يُفْسِدُ صِيَامَهُ وَلِمَاذَا.\n     (7) مَا الْحُكْمُ إِذَا غَلَبَهُ الْقَىْءُ.\n     (8) مَا حُكْمُ الْقَطْرَةِ فِى الأُذُنِ وَالأَنْفِ وَالْعَيْنِ.\n     (9) مَنْ يَجُوزُ لَهُ الْفِطْرُ فِى رَمَضَانَ.\n     (10) مَاذَا تَفْعَلُ الْحَائِضُ وَالنُّفَسَاءُ وَقْتَ الصِّيَامِ وَمَاذَا يَجِبُ عَلَيْهِمَا.\n\nالدَّرْسُ التَّاسِعَ عَشَرَ\nالزَّكَاةُ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَأَقِيمُوا الصَّلاةَ وَءَاتُوا الزَّكَاةَ﴾ [سُورَةَ النُّورِ/56].\nفَرَضَ اللَّهُ تَعَالَى عَلَى الْمُسْلِمِ أَنْ يَدْفَعَ قِسْمًا مَعْلُومًا مِنْ مَالِهِ إِذَا وَجَبَتْ فِيهِ الزَّكَاةُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَغَيْرِهِمْ مِنَ الْمُسْلِمِينَ الَّذِينَ ذَكَرَهُمُ اللَّهُ تَعَالَى فِى الآيَةِ الْكَرِيمَةِ ﴿إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاء وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِي الرِّقَابِ وَالْغَارِمِينَ وَفِي سَبِيلِ اللَّهِ وَابْنِ السَّبِيلِ﴾ [سُورَةَ التَّوْبَةِ/60].\nالْفُقَرَاءُ هُمُ الَّذِينَ لا يَجِدُونَ نِصْفَ كِفَايَتِهِمُ الضَّرُورِيَّةِ.\nوَالْمَسَاكِينُ هُمُ الَّذِينَ لا يَجِدُونَ كُلَّ كِفَايَتِهِمُ الضَّرُورِيَّةِ وَلَكِنْ يَجِدُونَ نِصْفَهَا أَوْ أَكْثَرَ.\nوَالْعَامِلُونَ عَلَيْهَا هُمُ الَّذِينَ يَجْمَعُونَ الزَّكَاةَ لِلْخَلِيفَةِ بِدُونِ رَاتِبٍ.\nوَالْمُؤَلَّفَةُ قُلُوبُهُمْ هُمُ الَّذِينَ أَسْلَمُوا حَدِيثًا وَيُرْجَى بِإِعْطَائِهِمْ مِنَ الزَّكَاةِ إِسْلامُ نُظَرَائِهِمْ.\nوَفِى الرِّقَابِ هُمُ الْعَبِيدُ الَّذِينَ شَرَطَ عَلَيْهِمْ أَسْيَادُهُمْ قَدْرًا مِنَ الْمَالِ لِيَتَحَرَّرُوا.\nوَالْغَارِمُونَ هُمُ الْمَدِينُونَ الْعَاجِزُونَ عَنْ وَفَاءِ دُيُونِهِمْ غَيْرِ الْمُحَرَّمَةِ.\nوَفِى سَبِيلِ اللَّهِ هُمُ الْغُزَاةُ الْمُتَطَوِّعُونَ فِى سَبِيلِ اللَّهِ.\nوَابْنُ السَّبِيلِ هُوَ الْمُسَافِرُ الَّذِى مَرَّ بِبَلَدِ الزَّكَاةِ وَلَيْسَ مَعَهُ مَا يَرُدُّهُ إِلَى بَلَدِهِ.\n\nزَكَاةُ الْفِطْرِ.\nكَذَلِكَ يَجِبُ عَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ أَنْ يَدْفَعَ زَكَاةَ الْفِطْرِ فِى رَمَضَانَ أَوْ يَوْمِ الْعِيدِ عَنْ نَفْسِهِ وَزَوْجَتِهِ وَأَوْلادِهِ الصِّغَارِ وَوَالِدَيْهِ إِذَا كَانَا فَقِيرَيْنِ.\nوَيَدْفَعُ عَنْ كُلِّ نَفْسٍ صَاعًا مِنْ غَالِبِ قُوتِ الْبَلَدِ كَالْقَمْحِ لِمُسْلِمٍ فَقِيرٍ أَوْ غَيْرِهِ مِنْ مُسْتَحِقِّى الزَّكَاةِ وَالصَّاعُ يُسَاوِى أَرْبَعَ حَفَنَاتٍ بِالْيَدَيْنِ الْمُعْتَدِلَتَيْنِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا الأَمْرُ بِدَفْعِ الزَّكَاةِ.\n     (2) اذْكُرِ الآيَةَ الْقُرْءَانِيَةَ الَّتِى تُبَيِّنُ الأَصْنَافَ الْمُسْتَحِقِّينَ لِلزَّكَاةِ.\n     (3) مَنْ هُمُ الْفُقَرَاءُ.\n     (4) مَنْ هُمُ الْمَسَاكِينُ.\n     (5) مَنْ هُمُ الْعَامِلُونَ عَلَيْهَا.\n     (6) مَنْ هُمُ الْمُؤَلَّفَةُ قُلُوبُهُمْ.\n     (7) مَا مَعْنَى وَفِى الرِّقَابِ.\n     (8) مَنْ هُمُ الْغَارِمُونَ.\n     (9) مَا مَعْنَى وَفِى سَبِيلِ اللَّهِ.\n     (10) مَنْ هُوَ ابْنُ السَّبِيلِ.\n     (11) مَا هُوَ مِقْدَارُ زَكَاةِ الْفِطْرِ.\n     (12) كَمْ يُسَاوِى الصَّاعُ.\n"},{"id":"part4-section3","partIndex":4,"partName":"الجزء الرابع","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الرَّابِعُ"],"title":"فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ","blocks":[{"type":"p","text":"فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"الرِّيَاءُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »إِنَّ أَخْوَفَ مَا أَخَافُ عَلَيْكُمْ الشِّرْكُ الأَصْغَرُ« قَالُوا وَمَا الشِّرْكُ الأَصْغَرُ يَا رَسُولَ اللَّهِ قَالَ »الرِّيَاءُ« رَوَاهُ أَحْمَدُ بنُ حَنْبَلٍ."},{"type":"p","text":"الرِّيَاءُ هُوَ الْعَمَلُ بِالطَّاعَةِ طَلَبًا لِمَحْمَدَةِ النَّاسِ أَىْ لِيَمْدَحُوهُ وَهُوَ عَكْسُ الإِخْلاصِ وَالإِخْلاصُ هُوَ الْعَمَلُ بِالطَّاعَةِ طَلَبًا لِرِضَا اللَّهِ وَحْدَهُ قَالَ عَلَيْهِ الصَّلاةِ وَالسَّلامُ »إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ« رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ أَىْ أَنَّ الْعَمَلَ الصَّالِحَ لا بُدَّ فِيهِ مِنْ نِيَّةٍ صَحِيحَةٍ خَالِصَةٍ لِوَجْهِ اللَّهِ تَعَالَى لِيَكُونَ مَقْبُولًا فَالْمُسْلِمُ الْبَالِغُ إِذَا صَلَّى لِيَذْكُرَهُ النَّاسُ بِالْمَدْحِ أَوْ لِيَقُولُوا عَنْهُ فُلانٌ مُصَلٍّ فُلانٌ تَقِىٌّ فَإِنَّهُ يَسْقُطُ عَنْهُ الْفَرْضُ وَلَكِنَّهُ يَكُونُ وَقَعَ فِى مَعْصِيَةِ الرِّيَاءِ وَلا ثَوَابَ لَهُ فِى صَلاتِهِ."},{"type":"p","text":"كَذَلِكَ إِذَا صَامَ وَكَانَ قَصْدُهُ مِنْ صِيَامِهِ أَنْ يَقُولَ عَنْهُ النَّاسُ إِنَّهُ زَاهِدٌ عَابِدٌ فَهَذَا يَكُونُ مُرَائِيًا فِى صَوْمِهِ فَيَسْقُطُ عَنْهُ الْفَرْضُ وَلَكِنَّهُ يَكُونُ قَدْ وَقَعَ فِى الْمَعْصِيَةِ وَلا ثَوَابَ لَهُ فِى صِيَامِهِ."},{"type":"p","text":"كَذَلِكَ كُلُّ عَمَلٍ فِيهِ طَاعَةٌ إِذَا فَعَلَهُ الإِنْسَانُ وَكَانَ قَصْدُهُ أَنْ يَمْدَحَهُ النَّاسُ يَقَعُ صَاحِبُهُ فِى مَعْصِيَةٍ كَبِيرَةٍ وَهِىَ الرِّيَاءُ وَلا ثَوَابَ لَهُ فِى هَذَا الْعَمَلِ."},{"type":"p","text":"فَالْمُسْلِمُ إِذَا فَعَلَ الطَّاعَةَ مِنْ صَلاةٍ أَوْ صِيَامٍ أَوْ نَحْوِ ذَلِكَ يَنْبَغِى أَنْ يَقْصِدَ بِهَا رِضَا اللَّهِ وَحْدَهُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا فِى التَّحْذِيرِ مِنَ الرِّيَاءِ."},{"type":"p","text":"     (2) مَا هُوَ الرِّيَاءُ."},{"type":"p","text":"     (3) مَا هُوَ الإِخْلاصُ."},{"type":"p","text":"     (4) اذْكُرْ حَدِيثًا فِى الْحَثِّ عَلَى الإِخْلاصِ وَمَنْ رَوَاهُ. "},{"type":"p","text":"     (5) اذْكُرْ حَدِيثًا فِى الْحَثِّ عَلَى الإِخْلاصِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (6) مَا مَعْنَى الْحَدِيثِ إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ."},{"type":"p","text":"     (7) الْمُسْلِمُ الْبَالِغُ إِذَا صَلَّى وَصَامَ لِيَمْدَحَهُ النَّاسُ مَاذَا عَلَيْهِ."},{"type":"p","text":"     (8) وَمَاذَا تُسَمَّى مَعْصِيَتُهُ، هَلْ صَحَّ عَمَلُهُ."},{"type":"p","text":"     (9) مَاذَا يَنْبَغِى لِلْمُسْلِمِ أَنْ يَقْصِدَ بِعَمَلِهِ الصَّالِحِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"الْغِيبَةُ وَالْبُهْتَانُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ النَّبِىُّ ﷺ »أَتَدْرُونَ مَا الْغِيبَةُ «قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ، قَالَ »ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ« قِيلَ أَفَرَأَيْتَ إِنْ كَانَ فِى أَخِي مَا أَقُولُ قَالَ »إِنْ كَانَ فِيهِ مَا تَقُولُ فَقَدِ اغْتَبْتَهُ وَإِنْ لَمْ يَكُنْ فِيهِ مَا تَقُولُ فَقَدْ بَهَتَّهُ« رَوَاهُ مُسْلِمٌ."},{"type":"p","text":"عَرَّفَ النَّبِىُّ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فِى هَذَا الْحَدِيثِ مَعْصِيَتَيْنِ مِنْ مَعَاصِى اللِّسَانِ هُمَا الْغِيبَةُ وَالْبُهْتَانُ."},{"type":"p","text":"فَالْغِيبَةُ هِىَ ذِكْرُكَ أَخَاكَ الْمُسْلِمَ بِمَا يَكْرَهُ مَمَّا فِيهِ فِى خَلْفِهِ فَمَثَلًا لَوْ قَالَ مُسْلِمٌ فِى مُسْلِمٍ ءَاخَرَ فُلانٌ أَعْوَرُ وَهُوَ لا يَرْضَى أَنْ يُقَالَ عَنْهُ أَعْوَرُ فَيَكُونُ الْقَائِلُ قَدْ وَقَعَ فِى الْغِيبَةِ الْمُحَرَّمَةِ."},{"type":"p","text":"وَأَمَّا الْبُهْتَانُ فَهُوَ أَنْ تَذْكُرَ أَخَاكَ الْمُسْلِمَ فِى خَلْفِهِ بِمَا يَكْرَهُ بِشَىْءٍ لَيْسَ فِيهِ فَمَثَلًا لَوْ قَالَ مُسْلِمٌ عَنْ مُسْلِمٍ ءَاخَرَ فِى غَيْبَتِهِ فُلانٌ كَذَّابٌ وَهُوَ لَيْسَ بِكَذَّابٍ فَقَدْ وَقَعَ الْقَائِلُ فِى الْبُهْتَانِ وَهُوَ أَشَدُّ مَعْصِيَةً مِنَ الْغِيبَةِ."},{"type":"p","text":"فَالْمُسْلِمُ عَلَيْهِ أَنْ لا يُؤْذِىَ الْمُسْلِمِينَ وَيَنْبَغِى أَنْ يَكُونَ خُلُقُهُ حَسَنًا وَإِذَا وَجَدَ عَيْبًا فِى أَخِيهِ يَسْتُرُهُ وَلا يَفْضَحُهُ بَيْنَ النَّاسِ."},{"type":"p","text":"فَالْغِيبَةُ وَالْبُهْتَانُ يُؤَدِّيَانِ إِلَى الشِّجَارِ وَالْخُصُومَاتِ بَيْنَ الأَحْبَابِ وَالأَصْدِقَاءِ فَتَجَنَّبْ أَنْ تَقَعَ فِى الْغِيبَةِ وَالْبُهْتَانِ."},{"type":"p","text":"أَمَّا الْكَلامُ فِى الشَّخْصِ بِمَا فِيهِ لِيَحْذَرَهُ النَّاسُ كَالتَّحْذِيرِ مِنَ الَّذِى يَغُشُّ النَّاسَ فِى الطَّعَامِ أَوْ يَغُشُّ النَّاسَ فِى أَمْرِ الدِّينِ فَهَذَا جَائِزٌ بِالإِجْمَاعِ بَلْ هُوَ وَاجِبٌ لِأَنَّهُ مِنْ بَابِ إِنْكَارِ الْمُنْكَرِ الْوَاجِبِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ ﷺ فِى التَّحْذِيرِ مِنَ الْغِيبَةِ وَالْبُهْتَانِ."},{"type":"p","text":"     (2) مَا هِىَ الْغِيبَةُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (3) مَا هُوَ الْبُهْتَانُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (4) أَيُّهُمَا أَشَدُّ مَعْصِيَةً الْغِيبَةُ أَمِ الْبُهْتَانُ."},{"type":"p","text":"     (5) مَا حُكْمُ ذِكْرِ الشَّخْصِ الَّذِى يَغُشُّ النَّاسَ فِى دُنْيَاهُمْ أَوْ فِى دِينِهِمْ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"الصِّدْقُ وَالْكَذِبُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ النَّبِىُّ ﷺ »إِنَّ الصِّدْقَ يَهْدِى إِلَى الْبِرِّ وَإِنَّ الْبِرَّ يَهْدِى إِلَى الْجَنَّةِ وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ صِدِّيقًا وَإِنَّ الْكَذِبَ يَهْدِى إِلَى الْفُجُورِ وَإِنَّ الْفُجُورَ يَهْدِى إِلَى النَّارِ وَإِنَّ الرَّجُلَ لَيَكْذِبُ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا« رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ."},{"type":"p","text":"فِى هَذَا الْحَدِيثِ الشَّرِيفِ حَثَّنَا الرَّسُولُ عَلَيْهِ الصَّلاةُ وَالسَّلامُ عَلَى قَوْلِ الصِّدْقِ وَحَذَّرَنَا مِنْ قَوْلِ الْكَذِبِ وَالْكَذِبُ هُوَ الْكَلامُ بِخِلافِ الْوَاقِعِ وَهُوَ حَرَامٌ فِى الْجِدِّ وَالْمِزَاحِ."},{"type":"p","text":"فَالْمُسْلِمُ إِذَا تَكَلَّمَ بِكَلامٍ بِخِلافِ الْحَقِيقَةِ وَهُوَ يَعْلَمُ ذَلِكَ فَقَدْ وَقَعَ فِى مَعْصِيَةِ الْكَذِبِ مِثَالٌ عَلَى ذَلِكَ أَنْ يَقُولَ شَخْصٌ أَنَا ضَرَبْتُ فُلانًا وَهُوَ لَمْ يَضْرِبْهُ."},{"type":"p","text":"وَالْكَذِبُ إِذَا كَانَ يُؤَدِّى إِلَى إِيذَاءِ مُسْلِمٍ وَإِيقَاعِ الضَّرَرِ بِهِ فَإِنَّهُ يَكُونُ حِينَئِذٍ مَعْصِيَةً كَبِيرَةً فَيَنْبَغِى أَنْ تُعَوِّدَ لِسَانَكَ عَلَى قَوْلِ الصِّدْقِ وَأَنْ تَجْتَنِبَ الْكَذِبَ فَالْكَذِبُ عَادَةٌ شَنِيعَةٌ قَبِيحَةٌ فَكَمْ مِنْ أُنَاسٍ تَعَوَّدُوا الْكَذِبَ حَتَّى عَدَّهُمُ النَّاسُ كَذَّابِينَ فَصَارُوا غَيْرَ مَوْثُوقِينَ عِنْدَ النَّاسِ."},{"type":"p","text":"وَتَذَكَّرْ أَنَّ النَّبِىَّ عَلَيْهِ الصَّلاةُ وَالسَّلامُ لَمْ يَكْذِبْ فِى حَيَاتِهِ قَطُّ حَتَّى سَمَّاهُ قَوْمُهُ الصَّادِقَ الأَمِينَ. وَكَذَلِكَ سَائِرُ الأَنْبِيَاءِ لا يَكْذِبُونَ قَطُّ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى الْحَثِّ عَلَى الصِّدْقِ وَالتَّحْذِيرِ مِنَ الْكَذِبِ."},{"type":"p","text":"     (2) مَا هُوَ الْكَذِبُ وَمَا حُكْمُهُ."},{"type":"p","text":"     (3) مَا حُكْمُ الْكَذِبِ إِذَا كَانَ يُؤَدِّى إِلَى إِيذَاءِ مُسْلِمٍ."},{"type":"p","text":"     (4) بِمَ اشْتَهَرَ النَّبِىُّ ﷺ بَيْنَ قَوْمِهِ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"السَّرِقَةُ وَالأَمَانَةُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءَ بِمَا كَسَبَا نَكَالًا مِّنَ اللَّهِ﴾ [سُورَةَ الْمَائِدَةِ/38]."},{"type":"p","text":"السَّرِقَةُ هِىَ أَخْذُ مَالِ الْغَيْرِ خُفْيَةً بِدُونِ رِضَاهُ وَهِىَ حَرَامٌ وَمَرَضٌ اجْتِمَاعِىٌّ خَطِيرٌ."},{"type":"p","text":"فَالْمُسْلِمُ إِذَا أَخَذَ مَالَ غَيْرِهِ عَلَى وَجْهٍ لا يَحِلُّ لَهُ بِالسَّرِقَةِ يَكُونُ قَدْ أَوْقَعَ نَفْسَهُ فِى ذَنْبٍ مِنَ الذُّنُوبِ لِأَنَّ اللَّهَ عَزَّ وَجَلَّ حَرَّمَ عَلَى الإِنْسَانِ أَنْ يَأْخُذَ مِنْ مَالِ الْغَيْرِ بِدُونِ رِضَاهُ بِلا حَقٍّ."},{"type":"p","text":"وَالإِنْسَانُ قَدْ تُحَدِّثُهُ نَفْسُهُ إِذَا رَأَى مَالَ غَيْرِهِ أَنْ يَأْخُذَ جُزْءًا مِنْهُ فَيَقُولَ فِى نَفْسِهِ مَثَلًا ءَاخُذُ جُزْءًا يَسِيرًا فَقَطْ إِنَّ صَاحِبَ هَذَا الْمَالِ غَنِىٌّ لَنْ يُؤَثِّرَ عَلَيْهِ فُقْدَانُ هَذَا الْمَالِ أَوْ يَقُولُ إِنَّ صُنْدُوقَ الْمَالِ مَفْتُوحٌ أَمَامِى ءَاخُذُ مِنْهُ مَا أَشَاءُ لَنْ يَعْرِفَ أَحَدٌ بِذَلِكَ أَوْ يَقُولُ رِفَاقِى يَلْبَسُونَ الثِّيَابَ الْجَدِيدَةَ لِمَاذَا لا أَسْرُقُ لِأَشْتَرِىَ ثِيَابًا كَثِيَابِهِمْ وَأَحْذِيَةً كَأَحْذِيَتِهِمْ."},{"type":"p","text":"فَلْيُرَاقِبِ الإِنْسَانُ نَفْسَهُ وَلْيَحْذَرْ وَسَاوِسَ الشَّيْطَانِ الَّذِى يُرِيدُ أَنْ يُوقِعَهُ فِى مَعْصِيَةِ اللَّهِ وَظُلْمِ الْغَيْرِ وَأَخْذِ مَالِهِ بِغَيْرِ حَقٍّ وَقَدْ يَجُرُّهُ ذَلِكَ إِلَى الْفَضِيحَةِ وَالسِّجْنِ وَغَيْرِ ذَلِكَ فَضْلًا عَنِ الْعَذَابِ الَّذِى يَسْتَحِقُّهُ فِى الآخِرَةِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى تَحْرِيمِ السَّرِقَةِ."},{"type":"p","text":"     (2) مَا هِىَ السَّرِقَةُ."},{"type":"p","text":"     (3) مَا حُكْمُ أَخْذِ مَالِ الْغَيْرِ بِدُونِ رِضَاهُ."},{"type":"p","text":"     (4) إِذَا كَانَ الإِنْسَانُ لا يَتَّقِى اللَّهَ إِلَى مَاذَا قَدْ تُحَدِّثُهُ نَفْسُهُ إِذَا رَأَى مَالَ غَيْرِهِ."},{"type":"p","text":"     (5) مَنْ أَخَذَ مَالَ غَيْرِهِ بِغَيْرِ حَقٍّ أَوْ ظَلَمَ غَيْرَهُ إِلَى مَاذَا يَجُرُّهُ ذَلِكَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"عُقُوقُ الْوَالِدَيْنِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »لا يَدْخُلُ الْجَنَّةَ عَاقٌّ« رَوَاهُ الْبُخَارِىُّ وَمَعْنَى لا يَدْخُلُ الْجَنَّةَ أَىْ لا يَدْخُلُهَا مَعَ الأَوَّلِينَ."},{"type":"p","text":"وَعُقُوقُ الْوَالِدَيْنِ هُوَ أَنْ يُؤْذِىَ الْوَلَدُ أَبَوَيْهِ أَوْ أَحَدَهُمَا أَذًى شَدِيدًا غَيْرَ هَيِّنٍ وَذَلِكَ كَأَنْ يَضْرِبَ وَالِدَيْهِ أَوْ يَسُبَّهُمَا أَوْ يَلْعَنَهُمَا أَوْ أَحَدَهُمَا فَهَذَا مِنَ الْمَعَاصِى الْكَبِيرَةِ."},{"type":"p","text":"وَمِنْ عُقُوقِ الْوَالِدَيْنِ أَنْ يُعِينَ الْوَلَدُ أَبَاهُ عَلَى ظُلْمِ أُمِّهِ أَوْ يُعِينَ أُمَّهُ عَلَى ظُلْمِ أَبِيهِ فَهَذَا أَيْضًا حَرَامٌ مِنْ كَبَائِرِ الذُّنُوبِ. وَعُقُوقُ الأُمِّ أَشَدُّ مَعْصِيَةً مِنْ عُقُوقِ الأَبِ كَمَا أَنَّ بِرَّ الأُمِّ أَعْظَمُ ثَوَابًا مِنْ بِرِّ الأَبِ وَإِذَا أَطَاعَ الْمُسْلِمُ أَبَاهُ وَأُمَّهُ إِذَا أَمَرَاهُ بِشَىْءٍ لَيْسَ فِيهِ مَعْصِيَةٌ لِلَّهِ كَانَ لَهُ ثَوَابٌ عِنْدَ اللَّهِ تَعَالَى إِنْ نَوَى نِيَّةً حَسَنَةً."},{"type":"p","text":"وَقَدْ وَرَدَ عَنِ ابْنِ عُمَرَ أَنَّهُ رَأَى رَجُلًا يَحْمِلُ أُمَّهُ عَلَى ظَهْرِهِ فَقَالَ لَهُ هَذَا الرَّجُلُ لَقَدْ حَجَجْتُ بِأُمِّى وَهِىَ عَلَى ظَهْرِى أَتَرَانِى وَفَّيْتُهَا حَقَّهَا يَا ابْنَ عُمَرَ فَقَالَ لَهُ عَبْدُ اللَّهِ بنُ عُمَرَ وَلا بِطَلْقَةٍ أَىْ وَلا بِطَلْقَةٍ وَاحِدَةٍ مِنْ ءَالامِ الْوَضْعِ عِنْدَمَا وَلَدَتْهُ."},{"type":"p","text":"فَاحْرِصْ أَنْ تَكُونَ مُطِيعًا لِوَالِدَيْكَ فِى طَاعَةِ اللَّهِ وَاجْتَنِبْ تِلْكَ الْمَعْصِيَةَ الذَّمِيمَةَ مَعْصِيَةَ الْعُقُوقِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى النَّهْىِ عَنْ عُقُوقِ الْوَالِدَيْنِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (2) مَا مَعْنَى الْحَدِيثِ »لا يَدْخُلُ الْجَنَّةَ عَاقٌّ«."},{"type":"p","text":"     (3) مَا هُوَ عُقُوقُ الْوَالِدَيْنِ أَعْطِ مِثَالًا."},{"type":"p","text":"     (4) أَيُّهُمَا أَشَدُّ مَعْصِيَةُ عُقُوقِ الأُمِّ أَمْ عُقُوقِ الأَبِ."},{"type":"p","text":"     (5) أَيُّهُمَا أَعْظَمُ ثَوَابًا بِرُّ الأُمِّ أَمْ بِرُّ الأَبِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"صِلَةُ الرَّحِمِ"},{"type":"p","text":""},{"type":"p","text":"سَأَلَ أَحَدُ الصَّحَابَةِ رَسُولَ اللَّهِ ﷺ قَائِلًا يَا رَسُولَ اللَّهِ دُلَّنِى عَلَى عَمَلٍ إِذَا عَمِلْتُهُ دَخَلْتُ الْجَنَّةَ فَقَالَ »أَطْعِمِ الطَّعَامَ وَصِلِ الأَرْحَامَ وَصَلِّ بِاللَّيْلِ وَالنَّاسُ نِيَامٌ تَدْخُلِ الْجَنَّةَ بِسَلامٍ« رَوَاهُ ابْنُ حِبَّانَ."},{"type":"p","text":"فَفِي هَذَا الْحَدِيثِ أَنَّ مَنْ أَخَذَ بِهَذِهِ الْخِصَالِ دَخَلَ الْجَنَّةَ بِدُونِ عَذَابٍ وَإِحْدَى هَذِهِ الْخِصَالِ صِلَةُ الأَرْحَامِ."},{"type":"p","text":"فَالأَرْحَامُ هُمْ قَرَابَةُ الشَّخْصِ إِنْ كَانُوا مِنْ جِهَةِ الأَبِ أَوْ مِنْ جِهَة الأُمِّ وَمَنْ قَطَعَ وَاحِدًا مِنْهُمْ اسْتَحَقَّ عَذَابَ اللَّهِ لِحَدِيثِ النَّبِىِّ ﷺ »لا يَدْخُلُ الْجَنَّةَ عَاقٌّ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"وَالْمَعْنَى أَنَّ قَاطِعَ الرَّحِمِ لا يَدْخُلُ الْجَنَّةَ مَعَ الأَوَّلِينَ."},{"type":"p","text":"وَمَعْنَى أَنْ يَصِلَ الشَّخْصُ رَحِمَهُ أَنْ يَزُورَ مَنِ اسْتَطَاعَ مِنْ أَقَارِبِهِ وَيُرَاسِلَ مَنْ لَمْ يَسْتَطِعْ زِيَارَتَهُ وَالإِحْسَانُ إِلَى الْمُحْتَاجِ مِنْهُمْ وَلا يَجُوزُ أَنْ يَقْطَعَ أَرْحَامَهُ فَلا يَزُورُهُمْ فِى رَمَضَانَ وَلا فِى الْعِيدَيْنِ وَلا عِنْدَ الْمَصَائِبِ وَلا فِى الأَفْرَاحِ وَلا فِى غَيْرِهَا بَلْ تَمْضِى مُدَّةٌ يَشْعُرُ الْقَرِيبُ فِيهَا بِالْجَفَاءِ فَمَنْ فَعَلَ هَذَا يُقَالُ لَهُ قَاطِعٌ."},{"type":"p","text":"إِنَّ زِيَارَةَ الأَقَارِبِ الَّذِينَ لا يَزُورُونَكَ لَيْسَتْ مَهَانَةً وَمَذَلَّةً بَلْ خَصْلَةُ خَيْرٍ وَعَمَلُ طَاعَةٍ لِلَّهِ تَعَالَى فَاحْرِصْ عَلَى زِيَارَتِهِمْ وَتَقَرَّبْ إِلَيْهِمْ بِالْمَوَدَّةِ وَاللُّطْفِ وَاعْمَلْ عَلَى إِعَانَتِهِمْ فِى فِعْلِ الْخَيْرَاتِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ ﷺ فِى الْحَثِّ عَلَى صِلَةِ الرَّحِمِ."},{"type":"p","text":"     (2) مَنْ هُمُ الأَرْحَام."},{"type":"p","text":"     (3) مَا حُكْمُ مَنْ قَطَعَ وَاحِدًا مِنَ الأَرْحَامِ."},{"type":"p","text":"     (4) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ ﷺ فِى قَاطِعِ الرَّحِمِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (5) مَا مَعْنَى الْحَدِيثِ »لا يَدْخُلِ الْجَنَّةَ قَاطِعٌ«."},{"type":"p","text":"     (6) مَا مَعْنَى أَنْ يَصِلَ الشَّخْصُ رَحِمَهُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"التَّحَابُّ فِى اللَّهِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »قَالَ اللَّهُ تَعَالَى الْمُتَحَابُّونَ بِجَلالِى لَهُمْ مَنَابِرُ مِنْ نُورٍ يَوْمَ الْقِيَامَةِ«. "},{"type":"p","text":"وَوَرَدَ فِى الْحَدِيثِ الصَّحِيحِ »سَبْعَةٌ يُظِلُّهُمُ اللَّهُ يَوْمَ الْقِيَامَةِ فِى ظِلِّ الْعَرْشِ يَوْمَ لا ظِلَّ إِلَّا ظِلُّهُ«. وَذُكِرَ فِى السَّبْعَةِ »رَجُلانِ تَحَابَّا فِى اللَّهِ«."},{"type":"p","text":"التَّحَابُّ فِى اللَّهِ هُوَ أَنْ يُحِبَّ الْمُسْلِمُ لِأَخِيهِ الْمُسْلِمِ مَا يُحِبُّ لِنَفْسِهِ مِنَ الْخَيْرِ فَلا يَغُشُّهُ لا بِالْفِعْلِ وَلا بِالْقَوْلِ وَإِنْ رَءَاهُ عَلَى خَيْرٍ يَفْرَحُ وَإِنْ رَءَاهُ عَلَى شَرٍّ لا يُزَيِّنُ لَهُ هَذَا الشَّرَّ وَلا يَسْكُتُ عَنْهُ مَا دَامَ يَسْتَطِيعُ أَنْ يُخَلِّصَهُ مِنَ هَذَا الشَّرِّ بَلْ يَنْصَحُهُ حَتَّى يُصْلِحَ مَا فَسَدَ مِنْ حَالِهِ فَإِنْ رَءَاهُ مَثَلًا تَارِكَ صَلاةٍ أَرْشَدَهُ إِلَى فِعْلِهَا وَحَذَّرَهُ مِنْ مَخَاطِرِ تَرْكِهَا وَإِنْ رَأَى فِيهِ خَصْلَةً قَبِيحَةً نَصَحَهُ وَأَعَانَهُ عَلَى التَّخَلُّصِ مِنْهَا وَإِنْ رَءَاهُ جَاهِلًا بِعِلْمِ الدِّينِ دَلَّهُ أَوْ أَرْشَدَهُ إِلَى مَنْ يُعَلِّمُهُ الْعِلْمَ الصَّحِيحَ."},{"type":"p","text":"وَالْمُتَحَابُّونَ فِى اللَّهِ كَمَا أَخْبَرَنَا الرَّسُولُ عَلَيْهِ الصَّلاةُ وَالسَّلامُ يَكُونُونَ قَبْلَ دُخُولِهِمُ الْجَنَّةَ عَلَى مَنَابِرَ مِنْ نُورٍ تَحْتَ ظِلِّ الْعَرْشِ فَيُعْجَبُ بِهِمُ النَّاسُ حَتَّى الأَنْبِيَاءُ وَالشُّهَدَاءُ مَعَ أَنَّ الأَنْبِيَاءَ أَعْلَى مِنْهُمْ دَرَجَةً لَكِنْ عِندَمَا يَرَوْنَ هَذَا لِمَنْ هُوَ دُونَهُمْ يَعْجَبُونَ وَيَفْرَحُونَ لَهُمْ بِذَلِكَ بَيْنَمَا الْكُفَّارُ يَتَأَذَّوْنَ مِنْ حَرِّ الشَّمْسِ."},{"type":"p","text":"هَؤُلاءِ هُمُ الْمُتَحَابُّونَ فِى اللَّهِ يَجْتَمِعُونَ عَلَى الْبِرِّ وَالتَّقْوَى وَلا يَجْتَمِعُونَ عَلَى الإِثْمِ وَالشَّرِّ تَجْمَعُهُمْ طَاعَةُ اللَّهِ بَعِيدًا عَنِ الأَغْرَاضِ الدُّنْيَوِيَّةِ لا يَغُشُّ بَعْضُهُمْ بَعْضًا وَلا يَخُونُ بَعْضُهُمْ بَعْضًا وَلا يَدُلُّ بَعْضُهُمْ بَعْضًا إِلَى شَرٍّ أَوْ ضَلالٍ أَوْ ظُلْمٍ بَلْ يَتَحَابُّونَ ابْتِغَاءَ مَرْضَاةِ اللَّهِ تَعَالَى فَاحْرِصْ عَلَى أَنْ تَكُونَ وَاحِدًا مِنْهُمْ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئَلِةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا قُدْسِيًّا فِى فَضْلِ الْمُتَحَابِّينَ فِى اللَّهِ."},{"type":"p","text":"     (2) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى فَضْلِ الْمُتَحَابِّينَ فِى اللَّهِ."},{"type":"p","text":"     (3) مَا هُوَ التَّحَابُّ فِى اللَّهِ."},{"type":"p","text":"     (4) أَيْنَ يَكُونُ الْمُتَحَابُّونَ قَبْلَ دُخُولِهِمُ الْجَنَّةَ."},{"type":"p","text":"     (5) عَلامَ يَجْتَمِعُ الْمُتَحَابُّونَ فِى اللَّهِ.أأأأ"}],"paragraphCount":99,"wordCount":1616,"readingMinutes":9,"description":"المحتوى الكامل لـ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ من الجزء الرابع، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الرَّابِعُ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ\nالدَّرْسُ الأَوَّلُ\nالرِّيَاءُ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »إِنَّ أَخْوَفَ مَا أَخَافُ عَلَيْكُمْ الشِّرْكُ الأَصْغَرُ« قَالُوا وَمَا الشِّرْكُ الأَصْغَرُ يَا رَسُولَ اللَّهِ قَالَ »الرِّيَاءُ« رَوَاهُ أَحْمَدُ بنُ حَنْبَلٍ.\nالرِّيَاءُ هُوَ الْعَمَلُ بِالطَّاعَةِ طَلَبًا لِمَحْمَدَةِ النَّاسِ أَىْ لِيَمْدَحُوهُ وَهُوَ عَكْسُ الإِخْلاصِ وَالإِخْلاصُ هُوَ الْعَمَلُ بِالطَّاعَةِ طَلَبًا لِرِضَا اللَّهِ وَحْدَهُ قَالَ عَلَيْهِ الصَّلاةِ وَالسَّلامُ »إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ« رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ أَىْ أَنَّ الْعَمَلَ الصَّالِحَ لا بُدَّ فِيهِ مِنْ نِيَّةٍ صَحِيحَةٍ خَالِصَةٍ لِوَجْهِ اللَّهِ تَعَالَى لِيَكُونَ مَقْبُولًا فَالْمُسْلِمُ الْبَالِغُ إِذَا صَلَّى لِيَذْكُرَهُ النَّاسُ بِالْمَدْحِ أَوْ لِيَقُولُوا عَنْهُ فُلانٌ مُصَلٍّ فُلانٌ تَقِىٌّ فَإِنَّهُ يَسْقُطُ عَنْهُ الْفَرْضُ وَلَكِنَّهُ يَكُونُ وَقَعَ فِى مَعْصِيَةِ الرِّيَاءِ وَلا ثَوَابَ لَهُ فِى صَلاتِهِ.\nكَذَلِكَ إِذَا صَامَ وَكَانَ قَصْدُهُ مِنْ صِيَامِهِ أَنْ يَقُولَ عَنْهُ النَّاسُ إِنَّهُ زَاهِدٌ عَابِدٌ فَهَذَا يَكُونُ مُرَائِيًا فِى صَوْمِهِ فَيَسْقُطُ عَنْهُ الْفَرْضُ وَلَكِنَّهُ يَكُونُ قَدْ وَقَعَ فِى الْمَعْصِيَةِ وَلا ثَوَابَ لَهُ فِى صِيَامِهِ.\nكَذَلِكَ كُلُّ عَمَلٍ فِيهِ طَاعَةٌ إِذَا فَعَلَهُ الإِنْسَانُ وَكَانَ قَصْدُهُ أَنْ يَمْدَحَهُ النَّاسُ يَقَعُ صَاحِبُهُ فِى مَعْصِيَةٍ كَبِيرَةٍ وَهِىَ الرِّيَاءُ وَلا ثَوَابَ لَهُ فِى هَذَا الْعَمَلِ.\nفَالْمُسْلِمُ إِذَا فَعَلَ الطَّاعَةَ مِنْ صَلاةٍ أَوْ صِيَامٍ أَوْ نَحْوِ ذَلِكَ يَنْبَغِى أَنْ يَقْصِدَ بِهَا رِضَا اللَّهِ وَحْدَهُ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا فِى التَّحْذِيرِ مِنَ الرِّيَاءِ.\n     (2) مَا هُوَ الرِّيَاءُ.\n     (3) مَا هُوَ الإِخْلاصُ.\n     (4) اذْكُرْ حَدِيثًا فِى الْحَثِّ عَلَى الإِخْلاصِ وَمَنْ رَوَاهُ. \n     (5) اذْكُرْ حَدِيثًا فِى الْحَثِّ عَلَى الإِخْلاصِ وَمَنْ رَوَاهُ.\n     (6) مَا مَعْنَى الْحَدِيثِ إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ.\n     (7) الْمُسْلِمُ الْبَالِغُ إِذَا صَلَّى وَصَامَ لِيَمْدَحَهُ النَّاسُ مَاذَا عَلَيْهِ.\n     (8) وَمَاذَا تُسَمَّى مَعْصِيَتُهُ، هَلْ صَحَّ عَمَلُهُ.\n     (9) مَاذَا يَنْبَغِى لِلْمُسْلِمِ أَنْ يَقْصِدَ بِعَمَلِهِ الصَّالِحِ.\n\nالدَّرْسُ الثَّانِى\nالْغِيبَةُ وَالْبُهْتَانُ\n\nقَالَ النَّبِىُّ ﷺ »أَتَدْرُونَ مَا الْغِيبَةُ «قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ، قَالَ »ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ« قِيلَ أَفَرَأَيْتَ إِنْ كَانَ فِى أَخِي مَا أَقُولُ قَالَ »إِنْ كَانَ فِيهِ مَا تَقُولُ فَقَدِ اغْتَبْتَهُ وَإِنْ لَمْ يَكُنْ فِيهِ مَا تَقُولُ فَقَدْ بَهَتَّهُ« رَوَاهُ مُسْلِمٌ.\nعَرَّفَ النَّبِىُّ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فِى هَذَا الْحَدِيثِ مَعْصِيَتَيْنِ مِنْ مَعَاصِى اللِّسَانِ هُمَا الْغِيبَةُ وَالْبُهْتَانُ.\nفَالْغِيبَةُ هِىَ ذِكْرُكَ أَخَاكَ الْمُسْلِمَ بِمَا يَكْرَهُ مَمَّا فِيهِ فِى خَلْفِهِ فَمَثَلًا لَوْ قَالَ مُسْلِمٌ فِى مُسْلِمٍ ءَاخَرَ فُلانٌ أَعْوَرُ وَهُوَ لا يَرْضَى أَنْ يُقَالَ عَنْهُ أَعْوَرُ فَيَكُونُ الْقَائِلُ قَدْ وَقَعَ فِى الْغِيبَةِ الْمُحَرَّمَةِ.\nوَأَمَّا الْبُهْتَانُ فَهُوَ أَنْ تَذْكُرَ أَخَاكَ الْمُسْلِمَ فِى خَلْفِهِ بِمَا يَكْرَهُ بِشَىْءٍ لَيْسَ فِيهِ فَمَثَلًا لَوْ قَالَ مُسْلِمٌ عَنْ مُسْلِمٍ ءَاخَرَ فِى غَيْبَتِهِ فُلانٌ كَذَّابٌ وَهُوَ لَيْسَ بِكَذَّابٍ فَقَدْ وَقَعَ الْقَائِلُ فِى الْبُهْتَانِ وَهُوَ أَشَدُّ مَعْصِيَةً مِنَ الْغِيبَةِ.\nفَالْمُسْلِمُ عَلَيْهِ أَنْ لا يُؤْذِىَ الْمُسْلِمِينَ وَيَنْبَغِى أَنْ يَكُونَ خُلُقُهُ حَسَنًا وَإِذَا وَجَدَ عَيْبًا فِى أَخِيهِ يَسْتُرُهُ وَلا يَفْضَحُهُ بَيْنَ النَّاسِ.\nفَالْغِيبَةُ وَالْبُهْتَانُ يُؤَدِّيَانِ إِلَى الشِّجَارِ وَالْخُصُومَاتِ بَيْنَ الأَحْبَابِ وَالأَصْدِقَاءِ فَتَجَنَّبْ أَنْ تَقَعَ فِى الْغِيبَةِ وَالْبُهْتَانِ.\nأَمَّا الْكَلامُ فِى الشَّخْصِ بِمَا فِيهِ لِيَحْذَرَهُ النَّاسُ كَالتَّحْذِيرِ مِنَ الَّذِى يَغُشُّ النَّاسَ فِى الطَّعَامِ أَوْ يَغُشُّ النَّاسَ فِى أَمْرِ الدِّينِ فَهَذَا جَائِزٌ بِالإِجْمَاعِ بَلْ هُوَ وَاجِبٌ لِأَنَّهُ مِنْ بَابِ إِنْكَارِ الْمُنْكَرِ الْوَاجِبِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ ﷺ فِى التَّحْذِيرِ مِنَ الْغِيبَةِ وَالْبُهْتَانِ.\n     (2) مَا هِىَ الْغِيبَةُ أَعْطِ مِثَالًا.\n     (3) مَا هُوَ الْبُهْتَانُ أَعْطِ مِثَالًا.\n     (4) أَيُّهُمَا أَشَدُّ مَعْصِيَةً الْغِيبَةُ أَمِ الْبُهْتَانُ.\n     (5) مَا حُكْمُ ذِكْرِ الشَّخْصِ الَّذِى يَغُشُّ النَّاسَ فِى دُنْيَاهُمْ أَوْ فِى دِينِهِمْ.\n\nالدَّرْسُ الثَّالِثُ\nالصِّدْقُ وَالْكَذِبُ\n\nقَالَ النَّبِىُّ ﷺ »إِنَّ الصِّدْقَ يَهْدِى إِلَى الْبِرِّ وَإِنَّ الْبِرَّ يَهْدِى إِلَى الْجَنَّةِ وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ صِدِّيقًا وَإِنَّ الْكَذِبَ يَهْدِى إِلَى الْفُجُورِ وَإِنَّ الْفُجُورَ يَهْدِى إِلَى النَّارِ وَإِنَّ الرَّجُلَ لَيَكْذِبُ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا« رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ.\nفِى هَذَا الْحَدِيثِ الشَّرِيفِ حَثَّنَا الرَّسُولُ عَلَيْهِ الصَّلاةُ وَالسَّلامُ عَلَى قَوْلِ الصِّدْقِ وَحَذَّرَنَا مِنْ قَوْلِ الْكَذِبِ وَالْكَذِبُ هُوَ الْكَلامُ بِخِلافِ الْوَاقِعِ وَهُوَ حَرَامٌ فِى الْجِدِّ وَالْمِزَاحِ.\nفَالْمُسْلِمُ إِذَا تَكَلَّمَ بِكَلامٍ بِخِلافِ الْحَقِيقَةِ وَهُوَ يَعْلَمُ ذَلِكَ فَقَدْ وَقَعَ فِى مَعْصِيَةِ الْكَذِبِ مِثَالٌ عَلَى ذَلِكَ أَنْ يَقُولَ شَخْصٌ أَنَا ضَرَبْتُ فُلانًا وَهُوَ لَمْ يَضْرِبْهُ.\nوَالْكَذِبُ إِذَا كَانَ يُؤَدِّى إِلَى إِيذَاءِ مُسْلِمٍ وَإِيقَاعِ الضَّرَرِ بِهِ فَإِنَّهُ يَكُونُ حِينَئِذٍ مَعْصِيَةً كَبِيرَةً فَيَنْبَغِى أَنْ تُعَوِّدَ لِسَانَكَ عَلَى قَوْلِ الصِّدْقِ وَأَنْ تَجْتَنِبَ الْكَذِبَ فَالْكَذِبُ عَادَةٌ شَنِيعَةٌ قَبِيحَةٌ فَكَمْ مِنْ أُنَاسٍ تَعَوَّدُوا الْكَذِبَ حَتَّى عَدَّهُمُ النَّاسُ كَذَّابِينَ فَصَارُوا غَيْرَ مَوْثُوقِينَ عِنْدَ النَّاسِ.\nوَتَذَكَّرْ أَنَّ النَّبِىَّ عَلَيْهِ الصَّلاةُ وَالسَّلامُ لَمْ يَكْذِبْ فِى حَيَاتِهِ قَطُّ حَتَّى سَمَّاهُ قَوْمُهُ الصَّادِقَ الأَمِينَ. وَكَذَلِكَ سَائِرُ الأَنْبِيَاءِ لا يَكْذِبُونَ قَطُّ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى الْحَثِّ عَلَى الصِّدْقِ وَالتَّحْذِيرِ مِنَ الْكَذِبِ.\n     (2) مَا هُوَ الْكَذِبُ وَمَا حُكْمُهُ.\n     (3) مَا حُكْمُ الْكَذِبِ إِذَا كَانَ يُؤَدِّى إِلَى إِيذَاءِ مُسْلِمٍ.\n     (4) بِمَ اشْتَهَرَ النَّبِىُّ ﷺ بَيْنَ قَوْمِهِ.\n\n\nالدَّرْسُ الرَّابِعُ\nالسَّرِقَةُ وَالأَمَانَةُ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءَ بِمَا كَسَبَا نَكَالًا مِّنَ اللَّهِ﴾ [سُورَةَ الْمَائِدَةِ/38].\nالسَّرِقَةُ هِىَ أَخْذُ مَالِ الْغَيْرِ خُفْيَةً بِدُونِ رِضَاهُ وَهِىَ حَرَامٌ وَمَرَضٌ اجْتِمَاعِىٌّ خَطِيرٌ.\nفَالْمُسْلِمُ إِذَا أَخَذَ مَالَ غَيْرِهِ عَلَى وَجْهٍ لا يَحِلُّ لَهُ بِالسَّرِقَةِ يَكُونُ قَدْ أَوْقَعَ نَفْسَهُ فِى ذَنْبٍ مِنَ الذُّنُوبِ لِأَنَّ اللَّهَ عَزَّ وَجَلَّ حَرَّمَ عَلَى الإِنْسَانِ أَنْ يَأْخُذَ مِنْ مَالِ الْغَيْرِ بِدُونِ رِضَاهُ بِلا حَقٍّ.\nوَالإِنْسَانُ قَدْ تُحَدِّثُهُ نَفْسُهُ إِذَا رَأَى مَالَ غَيْرِهِ أَنْ يَأْخُذَ جُزْءًا مِنْهُ فَيَقُولَ فِى نَفْسِهِ مَثَلًا ءَاخُذُ جُزْءًا يَسِيرًا فَقَطْ إِنَّ صَاحِبَ هَذَا الْمَالِ غَنِىٌّ لَنْ يُؤَثِّرَ عَلَيْهِ فُقْدَانُ هَذَا الْمَالِ أَوْ يَقُولُ إِنَّ صُنْدُوقَ الْمَالِ مَفْتُوحٌ أَمَامِى ءَاخُذُ مِنْهُ مَا أَشَاءُ لَنْ يَعْرِفَ أَحَدٌ بِذَلِكَ أَوْ يَقُولُ رِفَاقِى يَلْبَسُونَ الثِّيَابَ الْجَدِيدَةَ لِمَاذَا لا أَسْرُقُ لِأَشْتَرِىَ ثِيَابًا كَثِيَابِهِمْ وَأَحْذِيَةً كَأَحْذِيَتِهِمْ.\nفَلْيُرَاقِبِ الإِنْسَانُ نَفْسَهُ وَلْيَحْذَرْ وَسَاوِسَ الشَّيْطَانِ الَّذِى يُرِيدُ أَنْ يُوقِعَهُ فِى مَعْصِيَةِ اللَّهِ وَظُلْمِ الْغَيْرِ وَأَخْذِ مَالِهِ بِغَيْرِ حَقٍّ وَقَدْ يَجُرُّهُ ذَلِكَ إِلَى الْفَضِيحَةِ وَالسِّجْنِ وَغَيْرِ ذَلِكَ فَضْلًا عَنِ الْعَذَابِ الَّذِى يَسْتَحِقُّهُ فِى الآخِرَةِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى تَحْرِيمِ السَّرِقَةِ.\n     (2) مَا هِىَ السَّرِقَةُ.\n     (3) مَا حُكْمُ أَخْذِ مَالِ الْغَيْرِ بِدُونِ رِضَاهُ.\n     (4) إِذَا كَانَ الإِنْسَانُ لا يَتَّقِى اللَّهَ إِلَى مَاذَا قَدْ تُحَدِّثُهُ نَفْسُهُ إِذَا رَأَى مَالَ غَيْرِهِ.\n     (5) مَنْ أَخَذَ مَالَ غَيْرِهِ بِغَيْرِ حَقٍّ أَوْ ظَلَمَ غَيْرَهُ إِلَى مَاذَا يَجُرُّهُ ذَلِكَ.\n\nالدَّرْسُ الْخَامِسُ\nعُقُوقُ الْوَالِدَيْنِ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »لا يَدْخُلُ الْجَنَّةَ عَاقٌّ« رَوَاهُ الْبُخَارِىُّ وَمَعْنَى لا يَدْخُلُ الْجَنَّةَ أَىْ لا يَدْخُلُهَا مَعَ الأَوَّلِينَ.\nوَعُقُوقُ الْوَالِدَيْنِ هُوَ أَنْ يُؤْذِىَ الْوَلَدُ أَبَوَيْهِ أَوْ أَحَدَهُمَا أَذًى شَدِيدًا غَيْرَ هَيِّنٍ وَذَلِكَ كَأَنْ يَضْرِبَ وَالِدَيْهِ أَوْ يَسُبَّهُمَا أَوْ يَلْعَنَهُمَا أَوْ أَحَدَهُمَا فَهَذَا مِنَ الْمَعَاصِى الْكَبِيرَةِ.\nوَمِنْ عُقُوقِ الْوَالِدَيْنِ أَنْ يُعِينَ الْوَلَدُ أَبَاهُ عَلَى ظُلْمِ أُمِّهِ أَوْ يُعِينَ أُمَّهُ عَلَى ظُلْمِ أَبِيهِ فَهَذَا أَيْضًا حَرَامٌ مِنْ كَبَائِرِ الذُّنُوبِ. وَعُقُوقُ الأُمِّ أَشَدُّ مَعْصِيَةً مِنْ عُقُوقِ الأَبِ كَمَا أَنَّ بِرَّ الأُمِّ أَعْظَمُ ثَوَابًا مِنْ بِرِّ الأَبِ وَإِذَا أَطَاعَ الْمُسْلِمُ أَبَاهُ وَأُمَّهُ إِذَا أَمَرَاهُ بِشَىْءٍ لَيْسَ فِيهِ مَعْصِيَةٌ لِلَّهِ كَانَ لَهُ ثَوَابٌ عِنْدَ اللَّهِ تَعَالَى إِنْ نَوَى نِيَّةً حَسَنَةً.\nوَقَدْ وَرَدَ عَنِ ابْنِ عُمَرَ أَنَّهُ رَأَى رَجُلًا يَحْمِلُ أُمَّهُ عَلَى ظَهْرِهِ فَقَالَ لَهُ هَذَا الرَّجُلُ لَقَدْ حَجَجْتُ بِأُمِّى وَهِىَ عَلَى ظَهْرِى أَتَرَانِى وَفَّيْتُهَا حَقَّهَا يَا ابْنَ عُمَرَ فَقَالَ لَهُ عَبْدُ اللَّهِ بنُ عُمَرَ وَلا بِطَلْقَةٍ أَىْ وَلا بِطَلْقَةٍ وَاحِدَةٍ مِنْ ءَالامِ الْوَضْعِ عِنْدَمَا وَلَدَتْهُ.\nفَاحْرِصْ أَنْ تَكُونَ مُطِيعًا لِوَالِدَيْكَ فِى طَاعَةِ اللَّهِ وَاجْتَنِبْ تِلْكَ الْمَعْصِيَةَ الذَّمِيمَةَ مَعْصِيَةَ الْعُقُوقِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى النَّهْىِ عَنْ عُقُوقِ الْوَالِدَيْنِ وَمَنْ رَوَاهُ.\n     (2) مَا مَعْنَى الْحَدِيثِ »لا يَدْخُلُ الْجَنَّةَ عَاقٌّ«.\n     (3) مَا هُوَ عُقُوقُ الْوَالِدَيْنِ أَعْطِ مِثَالًا.\n     (4) أَيُّهُمَا أَشَدُّ مَعْصِيَةُ عُقُوقِ الأُمِّ أَمْ عُقُوقِ الأَبِ.\n     (5) أَيُّهُمَا أَعْظَمُ ثَوَابًا بِرُّ الأُمِّ أَمْ بِرُّ الأَبِ.\n\nالدَّرْسُ السَّادِسُ\nصِلَةُ الرَّحِمِ\n\nسَأَلَ أَحَدُ الصَّحَابَةِ رَسُولَ اللَّهِ ﷺ قَائِلًا يَا رَسُولَ اللَّهِ دُلَّنِى عَلَى عَمَلٍ إِذَا عَمِلْتُهُ دَخَلْتُ الْجَنَّةَ فَقَالَ »أَطْعِمِ الطَّعَامَ وَصِلِ الأَرْحَامَ وَصَلِّ بِاللَّيْلِ وَالنَّاسُ نِيَامٌ تَدْخُلِ الْجَنَّةَ بِسَلامٍ« رَوَاهُ ابْنُ حِبَّانَ.\nفَفِي هَذَا الْحَدِيثِ أَنَّ مَنْ أَخَذَ بِهَذِهِ الْخِصَالِ دَخَلَ الْجَنَّةَ بِدُونِ عَذَابٍ وَإِحْدَى هَذِهِ الْخِصَالِ صِلَةُ الأَرْحَامِ.\nفَالأَرْحَامُ هُمْ قَرَابَةُ الشَّخْصِ إِنْ كَانُوا مِنْ جِهَةِ الأَبِ أَوْ مِنْ جِهَة الأُمِّ وَمَنْ قَطَعَ وَاحِدًا مِنْهُمْ اسْتَحَقَّ عَذَابَ اللَّهِ لِحَدِيثِ النَّبِىِّ ﷺ »لا يَدْخُلُ الْجَنَّةَ عَاقٌّ« رَوَاهُ الْبُخَارِىُّ.\nوَالْمَعْنَى أَنَّ قَاطِعَ الرَّحِمِ لا يَدْخُلُ الْجَنَّةَ مَعَ الأَوَّلِينَ.\nوَمَعْنَى أَنْ يَصِلَ الشَّخْصُ رَحِمَهُ أَنْ يَزُورَ مَنِ اسْتَطَاعَ مِنْ أَقَارِبِهِ وَيُرَاسِلَ مَنْ لَمْ يَسْتَطِعْ زِيَارَتَهُ وَالإِحْسَانُ إِلَى الْمُحْتَاجِ مِنْهُمْ وَلا يَجُوزُ أَنْ يَقْطَعَ أَرْحَامَهُ فَلا يَزُورُهُمْ فِى رَمَضَانَ وَلا فِى الْعِيدَيْنِ وَلا عِنْدَ الْمَصَائِبِ وَلا فِى الأَفْرَاحِ وَلا فِى غَيْرِهَا بَلْ تَمْضِى مُدَّةٌ يَشْعُرُ الْقَرِيبُ فِيهَا بِالْجَفَاءِ فَمَنْ فَعَلَ هَذَا يُقَالُ لَهُ قَاطِعٌ.\nإِنَّ زِيَارَةَ الأَقَارِبِ الَّذِينَ لا يَزُورُونَكَ لَيْسَتْ مَهَانَةً وَمَذَلَّةً بَلْ خَصْلَةُ خَيْرٍ وَعَمَلُ طَاعَةٍ لِلَّهِ تَعَالَى فَاحْرِصْ عَلَى زِيَارَتِهِمْ وَتَقَرَّبْ إِلَيْهِمْ بِالْمَوَدَّةِ وَاللُّطْفِ وَاعْمَلْ عَلَى إِعَانَتِهِمْ فِى فِعْلِ الْخَيْرَاتِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ ﷺ فِى الْحَثِّ عَلَى صِلَةِ الرَّحِمِ.\n     (2) مَنْ هُمُ الأَرْحَام.\n     (3) مَا حُكْمُ مَنْ قَطَعَ وَاحِدًا مِنَ الأَرْحَامِ.\n     (4) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ ﷺ فِى قَاطِعِ الرَّحِمِ وَمَنْ رَوَاهُ.\n     (5) مَا مَعْنَى الْحَدِيثِ »لا يَدْخُلِ الْجَنَّةَ قَاطِعٌ«.\n     (6) مَا مَعْنَى أَنْ يَصِلَ الشَّخْصُ رَحِمَهُ.\n\nالدَّرْسُ السَّابِعُ\nالتَّحَابُّ فِى اللَّهِ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »قَالَ اللَّهُ تَعَالَى الْمُتَحَابُّونَ بِجَلالِى لَهُمْ مَنَابِرُ مِنْ نُورٍ يَوْمَ الْقِيَامَةِ«. \nوَوَرَدَ فِى الْحَدِيثِ الصَّحِيحِ »سَبْعَةٌ يُظِلُّهُمُ اللَّهُ يَوْمَ الْقِيَامَةِ فِى ظِلِّ الْعَرْشِ يَوْمَ لا ظِلَّ إِلَّا ظِلُّهُ«. وَذُكِرَ فِى السَّبْعَةِ »رَجُلانِ تَحَابَّا فِى اللَّهِ«.\nالتَّحَابُّ فِى اللَّهِ هُوَ أَنْ يُحِبَّ الْمُسْلِمُ لِأَخِيهِ الْمُسْلِمِ مَا يُحِبُّ لِنَفْسِهِ مِنَ الْخَيْرِ فَلا يَغُشُّهُ لا بِالْفِعْلِ وَلا بِالْقَوْلِ وَإِنْ رَءَاهُ عَلَى خَيْرٍ يَفْرَحُ وَإِنْ رَءَاهُ عَلَى شَرٍّ لا يُزَيِّنُ لَهُ هَذَا الشَّرَّ وَلا يَسْكُتُ عَنْهُ مَا دَامَ يَسْتَطِيعُ أَنْ يُخَلِّصَهُ مِنَ هَذَا الشَّرِّ بَلْ يَنْصَحُهُ حَتَّى يُصْلِحَ مَا فَسَدَ مِنْ حَالِهِ فَإِنْ رَءَاهُ مَثَلًا تَارِكَ صَلاةٍ أَرْشَدَهُ إِلَى فِعْلِهَا وَحَذَّرَهُ مِنْ مَخَاطِرِ تَرْكِهَا وَإِنْ رَأَى فِيهِ خَصْلَةً قَبِيحَةً نَصَحَهُ وَأَعَانَهُ عَلَى التَّخَلُّصِ مِنْهَا وَإِنْ رَءَاهُ جَاهِلًا بِعِلْمِ الدِّينِ دَلَّهُ أَوْ أَرْشَدَهُ إِلَى مَنْ يُعَلِّمُهُ الْعِلْمَ الصَّحِيحَ.\nوَالْمُتَحَابُّونَ فِى اللَّهِ كَمَا أَخْبَرَنَا الرَّسُولُ عَلَيْهِ الصَّلاةُ وَالسَّلامُ يَكُونُونَ قَبْلَ دُخُولِهِمُ الْجَنَّةَ عَلَى مَنَابِرَ مِنْ نُورٍ تَحْتَ ظِلِّ الْعَرْشِ فَيُعْجَبُ بِهِمُ النَّاسُ حَتَّى الأَنْبِيَاءُ وَالشُّهَدَاءُ مَعَ أَنَّ الأَنْبِيَاءَ أَعْلَى مِنْهُمْ دَرَجَةً لَكِنْ عِندَمَا يَرَوْنَ هَذَا لِمَنْ هُوَ دُونَهُمْ يَعْجَبُونَ وَيَفْرَحُونَ لَهُمْ بِذَلِكَ بَيْنَمَا الْكُفَّارُ يَتَأَذَّوْنَ مِنْ حَرِّ الشَّمْسِ.\nهَؤُلاءِ هُمُ الْمُتَحَابُّونَ فِى اللَّهِ يَجْتَمِعُونَ عَلَى الْبِرِّ وَالتَّقْوَى وَلا يَجْتَمِعُونَ عَلَى الإِثْمِ وَالشَّرِّ تَجْمَعُهُمْ طَاعَةُ اللَّهِ بَعِيدًا عَنِ الأَغْرَاضِ الدُّنْيَوِيَّةِ لا يَغُشُّ بَعْضُهُمْ بَعْضًا وَلا يَخُونُ بَعْضُهُمْ بَعْضًا وَلا يَدُلُّ بَعْضُهُمْ بَعْضًا إِلَى شَرٍّ أَوْ ضَلالٍ أَوْ ظُلْمٍ بَلْ يَتَحَابُّونَ ابْتِغَاءَ مَرْضَاةِ اللَّهِ تَعَالَى فَاحْرِصْ عَلَى أَنْ تَكُونَ وَاحِدًا مِنْهُمْ.\n\n     أَسْئَلِةٌ\n     (1) اذْكُرْ حَدِيثًا قُدْسِيًّا فِى فَضْلِ الْمُتَحَابِّينَ فِى اللَّهِ.\n     (2) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى فَضْلِ الْمُتَحَابِّينَ فِى اللَّهِ.\n     (3) مَا هُوَ التَّحَابُّ فِى اللَّهِ.\n     (4) أَيْنَ يَكُونُ الْمُتَحَابُّونَ قَبْلَ دُخُولِهِمُ الْجَنَّةَ.\n     (5) عَلامَ يَجْتَمِعُ الْمُتَحَابُّونَ فِى اللَّهِ.أأأأ"},{"id":"part5-section1","partIndex":5,"partName":"الجزء الخامس","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الْخَامِسُ"],"title":"فَصْلُ الْعَقَائِدِ","blocks":[{"type":"p","text":"فَصْلُ الْعَقَائِدِ"},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"الْعَقِيـدَةُ الْحَقَّـةُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُّسْلِمُونَ﴾ [سُورَةَ ءَالِ عِمْرَان/102]."},{"type":"p","text":"الدِّينُ الإِسْلامِىُّ: الدِّينُ الإِسْلامِىُّ هُوَ الدِّينُ الْحَقُّ الَّذِى تُؤَيِّدُهُ الْعُقُولُ السَّلِيمَةُ الْمُنَاسِبُ لِكُلِّ زَمَانٍ وَهُوَ دِينُ جَمِيعِ الأَنْبِيَاءِ مِنْ أَوَّلِهِمْ ءَادَمَ إِلَى ءَاخِرِهِمْ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِمْ أَجْمَعِينَ وَسَلَّمَ الَّذِينَ أَرْسَلَهُمُ اللَّهُ لِهِدَايَةِ النَّاسِ إِلَى الْخَيْرِ وَالصَّلاحِ وَإِرْشَادِهِمْ إِلَى تَقْوَى اللَّهِ تَعَالَى وَالتَّمَسُّكِ بِهَذَا الدِّينِ إِلَى ءَاخِرِ الْعُمُرِ."},{"type":"p","text":"التَّقْوَى: تَقْوَى اللَّهِ تَكُونُ بِأَدَاءِ مَا افْتَرَضَ اللَّهُ تَعَالَى وَاجْتِنَابِ مَا حَرَّمَ فَمَنْ فَعَلَ ذَلِكَ يَكُونُ تَقِيًّا وَأَوَّلُ هَذِهِ الْوَاجِبَاتِ مَعْرِفَةُ اللَّهِ تَعَالَى وَمَعْرِفَةُ رَسُولِهِ مُحَمَّدٍ ﷺ مَعَ التَّصْدِيقِ بِذَلِكَ. "},{"type":"p","text":"النُّطْقُ بِالشَّهَادَتَيْنِ: لا يَكُونُ الإِيـمَانُ مَقْبُولًا بِدُونِ النُّطْقِ بِالشَّهَادَتَيْنِ بِالنِّسْبَةِ لِلْكَافِرِ إِذَا أَرَادَ الدُّخُولَ فِى الإِسْلامِ أَمَّا الْمُسْلِمُ فَيَجِبُ أَنْ يَنْطِقَ بِالشَّهَادَتَيْنِ فِى كُلِّ صَلاةٍ لِصِحَّةِ الصَّلاةِ. وَالشَّهَادَتَانِ هُمَا أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ ﷺ."},{"type":"p","text":"مَعْنَى الشَّهَادَتَيْنِ: وَمَعْنَى شَهَادَةِ أَنْ لا إِلَهَ إِلَّا اللَّهُ أَعْتَرِفُ بِلِسَانِى وَأَعْتَقِدُ بِقَلْبِى أَنْ لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ تَعَالَى."},{"type":"p","text":"وَمَعْنَى شَهَادَةِ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ أَعْتَرِفُ بِلِسَانِى وَأُذْعِنُ بِقَلْبِى أَنَّ سَيِّدَنَا مُحَمَّدَ بنَ عَبْدِ اللَّهِ ﷺ مُرْسَلٌ مِنْ عِنْدِ اللَّهِ إِلَى كَافَّةِ الْعَالَمِينَ مِنْ إِنْسٍ وَجِنٍّ صَادِقٌ فِى كُلِّ مَا يُبَلِّغُهُ عَنِ اللَّهِ تَعَالَى لِيُؤْمِنُوا بِشَرِيعَتِهِ."},{"type":"p","text":"الْمُرَادُ بِالشَّهَادَتَيْنِ: وَالْمُرَادُ بِالشَّهَادَتَيْنِ نَفْىُ الأُلُوهِيَّةِ عَمَّا سِوَى اللَّهِ وَإِثْبَاتُهَا لِلَّهِ تَعَالَى مَعَ الإِقْرَارِ بِرِسَالَةِ سَيِّدِنَا مُحَمَّدٍ ﷺ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَمَنْ لَّمْ يُؤْمِنْ بِاللَّهِ وَرَسُولِهِ فَإِنَّا أَعْتَدْنَا لِلْكَافِرِينَ سَعِيرًا﴾ [سُورَةَ الْفَتْح/13]."},{"type":"p","text":" "},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا الأَمْرُ بِالثَّبَاتِ عَلَى الإِسْلامِ."},{"type":"p","text":"     (2) مَا هُوَ دِينُ كُلِّ الأَنْبِيَاءِ."},{"type":"p","text":"     (3) لِمَ أَرْسَلَ اللَّهُ الأَنْبِيَاءَ."},{"type":"p","text":"     (4) مَا مَعْنَى التَّقْوَى وَمَا هُوَ أَوَّلُ الْوَاجِبَاتِ."},{"type":"p","text":"     (5) مَا مَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":"     (6) مَا مَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":"     (7) مَا الْمُرَادُ بِالشَّهَادَتَيْنِ."},{"type":"p","text":"     (8) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى وُجُوبِ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"مَنْ هُوَ الْمُكَلَّفُ"},{"type":"p","text":""},{"type":"p","text":"الْمُكَلَّفُ شَرْعًا هُوَ الْبَالِغُ الْعَاقِلُ الَّذِى بَلَغَتْهُ دَعْوَةُ الإِسْلامِ وَالْبُلُوغُ يَكُونُ بِبُلُوغِ خَمْسَ عَشْرَةَ سَنَةً قَمَرِيَّةً أَوْ رُؤْيَةِ الْمَنِىِّ أَوْ رُؤْيَةِ دَمِ الْحَيْضِ وَأَمَّا الْعَاقِلُ فَهُوَ الَّذِى لَمْ يَذْهَبْ عَقْلُهُ."},{"type":"p","text":"وَيُشْتَرَطُ بُلُوغُهُ دَعْوَةَ الإِسْلامِ يَعْنِى أَنَّهُ إِنْ كَانَ الْبُلُوغُ وَالْعَقْلُ فِى شَخْصٍ يَصِيرُ مُكَلَّفًا بِمُجَرَّدِ أَنْ يَبْلُغَهُ أَصْلُ الدَّعْوَةِ الإِسْلامِيَّةِ أَىْ أَنْ يَبْلُغَهُ أَنَّهُ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ فَمَنْ كَانَ بَلَغَهُ الإِسْلامُ فَهَذَا هُوَ الْمُكَلَّفُ الَّذِى هُوَ مُلْزَمٌ بِأَنْ يُسْلِمَ وَيَعْمَلَ بِشَرِيعَةِ الإِسْلامِ وَأَنْ يُؤَدِّىَ الْوَاجِبَاتِ كُلَّهَا وَيَجْتِنَبَ الْمُحَرَّمَاتِ كُلَّهَا."},{"type":"p","text":"وَيُفْهَمُ مِنْ ذَلِكَ أَنَّ الطِّفْلَ الصَّغِيرَ لَيْسَ عَلَيْهِ مَسْؤُولِيَّةٌ فِى الآخِرَةِ حَتَّى يَبْلُغَ وَكَذَلِكَ الْمَجْنُونَ فِى حَالِ جُنُونِهِ وَكَذَلِكَ الَّذِى عَاشَ بَالِغًا وَلَمْ تَبْلُغْهُ دَعْوَةُ الإِسْلامِ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّى نَبْعَثَ رَسُولًا﴾ [سُورَةَ الإِسْرَاء/15]."},{"type":"p","text":"وَقَالَ رَسُولُ اللَّهِ ﷺ «رُفِعَ الْقَلَمُ عَنْ ثَلاثَةٍ عَنِ النَّائِمِ حَتَّى يَسْتَيْقِظَ وَعَنِ الصَّبِىِّ حَتَّى يَحْتَلِمَ وَعَنِ الْمَجْنُونِ حَتَّى يَعْقِلَ» رَوَاهُ أَبُو دَاوُدَ."},{"type":"p","text":"فَائِدَةٌ. كَانَ رَسُولُ اللَّهِ ﷺ يَدْعُو الْعَرَبَ الْمُشْرِكِينَ فِى مَوْسِمِ الْحَجِّ حِينَ يَجْتَمِعُونَ مِنْ نَوَاحٍ شَتَّى إِلَى الإِسْلامِ وَيُسْمِعُهُمُ الشَّهَادَتَيْنِ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ ﷺ. وَكَانَ مُشْرِكُو الْعَرَبِ يَحُجُّونَ إِلَى الْكَعْبَةِ تَقْلِيدًا لِأَجْدَادِهِمُ الْمُسْلِمِينَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَنْ هُوَ الْمُكَلَّفُ شَرْعًا وَبِمَ هُوَ مُلْزَمٌ."},{"type":"p","text":"     (2) بِمَ يَكُونُ الْبُلُوغُ وَمَنْ هُوَ الْعَاقِلُ."},{"type":"p","text":"     (3) مَنْ عَاشَ بَالِغًا وَلَمْ تَبْلُغْهُ دَعْوَةُ الإِسْلامِ هَلْ يَكُونُ مُكَلَّفًا وَمَا الدَّلِيلُ عَلَى ذَلِكَ."},{"type":"p","text":"     (4) مَا الدَّلِيلُ عَلَى أَنَّ الطِّفْلَ الصَّغِيرَ لَيْسَ مُكَلَّفًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"اللَّهُ تَعَالَى خَالِقُ الْعَالَمِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿أَفِى اللَّهِ شَكٌّ﴾ [سُورَةَ إِبْرَاهِيم/10]."},{"type":"p","text":"إِنَّ أَوَّلَ وَاجِبٍ عَلَى الْمُكَلَّفِ هُوَ مَعْرِفَةُ اللَّهِ تَعَالَى فَهُوَ الْخَالِقُ لِجَمِيعِ الْمَوْجُودَاتِ الْمُدَبِّرُ لِهَذِهِ الْكَائِنَاتِ لِأَنَّنَا إِذَا تَأَمَّلْنَا جَمِيعَ الصَّنَائِعِ وَتَفَكَّرْنَا فِيهَا تَفَكُّرًا سَلِيمًا عَلِمْنَا أَنَّ لَهَا صَانِعًا خَلَقَهَا."},{"type":"p","text":"الدَّلِيلُ الْعَقْلِيُّ عَلَى وُجُودِ اللَّهِ تَعَالَى"},{"type":"p","text":"نُدْرِكُ بِالْعَقْلِ السَّلِيمِ أَنَّ الْكِتَابَةَ لا بُدَّ لَهَا مِنْ كَاتِبٍ وَالضَّرْبَ لا بُدَّ لَهُ مِنْ ضَارِبٍ وَالْبِنَاءَ لا بُدَّ لَهُ مِنْ بَانٍ فَإِذًا هَذَا الْعَالَمُ بِمَا فِيهِ مِنْ مَخْلُوقَاتٍ لا بُدَّ لَهُ مِنْ خَالِقٍ حَىٍّ مُرِيدٍ عَالِمٍ قَدِيرٍ وَهُوَ اللَّهُ سُبْحَانَهُ وَتَعَالَى الَّذِى لا يُشْبِهُ شَيْئًا مِنْ مَخْلُوقَاتِهِ وَلا يُشَابِهُهُ شَىْءٌ لِأَنَّهُ لا يَصِحُّ فِى الْعَقْلِ وُجُودُ فِعْلٍ مَا بِدُونِ فَاعِلٍ."},{"type":"p","text":"وَلا يَصِحُّ أَنْ يَكُونَ ذَلِكَ الْفَاعِلُ طَبِيعَةً لِأَنَّ الطَّبِيعَةَ لا إِرَادَةَ لَهَا فَكَيْفَ تَخْلُقُ."},{"type":"p","text":"وَلا يَصِحُّ أَيْضًا أَنْ يَكُونَ الشَّىْءُ خَالِقًا لِنَفْسِهِ."},{"type":"p","text":"وَكَذَلِكَ لا يَصِحُّ أَنْ يَخْلُقَ الشَّىْءُ مِثْلَهُ أَىْ مُشَابِهَهُ."},{"type":"p","text":"فَالطِّفْلُ مَثَلًا يُولَدُ صَغِيرًا لا يَتَكَلَّمُ وَلا يَمْشِى ثُمَّ يَتَطَوَّرُ فَيَبْدَأُ بِالْكَلامِ وَالْمَشْىِ شَيْئًا فَشَيْئًا ثُمَّ يَنْمُو فَيَصِيرُ شَابًّا ثُمَّ كَهْلًا ثُمَّ هَرِمًا ثُمَّ يَمُوتُ فَمَنِ الَّذِى طَوَّرَهُ وَغَيَّرَهُ مِنْ حَالٍ إِلَى حَالٍ. اللَّهُ عَزَّ وَجَلَّ هُوَ الَّذِى خَلَقَهُ وَطَوَّرَهُ وَغَيَّرَهُ ثُمَّ أَمَاتَهُ. ثُمَّ الإِنْسَانُ لَوْ فَكَّرَ بِعَقْلِهِ لَعَلِمَ أَنَّ كُلَّ مُتَغَيِّرٍ لا بُدَّ لَهُ مِنْ مُغَيِّرٍ وَالْعَالَمُ مُتَغَيِّرٌ فَإِذًا الْعَالَمُ لا بُدَّ لَهُ مِنْ مُغَيِّرٍ."},{"type":"p","text":""},{"type":"p","text":"قِصَّةُ رَجُلٍ يُنْكِرُ وُجُودَ اللَّهِ"},{"type":"p","text":"يُرْوَى أَنَّ رَجُلًا مِنْ مُنْكِرِى وُجُودِ اللَّهِ أَتَى إِلَى أَحَدِ الْخُلَفَاءِ وَقَالَ لَهُ إِنَّ عُلَمَاءَ عَصْرِكَ يَقُولُونَ إِنَّ لِهَذَا الْكَوْنِ صَانِعًا وَأَنَا مُسْتَعِدٌّ أَنْ أُثْبِتَ لَهُمْ أَنَّ هَذَا الْكَوْنَ لا صَانِعَ لَهُ."},{"type":"p","text":"فَبَعَثَ الْخَلِيفَةُ إِلَى عَالِمٍ كَبِيرٍ يُعْلِمُهُ بِالْخَبَرِ وَيَأْمُرُهُ بِالْحُضُورِ فَتَعَمَّدَ الْعَالِمُ أَنْ يَتَأَخَّرَ قَلِيلًا عَنِ الْوَقْتِ ثُمَّ حَضَرَ فَاسْتَقْبَلَهُ الْخَلِيفَةُ وَأَجْلَسَهُ فِى صَدْرِ الْمَجْلِسِ وَكَانَ قَدِ اجْتَمَعَ الْعُلَمَاءُ وَكِبَارُ النَّاسِ فَقَالَ الرَّجُلُ لِمَ تَأَخَّرْتَ فِى مَجِيئِكَ فَقَالَ الْعَالِمُ أَرَأَيْتَ لَوْ قُلْتُ لَكَ إِنَّهُ قَدْ حَصَلَ لِى أَمْرٌ عَجِيبٌ فَتَأَخَّرْتُ وَذَلِكَ أَنَّ بَيْتِىَ وَرَاءَ نَهْرِ دِجْلَةَ فَجِئْتُ لِأَعْبُرَ النَّهْرَ فَلَمْ أَجِدْ سِوَى سَفِينَةٍ عَتِيقَةٍ قَدْ تَكَسَّرَتْ أَلْوَاحُهَا الْخَشَبِيَّةُ وَلَمَّا وَقَعَ نَظَرِى عَلَيْهَا تَحَرَّكَتِ الأَلْوَاحُ وَاجْتَمَعَتْ وَاتَّصَلَ بَعْضُهَا بِبَعْضٍ وَصَارَتْ سَفِينَةً صَالِحَةً لِلسَّيْرِ بِلا مُبَاشَرَةِ نَجَّارٍ وَلا عَمَلِ عَامِلٍ فَقَعَدْتُ عَلَيْهَا وَعَبَرْتُ النَّهْرَ وَجِئْتُ إِلَى هَذَا الْمَكَانِ."},{"type":"p","text":"فَقَالَ الرَّجُلُ اسْمَعُوا أَيُّهَا النَّاسُ مَا يَقُولُ عَالِمُكُمْ فَهَلْ سَمِعْتُمْ كَلامًا أَكْذَبَ مِنْ هَذَا كَيْفَ تُوجَدُ السَّفِينَةُ بِدُونِ أَنْ يَصْنَعَهَا نَجَّارٌ هَذَا كَذِبٌ مَحْضٌ."},{"type":"p","text":"فَقَالَ الْعَالِمُ أَيُّهَا الْكَافِرُ إِذَا لَمْ يُعْقَلْ أَنْ تُوجَدَ سَفِينَةٌ بِلا صَانِعٍ وَلا نَجَّارٍ فَكَيْفَ تَقُولُ بِوُجُودِ الْعَالَمِ بِدُونِ صَانِعٍ. "},{"type":"p","text":"سَكَتَ الرَّجُلُ وَلَزِمَتْهُ الْحُجَّةُ وَعَاقَبَهُ الْخَلِيفَةُ لِسُوءِ اعْتِقَادِهِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى وُجُودِ اللَّهِ تَعَالَى."},{"type":"p","text":"     (2) مَا الدَّلِيلُ الْعَقْلِىُّ عَلَى وُجُودِ اللَّهِ."},{"type":"p","text":"     (3) لِمَ لا يَصِحُّ أَنْ يَكُونَ الْفَاعِلُ طَبِيعَةً."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"تَوْحِيدُ اللَّهِ تَعَالَى"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11] أَىْ أَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لا يُشْبِهُ الْمَخْلُوقَاتِ."},{"type":"p","text":"وَرَدَ أَنَّ الْيَهُودَ أَتَوْا إِلَى النَّبِىِّ ﷺ فَقَالُوا يَا مُحَمَّدُ صِفْ لَنَا رَبَّكَ الَّذِى تَعْبُدُهُ فَنَزَلَتْ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ﴾ فَقَالَ رَسُولُ اللَّهِ ﷺ «هَذِهِ صِفَةُ رَبِى عَزَّ وَجَلَّ»."},{"type":"p","text":"وَقَدْ كَانَ سُؤَالُ الْيَهُودِ هَذَا تَعَنُّتًا وَاسْتِهْزَاءً وَلَيْسَ طَلَبًا لِلْعِلْمِ."},{"type":"p","text":"وَهَذَا يَدُلُّ عَلَى أَنَّ اللَّهَ تَعَالَى مَوْصُوفٌ بِصِفَاتٍ وَكَمَا أَنَّهُ عَزَّ وَجَلَّ لا يُشْبِهُ الْمَخْلُوقَاتِ فَكَذَلِكَ صِفَاتُهُ لا تُشْبِهُ صِفَاتِ الْمَخْلُوقَاتِ فَهُوَ تَعَالَى مَوْصُوفٌ بِكُلِّ كَمَالٍ يَلِيقُ بِهِ مُنَزَّهٌ عَنْ كُلِّ نَقْصٍ فِى حَقِّهِ."},{"type":"p","text":"قَالَ تَعَالَى ﴿وَلِلَّهِ الْمَثَلُ الأَعْلَى﴾ أَىِ الْوَصْفُ الَّذِى لا يُشْبِهُ وَصْفَ غَيْرِهِ فَكُلُّ مَا سِوَى اللَّهِ مَخْلُوقٌ وَهُوَ جُمْلَةُ الْعَالَمِ."},{"type":"p","text":"أَمَّا اللَّهُ تَعَالَى فَهُوَ وَحْدَهُ الأَزَلِىُّ الَّذِى لا ابْتِدَاءَ لَهُ وَكَذَلِكَ صِفَاتُهُ أَزَلِيَّةٌ لا ابْتِدَاءَ لَهَا وَصِفَاتُ غَيْرِهِ مَخْلُوقَةٌ تَتَحَوَّلُ مِنْ حَالٍ إِلَى حَالٍ أَمَّا اللَّهُ تَعَالَى فَلا يَطْرَأُ عَلَيْهِ تَحَوُّلٌ وَلا تَغَّيُّرٌ فَهُوَ تَعَالَى يُغَيِّرُ وَلا يَتَغَيَّرُ وَيُطَوِّرُ وَلا يَتَطَوَّرُ."},{"type":"p","text":"وَيُسَاعِدُ النَّظَرُ إِلَى الْعِبَارَاتِ التَّالِيَةِ فِى فَهْمِ هَذَا الْمَوْضُوعِ الَّذِى هُوَ مِنْ مَوَاضِيعِ التَّوْحِيدِ"},{"type":"p","text":"اللَّهُ أَزَلِىٌّ لا بِدَايَةَ لَهُ.                           "},{"type":"p","text":"الْمَخْلُوقَاتُ كُلُّهَا لَهَا بِدَايَةٌ اللَّهُ خَلَقَهَا.       "},{"type":"p","text":"اللَّهُ أَبَدِىٌّ لا نِ

صِّيَامِ وَالْحَجِّ وَالزَّكَاةِ لا تَصِحُّ إِلَّا مَعَ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ.\nالكَافِرُ لا تُقْبَلُ مِنْهُ الأَعْمَالُ الصَّالِحَةُ.\nأَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\nصَلَّى اللَّهُ عَلَى مُحَمَّدٍ ﷺ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ أَفْضَلُ الأَعْمَالِ اذْكُرِ الْحَدِيْثَ.\n     (2) عَدِّدْ بَعْضَ الأَعْمَالِ الصَّالِحَةِ.\n     (3) مَنِ الَّذِى لا تُقْبَلُ مِنْهُ الأَعْمَالُ الصَّالِحَةُ.\n\nالدَّرْسُ الثَّانِى\nاللَّهُ رَبِّى\n\nاللَّهُ خَالِقُ كُلِّ شَىْءٍ\nاللَّهُ قَادِرٌ عَلَى كُلِّ شَىْءٍ\nاللَّهُ عَالِمٌ بِكُلِّ شَىْءٍ\nاللَّهُ مَالِكُ كُلِّ شَىْءٍ\nاللَّهُ لَيْسَ لَهُ شَبِيهٌ\nاللَّهُ لَيْسَ لَهُ شَرِيكٌ\nاللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ\nاللَّهُ لَيْسَ كَمِثْلِهِ شَىْءٌ\n\nذِكْــــرٌ\nسُبْحَانَ اللَّهِ وَبِحَمْدِهِ\nسُبْحَانَ اللَّهِ الْعَظِيمِ\nالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ\n\nالدَّرْسُ الثَّالِثُ\nاللَّهُ لا يُشْبِهُ شَيْئًا\n\nقَالَ اللَّهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ وَهُوَ السَّمِيْعُ الْبَصِيْرُ﴾ [سُورَةَ الشُّورَى/11].\nاللَّهُ خَلَقَ النُّورَ أَىِ الضَّوْءَ فَلا يُشْبِهُ النُّورَ. \nاللَّهُ خَلَقَ الْهَوَاءَ فَلا يُشْبِهُ الْهَوَاءَ.\nاللَّهُ خَلَقَ الشَّمْسَ فَلا يُشْبِهُ الشَّمْسَ.\nاللَّهُ خَلَقَ الْقَمَرَ فَلا يُشْبِهُ الْقَمَرَ.\nاللَّهُ خَلَقَ الإِنْسَانَ فَلا يُشْبِهُ الإِنْسَانَ.\nاللَّهُ خَلَقَ الْمَلائِكَةَ فَلا يُشْبِهُ الْمَلائِكَةَ.\nاللَّهُ خَلَقَ كُلَّ شَىْءٍ فَلا يُشْبِهُ شَيْئًا.\n\nدُعَاءٌ\nاللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى أَنَّ اللَّه لا يُشْبِهُ شَيْئًا.\n     (2) عَدِّدْ بَعْضَ الأَشْيَاءِ الَّتِى خَلَقَهَا اللَّهُ.\n\nالدَّرْسُ الرَّابِعُ\nاللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ\n\nاللَّهُ خَلَقَ الْبَشَرَ اللَّهُ لا يَحْتَاجُ إِلَى الْبَشَرِ.\nاللَّهُ خَلَقَ الْهَوَاءَ اللَّهُ لا يَحْتَاجُ إِلَى الْهَوَاءِ.\nاللَّهُ خَلَقَ الأَرْضَ اللَّهُ لا يَحْتَاجُ إِلَى الأَرْضِ.\nاللَّهُ خَلَقَ السَّمَاءَ اللَّهُ لا يَحْتَاجُ إِلَى السَّمَاءِ.\nاللَّهُ خَلَقَ الْعَرْشَ اللَّهُ لا يَحْتَاجُ إِلَى الْعَرْشِ.\nاللَّهُ خَلَقَ الْمَلائِكَةَ اللَّهُ لا يَحْتَاجُ إِلَى الْمَلائِكَةِ.\nاللَّهُ خَالِقُ كُلِّ شَىْءٍ اللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ.\n\nدُعَاءٌ\nالْحَمْدُ لِلَّهِ الَّذِى كَفَانِى وَءَاوَانِى.\nالْحَمْدُ لِلَّهِ الَّذِى أَطْعَمَنِى وَسَقَانِى.\n\nالدَّرْسُ الْخَامِسُ\nشَرْحُ صِفَاتِ اللَّهِ تَعَالَى\n\nقَالَ اللَّهُ تَعَالَى ﴿وَلِلَّهِ الْمَثَلُ الأَعْلَى﴾ [سُورَةَ النَّحْل/60].\nأَىْ لِلَّهِ تَعَالَى صِفَاتٌ لَيْسَتْ كَصِفَاتِ غَيْرِهِ.\nوَمِنْ هَذِهِ الصِّفَاتِ ثَلاثَ عَشْرَةَ صِفَةً تَجِبُ مَعْرِفَتُهَا عَلَى كُلِّ مُكَلَّفٍ وَهِىَ\n(1) الْوُجُودُ: اللَّهُ مَوْجُودٌ لا بِدَايَةَ وَلا نِهَايَةَ لِوُجُودِهِ.\n(2) الْوَحْدَانِيَّةُ: اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ وَلا مَعْبُودَ بِحَقٍّ سِوَاهُ.\n(3) الْقِيَامُ بِالنَّفْسِ: اللَّهُ لا يَحْتَاجُ إِلَى غَيْرِهِ.\n(4) الْمُخَالَفَةُ لِلْحَوَادِثِ: اللَّهُ لا يُشْبِهُ الْمَخْلُوقَاتِ.\n(5) الْقِدَمُ: اللَّهُ لا بِدَايَةَ لِوُجُودِهِ.\n(6) الْبَقَاءُ، اللَّهُ لا نِهَايَةَ لِوُجُودِهِ لا يَفْنَى وَلا يَمُوتُ.\n(7) الْقُدْرَةُ، اللَّهُ قَادِرٌ عَلَى كُلِّ شَىْءٍ.\n(8) الإِرَادَةُ أَىِ الْمَشِيئَةُ فَكُلُّ شَىْءٍ يَحْصُلُ بِإِرَادَةِ اللَّهِ أَىْ بِمَشِيئَتِهِ.\n(9) السَّمْعُ، اللَّهُ يَسْمَعُ بِدُونِ أُذُنٍ وَلا ءَالَةٍ أُخْرَى.\n(10) الْبَصَرُ، اللَّهُ يَرَى بِدُونِ حَدَقَةٍ وَلا ءَالَةٍ أُخْرَى.\n(11) الْكَلامُ، اللَّهُ يَتَكَلَّمُ بِدُونِ لِسَانٍ وَلا شَفَتَيْنِ وَكَلامُهُ لَيْسَ لُغَةً عَرَبِيَّةً وَلا غَيْرَهَا وَلا يُشْبِهُ كَلامَنَا.\n(12) الْحَيَاةُ، اللَّهُ حَىٌّ وَحَيَاتُهُ بِدُونِ رُوحٍ وَلَحْمٍ وَقَلْبٍ وَهُوَ حَىٌّ لا يَمُوتُ.\n(13) الْعِلْمُ، اللَّهُ يَعْلَمُ كُلَّ الأَشْيَاءِ قَبْلَ حُصُولِهَا مِنْ دُونِ مُعَلِّمٍ.\n\nدُعَاءٌ\nاللَّهُمَّ يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِى عَلَى دِينِ الإِسْلامِ.\n\nالدَّرْسُ السَّادِسُ\nدَعْوَةُ الرَّسُولِ ﷺ\n\nدَعَا سَيِّدُنَا مُحَمَّدٌ ﷺ النَّاسَ إِلَى عِبَادَةِ اللَّهِ وَتَرْكِ عِبَادَةِ الأَوْثَانِ. قَالَ لَهُمْ\nقُولُوا لا إِلَهَ إِلَّا اللَّهُ مُحَمَّدٌ رَسُولُ اللَّهِ وَعَلَّمَهُمْ \nأَنَّ الإِيـمَانَ أَفْضَلُ الأَعْمَالِ.\nوَأَنَّ مَنْ مَاتَ عَلَى الإِيـمَانِ لا بُدَّ أَنْ يَدْخُلَ الْجَنَّةَ.\nوَأَنَّ الإِسْلامَ دِينُ جَمِيعِ الأَنْبِيَاءِ.\nوَأَنَّ أَكْبَرَ ذَنْبٍ هُوَ الْكُفْرُ. \nوَأَنَّ مَنْ مَاتَ عَلَى الْكُفْرِ دَخَلَ النَّارَ خَالِدًا فِيهَا.\n\n\n     أَسْئِلَةٌ\n     (1) إِلَى مَا دَعَا النَّبِىُّ ﷺ.\n     (2) مَاذَا قَالَ لَهُمْ.\n     (3) مَا هُوَ أَفْضَلُ الأَعْمَالِ وَمَا هُوَ أَكْبَرُ ذَنْبٍ.\n     (4) مَنْ هُوَ الَّذِى يَدْخُلُ الْجَنَّةَ وَمَنْ يُخَلَّدُ فِى النَّارِ.\n\nالدَّرْسُ السَّابِعُ\nأَكْبَرُ الذُّنُوبِ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ لا يَغْفِرُ أَنْ يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَلِكَ لِمَنْ يَشَاءُ﴾ [سُورَةَ النِّسَاءِ/48].\nالْكُفْرُ هُوَ نَقِيضُ الإِيـمَانِ وَهُوَ الذَّنْبُ الَّذِى لا يَغْفِرُهُ اللَّهُ لِمَنْ مَاتَ عَلَيْهِ.\nوَالْكُفْرُ ثَلاثَةُ أَنْوَاعٍ الْكُفْرُ الِاعْتِقَادِىُّ وَالْكُفْرُ الْفِعْلِىُّ وَالْكُفْرُ اللَّفْظِىُّ وَيُسَمَّى أَيْضًا الْكُفْرَ الْقَوْلِىَّ.\nالْكُفْرُ الِاعْتِقَادِىُّ كَالَّذِى يَعْتَقِدُ أَنَّ اللَّهَ سَاكِنٌ فِى السَّمَاءِ أَوْ جَالِسٌ عَلَى الْعَرْشِ أَوْ أَنَّهُ رُوحٌ أَوْ ضَوْءٌ أَوْ أَنَّ لَهُ شَكْلًا وَصُورَةً.\nالْكُفْرُ الْفِعْلِىُّ كَالَّذِى يَرْمِى الْمُصْحَفَ فِى القَاذُورَاتِ أَوْ يَدُوسُ عَلَيْهِ.\nالْكُفْرُ اللَّفْظِىُّ كَالَّذِى يَسُبُّ اللَّهَ أَوْ مَلَكًا مِنَ الْمَلائِكَةِ كَعَزْرَائِيلَ أَوْ نَبِيًّا مِنَ الأَنْبِيَاءِ كَمُحَمَّدٍ أَوْ عِيسَى أَوْ دِينَ الإِسْلامِ.\n \n     أَسْئِلَةٌ\n     (1) مَا هُوَ الذَّنْبُ الَّذِى لا يَغْفِرُهُ اللَّهُ لِمَنْ مَاتَ عَلَيْهِ.\n     (2) كَمْ نَوْعًا الْكُفْرُ عَدِّدْهَا.\n     (3) أَعْطِ مِثَالًا عَنْ كُلِّ نَوْعٍ مِنْهَا.\n\nالدَّرْسُ الثَّامِنُ\nالإِسْلامُ دِينُ الأَنْبِيَاءِ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلامُ﴾ [سُورَةَ ءَالِ عِمْرَان/19].\nالإِسْلامُ هُوَ الدِّينُ الَّذِى رَضِيَهُ اللَّهُ لِعِبَادِهِ وَأَمَرَنَا بِاتِّبَاعِهِ.\nالإِسْلامُ هُوَ دِينُ جَمِيْعِ الأَنْبِيَاءِ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ.\nالأَنْبِيَاءُ كُلُّهُمْ مُسْلِمُونَ مُؤْمِنُونَ بِاللَّهِ أَوَّلُهُمْ سَيِّدُنَا ءَادَمُ وَءَاخِرُهُمْ سَيِّدُنَا مُحَمَّدٌ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ.\nكُلُّ الأَنبْيِاَءِ كَانُوا يَعْبُدُونَ اللَّهَ وَحْدَهُ وَلا يُشْرِكُونَ بِهِ شَيْئًا.\nالأَنْبِيَاءُ عَلَّمُوا النَّاسَ أَنْ يَقُولُوا لا إِلَهَ إِلَّا اللَّهُ. \nسَجَدَ وَجْهِى لِلَّذِى خَلَقَهُ وَصَوَّرَةُ وَشَقَّ سَمْعَهُ وَبَصَرَهُ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ الدِّينُ الَّذِى رَضِيَهُ اللَّهُ لِعِبَادِهِ.\n     (2) اذْكُرِ الآيَةَ القُرْءَانِيَّةَ الَّتِى تَدُلُّ عَلَى ذَلِكَ.\n     (3) مَنْ هُوَ أَوَّلُ الأَنْبِيَاءِ مَنْ هُوَ ءَاخِرُهُمْ.\n     (4) مَاذَا عَلَّمَ كُلُّ الأَنْبِيَاءِ النَّاسَ أَنْ يَقُولُوا.\n\nالدَّرْسُ التَّاسِعُ\nصِفَاتُ الأَنْبِيَاءِ عَلَيْهِمُ السَّلامُ\n\nقاَلَ اللَّهُ تَعَالَى عَنِ الأَنبْيِاءِ ﴿وَكُلًّا فَضَّلْنَا عَلَى الْعَالَمِينَ﴾ [سُورَةَ الأَنْعَامِ/86].\nالأَنْبِيَاءُ هُمْ أَفْضَلُ مَخْلُوقَاتِ اللَّهِ أَفْضَلُ مِنَ الْمَلائِكَةِ وَمِنْ سَائِرِ الْبَشَرِ وَالْجِنِّ اصْطَفَاهُمُ اللَّهُ مِنْ بَيْنِ الْبَشَرِ الذُّكُورِ لِيُبَلِّغُوا النَّاسَ أَحْكامَ الشَّرَائِعِ وَيُعَلِّمُوهُمْ دِينَ الإِسْلامِ الَّذِى رَضِيَهُ اللَّهُ لِعِبَادِهِ وَحَرَّمَ عَلَيْهِمْ كُلَّ دِينٍ سِوَاهُ.\nوَأَفْضَلُ هَؤُلاءِ الأَنْبِيَاءِ خَمْسَةٌ وَيُسَمَّوْنَ بِأُولِى الْعَزْمِ وَهُمْ مُحَمَّدٌ وَإِبْرَاهِيمُ وَمُوسَى وَعِيسَى وَنُوحٌ صَلَّى اللَّهُ عَلَيْهِمْ وَسَلَّمَ أَجْمَعِينَ.\nوَكُلُّ نَبِىٍّ مَوْصُوفٌ بِالصِّدقِ وَالأَمَانَةِ وَالذَّكَاءِ وَالشَّجَاعَةِ وَالْعِفَّةِ وَالتَّبْلِيغِ أَىْ تَبْلِيغِ مَا أَمَرَهُمُ اللَّهُ بِتَبْلِيغِهِ مِنْ غَيْرِ تَقْصِيرٍ أَوْ تَغْيِيرٍ.\n\n     أَسْئِلَةٌ\n     (1) مَنْ هُمْ أَفْضَلُ مَخْلُوقَاتِ اللَّهِ، اذْكُرِ الآيَةَ الَّتِى تَدُلُّ عَلَى ذَلِكَ.\n     (2) مِمَّنِ اصْطَفَى اللَّهُ الأَنْبِيَاءَ.\n     (3) لِمَ بَعَثَ اللَّهُ الأَنْبِيَاءَ.\n     (4) مَنْ هُمْ أُولُوا الْعَزْمِ.\n     (5) اذْكُرْ بَعْضَ مَا يُوصَفُ بِهِ كُلُّ نَبِىٍّ.\n\nالدَّرْسُ الْعَاشِرُ\nالْمَلائِكَةُ الْكِرَامُ\n\nخَلَقَ اللَّهُ الْمَلائِكَةَ مِنْ نُورٍ وَجَعَلَ لَهُمْ أَجْنِحَةً.\nلَيْسُوا ذُكُورًا وَلا إِنَاثًا.\nوَهُمْ عِبَادٌ لِلَّهِ طَائِعُونَ\nلا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ.\nلا يَأْكُلُونَ وَلا يَشْرَبُونَ\nوَلا يَنَامُونَ وَلا يَتْعَبُونَ\nوَعَدَدُهُمْ كَبِيرٌ جِدًّا\nالْمُسْلِمُ يُحِبُّ الْمَلائِكَةَ وَلا يَسْتَخِفُّ بِهِمْ.\n\nذِكْرٌ\nيُقَالُ صَبَاحًا وَمَسَاءً ثَلاثَ مَرَّاتٍ\nبِسْمِ اللَّهِ الَّذِى لا يَضُرُّ مَعَ اسْمِهِ شَىْءٌ فِى الأَرْضِ وَلا فِى السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.\n\n     أَسْئِلَةٌ\n     (1) مِمَّ خَلَقَ اللَّهُ الْمَلائِكَةَ.\n     (2) مَنْ هُمُ الْمَلائِكَةُ.\n\nالدَّرْسُ الْحَادِى عَشَرَ\nالْكُتُبُ السَّمَاوِيَّةُ\n\nالْكُتُبُ السَّمَاوِيَّةُ كُتُبٌ أَنْزَلَهَا اللَّهُ عَلَى بَعْضِ الأَنْبِيَاءِ كُلُّهَا تَأْمُرُ بِدِينِ الإِسْلامِ.\nوَهِىَ كَثِيرَةٌ أَشْهَرُهَا أَرْبَعَةٌ\nالْقُرْءَانُ أُنْزِلَ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ وَعَلَى سَائِرِ إِخْوَانِهِ النَّبِيِّينَ وَهُوَ بِالْعَرَبِيَّةِ.\nالإِنْجِيلُ أُنْزِلَ عَلَى سَيِّدِنا عِيسَى وَهُوَ بِاللُّغَةِ السُّرْيَانِيَّةِ.\nالتَّوْرَاةُ أُنْزِلَ عَلَى سَيِّدِنَا مُوسَى وَهُوَ بِاللُّغَةِ الْعِبْرَانِيَّةِ.\nالزَّبُورُ أُنْزِلَ عَلَى سَيِّدِنا دَاوُدَ وَهُوَ بِاللُّغَةِ الْعِبْرَانِيَّةِ.\nأَنَا مُسْلِمٌ أُؤْمِنُ بِكُلِّ الكُتُبِ السَّمَاوِيَّةِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ الْكُتُبُ السَّمَاوِيَّةُ.\n     (2) بِمَ تَأْمُرُ الْكُتُبُ السَّمَاوِيَّةُ.\n     (3) عَدِّدْ بَعْضَ الْكُتُبِ السَّمَاوِيَّةِ.\n     (4) عَلَى مَنْ أُنْزِلَ الْقُرْءَانُ وَالإِنْجِيلُ وَالتَّوْرَاةُ وَالزَّبُورُ.\n"},{"id":"part2-section2","partIndex":2,"partName":"الجزء الثاني","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّانِى"],"title":"فَصْلُ الْعِبَادَاتِ","blocks":[{"type":"p","text":"فَصْلُ الْعِبَادَاتِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"فُرُوضُ الْوُضُوءِ"},{"type":"p","text":""},{"type":"p","text":"مِنْ شُرُوطِ الصَّلاةِ الْوُضُوءُ وَلَهُ فُرُوضٌ وَسُنَنٌ وَفُرُوضُهُ سِتَّةٌ وَهِىَ"},{"type":"p","text":"   (1) النِّيَّةُ بِالْقَلْبِ عِنْدَ غَسْلِ الْوَجْهِ."},{"type":"p","text":"   (2) غَسْلُ الْوَجْهِ كُلِّهِ مِنَ الأُذُنِ إِلَى الأُذُنِ عَرْضًا وَمِنْ مَنَابِتِ شَعْرِ الرَّأْسِ عَادَةً إِلَى الذَّقَنِ."},{"type":"p","text":"   (3) غَسْلُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ."},{"type":"p","text":"   (4) مَسْحُ بَعْضِ الرَّأْسِ."},{"type":"p","text":"   (5) غَسْلُ الرِّجْلَيْنِ مَعَ الْكَعْبَيْنِ."},{"type":"p","text":"   (6) وَتَرْتِيبُ الْفُرُوضِ هَكَذَا."},{"type":"p","text":""},{"type":"p","text":"أَسْئِلَةٌ"},{"type":"p","text":"(1) عَدِّدْ فَرَائِضَ الْوُضُوءِ."},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"الْوُضُوءُ فُرُوضُهُ وَسُنَنُهُ"},{"type":"p","text":""},{"type":"p","text":"الْفُرُوضُ مَا لا يَصِحُّ الْوُضُوءُ بِدُونِهَا أَمَّا السُّنَنُ فَيَصِحُّ الْوُضُوءُ بِدُونِهَا لَكِنْ إِذَا تَرَكَهَا الْمُسْلِمُ فَاتَهُ ثَوَابُهَا."},{"type":"p","text":"أَبْدَأُ وُضُوئِى"},{"type":"p","text":"بِالتَّسْمِيَةِ وَأَغْسِلُ كَفَّىَّ ثَلاثَ مَرَّاتٍ. (هَذَا سُنَّةٌ)."},{"type":"p","text":"ثُمَّ أَتَمَضْمَضُ ثَلاثَ مَرَّاتٍ. (هَذَا سُنَّةٌ)."},{"type":"p","text":"ثُمَّ أَسْتَنْشِقُ ثَلاثَ مَرَّاتٍ. (هَذَا سُنَّةٌ)."},{"type":"p","text":"ثُمَّ أَنْوِى بِقَلْبِى عِنْدَ غَسْلِ الْوَجْهِ فَأُقُولُ نَوَيْتُ الْوُضُوءَ. (هَذَا فَرْضٌ)."},{"type":"p","text":"ثُمَّ أَغْسِلُ وَجْهِى ثَلاثَ مَرَّاتٍ مِنْ مَنَابِتِ شَعْرِ الرَّأْسِ إِلَى الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ. (غَسْلُ الْوَجْهِ مَرَّةً فَرْضٌ)."},{"type":"p","text":"ثُمَّ أَغْسِلُ يَدَىَّ مَعَ الْمِرْفَقَيْنِ الْيُمْنَى قَبْلَ الْيُسْرَى ثَلاثَ مَرَّاتٍ وَأُخَلِّلُ أَصَابِعَ يَدَىَّ. (غَسْلُ الْيَدَيْنِ مَرَّةً فَرْضٌ)."},{"type":"p","text":"ثُمَّ أَمْسَحُ جَمِيعَ رَأْسِى ثَلاثَ مَرَّاتٍ. (مَسْحُ بَعْضِ الرَّأْسِ مَرَّةً فَرْضٌ)."},{"type":"p","text":"ثُمَّ أَمْسَحُ أُذُنَىَّ ظَاهِرَهُمَا وَبَاطِنَهُمَا ثَلاثَ مَرَّاتٍ. (وَهَذَا سُنَّةٌ)."},{"type":"p","text":"ثُمَّ أَغْسِلُ رِجْلَىَّ مَعَ الْكَعْبَيْنِ الْيُمْنَى قَبْلَ الْيُسْرَى ثَلاثَ مَرَّاتٍ وَأُخَلِّلُ أَصَابِعَ رِجْلَىَّ. (غَسْلُ الرِّجْلَيْنِ مَرَّةً فَرْضٌ)."},{"type":"p","text":"وَأُرَتِّبُ الْوُضُوءَ بِحَسَبِ هَذِهِ الطَّرِيقَةِ. (التَّرْتِيبُ فِى الْوُضُوءِ فَرْضٌ)."},{"type":"p","text":"وَبَعْدَ الِانْتِهَاءِ مِنَ الْوُضُوءِ أَقُولُ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ اللَّهُمَّ اجْعَلْنِى مِنَ التَّوَّابِينَ وَاجْعَلْنِى مِنَ الْمُتَطَهِّرِينَ. (وَهَذَا سُنَّةٌ)."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَالِثُ"},{"type":"p","text":"نَوَاقِضُ الْوُضُوءِ"},{"type":"p","text":""},{"type":"p","text":"نَوَاقِضُ الْوُضُوءِ هِىَ الأَشْيَاءُ الَّتِى تُفْسِدُ الْوُضُوءَ وَتُبْطِلُهُ مِنْهَا"},{"type":"p","text":"   (1) خُرُوجُ الْبَوْلِ أَوِ الغَائِطِ أَوِ الرِّيحِ."},{"type":"p","text":"   (2) النَّوْمُ عَلَى الْبَطْنِ أَوِ الظَّهْرِ أَوِ الْجَنْبِ الأَيْمَنِ أَوِ الْجَنْبِ الأَيْسَرِ."},{"type":"p","text":"   (3) الْجُنُونُ أَوِ الإِغْمَاءُ."},{"type":"p","text":"فَمَنِ انْتَقَضَ وُضُوؤُهُ فَلا يَجُوزُ لَهُ أَنْ يُصَلِّىَ حَتَّى يَتَوَضَّأَ مِنْ جَدِيدٍ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ نَوَاقِضُ الْوُضُوءِ."},{"type":"p","text":"     (2) عَدِّدْ بَعْضَ نَوَاقِضِ الْوُضُوءِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"الِاسْتِنْجَـــــاءُ"},{"type":"p","text":""},{"type":"p","text":"إِذَا خَرَجَ مِنَ الْمَرْءِ بَوْلٌ فَإِنَّهُ يَنْتَظِرُ انْقِطَاعَهُ ثُمَّ يَسْتَنْجِى أَىْ يَصُبُّ الْمَاءَ الطَّاهِرَ الْمُطَهِّرَ لِيُطَهِّرَ مَحَلَّ الْخُرُوجِ."},{"type":"p","text":"فَإِذَا زَالَتِ النَّجَاسَةُ صَارَ الْمَحَلُّ طَاهِرًا."},{"type":"p","text":"وَكَذَلِكَ إِذَا خَرَجَ مِنْهُ غَائِطٌ يَصُبُّ الْمَاءَ بِيَدِهِ الْيُمْنَى عَلَى مَحَلِّ الْخُرُوجِ وَيَدْلُكُ الْمَحَلَّ بِيَدِهِ الْيُسْرَى فَإِذَا زَالَتِ النَّجَاسَةُ صَارَ الْمَحَلُّ طَاهِرًا."},{"type":"p","text":""},{"type":"p","text":"دُعَاءُ الدُّخُولِ إِلَى الْخَلاءِ بِسْمِ اللَّهِ اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ."},{"type":"p","text":"دُعَاءُ الْخُرُوجِ مِنَ الْخَلاءِ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) كَيْفَ يَكُونُ الِاسْتِنْجَاءُ مِنَ الْبَوْلِ."},{"type":"p","text":"     (2) كَيْفَ يَكُونُ الِاسْتِنْجَاءُ مِنَ الْغَائِطِ."},{"type":"p","text":"     (3) مَاذَا نَقُولُ عِنْدَ الدُّخُولِ إِلَى الْخَلاءِ وَعِنْدَ الْخُرُوجِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"الصَّلَوَاتُ الْخَمْسُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى: ﴿إِنَّ الصَّلاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا﴾ [سُورَةَ النِّسَاءِ/103]."},{"type":"p","text":"أَىْ فَرْضًا لَهَا أَوْقَاتُهَا."},{"type":"p","text":"وَالصَّلَوَاتُ الْمَفْرُوضَاتُ خَمْسٌ وَهِىَ"},{"type":"p","text":"   (1) صَلاةُ الصُّبْحِ رَكْعَتَانِ."},{"type":"p","text":"   (2) صَلاةُ الظُّهْرِ أَرْبَعُ رَكَعَاتٍ."},{"type":"p","text":"   (3) صَلاةُ الْعَصْرِ أَرْبَعُ رَكَعَاتٍ."},{"type":"p","text":"   (4) صَلاةُ الْمَغْرِبِ ثَلاثُ رَكَعَاتٍ."},{"type":"p","text":"   (5) صَلاةُ الْعِشَاءِ أَرْبَعُ رَكَعَاتٍ."},{"type":"p","text":""},{"type":"p","text":"دُعَـــــاءٌ"},{"type":"p","text":"اللَّهُمَّ اجْعَلْنِى مُقِيمَ الصَّلاةِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"شُرُوطُ صِحَّةِ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"قَبْلَ أَدَاءِ الصَّلاةِ لا بُدَّ مِنْ شُرُوطٍ يُؤْتَى بِهَا حَتَّى تَكُونَ الصَّلاةُ صَحِيحَةً وَمِنْ هَذِهِ الشُّرُوطِ"},{"type":"p","text":"الإِسْلامُ فَلا تَصِحُّ الصَّلاةُ مِنَ الكَافِرِ."},{"type":"p","text":"وَالْوُضُوءُ فَلا تَصِحُّ الصَّلاةُ بِدُونِ وُضُوءٍ."},{"type":"p","text":"وَطَهَارَةُ الْبَدَنِ وَالثَّوْبِ وَالْمَكَانِ."},{"type":"p","text":"وَدُخُولُ وَقْتِ الصَّلاةِ فَلا تَصِحُّ الصَّلاةُ قَبْلَ دُخُولِ وَقْتِهَا بِلا عُذْرٍ."},{"type":"p","text":"وَاسْتِقْبَالُ الْقِبْلَةِ أَىْ أَنْ يَتَوَجَّهَ نَحْوَ الْكَعْبَةِ الشَّرِيفَةِ."},{"type":"p","text":"وَسَتْرُ الْعَوْرَةِ وَعَوْرَةُ الرَّجُلِ مَا بَيْنَ سُرَّتِهِ وَرُكْبَتِهِ وَعَوْرَةُ الْمَرْأَةِ كُلُّ جِسْمِهَا مَا عَدَا وَجْهَهَا وَكَفَّيْهَا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"مُبْطِلاتُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"تَبْطُلُ الصَّلاةُ بِعِدَّةِ أُمُورٍ مِنْهَا"},{"type":"p","text":"أَنْ يَتَكَلَّمَ الْمُصَلِّى عَامِدًا بِكَلامِ النَّاسِ بِحَرْفَيْنِ أَوْ أَكْثَرَ أَوْ بِحَرْفٍ لَهُ مَعْنًى."},{"type":"p","text":"وَأَنْ يَأْكُلَ أَوْ يَشْرَبَ عَامِدًا وَلَوْ قَلِيلًا."},{"type":"p","text":"وَأَنْ يَفْعَلَ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ."},{"type":"p","text":"وَأَنْ يَفْعَلَ حَرَكَةً وَاحِدَةً لِلَّعِبِ كَتَحْرِيكِ اللِّسَانِ أَوِ الإِصْبَعِ بِنِيَّةِ اللَّعِبِ."},{"type":"p","text":"وَأَنْ يَنْتَقِضَ وُضُوؤُهُ بِنَحْوِ خُرُوجِ رِيحٍ أَوْ بَولٍ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ"},{"type":"p","text":"اللَّهُمَّ اجْعَلْ فِى قَلْبِى نُورًا وَفِى لِسَانِى نُورًا وَاجْعَلْ فِى سَمْعِي نُورًا وَاجْعَلْ فِى بَصَرِي نُورًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"مِنْ أَدْعِيَةِ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"دُعَاءُ الِافْتِتَاحِ يُقْرَأُ هَذَا الدُّعَاءُ بَعْدَ تَكْبِيرَةِ الإِحْرَامِ وَقَبْلَ قِرَاءَةِ الْفَاتِحَةِ."},{"type":"p","text":"   وَجَّهْتُ وَجْهِىَ لِلَّذِى فَطَرَ السَّمَوَاتِ وَالأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ إِنَّ صَلاتِى وَنُسُكِى وَمَحْيَاىَ وَمَمَاتِى لِلَّهِ رَبِّ الْعَالَمِينَ لا شَرِيْكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ."},{"type":"p","text":"دُعَاءُ الْقُنُوتِ يُقْرَأُ هَذَا الدُّعَاءُ فِى اعْتِدَالِ الرَّكْعَةِ الثَّانِيَةِ وَقَبْلَ السُّجُودِ فِى صَلاةِ الصُّبْحِ."},{"type":"p","text":"   اللَّهُمَّ اهْدِنِى فِيمَنْ هَدَيْتَ وَعَافِنِى فِيمَنْ عَافَيْتَ وَتَوَلَّنِى فِيمَنْ تَوَلَّيْتَ وَبَارِكْ لِى فِيمَا أَعْطَيْتَ وَقِنِى شَرَّ مَا قَضَيْتَ فَإِنَّكَ تَقْضِى وَلا يُقْضَى عَلَيْكَ وَإِنَّهُ لا يَذِلُّ مَنْ وَالَيْتَ وَلا يَعِزُّ مَنْ عَادَيْتَ تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ فَلَكَ الْحَمْدُ عَلَى مَا قَضَيْتَ أَسْتَغْفِرُكَ اللَّهُمَّ وَأَتُوبُ إِلَيْكَ. ثُمَّ نَقُولُ بَعْدَهُ وَصَلِّ اللَّهُمَّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى ءَالِهِ وَصَحْبِهِ وَسَلِّمْ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"مِنْ أَدْعِيَةِ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"التَّشَهُّدُ يُقْرَأُ فِى الرَّكْعَةِ الثَّانِيَةِ وَالرَّكْعَةِ الأَخِيْرَةِ فِى الْجُلُوسِ بَعْدَ السُّجُودِ الثَّانِى."},{"type":"p","text":"التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":""},{"type":"p","text":"الصَّلاةُ الإِبْرَاهِيمِيَّةُ تُقْرَأُ بَعْدَ الِانْتِهَاءِ مِنَ التَّشَهُّدِ الأَخِيْرِ وَهِىَ"},{"type":"p","text":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ ءاخِرَ الصَّلاةِ يُقْرَأُ بَعْدَ الِانْتِهَاءِ مِنَ الصَّلاةِ الإِبْرَاهِيمِيَّةِ وَقَبْلَ التَّسْلِيمِ."},{"type":"p","text":"رَبَّنَا ءَاتِنَا فِى الدُّنْيَا حَسَنَةً وَفِى الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ رَبَّنَا لا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ."},{"type":"p","text":"دُعَاءٌ عَقِبَ الصَّلاةِ اللَّهُمَّ أَعِنِّى عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"كَيْفَ أُصَلِّى الصُّبْحَ"},{"type":"p","text":""},{"type":"p","text":"إِذَا قُمْتُ إِلَى صَلاةِ الصُّبْحِ أَفْعَلُ مَا يَأْتِى"},{"type":"p","text":"أَتَوَجَّهُ إِلَى الْكَعْبَةِ الشَّرِيفَةِ وَأَنْوِى فَأَقُولُ بِقَلْبِى أُصَلِّى فَرْضَ الصُّبْحِ لِلَّهِ تَعَالَى ثُمَّ أَقُولُ اللَّهُ أَكْبَرُ وَتُسَمَّى تَكْبِيرَةَ الإِحْرَامِ."},{"type":"p","text":"ثُمَّ أَضَعُ يَدَىَّ الْيُمْنَى فَوْقَ الْيُسْرَى تَحْتَ الصَّدْرِ وَفَوْقَ السُّرَّةِ وَأَقْرَأُ سِرًّا دُعَاءَ الِافْتِتَاحِ ثُمَّ أَقْرَأُ جَهْرًا الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً."},{"type":"p","text":"ثُمَّ أَقُولُ اللَّهُ أَكْبَرُ وَأَرْكَعُ قَائِلًا فِى الرُّكُوعِ سُبْحَانَ رَبِّىَ الْعَظِيْمِ ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَرْفَعُ رَأْسِى مِنَ الرُّكُوعِ قَائِلًا سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ حَتَّى أَعْتَدِلَ فَأَقُولُ رَبَّنَا وَلَكَ الْحَمْدُ."},{"type":"p","text":"ثُمَّ أَقُولُ اللَّهُ أَكْبَرُ وَأَسْجُدُ وَاضِعًا عَلَى الأَرْضِ جَبْهَتِى وَشَيْئًا مِنْ بُطُونِ كَفَّىَّ وَرُكْبَتَىَّ وَشَيْئًا مِنْ بُطُونِ أَصَابِعِ رِجْلَىَّ وَأَقُولُ فِى السُّجُودِ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَرْفَعُ رَأْسِى مِنَ السُّجُودِ وَأَنَا أَقُولُ اللَّهُ أَكْبَرُ فَأَجْلِسُ ثُمَّ أَسْجُدُ مَرَّةً ثَانِيَةً مِثْلَ الأُولَى."},{"type":"p","text":"ثُمَّ أَرْفَعُ رَأْسِى مِنَ السُّجُودِ وَأَنَا أَقُولُ اللَّهُ أَكْبَرُ فَأَقِفُ وَبِهَذَا أَكُونُ قَدْ أَتْمَمْتُ رَكْعَةً."},{"type":"p","text":"ثُمَّ أَقُومُ لِرَكْعَةٍ ثَانِيَةٍ فَأَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً جَهْرًا ثُمَّ أَرْكَعُ وَأَعْتَدِلُ وَأَقْرَأُ دُعَاءَ الْقُنُوتِ ثُمَّ أَسْجُدُ."},{"type":"p","text":"ثُمَّ أَجْلِسُ بَعْدَ السُّجُودِ الثَّانِى وَأَقْرَأُ التَّشَهُّدَ."},{"type":"p","text":"ثُمَّ بَعْدَ قِرَاءَةِ التَّشَهُّدِ أَقْرَأُ الصَّلاةَ الإِبْرَاهِيمِيَّةَ وَالدُّعَاءَ ءَاخِرَ الصَّلاةِ ثُمَّ أَلْتَفِتُ إِلَى جِهَةِ الْيَمِينِ وَأَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ."},{"type":"p","text":"ثُمَّ أَلْتَفِتُ إِلَى جِهَةِ الْيَسَارِ وَأَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبِذَلِكَ أَكُونُ قَدْ صَلَّيْتُ الصُّبْحَ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"كَيْفَ أُصَلِّى الظُّهْرَ"},{"type":"p","text":""},{"type":"p","text":"أَقِفُ مُسْتَقْبِلًا الْقِبْلَةَ الشَّرِيْفَةَ وَأَقُولُ بِقَلْبِى أُصَلِّى فَرْضَ الظُّهْرِ ثُمَّ أَرْفَعُ يَدَىَّ قَائِلًا اللَّهُ أَكْبَرُ ثُمَّ أَقْرَأُ دُعَاءَ الِافْتِتَاحِ."},{"type":"p","text":"ثُمَّ أَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً سِرًّا."},{"type":"p","text":"ثُمَّ أَرْكَعُ وَأَقُولُ سُبْحَانَ رَبِّىَ الْعَظِيْمِ ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَرْفَعُ مِنَ الرُّكُوعِ قَائِلًا سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ فَإِذَا اعْتَدَلْتُ قُلْتُ رَبَّنَا وَلَكَ الْحَمْدُ.  "},{"type":"p","text":"ثُمَّ أَسْجُدُ وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَجْلِسُ ثُمَّ أَسْجُدُ مَرَّةً ثَانِيَةً وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ فَأَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُولَى مِنَ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى."},{"type":"p","text":"ثُمَّ أَقْرَأُ التَّشَهُّدَ ثُمَّ أَقُولُ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّالِثَةِ فَأَقْرَأُ الْفَاتِحَةَ ثُمَّ أَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُولَى مِنَ الرُّكُوعِ إِلَى السُّجُودِ الثَّانِى."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الرَّابِعَةِ فَأَفْعَلُ كَمَا فَعَلْتُ فِى الثَّالِثَةِ مِنْ قِرَاءَةِ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى ثُمَّ أَقْرَأُ التَّشَهُّدَ وَالصَّلاةَ الإِبْرَاهِيمِيَّةَ وَالدُّعَاءَ ءَاخِرَ الصَّلاةِ ثُمَّ أُنْهِى صَلاتِى قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ."},{"type":"p","text":""},{"type":"p","text":"تَابِعُ الدَّرْسِ الْحَادِى عَشَرَ"},{"type":"p","text":"كَيْفَ أُصَلِّى الْعَصْرَ"},{"type":"p","text":""},{"type":"p","text":"أُصَلِّى صَلاةَ الْعَصْرِ كَصَلاةِ الظُّهْرِ تَمَامًا لَكِنْ أَقُولُ عِنْدَ النِّيَّةِ »أُصَلِّى فَرْضَ الْعَصْرِ«."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ يُقَالُ عَقِبَ الصَّلَوَاتِ الْخَمْسِ"},{"type":"p","text":"اللَّهُمَّ أَعِنِّى عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى عَشَرَ"},{"type":"p","text":"كَيْفَ أُصَلِّى الْمَغْرِبَ"},{"type":"p","text":""},{"type":"p","text":"إِذَا قُمْتُ إِلَى صَلاةِ الْمَغْرِبِ"},{"type":"p","text":"أَقِفُ مُسْتَقْبِلًا الْقِبْلَةَ الشَّرِيفَةَ وَأَنْوِى بِقَلْبِى صَلاةَ الْمَغْرِبِ فَأَقُولُ بِقَلْبِي أُصَلِّى فَرْضَ الْمَغْرِبِ وَأُكَبِّرُ بَعْدَهَا فَوْرًا مَعَ رَفْعِ يَدَىَّ إِلَى قُرْبِ شَحْمَةِ أُذُنَىَّ."},{"type":"p","text":"ثُمَّ أَضَعُ يَدَىَّ تَحْتَ الصَّدْرِ وَفَوْقَ السُّرَّةِ الْيُمْنَى فَوْقَ الْيُسْرَى عَلَى الْكُوعِ وَأَقْرَأُ دُعَاءَ الِافْتِتَاحِ سِرًّا وَالْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً جَهْرًا كَمَا فِى صَلاةِ الصُّبْحِ."},{"type":"p","text":"ثُمَّ أَرْكَعُ وَأَعْتَدِلُ ثُمَّ أَسْجُدُ السُّجُودَ الأَوَّلَ ثُمَّ أَجْلِسُ ثُمَّ أَسْجُدُ السُّجُودَ الثَّانِىَ مَعَ التَّسْبِيحِ فِى الرُّكُوعِ وَالسُّجُودِ وَقِرَاءَةِ الْمَأْثُورِ ثُمَّ إِذَا رَفَعْتُ مِنَ السُّجُودِ الثَّانِى أَكُونُ بِذَلِكَ قَدْ أَتْمَمْتُ الرَّكْعَةَ الأُولَى."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ وَأُتِمُّهَا كَالرَّكْعَةِ الأُولَى بِدُونِ قِراءَةِ دُعَاءِ الِافْتِتَاحِ."},{"type":"p","text":"ثُمَّ أَجْلِسُ بَعْدَ السَّجْدَةِ الثَّانِيَةِ وَأَقْرَأُ التَّشَهُّدَ وَأَقُولُ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّالِثَةِ وَأَقْرَأُ الْفَاتِحَةَ فَقَطْ سِرًّا ثُمَّ أَرْكَعُ وَأَعْتَدِلُ وَأَسْجُدُ وَأَجْلِسُ وَأَسْجُدُ السُّجُودَ الثَّانِىَ."},{"type":"p","text":"ثُمَّ أَجْلِسُ بَعْدَ السَّجْدَةِ الثَّانِيَةِ وَأَقْرَأُ التَّشَهُّدَ وَالصَّلاةَ الإِبْرَاهِيمِيَّةَ وَالدُّعَاءَ ءَاخِرَ الصَّلاةِ."},{"type":"p","text":"ثُمَّ أُسَلِّمُ مَرَّتَيْنِ قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ مَرَّةً وَأَنَا مُتَوَجِّهٌ بِوَجْهِى إِلَى الْيَمِيْنِ وَمَرَّةً وَأَنَا مُتَوَجِّهٌ بِوَجْهِى إِلَى الْيَسَارِ."},{"type":"p","text":""},{"type":"p","text":"تَابِعُ الدَّرْسِ الثَّانِى عَشَرَ"},{"type":"p","text":"كَيْفَ أُصَلِّى الْعِشَاءَ"},{"type":"p","text":""},{"type":"p","text":"أُصَلِّى صَلاةَ الْعِشَاءِ كَصَلاةِ الظُّهْرِ لَكِنْ أَقُولُ فِى النِّيَّةِ أُصَلِّى فَرْضَ الْعِشَاءِ وَأَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً فِى الرَّكْعَةِ الأُولَى وَالثَّانِيَةِ جَهْرًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثَ عَشَرَ"},{"type":"p","text":"الصِّيَامُ"},{"type":"p","text":""},{"type":"p","text":"الصِّيَامُ عِبَادَةٌ عَظِيمَةٌ وَأَمْرٌ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ فَرَضَهُ اللَّهُ تَعَالَى فِى شَهْرِ رَمَضَانَ عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ قَادِرٍ عَلَى الصَّوْمِ."},{"type":"p","text":"وَالصِّيَامُ لا بُدَّ فِيهِ مِنَ النِّيَّةِ فَيَنْوِى بِقَلْبِهِ بَعْدَ الْمَغْرِبِ وَقَبْلَ طُلُوعِ الْفَجْرِ وَلَوْ قَالَ فِى النِّيَّةِ نَوَيْتُ صِيَامَ يَوْمِ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانَ هَذِهِ السَّنَةِ إِيـمَانًا وَاحْتِسَابًا لِلَّهِ تَعَالَى كَانَ أَكْمَلَ."},{"type":"p","text":"وَالصِّيامُ هُوَ الِامْتِنَاعُ عَنِ الْمُفَطِّرَاتِ وَمِنْهَا"},{"type":"p","text":"الأَكْلُ وَلَوْ لُقْمَةَ خُبْزٍ وَاحِدَةً أَوْ أَقَلَّ."},{"type":"p","text":"وَالشُّرْبُ وَلَوْ شُرْبَةَ مَاءٍ قَلِيْلَةً أَوْ أَقَلَّ."},{"type":"p","text":"وَإِدْخَالُ كُلِّ مَا لَهُ حَجْمٌ وَلَوْ صَغِيرًا إِلَى الرَّأْسِ أَوِ الْبَطْنِ أَوِ الأَمْعَاءِ مِنْ مَنْفَذٍ مَفْتُوحٍ كَالْفَمِ وَالأَنْفِ، وَذَلِكَ مِنْ طُلُوعِ الْفَجْرِ إِلَى مَغِيبِ الشَّمْسِ مَعَ النِّيَّةِ."},{"type":"p","text":"أَمَّا مَنْ أَكَلَ أَوْ شَرِبَ أَوْ فَعَلَ غَيْرَ ذَلِكَ مِنَ الْمُفَطِّرَاتِ نَاسِيًا فَلا يُفْطِرُ."},{"type":"p","text":""},{"type":"p","text":"دُعَـــاءٌ"},{"type":"p","text":"اللَّهُمَّ  لَكَ صُمْتُ وَعَلَى رِزْقِكَ أَفْطَرْتُ وَبِكَ ءَامَنْتُ وَعَلَيْكَ تَوَكَّلْتُ."},{"type":"p","text":""}],"paragraphCount":150,"wordCount":1552,"readingMinutes":9,"description":"المحتوى الكامل لـ فَصْلُ الْعِبَادَاتِ من الجزء الثاني، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّانِى فَصْلُ الْعِبَادَاتِ فَصْلُ الْعِبَادَاتِ\nالدَّرْسُ الأَوَّلُ\nفُرُوضُ الْوُضُوءِ\n\nمِنْ شُرُوطِ الصَّلاةِ الْوُضُوءُ وَلَهُ فُرُوضٌ وَسُنَنٌ وَفُرُوضُهُ سِتَّةٌ وَهِىَ\n   (1) النِّيَّةُ بِالْقَلْبِ عِنْدَ غَسْلِ الْوَجْهِ.\n   (2) غَسْلُ الْوَجْهِ كُلِّهِ مِنَ الأُذُنِ إِلَى الأُذُنِ عَرْضًا وَمِنْ مَنَابِتِ شَعْرِ الرَّأْسِ عَادَةً إِلَى الذَّقَنِ.\n   (3) غَسْلُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ.\n   (4) مَسْحُ بَعْضِ الرَّأْسِ.\n   (5) غَسْلُ الرِّجْلَيْنِ مَعَ الْكَعْبَيْنِ.\n   (6) وَتَرْتِيبُ الْفُرُوضِ هَكَذَا.\n\nأَسْئِلَةٌ\n(1) عَدِّدْ فَرَائِضَ الْوُضُوءِ.\nالدَّرْسُ الثَّانِى\nالْوُضُوءُ فُرُوضُهُ وَسُنَنُهُ\n\nالْفُرُوضُ مَا لا يَصِحُّ الْوُضُوءُ بِدُونِهَا أَمَّا السُّنَنُ فَيَصِحُّ الْوُضُوءُ بِدُونِهَا لَكِنْ إِذَا تَرَكَهَا الْمُسْلِمُ فَاتَهُ ثَوَابُهَا.\nأَبْدَأُ وُضُوئِى\nبِالتَّسْمِيَةِ وَأَغْسِلُ كَفَّىَّ ثَلاثَ مَرَّاتٍ. (هَذَا سُنَّةٌ).\nثُمَّ أَتَمَضْمَضُ ثَلاثَ مَرَّاتٍ. (هَذَا سُنَّةٌ).\nثُمَّ أَسْتَنْشِقُ ثَلاثَ مَرَّاتٍ. (هَذَا سُنَّةٌ).\nثُمَّ أَنْوِى بِقَلْبِى عِنْدَ غَسْلِ الْوَجْهِ فَأُقُولُ نَوَيْتُ الْوُضُوءَ. (هَذَا فَرْضٌ).\nثُمَّ أَغْسِلُ وَجْهِى ثَلاثَ مَرَّاتٍ مِنْ مَنَابِتِ شَعْرِ الرَّأْسِ إِلَى الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ. (غَسْلُ الْوَجْهِ مَرَّةً فَرْضٌ).\nثُمَّ أَغْسِلُ يَدَىَّ مَعَ الْمِرْفَقَيْنِ الْيُمْنَى قَبْلَ الْيُسْرَى ثَلاثَ مَرَّاتٍ وَأُخَلِّلُ أَصَابِعَ يَدَىَّ. (غَسْلُ الْيَدَيْنِ مَرَّةً فَرْضٌ).\nثُمَّ أَمْسَحُ جَمِيعَ رَأْسِى ثَلاثَ مَرَّاتٍ. (مَسْحُ بَعْضِ الرَّأْسِ مَرَّةً فَرْضٌ).\nثُمَّ أَمْسَحُ أُذُنَىَّ ظَاهِرَهُمَا وَبَاطِنَهُمَا ثَلاثَ مَرَّاتٍ. (وَهَذَا سُنَّةٌ).\nثُمَّ أَغْسِلُ رِجْلَىَّ مَعَ الْكَعْبَيْنِ الْيُمْنَى قَبْلَ الْيُسْرَى ثَلاثَ مَرَّاتٍ وَأُخَلِّلُ أَصَابِعَ رِجْلَىَّ. (غَسْلُ الرِّجْلَيْنِ مَرَّةً فَرْضٌ).\nوَأُرَتِّبُ الْوُضُوءَ بِحَسَبِ هَذِهِ الطَّرِيقَةِ. (التَّرْتِيبُ فِى الْوُضُوءِ فَرْضٌ).\nوَبَعْدَ الِانْتِهَاءِ مِنَ الْوُضُوءِ أَقُولُ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ اللَّهُمَّ اجْعَلْنِى مِنَ التَّوَّابِينَ وَاجْعَلْنِى مِنَ الْمُتَطَهِّرِينَ. (وَهَذَا سُنَّةٌ).\n\nالدَّرْسُ الثَالِثُ\nنَوَاقِضُ الْوُضُوءِ\n\nنَوَاقِضُ الْوُضُوءِ هِىَ الأَشْيَاءُ الَّتِى تُفْسِدُ الْوُضُوءَ وَتُبْطِلُهُ مِنْهَا\n   (1) خُرُوجُ الْبَوْلِ أَوِ الغَائِطِ أَوِ الرِّيحِ.\n   (2) النَّوْمُ عَلَى الْبَطْنِ أَوِ الظَّهْرِ أَوِ الْجَنْبِ الأَيْمَنِ أَوِ الْجَنْبِ الأَيْسَرِ.\n   (3) الْجُنُونُ أَوِ الإِغْمَاءُ.\nفَمَنِ انْتَقَضَ وُضُوؤُهُ فَلا يَجُوزُ لَهُ أَنْ يُصَلِّىَ حَتَّى يَتَوَضَّأَ مِنْ جَدِيدٍ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ نَوَاقِضُ الْوُضُوءِ.\n     (2) عَدِّدْ بَعْضَ نَوَاقِضِ الْوُضُوءِ.\n\nالدَّرْسُ الرَّابِعُ\nالِاسْتِنْجَـــــاءُ\n\nإِذَا خَرَجَ مِنَ الْمَرْءِ بَوْلٌ فَإِنَّهُ يَنْتَظِرُ انْقِطَاعَهُ ثُمَّ يَسْتَنْجِى أَىْ يَصُبُّ الْمَاءَ الطَّاهِرَ الْمُطَهِّرَ لِيُطَهِّرَ مَحَلَّ الْخُرُوجِ.\nفَإِذَا زَالَتِ النَّجَاسَةُ صَارَ الْمَحَلُّ طَاهِرًا.\nوَكَذَلِكَ إِذَا خَرَجَ مِنْهُ غَائِطٌ يَصُبُّ الْمَاءَ بِيَدِهِ الْيُمْنَى عَلَى مَحَلِّ الْخُرُوجِ وَيَدْلُكُ الْمَحَلَّ بِيَدِهِ الْيُسْرَى فَإِذَا زَالَتِ النَّجَاسَةُ صَارَ الْمَحَلُّ طَاهِرًا.\n\nدُعَاءُ الدُّخُولِ إِلَى الْخَلاءِ بِسْمِ اللَّهِ اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ.\nدُعَاءُ الْخُرُوجِ مِنَ الْخَلاءِ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى.\n\n     أَسْئِلَةٌ\n     (1) كَيْفَ يَكُونُ الِاسْتِنْجَاءُ مِنَ الْبَوْلِ.\n     (2) كَيْفَ يَكُونُ الِاسْتِنْجَاءُ مِنَ الْغَائِطِ.\n     (3) مَاذَا نَقُولُ عِنْدَ الدُّخُولِ إِلَى الْخَلاءِ وَعِنْدَ الْخُرُوجِ.\n\nالدَّرْسُ الْخَامِسُ\nالصَّلَوَاتُ الْخَمْسُ\n\nقَالَ اللَّهُ تَعَالَى: ﴿إِنَّ الصَّلاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا﴾ [سُورَةَ النِّسَاءِ/103].\nأَىْ فَرْضًا لَهَا أَوْقَاتُهَا.\nوَالصَّلَوَاتُ الْمَفْرُوضَاتُ خَمْسٌ وَهِىَ\n   (1) صَلاةُ الصُّبْحِ رَكْعَتَانِ.\n   (2) صَلاةُ الظُّهْرِ أَرْبَعُ رَكَعَاتٍ.\n   (3) صَلاةُ الْعَصْرِ أَرْبَعُ رَكَعَاتٍ.\n   (4) صَلاةُ الْمَغْرِبِ ثَلاثُ رَكَعَاتٍ.\n   (5) صَلاةُ الْعِشَاءِ أَرْبَعُ رَكَعَاتٍ.\n\nدُعَـــــاءٌ\nاللَّهُمَّ اجْعَلْنِى مُقِيمَ الصَّلاةِ.\n\nالدَّرْسُ السَّادِسُ\nشُرُوطُ صِحَّةِ الصَّلاةِ\n\nقَبْلَ أَدَاءِ الصَّلاةِ لا بُدَّ مِنْ شُرُوطٍ يُؤْتَى بِهَا حَتَّى تَكُونَ الصَّلاةُ صَحِيحَةً وَمِنْ هَذِهِ الشُّرُوطِ\nالإِسْلامُ فَلا تَصِحُّ الصَّلاةُ مِنَ الكَافِرِ.\nوَالْوُضُوءُ فَلا تَصِحُّ الصَّلاةُ بِدُونِ وُضُوءٍ.\nوَطَهَارَةُ الْبَدَنِ وَالثَّوْبِ وَالْمَكَانِ.\nوَدُخُولُ وَقْتِ الصَّلاةِ فَلا تَصِحُّ الصَّلاةُ قَبْلَ دُخُولِ وَقْتِهَا بِلا عُذْرٍ.\nوَاسْتِقْبَالُ الْقِبْلَةِ أَىْ أَنْ يَتَوَجَّهَ نَحْوَ الْكَعْبَةِ الشَّرِيفَةِ.\nوَسَتْرُ الْعَوْرَةِ وَعَوْرَةُ الرَّجُلِ مَا بَيْنَ سُرَّتِهِ وَرُكْبَتِهِ وَعَوْرَةُ الْمَرْأَةِ كُلُّ جِسْمِهَا مَا عَدَا وَجْهَهَا وَكَفَّيْهَا.\n\nالدَّرْسُ السَّابِعُ\nمُبْطِلاتُ الصَّلاةِ\n\nتَبْطُلُ الصَّلاةُ بِعِدَّةِ أُمُورٍ مِنْهَا\nأَنْ يَتَكَلَّمَ الْمُصَلِّى عَامِدًا بِكَلامِ النَّاسِ بِحَرْفَيْنِ أَوْ أَكْثَرَ أَوْ بِحَرْفٍ لَهُ مَعْنًى.\nوَأَنْ يَأْكُلَ أَوْ يَشْرَبَ عَامِدًا وَلَوْ قَلِيلًا.\nوَأَنْ يَفْعَلَ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ.\nوَأَنْ يَفْعَلَ حَرَكَةً وَاحِدَةً لِلَّعِبِ كَتَحْرِيكِ اللِّسَانِ أَوِ الإِصْبَعِ بِنِيَّةِ اللَّعِبِ.\nوَأَنْ يَنْتَقِضَ وُضُوؤُهُ بِنَحْوِ خُرُوجِ رِيحٍ أَوْ بَولٍ.\n\nدُعَاءٌ\nاللَّهُمَّ اجْعَلْ فِى قَلْبِى نُورًا وَفِى لِسَانِى نُورًا وَاجْعَلْ فِى سَمْعِي نُورًا وَاجْعَلْ فِى بَصَرِي نُورًا.\n\nالدَّرْسُ الثَّامِنُ\nمِنْ أَدْعِيَةِ الصَّلاةِ\n\nدُعَاءُ الِافْتِتَاحِ يُقْرَأُ هَذَا الدُّعَاءُ بَعْدَ تَكْبِيرَةِ الإِحْرَامِ وَقَبْلَ قِرَاءَةِ الْفَاتِحَةِ.\n   وَجَّهْتُ وَجْهِىَ لِلَّذِى فَطَرَ السَّمَوَاتِ وَالأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ إِنَّ صَلاتِى وَنُسُكِى وَمَحْيَاىَ وَمَمَاتِى لِلَّهِ رَبِّ الْعَالَمِينَ لا شَرِيْكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ.\nدُعَاءُ الْقُنُوتِ يُقْرَأُ هَذَا الدُّعَاءُ فِى اعْتِدَالِ الرَّكْعَةِ الثَّانِيَةِ وَقَبْلَ السُّجُودِ فِى صَلاةِ الصُّبْحِ.\n   اللَّهُمَّ اهْدِنِى فِيمَنْ هَدَيْتَ وَعَافِنِى فِيمَنْ عَافَيْتَ وَتَوَلَّنِى فِيمَنْ تَوَلَّيْتَ وَبَارِكْ لِى فِيمَا أَعْطَيْتَ وَقِنِى شَرَّ مَا قَضَيْتَ فَإِنَّكَ تَقْضِى وَلا يُقْضَى عَلَيْكَ وَإِنَّهُ لا يَذِلُّ مَنْ وَالَيْتَ وَلا يَعِزُّ مَنْ عَادَيْتَ تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ فَلَكَ الْحَمْدُ عَلَى مَا قَضَيْتَ أَسْتَغْفِرُكَ اللَّهُمَّ وَأَتُوبُ إِلَيْكَ. ثُمَّ نَقُولُ بَعْدَهُ وَصَلِّ اللَّهُمَّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى ءَالِهِ وَصَحْبِهِ وَسَلِّمْ.\n\nالدَّرْسُ التَّاسِعُ\nمِنْ أَدْعِيَةِ الصَّلاةِ\n\nالتَّشَهُّدُ يُقْرَأُ فِى الرَّكْعَةِ الثَّانِيَةِ وَالرَّكْعَةِ الأَخِيْرَةِ فِى الْجُلُوسِ بَعْدَ السُّجُودِ الثَّانِى.\nالتَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\n\nالصَّلاةُ الإِبْرَاهِيمِيَّةُ تُقْرَأُ بَعْدَ الِانْتِهَاءِ مِنَ التَّشَهُّدِ الأَخِيْرِ وَهِىَ\nاللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ.\n\nدُعَاءٌ ءاخِرَ الصَّلاةِ يُقْرَأُ بَعْدَ الِانْتِهَاءِ مِنَ الصَّلاةِ الإِبْرَاهِيمِيَّةِ وَقَبْلَ التَّسْلِيمِ.\nرَبَّنَا ءَاتِنَا فِى الدُّنْيَا حَسَنَةً وَفِى الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ رَبَّنَا لا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.\nدُعَاءٌ عَقِبَ الصَّلاةِ اللَّهُمَّ أَعِنِّى عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ.\n\nالدَّرْسُ الْعَاشِرُ\nكَيْفَ أُصَلِّى الصُّبْحَ\n\nإِذَا قُمْتُ إِلَى صَلاةِ الصُّبْحِ أَفْعَلُ مَا يَأْتِى\nأَتَوَجَّهُ إِلَى الْكَعْبَةِ الشَّرِيفَةِ وَأَنْوِى فَأَقُولُ بِقَلْبِى أُصَلِّى فَرْضَ الصُّبْحِ لِلَّهِ تَعَالَى ثُمَّ أَقُولُ اللَّهُ أَكْبَرُ وَتُسَمَّى تَكْبِيرَةَ الإِحْرَامِ.\nثُمَّ أَضَعُ يَدَىَّ الْيُمْنَى فَوْقَ الْيُسْرَى تَحْتَ الصَّدْرِ وَفَوْقَ السُّرَّةِ وَأَقْرَأُ سِرًّا دُعَاءَ الِافْتِتَاحِ ثُمَّ أَقْرَأُ جَهْرًا الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً.\nثُمَّ أَقُولُ اللَّهُ أَكْبَرُ وَأَرْكَعُ قَائِلًا فِى الرُّكُوعِ سُبْحَانَ رَبِّىَ الْعَظِيْمِ ثَلاثَ مَرَّاتٍ.\nثُمَّ أَرْفَعُ رَأْسِى مِنَ الرُّكُوعِ قَائِلًا سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ حَتَّى أَعْتَدِلَ فَأَقُولُ رَبَّنَا وَلَكَ الْحَمْدُ.\nثُمَّ أَقُولُ اللَّهُ أَكْبَرُ وَأَسْجُدُ وَاضِعًا عَلَى الأَرْضِ جَبْهَتِى وَشَيْئًا مِنْ بُطُونِ كَفَّىَّ وَرُكْبَتَىَّ وَشَيْئًا مِنْ بُطُونِ أَصَابِعِ رِجْلَىَّ وَأَقُولُ فِى السُّجُودِ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ.\nثُمَّ أَرْفَعُ رَأْسِى مِنَ السُّجُودِ وَأَنَا أَقُولُ اللَّهُ أَكْبَرُ فَأَجْلِسُ ثُمَّ أَسْجُدُ مَرَّةً ثَانِيَةً مِثْلَ الأُولَى.\nثُمَّ أَرْفَعُ رَأْسِى مِنَ السُّجُودِ وَأَنَا أَقُولُ اللَّهُ أَكْبَرُ فَأَقِفُ وَبِهَذَا أَكُونُ قَدْ أَتْمَمْتُ رَكْعَةً.\nثُمَّ أَقُومُ لِرَكْعَةٍ ثَانِيَةٍ فَأَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً جَهْرًا ثُمَّ أَرْكَعُ وَأَعْتَدِلُ وَأَقْرَأُ دُعَاءَ الْقُنُوتِ ثُمَّ أَسْجُدُ.\nثُمَّ أَجْلِسُ بَعْدَ السُّجُودِ الثَّانِى وَأَقْرَأُ التَّشَهُّدَ.\nثُمَّ بَعْدَ قِرَاءَةِ التَّشَهُّدِ أَقْرَأُ الصَّلاةَ الإِبْرَاهِيمِيَّةَ وَالدُّعَاءَ ءَاخِرَ الصَّلاةِ ثُمَّ أَلْتَفِتُ إِلَى جِهَةِ الْيَمِينِ وَأَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ.\nثُمَّ أَلْتَفِتُ إِلَى جِهَةِ الْيَسَارِ وَأَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبِذَلِكَ أَكُونُ قَدْ صَلَّيْتُ الصُّبْحَ.\n\n\nالدَّرْسُ الْحَادِى عَشَرَ\nكَيْفَ أُصَلِّى الظُّهْرَ\n\nأَقِفُ مُسْتَقْبِلًا الْقِبْلَةَ الشَّرِيْفَةَ وَأَقُولُ بِقَلْبِى أُصَلِّى فَرْضَ الظُّهْرِ ثُمَّ أَرْفَعُ يَدَىَّ قَائِلًا اللَّهُ أَكْبَرُ ثُمَّ أَقْرَأُ دُعَاءَ الِافْتِتَاحِ.\nثُمَّ أَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً سِرًّا.\nثُمَّ أَرْكَعُ وَأَقُولُ سُبْحَانَ رَبِّىَ الْعَظِيْمِ ثَلاثَ مَرَّاتٍ.\nثُمَّ أَرْفَعُ مِنَ الرُّكُوعِ قَائِلًا سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ فَإِذَا اعْتَدَلْتُ قُلْتُ رَبَّنَا وَلَكَ الْحَمْدُ.  \nثُمَّ أَسْجُدُ وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ.\nثُمَّ أَجْلِسُ ثُمَّ أَسْجُدُ مَرَّةً ثَانِيَةً وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ فَأَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُولَى مِنَ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى.\nثُمَّ أَقْرَأُ التَّشَهُّدَ ثُمَّ أَقُولُ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّالِثَةِ فَأَقْرَأُ الْفَاتِحَةَ ثُمَّ أَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُولَى مِنَ الرُّكُوعِ إِلَى السُّجُودِ الثَّانِى.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الرَّابِعَةِ فَأَفْعَلُ كَمَا فَعَلْتُ فِى الثَّالِثَةِ مِنْ قِرَاءَةِ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى ثُمَّ أَقْرَأُ التَّشَهُّدَ وَالصَّلاةَ الإِبْرَاهِيمِيَّةَ وَالدُّعَاءَ ءَاخِرَ الصَّلاةِ ثُمَّ أُنْهِى صَلاتِى قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ.\n\nتَابِعُ الدَّرْسِ الْحَادِى عَشَرَ\nكَيْفَ أُصَلِّى الْعَصْرَ\n\nأُصَلِّى صَلاةَ الْعَصْرِ كَصَلاةِ الظُّهْرِ تَمَامًا لَكِنْ أَقُولُ عِنْدَ النِّيَّةِ »أُصَلِّى فَرْضَ الْعَصْرِ«.\n\nدُعَاءٌ يُقَالُ عَقِبَ الصَّلَوَاتِ الْخَمْسِ\nاللَّهُمَّ أَعِنِّى عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.\n\n\nالدَّرْسُ الثَّانِى عَشَرَ\nكَيْفَ أُصَلِّى الْمَغْرِبَ\n\nإِذَا قُمْتُ إِلَى صَلاةِ الْمَغْرِبِ\nأَقِفُ مُسْتَقْبِلًا الْقِبْلَةَ الشَّرِيفَةَ وَأَنْوِى بِقَلْبِى صَلاةَ الْمَغْرِبِ فَأَقُولُ بِقَلْبِي أُصَلِّى فَرْضَ الْمَغْرِبِ وَأُكَبِّرُ بَعْدَهَا فَوْرًا مَعَ رَفْعِ يَدَىَّ إِلَى قُرْبِ شَحْمَةِ أُذُنَىَّ.\nثُمَّ أَضَعُ يَدَىَّ تَحْتَ الصَّدْرِ وَفَوْقَ السُّرَّةِ الْيُمْنَى فَوْقَ الْيُسْرَى عَلَى الْكُوعِ وَأَقْرَأُ دُعَاءَ الِافْتِتَاحِ سِرًّا وَالْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً جَهْرًا كَمَا فِى صَلاةِ الصُّبْحِ.\nثُمَّ أَرْكَعُ وَأَعْتَدِلُ ثُمَّ أَسْجُدُ السُّجُودَ الأَوَّلَ ثُمَّ أَجْلِسُ ثُمَّ أَسْجُدُ السُّجُودَ الثَّانِىَ مَعَ التَّسْبِيحِ فِى الرُّكُوعِ وَالسُّجُودِ وَقِرَاءَةِ الْمَأْثُورِ ثُمَّ إِذَا رَفَعْتُ مِنَ السُّجُودِ الثَّانِى أَكُونُ بِذَلِكَ قَدْ أَتْمَمْتُ الرَّكْعَةَ الأُولَى.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ وَأُتِمُّهَا كَالرَّكْعَةِ الأُولَى بِدُونِ قِراءَةِ دُعَاءِ الِافْتِتَاحِ.\nثُمَّ أَجْلِسُ بَعْدَ السَّجْدَةِ الثَّانِيَةِ وَأَقْرَأُ التَّشَهُّدَ وَأَقُولُ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّالِثَةِ وَأَقْرَأُ الْفَاتِحَةَ فَقَطْ سِرًّا ثُمَّ أَرْكَعُ وَأَعْتَدِلُ وَأَسْجُدُ وَأَجْلِسُ وَأَسْجُدُ السُّجُودَ الثَّانِىَ.\nثُمَّ أَجْلِسُ بَعْدَ السَّجْدَةِ الثَّانِيَةِ وَأَقْرَأُ التَّشَهُّدَ وَالصَّلاةَ الإِبْرَاهِيمِيَّةَ وَالدُّعَاءَ ءَاخِرَ الصَّلاةِ.\nثُمَّ أُسَلِّمُ مَرَّتَيْنِ قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ مَرَّةً وَأَنَا مُتَوَجِّهٌ بِوَجْهِى إِلَى الْيَمِيْنِ وَمَرَّةً وَأَنَا مُتَوَجِّهٌ بِوَجْهِى إِلَى الْيَسَارِ.\n\nتَابِعُ الدَّرْسِ الثَّانِى عَشَرَ\nكَيْفَ أُصَلِّى الْعِشَاءَ\n\nأُصَلِّى صَلاةَ الْعِشَاءِ كَصَلاةِ الظُّهْرِ لَكِنْ أَقُولُ فِى النِّيَّةِ أُصَلِّى فَرْضَ الْعِشَاءِ وَأَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً فِى الرَّكْعَةِ الأُولَى وَالثَّانِيَةِ جَهْرًا.\n\nالدَّرْسُ الثَّالِثَ عَشَرَ\nالصِّيَامُ\n\nالصِّيَامُ عِبَادَةٌ عَظِيمَةٌ وَأَمْرٌ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ فَرَضَهُ اللَّهُ تَعَالَى فِى شَهْرِ رَمَضَانَ عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ قَادِرٍ عَلَى الصَّوْمِ.\nوَالصِّيَامُ لا بُدَّ فِيهِ مِنَ النِّيَّةِ فَيَنْوِى بِقَلْبِهِ بَعْدَ الْمَغْرِبِ وَقَبْلَ طُلُوعِ الْفَجْرِ وَلَوْ قَالَ فِى النِّيَّةِ نَوَيْتُ صِيَامَ يَوْمِ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانَ هَذِهِ السَّنَةِ إِيـمَانًا وَاحْتِسَابًا لِلَّهِ تَعَالَى كَانَ أَكْمَلَ.\nوَالصِّيامُ هُوَ الِامْتِنَاعُ عَنِ الْمُفَطِّرَاتِ وَمِنْهَا\nالأَكْلُ وَلَوْ لُقْمَةَ خُبْزٍ وَاحِدَةً أَوْ أَقَلَّ.\nوَالشُّرْبُ وَلَوْ شُرْبَةَ مَاءٍ قَلِيْلَةً أَوْ أَقَلَّ.\nوَإِدْخَالُ كُلِّ مَا لَهُ حَجْمٌ وَلَوْ صَغِيرًا إِلَى الرَّأْسِ أَوِ الْبَطْنِ أَوِ الأَمْعَاءِ مِنْ مَنْفَذٍ مَفْتُوحٍ كَالْفَمِ وَالأَنْفِ، وَذَلِكَ مِنْ طُلُوعِ الْفَجْرِ إِلَى مَغِيبِ الشَّمْسِ مَعَ النِّيَّةِ.\nأَمَّا مَنْ أَكَلَ أَوْ شَرِبَ أَوْ فَعَلَ غَيْرَ ذَلِكَ مِنَ الْمُفَطِّرَاتِ نَاسِيًا فَلا يُفْطِرُ.\n\nدُعَـــاءٌ\nاللَّهُمَّ  لَكَ صُمْتُ وَعَلَى رِزْقِكَ أَفْطَرْتُ وَبِكَ ءَامَنْتُ وَعَلَيْكَ تَوَكَّلْتُ.\n"},{"id":"part2-section3","partIndex":2,"partName":"الجزء الثاني","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّانِى"],"title":"فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ","blocks":[{"type":"p","text":"فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ"},{"type":"p","text":""},{"type":"p","text":"الْمُسْلِمُ الصَالِحُ يُؤَدِّى الْوَاجِبَاتِ كَالصَّلَوَاتِ الْخَمْسِ"},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ يَجْتَنِبُ الْمُحَرَّمَاتِ كَالْكَذِبِ وَشُرْبِ الْخَمْرِ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ مِنْ شَأْنِهِ أَنَّهُ لا يَرْتَكِبُ الْجَرَائِمَ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ مِنْ شَأْنِهِ أَنَّهُ أَمِينٌ لا يَسْرِقُ."},{"type":"p","text":"الْمُسْلِمُ الْكَامِلُ يُحِبُّ الْخَيْرَ وَيَكْرَهُ الشَّرَّ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"الصِّدْقُ"},{"type":"p","text":""},{"type":"p","text":"الصِّدْقُ مِنْ صِفَاتِ الْمُسْلِمِ الصَّالِحِ فَمِنْ شَأْنِهِ أَنَّهُ لا يَكْذِبُ."},{"type":"p","text":"الْكَذِبُ شَرٌّ لا يُحِبُّهُ اللَّهُ."},{"type":"p","text":"أَنَا أُحِبُّ الصِّدْقَ وَأَكْرَهُ الْكَذِبَ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَكُونُوا مَعَ الصَّادِقِينَ﴾ [سُورَةَ التَّوْبَةِ/119]."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"حُسْنُ الْخُلُقِ"},{"type":"p","text":""},{"type":"p","text":"حَثَّ الإِسْلامُ عَلَى التَّجَمُّلِ بِالأَخْلاقِ الْحَسَنَةِ"},{"type":"p","text":"الْمُسْلِمُ الْكَامِلُ لا يُؤْذِى الْمُسْلِمِينَ وَيَبْذُلُ لَهُمُ الْمَعْرُوفَ."},{"type":"p","text":"الْمُسْلِمُ الْكَامِلُ يُقَابِلُ الْمُسْلِمِينَ بِطَلاقَةِ وَجْهٍ."},{"type":"p","text":"الْمُسْلِمُ الْكَامِلُ يُحْسِنُ لِمَنْ أَسَاءَ إِلَيْهِ."},{"type":"p","text":"الْمُسْلِمُ الْكَامِلُ يَتَحَمَّلُ الأَذَى وَلا يَغْضَبُ لِأَمْرٍ تَافِهٍ."},{"type":"p","text":"قَالَ النَّبِىُّ ﷺ »وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"طَاعَةُ الْوَالِدَيْنِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَوَصَّيْنَا الإِنْسَانَ بِوَالِدَيْهِ حَمَلَتْهُ أُمُّهُ وَهْنًا عَلَى وَهْنٍ وَفِصَالُهُ فِى عَامَيْنِ أَنِ اشْكُرْ لِى وَلِوَالِدَيْكَ إِلَىَّ الْمَصِيرُ﴾ [سُورَةَ لُقْمَانَ/14]."},{"type":"p","text":"يَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يُطِيعَ وَالِدَيْهِ فِى غَيْرِ مَعْصِيَةِ اللَّهِ."},{"type":"p","text":"يَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يُعَامِلَ وَالِدَيْهِ مُعَامَلَةً حَسَنَةً."},{"type":"p","text":"يَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يَتَأَدَّبَ مَعَ وَالِدَيْهِ فَلا يَرْفَعُ صَوْتَهُ بِحَضْرَتِهِمَا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"عُقُوقُ الْوَالِدَيْنِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿فَلا تَقُلْ لَهُمَا أُفٍّ وَلا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيـمًا﴾ [سُورَةَ الإِسْرَاءِ/23]."},{"type":"p","text":"يَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يَتَجَنَّبَ كُلَّ مَا يُؤْذِى وَالِدَيْهِ."},{"type":"p","text":"مَنْ يُعَامِلُ وَالِدَيْهِ مُعَامَلَةً سَيِّئَةً وَيُؤْذِيهِمَا أَذًى شَدِيدًا يَكُونُ عَاقًّا لَهُمَا."},{"type":"p","text":"وَالعَاقُّ لِوَالِدَيْهِ لا يَكُونُ عِنْدَ اللَّهِ مِنَ الْمُتَّقِينَ الصَّالِحِينَ."},{"type":"p","text":"مَنْ بَرَّ وَالِدَيْهِ تَكُونُ عَاقِبَتُهُ حَمِيدَةً. "},{"type":"p","text":"عَلَيْكُمْ بِبِرِّ الْوَالِدَيْنِ فَإِنَّهُ بَرَكَةٌ فِى الدُّنْيَا وَالآخِرَةِ."},{"type":"p","text":""},{"type":"p","text":""}],"paragraphCount":36,"wordCount":236,"readingMinutes":2,"description":"المحتوى الكامل لـ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ من الجزء الثاني، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّانِى فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ\nالدَّرْسُ الأَوَّلُ\nالْمُسْلِمُ الصَّالِحُ\n\nالْمُسْلِمُ الصَالِحُ يُؤَدِّى الْوَاجِبَاتِ كَالصَّلَوَاتِ الْخَمْسِ\nالْمُسْلِمُ الصَّالِحُ يَجْتَنِبُ الْمُحَرَّمَاتِ كَالْكَذِبِ وَشُرْبِ الْخَمْرِ.\nالْمُسْلِمُ الصَّالِحُ مِنْ شَأْنِهِ أَنَّهُ لا يَرْتَكِبُ الْجَرَائِمَ.\nالْمُسْلِمُ الصَّالِحُ مِنْ شَأْنِهِ أَنَّهُ أَمِينٌ لا يَسْرِقُ.\nالْمُسْلِمُ الْكَامِلُ يُحِبُّ الْخَيْرَ وَيَكْرَهُ الشَّرَّ.\n\nالدَّرْسُ الثَّانِى\nالصِّدْقُ\n\nالصِّدْقُ مِنْ صِفَاتِ الْمُسْلِمِ الصَّالِحِ فَمِنْ شَأْنِهِ أَنَّهُ لا يَكْذِبُ.\nالْكَذِبُ شَرٌّ لا يُحِبُّهُ اللَّهُ.\nأَنَا أُحِبُّ الصِّدْقَ وَأَكْرَهُ الْكَذِبَ.\nقَالَ اللَّهُ تَعَالَى ﴿وَكُونُوا مَعَ الصَّادِقِينَ﴾ [سُورَةَ التَّوْبَةِ/119].\n\nالدَّرْسُ الثَّالِثُ\nحُسْنُ الْخُلُقِ\n\nحَثَّ الإِسْلامُ عَلَى التَّجَمُّلِ بِالأَخْلاقِ الْحَسَنَةِ\nالْمُسْلِمُ الْكَامِلُ لا يُؤْذِى الْمُسْلِمِينَ وَيَبْذُلُ لَهُمُ الْمَعْرُوفَ.\nالْمُسْلِمُ الْكَامِلُ يُقَابِلُ الْمُسْلِمِينَ بِطَلاقَةِ وَجْهٍ.\nالْمُسْلِمُ الْكَامِلُ يُحْسِنُ لِمَنْ أَسَاءَ إِلَيْهِ.\nالْمُسْلِمُ الْكَامِلُ يَتَحَمَّلُ الأَذَى وَلا يَغْضَبُ لِأَمْرٍ تَافِهٍ.\nقَالَ النَّبِىُّ ﷺ »وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ« رَوَاهُ الْبُخَارِىُّ.\n\nالدَّرْسُ الرَّابِعُ\nطَاعَةُ الْوَالِدَيْنِ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَوَصَّيْنَا الإِنْسَانَ بِوَالِدَيْهِ حَمَلَتْهُ أُمُّهُ وَهْنًا عَلَى وَهْنٍ وَفِصَالُهُ فِى عَامَيْنِ أَنِ اشْكُرْ لِى وَلِوَالِدَيْكَ إِلَىَّ الْمَصِيرُ﴾ [سُورَةَ لُقْمَانَ/14].\nيَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يُطِيعَ وَالِدَيْهِ فِى غَيْرِ مَعْصِيَةِ اللَّهِ.\nيَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يُعَامِلَ وَالِدَيْهِ مُعَامَلَةً حَسَنَةً.\nيَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يَتَأَدَّبَ مَعَ وَالِدَيْهِ فَلا يَرْفَعُ صَوْتَهُ بِحَضْرَتِهِمَا.\n\nالدَّرْسُ الْخَامِسُ\nعُقُوقُ الْوَالِدَيْنِ\n\nقَالَ اللَّهُ تَعَالَى ﴿فَلا تَقُلْ لَهُمَا أُفٍّ وَلا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيـمًا﴾ [سُورَةَ الإِسْرَاءِ/23].\nيَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يَتَجَنَّبَ كُلَّ مَا يُؤْذِى وَالِدَيْهِ.\nمَنْ يُعَامِلُ وَالِدَيْهِ مُعَامَلَةً سَيِّئَةً وَيُؤْذِيهِمَا أَذًى شَدِيدًا يَكُونُ عَاقًّا لَهُمَا.\nوَالعَاقُّ لِوَالِدَيْهِ لا يَكُونُ عِنْدَ اللَّهِ مِنَ الْمُتَّقِينَ الصَّالِحِينَ.\nمَنْ بَرَّ وَالِدَيْهِ تَكُونُ عَاقِبَتُهُ حَمِيدَةً. \nعَلَيْكُمْ بِبِرِّ الْوَالِدَيْنِ فَإِنَّهُ بَرَكَةٌ فِى الدُّنْيَا وَالآخِرَةِ.\n\n"},{"id":"part3-section1","partIndex":3,"partName":"الجزء الثالث","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّالِثُ"],"title":"فَصْلُ الْعَقَائِدِ","blocks":[{"type":"p","text":"فَصْلُ الْعَقَائِدِ"},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"الإِيـمَانُ بِاللَّهِ وَرَسُولِهِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ ءَامَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾ [سُورَةَ الْحُجُرَاتِ/15]."},{"type":"p","text":"فَيَجِبُ الإِيـمَانُ وَهُوَ التَّصْدِيقُ الْجَازِمُ بِالْقَلْبِ بِوُجُودِ اللَّهِ تَعَالَى فِى الأَزَلِ قَبْلَ كُلِّ شَىْءٍ وَأَنَّهُ لا أَحَدَ يَسْتَحِقُّ أَنْ يُعْبَدَ إِلَّا هُوَ وَأَنَّهُ خَالِقُ الْمَوْجُودَاتِ كُلِّهَا."},{"type":"p","text":"وَاللَّهُ تَعَالَى مَوْصُوفٌ بِصِفَاتِ الْكَمَالِ اللَّائِقَةِ بِهِ مُنَزَّهٌ عَنْ صِفَاتِ النُّقْصَانِ خَلَقَ الأَمَاكِنَ كُلَّهَا فَلا يَحْتَاجُ إِلَيْهَا مَوْجُودٌ بِلا مَكَانٍ. أَرْسَلَ الأَنْبِيَاءَ وَالرُّسُلَ بِدِينِ الإِسْلامِ لِهِدَايَةِ النَّاسِ أَوَّلُهُمْ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ وَءَاخِرُهُمْ سَيِّدُنَا مُحَمَّدٌ ﷺ وَأَنْزَلَ عَلَى بَعْضِهِمْ كُتُبًا تُسَمَّى الْكُتُبَ السَّمَاوِيَّةَ."},{"type":"p","text":"وَيَجِبُ الإِيـمَانُ أَيْضًا بِمَا جَاءَ عَنْ سَيِّدِنَا مُحَمَّدٍ ﷺ وَبِمَا أَخْبَرَ بِهِ مِنْ أُمُورِ الْمُسْتَقْبَلِ مِمَّا يَحْصُلُ فِى الدُّنْيَا وَفِى الآخِرَةِ وَأَنَّهُ مُرْسَلٌ إِلَى كُلِّ الْعَالَمِينَ أَىِ الإِنْسِ وَالْجِنِّ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ  "},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى وُجُوبِ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ."},{"type":"p","text":"     (2) مَا هُوَ الإِيـمَانُ."},{"type":"p","text":"     (3) لِمَ أَرْسَلَ اللَّهُ الأَنْبِيَاءَ وَالرُّسُلَ."},{"type":"p","text":"     (4) مَنْ هُوَ أَوَّلُ الأَنْبِيَاءِ وَمَنْ هُوَ ءَاخِرُهُمْ."},{"type":"p","text":"     (5) مَاذَا أَنْزَلَ اللَّهُ عَلَى بَعْضِ الأَنْبِيَاءِ."},{"type":"p","text":"     (6) رَسُولُ اللَّهِ مُحَمَّدٌ لِمَنْ هُوَ مُرْسَلٌ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"الإِسْلامُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَمَنْ يَبْتَغِ غَيْرَ الإِسْلامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ﴾ [سُورَةَ ءَالِ عِمْرَان/85]."},{"type":"p","text":"الإِسْلامُ هُوَ الدِّينُ الَّذِى رَضِيَهُ اللَّهُ لِعِبَادِهِ وَأَمَرَنَا بِاتِّبَاعِهِ."},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »بُنِىَ الإِسْلامُ عَلَى خَمْسٍ شَهَادَةِ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَإِقَامِ الصَّلاةِ وَإِيتَاءِ الزَّكَاةِ وَحَجِّ الْبَيْتِ وَصَوْمِ رَمَضَانَ« [رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ]."},{"type":"p","text":"الإِسْلامُ وَالإِيـمَانُ مُتَلازِمَانِ"},{"type":"p","text":"قَالَ الإِمَامُ أَبُو حَنِيفَةَ »لا يَكُونُ إِيـمَانٌ بِلا إِسْلامٍ وَلا إِسْلامٌ بِلا إِيـمَانٍ فَهُمَا كَالظَّهْرِ مَعَ الْبَطْنِ«."},{"type":"p","text":"وَالإِسْلامُ وَالإِيـمَانُ هُمَا الإِقْرَارُ بِاللِّسَانِ مَعَ التَّصْدِيقِ بِالْقَلْبِ بِشَهَادَةِ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":"ثُمَّ لا يَكُونُ الْمُسْلِمُ كَامِلَ الإِيـمَانِ إِلَّا بِأَدَاءِ الْوَاجِبَاتِ وَاجْتِنَابِ الْمُحَرَّمَاتِ. "},{"type":"p","text":"وَأَمَّا مَنْ ءَامَنَ بِاللَّهِ وَرَسُولِهِ وَارْتَكَبَ كَبَائِرَ الذُّنُوبِ فَيُسَمَّى مُسْلِمًا عَاصِيًا أَوْ مُؤْمِنًا عَاصِيًا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى صِحَّةِ دِينِ الإِسْلامِ."},{"type":"p","text":"     (2) مَا هُوَ دِينُ الإِسْلامِ."},{"type":"p","text":"     (3) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى بَيَانِ أَعْظَمِ أُمُورِ الإِسْلامِ."},{"type":"p","text":"     (4) مَاذَا قَالَ الإِمَامُ أَبُو حَنِيفَةَ عَنِ الإِيـمَانِ وَالإِسْلامِ."},{"type":"p","text":"     (5) مَا مَعْنَى الإِسْلامِ وَالإِيـمَانِ."},{"type":"p","text":"     (6) كَيْفَ يَكُونُ الْمُسْلِمُ كَامِلَ الإِيـمَانِ."},{"type":"p","text":"     (7) مَاذَا يُسَمَّى الْمُسْلِمُ الَّذِى يَرْتَكِبُ كَبَائِرَ الذُّنُوبِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿فَاعْلَمْ أَنَّهُ لا إِلَهَ إِلَّا اللَّهُ﴾ [سُورَةَ مُحَمَّدٍ/19]."},{"type":"p","text":"إِنَّ اللَّهَ عَزَّ وَجَلَّ مَوْصُوفٌ بِالْوَحْدَانِيَّةِ فَهُوَ وَاحِدٌ لا شَرِيكَ لَهُ وَهُوَ مَوْجُودٌ لا شَكَّ فِى وُجُودِهِ لا بِدَايَةَ لَهُ وَلا نِهَايَةَ وَهُوَ الإِلَهُ الَّذِى يَسْتَحِقُّ الْعِبَادَةَ وَمَا سِوَاهُ لا يَسْتَحِقُّ الْعِبَادَةَ وَاللَّهُ تَعَالَى لا يَحْتَاجُ إِلَى الْمَخْلُوقَاتِ وَكُلُّ الْمَخْلُوقَاتِ تَحْتَاجُ إِلَى اللَّهِ فَلا خَالِقَ لِهَذَا الْعَالَمِ غَيْرُهُ وَلا رَازِقَ عَلَى الْحَقِيقَةِ سِوَاهُ وَلا إِلَهَ إِلَّا هُوَ سُبْحَانَهُ وَتَعَالَى."},{"type":"p","text":"وَاللَّهُ سُبْحَانَهُ وَتَعَالَى مَوْصُوفٌ بِصِفَاتِ الْكَمَالِ الَّتِى تَلِيْقُ بِهِ كَالْعِلْمِ وَالْقُدْرَةِ وَالإِرَادَةِ مُنَزَّهٌ عَنْ صِفَاتِ النُّقْصَانِ كَالْجَهْلِ وَالْعَجْزِ وَالْمَكَانِ وَالْجِهَةِ."},{"type":"p","text":"قَالَ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾ [سُورَةَ الشُّورَى/11]."},{"type":"p","text":"وَقَالَ الإِمَامُ أَحْمَدُ بْنُ حَنْبَلٍ وَذُو النُّونِ الْمِصْرِىُّ »مَهْمَا تَصَوَّرْتَ بِبَالِكَ فَاللَّهُ بِخِلافِ ذَلِكَ«."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا بَيَانُ وَحْدَانِيَّةِ اللَّهِ."},{"type":"p","text":"     (2) مَا مَعْنَى اللَّهُ مَوْصُوفٌ بِالْوَحْدَانِيَّةِ."},{"type":"p","text":"     (3) اذْكُرْ بَعْضَ الصِّفَاتِ الَّتِى يُوْصَفُ اللَّهُ بِهَا."},{"type":"p","text":"     (4) اذْكُرْ ءَايَةً قُرْءَانِيَّةً فِيهَا تَنْزِيهُ اللَّهِ عَنِ الشَّبِيهِ."},{"type":"p","text":"     (5) مَاذَا قَالَ أَحْمَدُ بنُ حَنْبَلٍ وَذُو النُّونِ الْمِصْرِىُّ فِى تَنْزِيهِ اللَّهِ عَنْ مُشَابَهَةِ الْخَلْقِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"أَفْضَلُ الأَعْمَالِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"إِنَّ أَفْضَلَ عَمَلٍ يَقُومُ بِهِ الإِنْسَانُ هُوَ الإِيـمَانُ بِاللَّهِ وَرَسُولِهِ مُحَمَّدٍ ﷺ وَأَمَّا مَنْ لَمْ يُؤْمِنْ بِاللَّهِ وَرَسُولِهِ فَهُوَ كَافِرٌ وَقَدْ أَعَدَّ اللَّهُ لَهُ عَذَابًا أَلِيمًا فِى نَارِ جَهَنَّمَ."},{"type":"p","text":"وَالْكَافِرُ لا تُقْبَلُ أَعْمَالُهُ عِنْدَ اللَّهِ تَبَارَكَ وَتَعَالَى."},{"type":"p","text":"فَإِذَا دَفَعَ الْكَافِرُ بَعْضَ مَالِهِ إِلَى الْفُقَرَاءِ وَالْمُحْتَاجِينَ أَوْ سَاعَدَ الْيَتَامَى وَالأَرَامِلَ فَإِنَّ اللَّهَ لا يُثِيبُهُ عَلَى ذَلِكَ يَوْمَ الْقِيَامَةِ لِأَنَّ كُلَّ الأَعْمَالِ الصَّالِحَةِ الَّتِى يَعْمَلُهَا الإِنْسَانُ كَالصَّلاةِ وَالصِّيَامِ وَالْحَجِّ وَالزَّكَاةِ لا تَكُونُ مَقْبُولَةً عِنْدَ اللَّهِ بِدُونِ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ يَقُولُ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿وَمَنْ يَعْمَلْ مِنَ الصَّالِحَاتِ مِنْ ذَكَرٍ أَوْ أُنْثَى وَهُوَ مُؤْمِنٌ فَأُولَئِكَ يَدْخُلُونَ الْجَنَّةَ وَلا يُظْلَمُونَ نَقِيرًا﴾ [سُورَةَ النِّسَاءِ/124]."},{"type":"p","text":"وَالْكُفْرُ هُوَ أَكْبَرُ الذُّنُوبِ وَهُوَ شَرٌّ خَطِيرٌ لِأَنَّ مَنْ مَاتَ عَلَيْهِ دَخَلَ النَّارَ وَخُلِّدَ فِيهَا. "},{"type":"p","text":"وَأَمَّا الإِيـمَانُ فَهُوَ نِعْمَةٌ عَظِيمَةٌ لِأَنَّ مَنْ مَاتَ مُؤْمِنًا لا بُدَّ أَنْ يَدْخُلَ الْجَنَّةَ وَيُخَلَّدَ فِيهَا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ "},{"type":"p","text":"     (1) اذْكُرْ حَدِيثَ أَفْضَلِ الأَعْمَالِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (2) مَا هُوَ أَفْضَلُ عَمَلٍ يَقُومُ بِهِ الإِنْسَانُ."},{"type":"p","text":"     (3) مَنْ لَمْ يُؤْمِنْ بِاللَّهِ وَرَسُولِهِ مَاذَا يُسَمَّى."},{"type":"p","text":"     (4) مَاذَا أَعَدَّ اللَّهُ لِلْكَافِرِ."},{"type":"p","text":"     (5) أَعْمَالُ مَنْ لا تُقْبَلُ عِنْدَ اللَّهِ تَعَالَى."},{"type":"p","text":"     (6) مَا هُوَ الْكُفْرُ وَمَا هُوَ مَصِيرُ مَنْ مَاتَ عَلَيْهِ."},{"type":"p","text":"     (7) مَا هُوَ مَصِيرُ مَنْ مَاتَ مُؤْمِنًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"الأَنْبِيَاءُ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »أَفْضَلُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ قَبْلِى لا إِلَهَ إِلَّا اللَّهُ« رَوَاهُ مَالِكٌ وَالتِّرْمِذِىُّ."},{"type":"p","text":"لَقَدْ أَرْسَلَ اللَّهُ عَزَّ وَجَلَّ الأَنْبِيَاءَ وَالرُّسُلَ بِعَقِيدَةِ التَّوْحِيدِ وَدِينِ الْحَقِّ أَىْ دِينِ الإِسْلامِ، وَالإِسْلامُ هُوَ الدِّينُ الَّذِى أَمَرَنَا اللَّهُ بِاتِّبَاعِهِ وَلا دِينَ صَحِيحٌ سِوَاهُ فَجَمِيعُ الأَنْبِيَاءِ كَانُوا عَلَى دِينِ الإِسْلامِ."},{"type":"p","text":"وَكُلُّ الأَنْبِيَاءِ كَانُوا يَعْبُدُونَ اللَّهَ تَعَالَى لَمْ يَعْبُدُوا فِى حَيَاتِهِمْ صَنَمًا وَلا شَمْسًا وَلا كَوْكَبًا مِنْ أَوَّلِهِمْ ءَادَمَ عَلَيْهِ السَّلامُ إِلَى خَاتَمِهِمْ مُحَمَّدٍ ﷺ وَعَلَى سَائِرِ إِخْوَانِهِ النَّبِيِّينَ. كُلُّ الأَنْبِيَاءِ قَالُوا لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"اللَّهُمَّ تَوَفَّنَا عَلَى الإِيـمَانِ وَاجْعَلْنَا مِنْ أَهْلِ الْجَنَّةِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى بَيَانِ عَقِيدَةِ الأَنْبِيَاءِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (2) بِمَ أَرْسَلَ اللَّهُ عَزَّ وَجَلَّ الأَنْبِيَاءَ وَالرُّسُلَ."},{"type":"p","text":"     (3) عَلَى أَىِّ دِينٍ كَانَ الأَنْبِيَاءُ."},{"type":"p","text":"     (4) مَاذَا قَالَ كُلُّ الأَنْبِيَاءِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"صِفَاتُ الأَنْبِيَاءِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَكُلًّا فَضَّلْنَا عَلَى الْعَالَمِينَ﴾ [سُورَةَ الأَنْعَامِ/86]."},{"type":"p","text":"خَلَقَ اللَّهُ الأَنْبِيَاءَ وَجَعَلَهُمْ أَفْضَلَ الْمَخْلُوقَاتِ فَهُمْ أَفْضَلُ مِنَ الْمَلائِكَةِ وَمِنْ سَائِرِ الْبَشَرِ."},{"type":"p","text":"وَخَصَّهُمْ بِالأَخْلاقِ الْحَسَنَةِ وَالصِّفَاتِ الْحَمِيدَةِ فَهُمْ لا يَكْذِبُونَ وَلا يَغُشُّونَ وَلا يَسْرِقُونَ وَلا يَشْرَبُونَ الْخَمْرَ وَلا يَقَعُونَ فِى الْكُفْرِ."},{"type":"p","text":"وَالأَنْبِيَاءُ هُمْ أَجْمَلُ خَلْقِ اللَّهِ مِنْ ءَادَمَ عَلَيْهِ السَّلامُ إِلَى مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِمْ وَسَلَّمَ."},{"type":"p","text":"وَالْمُسْلِمُ لا يَعْتَقِدُ أَنَّ أَصْلَ الإِنْسَانِ قِرْدٌ لِأَنَّ سَيِّدَنَا ءَادَمَ عَلَيْهِ السَّلامُ هُوَ أَوَّلُ الْبَشَرِ وَقَدْ كَانَ جَمِيلَ الشَّكْلِ حَسَنَ الْوَجْهِ حَسَنَ الصَّوْتِ وَكَانَ يَتَكَلَّمُ بِكَلامٍ وَاضِحٍ مَفْهُومٍ."},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »مَا بَعَثَ اللَّهُ نَبِيًّا إِلَّا حَسَنَ الْوَجْهِ حَسَنَ الصَّوْتِ وَإِنَّ نَبِيَّكُمْ أَحْسَنُهُمْ وَجْهًا وَأَحْسَنُهُمْ صَوْتًا« رَوَاهُ الإِمَامُ أَحْمَدُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى تَفْضِيلِ الأَنْبِيَاءِ."},{"type":"p","text":"     (2) اذْكُرْ بَعْضَ صِفَاتِ الأَنْبِيَاءِ."},{"type":"p","text":"     (3) مَنْ هُمْ أَجْمَلُ خَلْقِ اللَّهِ."},{"type":"p","text":"     (4) كَيْفَ كَانَ سَيِّدُنَا ءَادَمُ."},{"type":"p","text":"     (5) مَنْ هُوَ أَوَّلُ الْبَشَرِ وَكَيْفَ كَانَ يَتَكَلَّمُ."},{"type":"p","text":"     (6) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ يَدُلُّ عَلَى جَمَالِ الأَنْبِيَاءِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"مُحَمَّدٌ رَسُولُ اللَّهِ ﷺ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ﴾ [سُورَةَ الأَنْبِيَاءِ/107]."},{"type":"p","text":"إِنَّ اللَّهَ سُبْحَانَهُ وَتَعَالَى أَرْسَلَ سَيِّدَنَا مُحَمَّدًا ﷺ إِلَى جَمِيعِ النَّاسِ لِيَدْعُوَهُمْ إِلَى تَوْحِيدِ اللَّهِ وَعِبَادَتِهِ وَإِلَى تَرْكِ عِبَادَةِ الأَصْنَامِ الَّتِى لا تَضُرُّ وَلا تَنْفَعُ وَلِيُخْرِجَ النَّاسَ مِنْ ظُلُمَاتِ الْكُفْرِ إِلَى نُورِ الإِيـمَانِ."},{"type":"p","text":"لَقَدْ أَمَرَهُمْ رَسُولُ اللَّهِ ﷺ بِأَنْ يَشْهَدُوا أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَأَنْ يُؤَدُّوا الْوَاجِبَاتِ وَيَجْتَنِبُوا الْمُحَرَّمَاتِ وَأَخْبَرَهُمْ أَنَّ مَنْ مَاتَ عَلَى الإِيـمَانِ يَدْخُلُ الْجَنَّةَ خَالِدًا فِيهَا وَأَنَّ مَنْ مَاتَ عَلَى الْكُفْرِ يَدْخُلُ النَّارَ خَالِدًا فِيهَا."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ"},{"type":"p","text":"اللَّهُمَّ إِنِّى أَصْبَحْتُ وَيَقُولُ عِنْدَ الْمَسَاءِ اللَّهُمَّ إِنِّى أَمْسَيْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلائِكَتَكَ وَجَمِيعَ خَلْقِكَ أَنَّكَ أَنْتَ اللَّهُ لا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لا شَرِيكَ لَكَ وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) لِمَنْ أَرْسَلَ اللَّهُ سَيِّدَنَا مُحَمَّدًا ﷺ."},{"type":"p","text":"     (2) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى ذَلِكَ."},{"type":"p","text":"     (3) بِمَ أَمَرَ رَسُولُ اللَّهِ النَّاسَ."},{"type":"p","text":"     (4) وَمَاذَا أَخْبَرَهُمْ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"الْمَلائِكَةُ الْكِرَامُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى عَنِ الْمَلائِكَةِ ﴿لا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ﴾ [سُورَةَ التَّحْرِيمِ/6]. "},{"type":"p","text":"الْمَلائِكَةُ أَجْسَامٌ نُورَانِيَّةٌ خَلَقَهُمُ اللَّهُ مِنْ نُورٍ لَيْسُوا ذُكُورًا وَلا إِنَاثًا لا يَأْكُلُونَ وَلا يَشْرَبُونَ وَلا يَنَامُونَ يُطِيعُونَ اللَّهَ مَا أَمَرَهُمْ وَكُلُّهُمْ مُؤْمِنُونَ بِاللَّهِ أَتْقِيَاءُ صَالِحُونَ."},{"type":"p","text":"وَالْمَلائِكَةُ أَكْثَرُ عَدَدًا مِنَ الْبَشَرِ وَمَسْكَنُهُمُ السَّمَاءُ وَهُمْ مُكَلَّفُونَ بِوَظَائِفَ مُخْتَلِفَةٍ."},{"type":"p","text":"وَرُؤَسَاءُ الْمَلائِكَةِ هُمْ جِبْرِيلُ وَمِيكَائِيلُ وَإِسْرَافِيلُ وَعَزْرَائِيلُ وَحَمَلَةُ الْعَرْشِ فَسَيِّدُنَا جِبْرِيلُ عَلَيْهِ السَّلامُ هُوَ أَفْضَلُ الْمَلائِكَةِ وَمِنْ جُمْلَةِ وَظَائِفِهِ النُّزُولُ بِالْوَحْىِ عَلَى الأَنْبِيَاءِ وَسَيِّدُنا عَزْرَائِيلُ عَلَيْهِ السَّلامُ مُكَلَّفٌ بِقَبْضِ الأَرْوَاحِ وَسَيِّدُنَا مِيكَائِيلُ عَلَيْهِ السَّلامُ مُكَلَّفٌ بِالْمَطَرِ وَالزَّرْعِ وَسَيِّدُنَا إِسْرَافِيلُ عَلَيْهِ السَّلامُ مُكَلَّفٌ بِالنَّفْخِ فِى الصُّورِ."},{"type":"p","text":"الْمُسْلِمُ يُحِبُّ الْمَلائِكَةَ جَمِيعَهُمْ وَلا يَسْتَهْزِئُ بِهِمْ وَلا يَشْتِمُهُمْ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الْمَلائِكَةِ."},{"type":"p","text":"     (2) مَنْ هُمُ الْمَلائِكَةُ وَمِمَّ خَلَقَهُمُ اللَّهُ."},{"type":"p","text":"     (3) مَنْ أَكْثَرُ عَدَدًا الْمَلائِكَةُ أَمِ الْبَشَرُ وَأَيْنَ مَسْكَنُ الْمَلائِكَةِ."},{"type":"p","text":"     (4) مَنْ هُمْ رُؤَسَاءُ الْمَلائِكَةِ."},{"type":"p","text":"     (5) مَنْ أَفْضَلُ الْمَلائِكَةِ اذْكُرْ بَعْضَ وَظَائِفِهِ."},{"type":"p","text":"     (6) مَنْ هُوَ الْمَلَكُ الْمُكَلَّفُ بِقَبْضِ الأَرْوَاحِ."},{"type":"p","text":"     (7) مَنْ هُوَ الْمَلَكُ الْمُكَلَّفُ بِالْمَطَرِ وَالزَّرْعِ."},{"type":"p","text":"     (8) مَنْ هُوَ الْمَلَكُ الْمُكَلَّفُ بِالنَّفْخِ فِى الصُّورِ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"الْكُتُبُ السَّمَاوِيـَّــةُ"},{"type":"p","text":""},{"type":"p","text":"إِنَّ اللَّهَ تَعَالَى أَنْزَلَ كُتُبًا سَمَاوِيَّةً عَلَى بَعْضِ الرُّسُلِ لِهِدَايَةِ النَّاسِ وَإِرْشَادِهِمْ لِمَا فِيهِ خَيْرُهُمْ وَسَعَادَتُهُمْ فِى الآخِرَةِ وَعَدَدُ الْكُتُبِ السَّمَاوِيَّةِ كَثِيرٌ وَلَكِنْ أَشْهَرُهَا أَرْبَعَةٌ هِىَ"},{"type":"p","text":"الزَّبُورُ أُنْزِلَ عَلَى سَيِّدِنَا دَاوُدَ عَلَيْهِ السَّلامُ."},{"type":"p","text":"وَالتَّوْرَاةُ الأَصْلِيَّةُ أُنْزِلَتْ عَلَى سَيِّدِنَا مُوسَى عَلَيْهِ السَّلامُ بِاللُّغَةِ الْعِبْرَانِيَّةِ."},{"type":"p","text":"وَالإِنْجِيلُ الأَصْلِىُّ أُنْزِلَ عَلَى سَيِّدِنَا عِيسَى عَلَيْهِ السَّلامُ بِاللُّغَةِ السُّرْيَانِيَّةِ."},{"type":"p","text":"وَالْقُرْءَانُ أُنْزِلَ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ بِاللُّغَةِ الْعَرَبِيَّةِ وَهُوَ أَفْضَلُ الْكُتُبِ وَءَاخِرُهَا."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ"},{"type":"p","text":"رَبَّنَا لا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ الْكُتُبُ السَّمَاوِيَّةُ."},{"type":"p","text":"     (2) مَا هِىَ أَشْهَرُ الْكُتُبِ السَّمَاوِيَّةِ."},{"type":"p","text":"     (3) عَلَى مَنْ أُنْزِلَ الزَّبُورُ."},{"type":"p","text":"     (4) عَلَى مَنْ أُنْزِلَتِ التَّوْرَاةُ الأَصْلِيَّةُ وَبِأَىِّ لُغَةٍ."},{"type":"p","text":"     (5) عَلَى مَنْ أُنْزِلَ الإِنْجِيلُ الأَصْلِىُّ وَبِأَىِّ لُغَةٍ."},{"type":"p","text":"     (6) عَلَى مَنْ أُنْزِلَ الْقُرْءَانُ وَبِأَىِّ لُغَةٍ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"الْيَوْمُ الآخِـــــرُ"},{"type":"p","text":""},{"type":"p","text":"الْيَوْمُ الآخِرُ هُوَ يَوْمُ الْقِيَامَةِ وَيَبْدَأُ مِنْ خُرُوجِ النَّاسِ مِنْ قُبُورِهِمْ بَعْدَ أَنْ يَنْفُخَ سَيِّدُنَا إِسْرَافِيلُ بِالصُّورِ."},{"type":"p","text":"وَالأَجْسَادُ الَّتِى أَكَلَهَا التُّرَابُ يُعِيدُهَا اللَّهُ تَعَالَى كَمَا كَانَتْ وَيُعِيدُ الرُّوحَ إِلَيْهَا ثُمَّ يُجْمَعُونَ لِلْحِسَابِ عَلَى أَرْضٍ غَيْرِ هَذِهِ الأَرْضِ لا جِبَالَ فِيهَا وَلا بِحَارَ تُسَمَّى الأَرْضَ الْمُبَدَّلَةَ فَتُوزَنُ أَعْمَالُهُمْ فِى الْمِيزَانِ الَّذِى لَهُ كَفَّتَانِ كَفَّةٌ لِلْحَسَنَاتِ وَكَفَّةٌ لِلسَّيِّئَاتِ وَالْكَافِرُ لَيْسَ لَهُ مِنَ الْحَسَنَاتِ شَىْءٌ ثُمَّ يُدْخِلُ اللَّهُ تَعَالَى الْمُؤْمِنِينَ الأَتْقِيَاءَ الْجَنَّةَ بِلا عَذَابٍ."},{"type":"p","text":"أَمَّا الْمُؤْمِنُونَ الْعُصَاةُ فَقِسْمٌ مِنْهُمْ يُسَامِحُهُمُ اللَّهُ وَيُدْخِلُهُمُ الْجَنَّةَ بِلا عَذَابٍ وَقِسْمٌ مِنْهُمْ يُعَذِّبُهُمُ اللَّهُ فِى النَّارِ ثُمَّ يُدْخِلُهُمُ الجَنَّةَ."},{"type":"p","text":"وَأَمَّا الْكُفَّارُ فَإِنَّهُمْ لا يَدْخُلُونَ الْجَنَّةَ بِالْمَرَّةِ إِنَّمَا يُدْخِلُهُمُ اللَّهُ النَّارَ وَيُخَلَّدُونَ فِيهَا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ الْيَوْمُ الآخِرُ."},{"type":"p","text":"     (2) مَتَى يَبْدَأُ الْيَوْمُ الآخِرُ."},{"type":"p","text":"     (3) مَاذَا يَحْصُلُ لِلأَجْسَادِ الَّتِى أَكَلَهَا التُّرَابُ."},{"type":"p","text":"     (4) لِمَ يُجْمَعُ النَّاسُ يَوْمَ الِقِيَامَةِ وَأَيْنَ يُجْمَعُونَ."},{"type":"p","text":"     (5) مَاذَا تُسَمَّى الأَرْضُ الَّتِى يُحْشَرُ عَلَيْهَا النَّاسُ."},{"type":"p","text":"     (6) بِمَ تُوزَنُ أَعْمَالُ الْعِبَادِ."},{"type":"p","text":"     (7) مَنْ يَدْخُلُ الْجَنَّةَ بِلا عَذَابٍ."},{"type":"p","text":"     (8) مَاذَا يَحْصُلُ لِلْمُؤْمِنِينَ الْعُصَاةِ يَوْمَ الْقِيَامَةِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"الإِيـمَانُ بِالْقَدَرِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾ [سُورَةَ الْقَمَرِ/49]."},{"type":"p","text":"إنَّ اللَّهَ تَعَالَى خَلَقَ الْمَخْلُوقَاتِ كُلَّهَا فَمِنْهَا الْحَسَنُ وَالْقَبِيحُ وَالْحُلْوُ وَالْمُرُّ وَالْخَيْرُ وَالشَّرُّ وَخَلَقَ الإِنْسَانَ وَخَلَقَ أَعْمَالَهُ فَالصَّالِحُ مِنْ هَذِهِ الأَعْمَالِ يَكُونُ بِمَحَبَّةِ اللَّهِ وَخَلْقِهِ وَرِضَاهُ."},{"type":"p","text":"وَالسَّيِّئُ مِنْ هَذِهِ الأَعْمَالِ يَكُونُ بِخَلْقِهِ وَلَيْسَ بِمَحَبَّتِهِ وَرِضَاهُ."},{"type":"p","text":"وَجَمِيعُ مَا يَحْصُلُ فَى هَذَا الْعَالَمِ مِنْ خَيْرٍ وَشَرٍّ يَحْصُلُ بِمَشِيئَةِ اللَّهِ تَعَالَى وَتَقْدِيرِهِ وَعِلْمِهِ."},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »مَا شَاءَ اللَّهُ كَانَ وَمَا لَمْ يَشَأْ لَمْ يَكُنْ« رَوَاهُ أَبُو دَاوُدَ."},{"type":"p","text":"فَكُلُّ مَا أَرَادَ اللَّهُ وَجُودَهُ لا بُدَّ أَنْ يُوجَدَ وَمَا لَمْ يُرِدْ وُجُودَهُ فَلا يُوجَدُ أَبَدًا."},{"type":"p","text":" "},{"type":"p","text":"لِلْحِفْظِ غَيْبـًــا"},{"type":"table","rows":[["الطَّاعَاتُ تَحْصُلُ مِنَ الْعَبْدِ","الْمَعَاصِى تَحْصُلُ مِنَ الْعَبْدِ"],["بِمَشِيئَةِ اللَّهِ","بِمَشِيئَةِ اللَّهِ"],["وَعِلْمِ اللَّهِ","وَعِلْمِ اللَّهِ"],["وَتَقْدِيرِ اللَّهِ","وَتَقْدِيرِ اللَّهِ"],["وَبِخَلْقِ اللَّهِ","وَبِخَلْقِ اللَّهِ"],["وَبِأَمْرِ اللَّهِ","لا بِأَمْرِ اللَّهِ"],["وَبِمَحَبَّتِهِ","وَلا بِمَحَبَّتِهِ"],["وَرِضَاهُ","وَلا بِرِضَاهُ"]]},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الإِيـمَانِ بِالْقَدَرِ."},{"type":"p","text":"     (2) مَا مَعْنَى الإِيـمَانِ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ."},{"type":"p","text":"     (3) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ ﷺ عَنِ الْمَشِيئَةِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (4) مَا مَعْنَى هَذَا الْحَدِيثِ."},{"type":"p","text":""}],"paragraphCount":161,"wordCount":1756,"readingMinutes":10,"description":"المحتوى الكامل لـ فَصْلُ الْعَقَائِدِ من الجزء الثالث، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّالِثُ فَصْلُ الْعَقَائِدِ فَصْلُ الْعَقَائِدِ\n\nالدَّرْسُ الأَوَّلُ\nالإِيـمَانُ بِاللَّهِ وَرَسُولِهِ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ ءَامَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾ [سُورَةَ الْحُجُرَاتِ/15].\nفَيَجِبُ الإِيـمَانُ وَهُوَ التَّصْدِيقُ الْجَازِمُ بِالْقَلْبِ بِوُجُودِ اللَّهِ تَعَالَى فِى الأَزَلِ قَبْلَ كُلِّ شَىْءٍ وَأَنَّهُ لا أَحَدَ يَسْتَحِقُّ أَنْ يُعْبَدَ إِلَّا هُوَ وَأَنَّهُ خَالِقُ الْمَوْجُودَاتِ كُلِّهَا.\nوَاللَّهُ تَعَالَى مَوْصُوفٌ بِصِفَاتِ الْكَمَالِ اللَّائِقَةِ بِهِ مُنَزَّهٌ عَنْ صِفَاتِ النُّقْصَانِ خَلَقَ الأَمَاكِنَ كُلَّهَا فَلا يَحْتَاجُ إِلَيْهَا مَوْجُودٌ بِلا مَكَانٍ. أَرْسَلَ الأَنْبِيَاءَ وَالرُّسُلَ بِدِينِ الإِسْلامِ لِهِدَايَةِ النَّاسِ أَوَّلُهُمْ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ وَءَاخِرُهُمْ سَيِّدُنَا مُحَمَّدٌ ﷺ وَأَنْزَلَ عَلَى بَعْضِهِمْ كُتُبًا تُسَمَّى الْكُتُبَ السَّمَاوِيَّةَ.\nوَيَجِبُ الإِيـمَانُ أَيْضًا بِمَا جَاءَ عَنْ سَيِّدِنَا مُحَمَّدٍ ﷺ وَبِمَا أَخْبَرَ بِهِ مِنْ أُمُورِ الْمُسْتَقْبَلِ مِمَّا يَحْصُلُ فِى الدُّنْيَا وَفِى الآخِرَةِ وَأَنَّهُ مُرْسَلٌ إِلَى كُلِّ الْعَالَمِينَ أَىِ الإِنْسِ وَالْجِنِّ.\n\n     أَسْئِلَةٌ  \n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى وُجُوبِ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ.\n     (2) مَا هُوَ الإِيـمَانُ.\n     (3) لِمَ أَرْسَلَ اللَّهُ الأَنْبِيَاءَ وَالرُّسُلَ.\n     (4) مَنْ هُوَ أَوَّلُ الأَنْبِيَاءِ وَمَنْ هُوَ ءَاخِرُهُمْ.\n     (5) مَاذَا أَنْزَلَ اللَّهُ عَلَى بَعْضِ الأَنْبِيَاءِ.\n     (6) رَسُولُ اللَّهِ مُحَمَّدٌ لِمَنْ هُوَ مُرْسَلٌ.\n\nالدَّرْسُ الثَّانِى\nالإِسْلامُ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَمَنْ يَبْتَغِ غَيْرَ الإِسْلامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ﴾ [سُورَةَ ءَالِ عِمْرَان/85].\nالإِسْلامُ هُوَ الدِّينُ الَّذِى رَضِيَهُ اللَّهُ لِعِبَادِهِ وَأَمَرَنَا بِاتِّبَاعِهِ.\nقَالَ رَسُولُ اللَّهِ ﷺ »بُنِىَ الإِسْلامُ عَلَى خَمْسٍ شَهَادَةِ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَإِقَامِ الصَّلاةِ وَإِيتَاءِ الزَّكَاةِ وَحَجِّ الْبَيْتِ وَصَوْمِ رَمَضَانَ« [رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ].\nالإِسْلامُ وَالإِيـمَانُ مُتَلازِمَانِ\nقَالَ الإِمَامُ أَبُو حَنِيفَةَ »لا يَكُونُ إِيـمَانٌ بِلا إِسْلامٍ وَلا إِسْلامٌ بِلا إِيـمَانٍ فَهُمَا كَالظَّهْرِ مَعَ الْبَطْنِ«.\nوَالإِسْلامُ وَالإِيـمَانُ هُمَا الإِقْرَارُ بِاللِّسَانِ مَعَ التَّصْدِيقِ بِالْقَلْبِ بِشَهَادَةِ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\nثُمَّ لا يَكُونُ الْمُسْلِمُ كَامِلَ الإِيـمَانِ إِلَّا بِأَدَاءِ الْوَاجِبَاتِ وَاجْتِنَابِ الْمُحَرَّمَاتِ. \nوَأَمَّا مَنْ ءَامَنَ بِاللَّهِ وَرَسُولِهِ وَارْتَكَبَ كَبَائِرَ الذُّنُوبِ فَيُسَمَّى مُسْلِمًا عَاصِيًا أَوْ مُؤْمِنًا عَاصِيًا.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى صِحَّةِ دِينِ الإِسْلامِ.\n     (2) مَا هُوَ دِينُ الإِسْلامِ.\n     (3) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى بَيَانِ أَعْظَمِ أُمُورِ الإِسْلامِ.\n     (4) مَاذَا قَالَ الإِمَامُ أَبُو حَنِيفَةَ عَنِ الإِيـمَانِ وَالإِسْلامِ.\n     (5) مَا مَعْنَى الإِسْلامِ وَالإِيـمَانِ.\n     (6) كَيْفَ يَكُونُ الْمُسْلِمُ كَامِلَ الإِيـمَانِ.\n     (7) مَاذَا يُسَمَّى الْمُسْلِمُ الَّذِى يَرْتَكِبُ كَبَائِرَ الذُّنُوبِ.\n\nالدَّرْسُ الثَّالِثُ\nاللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ\n\nقَالَ اللَّهُ تَعَالَى ﴿فَاعْلَمْ أَنَّهُ لا إِلَهَ إِلَّا اللَّهُ﴾ [سُورَةَ مُحَمَّدٍ/19].\nإِنَّ اللَّهَ عَزَّ وَجَلَّ مَوْصُوفٌ بِالْوَحْدَانِيَّةِ فَهُوَ وَاحِدٌ لا شَرِيكَ لَهُ وَهُوَ مَوْجُودٌ لا شَكَّ فِى وُجُودِهِ لا بِدَايَةَ لَهُ وَلا نِهَايَةَ وَهُوَ الإِلَهُ الَّذِى يَسْتَحِقُّ الْعِبَادَةَ وَمَا سِوَاهُ لا يَسْتَحِقُّ الْعِبَادَةَ وَاللَّهُ تَعَالَى لا يَحْتَاجُ إِلَى الْمَخْلُوقَاتِ وَكُلُّ الْمَخْلُوقَاتِ تَحْتَاجُ إِلَى اللَّهِ فَلا خَالِقَ لِهَذَا الْعَالَمِ غَيْرُهُ وَلا رَازِقَ عَلَى الْحَقِيقَةِ سِوَاهُ وَلا إِلَهَ إِلَّا هُوَ سُبْحَانَهُ وَتَعَالَى.\nوَاللَّهُ سُبْحَانَهُ وَتَعَالَى مَوْصُوفٌ بِصِفَاتِ الْكَمَالِ الَّتِى تَلِيْقُ بِهِ كَالْعِلْمِ وَالْقُدْرَةِ وَالإِرَادَةِ مُنَزَّهٌ عَنْ صِفَاتِ النُّقْصَانِ كَالْجَهْلِ وَالْعَجْزِ وَالْمَكَانِ وَالْجِهَةِ.\nقَالَ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾ [سُورَةَ الشُّورَى/11].\nوَقَالَ الإِمَامُ أَحْمَدُ بْنُ حَنْبَلٍ وَذُو النُّونِ الْمِصْرِىُّ »مَهْمَا تَصَوَّرْتَ بِبَالِكَ فَاللَّهُ بِخِلافِ ذَلِكَ«.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا بَيَانُ وَحْدَانِيَّةِ اللَّهِ.\n     (2) مَا مَعْنَى اللَّهُ مَوْصُوفٌ بِالْوَحْدَانِيَّةِ.\n     (3) اذْكُرْ بَعْضَ الصِّفَاتِ الَّتِى يُوْصَفُ اللَّهُ بِهَا.\n     (4) اذْكُرْ ءَايَةً قُرْءَانِيَّةً فِيهَا تَنْزِيهُ اللَّهِ عَنِ الشَّبِيهِ.\n     (5) مَاذَا قَالَ أَحْمَدُ بنُ حَنْبَلٍ وَذُو النُّونِ الْمِصْرِىُّ فِى تَنْزِيهِ اللَّهِ عَنْ مُشَابَهَةِ الْخَلْقِ.\n\nالدَّرْسُ الرَّابِعُ\nأَفْضَلُ الأَعْمَالِ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ« رَوَاهُ الْبُخَارِىُّ.\nإِنَّ أَفْضَلَ عَمَلٍ يَقُومُ بِهِ الإِنْسَانُ هُوَ الإِيـمَانُ بِاللَّهِ وَرَسُولِهِ مُحَمَّدٍ ﷺ وَأَمَّا مَنْ لَمْ يُؤْمِنْ بِاللَّهِ وَرَسُولِهِ فَهُوَ كَافِرٌ وَقَدْ أَعَدَّ اللَّهُ لَهُ عَذَابًا أَلِيمًا فِى نَارِ جَهَنَّمَ.\nوَالْكَافِرُ لا تُقْبَلُ أَعْمَالُهُ عِنْدَ اللَّهِ تَبَارَكَ وَتَعَالَى.\nفَإِذَا دَفَعَ الْكَافِرُ بَعْضَ مَالِهِ إِلَى الْفُقَرَاءِ وَالْمُحْتَاجِينَ أَوْ سَاعَدَ الْيَتَامَى وَالأَرَامِلَ فَإِنَّ اللَّهَ لا يُثِيبُهُ عَلَى ذَلِكَ يَوْمَ الْقِيَامَةِ لِأَنَّ كُلَّ الأَعْمَالِ الصَّالِحَةِ الَّتِى يَعْمَلُهَا الإِنْسَانُ كَالصَّلاةِ وَالصِّيَامِ وَالْحَجِّ وَالزَّكَاةِ لا تَكُونُ مَقْبُولَةً عِنْدَ اللَّهِ بِدُونِ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ يَقُولُ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿وَمَنْ يَعْمَلْ مِنَ الصَّالِحَاتِ مِنْ ذَكَرٍ أَوْ أُنْثَى وَهُوَ مُؤْمِنٌ فَأُولَئِكَ يَدْخُلُونَ الْجَنَّةَ وَلا يُظْلَمُونَ نَقِيرًا﴾ [سُورَةَ النِّسَاءِ/124].\nوَالْكُفْرُ هُوَ أَكْبَرُ الذُّنُوبِ وَهُوَ شَرٌّ خَطِيرٌ لِأَنَّ مَنْ مَاتَ عَلَيْهِ دَخَلَ النَّارَ وَخُلِّدَ فِيهَا. \nوَأَمَّا الإِيـمَانُ فَهُوَ نِعْمَةٌ عَظِيمَةٌ لِأَنَّ مَنْ مَاتَ مُؤْمِنًا لا بُدَّ أَنْ يَدْخُلَ الْجَنَّةَ وَيُخَلَّدَ فِيهَا.\n\n     أَسْئِلَةٌ \n     (1) اذْكُرْ حَدِيثَ أَفْضَلِ الأَعْمَالِ وَمَنْ رَوَاهُ.\n     (2) مَا هُوَ أَفْضَلُ عَمَلٍ يَقُومُ بِهِ الإِنْسَانُ.\n     (3) مَنْ لَمْ يُؤْمِنْ بِاللَّهِ وَرَسُولِهِ مَاذَا يُسَمَّى.\n     (4) مَاذَا أَعَدَّ اللَّهُ لِلْكَافِرِ.\n     (5) أَعْمَالُ مَنْ لا تُقْبَلُ عِنْدَ اللَّهِ تَعَالَى.\n     (6) مَا هُوَ الْكُفْرُ وَمَا هُوَ مَصِيرُ مَنْ مَاتَ عَلَيْهِ.\n     (7) مَا هُوَ مَصِيرُ مَنْ مَاتَ مُؤْمِنًا.\n\nالدَّرْسُ الْخَامِسُ\nالأَنْبِيَاءُ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »أَفْضَلُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ قَبْلِى لا إِلَهَ إِلَّا اللَّهُ« رَوَاهُ مَالِكٌ وَالتِّرْمِذِىُّ.\nلَقَدْ أَرْسَلَ اللَّهُ عَزَّ وَجَلَّ الأَنْبِيَاءَ وَالرُّسُلَ بِعَقِيدَةِ التَّوْحِيدِ وَدِينِ الْحَقِّ أَىْ دِينِ الإِسْلامِ، وَالإِسْلامُ هُوَ الدِّينُ الَّذِى أَمَرَنَا اللَّهُ بِاتِّبَاعِهِ وَلا دِينَ صَحِيحٌ سِوَاهُ فَجَمِيعُ الأَنْبِيَاءِ كَانُوا عَلَى دِينِ الإِسْلامِ.\nوَكُلُّ الأَنْبِيَاءِ كَانُوا يَعْبُدُونَ اللَّهَ تَعَالَى لَمْ يَعْبُدُوا فِى حَيَاتِهِمْ صَنَمًا وَلا شَمْسًا وَلا كَوْكَبًا مِنْ أَوَّلِهِمْ ءَادَمَ عَلَيْهِ السَّلامُ إِلَى خَاتَمِهِمْ مُحَمَّدٍ ﷺ وَعَلَى سَائِرِ إِخْوَانِهِ النَّبِيِّينَ. كُلُّ الأَنْبِيَاءِ قَالُوا لا إِلَهَ إِلَّا اللَّهُ.\n\nدُعَاءٌ \nاللَّهُمَّ تَوَفَّنَا عَلَى الإِيـمَانِ وَاجْعَلْنَا مِنْ أَهْلِ الْجَنَّةِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى بَيَانِ عَقِيدَةِ الأَنْبِيَاءِ وَمَنْ رَوَاهُ.\n     (2) بِمَ أَرْسَلَ اللَّهُ عَزَّ وَجَلَّ الأَنْبِيَاءَ وَالرُّسُلَ.\n     (3) عَلَى أَىِّ دِينٍ كَانَ الأَنْبِيَاءُ.\n     (4) مَاذَا قَالَ كُلُّ الأَنْبِيَاءِ.\n\nالدَّرْسُ السَّادِسُ\nصِفَاتُ الأَنْبِيَاءِ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَكُلًّا فَضَّلْنَا عَلَى الْعَالَمِينَ﴾ [سُورَةَ الأَنْعَامِ/86].\nخَلَقَ اللَّهُ الأَنْبِيَاءَ وَجَعَلَهُمْ أَفْضَلَ الْمَخْلُوقَاتِ فَهُمْ أَفْضَلُ مِنَ الْمَلائِكَةِ وَمِنْ سَائِرِ الْبَشَرِ.\nوَخَصَّهُمْ بِالأَخْلاقِ الْحَسَنَةِ وَالصِّفَاتِ الْحَمِيدَةِ فَهُمْ لا يَكْذِبُونَ وَلا يَغُشُّونَ وَلا يَسْرِقُونَ وَلا يَشْرَبُونَ الْخَمْرَ وَلا يَقَعُونَ فِى الْكُفْرِ.\nوَالأَنْبِيَاءُ هُمْ أَجْمَلُ خَلْقِ اللَّهِ مِنْ ءَادَمَ عَلَيْهِ السَّلامُ إِلَى مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِمْ وَسَلَّمَ.\nوَالْمُسْلِمُ لا يَعْتَقِدُ أَنَّ أَصْلَ الإِنْسَانِ قِرْدٌ لِأَنَّ سَيِّدَنَا ءَادَمَ عَلَيْهِ السَّلامُ هُوَ أَوَّلُ الْبَشَرِ وَقَدْ كَانَ جَمِيلَ الشَّكْلِ حَسَنَ الْوَجْهِ حَسَنَ الصَّوْتِ وَكَانَ يَتَكَلَّمُ بِكَلامٍ وَاضِحٍ مَفْهُومٍ.\nقَالَ رَسُولُ اللَّهِ ﷺ »مَا بَعَثَ اللَّهُ نَبِيًّا إِلَّا حَسَنَ الْوَجْهِ حَسَنَ الصَّوْتِ وَإِنَّ نَبِيَّكُمْ أَحْسَنُهُمْ وَجْهًا وَأَحْسَنُهُمْ صَوْتًا« رَوَاهُ الإِمَامُ أَحْمَدُ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى تَفْضِيلِ الأَنْبِيَاءِ.\n     (2) اذْكُرْ بَعْضَ صِفَاتِ الأَنْبِيَاءِ.\n     (3) مَنْ هُمْ أَجْمَلُ خَلْقِ اللَّهِ.\n     (4) كَيْفَ كَانَ سَيِّدُنَا ءَادَمُ.\n     (5) مَنْ هُوَ أَوَّلُ الْبَشَرِ وَكَيْفَ كَانَ يَتَكَلَّمُ.\n     (6) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ يَدُلُّ عَلَى جَمَالِ الأَنْبِيَاءِ.\n\nالدَّرْسُ السَّابِعُ\nمُحَمَّدٌ رَسُولُ اللَّهِ ﷺ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ﴾ [سُورَةَ الأَنْبِيَاءِ/107].\nإِنَّ اللَّهَ سُبْحَانَهُ وَتَعَالَى أَرْسَلَ سَيِّدَنَا مُحَمَّدًا ﷺ إِلَى جَمِيعِ النَّاسِ لِيَدْعُوَهُمْ إِلَى تَوْحِيدِ اللَّهِ وَعِبَادَتِهِ وَإِلَى تَرْكِ عِبَادَةِ الأَصْنَامِ الَّتِى لا تَضُرُّ وَلا تَنْفَعُ وَلِيُخْرِجَ النَّاسَ مِنْ ظُلُمَاتِ الْكُفْرِ إِلَى نُورِ الإِيـمَانِ.\nلَقَدْ أَمَرَهُمْ رَسُولُ اللَّهِ ﷺ بِأَنْ يَشْهَدُوا أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَأَنْ يُؤَدُّوا الْوَاجِبَاتِ وَيَجْتَنِبُوا الْمُحَرَّمَاتِ وَأَخْبَرَهُمْ أَنَّ مَنْ مَاتَ عَلَى الإِيـمَانِ يَدْخُلُ الْجَنَّةَ خَالِدًا فِيهَا وَأَنَّ مَنْ مَاتَ عَلَى الْكُفْرِ يَدْخُلُ النَّارَ خَالِدًا فِيهَا.\n\nدُعَاءٌ\nاللَّهُمَّ إِنِّى أَصْبَحْتُ وَيَقُولُ عِنْدَ الْمَسَاءِ اللَّهُمَّ إِنِّى أَمْسَيْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلائِكَتَكَ وَجَمِيعَ خَلْقِكَ أَنَّكَ أَنْتَ اللَّهُ لا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لا شَرِيكَ لَكَ وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.\n\n     أَسْئِلَةٌ\n     (1) لِمَنْ أَرْسَلَ اللَّهُ سَيِّدَنَا مُحَمَّدًا ﷺ.\n     (2) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى ذَلِكَ.\n     (3) بِمَ أَمَرَ رَسُولُ اللَّهِ النَّاسَ.\n     (4) وَمَاذَا أَخْبَرَهُمْ.\n\nالدَّرْسُ الثَّامِنُ\nالْمَلائِكَةُ الْكِرَامُ\n\nقَالَ اللَّهُ تَعَالَى عَنِ الْمَلائِكَةِ ﴿لا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ﴾ [سُورَةَ التَّحْرِيمِ/6]. \nالْمَلائِكَةُ أَجْسَامٌ نُورَانِيَّةٌ خَلَقَهُمُ اللَّهُ مِنْ نُورٍ لَيْسُوا ذُكُورًا وَلا إِنَاثًا لا يَأْكُلُونَ وَلا يَشْرَبُونَ وَلا يَنَامُونَ يُطِيعُونَ اللَّهَ مَا أَمَرَهُمْ وَكُلُّهُمْ مُؤْمِنُونَ بِاللَّهِ أَتْقِيَاءُ صَالِحُونَ.\nوَالْمَلائِكَةُ أَكْثَرُ عَدَدًا مِنَ الْبَشَرِ وَمَسْكَنُهُمُ السَّمَاءُ وَهُمْ مُكَلَّفُونَ بِوَظَائِفَ مُخْتَلِفَةٍ.\nوَرُؤَسَاءُ الْمَلائِكَةِ هُمْ جِبْرِيلُ وَمِيكَائِيلُ وَإِسْرَافِيلُ وَعَزْرَائِيلُ وَحَمَلَةُ الْعَرْشِ فَسَيِّدُنَا جِبْرِيلُ عَلَيْهِ السَّلامُ هُوَ أَفْضَلُ الْمَلائِكَةِ

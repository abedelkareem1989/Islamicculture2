<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f6b50" />
  <meta name="description" content="تطبيق قراءة إسلامية تفاعلي يجمع أجزاء الثقافة الإسلامية في ملف واحد." />
  <title>مكتبة الثقافة الإسلامية</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    :root{
      --emerald:#0f6b50;
      --emerald-2:#16825f;
      --emerald-soft:#e9f5ef;
      --gold:#c79a35;
      --gold-soft:#fff5dc;
      --cream:#fbf7ee;
      --surface:#ffffff;
      --surface-2:#f7f8f7;
      --text:#17322a;
      --muted:#6d7975;
      --line:#e3e9e6;
      --danger:#b54848;
      --shadow:0 14px 40px rgba(18,63,49,.10);
      --shadow-soft:0 8px 22px rgba(18,63,49,.08);
      --radius:22px;
      --reader-size:20px;
      --reader-font:"Cairo",sans-serif;
      --header-h:82px;
    }

    html[data-theme="dark"]{
      --emerald:#27a57e;
      --emerald-2:#35ba90;
      --emerald-soft:#153c31;
      --gold:#e1b85d;
      --gold-soft:#3e3420;
      --cream:#111915;
      --surface:#17231e;
      --surface-2:#1d2a25;
      --text:#eef7f2;
      --muted:#a9b8b2;
      --line:#2c3b35;
      --shadow:0 14px 40px rgba(0,0,0,.28);
      --shadow-soft:0 8px 22px rgba(0,0,0,.20);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:var(--reader-font);
      background:
        radial-gradient(circle at 10% 0%, rgba(199,154,53,.08), transparent 25%),
        radial-gradient(circle at 90% 10%, rgba(15,107,80,.08), transparent 28%),
        var(--cream);
      color:var(--text);
      min-height:100vh;
      transition:background .25s ease,color .25s ease;
    }
    button,input,select{font:inherit}
    button{color:inherit}
    a{color:inherit;text-decoration:none}
    ::selection{background:rgba(199,154,53,.32)}
    .hidden{display:none!important}

    .top-progress{
      position:fixed;top:0;right:0;height:4px;width:0;
      background:linear-gradient(90deg,var(--gold),var(--emerald));
      z-index:1001;transition:width .08s linear;
    }

    .app-header{
      position:sticky;top:0;z-index:1000;
      backdrop-filter:blur(16px);
      background:color-mix(in srgb,var(--surface) 88%, transparent);
      border-bottom:1px solid var(--line);
    }
    .header-inner{
      max-width:1240px;margin:auto;min-height:var(--header-h);
      display:grid;grid-template-columns:auto minmax(280px,1fr) auto;
      align-items:center;gap:24px;padding:14px 22px;
    }
    .brand{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:max-content}
    .brand-mark{
      width:48px;height:48px;border-radius:16px;
      display:grid;place-items:center;font-size:25px;
      background:linear-gradient(145deg,var(--emerald),var(--emerald-2));
      box-shadow:0 9px 22px rgba(15,107,80,.23);
    }
    .brand-text strong{display:block;font-size:16px}
    .brand-text span{display:block;color:var(--muted);font-size:11px;margin-top:2px}

    .search-wrap{position:relative;max-width:610px;width:100%;justify-self:center}
    .search-wrap i{position:absolute;right:17px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .global-search{
      width:100%;height:48px;border:1px solid var(--line);border-radius:16px;
      background:var(--surface-2);color:var(--text);outline:none;
      padding:0 48px 0 16px;transition:.2s ease;
    }
    .global-search:focus{border-color:var(--emerald);box-shadow:0 0 0 4px color-mix(in srgb,var(--emerald) 12%,transparent);background:var(--surface)}
    .top-nav{display:flex;gap:7px}
    .nav-btn,.icon-btn{
      border:1px solid transparent;background:transparent;border-radius:14px;
      min-height:44px;padding:0 13px;display:flex;align-items:center;gap:8px;
      cursor:pointer;transition:.18s ease;
    }
    .nav-btn:hover,.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
    .nav-btn.active{background:var(--emerald-soft);color:var(--emerald)}
    .nav-btn span{font-size:13px;font-weight:700}

    main{max-width:1240px;margin:auto;padding:34px 22px 90px}
    .view{animation:fadeSlide .32s ease both}
    @keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    .hero{
      position:relative;overflow:hidden;
      padding:38px;border-radius:30px;color:#fff;
      background:
        linear-gradient(120deg,rgba(7,74,53,.98),rgba(21,133,96,.93)),
        radial-gradient(circle at 90% 20%,rgba(255,255,255,.2),transparent 30%);
      box-shadow:var(--shadow);margin-bottom:28px;
    }
    .hero::after{
      content:"۞";position:absolute;left:-12px;bottom:-56px;
      font-family:"Amiri",serif;font-size:170px;opacity:.07;transform:rotate(-9deg)
    }
    .eyebrow{display:inline-flex;gap:7px;align-items:center;color:#f8df9f;font-size:13px;font-weight:700}
    .hero h1{font-family:"Amiri",serif;font-size:clamp(32px,5vw,54px);line-height:1.25;margin:8px 0 10px}
    .hero p{max-width:720px;line-height:1.9;margin:0;color:rgba(255,255,255,.86);font-size:15px}
    .hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
    .hero-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);padding:9px 13px;border-radius:13px;font-size:13px}
    .resume{
      display:flex;align-items:center;justify-content:space-between;gap:18px;
      padding:17px 18px;border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));
      background:var(--gold-soft);border-radius:18px;margin:0 0 24px;
    }
    .resume-info{display:flex;align-items:center;gap:13px}
    .resume-icon{width:42px;height:42px;border-radius:13px;background:var(--gold);color:#fff;display:grid;place-items:center}
    .resume strong{display:block}
    .resume small{color:var(--muted)}
    .primary-btn,.secondary-btn{
      border:none;border-radius:13px;cursor:pointer;padding:11px 16px;font-weight:800;transition:.18s ease;display:inline-flex;align-items:center;gap:8px
    }
    .primary-btn{background:var(--emerald);color:#fff}
    .primary-btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--emerald) 25%,transparent)}
    .secondary-btn{background:var(--surface);border:1px solid var(--line)}
    .secondary-btn:hover{background:var(--surface-2)}

    .filter-row{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none;margin-bottom:6px}
    .filter-row::-webkit-scrollbar{display:none}
    .chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:13px;transition:.18s}
    .chip.active,.chip:hover{background:var(--emerald-soft);border-color:color-mix(in srgb,var(--emerald) 40%,var(--line));color:var(--emerald)}

    .part-group{margin:28px 0 38px}
    .section-heading{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}
    .section-heading h2{margin:0;font-size:23px}
    .section-heading p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .cards-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

    .section-card{
      position:relative;overflow:hidden;background:var(--surface);
      border:1px solid var(--line);border-radius:var(--radius);
      padding:19px;box-shadow:var(--shadow-soft);cursor:pointer;
      transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
      min-height:215px;display:flex;flex-direction:column;
    }
    .section-card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--emerald) 40%,var(--line));box-shadow:var(--shadow)}
    .section-card:active{transform:scale(.985)}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
    .book-icon{
      width:52px;height:52px;border-radius:16px;background:var(--emerald-soft);
      display:grid;place-items:center;font-size:25px;
    }
    .fav-mini{
      width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
      display:grid;place-items:center;cursor:pointer;z-index:2
    }
    .fav-mini.active{color:var(--gold);background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
    .part-badge{display:inline-flex;margin:16px 0 7px;background:var(--gold-soft);color:color-mix(in srgb,var(--gold) 75%,var(--text));padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;width:max-content}
    .section-card h3{font-family:"Amiri",var(--reader-font);font-size:24px;line-height:1.45;margin:0 0 8px}
    .section-card p{font-size:12.5px;line-height:1.8;color:var(--muted);margin:0 0 16px}
    .card-meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:11.5px;margin-top:auto}
    .card-meta span{display:flex;align-items:center;gap:5px}

    .empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:22px;padding:55px 20px;text-align:center}
    .empty-state i{font-size:38px;color:var(--gold);margin-bottom:12px}
    .empty-state h3{margin:8px 0}
    .empty-state p{color:var(--muted);margin:0}

    .reader-shell{max-width:940px;margin:auto}
    .reader-head{
      background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-soft);
      border-radius:26px;padding:26px;margin-bottom:15px
    }
    .breadcrumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:13px}
    .breadcrumb button{border:none;background:none;color:var(--emerald);cursor:pointer;padding:0}
    .source-lines{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
    .source-line{background:var(--emerald-soft);color:var(--emerald);padding:5px 9px;border-radius:9px;font-size:11px}
    .reader-head h1{font-family:"Amiri",var(--reader-font);font-size:clamp(31px,5vw,48px);line-height:1.35;margin:5px 0 10px}
    .reader-stats{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
    .reader-stats span{background:var(--surface-2);border:1px solid var(--line);padding:7px 10px;border-radius:11px}

    .reader-toolbar{
      position:sticky;top:calc(var(--header-h) + 8px);z-index:20;
      display:flex;align-items:center;gap:7px;flex-wrap:wrap;
      background:color-mix(in srgb,var(--surface) 92%,transparent);
      backdrop-filter:blur(14px);border:1px solid var(--line);
      padding:9px;border-radius:18px;margin-bottom:15px;box-shadow:var(--shadow-soft)
    }
    .tool-btn{border:1px solid var(--line);background:var(--surface);height:42px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:7px;cursor:pointer;transition:.18s}
    .tool-btn:hover{background:var(--emerald-soft);color:var(--emerald)}
    .tool-btn.active{color:var(--gold);background:var(--gold-soft)}
    .tool-btn span{font-size:12px;font-weight:700}
    .toolbar-sep{width:1px;height:27px;background:var(--line);margin:0 2px}
    .font-indicator{min-width:56px;text-align:center;color:var(--muted);font-size:11px}

    .reader-content{
      background:var(--surface);border:1px solid var(--line);border-radius:28px;
      padding:clamp(20px,5vw,48px);box-shadow:var(--shadow-soft);
      font-family:var(--reader-font);font-size:var(--reader-size);line-height:2.08;
      overflow-wrap:anywhere;
    }
    .source-chapter{
      font-family:"Amiri",var(--reader-font);font-size:1.8em;line-height:1.45;
      color:var(--emerald);text-align:center;margin:8px 0 30px;padding-bottom:16px;
      border-bottom:1px solid var(--line)
    }
    .source-lesson{
      font-family:"Amiri",var(--reader-font);font-size:1.45em;color:var(--gold);
      margin:34px 0 11px;font-weight:700
    }
    .source-subtitle{font-weight:800;color:var(--emerald);font-size:1.05em;margin:25px 0 7px}
    .source-p{margin:0 0 .8em;white-space:pre-wrap;tab-size:4}
    .source-chapter,.source-lesson,.source-subtitle,.source-list li,.source-table td{white-space:pre-wrap;tab-size:4}
    .source-space{height:.65em}
    .source-list{
      list-style:none;padding:0;margin:8px 0 18px;display:grid;gap:7px
    }
    .source-list li{
      background:var(--surface-2);border-right:3px solid var(--gold);
      border-radius:12px;padding:8px 13px;line-height:1.9
    }
    .table-wrap{width:100%;overflow:auto;margin:20px 0;border:1px solid var(--line);border-radius:17px}
    .source-table{width:100%;border-collapse:collapse;min-width:540px;font-size:.9em}
    .source-table td{padding:11px 13px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top}
    .source-table tr:first-child td{font-weight:800;background:var(--emerald-soft);color:var(--emerald)}
    .source-table tr:last-child td{border-bottom:0}

    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .settings-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow-soft)}
    .settings-card h3{margin:0 0 6px}
    .settings-card p{margin:0 0 18px;color:var(--muted);font-size:12px}
    .setting-control{display:flex;align-items:center;justify-content:space-between;gap:15px}
    select{
      min-width:190px;height:44px;border-radius:12px;border:1px solid var(--line);
      background:var(--surface-2);color:var(--text);padding:0 12px;outline:none
    }
    input[type="range"]{accent-color:var(--emerald);width:100%}
    .toggle{
      width:56px;height:31px;background:var(--line);border-radius:999px;position:relative;cursor:pointer;border:0;transition:.2s
    }
    .toggle::after{content:"";width:23px;height:23px;border-radius:50%;background:#fff;position:absolute;top:4px;right:4px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.18)}
    .toggle.on{background:var(--emerald)}
    .toggle.on::after{right:29px}

    .page-title{margin-bottom:22px}
    .page-title h1{font-family:"Amiri",var(--reader-font);font-size:39px;margin:0}
    .page-title p{color:var(--muted);margin:4px 0 0}

    .search-overlay{
      position:fixed;top:var(--header-h);right:0;left:0;bottom:0;z-index:1100;background:rgba(0,0,0,.36);
      display:flex;justify-content:center;align-items:flex-start;padding:18px 18px 30px;
      opacity:0;pointer-events:none;transition:.18s
    }
    .search-overlay.open{opacity:1;pointer-events:auto}
    .search-modal{
      width:min(720px,100%);max-height:min(72vh,690px);overflow:hidden;
      background:var(--surface);border:1px solid var(--line);border-radius:24px;
      box-shadow:0 30px 80px rgba(0,0,0,.25);display:flex;flex-direction:column;
      transform:translateY(-8px);transition:.18s
    }
    .search-overlay.open .search-modal{transform:none}
    .search-modal-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
    .search-modal-head strong{font-size:14px}
    .close-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
    .search-results{overflow:auto;padding:10px}
    .search-result{
      border:1px solid transparent;border-radius:15px;padding:12px;cursor:pointer;
      transition:.16s;margin-bottom:4px
    }
    .search-result:hover{background:var(--surface-2);border-color:var(--line)}
    .search-result strong{display:block;margin-bottom:4px}
    .search-result small{color:var(--gold);font-weight:800}
    .search-result p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.7}

    .to-top{
      position:fixed;left:22px;bottom:24px;width:48px;height:48px;border-radius:16px;
      border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
      display:grid;place-items:center;cursor:pointer;z-index:800;
      opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s
    }
    .to-top.show{opacity:1;transform:none;pointer-events:auto}
    .toast{
      position:fixed;right:50%;transform:translateX(50%) translateY(12px);
      bottom:24px;z-index:1300;background:#122d24;color:#fff;
      padding:11px 16px;border-radius:13px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.22);
      opacity:0;pointer-events:none;transition:.2s
    }
    .toast.show{opacity:1;transform:translateX(50%) translateY(0)}

    .ripple{position:relative;overflow:hidden}
    .ripple-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.32);transform:scale(0);animation:ripple .55s linear;pointer-events:none}
    @keyframes ripple{to{transform:scale(4);opacity:0}}

    @media(max-width:980px){
      .header-inner{grid-template-columns:auto 1fr;gap:12px}
      .search-wrap{grid-column:1/-1;grid-row:2;max-width:none}
      .top-nav{justify-self:end}
      :root{--header-h:142px}
      .cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:680px){
      main{padding:22px 13px 92px}
      .header-inner{padding:10px 13px}
      .brand-text span{display:none}
      .nav-btn{padding:0 10px}
      .nav-btn span{display:none}
      .hero{padding:25px 20px;border-radius:23px}
      .hero p{font-size:13px}
      .resume{align-items:flex-start;flex-direction:column}
      .cards-grid{grid-template-columns:1fr}
      .section-heading{align-items:flex-start;flex-direction:column}
      .reader-head{padding:20px;border-radius:21px}
      .reader-toolbar{top:calc(var(--header-h) + 5px);border-radius:15px}
      .tool-btn{padding:0 10px}
      .tool-btn span{display:none}
      .toolbar-sep{display:none}
      .reader-content{border-radius:22px;line-height:1.95}
      .settings-grid{grid-template-columns:1fr}
      .setting-control{align-items:flex-start;flex-direction:column}
      select{width:100%}
      .to-top{left:13px;bottom:16px}
    }
  </style>
</head>
<body>
  <div class="top-progress" id="topProgress"></div>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand ripple" id="brandHome" role="button" tabindex="0" aria-label="العودة إلى الصفحة الرئيسية">
        <div class="brand-mark">📖</div>
        <div class="brand-text">
          <strong>مكتبة الثقافة الإسلامية</strong>
          <span>قراءة مرتبة • بحث • مفضلة</span>
        </div>
      </div>

      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="globalSearch" class="global-search" type="search" autocomplete="off" placeholder="ابحث في العناوين والمحتوى..." aria-label="البحث في المكتبة">
      </div>

      <nav class="top-nav" aria-label="التنقل الرئيسي">
        <button class="nav-btn ripple" data-route="home"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
        <button class="nav-btn ripple" data-route="favorites"><i class="fa-solid fa-bookmark"></i><span>المفضلة</span></button>
        <button class="nav-btn ripple" data-route="settings"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></button>
      </nav>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <div class="search-overlay" id="searchOverlay" aria-hidden="true">
    <div class="search-modal" role="dialog" aria-modal="true" aria-label="نتائج البحث">
      <div class="search-modal-head">
        <strong id="searchCount">نتائج البحث</strong>
        <button class="close-btn" id="closeSearch" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <button class="to-top" id="toTop" aria-label="العودة إلى الأعلى"><i class="fa-solid fa-arrow-up"></i></button>
  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // المحتوى: مستخرج من ملفات Word المرفقة ومضمّن داخل الملف نفسه
    // ============================================================
    const SECTIONS = [{"id":"part1-section1","partIndex":1,"partName":"الجزء الأول","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ","الْجُزْءُ الأَوَّلُ"],"title":"فَصْلُ الْعَقائِدِ","blocks":[{"type":"p","text":"فَصْلُ الْعَقائِدِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":""},{"type":"p","text":"أَنَا مُسْلِمٌ صَغِيرٌ"},{"type":"p","text":"أُحِبُّ اللَّهَ خَالِقِى"},{"type":"p","text":"وَأُحِبُّ مُحَمَّدًا نَبِيِّى"},{"type":"p","text":"وَأُحِبُّ الْقُرْءَانَ كِتَابِى"},{"type":"p","text":"وَأُحِبُّ الْكَعْبَةَ قِبْلَتِى"},{"type":"p","text":"وَأُحِبُّ الإِسْلامَ دِينِى"},{"type":"p","text":"أَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ"},{"type":"p","text":"وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ"},{"type":"p","text":""},{"type":"p","text":"ذِكْرٌ "},{"type":"p","text":"رَضِيْتُ بِاللَّهِ رَبًّا وَبِالإِسْلامِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا"},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"أَعْظَمُ أُمُورِ الإِسْلامِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »بُنِىَ الإِسْلامُ عَلَى خَمْسٍ شَهَادَةِ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَإِقَامِ الصَّلاةِ وَإِيتَاءِ الزَّكَاةِ وَصَوْمِ رَمضَانَ وَحَجِّ الْبَيْتِ «رَوَاهُ مُسْلِمٌ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"اللَّهُمَّ عَلِّمْنَا مَا يَنْفَعُنَا وَانْفَعْنَا بِمَا عَلَّمْتَنَا وَزِدْنَا عِلْمًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ"},{"type":"p","text":""},{"type":"p","text":"اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ"},{"type":"p","text":"اللَّهُ مَوْجُودٌ بِلا بِدَايَةٍ وَلا نِهَايَةٍ."},{"type":"p","text":"اللَّهُ لَيْسَ لَهُ زَوْجَةٌ."},{"type":"p","text":"اللَّهُ لَيْسَ لَهُ ابْنٌ وَلا بِنْتٌ."},{"type":"p","text":"اللَّهُ لَيْسَ لَهُ أَبٌ وَلا أُمٌّ."},{"type":"p","text":"اللَّهُ لَيْسَ لَهُ أَخٌ وَلا أُخْتٌ."},{"type":"p","text":"اللَّهُ لا يُشْبِهُنَا."},{"type":"p","text":""},{"type":"p","text":"ذِكْرٌ"},{"type":"p","text":"لا إِلَـهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللَّهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"اللَّهُ رَبُّ كُلِّ شَىْءٍ"},{"type":"p","text":""},{"type":"p","text":"اللَّهُ رَبِّى وَرَبُّ أُمِّى وَأَبِى"},{"type":"p","text":"اللَّهُ رَبُّ أَخِى وَأُخْتِى"},{"type":"p","text":"اللَّهُ رَبُّ أُسْتَاذِى وَرِفَاقِى"},{"type":"p","text":"اللَّهُ رَبُّ السَّمٰوَاتِ وَالأَرْضِ"},{"type":"p","text":"اللَّهُ رَبُّ كُلِّ شَىْءٍ"},{"type":"p","text":"أَنا مُسْلِمٌ أُحِبُّ اللَّهَ كَثِيرًا"},{"type":"p","text":""},{"type":"p","text":"ذِكْرٌ "},{"type":"p","text":"اللَّهُ اللَّهُ رَبِّى لا أُشْرِكُ بِهِ شَيْئًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"اللَّهُ خَالِقُ كُلِّ شَىْءٍ"},{"type":"p","text":""},{"type":"p","text":"اللَّهُ خَلَقَ الْبَشَرَ مِنْ مَاءٍ وَتُرَابٍ."},{"type":"p","text":"اللَّهُ خَلَقَ الْمَلائِكَةَ مِنْ نُورٍ."},{"type":"p","text":"اللَّهُ خَلَقَ الْجِنَّ مِنْ نَارٍ."},{"type":"p","text":"اللَّهُ خَلَقَ السَّمٰوَاتِ وَجَعَلَهَا مَسْكَنًا لِلْمَلائِكَةِ."},{"type":"p","text":"اللَّهُ خَلَقَ الأَرْضَ وَجَعَلَهَا مَسْكَنًا لِلإِنْسَانِ وَالْجِنِّ وَالْبَهَائِمِ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿اللَّهُ خَالِقُ كُلِّ شَىْءٍ﴾ [سُورَةَ الرَّعْدِ/16]."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مِمَّ خَلَقَ اللَّهُ الْبَشَرَ."},{"type":"p","text":"     (2) مِمَّ خَلَقَ اللَّهُ الْمَلائِكَةَ."},{"type":"p","text":"     (3) مِمَّ خَلَقَ اللَّهُ الْجِنَّ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"اللَّهُ لا يُشْبِهُ شَيْئًا"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11]."},{"type":"p","text":"اللَّهُ تَعَالَى لا يُشْبِهُ الْمَلائِكَةَ."},{"type":"p","text":"اللَّهُ تَعَالَى لا يُشْبِهُ الْبَشَرَ."},{"type":"p","text":"اللَّهُ تَعَالَى لا شَكْلَ لَهُ."},{"type":"p","text":"اللَّهُ تَعَالَى لا لَوْنَ لَهُ."},{"type":"p","text":"اللَّهُ تَعَالَى لا يُشْبِهُ شَيْئًا مِنَ الْمَخْلُوقَاتِ."},{"type":"p","text":"لِلْحِفْظِ غَيْبًا "},{"type":"p","text":"قَالَ الإِمَامُ ذُو النُّونِ الْمِصْرِىُّ »مَهْمَا تَصَوَّرْتَ بِبَالِكَ فَاللَّهُ بِخِلافِ ذَلِكَ«."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"لا إِلَـهَ إِلَّا اللَّهُ"},{"type":"p","text":""},{"type":"p","text":"اللَّهُ حَىٌّ لا يَمُوتُ."},{"type":"p","text":"اللَّهُ قَادِرٌ عَلَى كُلِّ شَىْءٍ."},{"type":"p","text":"اللَّهُ مَالِكُ كُلِّ شَىْءٍ."},{"type":"p","text":"اللَّهُ عَالِمٌ بِكُلِّ شَىْءٍ. "},{"type":"p","text":"اللَّهُ لا يَخْفَى عَلَيْهِ شَىْءٌ."},{"type":"p","text":""},{"type":"p","text":"ذِكْرٌ "},{"type":"p","text":"حَسْبِىَ اللَّهُ لا إِلَـهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"اللَّهُ لَيْسَ جِسْمًا"},{"type":"p","text":""},{"type":"p","text":"اللَّهُ يَرَى بِلا حَدَقَةٍ."},{"type":"p","text":"اللَّهُ يَسْمَعُ بِلا أُذُنٍ."},{"type":"p","text":"اللَّهُ يَتَكَلَّمُ بِلا لِسَانٍ وَلا شَفَتَيْنِ."},{"type":"p","text":"اللَّهُ لَيْسَ لَهُ أَعْضَاءٌ وَلا جَوَارِحُ."},{"type":"p","text":"اللَّهُ عَالِمٌ بِلا مُعَلِّمٍ."},{"type":"p","text":"اللَّهُ لا يُشْبِهُ شَيْئًا وَلا يُشْبِهُهُ شَىْءٌ."},{"type":"p","text":""},{"type":"p","text":"لِلْحِفْظِ غَيْبًا "},{"type":"p","text":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ لا قُوَّةَ إِلَّا بِاللَّهِ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"اللَّهُ مَوْجُودٌ بِلا مَكَانٍ"},{"type":"p","text":""},{"type":"p","text":"اللَّهُ مَوْجُودٌ بِلا مَكَانٍ."},{"type":"p","text":"اللَّهُ لا يُشْبِهُ شَيْئًا."},{"type":"p","text":"اللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ."},{"type":"p","text":"اللَّهُ لَيْسَ جِسْمًا."},{"type":"p","text":"اللَّهُ لَيْسَ لَهُ أَعْضَاءٌ."},{"type":"p","text":"اللَّهُ لا يَحْتَاجُ إِلَى الْمَكَانِ."},{"type":"p","text":"اللَّهُ مَوْجُودٌ بِلا مَكَانٍ"},{"type":"p","text":""},{"type":"p","text":"لِلْحِفْظِ غَيْبًا "},{"type":"p","text":"قَالَ سَيِّدُنَا عَلِىٌّ رَضِىَ اللَّهُ عَنْهُ »كَانَ اللَّهُ وَلا مَكَانَ وَهُوَ الآنَ عَلَى مَا عَلَيْهِ كَانَ«."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"سُورَةُ الإِخْلاصِ"},{"type":"p","text":""},{"type":"p","text":"بِسْمِ اللَّهِ الرَّحْمٰنِ الرَّحِيمِ"},{"type":"p","text":""},{"type":"p","text":"﴿قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ﴾."},{"type":"p","text":"الشَّرْحُ "},{"type":"p","text":"﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ. "},{"type":"p","text":"﴿اللَّهُ الصَّمَدُ﴾ كُلُّ شَىْءٍ يَحْتَاجُ إِلَى اللَّهِ وَاللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ."},{"type":"p","text":"﴿لَمْ يَلِدْ﴾ لَيْسَ لَهُ أَوْلادٌ وَلَيْسَ أَصْلًا لِغَيْرِهِ."},{"type":"p","text":"﴿وَلَمْ يُولَدْ﴾ لَيْسَ لَهُ أَبٌ وَلا أُمٌّ وَلَيْسَ فَرْعًا مِنْ غَيْرِهِ."},{"type":"p","text":"﴿وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ﴾ لَيْسَ لَهُ مَثِيلٌ وَلا شَبِيهٌ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     مَا مَعْنَى ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾."},{"type":"p","text":"     مَا مَعْنَى ﴿لَمْ يَلِدْ﴾."},{"type":"p","text":"     مَا مَعْنَى ﴿وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ﴾. "},{"type":"p","text":""},{"type":"p","text":"لِلْحِفْظِ غَيْبًا"},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِأَحَدِ الصَّحَابَةِ »اقْرَأْ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ وَالْمُعَوِّذَتَيْنِ حِينَ تُمْسِى وَحِينَ تُصْبِحُ ثَلاثَ مَرَّاتٍ تَكْفِيكَ مِنْ كُلِّ شَىْءٍ« رَوَاهُ أَبُو دَاوُدَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"أَفْضَلُ الأَعْمَالِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"وَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »أَفْضَلُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ قَبْلِى لا إِلَـهَ إِلَّا اللَّهُ« رَوَاهُ التِرْمِذِىُّ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"اللَّهُمَّ اشْرَحْ لِى صَدْرِى وَيَسِّرْ لِى أَمْرِى وَثَبِّتْنِى عَلَى الإِيـمَانِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى عَشَرَ"},{"type":"p","text":"الإِسْلامُ دِينِى"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلامُ﴾ [سُورَةَ ءَالِ عِمْرَان/19]. "},{"type":"p","text":"الإِسْلامُ هُوَ الدِّينُ الصَّحِيحُ."},{"type":"p","text":"الإِسْلامُ دِينُ مُحَمَّدٍ وَعِيسَى وَمُوسَى عَلَيْهِمُ السَّلامُ."},{"type":"p","text":"الإِسْلامُ دِينُ جَمِيعِ الأَنْبِيَاءِ."},{"type":"p","text":"الْمُؤْمِنُونَ لَهُمُ الْجَنَّةُ وَالْكَافِرُونَ لَهُمُ النَّارُ. "},{"type":"p","text":"أَنَا مُسْلِمٌ صَغِيرٌ وَأُحِبُّ دِينَ الإِسْلامِ."},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"اللَّهُمَّ اجْعَلْنِى مِنْ عِبادِكَ الصَّالِحِينَ وَأَدْخِلْنِى الْجَنَّةَ مَعَ الأَوَّلِينَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثَ عَشَرَ"},{"type":"p","text":"الإِسْلامُ دِينُ الأَنْبِيَاءِ"},{"type":"p","text":""},{"type":"p","text":"كُلُّ الأَنْبِيَاءِ مُسْلِمُونَ."},{"type":"p","text":"كُلُّ الأَنْبِيَاءِ قَالُوا لا إِلَـهَ إِلَّا اللَّهُ."},{"type":"p","text":"سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ نَبِىٌّ مُسْلِمٌ وَهُوَ أَوَّلُ الأَنْبِيَاءِ."},{"type":"p","text":"سَيِّدُنَا نُوحٌ عَلَيْهِ السَّلامُ نَبِىٌّ مُسْلِمٌ. "},{"type":"p","text":"سَيِدُنَا إِبرَاهِيمُ عَلَيْهِ السَّلامُ نَبِىٌّ مُسْلِمٌ."},{"type":"p","text":"سَيِّدُنَا مُحَمَّدٌ عَلَيهِ الصَّلاةُ وَالسَّلامُ نَبِىٌّ مُسْلِمٌ وَهُوَ ءَاخِرُ الأَنْبِيَاءِ وَأَفْضَلُهُمْ."},{"type":"p","text":"أَنَا أُحِبُّ الأَنْبِيَاءَ كُلَّهُمْ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ "},{"type":"p","text":"     (1) مَنْ هُوَ أَوَّلُ الأَنْبِيَاءِ."},{"type":"p","text":"     (2) مَنْ هُوَ ءَاخِرُ الأَنْبِيَاءِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعَ عَشَرَ"},{"type":"p","text":"أَمْثِلَةٌ لِبَعْضِ أَلْفَاظِ الْكُفْرِ"},{"type":"p","text":""},{"type":"p","text":"مَنْ سَبَّ اللَّهَ تَعَالَى يَخْرُجُ مِنَ الإِسْلامِ."},{"type":"p","text":"مَنْ سَبَّ نَبِيًّا مِنَ الأَنْبِيَاءِ يَخْرُجُ مِنَ الإِسْلامِ."},{"type":"p","text":"مَنْ سَبَّ دِينَ الإِسْلامِ يَخْرُجُ مِنَ الإِسْلامِ."},{"type":"p","text":"مَنِ اسْتَهْزَأَ بِدِينِ الإِسْلامِ يَخْرُجُ مِنَ الإِسْلامِ."},{"type":"p","text":"مَنْ كَفَرَ لا بُدَّ أَنْ يَتَشَهَّدَ حَتَّى يَعُودَ إِلَى الإِسْلامِ."},{"type":"p","text":"وَالتَّشَهُّدُ أَنْ يَقُولَ أَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":""},{"type":"p","text":"لِلْحِفْظِ غَيْبًا"},{"type":"p","text":"وَصَانِعُ الْعَالَمِ لا يَحْوِيهِ\t\t\tقُطْرٌ تَعَالَى اللَّهُ عَنْ تَشْبِيهِ"},{"type":"p","text":"قَدْ كَانَ مَوْجُودًا وَلا مَكَانَا\t\t\tوَحُكْمُهُ الآنَ عَلَى مَا كَانَا"},{"type":"p","text":"سُبْحَانَهُ جَلَّ عَنِ الْمَكَانِ\t\t\tوَعَزَّ عَنْ تَغَيُّرِ الزَّمَانِ"},{"type":"p","text":"فَقَدْ غَلا وَزَادَ فِى الْغُلُوِّ\t\t\tمَنْ خَصَّهُ بِجِهَةِ الْعُلُوِّ"},{"type":"p","text":"وَحَصَرَ الصَّانِعَ فِى السَّمَاءِ\t\t\tمُبْدِعَهَا وَالْعَرْشِ فَوْقَ الْمَاءِ"},{"type":"p","text":"وَأَثْبَتُوا لِذَاتِهِ التَّحَيُّزَا\t\t\tقَدْ ضَلَّ ذُو التَّشْبِيهِ فِيمَا جَوَّزَا\t\t"},{"type":"p","text":""}],"paragraphCount":149,"wordCount":842,"readingMinutes":5,"description":"المحتوى الكامل لـ فَصْلُ الْعَقائِدِ من الجزء الأول، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ الْجُزْءُ الأَوَّلُ فَصْلُ الْعَقائِدِ فَصْلُ الْعَقائِدِ\nالدَّرْسُ الأَوَّلُ\n\nأَنَا مُسْلِمٌ صَغِيرٌ\nأُحِبُّ اللَّهَ خَالِقِى\nوَأُحِبُّ مُحَمَّدًا نَبِيِّى\nوَأُحِبُّ الْقُرْءَانَ كِتَابِى\nوَأُحِبُّ الْكَعْبَةَ قِبْلَتِى\nوَأُحِبُّ الإِسْلامَ دِينِى\nأَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ\nوَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ\n\nذِكْرٌ \nرَضِيْتُ بِاللَّهِ رَبًّا وَبِالإِسْلامِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا\n\nالدَّرْسُ الثَّانِى\nأَعْظَمُ أُمُورِ الإِسْلامِ\n\nقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »بُنِىَ الإِسْلامُ عَلَى خَمْسٍ شَهَادَةِ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَإِقَامِ الصَّلاةِ وَإِيتَاءِ الزَّكَاةِ وَصَوْمِ رَمضَانَ وَحَجِّ الْبَيْتِ «رَوَاهُ مُسْلِمٌ.\n\nدُعَاءٌ \nاللَّهُمَّ عَلِّمْنَا مَا يَنْفَعُنَا وَانْفَعْنَا بِمَا عَلَّمْتَنَا وَزِدْنَا عِلْمًا.\n\nالدَّرْسُ الثَّالِثُ\nاللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ\n\nاللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ\nاللَّهُ مَوْجُودٌ بِلا بِدَايَةٍ وَلا نِهَايَةٍ.\nاللَّهُ لَيْسَ لَهُ زَوْجَةٌ.\nاللَّهُ لَيْسَ لَهُ ابْنٌ وَلا بِنْتٌ.\nاللَّهُ لَيْسَ لَهُ أَبٌ وَلا أُمٌّ.\nاللَّهُ لَيْسَ لَهُ أَخٌ وَلا أُخْتٌ.\nاللَّهُ لا يُشْبِهُنَا.\n\nذِكْرٌ\nلا إِلَـهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللَّهِ.\n\nالدَّرْسُ الرَّابِعُ\nاللَّهُ رَبُّ كُلِّ شَىْءٍ\n\nاللَّهُ رَبِّى وَرَبُّ أُمِّى وَأَبِى\nاللَّهُ رَبُّ أَخِى وَأُخْتِى\nاللَّهُ رَبُّ أُسْتَاذِى وَرِفَاقِى\nاللَّهُ رَبُّ السَّمٰوَاتِ وَالأَرْضِ\nاللَّهُ رَبُّ كُلِّ شَىْءٍ\nأَنا مُسْلِمٌ أُحِبُّ اللَّهَ كَثِيرًا\n\nذِكْرٌ \nاللَّهُ اللَّهُ رَبِّى لا أُشْرِكُ بِهِ شَيْئًا.\n\nالدَّرْسُ الْخَامِسُ\nاللَّهُ خَالِقُ كُلِّ شَىْءٍ\n\nاللَّهُ خَلَقَ الْبَشَرَ مِنْ مَاءٍ وَتُرَابٍ.\nاللَّهُ خَلَقَ الْمَلائِكَةَ مِنْ نُورٍ.\nاللَّهُ خَلَقَ الْجِنَّ مِنْ نَارٍ.\nاللَّهُ خَلَقَ السَّمٰوَاتِ وَجَعَلَهَا مَسْكَنًا لِلْمَلائِكَةِ.\nاللَّهُ خَلَقَ الأَرْضَ وَجَعَلَهَا مَسْكَنًا لِلإِنْسَانِ وَالْجِنِّ وَالْبَهَائِمِ.\nقَالَ اللَّهُ تَعَالَى ﴿اللَّهُ خَالِقُ كُلِّ شَىْءٍ﴾ [سُورَةَ الرَّعْدِ/16].\n\n     أَسْئِلَةٌ\n     (1) مِمَّ خَلَقَ اللَّهُ الْبَشَرَ.\n     (2) مِمَّ خَلَقَ اللَّهُ الْمَلائِكَةَ.\n     (3) مِمَّ خَلَقَ اللَّهُ الْجِنَّ.\n\nالدَّرْسُ السَّادِسُ\nاللَّهُ لا يُشْبِهُ شَيْئًا\n\nقَالَ اللَّهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11].\nاللَّهُ تَعَالَى لا يُشْبِهُ الْمَلائِكَةَ.\nاللَّهُ تَعَالَى لا يُشْبِهُ الْبَشَرَ.\nاللَّهُ تَعَالَى لا شَكْلَ لَهُ.\nاللَّهُ تَعَالَى لا لَوْنَ لَهُ.\nاللَّهُ تَعَالَى لا يُشْبِهُ شَيْئًا مِنَ الْمَخْلُوقَاتِ.\nلِلْحِفْظِ غَيْبًا \nقَالَ الإِمَامُ ذُو النُّونِ الْمِصْرِىُّ »مَهْمَا تَصَوَّرْتَ بِبَالِكَ فَاللَّهُ بِخِلافِ ذَلِكَ«.\n\nالدَّرْسُ السَّابِعُ\nلا إِلَـهَ إِلَّا اللَّهُ\n\nاللَّهُ حَىٌّ لا يَمُوتُ.\nاللَّهُ قَادِرٌ عَلَى كُلِّ شَىْءٍ.\nاللَّهُ مَالِكُ كُلِّ شَىْءٍ.\nاللَّهُ عَالِمٌ بِكُلِّ شَىْءٍ. \nاللَّهُ لا يَخْفَى عَلَيْهِ شَىْءٌ.\n\nذِكْرٌ \nحَسْبِىَ اللَّهُ لا إِلَـهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.\n\nالدَّرْسُ الثَّامِنُ\nاللَّهُ لَيْسَ جِسْمًا\n\nاللَّهُ يَرَى بِلا حَدَقَةٍ.\nاللَّهُ يَسْمَعُ بِلا أُذُنٍ.\nاللَّهُ يَتَكَلَّمُ بِلا لِسَانٍ وَلا شَفَتَيْنِ.\nاللَّهُ لَيْسَ لَهُ أَعْضَاءٌ وَلا جَوَارِحُ.\nاللَّهُ عَالِمٌ بِلا مُعَلِّمٍ.\nاللَّهُ لا يُشْبِهُ شَيْئًا وَلا يُشْبِهُهُ شَىْءٌ.\n\nلِلْحِفْظِ غَيْبًا \nسُبْحَانَ اللَّهِ وَبِحَمْدِهِ لا قُوَّةَ إِلَّا بِاللَّهِ.\n\n\nالدَّرْسُ التَّاسِعُ\nاللَّهُ مَوْجُودٌ بِلا مَكَانٍ\n\nاللَّهُ مَوْجُودٌ بِلا مَكَانٍ.\nاللَّهُ لا يُشْبِهُ شَيْئًا.\nاللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ.\nاللَّهُ لَيْسَ جِسْمًا.\nاللَّهُ لَيْسَ لَهُ أَعْضَاءٌ.\nاللَّهُ لا يَحْتَاجُ إِلَى الْمَكَانِ.\nاللَّهُ مَوْجُودٌ بِلا مَكَانٍ\n\nلِلْحِفْظِ غَيْبًا \nقَالَ سَيِّدُنَا عَلِىٌّ رَضِىَ اللَّهُ عَنْهُ »كَانَ اللَّهُ وَلا مَكَانَ وَهُوَ الآنَ عَلَى مَا عَلَيْهِ كَانَ«.\n\nالدَّرْسُ الْعَاشِرُ\nسُورَةُ الإِخْلاصِ\n\nبِسْمِ اللَّهِ الرَّحْمٰنِ الرَّحِيمِ\n\n﴿قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ﴾.\nالشَّرْحُ \n﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ. \n﴿اللَّهُ الصَّمَدُ﴾ كُلُّ شَىْءٍ يَحْتَاجُ إِلَى اللَّهِ وَاللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ.\n﴿لَمْ يَلِدْ﴾ لَيْسَ لَهُ أَوْلادٌ وَلَيْسَ أَصْلًا لِغَيْرِهِ.\n﴿وَلَمْ يُولَدْ﴾ لَيْسَ لَهُ أَبٌ وَلا أُمٌّ وَلَيْسَ فَرْعًا مِنْ غَيْرِهِ.\n﴿وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ﴾ لَيْسَ لَهُ مَثِيلٌ وَلا شَبِيهٌ.\n\n     أَسْئِلَةٌ\n     مَا مَعْنَى ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾.\n     مَا مَعْنَى ﴿لَمْ يَلِدْ﴾.\n     مَا مَعْنَى ﴿وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ﴾. \n\nلِلْحِفْظِ غَيْبًا\nقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِأَحَدِ الصَّحَابَةِ »اقْرَأْ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ وَالْمُعَوِّذَتَيْنِ حِينَ تُمْسِى وَحِينَ تُصْبِحُ ثَلاثَ مَرَّاتٍ تَكْفِيكَ مِنْ كُلِّ شَىْءٍ« رَوَاهُ أَبُو دَاوُدَ.\n\nالدَّرْسُ الْحَادِى عَشَرَ\nأَفْضَلُ الأَعْمَالِ\n\nقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ« رَوَاهُ الْبُخَارِىُّ.\nوَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »أَفْضَلُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ قَبْلِى لا إِلَـهَ إِلَّا اللَّهُ« رَوَاهُ التِرْمِذِىُّ.\n\nدُعَاءٌ \nاللَّهُمَّ اشْرَحْ لِى صَدْرِى وَيَسِّرْ لِى أَمْرِى وَثَبِّتْنِى عَلَى الإِيـمَانِ.\n\nالدَّرْسُ الثَّانِى عَشَرَ\nالإِسْلامُ دِينِى\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلامُ﴾ [سُورَةَ ءَالِ عِمْرَان/19]. \nالإِسْلامُ هُوَ الدِّينُ الصَّحِيحُ.\nالإِسْلامُ دِينُ مُحَمَّدٍ وَعِيسَى وَمُوسَى عَلَيْهِمُ السَّلامُ.\nالإِسْلامُ دِينُ جَمِيعِ الأَنْبِيَاءِ.\nالْمُؤْمِنُونَ لَهُمُ الْجَنَّةُ وَالْكَافِرُونَ لَهُمُ النَّارُ. \nأَنَا مُسْلِمٌ صَغِيرٌ وَأُحِبُّ دِينَ الإِسْلامِ.\nدُعَاءٌ \nاللَّهُمَّ اجْعَلْنِى مِنْ عِبادِكَ الصَّالِحِينَ وَأَدْخِلْنِى الْجَنَّةَ مَعَ الأَوَّلِينَ.\n\nالدَّرْسُ الثَّالِثَ عَشَرَ\nالإِسْلامُ دِينُ الأَنْبِيَاءِ\n\nكُلُّ الأَنْبِيَاءِ مُسْلِمُونَ.\nكُلُّ الأَنْبِيَاءِ قَالُوا لا إِلَـهَ إِلَّا اللَّهُ.\nسَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ نَبِىٌّ مُسْلِمٌ وَهُوَ أَوَّلُ الأَنْبِيَاءِ.\nسَيِّدُنَا نُوحٌ عَلَيْهِ السَّلامُ نَبِىٌّ مُسْلِمٌ. \nسَيِدُنَا إِبرَاهِيمُ عَلَيْهِ السَّلامُ نَبِىٌّ مُسْلِمٌ.\nسَيِّدُنَا مُحَمَّدٌ عَلَيهِ الصَّلاةُ وَالسَّلامُ نَبِىٌّ مُسْلِمٌ وَهُوَ ءَاخِرُ الأَنْبِيَاءِ وَأَفْضَلُهُمْ.\nأَنَا أُحِبُّ الأَنْبِيَاءَ كُلَّهُمْ.\n\n     أَسْئِلَةٌ \n     (1) مَنْ هُوَ أَوَّلُ الأَنْبِيَاءِ.\n     (2) مَنْ هُوَ ءَاخِرُ الأَنْبِيَاءِ.\n\nالدَّرْسُ الرَّابِعَ عَشَرَ\nأَمْثِلَةٌ لِبَعْضِ أَلْفَاظِ الْكُفْرِ\n\nمَنْ سَبَّ اللَّهَ تَعَالَى يَخْرُجُ مِنَ الإِسْلامِ.\nمَنْ سَبَّ نَبِيًّا مِنَ الأَنْبِيَاءِ يَخْرُجُ مِنَ الإِسْلامِ.\nمَنْ سَبَّ دِينَ الإِسْلامِ يَخْرُجُ مِنَ الإِسْلامِ.\nمَنِ اسْتَهْزَأَ بِدِينِ الإِسْلامِ يَخْرُجُ مِنَ الإِسْلامِ.\nمَنْ كَفَرَ لا بُدَّ أَنْ يَتَشَهَّدَ حَتَّى يَعُودَ إِلَى الإِسْلامِ.\nوَالتَّشَهُّدُ أَنْ يَقُولَ أَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\n\nلِلْحِفْظِ غَيْبًا\nوَصَانِعُ الْعَالَمِ لا يَحْوِيهِ\t\t\tقُطْرٌ تَعَالَى اللَّهُ عَنْ تَشْبِيهِ\nقَدْ كَانَ مَوْجُودًا وَلا مَكَانَا\t\t\tوَحُكْمُهُ الآنَ عَلَى مَا كَانَا\nسُبْحَانَهُ جَلَّ عَنِ الْمَكَانِ\t\t\tوَعَزَّ عَنْ تَغَيُّرِ الزَّمَانِ\nفَقَدْ غَلا وَزَادَ فِى الْغُلُوِّ\t\t\tمَنْ خَصَّهُ بِجِهَةِ الْعُلُوِّ\nوَحَصَرَ الصَّانِعَ فِى السَّمَاءِ\t\t\tمُبْدِعَهَا وَالْعَرْشِ فَوْقَ الْمَاءِ\nوَأَثْبَتُوا لِذَاتِهِ التَّحَيُّزَا\t\t\tقَدْ ضَلَّ ذُو التَّشْبِيهِ فِيمَا جَوَّزَا\t\t\n"},{"id":"part1-section2","partIndex":1,"partName":"الجزء الأول","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ","الْجُزْءُ الأَوَّلُ"],"title":"فَصْلُ الْعِبَادَاتِ","blocks":[{"type":"p","text":"فَصْلُ الْعِبَادَاتِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":""},{"type":"p","text":"فُرُوضُ الْوُضُوءِ"},{"type":"p","text":"فُرُوضُ الْوُضُوءِ سِتَّةُ أَشْيَاءَ هِىَ"},{"type":"p","text":"النِّيَّةُ عِنْدَ غَسْلِ الْوَجْهِ."},{"type":"p","text":"وَغَسْلُ الْوَجْهِ كُلِّهِ."},{"type":"p","text":"وَغَسْلُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ."},{"type":"p","text":"وَمَسْحُ بَعْضِ الرَّأْسِ."},{"type":"p","text":"وَغَسْلُ الرِّجْلَينِ إِلَى الْكَعْبَيْنِ."},{"type":"p","text":"وَتَرْتِيبُ هَذِهِ الأُمُورِ هَكَذَا."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"اللَّهُمَّ اجْعَلْنِى مِنَ التَّوَّابِينَ وَاجْعَلْنِى مِنَ الْمُتَطَهِّرِينَ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"نَوَاقِضُ الْوُضُوءِ"},{"type":"p","text":""},{"type":"p","text":"يَنْقُضُ الْوُضُوءَ وَيُبْطِلُهُ أُمُورٌ مِنْهَا"},{"type":"p","text":"خُرُوجُ الْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ."},{"type":"p","text":"وَالنَّوْمُ عَلَى الْجَنْبِ أَوِ الظَّهْرِ أَوِ الْبَطْنِ."},{"type":"p","text":"فَمَنْ كَانَ مُتَوَضِّئًا وَحَصَلَ مِنْهُ هَذَا لَيْسَ لَهُ أَنْ يُصَلِّىَ حَتَّى يَتَوَضَّأَ مِنْ جَدِيدٍ."},{"type":"p","text":""},{"type":"p","text":"ذِكْرٌ "},{"type":"p","text":"يُقَالُ بَعْدَ الْخُرُوجِ مِنَ الْخَلاءِ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"الصَّلَوَاتُ الْخَمْسُ"},{"type":"p","text":""},{"type":"p","text":"صَلاةُ الصُّبْحِ وَهِىَ رَكْعَتَانِ."},{"type":"p","text":"صَلاةُ الظُّهْرِ وَهىَ أَرْبَعُ رَكَعَاتٍ."},{"type":"p","text":"صَلاةُ الْعَصْرِ وَهِىَ أَرْبَعُ رَكَعَاتٍ."},{"type":"p","text":"صَلاةُ الْمَغْرِبِ وَهِىَ ثَلاثُ رَكَعَاتٍ."},{"type":"p","text":"صَلاةُ الْعِشَاءِ وَهِىَ أَرْبَعُ رَكَعَاتٍ."},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »خَمْسُ صَلَوَاتٍ كَتَبَهُنَّ اللَّهُ عَلَى الْعِبَادِ« رَوَاهُ الإِمَامُ أَحْمَدُ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"اللَّهُمَّ اجْعَلْنِى مِنَ الَّذِينَ يُقِيمُونَ الصَّلاةَ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"مِنْ أَدْعِيَةِ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"دُعَاءُ الِافْتِتَاحِ: وَجَّهْتُ وَجْهِىَ لِلَّذِى فَطَرَ السَّمٰوَاتِ وَالأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ إِنَّ صَلاتِى وَنُسُكِى وَمَحْيَاىَ وَمَمَاتِى لِلَّهِ رَبِّ الْعَالَمِينَ لا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"التَّشَهُّدُ فِى الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":""},{"type":"p","text":"ذِكْرٌ "},{"type":"p","text":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"الصَّلاةُ الإِبْرَاهِيمِيَّةُ"},{"type":"p","text":""},{"type":"p","text":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"اللَّهُمَّ عَافِنِى فِى بَدَنِى اللَّهُمَّ عَافِنِى فِى سَمْعِى اللَّهُمَّ عَافِنِى فِى بَصَرِى."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"مِنْ أَدْعِيَةِ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"مِمَّا يُدْعَا بِهِ فِى ءَاخِرِ الصَّلاةِ رَبَّنَا ءَاتِنَا فِى الدُّنْيَا حَسَنَةً وَفِى الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ."},{"type":"p","text":"رَبَّنَا لا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ."},{"type":"p","text":""},{"type":"p","text":"ذِكْرٌ"},{"type":"p","text":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"كَيفَ أُصَلِّى الصُّبْحَ"},{"type":"p","text":""},{"type":"p","text":"أَقِفُ مُسْتَقْبِلًا الْقِبْلَةَ الشَّرِيفَةَ وَأَقُولُ بِقَلْبِى أُصَلِّى الصُّبْحَ."},{"type":"p","text":"ثُمَّ أَرْفَعُ يَدَىَّ إِلَى مُحَاذَاةِ الأُذُنَيْنِ قَائِلًا اللَّهُ أَكْبَرُ."},{"type":"p","text":"ثُمَّ أَقْرَأُ دُعَاءَ الِافْتِتَاحِ."},{"type":"p","text":"ثُمَّ أَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً جَهْرًا."},{"type":"p","text":"ثُمَّ أَرْكَعُ وَأَقُولُ سُبحَانَ رَبِّىَ الْعَظِيمِ ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَرْفَعُ مِنَ الرُّكُوعِ قَائِلًا سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ."},{"type":"p","text":"فَإِذَا اعْتَدَلْتُ أَقُولُ رَبَّنَا وَلَكَ الْحَمْدُ."},{"type":"p","text":"ثُمَّ أَسْجُدُ وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَجْلِسُ وَأَقُولُ اللَّهُمَّ اغْفِرْ لِى وَارْحَمْنِى وَاهْدِنِى."},{"type":"p","text":"ثُمَّ أَسْجُدُ مَرَّةً ثَانِيَةً وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ وَأَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُوْلَى مِنَ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى. "},{"type":"p","text":"ثُمَّ أَجْلِسُ وَأَقْرَأُ التَّشَهُّدَ وَالصَّلاةَ الإِبْرَاهِيمِيَّةَ."},{"type":"p","text":"ثُمَّ أَلْتَفِتُ إِلَى الْيَمِينِ وَأُسَلِّمُ قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ."},{"type":"p","text":"ثُمَّ أَلْتَفِتُ إِلَى الْيَسَارِ قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"كَيفَ أُصَلِّى الظُّهْرَ"},{"type":"p","text":""},{"type":"p","text":"أَقِفُ مُسْتَقْبِلًا الْقِبْلَةَ الشَّرِيفَةَ وَأَقُولُ بِقَلْبِى أُصَلِّى الظُّهْرَ."},{"type":"p","text":"ثُمَّ أَرْفَعُ يَدَىَّ قَائِلًا اللَّهُ أَكْبَرُ."},{"type":"p","text":"ثُمَّ أَقرَأُ دُعَاءَ الِافتِتَاحِ"},{"type":"p","text":"ثُمَّ أَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً سِرًّا."},{"type":"p","text":"ثُمَّ أَرْكَعُ وَأَقُولُ سُبحَانَ رَبِّىَ  الْعَظِيمِ ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَرْفَعُ مِنَ الرُّكُوعِ قَائِلًا سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ."},{"type":"p","text":"فَإِذَا اعْتَدَلْتُ قُلْتُ رَبَّنَا وَلَكَ الْحَمْدُ."},{"type":"p","text":"ثُمَّ أَسْجُدُ وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَجْلِسُ ثُمَّ أَسْجُدُ مَرَّةً ثَانِيَةً وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ فَأَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُولَى مِنَ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى."},{"type":"p","text":"ثُمَّ أَقْرَأُ التَّشَهُّدَ ثُمَّ أَقُولُ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّالِثَةِ فَأَقْرَأُ الْفَاتِحَةَ "},{"type":"p","text":"ثُمَّ أَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُولَى مِنَ الرُّكُوعِ إِلَى السُّجُودِ الثَّانِى."},{"type":"p","text":"ثُمَّ أَقُومُ لِلرَّكْعَةِ الرَّابِعَةِ فَأَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الثَّالِثَةِ مِنْ قِرَاءَةِ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى."},{"type":"p","text":"ثُمَّ أَقْرَأُ التَّشَهُّدَ وَالصَّلاةَ الإِبْرَاهِيمِيَّةَ وَالدُّعَاءَ ءَاخِرَ الصَّلاةِ ثُمَّ أُنْهِى صَلاتِى قَائِلًا السَّلامُ عَلَيْكُم وَرَحْمَةُ اللَّهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"كَيْفَ أُصَلِّى الْعَصْرَ"},{"type":"p","text":""},{"type":"p","text":"أُصَلِّى صَلاةَ الْعَصْرِ كَصَلاةِ الظُّهْرِ تَمَامًا لَكِنْ أَقُولُ عِنْدَ النِّيَّةِ أُصَلِّى الْعَصْرَ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ "},{"type":"p","text":"يُقَالُ عَقِبَ الصَّلَوَاتِ الْخَمْسِ اللَّهُمَّ أَعِنِّى عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ"},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"كَيفَ أُصَلِّى الْمَغْرِبَ"},{"type":"p","text":""},{"type":"p","text":"أَقِفُ مُستَقْبِلًا الْقِبلَةَ الشَّرِيفَةَ"},{"type":"p","text":"وَأَقُولُ بِقَلْبِى أُصَلِّى الْمَغْرِبَ."},{"type":"p","text":"ثُمَّ أَرْفَعُ يَدَىَّ قَائِلًا اللَّهُ أَكْبَرُ."},{"type":"p","text":"ثُمَّ أَفْعَلُ فِى الرَّكْعَةِ الأُولَى وَالثَّانِيَةِ كَمَا فَعَلْتُ فِى صَلاةِ الصُّبْحِ فِى الرَّكْعَةِ الأُولَى وَالثَّانِيَةِ."},{"type":"p","text":"ثُمَّ أَجْلِسُ وَأَقْرَأُ التَّشَهُّدَ"},{"type":"p","text":"ثُمَّ أَقُولُ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ."},{"type":"p","text":"ثُمَّ أُكَبِّرُ وَأَقُومُ لِلرَّكْعَةِ الثَّالِثَةِ فَأَفْعَلُ فِيهَا كَمَا فَعَلْتُ فِى غَيْرِهَا مِنَ الرَّكَعَاتِ لَكِنْ لا أَقْرَأُ غَيْرَ الْفَاتِحَةِ فِى الْقِيَامِ."},{"type":"p","text":"ثُمَّ بَعْدَ السُّجُودِ الثَّانِى أَجْلِسُ وَأَقْرَأُ التَّشَهُّدَ ثُمَّ الصَّلاةَ الإِبْرَاهِيمِيَّةَ "},{"type":"p","text":"ثُمَّ أُنْهِى صَلاتِى قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ مَرَّتَيْنِ مَرَّةً إِلَى الْيَمِينِ وَمَرَّةً إِلى الْيَسَارِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى عَشَرَ"},{"type":"p","text":"كَيْفَ أُصَلِّى الْعِشَاءَ"},{"type":"p","text":""},{"type":"p","text":"أُصَلِّى صَلاةَ الْعِشَاءِ كَصَلاةِ الظُّهْرِ لَكِنْ أَقُولُ فِى النِّيَّةِ أُصَلِّى فَرْضَ الْعِشَاءِ."},{"type":"p","text":"وَأَقْرَأُ الْفَاتِحَةَ وَالسُّورَةَ بَعْدَهَا فِى الرَّكْعَةِ الأُولَى وَالثَّانِيَةِ جَهْرًا."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ"},{"type":"p","text":"اللَّهُمَّ اجْعَلْ أَوَّلَ هَذَا النَّهَارِ صَلاحًا وَأَوْسَطَهُ نَجَاحًا وَءَاخِرَهُ فَلاحًا يَا أَرْحَمَ الرَّاحِمِينَ."},{"type":"p","text":""}],"paragraphCount":106,"wordCount":761,"readingMinutes":5,"description":"المحتوى الكامل لـ فَصْلُ الْعِبَادَاتِ من الجزء الأول، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ الْجُزْءُ الأَوَّلُ فَصْلُ الْعِبَادَاتِ فَصْلُ الْعِبَادَاتِ\nالدَّرْسُ الأَوَّلُ\n\nفُرُوضُ الْوُضُوءِ\nفُرُوضُ الْوُضُوءِ سِتَّةُ أَشْيَاءَ هِىَ\nالنِّيَّةُ عِنْدَ غَسْلِ الْوَجْهِ.\nوَغَسْلُ الْوَجْهِ كُلِّهِ.\nوَغَسْلُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ.\nوَمَسْحُ بَعْضِ الرَّأْسِ.\nوَغَسْلُ الرِّجْلَينِ إِلَى الْكَعْبَيْنِ.\nوَتَرْتِيبُ هَذِهِ الأُمُورِ هَكَذَا.\n\nدُعَاءٌ \nاللَّهُمَّ اجْعَلْنِى مِنَ التَّوَّابِينَ وَاجْعَلْنِى مِنَ الْمُتَطَهِّرِينَ.\n\n\nالدَّرْسُ الثَّانِى\nنَوَاقِضُ الْوُضُوءِ\n\nيَنْقُضُ الْوُضُوءَ وَيُبْطِلُهُ أُمُورٌ مِنْهَا\nخُرُوجُ الْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ.\nوَالنَّوْمُ عَلَى الْجَنْبِ أَوِ الظَّهْرِ أَوِ الْبَطْنِ.\nفَمَنْ كَانَ مُتَوَضِّئًا وَحَصَلَ مِنْهُ هَذَا لَيْسَ لَهُ أَنْ يُصَلِّىَ حَتَّى يَتَوَضَّأَ مِنْ جَدِيدٍ.\n\nذِكْرٌ \nيُقَالُ بَعْدَ الْخُرُوجِ مِنَ الْخَلاءِ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى.\n\nالدَّرْسُ الثَّالِثُ\nالصَّلَوَاتُ الْخَمْسُ\n\nصَلاةُ الصُّبْحِ وَهِىَ رَكْعَتَانِ.\nصَلاةُ الظُّهْرِ وَهىَ أَرْبَعُ رَكَعَاتٍ.\nصَلاةُ الْعَصْرِ وَهِىَ أَرْبَعُ رَكَعَاتٍ.\nصَلاةُ الْمَغْرِبِ وَهِىَ ثَلاثُ رَكَعَاتٍ.\nصَلاةُ الْعِشَاءِ وَهِىَ أَرْبَعُ رَكَعَاتٍ.\nقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »خَمْسُ صَلَوَاتٍ كَتَبَهُنَّ اللَّهُ عَلَى الْعِبَادِ« رَوَاهُ الإِمَامُ أَحْمَدُ.\n\nدُعَاءٌ \nاللَّهُمَّ اجْعَلْنِى مِنَ الَّذِينَ يُقِيمُونَ الصَّلاةَ.\n\n\nالدَّرْسُ الرَّابِعُ\nمِنْ أَدْعِيَةِ الصَّلاةِ\n\nدُعَاءُ الِافْتِتَاحِ: وَجَّهْتُ وَجْهِىَ لِلَّذِى فَطَرَ السَّمٰوَاتِ وَالأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ إِنَّ صَلاتِى وَنُسُكِى وَمَحْيَاىَ وَمَمَاتِى لِلَّهِ رَبِّ الْعَالَمِينَ لا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ.\n\nدُعَاءٌ \nاللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ.\n\nالدَّرْسُ الْخَامِسُ\nالتَّشَهُّدُ فِى الصَّلاةِ\n\nالتَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\n\nذِكْرٌ \nأَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.\n\nالدَّرْسُ السَّادِسُ\nالصَّلاةُ الإِبْرَاهِيمِيَّةُ\n\nاللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ.\n\nدُعَاءٌ \nاللَّهُمَّ عَافِنِى فِى بَدَنِى اللَّهُمَّ عَافِنِى فِى سَمْعِى اللَّهُمَّ عَافِنِى فِى بَصَرِى.\n\nالدَّرْسُ السَّابِعُ\nمِنْ أَدْعِيَةِ الصَّلاةِ\n\nمِمَّا يُدْعَا بِهِ فِى ءَاخِرِ الصَّلاةِ رَبَّنَا ءَاتِنَا فِى الدُّنْيَا حَسَنَةً وَفِى الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.\nرَبَّنَا لا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.\n\nذِكْرٌ\nأَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ.\n\nالدَّرْسُ الثَّامِنُ\nكَيفَ أُصَلِّى الصُّبْحَ\n\nأَقِفُ مُسْتَقْبِلًا الْقِبْلَةَ الشَّرِيفَةَ وَأَقُولُ بِقَلْبِى أُصَلِّى الصُّبْحَ.\nثُمَّ أَرْفَعُ يَدَىَّ إِلَى مُحَاذَاةِ الأُذُنَيْنِ قَائِلًا اللَّهُ أَكْبَرُ.\nثُمَّ أَقْرَأُ دُعَاءَ الِافْتِتَاحِ.\nثُمَّ أَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً جَهْرًا.\nثُمَّ أَرْكَعُ وَأَقُولُ سُبحَانَ رَبِّىَ الْعَظِيمِ ثَلاثَ مَرَّاتٍ.\nثُمَّ أَرْفَعُ مِنَ الرُّكُوعِ قَائِلًا سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ.\nفَإِذَا اعْتَدَلْتُ أَقُولُ رَبَّنَا وَلَكَ الْحَمْدُ.\nثُمَّ أَسْجُدُ وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ.\nثُمَّ أَجْلِسُ وَأَقُولُ اللَّهُمَّ اغْفِرْ لِى وَارْحَمْنِى وَاهْدِنِى.\nثُمَّ أَسْجُدُ مَرَّةً ثَانِيَةً وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ وَأَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُوْلَى مِنَ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى. \nثُمَّ أَجْلِسُ وَأَقْرَأُ التَّشَهُّدَ وَالصَّلاةَ الإِبْرَاهِيمِيَّةَ.\nثُمَّ أَلْتَفِتُ إِلَى الْيَمِينِ وَأُسَلِّمُ قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ.\nثُمَّ أَلْتَفِتُ إِلَى الْيَسَارِ قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ.\n\nالدَّرْسُ التَّاسِعُ\nكَيفَ أُصَلِّى الظُّهْرَ\n\nأَقِفُ مُسْتَقْبِلًا الْقِبْلَةَ الشَّرِيفَةَ وَأَقُولُ بِقَلْبِى أُصَلِّى الظُّهْرَ.\nثُمَّ أَرْفَعُ يَدَىَّ قَائِلًا اللَّهُ أَكْبَرُ.\nثُمَّ أَقرَأُ دُعَاءَ الِافتِتَاحِ\nثُمَّ أَقْرَأُ الْفَاتِحَةَ وَشَيْئًا مِنَ الْقُرْءَانِ وَلَوْ سُورَةً قَصِيرَةً سِرًّا.\nثُمَّ أَرْكَعُ وَأَقُولُ سُبحَانَ رَبِّىَ  الْعَظِيمِ ثَلاثَ مَرَّاتٍ.\nثُمَّ أَرْفَعُ مِنَ الرُّكُوعِ قَائِلًا سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ.\nفَإِذَا اعْتَدَلْتُ قُلْتُ رَبَّنَا وَلَكَ الْحَمْدُ.\nثُمَّ أَسْجُدُ وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ.\nثُمَّ أَجْلِسُ ثُمَّ أَسْجُدُ مَرَّةً ثَانِيَةً وَأَقُولُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ فَأَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُولَى مِنَ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى.\nثُمَّ أَقْرَأُ التَّشَهُّدَ ثُمَّ أَقُولُ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الثَّالِثَةِ فَأَقْرَأُ الْفَاتِحَةَ \nثُمَّ أَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الأُولَى مِنَ الرُّكُوعِ إِلَى السُّجُودِ الثَّانِى.\nثُمَّ أَقُومُ لِلرَّكْعَةِ الرَّابِعَةِ فَأَفْعَلُ كَمَا فَعَلْتُ فِى الرَّكْعَةِ الثَّالِثَةِ مِنْ قِرَاءَةِ الْفَاتِحَةِ إِلَى السُّجُودِ الثَّانِى.\nثُمَّ أَقْرَأُ التَّشَهُّدَ وَالصَّلاةَ الإِبْرَاهِيمِيَّةَ وَالدُّعَاءَ ءَاخِرَ الصَّلاةِ ثُمَّ أُنْهِى صَلاتِى قَائِلًا السَّلامُ عَلَيْكُم وَرَحْمَةُ اللَّهِ.\n\nالدَّرْسُ الْعَاشِرُ\nكَيْفَ أُصَلِّى الْعَصْرَ\n\nأُصَلِّى صَلاةَ الْعَصْرِ كَصَلاةِ الظُّهْرِ تَمَامًا لَكِنْ أَقُولُ عِنْدَ النِّيَّةِ أُصَلِّى الْعَصْرَ.\n\nدُعَاءٌ \nيُقَالُ عَقِبَ الصَّلَوَاتِ الْخَمْسِ اللَّهُمَّ أَعِنِّى عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ\n\nالدَّرْسُ الْحَادِى عَشَرَ\nكَيفَ أُصَلِّى الْمَغْرِبَ\n\nأَقِفُ مُستَقْبِلًا الْقِبلَةَ الشَّرِيفَةَ\nوَأَقُولُ بِقَلْبِى أُصَلِّى الْمَغْرِبَ.\nثُمَّ أَرْفَعُ يَدَىَّ قَائِلًا اللَّهُ أَكْبَرُ.\nثُمَّ أَفْعَلُ فِى الرَّكْعَةِ الأُولَى وَالثَّانِيَةِ كَمَا فَعَلْتُ فِى صَلاةِ الصُّبْحِ فِى الرَّكْعَةِ الأُولَى وَالثَّانِيَةِ.\nثُمَّ أَجْلِسُ وَأَقْرَأُ التَّشَهُّدَ\nثُمَّ أَقُولُ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ.\nثُمَّ أُكَبِّرُ وَأَقُومُ لِلرَّكْعَةِ الثَّالِثَةِ فَأَفْعَلُ فِيهَا كَمَا فَعَلْتُ فِى غَيْرِهَا مِنَ الرَّكَعَاتِ لَكِنْ لا أَقْرَأُ غَيْرَ الْفَاتِحَةِ فِى الْقِيَامِ.\nثُمَّ بَعْدَ السُّجُودِ الثَّانِى أَجْلِسُ وَأَقْرَأُ التَّشَهُّدَ ثُمَّ الصَّلاةَ الإِبْرَاهِيمِيَّةَ \nثُمَّ أُنْهِى صَلاتِى قَائِلًا السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ مَرَّتَيْنِ مَرَّةً إِلَى الْيَمِينِ وَمَرَّةً إِلى الْيَسَارِ.\n\nالدَّرْسُ الثَّانِى عَشَرَ\nكَيْفَ أُصَلِّى الْعِشَاءَ\n\nأُصَلِّى صَلاةَ الْعِشَاءِ كَصَلاةِ الظُّهْرِ لَكِنْ أَقُولُ فِى النِّيَّةِ أُصَلِّى فَرْضَ الْعِشَاءِ.\nوَأَقْرَأُ الْفَاتِحَةَ وَالسُّورَةَ بَعْدَهَا فِى الرَّكْعَةِ الأُولَى وَالثَّانِيَةِ جَهْرًا.\n\nدُعَاءٌ\nاللَّهُمَّ اجْعَلْ أَوَّلَ هَذَا النَّهَارِ صَلاحًا وَأَوْسَطَهُ نَجَاحًا وَءَاخِرَهُ فَلاحًا يَا أَرْحَمَ الرَّاحِمِينَ.\n"},{"id":"part1-section3","partIndex":1,"partName":"الجزء الأول","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ","الْجُزْءُ الأَوَّلُ"],"title":"فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ","blocks":[{"type":"p","text":"فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"مِنْ صِفَاتِ الْمُسْلِمِ الصَّالِحِ"},{"type":"p","text":""},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ يَقْرَأُ الْقُرْءَانَ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ يُحِبُّ وَالِدَيْهِ الْمُؤْمِنَيْنِ وَيَحْتَرِمُهُمَا."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ يُحْسِنُ إِلَى مَنْ أَسَاءَ إِلَيْهِ كَمَا يُحْسِنُ إِلَى مَنْ أَحْسَنَ إِلَيْهِ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ يُسَاعِدُ الْفُقَرَاءَ وَالأَيْتَامَ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ يُكْرِمُ ضَيْفَهُ وَيُعَامِلُ جَارَهُ بِالإِحْسَانِ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ لا يَسْرِقُ"},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ لا يَضْرِبُ مُسْلِمًا بِغَيْرِ حَقٍّ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ لا يُؤْذِى مُسْلِمًا بِغَيْرِ حَقٍّ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ لا يَشْرَبُ الْخَمْرَ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ لا يَتَعَاطَى الْمُخَدِّرَاتِ الضَّارَّةَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"ءَادَابٌ إِسْلامِيَّةٌ"},{"type":"p","text":""},{"type":"p","text":"عِنْدَمَا أَسْتَيْقِظُ فِى الصَّبَاحِ أَقُولُ أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ."},{"type":"p","text":"عِنْدَ الْمَسَاءِ أَقُولُ أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ."},{"type":"p","text":"قَبْلَ الْبَدْءِ بِالأَكْلِ وَالشُّرْبِ أَقُولُ بِسْمِ اللَّهِ."},{"type":"p","text":"وَبَعْدَ الِانْتِهَاءِ مِنَ الأَكْلِ وَالشُّرْبِ أَقُولُ الْحَمْدُ لِلَّهِ الَّذِى أَطْعَمَ وَسَقَى وَسَوَّغَهُ وَجَعَلَ لَهُ مَخْرَجًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"طَــاعَةُ الْوَالِدَيْنِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [سُورَةَ الْبَقَرَةِ/83]."},{"type":"p","text":"وَقَالَ تَعَالَى ﴿فَلا تَقُلْ لَهُمَا أُفٍّ وَلا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيمًا﴾ [سُورَةَ الإِسْرَاءِ/23]."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ يُعَامِلُ وَالِدَيْهِ الْمُؤْمِنَيْنِ بِأَدَبٍ وَاحْتِرَامٍ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ لا يَرْفَعُ صَوْتَهُ فِى وَجْهِ أُمِّهِ وَأَبِيهِ بِلا حَقٍّ."},{"type":"p","text":"الْمُسْلِمُ الصَّالِحُ لا يَكْذِبُ عَلَى وَالِدَيْهِ."},{"type":"p","text":""},{"type":"p","text":"دُعَـاءٌ"},{"type":"p","text":"رَبِّ اغْفِرْ لِى وَلِوَالِدَىَّ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"حُسْنُ الْمُعَامَلَةِ"},{"type":"p","text":""},{"type":"p","text":"الْمُسْلِمُ يُحِبُّ الْمُسْلِمِينَ"},{"type":"p","text":"الْمُسْلِمُ يَقُولُ لِأَخِيْهِ الْمُسْلِمِ حِينَ يَلْقَاهُ السَّلامُ عَلَيْكُمْ فَيَرُدُّ عَلَيْهِ وَعَلَيْكُمُ السَّلامُ وَرَحْمَةُ اللَّهِ."},{"type":"p","text":"الْمُسْلِمُ يُعَامِلُ الْمُسْلِمِينَ بِلُطْفٍ وَأَدَبٍ."},{"type":"p","text":"الْمُسْلِمُ يَقُولُ لِأَخِيهِ الْمُسْلِمِ إِذَا أَحْسَنَ إِلَيْهِ"},{"type":"p","text":"بَارَكَ اللَّهُ فِيكَ أَوْ أَحْسَنَ اللَّهُ إِلَيْكَ أَوْ جَزَاكَ اللَّهُ خَيْرًا أَوْ نَحْوَ ذَلِكَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"فَضِيلَةُ الْمَسَاجِدِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »خَيْرُ بِقَاعِ الأَرْضِ الْمَسَاجِدُ« رَوَاهُ مُسْلِمٌ."},{"type":"p","text":"الْمُسْلِمُونَ يُصَلُّونَ فِى الْمَسَاجِدِ الصَّلَوَاتِ الْخَمْسَ."},{"type":"p","text":"الْمُسْلِمُونَ يَتَعَارَفُونَ فِى الْمَسَاجِدِ فَيُحِبُّ بَعْضُهُمْ بَعْضًا."},{"type":"p","text":"الْمَسَاجِدُ يُحِبُّهَا اللَّهُ تَعَالَى وَكَذَلِكَ يُحِبُّهَا الأَنْبِيَاءُ وَالصَّالِحُونَ."},{"type":"p","text":""}],"paragraphCount":41,"wordCount":267,"readingMinutes":2,"description":"المحتوى الكامل لـ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ من الجزء الأول، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ الْجُزْءُ الأَوَّلُ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ\nالدَّرْسُ الأَوَّلُ\nمِنْ صِفَاتِ الْمُسْلِمِ الصَّالِحِ\n\nالْمُسْلِمُ الصَّالِحُ يَقْرَأُ الْقُرْءَانَ.\nالْمُسْلِمُ الصَّالِحُ يُحِبُّ وَالِدَيْهِ الْمُؤْمِنَيْنِ وَيَحْتَرِمُهُمَا.\nالْمُسْلِمُ الصَّالِحُ يُحْسِنُ إِلَى مَنْ أَسَاءَ إِلَيْهِ كَمَا يُحْسِنُ إِلَى مَنْ أَحْسَنَ إِلَيْهِ.\nالْمُسْلِمُ الصَّالِحُ يُسَاعِدُ الْفُقَرَاءَ وَالأَيْتَامَ.\nالْمُسْلِمُ الصَّالِحُ يُكْرِمُ ضَيْفَهُ وَيُعَامِلُ جَارَهُ بِالإِحْسَانِ.\nالْمُسْلِمُ الصَّالِحُ لا يَسْرِقُ\nالْمُسْلِمُ الصَّالِحُ لا يَضْرِبُ مُسْلِمًا بِغَيْرِ حَقٍّ.\nالْمُسْلِمُ الصَّالِحُ لا يُؤْذِى مُسْلِمًا بِغَيْرِ حَقٍّ.\nالْمُسْلِمُ الصَّالِحُ لا يَشْرَبُ الْخَمْرَ.\nالْمُسْلِمُ الصَّالِحُ لا يَتَعَاطَى الْمُخَدِّرَاتِ الضَّارَّةَ.\n\nالدَّرْسُ الثَّانِى\nءَادَابٌ إِسْلامِيَّةٌ\n\nعِنْدَمَا أَسْتَيْقِظُ فِى الصَّبَاحِ أَقُولُ أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ.\nعِنْدَ الْمَسَاءِ أَقُولُ أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ.\nقَبْلَ الْبَدْءِ بِالأَكْلِ وَالشُّرْبِ أَقُولُ بِسْمِ اللَّهِ.\nوَبَعْدَ الِانْتِهَاءِ مِنَ الأَكْلِ وَالشُّرْبِ أَقُولُ الْحَمْدُ لِلَّهِ الَّذِى أَطْعَمَ وَسَقَى وَسَوَّغَهُ وَجَعَلَ لَهُ مَخْرَجًا.\n\nالدَّرْسُ الثَّالِثُ\nطَــاعَةُ الْوَالِدَيْنِ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [سُورَةَ الْبَقَرَةِ/83].\nوَقَالَ تَعَالَى ﴿فَلا تَقُلْ لَهُمَا أُفٍّ وَلا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيمًا﴾ [سُورَةَ الإِسْرَاءِ/23].\nالْمُسْلِمُ الصَّالِحُ يُعَامِلُ وَالِدَيْهِ الْمُؤْمِنَيْنِ بِأَدَبٍ وَاحْتِرَامٍ.\nالْمُسْلِمُ الصَّالِحُ لا يَرْفَعُ صَوْتَهُ فِى وَجْهِ أُمِّهِ وَأَبِيهِ بِلا حَقٍّ.\nالْمُسْلِمُ الصَّالِحُ لا يَكْذِبُ عَلَى وَالِدَيْهِ.\n\nدُعَـاءٌ\nرَبِّ اغْفِرْ لِى وَلِوَالِدَىَّ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا.\n\nالدَّرْسُ الرَّابِعُ\nحُسْنُ الْمُعَامَلَةِ\n\nالْمُسْلِمُ يُحِبُّ الْمُسْلِمِينَ\nالْمُسْلِمُ يَقُولُ لِأَخِيْهِ الْمُسْلِمِ حِينَ يَلْقَاهُ السَّلامُ عَلَيْكُمْ فَيَرُدُّ عَلَيْهِ وَعَلَيْكُمُ السَّلامُ وَرَحْمَةُ اللَّهِ.\nالْمُسْلِمُ يُعَامِلُ الْمُسْلِمِينَ بِلُطْفٍ وَأَدَبٍ.\nالْمُسْلِمُ يَقُولُ لِأَخِيهِ الْمُسْلِمِ إِذَا أَحْسَنَ إِلَيْهِ\nبَارَكَ اللَّهُ فِيكَ أَوْ أَحْسَنَ اللَّهُ إِلَيْكَ أَوْ جَزَاكَ اللَّهُ خَيْرًا أَوْ نَحْوَ ذَلِكَ.\n\nالدَّرْسُ الْخَامِسُ\nفَضِيلَةُ الْمَسَاجِدِ\n\nقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »خَيْرُ بِقَاعِ الأَرْضِ الْمَسَاجِدُ« رَوَاهُ مُسْلِمٌ.\nالْمُسْلِمُونَ يُصَلُّونَ فِى الْمَسَاجِدِ الصَّلَوَاتِ الْخَمْسَ.\nالْمُسْلِمُونَ يَتَعَارَفُونَ فِى الْمَسَاجِدِ فَيُحِبُّ بَعْضُهُمْ بَعْضًا.\nالْمَسَاجِدُ يُحِبُّهَا اللَّهُ تَعَالَى وَكَذَلِكَ يُحِبُّهَا الأَنْبِيَاءُ وَالصَّالِحُونَ.\n"},{"id":"part2-section1","partIndex":2,"partName":"الجزء الثاني","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّانِى"],"title":"فَصْلُ الْعَقَائِدِ","blocks":[{"type":"p","text":"فَصْلُ الْعَقَائِدِ"},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"أَفْضَلُ الأَعْمَـالِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"الإِيـمَانُ بِاللَّهِ وَرَسُولِهِ مُحَمَّدٍ ﷺ هُوَ أَفْضَلُ الأَعْمَالِ وَأَحَبُّهَا إِلَى اللَّهِ تَعَالَى."},{"type":"p","text":"الأَعْمَالُ الصَّالِحَةُ كَالصَّلاةِ وَالصِّيَامِ وَالْحَجِّ وَالزَّكَاةِ لا تَصِحُّ إِلَّا مَعَ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ."},{"type":"p","text":"الكَافِرُ لا تُقْبَلُ مِنْهُ الأَعْمَالُ الصَّالِحَةُ."},{"type":"p","text":"أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":"صَلَّى اللَّهُ عَلَى مُحَمَّدٍ ﷺ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ أَفْضَلُ الأَعْمَالِ اذْكُرِ الْحَدِيْثَ."},{"type":"p","text":"     (2) عَدِّدْ بَعْضَ الأَعْمَالِ الصَّالِحَةِ."},{"type":"p","text":"     (3) مَنِ الَّذِى لا تُقْبَلُ مِنْهُ الأَعْمَالُ الصَّالِحَةُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"اللَّهُ رَبِّى"},{"type":"p","text":""},{"type":"p","text":"اللَّهُ خَالِقُ كُلِّ شَىْءٍ"},{"type":"p","text":"اللَّهُ قَادِرٌ عَلَى كُلِّ شَىْءٍ"},{"type":"p","text":"اللَّهُ عَالِمٌ بِكُلِّ شَىْءٍ"},{"type":"p","text":"اللَّهُ مَالِكُ كُلِّ شَىْءٍ"},{"type":"p","text":"اللَّهُ لَيْسَ لَهُ شَبِيهٌ"},{"type":"p","text":"اللَّهُ لَيْسَ لَهُ شَرِيكٌ"},{"type":"p","text":"اللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ"},{"type":"p","text":"اللَّهُ لَيْسَ كَمِثْلِهِ شَىْءٌ"},{"type":"p","text":""},{"type":"p","text":"ذِكْــــرٌ"},{"type":"p","text":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"},{"type":"p","text":"سُبْحَانَ اللَّهِ الْعَظِيمِ"},{"type":"p","text":"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ"},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"اللَّهُ لا يُشْبِهُ شَيْئًا"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ وَهُوَ السَّمِيْعُ الْبَصِيْرُ﴾ [سُورَةَ الشُّورَى/11]."},{"type":"p","text":"اللَّهُ خَلَقَ النُّورَ أَىِ الضَّوْءَ فَلا يُشْبِهُ النُّورَ. "},{"type":"p","text":"اللَّهُ خَلَقَ الْهَوَاءَ فَلا يُشْبِهُ الْهَوَاءَ."},{"type":"p","text":"اللَّهُ خَلَقَ الشَّمْسَ فَلا يُشْبِهُ الشَّمْسَ."},{"type":"p","text":"اللَّهُ خَلَقَ الْقَمَرَ فَلا يُشْبِهُ الْقَمَرَ."},{"type":"p","text":"اللَّهُ خَلَقَ الإِنْسَانَ فَلا يُشْبِهُ الإِنْسَانَ."},{"type":"p","text":"اللَّهُ خَلَقَ الْمَلائِكَةَ فَلا يُشْبِهُ الْمَلائِكَةَ."},{"type":"p","text":"اللَّهُ خَلَقَ كُلَّ شَىْءٍ فَلا يُشْبِهُ شَيْئًا."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ"},{"type":"p","text":"اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى أَنَّ اللَّه لا يُشْبِهُ شَيْئًا."},{"type":"p","text":"     (2) عَدِّدْ بَعْضَ الأَشْيَاءِ الَّتِى خَلَقَهَا اللَّهُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"اللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ"},{"type":"p","text":""},{"type":"p","text":"اللَّهُ خَلَقَ الْبَشَرَ اللَّهُ لا يَحْتَاجُ إِلَى الْبَشَرِ."},{"type":"p","text":"اللَّهُ خَلَقَ الْهَوَاءَ اللَّهُ لا يَحْتَاجُ إِلَى الْهَوَاءِ."},{"type":"p","text":"اللَّهُ خَلَقَ الأَرْضَ اللَّهُ لا يَحْتَاجُ إِلَى الأَرْضِ."},{"type":"p","text":"اللَّهُ خَلَقَ السَّمَاءَ اللَّهُ لا يَحْتَاجُ إِلَى السَّمَاءِ."},{"type":"p","text":"اللَّهُ خَلَقَ الْعَرْشَ اللَّهُ لا يَحْتَاجُ إِلَى الْعَرْشِ."},{"type":"p","text":"اللَّهُ خَلَقَ الْمَلائِكَةَ اللَّهُ لا يَحْتَاجُ إِلَى الْمَلائِكَةِ."},{"type":"p","text":"اللَّهُ خَالِقُ كُلِّ شَىْءٍ اللَّهُ لا يَحْتَاجُ إِلَى شَىْءٍ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ"},{"type":"p","text":"الْحَمْدُ لِلَّهِ الَّذِى كَفَانِى وَءَاوَانِى."},{"type":"p","text":"الْحَمْدُ لِلَّهِ الَّذِى أَطْعَمَنِى وَسَقَانِى."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"شَرْحُ صِفَاتِ اللَّهِ تَعَالَى"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَلِلَّهِ الْمَثَلُ الأَعْلَى﴾ [سُورَةَ النَّحْل/60]."},{"type":"p","text":"أَىْ لِلَّهِ تَعَالَى صِفَاتٌ لَيْسَتْ كَصِفَاتِ غَيْرِهِ."},{"type":"p","text":"وَمِنْ هَذِهِ الصِّفَاتِ ثَلاثَ عَشْرَةَ صِفَةً تَجِبُ مَعْرِفَتُهَا عَلَى كُلِّ مُكَلَّفٍ وَهِىَ"},{"type":"p","text":"(1) الْوُجُودُ: اللَّهُ مَوْجُودٌ لا بِدَايَةَ وَلا نِهَايَةَ لِوُجُودِهِ."},{"type":"p","text":"(2) الْوَحْدَانِيَّةُ: اللَّهُ وَاحِدٌ لا شَرِيكَ لَهُ وَلا مَعْبُودَ بِحَقٍّ سِوَاهُ."},{"type":"p","text":"(3) الْقِيَامُ بِالنَّفْسِ: اللَّهُ لا يَحْتَاجُ إِلَى غَيْرِهِ."},{"type":"p","text":"(4) الْمُخَالَفَةُ لِلْحَوَادِثِ: اللَّهُ لا يُشْبِهُ الْمَخْلُوقَاتِ."},{"type":"p","text":"(5) الْقِدَمُ: اللَّهُ لا بِدَايَةَ لِوُجُودِهِ."},{"type":"p","text":"(6) الْبَقَاءُ، اللَّهُ لا نِهَايَةَ لِوُجُودِهِ لا يَفْنَى وَلا يَمُوتُ."},{"type":"p","text":"(7) الْقُدْرَةُ، اللَّهُ قَادِرٌ عَلَى كُلِّ شَىْءٍ."},{"type":"p","text":"(8) الإِرَادَةُ أَىِ الْمَشِيئَةُ فَكُلُّ شَىْءٍ يَحْصُلُ بِإِرَادَةِ اللَّهِ أَىْ بِمَشِيئَتِهِ."},{"type":"p","text":"(9) السَّمْعُ، اللَّهُ يَسْمَعُ بِدُونِ أُذُنٍ وَلا ءَالَةٍ أُخْرَى."},{"type":"p","text":"(10) الْبَصَرُ، اللَّهُ يَرَى بِدُونِ حَدَقَةٍ وَلا ءَالَةٍ أُخْرَى."},{"type":"p","text":"(11) الْكَلامُ، اللَّهُ يَتَكَلَّمُ بِدُونِ لِسَانٍ وَلا شَفَتَيْنِ وَكَلامُهُ لَيْسَ لُغَةً عَرَبِيَّةً وَلا غَيْرَهَا وَلا يُشْبِهُ كَلامَنَا."},{"type":"p","text":"(12) الْحَيَاةُ، اللَّهُ حَىٌّ وَحَيَاتُهُ بِدُونِ رُوحٍ وَلَحْمٍ وَقَلْبٍ وَهُوَ حَىٌّ لا يَمُوتُ."},{"type":"p","text":"(13) الْعِلْمُ، اللَّهُ يَعْلَمُ كُلَّ الأَشْيَاءِ قَبْلَ حُصُولِهَا مِنْ دُونِ مُعَلِّمٍ."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ"},{"type":"p","text":"اللَّهُمَّ يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِى عَلَى دِينِ الإِسْلامِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"دَعْوَةُ الرَّسُولِ ﷺ"},{"type":"p","text":""},{"type":"p","text":"دَعَا سَيِّدُنَا مُحَمَّدٌ ﷺ النَّاسَ إِلَى عِبَادَةِ اللَّهِ وَتَرْكِ عِبَادَةِ الأَوْثَانِ. قَالَ لَهُمْ"},{"type":"p","text":"قُولُوا لا إِلَهَ إِلَّا اللَّهُ مُحَمَّدٌ رَسُولُ اللَّهِ وَعَلَّمَهُمْ "},{"type":"p","text":"أَنَّ الإِيـمَانَ أَفْضَلُ الأَعْمَالِ."},{"type":"p","text":"وَأَنَّ مَنْ مَاتَ عَلَى الإِيـمَانِ لا بُدَّ أَنْ يَدْخُلَ الْجَنَّةَ."},{"type":"p","text":"وَأَنَّ الإِسْلامَ دِينُ جَمِيعِ الأَنْبِيَاءِ."},{"type":"p","text":"وَأَنَّ أَكْبَرَ ذَنْبٍ هُوَ الْكُفْرُ. "},{"type":"p","text":"وَأَنَّ مَنْ مَاتَ عَلَى الْكُفْرِ دَخَلَ النَّارَ خَالِدًا فِيهَا."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) إِلَى مَا دَعَا النَّبِىُّ ﷺ."},{"type":"p","text":"     (2) مَاذَا قَالَ لَهُمْ."},{"type":"p","text":"     (3) مَا هُوَ أَفْضَلُ الأَعْمَالِ وَمَا هُوَ أَكْبَرُ ذَنْبٍ."},{"type":"p","text":"     (4) مَنْ هُوَ الَّذِى يَدْخُلُ الْجَنَّةَ وَمَنْ يُخَلَّدُ فِى النَّارِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"أَكْبَرُ الذُّنُوبِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ لا يَغْفِرُ أَنْ يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَلِكَ لِمَنْ يَشَاءُ﴾ [سُورَةَ النِّسَاءِ/48]."},{"type":"p","text":"الْكُفْرُ هُوَ نَقِيضُ الإِيـمَانِ وَهُوَ الذَّنْبُ الَّذِى لا يَغْفِرُهُ اللَّهُ لِمَنْ مَاتَ عَلَيْهِ."},{"type":"p","text":"وَالْكُفْرُ ثَلاثَةُ أَنْوَاعٍ الْكُفْرُ الِاعْتِقَادِىُّ وَالْكُفْرُ الْفِعْلِىُّ وَالْكُفْرُ اللَّفْظِىُّ وَيُسَمَّى أَيْضًا الْكُفْرَ الْقَوْلِىَّ."},{"type":"p","text":"الْكُفْرُ الِاعْتِقَادِىُّ كَالَّذِى يَعْتَقِدُ أَنَّ اللَّهَ سَاكِنٌ فِى السَّمَاءِ أَوْ جَالِسٌ عَلَى الْعَرْشِ أَوْ أَنَّهُ رُوحٌ أَوْ ضَوْءٌ أَوْ أَنَّ لَهُ شَكْلًا وَصُورَةً."},{"type":"p","text":"الْكُفْرُ الْفِعْلِىُّ كَالَّذِى يَرْمِى الْمُصْحَفَ فِى القَاذُورَاتِ أَوْ يَدُوسُ عَلَيْهِ."},{"type":"p","text":"الْكُفْرُ اللَّفْظِىُّ كَالَّذِى يَسُبُّ اللَّهَ أَوْ مَلَكًا مِنَ الْمَلائِكَةِ كَعَزْرَائِيلَ أَوْ نَبِيًّا مِنَ الأَنْبِيَاءِ كَمُحَمَّدٍ أَوْ عِيسَى أَوْ دِينَ الإِسْلامِ."},{"type":"p","text":" "},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ الذَّنْبُ الَّذِى لا يَغْفِرُهُ اللَّهُ لِمَنْ مَاتَ عَلَيْهِ."},{"type":"p","text":"     (2) كَمْ نَوْعًا الْكُفْرُ عَدِّدْهَا."},{"type":"p","text":"     (3) أَعْطِ مِثَالًا عَنْ كُلِّ نَوْعٍ مِنْهَا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"الإِسْلامُ دِينُ الأَنْبِيَاءِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلامُ﴾ [سُورَةَ ءَالِ عِمْرَان/19]."},{"type":"p","text":"الإِسْلامُ هُوَ الدِّينُ الَّذِى رَضِيَهُ اللَّهُ لِعِبَادِهِ وَأَمَرَنَا بِاتِّبَاعِهِ."},{"type":"p","text":"الإِسْلامُ هُوَ دِينُ جَمِيْعِ الأَنْبِيَاءِ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ."},{"type":"p","text":"الأَنْبِيَاءُ كُلُّهُمْ مُسْلِمُونَ مُؤْمِنُونَ بِاللَّهِ أَوَّلُهُمْ سَيِّدُنَا ءَادَمُ وَءَاخِرُهُمْ سَيِّدُنَا مُحَمَّدٌ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ."},{"type":"p","text":"كُلُّ الأَنبْيِاَءِ كَانُوا يَعْبُدُونَ اللَّهَ وَحْدَهُ وَلا يُشْرِكُونَ بِهِ شَيْئًا."},{"type":"p","text":"الأَنْبِيَاءُ عَلَّمُوا النَّاسَ أَنْ يَقُولُوا لا إِلَهَ إِلَّا اللَّهُ. "},{"type":"p","text":"سَجَدَ وَجْهِى لِلَّذِى خَلَقَهُ وَصَوَّرَةُ وَشَقَّ سَمْعَهُ وَبَصَرَهُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ الدِّينُ الَّذِى رَضِيَهُ اللَّهُ لِعِبَادِهِ."},{"type":"p","text":"     (2) اذْكُرِ الآيَةَ القُرْءَانِيَّةَ الَّتِى تَدُلُّ عَلَى ذَلِكَ."},{"type":"p","text":"     (3) مَنْ هُوَ أَوَّلُ الأَنْبِيَاءِ مَنْ هُوَ ءَاخِرُهُمْ."},{"type":"p","text":"     (4) مَاذَا عَلَّمَ كُلُّ الأَنْبِيَاءِ النَّاسَ أَنْ يَقُولُوا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"صِفَاتُ الأَنْبِيَاءِ عَلَيْهِمُ السَّلامُ"},{"type":"p","text":""},{"type":"p","text":"قاَلَ اللَّهُ تَعَالَى عَنِ الأَنبْيِاءِ ﴿وَكُلًّا فَضَّلْنَا عَلَى الْعَالَمِينَ﴾ [سُورَةَ الأَنْعَامِ/86]."},{"type":"p","text":"الأَنْبِيَاءُ هُمْ أَفْضَلُ مَخْلُوقَاتِ اللَّهِ أَفْضَلُ مِنَ الْمَلائِكَةِ وَمِنْ سَائِرِ الْبَشَرِ وَالْجِنِّ اصْطَفَاهُمُ اللَّهُ مِنْ بَيْنِ الْبَشَرِ الذُّكُورِ لِيُبَلِّغُوا النَّاسَ أَحْكامَ الشَّرَائِعِ وَيُعَلِّمُوهُمْ دِينَ الإِسْلامِ الَّذِى رَضِيَهُ اللَّهُ لِعِبَادِهِ وَحَرَّمَ عَلَيْهِمْ كُلَّ دِينٍ سِوَاهُ."},{"type":"p","text":"وَأَفْضَلُ هَؤُلاءِ الأَنْبِيَاءِ خَمْسَةٌ وَيُسَمَّوْنَ بِأُولِى الْعَزْمِ وَهُمْ مُحَمَّدٌ وَإِبْرَاهِيمُ وَمُوسَى وَعِيسَى وَنُوحٌ صَلَّى اللَّهُ عَلَيْهِمْ وَسَلَّمَ أَجْمَعِينَ."},{"type":"p","text":"وَكُلُّ نَبِىٍّ مَوْصُوفٌ بِالصِّدقِ وَالأَمَانَةِ وَالذَّكَاءِ وَالشَّجَاعَةِ وَالْعِفَّةِ وَالتَّبْلِيغِ أَىْ تَبْلِيغِ مَا أَمَرَهُمُ اللَّهُ بِتَبْلِيغِهِ مِنْ غَيْرِ تَقْصِيرٍ أَوْ تَغْيِيرٍ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَنْ هُمْ أَفْضَلُ مَخْلُوقَاتِ اللَّهِ، اذْكُرِ الآيَةَ الَّتِى تَدُلُّ عَلَى ذَلِكَ."},{"type":"p","text":"     (2) مِمَّنِ اصْطَفَى اللَّهُ الأَنْبِيَاءَ."},{"type":"p","text":"     (3) لِمَ بَعَثَ اللَّهُ الأَنْبِيَاءَ."},{"type":"p","text":"     (4) مَنْ هُمْ أُولُوا الْعَزْمِ."},{"type":"p","text":"     (5) اذْكُرْ بَعْضَ مَا يُوصَفُ بِهِ كُلُّ نَبِىٍّ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"الْمَلائِكَةُ الْكِرَامُ"},{"type":"p","text":""},{"type":"p","text":"خَلَقَ اللَّهُ الْمَلائِكَةَ مِنْ نُورٍ وَجَعَلَ لَهُمْ أَجْنِحَةً."},{"type":"p","text":"لَيْسُوا ذُكُورًا وَلا إِنَاثًا."},{"type":"p","text":"وَهُمْ عِبَادٌ لِلَّهِ طَائِعُونَ"},{"type":"p","text":"لا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ."},{"type":"p","text":"لا يَأْكُلُونَ وَلا يَشْرَبُونَ"},{"type":"p","text":"وَلا يَنَامُونَ وَلا يَتْعَبُونَ"},{"type":"p","text":"وَعَدَدُهُمْ كَبِيرٌ جِدًّا"},{"type":"p","text":"الْمُسْلِمُ يُحِبُّ الْمَلائِكَةَ وَلا يَسْتَخِفُّ بِهِمْ."},{"type":"p","text":""},{"type":"p","text":"ذِكْرٌ"},{"type":"p","text":"يُقَالُ صَبَاحًا وَمَسَاءً ثَلاثَ مَرَّاتٍ"},{"type":"p","text":"بِسْمِ اللَّهِ الَّذِى لا يَضُرُّ مَعَ اسْمِهِ شَىْءٌ فِى الأَرْضِ وَلا فِى السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مِمَّ خَلَقَ اللَّهُ الْمَلائِكَةَ."},{"type":"p","text":"     (2) مَنْ هُمُ الْمَلائِكَةُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"الْكُتُبُ السَّمَاوِيَّةُ"},{"type":"p","text":""},{"type":"p","text":"الْكُتُبُ السَّمَاوِيَّةُ كُتُبٌ أَنْزَلَهَا اللَّهُ عَلَى بَعْضِ الأَنْبِيَاءِ كُلُّهَا تَأْمُرُ بِدِينِ الإِسْلامِ."},{"type":"p","text":"وَهِىَ كَثِيرَةٌ أَشْهَرُهَا أَرْبَعَةٌ"},{"type":"p","text":"الْقُرْءَانُ أُنْزِلَ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ وَعَلَى سَائِرِ إِخْوَانِهِ النَّبِيِّينَ وَهُوَ بِالْعَرَبِيَّةِ."},{"type":"p","text":"الإِنْجِيلُ أُنْزِلَ عَلَى سَيِّدِنا عِيسَى وَهُوَ بِاللُّغَةِ السُّرْيَانِيَّةِ."},{"type":"p","text":"التَّوْرَاةُ أُنْزِلَ عَلَى سَيِّدِنَا مُوسَى وَهُوَ بِاللُّغَةِ الْعِبْرَانِيَّةِ."},{"type":"p","text":"الزَّبُورُ أُنْزِلَ عَلَى سَيِّدِنا دَاوُدَ وَهُوَ بِاللُّغَةِ الْعِبْرَانِيَّةِ."},{"type":"p","text":"أَنَا مُسْلِمٌ أُؤْمِنُ بِكُلِّ الكُتُبِ السَّمَاوِيَّةِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ الْكُتُبُ السَّمَاوِيَّةُ."},{"type":"p","text":"     (2) بِمَ تَأْمُرُ الْكُتُبُ السَّمَاوِيَّةُ."},{"type":"p","text":"     (3) عَدِّدْ بَعْضَ الْكُتُبِ السَّمَاوِيَّةِ."},{"type":"p","text":"     (4) عَلَى مَنْ أُنْزِلَ الْقُرْءَانُ وَالإِنْجِيلُ وَالتَّوْرَاةُ وَالزَّبُورُ."},{"type":"p","text":""}],"paragraphCount":156,"wordCount":1079,"readingMinutes":6,"description":"المحتوى الكامل لـ فَصْلُ الْعَقَائِدِ من الجزء الثاني، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّانِى فَصْلُ الْعَقَائِدِ فَصْلُ الْعَقَائِدِ\n\nالدَّرْسُ الأَوَّلُ\nأَفْضَلُ الأَعْمَـالِ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ« رَوَاهُ الْبُخَارِىُّ.\nالإِيـمَانُ بِاللَّهِ وَرَسُولِهِ مُحَمَّدٍ ﷺ هُوَ أَفْضَلُ الأَعْمَالِ وَأَحَبُّهَا إِلَى اللَّهِ تَعَالَى.\nالأَعْمَالُ الصَّالِحَةُ كَالصَّلاةِ وَال

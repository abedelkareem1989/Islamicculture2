َانَهُ دَفْعَةً وَاحِدَةً.\n   (7) وَالِاعْتِدَالُ بِأَنْ يَنْتَصِبَ بَعْدَ الرُّكُوعِ قَائِمًا.\n   (8) وَالطُّمَأْنِينَةُ فِيهِ.\n   (9) وَالسُّجُودُ مَرَّتَيْنِ بِأَنْ يَضَعَ جَبْهَتَهُ كُلَّهَا أَوْ بَعْضَهَا عَلَى مصَلَّاهُ مَكْشُوفَةً وَمُتَثَاقِلًا بِهَا وَيَضَعَ شَيْئًا مِنْ رُكْبَتَيْهِ وَمِنْ بُطُونِ كَفَّيْهِ وَمِنْ بُطُونِ أَصَابِعِ رِجْلَيْهِ.\n   (10) وَالطُّمَأْنِينَةُ فِيهِ.\n   (11) وَالْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ.\n   (12) وَالطُّمَأْنِينَةُ فِيهِ.\n   (13) وَالْجُلُوسُ الأَخِيرُ أَىْ لِلتَّشَهُّدِ وَمَا بَعْدَهُ مِنَ الصَّلاةِ عَلَى النَّبِىِّ وَالسَّلامِ.\n   (14) وَالتَّشَهُّدُ الأَخِيرُ فَيَقُولُ التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ هَذَا أَكْمَلُهُ وَلَهُ أَقَلُّ.\n   (15) وَالصَّلاةُ عَلَى النَّبِىِّ وَأَقَلُّهَا اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَالأَكْمَلُ أَنْ يَأْتِىَ بِالصَّلاةِ الإِبْرَاهِيمِيَّةِ كُلِّهَا.\n   (16) وَالسَّلامُ وَأَقَلُّهُ السَّلامُ عَلَيْكُمْ.\n   (17) وَالتَّرْتِيبُ أَىْ أَنْ يَأْتِىَ بِالأَرْكَانِ كَمَا ذَكَرْنَاهَا بِالتَّرْتِيبِ فَمَنْ قَدَّمَ رُكْنًا فِعْلِيًا عَلَى مَا بَعْدَهُ كَأَنْ سَجَدَ قَبْلَ الرُّكُوعِ عَمْدًا بَطَلَتْ صَلاتُهُ.\n   سُنَنُ الصَّلاةِ مِنْهَا\n   (1) وَضْعُ الْيَدِ الْيُمْنَى عَلَى كُوعِ الْيُسْرَى فَوْقَ السُّرَّةِ وَتَحْتَ الصَّدْرِ.\n   (2) وَقِرَاءَةُ دُعَاءِ الِافْتِتَاحِ قَبْلَ قِرَاءَةِ الْفَاتِحَةِ فِى الرَّكْعَةِ الأُولَى فَقَطْ.\n   (3) وَقِرَاءَةُ شَىْءٍ مِنَ الْقُرْءَانِ بَعْدَ الْفَاتِحَةِ مِنَ الرَّكَعْتَيْنِ الأُولَيَيْنِ.\n   (4) وَالتَّكْبِيرَاتُ عِنْدَ الرَّفْعِ وَالْخَفْضِ.\n   (5) وَقَوْلُ سُبْحَانَ رَبِّىَ الْعَظِيمِ ثَلاثَ مَرَّاتٍ فِى الرُّكُوعِ.\n   (6) وَقَوْلُ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ فِى الِاعْتِدَالِ.\n   (7) وَقَوْلُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ فِى السُّجُودِ.\n   (8) وَقَوْلُ اللَّهُمَّ اغْفِرْ لِى وَارْحَمْنِى وَاهْدِنِى وَعَافِنِى وَارْزُقْنِى فِى الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ.\n   (9) وَقِرَاءَةُ الصَّلاةِ الإِبْرَاهِيمِيَّةِ بَعْدَ التَّشَهُّدِ الأَخِيرِ.\n   (10) وَزِيَادَةُ وَرَحْمَةُ اللَّهِ فِى السَّلامِ فَيَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ. \n   (11) وَالتَّسْلِيمَةُ الثَّانِيَةُ وَالِالْتِفَاتُ فِى الأُولَى إِلَى الْيَمِينِ وَفِى الثَّانِيَةِ إِلَى الْيَسَارِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ أَرْكَانُ الصَّلاةِ.\n     (2) أَيْنَ مَحَلُّ النِّيَّةِ وَمَاذَا يَنْوِى لَوْ أَرَادَ أَنْ يُصَلِّىَ الظُّهْرَ مَثَلًا.\n     (3) مَنْ عَجَزَ أَنْ يُصَلِّىَ قَائِمًا مَاذَا يَفْعَلُ، فَإِنْ عَجَزَ.\n     (4) مَا هِىَ الأُمُورُ الَّتِى يَجِبُ مُرَاعَاتُهَا فِى الْفَاتِحَةِ.\n     (5) مَا هُوَ الرُّكُوعُ وَمَا مَعْنَى الطُّمَأْنِينَةِ.\n     (6) مَا مَعْنَى الِاعْتِدَالِ وَكَمْ مَرَّةً السُّجُودُ فِى كُلِّ رَكْعَةٍ.\n     (7) اذْكُرْ كَيْفِيَّةَ السُّجُودِ فِى الصَّلاةِ.\n     (8) مَا هُوَ أَكْمَلُ التَّشَهُّدِ الأَخِيرِ.\n   (9) مَا هُوَ أَقَلُّ الصَّلاةِ عَلَى النَّبِىِّ وَمَا هُوَ أَقَلُّ السَّلامِ.\n   (10) مَا مَعْنَى التَّرْتِيبِ.\n   (11) اذْكُرْ بَعْضَ سُنَنِ الصَّلاةِ.\n   (12) مَاذَا يُسَنُّ أَنْ نَقْرَأَ قَبْلَ الْفَاتِحَةِ.\n   (13) مَاذَا يُسَنُّ أَنْ نَقْرَأَ بَعْدَ الْفَاتِحَةِ وَفِى أَىِّ الرَّكَعَاتِ.\n   (14) مَاذَا يُسَنُّ أَنْ نَقُولَ فِى الرُّكُوعِ وَفِى الِاعْتِدَالِ.\n   (15) مَاذَا يُسَنُّ أَنْ نَقُولَ فِى السُّجُودِ وَفِى الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ.\n\nالدَّرْسُ التَّاسِعُ\nشُرُوطُ صِحَّةِ الصَّلاةِ\n\n   شُرُوطُ صِحَّةِ الصَّلاةِ هِىَ الأُمُورُ الَّتِى لا بُدَّ مِنْهَا لِصِحَّةِ الصَّلاةِ قَبْلَ الشُّرُوعِ فِيهَا وَهِىَ\n   (1) الإِسْلامُ فَلا تَصِحُّ الصَّلاةُ مِنْ كَافِرٍ.\n   (2) وَالتَّمْيِيزُ وَهُوَ أَنْ يَكُونَ الْوَلَدُ بَلَغَ مِنَ الْعُمُرِ إِلَى حَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ وَيُشْتَرَطُ أَنْ يَكُونَ عَاقِلًا غَيْرَ مَجْنُونٍ.\n   (3) وَالطَّهَارَةُ مِنَ الْحَدَثَيْنِ: أَنْ يَكُونَ مُتَوَضِّئًا لَيْسَ عَلَيْهِ حَدَثٌ أَصْغَرُ وَلَيْسَ عَلَيْهِ حَدَثٌ أَكْبَرُ.\n   (4) وَطَهَارَةُ الثِّيَابِ وَالْبَدَنِ وَالْمَكَانِ وَالْمَحْمُولِ فَإِنْ كَانَ فِى جَيْبِهِ قِطْعَةُ قِمَاشٍ مُتَنَجِّسَةٌ وَصَلَّى بِهَا فَلا تَصِحُّ صَلاتُهُ.\n   (5) وَسَتْرُ الْعَوْرَةِ وَعَوْرَةُ الرَّجُلِ مَا بَيْنَ السُّرَّةِ إِلَى الرُّكْبَةِ أَمَّا الْمَرْأَةُ الْحُرَّةُ فَعَوْرَتُهَا جَمِيعُ بَدَنِهَا مَا عَدَا وَجْهَهَا وَكَفَّيْهَا.\n   (6) وَأَنْ يَعْلَمَ الْمُصَلِّى بِدُخُولِ وَقْتِ الصَّلاةِ.\n   (7) وَأَنْ لا يَعْتَقِدَ فَرْضًا مِنْ فُرُوضِهَا سُنَّةً.\n   (8) وَاسْتِقْبَالُ الْقِبْلَةِ وَهِىَ الْكَعْبَةُ الْمُشَرَّفَةُ فِى مَكَّةَ الْمُكَرَّمَةِ فَمَنْ أَخَلَّ بِشَرْطٍ مِنْ هَذِهِ الشُّرُوطِ لا تَصِحُّ صَلاتُهُ.\n\n     أَسْئِلَةٌ\n     (1) عَدِّدْ شُرُوطَ صِحَّةِ الصَّلاةِ.\n     (2) مَا هُوَ التَّمْيِيزُ.\n     (3) مَا مَعْنَى الطَّهَارَةِ مِنَ الْحَدَثَيْنِ.\n     (4) هَلْ تَصِحُّ الصَّلاةُ إِنْ كَانَ الْمُصَلِّى يَحْمِلُ نَجَاسَةً لا يُعْفَى عَنْهَا.\n     (5) مَا هِىَ عَوْرَةُ الرَّجُلِ فِى الصَّلاةِ وَمَا هِىَ عَوْرَةُ الْمَرْأَةِ الْحُرَّةِ.\n     (6) مَا هِىَ الْقِبْلَةُ.\n     (7) مَنْ تَرَكَ شَيْئًا مِنْ هَذِهَ الشُّرُوطِ مَا حُكْمُ صَلاتِهِ.\n\nالدَّرْسُ الْعَاشِرُ\nمُبْطِلاتُ الصَّلاةِ\n\n   يَنْبَغِى لِلْمُسْلِمِ أَنْ يَكُونَ خَاشِعًا لِلَّهِ فِى صَلاتِهِ وَأَنْ يَجْتَنِبَ كُلَّ مَا يُفْسِدُ الصَّلاةَ وَيُبْطِلُهَا وَمُبْطِلاتُ الصَّلاةِ مِنْهَا\n   (1) أَنْ يَتَكَلَّمَ الْمُصَلِّى بِكَلامِ النَّاسِ الَّذِى لَيْسَ فِيهِ ذِكْرُ اللَّهِ عَامِدًا ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ بِحَرْفَيْنِ أَوْ بِحَرْفٍ مُفْهِمٍ مِثْل قِ أَوْ عِ.\n   (2) وَأَنْ يَفْعَلَ أَفْعَالًا كَثِيرَةً تَسَعُ قَدْرَ رَكْعَةٍ مِنَ الزَّمَنِ وَقَالَ بَعْضُ الْعُلَمَاءِ تَبْطُلُ الصَّلاةُ إِذَا فَعَلَ الْمُصَلِّى ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ.\n   (3) وَأَنْ يَأْكُلَ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ كَانَ قَلِيلًا كَحَبَّةِ سِمْسِمٍ.\n   (4) وَأَنْ يَشْرَبَ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ كَانَ قَلِيلًا كَنُقْطَةِ مَاءٍ كَانَتْ عَلَى شَفَتِهِ فَابْتَلَعَهَا.\n   (5) وَأَنْ يَفْعَلَ حَرَكَةً وَاحِدَةً بِقَصْدِ اللَّعِبِ.\n   (6) وَأَنْ يَفْعَلَ حَرَكَةً مُفْرِطَةً كَأَنْ يَثِبَ وَثْبَةً فَاحِشَةً.\n   (7) وَأَنْ يَزِيدَ رُكْنًا فِعْلِيًّا كَأَنْ يَتَعَمَّدَ السُّجُودَ ثَلاثَ مَرَّاتٍ فِى الرَّكْعَةِ الْوَاحِدَةِ ذَاكِرًا.\n   (8) وَأَنْ يَنْوِىَ قَطْعَ الصَّلاةِ فَإِنَّ الصَّلاةَ تَبْطُلُ فَوْرًا.\n   (9) وَأَنْ يُعَلِّقَ قَطْعَ الصَّلاةِ عَلَى حُصُولِ شَىْءٍ كَأَنْ يَقُولَ فِى نَفْسِهِ إِنْ جَاءَ أَخِى سَأَقْطَعُ الصَّلاةَ لِأَفْتَحَ لَهُ الْبَابَ.\n   (10) وَأَنْ يَتَرَدَّدَ هَلْ يَقْطَعُ الصَّلاةَ أَمْ لا.\n   (11) وَأَنْ يَمْضِىَ رُكْنٌ مَعَ الشَّكِ فِى نِيَّةِ التَحَرُّمِ أَوْ يَطُولَ زَمَنُ الشَّكِّ وَذَلِكَ كَأَنْ أَنْهَى قِرَاءَةَ الْفَاتِحَةِ وَهُوَ شَاكٌّ هَلْ نَوَى الظُّهْرَ أَوِ الْعَصْرَ وَلَوْ لَمْ يَمْضِ رُكْنٌ لَكِنْ طَالَ وَقْتُ الشَّكِّ كَأَنْ قَرَأَ سُورَةَ تَبَارَكَ مَثَلًا وَهُوَ شَاكٌّ فِى النِّيَّةِ بَطَلَتْ صَلاتُهُ. أَمَّا إِذَا طَالَ شَكُّهُ فِى عَدَدِ الرَّكَعَاتِ فَلا يُفْسِدُ ذَلِكَ صَلاتَهُ.\n\n\n     أَسْئِلَةٌ\n     (1) إِذَا تَكَلَّمَ الْمُصَلِّى بِكَلامِ النَّاسِ عَمْدًا مَا حُكْمُ صَلاتِهِ.\n     (2) إِذَا تَكَلَّمَ بِحَرْفَيْنِ أَوْ بِحَرْفٍ مُفْهِمٍ مَا حُكْمُ صَلاتِهِ.\n     (3) مَا الْحُكْمُ إِذَا تَحَرَّكَ فِى الصَّلاةِ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ.\n     (4) مَا حُكْمُ مَنْ أَكَلَ أَوْ شَرِبَ فِى الصَّلاةِ عَمْدًا.\n     (5) مَا حُكْمُ مَنْ فَعَلَ حَرَكَةً وَاحِدَةً بِقَصْدِ اللَّعِبِ فِى أَثْنَاءِ الصَّلاةِ.\n     (6) أَعْطِ مِثَالًا عَنْ حَرَكَةٍ مُفْرِطَةٍ.\n     (7) مَا حُكْمُ مَنْ تَعَمَّدَ زِيَادَةَ رُكْنٍ فِعْلِىٍّ فِى صَلاتِهِ أَعْطِ مِثَالًا.\n     (8) مَا الْحُكْمُ إِذَا نَوَى قَطْعَ الصَّلاةِ أَوْ عَلَّقَ قَطْعَهَا عَلَى شَىْءٍ أَوْ تَرَدَّدَ فِى الْقَطْعِ.\n     (9) مَا الْحُكْمُ إِذَا مَضَى رُكْنٌ مَعَ الشَّكِّ فِى نِيَّةِ التَّحَرُّمِ أَوْ طَالَ زَمَنُ الشَّكِّ.\n\nالدَّرْسُ الْحَادِى عَشَرَ\nصَلاةُ الْجَمَاعَةِ\n\n   حَضَّ سَيِّدُنَا مُحَمَّدٌ ﷺ عَلَى صَلاةِ الْجَمَاعَةِ وَأَمَرَ أَنْ تُصَلَّى الصَّلَوَاتُ الْخَمْسُ جَمَاعَةً بِحَيْثُ يَظْهَرُ شِعَارُهَا فَإِنَّ اجْتِمَاعَ الْمُسْلِمِينَ عَلَى طَاعَةِ اللَّهِ فِيهِ خَيْرٌ كَبِيرٌ وَقَدْ قَالَ رَسُولُ اللَّهِ ﷺ «صَلاةُ الْجَمَاعَةِ تَفْضُلُ صَلاةَ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً» رَوَاهُ ابْنُ مَاَجَهْ وَالتِّرْمِذِىُّ وَأَحْمَدُ بنُ حَنْبَلٍ، أَىْ أَنَّ صَلاةَ الْجَمَاعَةِ خَيْرٌ وَأَفْضَلُ مِنْ صَلاةِ الْمُنْفَرِدِ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً وَهِىَ فَرْضُ كِفَايَةٍ عَلَى الرِّجَالِ الأَحْرَارِ الْمُقِيمِينَ الْبَالِغِينَ غَيْرِ الْمَعْذُورِينَ لِكُلِّ صَلاةٍ مَفْرُوضَةٍ تُصَلَّى أَدَاءً.\nكَيْفِيَّةُ صَلاةُ الْجَمَاعَةِ\nيَتَقَدَّمُ الْمُصَلِّينَ أَحَدُهُمْ وَيُسْتَحْسَنُ أَنْ يَكُونَ أَتْقَاهُمْ وَأَحْسَنَهُمْ تِلاوَةً لِلْقُرْءَانِ الْكَرِيمِ وَيُسَمَّى الإِمَامَ وَيَقِفُ الْمُصَلُّونَ وَرَاءَهُ فِى صُفُوفٍ مُسْتَوِيَةٍ مُتَرَاصَّةٍ ثُمَّ يُكَبِّرُ الإِمَامُ تَكْبِيرَةَ الإِحْرَامِ وَبَعْدَهُ يُكَبِّرُ الْمُصَلُّونَ لِلْصَلاةِ مَعَ النِّيَّةِ فَيَقُولُ كُلُّ وَاحِدٍ مِنْهُمْ بِقَلْبِهِ أَثْنَاءَ التَّكْبِيرِ بِلِسَانِهِ أُصَلِّى فَرْضَ الْعَصْرِ جَمَاعَةً مَثَلًا، وَالإِمَامُ يَجْهَرُ بِكُلِّ التَّكْبِيرَاتِ وَالتَّسْمِيعِ وَالسَّلامِ، وَبالْفَاتِحَةِ وَمَا يَقْرَؤُهُ بَعْدَ الْفَاتِحَةِ وَالتَّأْمِينِ إِنْ كَانَتِ الصَّلاةُ جَهْرِيَّةً وَإِنْ كَانَتْ سِرِّيَّةً لا يَجْهَرُ بِالْفَاتِحَةِ وَالسُّورَةِ وَالتَّأْمِينِ.\nوَالْمَأْمُومُ يَجْهَرُ بِالتَّأْمِينِ لِقِرَاءَةِ إِمَامِهِ فَقَطْ وَلا يَقْرَأُ شَيْئًا بَعْدَ الْفَاتِحَةِ فِى الصَّلاةِ الْجَهْرِيَّةِ أَمَا فِى السِّرِّيَّةِ فَيَقْرَأُ.\nشُرُوطُ الِاقْتِدَاءِ\nيَجِبُ عَلَى الْمَأْمُومِ مُرَاعَاةُ الأُمُورِ التَّالِيَةِ\nأَنْ لا يَتَقَدَّمَ عَلَى إِمَامِهِ فِى الْمَوْقِفِ وَالإِحْرَامِ أَىْ لا يَتَقَدَّمَ عَلَى إِمَامِهِ بِعَقِبَيْهِ.\nوَأَنْ لا يُكَبِّرَ تَكْبِيرَةَ الإِحْرَامِ إِلَّا بَعْدَ أَنْ يُكَبِّرَ الإِمَامُ.\nوَأَنْ يُتَابِعَ الإِمَامَ وَلا يَسْبِقَهُ بِرُكْنَيْنِ فِعْلِيَّيْنِ وَلا يَتَأَخَرَ عَنْهُ بِرُكْنَيْنِ فِعْلِيَّيْنِ بِلا عُذْرٍ وَلا بِأَكْثَرَ مِنْ ثَلاثَةِ أَرْكَانٍ طَوِيلَةٍ وَلَوْ لِعُذْرٍ.\nوَأَنْ يَعْلَمَ بِانْتِقَالاتِ إِمَامِهِ مِنْ رُكْنٍ إِلَى رُكْنٍ إِمَا بِسَمَاعِ صَوْتِهِ أَوْ صَوْتِ مُبَلِّغٍ عَدْلٍ.\nوَأَنْ يَجْتَمِعَ الإِمَامُ وَالْمَأْمُومُ فِى مَكَانٍ وَاحِدٍ فَإِنْ كَانَا فِى مَسْجِدٍ صَحَّ الِاقْتِدَاءُ وَإِنْ بَعُدَتِ الْمَسَافَةُ بِشَرْطِ أَنْ لا يَتَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ، وَإِنْ كَانَا فِى غَيْرِ الْمَسْجِدِ فَشَرْطُهُ أَنْ لا تَزِيدَ الْمَسَافَةُ بَيْنَهُمَا عَلَى ثَلاثِمِائَةِ ذِرَاعٍ.\nوَأَنْ لا يَحُولَ بَيْنَهُمَا حَائِلٌ يَمْنَعُ الْمُرُورَ.\nوَأَنْ يَتَوَافَقَ نَظْمُ صَلاتَيْهِمَا فَلا تَصِحُّ قُدْوَةُ مُصَلِّى إِحْدَى الصَّلَوَاتِ الْخَمْسِ خَلْفَ مَنْ يُصلِّى صَلاةَ الْجِنَازَةِ لِأَنَّ الصَّلَوَاتِ الْخَمْسَ فِيهَا رُكُوُعٌ وَسُجُودٌ أَمَّا صَلاةُ الْجِنَازَةِ فَلَيْسَ فِيهَا رُكُوُعٌ وَلا سُجُودٌ.\nوَأَنْ لا يَتَخَالَفَا فِى سُنَّةٍ تَفْحُشُ الْمُخَالَفَةُ فِيهَا كَالْجُلُوسِ لِلتَّشَهُّدِ الأَوَّلِ فِعْلًا وَتَرْكًا أَىْ إِنْ جَلَسَ الإِمَامُ جَلَسَ الْمَأْمُومُ مَعَهُ وَإِنْ تَرَكَهُ قَامَ مَعَهُ.\nوَأَنْ يَنْوِىَ الِاقْتِدَاءَ أَوِ الْجَمَاعَةَ قَبْلَ الْمُتَابَعَةِ وَطُولِ الِانْتِظَارِ أَمَّا فِى صَلاةِ الْجُمُعَةِ فَتَكُونُ نِيَّةُ الِاقْتِدَاءِ أَثْنَاءَ تَكْبِيرَةِ الإِحْرَامِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى الْحَثِّ عَلَى صَلاةِ الْجَمَاعَةِ.\n     (2) مَا الْحُكْمُ إِذَا تَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ فِى الْمَوْقِفِ وَالإِحْرَامِ.\n     (3) مَتَى يُكَبِّرُ الْمَأْمُومُ.\n     (4) مَا الْحُكْمُ إِذَا تَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ.\n     (5) مَا الْحُكْمُ إِذَا تَأَخَّرَ الْمَأْمُومُ عَنِ الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ بِلا عُذْرٍ.\n     (6) كَيْفَ يَعْلَمُ الْمَأْمُومُ بِانْتِقَالاتِ الإِمَامِ.\n     (7) هَلْ تَصِحُّ الْقُدْوَةُ إِذَا حَالَ بَيْنَهُمَا حَائِلٌ يَمْنَعُ الْمُرُورَ.\n     (8) لِمَ لا تَصِحُّ قُدْوَةُ مُصَلِّى الظُّهْرِ خَلْفَ مَنْ يُصلِّى صَلاةَ الْجِنَازَةِ.\n\n\nالدَّرْسُ الثَّانِى عَشَرَ\nصَلاةُ الْجُمُعَةِ\n\nيَوْمُ الْجُمُعَةِ هُوَ أَفْضَلُ أَيَّامِ الأُسْبُوعِ.\nقَالَ رَسُولُ اللَّهِ ﷺ «خَيْرُ يَوْمٍ طَلَعَتْ عَلَيْهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ فِيهِ خُلِقَ ءَادَمُ وَفِيهِ أُدْخِلَ الْجَنَّةَ وَفِيهِ أُخْرِجَ مِنْهَا» رَوَاهُ مُسْلِمٌ، وَقَدْ فَرَضَ اللَّهُ تَعَالَى فِيهِ صَلاةً يَجْتَمِعُ فِيهَا الْمُسْلِمُونَ فِى الْمَسجِدِ الْجَامِعِ فِى كَافَّةِ الْبُلْدَانِ الإِسْلامِيَّةِ لِأَدَائِهَا.\nوَصَلاةُ الْجُمُعَةِ فَرْضُ عَيْنٍ عَلَى الذُّكُورِ الأَحْرَارِ الْمُقِيمِينَ الْبَالِغِينَ غَيْرِ الْمَعْذُورِينَ. وَمِنَ الْعُذْرِ الشَّرْعِىِّ أَنْ يَكُونَ الْمُسْلِمُ مَرِيضًا مَرَضًا شَدِيدًا يَشُقُّ عَلَيْهِ مَعَهُ الذَّهَابُ إِلَى الْمَسْجِدِ.\nوَيُشْتَرَطُ أَنْ يَكُونُوا أَرْبَعِينَ مُكَلَّفِينَ مُسْتَوْطِنِينَ فِى أَبْنِيَةٍ لا فِى الْخِيَامِ لِأَنَّهَا لا تَجِبُ عَلَى أَهْلِ الْخِيَامِ. \nوَيَجِبُ عَلَى مَنْ نَوَى الإِقَامَةَ فِى بَلَدِ الْجُمُعَةِ أَرْبَعَةَ أَيَّامٍ صِحَاحٍ غَيْرِ يَوْمَىِ الدُّخُولِ وَالْخُرُوجِ فَأَكْثَرَ لِأَنَّهُ بِذَلِكَ يَنْقَطِعُ حُكْمُ السَّفَرِ.\nوَتَجِبُ الْجُمُعَةُ عَلَى مَنْ تَوَطَّنَ مَحَلًّا لا تَجِبُ فِيهِ الْجُمُعَةُ لِعَدَمِ اسْتِيفَاءِ الشُّرُوطِ وَلَكِنْ كَانَ بِحَيْثُ يَبْلُغُهُ فِيهِ النِّدَاءُ مِنْ شَخْصٍ صَيِّتٍ أَىْ عَالِى الصَّوْتِ فِى بَلَدِ الْجُمُعَةِ بِحَيْثُ يَعْلَمُ أَنَّ مَا يَسْمَعُهُ نِدَاءُ الْجُمُعَةِ.\nوَصَلاةُ الْجُمُعَةِ رَكْعَتَانِ بَدَلَ صَلاةِ الظُّهْرِ تُؤَدَّى جَمَاعَةً وَيَسْبِقُهَا خُطْبَتَانِ مِنَ الإِمَامِ وَلَهَا شُرُوطٌ لا بُدَّ مِنْ تَوَفُّرِهَا حَتَّى تَصِحَّ وَكَذَلِكَ الْخُطْبَتَانِ لَهُمَا أَرْكَانٌ وَشُرُوطٌ.\n   شُرُوطُ الْجُمُعَةِ \n   وَمِنْ شُرُوطِ الْجُمُعَةِ\n   (1) وقُوعُهَا وَقْتَ الظُّهْرِ.\n   (2) وَخُطْبَتَانِ قَبْلَ الصَّلاةِ يَسْمَعُهُمَا الأَرْبَعُونَ.\n   (3) وَأَنْ تُصَلَّى جَمَاعَةً بِالأَرْبَعِينَ.\n   (4) وَأَنْ لا تُقَارِنَهَا أُخْرَى بِبَلَدٍ وَاحِدٍ فَإِنْ أُقِيمَتْ جُمُعَتَانِ بِبَلَدٍ وَاحِدٍ وَسَبَقَتْ إِحْدَاهُمَا بِالتَّحْرِيمَةِ أَىْ بِتَكْبِيرَةِ الإِحْرَامِ صَحَّتِ السَّابِقَةُ وَلَمْ تَصِحَّ الْمَسْبُوقَةُ أَمَّا إِذَا كَانَ يَشُقُّ عَلَيْهِمُ الِاجْتِمَاعُ فِى مَكَانٍ وَاحِدٍ وَتَعَدَّدَتْ بِقَدْرِ الْحَاجَةِ صَحَّتِ السَّابِقَةُ وَالْمَسْبُوقَةُ. \n   أَرْكَانُ الْخُطْبَتَيْنِ\n   (1) حَمْدُ اللَّهِ\n    (2) وَالصَّلاةُ عَلَى النَّبِىِّ ﷺ.\n   (3) وَالْوَصِيَّةُ بِالتَّقْوَى.\nوَهَذِهِ الأَرْكَانُ الثَّلاثَةُ تُشْتَرَطُ فِى الْخُطْبَتَيْنِ الأُولَى وَالثَّانِيَةِ.\n   (4) وَءَايَةٌ مُفْهِمَةٌ فِى إِحْدَاهُمَا وَالأَوْلَى أَنْ تَكُونَ فِى الْخُطْبَةِ الأُولَى.\n   (5) وَالدُّعَاءُ لِلْمُؤْمِنِينَ فِى الثَّانِيَةِ.\n   شُرُوطُ الْخُطْبَتَيْنِ\n   (1) الطَّهَارَةُ عَنِ الْحَدَثَيْنِ وَعَنِ النَّجَاسَةِ غَيْرِ الْمَعْفُوِّ عَنْهَا فِى الْبَدَنِ وَالْمَكَانِ وَالْمَحْمُولِ.\n   (2) وَسَتْرُ الْعَوْرَةِ.\n   (3) وَالْقِيَامُ.\n   (4) وَالْجُلُوسُ بَيْنَهُمَا.\n   (5) وَالْمُوَالاةُ بَيْنَ أَرْكَانِهِمَا وَبَيْنَهُمَا وَبَيْنَ الصَّلاةِ.\n   (6) وَأَنْ تَكُونَا بِالْعَرَبِيَّةِ فَإِذَا أَتَى بِالأَرْكَانِ بِالْعَرَبِيَّةِ وَالْبَاقِى بِغَيْرِهَا صَحَّتِ الْخُطْبَتَانِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ أَفْضَلُ أَيَّامِ الأُسْبُوعِ.\n     (2) اذْكُرْ حَدِيثًا يُبَيِّنُ فَضْلَ يَوْمِ الْجُمُعَةِ وَمَنْ رَوَاهُ.\n     (3) عَلَى مَنْ تَجِبُ صَلاةُ الْجُمُعَةِ.\n     (4) مَتَى تَجِبُ الْجُمُعَةُ عَلَى مَنْ نَوَى الإِقَامَةَ فِى بَلَدِ الْجُمُعَةِ.\n     (5) مَتَى تَجِبُ الْجُمُعَةُ عَلَى مَنْ تَوَطَّنَ مَحَلًّا خَارِجَ بَلَدِ الْجُمُعَةِ.\n     (6) كَمْ رَكْعَةً صَلاةُ الْجُمُعَةِ وَهَلْ تُؤَدَّى جَمَاعَةً أَمْ بِالِانْفِرَادِ.\n     (7) مَا هِىَ شُرُوطِ الْجُمُعَةِ عَدِّدْهَا.\n     (8) مَا الْحُكْمُ إِذَا أُقِيمَتْ جُمُعَتَانِ بِبَلَدٍ وَاحِدٍ.\n     (9) عَدِّدْ أَرْكَانَ الْخُطْبَتَيْنِ.\n     (10) مَا هِىَ الأَرْكَانُ الَّتِى تُعَادُ فِى الْخُطْبَتَيْنِ وَفِى أَىِّ خُطْبَةٍ يُشْتَرَطُ الدُّعَاءُ لِلْمُؤْمِنِينَ.\n     (11) عَدِّدْ شُرُوطَ الْخُطْبَتَيْنِ.\n\n\nالدَّرْسُ الثَّالِثَ عَشَرَ\nالصِّيَامُ\n\nفَرَضَ اللَّهُ سُبْحَانَهُ وَتَعَالَى عَلَى الْمُكَلَّفِينَ صِيَامَ رَمَضَانَ قَالَ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ﴾ [سُورَةَ الْبَقَرَة/183] أَىْ فُرِضَ عَلَيْكُمُ الصِّيَامُ، وَكَانَ فَرْضُهُ فِى شَعْبَانَ فِى السَّنَةِ الثَّانِيَةِ مِنَ الْهِجْرَةِ. \nوَصِيَامُ شَهْرِ رَمَضَانَ فَرِيضَةٌ عَظِيمَةٌ وَأَمْرٌ مِنْ أَهَمِّ أُمُورِ الإِسْلامِ وَالْمُسْلِمُونَ يَسْتَبْشِرُونَ بِقُدُومِهِ فَهُوَ شَهْرُ الْخَيْرَاتِ وَالطَّاعَاتِ وَالْبَرَكَاتِ وَهُوَ أَفْضَلُ شُهُورِ السَّنَةِ وَفِيهِ أَفْضَلُ اللَّيَالِى وَهِىَ لَيْلَةُ الْقَدْرِ. \nوَالصِّيَامُ هُوَ الإِمْسَاكُ عَنِ الْمُفَطِّرَاتِ أَثْنَاءَ النَّهَارِ مَعَ النِّيَّةِ فِى اللَّيْلِ. وَهُوَ فَرْضٌ عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ قَادِرٍ عَلَى الصِّيَامِ وَلا يَصِحُّ مِنَ الْحَائِضِ وَالنُّفَسَاءِ.\n   وَيَجِبُ صِيَامُ رَمَضَانَ بِأَحَدِ أَمْرَيْنِ\n   (1) إِكْمَالِ شَعْبَانَ ثَلاثِينَ يَوْمًا.\n   (2) أَوْ رُؤْيَةِ هِلالِ رَمَضَانَ لَيْلَةَ الثَّلاثِينَ مِنْ شَعْبَانَ لِقَوْلِهِ ﷺ «صُومُوا لِرُؤْيَتِهِ وَأَفْطِرُوا لِرُؤْيَتِهِ فَإِنْ غُمَّ عَلَيْكُمْ فَأَكْمِلُوا عِدَّةَ شَعْبَانَ ثَلاثِينَ يَوْمًا» رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ.\n   فَمَنْ رَأَى هِلالَ رَمَضَانَ صَامَ وَمَنْ لَمْ يَرَهُ وَأَخْبَرَهُ مُسْلِمٌ ثِقَةٌ عَدْلٌ حُرٌّ غَيْرُ كَاذِبٍ وَجَبَ عَلَيْهِ الصِّيَامُ.\nفَرَائِضُ الصِّيَامِ\nوَفَرَائِضُ الصِّيَامِ اثْنَانِ\n   (1) النِّيَّةُ بِالْقَلْبِ عَنْ كُلِّ يَوْمٍ كَأَنْ يَقُولَ بِقَلْبِهِ نَوَيْتُ صَوْمَ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانَ هَذِهِ السَّنَة إِيـمَانًا وَاحْتِسَابًا للَّهِ تَعَالَى، وَالِاحْتِسَابُ طَلَبُ الأَجْرِ، وَوَقْتُ النِّيَّةِ مِنْ غُرُوبِ الشَّمْسِ إِلَى دُخُولِ الْفَجْرِ.\n   (2) وَتَرْكُ الْمُفَطِّرَاتِ مِنْ طُلُوعِ الْفَجْرِ الصَّادِقِ إِلَى غُرُوبِ الشَّمْسِ.\nمُفْسِدَاتُ الصِّيَامِ\nمُفْسِدَاتُ الصِّيَامِ كَثِيرَةٌ مِنْهَا\n   (1) الأَكْلُ وَلَوْ قَدْرَ سِمْسِمَةٍ وَالشُّرْبُ وَلَوْ قَطْرَةَ مَاءٍ أَوْ دَوَاءٍ إَذَا كَانَ ذَاكِرًا لِلصِّيَامِ.\n   (2) وَالْقَطْرَةُ فِى الأَنْفِ وَالأُذُنِ إِذَا وَصَلَ الدَّوَاءُ إِلَى الْجَوْفِ وَكَذَلِكَ الْحُقْنَةُ فِى الْقُبُلِ أَوِ الدُّبُرِ، أَمَّا الْقَطْرَةُ فِى الْعَيْنِ فَلا تُفَطِّرُ وَالإِبْرَةُ فِي الْجِلْدِ أَوِ الْعَضَلِ أَوِ الشِّرْيَانِ لا تُفَطِّرُ أَيْضًا.\n   (3) وَالإِغْمَاءُ كُلَّ الْيَوْمِ فَمَنْ أُغْمِىَ عَلَيْهِ كُلَّ الْيَوْمِ مِنْ الْفَجْرِ حَتَّى الْغُرُوبِ لَمْ يَصِحَّ صِيَامُهُ وَكَذَلِكَ مَنْ جُنَّ وَلَوْ لَحْظَةً أَفْطَرَ.\n   (4) والِاسْتِقَاءَةُ بِوَضْعِ الإِصْبَعِ وَنَحْوِهِ فِى الْفَمِ وَإِخْرَاجِ الْقَىْءِ مِنَ الْجَوْفِ أَمَّا إِذَا تَقَيَّأَ بِغَيْرِ إِرَادَتِهِ وَلَمْ يَرْجِعْ شَىْءٌ إِلَى جَوْفِهِ فَلا يُفْطِرُ.\n   (5) وَالرِّدَّةُ بِأَىِّ نَوْعٍ مِنْ أَنْوَاعِهَا الثَّلاثَةِ الِاعْتِقَادِيَّةِ وَالْفِعْلِيَّةِ وَالْقَوْلِيَّةِ. وَمَنْ أَفْسَدَ صَوْمَ يَوْمٍ مِنْ رَمَضَانَ بِالأَكْلِ أَوِ الشُّرْبِ أَوِ الِاسْتِقَاءَةِ فَعَلَيْهِ الإِثْمُ وَالْقَضَاءُ فَوْرًا بَعْدَ رَمَضَانَ وَيَوْمِ الْعِيدِ وَلا يَجِبُ عَلَيْهِ دَفْعُ الْمَالِ لِلْفُقَرَاءِ وَالْمَسَاكِينِ.\n\nفَائِدَةٌ\nيَحْرُمُ صِيَامُ يَوْمِ عِيدِ الْفِطْرِ وَيَوْمِ عِيدِ الأَضْحَى وأَيَّامِ التَّشْرِيقِ الثَّلاثَةِ وَهِىَ الأَيَّامُ الثَّلاثَةُ الَّتِى تَلِى عِيدَ الأَضْحَى.\n\nدُعَاءٌ\nاللَّهُمَّ لَكَ صُمْتُ وَعَلَى رِزْقِكَ أَفْطَرْتُ وَكَانَ رَسُولُ اللَّهِ ﷺ يَقُولُ إِذَا أَفْطَرَ «ذَهَبَ الظَّمَأُ وابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللَّهُ» رَوَاهُ أَبُو دَاوُدَ.\n\n     أَسْئِلَةٌ\n     (1) أَىُّ شَهْرٍ فَرَضَ اللَّهُ فِيهِ الصِّيَامَ.\n     (2) اذْكُرْ ءَايَةً فِيهَا وُجُوبُ الصِّيَامِ.\n     (3) مَتَى فُرِضَ الصَّوْمُ فِى شَهْرِ رَمَضَانَ.\n     (4) مَا هُوَ الصِّيَامُ وَعَلَى مَنْ يَجِبُ.\n     (5) كَيْفَ يَثْبُتُ الصِّيَامُ وَاذْكُرْ حَدِيثًا فِى ذَلِكَ.\n     (6) مَنْ لَمْ يَرَ الْهِلالَ مَاذَا يَفْعَلُ.\n     (7) مَا هِىَ فَرَائِضُ الصِّيَامِ.\n     (8) مَتَى وَقْتُ نِيَّةِ الصِّيَامِ وَمَاذَا يَنْوِى مَنْ أَرَادَ الصِّيَامَ.\n     (9) عَدِّدْ بَعْضَ مُفْسِدَاتِ الصِّيَامِ.\n     (10) مَا هِىَ الأَيَامُ الَّتِى يَحْرُمُ الصَّوْمُ فِيهَا.\n\n\nالدَّرْسُ الرَّابِعَ عَشَرَ\nالزَّكَاةُ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَأَقِيمُوا الصَّلاةَ وَءَاتُوا الزَّكَاةَ﴾ [سُورَةَ الْبَقَرَة/43].\nالزَّكَاةُ مَعْنَاهَا فِى اللُّغَةِ التَّطْهِيرُ وَالنَّمَاءُ وَشَرْعًا اسْمٌ لِمَا يُخْرَجُ عَنْ مَالٍ أَوْ بَدَنٍ عَلَى وَجْهٍ مَخْصُوصٍ وَسُمِّيَتْ كَذَلِكَ لِأَنَّ الْمَالَ يَنْمُو بِبَرَكَةِ إِخْرَاجِهَا وَلِأَنَّهَا تُطَهِّرُ مُخْرِجَهَا مِنَ الإِثْمِ.\nوَالزَّكَاةُ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ فَرَضَهَا اللَّهُ فِى السَّنَةِ الثَّانِيَةِ مِنَ الْهِجْرَةِ.\n   الأَشْيَاءُ الَّتِى تَجِبُ فِيهَا الزَّكَاةُ\n   (1) الأَنْعَامُ وَهِىَ الإِبِلُ وَالْبَقَرُ وَالْغَنَمُ.\n   (2) وَالزُّرُوعُ الْمُقْتَاتَةُ حَالَةَ الِاخْتِيَارِ أَىِ الَّتِى يَدَّخِرُهَا الإِنْسَانُ عَادَةً لِيَقْتَاتَ بِهَا كَالْقَمْحِ وَالشَّعِيرِ وَالذُّرَةِ لا الْفَوَاكِهِ كَالتُّفَاحِ وَالْبُرْتُقَالِ.\n   (3) وَالثِّمَارُ وَتَجِبُ فِى شَيْئَيْنِ مِنْهَا هُمَا ثَمَرَةُ النَّخْلِ وَالْعِنَبِ.\n   (4) وَأَمْوَالُ التِّجَارَةِ وَهِىَ تَقْلِيبُ الْمَالِ فِى الْبَيْعِ وَالشِّرَاءِ لِغَرَضِ الرِّبْحِ كَأَنْ يَبِيعَ وَيَشْتَرِىَ ثُمَّ يَبِيعَ وَيَشْتَرِىَ وَهَكَذَا.\n   (5) وَالنَّقْدَانِ وَهُمَا الذَّهَبُ وَالْفِضَّةُ.\nوَتَجِبُ أَيْضًا زَكَاةُ الْفِطْرِ وَهِىَ زَكَاةٌ عَنِ الْبَدَنِ لا عَنِ الْمَالِ يَدْفَعُهَا الْمُكَلَّفُ عَنْ نَفْسِهِ وَزَوْجَتِهِ وَأَوْلادِهِ الصِّغَارِ وَوَالِدَيْهِ الْفَقِيرَيْنِ فِى شَهْرِ رَمَضَانَ أَوْ يَوْمِ عِيدِ الْفِطْرِ.\nالْمُسْتَحِقُّونَ لِلزَّكَاةِ\nوَلا يَجُوزُ دَفْعُ الزَّكَاةِ إِلَّا إِلَى مُسْتَحِقِّيهَا وَهُمُ الأَصْنَافُ الثَّمَانِيَةُ الَّذِينَ ذَكَرَهُمُ اللَّهُ تَعَالَى فِى الْقُرْءَانِ الْكَرِيمِ فِى الآيَةِ ﴿إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِى الرِّقَابِ وَالْغَارِمِينَ وَفِى سَبِيلِ اللَّهِ وَابْنِ السَّبِيلِ﴾ [سُورَةَ التَّوْبَة/60].\n   (1) الْفُقَرَاءُ هُمُ الَّذِينَ لا يَجِدُونَ نِصْفَ كِفَايَتِهِمْ.\n   (2) الْمَسَاكِينُ هُمُ الَّذِينَ لا يَجِدُونَ كُلَّ كِفَايَتِهِمْ وَلَكِنْ يَجِدُونَ نِصْفَهَا. \n   (3) الْعَامِلُونَ عَلَيْهَا هُمُ الَّذِينَ يُوَظِّفُهُمُ الْخَلِيفَةُ لِجَمْعِ الزَّكَاةِ بِدُونِ رَاتِبٍ.\n   (4) الْمُؤَلَّفَةُ قُلُوبُهُمْ هُمُ الَّذِينَ أَسْلَمُوا حَدِيثًا ونِيَّتُهُمْ ضَعِيفَةٌ أَوْ كَانَ يُرْجَى بِإِعْطَائِهِمْ أَنْ يُسْلِمَ نُظَرَاؤُهُمْ.\n   (5) الرِّقَابُ هُمُ الْعَبِيدُ الْمُكَاتَبُونَ أَىِ الَّذِينَ اشْتَرَطَ عَلَيْهِمْ أَسْيَادُهُمْ قَدْرًا مِنَ الْمَالِ لِيَصِيرُوا أَحْرَارًا.\n   (6) الْغَارِمُونَ هُمُ الْمَدِينُونَ الْعَاجِزُونَ عَنِ الْوَفَاءِ.\n   (7) وَأَمَّا وَفِى سَبِيلِ اللَّهِ فَمَعْنَاهُ الْغُزَاةُ الْمُتَطَوِّعُونَ فِى سَبِيلِ اللَّهِ وَلَيْسَ كُلَّ عَمَلٍ خَيْرِىٍّ فَلا يَجُوزُ دَفْعُ الزَّكَاةِ لِبِنَاءِ الْمُسْتَشْفَيَاتِ وَالْمَسَاجِدِ وَنَحْوِ ذَلِكَ.\n   (8) ابْنُ السَّبِيلِ هُوَ الْمُسَافِرُ الَّذِى لَيْسَ مَعَهُ مَا يُوصِلُهُ إِلَى مَقْصِدِهِ.\nشُرُوطُ الزَّكَاةِ\nشُرُوطُ الزَّكَاةِ قِسْمَانِ شُرُوطُ وُجُوبٍ وَشُرُوطُ صِحَّةٍ.\nشُرُوطُ وُجُوبِهَا خَمْسَةٌ (1) الإِسْلامُ (2) وَالْحُرِّيَّةُ (3) وَالْمِلْكُ التَّامُّ (4) وَمُضِىُّ الْحَوْلِ فِى الْمَالِ الْحَوْلِىِّ (5) وَمِلْكُ النِّصَابِ وَهُوَ قَدْرٌ لا تَجِبُ الزَّكَاةُ إِذَا لَمْ يَبْلُغْهُ الْمَالُ وَيُزَادُ عَلَيْهَا السَّوْمُ فِى كَلَإٍ مُبَاحٍ لِلْمَاشِيَةِ.\nوَشُرُوطُ صِحَّتِهَا هِىَ\n   (1) صَرْفُهَا لِمُسْتَحِقِّيهَا وَهُمُ الأَصْنَافُ الثَّمَانِيَةُ الَّذِينَ مَرَّ ذِكْرُهُمُ.\n   (2) وَصَرْفُهَا لِمُسْلِمٍ وَلا يَصِحُّ دَفْعُهَا لِكَافِرٍ.\n   (3) وَدَفْعُهَا لِحُرٍّ فَلا يَجُوزُ دَفْعُهَا لِلرَّقِيقِ إِلَّا الْمُكَاتَبِ.\n   (4) وَأَنْ لا يَكُونَ ءَاخِذُهَا مِنْ بَنِى هَاشِمٍ أَوْ بَنِى الْمُطَّلِبِ. فَالْمَنْسُوبُ لِلرَّسُولِ ﷺ لا يَجُوزُ لَهُ أَكْلُ مَالِ الزَّكَاةِ وَلَوْ كَانَ فَقِيرًا مِثْلُ ءَالِ مُنَيْمِنَةَ وَالْحُوتِ وَالشَّرِيفِ وَالْكَيَّالِى وَالْجِيلانِى وَالرِّفَاعِى وَالصَّيَّادِى وَكيوَان وَالْقَادِرِى وَالْكَيْلانِى وَغَيْرِهِمْ كَثِير فَلْيُتَنَبَّهْ إِلَى ذَلِكَ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً فِيهَا الأَمْرُ بِأَدَاءِ الزَّكَاةِ.\n     (2) مَا مَعْنَى الزَّكَاةِ لُغَةً وَشَرْعًا.\n     (3) فِى أَىِّ سَنَةٍ فَرَضَ اللَّهُ الزَّكَاةَ.\n     (4) مَا هِىَ الأَشْيَاءُ الَّتِى تَجِبُ فِيهَا الزَّكَاةُ.\n     (5) مَا هِىَ الأَنْعَامُ وَمَا مَعْنَى الزُّرُوعِ الْمُقْتَاتَةِ حَالَةَ الِاخْتِيَارِ.\n     (6) مَا هُمَا النَّقْدَانِ.\n     (7) مَا هِىَ زَكَاةُ الْفِطْرِ.\n     (8) عَدِّدِ الْمُسْتَحِقِّينَ لِلزَّكَاةِ.\n     (9) مَا مَعْنَى وَفِى سَبِيلِ اللَّهِ.\n\nالدَّرْسُ الْخَامِسَ عَشَرَ\nالْحَجُّ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا﴾ [سُورَةَ ءَالِ عِمْرَان/97].\nالْحَجُّ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ وَهُوَ فَرْضٌ عَلَى الْمُكَلَّفِ الْحُرِّ الْمُسْتَطِيعِ وَكَذَلِكَ الْعُمْرَةُ فَيَجِبُ أَدَاؤُهُمَا فِى الْعُمُرِ مَرَّةً وَاحِدَةً وَيُسَنُّ تَكْرَارُهُمَا.\nوَلِلْحَجِّ مَزِيَّةٌ وَهِىَ أَنَّهُ يُكَفِّرُ الذُّنُوبَ الْكَبَائِرَ وَالصَّغَائِرَ لِقَوْلِهِ ﷺ «مَنْ حَجَّ فَلَمْ يَرْفُثْ وَلَمْ يَفْسُقْ خَرَجَ مِنْ ذُنُوبِهِ كَيَوْمَ وَلَدَتْهُ أُمُّهُ» رَوَاهُ الْبُخَارِىُّ، بِشَرْطِ أَنْ تَكُونَ نِيَّتُهُ خَالِصَةً لِلَّهِ تَعَالَى وَأَنْ يَكُونَ الْمَالُ الَّذِى يَتَزَوَّدُهُ لِحَجِّهِ حَلالًا وَأَنْ يَحْفَظَ نَفْسَهُ مِنَ الْفُسُوقِ أَىْ مِنْ كَبَائِرِ الذُّنُوبِ والرَّفَثِ أَىِ الْجِمَاعِ وَمِمَّا يَدُلُّ عَلَى فَضْلِ الْحَجِّ أَنَّهُ جَمَعَ أَنْوَاعَ رِيَاضَةِ النَّفْسِ أَىْ تَهْذِيبِهَا فَفِيهِ إِنْفَاقُ مَالٍ وَجَهْدُ نَفْسٍ بِنَحْوِ الْجُوعِ وَالْعَطَشِ وَالسَّهَرِ وَاقْتِحَامِ مَهَالِكَ وَفِرَاقِ وَطَنٍ وَأَهْلٍ وَأَصْحَابٍ.\nأَرْكَانُ الْحَجِّ والْعُمْرَةِ\nالأَرْكَانُ هِىَ مَا لا يَصِحُّ الْحَجُّ وَالْعُمْرَةُ إِلَّا بِهَا فَمَنْ تَرَكَ رُكْنًا لَمْ يَصِحَّ حَجُّهُ وَلا يُجْبَرُ تَرْكُهُ بِشَىْءٍ بَلْ لا بُدَّ مِنَ الإِتْيَانِ بِهِ.\nوَأَرْكَانُ الْحَجِّ سِتَّةٌ هِىَ\n   (1) الإِحْرَامُ أَىْ نِيَّةُ الإِحْرَامِ فَيَقُولُ بِقَلْبِهِ مَثَلًا نَوَيْتُ الْحَجَّ وَأَحْرَمْتُ بِهِ لِلَّهِ تَعَالَى.\n   (2) وَالْوُقُوفُ بِعَرَفَةَ وَلَوْ لَحْظَةً وَوَقْتُهُ مِنْ زَوَالِ شَمْسِ التَّاسِعِ مِنْ ذِى الْحِجَّةِ إِلَى طُلُوعِ فَجْرِ يَوْمِ الْعَاشِرِ أَىْ يَوْمِ الْعِيدِ.\n   (3) وَالطَّوَافُ بِالْبَيْتِ سَبْعَةَ أَشْوَاطٍ أَىْ أَنْ يَدُورَ حَوْلَ الْكَعْبَةِ سَبْعَ مَرَّاتٍ جَاعِلًا الْبَيْتَ عَنْ يَسَارِهِ وَيَبْدَأَ بِالْحَجَرِ الأَسْوَدِ وَيُشْتَرَطُ لَهُ الطَّهَارَةُ مِنَ الْحَدَثَيْنِ وَسَتْرُ الْعَوْرَةِ.\n   (4) وَالسَّعْىُ بَيْنَ الصَّفَا وَالْمَرْوَةِ سَبْعَ مَرَّاتٍ ولا يُشْتَرَطُ لَهُ طَهَارَةٌ.\nوَيَبْدَأُ بِالصَّفَا وَينْتَهِى بِالْمَرْوَةِ.\n   (5) وَالْحَلْقُ أَوِ التَّقْصِيرُ وَالْحَلْقُ هُوَ إِزَالَةُ شَعَرِ الرَأْسِ كُلِّهِ أَمَّا التَّقْصِيرُ فَيَحْصُلُ وَلَوْ بِقَصِّ ثَلاثِ شَعَرَاتٍ وَالنِّسَاءُ يُقَصِّرْنَ وَلا يَحْلِقْنَ.\n   (6) وَالتَّرْتِيبُ فِى مُعْظَمِ الأَرْكَانِ فَيُقَدِّمُ الإِحْرَامَ عَلَى الْجَمِيعِ وَيُشْتَرَطُ تَأْخِيرُ الْحَلْقِ أَوِ التَّقْصِيرِ وَطَوَافِ الإِفَاضَةِ عَنِ الْوُقُوفِ بِعَرَفَةَ.\nوَأَرْكَانُ الْعُمْرَةِ خَمْسَةٌ هِىَ\n   (1) الإِحْرَامُ وَهُوَ نِيَّةُ الدُّخُولِ فِى الْعُمْرَةِ فَيَقُولُ بِقَلْبِهِ مَثَلًا «نَوَيْتُ الْعُمْرَةَ وَأَحْرَمْتُ بِهَا لِلَّهِ تَعَالَى».\n   (2) وَالطَّوَافُ.\n   (3) وَالسَّعْىُ.\n   (4) وَالْحَلْقُ أَوِ التَّقْصِيرُ.\n   (5) وَتَرْتِيبُ جَمِيعِ أَرْكَانِهَا عَلَى مَا هُوَ مَذْكُورٌ.\nوَاجِبَاتُ الْحَجِّ وَالْعُمْرَةِ\nالْوَاجِبُ هُوَ مَا يَصِحُّ الْحَجُّ أَوِ الْعُمْرَةُ بِدُونِهِ وَلَكِنْ يُجْبَرُ تَرْكُهُ بِالدَّمِ وَفِى تَرْكِهِ عَمْدًا مَعْصِيَةٌ.\nمِنْ وَاجِبَاتِ الْحَجِّ\n   (1) الإِحْرَامُ مِنَ الْمِيقَاتِ.\n   (2) وَرَمْىُ الْجِمَارِ الثَّلاثِ الْجَمْرَةِ الصُّغْرَى وَالْجَمْرَةِ الْوُسْطَى وَجَمْرَةِ الْعَقَبَةِ بِسَبْعِينَ حَصَاةً.\n   (3) وَالْمَبِيتُ بِمُزْدَلِفَةَ وَهُوَ مَكَانٌ قُرْبَ عَرَفَاتٍ يَأْخُذُ مِنْهُ الْحُجَّاجُ الْحَصَى لِلرَّجْمِ.\n   (4) وَالْمَبِيتُ بِمِنًى وَهُوَ مَكَانٌ بَيْنَ مَكَّةَ وَعَرَفَاتٍ وَهُوَ أَقْرَبُ إِلَى مَكَّةَ.\n   (5) وَطَوَافُ الْوَدَاعِ.\nمَا يَجِبُ بِتَرْكِ الْوَاجِبِ\nيَجِبُ ذَبْحُ شَاةٍ عَلَى مَنْ تَرَكَ وَاجِبًا مِنْ وَاجِبَاتِ الْحَجِّ. وَمَنْ عَجَزَ عَنِ الذَّبْحِ صَامَ عَشْرَةَ أَيَّامٍ ثَلاثَةَ أَيَّامٍ فِى الْحَجِّ وَسَبْعَةً إِذَا رَجَعَ إِلَى أَهْلِهِ.\nالْمُحَرَّمَاتُ عَلَى الْمُحْرِمِ بِالْحَجِّ أَوِ الْعُمْرَةِ\nوَمِنْ مُحَرَّمَاتِ الإِحْرَامِ شَيْئَانِ مُحَرَّمَانِ عَلَى الرَّجْلِ فَقَطْ وَهُمَا\n   (1) سَتْرُ رَأْسِهِ.\n   (2) وَلُبْسُ مُحِيطٍ بِخِيَاطَةٍ أَوْ لِبْدٍ أَوْ نَحْوِهِ. \nوَيَحْرُمُ عَلَى الْمَرْأَةِ\n   (1) سَتْرُ وَجْهِهَا.\n   (2) وَلُبْسُ قُفَّازٍ.\nوَيَحْرُمُ عَلَى كُلٍّ مِنَ الرَّجُلِ وَالْمَرْأَةِ فِى حَالِ الإِحْرَامِ\n   (1) التَّطَيُّبُ.\n   (2) وَدَهْنُ الرَّأْسِ وَاللِّحْيَةِ بِمَا يُسَمَّى دُهْنًا كَالزَّيْتِ وَنَحْوِهِ.\n   (3) وَإِزَالَةُ الشَّعَرِ وَتَقْلِيمُ الأَظْفَارِ.\n   (4) وَعَقْدُ الزِّوَاجِ.\n   (5) وَصَيْدُ مَأْكُولٍ بَرِّىٍّ وَحْشِىٍّ كَالْغَزَالِ وَالْحَمَامِ.\n\n     أَسْئِلَةٌ\n   (1) عَلَى مَنْ يَجِبُ الْحَجُّ وَكَمْ مَرَّةً يَجِبُ فِى الْعُمُرِ.\n   (2) مَا هِىَ مَزِيَّةُ الْحَجِّ وَاذْكُرِ الْحَدِيثَ.\n   (3) عَدِّدْ أَرْكَانَ الْحَجِّ.\n   (4) مَا مَعْنَى الإِحْرَامِ وَمَا هُوَ وَقْتُ الْوُقُوفِ بِعَرَفَةَ.\n   (5) مَا مَعْنَى الْحَلْقِ وَالتَّقْصِيرِ. \n   (6) مَا هِىَ أَرْكَانُ الْعُمْرَةِ.\n   (7) عَدِّدْ بَعْضَ وَاجِبَاتِ الْحَجِّ.\n   (8) عَدِّدْ مَا يَحْرُمُ عَلَى الْمُحْرِمِ بِالْحَجِّ أَوِ الْعُمْرَةِ.\n"},{"id":"part5-section3","partIndex":5,"partName":"الجزء الخامس","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الْخَامِسُ"],"title":"الأَخْلاقُ الإِسْلامِيَّةُ","blocks":[{"type":"p","text":"الأَخْلاقُ الإِسْلامِيَّةُ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"فَصْلُ"},{"type":"p","text":"الإِخْلاصُ فِى الْعِبَادَةِ وَالرِّيَاءُ وَالْعُجْبُ"},{"type":"p","text":""},{"type":"p","text":"الإِخْلاصُ فِى الْعِبَادَةِ مِنْ أَعْمَالِ الْقُلُوبِ الْوَاجِبَةِ وَهُوَ مِنَ الأَخْلاقِ الْحَسَنَةِ."},{"type":"p","text":"وَمَعْنَى الإِخْلاصِ فِى الْعِبَادَةِ إِخْلاصُ الْعَمَلِ بِالطَّاعَةِ لِلَّهِ تَعَالَى وَحْدَهُ أَىْ أَنْ لا يَقْصِدَ بِعَمَلِ الطَّاعَةِ مَحْمَدَةَ النَّاسِ وَالنَّظَرَ إِلَيْهِ بِعَيْنِ الِاحْتِرَامِ وَالتَّعْظِيمِ وَقَدْ جَعَلَ اللَّهُ تَعَالَى الإِخْلاصَ شَرْطًا لِقَبُولِ الأَعْمَالِ الصَّالِحَةِ. "},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿فَمَنْ كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾ [سُورَةَ الْكَهْف/110]."},{"type":"p","text":"وَالْمُخْلِصُ هُوَ الَّذِى يَقُومُ بِأَعْمَالِ الطَّاعَةِ مِنْ صَلاةٍ وَصِيَامٍ وَحَجٍّ وَزَكَاةٍ وَقِرَاءَةٍ لِلْقُرْءَانِ وَغَيْرِهَا ابْتِغَاءَ الثَّوَابِ مِنَ اللَّهِ وَلَيْسَ لِأَنْ يَمْدَحَهُ النَّاسُ وَيَذْكُرُوهُ فَالْمُصَلِّى يَجِبُ أَنْ تَكُونَ نِيَّتُهُ خَالِصَةً لِلَّهِ تَعَالَى وَحْدَهُ فَقَطْ لا لِيَقُولَ عَنْهُ النَّاسُ فُلانٌ مُصَلٍ لا يَتْرُكُ الْفَرَائِضَ وَالصَّائِمُ يَجِبُ أَنْ يَكُونَ صِيَامُهُ لِلَّهِ تَعَالَى وَحْدَهُ فَقَطْ وَكَذَلِكَ الأَمْرُ بِالنِّسْبَةِ لِلْمُزَكِّى وَالْمُتَصَدِّقِ وَقَارِئِ الْقُرْءَانِ وَلِكُلِّ مَنْ أَرَادَ أَنْ يَعْمَلَ عَمَلَ بِرٍ وَإِحْسَانٍ قَالَ النَّبِىُّ ﷺ «إِنَّ اللَّهَ يُحِبُّ أَحَدُكُمْ إِذَا عَمِلَ عَمَلًا أَنْ يُتْقِنَهُ» قِيلَ وَمَا إِتْقَانُهُ يَا رَسُولَ اللَّهِ قَالَ «يُخْلِصُهُ مِنَ الرِّيَاءِ وَالْبِدْعَةِ» رَوَاهُ الْحَافِظُ السُّيُوطِىُّ."},{"type":"p","text":"الرِّيَاءُ وَيُقَابِلُ الإِخْلاصَ "},{"type":"p","text":"الرِّيَاءُ وَمَعْنَاهُ أَنْ يَقْصِدَ الإِنْسَانُ بِأَعْمَالِ الْبِرِّ كَالصَّوْمِ وَالصَّلاةِ وَغَيْرِهِمَا مَدْحَ النَّاسِ وَإِجْلالَهُمْ لَهُ."},{"type":"p","text":"وَالرِّيَاءُ يُحْبِطُ ثَوَابَ الْعَمَلِ الَّذِى قَارَنَهُ فَأَىُّ عَمَلٍ مِنْ أَعْمَالِ الْبِرِّ يَدْخُلُهُ الرِّيَاءُ لا ثَوَابَ فِيهِ سَوَاءٌ كَانَ مُجَرَّدَ قَصْدِهِ الرِّيَاءُ أَوْ قَرَنَ بِهِ قَصْدَ طَلَبِ الأَجْرِ مِنَ اللَّهِ تَعَالَى."},{"type":"p","text":"العُجْبُ بِطَاعَةِ اللَّهِ "},{"type":"p","text":"أَمَّا العُجْبُ بِطَاعَةِ اللَّهِ فَهُوَ شُهُودُ الْعِبَادَةِ صَادِرَةً مِنَ النَّفْسِ غَائِبًا عَنِ الْمِنَّةِ أَىْ أَنْ يَشْهَدَ الْعَبْدُ عِبَادَتَهُ مَحَاسِنَ أَعْمَالِهِ صَادِرَةً مِنْ نَفْسِهِ غَائِبًا عَنْ شُهُودِ أَنَّهَا نِعْمَةٌ مِنَ اللَّهِ عَلَيْهِ أَىْ أَنَّ اللَّهَ هُوَ الَّذِى تَفَضَّلَ عَلَيْهِ بِهَا فَأَقْدَرَهُ عَلَيْهَا وَأَلْهَمَهُ أَنْ يَقُومَ بِهَا."},{"type":"p","text":"وَالرِّيَاءُ بِأَعْمَالِ الْبِرِّ وَالْعُجْبُ بِطَاعَةِ اللَّهِ مَعْصِيَتَانِ مِنْ مَعَاصِى الْقُلُوبِ وَخَصْلَتَانِ رَدِيئَتَانِ يَجِبُ عَلَى الْمُكَلَّفِ أَنْ يَجْتَنِبَهُمَا وَيَكُونَ مُخْلِصًا فِى عِبَادَتِهِ للَّهِ تَعَالَى حَتَّى يَنَالَ الثَّوَابَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا مَعْنَى الإِخْلاصِ فِى الْعِبَادَةِ."},{"type":"p","text":"     (2) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَّ الإِخْلاصَ شَرْطٌ لِقَبُولِ الأَعْمَالِ الصَّالِحَةِ."},{"type":"p","text":"     (3) مَنْ هُوَ الْمُخْلِصُ. "},{"type":"p","text":"     (4) اذْكُرْ حَدِيثًا فِى الْحَثِّ عَلَى الإِخْلاصِ وَتَرْكِ الرِّيَاءِ فِى الْعَمَلِ."},{"type":"p","text":"     (5) مَا مَعْنَى الرِّيَاءِ وَإِذَا دَخَلَ الرِّيَاءُ فِى عَمَلِ الْبِرِّ مَا حُكْمُ الْعَمَلِ."},{"type":"p","text":"     (6) مَا مَعْنَى الْعُجْبِ بِطَاعَةِ اللَّهِ تَعَالَى."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"الصَّبْرُ وَالرِّضَا عَنِ اللَّهِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿اسْتَعِينُوا بِالصَّبْرِ وَالصَّلاةِ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾ [سُورَةَ الْبَقَرَة/153]."},{"type":"p","text":"الصَّبْرُ مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ وَهُوَ حَبْسُ النَّفْسِ وَقَهْرُهَا عَلَى مَكْرُوهٍ تَتَحَمَّلُهُ أَوْ لَذِيذٍ تُفَارِقُهُ."},{"type":"p","text":"وَالصَّبْرُ ثَلاثَةُ أَنْوَاعٍ"},{"type":"p","text":"   (1) الصَّبْرُ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ."},{"type":"p","text":"   (2) وَالصَّبْرُ عَمَّا حَرَّمَ اللَّهُ."},{"type":"p","text":"   (3) وَالصَّبْرُ عَلَى الْمَصَائِبِ."},{"type":"p","text":"الصَّبْرُ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ أَىْ قَهْرُ النَّفْسِ عَلَى أَدَاءِ الْوَاجِبَاتِ الدِّيِنِيَّةِ الَّتِى فَرَضَهَا اللَّهُ كَإِقَامَةِ الصَّلاةِ فِى وَقْتِهَا وصِيَامِ شَهْرِ رَمَضَانَ وَحُضُورِ مَجَالِسِ الْعِلْمِ لِتَعَلُّمِ مَا فَرَضَ اللَّهُ تَعَلُّمَهُ مِنْ عِلْمِ الدِّينِ وَغَيْرِ ذَلِكَ مِنَ الْوَاجِبَاتِ."},{"type":"p","text":"الصَّبْرُ عَمَّا حَرَّمَ اللَّهُ أَىْ كَفُّ النَّفْسِ عَنِ ارْتِكَابِ مَا حَرَّمَ اللَّهُ وَهَذَا يَحْتَاجُ إِلَى مُجَاهَدَةٍ كَبِيرَةٍ لِمَنْعِ النَّفْسِ وَكَبْحِهَا عَنِ ارْتِكَابِ الْمُحَرَّمَاتِ كَتَرْكِ الصَّلاةِ وَشُرْبِ الْخَمْرِ وَالسَّرِقَةِ وَغَيْرِ ذَلِكَ."},{"type":"p","text":"الصَّبْرُ عَلَى الْمَصَائِبِ أَىْ عَلَى مَا يُزْعِجُ النَّفْسَ مِنْ أَلَمٍ أَوْ أَذًى أَوْ ضِيِقِ مَعِيشَةٍ أَوْ حُزْنٍ يَلْحَقُ الإِنْسَانَ بِسَبَبِ مُصِيبَةٍ لِأَنَّ الدُّنْيَا دَارُ بَلاءٍ وَاخْتِبَارٍ وَدَارُ عَمَلٍ وَالآخِرَةُ دَارُ حِسَابٍ قَالَ رَسُولُ اللَّهِ ﷺ «إِنَّ اللَّهَ عَزَّ وَجَلَّ يَقُولُ إِذَا ابْتَلَيْتُ عَبْدِى بِحَبِيبَتَيْهِ أَىْ عَيْنَيْهِ فَصَبَرَ عَوَّضْتُهُ مِنْهُمَا الْجَنَّةَ» رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"الرِّضَا عَنِ اللَّهِ بِمَعْنَى التَّسْلِيمِ لَهُ "},{"type":"p","text":"يَجِبُ عَلَى الْمُكَلَّفِ أَنْ لا يَعْتَرِضَ عَلَى اللَّهِ تَعَالَى وَأَنْ يَرْضَى بِقَضَائِهِ وَقَدَرِهِ وَالرِّضَا عَنِ اللَّهِ مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ وَمَعْنَاهُ التَّسْلِيمُ لَهُ تَبَارَكَ وَتَعَالَى فَإِنَّ كَثِيرًا مِنَ النَّاسِ يَقَعُونَ فِى الْمَعَاصِى بِتَرْكِهِمُ الصَّبْرَ عَلَى الْمَصَائِبِ."},{"type":"p","text":"فَيَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يَتَحَلَّى بِالصَّبْرِ وَيُعَوِّدَ نَفْسَهُ عَلَيْهِ وَيُسَلِّمَ أَمْرَهُ لِلَّهِ وَيَتَوَكَّلَ عَلَيْهِ فِى أُمُورِهِ كُلِّهَا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً قُرْءَانِيَّةً تَدُلُّ عَلَى فَضْلِ الصَّبْرِ."},{"type":"p","text":"     (2) مَا هُوَ الصَّبْرُ وَمِنْ أَىِّ الوَاجِبَاتِ هُوَ."},{"type":"p","text":"     (3) عَدِّدْ أَنْوَاعَ الصَّبْرِ."},{"type":"p","text":"     (4) مَا مَعْنَى الصَّبْرِ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ."},{"type":"p","text":"     (5) مَا مَعْنَى الصَّبْرِ عَمَّا حَرَّمَ اللَّهُ."},{"type":"p","text":"     (6) مَا مَعْنَى الصَّبْرِ عَلَى الْمَصَائِبِ."},{"type":"p","text":"     (7) اذْكُرْ حَدِيثًا فِى بَيَانِ ثَوَابِ مَنْ صَبَرَ عَلَى فَقْدِ عَيْنَيْهِ."},{"type":"p","text":"     (8) مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ الرِّضَا عَنِ اللَّهِ مَا مَعْنَى ذَلِكَ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"مَحَبَّةُ اللَّهِ وَرَسُولِهِ"},{"type":"p","text":""},{"type":"p","text":"الْمَحَبَّةُ وَالْبُغْضُ مِنْ أَعْمَالِ الْقُلُوبِ فَيَجِبُ عَلَى الْمُكَلَّفِ أَنْ يَسْتَعْمِلَهُمَا فِى مُوَافَقَةِ شَرْعِ اللَّهِ تَعَالَى فَيُحِبَّ اللَّهَ تَعَالَى وَمَا يُوَافِقُ شَرْعَهُ وَيُبْغِضَ الشَّيْطَانَ وَمَا يُوَسْوِسُ بِهِ مِنْ مَعَاصٍ."},{"type":"p","text":"   (1) مَحَبَّةُ اللَّهِ وَرَسُولِهِ "},{"type":"p","text":"يَجِبُ عَلَى الْمُكَلَّفِ مَحَبَّةُ اللَّهِ تَعَالَى وَمَحَبَّةُ كَلامِهِ وَمَحَبَّةُ رَسُولِهِ ﷺ وَذَلِكَ بِاتِّبَاعِ أَوَامِرِ الشَّرْعِ وَاجْتِنَابِ نَوَاهِيهِ قَالَ اللَّهُ تَعَالَى ﴿قُلْ إِنْ كُنْتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِى يُحْبِبْكُمُ اللَّهُ﴾ [سُورَةَ ءَالِ عِمْرَان/31] وَهَذَا نَابِعٌ مِنَ الإِيـمَانِ بِاللَّهِ تَعَالَى وَبِمَا أَنْزَلَ وَبِتَصْدِيقِ رَسُولِهِ ﷺ وَمَا جَاءَ عَنْهُ."},{"type":"p","text":"أَمَّا الشَّكُّ فِى اللَّهِ تَبَارَكَ وَتَعَالَى أَوْ فِى كَلامِهِ أَوْ فِى رَسُولِهِ ﷺ فَهُوَ مِنْ مَعَاصِى الْقَلْبِ وَهُوَ كُفْرٌ مُخْرِجٌ مِنْ مِلَّةِ الإِسْلامِ."},{"type":"p","text":"   (2) مَحَبَّةُ الصَّحَابَةِ وَالآلِ وَالصَّالِحِينَ "},{"type":"p","text":"مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ مَحَبَّةُ الصَّحَابَةِ وَالآلِ وَالصَّالِحِينَ، وَعَدَمُ مَحَبَّتِهِمْ مِنْ مَعَاصِى الْقُلُوبِ وَشَتْمُهُمْ وَسَبُّهُمْ مِنْ مَعَاصِى اللِّسَانِ بَلْ سَبُّ الصَّحَابَةِ جُمَلَةً كُفْرٌ. "},{"type":"p","text":"الصَّحَابَةُ هُمْ أَصْحَابُ رَسُولِ اللَّهِ ﷺ وَأَنْصَارُ دِينِ اللَّهِ تَعَالَى وَلا سِيَّمَا السَّابِقِينَ الأَوَّلِينَ مِنْهُمْ مِنَ الْمُهَاجِرِينَ وَالأَنْصَارِ، وَهُمْ أَىِ الصَّحَابَةُ مَنْ لَقُوهُ فِى حَيَاتِهِ ﷺ مَعَ الإِيـمَانِ بِهِ سَوَاءٌ طَالَتْ صُحْبَتُهُمْ لَهُ أَوْ لَمْ تَطُلْ وَمَاتَوا عَلَى ذَلِكَ أَىْ عَلَى الإِيـمَانِ بِهِ."},{"type":"p","text":"الآلُ يُطْلَقُ عَلَى أَزْوَاجِ النَّبِىِّ ﷺ مِثْلُ خَدِيَجةَ وَعَائِشَةَ وَأَقْرِبَائِهِ الْمُؤْمِنِينَ مِثْلُ حَمْزَةَ وَالْعَبَّاسِ وَعَلِىٍّ وَالْحَسَنِ وَالْحُسَيْنِ وَأُمِهِمَا فَاطِمَةَ رَضِىَ اللَّهُ عَنْهُمْ أَجْمَعِينْ فَمَحَبَّتُهُمْ وَاجِبَةٌ لِمَا خُصُّوا بِهِ مِنَ الْفَضْلِ أَمَّا إِنْ أُرِيدَ بِالآلِ مُطْلَقُ أَتْبَاعِ النَّبِىِّ الأَتْقِيَاءِ فَتَجِبُ مَحَبَّتُهُمْ لِأَنَّهُمْ أَحْبَابُ اللَّهِ تَبَارَكَ وَتَعَالَى بِمَا لَهُمْ مِنَ الْقُرْبِ إِلَيْهِ بِطَاعَتِهِ الْكَامِلَةِ."},{"type":"p","text":"الصَّالِحُونَ هُمُ الأَتْقِيَاءُ الَّذِينَ أَدَّوُا الْوَاجِبَاتِ وَاجْتَنَبُوا الْمُحَرَّمَاتِ وَمِنْهُمُ الْعُلَمَاءُ الْعَامِلُونَ وَكُلُّ وَلِىٍّ صَالِحٍ."},{"type":"p","text":"   (3) بُغْضُ الشَّيْطَانِ وَالْمَعَاصِى "},{"type":"p","text":"كَذَلِكَ مِنْ أَعْمَالِ القُلُوبِ الْوَاجِبَةِ بُغْضُ الشَّيْطَانِ وَالْمَعَاصِى وَالنَّدَمُ عَلَيْهَا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ بَعْضَ الأَشْيَاءِ الَّتِى يَجِبُ عَلَى الْعَبْدِ مَحَبَّتُهَا."},{"type":"p","text":"     (2) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَّ عَلامَةَ حُبِّ اللَّهِ لِلْعَبْدِ صِدْقُ اتِّبَاعِهِ لِلنَّبِىِّ."},{"type":"p","text":"     (3) مَنْ هُمُ الصَّحَابَةُ ولِمَ تَجِبُ مَحَبَّتُهُمْ وَعَلَى مَنْ يُطْلَقُ لَفْظُ الصَّحَابَةِ."},{"type":"p","text":"     (4) مَنْ هُمُ الآلُ ولِمَ تَجِبُ مَحَبَّتُهُمْ."},{"type":"p","text":"     (5) مَنْ هُمُ الصَّالِحُونَ."},{"type":"p","text":"     (6) اذْكُرْ بَعْضَ مَا يَجِبُ عَلَى الْعَبْدِ بُغْضُهُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"التَّكَبُّرُ وَالْحِقْدُ وَالْحَسَدُ"},{"type":"p","text":""},{"type":"p","text":"التَّكَبُّرُ وَالْحِقْدُ وَالْحَسَدُ مِنْ مَعَاصِى الْقَلْبِ وَهِىَ صِفَاتٌ مَذْمُومَةٌ تَخْفَى عَلَى كَثِيرٍ مِنَ النَّاسِ لِعَدَمِ تَعَلُّمِهِمْ مَا هِىَ وَكَيْفَ يَتَجَنَّبُونَهَا."},{"type":"p","text":"   (1) التَّكَبُّرُ هُوَ رَدُّ الْحَقِّ عَلَى قَائِلِهِ وَاسْتِحْقَارُ النَّاسِ قَالَ النَّبِىُّ ﷺ «الْكِبْرُ بَطَرُ الْحَقِّ وَغَمْطُ النَّاسِ» رَوَاهُ مُسْلِمٌ، وَمَعْنَى بَطَرِ الْحَقِّ دَفْعُهُ وَرَدُّهُ عَلَى قَائِلِهِ وَمَعْنَى غَمْطِ النَّاسِ احْتِقَارُهُمْ. وَيُفْهَمُ مِنْ هَذَا الْحَدِيثِ أَنَّ التَّكَبُّرَ هُوَ رَدُّ الْحَقِّ عَلَى قَائِلِهِ مَعَ الْعِلْمِ بِأَنَّ الصَّوَابَ مَعَ الْقَائِلِ إِمَّا لِكَوْنِهِ صَغِيرًا أَوْ فَقِيرًا أَوْ تِلْمِيذًا أَوْ ضَعِيفًا، وَاسْتِحْقَارُ النَّاسِ أَىِ ازْدِرَاؤُهُمْ كَأَنْ يَتَكَبَّرَ عَلَى الْفَقِيرِ وَيَنْظُرَ إِلَيْهِ نَظَرَ احْتِقَارٍ أَوْ يُعْرِضَ عَنْهُ أَوْ يَتَرَفَّعَ عَلَيْهِ فِى الْخِطَابِ."},{"type":"p","text":"   (2) الْحِقدُ هُوَ إِضْمَارُ الْعَدَاوَةِ لِلْمُسْلِمِ مَعَ الْعَمَلِ بِمُقْتَضَى ذَلِكَ وَعَدَمِ اسْتِشْعَارِ الْكَرَاهِيَةِ لِهَذَا الْعَمَلِ قَالَ النَّبِىُّ ﷺ «مَنْ أَرَادَ أَنْ يُزَحْزَحَ عَنِ النَّارِ وَيُدْخَلَ الْجَنَّةَ فَلْتَأْتِهِ مَنِيَّتُهُ وَهُوَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ وَلْيَأْتِ إِلَى النَّاسِ بِمَا يُحِبُّ أَنْ يُؤْتَى إِلَيْهِ» رَوَاهُ ابْنُ حِبَّانَ وَالْبَيْهَقِىُّ."},{"type":"p","text":"   (3) الْحَسَدُ هُوَ أَنْ يَكْرَهَ الشَّخْصُ النِّعْمَةَ الَّتِى أَنْعَمَ اللَّهُ بِهَا عَلَى الْمُسْلِمِ دِينِيَّةً كَانَتْ أَوْ دُنْيَوِيَّةً وَتَمَنِّى زَوَالِهَا وَاسْتِثْقَالُهَا لَهُ وَإِنَّمَا يَكُونُ مَعْصِيَةً إِذَا عَمِلَ بِمُقْتَضَاهُ فَإِنْ كَرِهَهُ وَلَمْ يَعْمَلْ بِمُقْتَضَاهُ لَمْ يَكُنْ عَلَيْهِ ذَنْبٌ. وَمَعْنَى عَمِلَ بِمُقْتَضَاهُ كَأَنْ يَسْرِقَ مَالَهُ حَسَدًا أَوْ يُخَرِّبَ سَيَّارَتَهُ حَسَدًا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ التَّكَبُّرُ."},{"type":"p","text":"     (2) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى النَّهْىِ عَنِ التَّكَبُّرِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (3) مَا مَعْنَى بَطَرِ الْحَقِّ وَمَا مَعْنَى غَمْطِ النَّاسِ."},{"type":"p","text":"     (4) مَا مَعْنَى اسْتِحْقَارِ النَّاسِ."},{"type":"p","text":"     (5) مَا هُوَ الْحِقْدُ. "},{"type":"p","text":"     (6) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى الْحَثِّ عَلَى حُسْنِ الْمُعَامَلَةِ للنَّاسِ."},{"type":"p","text":"     (7) مَا هُوَ الْحَسَدُ وَمَتَى يَكُونُ مَعْصِيَةً."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"الْغِيبَةُ وَالْبُهْتَانُ وَالنَّمِيمَةُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿مَا يَلْفِظُ مِنْ قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌ﴾ [سُورَةَ ق/18]."},{"type":"p","text":"فِى هَذِهِ الآيَةِ بَيَانُ أَنَّ كُلَّ مَا يَتَلَفَّظُ بِهِ الإِنْسَانُ سَوَاءٌ كَانَ خَيْرًا أَوْ شَرًّا يَكْتُبُهُ مَلَكَانِ أَحَدُهُمَا رَقِيبٌ وَالآخَرُ عَتِيدٌ، وَالإِنْسَانُ الْعَاقِلُ يَنْبَغِى أَنْ يَحْفَظَ لِسَانَهُ عَنْ كُلِّ مَا هُوَ شَرٌّ وَمِنْ هَذَا الشَّرِّ الْغِيبَةُ وَالْبُهْتَانُ وَالنَّمِيمَةُ وَهِىَ مِنْ مَعَاصِى اللِّسَانِ وَمِنَ الْخِصَالِ الْمَذْمُومَةِ."},{"type":"p","text":"ثَبَتَ أَنَّ أَحَدَ الصَّحَابَةِ خَاطَبَ لِسَانَهُ وَقَالَ يَا لِسَانُ قُلْ خَيْرًا تَغْنَمْ وَاسْكُتْ عَنْ شَرٍّ تَسْلَمْ مِنْ قَبْلِ أَنْ تَنْدَمَ إِنِّى سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ «أَكْثَرُ خَطَايَا ابْنِ ءَادَمَ مِنْ لِسَانِهِ» رَوَاهُ الطَّبَرَانِىُّ."},{"type":"p","text":"   (1) الْغِيبَةُ هِىَ ذِكْرُ الْمُسْلِمِ بِمَا فِيهِ مِمَّا يَكْرَهُ فِى غَيْبَتِهِ فَلَوْ كَانَ شَخْصٌ مُسْلِمٌ قَصِيرَ الْقَامَةِ فَقَالَ عَنْهُ شَخْصٌ فِى غَيْبَتِهِ فُلانٌ قَصِيرٌ وَكَانَ يَكْرَهُ أَنْ يُقَالَ عَنْهُ ذَلِكَ فَإِنَّ ذَلِكَ مِنَ الْغِيبَةِ الْمُحَرَّمَةِ الَّتِى نَهَى عَنْهَا رَسُولُ اللَّهِ ﷺ قَالَ اللَّهُ تَعَالَى ﴿وَلا يَغْتَبْ بَّعْضُكُمْ بَعْضًا﴾ [سُورَةَ الْحُجُرَات/12]."},{"type":"p","text":"   (2) الْبُهْتَانُ هُوَ ذِكْرُ الْمُسْلِمِ بِمَا لَيْسَ فِيهِ مِمَّا يَكْرَهُهُ وَإِثْمُهُ أَشَدُّ مِنْ إِثْمِ الْغِيبَةِ لِأَنَّهُ يَتَضَمَّنُ الْكَذِبَ قَالَ رَسُولَ اللَّهِ ﷺ مُخَاطِبًا بَعْضَ الصَّحَابَةِ «أَتَدْرُونَ مَا الْغِيبَةُ» قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ قَالَ «ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ» قِيلَ أَفَرَأْيَتَ إِنْ كَانَ فِى أَخِى مَا أَقُولُ قَالَ «إِنْ كَانَ فِيهِ مَا تَقُولُ فَقَدِ اغْتَبْتَهُ وَإِنْ لَمْ يَكُنْ فِيهِ فَقَدْ بَهَتَّهُ» رَوَاهُ مُسْلِمٌ، ومَنِ اسْتَمَعَ لِلْغِيبَةِ الْمُحَرَّمَةِ فَقَدْ وَقَعَ فِى مَعْصِيَةٍ مِنْ مَعَاصِى الأُذُنِ وَعَلَيْهِ النَّهْىُ عَنْ ذَلِكَ."},{"type":"p","text":"   (3) النَّمِيمَةُ هِىَ نَقْلُ كَلامِ النَّاسِ بَعْضِهِمْ إِلَى بَعْضٍ عَلَى وَجْهِ الإِفْسَادِ بَيْنَهُمْ كَنَقْلِ الْكَلامِ لِلتَّفْرِيقِ بَيْنَ اثْنَيْنِ مُتَحَابَّيْنِ لِلإِفْسَادِ وَالْقَطِيعَةِ أَوِ الْعَدَاوَةِ بَيْنَهُمَا قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿هَمَّازٍ مَّشَّاءٍ بِنَمِيمٍ﴾ [سُورَةَ الْقَلَم/11] وَقَالَ رَسُولُ اللَّهِ ﷺ «لا يَدْخُلُ الْجَنَّةَ قَتَّاتٌ» رَوَاهُ الْبُخَارِىُّ، وَالْقَتَّاتُ هُوَ النَّمَّامُ أَىْ لا يَدْخُلُ الْجَنَّةَ مَعَ الأَوَّلِينَ بَلْ بَعْدَ أَنْ يَنَالَ الْعَذَابَ الَّذِى يَسْتَحِقُّ فِى نَارِ جَهَنَّمَ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً فِى الأَمْرِ بِحِفْظِ اللِّسَانِ."},{"type":"p","text":"     (2) اذْكُرْ بَعْضَ مَا يَجِبُ حِفْظُ اللِّسَانِ عَنْهُ."},{"type":"p","text":"     (3) اذْكُرْ مَا رُوِىَ عَنْ أَحَدِ الصَّحَابَةِ."},{"type":"p","text":"     (4) مَا هِىَ الْغِيبَةُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (5) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى حُرْمَةِ الْغِيبَةِ."},{"type":"p","text":"     (6) مَا هُوَ الْبُهْتَانُ وَمَا الدَّلِيلُ عَلَى حُرْمَتِهِ مِنْ حَدِيثِ رَسُولِ اللَّهِ."},{"type":"p","text":"     (7) مَا هِىَ النَّمِيمَةُ وَمَا الدَّلِيلُ عَلَى حُرْمَتِهَا مِنَ الْقُرْءَانِ."},{"type":"p","text":"     (8) أَيُّهُمَا أَشَدُّ إِثْمًا الْغِيبَةُ أَمِ الْبُهْتَانُ."},{"type":"p","text":"     (9) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ النَّمِيمَةِ وَمَا مَعْنَاهُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"الْكَذِبُ"},{"type":"p","text":""},{"type":"p","text":"الْكَذِبُ مِنْ مَعَاصِى اللِّسَانِ وَهُوَ الإِخْبَارُ بِالشَّىْءِ عَلَى خِلافِ الْوَاقِعِ عَمْدًا أَىْ مَعَ الْعِلْمِ بِأَنَّ خَبَرَهُ هَذَا عَلَى خِلافِ الْوَاقِعِ وَهُوَ حَرَامٌ سَوَاءٌ كَانَ عَلَى وَجْهِ الْجِدِّ أَوْ عَلَى وَجْهِ الْمَزْحِ فَقَدْ قَالَ النَّبِىُّ ﷺ «لا يَصْلُحُ الْكَذِبُ فِى جِدٍّ وَلا فِى هَزْلٍ» رَوَاهُ الْبَيْهَقِىُّ وَقَالَ ﷺ «إِيَّاكَ وَالْكَذِبَ فَإِنَّ الْكَذِبَ يَهْدِى إِلَى الْفُجُورِ وَإِنَّ الْفُجُورَ يَهْدِى إِلَى النَّارِ وَلا يَزَالُ الْعَبْدُ يَكْذِبُ وَيَتَحَرَّى الْكَذِبَ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا» رَوَاهُ ابْنُ مَاجَهْ."},{"type":"p","text":"وَيَدْخُلُ تَحْتَ الْكَذِبِ أَشْيَاءُ كَثِيرَةٌ مِنْ مَعَاصِى اللِّسَانِ مِنْهَا الْيَمِينُ الْكَاذِبَةُ وَشَهَادَةُ الزُّورِ وَالْكَذِبُ عَلَى اللَّهِ وَرَسُولِهِ."},{"type":"p","text":"   (1) الْيَمِينُ الْكَاذِبَةُ "},{"type":"p","text":"الْيَمِينُ الْكَاذِبَةُ مِنْ كَبَائِرِ الذُّنُوبِ كَأَنْ يَحْلِفَ إِنْسَانٌ بِاللَّهِ تَبَارَكَ وَتَعَالَى بِخِلافِ الْوَاقِعِ فَيَقُولَ «وَاللَّهِ فَعَلْتُ كَذَا» وَهُوَ لَمْ يَفْعَلْ أَوْ يَقُولَ «وَاللَّهِ لَمْ أَفْعَلْ هَذَا الشَّىْءَ» وَهُوَ قَدْ فَعَلَهُ فَهَذَا مِنَ التَّهَاوُنِ فِى تَعْظِيمِ اللَّهِ تَعَالَى."},{"type":"p","text":"   (2) شَهَادَةُ الزُّورِ "},{"type":"p","text":"مَعْنَى الزُّورِ الْكَذِبُ وَشَهَادَةُ الزُّورِ مِنْ أَكْبَرِ الْكَبَائِرِ كَأَنْ يَشْهَدَ شَخْصٌ عِنْدَ الْقَاضِى أَنَّ فُلانًا سَرَقَ وَهُوَ يَكْذِبُ قَالَ النَّبِىُّ ﷺ «عَدَلَتْ شَهَادَةُ الزُّورِ الإِشْرَاكَ بِاللَّهِ» رَوَاهُ الْبَيْهَقِىُّ أَىْ شُبِّهَتْ بِالإِشْرَاكِ مِنْ عُظْمِ الذَّنْبِ النَّاتِجِ عَنْهَا وَلَيْسَ الْمُرَادُ أَنَّ فَاعِلَهَا يَخْرُجُ مِنْ دِينِ الإِسْلامِ وَلَكِنَّهُ مُذْنِبٌ ذَنْبًا كَبِيرًا."},{"type":"p","text":"   (3) الْكَذِبُ عَلَى اللَّهِ وَعَلَى رَسُولِهِ وَهُوَ مِنْ كَبَائِرِ الذُّنُوبِ قَالَ اللَّهُ تَعَالَى ﴿وَيَوْمَ الْقِيَامَةِ تَرَى الَّذِينَ كَذَبُوا عَلَى اللَّهِ وُجُوهُهُمْ مُّسْوَدَّةٌ﴾ [سُورَةَ الزُّمَر/60] وَالْكَذِبُ عَلَى اللَّهِ كَأَنْ يَقُولَ شَخْصٌ خَلَقَ اللَّهُ فِى جِهَةِ كَذَا جَبَلًا مِنْ ذَهَبٍ وَهُوَ يَكُونُ غَيْرَ مَوْجُودٍ فَهُوَ خِلافُ الْوَاقِعِ مَعَ الْعِلْمِ أَنَّ اللَّهَ قَادِرٌ عَلَى أَنْ يَخْلُقَهُ. وَمِنَ الْكَذِبِ عَلَى اللَّهِ مَا يَكُونُ كُفْرًا كَمَنْ يَقُولُ إِنَّ اللَّهَ جَالِسٌ عَلَى الْعَرْشِ أَوْ سَاكِنٌ فِى جِهَةٍ مِنَ الْجِهَاتِ أَوْ مَنْ يَقُولُ إِنَّ اللَّهَ حَالٌّ فِى كُلِّ شَىْءٍ فَهَذَا كُفْرٌ وَكَذَلِكَ مَنْ يَنْسُبُ إِلَى اللَّهِ تَحْلِيلَ مَا حَرَّمَهُ فِى شَرْعِهِ أَوْ تَحْرِيمَ مَا أَحَلَّهُ فِى شَرْعِهِ مَعَ الْعِلْمِ بِهِ."},{"type":"p","text":"   أَمَّا الْكَذِبُ عَلَى الرَّسُولِ ﷺ فَهُوَ كَأَنْ يَنْسُبَ كَاذِبًا إِلَى رَسُولِ اللَّهِ ﷺ كلامًا لَمْ يَقُلْهُ قَالَ رَسُولُ اللَّهِ ﷺ «إِنَّ كَذِبًا عَلَىَّ لَيْسَ كَكَذِبٍ عَلَى أَحَدٍ فَمَنْ كَذَبَ عَلَىَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ» رَوَاهُ مُسْلِمٌ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ الْكَذِبُ وَمَا الدَّلِيلُ عَلَى حُرْمَتِهِ مِنَ الْحَدِيثِ."},{"type":"p","text":"     (2) اذْكُرْ حَدِيثًا يَدُلُّ عَلَى تَحْرِيمِ الْكَذِبِ فِى حَالِ الْجِدِّ وَالْمَزْحِ."},{"type":"p","text":"     (3) مَا مَعْنَى الْيَمِينِ الْكَاذِبَةِ."},{"type":"p","text":"     (4) مَا مَعْنَى شَهَادَةِ الزُّورِ أَعْطِ مِثَالًا."},{"type":"p","text":"     (5) بِمَ شَبَّهَ النَّبِىُّ شَهَادَةَ الزُّورِ، اذْكُرِ الْحَدِيثَ وَبَيِّنْ مَعْنَاهُ. "},{"type":"p","text":"     (6) اذْكُرْ مِثَالًا عَنِ الْكَذِبِ عَلَى اللَّهِ وَالدَّلِيلَ عَلَى تَحْرِيمِهِ مِنَ الْقُرْءَانِ."},{"type":"p","text":"     (7) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ الْكَذِبِ عَلَى الرَّسُولِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"فَضْلُ الْعِلْمِ وَالْعَمَلُ بِهِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ النَّبِىُّ ﷺ «طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ» رَوَاهُ الْبَيْهَقِىُّ."},{"type":"p","text":"الْعِلْمُ وَالْتَفَقُّهُ فِى الدِّينِ هُوَ أَسْنَى مَا تُنْفَقُ فِيهِ نَفَائِسُ الأَوْقَاتِ لِأَنَّ الطَّرِيقَ السَّلِيمَ لِوِقَايَةِ النَّفْسِ وَالأَهْلِ مِنْ عَذَابِ النَّارِ يَكُونُ بِتَعلُّمِ الأُمُورِ الدِّينِيَّةِ أَىْ تَعَلُّمِ مَا فَرَضَ اللَّهُ عَلَيْنَا تَعَلُّمَهُ وَاجْتِنَابِ مَا فَرَضَ اللَّهُ عَلَيْنَا اجْتِنَابَهُ."},{"type":"p","text":"قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿يَرْفَعِ اللَّهُ الَّذِينَ ءَامَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ﴾ [سُورَةَ الْمُجَادِلَة/11] وَقَالَ النَّبِىُّ ﷺ «مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِى الدِّينِ» رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":""},{"type":"p","text":"الْعِلْمُ وَالأَخْلاقُ الْفَاضِلَةُ "},{"type":"p","text":"لا يَكُونُ الْعَبْدُ صَالِحًا إِلَّا بِالْعِلْمِ مَعَ الْعَمَلِ أَىْ بِأَنْ يِتَعَلَّمَ أُمُورَ الدِّينِ وَيُطَبِّقَ مَا تَعَلَّمَهُ عَلَى نَفْسِهِ فَمَنْ تَعَلَّمَ وَعَمِلَ بِمَا تَعَلَّمَ فَهُوَ الشَّخْصُ الَّذِى يَعْرِفُ كَيْفَ يَصْرِفُ قَلْبَهُ وَجَوَارِحَهُ فِى طَاعَةَ اللَّهِ وَبِذَلِكَ يَصِلُ الْمُسْلِمُ إِلَى الأَخْلاقِ الْفَاضِلَةِ فَهُوَ يَسْتَعْمِلُ سَمْعَهُ فِى تَلَقِّى الْعِلْمِ وَيَسْتَعْمِلُ لِسَانَهُ فِى مُذَاكَرَتِهِ وَكَذَلِكَ فِى تَبْلِيغِ مَا تَعَلَّمَهُ فَقَدْ قَالَ النَّبِىُّ ﷺ «بَلِّغُوا عَنِّى وَلَوْ ءَايَةً» رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"تَجَنُّبُ مَعَاصِى اللِّسَانِ"},{"type":"p","text":"وَمِنْ جُمْلَةِ مَا يَنْبَغِى عَلَى الْمُتَعَلِّمِ تَجَنُّبُهُ مَعَاصِى اللِّسَانِ وَمِنْهَا الْفَتْوَى بِغَيْرِ عِلْمٍ وَكَتْمُ الْعِلْمِ الْوَاجِبِ مَعَ وُجُودِ الطَّالِبِ وَالسُّكُوتُ عَنِ الأَمْرِ بِالْمَعْرُوفِ وَالنَّهْىِ عَنِ الْمُنْكَرِ مَعَ الِاسْتِطَاعَةِ."},{"type":"p","text":"   (1) الْفَتْوَى بِغَيْرِ عِلْمٍ "},{"type":"p","text":"وَهُوَ أَنْ يَقُولَ الشَّخْصُ فِى أُمُورِ الدِّينِ بِرَأْيِهِ وَهَذَا حَرَامٌ يُوقِعُ صَاحِبَهُ فِى الْمَهَالِكِ كَأَنْ يَقُولَ عَنْ شَىْءٍ يَجُوزُ فِعْلُهُ أَوْ لا يَجُوزُ وَهُوَ لا يَعْلَمُ حُكْمَهُ فِى الشَّرْعِ قَالَ رَسُولُ اللَّهِ ﷺ «مَنْ أَفْتَى بِغَيْرِ عِلْمٍ فَعَلَيْهِ لَعْنَةُ اللَّهِ وَالْمَلائِكَةِ وَالنَّاسِ أَجْمَعِينَ» رَوَاهُ السُّيُوطِىُّ."},{"type":"p","text":"   (2) كَتْمُ الْعِلْمِ الْوَاجِبِ مَعَ وُجُودِ الطَّالِبِ "},{"type":"p","text":"مِنْ مَعَاصِى اللِّسَانِ كَتْمُ الْعِلْمِ الْوَاجِبِ كَتَعْلِيمِ فَرْضِ الْعَيْنِ لِلشَّخْصِ الْمُحْتَاجِ إِلَيْهِ مَعَ وُجُودِهِ قَالَ النَّبِىُّ ﷺ «مَنْ سُئِلَ عَنْ عِلْمٍ فَكَتَمَهُ أُلْجِمَ يَوْمَ الْقِيَامَةِ بِلِجَامٍ مِنْ نَارٍ» رَوَاهُ ابْنُ مَاجَهْ وَالْحَاكِمُ وَابْنُ حِبَّانَ."},{"type":"p","text":"   (3) السُّكُوتُ عَنِ الأَمْرِ بِالْمَعْرُوفِ وَالنَّهْىِ عَنِ الْمُنْكَرِ "},{"type":"p","text":"وَيَكُونُ مَعْصِيَةً مِنْ مَعَاصِى اللِّسَانِ مَعَ الِاسْتِطَاعَةِ أَىْ إِنْ كَانَ مُسْتَطِيعًا فَإِذَا رَأَى شَخْصًا يَتْرُكُ الصَّلاةَ وَهُوَ يَقْبَلُ النَّصِيحَةَ وَجَبَ أَمْرُهُ بِالْمَعْرُوفِ أَىْ بِأَدَاءِ الصَّلاةِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى الْحَثِّ عَلَى طَلَبِ الْعِلْمِ."},{"type":"p","text":"     (2) مَا هُوَ الطَّرِيقُ السَّلِيمُ لِوِقَايَةِ النَّفْسِ وَالأَهْلِ مِنَ النَّارِ."},{"type":"p","text":"     (3) اذْكُرْ ءَايَةً وَحَدِيثًا فِى فَضْلِ الْعِلْمِ."},{"type":"p","text":"     (4) اذْكُرْ حَدِيثًا فِى الأَمْرِ بِتَبْلِيغِ الْعِلْمِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (5) عَدِّدْ بَعْضَ مَعَاصِى اللِّسَانِ."},{"type":"p","text":"     (6) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ الْفَتْوَى بِغَيْرِ عِلْمٍ."},{"type":"p","text":"     (7) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ كَتْمِ الْعِلْمِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"الأَلْعَابُ الْمُحَرَّمَةُ"},{"type":"p","text":""},{"type":"p","text":"مِنْ مَعَاصِى الْيَدِ اللَّعِبُ بِالأَلْعَابِ الَّتِى حَرَّمَهَا الشَّرْعُ وَهِىَ كَثِيرَةٌ مِنْهَا النَّرْدُ وَالشَّدَّةُ لِأَنَهَا تَعْتَمِدُ عَلَى الْحَزْرِ وَالتَّخْمِينِ لا عَلَى الْفِكْرِ وَالْحِسَابِ وَتَصْوِيرُ ذِى رُوحٍ وَالْقِمَارُ. وَالأَلْعَابُ الْمُحَرَّمَةُ بَعْضُهَا يُؤَدِّى لِلتَّخَاصُمِ وَالْفِتَنِ بَيْنَ النَّاسِ وَيَنْتُجُ عَنْهَا شُّرورٌ كَثِيرَةٌ."},{"type":"p","text":"   (1) النَّرْدُ "},{"type":"p","text":"ويُسَمَّى أَيْضًا النَّرْدَشِيرَ وَهُوَ نِسْبَةٌ لِأَوَّلِ مُلُوكِ الْفُرْسِ لِأَنَّهُ أَوَّلُ مَنْ وُضِعَ لَهُ قَالَ عَلَيْهِ الصَّلاةُ والسَّلامُ «مَنْ لَعِبَ بِالنَّرْدَشِيرِ فَكَأَنَّمَا غَمَسَ يَدَهُ فِى لَحْمِ خِنْزِيرٍ وَدَمِهِ» رَوَاهُ أَبُو دَاوُدَ وابْنُ مَاجَهْ."},{"type":"p","text":"   (2) وَالشَّدَّةُ "},{"type":"p","text":"وَتُقَاسُ عَلَى النَّرْدِ لِأَنَّ كُلَّ لُعْبَةٍ كَانَ الِاعْتِمَادُ فِى لُعْبِهَا عَلَى الْحَزْرِ وَالتَّخْمِينِ لا عَلَى الْفِكْرِ وَالْحِسَابِ فَهِىَ حَرَامٌ مِثْلُ اللَّعِبِ بِالأَوْرَاقِ الْمَعْرُوفَةِ بِالشَّدَّةِ."},{"type":"p","text":"وَكَذَلِكَ الدُّومِينُو وَالْبِرْجِيسُ لِأَنَهَا أَلْعَابٌ لَيْسَ الْعَمَلُ فِيهَا إِلَّا عَلَى الْحَزْرِ وَالتَّخْمِينِ وَهَذِهِ الأَلْعَابُ إِنْ كَانَتْ بِعِوَضٍ أَىْ عَلَى مَالٍ يَدْفَعُهُ الْخَاسِرُ فِى اللَّعِبِ فَهُوَ قِمَارٌ حَرَامٌ مِنْ كَبَائِرِ الذُّنُوبِ."},{"type":"p","text":"أَمَّا الشِّطْرَنْجُ فَإِنَّهُ لَيْسَ فِى مَعْنَى اللَّعِبِ بِالنَّرْدِ لِأَنَّ الْعُمْدَةَ فِيهِ عَلَى الْفِكْرِ وَالْحِسَابِ قَبْلَ النَّقْلِ وَمَا وَرَدَ عَنِ النَّبِىِّ ﷺ فِى ذَمِّهِ غَيْرُ ثَابِتٍ إِذْ هُوَ مَوْضُوعٌ لِصِحَّةِ الْفِكْرِ وَصَوَابِ التَّدْبِيرِ وَنِظَامِ السِّيَاسَةِ وَهُوَ مُعِينٌ عَلَى تَدْبِيرِ الْحُرُوبِ وَالْحِسَابِ."},{"type":"p","text":"   (3) وَتَصْوِيرُ ذِى رُوحٍ "},{"type":"p","text":"وَمِنْ مَعَاصِى الْيَدِ تَصْوِيرُ ذِى رُوحٍ سَوَاءٌ كَانَ مُجَسَّمًا أَوْ مَنْقُوشًا فِى سَقْفٍ أَوْ جِدَارٍ أَوْ مُصَوَّرًا فِى وَرَقٍ أَوْ مَنْسُوجًا فِى ثَوْبٍ أَوْ غَيْرِ ذَلِكَ وَيُسْتَثْنَى مِنْ ذَلِكَ لُعَبُ الْبَنَاتِ الصِّغَارِ وَيُشْتَرَطُ لِتَحْرِيمِ اسْتِبْقَاءِ الصُّورَةِ أَنْ تَكُونَ الصُّورَةُ بِهَيْئَةٍ يَعِيشُ عَلَيْهَا الْحَيَوَانُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) عَدِّدْ بَعْضَ الأَلْعَابِ الْمُحَرَّمَةِ."},{"type":"p","text":"     (2) لِمَ حُرِّمَتْ هَذِهِ الأَلْعَابُ."},{"type":"p","text":"     (3) مَا هُوَ النَّرْدُ وَمَا الدَّلِيلُ عَلَى تَحْرِيمِهِ."},{"type":"p","text":"     (4) لِمَ يَحْرُمُ اللَّعِبُ بِالأَوْرَاقِ الْمُزَوَّقَةِ (الشَّدَّةِ)."},{"type":"p","text":"     (5) مَا حُكْمُ اللَّعِبِ بِالشِّطْرَنْجِ ولِمَ وُضِعَ."},{"type":"p","text":"     (6) مَا حُكْمُ تَصْوِيرِ ذِى رُوحٍ وَمَاذَا يُسْتَثْنَى مِنْ ذَلِكَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"عُقُوقُ الْوَالِدَيْنِ"},{"type":"p","text":""},{"type":"p","text":"عُقُوقُ الْوَالِدَيْنِ مِنَ الْكَبَائِرِ الَّتِى تَوَعَّدَ اللَّهُ فَاعِلَهَا بِالْعَذَابِ الشَّدِيدِ فِى النَّارِ وَمَعْنَى الْعُقُوقِ أَنْ يُؤْذِىَ وَالِدَيْهِ أَوْ أَحَدَهُمَا أَذًى لَيْسَ بِهَيِّنٍ وَإِيذَاءُ الوَالِدَيْنِ سَوَاءٌ كَانَ أَذًى شَدِيدًا أَوْ خَفِيفًا حَرَامٌ."},{"type":"p","text":"وَمِنَ الأَمْثِلَةِ عَلَى الْعُقُوقِ شَتْمُ الأُمِّ أَوِ الأَبِ أَوْ ضَرْبُ الأُمِّ أَوِ الأَبِ أَوْ إِهَانَتُهُمَا أَوْ أَحَدِهِمَا."},{"type":"p","text":"وَمِنْ جُمْلَةِ الْعُقُوقِ إِذَا أَطَاعَ الْوَلَدُ أُمَّهُ عَلَى ظُلْمِ أَبِيهِ أَوْ أَطَاعَ أَبَاهُ عَلَى ظُلْمِ أُمِّهِ وَلا يَنْفَعُهُ عِنْدَ اللَّهِ تَعَالَى إِنْ أَطَاعَ أُمَّهُ وَظَلَمَ أَبَاهُ لِأَنَّهُ لا طَاعَةَ لِمَخْلُوقٍ فِى مَعْصِيَةِ الْخَالِقِ فَنُصْرَةُ أَحَدِ الأَبَوَيْنِ فِى ظُلْمِ الآخَرِ حَرَامٌ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلاهُمَا فَلا تَقُلْ لَّهُمَا أُفٍّ وَلا تَنْهَرْهُمَا وَقُلْ لَّهُمَا قَوْلًا كَرِيمًا وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا﴾ [سُورَةَ الإِسْرَاء]."},{"type":"p","text":"وَمَعْنَى قَوْلِهِ تَعَالَى ﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ أَىْ أَمَرَ اللَّهُ أَنْ لا يُعْبَدَ سِوَاهُ وَبِبِرِّ الْوَالِدَيْنِ، وَمَعْنَى قَوْلِهِ تَعَالَى ﴿وَقُلْ لَّهُمَا قَوْلًا كَرِيمًا﴾ أَىْ قَوْلًا لَيِّنًا لَطِيفًا فَاللَّهُ سُبْحَانَهُ وَتَعَالَى نَهَى عَنْ أَنْ يُقَالَ لَهُمَا أُفٍّ وَهَذَا مِنَ الْكَبَائِرِ وَأَمَرَ سُبْحَانَهُ وَتَعَالَى أَنْ يُقَالَ لَهُمَا الْقَوْلُ الْكَرِيمُ أَىِ اللَّيِّنُ لا سِيَّمَا عِنْدَ الْكِبَرِ وَأَنْ نُخْفِضَ لَهُمَا الْجَنَاحَ بِأَنْ نُكَلِّمَهُمَا بِأَدَبٍ وَاحْتِرَامٍ."},{"type":"p","text":"عَذَابُ الْعَاقِّ لِوَالِدَيْهِ"},{"type":"p","text":"إِنَّ عَذَابَ عُقُوقِ الْوَالِدَيْنِ عِنْدَ اللَّهِ تَعَالَى عَظِيمٌ حَيْثُ إِنَّ عَاقَّهُمَا لا يَدْخُلُ الْجَنَّةَ مَعَ الْمُسْلِمِينَ الأَوَّلِينَ بَلْ يَدْخُلُهَا بَعْدَ عَذَابٍ شَدِيدٍ مَعَ الآخِرِينَ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ وَذَلِكَ لِأَنَّ هَذَا الذَّنْبَ هُوَ مِنْ كَبَائِرِ الذُّنُوبِ قَالَ رَسُولُ اللَّهِ ﷺ «لا يَدْخُلُ الْجَنَّةَ عَاقٌّ» رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ، أَىْ لا يَدْخُلُهَا مَعَ الأَوَّلِينَ وَلَيْسَ الْمَعْنَى أَنَّهُ كَافِرٌ مَحْرُومٌ مِنَ الْجَنَّةِ."},{"type":"p","text":""},{"type":"p","text":"ءَايَاتٌ قُرْءَانِيَّةٌ فِى الْحَثِّ عَلَى بِرِّ الْوَالِدَيْنِ"},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَوَصَّيْنَا الإِنْسَانَ بِوَالِدَيْهِ حَمَلَتْهُ أُمُّهُ وَهْنًا عَلَى وَهْنٍ وَفِصَالُهُ فِى عَامَيْنِ أَنِ اشْكُرْ لِى وَلِوَالِدَيْكَ إِلَىَّ الْمَصِيرُ﴾ [سُورَةَ لُقْمَان/14] وَقَالَ اللَّهُ تَعَالَى ﴿وَاعْبُدُوا اللَّهَ وَلا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [سُورَةَ النِّسَاء /36]."},{"type":"p","text":"فَاعْلَمْ أَنَّ الْمَرْءَ مَهْمَا كَانَ مُوَاظِبًا عَلَى أَدَاءِ الصَّلَوَاتِ الْخَمْسِ وَالصِّيَامِ وَنَحْوِ ذَلِكَ مِنَ الْفَرَائِضِ إِذَا كَانَ عَاقًّا لِوَالِدَيْهِ يُؤْذِيهِمَا أَذًى شَدِيدًا بِالْقَوْلِ أَوِ الْفِعْلِ فَإِنَّهُ لا يَكُونُ عِنْدَ اللَّهِ مِنَ الْمُتَّقِينَ الصَّالِحِينَ. فَاحْرِصْ عَلَى بِرِّ الْوَالِدَيْنِ وَإِيَّاكَ وَالْعُقُوقَ فَإِنَّكَ إِمَّا أَنْ تَمُوتَ قَبْلَهُمَا أَوْ يَمُوتَا قَبْلَكَ فَلا تُفَوِّتْ هَذَا الفَضْلَ الْعَظِيمَ بِرَّ الْوَالِدَيْنِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا مَعْنَى عُقُوقِ الْوَالِدَيْنِ وَمَا حُكْمُهُ."},{"type":"p","text":"     (2) أَعْطِ أَمْثِلَةً عَلَى عُقُوقِ الْوَالِدَيْنِ."},{"type":"p","text":"     (3) اذْكُرْ دَلِيلًا مِنَ الْقُرْءَانِ عَلَى تَحْرِيمِ الْعُقُوقِ."},{"type":"p","text":"     (4) اشْرَحِ الآيَةَ ﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾."},{"type":"p","text":"     (5) مَا مَعْنَى الآيَةِ ﴿وَقُلْ لَّهُمَا قَوْلًا كَرِيمًا﴾."},{"type":"p","text":"     (6) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ الْعُقُوقِ وَمَا مَعْنَاهُ."},{"type":"p","text":"     (7) اذْكُرْ ثَلاثَ ءَايَاتٍ فِيهَا الأَمْرُ بِالإِحْسَانِ لِلْوَالِدَيْنِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"قَطِيعَةُ الرَّحِمِ"},{"type":"p","text":""},{"type":"p","text":"قَطِيعَةُ الرَّحِمِ هِىَ مِنْ مَعَاصِى الْبَدَنِ وَهِىَ مِنَ الْكَبَائِرِ وَتَحْصُلُ بِإِيحَاشِ قُلُوبِ الأَرْحَامِ وَتَنْفِيرِهَا إِمَّا بِتَرْكِ الإِحْسَانِ بِالْمَالِ فِى حَالِ الْحَاجَةِ النَّازِلَةِ بِهِمْ أَوْ تَرْكِ الزِّيَارَةِ بِلا عُذْرٍ كَأَنْ يَفْقِدَ مَا كَانَ يَصِلُهُمْ بِهِ مِنَ الْمَالِ أَوْ يَجِدَهُ لَكِنَّهُ يَحْتَاجُهُ لِمَا هُوَ أَوْلَى بِصَرْفِهِ فِيهِ مِنْهُمْ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿فَهَلْ عَسَيْتُمْ إِنْ تَوَلَّيْتُمْ أَنْ تُفْسِدُوا فِى الأَرْضِ وَتُقَطِّعُوا أَرْحَامَكُمْ أُولَئِكَ الَّذِينَ لَعَنَهُمُ اللَّهُ فَأَصَمَّهُمْ وَأَعْمَى أَبْصَارَهُمْ﴾ [سُورَةَ مُحَمَّد/22]. "},{"type":"p","text":"وَقَالَ النَّبِىُّ ﷺ «لا يَدْخُلُ الْجَنَّةَ قَاطِعٌ» رَوَاهُ الْبُخَارِىُّ، وَمَعْنَى قَاطِعٌ أَىْ قَاطِعُ رَحِمٍ فَهُوَ لا يَدْخُلُ الْجَنَّةَ مَعَ الأَوَّلِينَ بَلْ يَدْخُلُهَا بَعْدَ عَذَابٍ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ."},{"type":"p","text":"صِلَةُ الرَّحِمِ "},{"type":"p","text":"وَالْمُرَادُ بِالرَّحِمِ الأَقَارِبُ كَالْخَالاتِ وَالْعَمَّاتِ وَأَوْلادِهِنَّ وَالأَخْوَالِ وَالأَعْمَامِ وَأَوْلادِهِمْ، سَأَلَ أَحَدُ الصَّحَابَةِ رَسُولَ اللَّهِ ﷺ فَقَالَ مَا النَّجَاةُ يَا رَسُولَ اللَّهِ قَالَ «تَصِلُ مَنْ قَطَعَكَ وَتُعْطِى مَنْ حَرَمَكَ وَتَعْفُو عَمَّنْ ظَلَمَكَ» رَوَاهُ التِّرْمِذِىُّ."},{"type":"p","text":"فَهَذِهِ الْخِصَالُ الثَّلاثُ الْعَظِيمَةُ كَانَتْ مِنْ أَوْصَافِ الرَّسُولِ وَأَخْلاقِهِ وَالَّتِى مِنْهَا وَصْلُ مَنْ قَطَعَ أَىْ أَنَّ لِلرَّحِمِ حَقَّ الصِّلَةِ فَلا يَجُوزُ لِلْمَرْءِ أَنْ يَقْطَعَ مَنْ تَجِبُ عَلَيْهِ صِلَتُهُ مِنَ الأَقَارِبِ بِحَيْثُ يَشْعُرُ بِالْجَفَاءِ وَلَوْ قَطَعَ هَذَا الْقَرِيبُ زِيَارَتَهُ."},{"type":"p","text":"الصِّلَةُ الْكَامِلَةُ لِلرَّحِمِ "},{"type":"p","text":"وَالصِّلَةُ الْكَامِلَةُ لِلرَّحِمِ هُوَ أَنْ يَصِلَ الْمَرْءُ مَنْ قَطَعَهُ مِنَ الرَّحِمِ فَلا يَقُولُ هَذَا رَحِمِى لا يَزُورُنِى فَلا أَزُورُهُ لا يَجُوزُ أَنْ يُقَابِلَ الْقَطِيعَةَ بِالْقَطِيعَةِ بَلْ يَجِبُ عَلَيْهِ أَنْ يُقَابِلَ الْقَطِيعَةَ بِالصِّلَةِ. قَالَ رَسُولُ اللَّهِ ﷺ «لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ وَلَكِنَّ الْوَاصِلَ مَنْ وَصَلَ رَحِمَهُ إِذَا قَطَعَتْ» رَوَاهُ مُسْلِمٌ، فَفِى هَذَا الْحَدِيثِ إِيذَانٌ بِأَنَّ صِلَةَ الرَّجُلِ رَحِمَهُ الَّتِى لا تَصِلُهُ أَفْضَلُ مِنْ صِلَتِهِ رَحِمَهُ الَّتِى تَصِلُهُ لِأَنَّ ذَلِكَ مِنْ حُسْنِ الْخُلُقِ الَّذِى حَضَّ الشَّرْعُ عَلَيْهِ حَضًّا بَالِغًا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا حُكْمُ قَطِيعَةِ الرَّحِمِ وَمِنْ أَىِّ الْمَعَاصِى هِىَ."},{"type":"p","text":"     (2) كَيْفَ تَحْصُلُ قَطِيعَةُ الرَّحِمِ."},{"type":"p","text":"     (3) اذْكُرْ ءَايَةً فِى تَحْرِيمِ قَطِيعَةِ الرَّحِمِ."},{"type":"p","text":"     (4) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ قَطِيعَةِ الرَّحِمِ وَمَا مَعْنَاهُ."},{"type":"p","text":"     (5) مَا الْمُرَادُ بِالرَّحِمِ."},{"type":"p","text":"     (6) اذْكُرْ حَدِيثًا فِى فَضْلِ صِلَةِ الرَّحِمِ."},{"type":"p","text":"     (7) كَيْفَ تَكُونُ الصِّلَةُ لِلرَّحِمِ كَامِلَةً."},{"type":"p","text":"     (8) اذْكُرْ حَدِيثًا فِى بَيَانِ فَضْلِ الإِحْسَانِ إِلَى الْقَرِيبِ الَّذِى قَطَعَكَ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"احْتِرَامُ الْمُؤْمِنِ"},{"type":"p","text":""},{"type":"p","text":"خَلَقَ اللَّهُ الإِنْسَانَ فِى أَحْسَنِ تَقْوِيمٍ وَسَخَّرَ لَهُ مَا فِى السَّمَوَاتِ وَمَا فِى الأَرْضِ جَمِيعًا وَجَعَلَ لَهُ عَقْلًا وَلِسَانًا وَشَفَتَيْنِ وَعَيْنَيْنِ وَأُذُنَيْنِ لِيَسْتَعْمِلَ هَذِهِ الأَدَوَاتِ فِيمَا يُرْضِى اللَّهَ تَعَالَى، خَلَقَهُ لِيَقُومَ بِعِبَادَتِهِ وَلِيَسْتَعْمِلَ جَوَارِحَهُ فِى طَاعَتِهِ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَصَوَّرَكُمْ فَأَحْسَنَ صُوَرَكُمْ وَإِلَيْهِ الْمَصِيرُ﴾ [سُورَةَ التَّغَابُن/3]. "},{"type":"p","text":"وَجَعَلَ اللَّهُ لِلْمُؤْمِنِ مِيزَةً عَلَى غَيْرِهِ لِأَنَّهُ أَدَّى أَعْظَمَ حَقٍّ مِنْ حُقُوقِ اللَّهِ وَهُوَ تَوْحِيدُهُ تَعَالَى وَتَرْكُ الإِشْرَاكِ بِهِ شَيْئًا."},{"type":"p","text":"فَالإِنْسَانُ الْمُؤْمِنُ لَهُ حُرْمَةٌ عَظِيمَةٌ عِنْدَ اللَّهِ تَعَالَى وَقَدْ حَثَّ الشَّرْعُ عَلَى احْتِرَامِهِ وَعَدَمِ تَحْقِيرِهِ وَجَعَلَ إِيذَاءَهُ مَعْصِيَةً يُعَاقَبُ عَلَيْهَا فَإِذَا اغْتَابَهُ شَخْصٌ وَلا عُذْرَ لَهُ ارْتَكَبَ مَعْصِيَةً مِنْ مَعَاصِى الِلسَّانِ، وَلَوْ ضَرَبَهُ بِغَيْرِ حَقٍّ ارْتَكَبَ مَعْصِيَةً مِنْ مَعَاصِى الْيَدَيْنِ وَهَكَذَا."},{"type":"p","text":"   بَعْضُ أَبْوَابِ الْمَعَاصِى الَّتِى يَجِبُ تَجَنُّبُهَا"},{"type":"p","text":"مِنْ مَعَاصِى الْقَلْبِ التَّكَبُّرُ وَالْحِقدُ وَالْحَسَدُ."},{"type":"p","text":"مِنْ مَعَاصِى الْعَيْنِ النَّظَرُ إلَى الْمُؤْمِنِ بِالِاسْتِحْقَارِ وَالِازْدِرَاءِ."},{"type":"p","text":"مِنْ مَعَاصِي اللِّسَانِ الِاسْتِهْزَاءُ بالْمُؤْمِنِ أَىِ التَّحْقِيرُ لَهُ وَكَذَلِكَ كُلُّ كَلامٍ يُؤْذِى الْمُؤْمِنَ وَالضَّحِكُ عَلَيْهِ اسْتِحْقَارًا لَهُ بِمَا فِيهِ مِنَ الإِيذَاءِ قَالَ ﷺ «بِحَسْبِ امْرِءٍ مِنَ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ» رَوَاهُ مُسْلِمٌ."},{"type":"p","text":"مِنْ مَعَاصِى الْيَدَيْنِ ضَرْبُ الْمُؤْمِنِ بِغَيْرِ حَقٍّ وَمِثْلُ الضَّرْبِ تَرْوِيعُ الْمُؤْمِنِ وَالإِشَارَةُ إِلَيْهِ بِنَحْوِ سِلاحٍ قَالَ ﷺ «مَنْ أَشَارَ إِلَى أَخِيهِ بِحَدِيدَةٍ فَإِنَّ الْمَلائِكَةَ تَلْعَنُهُ وَإِنْ كَانَ أَخَاهُ لِأَبِيهِ وَأُمِّهِ» رَوَاهُ ابْنُ حِبَّانَ."},{"type":"p","text":"مِنْ مَعَاصِى الرِّجْلَيْنِ السِّعَايَةُ بِالْمُؤْمِنِ وَالْوِشَايَةُ بِهِ لِإِيذَائِهِ عِنْدَ الظَّلَمَةِ."},{"type":"p","text":"مِنْ مَعَاصِى الْبَدَنِ مُحَاكَاةُ الْمُؤْمِنِ اسْتِهْزَاءً بِهِ إِنْ كَانَ ذَلِكَ بِالْقَوْلِ أَوِ الْفِعْلِ أَوِ الإِشَارَةِ قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا لا يَسْخَرْ قَوْمٌ مِّنْ قَوْمٍ﴾ [سُورَةَ الْحُجُرَات/11] وَقَدْ تَكُونُ الْمُحَاكَاةُ بِالضَّحِكِ عَلَى كَلامِهِ إِذَا تَخَبَّطَ فِيهِ أَوْ غَلِطَ أَوْ عَلَى صَنْعَتِهِ وَقُبْحِ صُورَتِهِ. فَيَنْبَغِى عَلَى الْمُؤْمِنِ أَنْ يُحِبَّ أَخَاهُ الْمُؤْمِنَ وَأَنْ يَعْطِفَ عَلَيْهِ وَيُعِينَهُ. "},{"type":"p","text":"   قَالَ النَّبِىُّ ﷺ «مَثَلُ الْمُؤْمِنِينَ فِى تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى» رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ أَعْظَمُ حَقٍّ مِنْ حُقُوقِ اللَّهِ عَلَى الإِنْسَانِ."},{"type":"p","text":"     (2) اذْكُرْ بَعْضَ مَعَاصِى الْقَلْبِ."},{"type":"p","text":"     (3) اذْكُرْ بَعْضَ مَعَاصِى الْعَيْنِ."},{"type":"p","text":"     (4) اذْكُرْ بَعْضَ مَعَاصِى اللِّسَانِ."},{"type":"p","text":"     (5) اذْكُرْ بَعْضَ مَعَاصِى الْيَدَيْنِ."},{"type":"p","text":"     (6) اذْكُرْ بَعْضَ مَعَاصِى الرِّجْلَيْنِ."},{"type":"p","text":"     (7) اذْكُرْ بَعْضَ مَعَاصِى الْبَدَنِ."},{"type":"p","text":"     (8) اذْكُرْ حَدِيثًا فِى الْحَثِّ عَلَى مُعَامَلَةِ الْمُؤْمِنِينَ بِالإِحْسَانِ."}],"paragraphCount":217,"wordCount":3626,"readingMinutes":21,"description":"المحتوى الكامل لـ الأَخْلاقُ الإِسْلامِيَّةُ من الجزء الخامس، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الْخَامِسُ الأَخْلاقُ الإِسْلامِيَّةُ الأَخْلاقُ الإِسْلامِيَّةُ\nالدَّرْسُ الأَوَّلُ\nفَصْلُ\nالإِخْلاصُ فِى الْعِبَادَةِ وَالرِّيَاءُ وَالْعُجْبُ\n\nالإِخْلاصُ فِى الْعِبَادَةِ مِنْ أَعْمَالِ الْقُلُوبِ الْوَاجِبَةِ وَهُوَ مِنَ الأَخْلاقِ الْحَسَنَةِ.\nوَمَعْنَى الإِخْلاصِ فِى الْعِبَادَةِ إِخْلاصُ الْعَمَلِ بِالطَّاعَةِ لِلَّهِ تَعَالَى وَحْدَهُ أَىْ أَنْ لا يَقْصِدَ بِعَمَلِ الطَّاعَةِ مَحْمَدَةَ النَّاسِ وَالنَّظَرَ إِلَيْهِ بِعَيْنِ الِاحْتِرَامِ وَالتَّعْظِيمِ وَقَدْ جَعَلَ اللَّهُ تَعَالَى الإِخْلاصَ شَرْطًا لِقَبُولِ الأَعْمَالِ الصَّالِحَةِ. \nقَالَ اللَّهُ تَعَالَى ﴿فَمَنْ كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾ [سُورَةَ الْكَهْف/110].\nوَالْمُخْلِصُ هُوَ الَّذِى يَقُومُ بِأَعْمَالِ الطَّاعَةِ مِنْ صَلاةٍ وَصِيَامٍ وَحَجٍّ وَزَكَاةٍ وَقِرَاءَةٍ لِلْقُرْءَانِ وَغَيْرِهَا ابْتِغَاءَ الثَّوَابِ مِنَ اللَّهِ وَلَيْسَ لِأَنْ يَمْدَحَهُ النَّاسُ وَيَذْكُرُوهُ فَالْمُصَلِّى يَجِبُ أَنْ تَكُونَ نِيَّتُهُ خَالِصَةً لِلَّهِ تَعَالَى وَحْدَهُ فَقَطْ لا لِيَقُولَ عَنْهُ النَّاسُ فُلانٌ مُصَلٍ لا يَتْرُكُ الْفَرَائِضَ وَالصَّائِمُ يَجِبُ أَنْ يَكُونَ صِيَامُهُ لِلَّهِ تَعَالَى وَحْدَهُ فَقَطْ وَكَذَلِكَ الأَمْرُ بِالنِّسْبَةِ لِلْمُزَكِّى وَالْمُتَصَدِّقِ وَقَارِئِ الْقُرْءَانِ وَلِكُلِّ مَنْ أَرَادَ أَنْ يَعْمَلَ عَمَلَ بِرٍ وَإِحْسَانٍ قَالَ النَّبِىُّ ﷺ «إِنَّ اللَّهَ يُحِبُّ أَحَدُكُمْ إِذَا عَمِلَ عَمَلًا أَنْ يُتْقِنَهُ» قِيلَ وَمَا إِتْقَانُهُ يَا رَسُولَ اللَّهِ قَالَ «يُخْلِصُهُ مِنَ الرِّيَاءِ وَالْبِدْعَةِ» رَوَاهُ الْحَافِظُ السُّيُوطِىُّ.\nالرِّيَاءُ وَيُقَابِلُ الإِخْلاصَ \nالرِّيَاءُ وَمَعْنَاهُ أَنْ يَقْصِدَ الإِنْسَانُ بِأَعْمَالِ الْبِرِّ كَالصَّوْمِ وَالصَّلاةِ وَغَيْرِهِمَا مَدْحَ النَّاسِ وَإِجْلالَهُمْ لَهُ.\nوَالرِّيَاءُ يُحْبِطُ ثَوَابَ الْعَمَلِ الَّذِى قَارَنَهُ فَأَىُّ عَمَلٍ مِنْ أَعْمَالِ الْبِرِّ يَدْخُلُهُ الرِّيَاءُ لا ثَوَابَ فِيهِ سَوَاءٌ كَانَ مُجَرَّدَ قَصْدِهِ الرِّيَاءُ أَوْ قَرَنَ بِهِ قَصْدَ طَلَبِ الأَجْرِ مِنَ اللَّهِ تَعَالَى.\nالعُجْبُ بِطَاعَةِ اللَّهِ \nأَمَّا العُجْبُ بِطَاعَةِ اللَّهِ فَهُوَ شُهُودُ الْعِبَادَةِ صَادِرَةً مِنَ النَّفْسِ غَائِبًا عَنِ الْمِنَّةِ أَىْ أَنْ يَشْهَدَ الْعَبْدُ عِبَادَتَهُ مَحَاسِنَ أَعْمَالِهِ صَادِرَةً مِنْ نَفْسِهِ غَائِبًا عَنْ شُهُودِ أَنَّهَا نِعْمَةٌ مِنَ اللَّهِ عَلَيْهِ أَىْ أَنَّ اللَّهَ هُوَ الَّذِى تَفَضَّلَ عَلَيْهِ بِهَا فَأَقْدَرَهُ عَلَيْهَا وَأَلْهَمَهُ أَنْ يَقُومَ بِهَا.\nوَالرِّيَاءُ بِأَعْمَالِ الْبِرِّ وَالْعُجْبُ بِطَاعَةِ اللَّهِ مَعْصِيَتَانِ مِنْ مَعَاصِى الْقُلُوبِ وَخَصْلَتَانِ رَدِيئَتَانِ يَجِبُ عَلَى الْمُكَلَّفِ أَنْ يَجْتَنِبَهُمَا وَيَكُونَ مُخْلِصًا فِى عِبَادَتِهِ للَّهِ تَعَالَى حَتَّى يَنَالَ الثَّوَابَ.\n\n     أَسْئِلَةٌ\n     (1) مَا مَعْنَى الإِخْلاصِ فِى الْعِبَادَةِ.\n     (2) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَّ الإِخْلاصَ شَرْطٌ لِقَبُولِ الأَعْمَالِ الصَّالِحَةِ.\n     (3) مَنْ هُوَ الْمُخْلِصُ. \n     (4) اذْكُرْ حَدِيثًا فِى الْحَثِّ عَلَى الإِخْلاصِ وَتَرْكِ الرِّيَاءِ فِى الْعَمَلِ.\n     (5) مَا مَعْنَى الرِّيَاءِ وَإِذَا دَخَلَ الرِّيَاءُ فِى عَمَلِ الْبِرِّ مَا حُكْمُ الْعَمَلِ.\n     (6) مَا مَعْنَى الْعُجْبِ بِطَاعَةِ اللَّهِ تَعَالَى.\n\nالدَّرْسُ الثَّانِى\nالصَّبْرُ وَالرِّضَا عَنِ اللَّهِ\n\nقَالَ اللَّهُ تَعَالَى ﴿اسْتَعِينُوا بِالصَّبْرِ وَالصَّلاةِ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾ [سُورَةَ الْبَقَرَة/153].\nالصَّبْرُ مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ وَهُوَ حَبْسُ النَّفْسِ وَقَهْرُهَا عَلَى مَكْرُوهٍ تَتَحَمَّلُهُ أَوْ لَذِيذٍ تُفَارِقُهُ.\nوَالصَّبْرُ ثَلاثَةُ أَنْوَاعٍ\n   (1) الصَّبْرُ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ.\n   (2) وَالصَّبْرُ عَمَّا حَرَّمَ اللَّهُ.\n   (3) وَالصَّبْرُ عَلَى الْمَصَائِبِ.\nالصَّبْرُ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ أَىْ قَهْرُ النَّفْسِ عَلَى أَدَاءِ الْوَاجِبَاتِ الدِّيِنِيَّةِ الَّتِى فَرَضَهَا اللَّهُ كَإِقَامَةِ الصَّلاةِ فِى وَقْتِهَا وصِيَامِ شَهْرِ رَمَضَانَ وَحُضُورِ مَجَالِسِ الْعِلْمِ لِتَعَلُّمِ مَا فَرَضَ اللَّهُ تَعَلُّمَهُ مِنْ عِلْمِ الدِّينِ وَغَيْرِ ذَلِكَ مِنَ الْوَاجِبَاتِ.\nالصَّبْرُ عَمَّا حَرَّمَ اللَّهُ أَىْ كَفُّ النَّفْسِ عَنِ ارْتِكَابِ مَا حَرَّمَ اللَّهُ وَهَذَا يَحْتَاجُ إِلَى مُجَاهَدَةٍ كَبِيرَةٍ لِمَنْعِ النَّفْسِ وَكَبْحِهَا عَنِ ارْتِكَابِ الْمُحَرَّمَاتِ كَتَرْكِ الصَّلاةِ وَشُرْبِ الْخَمْرِ وَالسَّرِقَةِ وَغَيْرِ ذَلِكَ.\nالصَّبْرُ عَلَى الْمَصَائِبِ أَىْ عَلَى مَا يُزْعِجُ النَّفْسَ مِنْ أَلَمٍ أَوْ أَذًى أَوْ ضِيِقِ مَعِيشَةٍ أَوْ حُزْنٍ يَلْحَقُ الإِنْسَانَ بِسَبَبِ مُصِيبَةٍ لِأَنَّ الدُّنْيَا دَارُ بَلاءٍ وَاخْتِبَارٍ وَدَارُ عَمَلٍ وَالآخِرَةُ دَارُ حِسَابٍ قَالَ رَسُولُ اللَّهِ ﷺ «إِنَّ اللَّهَ عَزَّ وَجَلَّ يَقُولُ إِذَا ابْتَلَيْتُ عَبْدِى بِحَبِيبَتَيْهِ أَىْ عَيْنَيْهِ فَصَبَرَ عَوَّضْتُهُ مِنْهُمَا الْجَنَّةَ» رَوَاهُ الْبُخَارِىُّ.\nالرِّضَا عَنِ اللَّهِ بِمَعْنَى التَّسْلِيمِ لَهُ \nيَجِبُ عَلَى الْمُكَلَّفِ أَنْ لا يَعْتَرِضَ عَلَى اللَّهِ تَعَالَى وَأَنْ يَرْضَى بِقَضَائِهِ وَقَدَرِهِ وَالرِّضَا عَنِ اللَّهِ مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ وَمَعْنَاهُ التَّسْلِيمُ لَهُ تَبَارَكَ وَتَعَالَى فَإِنَّ كَثِيرًا مِنَ النَّاسِ يَقَعُونَ فِى الْمَعَاصِى بِتَرْكِهِمُ الصَّبْرَ عَلَى الْمَصَائِبِ.\nفَيَنْبَغِى عَلَى الْمُسْلِمِ أَنْ يَتَحَلَّى بِالصَّبْرِ وَيُعَوِّدَ نَفْسَهُ عَلَيْهِ وَيُسَلِّمَ أَمْرَهُ لِلَّهِ وَيَتَوَكَّلَ عَلَيْهِ فِى أُمُورِهِ كُلِّهَا.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً قُرْءَانِيَّةً تَدُلُّ عَلَى فَضْلِ الصَّبْرِ.\n     (2) مَا هُوَ الصَّبْرُ وَمِنْ أَىِّ الوَاجِبَاتِ هُوَ.\n     (3) عَدِّدْ أَنْوَاعَ الصَّبْرِ.\n     (4) مَا مَعْنَى الصَّبْرِ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ.\n     (5) مَا مَعْنَى الصَّبْرِ عَمَّا حَرَّمَ اللَّهُ.\n     (6) مَا مَعْنَى الصَّبْرِ عَلَى الْمَصَائِبِ.\n     (7) اذْكُرْ حَدِيثًا فِى بَيَانِ ثَوَابِ مَنْ صَبَرَ عَلَى فَقْدِ عَيْنَيْهِ.\n     (8) مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ الرِّضَا عَنِ اللَّهِ مَا مَعْنَى ذَلِكَ.\n\n\nالدَّرْسُ الثَّالِثُ\nمَحَبَّةُ اللَّهِ وَرَسُولِهِ\n\nالْمَحَبَّةُ وَالْبُغْضُ مِنْ أَعْمَالِ الْقُلُوبِ فَيَجِبُ عَلَى الْمُكَلَّفِ أَنْ يَسْتَعْمِلَهُمَا فِى مُوَافَقَةِ شَرْعِ اللَّهِ تَعَالَى فَيُحِبَّ اللَّهَ تَعَالَى وَمَا يُوَافِقُ شَرْعَهُ وَيُبْغِضَ الشَّيْطَانَ وَمَا يُوَسْوِسُ بِهِ مِنْ مَعَاصٍ.\n   (1) مَحَبَّةُ اللَّهِ وَرَسُولِهِ \nيَجِبُ عَلَى الْمُكَلَّفِ مَحَبَّةُ اللَّهِ تَعَالَى وَمَحَبَّةُ كَلامِهِ وَمَحَبَّةُ رَسُولِهِ ﷺ وَذَلِكَ بِاتِّبَاعِ أَوَامِرِ الشَّرْعِ وَاجْتِنَابِ نَوَاهِيهِ قَالَ اللَّهُ تَعَالَى ﴿قُلْ إِنْ كُنْتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِى يُحْبِبْكُمُ اللَّهُ﴾ [سُورَةَ ءَالِ عِمْرَان/31] وَهَذَا نَابِعٌ مِنَ الإِيـمَانِ بِاللَّهِ تَعَالَى وَبِمَا أَنْزَلَ وَبِتَصْدِيقِ رَسُولِهِ ﷺ وَمَا جَاءَ عَنْهُ.\nأَمَّا الشَّكُّ فِى اللَّهِ تَبَارَكَ وَتَعَالَى أَوْ فِى كَلامِهِ أَوْ فِى رَسُولِهِ ﷺ فَهُوَ مِنْ مَعَاصِى الْقَلْبِ وَهُوَ كُفْرٌ مُخْرِجٌ مِنْ مِلَّةِ الإِسْلامِ.\n   (2) مَحَبَّةُ الصَّحَابَةِ وَالآلِ وَالصَّالِحِينَ \nمِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ مَحَبَّةُ الصَّحَابَةِ وَالآلِ وَالصَّالِحِينَ، وَعَدَمُ مَحَبَّتِهِمْ مِنْ مَعَاصِى الْقُلُوبِ وَشَتْمُهُمْ وَسَبُّهُمْ مِنْ مَعَاصِى اللِّسَانِ بَلْ سَبُّ الصَّحَابَةِ جُمَلَةً كُفْرٌ. \nالصَّحَابَةُ هُمْ أَصْحَابُ رَسُولِ اللَّهِ ﷺ وَأَنْصَارُ دِينِ اللَّهِ تَعَالَى وَلا سِيَّمَا السَّابِقِينَ الأَوَّلِينَ مِنْهُمْ مِنَ الْمُهَاجِرِينَ وَالأَنْصَارِ، وَهُمْ أَىِ الصَّحَابَةُ مَنْ لَقُوهُ فِى حَيَاتِهِ ﷺ مَعَ الإِيـمَانِ بِهِ سَوَاءٌ طَالَتْ صُحْبَتُهُمْ لَهُ أَوْ لَمْ تَطُلْ وَمَاتَوا عَلَى ذَلِكَ أَىْ عَلَى الإِيـمَانِ بِهِ.\nالآلُ يُطْلَقُ عَلَى أَزْوَاجِ النَّبِىِّ ﷺ مِثْلُ خَدِيَجةَ وَعَائِشَةَ وَأَقْرِبَائِهِ الْمُؤْمِنِينَ مِثْلُ حَمْزَةَ وَالْعَبَّاسِ وَعَلِىٍّ وَالْحَسَنِ وَالْحُسَيْنِ وَأُمِهِمَا فَاطِمَةَ رَضِىَ اللَّهُ عَنْهُمْ أَجْمَعِينْ فَمَحَبَّتُهُمْ وَاجِبَةٌ لِمَا خُصُّوا بِهِ مِنَ الْفَضْلِ أَمَّا إِنْ أُرِيدَ بِالآلِ مُطْلَقُ أَتْبَاعِ النَّبِىِّ الأَتْقِيَاءِ فَتَجِبُ مَحَبَّتُهُمْ لِأَنَّهُمْ أَحْبَابُ اللَّهِ تَبَارَكَ وَتَعَالَى بِمَا لَهُمْ مِنَ الْقُرْبِ إِلَيْهِ بِطَاعَتِهِ الْكَامِلَةِ.\nالصَّالِحُونَ هُمُ الأَتْقِيَاءُ الَّذِينَ أَدَّوُا الْوَاجِبَاتِ وَاجْتَنَبُوا الْمُحَرَّمَاتِ وَمِنْهُمُ الْعُلَمَاءُ الْعَامِلُونَ وَكُلُّ وَلِىٍّ صَالِحٍ.\n   (3) بُغْضُ الشَّيْطَانِ وَالْمَعَاصِى \nكَذَلِكَ مِنْ أَعْمَالِ القُلُوبِ الْوَاجِبَةِ بُغْضُ الشَّيْطَانِ وَالْمَعَاصِى وَالنَّدَمُ عَلَيْهَا.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ بَعْضَ الأَشْيَاءِ الَّتِى يَجِبُ عَلَى الْعَبْدِ مَحَبَّتُهَا.\n     (2) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَّ عَلامَةَ حُبِّ اللَّهِ لِلْعَبْدِ صِدْقُ اتِّبَاعِهِ لِلنَّبِىِّ.\n     (3) مَنْ هُمُ الصَّحَابَةُ ولِمَ تَجِبُ مَحَبَّتُهُمْ وَعَلَى مَنْ يُطْلَقُ لَفْظُ الصَّحَابَةِ.\n     (4) مَنْ هُمُ الآلُ ولِمَ تَجِبُ مَحَبَّتُهُمْ.\n     (5) مَنْ هُمُ الصَّالِحُونَ.\n     (6) اذْكُرْ بَعْضَ مَا يَجِبُ عَلَى الْعَبْدِ بُغْضُهُ.\n\nالدَّرْسُ الرَّابِعُ\nالتَّكَبُّرُ وَالْحِقْدُ وَالْحَسَدُ\n\nالتَّكَبُّرُ وَالْحِقْدُ وَالْحَسَدُ مِنْ مَعَاصِى الْقَلْبِ وَهِىَ صِفَاتٌ مَذْمُومَةٌ تَخْفَى عَلَى كَثِيرٍ مِنَ النَّاسِ لِعَدَمِ تَعَلُّمِهِمْ مَا هِىَ وَكَيْفَ يَتَجَنَّبُونَهَا.\n   (1) التَّكَبُّرُ هُوَ رَدُّ الْحَقِّ عَلَى قَائِلِهِ وَاسْتِحْقَارُ النَّاسِ قَالَ النَّبِىُّ ﷺ «الْكِبْرُ بَطَرُ الْحَقِّ وَغَمْطُ النَّاسِ» رَوَاهُ مُسْلِمٌ، وَمَعْنَى بَطَرِ الْحَقِّ دَفْعُهُ وَرَدُّهُ عَلَى قَائِلِهِ وَمَعْنَى غَمْطِ النَّاسِ احْتِقَارُهُمْ. وَيُفْهَمُ مِنْ هَذَا الْحَدِيثِ أَنَّ التَّكَبُّرَ هُوَ رَدُّ الْحَقِّ عَلَى قَائِلِهِ مَعَ الْعِلْمِ بِأَنَّ الصَّوَابَ مَعَ الْقَائِلِ إِمَّا لِكَوْنِهِ صَغِيرًا أَوْ فَقِيرًا أَوْ تِلْمِيذًا أَوْ ضَعِيفًا، وَاسْتِحْقَارُ النَّاسِ أَىِ ازْدِرَاؤُهُمْ كَأَنْ يَتَكَبَّرَ عَلَى الْفَقِيرِ وَيَنْظُرَ إِلَيْهِ نَظَرَ احْتِقَارٍ أَوْ يُعْرِضَ عَنْهُ أَوْ يَتَرَفَّعَ عَلَيْهِ فِى الْخِطَابِ.\n   (2) الْحِقدُ هُوَ إِضْمَارُ الْعَدَاوَةِ لِلْمُسْلِمِ مَعَ الْعَمَلِ بِمُقْتَضَى ذَلِكَ وَعَدَمِ اسْتِشْعَارِ الْكَرَاهِيَةِ لِهَذَا الْعَمَلِ قَالَ النَّبِىُّ ﷺ «مَنْ أَرَادَ أَنْ يُزَحْزَحَ عَنِ النَّارِ وَيُدْخَلَ الْجَنَّةَ فَلْتَأْتِهِ مَنِيَّتُهُ وَهُوَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ وَلْيَأْتِ إِلَى النَّاسِ بِمَا يُحِبُّ أَنْ يُؤْتَى إِلَيْهِ» رَوَاهُ ابْنُ حِبَّانَ وَالْبَيْهَقِىُّ.\n   (3) الْحَسَدُ هُوَ أَنْ يَكْرَهَ الشَّخْصُ النِّعْمَةَ الَّتِى أَنْعَمَ اللَّهُ بِهَا عَلَى الْمُسْلِمِ دِينِيَّةً كَانَتْ أَوْ دُنْيَوِيَّةً وَتَمَنِّى زَوَالِهَا وَاسْتِثْقَالُهَا لَهُ وَإِنَّمَا يَكُونُ مَعْصِيَةً إِذَا عَمِلَ بِمُقْتَضَاهُ فَإِنْ كَرِهَهُ وَلَمْ يَعْمَلْ بِمُقْتَضَاهُ لَمْ يَكُنْ عَلَيْهِ ذَنْبٌ. وَمَعْنَى عَمِلَ بِمُقْتَضَاهُ كَأَنْ يَسْرِقَ مَالَهُ حَسَدًا أَوْ يُخَرِّبَ سَيَّارَتَهُ حَسَدًا.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ التَّكَبُّرُ.\n     (2) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى النَّهْىِ عَنِ التَّكَبُّرِ وَمَنْ رَوَاهُ.\n     (3) مَا مَعْنَى بَطَرِ الْحَقِّ وَمَا مَعْنَى غَمْطِ النَّاسِ.\n     (4) مَا مَعْنَى اسْتِحْقَارِ النَّاسِ.\n     (5) مَا هُوَ الْحِقْدُ. \n     (6) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى الْحَثِّ عَلَى حُسْنِ الْمُعَامَلَةِ للنَّاسِ.\n     (7) مَا هُوَ الْحَسَدُ وَمَتَى يَكُونُ مَعْصِيَةً.\n\nالدَّرْسُ الْخَامِسُ\nالْغِيبَةُ وَالْبُهْتَانُ وَالنَّمِيمَةُ\n\nقَالَ اللَّهُ تَعَالَى ﴿مَا يَلْفِظُ مِنْ قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌ﴾ [سُورَةَ ق/18].\nفِى هَذِهِ الآيَةِ بَيَانُ أَنَّ كُلَّ مَا يَتَلَفَّظُ بِهِ الإِنْسَانُ سَوَاءٌ كَانَ خَيْرًا أَوْ شَرًّا يَكْتُبُهُ مَلَكَانِ أَحَدُهُمَا رَقِيبٌ وَالآخَرُ عَتِيدٌ، وَالإِنْسَانُ الْعَاقِلُ يَنْبَغِى أَنْ يَحْفَظَ لِسَانَهُ عَنْ كُلِّ مَا هُوَ شَرٌّ وَمِنْ هَذَا الشَّرِّ الْغِيبَةُ وَالْبُهْتَانُ وَالنَّمِيمَةُ وَهِىَ مِنْ مَعَاصِى اللِّسَانِ وَمِنَ الْخِصَالِ الْمَذْمُومَةِ.\nثَبَتَ أَنَّ أَحَدَ الصَّحَابَةِ خَاطَبَ لِسَانَهُ وَقَالَ يَا لِسَانُ قُلْ خَيْرًا تَغْنَمْ وَاسْكُتْ عَنْ شَرٍّ تَسْلَمْ مِنْ قَبْلِ أَنْ تَنْدَمَ إِنِّى سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ «أَكْثَرُ خَطَايَا ابْنِ ءَادَمَ مِنْ لِسَانِهِ» رَوَاهُ الطَّبَرَانِىُّ.\n   (1) الْغِيبَةُ هِىَ ذِكْرُ الْمُسْلِمِ بِمَا فِيهِ مِمَّا يَكْرَهُ فِى غَيْبَتِهِ فَلَوْ كَانَ شَخْصٌ مُسْلِمٌ قَصِيرَ الْقَامَةِ فَقَالَ عَنْهُ شَخْصٌ فِى غَيْبَتِهِ فُلانٌ قَصِيرٌ وَكَانَ يَكْرَهُ أَنْ يُقَالَ عَنْهُ ذَلِكَ فَإِنَّ ذَلِكَ مِنَ الْغِيبَةِ الْمُحَرَّمَةِ الَّتِى نَهَى عَنْهَا رَسُولُ اللَّهِ ﷺ قَالَ اللَّهُ تَعَالَى ﴿وَلا يَغْتَبْ بَّعْضُكُمْ بَعْضًا﴾ [سُورَةَ الْحُجُرَات/12].\n   (2) الْبُهْتَانُ هُوَ ذِكْرُ الْمُسْلِمِ بِمَا لَيْسَ فِيهِ مِمَّا يَكْرَهُهُ وَإِثْمُهُ أَشَدُّ مِنْ إِثْمِ الْغِيبَةِ لِأَنَّهُ يَتَضَمَّنُ الْكَذِبَ قَالَ رَسُولَ اللَّهِ ﷺ مُخَاطِبًا بَعْضَ الصَّحَابَةِ «أَتَدْرُونَ مَا الْغِيبَةُ» قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ قَالَ «ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ» قِيلَ أَفَرَأْيَتَ إِنْ كَانَ فِى أَخِى مَا أَقُولُ قَالَ «إِنْ كَانَ فِيهِ مَا تَقُولُ فَقَدِ اغْتَبْتَهُ وَإِنْ لَمْ يَكُنْ فِيهِ فَقَدْ بَهَتَّهُ» رَوَاهُ مُسْلِمٌ، ومَنِ اسْتَمَعَ لِلْغِيبَةِ الْمُحَرَّمَةِ فَقَدْ وَقَعَ فِى مَعْصِيَةٍ مِنْ مَعَاصِى الأُذُنِ وَعَلَيْهِ النَّهْىُ عَنْ ذَلِكَ.\n   (3) النَّمِيمَةُ هِىَ نَقْلُ كَلامِ النَّاسِ بَعْضِهِمْ إِلَى بَعْضٍ عَلَى وَجْهِ الإِفْسَادِ بَيْنَهُمْ كَنَقْلِ الْكَلامِ لِلتَّفْرِيقِ بَيْنَ اثْنَيْنِ مُتَحَابَّيْنِ لِلإِفْسَادِ وَالْقَطِيعَةِ أَوِ الْعَدَاوَةِ بَيْنَهُمَا قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿هَمَّازٍ مَّشَّاءٍ بِنَمِيمٍ﴾ [سُورَةَ الْقَلَم/11] وَقَالَ رَسُولُ اللَّهِ ﷺ «لا يَدْخُلُ الْجَنَّةَ قَتَّاتٌ» رَوَاهُ الْبُخَارِىُّ، وَالْقَتَّاتُ هُوَ النَّمَّامُ أَىْ لا يَدْخُلُ الْجَنَّةَ مَعَ الأَوَّلِينَ بَلْ بَعْدَ أَنْ يَنَالَ الْعَذَابَ الَّذِى يَسْتَحِقُّ فِى نَارِ جَهَنَّمَ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ.\n\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً فِى الأَمْرِ بِحِفْظِ اللِّسَانِ.\n     (2) اذْكُرْ بَعْضَ مَا يَجِبُ حِفْظُ اللِّسَانِ عَنْهُ.\n     (3) اذْكُرْ مَا رُوِىَ عَنْ أَحَدِ الصَّحَابَةِ.\n     (4) مَا هِىَ الْغِيبَةُ أَعْطِ مِثَالًا.\n     (5) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى حُرْمَةِ الْغِيبَةِ.\n     (6) مَا هُوَ الْبُهْتَانُ وَمَا الدَّلِيلُ عَلَى حُرْمَتِهِ مِنْ حَدِيثِ رَسُولِ اللَّهِ.\n     (7) مَا هِىَ النَّمِيمَةُ وَمَا الدَّلِيلُ عَلَى حُرْمَتِهَا مِنَ الْقُرْءَانِ.\n     (8) أَيُّهُمَا أَشَدُّ إِثْمًا الْغِيبَةُ أَمِ الْبُهْتَانُ.\n     (9) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ النَّمِيمَةِ وَمَا مَعْنَاهُ.\n\nالدَّرْسُ السَّادِسُ\nالْكَذِبُ\n\nالْكَذِبُ مِنْ مَعَاصِى اللِّسَانِ وَهُوَ الإِخْبَارُ بِالشَّىْءِ عَلَى خِلافِ الْوَاقِعِ عَمْدًا أَىْ

َيْرِهِ وَشَرِّهِ\n\nقَالَ تَعَالَى ﴿إِنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾ [سُورَةَ الْقَمَرِ/49].\nوَقَالَ ﷺ «الإِيـمَانُ أَنْ تُؤْمِنَ بِاللَّهِ وَمَلائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الآخِرِ وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ» رَوَاهُ مُسْلِمٌ.\nقَدْ عَرَضْنَا فِى الدُّرُوسِ السَّابِقَةِ بَعْضَ الشُّرُوحِ لِمَا وَرَدَ فِى هَذَا الْحَدِيثِ وَهَذَا مِمَّا أَخْبَرَ عَنْهُ النَّبِىُّ ﷺ وَيَجِبُ التَّصْدِيقُ بِهِ.\nوَالإِيمَانُ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ مَعْنَاهُ الإِيـمَانُ بِأَنَّ كُلَّ مَا دَخَلَ فِى الْوُجُودِ مِنْ خَيْرٍ وَشَرٍّ هُوَ بِتَقْدِيرِ اللَّهِ الأَزَلِىِّ فَالْخَيْرُ مِنْ أَعْمَالِ الْعِبَادِ بِتَقْدِيرِ اللَّهِ وَمَحَبَّتِهِ وَرِضَاهُ، وَالشَّرُّ مِنْ أَعْمَالِ الْعِبَادِ بِتَقْدِيرِ اللَّهِ وَخَلْقِهِ وَعِلْمِهِ وَلَكِنْ لَيْسَ بِمَحَبَّتِهِ وَلا بِرِضَاهُ.\n   فَائِدَةٌ. قَالَ رَسُولُ اللَّهِ ﷺ لِابْنِ عَبَّاسٍ رَضِىَ اللَّهُ عَنْهُمَا «وَاعْلَمْ أَنَّ الأُمَّةَ لَوِ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوكَ بِشَىْءٍ لَمْ يَنْفَعُوكَ إِلَّا بِشَىْءٍ قَدْ كَتَبَهُ اللَّهُ لَكَ وَلَوِ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوكَ بِشَىْءٍ لَمْ يَضُرُّوكَ إِلَّا بِشَىْءٍ قَدْ كَتَبَهُ اللَّهُ عَلَيْكَ رُفِعَتِ الأَقْلامُ وَجَفَّتِ الصُّحُفُ» رَوَاهُ التِّرْمِذِىُّ وَقَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «كُلُّ شَىْءٍ بِقَدَرٍ حَتَى الْعَجْزُ وَالْكَيْسُ» رَوَاهُ مُسْلِمٌ، وَالْعَجْزُ هُوَ الْغَبَاءُ وَالْكَيْسُ الذَّكَاءُ.\n\n     أَسْئِلَةٌ\n   (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الإِيـمَانِ بِالْقَدَرِ.\n   (2) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ عَنِ الإِيـمَانِ بِالْقَدَرِ.\n   (3) مَا مَعْنَى الإِيـمَانِ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ.\n   (4) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ يَدُلُّ عَلَى أَنَّ اللَّهَ خَالِقُ النَّفْعِ وَالضَّرَرِ.\n   (5) اذْكُرْ حَدِيثًا نَبَوِيًّا يَدُلُّ عَلَى أَنَّ كُلَّ شَىْءٍ بِتَقْدِيرِ اللَّهِ.\n"},{"id":"part5-section2","partIndex":5,"partName":"الجزء الخامس","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الْخَامِسُ"],"title":"فَصْلُ الْعِبَادَاتِ","blocks":[{"type":"p","text":"فَصْلُ الْعِبَادَاتِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"حُكْمُ الشَّرْعِ الْمُتَعَلِّقِ بِأَفْعَالِ الْمُكَلَّفِينَ"},{"type":"p","text":""},{"type":"p","text":"الْحُكْمُ الشَّرْعِىُّ يَنْقَسِمُ إِلَى سَبْعَةِ أَقْسَامٍ"},{"type":"p","text":"الْوَاجِبُ وَالْمَنْدُوبُ وَالْحَرَامُ وَالْمَكْرُوهُ وَالْمُبَاحُ وَالصَّحِيحُ وَالْبَاطِلُ."},{"type":"p","text":"   (1) الْوَاجِبُ وَيُسَمَى الْفَرْضَ وَهُوَ مَا يُثَابُ فَاعِلُهُ وَيُعَاقَبُ تَارِكُهُ وَيَنْقَسِمُ إِلَى قِسْمَيْنِ فَرْضُ عَيْنٍ وَفَرْضُ كِفَايَةٍ."},{"type":"p","text":"فَرْضُ الْعَيْنِ هُوَ الْوَاجِبُ عَلَى كُلِّ مُكَلَّفٍ أَنْ يَتَعَلَّمَهُ أَوْ أَنْ يَتَعَلَّمَهُ وَيَفْعَلَهُ كَمَعْرِفَةِ اللَّهِ وَرَسُولِهِ وَأَدَاءِ الصَّلَوَاتِ الْخَمْسِ وَصَوْمِ رَمَضَانَ."},{"type":"p","text":"فَرْضُ الْكِفَايَةِ هُوَ مَا إِذَا قَامَ بِهِ الْبَعْضُ سَقَطَ بِفِعْلِهُمُ الْفَرْضُ عَنِ الآخَرِينَ كَصَلاةِ الْجَمَاعَةِ وَحِفْظِ الْقُرْءَانِ وَالْقِيَامِ بِالصَّنَائِعِ النَّافِعَةِ الَّتِى تَحْتَاجُهَا الأُمَّةُ وَغَيْرِ ذَلِكَ مِنْ فُرُوضِ الْكِفَايَةِ."},{"type":"p","text":"   (2) الْمَنْدُوبُ وَالسُّنَّةُ بِمَعْنًى وَاحِدٍ وَهُوَ مَا يُثَابُ فَاعِلُهُ وَلا يُعَاقَبُ تَارِكُهُ كَرَوَاتِبِ الصَّلَوَاتِ وَاسْتِعْمَالِ السِّوَاكِ وَنَحْوِ ذَلِكَ."},{"type":"p","text":"   (3) الْحَرَامُ هُوَ مَا يُثَابُ تَارِكُهُ إِنْ تَرَكَهُ امْتِثَالًا لِأَمْرِ اللَّهِ تَعَالَى وَيُعَاقَبُ فَاعِلُهُ كَشُرْبِ الْخَمْرِ وَأَكْلِ الرِّبَا وَالْكَذِبِ وَالسَّرِقَةِ وَعُقُوقِ الْوَالِدَيْنِ وَغَيْرِهَا مِنَ الْمُحَرَّمَاتِ كَشُرْبِ الدُّخَانِ لِمَنْ يَضُرُّهُ."},{"type":"p","text":"   (4) الْمَكْرُوهُ وَهُوَ مَا يُثَابُ تَارِكُهُ امْتِثَالًا وَلا يُعَاقَبُ فَاعِلُهُ كَالإِسْرَافِ بِمَاءِ الْوُضُوءِ أَوِ الغُسْلِ وَالأَكْلِ بِالْيَدِ الْيُسْرَى."},{"type":"p","text":"   (5) الْمُبَاحُ وَهُوَ مَا لا يُثَابُ فَاعِلُهُ ولا يُعَاقَبُ تَارِكُهُ كَالتَّوَسُّعِ فِى اللِّبَاسِ وَالطَّعَامِ بِشَرْطِ أَنْ يَكُونَ حَلالًا وَكَلُبْسِ الصُّوفِ بَدَلَ الْقُطْنِ وَأَكْلِ الْحِمَّصِ بَدَلَ الْفُولِ مَثَلًا وَنَحْوِ ذَلِكَ."},{"type":"p","text":"   (6) الصَّحِيحُ، الصَّحِيحُ مِنَ الْعِبَادَاتِ هُوَ مَا وَافَقَ شَرْعَ اللَّهِ فَاسْتَوْفَى الأَرْكَانَ وَالشُّرُوطَ."},{"type":"p","text":"   (7) الْبَاطِلُ وَيُقَالُ لَهُ الْفَاسِدُ وَهُوَ ضِدُّ الصَّحِيحِ أَىْ مَا لَمْ يَسْتَوْفِ الشُّرُوطَ وَالأَرْكَانَ. وَلَوِ اسْتَوْفَى الأَرْكَانَ وَالشُّرُوطَ وَطَرَأَ عَلَيْهِ مَا يُفْسِدُهُ يُعَدُّ فَاسِدًا أَيْضًا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) إِلَى كَمْ قِسْمٍ يَنْقَسِمُ الْحُكْمُ الْشَرْعِىُّ."},{"type":"p","text":"     (2) مَا هُوَ الْوَاجِبُ وَمَاذَا يُسَمَى أَيْضًا."},{"type":"p","text":"     (3) كَمْ قِسْمًا يَنْقَسِمُ الْوَاجِبُ."},{"type":"p","text":"     (4) مَا هُوَ فَرْضُ الْعَيْنِ أَعْطِ مِثَالًا."},{"type":"p","text":"     (5) مَا هُوَ فَرْضُ الْكِفَايَةِ أَعْطِ مِثَالًا."},{"type":"p","text":"     (6) مَا هُوَ الْمَنْدُوبُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (7) مَا هُوَ الْحَرَامُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (8) مَا هُوَ الْمَكْرُوهُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (9) مَا هُوَ الْمُبَاحُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (10) مَا هُوَ الصَّحِيحُ مِنَ الْعِبَادَاتِ."},{"type":"p","text":"     (11) مَا هُوَ الْبَاطِلُ وَمَاذَا يُقَالُ لَهُ أَيْضًا."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"الطَّهَارَةُ عَنِ النَّجَاسَةِ"},{"type":"p","text":""},{"type":"p","text":"النَّجَاسَةُ مِنْهَا الْبَوْلُ وَالْغَائِطُ وَالدَّمُ وَالْقَيْحُ وَالْقَىْءُ وَالْخَمْرَةُ وَالْمَيْتَةُ سِوَى السَّمَكِ وَالْجَرَادِ وَالآدَمِىِّ وَكَذَلِكَ عَظْمُهَا وَشَعْرُهَا."},{"type":"p","text":"وَتُقْسَمُ النَّجَاسَةُ إِلَى عَيْنِيَّةٍ وَحُكْمِيَّةٍ."},{"type":"p","text":"   (1) النَّجَاسَةُ الْعَيْنِيَّةُ هِىَ النَّجَاسَةُ الَّتِى لَهَا لَوْنٌ أَوْ طَعْمٌ أَوْ رِيحٌ أَوْ بَقِىَ جِرْمُهَا."},{"type":"p","text":"وَتَطْهُرُ النَّجَاسَةُ الْعَيْنِيَّةُ بِإِزَالَةِ عَيْنِهَا ثُمَّ بِصَبِّ الْمَاءِ الْمُطَهِّرِ عَلَى الْمَوْضِعِ الْمُتَنَجِّسِ فَإِذَا زَالَ اللَّوْنُ وَالطَّعْمُ وَالرِّيحُ أَصْبَحَ الْمَكَانُ طَاهِرًا."},{"type":"p","text":"   (2) النَّجَاسَةُ الْحُكْمِيَّةُ هِىَ النَّجَاسَةُ الَّتِى زَالَتْ عَيْنُهَا وَطَعْمُهَا وَلَوْنُهَا وَرِيحُهَا لَكِنَّهَا لَمْ تُغْسَلْ بِالْمَاءِ."},{"type":"p","text":"وَتُزَالُ النَّجَاسَةُ الْحُكْمِيَّةُ بِإِجْرَاءِ الْمَاءِ الْمُطَهِّرِ عَلَيْهَا فَلَوْ وَقَعَ بَوْلٌ عَلَى مَكَانٍ ثُمَّ جَفَّ فَذَهَبَتْ عَيْنُهُ وَانْقَطَعَ لَوْنُهُ وَرِيحُهُ وَطَعْمُهُ فَإِنَّهُ يَكْفِى صَبُّ الْمَاءِ عَلَى هَذَا الْمَكَانِ لِيَطْهُرَ عَنِ النَّجَاسَةِ."},{"type":"p","text":"ثُمَّ إِنْ كَانَتِ النَّجَاسَةُ نَجَاسَةً كَلْبِيَّةً أَوْ خِنْزِيرِيَّةً كَأَنْ مَسَّ شَخْصٌ بِيَدهِ الْمُبْتَلَّةِ كَلْبًا أَوْ خِنْزِيرًا أَوْ أَصَابَ رِيقُ الْكَلْبِ أَوِ الْخِنْزِيرِ شَيْئًا مِنْ جِسْمِهِ أَوْ ثَوْبِهِ فَتُزَالُ هَذِهِ النَّجَاسَةُ بِغَسْلِهَا سَبْعَ مَرَّاتٍ إِحْدَاهُنَّ مَمْزُوجَةٌ بِالتُّرَابِ الطَّهُورِ."},{"type":"p","text":"فَائِدَةٌ. الْحَيَوَانَاتُ وَهِىَ حَيَّةٌ كُلُّهَا طَاهِرَةٌ إِلَّا الْكَلْبَ وَالِخنْزِيرَ وَمَا تَوَلَّدَ مِنْهُمَا أَوْ مِنْ أَحَدِهِمَا.  "},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ بَعْضَ الأَمْثِلَةِ عَنِ النَّجَاسَةِ."},{"type":"p","text":"     (2) إِلَى كَمْ قِسْمٍ تُقْسَمُ النَّجَاسَةُ وَمَا هِىَ النَّجَاسَةُ الْعَيْنِيَّةُ."},{"type":"p","text":"     (3) كَيْفَ تَطْهُرُ النَّجَاسَةُ الْعَيْنِيَّةُ."},{"type":"p","text":"     (4) مَا هِىَ النَّجَاسَةُ الْحُكْمِيَّةُ وَكَيْفَ تُزَالُ."},{"type":"p","text":"     (5) كَيْفَ تُزَالُ النَّجَاسَةُ الْكَلْبِيَّةُ أَوِ الْخِنْزِيرِيَّةُ."},{"type":"p","text":"     (6) أَىُّ الْحَيَوَانَاتِ نَجِسَةٌ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"الْوُضُوءُ الْفَرَائِضُ وَالسُّنَنُ"},{"type":"p","text":""},{"type":"p","text":"الْوُضُوءُ شَرْطٌ مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ لِقَوْلِهِ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُؤُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ﴾ [سُورَةَ الْمَائِدَة/6]. "},{"type":"p","text":"وَلِلْوُضُوءِ فُرُوضٌ وَسُنَنٌ وَمُبْطِلاتٌ."},{"type":"p","text":"فُرُوضُ الوُضُوءِ"},{"type":"p","text":"لِلْوُضُوءِ سِتَّةُ فُرُوضٍ لا يَصِحُّ بِدُونِ وَاحِدٍ مِنْهَا وَهِىَ"},{"type":"p","text":"   (1) النِّيَّةُ وَمَكَانُهَا الْقَلْبُ وَتَكُونُ مُقْتَرِنَةً بِغَسْلِ الْوَجْهِ فَيَقُولُ بِقَلْبِهِ نَوَيْتُ الْوُضُوءَ مَثَلًا."},{"type":"p","text":"   (2) غَسْلُ الْوَجْهِ جَمِيعِهِ مِنْ مَنَابِتِ شَعَرِ الرَّأْسِ إِلَى الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ."},{"type":"p","text":"   (3) غَسْلُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ وَالْمِرْفَقُ هُوَ مُجْتَمَعُ عَظْمَىِ السَّاعِدِ وَالْعَضُدِ."},{"type":"p","text":"   (4) مَسْحُ الرَّأْسِ أَوْ بَعْضِهِ فَيَكْفِى مَسْحُ بَعْضِ الرَّأْسِ."},{"type":"p","text":"   (5) غَسْلُ الرِّجْلَيْنِ مَعَ الْكَعْبَيْنِ وَالْكَعْبَانِ هُمَا الْعَظْمَانِ النَّاتِئَانِ عِنْدَ مِفْصَلِ السَّاقِ وَالْقَدَمِ."},{"type":"p","text":"   (6) التَّرْتِيبُ أَىْ تَرْتِيبُ الْفَرَائِضِ كَمَا وَرَدَتْ بِحَيْثُ تَكُونُ النِّيَّةُ عِنْدَ غَسْلِ الْوَجْهِ أَوَلًا ثُمَّ غَسْلُ الْوَجْهِ ثُمَّ الْيَدَيْنِ ثُمَّ مَسْحُ بَعْضِ الرَّأْسِ ثُمَّ غَسْلُ الرِّجْلَيْنِ."},{"type":"p","text":"سُنَنُ الْوضُوءِ"},{"type":"p","text":"وَهِىَ أَفْعَالٌ يَصِحُّ الْوُضُوءُ بِدُونِهَا وَلَكِنْ يَفُوتُ ثَوَابُهَا فَمَنْ تَرَكَ سُنَّةً مِنْ سُنَنِ الْوُضُوءِ صَحَّ وُضُوؤُهُ أَمَا مَنْ تَرَكَ فَرْضًا مِنْ فُرُوضِ الْوُضُوءِ فَلا يَصِحُّ وُضُوؤُهُ."},{"type":"p","text":"فَمِنْ سُنَنِ الْوُضُوءِ"},{"type":"p","text":"   (1) التَّسْمِيَةُ أَىْ قَوْلُ بِسْمِ اللَّهِ."},{"type":"p","text":"   (2) غَسْلُ الْكَفَّيْنِ إِلَى الْكُوعَيْنِ."},{"type":"p","text":"   (3) اسْتِعْمَالُ السِّوَاكِ."},{"type":"p","text":"   (4) الْمَضْمَضَةُ أَىْ إِجْرَاءُ الْمَاءِ فِى الْفَمِ."},{"type":"p","text":"   (5) الِاسْتِنْشَاقُ أَىْ إِدْخَالُ الْمَاءِ إِلَى دَاخِلِ الأَنْفِ."},{"type":"p","text":"   (6) مَسْحُ جَمِيعِ الرَّأْسِ."},{"type":"p","text":"   (7) مَسْحُ الأُذُنَيْنِ ظَاهِرِهِمَا وَبَاطِنِهِمَا بِمَاءٍ جَدِيدٍ."},{"type":"p","text":"   (8) تَخْلِيلُ أَصَابِعِ الْيَدَيْنِ وَالرِّجْلَيْنِ وَاللِّحْيَةِ الْكَثِيفَةِ."},{"type":"p","text":"   (9) الْبَدْءُ بِالْيُمْنَى قَبْلَ الْيُسْرَى."},{"type":"p","text":"   (10) التَّثْلِيثُ أَىْ غَسْلُ مَا يُغْسَلُ ثَلاثَ مَرَّاتٍ وَمَسْحُ مَا يُمْسَحُ ثَلاثَ مَرَّاتٍ."},{"type":"p","text":"   (11) دَلْكُ الأَعْضَاءِ أَىْ إِمْرَارُ الْيَدِ عَلَى الْعُضْوِ الْمَغْسُولِ."},{"type":"p","text":"   (12) الْمُوَالاةُ أَىْ غَسْلُ الْعُضْوِ قَبْلَ أَنْ يَجِفَّ الْمَاءُ عَنِ الْعُضْوِ الَّذِى قَبْلَهُ."},{"type":"p","text":"   (13) اسْتِدَامَةُ النِّيَّةِ مِنْ أَوَّلِ الْعَمَلِ إِلَى ءَاخِرِهِ."},{"type":"p","text":"   (14) التَّقْلِيلُ فِى مَاءِ الْوُضُوءِ كَمُدٍّ."},{"type":"p","text":"   (15) الغُرُّ وَهُوَ الزِّيَادَةُ فِى غَسْلِ الْوَجْهِ عَلَى الْمَفْرُوضِ غَسْلُهُ مِنْ جَمِيعِ جَوَانِبِهِ. "},{"type":"p","text":"   (16) وَالتَّحْجِيلُ وَهُوَ الزِّيَادَةُ فِى غَسْلِ الْيَدَيْنِ والرِّجْلَيْنِ عَلَى الْمَفْرُوضِ غَسْلُهُ. "},{"type":"p","text":"   (17) وَيُسَنُّ أَنْ يَقُولَ بَعْدَ الِانْتِهَاءِ مِنَ الْوُضُوءِ أَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ اللَّهُمَّ اجْعَلْنِى مِنَ التَّوَّابِينَ وَاجْعَلْنِى مِنَ الْمُتَطَهِّرِينَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) ما هِىَ الآيَةُ الَّتِى تَدُلُّ عَلَى فَرْضِيَّةِ الْوُضُوءِ."},{"type":"p","text":"     (2) كَمْ هِىَ فُرُوضُ الْوُضُوءِ عَدِّدْهَا."},{"type":"p","text":"     (3) أَيْنَ مَحَلُّ النِّيَّةِ وَمَتَى يَنْوِى الْوُضُوءَ."},{"type":"p","text":"     (4) مَا هِىَ حُدُودُ الْوَجْهِ فِى الْوُضُوءِ."},{"type":"p","text":"     (5) مَا هُوَ الْوَاجِبُ غَسْلُهُ فِى الْوُضُوءِ مِنَ الْيَدَيْنِ وَمَا هُوَ الْمِرْفَقُ."},{"type":"p","text":"     (6) مَا هُوَ الْقَدْرُ الْوَاجِبُ فِى مَسْحِ الرَّأْسِ."},{"type":"p","text":"     (7) مَا هُوَ الْوَاجِبُ فِى غَسْلِ الرِّجْلَيْنِ وَمَا هُمَا الْكَعْبَانِ."},{"type":"p","text":"     (8) مَا مَعْنَى التَّرْتِيبِ فِى الْوُضُوءِ."},{"type":"p","text":"     (9) عَدِّدْ بَعْضَ سُنَنِ الْوُضُوءِ."},{"type":"p","text":"     (10) مَا مَعْنَى التَّسْمِيَةِ وَالْمَضْمَضَةِ."},{"type":"p","text":"     (11) مَا مَعْنَى التَّثْلِيثِ وَالْمُوَالاةِ."},{"type":"p","text":"     (12) مَا هُوَ الغُرُّ وَالتَّحْجِيلُ."},{"type":"p","text":"     (13) مَاذَا يُسَنُّ أَنْ يَقُولَ الشَّخْصُ بَعْدَ الِانْتِهَاءِ مِنَ الْوُضُوءِ."},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"مُبْطِلاتُ الْوُضُوءِ"},{"type":"p","text":""},{"type":"p","text":"مُبْطِلاتُ الْوُضُوءِ هِىَ الأُمُورُ الَّتِى إِذَا حَصَلَتْ لِلْمُتَوَضِّئِ يَنْتَقِضُ وُضُوؤُهُ وَلا يَصِحُّ أَنْ يُصَلِّىَ إِلَّا بَعْدَ أَنْ يَتَوَضَّأَ وُضُوءًا جَدِيدًا وَهِىَ "},{"type":"p","text":"خُرُوجُ شَىْءٍ مِنْ أَحَدِ السَّبِيلَيْنِ أَىِ الْقُبُلِ أَوِ الدُّبُرِ كَخُرُوجِ الْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ أَوِ الْحَصَى أَوِ الدُّودِ أَوِ غَيْرِ ذَلِكَ."},{"type":"p","text":"وَمَسُّ الْقُبُلِ أَوِ الدُّبُرِ بِبَطْنِ الْكَفِّ بِلا حَائِلٍ."},{"type":"p","text":"وَلَمْسُ بَشَرَةِ الأَجْنَبِيَّةِ الَّتِى تُشْتَهَى بِلا حَائِلٍ."},{"type":"p","text":"وَزَوَالُ الْعَقْلِ بِجُنُونٍ أَوْ إِغمَاءٍ أَوْ سُكْرٍ."},{"type":"p","text":"وَالنَّوْمُ عَلَى غَيْرِ هَيْئَةِ الْمُتَمَكِّنِ فَمَنْ نَامَ مُمَكِّنًا مَقْعَدَتَهُ بِحَيْثُ لا يَكُونُ بَيْنَ دُبُرِهِ وَبَيْنَ الأَرْضِ تَجَافٍ لا يَنْتَقِضُ وُضُوؤُهُ."},{"type":"p","text":"مَاذَا يَحْرُمُ عَلَى مَنِ انْتَقَضَ وُضُوؤُهُ"},{"type":"p","text":"مَنِ انْتَقَضَ وُضُوؤُهُ تَحْرُمُ عَلَيْهِ الصَّلاةُ صَلاةُ الْفَرْضِ وَالسُّنَّةِ وَالطَّوَافُ بِالْبَيْتِ إِنْ كَانَ طَوَافَ الْفَرْضِ أَوْ طَوَافَ التَّطَوُّعِ لِأَنَ الطَّوَافَ بِمَنْزِلَةِ الصَّلاةِ إِلَّا أَنَّهُ يَحِلُّ فِيهِ كَلامُ النَّاسِ."},{"type":"p","text":"وَيَحْرُمُ أَيْضًا عَلَى مَنِ انْتَقَضَ وُضُوؤُهُ حَمْلُ الْمُصْحَفِ وَكَذَلِكَ مَسُّهُ أَىْ مَسُّ وَرَقِهِ وَجِلْدِهِ الْمُتَّصِلِ بِهِ إِلَّا لِضَرُورَةٍ."},{"type":"p","text":"وَيَجوُزُ لِمَنِ انْتَقَضَ وُضُوؤُهُ قِرَاءَةُ الْقُرْءَانِ وَدُخُولُ الْمَسْجِدِ وَالْمُكْثُ فِيهِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَنِ انْتَقَضَ وُضُوؤُهُ مَتَى يَصِحُّ أَنْ يُصَلِّىَ."},{"type":"p","text":"     (2) مَا هِىَ مُبْطِلاتُ الْوُضُوءِ عَدِّدْهَا."},{"type":"p","text":"     (3) مَا مَعْنَى السَّبِيلَيْنِ."},{"type":"p","text":"     (4) مَاذَا يَحرُمُ عَلَى مَنِ انْتَقَضَ وُضُوؤُهُ."},{"type":"p","text":"     (5) اذْكُرْ بَعْضَ مَا يَجُوزُ لِلْمُحْدِثِ فِعْلُهُ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"الِاسْتِنْجَاءُ"},{"type":"p","text":""},{"type":"p","text":"يَجِبُ الِاسْتِنْجَاءُ مِنْ كُلِّ نَجِسٍ رَطْبٍ خَارِجٍ مِنَ السَّبِيلَيْنِ كَالْبَوْلِ وَالْغَائِطِ."},{"type":"p","text":"وَالِاسْتِنْجَاءُ يَكُونُ بِالْمَاءِ الْمُطَهِّرِ أَوْ بِالْقَالِعِ الطَّاهِرِ الْجَامِدِ غَيْرِ الْمُحْتَرَمِ كَالْحَجَرِ أَوِ الْوَرَقِ."},{"type":"p","text":"الِاسْتِنْجَاءُ بِالْمَاءِ: يَصُبُّ الْمُسْتَنْجِى مِنَ الْغَائِطِ الْمَاءَ الْمُطَهِّرَ عَلَى مَخْرَجِ النَّجَاسَةِ وَيَدْلُكُ بِيَدِهِ الْيُسْرَى حَتَّى تَزُولَ النَّجَاسَةُ عَنِ الْمَخْرَجِ وَيَطْهُرَ الْمَحَلُّ."},{"type":"p","text":"الِاسْتِنْجَاءُ بِالأَحْجَارِ: أَمَا لَوْ أَرَادَ اسْتِعْمَالَ الْقَالِعِ الطَّاهِرِ الْجَامِدِ غَيْرِ الْمُحْتَرَمِ كَالْحَجَرِ فَيَمْسَحُ الْمَخْرَجَ بِهِ ثَلاثَ مَسَحَاتٍ فإِنْ بَقِيَتِ النَّجَاسَةُ يَمْسَحُ مَرَّةً رَابِعَةً أَوْ أَكْثَرَ حَتَى يَنْقَى الْمَحَلُّ أَوْ يَمْسَحُ بِثَلاثِ وَرَقَاتٍ (مَنَادِيلَ وَرَقِيَّةٍ مَثَلًا) ثَلاثَ مَسَحَاتٍ أَوْ أَكْثَرَ حَتَى يَنْقَى الْمَحَلُّ وَلا يَكْفِى لِلِاسْتِنْجَاءِ بِغَيْرِ الْمَاءِ الْمَسْحُ مَرَّةً وَاحِدَةً حَتَى لَوْ حَصَلَ الإِنْقَاءُ."},{"type":"p","text":"وَيُشْتَرَطُ لِلِاسْتِنْجَاءِ بِغَيْرِ الْمَاءِ أَنْ يَكُونَ"},{"type":"p","text":"   (1) قَبْلَ الْجَفَافِ فَلَوْ جَفَّ الْخَارِجُ وَجَبَ اسْتِعْمَالُ الْمَاءِ."},{"type":"p","text":"   (2) وَقَبْلَ الِانْتِقَالِ فَلَوِ انْتَشَرَ الْخَارِجُ وَتَوَسَّعَ عَنِ الْمَوْضِعِ الَّذِى اسْتَقَرَّ فِيهِ وَجَبَ اسْتِعْمَالُ الْمَاءِ."},{"type":"p","text":"وَيُسَنُّ الدُّخُولَ إِلَى الْخَلاءِ بِالرِّجْلِ الْيُسْرَى وَالْخُرُوجَ مِنْهُ بِالْيُمْنَى بِعَكْسِ الْمَسْجِدِ فَالْمَسْجِدُ يُسَنُّ دُخُولُهُ بِالرِّجْلِ الْيُمْنَى وَالْخُرُوجُ مِنْهُ بِالرِّجْلِ الْيُسْرَى."},{"type":"p","text":""},{"type":"p","text":"دُعَـاءٌ"},{"type":"p","text":"يُسَنُّ لِدَاخِلِ الْخَلاءِ أَنْ يَقُولَ «بِسْمِ اللَّهِ اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ الْخُبْثِ وَالْخَبَائِثِ» وَالْبَسْمَلَةُ سِتْرٌ لَهُ عَنْ أَعْيُنِ الْجِنِّ، وَيُسَنُّ أَنْ يَقُولَ إِذَا خَرَجَ «غُفْرَانَكَ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى»."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مِمَّ يَجِبُ الِاسْتِنْجَاءُ."},{"type":"p","text":"     (2) بِمَ يَكُونُ الِاسْتِنْجَاءُ."},{"type":"p","text":"     (3) كَيْفَ يَسْتَنْجِى الشَّخْصُ مِنَ الْغَائِطِ بِالْمَاءِ."},{"type":"p","text":"     (4) كَيْفَ يَسْتَنْجِى الشَّخْصُ بِالأَحْجَارِ."},{"type":"p","text":"     (5) إِنْ مَسَحَ ثَلاثَ مَسَحَاتِ وَبَقِيَتِ النَّجَاسَةُ مَاذَا يَفْعَلُ."},{"type":"p","text":"     (6) هَلْ يَكْفِى لِلِاسْتِنْجَاءِ بِغَيْرِ الْمَاءِ أَنْ يَمْسَحَ مَسْحَةً وَاحِدَةً."},{"type":"p","text":"     (7) إِذَا جَفَّ الْخَارِجُ عَلَى الْمَخْرَجِ هَلْ يَكْفِى الِاسْتِنْجَاءُ بِالْمَاءِ."},{"type":"p","text":"     (8) بِأَىِّ رِجْلٍ يُسَنُّ الدُّخُولُ إِلَى الْخَلاءِ وَبِأَىِّ رِجْلٍ يُسَنُّ الْخُرُوجُ مِنْهُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"الْحَدَثُ وَالْغُسْلُ الْوَاجِبُ"},{"type":"p","text":""},{"type":"p","text":"الْحَدَثُ نَوْعَانِ حَدَثٌ أَصْغَرُ وَحَدَثٌ أَكْبَرُ."},{"type":"p","text":"الْحَدَثُ الأَصْغَرُ هُوَ حُصُولُ أَحَدِ الأَشْيَاءِ الَّتِى تَنْقُضُ الْوُضُوءَ كَخُرُوجِ الرِّيحِ أَوِ الْبَوْلِ أَوِ الْغَائِطِ أَوْ غَيْرِهَا مِنْ مُبْطِلاتِ الْوُضُوءِ."},{"type":"p","text":"الْحَدَثُ الأَكْبَرُ وَهُوَ حُصُولُ أَحَدِ الأَشْيَاءِ الَّتِى تُوجِبُ الْغُسْلَ وَهِىَ خَمْسَةٌ خُرُوجُ الْمَنِىِّ وَالْجِمَاعُ وَالْحَيْضُ وَالنِّفَاسُ وَالْوِلادَةُ."},{"type":"p","text":"وَتَتِمُّ الطَّهَارَةُ مِنَ الْحَدَثِ الأَكْبَرِ بِالْغُسْلِ وَلَهُ فُرُوضٌ وَسُنَنٌ."},{"type":"p","text":"   فُرُوضُ الْغُسْلِ اثْنَانِ"},{"type":"p","text":"   (1) النِّيَّةُ عِنْدَ غَسْلِ أَوَّلِ جُزْءٍ مِنَ الْبَدَنِ كَأَنْ يَقُولَ بِقَلْبِهِ نَوَيْتُ الْغُسْلَ الْوَاجِبَ أَوْ نَوَيْتُ فَرْضَ الْغُسْلِ أَوْ نَوَيْتُ رَفْعَ الْحَدَثِ الأَكْبَرِ."},{"type":"p","text":"   (2) وَتَعْمِيمُ جَمِيعِ الْبَدَنِ بِالْمَاءِ بَشَرًا وَشَعَرًا وَإِنْ كَثُفَ وَالْبَشَرُ هُوَ الْجِلْدُ وَيَجِبُ حَلُّ الضَّفَائِرِ الَّتِى لا يَصِلُ الْمَاءُ إِلَى بِاطِنِهَا إِلَّا بِحَلِّهَا."},{"type":"p","text":"   سُنَنُ الْغُسْلِ وَهِىَ كَثِيرَةٌ مِنْهَا"},{"type":"p","text":"   (1) التَّسْمِيَةُ أَىْ قَوْلُ بِسْمِ اللَّهِ عِنْدَ بَدْءِ الْغُسْلِ."},{"type":"p","text":"   (2) وَالْوُضُوءُ قَبْلَ الْغُسْلِ."},{"type":"p","text":"   (3) وَالدَّلْكُ."},{"type":"p","text":"   (4) وَالتَّيَامُنُ أَىِ الْبَدْءُ بِالشِّقِ الأَيْمَنِ."},{"type":"p","text":"   (5) وَالتَّثْلِيثُ."},{"type":"p","text":"   (6) وَالْمُوَالاةُ."},{"type":"p","text":"   (7) وَتَعَهُّدُ الْمَعَاطِفِ كَمَعَاطِفِ الأُذُنَيْنِ."},{"type":"p","text":"   الِاغْتِسَالاتُ الْمَسْنُونَةُ وَهِىَ الِاغْتِسَالاتُ الَّتِى يُثَابُ فَاعِلُهَا وَلا يُعَاقَبُ تَارِكُهَا وَمِنْهَا"},{"type":"p","text":"غُسْلُ الْجُمُعَةِ وَهُوَ ءَاكَدُهَا."},{"type":"p","text":"وَغُسْلُ الْعِيدَيْنِ الْفِطْرِ وَالأَضْحَى."},{"type":"p","text":"وَالْغُسْلُ مِنْ غَسْلِ الْمَيِّتِ."},{"type":"p","text":"وَالْغُسْلُ لِلْمَجْنُونِ وَالْمُغْمَى عَلَيْهِ إِذَا أَفَاقَا."},{"type":"p","text":"وَالْغُسْلُ لِلإِحْرَامِ بِالْحَجِّ أَوِ الْعُمْرَةِ."},{"type":"p","text":"وَالْغُسْلُ لِدُخُولِ مَكَّةَ وَالْوُقُوفِ بِعَرَفَةَ وَالْمَبِيتِ بِمُزْدَلِفَةَ وَلِلطَّوَافِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) كَمْ نَوْعًا الْحَدَثُ."},{"type":"p","text":"     (2) مَا هُوَ الْحَدَثُ الأَصْغَرُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (3) مَا هُوَ الْحَدَثُ الأَكْبَرُ."},{"type":"p","text":"     (4) مَا هِىَ الأُمُورُ الَّتِى تُوجِبُ الْغُسْلَ."},{"type":"p","text":"     (5) كَيْفَ تَتِمُّ الطَّهَارَةُ مِنَ الْحَدَثِ الأَصْغَرِ وَمِنَ الْحَدَثِ الأَكْبَرِ."},{"type":"p","text":"     (6) مَا هِىَ فُرُوضُ الْغُسْلِ."},{"type":"p","text":"     (7) مَتَى يَجِبُ حَلُّ الْضَّفَائِرِ."},{"type":"p","text":"     (8) اذْكُرْ بَعْضَ سُنَنِ الْغُسْلِ."},{"type":"p","text":"     (9) مَا هِىَ الِاغْتِسَالاتُ الْمَسْنُونَةُ اذْكُرْ بَعْضَهَا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"مَوَاقِيتُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الصَّلاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا﴾ [سُورَةَ النِّسَاء/103] الصَّلاةُ هِىَ أَفْضَلُ الأَعْمَالِ بَعْدَ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ وَقَدْ فَرَضَ اللَّهُ عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ خَمْسَ صَلَوَاتٍ فِى الْيَوْمِ وَاللَّيْلَةِ فَعَلَيْهِ أَنْ يُحَافِظَ عَلَيْهَا وَيَتَعَلَّمَ كَيْفَ يَدْخُلُ وَقْتُ كُلٍّ مِنْهَا وَكَيْفَ يَخْرُجُ. وَالصَّلَوَاتُ الْخَمْسُ مَعَ أَوْقَاتِهَا هِىَ "},{"type":"p","text":"   (1) صَلاةُ الظُّهْرِ وَيَبْدَأُ وَقْتُهَا مِنْ مَيْلِ الشَّمْسِ عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ وَيَنْتَهِى إِذَا صَارَ ظِلُّ الشَّىْءِ مِثْلَهُ زِيَادَةً عَلَى ظِلِّ الِاسْتِوَاءِ. وَالْمَقْصُودُ بِالشَّىْءِ مَا كَانَ كَالْوَتَدِ الْمَغْرُوسِ بِشَكْلٍ مُسْتَقِيمٍ فِى الأَرْضِ الْمُسْتَوِيَةِ، وَظِلُّ الِاسْتِوَاءِ هُوَ ظِلُّ الشَّىْءِ عِنْدَمَا تَكُونُ الشَّمْسُ فِى وَسَطِ السَّمَاءِ فَإِذَا وَقَفَ شَخْصٌ فِى مَكَانٍ مُشْمِسٍ وَالشَّمْسُ فِى وَسَطِ السَّمَاءِ يُلاحِظُ أَنَّ لَهُ ظِلًّا فَهَذَا الظِّلُّ هُوَ ظِلُّ الِاسْتِوَاءِ فإِذَا مَالَتِ الشَّمْسُ إِلَى جِهَةِ الْمَغْرِبِ يُلاحِظُ أَنَّ ظِلَّهُ يَطُولُ وَيَتَحَوَّلُ إِلَى جِهَةِ الْمَشْرِقِ وَهَذِهِ عَلامَةٌ عَلَى دُخُولِ وَقْتِ الظُّهْرِ."},{"type":"p","text":"   (2) صَلاةُ الْعَصْرِ وَيَبْدَأُ وَقْتُهَا مِنْ بَعْدِ وَقْتِ الظُّهْرِ وَيَنْتَهِى إِذَا غَرَبَتِ الشَّمْسُ، فَإِذَا صَارَ طُولُ ظِلِّ الشَّىْءِ مِثْلَهُ زِيَادَةً عَلَى ظِلِّ الِاسْتِوَاءِ يَكُونُ قَدْ دَخَلَ وَقْتُ الْعَصْرِ وَانْتَهَى وَقْتُ الظُّهْرِ."},{"type":"p","text":"   (3) صَلاةُ الْمَغْرِبِ وَيَبْدَأُ وَقْتُهَا مِنْ غُرُوبِ الشَّمْسِ أَىْ مَغِيبِ قُرْصِ الشَّمْسِ كُلِّهِ وَيَنْتَهِى بِمَغِيبِ الشَّفَقِ الأَحْمَرِ وَالشَّفَقُ الأَحْمَرُ هُوَ الِاحْمِرَارُ الَّذِى يَظْهَرُ فِى جِهَةِ الْمَغْرِبِ بَعْدَ مَغِيبِ الشَّمْسِ."},{"type":"p","text":"   (4) صَلاةُ الْعِشَاءِ وَيَبْدَأُ وَقْتُهَا بِمَغِيبِ الشَّفَقِ الأَحْمَرِ وَيَنْتَهِى بِطُلُوعِ الْفَجْرِ."},{"type":"p","text":"   (5) صَلاةُ الصُّبْحِ وَيَبْدَأُ وَقْتُهَا بِطُلُوعِ الْفَجْرِ الصَّادِقِ وَهُوَ بَيَاضٌ يَظْهَرُ مُعْتَرِضًا فِى الأُفُقِ الشَّرْقِىِّ وَيَنْتَهِى بِطُلُوعِ الشَّمْسِ. "},{"type":"p","text":"فَتَجِبُ هَذِهِ الصَّلَوَاتُ فِى أَوْقَاتِهَا عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ طَاهِرٍ، وَمَعْنَى طَاهِرٍ الْمَرْأَةُ الطَّاهِرُ مِنَ الْحَيْضِ وَالنِّفَاسِ. فَلا يَجُوزُ تَقْدِيمُ الصَّلاةِ عَلَى وَقْتِهَا أَوْ تَأْخِيرُهَا عَنْهُ لِغَيْرِ عُذْرٍ شَرْعِىٍّ كَالْمَرَضِ الشَّدِيدِ وَالسَّفَرِ بِشُرُوطِهِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى فَرْضِيَّةِ الصَّلاةِ."},{"type":"p","text":"     (2) مَا هُوَ أَفْضَلُ الأَعْمَالِ بَعْدَ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ."},{"type":"p","text":"     (3) كَمْ صَلاةً فَرَضَ اللَّهُ عَلَى الْمُؤْمِنِينَ."},{"type":"p","text":"     (4) كَيْفَ يَبْدَأُ وَقْتُ الظُّهْرِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (5) مَا هُوَ ظِلُّ الِاسْتِوَاءِ."},{"type":"p","text":"     (6) كَيْفَ يَبْدَأُ وَقْتُ الْعَصْرِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (7) كَيْفَ يَبْدَأُ وَقْتُ الْمَغْرِبِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (8) مَا هُوَ الشَّفَقُ الأَحْمَرُ."},{"type":"p","text":"     (9) كَيْفَ يَبْدَأُ وَقْتُ الْعِشَاءِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (10) كَيْفَ يَبْدَأُ وَقْتُ الصُّبْحِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (11) مَا هُوَ الْفَجْرُ الصَّادِقُ."},{"type":"p","text":"     (12) عَلَى مَنْ تَجِبُ الصَّلَوَاتُ الْخَمْسُ وَمَا مَعْنَى طَاهِرٍ."},{"type":"p","text":"     (13) مَتَى يَجُوزُ تَقْدِيمُ الصَّلاةِ عَلَى وَقْتِهَا أَوْ تَأْخِيرُهَا عَنْهُ أَعْطِ مَثَلًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"أَرْكَانُ الصَّلاةِ وَسُنَنُهَا"},{"type":"p","text":""},{"type":"p","text":"الصَّلاةُ لَهَا أَرْكَانٌ أَىْ فَرَائِضُ وَلَهَا سُنَنٌ فَالأَرْكَانُ هِىَ الأُمُورُ الَّتِى لا بُدَّ مِنْهَا لِصِحَّةِ الصَّلاةِ أَمَّا السُّنَنُ فَهِىَ الأَشْيَاءُ الَّتِى فِى فِعْلِهَا زِيَادَةُ ثَوَابٍ وَتَرْكُهَا لا يُبْطِلُ الصَّلاةَ وَلا مَعْصِيَةَ فِيهِ وَنَحْنُ نَفْعَلُهَا اقْتِدَاءً بِالرَّسُوِلِ ﷺ."},{"type":"p","text":"أَرْكَانُ الصَّلاةِ سَبْعَةَ عَشَرَ"},{"type":"p","text":"   (1) النِّيَّةُ وَمَحَلُّهَا الْقَلْبُ فَيَنْوِى الْفَرْضِيَّةَ فِى صَلاةِ الْفَرْضِ ويُعَيِّنُ الصَّلاةَ إِنْ كَانَتْ إِحْدَى الصَّلَواتِ الْخَمْسِ أَوْ غَيْرَهَا."},{"type":"p","text":"   (2) وَتَكْبِيرَةُ الإِحْرَامِ فَيَقُولُ بِحَيْثُ يُسْمِعُ نَفْسَهُ اللَّهُ أَكْبَرُ وَتَكُونُ النِّيَّةُ مُقْتَرِنَةً بِهَا."},{"type":"p","text":"   (3) وَالْقِيَامُ فِى صَلاةِ الْفَرْضِ لِلْقَادِرِ فَإِنْ لَمْ يَسْتَطِعْ صَلَّى قَاعِدًا فَإِنْ لَمْ يَسْتَطِعْ صَلَّى مُضْطَجِعًا عَلَى جَنْبِهِ فَإِنْ لَمْ يَسْتَطِعْ صَلَّى مُسْتَلْقِيًا."},{"type":"p","text":"   (4) وَقِرَاءَةُ الْفَاتِحَةِ وَتَجِبُ فِى كُلِّ رَكْعَةٍ بِالْبَسْمَلَةِ وَالتَّشْدِيدَاتِ الأَرْبَعَ عَشْرَةَ وَتَجِبُ مُوَالاتُهَا وَتَرْتِيبُهَا وَإِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا وَعدَمُ اللَّحْنِ الْمُخِلِّ بِالْمَعْنَى."},{"type":"p","text":"   (5) وَالرُّكُوعُ بِأَنْ يَنْحَنِىَ بِحَيْثُ تَنَالُ رَاحَتَاهُ رُكْبَتَيْهِ."},{"type":"p","text":"   (6) وَالطُّمَأْنِينَةُ فِيهِ بِقَدْرِ قَوْلِ سُبْحَانَ اللَّهِ وَالطُّمَأْنِينَةُ هِىَ سُكُونُ كُلِّ عَظْمٍ مَكَانَهُ دَفْعَةً وَاحِدَةً."},{"type":"p","text":"   (7) وَالِاعْتِدَالُ بِأَنْ يَنْتَصِبَ بَعْدَ الرُّكُوعِ قَائِمًا."},{"type":"p","text":"   (8) وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"   (9) وَالسُّجُودُ مَرَّتَيْنِ بِأَنْ يَضَعَ جَبْهَتَهُ كُلَّهَا أَوْ بَعْضَهَا عَلَى مصَلَّاهُ مَكْشُوفَةً وَمُتَثَاقِلًا بِهَا وَيَضَعَ شَيْئًا مِنْ رُكْبَتَيْهِ وَمِنْ بُطُونِ كَفَّيْهِ وَمِنْ بُطُونِ أَصَابِعِ رِجْلَيْهِ."},{"type":"p","text":"   (10) وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"   (11) وَالْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ."},{"type":"p","text":"   (12) وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"   (13) وَالْجُلُوسُ الأَخِيرُ أَىْ لِلتَّشَهُّدِ وَمَا بَعْدَهُ مِنَ الصَّلاةِ عَلَى النَّبِىِّ وَالسَّلامِ."},{"type":"p","text":"   (14) وَالتَّشَهُّدُ الأَخِيرُ فَيَقُولُ التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ هَذَا أَكْمَلُهُ وَلَهُ أَقَلُّ."},{"type":"p","text":"   (15) وَالصَّلاةُ عَلَى النَّبِىِّ وَأَقَلُّهَا اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَالأَكْمَلُ أَنْ يَأْتِىَ بِالصَّلاةِ الإِبْرَاهِيمِيَّةِ كُلِّهَا."},{"type":"p","text":"   (16) وَالسَّلامُ وَأَقَلُّهُ السَّلامُ عَلَيْكُمْ."},{"type":"p","text":"   (17) وَالتَّرْتِيبُ أَىْ أَنْ يَأْتِىَ بِالأَرْكَانِ كَمَا ذَكَرْنَاهَا بِالتَّرْتِيبِ فَمَنْ قَدَّمَ رُكْنًا فِعْلِيًا عَلَى مَا بَعْدَهُ كَأَنْ سَجَدَ قَبْلَ الرُّكُوعِ عَمْدًا بَطَلَتْ صَلاتُهُ."},{"type":"p","text":"   سُنَنُ الصَّلاةِ مِنْهَا"},{"type":"p","text":"   (1) وَضْعُ الْيَدِ الْيُمْنَى عَلَى كُوعِ الْيُسْرَى فَوْقَ السُّرَّةِ وَتَحْتَ الصَّدْرِ."},{"type":"p","text":"   (2) وَقِرَاءَةُ دُعَاءِ الِافْتِتَاحِ قَبْلَ قِرَاءَةِ الْفَاتِحَةِ فِى الرَّكْعَةِ الأُولَى فَقَطْ."},{"type":"p","text":"   (3) وَقِرَاءَةُ شَىْءٍ مِنَ الْقُرْءَانِ بَعْدَ الْفَاتِحَةِ مِنَ الرَّكَعْتَيْنِ الأُولَيَيْنِ."},{"type":"p","text":"   (4) وَالتَّكْبِيرَاتُ عِنْدَ الرَّفْعِ وَالْخَفْضِ."},{"type":"p","text":"   (5) وَقَوْلُ سُبْحَانَ رَبِّىَ الْعَظِيمِ ثَلاثَ مَرَّاتٍ فِى الرُّكُوعِ."},{"type":"p","text":"   (6) وَقَوْلُ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ فِى الِاعْتِدَالِ."},{"type":"p","text":"   (7) وَقَوْلُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ فِى السُّجُودِ."},{"type":"p","text":"   (8) وَقَوْلُ اللَّهُمَّ اغْفِرْ لِى وَارْحَمْنِى وَاهْدِنِى وَعَافِنِى وَارْزُقْنِى فِى الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ."},{"type":"p","text":"   (9) وَقِرَاءَةُ الصَّلاةِ الإِبْرَاهِيمِيَّةِ بَعْدَ التَّشَهُّدِ الأَخِيرِ."},{"type":"p","text":"   (10) وَزِيَادَةُ وَرَحْمَةُ اللَّهِ فِى السَّلامِ فَيَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ. "},{"type":"p","text":"   (11) وَالتَّسْلِيمَةُ الثَّانِيَةُ وَالِالْتِفَاتُ فِى الأُولَى إِلَى الْيَمِينِ وَفِى الثَّانِيَةِ إِلَى الْيَسَارِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ أَرْكَانُ الصَّلاةِ."},{"type":"p","text":"     (2) أَيْنَ مَحَلُّ النِّيَّةِ وَمَاذَا يَنْوِى لَوْ أَرَادَ أَنْ يُصَلِّىَ الظُّهْرَ مَثَلًا."},{"type":"p","text":"     (3) مَنْ عَجَزَ أَنْ يُصَلِّىَ قَائِمًا مَاذَا يَفْعَلُ، فَإِنْ عَجَزَ."},{"type":"p","text":"     (4) مَا هِىَ الأُمُورُ الَّتِى يَجِبُ مُرَاعَاتُهَا فِى الْفَاتِحَةِ."},{"type":"p","text":"     (5) مَا هُوَ الرُّكُوعُ وَمَا مَعْنَى الطُّمَأْنِينَةِ."},{"type":"p","text":"     (6) مَا مَعْنَى الِاعْتِدَالِ وَكَمْ مَرَّةً السُّجُودُ فِى كُلِّ رَكْعَةٍ."},{"type":"p","text":"     (7) اذْكُرْ كَيْفِيَّةَ السُّجُودِ فِى الصَّلاةِ."},{"type":"p","text":"     (8) مَا هُوَ أَكْمَلُ التَّشَهُّدِ الأَخِيرِ."},{"type":"p","text":"   (9) مَا هُوَ أَقَلُّ الصَّلاةِ عَلَى النَّبِىِّ وَمَا هُوَ أَقَلُّ السَّلامِ."},{"type":"p","text":"   (10) مَا مَعْنَى التَّرْتِيبِ."},{"type":"p","text":"   (11) اذْكُرْ بَعْضَ سُنَنِ الصَّلاةِ."},{"type":"p","text":"   (12) مَاذَا يُسَنُّ أَنْ نَقْرَأَ قَبْلَ الْفَاتِحَةِ."},{"type":"p","text":"   (13) مَاذَا يُسَنُّ أَنْ نَقْرَأَ بَعْدَ الْفَاتِحَةِ وَفِى أَىِّ الرَّكَعَاتِ."},{"type":"p","text":"   (14) مَاذَا يُسَنُّ أَنْ نَقُولَ فِى الرُّكُوعِ وَفِى الِاعْتِدَالِ."},{"type":"p","text":"   (15) مَاذَا يُسَنُّ أَنْ نَقُولَ فِى السُّجُودِ وَفِى الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"شُرُوطُ صِحَّةِ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"   شُرُوطُ صِحَّةِ الصَّلاةِ هِىَ الأُمُورُ الَّتِى لا بُدَّ مِنْهَا لِصِحَّةِ الصَّلاةِ قَبْلَ الشُّرُوعِ فِيهَا وَهِىَ"},{"type":"p","text":"   (1) الإِسْلامُ فَلا تَصِحُّ الصَّلاةُ مِنْ كَافِرٍ."},{"type":"p","text":"   (2) وَالتَّمْيِيزُ وَهُوَ أَنْ يَكُونَ الْوَلَدُ بَلَغَ مِنَ الْعُمُرِ إِلَى حَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ وَيُشْتَرَطُ أَنْ يَكُونَ عَاقِلًا غَيْرَ مَجْنُونٍ."},{"type":"p","text":"   (3) وَالطَّهَارَةُ مِنَ الْحَدَثَيْنِ: أَنْ يَكُونَ مُتَوَضِّئًا لَيْسَ عَلَيْهِ حَدَثٌ أَصْغَرُ وَلَيْسَ عَلَيْهِ حَدَثٌ أَكْبَرُ."},{"type":"p","text":"   (4) وَطَهَارَةُ الثِّيَابِ وَالْبَدَنِ وَالْمَكَانِ وَالْمَحْمُولِ فَإِنْ كَانَ فِى جَيْبِهِ قِطْعَةُ قِمَاشٍ مُتَنَجِّسَةٌ وَصَلَّى بِهَا فَلا تَصِحُّ صَلاتُهُ."},{"type":"p","text":"   (5) وَسَتْرُ الْعَوْرَةِ وَعَوْرَةُ الرَّجُلِ مَا بَيْنَ السُّرَّةِ إِلَى الرُّكْبَةِ أَمَّا الْمَرْأَةُ الْحُرَّةُ فَعَوْرَتُهَا جَمِيعُ بَدَنِهَا مَا عَدَا وَجْهَهَا وَكَفَّيْهَا."},{"type":"p","text":"   (6) وَأَنْ يَعْلَمَ الْمُصَلِّى بِدُخُولِ وَقْتِ الصَّلاةِ."},{"type":"p","text":"   (7) وَأَنْ لا يَعْتَقِدَ فَرْضًا مِنْ فُرُوضِهَا سُنَّةً."},{"type":"p","text":"   (8) وَاسْتِقْبَالُ الْقِبْلَةِ وَهِىَ الْكَعْبَةُ الْمُشَرَّفَةُ فِى مَكَّةَ الْمُكَرَّمَةِ فَمَنْ أَخَلَّ بِشَرْطٍ مِنْ هَذِهِ الشُّرُوطِ لا تَصِحُّ صَلاتُهُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) عَدِّدْ شُرُوطَ صِحَّةِ الصَّلاةِ."},{"type":"p","text":"     (2) مَا هُوَ التَّمْيِيزُ."},{"type":"p","text":"     (3) مَا مَعْنَى الطَّهَارَةِ مِنَ الْحَدَثَيْنِ."},{"type":"p","text":"     (4) هَلْ تَصِحُّ الصَّلاةُ إِنْ كَانَ الْمُصَلِّى يَحْمِلُ نَجَاسَةً لا يُعْفَى عَنْهَا."},{"type":"p","text":"     (5) مَا هِىَ عَوْرَةُ الرَّجُلِ فِى الصَّلاةِ وَمَا هِىَ عَوْرَةُ الْمَرْأَةِ الْحُرَّةِ."},{"type":"p","text":"     (6) مَا هِىَ الْقِبْلَةُ."},{"type":"p","text":"     (7) مَنْ تَرَكَ شَيْئًا مِنْ هَذِهَ الشُّرُوطِ مَا حُكْمُ صَلاتِهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"مُبْطِلاتُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"   يَنْبَغِى لِلْمُسْلِمِ أَنْ يَكُونَ خَاشِعًا لِلَّهِ فِى صَلاتِهِ وَأَنْ يَجْتَنِبَ كُلَّ مَا يُفْسِدُ الصَّلاةَ وَيُبْطِلُهَا وَمُبْطِلاتُ الصَّلاةِ مِنْهَا"},{"type":"p","text":"   (1) أَنْ يَتَكَلَّمَ الْمُصَلِّى بِكَلامِ النَّاسِ الَّذِى لَيْسَ فِيهِ ذِكْرُ اللَّهِ عَامِدًا ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ بِحَرْفَيْنِ أَوْ بِحَرْفٍ مُفْهِمٍ مِثْل قِ أَوْ عِ."},{"type":"p","text":"   (2) وَأَنْ يَفْعَلَ أَفْعَالًا كَثِيرَةً تَسَعُ قَدْرَ رَكْعَةٍ مِنَ الزَّمَنِ وَقَالَ بَعْضُ الْعُلَمَاءِ تَبْطُلُ الصَّلاةُ إِذَا فَعَلَ الْمُصَلِّى ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ."},{"type":"p","text":"   (3) وَأَنْ يَأْكُلَ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ كَانَ قَلِيلًا كَحَبَّةِ سِمْسِمٍ."},{"type":"p","text":"   (4) وَأَنْ يَشْرَبَ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ كَانَ قَلِيلًا كَنُقْطَةِ مَاءٍ كَانَتْ عَلَى شَفَتِهِ فَابْتَلَعَهَا."},{"type":"p","text":"   (5) وَأَنْ يَفْعَلَ حَرَكَةً وَاحِدَةً بِقَصْدِ اللَّعِبِ."},{"type":"p","text":"   (6) وَأَنْ يَفْعَلَ حَرَكَةً مُفْرِطَةً كَأَنْ يَثِبَ وَثْبَةً فَاحِشَةً."},{"type":"p","text":"   (7) وَأَنْ يَزِيدَ رُكْنًا فِعْلِيًّا كَأَنْ يَتَعَمَّدَ السُّجُودَ ثَلاثَ مَرَّاتٍ فِى الرَّكْعَةِ الْوَاحِدَةِ ذَاكِرًا."},{"type":"p","text":"   (8) وَأَنْ يَنْوِىَ قَطْعَ الصَّلاةِ فَإِنَّ الصَّلاةَ تَبْطُلُ فَوْرًا."},{"type":"p","text":"   (9) وَأَنْ يُعَلِّقَ قَطْعَ الصَّلاةِ عَلَى حُصُولِ شَىْءٍ كَأَنْ يَقُولَ فِى نَفْسِهِ إِنْ جَاءَ أَخِى سَأَقْطَعُ الصَّلاةَ لِأَفْتَحَ لَهُ الْبَابَ."},{"type":"p","text":"   (10) وَأَنْ يَتَرَدَّدَ هَلْ يَقْطَعُ الصَّلاةَ أَمْ لا."},{"type":"p","text":"   (11) وَأَنْ يَمْضِىَ رُكْنٌ مَعَ الشَّكِ فِى نِيَّةِ التَحَرُّمِ أَوْ يَطُولَ زَمَنُ الشَّكِّ وَذَلِكَ كَأَنْ أَنْهَى قِرَاءَةَ الْفَاتِحَةِ وَهُوَ شَاكٌّ هَلْ نَوَى الظُّهْرَ أَوِ الْعَصْرَ وَلَوْ لَمْ يَمْضِ رُكْنٌ لَكِنْ طَالَ وَقْتُ الشَّكِّ كَأَنْ قَرَأَ سُورَةَ تَبَارَكَ مَثَلًا وَهُوَ شَاكٌّ فِى النِّيَّةِ بَطَلَتْ صَلاتُهُ. أَمَّا إِذَا طَالَ شَكُّهُ فِى عَدَدِ الرَّكَعَاتِ فَلا يُفْسِدُ ذَلِكَ صَلاتَهُ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) إِذَا تَكَلَّمَ الْمُصَلِّى بِكَلامِ النَّاسِ عَمْدًا مَا حُكْمُ صَلاتِهِ."},{"type":"p","text":"     (2) إِذَا تَكَلَّمَ بِحَرْفَيْنِ أَوْ بِحَرْفٍ مُفْهِمٍ مَا حُكْمُ صَلاتِهِ."},{"type":"p","text":"     (3) مَا الْحُكْمُ إِذَا تَحَرَّكَ فِى الصَّلاةِ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ."},{"type":"p","text":"     (4) مَا حُكْمُ مَنْ أَكَلَ أَوْ شَرِبَ فِى الصَّلاةِ عَمْدًا."},{"type":"p","text":"     (5) مَا حُكْمُ مَنْ فَعَلَ حَرَكَةً وَاحِدَةً بِقَصْدِ اللَّعِبِ فِى أَثْنَاءِ الصَّلاةِ."},{"type":"p","text":"     (6) أَعْطِ مِثَالًا عَنْ حَرَكَةٍ مُفْرِطَةٍ."},{"type":"p","text":"     (7) مَا حُكْمُ مَنْ تَعَمَّدَ زِيَادَةَ رُكْنٍ فِعْلِىٍّ فِى صَلاتِهِ أَعْطِ مِثَالًا."},{"type":"p","text":"     (8) مَا الْحُكْمُ إِذَا نَوَى قَطْعَ الصَّلاةِ أَوْ عَلَّقَ قَطْعَهَا عَلَى شَىْءٍ أَوْ تَرَدَّدَ فِى الْقَطْعِ."},{"type":"p","text":"     (9) مَا الْحُكْمُ إِذَا مَضَى رُكْنٌ مَعَ الشَّكِّ فِى نِيَّةِ التَّحَرُّمِ أَوْ طَالَ زَمَنُ الشَّكِّ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"صَلاةُ الْجَمَاعَةِ"},{"type":"p","text":""},{"type":"p","text":"   حَضَّ سَيِّدُنَا مُحَمَّدٌ ﷺ عَلَى صَلاةِ الْجَمَاعَةِ وَأَمَرَ أَنْ تُصَلَّى الصَّلَوَاتُ الْخَمْسُ جَمَاعَةً بِحَيْثُ يَظْهَرُ شِعَارُهَا فَإِنَّ اجْتِمَاعَ الْمُسْلِمِينَ عَلَى طَاعَةِ اللَّهِ فِيهِ خَيْرٌ كَبِيرٌ وَقَدْ قَالَ رَسُولُ اللَّهِ ﷺ «صَلاةُ الْجَمَاعَةِ تَفْضُلُ صَلاةَ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً» رَوَاهُ ابْنُ مَاَجَهْ وَالتِّرْمِذِىُّ وَأَحْمَدُ بنُ حَنْبَلٍ، أَىْ أَنَّ صَلاةَ الْجَمَاعَةِ خَيْرٌ وَأَفْضَلُ مِنْ صَلاةِ الْمُنْفَرِدِ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً وَهِىَ فَرْضُ كِفَايَةٍ عَلَى الرِّجَالِ الأَحْرَارِ الْمُقِيمِينَ الْبَالِغِينَ غَيْرِ الْمَعْذُورِينَ لِكُلِّ صَلاةٍ مَفْرُوضَةٍ تُصَلَّى أَدَاءً."},{"type":"p","text":"كَيْفِيَّةُ صَلاةُ الْجَمَاعَةِ"},{"type":"p","text":"يَتَقَدَّمُ الْمُصَلِّينَ أَحَدُهُمْ وَيُسْتَحْسَنُ أَنْ يَكُونَ أَتْقَاهُمْ وَأَحْسَنَهُمْ تِلاوَةً لِلْقُرْءَانِ الْكَرِيمِ وَيُسَمَّى الإِمَامَ وَيَقِفُ الْمُصَلُّونَ وَرَاءَهُ فِى صُفُوفٍ مُسْتَوِيَةٍ مُتَرَاصَّةٍ ثُمَّ يُكَبِّرُ الإِمَامُ تَكْبِيرَةَ الإِحْرَامِ وَبَعْدَهُ يُكَبِّرُ الْمُصَلُّونَ لِلْصَلاةِ مَعَ النِّيَّةِ فَيَقُولُ كُلُّ وَاحِدٍ مِنْهُمْ بِقَلْبِهِ أَثْنَاءَ التَّكْبِيرِ بِلِسَانِهِ أُصَلِّى فَرْضَ الْعَصْرِ جَمَاعَةً مَثَلًا، وَالإِمَامُ يَجْهَرُ بِكُلِّ التَّكْبِيرَاتِ وَالتَّسْمِيعِ وَالسَّلامِ، وَبالْفَاتِحَةِ وَمَا يَقْرَؤُهُ بَعْدَ الْفَاتِحَةِ وَالتَّأْمِينِ إِنْ كَانَتِ الصَّلاةُ جَهْرِيَّةً وَإِنْ كَانَتْ سِرِّيَّةً لا يَجْهَرُ بِالْفَاتِحَةِ وَالسُّورَةِ وَالتَّأْمِينِ."},{"type":"p","text":"وَالْمَأْمُومُ يَجْهَرُ بِالتَّأْمِينِ لِقِرَاءَةِ إِمَامِهِ فَقَطْ وَلا يَقْرَأُ شَيْئًا بَعْدَ الْفَاتِحَةِ فِى الصَّلاةِ الْجَهْرِيَّةِ أَمَا فِى السِّرِّيَّةِ فَيَقْرَأُ."},{"type":"p","text":"شُرُوطُ الِاقْتِدَاءِ"},{"type":"p","text":"يَجِبُ عَلَى الْمَأْمُومِ مُرَاعَاةُ الأُمُورِ التَّالِيَةِ"},{"type":"p","text":"أَنْ لا يَتَقَدَّمَ عَلَى إِمَامِهِ فِى الْمَوْقِفِ وَالإِحْرَامِ أَىْ لا يَتَقَدَّمَ عَلَى إِمَامِهِ بِعَقِبَيْهِ."},{"type":"p","text":"وَأَنْ لا يُكَبِّرَ تَكْبِيرَةَ الإِحْرَامِ إِلَّا بَعْدَ أَنْ يُكَبِّرَ الإِمَامُ."},{"type":"p","text":"وَأَنْ يُتَابِعَ الإِمَامَ وَلا يَسْبِقَهُ بِرُكْنَيْنِ فِعْلِيَّيْنِ وَلا يَتَأَخَرَ عَنْهُ بِرُكْنَيْنِ فِعْلِيَّيْنِ بِلا عُذْرٍ وَلا بِأَكْثَرَ مِنْ ثَلاثَةِ أَرْكَانٍ طَوِيلَةٍ وَلَوْ لِعُذْرٍ."},{"type":"p","text":"وَأَنْ يَعْلَمَ بِانْتِقَالاتِ إِمَامِهِ مِنْ رُكْنٍ إِلَى رُكْنٍ إِمَا بِسَمَاعِ صَوْتِهِ أَوْ صَوْتِ مُبَلِّغٍ عَدْلٍ."},{"type":"p","text":"وَأَنْ يَجْتَمِعَ الإِمَامُ وَالْمَأْمُومُ فِى مَكَانٍ وَاحِدٍ فَإِنْ كَانَا فِى مَسْجِدٍ صَحَّ الِاقْتِدَاءُ وَإِنْ بَعُدَتِ الْمَسَافَةُ بِشَرْطِ أَنْ لا يَتَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ، وَإِنْ كَانَا فِى غَيْرِ الْمَسْجِدِ فَشَرْطُهُ أَنْ لا تَزِيدَ الْمَسَافَةُ بَيْنَهُمَا عَلَى ثَلاثِمِائَةِ ذِرَاعٍ."},{"type":"p","text":"وَأَنْ لا يَحُولَ بَيْنَهُمَا حَائِلٌ يَمْنَعُ الْمُرُورَ."},{"type":"p","text":"وَأَنْ يَتَوَافَقَ نَظْمُ صَلاتَيْهِمَا فَلا تَصِحُّ قُدْوَةُ مُصَلِّى إِحْدَى الصَّلَوَاتِ الْخَمْسِ خَلْفَ مَنْ يُصلِّى صَلاةَ الْجِنَازَةِ لِأَنَّ الصَّلَوَاتِ الْخَمْسَ فِيهَا رُكُوُعٌ وَسُجُودٌ أَمَّا صَلاةُ الْجِنَازَةِ فَلَيْسَ فِيهَا رُكُوُعٌ وَلا سُجُودٌ."},{"type":"p","text":"وَأَنْ لا يَتَخَالَفَا فِى سُنَّةٍ تَفْحُشُ الْمُخَالَفَةُ فِيهَا كَالْجُلُوسِ لِلتَّشَهُّدِ الأَوَّلِ فِعْلًا وَتَرْكًا أَىْ إِنْ جَلَسَ الإِمَامُ جَلَسَ الْمَأْمُومُ مَعَهُ وَإِنْ تَرَكَهُ قَامَ مَعَهُ."},{"type":"p","text":"وَأَنْ يَنْوِىَ الِاقْتِدَاءَ أَوِ الْجَمَاعَةَ قَبْلَ الْمُتَابَعَةِ وَطُولِ الِانْتِظَارِ أَمَّا فِى صَلاةِ الْجُمُعَةِ فَتَكُونُ نِيَّةُ الِاقْتِدَاءِ أَثْنَاءَ تَكْبِيرَةِ الإِحْرَامِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى الْحَثِّ عَلَى صَلاةِ الْجَمَاعَةِ."},{"type":"p","text":"     (2) مَا الْحُكْمُ إِذَا تَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ فِى الْمَوْقِفِ وَالإِحْرَامِ."},{"type":"p","text":"     (3) مَتَى يُكَبِّرُ الْمَأْمُومُ."},{"type":"p","text":"     (4) مَا الْحُكْمُ إِذَا تَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ."},{"type":"p","text":"     (5) مَا الْحُكْمُ إِذَا تَأَخَّرَ الْمَأْمُومُ عَنِ الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ بِلا عُذْرٍ."},{"type":"p","text":"     (6) كَيْفَ يَعْلَمُ الْمَأْمُومُ بِانْتِقَالاتِ الإِمَامِ."},{"type":"p","text":"     (7) هَلْ تَصِحُّ الْقُدْوَةُ إِذَا حَالَ بَيْنَهُمَا حَائِلٌ يَمْنَعُ الْمُرُورَ."},{"type":"p","text":"     (8) لِمَ لا تَصِحُّ قُدْوَةُ مُصَلِّى الظُّهْرِ خَلْفَ مَنْ يُصلِّى صَلاةَ الْجِنَازَةِ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى عَشَرَ"},{"type":"p","text":"صَلاةُ الْجُمُعَةِ"},{"type":"p","text":""},{"type":"p","text":"يَوْمُ الْجُمُعَةِ هُوَ أَفْضَلُ أَيَّامِ الأُسْبُوعِ."},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ «خَيْرُ يَوْمٍ طَلَعَتْ عَلَيْهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ فِيهِ خُلِقَ ءَادَمُ وَفِيهِ أُدْخِلَ الْجَنَّةَ وَفِيهِ أُخْرِجَ مِنْهَا» رَوَاهُ مُسْلِمٌ، وَقَدْ فَرَضَ اللَّهُ تَعَالَى فِيهِ صَلاةً يَجْتَمِعُ فِيهَا الْمُسْلِمُونَ فِى الْمَسجِدِ الْجَامِعِ فِى كَافَّةِ الْبُلْدَانِ الإِسْلامِيَّةِ لِأَدَائِهَا."},{"type":"p","text":"وَصَلاةُ الْجُمُعَةِ فَرْضُ عَيْنٍ عَلَى الذُّكُورِ الأَحْرَارِ الْمُقِيمِينَ الْبَالِغِينَ غَيْرِ الْمَعْذُورِينَ. وَمِنَ الْعُذْرِ الشَّرْعِىِّ أَنْ يَكُونَ الْمُسْلِمُ مَرِيضًا مَرَضًا شَدِيدًا يَشُقُّ عَلَيْهِ مَعَهُ الذَّهَابُ إِلَى الْمَسْجِدِ."},{"type":"p","text":"وَيُشْتَرَطُ أَنْ يَكُونُوا أَرْبَعِينَ مُكَلَّفِينَ مُسْتَوْطِنِينَ فِى أَبْنِيَةٍ لا فِى الْخِيَامِ لِأَنَّهَا لا تَجِبُ عَلَى أَهْلِ الْخِيَامِ. "},{"type":"p","text":"وَيَجِبُ عَلَى مَنْ نَوَى الإِقَامَةَ فِى بَلَدِ الْجُمُعَةِ أَرْبَعَةَ أَيَّامٍ صِحَاحٍ غَيْرِ يَوْمَىِ الدُّخُولِ وَالْخُرُوجِ فَأَكْثَرَ لِأَنَّهُ بِذَلِكَ يَنْقَطِعُ حُكْمُ السَّفَرِ."},{"type":"p","text":"وَتَجِبُ الْجُمُعَةُ عَلَى مَنْ تَوَطَّنَ مَحَلًّا لا تَجِبُ فِيهِ الْجُمُعَةُ لِعَدَمِ اسْتِيفَاءِ الشُّرُوطِ وَلَكِنْ كَانَ بِحَيْثُ يَبْلُغُهُ فِيهِ النِّدَاءُ مِنْ شَخْصٍ صَيِّتٍ أَىْ عَالِى الصَّوْتِ فِى بَلَدِ الْجُمُعَةِ بِحَيْثُ يَعْلَمُ أَنَّ مَا يَسْمَعُهُ نِدَاءُ الْجُمُعَةِ."},{"type":"p","text":"وَصَلاةُ الْجُمُعَةِ رَكْعَتَانِ بَدَلَ صَلاةِ الظُّهْرِ تُؤَدَّى جَمَاعَةً وَيَسْبِقُهَا خُطْبَتَانِ مِنَ الإِمَامِ وَلَهَا شُرُوطٌ لا بُدَّ مِنْ تَوَفُّرِهَا حَتَّى تَصِحَّ وَكَذَلِكَ الْخُطْبَتَانِ لَهُمَا أَرْكَانٌ وَشُرُوطٌ."},{"type":"p","text":"   شُرُوطُ الْجُمُعَةِ "},{"type":"p","text":"   وَمِنْ شُرُوطِ الْجُمُعَةِ"},{"type":"p","text":"   (1) وقُوعُهَا وَقْتَ الظُّهْرِ."},{"type":"p","text":"   (2) وَخُطْبَتَانِ قَبْلَ الصَّلاةِ يَسْمَعُهُمَا الأَرْبَعُونَ."},{"type":"p","text":"   (3) وَأَنْ تُصَلَّى جَمَاعَةً بِالأَرْبَعِينَ."},{"type":"p","text":"   (4) وَأَنْ لا تُقَارِنَهَا أُخْرَى بِبَلَدٍ وَاحِدٍ فَإِنْ أُقِيمَتْ جُمُعَتَانِ بِبَلَدٍ وَاحِدٍ وَسَبَقَتْ إِحْدَاهُمَا بِالتَّحْرِيمَةِ أَىْ بِتَكْبِيرَةِ الإِحْرَامِ صَحَّتِ السَّابِقَةُ وَلَمْ تَصِحَّ الْمَسْبُوقَةُ أَمَّا إِذَا كَانَ يَشُقُّ عَلَيْهِمُ الِاجْتِمَاعُ فِى مَكَانٍ وَاحِدٍ وَتَعَدَّدَتْ بِقَدْرِ الْحَاجَةِ صَحَّتِ السَّابِقَةُ وَالْمَسْبُوقَةُ. "},{"type":"p","text":"   أَرْكَانُ الْخُطْبَتَيْنِ"},{"type":"p","text":"   (1) حَمْدُ اللَّهِ"},{"type":"p","text":"    (2) وَالصَّلاةُ عَلَى النَّبِىِّ ﷺ."},{"type":"p","text":"   (3) وَالْوَصِيَّةُ بِالتَّقْوَى."},{"type":"p","text":"وَهَذِهِ الأَرْكَانُ الثَّلاثَةُ تُشْتَرَطُ فِى الْخُطْبَتَيْنِ الأُولَى وَالثَّانِيَةِ."},{"type":"p","text":"   (4) وَءَايَةٌ مُفْهِمَةٌ فِى إِحْدَاهُمَا وَالأَوْلَى أَنْ تَكُونَ فِى الْخُطْبَةِ الأُولَى."},{"type":"p","text":"   (5) وَالدُّعَاءُ لِلْمُؤْمِنِينَ فِى الثَّانِيَةِ."},{"type":"p","text":"   شُرُوطُ الْخُطْبَتَيْنِ"},{"type":"p","text":"   (1) الطَّهَارَةُ عَنِ الْحَدَثَيْنِ وَعَنِ النَّجَاسَةِ غَيْرِ الْمَعْفُوِّ عَنْهَا فِى الْبَدَنِ وَالْمَكَانِ وَالْمَحْمُولِ."},{"type":"p","text":"   (2) وَسَتْرُ الْعَوْرَةِ."},{"type":"p","text":"   (3) وَالْقِيَامُ."},{"type":"p","text":"   (4) وَالْجُلُوسُ بَيْنَهُمَا."},{"type":"p","text":"   (5) وَالْمُوَالاةُ بَيْنَ أَرْكَانِهِمَا وَبَيْنَهُمَا وَبَيْنَ الصَّلاةِ."},{"type":"p","text":"   (6) وَأَنْ تَكُونَا بِالْعَرَبِيَّةِ فَإِذَا أَتَى بِالأَرْكَانِ بِالْعَرَبِيَّةِ وَالْبَاقِى بِغَيْرِهَا صَحَّتِ الْخُطْبَتَانِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ أَفْضَلُ أَيَّامِ الأُسْبُوعِ."},{"type":"p","text":"     (2) اذْكُرْ حَدِيثًا يُبَيِّنُ فَضْلَ يَوْمِ الْجُمُعَةِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (3) عَلَى مَنْ تَجِبُ صَلاةُ الْجُمُعَةِ."},{"type":"p","text":"     (4) مَتَى تَجِبُ الْجُمُعَةُ عَلَى مَنْ نَوَى الإِقَامَةَ فِى بَلَدِ الْجُمُعَةِ."},{"type":"p","text":"     (5) مَتَى تَجِبُ الْجُمُعَةُ عَلَى مَنْ تَوَطَّنَ مَحَلًّا خَارِجَ بَلَدِ الْجُمُعَةِ."},{"type":"p","text":"     (6) كَمْ رَكْعَةً صَلاةُ الْجُمُعَةِ وَهَلْ تُؤَدَّى جَمَاعَةً أَمْ بِالِانْفِرَادِ."},{"type":"p","text":"     (7) مَا هِىَ شُرُوطِ الْجُمُعَةِ عَدِّدْهَا."},{"type":"p","text":"     (8) مَا الْحُكْمُ إِذَا أُقِيمَتْ جُمُعَتَانِ بِبَلَدٍ وَاحِدٍ."},{"type":"p","text":"     (9) عَدِّدْ أَرْكَانَ الْخُطْبَتَيْنِ."},{"type":"p","text":"     (10) مَا هِىَ الأَرْكَانُ الَّتِى تُعَادُ فِى الْخُطْبَتَيْنِ وَفِى أَىِّ خُطْبَةٍ يُشْتَرَطُ الدُّعَاءُ لِلْمُؤْمِنِينَ."},{"type":"p","text":"     (11) عَدِّدْ شُرُوطَ الْخُطْبَتَيْنِ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثَ عَشَرَ"},{"type":"p","text":"الصِّيَامُ"},{"type":"p","text":""},{"type":"p","text":"فَرَضَ اللَّهُ سُبْحَانَهُ وَتَعَالَى عَلَى الْمُكَلَّفِينَ صِيَامَ رَمَضَانَ قَالَ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ﴾ [سُورَةَ الْبَقَرَة/183] أَىْ فُرِضَ عَلَيْكُمُ الصِّيَامُ، وَكَانَ فَرْضُهُ فِى شَعْبَانَ فِى السَّنَةِ الثَّانِيَةِ مِنَ الْهِجْرَةِ. "},{"type":"p","text":"وَصِيَامُ شَهْرِ رَمَضَانَ فَرِيضَةٌ عَظِيمَةٌ وَأَمْرٌ مِنْ أَهَمِّ أُمُورِ الإِسْلامِ وَالْمُسْلِمُونَ يَسْتَبْشِرُونَ بِقُدُومِهِ فَهُوَ شَهْرُ الْخَيْرَاتِ وَالطَّاعَاتِ وَالْبَرَكَاتِ وَهُوَ أَفْضَلُ شُهُورِ السَّنَةِ وَفِيهِ أَفْضَلُ اللَّيَالِى وَهِىَ لَيْلَةُ الْقَدْرِ. "},{"type":"p","text":"وَالصِّيَامُ هُوَ الإِمْسَاكُ عَنِ الْمُفَطِّرَاتِ أَثْنَاءَ النَّهَارِ مَعَ النِّيَّةِ فِى اللَّيْلِ. وَهُوَ فَرْضٌ عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ قَادِرٍ عَلَى الصِّيَامِ وَلا يَصِحُّ مِنَ الْحَائِضِ وَالنُّفَسَاءِ."},{"type":"p","text":"   وَيَجِبُ صِيَامُ رَمَضَانَ بِأَحَدِ أَمْرَيْنِ"},{"type":"p","text":"   (1) إِكْمَالِ شَعْبَانَ ثَلاثِينَ يَوْمًا."},{"type":"p","text":"   (2) أَوْ رُؤْيَةِ هِلالِ رَمَضَانَ لَيْلَةَ الثَّلاثِينَ مِنْ شَعْبَانَ لِقَوْلِهِ ﷺ «صُومُوا لِرُؤْيَتِهِ وَأَفْطِرُوا لِرُؤْيَتِهِ فَإِنْ غُمَّ عَلَيْكُمْ فَأَكْمِلُوا عِدَّةَ شَعْبَانَ ثَلاثِينَ يَوْمًا» رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ."},{"type":"p","text":"   فَمَنْ رَأَى هِلالَ رَمَضَانَ صَامَ وَمَنْ لَمْ يَرَهُ وَأَخْبَرَهُ مُسْلِمٌ ثِقَةٌ عَدْلٌ حُرٌّ غَيْرُ كَاذِبٍ وَجَبَ عَلَيْهِ الصِّيَامُ."},{"type":"p","text":"فَرَائِضُ الصِّيَامِ"},{"type":"p","text":"وَفَرَائِضُ الصِّيَامِ اثْنَانِ"},{"type":"p","text":"   (1) النِّيَّةُ بِالْقَلْبِ عَنْ كُلِّ يَوْمٍ كَأَنْ يَقُولَ بِقَلْبِهِ نَوَيْتُ صَوْمَ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانَ هَذِهِ السَّنَة إِيـمَانًا وَاحْتِسَابًا للَّهِ تَعَالَى، وَالِاحْتِسَابُ طَلَبُ الأَجْرِ، وَوَقْتُ النِّيَّةِ مِنْ غُرُوبِ الشَّمْسِ إِلَى دُخُولِ الْفَجْرِ."},{"type":"p","text":"   (2) وَتَرْكُ الْمُفَطِّرَاتِ مِنْ طُلُوعِ الْفَجْرِ الصَّادِقِ إِلَى غُرُوبِ الشَّمْسِ."},{"type":"p","text":"مُفْسِدَاتُ الصِّيَامِ"},{"type":"p","text":"مُفْسِدَاتُ الصِّيَامِ كَثِيرَةٌ مِنْهَا"},{"type":"p","text":"   (1) الأَكْلُ وَلَوْ قَدْرَ سِمْسِمَةٍ وَالشُّرْبُ وَلَوْ قَطْرَةَ مَاءٍ أَوْ دَوَاءٍ إَذَا كَانَ ذَاكِرًا لِلصِّيَامِ."},{"type":"p","text":"   (2) وَالْقَطْرَةُ فِى الأَنْفِ وَالأُذُنِ إِذَا وَصَلَ الدَّوَاءُ إِلَى الْجَوْفِ وَكَذَلِكَ الْحُقْنَةُ فِى الْقُبُلِ أَوِ الدُّبُرِ، أَمَّا الْقَطْرَةُ فِى الْعَيْنِ فَلا تُفَطِّرُ وَالإِبْرَةُ فِي الْجِلْدِ أَوِ الْعَضَلِ أَوِ الشِّرْيَانِ لا تُفَطِّرُ أَيْضًا."},{"type":"p","text":"   (3) وَالإِغْمَاءُ كُلَّ الْيَوْمِ فَمَنْ أُغْمِىَ عَلَيْهِ كُلَّ الْيَوْمِ مِنْ الْفَجْرِ حَتَّى الْغُرُوبِ لَمْ يَصِحَّ صِيَامُهُ وَكَذَلِكَ مَنْ جُنَّ وَلَوْ لَحْظَةً أَفْطَرَ."},{"type":"p","text":"   (4) والِاسْتِقَاءَةُ بِوَضْعِ الإِصْبَعِ وَنَحْوِهِ فِى الْفَمِ وَإِخْرَاجِ الْقَىْءِ مِنَ الْجَوْفِ أَمَّا إِذَا تَقَيَّأَ بِغَيْرِ إِرَادَتِهِ وَلَمْ يَرْجِعْ شَىْءٌ إِلَى جَوْفِهِ فَلا يُفْطِرُ."},{"type":"p","text":"   (5) وَالرِّدَّةُ بِأَىِّ نَوْعٍ مِنْ أَنْوَاعِهَا الثَّلاثَةِ الِاعْتِقَادِيَّةِ وَالْفِعْلِيَّةِ وَالْقَوْلِيَّةِ. وَمَنْ أَفْسَدَ صَوْمَ يَوْمٍ مِنْ رَمَضَانَ بِالأَكْلِ أَوِ الشُّرْبِ أَوِ الِاسْتِقَاءَةِ فَعَلَيْهِ الإِثْمُ وَالْقَضَاءُ فَوْرًا بَعْدَ رَمَضَانَ وَيَوْمِ الْعِيدِ وَلا يَجِبُ عَلَيْهِ دَفْعُ الْمَالِ لِلْفُقَرَاءِ وَالْمَسَاكِينِ."},{"type":"p","text":""},{"type":"p","text":"فَائِدَةٌ"},{"type":"p","text":"يَحْرُمُ صِيَامُ يَوْمِ عِيدِ الْفِطْرِ وَيَوْمِ عِيدِ الأَضْحَى وأَيَّامِ التَّشْرِيقِ الثَّلاثَةِ وَهِىَ الأَيَّامُ الثَّلاثَةُ الَّتِى تَلِى عِيدَ الأَضْحَى."},{"type":"p","text":""},{"type":"p","text":"دُعَاءٌ"},{"type":"p","text":"اللَّهُمَّ لَكَ صُمْتُ وَعَلَى رِزْقِكَ أَفْطَرْتُ وَكَانَ رَسُولُ اللَّهِ ﷺ يَقُولُ إِذَا أَفْطَرَ «ذَهَبَ الظَّمَأُ وابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللَّهُ» رَوَاهُ أَبُو دَاوُدَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) أَىُّ شَهْرٍ فَرَضَ اللَّهُ فِيهِ الصِّيَامَ."},{"type":"p","text":"     (2) اذْكُرْ ءَايَةً فِيهَا وُجُوبُ الصِّيَامِ."},{"type":"p","text":"     (3) مَتَى فُرِضَ الصَّوْمُ فِى شَهْرِ رَمَضَانَ."},{"type":"p","text":"     (4) مَا هُوَ الصِّيَامُ وَعَلَى مَنْ يَجِبُ."},{"type":"p","text":"     (5) كَيْفَ يَثْبُتُ الصِّيَامُ وَاذْكُرْ حَدِيثًا فِى ذَلِكَ."},{"type":"p","text":"     (6) مَنْ لَمْ يَرَ الْهِلالَ مَاذَا يَفْعَلُ."},{"type":"p","text":"     (7) مَا هِىَ فَرَائِضُ الصِّيَامِ."},{"type":"p","text":"     (8) مَتَى وَقْتُ نِيَّةِ الصِّيَامِ وَمَاذَا يَنْوِى مَنْ أَرَادَ الصِّيَامَ."},{"type":"p","text":"     (9) عَدِّدْ بَعْضَ مُفْسِدَاتِ الصِّيَامِ."},{"type":"p","text":"     (10) مَا هِىَ الأَيَامُ الَّتِى يَحْرُمُ الصَّوْمُ فِيهَا."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعَ عَشَرَ"},{"type":"p","text":"الزَّكَاةُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَأَقِيمُوا الصَّلاةَ وَءَاتُوا الزَّكَاةَ﴾ [سُورَةَ الْبَقَرَة/43]."},{"type":"p","text":"الزَّكَاةُ مَعْنَاهَا فِى اللُّغَةِ التَّطْهِيرُ وَالنَّمَاءُ وَشَرْعًا اسْمٌ لِمَا يُخْرَجُ عَنْ مَالٍ أَوْ بَدَنٍ عَلَى وَجْهٍ مَخْصُوصٍ وَسُمِّيَتْ كَذَلِكَ لِأَنَّ الْمَالَ يَنْمُو بِبَرَكَةِ إِخْرَاجِهَا وَلِأَنَّهَا تُطَهِّرُ مُخْرِجَهَا مِنَ الإِثْمِ."},{"type":"p","text":"وَالزَّكَاةُ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ فَرَضَهَا اللَّهُ فِى السَّنَةِ الثَّانِيَةِ مِنَ الْهِجْرَةِ."},{"type":"p","text":"   الأَشْيَاءُ الَّتِى تَجِبُ فِيهَا الزَّكَاةُ"},{"type":"p","text":"   (1) الأَنْعَامُ وَهِىَ الإِبِلُ وَالْبَقَرُ وَالْغَنَمُ."},{"type":"p","text":"   (2) وَالزُّرُوعُ الْمُقْتَاتَةُ حَالَةَ الِاخْتِيَارِ أَىِ الَّتِى يَدَّخِرُهَا الإِنْسَانُ عَادَةً لِيَقْتَاتَ بِهَا كَالْقَمْحِ وَالشَّعِيرِ وَالذُّرَةِ لا الْفَوَاكِهِ كَالتُّفَاحِ وَالْبُرْتُقَالِ."},{"type":"p","text":"   (3) وَالثِّمَارُ وَتَجِبُ فِى شَيْئَيْنِ مِنْهَا هُمَا ثَمَرَةُ النَّخْلِ وَالْعِنَبِ."},{"type":"p","text":"   (4) وَأَمْوَالُ التِّجَارَةِ وَهِىَ تَقْلِيبُ الْمَالِ فِى الْبَيْعِ وَالشِّرَاءِ لِغَرَضِ الرِّبْحِ كَأَنْ يَبِيعَ وَيَشْتَرِىَ ثُمَّ يَبِيعَ وَيَشْتَرِىَ وَهَكَذَا."},{"type":"p","text":"   (5) وَالنَّقْدَانِ وَهُمَا الذَّهَبُ وَالْفِضَّةُ."},{"type":"p","text":"وَتَجِبُ أَيْضًا زَكَاةُ الْفِطْرِ وَهِىَ زَكَاةٌ عَنِ الْبَدَنِ لا عَنِ الْمَالِ يَدْفَعُهَا الْمُكَلَّفُ عَنْ نَفْسِهِ وَزَوْجَتِهِ وَأَوْلادِهِ الصِّغَارِ وَوَالِدَيْهِ الْفَقِيرَيْنِ فِى شَهْرِ رَمَضَانَ أَوْ يَوْمِ عِيدِ الْفِطْرِ."},{"type":"p","text":"الْمُسْتَحِقُّونَ لِلزَّكَاةِ"},{"type":"p","text":"وَلا يَجُوزُ دَفْعُ الزَّكَاةِ إِلَّا إِلَى مُسْتَحِقِّيهَا وَهُمُ الأَصْنَافُ الثَّمَانِيَةُ الَّذِينَ ذَكَرَهُمُ اللَّهُ تَعَالَى فِى الْقُرْءَانِ الْكَرِيمِ فِى الآيَةِ ﴿إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِى الرِّقَابِ وَالْغَارِمِينَ وَفِى سَبِيلِ اللَّهِ وَابْنِ السَّبِيلِ﴾ [سُورَةَ التَّوْبَة/60]."},{"type":"p","text":"   (1) الْفُقَرَاءُ هُمُ الَّذِينَ لا يَجِدُونَ نِصْفَ كِفَايَتِهِمْ."},{"type":"p","text":"   (2) الْمَسَاكِينُ هُمُ الَّذِينَ لا يَجِدُونَ كُلَّ كِفَايَتِهِمْ وَلَكِنْ يَجِدُونَ نِصْفَهَا. "},{"type":"p","text":"   (3) الْعَامِلُونَ عَلَيْهَا هُمُ الَّذِينَ يُوَظِّفُهُمُ الْخَلِيفَةُ لِجَمْعِ الزَّكَاةِ بِدُونِ رَاتِبٍ."},{"type":"p","text":"   (4) الْمُؤَلَّفَةُ قُلُوبُهُمْ هُمُ الَّذِينَ أَسْلَمُوا حَدِيثًا ونِيَّتُهُمْ ضَعِيفَةٌ أَوْ كَانَ يُرْجَى بِإِعْطَائِهِمْ أَنْ يُسْلِمَ نُظَرَاؤُهُمْ."},{"type":"p","text":"   (5) الرِّقَابُ هُمُ الْعَبِيدُ الْمُكَاتَبُونَ أَىِ الَّذِينَ اشْتَرَطَ عَلَيْهِمْ أَسْيَادُهُمْ قَدْرًا مِنَ الْمَالِ لِيَصِيرُوا أَحْرَارًا."},{"type":"p","text":"   (6) الْغَارِمُونَ هُمُ الْمَدِينُونَ الْعَاجِزُونَ عَنِ الْوَفَاءِ."},{"type":"p","text":"   (7) وَأَمَّا وَفِى سَبِيلِ اللَّهِ فَمَعْنَاهُ الْغُزَاةُ الْمُتَطَوِّعُونَ فِى سَبِيلِ اللَّهِ وَلَيْسَ كُلَّ عَمَلٍ خَيْرِىٍّ فَلا يَجُوزُ دَفْعُ الزَّكَاةِ لِبِنَاءِ الْمُسْتَشْفَيَاتِ وَالْمَسَاجِدِ وَنَحْوِ ذَلِكَ."},{"type":"p","text":"   (8) ابْنُ السَّبِيلِ هُوَ الْمُسَافِرُ الَّذِى لَيْسَ مَعَهُ مَا يُوصِلُهُ إِلَى مَقْصِدِهِ."},{"type":"p","text":"شُرُوطُ الزَّكَاةِ"},{"type":"p","text":"شُرُوطُ الزَّكَاةِ قِسْمَانِ شُرُوطُ وُجُوبٍ وَشُرُوطُ صِحَّةٍ."},{"type":"p","text":"شُرُوطُ وُجُوبِهَا خَمْسَةٌ (1) الإِسْلامُ (2) وَالْحُرِّيَّةُ (3) وَالْمِلْكُ التَّامُّ (4) وَمُضِىُّ الْحَوْلِ فِى الْمَالِ الْحَوْلِىِّ (5) وَمِلْكُ النِّصَابِ وَهُوَ قَدْرٌ لا تَجِبُ الزَّكَاةُ إِذَا لَمْ يَبْلُغْهُ الْمَالُ وَيُزَادُ عَلَيْهَا السَّوْمُ فِى كَلَإٍ مُبَاحٍ لِلْمَاشِيَةِ."},{"type":"p","text":"وَشُرُوطُ صِحَّتِهَا هِىَ"},{"type":"p","text":"   (1) صَرْفُهَا لِمُسْتَحِقِّيهَا وَهُمُ الأَصْنَافُ الثَّمَانِيَةُ الَّذِينَ مَرَّ ذِكْرُهُمُ."},{"type":"p","text":"   (2) وَصَرْفُهَا لِمُسْلِمٍ وَلا يَصِحُّ دَفْعُهَا لِكَافِرٍ."},{"type":"p","text":"   (3) وَدَفْعُهَا لِحُرٍّ فَلا يَجُوزُ دَفْعُهَا لِلرَّقِيقِ إِلَّا الْمُكَاتَبِ."},{"type":"p","text":"   (4) وَأَنْ لا يَكُونَ ءَاخِذُهَا مِنْ بَنِى هَاشِمٍ أَوْ بَنِى الْمُطَّلِبِ. فَالْمَنْسُوبُ لِلرَّسُولِ ﷺ لا يَجُوزُ لَهُ أَكْلُ مَالِ الزَّكَاةِ وَلَوْ كَانَ فَقِيرًا مِثْلُ ءَالِ مُنَيْمِنَةَ وَالْحُوتِ وَالشَّرِيفِ وَالْكَيَّالِى وَالْجِيلانِى وَالرِّفَاعِى وَالصَّيَّادِى وَكيوَان وَالْقَادِرِى وَالْكَيْلانِى وَغَيْرِهِمْ كَثِير فَلْيُتَنَبَّهْ إِلَى ذَلِكَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً فِيهَا الأَمْرُ بِأَدَاءِ الزَّكَاةِ."},{"type":"p","text":"     (2) مَا مَعْنَى الزَّكَاةِ لُغَةً وَشَرْعًا."},{"type":"p","text":"     (3) فِى أَىِّ سَنَةٍ فَرَضَ اللَّهُ الزَّكَاةَ."},{"type":"p","text":"     (4) مَا هِىَ الأَشْيَاءُ الَّتِى تَجِبُ فِيهَا الزَّكَاةُ."},{"type":"p","text":"     (5) مَا هِىَ الأَنْعَامُ وَمَا مَعْنَى الزُّرُوعِ الْمُقْتَاتَةِ حَالَةَ الِاخْتِيَارِ."},{"type":"p","text":"     (6) مَا هُمَا النَّقْدَانِ."},{"type":"p","text":"     (7) مَا هِىَ زَكَاةُ الْفِطْرِ."},{"type":"p","text":"     (8) عَدِّدِ الْمُسْتَحِقِّينَ لِلزَّكَاةِ."},{"type":"p","text":"     (9) مَا مَعْنَى وَفِى سَبِيلِ اللَّهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسَ عَشَرَ"},{"type":"p","text":"الْحَجُّ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا﴾ [سُورَةَ ءَالِ عِمْرَان/97]."},{"type":"p","text":"الْحَجُّ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ وَهُوَ فَرْضٌ عَلَى الْمُكَلَّفِ الْحُرِّ الْمُسْتَطِيعِ وَكَذَلِكَ الْعُمْرَةُ فَيَجِبُ أَدَاؤُهُمَا فِى الْعُمُرِ مَرَّةً وَاحِدَةً وَيُسَنُّ تَكْرَارُهُمَا."},{"type":"p","text":"وَلِلْحَجِّ مَزِيَّةٌ وَهِىَ أَنَّهُ يُكَفِّرُ الذُّنُوبَ الْكَبَائِرَ وَالصَّغَائِرَ لِقَوْلِهِ ﷺ «مَنْ حَجَّ فَلَمْ يَرْفُثْ وَلَمْ يَفْسُقْ خَرَجَ مِنْ ذُنُوبِهِ كَيَوْمَ وَلَدَتْهُ أُمُّهُ» رَوَاهُ الْبُخَارِىُّ، بِشَرْطِ أَنْ تَكُونَ نِيَّتُهُ خَالِصَةً لِلَّهِ تَعَالَى وَأَنْ يَكُونَ الْمَالُ الَّذِى يَتَزَوَّدُهُ لِحَجِّهِ حَلالًا وَأَنْ يَحْفَظَ نَفْسَهُ مِنَ الْفُسُوقِ أَىْ مِنْ كَبَائِرِ الذُّنُوبِ والرَّفَثِ أَىِ الْجِمَاعِ وَمِمَّا يَدُلُّ عَلَى فَضْلِ الْحَجِّ أَنَّهُ جَمَعَ أَنْوَاعَ رِيَاضَةِ النَّفْسِ أَىْ تَهْذِيبِهَا فَفِيهِ إِنْفَاقُ مَالٍ وَجَهْدُ نَفْسٍ بِنَحْوِ الْجُوعِ وَالْعَطَشِ وَالسَّهَرِ وَاقْتِحَامِ مَهَالِكَ وَفِرَاقِ وَطَنٍ وَأَهْلٍ وَأَصْحَابٍ."},{"type":"p","text":"أَرْكَانُ الْحَجِّ والْعُمْرَةِ"},{"type":"p","text":"الأَرْكَانُ هِىَ مَا لا يَصِحُّ الْحَجُّ وَالْعُمْرَةُ إِلَّا بِهَا فَمَنْ تَرَكَ رُكْنًا لَمْ يَصِحَّ حَجُّهُ وَلا يُجْبَرُ تَرْكُهُ بِشَىْءٍ بَلْ لا بُدَّ مِنَ الإِتْيَانِ بِهِ."},{"type":"p","text":"وَأَرْكَانُ الْحَجِّ سِتَّةٌ هِىَ"},{"type":"p","text":"   (1) الإِحْرَامُ أَىْ نِيَّةُ الإِحْرَامِ فَيَقُولُ بِقَلْبِهِ مَثَلًا نَوَيْتُ الْحَجَّ وَأَحْرَمْتُ بِهِ لِلَّهِ تَعَالَى."},{"type":"p","text":"   (2) وَالْوُقُوفُ بِعَرَفَةَ وَلَوْ لَحْظَةً وَوَقْتُهُ مِنْ زَوَالِ شَمْسِ التَّاسِعِ مِنْ ذِى الْحِجَّةِ إِلَى طُلُوعِ فَجْرِ يَوْمِ الْعَاشِرِ أَىْ يَوْمِ الْعِيدِ."},{"type":"p","text":"   (3) وَالطَّوَافُ بِالْبَيْتِ سَبْعَةَ أَشْوَاطٍ أَىْ أَنْ يَدُورَ حَوْلَ الْكَعْبَةِ سَبْعَ مَرَّاتٍ جَاعِلًا الْبَيْتَ عَنْ يَسَارِهِ وَيَبْدَأَ بِالْحَجَرِ الأَسْوَدِ وَيُشْتَرَطُ لَهُ الطَّهَارَةُ مِنَ الْحَدَثَيْنِ وَسَتْرُ الْعَوْرَةِ."},{"type":"p","text":"   (4) وَالسَّعْىُ بَيْنَ الصَّفَا وَالْمَرْوَةِ سَبْعَ مَرَّاتٍ ولا يُشْتَرَطُ لَهُ طَهَارَةٌ."},{"type":"p","text":"وَيَبْدَأُ بِالصَّفَا وَينْتَهِى بِالْمَرْوَةِ."},{"type":"p","text":"   (5) وَالْحَلْقُ أَوِ التَّقْصِيرُ وَالْحَلْقُ هُوَ إِزَالَةُ شَعَرِ الرَأْسِ كُلِّهِ أَمَّا التَّقْصِيرُ فَيَحْصُلُ وَلَوْ بِقَصِّ ثَلاثِ شَعَرَاتٍ وَالنِّسَاءُ يُقَصِّرْنَ وَلا يَحْلِقْنَ."},{"type":"p","text":"   (6) وَالتَّرْتِيبُ فِى مُعْظَمِ الأَرْكَانِ فَيُقَدِّمُ الإِحْرَامَ عَلَى الْجَمِيعِ وَيُشْتَرَطُ تَأْخِيرُ الْحَلْقِ أَوِ التَّقْصِيرِ وَطَوَافِ الإِفَاضَةِ عَنِ الْوُقُوفِ بِعَرَفَةَ."},{"type":"p","text":"وَأَرْكَانُ الْعُمْرَةِ خَمْسَةٌ هِىَ"},{"type":"p","text":"   (1) الإِحْرَامُ وَهُوَ نِيَّةُ الدُّخُولِ فِى الْعُمْرَةِ فَيَقُولُ بِقَلْبِهِ مَثَلًا «نَوَيْتُ الْعُمْرَةَ وَأَحْرَمْتُ بِهَا لِلَّهِ تَعَالَى»."},{"type":"p","text":"   (2) وَالطَّوَافُ."},{"type":"p","text":"   (3) وَالسَّعْىُ."},{"type":"p","text":"   (4) وَالْحَلْقُ أَوِ التَّقْصِيرُ."},{"type":"p","text":"   (5) وَتَرْتِيبُ جَمِيعِ أَرْكَانِهَا عَلَى مَا هُوَ مَذْكُورٌ."},{"type":"p","text":"وَاجِبَاتُ الْحَجِّ وَالْعُمْرَةِ"},{"type":"p","text":"الْوَاجِبُ هُوَ مَا يَصِحُّ الْحَجُّ أَوِ الْعُمْرَةُ بِدُونِهِ وَلَكِنْ يُجْبَرُ تَرْكُهُ بِالدَّمِ وَفِى تَرْكِهِ عَمْدًا مَعْصِيَةٌ."},{"type":"p","text":"مِنْ وَاجِبَاتِ الْحَجِّ"},{"type":"p","text":"   (1) الإِحْرَامُ مِنَ الْمِيقَاتِ."},{"type":"p","text":"   (2) وَرَمْىُ الْجِمَارِ الثَّلاثِ الْجَمْرَةِ الصُّغْرَى وَالْجَمْرَةِ الْوُسْطَى وَجَمْرَةِ الْعَقَبَةِ بِسَبْعِينَ حَصَاةً."},{"type":"p","text":"   (3) وَالْمَبِيتُ بِمُزْدَلِفَةَ وَهُوَ مَكَانٌ قُرْبَ عَرَفَاتٍ يَأْخُذُ مِنْهُ الْحُجَّاجُ الْحَصَى لِلرَّجْمِ."},{"type":"p","text":"   (4) وَالْمَبِيتُ بِمِنًى وَهُوَ مَكَانٌ بَيْنَ مَكَّةَ وَعَرَفَاتٍ وَهُوَ أَقْرَبُ إِلَى مَكَّةَ."},{"type":"p","text":"   (5) وَطَوَافُ الْوَدَاعِ."},{"type":"p","text":"مَا يَجِبُ بِتَرْكِ الْوَاجِبِ"},{"type":"p","text":"يَجِبُ ذَبْحُ شَاةٍ عَلَى مَنْ تَرَكَ وَاجِبًا مِنْ وَاجِبَاتِ الْحَجِّ. وَمَنْ عَجَزَ عَنِ الذَّبْحِ صَامَ عَشْرَةَ أَيَّامٍ ثَلاثَةَ أَيَّامٍ فِى الْحَجِّ وَسَبْعَةً إِذَا رَجَعَ إِلَى أَهْلِهِ."},{"type":"p","text":"الْمُحَرَّمَاتُ عَلَى الْمُحْرِمِ بِالْحَجِّ أَوِ الْعُمْرَةِ"},{"type":"p","text":"وَمِنْ مُحَرَّمَاتِ الإِحْرَامِ شَيْئَانِ مُحَرَّمَانِ عَلَى الرَّجْلِ فَقَطْ وَهُمَا"},{"type":"p","text":"   (1) سَتْرُ رَأْسِهِ."},{"type":"p","text":"   (2) وَلُبْسُ مُحِيطٍ بِخِيَاطَةٍ أَوْ لِبْدٍ أَوْ نَحْوِهِ. "},{"type":"p","text":"وَيَحْرُمُ عَلَى الْمَرْأَةِ"},{"type":"p","text":"   (1) سَتْرُ وَجْهِهَا."},{"type":"p","text":"   (2) وَلُبْسُ قُفَّازٍ."},{"type":"p","text":"وَيَحْرُمُ عَلَى كُلٍّ مِنَ الرَّجُلِ وَالْمَرْأَةِ فِى حَالِ الإِحْرَامِ"},{"type":"p","text":"   (1) التَّطَيُّبُ."},{"type":"p","text":"   (2) وَدَهْنُ الرَّأْسِ وَاللِّحْيَةِ بِمَا يُسَمَّى دُهْنًا كَالزَّيْتِ وَنَحْوِهِ."},{"type":"p","text":"   (3) وَإِزَالَةُ الشَّعَرِ وَتَقْلِيمُ الأَظْفَارِ."},{"type":"p","text":"   (4) وَعَقْدُ الزِّوَاجِ."},{"type":"p","text":"   (5) وَصَيْدُ مَأْكُولٍ بَرِّىٍّ وَحْشِىٍّ كَالْغَزَالِ وَالْحَمَامِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"   (1) عَلَى مَنْ يَجِبُ الْحَجُّ وَكَمْ مَرَّةً يَجِبُ فِى الْعُمُرِ."},{"type":"p","text":"   (2) مَا هِىَ مَزِيَّةُ الْحَجِّ وَاذْكُرِ الْحَدِيثَ."},{"type":"p","text":"   (3) عَدِّدْ أَرْكَانَ الْحَجِّ."},{"type":"p","text":"   (4) مَا مَعْنَى الإِحْرَامِ وَمَا هُوَ وَقْتُ الْوُقُوفِ بِعَرَفَةَ."},{"type":"p","text":"   (5) مَا مَعْنَى الْحَلْقِ وَالتَّقْصِيرِ. "},{"type":"p","text":"   (6) مَا هِىَ أَرْكَانُ الْعُمْرَةِ."},{"type":"p","text":"   (7) عَدِّدْ بَعْضَ وَاجِبَاتِ الْحَجِّ."},{"type":"p","text":"   (8) عَدِّدْ مَا يَحْرُمُ عَلَى الْمُحْرِمِ بِالْحَجِّ أَوِ الْعُمْرَةِ."},{"type":"p","text":""}],"paragraphCount":472,"wordCount":5207,"readingMinutes":29,"description":"المحتوى الكامل لـ فَصْلُ الْعِبَادَاتِ من الجزء الخامس، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الْخَامِسُ فَصْلُ الْعِبَادَاتِ فَصْلُ الْعِبَادَاتِ\nالدَّرْسُ الأَوَّلُ\nحُكْمُ الشَّرْعِ الْمُتَعَلِّقِ بِأَفْعَالِ الْمُكَلَّفِينَ\n\nالْحُكْمُ الشَّرْعِىُّ يَنْقَسِمُ إِلَى سَبْعَةِ أَقْسَامٍ\nالْوَاجِبُ وَالْمَنْدُوبُ وَالْحَرَامُ وَالْمَكْرُوهُ وَالْمُبَاحُ وَالصَّحِيحُ وَالْبَاطِلُ.\n   (1) الْوَاجِبُ وَيُسَمَى الْفَرْضَ وَهُوَ مَا يُثَابُ فَاعِلُهُ وَيُعَاقَبُ تَارِكُهُ وَيَنْقَسِمُ إِلَى قِسْمَيْنِ فَرْضُ عَيْنٍ وَفَرْضُ كِفَايَةٍ.\nفَرْضُ الْعَيْنِ هُوَ الْوَاجِبُ عَلَى كُلِّ مُكَلَّفٍ أَنْ يَتَعَلَّمَهُ أَوْ أَنْ يَتَعَلَّمَهُ وَيَفْعَلَهُ كَمَعْرِفَةِ اللَّهِ وَرَسُولِهِ وَأَدَاءِ الصَّلَوَاتِ الْخَمْسِ وَصَوْمِ رَمَضَانَ.\nفَرْضُ الْكِفَايَةِ هُوَ مَا إِذَا قَامَ بِهِ الْبَعْضُ سَقَطَ بِفِعْلِهُمُ الْفَرْضُ عَنِ الآخَرِينَ كَصَلاةِ الْجَمَاعَةِ وَحِفْظِ الْقُرْءَانِ وَالْقِيَامِ بِالصَّنَائِعِ النَّافِعَةِ الَّتِى تَحْتَاجُهَا الأُمَّةُ وَغَيْرِ ذَلِكَ مِنْ فُرُوضِ الْكِفَايَةِ.\n   (2) الْمَنْدُوبُ وَالسُّنَّةُ بِمَعْنًى وَاحِدٍ وَهُوَ مَا يُثَابُ فَاعِلُهُ وَلا يُعَاقَبُ تَارِكُهُ كَرَوَاتِبِ الصَّلَوَاتِ وَاسْتِعْمَالِ السِّوَاكِ وَنَحْوِ ذَلِكَ.\n   (3) الْحَرَامُ هُوَ مَا يُثَابُ تَارِكُهُ إِنْ تَرَكَهُ امْتِثَالًا لِأَمْرِ اللَّهِ تَعَالَى وَيُعَاقَبُ فَاعِلُهُ كَشُرْبِ الْخَمْرِ وَأَكْلِ الرِّبَا وَالْكَذِبِ وَالسَّرِقَةِ وَعُقُوقِ الْوَالِدَيْنِ وَغَيْرِهَا مِنَ الْمُحَرَّمَاتِ كَشُرْبِ الدُّخَانِ لِمَنْ يَضُرُّهُ.\n   (4) الْمَكْرُوهُ وَهُوَ مَا يُثَابُ تَارِكُهُ امْتِثَالًا وَلا يُعَاقَبُ فَاعِلُهُ كَالإِسْرَافِ بِمَاءِ الْوُضُوءِ أَوِ الغُسْلِ وَالأَكْلِ بِالْيَدِ الْيُسْرَى.\n   (5) الْمُبَاحُ وَهُوَ مَا لا يُثَابُ فَاعِلُهُ ولا يُعَاقَبُ تَارِكُهُ كَالتَّوَسُّعِ فِى اللِّبَاسِ وَالطَّعَامِ بِشَرْطِ أَنْ يَكُونَ حَلالًا وَكَلُبْسِ الصُّوفِ بَدَلَ الْقُطْنِ وَأَكْلِ الْحِمَّصِ بَدَلَ الْفُولِ مَثَلًا وَنَحْوِ ذَلِكَ.\n   (6) الصَّحِيحُ، الصَّحِيحُ مِنَ الْعِبَادَاتِ هُوَ مَا وَافَقَ شَرْعَ اللَّهِ فَاسْتَوْفَى الأَرْكَانَ وَالشُّرُوطَ.\n   (7) الْبَاطِلُ وَيُقَالُ لَهُ الْفَاسِدُ وَهُوَ ضِدُّ الصَّحِيحِ أَىْ مَا لَمْ يَسْتَوْفِ الشُّرُوطَ وَالأَرْكَانَ. وَلَوِ اسْتَوْفَى الأَرْكَانَ وَالشُّرُوطَ وَطَرَأَ عَلَيْهِ مَا يُفْسِدُهُ يُعَدُّ فَاسِدًا أَيْضًا.\n\n     أَسْئِلَةٌ\n     (1) إِلَى كَمْ قِسْمٍ يَنْقَسِمُ الْحُكْمُ الْشَرْعِىُّ.\n     (2) مَا هُوَ الْوَاجِبُ وَمَاذَا يُسَمَى أَيْضًا.\n     (3) كَمْ قِسْمًا يَنْقَسِمُ الْوَاجِبُ.\n     (4) مَا هُوَ فَرْضُ الْعَيْنِ أَعْطِ مِثَالًا.\n     (5) مَا هُوَ فَرْضُ الْكِفَايَةِ أَعْطِ مِثَالًا.\n     (6) مَا هُوَ الْمَنْدُوبُ أَعْطِ مِثَالًا.\n     (7) مَا هُوَ الْحَرَامُ أَعْطِ مِثَالًا.\n     (8) مَا هُوَ الْمَكْرُوهُ أَعْطِ مِثَالًا.\n     (9) مَا هُوَ الْمُبَاحُ أَعْطِ مِثَالًا.\n     (10) مَا هُوَ الصَّحِيحُ مِنَ الْعِبَادَاتِ.\n     (11) مَا هُوَ الْبَاطِلُ وَمَاذَا يُقَالُ لَهُ أَيْضًا.\n\n\nالدَّرْسُ الثَّانِى\nالطَّهَارَةُ عَنِ النَّجَاسَةِ\n\nالنَّجَاسَةُ مِنْهَا الْبَوْلُ وَالْغَائِطُ وَالدَّمُ وَالْقَيْحُ وَالْقَىْءُ وَالْخَمْرَةُ وَالْمَيْتَةُ سِوَى السَّمَكِ وَالْجَرَادِ وَالآدَمِىِّ وَكَذَلِكَ عَظْمُهَا وَشَعْرُهَا.\nوَتُقْسَمُ النَّجَاسَةُ إِلَى عَيْنِيَّةٍ وَحُكْمِيَّةٍ.\n   (1) النَّجَاسَةُ الْعَيْنِيَّةُ هِىَ النَّجَاسَةُ الَّتِى لَهَا لَوْنٌ أَوْ طَعْمٌ أَوْ رِيحٌ أَوْ بَقِىَ جِرْمُهَا.\nوَتَطْهُرُ النَّجَاسَةُ الْعَيْنِيَّةُ بِإِزَالَةِ عَيْنِهَا ثُمَّ بِصَبِّ الْمَاءِ الْمُطَهِّرِ عَلَى الْمَوْضِعِ الْمُتَنَجِّسِ فَإِذَا زَالَ اللَّوْنُ وَالطَّعْمُ وَالرِّيحُ أَصْبَحَ الْمَكَانُ طَاهِرًا.\n   (2) النَّجَاسَةُ الْحُكْمِيَّةُ هِىَ النَّجَاسَةُ الَّتِى زَالَتْ عَيْنُهَا وَطَعْمُهَا وَلَوْنُهَا وَرِيحُهَا لَكِنَّهَا لَمْ تُغْسَلْ بِالْمَاءِ.\nوَتُزَالُ النَّجَاسَةُ الْحُكْمِيَّةُ بِإِجْرَاءِ الْمَاءِ الْمُطَهِّرِ عَلَيْهَا فَلَوْ وَقَعَ بَوْلٌ عَلَى مَكَانٍ ثُمَّ جَفَّ فَذَهَبَتْ عَيْنُهُ وَانْقَطَعَ لَوْنُهُ وَرِيحُهُ وَطَعْمُهُ فَإِنَّهُ يَكْفِى صَبُّ الْمَاءِ عَلَى هَذَا الْمَكَانِ لِيَطْهُرَ عَنِ النَّجَاسَةِ.\nثُمَّ إِنْ كَانَتِ النَّجَاسَةُ نَجَاسَةً كَلْبِيَّةً أَوْ خِنْزِيرِيَّةً كَأَنْ مَسَّ شَخْصٌ بِيَدهِ الْمُبْتَلَّةِ كَلْبًا أَوْ خِنْزِيرًا أَوْ أَصَابَ رِيقُ الْكَلْبِ أَوِ الْخِنْزِيرِ شَيْئًا مِنْ جِسْمِهِ أَوْ ثَوْبِهِ فَتُزَالُ هَذِهِ النَّجَاسَةُ بِغَسْلِهَا سَبْعَ مَرَّاتٍ إِحْدَاهُنَّ مَمْزُوجَةٌ بِالتُّرَابِ الطَّهُورِ.\nفَائِدَةٌ. الْحَيَوَانَاتُ وَهِىَ حَيَّةٌ كُلُّهَا طَاهِرَةٌ إِلَّا الْكَلْبَ وَالِخنْزِيرَ وَمَا تَوَلَّدَ مِنْهُمَا أَوْ مِنْ أَحَدِهِمَا.  \n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ بَعْضَ الأَمْثِلَةِ عَنِ النَّجَاسَةِ.\n     (2) إِلَى كَمْ قِسْمٍ تُقْسَمُ النَّجَاسَةُ وَمَا هِىَ النَّجَاسَةُ الْعَيْنِيَّةُ.\n     (3) كَيْفَ تَطْهُرُ النَّجَاسَةُ الْعَيْنِيَّةُ.\n     (4) مَا هِىَ النَّجَاسَةُ الْحُكْمِيَّةُ وَكَيْفَ تُزَالُ.\n     (5) كَيْفَ تُزَالُ النَّجَاسَةُ الْكَلْبِيَّةُ أَوِ الْخِنْزِيرِيَّةُ.\n     (6) أَىُّ الْحَيَوَانَاتِ نَجِسَةٌ.\n\n\nالدَّرْسُ الثَّالِثُ\nالْوُضُوءُ الْفَرَائِضُ وَالسُّنَنُ\n\nالْوُضُوءُ شَرْطٌ مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ لِقَوْلِهِ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُؤُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ﴾ [سُورَةَ الْمَائِدَة/6]. \nوَلِلْوُضُوءِ فُرُوضٌ وَسُنَنٌ وَمُبْطِلاتٌ.\nفُرُوضُ الوُضُوءِ\nلِلْوُضُوءِ سِتَّةُ فُرُوضٍ لا يَصِحُّ بِدُونِ وَاحِدٍ مِنْهَا وَهِىَ\n   (1) النِّيَّةُ وَمَكَانُهَا الْقَلْبُ وَتَكُونُ مُقْتَرِنَةً بِغَسْلِ الْوَجْهِ فَيَقُولُ بِقَلْبِهِ نَوَيْتُ الْوُضُوءَ مَثَلًا.\n   (2) غَسْلُ الْوَجْهِ جَمِيعِهِ مِنْ مَنَابِتِ شَعَرِ الرَّأْسِ إِلَى الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ.\n   (3) غَسْلُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ وَالْمِرْفَقُ هُوَ مُجْتَمَعُ عَظْمَىِ السَّاعِدِ وَالْعَضُدِ.\n   (4) مَسْحُ الرَّأْسِ أَوْ بَعْضِهِ فَيَكْفِى مَسْحُ بَعْضِ الرَّأْسِ.\n   (5) غَسْلُ الرِّجْلَيْنِ مَعَ الْكَعْبَيْنِ وَالْكَعْبَانِ هُمَا الْعَظْمَانِ النَّاتِئَانِ عِنْدَ مِفْصَلِ السَّاقِ وَالْقَدَمِ.\n   (6) التَّرْتِيبُ أَىْ تَرْتِيبُ الْفَرَائِضِ كَمَا وَرَدَتْ بِحَيْثُ تَكُونُ النِّيَّةُ عِنْدَ غَسْلِ الْوَجْهِ أَوَلًا ثُمَّ غَسْلُ الْوَجْهِ ثُمَّ الْيَدَيْنِ ثُمَّ مَسْحُ بَعْضِ الرَّأْسِ ثُمَّ غَسْلُ الرِّجْلَيْنِ.\nسُنَنُ الْوضُوءِ\nوَهِىَ أَفْعَالٌ يَصِحُّ الْوُضُوءُ بِدُونِهَا وَلَكِنْ يَفُوتُ ثَوَابُهَا فَمَنْ تَرَكَ سُنَّةً مِنْ سُنَنِ الْوُضُوءِ صَحَّ وُضُوؤُهُ أَمَا مَنْ تَرَكَ فَرْضًا مِنْ فُرُوضِ الْوُضُوءِ فَلا يَصِحُّ وُضُوؤُهُ.\nفَمِنْ سُنَنِ الْوُضُوءِ\n   (1) التَّسْمِيَةُ أَىْ قَوْلُ بِسْمِ اللَّهِ.\n   (2) غَسْلُ الْكَفَّيْنِ إِلَى الْكُوعَيْنِ.\n   (3) اسْتِعْمَالُ السِّوَاكِ.\n   (4) الْمَضْمَضَةُ أَىْ إِجْرَاءُ الْمَاءِ فِى الْفَمِ.\n   (5) الِاسْتِنْشَاقُ أَىْ إِدْخَالُ الْمَاءِ إِلَى دَاخِلِ الأَنْفِ.\n   (6) مَسْحُ جَمِيعِ الرَّأْسِ.\n   (7) مَسْحُ الأُذُنَيْنِ ظَاهِرِهِمَا وَبَاطِنِهِمَا بِمَاءٍ جَدِيدٍ.\n   (8) تَخْلِيلُ أَصَابِعِ الْيَدَيْنِ وَالرِّجْلَيْنِ وَاللِّحْيَةِ الْكَثِيفَةِ.\n   (9) الْبَدْءُ بِالْيُمْنَى قَبْلَ الْيُسْرَى.\n   (10) التَّثْلِيثُ أَىْ غَسْلُ مَا يُغْسَلُ ثَلاثَ مَرَّاتٍ وَمَسْحُ مَا يُمْسَحُ ثَلاثَ مَرَّاتٍ.\n   (11) دَلْكُ الأَعْضَاءِ أَىْ إِمْرَارُ الْيَدِ عَلَى الْعُضْوِ الْمَغْسُولِ.\n   (12) الْمُوَالاةُ أَىْ غَسْلُ الْعُضْوِ قَبْلَ أَنْ يَجِفَّ الْمَاءُ عَنِ الْعُضْوِ الَّذِى قَبْلَهُ.\n   (13) اسْتِدَامَةُ النِّيَّةِ مِنْ أَوَّلِ الْعَمَلِ إِلَى ءَاخِرِهِ.\n   (14) التَّقْلِيلُ فِى مَاءِ الْوُضُوءِ كَمُدٍّ.\n   (15) الغُرُّ وَهُوَ الزِّيَادَةُ فِى غَسْلِ الْوَجْهِ عَلَى الْمَفْرُوضِ غَسْلُهُ مِنْ جَمِيعِ جَوَانِبِهِ. \n   (16) وَالتَّحْجِيلُ وَهُوَ الزِّيَادَةُ فِى غَسْلِ الْيَدَيْنِ والرِّجْلَيْنِ عَلَى الْمَفْرُوضِ غَسْلُهُ. \n   (17) وَيُسَنُّ أَنْ يَقُولَ بَعْدَ الِانْتِهَاءِ مِنَ الْوُضُوءِ أَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ اللَّهُمَّ اجْعَلْنِى مِنَ التَّوَّابِينَ وَاجْعَلْنِى مِنَ الْمُتَطَهِّرِينَ.\n\n     أَسْئِلَةٌ\n     (1) ما هِىَ الآيَةُ الَّتِى تَدُلُّ عَلَى فَرْضِيَّةِ الْوُضُوءِ.\n     (2) كَمْ هِىَ فُرُوضُ الْوُضُوءِ عَدِّدْهَا.\n     (3) أَيْنَ مَحَلُّ النِّيَّةِ وَمَتَى يَنْوِى الْوُضُوءَ.\n     (4) مَا هِىَ حُدُودُ الْوَجْهِ فِى الْوُضُوءِ.\n     (5) مَا هُوَ الْوَاجِبُ غَسْلُهُ فِى الْوُضُوءِ مِنَ الْيَدَيْنِ وَمَا هُوَ الْمِرْفَقُ.\n     (6) مَا هُوَ الْقَدْرُ الْوَاجِبُ فِى مَسْحِ الرَّأْسِ.\n     (7) مَا هُوَ الْوَاجِبُ فِى غَسْلِ الرِّجْلَيْنِ وَمَا هُمَا الْكَعْبَانِ.\n     (8) مَا مَعْنَى التَّرْتِيبِ فِى الْوُضُوءِ.\n     (9) عَدِّدْ بَعْضَ سُنَنِ الْوُضُوءِ.\n     (10) مَا مَعْنَى التَّسْمِيَةِ وَالْمَضْمَضَةِ.\n     (11) مَا مَعْنَى التَّثْلِيثِ وَالْمُوَالاةِ.\n     (12) مَا هُوَ الغُرُّ وَالتَّحْجِيلُ.\n     (13) مَاذَا يُسَنُّ أَنْ يَقُولَ الشَّخْصُ بَعْدَ الِانْتِهَاءِ مِنَ الْوُضُوءِ.\nالدَّرْسُ الرَّابِعُ\nمُبْطِلاتُ الْوُضُوءِ\n\nمُبْطِلاتُ الْوُضُوءِ هِىَ الأُمُورُ الَّتِى إِذَا حَصَلَتْ لِلْمُتَوَضِّئِ يَنْتَقِضُ وُضُوؤُهُ وَلا يَصِحُّ أَنْ يُصَلِّىَ إِلَّا بَعْدَ أَنْ يَتَوَضَّأَ وُضُوءًا جَدِيدًا وَهِىَ \nخُرُوجُ شَىْءٍ مِنْ أَحَدِ السَّبِيلَيْنِ أَىِ الْقُبُلِ أَوِ الدُّبُرِ كَخُرُوجِ الْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ أَوِ الْحَصَى أَوِ الدُّودِ أَوِ غَيْرِ ذَلِكَ.\nوَمَسُّ الْقُبُلِ أَوِ الدُّبُرِ بِبَطْنِ الْكَفِّ بِلا حَائِلٍ.\nوَلَمْسُ بَشَرَةِ الأَجْنَبِيَّةِ الَّتِى تُشْتَهَى بِلا حَائِلٍ.\nوَزَوَالُ الْعَقْلِ بِجُنُونٍ أَوْ إِغمَاءٍ أَوْ سُكْرٍ.\nوَالنَّوْمُ عَلَى غَيْرِ هَيْئَةِ الْمُتَمَكِّنِ فَمَنْ نَامَ مُمَكِّنًا مَقْعَدَتَهُ بِحَيْثُ لا يَكُونُ بَيْنَ دُبُرِهِ وَبَيْنَ الأَرْضِ تَجَافٍ لا يَنْتَقِضُ وُضُوؤُهُ.\nمَاذَا يَحْرُمُ عَلَى مَنِ انْتَقَضَ وُضُوؤُهُ\nمَنِ انْتَقَضَ وُضُوؤُهُ تَحْرُمُ عَلَيْهِ الصَّلاةُ صَلاةُ الْفَرْضِ وَالسُّنَّةِ وَالطَّوَافُ بِالْبَيْتِ إِنْ كَانَ طَوَافَ الْفَرْضِ أَوْ طَوَافَ التَّطَوُّعِ لِأَنَ الطَّوَافَ بِمَنْزِلَةِ الصَّلاةِ إِلَّا أَنَّهُ يَحِلُّ فِيهِ كَلامُ النَّاسِ.\nوَيَحْرُمُ أَيْضًا عَلَى مَنِ انْتَقَضَ وُضُوؤُهُ حَمْلُ الْمُصْحَفِ وَكَذَلِكَ مَسُّهُ أَىْ مَسُّ وَرَقِهِ وَجِلْدِهِ الْمُتَّصِلِ بِهِ إِلَّا لِضَرُورَةٍ.\nوَيَجوُزُ لِمَنِ انْتَقَضَ وُضُوؤُهُ قِرَاءَةُ الْقُرْءَانِ وَدُخُولُ الْمَسْجِدِ وَالْمُكْثُ فِيهِ.\n\n     أَسْئِلَةٌ\n     (1) مَنِ انْتَقَضَ وُضُوؤُهُ مَتَى يَصِحُّ أَنْ يُصَلِّىَ.\n     (2) مَا هِىَ مُبْطِلاتُ الْوُضُوءِ عَدِّدْهَا.\n     (3) مَا مَعْنَى السَّبِيلَيْنِ.\n     (4) مَاذَا يَحرُمُ عَلَى مَنِ انْتَقَضَ وُضُوؤُهُ.\n     (5) اذْكُرْ بَعْضَ مَا يَجُوزُ لِلْمُحْدِثِ فِعْلُهُ.\n\n\nالدَّرْسُ الْخَامِسُ\nالِاسْتِنْجَاءُ\n\nيَجِبُ الِاسْتِنْجَاءُ مِنْ كُلِّ نَجِسٍ رَطْبٍ خَارِجٍ مِنَ السَّبِيلَيْنِ كَالْبَوْلِ وَالْغَائِطِ.\nوَالِاسْتِنْجَاءُ يَكُونُ بِالْمَاءِ الْمُطَهِّرِ أَوْ بِالْقَالِعِ الطَّاهِرِ الْجَامِدِ غَيْرِ الْمُحْتَرَمِ كَالْحَجَرِ أَوِ الْوَرَقِ.\nالِاسْتِنْجَاءُ بِالْمَاءِ: يَصُبُّ الْمُسْتَنْجِى مِنَ الْغَائِطِ الْمَاءَ الْمُطَهِّرَ عَلَى مَخْرَجِ النَّجَاسَةِ وَيَدْلُكُ بِيَدِهِ الْيُسْرَى حَتَّى تَزُولَ النَّجَاسَةُ عَنِ الْمَخْرَجِ وَيَطْهُرَ الْمَحَلُّ.\nالِاسْتِنْجَاءُ بِالأَحْجَارِ: أَمَا لَوْ أَرَادَ اسْتِعْمَالَ الْقَالِعِ الطَّاهِرِ الْجَامِدِ غَيْرِ الْمُحْتَرَمِ كَالْحَجَرِ فَيَمْسَحُ الْمَخْرَجَ بِهِ ثَلاثَ مَسَحَاتٍ فإِنْ بَقِيَتِ النَّجَاسَةُ يَمْسَحُ مَرَّةً رَابِعَةً أَوْ أَكْثَرَ حَتَى يَنْقَى الْمَحَلُّ أَوْ يَمْسَحُ بِثَلاثِ وَرَقَاتٍ (مَنَادِيلَ وَرَقِيَّةٍ مَثَلًا) ثَلاثَ مَسَحَاتٍ أَوْ أَكْثَرَ حَتَى يَنْقَى الْمَحَلُّ وَلا يَكْفِى لِلِاسْتِنْجَاءِ بِغَيْرِ الْمَاءِ الْمَسْحُ مَرَّةً وَاحِدَةً حَتَى لَوْ حَصَلَ الإِنْقَاءُ.\nوَيُشْتَرَطُ لِلِاسْتِنْجَاءِ بِغَيْرِ الْمَاءِ أَنْ يَكُونَ\n   (1) قَبْلَ الْجَفَافِ فَلَوْ جَفَّ الْخَارِجُ وَجَبَ اسْتِعْمَالُ الْمَاءِ.\n   (2) وَقَبْلَ الِانْتِقَالِ فَلَوِ انْتَشَرَ الْخَارِجُ وَتَوَسَّعَ عَنِ الْمَوْضِعِ الَّذِى اسْتَقَرَّ فِيهِ وَجَبَ اسْتِعْمَالُ الْمَاءِ.\nوَيُسَنُّ الدُّخُولَ إِلَى الْخَلاءِ بِالرِّجْلِ الْيُسْرَى وَالْخُرُوجَ مِنْهُ بِالْيُمْنَى بِعَكْسِ الْمَسْجِدِ فَالْمَسْجِدُ يُسَنُّ دُخُولُهُ بِالرِّجْلِ الْيُمْنَى وَالْخُرُوجُ مِنْهُ بِالرِّجْلِ الْيُسْرَى.\n\nدُعَـاءٌ\nيُسَنُّ لِدَاخِلِ الْخَلاءِ أَنْ يَقُولَ «بِسْمِ اللَّهِ اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ الْخُبْثِ وَالْخَبَائِثِ» وَالْبَسْمَلَةُ سِتْرٌ لَهُ عَنْ أَعْيُنِ الْجِنِّ، وَيُسَنُّ أَنْ يَقُولَ إِذَا خَرَجَ «غُفْرَانَكَ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى».\n\n     أَسْئِلَةٌ\n     (1) مِمَّ يَجِبُ الِاسْتِنْجَاءُ.\n     (2) بِمَ يَكُونُ الِاسْتِنْجَاءُ.\n     (3) كَيْفَ يَسْتَنْجِى الشَّخْصُ مِنَ الْغَائِطِ بِالْمَاءِ.\n     (4) كَيْفَ يَسْتَنْجِى الشَّخْصُ بِالأَحْجَارِ.\n     (5) إِنْ مَسَحَ ثَلاثَ مَسَحَاتِ وَبَقِيَتِ النَّجَاسَةُ مَاذَا يَفْعَلُ.\n     (6) هَلْ يَكْفِى لِلِاسْتِنْجَاءِ بِغَيْرِ الْمَاءِ أَنْ يَمْسَحَ مَسْحَةً وَاحِدَةً.\n     (7) إِذَا جَفَّ الْخَارِجُ عَلَى الْمَخْرَجِ هَلْ يَكْفِى الِاسْتِنْجَاءُ بِالْمَاءِ.\n     (8) بِأَىِّ رِجْلٍ يُسَنُّ الدُّخُولُ إِلَى الْخَلاءِ وَبِأَىِّ رِجْلٍ يُسَنُّ الْخُرُوجُ مِنْهُ.\n\nالدَّرْسُ السَّادِسُ\nالْحَدَثُ وَالْغُسْلُ الْوَاجِبُ\n\nالْحَدَثُ نَوْعَانِ حَدَثٌ أَصْغَرُ وَحَدَثٌ أَكْبَرُ.\nالْحَدَثُ الأَصْغَرُ هُوَ حُصُولُ أَحَدِ الأَشْيَاءِ الَّتِى تَنْقُضُ الْوُضُوءَ كَخُرُوجِ الرِّيحِ أَوِ الْبَوْلِ أَوِ الْغَائِطِ أَوْ غَيْرِهَا مِنْ مُبْطِلاتِ الْوُضُوءِ.\nالْحَدَثُ الأَكْبَرُ وَهُوَ حُصُولُ أَحَدِ الأَشْيَاءِ الَّتِى تُوجِبُ الْغُسْلَ وَهِىَ خَمْسَةٌ خُرُوجُ الْمَنِىِّ وَالْجِمَاعُ وَالْحَيْضُ وَالنِّفَاسُ وَالْوِلادَةُ.\nوَتَتِمُّ الطَّهَارَةُ مِنَ الْحَدَثِ الأَكْبَرِ بِالْغُسْلِ وَلَهُ فُرُوضٌ وَسُنَنٌ.\n   فُرُوضُ الْغُسْلِ اثْنَانِ\n   (1) النِّيَّةُ عِنْدَ غَسْلِ أَوَّلِ جُزْءٍ مِنَ الْبَدَنِ كَأَنْ يَقُولَ بِقَلْبِهِ نَوَيْتُ الْغُسْلَ الْوَاجِبَ أَوْ نَوَيْتُ فَرْضَ الْغُسْلِ أَوْ نَوَيْتُ رَفْعَ الْحَدَثِ الأَكْبَرِ.\n   (2) وَتَعْمِيمُ جَمِيعِ الْبَدَنِ بِالْمَاءِ بَشَرًا وَشَعَرًا وَإِنْ كَثُفَ وَالْبَشَرُ هُوَ الْجِلْدُ وَيَجِبُ حَلُّ الضَّفَائِرِ الَّتِى لا يَصِلُ الْمَاءُ إِلَى بِاطِنِهَا إِلَّا بِحَلِّهَا.\n   سُنَنُ الْغُسْلِ وَهِىَ كَثِيرَةٌ مِنْهَا\n   (1) التَّسْمِيَةُ أَىْ قَوْلُ بِسْمِ اللَّهِ عِنْدَ بَدْءِ الْغُسْلِ.\n   (2) وَالْوُضُوءُ قَبْلَ الْغُسْلِ.\n   (3) وَالدَّلْكُ.\n   (4) وَالتَّيَامُنُ أَىِ الْبَدْءُ بِالشِّقِ الأَيْمَنِ.\n   (5) وَالتَّثْلِيثُ.\n   (6) وَالْمُوَالاةُ.\n   (7) وَتَعَهُّدُ الْمَعَاطِفِ كَمَعَاطِفِ الأُذُنَيْنِ.\n   الِاغْتِسَالاتُ الْمَسْنُونَةُ وَهِىَ الِاغْتِسَالاتُ الَّتِى يُثَابُ فَاعِلُهَا وَلا يُعَاقَبُ تَارِكُهَا وَمِنْهَا\nغُسْلُ الْجُمُعَةِ وَهُوَ ءَاكَدُهَا.\nوَغُسْلُ الْعِيدَيْنِ الْفِطْرِ وَالأَضْحَى.\nوَالْغُسْلُ مِنْ غَسْلِ الْمَيِّتِ.\nوَالْغُسْلُ لِلْمَجْنُونِ وَالْمُغْمَى عَلَيْهِ إِذَا أَفَاقَا.\nوَالْغُسْلُ لِلإِحْرَامِ بِالْحَجِّ أَوِ الْعُمْرَةِ.\nوَالْغُسْلُ لِدُخُولِ مَكَّةَ وَالْوُقُوفِ بِعَرَفَةَ وَالْمَبِيتِ بِمُزْدَلِفَةَ وَلِلطَّوَافِ.\n\n     أَسْئِلَةٌ\n     (1) كَمْ نَوْعًا الْحَدَثُ.\n     (2) مَا هُوَ الْحَدَثُ الأَصْغَرُ أَعْطِ مِثَالًا.\n     (3) مَا هُوَ الْحَدَثُ الأَكْبَرُ.\n     (4) مَا هِىَ الأُمُورُ الَّتِى تُوجِبُ الْغُسْلَ.\n     (5) كَيْفَ تَتِمُّ الطَّهَارَةُ مِنَ الْحَدَثِ الأَصْغَرِ وَمِنَ الْحَدَثِ الأَكْبَرِ.\n     (6) مَا هِىَ فُرُوضُ الْغُسْلِ.\n     (7) مَتَى يَجِبُ حَلُّ الْضَّفَائِرِ.\n     (8) اذْكُرْ بَعْضَ سُنَنِ الْغُسْلِ.\n     (9) مَا هِىَ الِاغْتِسَالاتُ الْمَسْنُونَةُ اذْكُرْ بَعْضَهَا.\n\nالدَّرْسُ السَّابِعُ\nمَوَاقِيتُ الصَّلاةِ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ الصَّلاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا﴾ [سُورَةَ النِّسَاء/103] الصَّلاةُ هِىَ أَفْضَلُ الأَعْمَالِ بَعْدَ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ وَقَدْ فَرَضَ اللَّهُ عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ خَمْسَ صَلَوَاتٍ فِى الْيَوْمِ وَاللَّيْلَةِ فَعَلَيْهِ أَنْ يُحَافِظَ عَلَيْهَا وَيَتَعَلَّمَ كَيْفَ يَدْخُلُ وَقْتُ كُلٍّ مِنْهَا وَكَيْفَ يَخْرُجُ. وَالصَّلَوَاتُ الْخَمْسُ مَعَ أَوْقَاتِهَا هِىَ \n   (1) صَلاةُ الظُّهْرِ وَيَبْدَأُ وَقْتُهَا مِنْ مَيْلِ الشَّمْسِ عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ وَيَنْتَهِى إِذَا صَارَ ظِلُّ الشَّىْءِ مِثْلَهُ زِيَادَةً عَلَى ظِلِّ الِاسْتِوَاءِ. وَالْمَقْصُودُ بِالشَّىْءِ مَا كَانَ كَالْوَتَدِ الْمَغْرُوسِ بِشَكْلٍ مُسْتَقِيمٍ فِى الأَرْضِ الْمُسْتَوِيَةِ، وَظِلُّ الِاسْتِوَاءِ هُوَ ظِلُّ الشَّىْءِ عِنْدَمَا تَكُونُ الشَّمْسُ فِى وَسَطِ السَّمَاءِ فَإِذَا وَقَفَ شَخْصٌ فِى مَكَانٍ مُشْمِسٍ وَالشَّمْسُ فِى وَسَطِ السَّمَاءِ يُلاحِظُ أَنَّ لَهُ ظِلًّا فَهَذَا الظِّلُّ هُوَ ظِلُّ الِاسْتِوَاءِ فإِذَا مَالَتِ الشَّمْسُ إِلَى جِهَةِ الْمَغْرِبِ يُلاحِظُ أَنَّ ظِلَّهُ يَطُولُ وَيَتَحَوَّلُ إِلَى جِهَةِ الْمَشْرِقِ وَهَذِهِ عَلامَةٌ عَلَى دُخُولِ وَقْتِ الظُّهْرِ.\n   (2) صَلاةُ الْعَصْرِ وَيَبْدَأُ وَقْتُهَا مِنْ بَعْدِ وَقْتِ الظُّهْرِ وَيَنْتَهِى إِذَا غَرَبَتِ الشَّمْسُ، فَإِذَا صَارَ طُولُ ظِلِّ الشَّىْءِ مِثْلَهُ زِيَادَةً عَلَى ظِلِّ الِاسْتِوَاءِ يَكُونُ قَدْ دَخَلَ وَقْتُ الْعَصْرِ وَانْتَهَى وَقْتُ الظُّهْرِ.\n   (3) صَلاةُ الْمَغْرِبِ وَيَبْدَأُ وَقْتُهَا مِنْ غُرُوبِ الشَّمْسِ أَىْ مَغِيبِ قُرْصِ الشَّمْسِ كُلِّهِ وَيَنْتَهِى بِمَغِيبِ الشَّفَقِ الأَحْمَرِ وَالشَّفَقُ الأَحْمَرُ هُوَ الِاحْمِرَارُ الَّذِى يَظْهَرُ فِى جِهَةِ الْمَغْرِبِ بَعْدَ مَغِيبِ الشَّمْسِ.\n   (4) صَلاةُ الْعِشَاءِ وَيَبْدَأُ وَقْتُهَا بِمَغِيبِ الشَّفَقِ الأَحْمَرِ وَيَنْتَهِى بِطُلُوعِ الْفَجْرِ.\n   (5) صَلاةُ الصُّبْحِ وَيَبْدَأُ وَقْتُهَا بِطُلُوعِ الْفَجْرِ الصَّادِقِ وَهُوَ بَيَاضٌ يَظْهَرُ مُعْتَرِضًا فِى الأُفُقِ الشَّرْقِىِّ وَيَنْتَهِى بِطُلُوعِ الشَّمْسِ. \nفَتَجِبُ هَذِهِ الصَّلَوَاتُ فِى أَوْقَاتِهَا عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ طَاهِرٍ، وَمَعْنَى طَاهِرٍ الْمَرْأَةُ الطَّاهِرُ مِنَ الْحَيْضِ وَالنِّفَاسِ. فَلا يَجُوزُ تَقْدِيمُ الصَّلاةِ عَلَى وَقْتِهَا أَوْ تَأْخِيرُهَا عَنْهُ لِغَيْرِ عُذْرٍ شَرْعِىٍّ كَالْمَرَضِ الشَّدِيدِ وَالسَّفَرِ بِشُرُوطِهِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى فَرْضِيَّةِ الصَّلاةِ.\n     (2) مَا هُوَ أَفْضَلُ الأَعْمَالِ بَعْدَ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ.\n     (3) كَمْ صَلاةً فَرَضَ اللَّهُ عَلَى الْمُؤْمِنِينَ.\n     (4) كَيْفَ يَبْدَأُ وَقْتُ الظُّهْرِ وَكَيْفَ يَنْتَهِى.\n     (5) مَا هُوَ ظِلُّ الِاسْتِوَاءِ.\n     (6) كَيْفَ يَبْدَأُ وَقْتُ الْعَصْرِ وَكَيْفَ يَنْتَهِى.\n     (7) كَيْفَ يَبْدَأُ وَقْتُ الْمَغْرِبِ وَكَيْفَ يَنْتَهِى.\n     (8) مَا هُوَ الشَّفَقُ الأَحْمَرُ.\n     (9) كَيْفَ يَبْدَأُ وَقْتُ الْعِشَاءِ وَكَيْفَ يَنْتَهِى.\n     (10) كَيْفَ يَبْدَأُ وَقْتُ الصُّبْحِ وَكَيْفَ يَنْتَهِى.\n     (11) مَا هُوَ الْفَجْرُ الصَّادِقُ.\n     (12) عَلَى مَنْ تَجِبُ الصَّلَوَاتُ الْخَمْسُ وَمَا مَعْنَى طَاهِرٍ.\n     (13) مَتَى يَجُوزُ تَقْدِيمُ الصَّلاةِ عَلَى وَقْتِهَا أَوْ تَأْخِيرُهَا عَنْهُ أَعْطِ مَثَلًا.\n\nالدَّرْسُ الثَّامِنُ\nأَرْكَانُ الصَّلاةِ وَسُنَنُهَا\n\nالصَّلاةُ لَهَا أَرْكَانٌ أَىْ فَرَائِضُ وَلَهَا سُنَنٌ فَالأَرْكَانُ هِىَ الأُمُورُ الَّتِى لا بُدَّ مِنْهَا لِصِحَّةِ الصَّلاةِ أَمَّا السُّنَنُ فَهِىَ الأَشْيَاءُ الَّتِى فِى فِعْلِهَا زِيَادَةُ ثَوَابٍ وَتَرْكُهَا لا يُبْطِلُ الصَّلاةَ وَلا مَعْصِيَةَ فِيهِ وَنَحْنُ نَفْعَلُهَا اقْتِدَاءً بِالرَّسُوِلِ ﷺ.\nأَرْكَانُ الصَّلاةِ سَبْعَةَ عَشَرَ\n   (1) النِّيَّةُ وَمَحَلُّهَا الْقَلْبُ فَيَنْوِى الْفَرْضِيَّةَ فِى صَلاةِ الْفَرْضِ ويُعَيِّنُ الصَّلاةَ إِنْ كَانَتْ إِحْدَى الصَّلَواتِ الْخَمْسِ أَوْ غَيْرَهَا.\n   (2) وَتَكْبِيرَةُ الإِحْرَامِ فَيَقُولُ بِحَيْثُ يُسْمِعُ نَفْسَهُ اللَّهُ أَكْبَرُ وَتَكُونُ النِّيَّةُ مُقْتَرِنَةً بِهَا.\n   (3) وَالْقِيَامُ فِى صَلاةِ الْفَرْضِ لِلْقَادِرِ فَإِنْ لَمْ يَسْتَطِعْ صَلَّى قَاعِدًا فَإِنْ لَمْ يَسْتَطِعْ صَلَّى مُضْطَجِعًا عَلَى جَنْبِهِ فَإِنْ لَمْ يَسْتَطِعْ صَلَّى مُسْتَلْقِيًا.\n   (4) وَقِرَاءَةُ الْفَاتِحَةِ وَتَجِبُ فِى كُلِّ رَكْعَةٍ بِالْبَسْمَلَةِ وَالتَّشْدِيدَاتِ الأَرْبَعَ عَشْرَةَ وَتَجِبُ مُوَالاتُهَا وَتَرْتِيبُهَا وَإِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا وَعدَمُ اللَّحْنِ الْمُخِلِّ بِالْمَعْنَى.\n   (5) وَالرُّكُوعُ بِأَنْ يَنْحَنِىَ بِحَيْثُ تَنَالُ رَاحَتَاهُ رُكْبَتَيْهِ.\n   (6) وَالطُّمَأْنِينَةُ فِيهِ بِقَدْرِ قَوْلِ سُبْحَانَ اللَّهِ وَالطُّمَأْنِينَةُ هِىَ سُكُونُ كُلِّ عَظْمٍ مَك

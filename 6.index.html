بَيْنَهُمْ مَنْ كَانَ رَذِيلًا أَوْ جَبَانًا."},{"type":"p","text":"وَالأَنْبِيَاءُ لا يُصَابُونَ بِالأَمْرَاضِ الْمُنَفِّرَةِ كَخُرُوجِ الدُّودِ مِنْ أَبْدَانِهِمْ وَنَحْوِ ذَلِكَ وَلا يُصَابُونَ بِالْجُنُونِ."},{"type":"p","text":"فَالأَنْبِيَاءُ عَلَيْهِمُ السَّلامُ"},{"type":"p","text":"مَوْصُوفُونَ بِالصِّدْقِ فَيَسْتَحِيلُ عَلَيْهِمُ الْكَذِبُ."},{"type":"p","text":"وَمَوْصُوفُونَ بِالْفَطَانَةِ فَيَسْتَحِيلُ عَلَيْهِمُ الْبَلادَةُ وَالْغَبَاوَةُ."},{"type":"p","text":"وَمَوْصُوفُونَ بِالأَمَانَةِ فَيَسْتَحِيلُ عَلَيْهِمُ الْخِيَانَةُ."},{"type":"p","text":"وَمَوْصُوفُونَ بِالْعِفَّةِ فَيَسْتَحِيلُ عَلَيْهِمُ الرَّذَالَةُ وَالسَّفَاهَةُ."},{"type":"p","text":"وَمَوْصُوفُونَ بِالشَّجَاعَةِ فَيَسْتَحِيلُ عَلَيْهِمُ الْجُبْنُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَنْ هُمْ أَفْضَلُ الْمَخْلُوقَاتِ اذْكُرْ ءَايَةً تَدُلُّ عَلَى ذَلِكَ."},{"type":"p","text":"     (2) اذْكُرْ بَعْضَ أَخْلاقِ الأَنْبِيَاءِ الْحَسَنَةِ."},{"type":"p","text":"     (3) مَا هِىَ الأَمْرَاضُ الَّتِى لا يُصَابُونَ بِهَا."},{"type":"p","text":"     (4) بِمَ يُوصَفُ الأَنْبِيَاءُ وَمَاذَا يَسْتَحِيلُ عَلَيْهِمْ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"الْفَرْقُ بَيْنَ الأَنْبِيَاءِ وَالرُّسُلِ عَلَيْهِمُ السَّلامُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَمَنْ يَكْفُرْ بِاللَّهِ وَمَلائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الآخِرِ فَقَدْ ضَلَّ ضَلالًا بَعِيدًا﴾ [سُورَةَ النِّسَاءِ/136]."},{"type":"p","text":"وَالْمُرَادُ بِالرِّسَالَةِ هُنَا مَا يَعُمُّ النُّبُوَّةَ ذَلِكَ لِأَنَّ الرُّسُلَ كُلَّهُمْ أَنْبِيَاءُ وَلَكِنْ لَيْسَ كُلُّ الأَنْبِيَاءِ رُسُلًا لِأَنَّ الرَّسُولَ هُوَ نَبِىٌّ أَوْحَى اللَّهُ إِلَيْهِ بِشَرْعٍ جَدِيدٍ أَىْ أَحْكَامٍ جَدِيدَةٍ يُعَلِّمُهَا لِلَّذِينَ أُرْسِلَ إِلَيْهِمْ أَمَّا النَّبِىُّ فَهُوَ الَّذِى أُوحِىَ إِلَيْهِ أَنْ يَعْمَلَ بِشَرْعِ الرَّسُولِ الَّذِى كَانَ قَبْلَهُ وَلَمْ يُوحَ إِلَيْهِ بِشَرْعٍ جَدِيدٍ."},{"type":"p","text":"قَالَ الْعُلَمَاءُ كُلُّ رَسُولٍ نَبِىٌّ وَلَيْسَ كُلُّ نَبِىٍّ رَسُولًا."},{"type":"p","text":"وَالأَنْبِيَاءُ وَالرُّسُلُ كُلُّهُمْ يُبَلِّغُونَ الدَّعْوَةَ إِلَى النَّاسِ."},{"type":"p","text":"وَلِهَذَا الأَمْرِ فَإِنَّ عَدَدَ الأَنْبِيَاءِ كَبِيرٌ جِدًا أَمَّا الرُّسُلُ فَعَدَدُهُمْ ثَلاثُمِائَةٍ وَثَلاثَةَ عَشَرَ رَسُولًا وَقَدْ وَرَدَ فِى الْقُرْءَانِ أَسْمَاءُ خَمْسَةٍ وَعِشْرِينَ نَبِيًّا هُمْ"},{"type":"p","text":"ءَادَمُ إِدْرِيسُ نُوحٌ هُودٌ صَالِحٌ إِبْرَاهِيمُ إِسْمَاعِيلُ إِسْحاقُ يَعْقُوبُ لُوطٌ يُوسُفُ أَيُّوبُ شُعَيْبٌ مُوسَى هَارُونُ ذُو الْكِفْلِ دَاوُدُ سُلَيْمَانُ إِلْيَاسُ الْيَسَعُ يُونُسُ زَكَرِيَّا يَحْيَى عِيسَى مُحَمَّدٌ   "},{"type":"p","text":"صَلَّى اللَّهُ عَلَيْهِمْ أَجْمَعِينَ وَسَلَّمَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى وُجُوبِ الإِيـمَانِ بِالرُّسُلِ."},{"type":"p","text":"     (2) مَا الْمُرَادُ بِالرِّسَالَةِ فِى الآيَةِ السَّابِقَةِ."},{"type":"p","text":"     (3) مَا الْفَرْقُ بَيْنَ الرُّسُلِ وَالأَنْبِيَاءِ."},{"type":"p","text":"     (4) مَنْ هُوَ الرَّسُولُ وَمَنْ هُوَ النَّبِىُّ."},{"type":"p","text":"     (5) مَا هِىَ وَظِيفَةُ الأَنْبِيَاءِ وَالرُّسُلِ."},{"type":"p","text":"     (6) اذْكُرْ أَسْمَاءَ الأَنْبِيَاءِ الَّذِينَ وَرَدَ ذِكْرُهُمْ فِى الْقُرْءَانِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"الْفَرْقُ بَيْنَ الْمُعْجِزَةِ وَالسِّحْرِ"},{"type":"p","text":""},{"type":"p","text":"خَلَقَ اللَّهُ تَعَالَى الإِنْسَانَ وَجَعَلَ لَهُ عَقْلًا يُمَيِّزُ بِهِ الْحَسَنَ مِنَ الْقَبِيحِ وَأَرْسَلَ أَنْبِيَاءَهُ لِيُرْشِدُوهُمْ إِلَى طَرِيقِ النَّجَاةِ وَلَكِنَّ كَثِيرًا مِنَ النَّاسِ يُعَانِدُونَ عَنْ قَبُولِ الْحَقِّ فَلا يَسْتَعْمِلُونَ عُقُولَهُمْ لِمَا خُلِقَتْ لَهُ."},{"type":"p","text":"وَقَدْ أَيَّدَ اللَّهُ تَعَالَى رُسُلَهُ الْكِرَامَ بِالْمُعْجِزَاتِ وَالْمُعْجِزَةُ هِىَ أَمْرٌ خَارِقٌ لِلْعَادَةِ أَىْ عَلَى خِلافِ الأَشْيَاءِ الَّتِى يَعْتَادُهَا النَّاسُ وَهِىَ تَحْصُلُ عَلَى يَدِ الأَنْبِيَاءِ وَتُوَافِقُ دَعْوَاهُمْ وَلا يَسْتَطِيعُ أَحَدٌ مِنَ النَّاسِ أَنْ يُعَارِضَهَا بِالْمِثْلِ كَخُرُوجِ الْمَاءِ مِنْ بَيْنِ أَصَابِعِ النَّبِىِّ مُحَمَّدٍ وَانْقِلابِ الْعَصَا ثُعْبَانًا لِسَيِّدِنَا مُوسَى."},{"type":"p","text":"وَالْمُعْجِزَةُ لَيْسَتْ سِحْرًا لِأَنَّ السِّحْرَ يُتَوَصَّلُ إِلَيْهِ بِالتَّعَلُّمِ وَالْمُمَارَسَةِ وَيُعَارَضُ بِسِحْرٍ مِثْلِهِ أَىْ قَدْ يَأْتِى سَاحِرٌ بِسِحْرٍ أَقْوَى فَلِذَلِكَ ءَامَنَ سَحَرَةُ فِرْعَوْنَ بِمُوسَى رَسُولًا مِنْ عِنْدِ اللَّهِ لَمَّا انْقَلَبَتْ عَصَاهُ ثُعْبَانًا حَقِيقِيًّا وَابْتَلَعَتْ حِبَالَهُمْ وَعِصِيَّهُمْ الَّتِى خُيِّلَ لِلنَّاسِ أَنَّهَا حَيَّاتٌ لِأَنَّهُمْ عَلِمُوا أَنَّ ذَلِكَ لَيْسَ سِحْرًا."},{"type":"p","text":"وَالسِّحْرُ فِعْلُهُ مِنْ كَبَائِرِ الذُّنُوبِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"   (1) لِمَ خَلَقَ اللَّهُ لِلإِنْسَانِ عَقْلًا وَلِمَ أَرْسَلَ الأَنْبِيَاءَ."},{"type":"p","text":"   (2) بِمَ أَيَّدَ اللَّهُ تَعَالَى رُسُلَهُ الْكِرَامَ وَمَا هِىَ الْمُعْجِزَةُ."},{"type":"p","text":"   (3) عَلَى يَدِ مَنْ تَحْصُلُ الْمُعْجِزَاتُ وَهَلْ يَسْتَطِيعُ أَحَدٌ أَنْ يُعَارِضَهَا بِالْمِثْلِ."},{"type":"p","text":"   (4) اذْكُرْ مُعْجِزَةً حَصَلَتْ لِلنَّبِىِّ مُحَمَّدٍ ﷺ وَأُخْرَى لِسَيِّدِنَا مُوسَى."},{"type":"p","text":"   (5) مَا الْفَرْقُ بَيْنَ الْمُعْجِزَةِ وَالسِّحْرِ."},{"type":"p","text":"   (6) مَا حُكْمُ فِعْلِ السِّحْرِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"الإِيـمَانُ بِمَا جَاءَ عَنْ سَيِّدِنَا مُحَمَّدٍ ﷺ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَمَا ءَاتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانْتَهُوا﴾ [سُورَةَ الْحَشْرِ/7]."},{"type":"p","text":"أَمَرَنَا اللَّهُ تَبَارَكَ وَتَعَالَى فِى هَذِهِ الآيَةِ بِاتِّبَاعِ الرَّسُولِ ﷺ فِيمَا أَمَرَنَا بِهِ وَاجْتِنَابِ مَا نَهَانَا عَنْهُ."},{"type":"p","text":"لِأَنَّ الرَّسُولَ صَادِقٌ فِى كُلِّ مَا يُبَلِّغُهُ عَنِ اللَّهِ تَعَالَى."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَمَا يَنْطِقُ عَنِ الْهَوَى إِنْ هُوَ إِلَّا وَحْىٌ يُوحَى﴾ [سُورَةَ النَّجْمِ]."},{"type":"p","text":"فَكُلُّ مَا أَخْبَرَ بِهِ الرَّسُولُ حَقٌّ وَصِدْقٌ سَوَاءٌ مَا كَانَ مِنْ أُمُورِ الْحَلالِ أَوِ الْحَرَامِ أَوْ كَانَ إِخْبَارًا عَمَّا مَضَى مِنْ قَصَصِ الأَنْبِيَاءِ أَوْ مَا سَيَحْصُلُ فِى الْمُسْتَقْبَلِ فِى الدُّنْيَا وَالآخِرَةِ."},{"type":"p","text":"وَمِمَّا أَخْبَرَ بِهِ الرَّسُولُ ﷺ عَذَابُ الْقَبْرِ لِلْكَافِرِينَ وَبَعْضِ عُصَاةِ الْمُسْلِمِينَ وَنَعِيمُ الْقَبْرِ لِلْمُؤْمِنِينَ الأَتْقِيَاءِ وَالْقِيَامَةُ وَالْحِسَابُ وَالثَّوَابُ وَالْعِقَابُ وَالْجَنَّةُ وَالنَّارُ وَغَيْرُهَا مِنَ الأُمُورِ. فَالْكُفَّارُ يُعَذَّبُونَ فِى قُبُورِهِمْ أَمَّا الْمُؤْمِنُونَ الصَّالِحُونَ فَإِنَّ اللَّهَ تَعَالَى يُنَوِّرُ قُبُورَهُمْ بِنُورٍ كَنُورِ الْقَمَرِ لَيْلَةَ الْبَدْرِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا الأَمْرُ بِاتِّبَاعِ النَّبِىِّ ﷺ."},{"type":"p","text":"     (2) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى صِدْقِ الرَّسُولِ فِيمَا بَلَّغَهُ عَنِ اللَّهِ."},{"type":"p","text":"     (3) عَدِّدْ بَعْضَ الأُمُورِ الَّتِى أَخْبَرَ عَنْهَا رَسُولُ اللَّهِ."},{"type":"p","text":"     (4) لِمَنْ يَحْصُلُ عَذَابُ الْقَبْرِ وَنَعِيمُهُ."},{"type":"p","text":"     (5) اذْكُرْ مِثَالًا عَنْ نَعِيمِ الْقَبْرِ لِلْمُؤْمِنِينَ الصَّالِحِينَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"الثَّوَابُ وَالْعِقَابُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الأَبْرَارَ لَفِى نَعِيمٍ وَإِنَّ الْفُجَّارَ لَفِى جَحِيمٍ﴾ [سُورَةَ الِانْفِطَارِ]."},{"type":"p","text":"يَجِبُ الإِيـمَانُ بِأَنَّ اللَّهَ تَعَالَى يُثِيبُ الْمُؤْمِنِينَ عَلَى مَا فَعَلُوهُ مِنْ عَمَلٍ صَالِحٍ وَيُعَذِّبُ الْكُفَّارَ عَلَى مَا اقْتَرَفُوهُ مِنْ كُفْرٍ وَذُنُوبٍ وَكَذَلِكَ يُعَذِّبُ مَنْ شَاءَ مِنْ عُصَاةِ الْمُسْلِمِينَ يَوْمَ الْقِيَامَةِ وَهُوَ يَوْمُ الْحِسَابِ."},{"type":"p","text":"فَالثَّوَابُ هُوَ مَا يَنَالُهُ الْمُؤْمِنُ فِى الآخِرَةِ مِمَّا يَسُرُّهُ كَالشُّرْبِ مِنْ حَوْضِ النَّبِىِّ ﷺ وَاجْتِيَازِ الصِّرَاطِ وَدُخُولِ الْجَنَّةِ حَيْثُ النَّعِيمُ الْمُقِيمُ."},{"type":"p","text":"أَمَّا الْعَذَابُ فَهُوَ مَا يَسُوءُ الْعَبْدَ يَوْمَ الْقِيَامَةِ كَتَعَرُّضِ الْكُفَّارِ لِحَرِّ الشَّمْسِ وَدُخُولِهِمْ إِلَى جَهَنَّمَ حَيْثُ الْعَذَابُ الْمُقِيمُ. وَيَدْخُلُهَا أَيْضًا بَعْضُ عُصَاةِ الْمُسْلِمِينَ الَّذِينَ مَاتُوا بِلا تَوْبَةٍ وَلَمْ يَغْفِرِ اللَّهُ لَهُمْ فَيُعَذَّبُونَ فِى النَّارِ فَتْرَةً ثُمَّ بَعْدَ ذَلِكَ يُخْرِجُهُمُ اللَّهُ وَيُدْخِلُهُمُ الْجَنَّةَ لِأَنَّهُمْ مَاتُوا عَلَى الإِيـمَانِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى الثَّوَابِ وَالْعِقَابِ يَوْمَ الْقِيَامَةِ."},{"type":"p","text":"     (2) مَا مَعْنَى الإِيـمَانِ بِالثَّوَابِ وَالْعِقَابِ."},{"type":"p","text":"     (3) مَا هُوَ يَوْمُ الْقِيَامَةِ."},{"type":"p","text":"     (4) مَا هُوَ الثَّوَابُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (5) مَا هُوَ الْعَذَابُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (6) مَاذَا يَحْصُلُ لِبَعْضِ عُصَاةِ الْمُسْلِمِينَ يَوْمَ الْقِيَامَةِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"نَعِيمُ الآخِرَةِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الَّذِينَ ءَامَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتُ النَّعِيمِ﴾ [سُورَةَ لُقْمَان/8]."},{"type":"p","text":"وَعَدَ اللَّهُ عِبَادَهُ الْمُؤْمِنِينَ الَّذِينَ أَدَّوِا الْوَاجِبَاتِ وَاجْتَنَبُوا الْمُحَرَّمَاتِ جَنَّاتٍ وَاسِعَةً فِيهَا نَعِيمٌ دَائِمٌ لا يَفْنَى وَلا يَزُولُ فِيهَا أَنْهَارٌ وَاسِعَةٌ نَهْرٌ مِنْ لَبَنٍ وَنَهْرٌ مِنْ عَسَلٍ وَنَهْرٌ مِنْ مَاءٍ وَنَهْرٌ مِنْ خَمْرٍ لا يُسْكِرُ لَيْسَ كَخَمْرِ الدُّنْيَا وَفِيهَا رَوَائِحُ عَطِرَةٌ وَفِيهَا أَشْجَارٌ جَمِيلَةٌ وَقُصُورٌ كَبِيرَةٌ."},{"type":"p","text":"وَالْمُؤْمِنُونَ فِى الْجَنَّةِ فِى عُمُرٍ وَاحِدٍ فِى سِنِّ ثَلاثٍ وَثَلاثِينَ سَنَةً حَتَّى مَنْ مَاتَ هَرِمًا أَوْ طِفْلًا يُصْبِحُ بِهَذَا الْعُمُرِ."},{"type":"p","text":"وَكُلُّهُمْ جَمِيلُو الشَّكْلِ بِطُولِ سَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ."},{"type":"p","text":"وَكُلُّ مَنْ دَخَلَ الْجَنَّةَ لا يَمُوتُ وَلا يَمْرَضُ وَلا يَحْزَنُ وَلا يَهْرَمُ وَلا يَتْعَبُ. وَالْجَنَّةُ فَوْقَ السَّمَاءِ السَّابِعَةِ وَالْعَرْشُ سَقْفُهَا لا يَدْخُلُهَا الْكُفَّارُ أَبَدًا وَهِىَ بَاقِيَةٌ لا تَفْنَى وَلا يَفْنَى أَهْلُهَا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى أَنَّ اللَّهَ أَعَدَّ لِلْمُؤْمِنِينَ جَنَّاتِ النَّعِيمِ."},{"type":"p","text":"     (2) بِمَ وَعَدَ اللَّهُ عِبَادَهُ الْمُؤْمِنِينَ الصَّالِحِينَ."},{"type":"p","text":"     (3) عَدِّدْ بَعْضَ نَعِيمِ الْجَنَّةِ."},{"type":"p","text":"     (4) كَمْ هُوَ عُمُرُ أَهْلِ الْجَنَّةِ."},{"type":"p","text":"     (5) كَمْ هُوَ طُولُ أَهْلِ الْجَنَّةِ."},{"type":"p","text":"     (6) أَيْنَ تُوجَدُ الْجَنَّةُ وَمَا هُوَ سَقْفُهَا."},{"type":"p","text":"     (7) مَنْ لا يَدْخُلُ الْجَنَّةَ أَبَدًا."},{"type":"p","text":""}],"paragraphCount":161,"wordCount":1878,"readingMinutes":11,"description":"المحتوى الكامل لـ فَصْلُ الْعَقَائِدِ من الجزء الرابع، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الرَّابِعُ فَصْلُ الْعَقَائِدِ فَصْلُ الْعَقَائِدِ\n\nالدَّرْسُ الأَوَّلُ\nالشَّهَادَتَانِ\n\nالشَّهَادَتَانِ هُمَا أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ ﷺ.\nفَيَجِبُ عَلَى مَنْ أَرَادَ الدُّخُولَ فِى دِينِ الإِسْلامِ النُّطْقُ بِالشَّهَادَتَيْنِ فَوْرًا بِنِيَّةِ الدُّخُولِ فِى الإِسْلامِ مَعَ اعْتِقَادِ مَعْنَاهُمَا.\nوَمَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ أَعْتَقِدُ بِقَلْبِى وَأَعْتَرِفُ بِلِسَانِى أَنْ لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ أَىْ لا أَحَدَ يَسْتَحِقُّ أَنْ أَتَذَلَّلَ لَهُ نِهَايَةَ التَّذَلُّلِ إِلَّا اللَّهُ تَعَالَى.\nوَمَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ ﷺ أَعْتَقِدُ بِقَلْبِى وَأَعْتَرِفُ بِلِسَانِى أَنَّ سَيِّدَنَا مُحَمَّدَ ابْنَ عَبْدِ اللَّهِ بنِ عَبْدِ الْمُطَّلِبِ بنِ هَاشِمِ بنِ عَبْدِ مَنَافٍ الْقُرَشِىَّ عَبْدُ اللَّهِ وَرَسُولُهُ مُرْسَلٌ إِلَى جَمِيعِ الْخَلْقِ مِنْ إِنْسٍ وَجِنٍّ وَعَرَبٍ وَعَجَمٍ وَهُوَ مِنْ قَبِيلَةِ قُرَيْشٍ أَشْرَفِ قَبَائِلِ الْعَرَبِ وُلِدَ بِمَكَّةَ وَبُعِثَ بِهَا أَىْ نَزَلَ عَلَيْهِ الْوَحْىُ وَهُوَ بِمَكَّةَ بِغَارِ حِرَاءٍ وَهَاجَرَ إِلَى الْمَدِينَةِ وَدُفِنَ فِيهَا وَهُوَ خَاتَمُ الأَنْبِيَاءِ وَالْمُرْسَلِينَ وَأَفْضَلُهُمْ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ. \nفَيَجِبُ التَّصْدِيقُ بِجَمِيعِ مَا أَخْبَرَ بِهِ وَبَلَّغَهُ عَنِ اللَّهِ تَعَالَى.\nقَالَ الإِمَامُ ذُو النُّونِ الْمِصْرِىُّ »مَهْمَا تَصَوَّرْتَ بِبَالِكَ فَاللَّهُ بِخِلافِ ذَلِكَ«.\n\n     أَسْئِلَةٌ\n     (1) مَاذَا يَجِبُ عَلَى مَنْ أَرَادَ الدُّخُولَ فِى الإِسْلامِ.\n     (2) مَا مَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ.\n     (3) مَا مَعْنَى لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ.\n     (4) مَا مَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\n     (5) أَيْنَ وُلِدَ رَسُولُ اللَّهِ وَأَيْنَ بُعِثَ.\n     (6) إِلَى أَيْنَ هَاجَرَ وَأَيْنَ دُفِنَ.\n     (7) مِنْ أَىِّ قَبِيلَةٍ هُوَ وَلِمَنْ هُوَ مُرْسَلٌ.\n\nالدَّرْسُ الثَّانِى\nأَوَّلُ الْوَاجِبَاتِ\n\nمَعْرِفَةُ اللَّهِ تَعَالَى وَمَعْرِفَةُ الرَّسُولِ\nقَالَ اللَّهُ تَعَالَى ﴿فَاعْلَمْ أَنَّهُ لا إِلَهَ إِلَّا اللَّهُ﴾ [سُورَةَ مُحَمَّدٍ/19].\nأَوَّلُ مَا يَجِبُ عَلَى الإِنْسَانِ مَعْرِفَةُ اللَّهِ وَمَعْرِفَةُ رَسُولِهِ ﷺ وَمَعْرِفَةُ اللَّهِ تَكُونُ بِمَعْرِفَةِ مَا يَجِبُ لِلَّهِ وَمَا يَسْتَحِيلُ عَلَى اللَّهِ وَمَا يَجُوزُ فِى حَقِّهِ. \nوَيَجِبُ لِلَّهِ صِفَاتُ الْكَمَالِ الَّتِى تَلِيقُ بِهِ كَالْعِلْمِ وَالْقُدْرَةِ وَالإِرَادَةِ وَيَسْتَحِيلُ عَلَيْهِ الْجَهْلُ وَالْعَجْزُ وَكُلُّ صِفَاتِ الْحُدُوثِ كَصِفَاتِ الْبَشَرِ وَيَجُوزُ فِى حَقِّهِ خَلْقُ الْمَخْلُوقَاتِ وَإِعْدَامُهَا.\nقَالَ رَسُولُ اللَّهِ ﷺ »أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ« رَوَاهُ الْبُخَارِىُّ.\nقَالَ الْغَزَالِىُّ »لا تَصِحُّ الْعِبَادَةُ إِلَّا بَعْدَ مَعْرِفَةِ الْمَعْبُودِ«.\nوَمَعْرِفَةُ الرَّسُولِ تَكُونُ بِمَعْرِفَةِ مَا يَجِبُ لَهُ وَمَا يَسْتَحِيلُ عَلَيْهِ وَمَا يَجُوزُ فِى حَقِّهِ.\nفَيَجِبُ لَهُ الصِّدْقُ وَالأَمَانَةُ وَالشَّجَاعَةُ وَالذَّكَاءُ وَتَبْلِيغُ الرِّسَالَةِ وَيَسْتَحِيلُ عَلَيْهِ الْكَذِبُ وَالْغِشُّ وَالْغَبَاوَةُ وَالْجُبْنُ وَالْكُفْرُ وَالْكَبَائِرُ وَصَغَائِرُ الْخِسَّةِ قَبْلَ أَنْ يُصْبِحَ نَبِيًّا وَبَعْدَ أَنْ صَارَ نَبِيًّا وَيَجُوزُ فِى حَقِّهِ الأَكْلُ وَالشُّرْبُ وَالنَّوْمُ وَالزِّوَاجُ وَنَحْوُ ذَلِكَ وَكَذَلِكَ جَمِيعُ الأَنْبِيَاءِ.\nالصِّفَاتُ الْوَاجِبَةُ لِلَّهِ\n(1) الْوُجُودُ (2) الْوَحْدَانِيَّةُ (3) الْقِدَمُ (4) الْبَقَاءُ (5) الْقِيَامُ بِالنَّفْسِ (6) الْقُدْرَةُ (7) الإِرَادَةُ (8) الْعِلْمُ (9) السَّمْعُ (10) الْبَصَرُ (11) الْحَيَاةُ (12) الْكَلامُ (13) الْمُخَالَفَةُ لِلْحَوَادِثِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ أَوَّلُ مَا يَجِبُ عَلَى الإِنْسَانِ.\n     (2) بِمَ تَكُونُ مَعْرِفَةُ اللَّهِ.\n     (3) مَاذَا يَجِبُ لِلَّهِ.\n     (4) مَاذَا يَسْتَحِيلُ عَلَى اللَّهِ وَمَاذَا يَجُوزُ فِى حَقِّهِ تَعَالَى.\n     (5) مَاذَا قَالَ الْغَزَالِىُّ.\n     (6) بِمَ تَكُونُ مَعْرِفَةُ الرَّسُولِ.\n     (7) مَاذَا يَجِبُ لِلأَنْبِيَاءِ.\n     (8) مَاذَا يَسْتَحِيلُ عَلَى الأَنْبِيَاءِ.\n     (9) مَاذَا يَجُوزُ عَلَى الأَنْبِيَاءِ.\n     (10) مَا هِىَ الصِّفَاتُ الْوَاجِبَةُ لِلَّهِ.\n\nالدَّرْسُ الثَّالِثُ\nالإِيـمَانُ وَالتَّقْوَى\n\nقَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا اتَّقُوا اللَّهَ وَلْتَنْظُرْ نَفْسٌ مَّا قَدَّمَتْ لِغَدٍ﴾ [سُورَةَ الْحَشْرِ/18].\nأَمَرَ اللَّهُ تَعَالَى الْمُؤْمِنِينَ فِى هَذِهِ الآيَةِ بِالتَّقْوَى.\nوَالتَّقْوَى هِىَ أَدَاءُ الْوَاجِبَاتِ وَاجْتِنَابُ الْمُحَرَّمَاتِ.\nوَأَوَّلُ وَأَفْضَلُ الْوَاجِبَاتِ هُوَ الإِيـمَانُ بِاللَّهِ وَرَسُولِهِ ثُمَّ بَعْدَ ذَلِكَ الصَّلاةُ وَالصِّيَامُ وَنَحْوُهُمَا.\nوَأَكْبَرُ الذُّنُوبِ وَأَشَدُّهَا هُوَ الْكُفْرُ بِاللَّهِ تَعَالَى وَهُوَ الذَّنْبُ الَّذِى لا يَغْفِرُهُ اللَّهُ تَعَالَى لِمَنْ مَاتَ عَلَيْهِ وَمَا سِوَاهُ مِنَ الذُّنُوبِ كَالسَّرِقَةِ وَشُرْبِ الْخَمْرِ وَأَكْلِ الرِّبَا يَغْفِرُهَا اللَّهُ لِمَنْ شَاءَ مِنْ عِبَادِهِ الْمُؤْمِنِينَ.\nقَالَ الإِمَامُ أَبُو جَعْفَرٍ الطَّحَاوِىُّ »وَمَنْ وَصَفَ اللَّهَ بِمَعْنًى مِنْ مَعَانِي الْبَشَرِ فَقَدْ كَفَرَ«.\nفَالَّذِينَ مَاتُوا عَلَى الإِيـمَانِ عَلَى قِسْمَيْنِ\nقِسْمٌ مَاتُوا عَلَى الإِيـمَانِ وَالتَّقْوَى فَهَؤُلاءِ لا عَذَابَ عَلَيْهِمْ فِى الْقَبْرِ وَلا فِى الآخِرَةِ.\nوَقِسْمٌ مَاتُوا عَلَى الإِيـمَانِ وَهُمْ مِنْ أَهْلِ الْكَبَائِرِ أَىْ كَانُوا يَتْرُكُونَ الصَّلاةَ وَالصِّيَامَ وَيَشْرَبُونَ الْخَمْرَةَ وَيَأْكُلُونَ لَحْمَ الْخِنْزِيرِ مَثَلًا فَهَؤُلاءِ مِنْهُمْ مَنْ يُسَامِحُهُمُ اللَّهُ وَيَغْفِرُ لَهُمْ وَلا يُعَذِّبُهُمْ أَىْ يَدْخُلُونَ الْجَنَّةَ بِلا عَذَابٍ وَلَكِنْ مَرْتَبَتُهُمْ دُونَ مَرْتَبَةِ الأَتْقِيَاءِ وَمِنْهُمْ مَنْ يُعَذِّبُهُمْ ثُمَّ يُدْخِلُهُمُ الْجَنَّةَ خَالِدِينَ فِيهَا.\n\n     أَسْئِلَةٌ\n     (1) مَا مَعْنَى التَّقْوَى.\n     (2) مَا هُوَ أَفْضَلُ الْوَاجِبَاتِ.\n     (3) مَا هُوَ أَكْبَرُ الذُّنُوبِ وَأَشَدُّهَا وَمَا هُوَ الذَّنْبُ الَّذِى لا يَغْفِرُهُ اللَّهُ لِمَنْ مَاتَ عَلَيْهِ.\n     (4) مَا سِوَى الْكُفْرِ مِنَ الذُّنُوبِ هَلْ يَغْفِرُهَا اللَّهُ تَعَالَى.\n     (5) الَّذِينَ مَاتُوا عَلَى الإِيـمَانِ عَلَى كَمْ قِسْمٍ.\n     (6) مَا هُوَ حَالُ الْمُؤْمِنِينَ الَّذِينَ مَاتُوا عَلَى الإِيـمَانِ وَالتَّقْوَى.\n     (7) مَا هُوَ حَالُ الْمُؤْمِنِينَ الَّذِينَ مَاتُوا وَهُمْ مِنْ أَهْلِ الْكَبَائِرِ.\n     (8) عَدِّدْ بَعْضَ الْمَعَاصِى الْكَبِيرَةِ.\n\nالدَّرْسُ الرَّابِعُ\nالإِسْلامُ دِينُ جَمِيعِ الأَنْبِيَاءِ\n\nقَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿وَمَنْ يَبْتَغِ غَيْرَ الإِسْلامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ﴾ [سُورَةَ ءَالِ عِمْرَان/85].\nوَقَالَ تَعَالَى أَيْضًا ﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلامُ﴾ [سُورَةَ ءَالِ عِمْرَان/19].\nفَالدِّينُ الْحَقُّ عِنْدَ اللَّهِ هُوَ الإِسْلامُ وَاتِّبَاعُهُ فِيهِ السَّعَادَةُ فِى الآخِرَةِ وَقَدْ أَرْسَلَ اللَّهُ الأَنْبِيَاءَ وَهُمْ رِجَالٌ صَادِقُونَ خَصَّهُمْ بِالنُّبُوةِ لِتَعْلِيمِ النَّاسِ عَقِيدَةَ الإِسْلامِ وَمَا فِيهِ مَصَالِحُ دِينِهِمْ وَدُنْيَاهُمْ.\nوَكُلُّ الأَنْبِيَاءِ مُسْلِمُونَ يُؤْمِنُونَ بِأَنَّ اللَّهَ وَاحِدٌ لا شَرِيكَ لَهُ أَوَّلُهُمْ ءَادَمُ وَءَاخِرُهُمْ مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى سَائِرِ إِخْوَانِهِ النَّبِيِّينَ وَسَلَّمَ أَمَّا شَرَائِعُهُمْ فَكَانَتْ تَخْتَلِفُ بَعْضُهَا عَنْ بَعْضٍ فَفِى شَرِيعَةِ عِيسَى وَمُوسَى عَلَيْهِمَا السَّلامُ كَانَ الْمُسْلِمُونَ يُصَلُّونَ صَلاتَيْنِ فِى الْيَوْمِ وَاللَّيْلَةِ أَمَّا فِى شَرِيعَةِ مُحَمَّدٍ ﷺ فَالْمُسْلِمُونَ يُصَلُّونَ خَمْسَ صَلَوَاتٍ فِى الْيَوْمِ وَاللَّيْلَةِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ الدِّينُ الْحَقُّ اذْكُرْ ءَايَةً تَدُلُّ عَلَى ذَلِكَ. \n     (2) لِمَ أَرْسَلَ اللَّهُ الأَنْبِيَاءَ.\n     (3) مَنْ هُمُ الأَنْبِيَاءُ مَنْ هُوَ أَوَّلُهُمْ وَمَنْ هُوَ ءَاخِرُهُمْ.\n     (4) اذْكُرْ ءَايَةً تَدُلُّ عَلَى كُفْرِ مَنْ يَتَّبِعُ غَيْرَ الإِسْلامِ.\n     (5) مَا هُوَ دِينُ كُلِّ الأَنْبِيَاءِ وَبِمَ يُؤْمِنُ كُلُّ الأَنْبِيَاءِ.\n     (6) هَلْ كَانَتْ شَرَائِعُ الأَنْبِيَاءِ تَخْتَلِفُ أَعْطِ مِثَالًا.\n\n\nالدَّرْسُ الْخَامِسُ\nصِفَاتُ الأَنْبِيَاءِ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَكُلًّا فَضَّلْنَا عَلَى الْعَالَمِينَ﴾ [سُورَةَ الأَنْعَامِ/86].\nالأَنْبِيَاءُ هُمْ أَفْضَلُ مَخْلُوقَاتِ اللَّهِ تَعَالَى وَهُمْ صَفْوَةُ الْبَشَرِ أَرْسَلَهُمُ اللَّهُ تَعَالَى لِيُبَلِّغُوا النَّاسَ مَصَالِحَ دِينِهِمْ وَدُنْيَاهُمْ فَهُمْ مَوْصُوفُونَ بِالأَخْلاقِ الْحَسَنَةِ وَالصِّفَاتِ الْحَمِيدَةِ.\nفَمِنْ أَخْلاقِهِمُ الْحَسَنَةِ أَنَّهُمْ كُلَّهُمْ صَادِقُونَ أَذْكِيَاءُ أُمَنَاءُ مَوْصُوفُونَ بِالْعِفَّةِ وَالشَّجَاعَةِ فَلَمْ يَكُنْ أَىٌّ مِنَ الأَنْبِيَاءِ كَذَّابًا أَوْ غَبِيًّا وَلَيْسَ بَيْنَهُمْ مَنْ يَخُونُ الأَمَانَةَ وَلَيْسَ بَيْنَهُمْ مَنْ كَانَ رَذِيلًا أَوْ جَبَانًا.\nوَالأَنْبِيَاءُ لا يُصَابُونَ بِالأَمْرَاضِ الْمُنَفِّرَةِ كَخُرُوجِ الدُّودِ مِنْ أَبْدَانِهِمْ وَنَحْوِ ذَلِكَ وَلا يُصَابُونَ بِالْجُنُونِ.\nفَالأَنْبِيَاءُ عَلَيْهِمُ السَّلامُ\nمَوْصُوفُونَ بِالصِّدْقِ فَيَسْتَحِيلُ عَلَيْهِمُ الْكَذِبُ.\nوَمَوْصُوفُونَ بِالْفَطَانَةِ فَيَسْتَحِيلُ عَلَيْهِمُ الْبَلادَةُ وَالْغَبَاوَةُ.\nوَمَوْصُوفُونَ بِالأَمَانَةِ فَيَسْتَحِيلُ عَلَيْهِمُ الْخِيَانَةُ.\nوَمَوْصُوفُونَ بِالْعِفَّةِ فَيَسْتَحِيلُ عَلَيْهِمُ الرَّذَالَةُ وَالسَّفَاهَةُ.\nوَمَوْصُوفُونَ بِالشَّجَاعَةِ فَيَسْتَحِيلُ عَلَيْهِمُ الْجُبْنُ.\n\n     أَسْئِلَةٌ\n     (1) مَنْ هُمْ أَفْضَلُ الْمَخْلُوقَاتِ اذْكُرْ ءَايَةً تَدُلُّ عَلَى ذَلِكَ.\n     (2) اذْكُرْ بَعْضَ أَخْلاقِ الأَنْبِيَاءِ الْحَسَنَةِ.\n     (3) مَا هِىَ الأَمْرَاضُ الَّتِى لا يُصَابُونَ بِهَا.\n     (4) بِمَ يُوصَفُ الأَنْبِيَاءُ وَمَاذَا يَسْتَحِيلُ عَلَيْهِمْ.\n\nالدَّرْسُ السَّادِسُ\nالْفَرْقُ بَيْنَ الأَنْبِيَاءِ وَالرُّسُلِ عَلَيْهِمُ السَّلامُ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَمَنْ يَكْفُرْ بِاللَّهِ وَمَلائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الآخِرِ فَقَدْ ضَلَّ ضَلالًا بَعِيدًا﴾ [سُورَةَ النِّسَاءِ/136].\nوَالْمُرَادُ بِالرِّسَالَةِ هُنَا مَا يَعُمُّ النُّبُوَّةَ ذَلِكَ لِأَنَّ الرُّسُلَ كُلَّهُمْ أَنْبِيَاءُ وَلَكِنْ لَيْسَ كُلُّ الأَنْبِيَاءِ رُسُلًا لِأَنَّ الرَّسُولَ هُوَ نَبِىٌّ أَوْحَى اللَّهُ إِلَيْهِ بِشَرْعٍ جَدِيدٍ أَىْ أَحْكَامٍ جَدِيدَةٍ يُعَلِّمُهَا لِلَّذِينَ أُرْسِلَ إِلَيْهِمْ أَمَّا النَّبِىُّ فَهُوَ الَّذِى أُوحِىَ إِلَيْهِ أَنْ يَعْمَلَ بِشَرْعِ الرَّسُولِ الَّذِى كَانَ قَبْلَهُ وَلَمْ يُوحَ إِلَيْهِ بِشَرْعٍ جَدِيدٍ.\nقَالَ الْعُلَمَاءُ كُلُّ رَسُولٍ نَبِىٌّ وَلَيْسَ كُلُّ نَبِىٍّ رَسُولًا.\nوَالأَنْبِيَاءُ وَالرُّسُلُ كُلُّهُمْ يُبَلِّغُونَ الدَّعْوَةَ إِلَى النَّاسِ.\nوَلِهَذَا الأَمْرِ فَإِنَّ عَدَدَ الأَنْبِيَاءِ كَبِيرٌ جِدًا أَمَّا الرُّسُلُ فَعَدَدُهُمْ ثَلاثُمِائَةٍ وَثَلاثَةَ عَشَرَ رَسُولًا وَقَدْ وَرَدَ فِى الْقُرْءَانِ أَسْمَاءُ خَمْسَةٍ وَعِشْرِينَ نَبِيًّا هُمْ\nءَادَمُ إِدْرِيسُ نُوحٌ هُودٌ صَالِحٌ إِبْرَاهِيمُ إِسْمَاعِيلُ إِسْحاقُ يَعْقُوبُ لُوطٌ يُوسُفُ أَيُّوبُ شُعَيْبٌ مُوسَى هَارُونُ ذُو الْكِفْلِ دَاوُدُ سُلَيْمَانُ إِلْيَاسُ الْيَسَعُ يُونُسُ زَكَرِيَّا يَحْيَى عِيسَى مُحَمَّدٌ   \nصَلَّى اللَّهُ عَلَيْهِمْ أَجْمَعِينَ وَسَلَّمَ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى وُجُوبِ الإِيـمَانِ بِالرُّسُلِ.\n     (2) مَا الْمُرَادُ بِالرِّسَالَةِ فِى الآيَةِ السَّابِقَةِ.\n     (3) مَا الْفَرْقُ بَيْنَ الرُّسُلِ وَالأَنْبِيَاءِ.\n     (4) مَنْ هُوَ الرَّسُولُ وَمَنْ هُوَ النَّبِىُّ.\n     (5) مَا هِىَ وَظِيفَةُ الأَنْبِيَاءِ وَالرُّسُلِ.\n     (6) اذْكُرْ أَسْمَاءَ الأَنْبِيَاءِ الَّذِينَ وَرَدَ ذِكْرُهُمْ فِى الْقُرْءَانِ.\n\nالدَّرْسُ السَّابِعُ\nالْفَرْقُ بَيْنَ الْمُعْجِزَةِ وَالسِّحْرِ\n\nخَلَقَ اللَّهُ تَعَالَى الإِنْسَانَ وَجَعَلَ لَهُ عَقْلًا يُمَيِّزُ بِهِ الْحَسَنَ مِنَ الْقَبِيحِ وَأَرْسَلَ أَنْبِيَاءَهُ لِيُرْشِدُوهُمْ إِلَى طَرِيقِ النَّجَاةِ وَلَكِنَّ كَثِيرًا مِنَ النَّاسِ يُعَانِدُونَ عَنْ قَبُولِ الْحَقِّ فَلا يَسْتَعْمِلُونَ عُقُولَهُمْ لِمَا خُلِقَتْ لَهُ.\nوَقَدْ أَيَّدَ اللَّهُ تَعَالَى رُسُلَهُ الْكِرَامَ بِالْمُعْجِزَاتِ وَالْمُعْجِزَةُ هِىَ أَمْرٌ خَارِقٌ لِلْعَادَةِ أَىْ عَلَى خِلافِ الأَشْيَاءِ الَّتِى يَعْتَادُهَا النَّاسُ وَهِىَ تَحْصُلُ عَلَى يَدِ الأَنْبِيَاءِ وَتُوَافِقُ دَعْوَاهُمْ وَلا يَسْتَطِيعُ أَحَدٌ مِنَ النَّاسِ أَنْ يُعَارِضَهَا بِالْمِثْلِ كَخُرُوجِ الْمَاءِ مِنْ بَيْنِ أَصَابِعِ النَّبِىِّ مُحَمَّدٍ وَانْقِلابِ الْعَصَا ثُعْبَانًا لِسَيِّدِنَا مُوسَى.\nوَالْمُعْجِزَةُ لَيْسَتْ سِحْرًا لِأَنَّ السِّحْرَ يُتَوَصَّلُ إِلَيْهِ بِالتَّعَلُّمِ وَالْمُمَارَسَةِ وَيُعَارَضُ بِسِحْرٍ مِثْلِهِ أَىْ قَدْ يَأْتِى سَاحِرٌ بِسِحْرٍ أَقْوَى فَلِذَلِكَ ءَامَنَ سَحَرَةُ فِرْعَوْنَ بِمُوسَى رَسُولًا مِنْ عِنْدِ اللَّهِ لَمَّا انْقَلَبَتْ عَصَاهُ ثُعْبَانًا حَقِيقِيًّا وَابْتَلَعَتْ حِبَالَهُمْ وَعِصِيَّهُمْ الَّتِى خُيِّلَ لِلنَّاسِ أَنَّهَا حَيَّاتٌ لِأَنَّهُمْ عَلِمُوا أَنَّ ذَلِكَ لَيْسَ سِحْرًا.\nوَالسِّحْرُ فِعْلُهُ مِنْ كَبَائِرِ الذُّنُوبِ.\n\n     أَسْئِلَةٌ\n   (1) لِمَ خَلَقَ اللَّهُ لِلإِنْسَانِ عَقْلًا وَلِمَ أَرْسَلَ الأَنْبِيَاءَ.\n   (2) بِمَ أَيَّدَ اللَّهُ تَعَالَى رُسُلَهُ الْكِرَامَ وَمَا هِىَ الْمُعْجِزَةُ.\n   (3) عَلَى يَدِ مَنْ تَحْصُلُ الْمُعْجِزَاتُ وَهَلْ يَسْتَطِيعُ أَحَدٌ أَنْ يُعَارِضَهَا بِالْمِثْلِ.\n   (4) اذْكُرْ مُعْجِزَةً حَصَلَتْ لِلنَّبِىِّ مُحَمَّدٍ ﷺ وَأُخْرَى لِسَيِّدِنَا مُوسَى.\n   (5) مَا الْفَرْقُ بَيْنَ الْمُعْجِزَةِ وَالسِّحْرِ.\n   (6) مَا حُكْمُ فِعْلِ السِّحْرِ.\n\nالدَّرْسُ الثَّامِنُ\nالإِيـمَانُ بِمَا جَاءَ عَنْ سَيِّدِنَا مُحَمَّدٍ ﷺ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَمَا ءَاتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانْتَهُوا﴾ [سُورَةَ الْحَشْرِ/7].\nأَمَرَنَا اللَّهُ تَبَارَكَ وَتَعَالَى فِى هَذِهِ الآيَةِ بِاتِّبَاعِ الرَّسُولِ ﷺ فِيمَا أَمَرَنَا بِهِ وَاجْتِنَابِ مَا نَهَانَا عَنْهُ.\nلِأَنَّ الرَّسُولَ صَادِقٌ فِى كُلِّ مَا يُبَلِّغُهُ عَنِ اللَّهِ تَعَالَى.\nقَالَ اللَّهُ تَعَالَى ﴿وَمَا يَنْطِقُ عَنِ الْهَوَى إِنْ هُوَ إِلَّا وَحْىٌ يُوحَى﴾ [سُورَةَ النَّجْمِ].\nفَكُلُّ مَا أَخْبَرَ بِهِ الرَّسُولُ حَقٌّ وَصِدْقٌ سَوَاءٌ مَا كَانَ مِنْ أُمُورِ الْحَلالِ أَوِ الْحَرَامِ أَوْ كَانَ إِخْبَارًا عَمَّا مَضَى مِنْ قَصَصِ الأَنْبِيَاءِ أَوْ مَا سَيَحْصُلُ فِى الْمُسْتَقْبَلِ فِى الدُّنْيَا وَالآخِرَةِ.\nوَمِمَّا أَخْبَرَ بِهِ الرَّسُولُ ﷺ عَذَابُ الْقَبْرِ لِلْكَافِرِينَ وَبَعْضِ عُصَاةِ الْمُسْلِمِينَ وَنَعِيمُ الْقَبْرِ لِلْمُؤْمِنِينَ الأَتْقِيَاءِ وَالْقِيَامَةُ وَالْحِسَابُ وَالثَّوَابُ وَالْعِقَابُ وَالْجَنَّةُ وَالنَّارُ وَغَيْرُهَا مِنَ الأُمُورِ. فَالْكُفَّارُ يُعَذَّبُونَ فِى قُبُورِهِمْ أَمَّا الْمُؤْمِنُونَ الصَّالِحُونَ فَإِنَّ اللَّهَ تَعَالَى يُنَوِّرُ قُبُورَهُمْ بِنُورٍ كَنُورِ الْقَمَرِ لَيْلَةَ الْبَدْرِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا الأَمْرُ بِاتِّبَاعِ النَّبِىِّ ﷺ.\n     (2) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ تَدُلُّ عَلَى صِدْقِ الرَّسُولِ فِيمَا بَلَّغَهُ عَنِ اللَّهِ.\n     (3) عَدِّدْ بَعْضَ الأُمُورِ الَّتِى أَخْبَرَ عَنْهَا رَسُولُ اللَّهِ.\n     (4) لِمَنْ يَحْصُلُ عَذَابُ الْقَبْرِ وَنَعِيمُهُ.\n     (5) اذْكُرْ مِثَالًا عَنْ نَعِيمِ الْقَبْرِ لِلْمُؤْمِنِينَ الصَّالِحِينَ.\n\nالدَّرْسُ التَّاسِعُ\nالثَّوَابُ وَالْعِقَابُ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ الأَبْرَارَ لَفِى نَعِيمٍ وَإِنَّ الْفُجَّارَ لَفِى جَحِيمٍ﴾ [سُورَةَ الِانْفِطَارِ].\nيَجِبُ الإِيـمَانُ بِأَنَّ اللَّهَ تَعَالَى يُثِيبُ الْمُؤْمِنِينَ عَلَى مَا فَعَلُوهُ مِنْ عَمَلٍ صَالِحٍ وَيُعَذِّبُ الْكُفَّارَ عَلَى مَا اقْتَرَفُوهُ مِنْ كُفْرٍ وَذُنُوبٍ وَكَذَلِكَ يُعَذِّبُ مَنْ شَاءَ مِنْ عُصَاةِ الْمُسْلِمِينَ يَوْمَ الْقِيَامَةِ وَهُوَ يَوْمُ الْحِسَابِ.\nفَالثَّوَابُ هُوَ مَا يَنَالُهُ الْمُؤْمِنُ فِى الآخِرَةِ مِمَّا يَسُرُّهُ كَالشُّرْبِ مِنْ حَوْضِ النَّبِىِّ ﷺ وَاجْتِيَازِ الصِّرَاطِ وَدُخُولِ الْجَنَّةِ حَيْثُ النَّعِيمُ الْمُقِيمُ.\nأَمَّا الْعَذَابُ فَهُوَ مَا يَسُوءُ الْعَبْدَ يَوْمَ الْقِيَامَةِ كَتَعَرُّضِ الْكُفَّارِ لِحَرِّ الشَّمْسِ وَدُخُولِهِمْ إِلَى جَهَنَّمَ حَيْثُ الْعَذَابُ الْمُقِيمُ. وَيَدْخُلُهَا أَيْضًا بَعْضُ عُصَاةِ الْمُسْلِمِينَ الَّذِينَ مَاتُوا بِلا تَوْبَةٍ وَلَمْ يَغْفِرِ اللَّهُ لَهُمْ فَيُعَذَّبُونَ فِى النَّارِ فَتْرَةً ثُمَّ بَعْدَ ذَلِكَ يُخْرِجُهُمُ اللَّهُ وَيُدْخِلُهُمُ الْجَنَّةَ لِأَنَّهُمْ مَاتُوا عَلَى الإِيـمَانِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى الثَّوَابِ وَالْعِقَابِ يَوْمَ الْقِيَامَةِ.\n     (2) مَا مَعْنَى الإِيـمَانِ بِالثَّوَابِ وَالْعِقَابِ.\n     (3) مَا هُوَ يَوْمُ الْقِيَامَةِ.\n     (4) مَا هُوَ الثَّوَابُ أَعْطِ مِثَالًا.\n     (5) مَا هُوَ الْعَذَابُ أَعْطِ مِثَالًا.\n     (6) مَاذَا يَحْصُلُ لِبَعْضِ عُصَاةِ الْمُسْلِمِينَ يَوْمَ الْقِيَامَةِ.\n\nالدَّرْسُ الْعَاشِرُ\nنَعِيمُ الآخِرَةِ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ الَّذِينَ ءَامَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتُ النَّعِيمِ﴾ [سُورَةَ لُقْمَان/8].\nوَعَدَ اللَّهُ عِبَادَهُ الْمُؤْمِنِينَ الَّذِينَ أَدَّوِا الْوَاجِبَاتِ وَاجْتَنَبُوا الْمُحَرَّمَاتِ جَنَّاتٍ وَاسِعَةً فِيهَا نَعِيمٌ دَائِمٌ لا يَفْنَى وَلا يَزُولُ فِيهَا أَنْهَارٌ وَاسِعَةٌ نَهْرٌ مِنْ لَبَنٍ وَنَهْرٌ مِنْ عَسَلٍ وَنَهْرٌ مِنْ مَاءٍ وَنَهْرٌ مِنْ خَمْرٍ لا يُسْكِرُ لَيْسَ كَخَمْرِ الدُّنْيَا وَفِيهَا رَوَائِحُ عَطِرَةٌ وَفِيهَا أَشْجَارٌ جَمِيلَةٌ وَقُصُورٌ كَبِيرَةٌ.\nوَالْمُؤْمِنُونَ فِى الْجَنَّةِ فِى عُمُرٍ وَاحِدٍ فِى سِنِّ ثَلاثٍ وَثَلاثِينَ سَنَةً حَتَّى مَنْ مَاتَ هَرِمًا أَوْ طِفْلًا يُصْبِحُ بِهَذَا الْعُمُرِ.\nوَكُلُّهُمْ جَمِيلُو الشَّكْلِ بِطُولِ سَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ.\nوَكُلُّ مَنْ دَخَلَ الْجَنَّةَ لا يَمُوتُ وَلا يَمْرَضُ وَلا يَحْزَنُ وَلا يَهْرَمُ وَلا يَتْعَبُ. وَالْجَنَّةُ فَوْقَ السَّمَاءِ السَّابِعَةِ وَالْعَرْشُ سَقْفُهَا لا يَدْخُلُهَا الْكُفَّارُ أَبَدًا وَهِىَ بَاقِيَةٌ لا تَفْنَى وَلا يَفْنَى أَهْلُهَا.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً تَدُلُّ عَلَى أَنَّ اللَّهَ أَعَدَّ لِلْمُؤْمِنِينَ جَنَّاتِ النَّعِيمِ.\n     (2) بِمَ وَعَدَ اللَّهُ عِبَادَهُ الْمُؤْمِنِينَ الصَّالِحِينَ.\n     (3) عَدِّدْ بَعْضَ نَعِيمِ الْجَنَّةِ.\n     (4) كَمْ هُوَ عُمُرُ أَهْلِ الْجَنَّةِ.\n     (5) كَمْ هُوَ طُولُ أَهْلِ الْجَنَّةِ.\n     (6) أَيْنَ تُوجَدُ الْجَنَّةُ وَمَا هُوَ سَقْفُهَا.\n     (7) مَنْ لا يَدْخُلُ الْجَنَّةَ أَبَدًا.\n"},{"id":"part4-section2","partIndex":4,"partName":"الجزء الرابع","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الرَّابِعُ"],"title":"فَصْلُ الْعِبَادَاتِ","blocks":[{"type":"p","text":"فَصْلُ الْعِبَادَاتِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"أَقْسَامُ الْمِيَاهِ"},{"type":"p","text":""},{"type":"p","text":"تُقْسَمُ الْمِيَاهُ إِلَى عِدَّةِ أَقْسَامٍ مِنْهَا"},{"type":"p","text":"مَاءٌ طَهُورٌ أَىْ طَاهِرٌ مُطَهِّرٌ."},{"type":"p","text":"وَمَاءٌ طَاهِرٌ غَيْرُ مُطَهِّرٍ."},{"type":"p","text":"وَمَاءٌ نَجِسٌ."},{"type":"p","text":"الْمَاءُ الطَّهُورُ هُوَ الْمَاءُ الطَّاهِرُ فِى نَفْسِهِ الْمُطَهِّرُ لِغَيْرِهِ أَىْ يُمْكِنُ الِاغْتِسَالُ مِنْهُ وَالْوُضُوءُ وَإِزَالَةُ النَّجَاسَةِ بِهِ كَمَاءِ الْمَطَرِ أَوِ الْبَحْرِ أَوِ النَّهْرِ أَوِ الْبِئْرِ أَوِ الْعَيْنِ."},{"type":"p","text":"الْمَاءُ الطَّاهِرُ غَيْرُ الْمُطَهِّرِ مِنْهُ"},{"type":"p","text":"الْمَاءُ الْمُسْتَعْمَلُ هُوَ الْمَاءُ الَّذِى اسْتُعْمِلَ فِى رَفْعِ الْحَدَثِ غُسْلًا كَانَ أَوْ وُضُوءًا أَوْ فِى إِزَالَةِ نَجَاسَةٍ إِذَا أَزَالَهَا وَلَمْ تَتَغَيَّرْ إِحْدَى صِفَاتِهِ أَىْ لَوْنُهُ أَوْ طَعْمُهُ أَوْ رَائِحَتُهُ. فَهَذَا الْمَاءُ طَاهِرٌ فِى نَفْسِهِ غَيْرُ مُطَهِّرٍ لِغَيْرِهِ أَىْ إِنْ جَمَعْنَاهُ لا نَسْتَطِيعُ أَنْ نَسْتَعْمِلَهُ بَعْدَ ذَلِكَ لِلْغُسْلِ وَالْوُضُوءِ وَإِزَالَةِ النَّجَاسَةِ إِلَّا إِذَا كَثُرَ وَلَكِنْ نَسْتَطِيعُ اسْتِعْمَالَهُ لِغَسْلِ الثِّيَابِ غَيْرِ الْمُتَنَجِّسَةِ مَثَلًا."},{"type":"p","text":"وَأَمَّا الْمَاءُ النَّجِسُ فَهُوَ الْمَاءُ الْقَلِيلُ الَّذِى وَقَعَتْ فِيهِ نَجَاسَةٌ غَيْرُ مَعْفُوٍّ عَنْهَا سَوَاءٌ تَغَيَّرَتْ إِحْدَى صِفَاتِهِ أَمْ لا وَكَذَلِكَ الْمَاءُ الْكَثِيرُ إِذَا وَقَعَتْ فِيهِ نَجَاسَةٌ غَيَّرَتْ صَفَاتِهِ الثَّلاثَةَ كُلَّهَا أَوْ بَعْضَهَا أَمَّا إِنْ لَمْ تَتَغَيَّرْ صِفَاتُهُ فَلا يَتَنَجَّسُ. وَالْمَاءُ الْكَثِيرُ هُوَ مِقْدَارُ قُلَّتَيْنِ فَأَكْثَرَ وَالْقُلَّتَانِ نَحْوُ مِائَةٍ وَأَرْبَعَةٍ وَتِسْعِينَ (194) لِيتْرًا إِذَا اعْتُبِرَ الذِّرَاعُ الشَّرْعِيُّ (46,2) سَنْتِمْ. أَمَّا الْمَاءُ الْقَلِيلُ فَهُوَ مَا كَانَ دُونَ الْقُلَّتَيْنِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ."},{"type":"p","text":"     (1) إِلَى كَمْ قِسْمٍ تُقْسَمُ الْمِيَاهُ."},{"type":"p","text":"     (2) مَا هُوَ الْمَاءُ الطَّهُورُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (3) مَا هُوَ الْمَاءُ الْمُسْتَعْمَلُ."},{"type":"p","text":"     (4) الْمَاءُ الطَّاهِرُ غَيْرُ الْمُطَهِّرِ هَلْ نَسْتَطِيعُ أَنْ نَسْتَعْمِلَهُ لِلْوُضُوءِ وَالْغُسْلِ."},{"type":"p","text":"     (5) الْمَاءُ الطَّاهِرُ غَيْرُ الْمُطَهِّرِ هَلْ نَسْتَطِيعُ أَنْ نَسْتَعْمِلَهُ لِغَسْلِ الثِّيَابِ الْمُتَنَجِّسَةِ وَغَيْرِ الْمُتَنَجِّسَةِ."},{"type":"p","text":"     (6) الْمَاءُ الْقَلِيلُ الَّذِى وَقَعَتْ فِيهِ نَجَاسَةٌ غَيْرُ مَعْفُوٍّ عَنْهَا مَاذَا يُعْتَبَرُ."},{"type":"p","text":"     (7) مَتَى يَتَنَجَّسُ الْمَاءُ الْكَثِيرُ."},{"type":"p","text":"     (8) مَا هُوَ الْمَاءُ الْكَثِيرُ وَمَا هُوَ الْمَاءُ الْقَلِيلُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"التَّطْهِيرُ مِنَ النَّجَاسَاتِ"},{"type":"p","text":""},{"type":"p","text":"النَّجَاسَاتُ عَلَى نَوْعَيْنِ عَيْنِيَّةٌ وَحُكْمِيَّةٌ."},{"type":"p","text":"النَّجَاسَةُ الْعَيْنِيَّةُ هِىَ الَّتِى بَقِىَ جِرْمُهَا أَوِ الَّتِى يُدْرَكُ لَهَا لَوْنٌ أَوْ طَعْمٌ أَوْ رِيحٌ كَنُقْطَةِ دَمٍ عَلَى ثَوْبٍ وَتُزَالُ بِصَبِّ الْمَاءِ الطَّاهِرِ الْمُطَهِّرِ عَلَيْهَا إِلَى أَنْ يَذْهَبَ جِرْمُهَا وَأَوْصَافُهَا."},{"type":"p","text":"النَّجَاسَةُ الْحُكْمِيَةُ وَهِىَ النَّجَاسَةُ الَّتِى لَيْسَ لَهَا لَوْنٌ وَلا طَعْمٌ وَلا رِيحٌ كَبَوْلٍ أَصَابَ ثَوْبًا ثُمَّ جَفَّ فَذَهَبَ جِرْمُهُ وَانْقَطَعَ رِيحُهُ وَلَوْنُهُ وَطَعْمُهُ فَإِنَّهُ يَطْهُرُ بِإِجْرَاءِ الْمَاءِ الطَّاهِرِ الْمُطَهِّرِ عَلَيْهِ."},{"type":"p","text":"ثُمَّ إِذَا كَانَتِ النَّجَاسَةُ كَلْبِيَّةً أَوْ خِنْزِيرِيَّةً كَأَنْ أَصَابَ رِيقُ كَلْبٍ أَوْ خِنْزِيرٍ يَدَ إِنْسَانٍ أَوْ ثَوْبَهُ أَوْ وِعَاءَهُ فَإِنَّهُ يَطْهُرُ بِغَسْلِهِ سَبْعَ مَرَّاتٍ بِالْمَاءِ الطَّاهِرِ الْمُطَهِّرِ إِحْدَاهُنَّ مَمْزُوجَةٌ بِالتُّرَابِ الطَّهُورِ."},{"type":"p","text":"وَهُنَاكَ نَجَاسَاتٌ مَعْفُوٌّ عَنْهَا كَرَشَاشِ بَوْلٍ لا يُرَى بِالْعَيْنِ الْمُجَرَّدَةِ إِذَا وَقَعَ فِى الْمَاءِ لا يُنَجِّسُهُ، وَمَيْتَةُ مَا لَيْسَ لَهُ دَمٌ يَسِيلُ إِذَا وَقَعَ فِى الْمَاءِ وَمَاتَ فِيهِ لا يُنَجِّسُهُ كَالذُّبَابِ وَالْبَرْغَشِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ النَّجَاسَةُ الْعَيْنِيَّةُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (2) كَيْفَ تُزَالُ النَّجَاسَةُ الْعَيْنِيَّةُ عَنِ الْمَوْضِعِ الَّذِى أَصَابَتْهُ."},{"type":"p","text":"     (3) مَا هِىَ النَّجَاسَةُ الْحُكْمِيَّةُ أَعْطِ مِثَالًا."},{"type":"p","text":"     (4) كَيْفَ نُطَهِّرُ الْمَوْضِعَ الْمُتَنَجِّسَ بِنَجَاسَةٍ حُكْمِيَّةٍ."},{"type":"p","text":"     (5) كَيْفَ نُطَهِّرُ الْمَوْضِعَ الَّذِى أَصَابَتْهُ نَجَاسَةٌ كَلْبِيَّةٌ أَوْ خِنْزِيرِيَّةٌ."},{"type":"p","text":"     (6) أَعْطِ مِثَالًا عَنْ نَجَاسَةٍ كَلْبِيَّةٍ."},{"type":"p","text":"     (7) هَلْ هُنَاكَ نَجَاسَاتٌ مَعْفُوٌّ عَنْهَا أَعْطِ مِثَالًا."},{"type":"p","text":"     (8) هَلْ يَتَنَجَّسُ الْمَاءُ إِذَا وَقَعَتْ فِيهِ نَجَاسَةٌ مَعْفُوٌّ عَنْهَا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"شُرُوطُ الطَّهَارَةِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [سُورَةَ الْبَقَرَةِ/222]."},{"type":"p","text":"وَقَالَ رَسُولُ اللَّهِ ﷺ »الطُّهُورُ شَطْرُ الإِيـمَانِ« رَوَاهُ مُسْلِمٌ."},{"type":"p","text":"وَمَعْنَى الطُّهُورِ الطَّهَارَةُ مِنَ الْحَدَثَيْنِ الأَكْبَرِ وَالأَصْغَرِ وَمِنَ النَّجَاسَةِ. وَلِلطَّهَارَةِ شُرُوطٌ لا بُدَّ مِنْهَا حَتَّى تَكُونَ صَحِيحَةً وَهِىَ"},{"type":"p","text":"   (1) الإِسْلامُ أَىْ أَنْ يَكُونَ الشَّخْصُ مُسْلِمًا فَلا تَصِحُّ الطَّهَارَةُ مِنْ كَافِرٍ."},{"type":"p","text":"   (2) وَالتَّمْيِيزُ وَهُوَ أَنْ يَبْلُغَ الْوَلَدُ مِنَ الْعُمُرِ إِلَى حَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ وَيَسْتَقِّلُ بِالأَكْلِ وَالشُّرْبِ وَيَتَجَنَّبُ النَّجَاسَاتِ وَغَالِبُ سِنِّ التَّمْيِيزِ سِتُّ أَوْ سَبْعُ سِنِينَ وَقَدْ يَكُونُ أَقَلَّ مِنْ ذَلِكَ."},{"type":"p","text":"   (3) وَعَدَمُ وُجُودِ مَانِعٍ مِنْ وُصُولِ الْمَاءِ إِلَى الْعُضْوِ الْمَغْسُولِ كَالْبَويَا وَالشَّحْمِ وَطِلاءِ الأَظَافِرِ (الْمَنَاكِير)."},{"type":"p","text":"   (4) وَالسَّيَلانُ أَىْ أَنْ يَجْرِىَ الْمَاءُ بِطَبْعِهِ عَلَى الْعُضْوِ الْمَغْسُولِ فَلَوْ بَلَلْتَ يَدَكَ بِالْمَاءِ وَمَسَحْتَ بِهَا وَجْهَكَ أَوْ يَدَيْكَ فِى الْوُضُوءِ فَإِنَّهُ لا يَصِحُّ وُضُوؤُكَ."},{"type":"p","text":"   (5) وَأَنْ يَكُونَ الْمَاءُ طَاهِرًا مُطَهِّرًا أَىْ غَيْرَ نَجِسٍ وَغَيْرَ مُسْتَعْمَلٍ فِى غُسْلٍ أَوْ وُضُوءٍ سَابِقٍ أَوْ فِى إِزَالَةِ نَجِسٍ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى أَمْرِ الطَّهَارَةِ."},{"type":"p","text":"     (2) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى شَأْنِ الطُّهُورِ."},{"type":"p","text":"     (3) مَا مَعْنَى الطُّهُورِ."},{"type":"p","text":"     (4) عَدِّدْ شُرُوطَ الطَّهَارَةِ."},{"type":"p","text":"     (5) مَا هُوَ التَّمْيِيزُ."},{"type":"p","text":"     (6) أَعْطِ مِثَالًا عَنْ مَانِعٍ يَمْنَعُ مِنْ وُصُولِ الْمَاءِ إِلَى الْعُضْوِ الْمَغْسُولِ."},{"type":"p","text":"     (7) مَا هُوَ السَّيَلانُ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"الِاسْتِنْجَـــاءُ"},{"type":"p","text":""},{"type":"p","text":"يَجِبُ الِاسْتِنْجَاءُ مِنْ خُرُوجِ رَطْبٍ نَجِسٍ مِنْ أَحَدِ السَّبِيلَيْنِ أَىِ الْقُبُلِ وَالدُّبُرِ، فَإِذَا خَرَجَ مِنَ الإِنْسَانِ بَوْلٌ أَوْ غَائِطٌ فَعَلَيْهِ أَنْ يَسْتَنْجِىَ قَبْلَ الصَّلاةِ لِتَصِحَّ صَلاتُهُ. وَلا يَجِبُ الِاسْتِنْجَاءُ لِخُرُوجِ الرِّيحِ."},{"type":"p","text":"وَالِاسْتِنْجَاءُ إِمَّا أَنْ يَكُونَ بِالْمَاءِ وَإِمَّا أَنْ يَكُونَ بِشَىْءٍ طَاهِرٍ جَامِدٍ يَقْلَعُ النَّجَاسَةَ أَىْ يُزِيلُ عَيْنَهَا كَالْحَجَرِ أَوِ الْوَرَقِ غَيْرِ مُحْتَرَمٍ وَالْمُحْتَرَمُ كَوَرَقَةٍ مَكْتُوبٍ عَلَيْهَا عِلْمٌ شَرْعِىٌّ. "},{"type":"p","text":"وَالِاسْتِنْجَاءُ بِالْمَاءِ يَكُونُ بِصَبِّ الْمَاءِ الْمُطَهِّرِ عَلَى مَحَلِّ النَّجَاسَةِ حَتَّى يَطْهُرَ الْمَحَلُّ."},{"type":"p","text":"وَأَمَّا الِاسْتِنْجَاءُ بِغَيْرِ الْمَاءِ كَالْحَجَرِ فَيَكُونُ بِمَسْحِ الْمَخْرَجِ ثَلاثَ مَسَحَاتٍ حَتَّى يَنْقَى الْمَحَلُّ فَإِنْ لَمْ يَنْقَ الْمَحَلُّ زَادَ عَلَى ثَلاثِ مَسَحَاتٍ حَتَّى يَنْقَى وَلا يَكْفِى أَقَلُّ مِنْ ثَلاثِ مَسَحَاتٍ وَلَوْ حَصَلَ النَّقَاءُ بِمَسْحَتَيْنِ."},{"type":"p","text":""},{"type":"p","text":"فَائِدَةٌ"},{"type":"p","text":"يُسَنُّ لِدَاخِلِ الْخَلاءِ أَنْ يَقُولَ عِنْدَ الدُّخُولِ بِسْمِ اللَّهِ اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنْ الْخُبُثِ وَالْخَبَائِثِ وَعِنْدَ الْخُرُوجِ غُفْرَانَكَ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مِمَّ يَجِبُ الِاسْتِنْجَاءُ وَمَا مَعْنَى السَّبِيلَيْنِ."},{"type":"p","text":"     (2) هَلْ يَجِبُ الِاسْتِنْجَاءُ لِخُرُوجِ الرِّيحِ، مَا هُوَ الْقُبُلُ وَمَا هُوَ الدُّبُرُ."},{"type":"p","text":"     (3) بِمَ يَكُونُ الِاسْتِنْجَاءُ."},{"type":"p","text":"     (4) مَا مَعْنَى شَىْءٌ يَقْلَعُ النَّجَاسَةَ وَأَعْطِ مِثَالًا."},{"type":"p","text":"     (5) كَيْفَ يَكُونُ الِاسْتِنْجَاءُ بِالْمَاءِ."},{"type":"p","text":"     (6) مَنْ أَرَادَ الِاسْتِنْجَاءَ بِغَيْرِ الْمَاءِ كَالْحَجَرِ كَمْ مَرَّةً يَمْسَحُ الْمَخْرَجَ."},{"type":"p","text":"     (7) هَلْ يَكْفِى فِى الِاسْتِنْجَاءِ بِغَيْرِ الْمَاءِ أَقَلُّ مِنْ ثَلاثِ مَسَحَاتٍ."},{"type":"p","text":"     (8) إِنْ مَسَحَ ثَلاثَ مَرَّاتٍ وَلَمْ يَنْقَ الْمَحَلُّ مَاذَا يَفْعَلُ."},{"type":"p","text":"     (9) مَاذَا يُسَنُّ لِدَاخِلِ الْخَلاءِ أَنْ يَقُولَ."},{"type":"p","text":"     (10) مَاذَا يُسَنُّ عِنْدَ الْخُرُوجِ مِنَ الْخَلاءِ أَنْ يَقُولَ."},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"الْوُضُوءُ فَرَائِضُهُ وَسُنَنُهُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُؤُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَينِ﴾ [سُورَةَ الْمَائِدَةِ/6]."},{"type":"p","text":"وَأَرْكَانُ الْوُضُوءِ سِتَّةٌ هِىَ"},{"type":"p","text":"النِّيَّةُ بِالْقَلْبِ عِنْدَ غَسْلِ الْوَجْهِ فَيَقُولُ بِقَلْبِهِ مَثَلًا نَوَيْتُ الْوُضُوءَ."},{"type":"p","text":"غَسْلُ الْوَجْهِ مِنْ مَنَابِتِ شَعَرِ الرَّأْسِ إِلَى أَسْفَلِ الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ."},{"type":"p","text":"غَسْلُ الْيَدَيْنِ إِلَى الْمِرْفَقَيْنِ أَىْ يَغْسِلُ يَدَيْهِ مِنْ رُؤُوسِ الأَصَابِعِ إِلَى الْمِرْفَقَيْنِ وَالْمِرْفَقُ هُوَ الْعَظْمُ عِنْدَ مُلْتَقَى السَّاعِدِ وَالْعَضُدِ."},{"type":"p","text":"مَسْحُ بَعْضِ الرَّأْسِ."},{"type":"p","text":"غَسْلُ الرِّجْلَيْنِ إِلَى الْكَعْبَيْنِ أَىْ مَعَ الْكَعْبَيْنِ وَالْكَعْبَانِ هُمَا الْعَظْمَانِ النَّاتِئَانِ عِنْدَ جَانِبَىِ الْقَدَمِ."},{"type":"p","text":"التَّرْتِيبُ أَىْ أَنْ يَنْوِىَ عِنْدَ غَسْلِ الْوَجْهِ ثُمَّ يَغْسِلُ وَجْهَهُ ثُمَّ يَدَيْهِ ثُمَّ يَمْسَحُ بَعْضَ رَأْسِهِ ثُمَّ يَغْسِلُ رِجْلَيْهِ."},{"type":"p","text":""},{"type":"p","text":"وَمِنْ سُنَنِ الْوُضُوءِ "},{"type":"p","text":"   (1) التَّسْمِيَةُ أَىْ قَوْلُ بِسْمِ اللَّهِ عِنْدَ الْبَدْءِ.\t"},{"type":"p","text":"   (2) وَاسْتِعْمَالُ السِّوَاكِ."},{"type":"p","text":"   (3) وَغَسْلُ الْكَفَّيْنِ."},{"type":"p","text":"   (4) وَالْمَضْمَضَةُ."},{"type":"p","text":"   (5) وَالِاسْتِنْشَاقُ."},{"type":"p","text":"   (6) وَمَسْحُ جَمِيعِ الرَّأْسِ."},{"type":"p","text":"   (7) وَمَسْحُ الأُذُنَيْنِ ظَاهِرِهِمَا وَبَاطِنِهِمَا بِمَاءٍ جَدِيدٍ."},{"type":"p","text":"   (8) وَتَخْلِيلُ أَصَابِعِ الْيَدَيْنِ وَالرِّجْلَيْنِ."},{"type":"p","text":"   (9) وَتَقْدِيمُ الْيُمْنَى عَلَى الْيُسْرَى."},{"type":"p","text":"   (10) وَالطَّهَارَةُ ثَلاثًا ثَلاثًا."},{"type":"p","text":"   (11) وَالدَّلْكُ."},{"type":"p","text":"   (12) وَالْمُوَالاةُ وَهِىَ غَسْلُ الْعُضْوِ قَبْلَ أَنْ يَجِفَّ الْعُضْوُ الَّذِى قَبْلَهُ."},{"type":"p","text":"   (13) وَتَقْلِيلُ الْمَاءِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ الآيَةُ الَّتِى تَدُلُّ عَلَى فَرْضِيَةِ الْوُضُوءِ."},{"type":"p","text":"     (2) كَمْ هِىَ أَرْكَانُ الْوُضُوءِ عَدِّدْهَا."},{"type":"p","text":"     (3) مَتَى تَنْوِى الْوُضُوءَ."},{"type":"p","text":"     (4) مَا هُوَ الْقَدْرُ الْوَاجِبُ غَسْلُهُ مِنَ الْوَجْهِ."},{"type":"p","text":"     (5) مَا هُوَ الْقَدْرُ الْوَاجِبُ غَسْلُهُ مِنَ الْيَدَيْنِ."},{"type":"p","text":"     (6) مَا هُوَ الْمِرْفَقُ."},{"type":"p","text":"     (7) مَا هُوَ الْقَدْرُ الْوَاجِبُ غَسْلُهُ مِنَ الرِّجْلَيْنِ."},{"type":"p","text":"     (8) مَا هُمَا الْكَعْبَانِ."},{"type":"p","text":"     (9) مَا مَعْنَى التَّرْتِيبِ."},{"type":"p","text":"     (10) عَدِّدْ بَعْضَ سُنَنِ الْوُضُوءِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"نَوَاقِضُ الْوُضُوءِ وَمَكْرُوهَاتُهُ"},{"type":"p","text":""},{"type":"p","text":"مِنَ الأُمُورِ الَّتِى تَنْقُضُ الْوُضُوءَ"},{"type":"p","text":"   (1) خُرُوجُ شَىْءٍ مِنَ السَّبِيلَيْنِ كَخُرُوجِ الْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ أَوِ الدُّودِ."},{"type":"p","text":"   (2) وَمَسُّ قُبُلِ الآدَمِىِّ أَوْ حَلْقَةِ دُبُرِهِ."},{"type":"p","text":"   (3) وَالنَّوْمُ عَلَى غَيْرِ هَيْئَةِ الْمُتَمَكِّنِ أَىْ عَلَى غَيْرِ حَالَةِ الْقُعُودِ مَعَ إِلْصَاقِ دُبُرِهِ بِمَكَانِ جُلُوسِهِ بِحَيْثُ لا يَبْقَى تَجَافٍ بَيْنَهَا وَبَيْنَ مَكَانِ جُلُوسِهِ، أَمَّا النُّعَاسُ فَلا يَنْقُضُ الْوُضُوءَ وَالنُّعَاسُ هُوَ الَّذِى يُسْمَعُ فِيهِ الْكَلامُ لَكِنْ لا يُفْهَمُ وَلا تُرَى فِيهِ رُؤْيَا."},{"type":"p","text":"   (4) زَوَالُ الْعَقْلِ فَمَنْ غَابَ عَقْلُهُ بِالْجُنُونِ أَوِ الإِغْمَاءِ انْتَقَضَ وُضُوؤُهُ."},{"type":"p","text":""},{"type":"p","text":"مِنْ مَكْرُوهَاتِ الْوُضُوءِ"},{"type":"p","text":"   (1) تَقْدِيمُ الْيُسْرَى عَلَى الْيُمْنَى."},{"type":"p","text":"   (2) وَالزِّيَادَةُ عَلَى الثَّلاثِ فِى الغَسْلِ."},{"type":"p","text":"   (3) وَالإِسْرَافُ فِى الْمَاءِ."},{"type":"p","text":"   (4) وَالْكَلامُ الَّذِى لا خَيْرَ فِيهِ أَثْنَاءَ الْوُضُوءِ."},{"type":"p","text":"   (5) وَتَرْكُ التَّسْمِيَةِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) عَدِّدْ بَعْضَ مَا يَنْقُضُ الْوُضُوءَ."},{"type":"p","text":"     (2) مَا مَعْنَى السَّبِيلَيْنِ."},{"type":"p","text":"     (3) هَلِ النُّعَاسُ يَنْقُضُ الْوُضُوءَ وَمَا هُوَ النُّعَاسُ."},{"type":"p","text":"     (4) مَا مَعْنَى زَوَالِ الْعَقْلِ."},{"type":"p","text":"     (5) عَدِّدْ بَعْضَ مَكْرُوهَاتِ الْوُضُوءِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"الأَذَانُ وَالإِقَامَـةُ"},{"type":"p","text":""},{"type":"p","text":"إِذَا دَخَلَ وَقْتُ الصَّلاةِ يُسَنُّ أَنْ يَقُومَ أَحَدُ الْمُسْلِمِينَ بِالدَّعْوَةِ إِلَى أَدَائِهَا بِصَوْتٍ مُرْتَفِعٍ وَهَذَا يُسَمَّى الأَذَانَ، يَقِفُ الْمُؤَذِّنُ مُتَطَهِّرًا فِى مَكَانٍ مُرْتَفِعٍ مُتَوَجِّهًا إِلَى الْقِبْلَةِ وَيَقُولُ "},{"type":"p","text":"اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ."},{"type":"p","text":"أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ، أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":"أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":"حَىَّ عَلَى الصَّلاةِ، حَىَّ عَلَى الصَّلاةِ. "},{"type":"p","text":"حَىَّ عَلَى الْفَلاحِ، حَىَّ عَلَى الْفَلاحِ."},{"type":"p","text":"اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":"وَفِى أَذَانِ الصُّبْحِ يَزِيدُ الْمُؤَذِّنُ بَعْدَ قَوْلِهِ حَىَّ عَلَى الْفَلاحِ الثَّانِيَةِ الصَّلاةُ خَيْرٌ مِنَ النَّوْمِ الصَّلاةُ خَيْرٌ مِنَ النَّوْمِ."},{"type":"p","text":"وَيُسَنُّ لِلْمُسْتَمِعِينَ أَنْ يُرَدِّدُوا وَرَاءَ الْمُؤَذِّنِ مِثْلَمَا يَقُولُ وَلَكِنْ حِينَ يَقُولُ حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاحِ يَقُولُونَ لا حَوْلَ وَلا قُوَّةَ إِلَّا باللَّهِ. "},{"type":"p","text":"الإِقَامَةُ"},{"type":"p","text":"بَعْدَ أَنْ يَنْتَهِىَ الْمُؤَذِّنُ مِنَ الأَذَانِ وَيَجْتَمِعَ النَّاسُ لِتَأْدِيَةِ الصَّلاةِ الْمَفْرُوضَةِ يَتَوَلَّى أَحَدُهُمْ إِقَامَةَ الصَّلاةِ فَيَقُولُ"},{"type":"p","text":"اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ. "},{"type":"p","text":"حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاحِ، قَدْ قَامَتِ الصَّلاةُ قَدْ قَامَتِ الصَّلاةُ، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":"وَيُسَنُّ بَعْدَ الأَذَانِ وَالإِقَامَةِ الصَّلاةُ عَلَى النَّبِىِّ ﷺ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) إِذَا دَخَلَ وَقْتُ الصَّلاةِ مَاذَا يُسَنُّ قَبْلَ الدُّخُولِ فِيهَا."},{"type":"p","text":"     (2) هَلْ تَحْفَظُ أَلْفَاظَ الأَذَانِ مَا هِىَ."},{"type":"p","text":"     (3) مَاذَا يَزِيدُ الْمُؤَذِّنُ فِى أَذَانِ الصُّبْحِ."},{"type":"p","text":"     (4) مَاذَا يُسَنُّ لِلْمُسْتَمِعِينَ لِلْمُؤَذِّنِ أَنْ يَقُولُوا."},{"type":"p","text":"     (5) هَلْ تَحْفَظُ أَلْفَاظَ إِقَامَةِ الصَّلاةِ مَا هِيَ."},{"type":"p","text":"     (6) مَاذَا يُسَنُّ بَعْدَ الأَذَانِ وَالإِقَامَةِ أَنْ تَقُولَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"الصَّلَوَاتُ الْمَفْرُوضَةُ وَأَوْقَاتُهَا"},{"type":"p","text":""},{"type":"p","text":"الصَّلَوَاتُ الْمَفْرُوضَةُ فِى كُلِّ يَوْمٍ وَلَيْلَةٍ خَمْسٌ هِىَ "},{"type":"p","text":"الصُّبْحُ وَالظُّهْرُ وَالْعَصْرُ وَالْمَغْرِبُ وَالْعِشَاءُ. وَأَوْقَاتُ هَذِهِ الصَّلَوَاتِ هِىَ"},{"type":"p","text":"(1) الصُّبْحُ وَيَبْدَأُ وَقْتُهَا مِنْ طُلُوعِ الْفَجْرِ الصَّادِقِ وَهُوَ بَيَاضٌ يَظْهَرُ فِى عَرْضِ الأُفُقِ الشَّرْقِىِّ وَيَنْتَهِى بِطُلُوعِ الشَّمْسِ."},{"type":"p","text":"(2) الظُّهْرُ وَيَبْدَأُ وَقْتُهَا إِذَا مَالَتِ الشَّمْسُ عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْعَصْرِ."},{"type":"p","text":"(3) الْعَصْرُ وَيَبْدَأُ وَقْتُهَا إِذَا صَارَ ظِلُّ الشَّىْءِ مِثْلَهُ زَائِدًا عَلَى ظِلِّهِ لَمَّا كَانَتِ الشَّمْسُ فِى وَسَطِ السَّمَاءِ وَهُوَ ظِلُّ الِاسْتِوَاءِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْمَغْرِبِ."},{"type":"p","text":"(4) الْمَغْرِبُ وَيَبْدَأُ وَقْتُهَا مِنْ مَغِيبِ الشَّمْسِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْعِشَاءِ."},{"type":"p","text":"(5) الْعِشَاءُ وَيَبْدَأُ وَقْتُهَا مِنْ مَغِيبِ الشَّفَقِ الأَحْمَرِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الصُّبْحِ."},{"type":"p","text":"فَيَجِبُ أَدَاءُ هَذِهِ الصَّلَوَاتِ فِى أَوْقَاتِهَا وَلا يَجُوزُ تَقْدِيمُهَا أَوْ تَأْخِيرُهَا عَنْ وَقْتِهَا إِلَّا لِعُذْرٍ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ الصَّلَوَاتُ الْمَفْرُوضَةُ فِى كُلِّ يَوْمٍ وَلَيْلَةٍ."},{"type":"p","text":"     (2) كَيْفَ يَبْدَأُ وَقْتُ الصُّبْحِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (3) مَا هُوَ الْفَجْرُ الصَّادِقُ."},{"type":"p","text":"     (4) مَتَى يَبْدَأُ وَقْتُ الظُّهْرِ وَمَتَى يَنْتَهِى."},{"type":"p","text":"     (5) مَتَى يَبْدَأُ وَقْتُ الْعَصْرِ وَمَتَى يَنْتَهِى."},{"type":"p","text":"     (6) مَتَى يَبْدَأُ وَقْتُ الْمَغْرِبِ وَمَتَى يَنْتَهِى."},{"type":"p","text":"     (7) مَتَى يَبْدَأُ وَقْتُ الْعِشَاءِ وَمَتَى يَنْتَهِى."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"شُرُوطُ صِحَّةِ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"شُرُوطُ صِحَّةِ الصَّلاةِ هِىَ الأُمُورُ الَّتِى يَجِبُ تَوَفُّرُهَا فِى الْمُصَلِّي قَبْلَ الشُّرُوعِ فِى الصَّلاةِ وَمِنْهَا"},{"type":"p","text":"الإِسْلامُ فَلا تَصِحُّ الصَّلاةُ مِنْ كَافِرٍ."},{"type":"p","text":"وَالتَّمْيِيزُ وَهُوَ أَنْ يَكُونَ الْوَلَدُ وَصَلَ إِلَى سِنٍّ بِحَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ."},{"type":"p","text":"وَالْوُضُوءُ أَىْ لا بُدَّ أَنْ يَكُونَ الشَّخْصُ مُتَوَضِّئًا وَإِلَّا فَلا تَصِحُّ صَلاتُهُ."},{"type":"p","text":"وَطَهَارَةُ ثِيَابِ الْمُصَلِّى وَجِسْمِهِ وَالْمَكَانِ الَّذِى يُصَلِّى فِيهِ مِنَ النَّجَاسَةِ الَّتِى لا يُعْفَى عَنْهَا."},{"type":"p","text":"وَسَتْرُ الْعَوْرَةِ أَىْ أَنْ يَسْتُرَ الرَّجُلُ مِنَ السُّرَّةِ إِلَى الرُّكْبَةِ أَمَّا الْمَرْأَةُ الْحُرَّةُ فَعَلَيْهَا أَنْ تَسْتُرَ جَمِيعَ بَدَنِهَا مَا عَدَا وَجْهَهَا وَكَفَّيْهَا."},{"type":"p","text":"وَالْعِلْمُ بِدُخُولِ وَقْتِ الصَّلاةِ أَىْ أَنْ يَعْرِفَ الْمُصَلِّى أَنَّ وَقْتَ الصَّلاةِ قَدْ دَخَلَ."},{"type":"p","text":"وَاسْتِقْبَالُ الْقِبْلَةِ أَىِ الْكَعْبَةِ الْمُشَرَّفَةِ الَّتِى فِى مَكَّةَ الْمُكَرَّمَةِ فَالْمُصَلِّى الَّذِى يُخِلُّ بِشَرْطٍ مِنْ هَذِهِ الشُّرُوطِ لا تَصِحُّ صَلاتُهُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ شُرُوطُ صِحَّةِ الصَّلاةِ."},{"type":"p","text":"     (2) عَدِّدْ شُرُوطَ صِحَّةِ الصَّلاةِ."},{"type":"p","text":"     (3) مَا هُوَ التَّمْيِيزُ."},{"type":"p","text":"     (4) هَلْ تَصِحُّ الصَّلاةُ بِدُونِ وُضُوءٍ."},{"type":"p","text":"     (5) هَلْ تَصِحُّ الصَّلاةُ إِذَا كَانَ عَلَى ثِيَابِ الْمُصَلِّى نَجَاسَةٌ لا يُعْفَى عَنْهَا."},{"type":"p","text":"     (6) مَا هِىَ عَوْرَةُ الرَّجُلِ وَعَوْرَةُ الْمَرْأَةِ الْحُرَّةِ."},{"type":"p","text":"     (7) مَا مَعْنَى الْعِلْمِ بِدُخُولِ وَقْتِ الصَّلاةِ."},{"type":"p","text":"     (8) مَا هِىَ الْقِبْلَةُ."},{"type":"p","text":"     (9) مَنْ أَخَلَّ بِشَرْطٍ مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ مَا حُكْمُ صَلاتِهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"أَرْكَانُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"الصَّلاةُ لَهَا أَرْكَانٌ وَسُنَنٌ فَالأَرْكَانُ لا تَصِحُّ الصَّلاةُ بِدُونِهَا وَأَمَّا السُّنَنُ إِذَا تَرَكَهَا الشَّخْصُ فَتَصِحُّ صَلاتُهُ لَكِنْ يَفُوتُهُ ثَوَابُهَا."},{"type":"p","text":"وَأَرْكَانُ الصَّلاةِ سَبْعَةَ عَشَرَ رُكْنًا هِىَ"},{"type":"p","text":"النِّيَّةُ وَهِىَ أَنْ يَنْوِىَ بِقَلْبِهِ أَنَّهُ يُصَلِّى فَرْضَ الظُّهْرِ مَثَلًا مَعَ التَّكْبِيرِ فَيَقُولُ بِقَلْبِهِ أُصَلِّى فَرْضَ الظُّهْرِ."},{"type":"p","text":"وَتَكْبِيرَةُ الإِحْرَامِ وَهِىَ التَّكْبِيرَةُ الأُولَى فِى الصَّلاةِ فَيَقُولُ بِحَيْثُ يُسْمِعُ نَفْسَهُ اللَّهُ أَكْبَرُ."},{"type":"p","text":"وَالْقِيَامُ فِى الْفَرْضِ لِلْقَادِرِ أَىْ أَنَّهُ يُشْتَرَطُ الْقِيَامُ فِى صَلاةِ الْفَرْضِ لِلْقَادِرِ."},{"type":"p","text":"وَقِرَاءَةُ الْفَاتِحَةِ بِالْبَسْمَلَةِ وَالتَّشْدِيدَاتِ وَتَجِبُ مُوَالاتُهَا وَإِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا."},{"type":"p","text":"وَالرُّكُوعُ بِأَنْ يَنْحَنِىَ بِحَيْثُ تَنَالُ رَاحَتَاهُ رُكْبَتَيْهِ."},{"type":"p","text":"وَالطُّمَأْنِينَةُ فِيهِ بِقَدْرِ سُبْحَانَ اللَّهِ وَهِىَ سُكُونُ الأَعْضَاءِ دَفْعَةً وَاحِدَةً."},{"type":"p","text":"وَالِاعْتِدَالُ بِأَنْ يَنْتَصِبَ بَعْدَ الرُّكُوعِ قَائِمًا."},{"type":"p","text":"وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"وَالسُّجُودُ مَرَّتَيْنِ وَالسُّجُودُ يَكُونُ عَلَى سَبْعَةِ أَعْظُمٍ فَيَضَعُ شَيْئًا مِنَ الْجَبْهَةِ مَكْشُوفًا وَشَيْئًا مِنَ الرُّكْبَتَيْنِ وَمِنْ بُطُونِ الْكَفَّيْنِ وَمِنْ بُطُونِ أَصَابِعِ الرِّجْلَيْنِ."},{"type":"p","text":"وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"وَالْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ."},{"type":"p","text":"وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"وَالْجُلُوسُ الأَخِيرُ أَىْ لِلتَّشَهُّدِ الأَخِيرِ وَمَا بَعْدَهُ."},{"type":"p","text":"وَالتَّشَهُّدُ الأَخِيرُ وَأَقَلُّهُ التَّحِيَّاتُ لِلَّهِ سَلامٌ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ سلامٌ عَلَيْنَا وَعَلَى عِبادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ. وَأَكْمَلُهُ التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":"وَالصَّلاةُ عَلَى النَّبِىِّ وَأَقَلُّهَا اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ."},{"type":"p","text":"وَالسَّلامُ وَأَقَلُّهُ السَّلامُ عَلَيْكُمْ."},{"type":"p","text":"وَالتَّرْتِيبُ أَىْ عَلَى مَا ذُكِرَ فَلَوْ سَجَدَ قَبْلَ رُكُوعِهِ عَمْدًا بَطَلَتْ صَلاتُهُ."},{"type":"p","text":""},{"type":"p","text":"شَرْحُ بَعْضِ أَلْفَاظِ الصَّلاةِ"},{"type":"p","text":"اللَّهُ أَكْبَرُ مَعْنَاهُ أَنَّ اللَّهَ أَكْبَرُ مِنْ كُلِّ كَبِيرٍ قَدْرًا وَعَظَمَةً لا حَجْمًا لِأَنَّ اللَّهَ مُنَزَّهٌ عَنِ الْحَجْمِ."},{"type":"p","text":"التَّحِيَّاتُ مَعْنَاهُ مَا يُحَيِّى بِهِ الْعِبَادُ بَعْضُهُمْ بَعْضًا."},{"type":"p","text":"الْمُبَارَكَاتُ الأَعْمَالُ النَّامِيَةُ فِى الْخَيْرِ."},{"type":"p","text":"وَأَمَّا الصَّلَوَاتُ فَهِىَ الصَّلَوَاتُ الْخَمْسُ."},{"type":"p","text":"وَأَمَّا الطَّيِّبَاتُ فَمَعْنَاهَا الأَعْمَالُ الصَّالِحَةُ أَىْ أَنَّ كُلَّ ذَلِكَ مِلْكٌ لِلَّهِ تَعَالَى."},{"type":"p","text":"وَأَمَّا السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ فَمَعْنَاهُ السَّلامَةُ مِنَ الآفَاتِ."},{"type":"p","text":"سُبْحَانَ رَبِّىَ الأَعْلَى مَعْنَاهُ أُنَزِّهُ رَبِّىَ الأَعْلَى أَىْ عُلُوَّ قَدْرٍ مِنْ كُلِّ نَقْصٍ وَعَيْبٍ كَالْمَكَانِ وَالْجِهَةِ وَالْعَجْزِ وَالْجَهْلِ وَالتَّغَيُّرِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) هَلْ تَصِحُّ الصَّلاةُ بِدُونِ الأَرْكَانِ."},{"type":"p","text":"     (2) كَمْ هِىَ أَرْكَانُ الصَّلاةِ."},{"type":"p","text":"     (3) عَدِّدْ أَرْكَانَ الصَّلاةِ بِدُونِ شَرْحٍ."},{"type":"p","text":"     (4) مَا هِىَ النِّيَّةُ وَمَتَى يَنْوِى."},{"type":"p","text":"     (5) مَا هِىَ تَكْبِيرَةُ الإِحْرَامِ."},{"type":"p","text":"     (6) هَلِ النِّيَّةُ عَمَلٌ قَلْبِىٌّ أَمْ لِسَانِىٌّ."},{"type":"p","text":"     (7) هَلِ التَّكْبِيرَةُ الأُولَى بِالْقَلْبِ أَمْ بِاللِّسَانِ."},{"type":"p","text":"     (8) مَا مَعْنَى الْقِيَامِ فِى الْفَرْضِ لِلْقَادِرِ."},{"type":"p","text":"     (9) مَا هُوَ الرُّكُوعُ."},{"type":"p","text":"     (10) مَا هِىَ الطُّمَأْنِينَةُ وَبِأَىِّ قَدْرٍ تَجِبُ."},{"type":"p","text":"     (11) مَا هُوَ الِاعْتِدَالُ."},{"type":"p","text":"     (12) كَيْفَ يَكُونُ السُّجُودُ."},{"type":"p","text":"     (13) مَا هُوَ أَقَلُّ التَّشَهُّدِ الأَخِيرِ."},{"type":"p","text":"     (14) مَا هُوَ أَكْمَلُ التَّشَهُّدِ الأَخِيرِ."},{"type":"p","text":"     (15) مَا هُوَ أَقَلُّ الصَّلاةِ عَلَى النَّبِىِّ."},{"type":"p","text":"     (16) مَا هُوَ أَقَلُّ السَّلامِ."},{"type":"p","text":"     (17) مَا مَعْنَى التَّرْتِيبِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِى عَشَرَ"},{"type":"p","text":"سُنَنُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"سُنَنُ الصَّلاةِ كَثِيرَةٌ مَنْ تَرَكَهَا صَحَّتْ صَلاتُهُ وَلَكِنْ مَنْ فَعَلَهَا فَلَهُ ثَوَابٌ وَأَجْرٌ عِنْدَ اللَّهِ فَيَنْبَغِى لِلْمُصَلِّى أَنْ يُحَافِظَ عَلَيْهَا وَمِنْ هَذِهِ السُّنَنِ"},{"type":"p","text":"وَضْعُ الْيَدِ الْيُمْنَى عَلَى كُوعِ الْيُسْرَى فَوْقَ السُّرَّةِ وَتَحْتَ الصَّدْرِ."},{"type":"p","text":"وَقِرَاءَةُ دُعَاءِ الِافْتِتَاحِ قَبْلَ قِرَاءَةِ الْفَاتِحَةِ فِى الرَّكْعَةِ الأُولَى."},{"type":"p","text":"وَقِرَاءَةُ سُورَةٍ قَصِيرَةٍ بَعْدَ قِرَاءَةِ الْفَاتِحَةِ فِى الرَّكْعَتَيْنِ الأُولَى وَالثَّانِيَةِ لِغَيْرِ الْمَأْمُومِ فِى الصَّلاةِ الْجَهْرِيَةِ."},{"type":"p","text":"وَالتَّكْبِيرَاتُ أَىْ قَوْلُ اللَّهُ أَكْبَرُ عِنْدَ الِانْتِقَالِ مِنْ رُكْنٍ فِعْلِىٍّ إِلَى رُكْنٍ ءَاخَرَ إِلَّا عِنْدَ الرَّفْعِ مِنَ الرُّكُوعِ فَيَقُولُ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ أَمَّا تَكْبِيرَةُ الإِحْرَامِ فَإِنَّهَا رُكْنٌ."},{"type":"p","text":"وَقَوْلُ سُبْحَانَ رَبِّىَ الْعَظِيم ثَلاثَ مَرَّاتٍ فِى الرُّكُوعِ."},{"type":"p","text":"وَقَوْلُ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ فِى الرَّفْعِ مِنَ الرُّكُوعِ."},{"type":"p","text":"وَقَوْلُ رَبَّنَا وَلَكَ الْحَمْدُ فِى الِاعْتِدَالِ."},{"type":"p","text":"وَقَوْلُ سُبْحَانَ رَبِّىَ الأَعْلَى ثَلاثَ مَرَّاتٍ فِى السُّجُودِ."},{"type":"p","text":"وَقَوْلُ اللَّهُمَّ اغْفِرْ لِى وَارْحَمْنِى وَاهْدِنِى وَعَافِنِى وَارْزُقْنِى فِى الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ."},{"type":"p","text":"وَالتَّشَهُّدُ الأَوَّلُ أَىْ بَعْدَ إِتْمَامِ الرَّكَعْتَيْنِ الأَوَّلِيَيْنِ فِى صَلاةِ الظُّهْرِ وَالْعَصْرِ وَالْمَغْرِبِ وَالْعِشَاءِ."},{"type":"p","text":"وَقِرَاءَةُ الصَّلاةِ الإِبْرَاهِيمِيَّةِ بِأَكْمَلِهَا بَعْدَ التَّشَهُّدِ الأَخِيرِ."},{"type":"p","text":"وَزِيَادَةُ وَرَحْمَةُ اللَّهِ فِى السَّلامِ فَيَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ."},{"type":"p","text":"وَالتَّسْلِيمَةُ الثَّانِيَةُ."},{"type":"p","text":"وَالِالْتِفَاتُ إِلَى الْيَمِينِ فِى التَّسْلِيمَةِ الأُولَى وَإِلَى الْيَسَارِ فِى التَّسْلِيمَةِ الثَّانِيَةِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ."},{"type":"p","text":"     (1) أَيْنَ يُسَنُّ وَضْعُ الْيَدِ الْيُمْنَى بَعْدَ تَكْبِيرَةِ الإِحْرَامِ."},{"type":"p","text":"     (2) مَاذَا يُسَنُّ أَنْ نَقْرَأَ قَبْلَ الْفَاتِحَةِ."},{"type":"p","text":"     (3) مَاذَا يُسَنُّ أَنْ نَقْرَأَ بَعْدَ الْفَاتِحَةِ وَفِى أَىِّ رَكْعَةٍ."},{"type":"p","text":"     (4) مَاذَا يُسَنُّ عِنْدَ الِانْتِقَالِ مِنْ رُكْنٍ إِلَى رُكْنٍ."},{"type":"p","text":"     (5) مَاذَا يُسَنُّ أَنْ نَقُولَ فِى الرُّكُوعِ وَفِى السُّجُودِ."},{"type":"p","text":"     (6) مَاذَا يُسَنُّ أَنْ يُقَالَ فِى الرَّفْعِ مِنَ الرُّكُوعِ وَفِى الِاعْتِدَالِ."},{"type":"p","text":"     (7) مَاذَا يُسَنُّ أَنْ يُقَالَ فِى الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ."},{"type":"p","text":"     (8) مَاذَا يُسَنُّ أَنْ نَزِيدَ فِى السَّلامِ."},{"type":"p","text":"     (9) أَىُّ التَّسْلِيمَتَيْنِ سُنَّةٌ وَأَىُّ التَّشَهُّدَيْنِ سُنَّةٌ."},{"type":"p","text":"     (10) إِلَى أَىِّ جِهَةٍ يُسَنُّ الِالْتِفَاتُ فِى التَّسْلِيمَةِ الأُولَى وَالثَّانِيَةِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى عَشَرَ"},{"type":"p","text":"مُبْطِلاتُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"هُنَاكَ أُمُورٌ تُبْطِلُ الصَّلاةَ لا بُدَّ مِنْ مَعْرِفَتِهَا لِاجْتِنَابِهَا."},{"type":"p","text":"مِنْ هَذِهِ الْمُبْطِلاتِ"},{"type":"p","text":"(1) الْكَلامُ الْعَمْدُ أَىْ إِذَا تَكَلَّمَ الْمُصَلِّى بِكَلامِ النَّاسِ بِحَرْفٍ مُفْهِمٍ أَوْ بِأَكْثَرَ عَامِدًا ذَاكِرًا أَنَّهُ فِى الصَّلاةِ بَطَلَتْ صَلاتُهُ أَمَّا ذِكْرُ اللَّهِ فَلا يُبْطِلُ الصَّلاةَ."},{"type":"p","text":"(2) وَالأَكْلُ وَالشُّرْبُ فَإِذَا أَكَلَ الْمُصَلِّى أَوْ شَرِبَ عَامِدًا ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ كَانَ قَلِيلًا كَحَبَّةِ سِمْسِمٍ بَطَلَتْ صَلاتُهُ."},{"type":"p","text":"(3) وَالأَفْعَالُ الْكَثِيرَةُ فَمَنْ فَعَلَ أَفْعَالًا كَثِيرَةً كَأَنْ تَحَرَّكَ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ فَإِنَّهُ تَبْطُلُ صَلاتُهُ."},{"type":"p","text":"(4) وَالْحَرَكَةُ الْمُفْرِطَةُ كَالْوَثْبَةِ الْفَاحِشَةِ."},{"type":"p","text":"(5) وَالْحَرَكَةُ الْوَاحِدَةُ لِلَّعِبِ كَتَحْرِيكِ اللِّسَانِ أَوِ الْجَفْنِ بِقَصْدِ اللَّعِبِ."},{"type":"p","text":"(6) وَزِيَادَةُ رُكْنٍ كَأَنْ سَجَدَ ثَلاثَ مَرَّاتٍ فِى الرَّكْعَةِ الْوَاحِدَةِ عَمْدًا."},{"type":"p","text":"(7) وَتَغْيِيرُ النِّيَّةِ فَإِذَا نَوَى قَطْعَ الصَّلاةِ أَوْ تَرَدَّدَ فِى قَطْعِهَا أَوْ عَلَّقَ قَطْعَهَا عَلَى شَىْءٍ كَأَنْ قَالَ فِى نَفْسِهِ إِنْ قُرِعَ الْبَابُ أَقْطَعُ الصَّلاةَ بَطَلَتْ فِى الْحَالِ."},{"type":"p","text":"(8) وَالْحَدَثُ كَخُرُوجِ الرِّيحِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) عَدِّدْ بَعْضَ مُبْطِلاتِ الصَّلاةِ."},{"type":"p","text":"     (2) مَا مَعْنَى الْكَلامِ الْعَمْدِ."},{"type":"p","text":"     (3) هَلْ ذِكْرُ اللَّهِ يُبْطِلُ الصَّلاةَ."},{"type":"p","text":"     (4) مَا حُكْمُ مَنْ أَكَلَ أَوْ شَرِبَ وَلَوْ قَلِيلًا عَامِدًا ذَاكِرًا أَنَّهُ فِى الصَّلاةِ."},{"type":"p","text":"     (5) أَعْطِ مِثَالًا عَنِ الأَفْعَالِ الْكَثِيرَةِ."},{"type":"p","text":"     (6) أَعْطِ مِثَالًا عَنِ الْحَرَكَةِ الْمُفْرِطَةِ."},{"type":"p","text":"     (7) أَعْطِ مِثَالًا عَنِ الْحَرَكَةِ الْوَاحِدَةِ لِلَّعِبِ."},{"type":"p","text":"     (8) أَعْطِ مِثَالًا عَنْ زِيَادَةِ رُكْنٍ."},{"type":"p","text":"     (9) مَا مَعْنَى تَغْيِيرِ النِّيَّةِ."},{"type":"p","text":"     (10) مَا مَعْنَى طُرُوءِ الْحَدَثِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثَ عَشَرَ"},{"type":"p","text":"الصَّلاةُ السِّرِيَّةُ وَالصَّلاةُ الْجَهْرِيَّةُ"},{"type":"p","text":""},{"type":"p","text":"الصَّلَوَاتُ الْجَهْرِيَّةُ الصُّبْحُ وَالْمَغْرِبُ وَالْعِشَاءُ"},{"type":"p","text":"وَيُجْهَرُ فِيهَا فِى الرَّكْعَتَيْنِ الأَوَّلِيَيْنِ فِى الْقِيَامِ فِى قِرَاءَةِ الْفَاتِحَةِ وَالتَّأْمِينِ وَمَا بَعْدَهُمَا كَالسُّورَةِ الْقَصِيرَةِ، هَذَا لِلْمُنْفَرِدِ وَلِلإِمَامِ."},{"type":"p","text":"الصَّلاتَانِ السِّرِيَّتَانِ الظُّهْرُ وَالْعَصْرُ."},{"type":"p","text":"وَمَنْ فَاتَتْهُ صَلاةٌ مِنْ هَذِهِ الصَّلَوَاتِ يَقْضِيهَا فَإِنْ كَانَتْ جَهْرِيَّةً قَضَاهَا فِى وَقْتِ صَلاةٍ سِرِيَّةٍ يُسِرُّ بِهَا كَأَنْ قَضَى الصُّبْحَ فِى وَقْتِ الظُّهْرِ أَمَّا إِنْ قَضَاهَا فِى وَقْتِ صَلاةٍ جَهْرِيَّةٍ جَهَرَ بِهَا كَأَنْ قَضَى الْمَغْرِبَ فِى وَقْتِ الْعِشَاءِ."},{"type":"p","text":"وَإِنْ قَضَى السِّرِيَّةَ فِى وَقْتِ الْجَهْرِيَّةِ يَجْهَرُ كَأَنْ قَضَى الْعَصْرَ فِى وَقْتِ الْمَغْرِبِ."},{"type":"p","text":"فَائِدَةٌ. إِذَا سَمِعَ الْمَأْمُومُ الإِمَامَ فِى الصَّلاةِ الْجَهْرِيَّةِ يَقْرَأُ ﴿أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ﴾ [سُورَةَ التِّينِ/8] يَقُولُ الْمَأْمُومُ بَلَى وَأَنَا عَلَى ذَلِكَ مِنَ الشَّاهِدِينَ، وَإِنْ كَانَ يَقْرَأُ الْفَاتِحَةَ يَقُولُ بَلَى ثُمَّ يُكْمِلُ الْفَاتِحَةَ وَإِذَا انْتَهَى الإِمَامُ مِنْ قِرَاءَةِ الْفَاتِحَةِ يَقُولُ الْمَأْمُومُ ءَامِين مَعَ الإِمَامِ. وَإِذَا سَمِعَ ءَايَةً فِيهَا اسْمُ النَّبِىِّ ﷺ فَيُصَلِى عَلَيْهِ كَأَنْ يَقُولَ اللَّهُمَّ صَلِّ عَلَيْهِ."},{"type":"p","text":"أَمَّا لَوْ سَلَّمَ عَلَيْهِ رَجُلٌ وَهُوَ يُصَلِّى فَلا يَقُولُ لَهُ وَعَلَيْكُمُ السَّلامُ، فَإِنْ قَالَ لَهُ ذَلِكَ فَسَدَتْ صَلاتُهُ وَكَذَلِكَ إِذَا قَالَ لِلْعَاطِسِ يَرْحَمُكَ اللَّهُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هِىَ الصَّلَوَاتُ الْجَهْرِيَّةُ بَيْنَ الصَّلَوَاتِ الْخَمْسِ."},{"type":"p","text":"     (2) بِمَ يَجْهَرُ الْمُنْفَرِدُ فِى الصَّلاةِ الْجَهْرِيَّةِ."},{"type":"p","text":"     (3) مَا هِىَ الصَّلَوَاتُ السِّرِيَّةُ بَيْنَ الصَّلَوَاتِ الْخَمْسِ."},{"type":"p","text":"     (4) مَنْ فَاتَتْهُ صَلاةٌ مِنَ الصَّلَوَاتِ الْخَمْسِ مَاذَا يَفْعَلُ."},{"type":"p","text":"     (5) مَنْ قَضَى الصَّلاةَ الْجَهْرِيَّةَ فِى وَقْتِ الصَّلاةِ السِّرِيَّةِ هَلْ يَجْهَرُ أَمْ يُسِرُّ أَعْطِ مِثَالًا."},{"type":"p","text":"     (6) مَنْ قَضَى الصَّلاةَ السِّرِيَّةَ فِى وَقْتِ الصَّلاةِ الْجَهْرِيَّةِ هَلْ يَجْهَرُ أَمْ يُسِرُّ أَعْطِ مِثَالًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعَ عَشَرَ"},{"type":"p","text":"صَلاةُ الْجَمَاعَةِ"},{"type":"p","text":""},{"type":"p","text":"يُصَلِّى الْمُسْلِمُونَ فِى كُلِّ يَوْمٍ فِى الْمَسَاجِدِ خَمْسَ صَلَوَاتٍ جَمَاعَةً وَلِصَلاةِ الْجَمَاعَةِ أُمُورٌ يَنْبَغِى مُرَاعَاتُهَا مِنْهَا"},{"type":"p","text":"أَنْ يَقِفَ الْمُصَلِّى خَلْفَ الإِمَامِ وَلا يُكَبِّرُ إِلَّا بَعْدَ أَنْ يُكَبِّرَ الإِمَامُ."},{"type":"p","text":"أَنْ يَنْوِىَ الصَّلاةَ جَمَاعَةً فَيَقُولُ بِقَلْبِهِ مَثَلًا أُصَلِّى فَرْضَ الظُّهْرِ جَمَاعَةً."},{"type":"p","text":"وَإِنْ كَانَ فِى صَلاةٍ سِرِيَّةٍ يَقْرَأُ الْفَاتِحَةَ وَالسُّورَةَ بَعْدَهَا سِرًّا وَأَمَّا فِى الصَّلاةِ الْجَهْرِيَّةِ فَيَقْرَأُ الْفَاتِحَةَ فَقَطْ مِنْ غَيْرِ أَنْ يَجْهَرَ وَيَسْتَمِعُ لِقِرَاءَةِ الإِمَامِ. أَمَّا الإِمَامُ فَيَجْهَرُ بِالْفَاتِحَةِ وَالتَّأْمِينِ وَالسُّورَةِ فِى الرَّكْعَتَيْنِ الأَوَّلِيَيْنِ وَبِكُلِّ التَّكْبِيرَاتِ وَبِقَوْلِ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ."},{"type":"p","text":"أَنْ يَقُولَ ءَامِين مَعَ الإِمَامِ بَعْدَ أَنْ يَقْرَأَ الإِمَامُ ﴿غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلا الضَّالِّينَ﴾ [سُورَةَ الْفَاتِحَةِ/7]."},{"type":"p","text":"أَنْ يَتْبَعَ الإِمَامَ وَلا يَسْبِقَهُ فَيَرْكَعَ بَعْدَ رُكُوعِ الإِمَامِ وَيَعْتَدِلَ بَعْدَ اعْتِدَالِهِ وَيَسْجُدَ بَعْدَ سُجُودِهِ."},{"type":"p","text":"وَإِذَا صَلَّى مُقْتَدِيًا وَلا مَأْمُومَ سِوَاهُ يَقِفُ إِلَى يَمِينِ الإِمَامِ مُتَأَخِّرًا عَنْهُ قَلِيلًا ثُمَّ إِذَا جَاءَ ثَالِثٌ رَجَعَ إِلَى خَلْفِ الإِمَامِ وَوَقَفَ مَعَ الْقَادِمِ فِى صَفٍّ وَاحِدٍ."},{"type":"p","text":"أَنْ لا يُسَلِّمَ الْمَأْمُومُ قَبْلَ الإِمَامِ فَإِنَّهُ إِنْ فَعَلَ ذَلِكَ بَطَلَتْ صَلاتُهُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) أَيْنَ يَقِفُ الْمُصَلِّى خَلْفَ الإِمَامِ وَمَتَى يُكَبِّرُ."},{"type":"p","text":"     (2) مَاذَا يَنْوِى مَنْ أَرَادَ أَنْ يُصَلِّىَ خَلْفَ إِمَامٍ."},{"type":"p","text":"     (3) مَتَى يَقُولُ الْمَأْمُومُ ءَامِين."},{"type":"p","text":"     (4) مَتَى يَرْكَعُ الْمَأْمُومُ وَمَتَى يَعْتَدِلُ."},{"type":"p","text":"     (5) مَتَى يُسَلِّمُ الْمَأْمُومُ وَمَا حُكْمُ صَلاتِهِ إِنْ سَلَّمَ عَمْدًا قَبْلَ الإِمَامِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسَ عَشَرَ"},{"type":"p","text":"صَلاةُ الْجُمُعَةِ"},{"type":"p","text":""},{"type":"p","text":"صَلاةُ الْجُمُعَةِ فَرْضُ عَيْنٍ عَلَى الذُّكُورِ الأَحْرَارِ الْبَالِغِينَ الْعَاقِلِينَ الْمُقِيمِينَ غَيْرِ الْمَعْذُورِينَ إِذَا كَانُوا أَرْبَعِينَ مُسْتَوْطِنِينَ فِى أَبْنِيَةٍ فَلَوْ نَقَصُوا عَنِ الأَرْبَعِينَ أَوْ كَانُوا مُقِيمِينَ فِى الْخِيَامِ لَمْ تَجِبْ عَلَيْهِمْ فِى مَكَانِهِمْ. وَمِنَ الْعُذْرِ الشَّرْعِىِّ أَنْ يَكُونَ الْمُسْلِمُ مَرِيضًا مَرَضًا شَدِيدًا يَشُقُّ عَلَيْهِ مَعَهُ الذَّهَابُ إِلَى مَكَانِ الْجُمُعَةِ."},{"type":"p","text":"وَصَلاةُ الْجُمُعَةِ رَكْعَتَانِ بَدَلَ صَلاةِ الظُّهْرِ يَجْهَرُ الإِمَامُ فِيهِمَا وَيُشْتَرَطُ فِيهَا"},{"type":"p","text":"أَنْ تُصَلَّى بَعْدَ دُخُولِ وَقْتِ الظُّهْرِ."},{"type":"p","text":"وَأَنْ يَسْبِقَهَا خُطْبَتَانِ بَعْدَ دُخُولِ وَقْتِ الظُّهْرِ يَسْمَعُهُمَا الأَرْبَعُونَ."},{"type":"p","text":"وَأَنْ تُصَلَّى جَمَاعَةً بِالأَرْبَعِينَ فَلَوْ نَقَصَ الأَرْبَعُونَ وَاحِدًا لَمْ يُصَلُّوا الْجُمُعَةَ بَلِ الظُّهْرَ."},{"type":"p","text":"وَأَنْ تُقَامَ فِى مَكَانٍ وَاحِدٍ فِى الْبَلَدِ الْوَاحِدِ إِلَّا إِذَا عَسُرَ اجْتِمَاعُ النَّاسِ فَيَجُوزُ التَّعَدُّدُ بِمِقْدَارِ الْحَاجَةِ."},{"type":"p","text":""},{"type":"p","text":"وَأَرْكَانُ الْخُطْبَتَيْنِ"},{"type":"p","text":"حَمْدُ اللَّهِ."},{"type":"p","text":"وَالصَّلاةُ عَلَى النَّبِىِّ."},{"type":"p","text":"وَالْوَصِيَّةُ بِالتَّقْوَى كَأَنْ يَقُولَ أُوصِيكُمْ بِتَقْوَى اللَّهِ وَيَأْتِى الْخَطِيبُ بِهَذِهِ الأَرْكَانِ الثَّلاثَةِ فِى الْخُطْبَتَيْنِ الأُولَى وَالثَّانِيَةِ."},{"type":"p","text":"وَءَايَةٌ مُفْهِمَةٌ فِى إِحْدَاهُمَا وَلَوْ كَانَتْ قَصِيرَةً كَآيَةِ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ وَالأَفْضَلُ أَنْ تَكُونَ فِى الْخُطْبَةِ الأُولَى."},{"type":"p","text":"وَالدُّعَاءُ لِلْمُؤْمِنِينَ فِى الثَّانِيَةِ."},{"type":"p","text":"   وَمَنْ فَاتَتْهُ صَلاةُ الْجَمَاعَةِ صَلَّى الظُّهْرَ لِأَنَّ الْجُمُعَةَ لا تُصَلَّى قَضَاءً جُمُعَةً."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) عَلَى مَنْ تَجِبُ الْجُمُعَةُ."},{"type":"p","text":"     (2) كَمْ رَكْعَةً صَلاةُ الْجُمُعَةِ."},{"type":"p","text":"     (3) عَدِّدْ بَعْضَ شُرُوطِ الْجُمُعَةِ."},{"type":"p","text":"     (4) مَا هِيَ أَرْكَانُ الْخُطْبَتَيْنِ."},{"type":"p","text":"     (5) مَنْ فَاتَتْهُ صَلاةُ الْجُمُعَةِ مَاذَا يَفْعَلُ، لِمَاذَا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسَ عَشَرَ"},{"type":"p","text":"صَلاةُ الْمَسْبُوقِ"},{"type":"p","text":""},{"type":"p","text":"حَثَّنَا الرَّسُولُ ﷺ عَلَى صَلاةِ الْجَمَاعَةِ وَبَيَّنَ فَضْلَهَا عَلَى صَلاةِ الْمُنْفَرِدِ فَقَالَ »صَلاةُ الْجَمَاعَةِ أَفْضَلُ مِنْ صَلاةِ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً« رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ."},{"type":"p","text":"مَنْ هُوَ الْمَسْبُوقُ. "},{"type":"p","text":"الْمَسْبُوقُ هُوَ الَّذِى دَخَلَ فِى صَلاةِ الْجَمَاعَةِ بَعْدَ أَنْ بَدَأَ الإِمَامُ بِهَا بِحَيْثُ لَمْ يُدْرِكْ قَدْرَ الْفَاتِحَةِ مِنْ قِيَامِ الإِمَامِ أَوْ كَانَ الإِمَامُ فِى رُكْنٍ ءَاخَرَ مِنْ أَرْكَانِ الصَّلاةِ كَالرُّكُوعِ أَوِ الِاعْتِدَالِ أَوِ السُّجُودِ أَوِ التَّشَهُّدِ مَثَلًا."},{"type":"p","text":"وَتُدْرَكُ فَضِيلَةُ الْجَمَاعَةِ بِإِدْرَاكِ جُزْءٍ مِنَ الصَّلاةِ مَعَ الإِمَامِ."},{"type":"p","text":"مَاذَا يَفْعَلُ الْمَسْبُوقُ."},{"type":"p","text":"يَدْخُلُ الْمَسْبُوقُ فِى الصَّلاةِ بِتَكْبِيرَةِ الإِحْرَامِ مَعَ النِّيَّةِ وَيُتَابِعُ الإِمَامَ فِيمَا هُوَ فِيهِ."},{"type":"p","text":"فَإِذَا كَانَ الإِمَامُ فِى ءَاخِرِ الْفَاتِحَةِ يَبْدَأُ الْمَأْمُومُ بِالْقِرَاءَةِ فَإِذَا نَزَلَ الإِمَامُ لِلرُّكُوعِ يَقْطَعُ الْقِرَاءَةَ وَيَرْكَعُ مَعَهُ وَتَسْقُطُ عَنْهُ بَقِيَّةُ الْفَاتِحَةِ."},{"type":"p","text":"وَإِذَا كَانَ الإِمَامُ فِى الرُّكُوعِ يَرْكَعُ الْمَأْمُومُ فَإِنِ اطْمَأَنَّ رَاكِعًا قَبْلَ أَنْ يَرْفَعَ الإِمَامُ تُحْسَبُ لَهُ الرَّكْعَةُ وَإِنْ لَمْ يَطْمَئِنْ يَأْتِى بِرَكْعَةٍ بَعْدَ سَلامِ الإِمَامِ."},{"type":"p","text":"أَمَّا إِذَا كَانَ الإِمَامُ فِى مَا بَعْدَ الرُّكُوعِ فِى الِاعْتِدَالِ أَوِ السُّجُودِ أَوِ الْجُلُوسِ فَالْمَأْمُومُ يُتَابِعُهُ وَلا تُحْسَبُ لَهُ هَذِهِ الرَّكْعَةُ بَلْ يَأْتِى بِرَكْعَةٍ بَعْدَ سَلامِ الإِمَامِ."},{"type":"p","text":"وَإِنْ دَخَلَ فِى الصَّلاةِ وَالإِمَامُ فِى التَّشَهُّدِ الأَخِيرِ تَابَعَهُ وَبَعْدَ أَنْ يُسَلِّمَ الإِمَامُ يَقُومُ وَيَأْتِى بِكُلِّ رَكَعَاتِ الصَّلاةِ."},{"type":"p","text":"تَنْبِيهٌ. تَكْبِيرَةُ الإِحْرَامِ تُقَالُ فِى حَالِ الْوُقُوفِ وَلَوْ كَانَ الشَّخْصُ يُرِيدُ إِدْرَاكَ الصَّلاةِ مَعَ مُصَلٍّ رَاكِعٍ مَثَلًا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ يُبَيِّنُ فَضْلَ صَلاةِ الْجَمَاعَةِ."},{"type":"p","text":"     (2) مَنْ هُوَ الْمَسْبُوقُ."},{"type":"p","text":"     (3) بِمَ تُدْرَكُ فَضِيلَةُ الْجَمَاعَةِ."},{"type":"p","text":"     (4) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَكَانَ الإِمَامُ فِى ءَاخِرِ الْفَاتِحَةِ."},{"type":"p","text":"     (5) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَكَانَ الإِمَامُ فِى الرُّكُوعِ."},{"type":"p","text":"     (6) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَالإِمَامُ فِى الِاعْتِدَالِ أَوِ السُّجُودِ."},{"type":"p","text":"     (7) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَالإِمَامُ فِى الْجُلُوسِ لِلتَّشَهُّدِ الأَخِيرِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعَ عَشَرَ"},{"type":"p","text":"قَضَاءُ الصَّلَوَاتِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »مَنْ نَامَ عَنْ صَلاةٍ أَوْ نَسِيَهَا فَلْيُصَلِّهَا إِذَا ذَكَرَهَا لا كَفَّارَةَ لَهَا إِلَّا ذَلِكَ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"فَمَنْ كَانَ نَائِمًا وَقْتَ الصَّلاةِ وَلَمْ يَسْتَيْقِظْ إِلَّا بَعْدَ انْتِهَاءِ وَقْتِهَا فَإِنَّهُ يَقْضِى تِلْكَ الصَّلاةَ وَإِذَا نَسِىَ الْمُسْلِمُ أَدَاءَ الصَّلاةِ وَلَمْ يَتَذَكَّرْهَا إِلَّا بَعْدَ انْتِهَاءِ الْوَقْتِ فَإِنَّهُ يَقْضِيهَا وَأَمَّا مَنْ فَاتَتْهُ صَلَوَاتٌ كَثِيرَةٌ لا يَعْلَمُ عَدَدَهَا بِالضَّبْطِ فَإِنَّهُ يَبْدَأُ بِقَضَاءِ هَذِهِ الصَّلَوَاتِ حَتَّى يَغْلِبَ عَلَى ظَنِّهِ أَنَّهُ قَضَاهَا كُلَّهَا."},{"type":"p","text":"وَلا يُهْمِلُ الْمُسْلِمُ الْكَامِلُ قَضَاءَ مَا عَلَيْهِ مِنْ الصَّلَوَاتِ وَيُسْرِعُ فِى قَضَائِهَا وَلا يَتَقَاعَسُ عَنِ الْقَضَاءِ لِيَشْتَغِلَ بِأُمُورِ الْمَالِ وَالأَوْلادِ وَالتِّجَارَةِ وَنَحْوِ ذَلِكَ."},{"type":"p","text":"وَيُسَنُّ تَرْتِيبُ قَضَاءِ الصَّلَوَاتِ الْفَائِتَةِ فَيَقْضِى الصُّبْحَ ثُمَّ الظُّهْرَ وَهَكَذَا."},{"type":"p","text":"فَمَنْ مَاتَ وَلَمْ يُتِمَّ قَضَاءَ مَا عَلَيْهِ مِنَ الصَّلَوَاتِ وَكَانَ قَدْ بَاشَرَ بِقَضَائِهَا بِهِمَّةٍ وَفِى نِيَّتِهِ أَنْ يُكْمِلَهَا فَاللَّهُ لا يُعَذِّبُهُ عَلَيْهَا إِذَا لَمْ يَتَكَاسَلْ."},{"type":"p","text":"وَلا تُصَلِّى الْمَرْأَةُ فِى حَالِ الْحَيْضِ أَوِ النِّفَاسِ وَلا يَجِبُ عَلَيْهَا قَضَاءُ مَا فَاتَهَا مِنْ صَلاةٍ أَثْنَاءَ الْحَيْضِ وَالنِّفَاسِ إِنَّمَا يَلْزَمُهَا قَضَاءُ مَا فَاتَهَا مِنَ الصِّيَامِ أَثْنَاءَ الْحَيْضِ وَالنِّفَاسِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا الدَّلِيلُ عَلَى لُزُومِ قَضَاءِ الصَّلَوَاتِ الْفَائِتَةِ اذْكُرِ الْحَدِيثَ."},{"type":"p","text":"     (2) مَنْ كَانَ نَائِمًا وَقْتَ الصَّلاةِ ثُمَّ اسْتَيْقَظَ مَاذَا يَفْعَلُ."},{"type":"p","text":"     (3) مَنْ نَسِىَ أَدَاءَ الصَّلاةِ مَاذَا يَفْعَلُ."},{"type":"p","text":"     (4) مَاذَا يَفْعَلُ مَنْ فَاتَتْهُ صَلَوَاتٌ كَثِيرَةٌ لا يَعْلَمُ عَدَدَهَا."},{"type":"p","text":"     (5) مَنْ كَانَ عَلَيْهِ قَضَاءُ الصُّبْحِ وَالظُّهْرِ مَثَلًا بِأَيِّهِمَا يَبْدَأُ."},{"type":"p","text":"     (6) فِى أَىِّ حَالٍ لا تُصَلِّى الْمَرْأَةُ وَهَلْ يَجِبُ عَلَيْهَا الْقَضَاءُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنَ عَشَرَ"},{"type":"p","text":"صِيَامُ شَهْرِ رَمَضَانَ الْمَبَارَكِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿شَهْرُ رَمَضَانَ الَّذِى أُنْزِلَ فِيهِ الْقُرْءانُ هُدًى لِّلنَّاسِ وَبَيِّنَاتٍ مِّنَ الْهُدَى وَالْفُرْقَانِ فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ﴾ [سُورَةَ الْبَقَرَةِ/185]."},{"type":"p","text":"شَهْرُ الصِّيَامِ."},{"type":"p","text":"الصِّيَامُ عِبَادَةٌ عَظِيمَةٌ فَرَضَهَا اللَّهُ عَلَى الْمُسْلِمِينَ لِيَقُومُوا بِهَا فِى شَهْرِ رَمَضَانَ مِنْ كُلِّ عَامٍ وَفِيهَا الثَّوَابُ الْجَزِيلُ مِنَ اللَّهِ سُبْحَانَهُ وَتَعَالَى."},{"type":"p","text":"مَعْنَى الصِّيَامِ."},{"type":"p","text":"وَالصِّيَامُ هُوَ الِامْتِنَاعُ عَنِ الأَكْلِ وَالشُّرْبِ وَسَائِرِ الْمُفَطِّرَاتِ مَعَ النِّيَّةِ مِنْ طُلُوعِ الْفَجْرِ إِلَى غُرُوبِ الشَّمْسِ فَيَقُولُ بِقَلْبِهِ نَوَيْتُ صِيَامَ يَوْمِ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانَ هَذِهِ السَّنَةِ إِيـمَانًا وَاحْتِسَابًا لِلَّهِ تَعَالَى."},{"type":"p","text":"مُفْسِدَاتُ الصِّيَامِ."},{"type":"p","text":"هُنَاكَ أُمُورٌ تُفْسِدُ الصِّيَامَ مِنْهَا"},{"type":"p","text":"الأَكْلُ وَالشُّرْبُ وَلَوْ قَلِيلًا إِذَا كَانَ ذَاكِرًا أَنَّهُ فِى الصِّيَامِ أَمَّا مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا لَمْ يُفْطِرْ وَلَوْ كَانَ صَائِمًا فِى غَيْرِ رَمَضَانَ وَذَلِكَ لِقَوْلِ النَّبِىِّ ﷺ »مَنْ نَسِىَ وَهُوَ صَائِمٌ فَأَكَلَ أَوْ شَرِبَ فَلْيُتِمَّ صَوْمَهُ فَإِنَّمَا أَطْعَمَهُ اللَّهُ وَسَقَاهُ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"وَإِذَا أَخْرَجَ الصَّائِمُ الْقَىْءَ عَمْدًا بِإِصْبَعِهِ مَثَلًا أَفْطَرَ وَأَمَّا إِنْ غَلَبَهُ الْقَىْءُ فَلا يُفْطِرُ."},{"type":"p","text":"وَالْقَطْرَةُ فِى الأُذُنِ وَالأَنْفِ تُفَطِّرُ إِذَا وَصَلَ الْمَقْطُورُ إِلَى الْجَوْفِ أَمَّا الْقَطْرَةُ فِى الْعَيْنِ فَلا تُفَطِّرُ."},{"type":"p","text":"هُنَاكَ حَالاتٌ يَجُوزُ فِيهَا الْفِطْرُ مِنْهَا."},{"type":"p","text":"الْمَرِيضُ مَرَضًا يَخَافُ عَلَى نَفْسِهِ مَعَهُ الضَّرَرَ مِنَ الصَّوْمِ."},{"type":"p","text":"وَالْمُسَافِرُ سَفَرًا طَوِيلًا كَالَّذِى يُسَافِرُ مِنْ بَيْرُوتَ إِلَى دِمْشَقَ."},{"type":"p","text":"وَلا يَجُوزُ لِلْحَائِضِ وَالنُّفَسَاءِ الصَّوْمُ وَعَلَيْهِمَا الْقَضَاءُ بَعْدَ انْتِهَاءِ شَهْرِ رَمَضَانَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى الأَمْرِ بِصَوْمِ شَهْرِ رَمَضَانَ."},{"type":"p","text":"     (2) مَا هُوَ الصِّيَامُ."},{"type":"p","text":"     (3) مَا هُوَ وَقْتُ الصِّيَامِ."},{"type":"p","text":"     (4) مَا هُوَ كَمَالُ النِّيَّةِ فِى الصَّوْمِ."},{"type":"p","text":"     (5) عَدِّدْ بَعْضَ مَا يُفْسِدُ الصِّيَامَ."},{"type":"p","text":"     (6) مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا هَلْ يُفْسِدُ صِيَامَهُ وَلِمَاذَا."},{"type":"p","text":"     (7) مَا الْحُكْمُ إِذَا غَلَبَهُ الْقَىْءُ."},{"type":"p","text":"     (8) مَا حُكْمُ الْقَطْرَةِ فِى الأُذُنِ وَالأَنْفِ وَالْعَيْنِ."},{"type":"p","text":"     (9) مَنْ يَجُوزُ لَهُ الْفِطْرُ فِى رَمَضَانَ."},{"type":"p","text":"     (10) مَاذَا تَفْعَلُ الْحَائِضُ وَالنُّفَسَاءُ وَقْتَ الصِّيَامِ وَمَاذَا يَجِبُ عَلَيْهِمَا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعَ عَشَرَ"},{"type":"p","text":"الزَّكَاةُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَأَقِيمُوا الصَّلاةَ وَءَاتُوا الزَّكَاةَ﴾ [سُورَةَ النُّورِ/56]."},{"type":"p","text":"فَرَضَ اللَّهُ تَعَالَى عَلَى الْمُسْلِمِ أَنْ يَدْفَعَ قِسْمًا مَعْلُومًا مِنْ مَالِهِ إِذَا وَجَبَتْ فِيهِ الزَّكَاةُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَغَيْرِهِمْ مِنَ الْمُسْلِمِينَ الَّذِينَ ذَكَرَهُمُ اللَّهُ تَعَالَى فِى الآيَةِ الْكَرِيمَةِ ﴿إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاء وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِي الرِّقَابِ وَالْغَارِمِينَ وَفِي سَبِيلِ اللَّهِ وَابْنِ السَّبِيلِ﴾ [سُورَةَ التَّوْبَةِ/60]."},{"type":"p","text":"الْفُقَرَاءُ هُمُ الَّذِينَ لا يَجِدُونَ نِصْفَ كِفَايَتِهِمُ الضَّرُورِيَّةِ."},{"type":"p","text":"وَالْمَسَاكِينُ هُمُ الَّذِينَ لا يَجِدُونَ كُلَّ كِفَايَتِهِمُ الضَّرُورِيَّةِ وَلَكِنْ يَجِدُونَ نِصْفَهَا أَوْ أَكْثَرَ."},{"type":"p","text":"وَالْعَامِلُونَ عَلَيْهَا هُمُ الَّذِينَ يَجْمَعُونَ الزَّكَاةَ لِلْخَلِيفَةِ بِدُونِ رَاتِبٍ."},{"type":"p","text":"وَالْمُؤَلَّفَةُ قُلُوبُهُمْ هُمُ الَّذِينَ أَسْلَمُوا حَدِيثًا وَيُرْجَى بِإِعْطَائِهِمْ مِنَ الزَّكَاةِ إِسْلامُ نُظَرَائِهِمْ."},{"type":"p","text":"وَفِى الرِّقَابِ هُمُ الْعَبِيدُ الَّذِينَ شَرَطَ عَلَيْهِمْ أَسْيَادُهُمْ قَدْرًا مِنَ الْمَالِ لِيَتَحَرَّرُوا."},{"type":"p","text":"وَالْغَارِمُونَ هُمُ الْمَدِينُونَ الْعَاجِزُونَ عَنْ وَفَاءِ دُيُونِهِمْ غَيْرِ الْمُحَرَّمَةِ."},{"type":"p","text":"وَفِى سَبِيلِ اللَّهِ هُمُ الْغُزَاةُ الْمُتَطَوِّعُونَ فِى سَبِيلِ اللَّهِ."},{"type":"p","text":"وَابْنُ السَّبِيلِ هُوَ الْمُسَافِرُ الَّذِى مَرَّ بِبَلَدِ الزَّكَاةِ وَلَيْسَ مَعَهُ مَا يَرُدُّهُ إِلَى بَلَدِهِ."},{"type":"p","text":""},{"type":"p","text":"زَكَاةُ الْفِطْرِ."},{"type":"p","text":"كَذَلِكَ يَجِبُ عَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ أَنْ يَدْفَعَ زَكَاةَ الْفِطْرِ فِى رَمَضَانَ أَوْ يَوْمِ الْعِيدِ عَنْ نَفْسِهِ وَزَوْجَتِهِ وَأَوْلادِهِ الصِّغَارِ وَوَالِدَيْهِ إِذَا كَانَا فَقِيرَيْنِ."},{"type":"p","text":"وَيَدْفَعُ عَنْ كُلِّ نَفْسٍ صَاعًا مِنْ غَالِبِ قُوتِ الْبَلَدِ كَالْقَمْحِ لِمُسْلِمٍ فَقِيرٍ أَوْ غَيْرِهِ مِنْ مُسْتَحِقِّى الزَّكَاةِ وَالصَّاعُ يُسَاوِى أَرْبَعَ حَفَنَاتٍ بِالْيَدَيْنِ الْمُعْتَدِلَتَيْنِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا الأَمْرُ بِدَفْعِ الزَّكَاةِ."},{"type":"p","text":"     (2) اذْكُرِ الآيَةَ الْقُرْءَانِيَةَ الَّتِى تُبَيِّنُ الأَصْنَافَ الْمُسْتَحِقِّينَ لِلزَّكَاةِ."},{"type":"p","text":"     (3) مَنْ هُمُ الْفُقَرَاءُ."},{"type":"p","text":"     (4) مَنْ هُمُ الْمَسَاكِينُ."},{"type":"p","text":"     (5) مَنْ هُمُ الْعَامِلُونَ عَلَيْهَا."},{"type":"p","text":"     (6) مَنْ هُمُ الْمُؤَلَّفَةُ قُلُوبُهُمْ."},{"type":"p","text":"     (7) مَا مَعْنَى وَفِى الرِّقَابِ."},{"type":"p","text":"     (8) مَنْ هُمُ الْغَارِمُونَ."},{"type":"p","text":"     (9) مَا مَعْنَى وَفِى سَبِيلِ اللَّهِ."},{"type":"p","text":"     (10) مَنْ هُوَ ابْنُ السَّبِيلِ."},{"type":"p","text":"     (11) مَا هُوَ مِقْدَارُ زَكَاةِ الْفِطْرِ."},{"type":"p","text":"     (12) كَمْ يُسَاوِى الصَّاعُ."},{"type":"p","text":""}],"paragraphCount":430,"wordCount":4334,"readingMinutes":25,"description":"المحتوى الكامل لـ فَصْلُ الْعِبَادَاتِ من الجزء الرابع، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الرَّابِعُ فَصْلُ الْعِبَادَاتِ فَصْلُ الْعِبَادَاتِ\nالدَّرْسُ الأَوَّلُ\nأَقْسَامُ الْمِيَاهِ\n\nتُقْسَمُ الْمِيَاهُ إِلَى عِدَّةِ أَقْسَامٍ مِنْهَا\nمَاءٌ طَهُورٌ أَىْ طَاهِرٌ مُطَهِّرٌ.\nوَمَاءٌ طَاهِرٌ غَيْرُ مُطَهِّرٍ.\nوَمَاءٌ نَجِسٌ.\nالْمَاءُ الطَّهُورُ هُوَ الْمَاءُ الطَّاهِرُ فِى نَفْسِهِ الْمُطَهِّرُ لِغَيْرِهِ أَىْ يُمْكِنُ الِاغْتِسَالُ مِنْهُ وَالْوُضُوءُ وَإِزَالَةُ النَّجَاسَةِ بِهِ كَمَاءِ الْمَطَرِ أَوِ الْبَحْرِ أَوِ النَّهْرِ أَوِ الْبِئْرِ أَوِ الْعَيْنِ.\nالْمَاءُ الطَّاهِرُ غَيْرُ الْمُطَهِّرِ مِنْهُ\nالْمَاءُ الْمُسْتَعْمَلُ هُوَ الْمَاءُ الَّذِى اسْتُعْمِلَ فِى رَفْعِ الْحَدَثِ غُسْلًا كَانَ أَوْ وُضُوءًا أَوْ فِى إِزَالَةِ نَجَاسَةٍ إِذَا أَزَالَهَا وَلَمْ تَتَغَيَّرْ إِحْدَى صِفَاتِهِ أَىْ لَوْنُهُ أَوْ طَعْمُهُ أَوْ رَائِحَتُهُ. فَهَذَا الْمَاءُ طَاهِرٌ فِى نَفْسِهِ غَيْرُ مُطَهِّرٍ لِغَيْرِهِ أَىْ إِنْ جَمَعْنَاهُ لا نَسْتَطِيعُ أَنْ نَسْتَعْمِلَهُ بَعْدَ ذَلِكَ لِلْغُسْلِ وَالْوُضُوءِ وَإِزَالَةِ النَّجَاسَةِ إِلَّا إِذَا كَثُرَ وَلَكِنْ نَسْتَطِيعُ اسْتِعْمَالَهُ لِغَسْلِ الثِّيَابِ غَيْرِ الْمُتَنَجِّسَةِ مَثَلًا.\nوَأَمَّا الْمَاءُ النَّجِسُ فَهُوَ الْمَاءُ الْقَلِيلُ الَّذِى وَقَعَتْ فِيهِ نَجَاسَةٌ غَيْرُ مَعْفُوٍّ عَنْهَا سَوَاءٌ تَغَيَّرَتْ إِحْدَى صِفَاتِهِ أَمْ لا وَكَذَلِكَ الْمَاءُ الْكَثِيرُ إِذَا وَقَعَتْ فِيهِ نَجَاسَةٌ غَيَّرَتْ صَفَاتِهِ الثَّلاثَةَ كُلَّهَا أَوْ بَعْضَهَا أَمَّا إِنْ لَمْ تَتَغَيَّرْ صِفَاتُهُ فَلا يَتَنَجَّسُ. وَالْمَاءُ الْكَثِيرُ هُوَ مِقْدَارُ قُلَّتَيْنِ فَأَكْثَرَ وَالْقُلَّتَانِ نَحْوُ مِائَةٍ وَأَرْ

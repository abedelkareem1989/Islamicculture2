وَمِنْ جُمْلَةِ وَظَائِفِهِ النُّزُولُ بِالْوَحْىِ عَلَى الأَنْبِيَاءِ وَسَيِّدُنا عَزْرَائِيلُ عَلَيْهِ السَّلامُ مُكَلَّفٌ بِقَبْضِ الأَرْوَاحِ وَسَيِّدُنَا مِيكَائِيلُ عَلَيْهِ السَّلامُ مُكَلَّفٌ بِالْمَطَرِ وَالزَّرْعِ وَسَيِّدُنَا إِسْرَافِيلُ عَلَيْهِ السَّلامُ مُكَلَّفٌ بِالنَّفْخِ فِى الصُّورِ.\nالْمُسْلِمُ يُحِبُّ الْمَلائِكَةَ جَمِيعَهُمْ وَلا يَسْتَهْزِئُ بِهِمْ وَلا يَشْتِمُهُمْ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الْمَلائِكَةِ.\n     (2) مَنْ هُمُ الْمَلائِكَةُ وَمِمَّ خَلَقَهُمُ اللَّهُ.\n     (3) مَنْ أَكْثَرُ عَدَدًا الْمَلائِكَةُ أَمِ الْبَشَرُ وَأَيْنَ مَسْكَنُ الْمَلائِكَةِ.\n     (4) مَنْ هُمْ رُؤَسَاءُ الْمَلائِكَةِ.\n     (5) مَنْ أَفْضَلُ الْمَلائِكَةِ اذْكُرْ بَعْضَ وَظَائِفِهِ.\n     (6) مَنْ هُوَ الْمَلَكُ الْمُكَلَّفُ بِقَبْضِ الأَرْوَاحِ.\n     (7) مَنْ هُوَ الْمَلَكُ الْمُكَلَّفُ بِالْمَطَرِ وَالزَّرْعِ.\n     (8) مَنْ هُوَ الْمَلَكُ الْمُكَلَّفُ بِالنَّفْخِ فِى الصُّورِ.\n\n\nالدَّرْسُ التَّاسِعُ\nالْكُتُبُ السَّمَاوِيـَّــةُ\n\nإِنَّ اللَّهَ تَعَالَى أَنْزَلَ كُتُبًا سَمَاوِيَّةً عَلَى بَعْضِ الرُّسُلِ لِهِدَايَةِ النَّاسِ وَإِرْشَادِهِمْ لِمَا فِيهِ خَيْرُهُمْ وَسَعَادَتُهُمْ فِى الآخِرَةِ وَعَدَدُ الْكُتُبِ السَّمَاوِيَّةِ كَثِيرٌ وَلَكِنْ أَشْهَرُهَا أَرْبَعَةٌ هِىَ\nالزَّبُورُ أُنْزِلَ عَلَى سَيِّدِنَا دَاوُدَ عَلَيْهِ السَّلامُ.\nوَالتَّوْرَاةُ الأَصْلِيَّةُ أُنْزِلَتْ عَلَى سَيِّدِنَا مُوسَى عَلَيْهِ السَّلامُ بِاللُّغَةِ الْعِبْرَانِيَّةِ.\nوَالإِنْجِيلُ الأَصْلِىُّ أُنْزِلَ عَلَى سَيِّدِنَا عِيسَى عَلَيْهِ السَّلامُ بِاللُّغَةِ السُّرْيَانِيَّةِ.\nوَالْقُرْءَانُ أُنْزِلَ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ بِاللُّغَةِ الْعَرَبِيَّةِ وَهُوَ أَفْضَلُ الْكُتُبِ وَءَاخِرُهَا.\n\nدُعَاءٌ\nرَبَّنَا لا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.\n\n     أَسْئِلَةٌ\n     (1) مَا هِىَ الْكُتُبُ السَّمَاوِيَّةُ.\n     (2) مَا هِىَ أَشْهَرُ الْكُتُبِ السَّمَاوِيَّةِ.\n     (3) عَلَى مَنْ أُنْزِلَ الزَّبُورُ.\n     (4) عَلَى مَنْ أُنْزِلَتِ التَّوْرَاةُ الأَصْلِيَّةُ وَبِأَىِّ لُغَةٍ.\n     (5) عَلَى مَنْ أُنْزِلَ الإِنْجِيلُ الأَصْلِىُّ وَبِأَىِّ لُغَةٍ.\n     (6) عَلَى مَنْ أُنْزِلَ الْقُرْءَانُ وَبِأَىِّ لُغَةٍ.\n\nالدَّرْسُ الْعَاشِرُ\nالْيَوْمُ الآخِـــــرُ\n\nالْيَوْمُ الآخِرُ هُوَ يَوْمُ الْقِيَامَةِ وَيَبْدَأُ مِنْ خُرُوجِ النَّاسِ مِنْ قُبُورِهِمْ بَعْدَ أَنْ يَنْفُخَ سَيِّدُنَا إِسْرَافِيلُ بِالصُّورِ.\nوَالأَجْسَادُ الَّتِى أَكَلَهَا التُّرَابُ يُعِيدُهَا اللَّهُ تَعَالَى كَمَا كَانَتْ وَيُعِيدُ الرُّوحَ إِلَيْهَا ثُمَّ يُجْمَعُونَ لِلْحِسَابِ عَلَى أَرْضٍ غَيْرِ هَذِهِ الأَرْضِ لا جِبَالَ فِيهَا وَلا بِحَارَ تُسَمَّى الأَرْضَ الْمُبَدَّلَةَ فَتُوزَنُ أَعْمَالُهُمْ فِى الْمِيزَانِ الَّذِى لَهُ كَفَّتَانِ كَفَّةٌ لِلْحَسَنَاتِ وَكَفَّةٌ لِلسَّيِّئَاتِ وَالْكَافِرُ لَيْسَ لَهُ مِنَ الْحَسَنَاتِ شَىْءٌ ثُمَّ يُدْخِلُ اللَّهُ تَعَالَى الْمُؤْمِنِينَ الأَتْقِيَاءَ الْجَنَّةَ بِلا عَذَابٍ.\nأَمَّا الْمُؤْمِنُونَ الْعُصَاةُ فَقِسْمٌ مِنْهُمْ يُسَامِحُهُمُ اللَّهُ وَيُدْخِلُهُمُ الْجَنَّةَ بِلا عَذَابٍ وَقِسْمٌ مِنْهُمْ يُعَذِّبُهُمُ اللَّهُ فِى النَّارِ ثُمَّ يُدْخِلُهُمُ الجَنَّةَ.\nوَأَمَّا الْكُفَّارُ فَإِنَّهُمْ لا يَدْخُلُونَ الْجَنَّةَ بِالْمَرَّةِ إِنَّمَا يُدْخِلُهُمُ اللَّهُ النَّارَ وَيُخَلَّدُونَ فِيهَا.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ الْيَوْمُ الآخِرُ.\n     (2) مَتَى يَبْدَأُ الْيَوْمُ الآخِرُ.\n     (3) مَاذَا يَحْصُلُ لِلأَجْسَادِ الَّتِى أَكَلَهَا التُّرَابُ.\n     (4) لِمَ يُجْمَعُ النَّاسُ يَوْمَ الِقِيَامَةِ وَأَيْنَ يُجْمَعُونَ.\n     (5) مَاذَا تُسَمَّى الأَرْضُ الَّتِى يُحْشَرُ عَلَيْهَا النَّاسُ.\n     (6) بِمَ تُوزَنُ أَعْمَالُ الْعِبَادِ.\n     (7) مَنْ يَدْخُلُ الْجَنَّةَ بِلا عَذَابٍ.\n     (8) مَاذَا يَحْصُلُ لِلْمُؤْمِنِينَ الْعُصَاةِ يَوْمَ الْقِيَامَةِ.\n\nالدَّرْسُ الْحَادِى عَشَرَ\nالإِيـمَانُ بِالْقَدَرِ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾ [سُورَةَ الْقَمَرِ/49].\nإنَّ اللَّهَ تَعَالَى خَلَقَ الْمَخْلُوقَاتِ كُلَّهَا فَمِنْهَا الْحَسَنُ وَالْقَبِيحُ وَالْحُلْوُ وَالْمُرُّ وَالْخَيْرُ وَالشَّرُّ وَخَلَقَ الإِنْسَانَ وَخَلَقَ أَعْمَالَهُ فَالصَّالِحُ مِنْ هَذِهِ الأَعْمَالِ يَكُونُ بِمَحَبَّةِ اللَّهِ وَخَلْقِهِ وَرِضَاهُ.\nوَالسَّيِّئُ مِنْ هَذِهِ الأَعْمَالِ يَكُونُ بِخَلْقِهِ وَلَيْسَ بِمَحَبَّتِهِ وَرِضَاهُ.\nوَجَمِيعُ مَا يَحْصُلُ فَى هَذَا الْعَالَمِ مِنْ خَيْرٍ وَشَرٍّ يَحْصُلُ بِمَشِيئَةِ اللَّهِ تَعَالَى وَتَقْدِيرِهِ وَعِلْمِهِ.\nقَالَ رَسُولُ اللَّهِ ﷺ »مَا شَاءَ اللَّهُ كَانَ وَمَا لَمْ يَشَأْ لَمْ يَكُنْ« رَوَاهُ أَبُو دَاوُدَ.\nفَكُلُّ مَا أَرَادَ اللَّهُ وَجُودَهُ لا بُدَّ أَنْ يُوجَدَ وَمَا لَمْ يُرِدْ وُجُودَهُ فَلا يُوجَدُ أَبَدًا.\n \nلِلْحِفْظِ غَيْبـًــا\nالطَّاعَاتُ تَحْصُلُ مِنَ الْعَبْدِ الْمَعَاصِى تَحْصُلُ مِنَ الْعَبْدِ\nبِمَشِيئَةِ اللَّهِ بِمَشِيئَةِ اللَّهِ\nوَعِلْمِ اللَّهِ وَعِلْمِ اللَّهِ\nوَتَقْدِيرِ اللَّهِ وَتَقْدِيرِ اللَّهِ\nوَبِخَلْقِ اللَّهِ وَبِخَلْقِ اللَّهِ\nوَبِأَمْرِ اللَّهِ لا بِأَمْرِ اللَّهِ\nوَبِمَحَبَّتِهِ وَلا بِمَحَبَّتِهِ\nوَرِضَاهُ وَلا بِرِضَاهُ\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الإِيـمَانِ بِالْقَدَرِ.\n     (2) مَا مَعْنَى الإِيـمَانِ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ.\n     (3) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ ﷺ عَنِ الْمَشِيئَةِ وَمَنْ رَوَاهُ.\n     (4) مَا مَعْنَى هَذَا الْحَدِيثِ.\n"},{"id":"part3-section2","partIndex":3,"partName":"الجزء الثالث","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّالِثُ"],"title":"فَصْلُ الْعِبَادَاتِ","blocks":[{"type":"p","text":"فَصْلُ الْعِبَادَاتِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"الْوُضُوءُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ﴾ [سُورَةَ الْمَائِدَةِ/6]."},{"type":"p","text":"أَرْكَانُ الْوُضُوءِ سِتَّةٌ هِىَ"},{"type":"p","text":"النِّيَّةُ بِالْقَلْبِ عِنْدَ غَسْلِ الْوَجْهِ فَيَقُولُ بِقَلْبِهِ نَوَيْتُ الْوُضُوءَ أَوْ نَحْوَهُ."},{"type":"p","text":"وَغَسْلُ الْوَجْهِ مِنْ مَنَابِتِ شَعْرِ الرَّأْسِ إِلَى أَسْفَلِ الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ."},{"type":"p","text":"وَغَسْلُ الْيَدَيْنِ إِلَى الْمِرْفَقَيْنِ أَىْ مَعَ الْمِرْفَقَيْنِ."},{"type":"p","text":"وَمَسْحُ بَعْضِ الرَّأْسِ."},{"type":"p","text":"وَغَسْلُ الرِّجْلَيْنِ إِلَى الْكَعْبَيْنِ أَىْ مَعَ الْكَعْبَيْنِ."},{"type":"p","text":"وَالتَّرْتِيبُ أَىْ تَرْتِيبُ هَذِهِ الأُمُورِ كَمَا ذُكِرَتْ."},{"type":"p","text":"وَمِنْ سُنَنِ الْوُضُوءِ"},{"type":"p","text":"التَّسْمِيَةُ."},{"type":"p","text":"وَالِاسْتِيَاكُ."},{"type":"p","text":"وَغَسْلُ الْكَفَّيْنِ."},{"type":"p","text":"وَالْمَضْمَضَةُ. "},{"type":"p","text":"وَالِاسْتِنْشَاقُ."},{"type":"p","text":"وَمَسْحُ جَمِيعِ الرَّأْسِ."},{"type":"p","text":"وَمَسْحُ الأُذُنَيْنِ."},{"type":"p","text":"وَتَخْلِيلُ أَصَابِعِ الْيَدَيْنِ وَالرِّجْلَيْنِ."},{"type":"p","text":"وَالطَّهَارَةُ ثَلاثًا ثَلاثًا."},{"type":"p","text":"وَتَقْدِيمُ الْيُمْنَى عَلَى الْيُسْرَى."},{"type":"p","text":"وَغَسْلُ الْعُضْوِ قَبْلَ أَنْ يَجِفَّ الْعُضْوُ الَّذِى قَبْلَهُ."},{"type":"p","text":"وَالدَّلْكُ وَهُوَ إِمْرَارُ الْيَدِ عَلَى الْعُضْوِ الْمَغْسُولِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا عَنْ أَرْكَانِ الْوُضُوءِ."},{"type":"p","text":"     (2) مَا هِىَ أَرْكَانُ الْوُضُوءِ عَدِّدْهَا."},{"type":"p","text":"     (3) مَتَى تَكُونُ النِّيَّةُ وَمَا هُوَ مَحَلُّهَا."},{"type":"p","text":"     (4) مَا هُوَ الْحَدُّ الْوَاجِبُ فِى غَسْلِ الْوَجْهِ."},{"type":"p","text":"     (5) مَا هُوَ الْحَدُّ الْوَاجِبُ فِى غَسْلِ الْيَدَيْنِ."},{"type":"p","text":"     (6) مَا هُوَ الْحَدُّ الْوَاجِبُ فِى مَسْحِ الرَّأْسِ."},{"type":"p","text":"     (7) مَا هُوَ الْحَدُّ الْوَاجِبُ فِى غَسْلِ الرِّجْلَيْنِ."},{"type":"p","text":"     (8) مَا مَعْنَى التَّرْتِيبِ."},{"type":"p","text":"     (9) عَدِّدْ بَعْضَ سُنَنِ الْوُضُوءِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"نَوَاقِضُ الْوُضُوءِ"},{"type":"p","text":""},{"type":"p","text":"مِنْ نَوَاقِضِ الْوُضُوءِ"},{"type":"p","text":"خُرُوجُ الْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ."},{"type":"p","text":"وَالنَّوْمُ عَلَى الْبَطْنِ أَوِ الظَّهْرِ أَوِ الْجَنْبِ الأَيْمَنِ أَوِ الأَيْسَرِ."},{"type":"p","text":"وَمَسُّ ءَالَةِ خُرُوجِ الْبَوْلِ أَوْ حَلْقَةِ الدُّبُرِ بِبَطْنِ الْكَفِّ بِلا حَائِلٍ."},{"type":"p","text":"وَالْجُنُونُ وَالإِغْمَاءُ."},{"type":"p","text":"فَمَنِ انْتَقَضَ وُضُوؤُهُ فَلا يَجُوزُ لَهُ أَنْ يُصَلِّىَ إِلَّا بَعْدَ تَجْدِيدِ وُضُوئِهِ."},{"type":"p","text":"شَرْحُ بَعْضِ الْكَلِمَاتِ"},{"type":"p","text":"بَاطِنُ الْكَفِّ مَا لا يَظْهَرُ عِنْدَ إِطْبَاقِ إِحْدَى الْكَفَّيْنِ عَلَى الأُخْرَى مَعَ قَلِيلٍ مِنَ التَّحَامُلِ وَالتَّفْرِيقِ بَيْنَ الأَصَابِعِ تَفْرِيقًا وَسَطًا."},{"type":"p","text":"الْحَائِلُ كَأَنْ يَكُونَ لابِسًا قُفَّازًا عِنْدَ الْمَسِّ بِالْكَفِّ."},{"type":"p","text":"مِنْ مَكْرُوهَاتِ الْوُضُوءِ "},{"type":"p","text":"الزِّيَادَةُ عَلَى ثَلاثِ مَرَّاتٍ فِى الْغَسْلِ أَوِ الْمَسْحِ."},{"type":"p","text":"وَالْكَلامُ أَثْنَاءَ الْوُضُوءِ بِغَيْرِ كَلامِ الْخَيْرِ كَذِكْرِ اللَّهِ. "},{"type":"p","text":"وَالزِّيَادَةُ الْمُفْرِطَةُ فِى الْمَاءِ الْمُسْتَعْمَلِ لِلْوُضُوءِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) عَدِّدْ نَوَاقِضَ الْوُضُوءِ."},{"type":"p","text":"     (2) مَنِ انْتَقَضَ وُضُوؤُهُ مَتَى يَجُوزُ لَهُ أَنْ يُصَلِّىَ."},{"type":"p","text":"     (3) مَا مَعْنَى بَاطِنِ الْكَفِّ."},{"type":"p","text":"     (4) عَدِّدْ بَعْضَ مَكْرُوهَاتِ الْوُضُوءِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"الِاسْتِنْجَاءُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [سُورَةَ الْبَقَرَةِ/222]."},{"type":"p","text":"يَجِبُ الِاسْتِنْجَاءُ لِخُرُوجِ النَّجِسِ الرَّطْبِ مِنْ أَحَدِ السَّبِيلَيْنِ كَالْبَوْلِ وَالْغَائِطِ."},{"type":"p","text":"وَيَكْفِي فِى الِاسْتِنْجَاءِ مِنَ الْغَائِطِ صَبُّ الْمَاءِ الْمُطَهِّرِ عَلَى مَوْضِعِ النَّجَاسَةِ بِالْيَدِ الْيُمْنَى مَعَ الدَّلْكِ بِالْيَدِ الْيُسْرَى حَتَّى تَزُولَ النَّجَاسَةُ وَيُصْبِحَ الْمَوْضِعُ طَاهِرًا. "},{"type":"p","text":"وَمِنَ الْبَوْلِ صَبُّ الْمَاءِ عَلَى مَحَلِّ النَّجَاسَةِ إِلَى أَنْ يَطْهُرَ الْمَحَلُّ وَلا يَصِحُّ أَخْذُ الْمَاءِ فِى الْيَدِ وَدَلْكُ مَوْضِعِ النَّجَاسَةِ بِهِ بِلا صَبٍّ لِأَنَّ فِى ذَلِكَ تَعْمِيمًا لِلنَّجَاسَةِ."},{"type":"p","text":"فَمَنْ خَرَجَ مِنْهُ شَىْءٌ مِنْ ذَلِكَ ثُمَّ تَوَضَّأَ وَصَلَّى بِدُونِ اسْتِنْجَاءٍ لا تَصِحُّ صَلاتُهُ."},{"type":"p","text":""},{"type":"p","text":"تَنْبِيهٌ"},{"type":"p","text":"لا يَجِبُ الِاسْتِنْجَاءُ مِنْ خُرُوجِ الرِّيحِ."},{"type":"p","text":""},{"type":"p","text":"لِلْحِفْظِ غَيْبًا"},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »الطُّهُورُ شَطْرُ الإِيـمَانِ« رَوَاهُ مُسْلِمٌ."},{"type":"p","text":"وَالطُّهُورُ هُوَ رَفْعُ الْحَدَثِ وَإِزَالَةُ النَّجَسِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الطَّهَارَةِ."},{"type":"p","text":"     (2) مِمَّنْ يَجِبُ الِاسْتِنْجَاءُ."},{"type":"p","text":"     (3) كَيْفَ يُسْتَنْجَى مِنَ الْغَائِطِ."},{"type":"p","text":"     (4) كَيْفَ يُسْتَنْجَى مِنَ الْبَوْلِ."},{"type":"p","text":"     (5) مَنْ صَلَّى مِنْ غَيْرِ اسْتِنْجَاءٍ هَلْ تَصِحُّ صَلاتُهُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"الأَذَانُ وَالإِقَامَـــةُ"},{"type":"p","text":""},{"type":"p","text":"إِذَا دَخَلَ وَقْتُ الصَّلاةِ يُسَنُّ الأَذَانُ وَفِيهِ يَقُومُ أَحَدُ الْمُسْلِمِينَ بِالدَّعْوَةِ إِلَى تَأْدِيَةِ الصَّلاةِ بِأَلْفَاظٍ مَخْصُوصَةٍ بِصَوْتٍ مُرْتَفِعٍ وَأَلْفَاظُ الأَذَانِ هِىَ"},{"type":"p","text":"اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ."},{"type":"p","text":"أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":"أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":"حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاحِ حَىَّ عَلَى الْفَلاحِ."},{"type":"p","text":"اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":"وَفِى أَذَانِ الصُّبْحِ يُسَنُّ أَنْ يَزِيدَ الْمُؤَذِّنُ بَعْدَ قَوْلِهِ حَىَّ عَلَى الْفَلاحِ الثَّانِيَةِ الصَّلاةُ خَيْرٌ مِنَ النَّوْمِ الصَّلاةُ خَيْرٌ مِنَ النَّوْمِ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الإِقَامَةُ"},{"type":"p","text":"بَعْدَ أَنْ يَنْتَهِىَ الْمُؤَذِّنُ مِنَ الأَذَانِ وَبَعْدَ أَنْ يَجْتَمِعَ النَّاسُ وَيَتَهَيَّؤُونَ لِتَأْدِيَةِ فَرِيضَةِ الصَّلاةِ يَتَوَلَّى أَحَدُهُمْ إِقَامَةَ الصَّلاةِ فَيَقُولُ"},{"type":"p","text":"اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاحِ، قَدْ قَامَتِ الصَّلاةُ قَدْ قَامَتِ الصَّلاةُ، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":"وَيُسْتَحَبُّ بَعْدَ الأَذَانِ وَالإِقَامَةِ الصَّلاةُ عَلَى النَّبِىِّ ﷺ وَذَلِكَ لِقَوْلِهِ عَلَيْهِ السَّلامُ »مَنْ ذَكَرَنِى فَلْيُصَلِّ عَلَىَّ« رَوَاهُ الْحَافِظُ السَّخَاوِىُّ."},{"type":"p","text":"فَائِدَةٌ يُسْتَحَبُّ الدُّعَاءُ بَيْنَ الأَذَانِ وَالإِقَامَةِ لِحَدِيثِ »لا يُرَدُّ الدُّعَاءُ بَيْنَ الأَذَانَيْنِ«."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) إِذَا دَخَلَ وَقْتُ الصَّلاةِ مَاذَا يُسَنُّ."},{"type":"p","text":"     (2) مَا هِىَ صِيغَةُ الأَذَانِ."},{"type":"p","text":"     (3) مَاذَا يَزِيدُ الْمُؤَذِّنُ فِى أَذَانِ الصُّبْحِ."},{"type":"p","text":"     (4) مَا هِىَ الإِقَامَةُ."},{"type":"p","text":"     (5) مَاذَا يُسْتَحَبُّ بَيْنَ الأَذَانِ وَالإِقَامَةِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"مَوَاقِيتُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"الصَّلاةُ هِىَ أَفْضَلُ الأَعْمَالِ بَعْدَ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ فَعَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ أَنْ يُحَافِظَ عَلَيْهَا وَيَتَعَلَّمَ كَيْفَ يَدْخُلُ كُلُّ وَقْتٍ مِنْ أَوْقَاتِهَا وَكَيْفَ يَخْرُجُ."},{"type":"p","text":"صَلاةُ الصُّبْحِ وَيَبْدَأُ وَقْتُهَا مِنْ طُلُوعِ الْفَجْرِ الصَّادِقِ وَهُوَ بَيَاضٌ يَظْهَرُ فِى عَرْضِ الأُفُقِ الشَّرْقِىِّ وَيَنْتَهِى بِطُلُوعِ الشَّمْسِ."},{"type":"p","text":"صَلاةُ الظُّهْرِ وَيَبْدَأُ وَقْتُهَا مِنْ زَوَالِ الشَّمْسِ أَىْ مَيْلِهَا عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ وَيَنْتَهِي بِدُخُولِ وَقْتِ الْعَصْرِ."},{"type":"p","text":"صَلاةُ الْعَصْرِ وَيَبْدَأُ وَقْتُهَا إِذَا صَارَ ظِلُّ الشَّىْءِ مِثْلَهُ زَائِدًا عَلَى ظِلِّهِ لَمَّا كَانَتِ الشَّمْسُ فِى وَسَطِ السَّمَاءِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْمَغْرِبِ."},{"type":"p","text":"صَلاةُ الْمَغْرِبِ وَيَبْدَأُ وَقْتُهَا مِنْ مَغِيبِ الشَّمْسِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْعِشَاءِ."},{"type":"p","text":"صَلاةُ الْعِشَاءِ وَيَبْدَأُ وَقْتُهَا مِنْ مَغِيبِ الشَّفَقِ الأَحْمَرِ وَيَنْتَهِى بِطُلُوعِ الْفَجْرِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ أَفْضَلُ الأَعْمَالِ بَعْدَ الإِيـمَانِ."},{"type":"p","text":"     (2) عَدِّدِ الصَّلَوَاتِ الْخَمْسَ."},{"type":"p","text":"     (3) كَيْفَ يَبْدَأُ وَقْتُ الصُّبْحِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (4) كَيْفَ يَبْدَأُ وَقْتُ الظُّهْرِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (5) كَيْفَ يَبْدَأُ وَقْتُ الْعَصْرِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (6) كَيْفَ يَبْدَأُ وَقْتُ الْمَغْرِبِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":"     (7) كَيْفَ يَبْدَأُ وَقْتُ الْعِشَاءِ وَكَيْفَ يَنْتَهِى."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"شُرُوطُ صِحَّةِ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"     قَبْلَ أَدَاءِ الصَّلاةِ لا بُدَّ لِلْمُصَلِّى أَنْ يُرَاعِىَ شُرُوطَ صِحَّةِ الصَّلاةِ كَىْ تَكُونَ صَلاتُهُ صَحِيحَةً وَمِنْ هَذِهِ الشُّرُوطِ"},{"type":"p","text":"الإِسْلامُ فَلا تَصِحُّ الصَّلاةُ مِنْ كَافِرٍ."},{"type":"p","text":"وَالْوُضُوءُ أَىْ أَنْ يَكُونَ مُتَوَضِّئًا."},{"type":"p","text":"وَالطَّهَارَةُ عَنِ النَّجَاسَةِ الَّتِى لا يُعْفَى عَنْهَا فِى الْجِسْمِ وَالثِّيَابِ وَمَكَانِ الصَّلاةِ وَمَا يَحْمِلُهُ كَوَرَقَةٍ نَجِسَةٍ فِى جَيْبِهِ مَثَلًا."},{"type":"p","text":"وَسَتْرُ الْعَوْرَةِ أَىْ أَنْ يَسْتُرَ الذَّكَرُ مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ وَأَنْ تَسْتُرَ الْمَرْأَةُ الْحُرَّةُ جَمِيعَ جِسْمِهَا مَا عَدَا الْوَجْهَ وَالكَفَّيْنِ."},{"type":"p","text":"وَاسْتِقْبَالُ الْقِبْلَةِ أَىْ أَنْ يَتَوَجَّهَ نَحْوَ الْكَعْبَةِ الْمُشَرَّفَةِ الَّتِى فِى مَكَّةَ الْمُكَرَّمَةِ فِى الْقِيَامِ وَالْجُلُوسِ وَبِمُعْظَمِ بَدَنِهِ فِى الرُّكُوعِ وَالسُّجُودِ."},{"type":"p","text":"وَدُخُولُ وَقْتِ الصَّلاةِ فَلا يَصِحُّ مَثَلًا أَنْ يُؤَدِّىَ صَلاةَ الظُّهْرِ قَبْلَ الزَّوَالِ وَلا الْمَغْرِبِ قَبْلَ غُرُوبِ الشَّمْسِ."},{"type":"p","text":"وَالتَّمْيِيزُ وَهُوَ أَنْ يَكُونَ الْوَلَدُ بَلَغَ مِنَ الْعُمُرِ إِلَى حَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) عَدِّدْ شُرُوطَ صِحَّةِ الصَّلاةِ."},{"type":"p","text":"     (2) مَا مَعْنَى مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ الإِسْلامُ."},{"type":"p","text":"     (3) مَا مَعْنَى الطَّهَارَةِ عَنِ النَّجَاسَةِ الَّتِى لا يُعْفَى عَنْهَا."},{"type":"p","text":"     (4) مَا هِىَ عَوْرَةُ الرَّجُلِ وَمَا هِىَ عَوْرَةُ الْمَرْأَةِ الْحُرَّةِ."},{"type":"p","text":"     (5) مَا هِىَ الْقِبْلَةُ وَبِمَ يَسْتَقْبِلُهَا الْمُصَلِّى."},{"type":"p","text":"     (6) مَا هُوَ التَّمْيِيزُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"أَرْكَانُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"الصَّلاةُ لَهَا أَرْكَانٌ وَسُنَنٌ فَالأَرْكَانُ هِىَ الأُمُورُ الَّتِى تَكُونُ مِنَ الصَّلاةِ وَلا تَصِحُّ الصَّلاةُ بِدُونِهَا. وَأَمَّا السُّنَنُ فَتَصِحُّ الصَّلاةُ بِدُونِهَا وَلَكِنْ مَنْ تَرَكَهَا فَاتَهُ ثَوَابُهَا."},{"type":"p","text":"وَأَرْكَانُ الصَّلاةِ سَبْعَةَ عَشَرَ رُكْنًا وَهِىَ"},{"type":"p","text":"(1) النِّيَّةُ وَهِىَ قَصْدُ فِعْلِ الصَّلاةِ بِالْقَلْبِ."},{"type":"p","text":"(2) وَتَكْبِيرَةُ الإِحْرَامِ وَهِىَ قَوْلُ اللَّهُ أَكْبَرُ أَوَّلَ الصَّلاةِ."},{"type":"p","text":"(3) وَالْقِيَامُ فِى الْفَرْضِ لِلْقَادِرِ."},{"type":"p","text":"(4) وَقِرَاءَةُ الْفَاتِحَةِ بِالْبَسْمَلَةِ وَالتَّشْدِيدَاتِ وَيَجِبُ إِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا كَالصَّادِ وَالسِّينِ وَالدَّالِ وَالضَّادِ."},{"type":"p","text":"(5) وَالرُّكُوعُ"},{"type":"p","text":"(6) وَالطُّمَأْنِينَةُ فِيهِ وَهِىَ سُكُونُ الأَعْضَاءِ كُلِّهَا دَفْعَةً وَاحِدَةً."},{"type":"p","text":"(7) وَالِاعْتِدَالُ."},{"type":"p","text":"(8) وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"(9) وَالسُّجُودُ مَرَّتَيْنِ."},{"type":"p","text":"(10) وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"(11) وَالْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ."},{"type":"p","text":"(12) وَالطُّمَأْنِينَةُ فِيهِ."},{"type":"p","text":"(13) وَالْجُلُوسُ لِلتَّشَهُّدِ الأَخِيرِ وَمَا بَعْدَهُ."},{"type":"p","text":"(14) وَالتَّشَهُّدُ الأَخِيرُ."},{"type":"p","text":"(15) وَالصَّلاةُ عَلَى النَّبِىِّ ﷺ."},{"type":"p","text":"(16) وَالسَّلامُ."},{"type":"p","text":"(17) وَالتَّرْتِيبُ فَلَوْ سَجَدَ قَبْلَ الرُّكُوعِ عَمْدًا بَطَلَتْ صَلاتُهُ."},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ تَعْرِيفُ أَرْكَانِ الصَّلاةِ."},{"type":"p","text":"     (2) عَدِّدْ أَرْكَانَ الصَّلاةِ."},{"type":"p","text":"     (3) مَا مَعْنَى تَكْبِيرَةِ الإِحْرَامِ."},{"type":"p","text":"     (4) مَا هِىَ الطُّمَأْنِينَةُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّامِنُ"},{"type":"p","text":"مَبْطِلاتُ الصَّلاةِ"},{"type":"p","text":""},{"type":"p","text":"     تَبْطُلُ صَلاةُ الْمُسْلِمِ بِأَحَدِ الأُمُورِ التَّالِيَةِ"},{"type":"p","text":"إِذَا تَكَلَّمَ عَمْدًا بِكَلامِ النَّاسِ وَكَانَ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ أَمَّا إِذَا تَكَلَّمَ نَاسِيًا بِكَلامٍ قَلِيلٍ فَلا تَبْطُلُ صَلاتُهُ."},{"type":"p","text":"إِذَا أَكَلَ أَوْ شَرِبَ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ كَانَ أَكْلُهُ أَوْ شُرْبُهُ قَلِيلًا."},{"type":"p","text":"إِذَا تَحَرَّكَ أَثْنَاءَ الصَّلاةِ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ."},{"type":"p","text":"إِذَا عَمِلَ حَرَكَةً فَاحِشَةً كَأَنْ قَفَزَ قَفْزَةً فَاحِشَةً فِى الصَّلاةِ أَوْ حَرَّكَ يَدَهُ أَوْ عَيْنَهُ مَثَلًا بِقَصْدِ اللَّعِبِ."},{"type":"p","text":"إِذَا زَادَ رُكْنًا فِعْلِيًّا عَمْدًا كَأَنْ سَجَدَ ثَلاثَ مَرَّاتٍ فِى رَكْعَةٍ وَاحِدَةٍ."},{"type":"p","text":"إِذَا أَحْدَثَ فِى صَلاتِهِ كَأَنْ خَرَجَ مِنْهُ رِيحٌ. فَعَلَى الْمُصَلِّى أَنْ يَحْذَرَ مِنَ الْوُقُوعِ فِى مِثْلِ هَذِهِ الأُمُورِ كَىْ لا تَبْطُلَ صَلاتُهُ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا حُكْمُ الصَّلاةِ إِذَا تَكَلَّمَ فِيهَا عَمْدًا بِكَلامِ النَّاسِ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ."},{"type":"p","text":"     (2) وَمَا الْحُكْمُ إِذَا كَانَ نَاسِيًا."},{"type":"p","text":"     (3) مَا الْحُكْمُ إِذَا تَحَرَّكَ فِى صَلاتِهِ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ."},{"type":"p","text":"     (4) مَا مَعْنَى إِذَا زَادَ رُكْنًا فِعْلِيًا."},{"type":"p","text":"     (5) مَا مَعْنَى إِذَا أَحْدَثَ فِى صَلاتِهِ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ التَّاسِعُ"},{"type":"p","text":"صَلاةُ الْجَمَاعَةِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »صَلاةُ الْجَمَاعَةِ أَفْضَلُ مِنْ صَلاةِ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً« رَوَاهُ مُسْلِمٌ."},{"type":"p","text":"وَصَلاةُ الْجَمَاعَةِ فَرْضٌ عَلَى الْكِفَايَةِ أَىْ لا يَجِبُ عَلَى كُلِّ مُسْلِمٍ أَنْ يُصَلِّىَ جَمَاعَةً وَلَكِنْ يَجِبُ أَنْ يَقُومَ بِهَا بَعْضُ الْمُسْلِمِينَ."},{"type":"p","text":"فَمَنْ أَرَادَ أَنْ يُصَلِّىَ جَمَاعَةً فَلْيُرَاعِ أُمُورًا مِنْهَا"},{"type":"p","text":"أَنْ يَقِفَ مُتَأَخِّرًا عَنِ الإِمَامِ وَلا يُكَبِّرَ إِلَّا بَعْدَ أَنْ يُكَبِّرَ الإِمَامُ."},{"type":"p","text":"وَأَنْ يَنْوِىَ الصَّلاةَ جَمَاعَةً فَيَقُولَ بِقَلْبِهِ مَثَلًا أُصَلِّى فَرْضَ الظُّهْرِ جَمَاعَةً."},{"type":"p","text":"وَأَنْ يَتْبَعَ الإِمَامَ فَلا يَسْبِقُهُ بِالرُّكُوعِ وَالسُّجُودِ وَغَيْرِهِمَا."},{"type":"p","text":"وَأَنْ يُؤَمِّنَ أَىْ يَقُولَ ءَامِينَ مَعَ إِمَامِ الْجَمَاعَةِ."},{"type":"p","text":"وَأَنْ لا يُسَلِّمَ قَبْلَ الإِمَامِ عَمْدًا لِأَنَّهُ إِنْ فَعَلَ ذَلِكَ بَطَلَتْ صَلاتُهُ."},{"type":"p","text":""},{"type":"p","text":"تَنْبِيهٌ"},{"type":"p","text":"لا يَصِحُّ اقْتِدَاءُ الرَّجُلِ بِالْمَرْأَةِ وَيَصِحُّ اقْتِدَاءُ الرَّجُلِ وَالْمَرْأَةِ بِالصَّبِىِّ الذَّكَرِ الْمُمَيِّزِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى فَضْلِ صَلاةِ الْجَمَاعَةِ."},{"type":"p","text":"     (2) مَاحُكْمُ صَلاةِ الْجَمَاعَةِ."},{"type":"p","text":"     (3) مَتَى يُكَبِّرُ الْمَأْمُومُ."},{"type":"p","text":"     (4) مَاذَا يَنْوِى مَنْ أَرَادَ أَنْ يُصَلِّىَ خَلْفَ الإِمَامِ."},{"type":"p","text":"     (5) مَا الْحُكْمُ إِذَا سَلَّمَ مِنْ صَلاتِهِ قَبْلَ الإِمَامِ عَمْدًا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْعَاشِرُ"},{"type":"p","text":"صَلاةُ الْجُمُعَةِ"},{"type":"p","text":""},{"type":"p","text":"صَلاةُ الْجُمُعَةِ فَرَضَهَا اللَّهُ عَلَى كُلِّ مُسْلِمٍ ذَكَرٍ حُرٍّ بَالِغٍ عَاقِلٍ مُقِيمٍ غَيْرِ مَعْذُورٍ أَمَّا الْمَرْأَةُ وَالْعَبْدُ وَالصَّبِىُّ وَالْمَجْنُونُ وَالْمُسَافِرُ وَالْمَعْذُورُ بِعُذْرٍ شَرْعِىٍّ فَلا تَجِبُ عَلَيْهِمْ صَلاةُ الْجُمُعَةِ وَالْعُذْرُ الشَّرْعِىُّ كَأَنْ كَانَ الْمُسْلِمُ مَرِيضًا يَشُقُّ عَلَيْهِ الذَّهَابُ إِلَى الْجُمُعَةِ مَعَ الْمَرَضِ مَشَقَّةً شَدِيدَةً."},{"type":"p","text":"     وَصَلاةُ الْجُمُعَةِ رَكْعَتَانِ بَدَلَ صَلاةِ الظُّهْرِ يَوْمَ الْجُمُعَةِ وَيُشْتَرَطُ فِيهَا"},{"type":"p","text":"أَنْ تُصَلَّى بَعْدَ دُخُولِ وَقْتِ الظُّهْرِ."},{"type":"p","text":"أَنْ يَسْبِقَهَا خُطْبَتَانِ."},{"type":"p","text":"أَنْ تُصَلَّى جَمَاعَةً بِأَرْبَعِينَ رَجُلًا."},{"type":"p","text":""},{"type":"p","text":"     تَنْبِيهٌ"},{"type":"p","text":"     مَنْ فَاتَتْهُ صَلاةُ الْجُمُعَةِ صَلَّى الظُّهْرَ لِأَنَّ الْجُمُعَةَ لا تُصَلَّى قَضَاءً رَكْعَتَيْنِ."},{"type":"p","text":""},{"type":"p","text":"     فَائِدَةٌ"},{"type":"p","text":"     يُسَنُّ الإِكْثَارُ مِنَ الصَّلاةِ عَلَى النَّبِىِّ يَوْمَ الْجُمُعَةِ قَالَ رَسُولُ اللَّهِ ﷺ »إِنَّ مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمَ الْجُمُعَةِ فَأَكْثِرُوا عَلَىَّ مِنَ الصَّلاةِ فِيهِ فَإِنَّ صَلاتَكُمْ مَعْروضَةٌ عَلَىَّ« رَوَاهُ أَبُو دَاوُدَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) عَلَى مَنْ تَجِبُ صَلاةُ الْجُمُعَةِ."},{"type":"p","text":"     (2) عَلَى مَنْ لا تَجِبُ صَلاةُ الْجُمُعَةِ."},{"type":"p","text":"     (3) اذْكُرْ عُذْرًا شَرْعِيًّا لِتَرْكِ الْجُمُعَةِ."},{"type":"p","text":"     (4) كَمْ عَدَدُ رَكَعَاتِ صَلاةِ الْجُمُعَةِ."},{"type":"p","text":"     (5) مَاذَا يُشْتَرَطُ لِصَلاةِ الْجُمُعَةِ."},{"type":"p","text":"     (6) مَنْ فَاتَتْهُ صَلاةُ الْجُمُعَةِ مَاذَا يُصَلِّى."},{"type":"p","text":"     (7) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ يُبَيِّنُ فَضْلَ يَوْمِ الْجُمُعَةِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْحَادِيَ عَشَرَ"},{"type":"p","text":"صَوْمُ رَمَضَانَ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَما كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ﴾ [سُورَةَ الْبَقَرَةِ/183]."},{"type":"p","text":"وَالصِّيَامُ هُوَ الِامْتِنَاعُ عَنِ الأَكْلِ وَالشُّرْبِ وَسَائِرِ الْمُفَطِّرَاتِ مِنْ طُلُوعِ الْفَجْرِ إِلَى غُرُوبِ الشَّمْسِ مَعَ النِّيَّةِ الْمُبَيَّتَةِ وَالأَكْمَلُ أَنْ يَقُولَ بِقَلْبِهِ نَوَيْتُ صِيَامَ يَوْمِ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانَ هَذِهِ السَّنَة إِيـمَانًا وَاحْتِسَابًا لِلَّهِ تَعَالَى."},{"type":"p","text":"مِنْ مُفْسِدَاتِ الصِّيَامِ"},{"type":"p","text":"الأَكْلُ وَالشُّرْبُ عَمْدًا وَلَوْ قَلِيلًا أَمَّا مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا فَلا يُفْطِرُ وَلَوْ كَانَ كَثِيرًا."},{"type":"p","text":"وَإِخْرَاجُ الْقَىْءِ عَمْدًا كَأَنْ يُدْخِلَ الصَّائِمُ إِصْبَعَهُ فِى فَمِهِ فَيُخْرِجَ الْقَىْءَ عَمْدًا أَمَّا إِذَا غَلَبَهُ الْقَىْءُ وَلَمْ يَبْلَعْ شَيْئًا فَلا يُفْطِرُ."},{"type":"p","text":"وَالْقَطْرَةُ فِى الأُذُنِ وَالأَنْفِ تُفَطِّرُ إِذَا وَصَلَ إِلَى الْجَوْفِ أَمَّا فِى الْعَيْنِ فَلا تُفَطِّرُ."},{"type":"p","text":"وَيَجُوزُ لِلْمَرِيضِ الَّذِى يَخَافُ عَلَى نَفْسِهِ الضَّرَرَ مِنَ الصِّيَامِ أَنْ يُفْطِرَ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ "},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى وُجُوبِ صَوْمِ رَمَضَانَ."},{"type":"p","text":"     (2) مَا هُوَ الصِّيَامُ."},{"type":"p","text":"     (3) مَنْ أَرَادَ الصِّيَامَ مَاذَا يَنْوِى بِقَلْبِهِ لَيْلًا."},{"type":"p","text":"     (4) عَدِّدْ بَعْضَ مُفْسِدَاتِ الصِّيَامِ."},{"type":"p","text":"     (5) مَتَى يَجُوزُ لِلْمَرِيضِ أَنْ يُفْطِرَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى عَشَرَ"},{"type":"p","text":"الزَّكَاةُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَأَقِيمُوا الصَّلاةَ وَءَاتُوا الزَّكَاةَ﴾ [سُورَةَ الْبَقَرَةِ/43]."},{"type":"p","text":"الزَّكَاةُ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ وَقَدْ فَرَضَ اللَّهُ تَعَالَى الزَّكَاةَ وَتَكُونُ بِأَنْ يَدْفَعَ الْمُزَكِّى شَيْئًا مَعْلُومًا مِنْ مَالِهِ لِأُنَاسٍ حَدَّدَهُمُ الشَّرْعُ مِنْهُمُ الْفُقَرَاءُ وَالْمَسَاكِينُ."},{"type":"p","text":"وَالْفُقَرَاءُ هُمُ الَّذِينَ لا يَجِدُونَ نِصْفَ كِفَايَتِهِمُ الضَّرُورِيَّةِ وَالْمَسَاكِينُ هُمُ الَّذِينَ لا يَجِدُونَ كُلَّ كِفَايَتِهِمُ الضَّرُورِيَّةِ وَلَكِنْ يَجِدُونَ نِصْفَهَا. "},{"type":"p","text":"وَتَجِبُ الزَّكَاةُ فِى أَشْيَاءَ مِنْهَا"},{"type":"p","text":"الإِبِلُ وَالْبَقَرُ وَالْغَنَمُ. "},{"type":"p","text":"وَالذَّهَبُ وَالْفِضَّةُ."},{"type":"p","text":"وَالزُّرُوعُ الْمُقْتَاتَةُ حَالَةَ الِاخْتِيَارِ كَالْقَمْحِ وَالأَرُزِّ. "},{"type":"p","text":"وَأَمْوَالُ التِّجَارَةِ."},{"type":"p","text":"وَتَجِبُ زَكَاةُ الْفِطْرِ وَهِىَ الَّتِى تُدْفَعُ إِذَا دَخَلَ شَهْرُ رَمَضَانَ وَقَبْلَ غُرُوبِ شَمْسِ يَوْمِ الْعِيدِ وَلَهَا شُرُوطٌ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الزَّكَاةِ."},{"type":"p","text":"     (2) عَلَى مَنْ تَجِبُ الزَّكَاةُ."},{"type":"p","text":"     (3) لِمَنْ تُعْطَى الزَّكَاةُ."},{"type":"p","text":"     (4) مَنْ هُمُ الْفُقَرَاءُ."},{"type":"p","text":"     (5) مَنْ هُمُ الْمَسَاكِينُ."},{"type":"p","text":"     (6) عَدِّدْ بَعْضَ الأَمْوَالِ الَّتِى تَجِبُ فِيهَا الزَّكَاةُ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثَ عَشَرَ"},{"type":"p","text":"الْحَـــجُّ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا﴾ [سُورَةَ ءَالِ عِمْرَان/97]."},{"type":"p","text":"الْحَجُّ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ وَيَجِبُ عَلَى الْمُسْتَطِيعِ فِى الْعُمُرِ مَرَّةً وَاحِدَةً."},{"type":"p","text":"وَلِلْحَجِّ سِتَّةُ أَرْكَانٍ لا يَصِحُّ بِدُونِهَا وَهِىَ"},{"type":"p","text":"الإِحْرَامُ أَىِ النِّيَّةُ."},{"type":"p","text":"وَالْوُقُوفُ بِعَرَفَةَ."},{"type":"p","text":"وَطَوَافُ الإِفَاضَةِ أَىْ أَنْ يَدُورَ حَوْلَ الْكَعْبَةِ سَبْعَ مَرَّاتٍ فِى وَقْتِهِ وَبِشُرُوطٍ."},{"type":"p","text":"وَالسَّعْىُ بَيْنَ الصَّفَا وَالْمَرْوَةِ سَبْعَ مَرَّاتٍ."},{"type":"p","text":"وَالْحَلْقُ أَوِ التَّقْصِيرُ أَىْ أَنْ يَحْلِقَ شَعْرَهُ كُلَّهُ أَوْ يَقُصَّ بَعْضَ شَعَرِهِ وَلَوْ ثَلاثَ شَعَرَاتٍ وَالْمَرْأَةُ تُقَصِّرُ وَلا تَحْلِقُ."},{"type":"p","text":"وَالتَّرْتِيبُ فِى مُعْظَمِ الأَرْكَانِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الْحَجِّ."},{"type":"p","text":"     (2) عَلَى مَنْ يَجِبُ الْحَجُّ وَكَمْ مَرَّةً فِى الْعُمُرِ."},{"type":"p","text":"     (3) مَا هِىَ أَرْكَانُ الْحَجِّ عَدِّدْهَا."},{"type":"p","text":"     (4) مَا مَعْنَى الإِحْرَامِ."},{"type":"p","text":"     (5) مَا مَعْنَى طَوَافِ الإِفَاضَةِ."},{"type":"p","text":"     (6) مَا مَعْنَى الْحَلْقِ أَوِ التَّقْصِيرِ."}],"paragraphCount":254,"wordCount":2001,"readingMinutes":12,"description":"المحتوى الكامل لـ فَصْلُ الْعِبَادَاتِ من الجزء الثالث، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّالِثُ فَصْلُ الْعِبَادَاتِ فَصْلُ الْعِبَادَاتِ\nالدَّرْسُ الأَوَّلُ\nالْوُضُوءُ\n\nقَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ﴾ [سُورَةَ الْمَائِدَةِ/6].\nأَرْكَانُ الْوُضُوءِ سِتَّةٌ هِىَ\nالنِّيَّةُ بِالْقَلْبِ عِنْدَ غَسْلِ الْوَجْهِ فَيَقُولُ بِقَلْبِهِ نَوَيْتُ الْوُضُوءَ أَوْ نَحْوَهُ.\nوَغَسْلُ الْوَجْهِ مِنْ مَنَابِتِ شَعْرِ الرَّأْسِ إِلَى أَسْفَلِ الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ.\nوَغَسْلُ الْيَدَيْنِ إِلَى الْمِرْفَقَيْنِ أَىْ مَعَ الْمِرْفَقَيْنِ.\nوَمَسْحُ بَعْضِ الرَّأْسِ.\nوَغَسْلُ الرِّجْلَيْنِ إِلَى الْكَعْبَيْنِ أَىْ مَعَ الْكَعْبَيْنِ.\nوَالتَّرْتِيبُ أَىْ تَرْتِيبُ هَذِهِ الأُمُورِ كَمَا ذُكِرَتْ.\nوَمِنْ سُنَنِ الْوُضُوءِ\nالتَّسْمِيَةُ.\nوَالِاسْتِيَاكُ.\nوَغَسْلُ الْكَفَّيْنِ.\nوَالْمَضْمَضَةُ. \nوَالِاسْتِنْشَاقُ.\nوَمَسْحُ جَمِيعِ الرَّأْسِ.\nوَمَسْحُ الأُذُنَيْنِ.\nوَتَخْلِيلُ أَصَابِعِ الْيَدَيْنِ وَالرِّجْلَيْنِ.\nوَالطَّهَارَةُ ثَلاثًا ثَلاثًا.\nوَتَقْدِيمُ الْيُمْنَى عَلَى الْيُسْرَى.\nوَغَسْلُ الْعُضْوِ قَبْلَ أَنْ يَجِفَّ الْعُضْوُ الَّذِى قَبْلَهُ.\nوَالدَّلْكُ وَهُوَ إِمْرَارُ الْيَدِ عَلَى الْعُضْوِ الْمَغْسُولِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِيهَا عَنْ أَرْكَانِ الْوُضُوءِ.\n     (2) مَا هِىَ أَرْكَانُ الْوُضُوءِ عَدِّدْهَا.\n     (3) مَتَى تَكُونُ النِّيَّةُ وَمَا هُوَ مَحَلُّهَا.\n     (4) مَا هُوَ الْحَدُّ الْوَاجِبُ فِى غَسْلِ الْوَجْهِ.\n     (5) مَا هُوَ الْحَدُّ الْوَاجِبُ فِى غَسْلِ الْيَدَيْنِ.\n     (6) مَا هُوَ الْحَدُّ الْوَاجِبُ فِى مَسْحِ الرَّأْسِ.\n     (7) مَا هُوَ الْحَدُّ الْوَاجِبُ فِى غَسْلِ الرِّجْلَيْنِ.\n     (8) مَا مَعْنَى التَّرْتِيبِ.\n     (9) عَدِّدْ بَعْضَ سُنَنِ الْوُضُوءِ.\n\nالدَّرْسُ الثَّانِى\nنَوَاقِضُ الْوُضُوءِ\n\nمِنْ نَوَاقِضِ الْوُضُوءِ\nخُرُوجُ الْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ.\nوَالنَّوْمُ عَلَى الْبَطْنِ أَوِ الظَّهْرِ أَوِ الْجَنْبِ الأَيْمَنِ أَوِ الأَيْسَرِ.\nوَمَسُّ ءَالَةِ خُرُوجِ الْبَوْلِ أَوْ حَلْقَةِ الدُّبُرِ بِبَطْنِ الْكَفِّ بِلا حَائِلٍ.\nوَالْجُنُونُ وَالإِغْمَاءُ.\nفَمَنِ انْتَقَضَ وُضُوؤُهُ فَلا يَجُوزُ لَهُ أَنْ يُصَلِّىَ إِلَّا بَعْدَ تَجْدِيدِ وُضُوئِهِ.\nشَرْحُ بَعْضِ الْكَلِمَاتِ\nبَاطِنُ الْكَفِّ مَا لا يَظْهَرُ عِنْدَ إِطْبَاقِ إِحْدَى الْكَفَّيْنِ عَلَى الأُخْرَى مَعَ قَلِيلٍ مِنَ التَّحَامُلِ وَالتَّفْرِيقِ بَيْنَ الأَصَابِعِ تَفْرِيقًا وَسَطًا.\nالْحَائِلُ كَأَنْ يَكُونَ لابِسًا قُفَّازًا عِنْدَ الْمَسِّ بِالْكَفِّ.\nمِنْ مَكْرُوهَاتِ الْوُضُوءِ \nالزِّيَادَةُ عَلَى ثَلاثِ مَرَّاتٍ فِى الْغَسْلِ أَوِ الْمَسْحِ.\nوَالْكَلامُ أَثْنَاءَ الْوُضُوءِ بِغَيْرِ كَلامِ الْخَيْرِ كَذِكْرِ اللَّهِ. \nوَالزِّيَادَةُ الْمُفْرِطَةُ فِى الْمَاءِ الْمُسْتَعْمَلِ لِلْوُضُوءِ.\n\n     أَسْئِلَةٌ\n     (1) عَدِّدْ نَوَاقِضَ الْوُضُوءِ.\n     (2) مَنِ انْتَقَضَ وُضُوؤُهُ مَتَى يَجُوزُ لَهُ أَنْ يُصَلِّىَ.\n     (3) مَا مَعْنَى بَاطِنِ الْكَفِّ.\n     (4) عَدِّدْ بَعْضَ مَكْرُوهَاتِ الْوُضُوءِ.\n\nالدَّرْسُ الثَّالِثُ\nالِاسْتِنْجَاءُ\n\nقَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [سُورَةَ الْبَقَرَةِ/222].\nيَجِبُ الِاسْتِنْجَاءُ لِخُرُوجِ النَّجِسِ الرَّطْبِ مِنْ أَحَدِ السَّبِيلَيْنِ كَالْبَوْلِ وَالْغَائِطِ.\nوَيَكْفِي فِى الِاسْتِنْجَاءِ مِنَ الْغَائِطِ صَبُّ الْمَاءِ الْمُطَهِّرِ عَلَى مَوْضِعِ النَّجَاسَةِ بِالْيَدِ الْيُمْنَى مَعَ الدَّلْكِ بِالْيَدِ الْيُسْرَى حَتَّى تَزُولَ النَّجَاسَةُ وَيُصْبِحَ الْمَوْضِعُ طَاهِرًا. \nوَمِنَ الْبَوْلِ صَبُّ الْمَاءِ عَلَى مَحَلِّ النَّجَاسَةِ إِلَى أَنْ يَطْهُرَ الْمَحَلُّ وَلا يَصِحُّ أَخْذُ الْمَاءِ فِى الْيَدِ وَدَلْكُ مَوْضِعِ النَّجَاسَةِ بِهِ بِلا صَبٍّ لِأَنَّ فِى ذَلِكَ تَعْمِيمًا لِلنَّجَاسَةِ.\nفَمَنْ خَرَجَ مِنْهُ شَىْءٌ مِنْ ذَلِكَ ثُمَّ تَوَضَّأَ وَصَلَّى بِدُونِ اسْتِنْجَاءٍ لا تَصِحُّ صَلاتُهُ.\n\nتَنْبِيهٌ\nلا يَجِبُ الِاسْتِنْجَاءُ مِنْ خُرُوجِ الرِّيحِ.\n\nلِلْحِفْظِ غَيْبًا\nقَالَ رَسُولُ اللَّهِ ﷺ »الطُّهُورُ شَطْرُ الإِيـمَانِ« رَوَاهُ مُسْلِمٌ.\nوَالطُّهُورُ هُوَ رَفْعُ الْحَدَثِ وَإِزَالَةُ النَّجَسِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الطَّهَارَةِ.\n     (2) مِمَّنْ يَجِبُ الِاسْتِنْجَاءُ.\n     (3) كَيْفَ يُسْتَنْجَى مِنَ الْغَائِطِ.\n     (4) كَيْفَ يُسْتَنْجَى مِنَ الْبَوْلِ.\n     (5) مَنْ صَلَّى مِنْ غَيْرِ اسْتِنْجَاءٍ هَلْ تَصِحُّ صَلاتُهُ.\n\nالدَّرْسُ الرَّابِعُ\nالأَذَانُ وَالإِقَامَـــةُ\n\nإِذَا دَخَلَ وَقْتُ الصَّلاةِ يُسَنُّ الأَذَانُ وَفِيهِ يَقُومُ أَحَدُ الْمُسْلِمِينَ بِالدَّعْوَةِ إِلَى تَأْدِيَةِ الصَّلاةِ بِأَلْفَاظٍ مَخْصُوصَةٍ بِصَوْتٍ مُرْتَفِعٍ وَأَلْفَاظُ الأَذَانِ هِىَ\nاللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ.\nأَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ.\nأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.\nحَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاحِ حَىَّ عَلَى الْفَلاحِ.\nاللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ لا إِلَهَ إِلَّا اللَّهُ.\nوَفِى أَذَانِ الصُّبْحِ يُسَنُّ أَنْ يَزِيدَ الْمُؤَذِّنُ بَعْدَ قَوْلِهِ حَىَّ عَلَى الْفَلاحِ الثَّانِيَةِ الصَّلاةُ خَيْرٌ مِنَ النَّوْمِ الصَّلاةُ خَيْرٌ مِنَ النَّوْمِ.\n\n\nالإِقَامَةُ\nبَعْدَ أَنْ يَنْتَهِىَ الْمُؤَذِّنُ مِنَ الأَذَانِ وَبَعْدَ أَنْ يَجْتَمِعَ النَّاسُ وَيَتَهَيَّؤُونَ لِتَأْدِيَةِ فَرِيضَةِ الصَّلاةِ يَتَوَلَّى أَحَدُهُمْ إِقَامَةَ الصَّلاةِ فَيَقُولُ\nاللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاحِ، قَدْ قَامَتِ الصَّلاةُ قَدْ قَامَتِ الصَّلاةُ، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، لا إِلَهَ إِلَّا اللَّهُ.\nوَيُسْتَحَبُّ بَعْدَ الأَذَانِ وَالإِقَامَةِ الصَّلاةُ عَلَى النَّبِىِّ ﷺ وَذَلِكَ لِقَوْلِهِ عَلَيْهِ السَّلامُ »مَنْ ذَكَرَنِى فَلْيُصَلِّ عَلَىَّ« رَوَاهُ الْحَافِظُ السَّخَاوِىُّ.\nفَائِدَةٌ يُسْتَحَبُّ الدُّعَاءُ بَيْنَ الأَذَانِ وَالإِقَامَةِ لِحَدِيثِ »لا يُرَدُّ الدُّعَاءُ بَيْنَ الأَذَانَيْنِ«.\n\n     أَسْئِلَةٌ\n     (1) إِذَا دَخَلَ وَقْتُ الصَّلاةِ مَاذَا يُسَنُّ.\n     (2) مَا هِىَ صِيغَةُ الأَذَانِ.\n     (3) مَاذَا يَزِيدُ الْمُؤَذِّنُ فِى أَذَانِ الصُّبْحِ.\n     (4) مَا هِىَ الإِقَامَةُ.\n     (5) مَاذَا يُسْتَحَبُّ بَيْنَ الأَذَانِ وَالإِقَامَةِ.\n\nالدَّرْسُ الْخَامِسُ\nمَوَاقِيتُ الصَّلاةِ\n\nالصَّلاةُ هِىَ أَفْضَلُ الأَعْمَالِ بَعْدَ الإِيـمَانِ بِاللَّهِ وَرَسُولِهِ فَعَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ أَنْ يُحَافِظَ عَلَيْهَا وَيَتَعَلَّمَ كَيْفَ يَدْخُلُ كُلُّ وَقْتٍ مِنْ أَوْقَاتِهَا وَكَيْفَ يَخْرُجُ.\nصَلاةُ الصُّبْحِ وَيَبْدَأُ وَقْتُهَا مِنْ طُلُوعِ الْفَجْرِ الصَّادِقِ وَهُوَ بَيَاضٌ يَظْهَرُ فِى عَرْضِ الأُفُقِ الشَّرْقِىِّ وَيَنْتَهِى بِطُلُوعِ الشَّمْسِ.\nصَلاةُ الظُّهْرِ وَيَبْدَأُ وَقْتُهَا مِنْ زَوَالِ الشَّمْسِ أَىْ مَيْلِهَا عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ وَيَنْتَهِي بِدُخُولِ وَقْتِ الْعَصْرِ.\nصَلاةُ الْعَصْرِ وَيَبْدَأُ وَقْتُهَا إِذَا صَارَ ظِلُّ الشَّىْءِ مِثْلَهُ زَائِدًا عَلَى ظِلِّهِ لَمَّا كَانَتِ الشَّمْسُ فِى وَسَطِ السَّمَاءِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْمَغْرِبِ.\nصَلاةُ الْمَغْرِبِ وَيَبْدَأُ وَقْتُهَا مِنْ مَغِيبِ الشَّمْسِ وَيَنْتَهِى بِدُخُولِ وَقْتِ الْعِشَاءِ.\nصَلاةُ الْعِشَاءِ وَيَبْدَأُ وَقْتُهَا مِنْ مَغِيبِ الشَّفَقِ الأَحْمَرِ وَيَنْتَهِى بِطُلُوعِ الْفَجْرِ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ أَفْضَلُ الأَعْمَالِ بَعْدَ الإِيـمَانِ.\n     (2) عَدِّدِ الصَّلَوَاتِ الْخَمْسَ.\n     (3) كَيْفَ يَبْدَأُ وَقْتُ الصُّبْحِ وَكَيْفَ يَنْتَهِى.\n     (4) كَيْفَ يَبْدَأُ وَقْتُ الظُّهْرِ وَكَيْفَ يَنْتَهِى.\n     (5) كَيْفَ يَبْدَأُ وَقْتُ الْعَصْرِ وَكَيْفَ يَنْتَهِى.\n     (6) كَيْفَ يَبْدَأُ وَقْتُ الْمَغْرِبِ وَكَيْفَ يَنْتَهِى.\n     (7) كَيْفَ يَبْدَأُ وَقْتُ الْعِشَاءِ وَكَيْفَ يَنْتَهِى.\n\nالدَّرْسُ السَّادِسُ\nشُرُوطُ صِحَّةِ الصَّلاةِ\n\n     قَبْلَ أَدَاءِ الصَّلاةِ لا بُدَّ لِلْمُصَلِّى أَنْ يُرَاعِىَ شُرُوطَ صِحَّةِ الصَّلاةِ كَىْ تَكُونَ صَلاتُهُ صَحِيحَةً وَمِنْ هَذِهِ الشُّرُوطِ\nالإِسْلامُ فَلا تَصِحُّ الصَّلاةُ مِنْ كَافِرٍ.\nوَالْوُضُوءُ أَىْ أَنْ يَكُونَ مُتَوَضِّئًا.\nوَالطَّهَارَةُ عَنِ النَّجَاسَةِ الَّتِى لا يُعْفَى عَنْهَا فِى الْجِسْمِ وَالثِّيَابِ وَمَكَانِ الصَّلاةِ وَمَا يَحْمِلُهُ كَوَرَقَةٍ نَجِسَةٍ فِى جَيْبِهِ مَثَلًا.\nوَسَتْرُ الْعَوْرَةِ أَىْ أَنْ يَسْتُرَ الذَّكَرُ مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ وَأَنْ تَسْتُرَ الْمَرْأَةُ الْحُرَّةُ جَمِيعَ جِسْمِهَا مَا عَدَا الْوَجْهَ وَالكَفَّيْنِ.\nوَاسْتِقْبَالُ الْقِبْلَةِ أَىْ أَنْ يَتَوَجَّهَ نَحْوَ الْكَعْبَةِ الْمُشَرَّفَةِ الَّتِى فِى مَكَّةَ الْمُكَرَّمَةِ فِى الْقِيَامِ وَالْجُلُوسِ وَبِمُعْظَمِ بَدَنِهِ فِى الرُّكُوعِ وَالسُّجُودِ.\nوَدُخُولُ وَقْتِ الصَّلاةِ فَلا يَصِحُّ مَثَلًا أَنْ يُؤَدِّىَ صَلاةَ الظُّهْرِ قَبْلَ الزَّوَالِ وَلا الْمَغْرِبِ قَبْلَ غُرُوبِ الشَّمْسِ.\nوَالتَّمْيِيزُ وَهُوَ أَنْ يَكُونَ الْوَلَدُ بَلَغَ مِنَ الْعُمُرِ إِلَى حَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ.\n\n     أَسْئِلَةٌ\n     (1) عَدِّدْ شُرُوطَ صِحَّةِ الصَّلاةِ.\n     (2) مَا مَعْنَى مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ الإِسْلامُ.\n     (3) مَا مَعْنَى الطَّهَارَةِ عَنِ النَّجَاسَةِ الَّتِى لا يُعْفَى عَنْهَا.\n     (4) مَا هِىَ عَوْرَةُ الرَّجُلِ وَمَا هِىَ عَوْرَةُ الْمَرْأَةِ الْحُرَّةِ.\n     (5) مَا هِىَ الْقِبْلَةُ وَبِمَ يَسْتَقْبِلُهَا الْمُصَلِّى.\n     (6) مَا هُوَ التَّمْيِيزُ.\n\nالدَّرْسُ السَّابِعُ\nأَرْكَانُ الصَّلاةِ\n\nالصَّلاةُ لَهَا أَرْكَانٌ وَسُنَنٌ فَالأَرْكَانُ هِىَ الأُمُورُ الَّتِى تَكُونُ مِنَ الصَّلاةِ وَلا تَصِحُّ الصَّلاةُ بِدُونِهَا. وَأَمَّا السُّنَنُ فَتَصِحُّ الصَّلاةُ بِدُونِهَا وَلَكِنْ مَنْ تَرَكَهَا فَاتَهُ ثَوَابُهَا.\nوَأَرْكَانُ الصَّلاةِ سَبْعَةَ عَشَرَ رُكْنًا وَهِىَ\n(1) النِّيَّةُ وَهِىَ قَصْدُ فِعْلِ الصَّلاةِ بِالْقَلْبِ.\n(2) وَتَكْبِيرَةُ الإِحْرَامِ وَهِىَ قَوْلُ اللَّهُ أَكْبَرُ أَوَّلَ الصَّلاةِ.\n(3) وَالْقِيَامُ فِى الْفَرْضِ لِلْقَادِرِ.\n(4) وَقِرَاءَةُ الْفَاتِحَةِ بِالْبَسْمَلَةِ وَالتَّشْدِيدَاتِ وَيَجِبُ إِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا كَالصَّادِ وَالسِّينِ وَالدَّالِ وَالضَّادِ.\n(5) وَالرُّكُوعُ\n(6) وَالطُّمَأْنِينَةُ فِيهِ وَهِىَ سُكُونُ الأَعْضَاءِ كُلِّهَا دَفْعَةً وَاحِدَةً.\n(7) وَالِاعْتِدَالُ.\n(8) وَالطُّمَأْنِينَةُ فِيهِ.\n(9) وَالسُّجُودُ مَرَّتَيْنِ.\n(10) وَالطُّمَأْنِينَةُ فِيهِ.\n(11) وَالْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ.\n(12) وَالطُّمَأْنِينَةُ فِيهِ.\n(13) وَالْجُلُوسُ لِلتَّشَهُّدِ الأَخِيرِ وَمَا بَعْدَهُ.\n(14) وَالتَّشَهُّدُ الأَخِيرُ.\n(15) وَالصَّلاةُ عَلَى النَّبِىِّ ﷺ.\n(16) وَالسَّلامُ.\n(17) وَالتَّرْتِيبُ فَلَوْ سَجَدَ قَبْلَ الرُّكُوعِ عَمْدًا بَطَلَتْ صَلاتُهُ.\n     أَسْئِلَةٌ\n     (1) مَا هُوَ تَعْرِيفُ أَرْكَانِ الصَّلاةِ.\n     (2) عَدِّدْ أَرْكَانَ الصَّلاةِ.\n     (3) مَا مَعْنَى تَكْبِيرَةِ الإِحْرَامِ.\n     (4) مَا هِىَ الطُّمَأْنِينَةُ.\n\nالدَّرْسُ الثَّامِنُ\nمَبْطِلاتُ الصَّلاةِ\n\n     تَبْطُلُ صَلاةُ الْمُسْلِمِ بِأَحَدِ الأُمُورِ التَّالِيَةِ\nإِذَا تَكَلَّمَ عَمْدًا بِكَلامِ النَّاسِ وَكَانَ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ أَمَّا إِذَا تَكَلَّمَ نَاسِيًا بِكَلامٍ قَلِيلٍ فَلا تَبْطُلُ صَلاتُهُ.\nإِذَا أَكَلَ أَوْ شَرِبَ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ وَلَوْ كَانَ أَكْلُهُ أَوْ شُرْبُهُ قَلِيلًا.\nإِذَا تَحَرَّكَ أَثْنَاءَ الصَّلاةِ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ.\nإِذَا عَمِلَ حَرَكَةً فَاحِشَةً كَأَنْ قَفَزَ قَفْزَةً فَاحِشَةً فِى الصَّلاةِ أَوْ حَرَّكَ يَدَهُ أَوْ عَيْنَهُ مَثَلًا بِقَصْدِ اللَّعِبِ.\nإِذَا زَادَ رُكْنًا فِعْلِيًّا عَمْدًا كَأَنْ سَجَدَ ثَلاثَ مَرَّاتٍ فِى رَكْعَةٍ وَاحِدَةٍ.\nإِذَا أَحْدَثَ فِى صَلاتِهِ كَأَنْ خَرَجَ مِنْهُ رِيحٌ. فَعَلَى الْمُصَلِّى أَنْ يَحْذَرَ مِنَ الْوُقُوعِ فِى مِثْلِ هَذِهِ الأُمُورِ كَىْ لا تَبْطُلَ صَلاتُهُ.\n\n     أَسْئِلَةٌ\n     (1) مَا حُكْمُ الصَّلاةِ إِذَا تَكَلَّمَ فِيهَا عَمْدًا بِكَلامِ النَّاسِ ذَاكِرًا أَنَّهُ فِى الصَّلاةِ.\n     (2) وَمَا الْحُكْمُ إِذَا كَانَ نَاسِيًا.\n     (3) مَا الْحُكْمُ إِذَا تَحَرَّكَ فِى صَلاتِهِ ثَلاثَ حَرَكَاتٍ مُتَوَالِيَاتٍ.\n     (4) مَا مَعْنَى إِذَا زَادَ رُكْنًا فِعْلِيًا.\n     (5) مَا مَعْنَى إِذَا أَحْدَثَ فِى صَلاتِهِ.\n\n\nالدَّرْسُ التَّاسِعُ\nصَلاةُ الْجَمَاعَةِ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »صَلاةُ الْجَمَاعَةِ أَفْضَلُ مِنْ صَلاةِ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً« رَوَاهُ مُسْلِمٌ.\nوَصَلاةُ الْجَمَاعَةِ فَرْضٌ عَلَى الْكِفَايَةِ أَىْ لا يَجِبُ عَلَى كُلِّ مُسْلِمٍ أَنْ يُصَلِّىَ جَمَاعَةً وَلَكِنْ يَجِبُ أَنْ يَقُومَ بِهَا بَعْضُ الْمُسْلِمِينَ.\nفَمَنْ أَرَادَ أَنْ يُصَلِّىَ جَمَاعَةً فَلْيُرَاعِ أُمُورًا مِنْهَا\nأَنْ يَقِفَ مُتَأَخِّرًا عَنِ الإِمَامِ وَلا يُكَبِّرَ إِلَّا بَعْدَ أَنْ يُكَبِّرَ الإِمَامُ.\nوَأَنْ يَنْوِىَ الصَّلاةَ جَمَاعَةً فَيَقُولَ بِقَلْبِهِ مَثَلًا أُصَلِّى فَرْضَ الظُّهْرِ جَمَاعَةً.\nوَأَنْ يَتْبَعَ الإِمَامَ فَلا يَسْبِقُهُ بِالرُّكُوعِ وَالسُّجُودِ وَغَيْرِهِمَا.\nوَأَنْ يُؤَمِّنَ أَىْ يَقُولَ ءَامِينَ مَعَ إِمَامِ الْجَمَاعَةِ.\nوَأَنْ لا يُسَلِّمَ قَبْلَ الإِمَامِ عَمْدًا لِأَنَّهُ إِنْ فَعَلَ ذَلِكَ بَطَلَتْ صَلاتُهُ.\n\nتَنْبِيهٌ\nلا يَصِحُّ اقْتِدَاءُ الرَّجُلِ بِالْمَرْأَةِ وَيَصِحُّ اقْتِدَاءُ الرَّجُلِ وَالْمَرْأَةِ بِالصَّبِىِّ الذَّكَرِ الْمُمَيِّزِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى فَضْلِ صَلاةِ الْجَمَاعَةِ.\n     (2) مَاحُكْمُ صَلاةِ الْجَمَاعَةِ.\n     (3) مَتَى يُكَبِّرُ الْمَأْمُومُ.\n     (4) مَاذَا يَنْوِى مَنْ أَرَادَ أَنْ يُصَلِّىَ خَلْفَ الإِمَامِ.\n     (5) مَا الْحُكْمُ إِذَا سَلَّمَ مِنْ صَلاتِهِ قَبْلَ الإِمَامِ عَمْدًا.\n\nالدَّرْسُ الْعَاشِرُ\nصَلاةُ الْجُمُعَةِ\n\nصَلاةُ الْجُمُعَةِ فَرَضَهَا اللَّهُ عَلَى كُلِّ مُسْلِمٍ ذَكَرٍ حُرٍّ بَالِغٍ عَاقِلٍ مُقِيمٍ غَيْرِ مَعْذُورٍ أَمَّا الْمَرْأَةُ وَالْعَبْدُ وَالصَّبِىُّ وَالْمَجْنُونُ وَالْمُسَافِرُ وَالْمَعْذُورُ بِعُذْرٍ شَرْعِىٍّ فَلا تَجِبُ عَلَيْهِمْ صَلاةُ الْجُمُعَةِ وَالْعُذْرُ الشَّرْعِىُّ كَأَنْ كَانَ الْمُسْلِمُ مَرِيضًا يَشُقُّ عَلَيْهِ الذَّهَابُ إِلَى الْجُمُعَةِ مَعَ الْمَرَضِ مَشَقَّةً شَدِيدَةً.\n     وَصَلاةُ الْجُمُعَةِ رَكْعَتَانِ بَدَلَ صَلاةِ الظُّهْرِ يَوْمَ الْجُمُعَةِ وَيُشْتَرَطُ فِيهَا\nأَنْ تُصَلَّى بَعْدَ دُخُولِ وَقْتِ الظُّهْرِ.\nأَنْ يَسْبِقَهَا خُطْبَتَانِ.\nأَنْ تُصَلَّى جَمَاعَةً بِأَرْبَعِينَ رَجُلًا.\n\n     تَنْبِيهٌ\n     مَنْ فَاتَتْهُ صَلاةُ الْجُمُعَةِ صَلَّى الظُّهْرَ لِأَنَّ الْجُمُعَةَ لا تُصَلَّى قَضَاءً رَكْعَتَيْنِ.\n\n     فَائِدَةٌ\n     يُسَنُّ الإِكْثَارُ مِنَ الصَّلاةِ عَلَى النَّبِىِّ يَوْمَ الْجُمُعَةِ قَالَ رَسُولُ اللَّهِ ﷺ »إِنَّ مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمَ الْجُمُعَةِ فَأَكْثِرُوا عَلَىَّ مِنَ الصَّلاةِ فِيهِ فَإِنَّ صَلاتَكُمْ مَعْروضَةٌ عَلَىَّ« رَوَاهُ أَبُو دَاوُدَ.\n\n     أَسْئِلَةٌ\n     (1) عَلَى مَنْ تَجِبُ صَلاةُ الْجُمُعَةِ.\n     (2) عَلَى مَنْ لا تَجِبُ صَلاةُ الْجُمُعَةِ.\n     (3) اذْكُرْ عُذْرًا شَرْعِيًّا لِتَرْكِ الْجُمُعَةِ.\n     (4) كَمْ عَدَدُ رَكَعَاتِ صَلاةِ الْجُمُعَةِ.\n     (5) مَاذَا يُشْتَرَطُ لِصَلاةِ الْجُمُعَةِ.\n     (6) مَنْ فَاتَتْهُ صَلاةُ الْجُمُعَةِ مَاذَا يُصَلِّى.\n     (7) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ يُبَيِّنُ فَضْلَ يَوْمِ الْجُمُعَةِ.\n\nالدَّرْسُ الْحَادِيَ عَشَرَ\nصَوْمُ رَمَضَانَ\n\nقَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَما كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ﴾ [سُورَةَ الْبَقَرَةِ/183].\nوَالصِّيَامُ هُوَ الِامْتِنَاعُ عَنِ الأَكْلِ وَالشُّرْبِ وَسَائِرِ الْمُفَطِّرَاتِ مِنْ طُلُوعِ الْفَجْرِ إِلَى غُرُوبِ الشَّمْسِ مَعَ النِّيَّةِ الْمُبَيَّتَةِ وَالأَكْمَلُ أَنْ يَقُولَ بِقَلْبِهِ نَوَيْتُ صِيَامَ يَوْمِ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانَ هَذِهِ السَّنَة إِيـمَانًا وَاحْتِسَابًا لِلَّهِ تَعَالَى.\nمِنْ مُفْسِدَاتِ الصِّيَامِ\nالأَكْلُ وَالشُّرْبُ عَمْدًا وَلَوْ قَلِيلًا أَمَّا مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا فَلا يُفْطِرُ وَلَوْ كَانَ كَثِيرًا.\nوَإِخْرَاجُ الْقَىْءِ عَمْدًا كَأَنْ يُدْخِلَ الصَّائِمُ إِصْبَعَهُ فِى فَمِهِ فَيُخْرِجَ الْقَىْءَ عَمْدًا أَمَّا إِذَا غَلَبَهُ الْقَىْءُ وَلَمْ يَبْلَعْ شَيْئًا فَلا يُفْطِرُ.\nوَالْقَطْرَةُ فِى الأُذُنِ وَالأَنْفِ تُفَطِّرُ إِذَا وَصَلَ إِلَى الْجَوْفِ أَمَّا فِى الْعَيْنِ فَلا تُفَطِّرُ.\nوَيَجُوزُ لِلْمَرِيضِ الَّذِى يَخَافُ عَلَى نَفْسِهِ الضَّرَرَ مِنَ الصِّيَامِ أَنْ يُفْطِرَ.\n\n     أَسْئِلَةٌ \n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى وُجُوبِ صَوْمِ رَمَضَانَ.\n     (2) مَا هُوَ الصِّيَامُ.\n     (3) مَنْ أَرَادَ الصِّيَامَ مَاذَا يَنْوِى بِقَلْبِهِ لَيْلًا.\n     (4) عَدِّدْ بَعْضَ مُفْسِدَاتِ الصِّيَامِ.\n     (5) مَتَى يَجُوزُ لِلْمَرِيضِ أَنْ يُفْطِرَ.\n\nالدَّرْسُ الثَّانِى عَشَرَ\nالزَّكَاةُ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَأَقِيمُوا الصَّلاةَ وَءَاتُوا الزَّكَاةَ﴾ [سُورَةَ الْبَقَرَةِ/43].\nالزَّكَاةُ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ وَقَدْ فَرَضَ اللَّهُ تَعَالَى الزَّكَاةَ وَتَكُونُ بِأَنْ يَدْفَعَ الْمُزَكِّى شَيْئًا مَعْلُومًا مِنْ مَالِهِ لِأُنَاسٍ حَدَّدَهُمُ الشَّرْعُ مِنْهُمُ الْفُقَرَاءُ وَالْمَسَاكِينُ.\nوَالْفُقَرَاءُ هُمُ الَّذِينَ لا يَجِدُونَ نِصْفَ كِفَايَتِهِمُ الضَّرُورِيَّةِ وَالْمَسَاكِينُ هُمُ الَّذِينَ لا يَجِدُونَ كُلَّ كِفَايَتِهِمُ الضَّرُورِيَّةِ وَلَكِنْ يَجِدُونَ نِصْفَهَا. \nوَتَجِبُ الزَّكَاةُ فِى أَشْيَاءَ مِنْهَا\nالإِبِلُ وَالْبَقَرُ وَالْغَنَمُ. \nوَالذَّهَبُ وَالْفِضَّةُ.\nوَالزُّرُوعُ الْمُقْتَاتَةُ حَالَةَ الِاخْتِيَارِ كَالْقَمْحِ وَالأَرُزِّ. \nوَأَمْوَالُ التِّجَارَةِ.\nوَتَجِبُ زَكَاةُ الْفِطْرِ وَهِىَ الَّتِى تُدْفَعُ إِذَا دَخَلَ شَهْرُ رَمَضَانَ وَقَبْلَ غُرُوبِ شَمْسِ يَوْمِ الْعِيدِ وَلَهَا شُرُوطٌ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الزَّكَاةِ.\n     (2) عَلَى مَنْ تَجِبُ الزَّكَاةُ.\n     (3) لِمَنْ تُعْطَى الزَّكَاةُ.\n     (4) مَنْ هُمُ الْفُقَرَاءُ.\n     (5) مَنْ هُمُ الْمَسَاكِينُ.\n     (6) عَدِّدْ بَعْضَ الأَمْوَالِ الَّتِى تَجِبُ فِيهَا الزَّكَاةُ.\n\nالدَّرْسُ الثَّالِثَ عَشَرَ\nالْحَـــجُّ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا﴾ [سُورَةَ ءَالِ عِمْرَان/97].\nالْحَجُّ مِنْ أَعْظَمِ أُمُورِ الإِسْلامِ وَيَجِبُ عَلَى الْمُسْتَطِيعِ فِى الْعُمُرِ مَرَّةً وَاحِدَةً.\nوَلِلْحَجِّ سِتَّةُ أَرْكَانٍ لا يَصِحُّ بِدُونِهَا وَهِىَ\nالإِحْرَامُ أَىِ النِّيَّةُ.\nوَالْوُقُوفُ بِعَرَفَةَ.\nوَطَوَافُ الإِفَاضَةِ أَىْ أَنْ يَدُورَ حَوْلَ الْكَعْبَةِ سَبْعَ مَرَّاتٍ فِى وَقْتِهِ وَبِشُرُوطٍ.\nوَالسَّعْىُ بَيْنَ الصَّفَا وَالْمَرْوَةِ سَبْعَ مَرَّاتٍ.\nوَالْحَلْقُ أَوِ التَّقْصِيرُ أَىْ أَنْ يَحْلِقَ شَعْرَهُ كُلَّهُ أَوْ يَقُصَّ بَعْضَ شَعَرِهِ وَلَوْ ثَلاثَ شَعَرَاتٍ وَالْمَرْأَةُ تُقَصِّرُ وَلا تَحْلِقُ.\nوَالتَّرْتِيبُ فِى مُعْظَمِ الأَرْكَانِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ عَنِ الْحَجِّ.\n     (2) عَلَى مَنْ يَجِبُ الْحَجُّ وَكَمْ مَرَّةً فِى الْعُمُرِ.\n     (3) مَا هِىَ أَرْكَانُ الْحَجِّ عَدِّدْهَا.\n     (4) مَا مَعْنَى الإِحْرَامِ.\n     (5) مَا مَعْنَى طَوَافِ الإِفَاضَةِ.\n     (6) مَا مَعْنَى الْحَلْقِ أَوِ التَّقْصِيرِ."},{"id":"part3-section3","partIndex":3,"partName":"الجزء الثالث","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّالِثُ"],"title":"فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ","blocks":[{"type":"p","text":"فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ"},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":""},{"type":"p","text":"مِنْ أَخْلاقِ النَّبِىِّ ﷺ"},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى فِى وَصْفِ نَبِيِّهِ ﷺ ﴿وَإِنَّكَ لَعَلَى خُلُقٍ عَظِيمٍ﴾ [سُورَةَ الْقَلَم/4]."},{"type":"p","text":"وَعِنْدَمَا سُئِلَتْ عَائِشَةُ رَضِىَ اللَّهُ عَنْهَا عَنْ خُلُقِهِ قَالَتْ »كَانَ خُلُقَهُ الْقُرْءَانُ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"أَعْطَى اللَّهُ تَعَالَى نَبِيَّنَا مُحَمَّدًا ﷺ الْخُلُقَ الْحَسَنَ حَتَّى إِنَّهُ كَانَ مَشْهُورًا بَيْنَ قَوْمِهِ بِالصَّادِقِ الأَمِينِ."},{"type":"p","text":"وَكَانَ مَوْصُوفًا بِالْحِلْمِ وَالصَّبْرِ وَالشَّجَاعَةِ فَقَدْ قَالَ ابْنُ عُمَرَ رَضِىَ اللَّهُ عَنْهُمَا »مَا رَأَيْتُ أَشْجَعَ وَلا أَجْوَدَ وَلا أَرْضَى مِنْ رَسُولِ اللَّهِ ﷺ« رَوَاهُ الْبَيْهَقِىُّ."},{"type":"p","text":"وَكَانَ ﷺ يَزُورُ الْمَرِيضَ وَيُجِيبُ دَعْوَةَ مَنْ دَعَاهُ إِنْ كَانَ غَنِيًّا أَوْ كَانَ فَقِيرًا."},{"type":"p","text":"وَكَانَ يَأْمُرُ بِالرِّفْقِ وَيَنْهَى عَنِ الْمُنْكَرِ وَيَدْعُو إِلَى الصَّفْحِ وَالْعَفْوِ وَمَكَارِمِ الأَخْلاقِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى وَصْفِ خُلُقِ النَّبِىِّ."},{"type":"p","text":"     (2) مَاذَا قَالَتْ عَائِشَةُ رَضِىَ اللَّهُ عَنْهَا لَمَّا سُئِلَتْ عَنْ خُلُقِ النَّبِىِّ."},{"type":"p","text":"     (3) بِمَ اشْتَهَرَ النَّبِىُّ بَيْنَ قَوْمِهِ."},{"type":"p","text":"     (4) مَاذَا قَالَ ابْنُ عُمَرَ رَضِىَ اللَّهُ عَنْهُمَا عَنْ رَسُولِ اللَّهِ ﷺ."},{"type":"p","text":"     (5) اذْكُرْ بَعْضَ الْخِصَالِ الْحَسَنَةِ الَّتِى كَانَ عَلَيْهَا رَسُولُ اللَّهِ ﷺ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"حِفْظُ اللِّسَانِ"},{"type":"p","text":""},{"type":"p","text":"خَاطَبَ أَحَدُ الصَّحَابَةِ لِسَانَهُ فَقَالَ يَا لِسَانُ قُلْ خَيْرًا تَغْنَمْ وَاسْكُتْ عَنْ شَرٍّ تَسْلَمْ مِنْ قَبْلِ أَنْ تَنْدَمَ إِنِّى سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ »أَكْثَرُ خَطَايَا ابْنِ ءَادَمَ مِنْ لِسَانِهِ« رَوَاهُ الطَّبَرَانِىُّ."},{"type":"p","text":"فَاللِّسَانُ مِنَ النِّعَمِ الَّتِى أَنْعَمَ اللَّهُ بِهَا عَلَى عِبَادِهِ وَهُوَ مَعَ صِغَرِ حَجْمِهِ قَدْ يَكُونُ سَبَبًا لِدُخُولِ صَاحِبِهِ إِلَى النَّارِ فَيَنْبَغِى أَنْ نَسْتَعْمِلَهُ فِى سُبُلِ الْخَيْرِ كَذِكْرِ اللَّهِ تَعَالَى وَتِلاوَةِ الْقُرْءَانِ الْكَرِيمِ وَفِى قَوْلِ الصِّدْقِ وَالأَمْرِ بِالْمَعْرُوفِ وَالنَّهْىِ عَنِ الْمُنْكَرِ وَفِى كُلِّ مَا يَعُودُ عَلَى النَّاسِ بِالنَّفْعِ وَالْخَيْرِ."},{"type":"p","text":"كَمَا يَنْبَغِى أَنْ نَحْفَظَ أَلْسِنَتَنَا عَنِ الْكُفْرِ الَّذِى هُوَ أَخْطَرُ الذُّنُوبِ عِنْدَ اللَّهِ تَعَالَى وَكَذَلِكَ نَحْفَظُهُ عَنِ الْكَذِبِ وَالشَّتْمِ وَعَنِ الْغِيبَةِ وَالنَّمِيمَةِ وَقَوْلِ الْحَرَامِ وَالْكَلامِ الْقَبِيحِ وَمَا فِيهِ إِيذَاءٌ لِلْمُسْلِمِ."},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَاذَا قَالَ بَعْضُ الصَّحَابَةِ مُخَاطِبًا لِسَانَهُ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (2) بِمَ يَنْبَغِى أَنْ نَسْتَعْمِلَ اللِّسَانَ."},{"type":"p","text":"     (3) عَمَّ يَنْبَغِى حِفْظُ أَلْسِنَتِنَا."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"الْكَذِبُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »إِيَّاكَ وَالْكَذِبَ فَإِنَّ الْكَذِبَ يَهْدِى إِلَى الْفُجُورِ وَإِنَّ الْفُجُورَ يَهْدِى إِلَى النَّارِ« رَوَاهُ ابْنُ مَاجَه."},{"type":"p","text":"الْكَذِبُ هُوَ الإِخْبَارُ بِالشَّىْءِ عَلَى خِلافِ الْوَاقِعِ عَمْدًا وَهُوَ حَرَامٌ سَوَاءٌ كَانَ عَلَى وَجْهِ الْجِدِّ أَمْ عَلَى وَجْهِ الْمِزَاحِ قَالَ رَسُولُ اللَّهِ ﷺ »لا يَصْلُحُ الْكَذِبُ فِى جِدٍّ وَلا فِى هَزْلٍ« رَوَاهُ الْبَيْهَقِىُّ."},{"type":"p","text":"فَيَجِبُ عَلَى الْمُسْلِمِ أَنْ يَجْتَنِبَ هَذِهِ الْمَعْصِيَةَ حَتَّى لا يَقَعَ فِى الْمَهَالِكِ فَإِذَا حَدَّثَ أَحَدًا يَتَكَلَّمُ بِصِدْقٍ لِأَنَّ الصِّدْقَ مِنْ صِفَاتِ الصَّالِحِينَ."},{"type":"p","text":"وَالْكَذِبُ الَّذِى فِيهِ إِلْحَاقُ الضَّرَرِ بِالْمُسْلِمِينَ مَعْصِيَتُهُ مِنَ الْكَبَائِرِ."},{"type":"p","text":"وَمَا يُسَمِّيهِ بَعْضُ النَّاسِ كَذِبًا أَبْيَضَ أَوْ كَذْبَةَ نِيسَانَ هُوَ حَرَامٌ فِى شَرْعِ اللَّهِ تَعَالَى."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى النَّهْىِ عَنِ الْكَذِبِ."},{"type":"p","text":"     (2) مَا هُوَ الْكَذِبُ."},{"type":"p","text":"     (3) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى النَّهْىِ عَنِ الْكَذِبِ فِى حَالِ الْجِدِّ وَالْمِزَاحِ."},{"type":"p","text":"     (4) مَا حُكْمُ الْكَذِبِ الَّذِى فِيهِ إِلْحَاقُ الضَّرَرِ بِالْمُسْلِمِينَ."},{"type":"p","text":"     (5) مَا حُكْمُ مَا يُسَمَّى كَذْبَةَ أَوَّلِ نَيْسَانَ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"الإِخْلاصُ وَالرِّيَاءُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿فَمَنْ كَانَ يَرْجُوا لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾ [سُورَةَ الْكَهْف/110]."},{"type":"p","text":"وَقَالَ النَّبِىُّ ﷺ »إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ« رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ."},{"type":"p","text":"أَىْ أَنَّ الْعَمَلَ الصَّالِحَ لا بُدَّ فِيهِ مِنْ نِيَّةٍ صَحِيحَةٍ خَالِصَةٍ لِوَجْهِ اللَّهِ تَعَالَى لِكَىْ يَكُونَ مَقْبُولًا عِنْدَ اللَّهِ تَعَالَى."},{"type":"p","text":"وَالرِّيَاءُ حَرَامٌ وَهُوَ الْعَمَلُ بِالطَّاعَةِ طَلَبًا لِمَحْمَدَةِ النَّاسِ."},{"type":"p","text":"فَالْمُسْلِمُ إِذَا صَلَّى لِيَقُولَ عَنْهُ النَّاسُ فُلانٌ مِنَ الْمُصَلِّينَ فَإِنَّهُ يَكُونُ مُرَائِيًا فِى صَلاتِهِ. وَمَنْ وَقَعَ فِى الرِّيَاءِ فَقَدْ وَقَعَ فِى ذَنْبٍ كَبِيرٍ وَلا ثَوابَ لَهُ فِى عَمَلِهِ."},{"type":"p","text":"فَعِنْدَ الْقِيَامِ بِعَمَلِ الطَّاعَةِ لِيَكُنْ قَصْدُكَ مَرْضَاةَ اللَّهِ تَعَالَى وَحْدَهُ وَهُوَ مَا يُسَمَّى الإِخْلاصَ فِى الْعِبَادَةِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى الْحَثِّ عَلَى الإِخْلاصِ."},{"type":"p","text":"     (2) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى الْحَثِّ عَلَى الإِخْلاصِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (3) وَمَا مَعْنَى هَذَا الْحَدِيثِ."},{"type":"p","text":"     (4) مَا حُكْمُ الرِّيَاءِ وَمَا هُوَ الرِّيَاءُ."},{"type":"p","text":"     (5) مَا حُكْمُ مَنْ صَلَّى لِيَقُولَ عَنْهُ النَّاسُ فُلانٌ مِنَ الْمُصَلِّينَ."},{"type":"p","text":"     (6) مَا هُوَ الإِخْلاصُ فِى الْعِبَادَةِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"الإِحْسَانُ إِلَى الْوَالِدَيْنِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلاهُمَا فَلا تَقُلْ لَهُمَا أُفٍّ وَلا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيـمًا وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا﴾ [سُورَةَ الإِسْرَاءِ]."},{"type":"p","text":"مِنْ حَقِّ الْوَالِدَيْنِ الْمُسْلِمَيْنَ عَلَى وَلَدِهِمَا الْمُسْلِمِ أَنْ يَبَرَّهُمَا وَيُحْسِنَ إِلَيْهِمَا وَلا يَكُونَ غَلِيظًا فِى مُعَامَلَتِهِمَا وَيَتَكَلَّمَ مَعَهُمَا بِالْكَلامِ اللَّيِّنِ اللَّطِيفِ."},{"type":"p","text":"فَاللَّهُ سُبْحَانَهُ وَتَعَالَى نَهَى عَنْ أَنْ يُقَالَ لَهُمَا أُفٍّ وَأَمَرَ بِخَفْضِ الْجَنَاحِ لَهُمَا أَىْ أَنْ يُكَلِّمَهُمَا الِابْنُ بِأَدَبٍ وَاحْتِرَامٍ وَيَتَوَاضَعَ مَعَهُمَا."},{"type":"p","text":"جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ ﷺ فَقَالَ يَا رَسُولَ اللَّهِ مَنْ أَحَقُّ النَّاسِ بِحُسْنِ صَحَابَتِى قَالَ »أُمُّكَ« قَالَ ثُمَّ مَنْ قَالَ »أُمُّكَ« قَالَ ثُمَّ مَنْ قَالَ »أُمُّكَ« قَالَ ثُمَّ مَنْ قَالَ »أَبُوكَ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":""},{"type":"p","text":"     "},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى الْحَثِّ عَلَى بِرِّ الْوَالِدَيْنِ."},{"type":"p","text":"     (2) مَا هُوَ حَقُّ الْوَالِدَيْنِ الْمُسْلِمَيْنِ عَلَى وَلَدِهِمَا."},{"type":"p","text":"     (3) مَا مَعْنَى خَفْضِ الْجَنَاحِ لَهُمَا."},{"type":"p","text":"     (4) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ يُبَيِّنُ حَقَّ الْوَالِدَيْنِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّادِسُ"},{"type":"p","text":"صِلَةُ الأَرْحَامِ"},{"type":"p","text":""},{"type":"p","text":"حَثَّ الإِسْلامُ عَلَى زِيَارَةِ الأَقَارِبِ إِنْ كَانُوا أَقَارِبَ مِنْ جِهَةِ الأَبِ أَوْ أَقَارِبَ مِنْ جِهَةِ الأُمِّ وَهَؤُلاءِ يُسَمَّوْنَ أَرْحَامًا وَتُسَمَّى زِيَارَتُهُمْ وَمُسَاعَدَتُهُمْ وَالإِحْسَانُ إِلَيْهِمْ صِلَةَ الأَرْحَامِ وَمَنْ قَطَعَ هَذِهِ الصِّلَةَ بِلا عُذْرٍ اسْتَحَقَّ عَذَابَ اللَّهِ تَعَالَى فَقَدْ قَالَ النَّبِىُّ ﷺ »لا يَدْخُلُ الْجَنَّةَ قَاطِعٌ« رَوَاهُ الْبُخَارِىُّ وَالْمَعْنَى أَنَّ قَاطِعَ الرَّحِمِ لا يَدْخُلُ الْجَنَّةَ مَعَ الأَوَّلِينَ إِنَّمَا يَدْخُلُهَا بَعْدَ أَنْ يَأْخُذَ نَصِيبَهُ مِنَ الْعَذَابِ فِى الآخِرَةِ إِنْ مَاتَ عَلَى الإِسْلامِ وَلْمْ يَعْفُ اللَّهُ عَنْهُ."},{"type":"p","text":"فَتَجِبُ زِيَارَةُ الأَرْحَامِ عَلَى مَنِ اسْتَطَاعَ وَمَنْ كَانَ مُسَافِرًا مِنْهُمْ وَلَمْ يَسْتَطِعْ زِيَارَتَهُ فَتَحْصُلُ صِلَةُ الرَّحِمِ بِالْمُرَاسَلَةِ أَوْ إِرْسَالِ السَّلامِ."},{"type":"p","text":"وَتَكُونُ الزِّيَارَةُ لَهُمْ بِحَيْثُ لا تَنْقَضِى مُدَّةٌ يَشْعُرُ فِيهَا الأَقَارِبُ بِالْجَفَاءِ، مَثَلًا يَزُورُهُمْ فِى رَمَضَانَ وَفِى الْعِيدَيْنِ وَعِنْدَ الْمَصَائِبِ وَفِى الأَفْرَاحِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَنْ هُمُ الأَرْحَامُ الَّذِينَ حَثَّ الإِسْلامُ عَلَى زِيَارَتِهِمْ."},{"type":"p","text":"     (2) مَاذَا تُسَمَّى زِيَارَتُهُمْ وَالإِحْسَانُ إِلَيْهِمْ."},{"type":"p","text":"     (3) مَنْ قَطَعَ صِلَةَ الأَرْحَامِ مَاذَا يَسْتَحِقُّ."},{"type":"p","text":"     (4) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى النَّهْىِ عَنْ قَطْعِ الأَرْحَامِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (5) مَا مَعْنَى هَذَا الْحَدِيثِ."},{"type":"p","text":"     (6) مَتَى يَزُورُ الشَّخْصُ أَقَارِبَهُ."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ السَّابِعُ"},{"type":"p","text":"التَّوَاضُعُ لِلْمُسْلِمِينَ"},{"type":"p","text":""},{"type":"p","text":"قَالَ النَّبِىُّ ﷺ »لا يَدْخُلُ الْجَنَّةَ مَنْ كَانَ فِى قَلْبِهِ مِثْقَالُ ذَرَّةٍ مِنْ كِبْرٍ« رَوَاهُ أَحْمَدُ أَىْ لا يَدْخُلُهَا مَعَ الأَوَّلِيْنَ إِنْ كَانَ مُسْلِمًا."},{"type":"p","text":"ذَمَّ الإِسْلامُ التَّكَبُّرَ وَالْمُتَكَبِّرِينَ وَالْمُتَكَبِّرُ هُوَ الَّذِى يَحْتَقِرُ الآخَرِينَ وَيَتَعَالَى عَلَيْهِمْ أَوْ يَتَكَبَّرُ عَنْ قَبُولِ الْحَقِّ مِنْ شَخْصٍ ءَاخَرَ مَعَ عِلْمِهِ أَنَّهُ يَقُولُ الْحَقَّ إِمَّا لِكَوْنهِ صَغِيرًا أَوْ فَقِيرًا أَوْ ضَعِيفًا أَوْ غَيْرَ ذَلِكَ فَيَتَكَبَّرُ عَلَيْهِ وَلا يَتَوَاضَعُ لِيَقْبَلَ هَذَا الْحَقَّ قَالَ النَّبِىُّ ﷺ »الْكِبْرُ بَطَرُ الْحَقِّ وَغَمْطُ النَّاسِ« رَوَاهُ مُسْلِمٌ."},{"type":"p","text":"وَمَعْنَى بَطَرُ الْحَقِّ دَفْعُهُ وَرَدُّهُ عَلَى قَائِلِهِ أَىْ لا يَقْبَلُ هَذَا الْحَقَّ، وَمَعْنَى غَمْطِ النَّاسِ احْتِقَارُهُمْ فَالتَّكَبُّرُ صِفَةٌ ذَمِيمَةٌ وَيَدُلُّ عَلَى أَخْلاقٍ غَيْرِ حَمِيدَةٍ فَيَنْبَغِى لِلْمُسْلِمِ أَنْ يَتَوَاضَعَ لِلْمُسْلِمِينَ يُعَامِلُهُمْ بِلِينٍ وِلُطْفٍ وَيُقَابِلُهُمْ بَوِجْهٍ طَلِقٍ بَشُوشِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى ذَمِّ التَّكَبُّرِ."},{"type":"p","text":"     (2) مَنْ رَوَاهُ وَمَا مَعْنَاهُ."},{"type":"p","text":"     (3) مَنْ هُوَ الْمُتَكَبِّرُ."},{"type":"p","text":"     (4) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى مَعْنَى التَّكَبُّرِ وَمَنْ رَوَاهُ."},{"type":"p","text":"     (5) مَا مَعْنَى بَطَرِ الْحَقِّ."},{"type":"p","text":"     (6) مَا مَعْنَى غَمْطِ النَّاسِ."},{"type":"p","text":"     (7) كَيْفَ يَنْبَغِى لِلْمُسْلِمِ أَنْ يُعَامِلَ الْمِسْلِمِينَ وَيُقَابِلَهُمْ. "},{"type":"p","text":""}],"paragraphCount":88,"wordCount":1074,"readingMinutes":6,"description":"المحتوى الكامل لـ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ من الجزء الثالث، مرتب للقراءة في صفحة واحدة.","searchText":"الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الثَّالِثُ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ فَصْلُ الأَخْلاقِ الإِسْلامِيَّةِ\nالدَّرْسُ الأَوَّلُ\n\nمِنْ أَخْلاقِ النَّبِىِّ ﷺ\nقَالَ اللَّهُ تَعَالَى فِى وَصْفِ نَبِيِّهِ ﷺ ﴿وَإِنَّكَ لَعَلَى خُلُقٍ عَظِيمٍ﴾ [سُورَةَ الْقَلَم/4].\nوَعِنْدَمَا سُئِلَتْ عَائِشَةُ رَضِىَ اللَّهُ عَنْهَا عَنْ خُلُقِهِ قَالَتْ »كَانَ خُلُقَهُ الْقُرْءَانُ« رَوَاهُ الْبُخَارِىُّ.\nأَعْطَى اللَّهُ تَعَالَى نَبِيَّنَا مُحَمَّدًا ﷺ الْخُلُقَ الْحَسَنَ حَتَّى إِنَّهُ كَانَ مَشْهُورًا بَيْنَ قَوْمِهِ بِالصَّادِقِ الأَمِينِ.\nوَكَانَ مَوْصُوفًا بِالْحِلْمِ وَالصَّبْرِ وَالشَّجَاعَةِ فَقَدْ قَالَ ابْنُ عُمَرَ رَضِىَ اللَّهُ عَنْهُمَا »مَا رَأَيْتُ أَشْجَعَ وَلا أَجْوَدَ وَلا أَرْضَى مِنْ رَسُولِ اللَّهِ ﷺ« رَوَاهُ الْبَيْهَقِىُّ.\nوَكَانَ ﷺ يَزُورُ الْمَرِيضَ وَيُجِيبُ دَعْوَةَ مَنْ دَعَاهُ إِنْ كَانَ غَنِيًّا أَوْ كَانَ فَقِيرًا.\nوَكَانَ يَأْمُرُ بِالرِّفْقِ وَيَنْهَى عَنِ الْمُنْكَرِ وَيَدْعُو إِلَى الصَّفْحِ وَالْعَفْوِ وَمَكَارِمِ الأَخْلاقِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى وَصْفِ خُلُقِ النَّبِىِّ.\n     (2) مَاذَا قَالَتْ عَائِشَةُ رَضِىَ اللَّهُ عَنْهَا لَمَّا سُئِلَتْ عَنْ خُلُقِ النَّبِىِّ.\n     (3) بِمَ اشْتَهَرَ النَّبِىُّ بَيْنَ قَوْمِهِ.\n     (4) مَاذَا قَالَ ابْنُ عُمَرَ رَضِىَ اللَّهُ عَنْهُمَا عَنْ رَسُولِ اللَّهِ ﷺ.\n     (5) اذْكُرْ بَعْضَ الْخِصَالِ الْحَسَنَةِ الَّتِى كَانَ عَلَيْهَا رَسُولُ اللَّهِ ﷺ.\n\nالدَّرْسُ الثَّانِى\nحِفْظُ اللِّسَانِ\n\nخَاطَبَ أَحَدُ الصَّحَابَةِ لِسَانَهُ فَقَالَ يَا لِسَانُ قُلْ خَيْرًا تَغْنَمْ وَاسْكُتْ عَنْ شَرٍّ تَسْلَمْ مِنْ قَبْلِ أَنْ تَنْدَمَ إِنِّى سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ »أَكْثَرُ خَطَايَا ابْنِ ءَادَمَ مِنْ لِسَانِهِ« رَوَاهُ الطَّبَرَانِىُّ.\nفَاللِّسَانُ مِنَ النِّعَمِ الَّتِى أَنْعَمَ اللَّهُ بِهَا عَلَى عِبَادِهِ وَهُوَ مَعَ صِغَرِ حَجْمِهِ قَدْ يَكُونُ سَبَبًا لِدُخُولِ صَاحِبِهِ إِلَى النَّارِ فَيَنْبَغِى أَنْ نَسْتَعْمِلَهُ فِى سُبُلِ الْخَيْرِ كَذِكْرِ اللَّهِ تَعَالَى وَتِلاوَةِ الْقُرْءَانِ الْكَرِيمِ وَفِى قَوْلِ الصِّدْقِ وَالأَمْرِ بِالْمَعْرُوفِ وَالنَّهْىِ عَنِ الْمُنْكَرِ وَفِى كُلِّ مَا يَعُودُ عَلَى النَّاسِ بِالنَّفْعِ وَالْخَيْرِ.\nكَمَا يَنْبَغِى أَنْ نَحْفَظَ أَلْسِنَتَنَا عَنِ الْكُفْرِ الَّذِى هُوَ أَخْطَرُ الذُّنُوبِ عِنْدَ اللَّهِ تَعَالَى وَكَذَلِكَ نَحْفَظُهُ عَنِ الْكَذِبِ وَالشَّتْمِ وَعَنِ الْغِيبَةِ وَالنَّمِيمَةِ وَقَوْلِ الْحَرَامِ وَالْكَلامِ الْقَبِيحِ وَمَا فِيهِ إِيذَاءٌ لِلْمُسْلِمِ.\n     أَسْئِلَةٌ\n     (1) مَاذَا قَالَ بَعْضُ الصَّحَابَةِ مُخَاطِبًا لِسَانَهُ وَمَنْ رَوَاهُ.\n     (2) بِمَ يَنْبَغِى أَنْ نَسْتَعْمِلَ اللِّسَانَ.\n     (3) عَمَّ يَنْبَغِى حِفْظُ أَلْسِنَتِنَا.\n\nالدَّرْسُ الثَّالِثُ\nالْكَذِبُ\n\nقَالَ رَسُولُ اللَّهِ ﷺ »إِيَّاكَ وَالْكَذِبَ فَإِنَّ الْكَذِبَ يَهْدِى إِلَى الْفُجُورِ وَإِنَّ الْفُجُورَ يَهْدِى إِلَى النَّارِ« رَوَاهُ ابْنُ مَاجَه.\nالْكَذِبُ هُوَ الإِخْبَارُ بِالشَّىْءِ عَلَى خِلافِ الْوَاقِعِ عَمْدًا وَهُوَ حَرَامٌ سَوَاءٌ كَانَ عَلَى وَجْهِ الْجِدِّ أَمْ عَلَى وَجْهِ الْمِزَاحِ قَالَ رَسُولُ اللَّهِ ﷺ »لا يَصْلُحُ الْكَذِبُ فِى جِدٍّ وَلا فِى هَزْلٍ« رَوَاهُ الْبَيْهَقِىُّ.\nفَيَجِبُ عَلَى الْمُسْلِمِ أَنْ يَجْتَنِبَ هَذِهِ الْمَعْصِيَةَ حَتَّى لا يَقَعَ فِى الْمَهَالِكِ فَإِذَا حَدَّثَ أَحَدًا يَتَكَلَّمُ بِصِدْقٍ لِأَنَّ الصِّدْقَ مِنْ صِفَاتِ الصَّالِحِينَ.\nوَالْكَذِبُ الَّذِى فِيهِ إِلْحَاقُ الضَّرَرِ بِالْمُسْلِمِينَ مَعْصِيَتُهُ مِنَ الْكَبَائِرِ.\nوَمَا يُسَمِّيهِ بَعْضُ النَّاسِ كَذِبًا أَبْيَضَ أَوْ كَذْبَةَ نِيسَانَ هُوَ حَرَامٌ فِى شَرْعِ اللَّهِ تَعَالَى.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى النَّهْىِ عَنِ الْكَذِبِ.\n     (2) مَا هُوَ الْكَذِبُ.\n     (3) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى النَّهْىِ عَنِ الْكَذِبِ فِى حَالِ الْجِدِّ وَالْمِزَاحِ.\n     (4) مَا حُكْمُ الْكَذِبِ الَّذِى فِيهِ إِلْحَاقُ الضَّرَرِ بِالْمُسْلِمِينَ.\n     (5) مَا حُكْمُ مَا يُسَمَّى كَذْبَةَ أَوَّلِ نَيْسَانَ.\n\nالدَّرْسُ الرَّابِعُ\nالإِخْلاصُ وَالرِّيَاءُ\n\nقَالَ اللَّهُ تَعَالَى ﴿فَمَنْ كَانَ يَرْجُوا لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾ [سُورَةَ الْكَهْف/110].\nوَقَالَ النَّبِىُّ ﷺ »إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ« رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ.\nأَىْ أَنَّ الْعَمَلَ الصَّالِحَ لا بُدَّ فِيهِ مِنْ نِيَّةٍ صَحِيحَةٍ خَالِصَةٍ لِوَجْهِ اللَّهِ تَعَالَى لِكَىْ يَكُونَ مَقْبُولًا عِنْدَ اللَّهِ تَعَالَى.\nوَالرِّيَاءُ حَرَامٌ وَهُوَ الْعَمَلُ بِالطَّاعَةِ طَلَبًا لِمَحْمَدَةِ النَّاسِ.\nفَالْمُسْلِمُ إِذَا صَلَّى لِيَقُولَ عَنْهُ النَّاسُ فُلانٌ مِنَ الْمُصَلِّينَ فَإِنَّهُ يَكُونُ مُرَائِيًا فِى صَلاتِهِ. وَمَنْ وَقَعَ فِى الرِّيَاءِ فَقَدْ وَقَعَ فِى ذَنْبٍ كَبِيرٍ وَلا ثَوابَ لَهُ فِى عَمَلِهِ.\nفَعِنْدَ الْقِيَامِ بِعَمَلِ الطَّاعَةِ لِيَكُنْ قَصْدُكَ مَرْضَاةَ اللَّهِ تَعَالَى وَحْدَهُ وَهُوَ مَا يُسَمَّى الإِخْلاصَ فِى الْعِبَادَةِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى الْحَثِّ عَلَى الإِخْلاصِ.\n     (2) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى الْحَثِّ عَلَى الإِخْلاصِ وَمَنْ رَوَاهُ.\n     (3) وَمَا مَعْنَى هَذَا الْحَدِيثِ.\n     (4) مَا حُكْمُ الرِّيَاءِ وَمَا هُوَ الرِّيَاءُ.\n     (5) مَا حُكْمُ مَنْ صَلَّى لِيَقُولَ عَنْهُ النَّاسُ فُلانٌ مِنَ الْمُصَلِّينَ.\n     (6) مَا هُوَ الإِخْلاصُ فِى الْعِبَادَةِ.\n\nالدَّرْسُ الْخَامِسُ\nالإِحْسَانُ إِلَى الْوَالِدَيْنِ\n\nقَالَ اللَّهُ تَعَالَى ﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلاهُمَا فَلا تَقُلْ لَهُمَا أُفٍّ وَلا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيـمًا وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا﴾ [سُورَةَ الإِسْرَاءِ].\nمِنْ حَقِّ الْوَالِدَيْنِ الْمُسْلِمَيْنَ عَلَى وَلَدِهِمَا الْمُسْلِمِ أَنْ يَبَرَّهُمَا وَيُحْسِنَ إِلَيْهِمَا وَلا يَكُونَ غَلِيظًا فِى مُعَامَلَتِهِمَا وَيَتَكَلَّمَ مَعَهُمَا بِالْكَلامِ اللَّيِّنِ اللَّطِيفِ.\nفَاللَّهُ سُبْحَانَهُ وَتَعَالَى نَهَى عَنْ أَنْ يُقَالَ لَهُمَا أُفٍّ وَأَمَرَ بِخَفْضِ الْجَنَاحِ لَهُمَا أَىْ أَنْ يُكَلِّمَهُمَا الِابْنُ بِأَدَبٍ وَاحْتِرَامٍ وَيَتَوَاضَعَ مَعَهُمَا.\nجَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ ﷺ فَقَالَ يَا رَسُولَ اللَّهِ مَنْ أَحَقُّ النَّاسِ بِحُسْنِ صَحَابَتِى قَالَ »أُمُّكَ« قَالَ ثُمَّ مَنْ قَالَ »أُمُّكَ« قَالَ ثُمَّ مَنْ قَالَ »أُمُّكَ« قَالَ ثُمَّ مَنْ قَالَ »أَبُوكَ« رَوَاهُ الْبُخَارِىُّ.\n\n     \n     أَسْئِلَةٌ\n     (1) اذْكُرْ ءَايَةً مِنَ الْقُرْءَانِ فِى الْحَثِّ عَلَى بِرِّ الْوَالِدَيْنِ.\n     (2) مَا هُوَ حَقُّ الْوَالِدَيْنِ الْمُسْلِمَيْنِ عَلَى وَلَدِهِمَا.\n     (3) مَا مَعْنَى خَفْضِ الْجَنَاحِ لَهُمَا.\n     (4) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ يُبَيِّنُ حَقَّ الْوَالِدَيْنِ.\n\nالدَّرْسُ السَّادِسُ\nصِلَةُ الأَرْحَامِ\n\nحَثَّ الإِسْلامُ عَلَى زِيَارَةِ الأَقَارِبِ إِنْ كَانُوا أَقَارِبَ مِنْ جِهَةِ الأَبِ أَوْ أَقَارِبَ مِنْ جِهَةِ الأُمِّ وَهَؤُلاءِ يُسَمَّوْنَ أَرْحَامًا وَتُسَمَّى زِيَارَتُهُمْ وَمُسَاعَدَتُهُمْ وَالإِحْسَانُ إِلَيْهِمْ صِلَةَ الأَرْحَامِ وَمَنْ قَطَعَ هَذِهِ الصِّلَةَ بِلا عُذْرٍ اسْتَحَقَّ عَذَابَ اللَّهِ تَعَالَى فَقَدْ قَالَ النَّبِىُّ ﷺ »لا يَدْخُلُ الْجَنَّةَ قَاطِعٌ« رَوَاهُ الْبُخَارِىُّ وَالْمَعْنَى أَنَّ قَاطِعَ الرَّحِمِ لا يَدْخُلُ الْجَنَّةَ مَعَ الأَوَّلِينَ إِنَّمَا يَدْخُلُهَا بَعْدَ أَنْ يَأْخُذَ نَصِيبَهُ مِنَ الْعَذَابِ فِى الآخِرَةِ إِنْ مَاتَ عَلَى الإِسْلامِ وَلْمْ يَعْفُ اللَّهُ عَنْهُ.\nفَتَجِبُ زِيَارَةُ الأَرْحَامِ عَلَى مَنِ اسْتَطَاعَ وَمَنْ كَانَ مُسَافِرًا مِنْهُمْ وَلَمْ يَسْتَطِعْ زِيَارَتَهُ فَتَحْصُلُ صِلَةُ الرَّحِمِ بِالْمُرَاسَلَةِ أَوْ إِرْسَالِ السَّلامِ.\nوَتَكُونُ الزِّيَارَةُ لَهُمْ بِحَيْثُ لا تَنْقَضِى مُدَّةٌ يَشْعُرُ فِيهَا الأَقَارِبُ بِالْجَفَاءِ، مَثَلًا يَزُورُهُمْ فِى رَمَضَانَ وَفِى الْعِيدَيْنِ وَعِنْدَ الْمَصَائِبِ وَفِى الأَفْرَاحِ.\n\n     أَسْئِلَةٌ\n     (1) مَنْ هُمُ الأَرْحَامُ الَّذِينَ حَثَّ الإِسْلامُ عَلَى زِيَارَتِهِمْ.\n     (2) مَاذَا تُسَمَّى زِيَارَتُهُمْ وَالإِحْسَانُ إِلَيْهِمْ.\n     (3) مَنْ قَطَعَ صِلَةَ الأَرْحَامِ مَاذَا يَسْتَحِقُّ.\n     (4) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى النَّهْىِ عَنْ قَطْعِ الأَرْحَامِ وَمَنْ رَوَاهُ.\n     (5) مَا مَعْنَى هَذَا الْحَدِيثِ.\n     (6) مَتَى يَزُورُ الشَّخْصُ أَقَارِبَهُ.\n\n\nالدَّرْسُ السَّابِعُ\nالتَّوَاضُعُ لِلْمُسْلِمِينَ\n\nقَالَ النَّبِىُّ ﷺ »لا يَدْخُلُ الْجَنَّةَ مَنْ كَانَ فِى قَلْبِهِ مِثْقَالُ ذَرَّةٍ مِنْ كِبْرٍ« رَوَاهُ أَحْمَدُ أَىْ لا يَدْخُلُهَا مَعَ الأَوَّلِيْنَ إِنْ كَانَ مُسْلِمًا.\nذَمَّ الإِسْلامُ التَّكَبُّرَ وَالْمُتَكَبِّرِينَ وَالْمُتَكَبِّرُ هُوَ الَّذِى يَحْتَقِرُ الآخَرِينَ وَيَتَعَالَى عَلَيْهِمْ أَوْ يَتَكَبَّرُ عَنْ قَبُولِ الْحَقِّ مِنْ شَخْصٍ ءَاخَرَ مَعَ عِلْمِهِ أَنَّهُ يَقُولُ الْحَقَّ إِمَّا لِكَوْنهِ صَغِيرًا أَوْ فَقِيرًا أَوْ ضَعِيفًا أَوْ غَيْرَ ذَلِكَ فَيَتَكَبَّرُ عَلَيْهِ وَلا يَتَوَاضَعُ لِيَقْبَلَ هَذَا الْحَقَّ قَالَ النَّبِىُّ ﷺ »الْكِبْرُ بَطَرُ الْحَقِّ وَغَمْطُ النَّاسِ« رَوَاهُ مُسْلِمٌ.\nوَمَعْنَى بَطَرُ الْحَقِّ دَفْعُهُ وَرَدُّهُ عَلَى قَائِلِهِ أَىْ لا يَقْبَلُ هَذَا الْحَقَّ، وَمَعْنَى غَمْطِ النَّاسِ احْتِقَارُهُمْ فَالتَّكَبُّرُ صِفَةٌ ذَمِيمَةٌ وَيَدُلُّ عَلَى أَخْلاقٍ غَيْرِ حَمِيدَةٍ فَيَنْبَغِى لِلْمُسْلِمِ أَنْ يَتَوَاضَعَ لِلْمُسْلِمِينَ يُعَامِلُهُمْ بِلِينٍ وِلُطْفٍ وَيُقَابِلُهُمْ بَوِجْهٍ طَلِقٍ بَشُوشِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى ذَمِّ التَّكَبُّرِ.\n     (2) مَنْ رَوَاهُ وَمَا مَعْنَاهُ.\n     (3) مَنْ هُوَ الْمُتَكَبِّرُ.\n     (4) اذْكُرْ حَدِيثًا عَنْ رَسُولِ اللَّهِ فِى مَعْنَى التَّكَبُّرِ وَمَنْ رَوَاهُ.\n     (5) مَا مَعْنَى بَطَرِ الْحَقِّ.\n     (6) مَا مَعْنَى غَمْطِ النَّاسِ.\n     (7) كَيْفَ يَنْبَغِى لِلْمُسْلِمِ أَنْ يُعَامِلَ الْمِسْلِمِينَ وَيُقَابِلَهُمْ. \n"},{"id":"part4-section1","partIndex":4,"partName":"الجزء الرابع","sourceHeader":["الثَّقَافَةُ الإِسْلامِيَّةُ/ الْجُزْءُ الرَّابِعُ"],"title":"فَصْلُ الْعَقَائِدِ","blocks":[{"type":"p","text":"فَصْلُ الْعَقَائِدِ"},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الأَوَّلُ"},{"type":"p","text":"الشَّهَادَتَانِ"},{"type":"p","text":""},{"type":"p","text":"الشَّهَادَتَانِ هُمَا أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ ﷺ."},{"type":"p","text":"فَيَجِبُ عَلَى مَنْ أَرَادَ الدُّخُولَ فِى دِينِ الإِسْلامِ النُّطْقُ بِالشَّهَادَتَيْنِ فَوْرًا بِنِيَّةِ الدُّخُولِ فِى الإِسْلامِ مَعَ اعْتِقَادِ مَعْنَاهُمَا."},{"type":"p","text":"وَمَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ أَعْتَقِدُ بِقَلْبِى وَأَعْتَرِفُ بِلِسَانِى أَنْ لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ أَىْ لا أَحَدَ يَسْتَحِقُّ أَنْ أَتَذَلَّلَ لَهُ نِهَايَةَ التَّذَلُّلِ إِلَّا اللَّهُ تَعَالَى."},{"type":"p","text":"وَمَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ ﷺ أَعْتَقِدُ بِقَلْبِى وَأَعْتَرِفُ بِلِسَانِى أَنَّ سَيِّدَنَا مُحَمَّدَ ابْنَ عَبْدِ اللَّهِ بنِ عَبْدِ الْمُطَّلِبِ بنِ هَاشِمِ بنِ عَبْدِ مَنَافٍ الْقُرَشِىَّ عَبْدُ اللَّهِ وَرَسُولُهُ مُرْسَلٌ إِلَى جَمِيعِ الْخَلْقِ مِنْ إِنْسٍ وَجِنٍّ وَعَرَبٍ وَعَجَمٍ وَهُوَ مِنْ قَبِيلَةِ قُرَيْشٍ أَشْرَفِ قَبَائِلِ الْعَرَبِ وُلِدَ بِمَكَّةَ وَبُعِثَ بِهَا أَىْ نَزَلَ عَلَيْهِ الْوَحْىُ وَهُوَ بِمَكَّةَ بِغَارِ حِرَاءٍ وَهَاجَرَ إِلَى الْمَدِينَةِ وَدُفِنَ فِيهَا وَهُوَ خَاتَمُ الأَنْبِيَاءِ وَالْمُرْسَلِينَ وَأَفْضَلُهُمْ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ. "},{"type":"p","text":"فَيَجِبُ التَّصْدِيقُ بِجَمِيعِ مَا أَخْبَرَ بِهِ وَبَلَّغَهُ عَنِ اللَّهِ تَعَالَى."},{"type":"p","text":"قَالَ الإِمَامُ ذُو النُّونِ الْمِصْرِىُّ »مَهْمَا تَصَوَّرْتَ بِبَالِكَ فَاللَّهُ بِخِلافِ ذَلِكَ«."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَاذَا يَجِبُ عَلَى مَنْ أَرَادَ الدُّخُولَ فِى الإِسْلامِ."},{"type":"p","text":"     (2) مَا مَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ."},{"type":"p","text":"     (3) مَا مَعْنَى لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ."},{"type":"p","text":"     (4) مَا مَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ."},{"type":"p","text":"     (5) أَيْنَ وُلِدَ رَسُولُ اللَّهِ وَأَيْنَ بُعِثَ."},{"type":"p","text":"     (6) إِلَى أَيْنَ هَاجَرَ وَأَيْنَ دُفِنَ."},{"type":"p","text":"     (7) مِنْ أَىِّ قَبِيلَةٍ هُوَ وَلِمَنْ هُوَ مُرْسَلٌ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّانِى"},{"type":"p","text":"أَوَّلُ الْوَاجِبَاتِ"},{"type":"p","text":""},{"type":"p","text":"مَعْرِفَةُ اللَّهِ تَعَالَى وَمَعْرِفَةُ الرَّسُولِ"},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿فَاعْلَمْ أَنَّهُ لا إِلَهَ إِلَّا اللَّهُ﴾ [سُورَةَ مُحَمَّدٍ/19]."},{"type":"p","text":"أَوَّلُ مَا يَجِبُ عَلَى الإِنْسَانِ مَعْرِفَةُ اللَّهِ وَمَعْرِفَةُ رَسُولِهِ ﷺ وَمَعْرِفَةُ اللَّهِ تَكُونُ بِمَعْرِفَةِ مَا يَجِبُ لِلَّهِ وَمَا يَسْتَحِيلُ عَلَى اللَّهِ وَمَا يَجُوزُ فِى حَقِّهِ. "},{"type":"p","text":"وَيَجِبُ لِلَّهِ صِفَاتُ الْكَمَالِ الَّتِى تَلِيقُ بِهِ كَالْعِلْمِ وَالْقُدْرَةِ وَالإِرَادَةِ وَيَسْتَحِيلُ عَلَيْهِ الْجَهْلُ وَالْعَجْزُ وَكُلُّ صِفَاتِ الْحُدُوثِ كَصِفَاتِ الْبَشَرِ وَيَجُوزُ فِى حَقِّهِ خَلْقُ الْمَخْلُوقَاتِ وَإِعْدَامُهَا."},{"type":"p","text":"قَالَ رَسُولُ اللَّهِ ﷺ »أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ« رَوَاهُ الْبُخَارِىُّ."},{"type":"p","text":"قَالَ الْغَزَالِىُّ »لا تَصِحُّ الْعِبَادَةُ إِلَّا بَعْدَ مَعْرِفَةِ الْمَعْبُودِ«."},{"type":"p","text":"وَمَعْرِفَةُ الرَّسُولِ تَكُونُ بِمَعْرِفَةِ مَا يَجِبُ لَهُ وَمَا يَسْتَحِيلُ عَلَيْهِ وَمَا يَجُوزُ فِى حَقِّهِ."},{"type":"p","text":"فَيَجِبُ لَهُ الصِّدْقُ وَالأَمَانَةُ وَالشَّجَاعَةُ وَالذَّكَاءُ وَتَبْلِيغُ الرِّسَالَةِ وَيَسْتَحِيلُ عَلَيْهِ الْكَذِبُ وَالْغِشُّ وَالْغَبَاوَةُ وَالْجُبْنُ وَالْكُفْرُ وَالْكَبَائِرُ وَصَغَائِرُ الْخِسَّةِ قَبْلَ أَنْ يُصْبِحَ نَبِيًّا وَبَعْدَ أَنْ صَارَ نَبِيًّا وَيَجُوزُ فِى حَقِّهِ الأَكْلُ وَالشُّرْبُ وَالنَّوْمُ وَالزِّوَاجُ وَنَحْوُ ذَلِكَ وَكَذَلِكَ جَمِيعُ الأَنْبِيَاءِ."},{"type":"p","text":"الصِّفَاتُ الْوَاجِبَةُ لِلَّهِ"},{"type":"p","text":"(1) الْوُجُودُ (2) الْوَحْدَانِيَّةُ (3) الْقِدَمُ (4) الْبَقَاءُ (5) الْقِيَامُ بِالنَّفْسِ (6) الْقُدْرَةُ (7) الإِرَادَةُ (8) الْعِلْمُ (9) السَّمْعُ (10) الْبَصَرُ (11) الْحَيَاةُ (12) الْكَلامُ (13) الْمُخَالَفَةُ لِلْحَوَادِثِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ أَوَّلُ مَا يَجِبُ عَلَى الإِنْسَانِ."},{"type":"p","text":"     (2) بِمَ تَكُونُ مَعْرِفَةُ اللَّهِ."},{"type":"p","text":"     (3) مَاذَا يَجِبُ لِلَّهِ."},{"type":"p","text":"     (4) مَاذَا يَسْتَحِيلُ عَلَى اللَّهِ وَمَاذَا يَجُوزُ فِى حَقِّهِ تَعَالَى."},{"type":"p","text":"     (5) مَاذَا قَالَ الْغَزَالِىُّ."},{"type":"p","text":"     (6) بِمَ تَكُونُ مَعْرِفَةُ الرَّسُولِ."},{"type":"p","text":"     (7) مَاذَا يَجِبُ لِلأَنْبِيَاءِ."},{"type":"p","text":"     (8) مَاذَا يَسْتَحِيلُ عَلَى الأَنْبِيَاءِ."},{"type":"p","text":"     (9) مَاذَا يَجُوزُ عَلَى الأَنْبِيَاءِ."},{"type":"p","text":"     (10) مَا هِىَ الصِّفَاتُ الْوَاجِبَةُ لِلَّهِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الثَّالِثُ"},{"type":"p","text":"الإِيـمَانُ وَالتَّقْوَى"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا اتَّقُوا اللَّهَ وَلْتَنْظُرْ نَفْسٌ مَّا قَدَّمَتْ لِغَدٍ﴾ [سُورَةَ الْحَشْرِ/18]."},{"type":"p","text":"أَمَرَ اللَّهُ تَعَالَى الْمُؤْمِنِينَ فِى هَذِهِ الآيَةِ بِالتَّقْوَى."},{"type":"p","text":"وَالتَّقْوَى هِىَ أَدَاءُ الْوَاجِبَاتِ وَاجْتِنَابُ الْمُحَرَّمَاتِ."},{"type":"p","text":"وَأَوَّلُ وَأَفْضَلُ الْوَاجِبَاتِ هُوَ الإِيـمَانُ بِاللَّهِ وَرَسُولِهِ ثُمَّ بَعْدَ ذَلِكَ الصَّلاةُ وَالصِّيَامُ وَنَحْوُهُمَا."},{"type":"p","text":"وَأَكْبَرُ الذُّنُوبِ وَأَشَدُّهَا هُوَ الْكُفْرُ بِاللَّهِ تَعَالَى وَهُوَ الذَّنْبُ الَّذِى لا يَغْفِرُهُ اللَّهُ تَعَالَى لِمَنْ مَاتَ عَلَيْهِ وَمَا سِوَاهُ مِنَ الذُّنُوبِ كَالسَّرِقَةِ وَشُرْبِ الْخَمْرِ وَأَكْلِ الرِّبَا يَغْفِرُهَا اللَّهُ لِمَنْ شَاءَ مِنْ عِبَادِهِ الْمُؤْمِنِينَ."},{"type":"p","text":"قَالَ الإِمَامُ أَبُو جَعْفَرٍ الطَّحَاوِىُّ »وَمَنْ وَصَفَ اللَّهَ بِمَعْنًى مِنْ مَعَانِي الْبَشَرِ فَقَدْ كَفَرَ«."},{"type":"p","text":"فَالَّذِينَ مَاتُوا عَلَى الإِيـمَانِ عَلَى قِسْمَيْنِ"},{"type":"p","text":"قِسْمٌ مَاتُوا عَلَى الإِيـمَانِ وَالتَّقْوَى فَهَؤُلاءِ لا عَذَابَ عَلَيْهِمْ فِى الْقَبْرِ وَلا فِى الآخِرَةِ."},{"type":"p","text":"وَقِسْمٌ مَاتُوا عَلَى الإِيـمَانِ وَهُمْ مِنْ أَهْلِ الْكَبَائِرِ أَىْ كَانُوا يَتْرُكُونَ الصَّلاةَ وَالصِّيَامَ وَيَشْرَبُونَ الْخَمْرَةَ وَيَأْكُلُونَ لَحْمَ الْخِنْزِيرِ مَثَلًا فَهَؤُلاءِ مِنْهُمْ مَنْ يُسَامِحُهُمُ اللَّهُ وَيَغْفِرُ لَهُمْ وَلا يُعَذِّبُهُمْ أَىْ يَدْخُلُونَ الْجَنَّةَ بِلا عَذَابٍ وَلَكِنْ مَرْتَبَتُهُمْ دُونَ مَرْتَبَةِ الأَتْقِيَاءِ وَمِنْهُمْ مَنْ يُعَذِّبُهُمْ ثُمَّ يُدْخِلُهُمُ الْجَنَّةَ خَالِدِينَ فِيهَا."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا مَعْنَى التَّقْوَى."},{"type":"p","text":"     (2) مَا هُوَ أَفْضَلُ الْوَاجِبَاتِ."},{"type":"p","text":"     (3) مَا هُوَ أَكْبَرُ الذُّنُوبِ وَأَشَدُّهَا وَمَا هُوَ الذَّنْبُ الَّذِى لا يَغْفِرُهُ اللَّهُ لِمَنْ مَاتَ عَلَيْهِ."},{"type":"p","text":"     (4) مَا سِوَى الْكُفْرِ مِنَ الذُّنُوبِ هَلْ يَغْفِرُهَا اللَّهُ تَعَالَى."},{"type":"p","text":"     (5) الَّذِينَ مَاتُوا عَلَى الإِيـمَانِ عَلَى كَمْ قِسْمٍ."},{"type":"p","text":"     (6) مَا هُوَ حَالُ الْمُؤْمِنِينَ الَّذِينَ مَاتُوا عَلَى الإِيـمَانِ وَالتَّقْوَى."},{"type":"p","text":"     (7) مَا هُوَ حَالُ الْمُؤْمِنِينَ الَّذِينَ مَاتُوا وَهُمْ مِنْ أَهْلِ الْكَبَائِرِ."},{"type":"p","text":"     (8) عَدِّدْ بَعْضَ الْمَعَاصِى الْكَبِيرَةِ."},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الرَّابِعُ"},{"type":"p","text":"الإِسْلامُ دِينُ جَمِيعِ الأَنْبِيَاءِ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿وَمَنْ يَبْتَغِ غَيْرَ الإِسْلامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ﴾ [سُورَةَ ءَالِ عِمْرَان/85]."},{"type":"p","text":"وَقَالَ تَعَالَى أَيْضًا ﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلامُ﴾ [سُورَةَ ءَالِ عِمْرَان/19]."},{"type":"p","text":"فَالدِّينُ الْحَقُّ عِنْدَ اللَّهِ هُوَ الإِسْلامُ وَاتِّبَاعُهُ فِيهِ السَّعَادَةُ فِى الآخِرَةِ وَقَدْ أَرْسَلَ اللَّهُ الأَنْبِيَاءَ وَهُمْ رِجَالٌ صَادِقُونَ خَصَّهُمْ بِالنُّبُوةِ لِتَعْلِيمِ النَّاسِ عَقِيدَةَ الإِسْلامِ وَمَا فِيهِ مَصَالِحُ دِينِهِمْ وَدُنْيَاهُمْ."},{"type":"p","text":"وَكُلُّ الأَنْبِيَاءِ مُسْلِمُونَ يُؤْمِنُونَ بِأَنَّ اللَّهَ وَاحِدٌ لا شَرِيكَ لَهُ أَوَّلُهُمْ ءَادَمُ وَءَاخِرُهُمْ مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى سَائِرِ إِخْوَانِهِ النَّبِيِّينَ وَسَلَّمَ أَمَّا شَرَائِعُهُمْ فَكَانَتْ تَخْتَلِفُ بَعْضُهَا عَنْ بَعْضٍ فَفِى شَرِيعَةِ عِيسَى وَمُوسَى عَلَيْهِمَا السَّلامُ كَانَ الْمُسْلِمُونَ يُصَلُّونَ صَلاتَيْنِ فِى الْيَوْمِ وَاللَّيْلَةِ أَمَّا فِى شَرِيعَةِ مُحَمَّدٍ ﷺ فَالْمُسْلِمُونَ يُصَلُّونَ خَمْسَ صَلَوَاتٍ فِى الْيَوْمِ وَاللَّيْلَةِ."},{"type":"p","text":""},{"type":"p","text":"     أَسْئِلَةٌ"},{"type":"p","text":"     (1) مَا هُوَ الدِّينُ الْحَقُّ اذْكُرْ ءَايَةً تَدُلُّ عَلَى ذَلِكَ. "},{"type":"p","text":"     (2) لِمَ أَرْسَلَ اللَّهُ الأَنْبِيَاءَ."},{"type":"p","text":"     (3) مَنْ هُمُ الأَنْبِيَاءُ مَنْ هُوَ أَوَّلُهُمْ وَمَنْ هُوَ ءَاخِرُهُمْ."},{"type":"p","text":"     (4) اذْكُرْ ءَايَةً تَدُلُّ عَلَى كُفْرِ مَنْ يَتَّبِعُ غَيْرَ الإِسْلامِ."},{"type":"p","text":"     (5) مَا هُوَ دِينُ كُلِّ الأَنْبِيَاءِ وَبِمَ يُؤْمِنُ كُلُّ الأَنْبِيَاءِ."},{"type":"p","text":"     (6) هَلْ كَانَتْ شَرَائِعُ الأَنْبِيَاءِ تَخْتَلِفُ أَعْطِ مِثَالًا."},{"type":"p","text":""},{"type":"p","text":""},{"type":"p","text":"الدَّرْسُ الْخَامِسُ"},{"type":"p","text":"صِفَاتُ الأَنْبِيَاءِ عَلَيْهِمُ الصَّلاةُ وَالسَّلامُ"},{"type":"p","text":""},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَكُلًّا فَضَّلْنَا عَلَى الْعَالَمِينَ﴾ [سُورَةَ الأَنْعَامِ/86]."},{"type":"p","text":"الأَنْبِيَاءُ هُمْ أَفْضَلُ مَخْلُوقَاتِ اللَّهِ تَعَالَى وَهُمْ صَفْوَةُ الْبَشَرِ أَرْسَلَهُمُ اللَّهُ تَعَالَى لِيُبَلِّغُوا النَّاسَ مَصَالِحَ دِينِهِمْ وَدُنْيَاهُمْ فَهُمْ مَوْصُوفُونَ بِالأَخْلاقِ الْحَسَنَةِ وَالصِّفَاتِ الْحَمِيدَةِ."},{"type":"p","text":"فَمِنْ أَخْلاقِهِمُ الْحَسَنَةِ أَنَّهُمْ كُلَّهُمْ صَادِقُونَ أَذْكِيَاءُ أُمَنَاءُ مَوْصُوفُونَ بِالْعِفَّةِ وَالشَّجَاعَةِ فَلَمْ يَكُنْ أَىٌّ مِنَ الأَنْبِيَاءِ كَذَّابًا أَوْ غَبِيًّا وَلَيْسَ بَيْنَهُمْ مَنْ يَخُونُ الأَمَانَةَ وَلَيْسَ

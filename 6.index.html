 مَعَ الْعِلْمِ بِأَنَّ خَبَرَهُ هَذَا عَلَى خِلافِ الْوَاقِعِ وَهُوَ حَرَامٌ سَوَاءٌ كَانَ عَلَى وَجْهِ الْجِدِّ أَوْ عَلَى وَجْهِ الْمَزْحِ فَقَدْ قَالَ النَّبِىُّ ﷺ «لا يَصْلُحُ الْكَذِبُ فِى جِدٍّ وَلا فِى هَزْلٍ» رَوَاهُ الْبَيْهَقِىُّ وَقَالَ ﷺ «إِيَّاكَ وَالْكَذِبَ فَإِنَّ الْكَذِبَ يَهْدِى إِلَى الْفُجُورِ وَإِنَّ الْفُجُورَ يَهْدِى إِلَى النَّارِ وَلا يَزَالُ الْعَبْدُ يَكْذِبُ وَيَتَحَرَّى الْكَذِبَ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا» رَوَاهُ ابْنُ مَاجَهْ.\nوَيَدْخُلُ تَحْتَ الْكَذِبِ أَشْيَاءُ كَثِيرَةٌ مِنْ مَعَاصِى اللِّسَانِ مِنْهَا الْيَمِينُ الْكَاذِبَةُ وَشَهَادَةُ الزُّورِ وَالْكَذِبُ عَلَى اللَّهِ وَرَسُولِهِ.\n   (1) الْيَمِينُ الْكَاذِبَةُ \nالْيَمِينُ الْكَاذِبَةُ مِنْ كَبَائِرِ الذُّنُوبِ كَأَنْ يَحْلِفَ إِنْسَانٌ بِاللَّهِ تَبَارَكَ وَتَعَالَى بِخِلافِ الْوَاقِعِ فَيَقُولَ «وَاللَّهِ فَعَلْتُ كَذَا» وَهُوَ لَمْ يَفْعَلْ أَوْ يَقُولَ «وَاللَّهِ لَمْ أَفْعَلْ هَذَا الشَّىْءَ» وَهُوَ قَدْ فَعَلَهُ فَهَذَا مِنَ التَّهَاوُنِ فِى تَعْظِيمِ اللَّهِ تَعَالَى.\n   (2) شَهَادَةُ الزُّورِ \nمَعْنَى الزُّورِ الْكَذِبُ وَشَهَادَةُ الزُّورِ مِنْ أَكْبَرِ الْكَبَائِرِ كَأَنْ يَشْهَدَ شَخْصٌ عِنْدَ الْقَاضِى أَنَّ فُلانًا سَرَقَ وَهُوَ يَكْذِبُ قَالَ النَّبِىُّ ﷺ «عَدَلَتْ شَهَادَةُ الزُّورِ الإِشْرَاكَ بِاللَّهِ» رَوَاهُ الْبَيْهَقِىُّ أَىْ شُبِّهَتْ بِالإِشْرَاكِ مِنْ عُظْمِ الذَّنْبِ النَّاتِجِ عَنْهَا وَلَيْسَ الْمُرَادُ أَنَّ فَاعِلَهَا يَخْرُجُ مِنْ دِينِ الإِسْلامِ وَلَكِنَّهُ مُذْنِبٌ ذَنْبًا كَبِيرًا.\n   (3) الْكَذِبُ عَلَى اللَّهِ وَعَلَى رَسُولِهِ وَهُوَ مِنْ كَبَائِرِ الذُّنُوبِ قَالَ اللَّهُ تَعَالَى ﴿وَيَوْمَ الْقِيَامَةِ تَرَى الَّذِينَ كَذَبُوا عَلَى اللَّهِ وُجُوهُهُمْ مُّسْوَدَّةٌ﴾ [سُورَةَ الزُّمَر/60] وَالْكَذِبُ عَلَى اللَّهِ كَأَنْ يَقُولَ شَخْصٌ خَلَقَ اللَّهُ فِى جِهَةِ كَذَا جَبَلًا مِنْ ذَهَبٍ وَهُوَ يَكُونُ غَيْرَ مَوْجُودٍ فَهُوَ خِلافُ الْوَاقِعِ مَعَ الْعِلْمِ أَنَّ اللَّهَ قَادِرٌ عَلَى أَنْ يَخْلُقَهُ. وَمِنَ الْكَذِبِ عَلَى اللَّهِ مَا يَكُونُ كُفْرًا كَمَنْ يَقُولُ إِنَّ اللَّهَ جَالِسٌ عَلَى الْعَرْشِ أَوْ سَاكِنٌ فِى جِهَةٍ مِنَ الْجِهَاتِ أَوْ مَنْ يَقُولُ إِنَّ اللَّهَ حَالٌّ فِى كُلِّ شَىْءٍ فَهَذَا كُفْرٌ وَكَذَلِكَ مَنْ يَنْسُبُ إِلَى اللَّهِ تَحْلِيلَ مَا حَرَّمَهُ فِى شَرْعِهِ أَوْ تَحْرِيمَ مَا أَحَلَّهُ فِى شَرْعِهِ مَعَ الْعِلْمِ بِهِ.\n   أَمَّا الْكَذِبُ عَلَى الرَّسُولِ ﷺ فَهُوَ كَأَنْ يَنْسُبَ كَاذِبًا إِلَى رَسُولِ اللَّهِ ﷺ كلامًا لَمْ يَقُلْهُ قَالَ رَسُولُ اللَّهِ ﷺ «إِنَّ كَذِبًا عَلَىَّ لَيْسَ كَكَذِبٍ عَلَى أَحَدٍ فَمَنْ كَذَبَ عَلَىَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ» رَوَاهُ مُسْلِمٌ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ الْكَذِبُ وَمَا الدَّلِيلُ عَلَى حُرْمَتِهِ مِنَ الْحَدِيثِ.\n     (2) اذْكُرْ حَدِيثًا يَدُلُّ عَلَى تَحْرِيمِ الْكَذِبِ فِى حَالِ الْجِدِّ وَالْمَزْحِ.\n     (3) مَا مَعْنَى الْيَمِينِ الْكَاذِبَةِ.\n     (4) مَا مَعْنَى شَهَادَةِ الزُّورِ أَعْطِ مِثَالًا.\n     (5) بِمَ شَبَّهَ النَّبِىُّ شَهَادَةَ الزُّورِ، اذْكُرِ الْحَدِيثَ وَبَيِّنْ مَعْنَاهُ. \n     (6) اذْكُرْ مِثَالًا عَنِ الْكَذِبِ عَلَى اللَّهِ وَالدَّلِيلَ عَلَى تَحْرِيمِهِ مِنَ الْقُرْءَانِ.\n     (7) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ الْكَذِبِ عَلَى الرَّسُولِ.\n\nالدَّرْسُ السَّابِعُ\nفَضْلُ الْعِلْمِ وَالْعَمَلُ بِهِ\n\nقَالَ النَّبِىُّ ﷺ «طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ» رَوَاهُ الْبَيْهَقِىُّ.\nالْعِلْمُ وَالْتَفَقُّهُ فِى الدِّينِ هُوَ أَسْنَى مَا تُنْفَقُ فِيهِ نَفَائِسُ الأَوْقَاتِ لِأَنَّ الطَّرِيقَ السَّلِيمَ لِوِقَايَةِ النَّفْسِ وَالأَهْلِ مِنْ عَذَابِ النَّارِ يَكُونُ بِتَعلُّمِ الأُمُورِ الدِّينِيَّةِ أَىْ تَعَلُّمِ مَا فَرَضَ اللَّهُ عَلَيْنَا تَعَلُّمَهُ وَاجْتِنَابِ مَا فَرَضَ اللَّهُ عَلَيْنَا اجْتِنَابَهُ.\nقَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿يَرْفَعِ اللَّهُ الَّذِينَ ءَامَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ﴾ [سُورَةَ الْمُجَادِلَة/11] وَقَالَ النَّبِىُّ ﷺ «مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِى الدِّينِ» رَوَاهُ الْبُخَارِىُّ.\n\nالْعِلْمُ وَالأَخْلاقُ الْفَاضِلَةُ \nلا يَكُونُ الْعَبْدُ صَالِحًا إِلَّا بِالْعِلْمِ مَعَ الْعَمَلِ أَىْ بِأَنْ يِتَعَلَّمَ أُمُورَ الدِّينِ وَيُطَبِّقَ مَا تَعَلَّمَهُ عَلَى نَفْسِهِ فَمَنْ تَعَلَّمَ وَعَمِلَ بِمَا تَعَلَّمَ فَهُوَ الشَّخْصُ الَّذِى يَعْرِفُ كَيْفَ يَصْرِفُ قَلْبَهُ وَجَوَارِحَهُ فِى طَاعَةَ اللَّهِ وَبِذَلِكَ يَصِلُ الْمُسْلِمُ إِلَى الأَخْلاقِ الْفَاضِلَةِ فَهُوَ يَسْتَعْمِلُ سَمْعَهُ فِى تَلَقِّى الْعِلْمِ وَيَسْتَعْمِلُ لِسَانَهُ فِى مُذَاكَرَتِهِ وَكَذَلِكَ فِى تَبْلِيغِ مَا تَعَلَّمَهُ فَقَدْ قَالَ النَّبِىُّ ﷺ «بَلِّغُوا عَنِّى وَلَوْ ءَايَةً» رَوَاهُ الْبُخَارِىُّ.\nتَجَنُّبُ مَعَاصِى اللِّسَانِ\nوَمِنْ جُمْلَةِ مَا يَنْبَغِى عَلَى الْمُتَعَلِّمِ تَجَنُّبُهُ مَعَاصِى اللِّسَانِ وَمِنْهَا الْفَتْوَى بِغَيْرِ عِلْمٍ وَكَتْمُ الْعِلْمِ الْوَاجِبِ مَعَ وُجُودِ الطَّالِبِ وَالسُّكُوتُ عَنِ الأَمْرِ بِالْمَعْرُوفِ وَالنَّهْىِ عَنِ الْمُنْكَرِ مَعَ الِاسْتِطَاعَةِ.\n   (1) الْفَتْوَى بِغَيْرِ عِلْمٍ \nوَهُوَ أَنْ يَقُولَ الشَّخْصُ فِى أُمُورِ الدِّينِ بِرَأْيِهِ وَهَذَا حَرَامٌ يُوقِعُ صَاحِبَهُ فِى الْمَهَالِكِ كَأَنْ يَقُولَ عَنْ شَىْءٍ يَجُوزُ فِعْلُهُ أَوْ لا يَجُوزُ وَهُوَ لا يَعْلَمُ حُكْمَهُ فِى الشَّرْعِ قَالَ رَسُولُ اللَّهِ ﷺ «مَنْ أَفْتَى بِغَيْرِ عِلْمٍ فَعَلَيْهِ لَعْنَةُ اللَّهِ وَالْمَلائِكَةِ وَالنَّاسِ أَجْمَعِينَ» رَوَاهُ السُّيُوطِىُّ.\n   (2) كَتْمُ الْعِلْمِ الْوَاجِبِ مَعَ وُجُودِ الطَّالِبِ \nمِنْ مَعَاصِى اللِّسَانِ كَتْمُ الْعِلْمِ الْوَاجِبِ كَتَعْلِيمِ فَرْضِ الْعَيْنِ لِلشَّخْصِ الْمُحْتَاجِ إِلَيْهِ مَعَ وُجُودِهِ قَالَ النَّبِىُّ ﷺ «مَنْ سُئِلَ عَنْ عِلْمٍ فَكَتَمَهُ أُلْجِمَ يَوْمَ الْقِيَامَةِ بِلِجَامٍ مِنْ نَارٍ» رَوَاهُ ابْنُ مَاجَهْ وَالْحَاكِمُ وَابْنُ حِبَّانَ.\n   (3) السُّكُوتُ عَنِ الأَمْرِ بِالْمَعْرُوفِ وَالنَّهْىِ عَنِ الْمُنْكَرِ \nوَيَكُونُ مَعْصِيَةً مِنْ مَعَاصِى اللِّسَانِ مَعَ الِاسْتِطَاعَةِ أَىْ إِنْ كَانَ مُسْتَطِيعًا فَإِذَا رَأَى شَخْصًا يَتْرُكُ الصَّلاةَ وَهُوَ يَقْبَلُ النَّصِيحَةَ وَجَبَ أَمْرُهُ بِالْمَعْرُوفِ أَىْ بِأَدَاءِ الصَّلاةِ.\n\n     أَسْئِلَةٌ\n     (1) اذْكُرْ حَدِيثًا عَنِ النَّبِىِّ فِى الْحَثِّ عَلَى طَلَبِ الْعِلْمِ.\n     (2) مَا هُوَ الطَّرِيقُ السَّلِيمُ لِوِقَايَةِ النَّفْسِ وَالأَهْلِ مِنَ النَّارِ.\n     (3) اذْكُرْ ءَايَةً وَحَدِيثًا فِى فَضْلِ الْعِلْمِ.\n     (4) اذْكُرْ حَدِيثًا فِى الأَمْرِ بِتَبْلِيغِ الْعِلْمِ وَمَنْ رَوَاهُ.\n     (5) عَدِّدْ بَعْضَ مَعَاصِى اللِّسَانِ.\n     (6) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ الْفَتْوَى بِغَيْرِ عِلْمٍ.\n     (7) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ كَتْمِ الْعِلْمِ.\n\nالدَّرْسُ الثَّامِنُ\nالأَلْعَابُ الْمُحَرَّمَةُ\n\nمِنْ مَعَاصِى الْيَدِ اللَّعِبُ بِالأَلْعَابِ الَّتِى حَرَّمَهَا الشَّرْعُ وَهِىَ كَثِيرَةٌ مِنْهَا النَّرْدُ وَالشَّدَّةُ لِأَنَهَا تَعْتَمِدُ عَلَى الْحَزْرِ وَالتَّخْمِينِ لا عَلَى الْفِكْرِ وَالْحِسَابِ وَتَصْوِيرُ ذِى رُوحٍ وَالْقِمَارُ. وَالأَلْعَابُ الْمُحَرَّمَةُ بَعْضُهَا يُؤَدِّى لِلتَّخَاصُمِ وَالْفِتَنِ بَيْنَ النَّاسِ وَيَنْتُجُ عَنْهَا شُّرورٌ كَثِيرَةٌ.\n   (1) النَّرْدُ \nويُسَمَّى أَيْضًا النَّرْدَشِيرَ وَهُوَ نِسْبَةٌ لِأَوَّلِ مُلُوكِ الْفُرْسِ لِأَنَّهُ أَوَّلُ مَنْ وُضِعَ لَهُ قَالَ عَلَيْهِ الصَّلاةُ والسَّلامُ «مَنْ لَعِبَ بِالنَّرْدَشِيرِ فَكَأَنَّمَا غَمَسَ يَدَهُ فِى لَحْمِ خِنْزِيرٍ وَدَمِهِ» رَوَاهُ أَبُو دَاوُدَ وابْنُ مَاجَهْ.\n   (2) وَالشَّدَّةُ \nوَتُقَاسُ عَلَى النَّرْدِ لِأَنَّ كُلَّ لُعْبَةٍ كَانَ الِاعْتِمَادُ فِى لُعْبِهَا عَلَى الْحَزْرِ وَالتَّخْمِينِ لا عَلَى الْفِكْرِ وَالْحِسَابِ فَهِىَ حَرَامٌ مِثْلُ اللَّعِبِ بِالأَوْرَاقِ الْمَعْرُوفَةِ بِالشَّدَّةِ.\nوَكَذَلِكَ الدُّومِينُو وَالْبِرْجِيسُ لِأَنَهَا أَلْعَابٌ لَيْسَ الْعَمَلُ فِيهَا إِلَّا عَلَى الْحَزْرِ وَالتَّخْمِينِ وَهَذِهِ الأَلْعَابُ إِنْ كَانَتْ بِعِوَضٍ أَىْ عَلَى مَالٍ يَدْفَعُهُ الْخَاسِرُ فِى اللَّعِبِ فَهُوَ قِمَارٌ حَرَامٌ مِنْ كَبَائِرِ الذُّنُوبِ.\nأَمَّا الشِّطْرَنْجُ فَإِنَّهُ لَيْسَ فِى مَعْنَى اللَّعِبِ بِالنَّرْدِ لِأَنَّ الْعُمْدَةَ فِيهِ عَلَى الْفِكْرِ وَالْحِسَابِ قَبْلَ النَّقْلِ وَمَا وَرَدَ عَنِ النَّبِىِّ ﷺ فِى ذَمِّهِ غَيْرُ ثَابِتٍ إِذْ هُوَ مَوْضُوعٌ لِصِحَّةِ الْفِكْرِ وَصَوَابِ التَّدْبِيرِ وَنِظَامِ السِّيَاسَةِ وَهُوَ مُعِينٌ عَلَى تَدْبِيرِ الْحُرُوبِ وَالْحِسَابِ.\n   (3) وَتَصْوِيرُ ذِى رُوحٍ \nوَمِنْ مَعَاصِى الْيَدِ تَصْوِيرُ ذِى رُوحٍ سَوَاءٌ كَانَ مُجَسَّمًا أَوْ مَنْقُوشًا فِى سَقْفٍ أَوْ جِدَارٍ أَوْ مُصَوَّرًا فِى وَرَقٍ أَوْ مَنْسُوجًا فِى ثَوْبٍ أَوْ غَيْرِ ذَلِكَ وَيُسْتَثْنَى مِنْ ذَلِكَ لُعَبُ الْبَنَاتِ الصِّغَارِ وَيُشْتَرَطُ لِتَحْرِيمِ اسْتِبْقَاءِ الصُّورَةِ أَنْ تَكُونَ الصُّورَةُ بِهَيْئَةٍ يَعِيشُ عَلَيْهَا الْحَيَوَانُ.\n\n     أَسْئِلَةٌ\n     (1) عَدِّدْ بَعْضَ الأَلْعَابِ الْمُحَرَّمَةِ.\n     (2) لِمَ حُرِّمَتْ هَذِهِ الأَلْعَابُ.\n     (3) مَا هُوَ النَّرْدُ وَمَا الدَّلِيلُ عَلَى تَحْرِيمِهِ.\n     (4) لِمَ يَحْرُمُ اللَّعِبُ بِالأَوْرَاقِ الْمُزَوَّقَةِ (الشَّدَّةِ).\n     (5) مَا حُكْمُ اللَّعِبِ بِالشِّطْرَنْجِ ولِمَ وُضِعَ.\n     (6) مَا حُكْمُ تَصْوِيرِ ذِى رُوحٍ وَمَاذَا يُسْتَثْنَى مِنْ ذَلِكَ.\n\nالدَّرْسُ التَّاسِعُ\nعُقُوقُ الْوَالِدَيْنِ\n\nعُقُوقُ الْوَالِدَيْنِ مِنَ الْكَبَائِرِ الَّتِى تَوَعَّدَ اللَّهُ فَاعِلَهَا بِالْعَذَابِ الشَّدِيدِ فِى النَّارِ وَمَعْنَى الْعُقُوقِ أَنْ يُؤْذِىَ وَالِدَيْهِ أَوْ أَحَدَهُمَا أَذًى لَيْسَ بِهَيِّنٍ وَإِيذَاءُ الوَالِدَيْنِ سَوَاءٌ كَانَ أَذًى شَدِيدًا أَوْ خَفِيفًا حَرَامٌ.\nوَمِنَ الأَمْثِلَةِ عَلَى الْعُقُوقِ شَتْمُ الأُمِّ أَوِ الأَبِ أَوْ ضَرْبُ الأُمِّ أَوِ الأَبِ أَوْ إِهَانَتُهُمَا أَوْ أَحَدِهِمَا.\nوَمِنْ جُمْلَةِ الْعُقُوقِ إِذَا أَطَاعَ الْوَلَدُ أُمَّهُ عَلَى ظُلْمِ أَبِيهِ أَوْ أَطَاعَ أَبَاهُ عَلَى ظُلْمِ أُمِّهِ وَلا يَنْفَعُهُ عِنْدَ اللَّهِ تَعَالَى إِنْ أَطَاعَ أُمَّهُ وَظَلَمَ أَبَاهُ لِأَنَّهُ لا طَاعَةَ لِمَخْلُوقٍ فِى مَعْصِيَةِ الْخَالِقِ فَنُصْرَةُ أَحَدِ الأَبَوَيْنِ فِى ظُلْمِ الآخَرِ حَرَامٌ.\nقَالَ اللَّهُ تَعَالَى ﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلاهُمَا فَلا تَقُلْ لَّهُمَا أُفٍّ وَلا تَنْهَرْهُمَا وَقُلْ لَّهُمَا قَوْلًا كَرِيمًا وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا﴾ [سُورَةَ الإِسْرَاء].\nوَمَعْنَى قَوْلِهِ تَعَالَى ﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ أَىْ أَمَرَ اللَّهُ أَنْ لا يُعْبَدَ سِوَاهُ وَبِبِرِّ الْوَالِدَيْنِ، وَمَعْنَى قَوْلِهِ تَعَالَى ﴿وَقُلْ لَّهُمَا قَوْلًا كَرِيمًا﴾ أَىْ قَوْلًا لَيِّنًا لَطِيفًا فَاللَّهُ سُبْحَانَهُ وَتَعَالَى نَهَى عَنْ أَنْ يُقَالَ لَهُمَا أُفٍّ وَهَذَا مِنَ الْكَبَائِرِ وَأَمَرَ سُبْحَانَهُ وَتَعَالَى أَنْ يُقَالَ لَهُمَا الْقَوْلُ الْكَرِيمُ أَىِ اللَّيِّنُ لا سِيَّمَا عِنْدَ الْكِبَرِ وَأَنْ نُخْفِضَ لَهُمَا الْجَنَاحَ بِأَنْ نُكَلِّمَهُمَا بِأَدَبٍ وَاحْتِرَامٍ.\nعَذَابُ الْعَاقِّ لِوَالِدَيْهِ\nإِنَّ عَذَابَ عُقُوقِ الْوَالِدَيْنِ عِنْدَ اللَّهِ تَعَالَى عَظِيمٌ حَيْثُ إِنَّ عَاقَّهُمَا لا يَدْخُلُ الْجَنَّةَ مَعَ الْمُسْلِمِينَ الأَوَّلِينَ بَلْ يَدْخُلُهَا بَعْدَ عَذَابٍ شَدِيدٍ مَعَ الآخِرِينَ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ وَذَلِكَ لِأَنَّ هَذَا الذَّنْبَ هُوَ مِنْ كَبَائِرِ الذُّنُوبِ قَالَ رَسُولُ اللَّهِ ﷺ «لا يَدْخُلُ الْجَنَّةَ عَاقٌّ» رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ، أَىْ لا يَدْخُلُهَا مَعَ الأَوَّلِينَ وَلَيْسَ الْمَعْنَى أَنَّهُ كَافِرٌ مَحْرُومٌ مِنَ الْجَنَّةِ.\n\nءَايَاتٌ قُرْءَانِيَّةٌ فِى الْحَثِّ عَلَى بِرِّ الْوَالِدَيْنِ\nقَالَ اللَّهُ تَعَالَى ﴿وَوَصَّيْنَا الإِنْسَانَ بِوَالِدَيْهِ حَمَلَتْهُ أُمُّهُ وَهْنًا عَلَى وَهْنٍ وَفِصَالُهُ فِى عَامَيْنِ أَنِ اشْكُرْ لِى وَلِوَالِدَيْكَ إِلَىَّ الْمَصِيرُ﴾ [سُورَةَ لُقْمَان/14] وَقَالَ اللَّهُ تَعَالَى ﴿وَاعْبُدُوا اللَّهَ وَلا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [سُورَةَ النِّسَاء /36].\nفَاعْلَمْ أَنَّ الْمَرْءَ مَهْمَا كَانَ مُوَاظِبًا عَلَى أَدَاءِ الصَّلَوَاتِ الْخَمْسِ وَالصِّيَامِ وَنَحْوِ ذَلِكَ مِنَ الْفَرَائِضِ إِذَا كَانَ عَاقًّا لِوَالِدَيْهِ يُؤْذِيهِمَا أَذًى شَدِيدًا بِالْقَوْلِ أَوِ الْفِعْلِ فَإِنَّهُ لا يَكُونُ عِنْدَ اللَّهِ مِنَ الْمُتَّقِينَ الصَّالِحِينَ. فَاحْرِصْ عَلَى بِرِّ الْوَالِدَيْنِ وَإِيَّاكَ وَالْعُقُوقَ فَإِنَّكَ إِمَّا أَنْ تَمُوتَ قَبْلَهُمَا أَوْ يَمُوتَا قَبْلَكَ فَلا تُفَوِّتْ هَذَا الفَضْلَ الْعَظِيمَ بِرَّ الْوَالِدَيْنِ.\n\n     أَسْئِلَةٌ\n     (1) مَا مَعْنَى عُقُوقِ الْوَالِدَيْنِ وَمَا حُكْمُهُ.\n     (2) أَعْطِ أَمْثِلَةً عَلَى عُقُوقِ الْوَالِدَيْنِ.\n     (3) اذْكُرْ دَلِيلًا مِنَ الْقُرْءَانِ عَلَى تَحْرِيمِ الْعُقُوقِ.\n     (4) اشْرَحِ الآيَةَ ﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾.\n     (5) مَا مَعْنَى الآيَةِ ﴿وَقُلْ لَّهُمَا قَوْلًا كَرِيمًا﴾.\n     (6) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ الْعُقُوقِ وَمَا مَعْنَاهُ.\n     (7) اذْكُرْ ثَلاثَ ءَايَاتٍ فِيهَا الأَمْرُ بِالإِحْسَانِ لِلْوَالِدَيْنِ.\n\nالدَّرْسُ الْعَاشِرُ\nقَطِيعَةُ الرَّحِمِ\n\nقَطِيعَةُ الرَّحِمِ هِىَ مِنْ مَعَاصِى الْبَدَنِ وَهِىَ مِنَ الْكَبَائِرِ وَتَحْصُلُ بِإِيحَاشِ قُلُوبِ الأَرْحَامِ وَتَنْفِيرِهَا إِمَّا بِتَرْكِ الإِحْسَانِ بِالْمَالِ فِى حَالِ الْحَاجَةِ النَّازِلَةِ بِهِمْ أَوْ تَرْكِ الزِّيَارَةِ بِلا عُذْرٍ كَأَنْ يَفْقِدَ مَا كَانَ يَصِلُهُمْ بِهِ مِنَ الْمَالِ أَوْ يَجِدَهُ لَكِنَّهُ يَحْتَاجُهُ لِمَا هُوَ أَوْلَى بِصَرْفِهِ فِيهِ مِنْهُمْ.\nقَالَ اللَّهُ تَعَالَى ﴿فَهَلْ عَسَيْتُمْ إِنْ تَوَلَّيْتُمْ أَنْ تُفْسِدُوا فِى الأَرْضِ وَتُقَطِّعُوا أَرْحَامَكُمْ أُولَئِكَ الَّذِينَ لَعَنَهُمُ اللَّهُ فَأَصَمَّهُمْ وَأَعْمَى أَبْصَارَهُمْ﴾ [سُورَةَ مُحَمَّد/22]. \nوَقَالَ النَّبِىُّ ﷺ «لا يَدْخُلُ الْجَنَّةَ قَاطِعٌ» رَوَاهُ الْبُخَارِىُّ، وَمَعْنَى قَاطِعٌ أَىْ قَاطِعُ رَحِمٍ فَهُوَ لا يَدْخُلُ الْجَنَّةَ مَعَ الأَوَّلِينَ بَلْ يَدْخُلُهَا بَعْدَ عَذَابٍ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ.\nصِلَةُ الرَّحِمِ \nوَالْمُرَادُ بِالرَّحِمِ الأَقَارِبُ كَالْخَالاتِ وَالْعَمَّاتِ وَأَوْلادِهِنَّ وَالأَخْوَالِ وَالأَعْمَامِ وَأَوْلادِهِمْ، سَأَلَ أَحَدُ الصَّحَابَةِ رَسُولَ اللَّهِ ﷺ فَقَالَ مَا النَّجَاةُ يَا رَسُولَ اللَّهِ قَالَ «تَصِلُ مَنْ قَطَعَكَ وَتُعْطِى مَنْ حَرَمَكَ وَتَعْفُو عَمَّنْ ظَلَمَكَ» رَوَاهُ التِّرْمِذِىُّ.\nفَهَذِهِ الْخِصَالُ الثَّلاثُ الْعَظِيمَةُ كَانَتْ مِنْ أَوْصَافِ الرَّسُولِ وَأَخْلاقِهِ وَالَّتِى مِنْهَا وَصْلُ مَنْ قَطَعَ أَىْ أَنَّ لِلرَّحِمِ حَقَّ الصِّلَةِ فَلا يَجُوزُ لِلْمَرْءِ أَنْ يَقْطَعَ مَنْ تَجِبُ عَلَيْهِ صِلَتُهُ مِنَ الأَقَارِبِ بِحَيْثُ يَشْعُرُ بِالْجَفَاءِ وَلَوْ قَطَعَ هَذَا الْقَرِيبُ زِيَارَتَهُ.\nالصِّلَةُ الْكَامِلَةُ لِلرَّحِمِ \nوَالصِّلَةُ الْكَامِلَةُ لِلرَّحِمِ هُوَ أَنْ يَصِلَ الْمَرْءُ مَنْ قَطَعَهُ مِنَ الرَّحِمِ فَلا يَقُولُ هَذَا رَحِمِى لا يَزُورُنِى فَلا أَزُورُهُ لا يَجُوزُ أَنْ يُقَابِلَ الْقَطِيعَةَ بِالْقَطِيعَةِ بَلْ يَجِبُ عَلَيْهِ أَنْ يُقَابِلَ الْقَطِيعَةَ بِالصِّلَةِ. قَالَ رَسُولُ اللَّهِ ﷺ «لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ وَلَكِنَّ الْوَاصِلَ مَنْ وَصَلَ رَحِمَهُ إِذَا قَطَعَتْ» رَوَاهُ مُسْلِمٌ، فَفِى هَذَا الْحَدِيثِ إِيذَانٌ بِأَنَّ صِلَةَ الرَّجُلِ رَحِمَهُ الَّتِى لا تَصِلُهُ أَفْضَلُ مِنْ صِلَتِهِ رَحِمَهُ الَّتِى تَصِلُهُ لِأَنَّ ذَلِكَ مِنْ حُسْنِ الْخُلُقِ الَّذِى حَضَّ الشَّرْعُ عَلَيْهِ حَضًّا بَالِغًا.\n\n     أَسْئِلَةٌ\n     (1) مَا حُكْمُ قَطِيعَةِ الرَّحِمِ وَمِنْ أَىِّ الْمَعَاصِى هِىَ.\n     (2) كَيْفَ تَحْصُلُ قَطِيعَةُ الرَّحِمِ.\n     (3) اذْكُرْ ءَايَةً فِى تَحْرِيمِ قَطِيعَةِ الرَّحِمِ.\n     (4) اذْكُرْ حَدِيثًا فِى تَحْرِيمِ قَطِيعَةِ الرَّحِمِ وَمَا مَعْنَاهُ.\n     (5) مَا الْمُرَادُ بِالرَّحِمِ.\n     (6) اذْكُرْ حَدِيثًا فِى فَضْلِ صِلَةِ الرَّحِمِ.\n     (7) كَيْفَ تَكُونُ الصِّلَةُ لِلرَّحِمِ كَامِلَةً.\n     (8) اذْكُرْ حَدِيثًا فِى بَيَانِ فَضْلِ الإِحْسَانِ إِلَى الْقَرِيبِ الَّذِى قَطَعَكَ.\n\n\nالدَّرْسُ الْحَادِى عَشَرَ\nاحْتِرَامُ الْمُؤْمِنِ\n\nخَلَقَ اللَّهُ الإِنْسَانَ فِى أَحْسَنِ تَقْوِيمٍ وَسَخَّرَ لَهُ مَا فِى السَّمَوَاتِ وَمَا فِى الأَرْضِ جَمِيعًا وَجَعَلَ لَهُ عَقْلًا وَلِسَانًا وَشَفَتَيْنِ وَعَيْنَيْنِ وَأُذُنَيْنِ لِيَسْتَعْمِلَ هَذِهِ الأَدَوَاتِ فِيمَا يُرْضِى اللَّهَ تَعَالَى، خَلَقَهُ لِيَقُومَ بِعِبَادَتِهِ وَلِيَسْتَعْمِلَ جَوَارِحَهُ فِى طَاعَتِهِ.\nقَالَ اللَّهُ تَعَالَى ﴿وَصَوَّرَكُمْ فَأَحْسَنَ صُوَرَكُمْ وَإِلَيْهِ الْمَصِيرُ﴾ [سُورَةَ التَّغَابُن/3]. \nوَجَعَلَ اللَّهُ لِلْمُؤْمِنِ مِيزَةً عَلَى غَيْرِهِ لِأَنَّهُ أَدَّى أَعْظَمَ حَقٍّ مِنْ حُقُوقِ اللَّهِ وَهُوَ تَوْحِيدُهُ تَعَالَى وَتَرْكُ الإِشْرَاكِ بِهِ شَيْئًا.\nفَالإِنْسَانُ الْمُؤْمِنُ لَهُ حُرْمَةٌ عَظِيمَةٌ عِنْدَ اللَّهِ تَعَالَى وَقَدْ حَثَّ الشَّرْعُ عَلَى احْتِرَامِهِ وَعَدَمِ تَحْقِيرِهِ وَجَعَلَ إِيذَاءَهُ مَعْصِيَةً يُعَاقَبُ عَلَيْهَا فَإِذَا اغْتَابَهُ شَخْصٌ وَلا عُذْرَ لَهُ ارْتَكَبَ مَعْصِيَةً مِنْ مَعَاصِى الِلسَّانِ، وَلَوْ ضَرَبَهُ بِغَيْرِ حَقٍّ ارْتَكَبَ مَعْصِيَةً مِنْ مَعَاصِى الْيَدَيْنِ وَهَكَذَا.\n   بَعْضُ أَبْوَابِ الْمَعَاصِى الَّتِى يَجِبُ تَجَنُّبُهَا\nمِنْ مَعَاصِى الْقَلْبِ التَّكَبُّرُ وَالْحِقدُ وَالْحَسَدُ.\nمِنْ مَعَاصِى الْعَيْنِ النَّظَرُ إلَى الْمُؤْمِنِ بِالِاسْتِحْقَارِ وَالِازْدِرَاءِ.\nمِنْ مَعَاصِي اللِّسَانِ الِاسْتِهْزَاءُ بالْمُؤْمِنِ أَىِ التَّحْقِيرُ لَهُ وَكَذَلِكَ كُلُّ كَلامٍ يُؤْذِى الْمُؤْمِنَ وَالضَّحِكُ عَلَيْهِ اسْتِحْقَارًا لَهُ بِمَا فِيهِ مِنَ الإِيذَاءِ قَالَ ﷺ «بِحَسْبِ امْرِءٍ مِنَ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ» رَوَاهُ مُسْلِمٌ.\nمِنْ مَعَاصِى الْيَدَيْنِ ضَرْبُ الْمُؤْمِنِ بِغَيْرِ حَقٍّ وَمِثْلُ الضَّرْبِ تَرْوِيعُ الْمُؤْمِنِ وَالإِشَارَةُ إِلَيْهِ بِنَحْوِ سِلاحٍ قَالَ ﷺ «مَنْ أَشَارَ إِلَى أَخِيهِ بِحَدِيدَةٍ فَإِنَّ الْمَلائِكَةَ تَلْعَنُهُ وَإِنْ كَانَ أَخَاهُ لِأَبِيهِ وَأُمِّهِ» رَوَاهُ ابْنُ حِبَّانَ.\nمِنْ مَعَاصِى الرِّجْلَيْنِ السِّعَايَةُ بِالْمُؤْمِنِ وَالْوِشَايَةُ بِهِ لِإِيذَائِهِ عِنْدَ الظَّلَمَةِ.\nمِنْ مَعَاصِى الْبَدَنِ مُحَاكَاةُ الْمُؤْمِنِ اسْتِهْزَاءً بِهِ إِنْ كَانَ ذَلِكَ بِالْقَوْلِ أَوِ الْفِعْلِ أَوِ الإِشَارَةِ قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا لا يَسْخَرْ قَوْمٌ مِّنْ قَوْمٍ﴾ [سُورَةَ الْحُجُرَات/11] وَقَدْ تَكُونُ الْمُحَاكَاةُ بِالضَّحِكِ عَلَى كَلامِهِ إِذَا تَخَبَّطَ فِيهِ أَوْ غَلِطَ أَوْ عَلَى صَنْعَتِهِ وَقُبْحِ صُورَتِهِ. فَيَنْبَغِى عَلَى الْمُؤْمِنِ أَنْ يُحِبَّ أَخَاهُ الْمُؤْمِنَ وَأَنْ يَعْطِفَ عَلَيْهِ وَيُعِينَهُ. \n   قَالَ النَّبِىُّ ﷺ «مَثَلُ الْمُؤْمِنِينَ فِى تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى» رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ.\n\n     أَسْئِلَةٌ\n     (1) مَا هُوَ أَعْظَمُ حَقٍّ مِنْ حُقُوقِ اللَّهِ عَلَى الإِنْسَانِ.\n     (2) اذْكُرْ بَعْضَ مَعَاصِى الْقَلْبِ.\n     (3) اذْكُرْ بَعْضَ مَعَاصِى الْعَيْنِ.\n     (4) اذْكُرْ بَعْضَ مَعَاصِى اللِّسَانِ.\n     (5) اذْكُرْ بَعْضَ مَعَاصِى الْيَدَيْنِ.\n     (6) اذْكُرْ بَعْضَ مَعَاصِى الرِّجْلَيْنِ.\n     (7) اذْكُرْ بَعْضَ مَعَاصِى الْبَدَنِ.\n     (8) اذْكُرْ حَدِيثًا فِى الْحَثِّ عَلَى مُعَامَلَةِ الْمُؤْمِنِينَ بِالإِحْسَانِ."}];

    const STORAGE = {
      favorites: "islamic_reader_favorites_v1",
      settings: "islamic_reader_settings_v1",
      lastSection: "islamic_reader_last_section_v1",
      positions: "islamic_reader_positions_v1"
    };

    const DEFAULT_SETTINGS = { theme:"light", font:"Cairo", size:20 };
    const FONT_MAP = {
      "Cairo": '"Cairo", sans-serif',
      "Tajawal": '"Tajawal", sans-serif',
      "Noto Kufi Arabic": '"Noto Kufi Arabic", sans-serif',
      "Amiri": '"Amiri", serif'
    };

    let appSettings = readJSON(STORAGE.settings, DEFAULT_SETTINGS);
    let favorites = new Set(readJSON(STORAGE.favorites, []));
    let currentSectionId = null;
    let currentHomeFilter = "all";
    let toastTimer = null;
    let scrollSaveTimer = null;

    const app = document.getElementById("app");
    const globalSearch = document.getElementById("globalSearch");
    const searchOverlay = document.getElementById("searchOverlay");
    const searchResults = document.getElementById("searchResults");
    const searchCount = document.getElementById("searchCount");
    const topProgress = document.getElementById("topProgress");
    const toTop = document.getElementById("toTop");

    function readJSON(key, fallback){
      try{
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      }catch(e){ return fallback; }
    }
    function writeJSON(key, value){
      try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
    }
    function escapeHTML(value=""){
      return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function stripDiacritics(text=""){
      return text.normalize("NFD")
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
        .replace(/[أإآ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه")
        .toLowerCase();
    }
    function normalizeSearch(text=""){
      return stripDiacritics(text).replace(/\s+/g," ").trim();
    }
    function sectionPlainText(section){
      const header = section.sourceHeader.join("\n");
      const body = section.blocks.map(block => {
        if(block.type === "p") return block.text;
        return block.rows.map(row => row.join("\t")).join("\n");
      }).join("\n");
      return [header, body].filter(Boolean).join("\n");
    }
    function getSection(id){ return SECTIONS.find(s => s.id === id); }

    function applySettings(){
      document.documentElement.dataset.theme = appSettings.theme;
      document.documentElement.style.setProperty("--reader-font", FONT_MAP[appSettings.font] || FONT_MAP.Cairo);
      document.documentElement.style.setProperty("--reader-size", `${appSettings.size}px`);
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if(metaTheme) metaTheme.setAttribute("content", appSettings.theme === "dark" ? "#17231e" : "#0f6b50");
    }
    function saveSettings(){
      writeJSON(STORAGE.settings, appSettings);
      applySettings();
    }
    applySettings();

    function routeTo(route){
      if(route === "home") location.hash = "#home";
      else if(route === "favorites") location.hash = "#favorites";
      else if(route === "settings") location.hash = "#settings";
      else if(route.startsWith("section=")) location.hash = `#${route}`;
    }
    function parseRoute(){
      const hash = location.hash.replace(/^#/,"");
      if(hash.startsWith("section=")) return {view:"section", id:hash.slice(8)};
      if(hash === "favorites") return {view:"favorites"};
      if(hash === "settings") return {view:"settings"};
      return {view:"home"};
    }
    function updateNav(view){
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.route === view);
      });
    }

    function cardHTML(section){
      const fav = favorites.has(section.id);
      return `
        <article class="section-card ripple" data-open-section="${section.id}" tabindex="0">
          <div class="card-top">
            <div class="book-icon" aria-hidden="true">📖</div>
            <button class="fav-mini ${fav ? "active":""}" data-fav="${section.id}" aria-label="${fav ? "إزالة من المفضلة":"إضافة إلى المفضلة"}">
              <i class="${fav ? "fa-solid":"fa-regular"} fa-bookmark"></i>
            </button>
          </div>
          <span class="part-badge">${escapeHTML(section.partName)}</span>
          <h3>${escapeHTML(section.title)}</h3>
          <p>${escapeHTML(section.description)}</p>
          <div class="card-meta">
            <span><i class="fa-regular fa-file-lines"></i>${section.paragraphCount} فقرة</span>
            <span><i class="fa-regular fa-clock"></i>${section.readingMinutes} د قراءة</span>
            <span><i class="fa-solid fa-font"></i>${section.wordCount} كلمة</span>
          </div>
        </article>`;
    }

    function renderHome(){
      currentSectionId = null;
      updateNav("home");
      topProgress.style.width = "0";
      const lastId = localStorage.getItem(STORAGE.lastSection);
      const last = lastId ? getSection(lastId) : null;
      const totalWords = SECTIONS.reduce((a,s)=>a+s.wordCount,0);
      const totalParas = SECTIONS.reduce((a,s)=>a+s.paragraphCount,0);

      const filterChips = ["all",1,2,3,4,5].map(v => {
        const label = v === "all" ? "جميع الأجزاء" : `الجزء ${["","الأول","الثاني","الثالث","الرابع","الخامس"][v]}`;
        return `<button class="chip ${String(currentHomeFilter)===String(v)?"active":""}" data-filter="${v}">${label}</button>`;
      }).join("");

      const groups = [1,2,3,4,5].map(part => {
        if(currentHomeFilter !== "all" && Number(currentHomeFilter) !== part) return "";
        const items = SECTIONS.filter(s=>s.partIndex===part);
        if(!items.length) return "";
        return `
          <section class="part-group">
            <div class="section-heading">
              <div>
                <h2>${escapeHTML(items[0].partName)}</h2>
                <p>${items.length} أقسام • ${items.reduce((a,s)=>a+s.paragraphCount,0)} فقرة</p>
              </div>
            </div>
            <div class="cards-grid">${items.map(cardHTML).join("")}</div>
          </section>`;
      }).join("");

      app.innerHTML = `
        <div class="view">
          <section class="hero">
            <span class="eyebrow"><i class="fa-solid fa-book-open"></i> مكتبة قراءة عربية</span>
            <h1>الثقافة الإسلامية</h1>
            <p>جُمعت الأجزاء المرفقة في واجهة واحدة، مع تقسيمها حسب الجزء والفصل، وأدوات تساعد على القراءة والبحث والحفظ والعودة إلى آخر موضع.</p>
            <div class="hero-stats">
              <span class="hero-stat"><b>${SECTIONS.length}</b> قسمًا</span>
              <span class="hero-stat"><b>${totalParas}</b> فقرة</span>
              <span class="hero-stat"><b>${totalWords.toLocaleString("ar")}</b> كلمة</span>
              <span class="hero-stat"><b>5</b> أجزاء</span>
            </div>
          </section>

          ${last ? `
          <section class="resume">
            <div class="resume-info">
              <div class="resume-icon"><i class="fa-solid fa-book-open-reader"></i></div>
              <div><strong>تابع القراءة</strong><small>${escapeHTML(last.partName)} • ${escapeHTML(last.title)}</small></div>
            </div>
            <button class="primary-btn ripple" data-open-section="${last.id}"><i class="fa-solid fa-arrow-left"></i> متابعة</button>
          </section>`:""}

          <div class="filter-row" aria-label="تصفية الأجزاء">${filterChips}</div>
          ${groups}
        </div>`;
    }

    function classifyParagraph(text){
      const clean = text.trim();
      const norm = stripDiacritics(clean);
      if(!clean) return "space";
      if(norm.startsWith("فصل ") || norm === "فصل" || norm === "الاخلاق الاسلاميه") return "chapter";
      if(norm.startsWith("الدرس ")) return "lesson";
      if(
        norm.startsWith("اسئله") || norm.startsWith("دعاء") || norm.startsWith("ذكر") ||
        norm.startsWith("تنبيه") || norm.startsWith("فائده") || norm.startsWith("مساله")
      ) return "subtitle";
      if(/^\s*[\(\[]?[0-9٠-٩]+[\)\].\-]/.test(clean)) return "list";
      return "p";
    }

    function renderBlocks(blocks){
      let out = "";
      let listOpen = false;
      const closeList = () => {
        if(listOpen){ out += "</ul>"; listOpen = false; }
      };

      for(const block of blocks){
        if(block.type === "table"){
          closeList();
          out += `<div class="table-wrap"><table class="source-table"><tbody>${
            block.rows.map(row => `<tr>${row.map(cell=>`<td>${escapeHTML(cell)}</td>`).join("")}</tr>`).join("")
          }</tbody></table></div>`;
          continue;
        }

        const cls = classifyParagraph(block.text);
        const safe = escapeHTML(block.text);

        if(cls === "list"){
          if(!listOpen){ out += '<ul class="source-list">'; listOpen = true; }
          out += `<li>${safe}</li>`;
          continue;
        }
        closeList();

        if(cls === "space") out += '<div class="source-space" aria-hidden="true"></div>';
        else if(cls === "chapter") out += `<h2 class="source-chapter">${safe}</h2>`;
        else if(cls === "lesson") out += `<h3 class="source-lesson">${safe}</h3>`;
        else if(cls === "subtitle") out += `<h4 class="source-subtitle">${safe}</h4>`;
        else out += `<p class="source-p">${safe}</p>`;
      }
      closeList();
      return out;
    }

    function renderSection(id){
      const section = getSection(id);
      if(!section){ routeTo("home"); return; }
      currentSectionId = id;
      updateNav("");
      localStorage.setItem(STORAGE.lastSection, id);
      const fav = favorites.has(id);

      app.innerHTML = `
        <div class="view reader-shell">
          <section class="reader-head">
            <div class="breadcrumb"><button data-route-link="home">الرئيسية</button><i class="fa-solid fa-chevron-left"></i><span>${escapeHTML(section.partName)}</span></div>
            <div class="source-lines">${section.sourceHeader.map(line=>`<span class="source-line">${escapeHTML(line)}</span>`).join("")}</div>
            <h1>${escapeHTML(section.title)}</h1>
            <div class="reader-stats">
              <span><i class="fa-solid fa-font"></i> ${section.wordCount} كلمة</span>
              <span><i class="fa-regular fa-clock"></i> نحو ${section.readingMinutes} دقيقة</span>
              <span><i class="fa-regular fa-file-lines"></i> ${section.paragraphCount} فقرة</span>
            </div>
          </section>

          <div class="reader-toolbar">
            <button class="tool-btn" data-action="copy"><i class="fa-regular fa-copy"></i><span>نسخ</span></button>
            <button class="tool-btn" data-action="share"><i class="fa-solid fa-share-nodes"></i><span>مشاركة</span></button>
            <button class="tool-btn ${fav?"active":""}" data-action="favorite"><i class="${fav?"fa-solid":"fa-regular"} fa-bookmark"></i><span>${fav?"محفوظ":"مفضلة"}</span></button>
            <span class="toolbar-sep"></span>
            <button class="tool-btn" data-action="font-plus" aria-label="تكبير الخط"><i class="fa-solid fa-plus"></i><span>تكبير</span></button>
            <span class="font-indicator" id="fontIndicator">${appSettings.size}px</span>
            <button class="tool-btn" data-action="font-minus" aria-label="تصغير الخط"><i class="fa-solid fa-minus"></i><span>تصغير</span></button>
          </div>

          <article class="reader-content" id="readerContent">${renderBlocks(section.blocks)}</article>
        </div>`;

      // استعادة موضع القراءة المحفوظ لهذا القسم
      const positions = readJSON(STORAGE.positions, {});
      const savedY = Number(positions[id] || 0);
      requestAnimationFrame(()=>setTimeout(()=>window.scrollTo({top:savedY,behavior:"auto"}),40));
      updateScrollUI();
    }

    function renderFavorites(){
      currentSectionId = null;
      updateNav("favorites");
      topProgress.style.width = "0";
      const items = SECTIONS.filter(s=>favorites.has(s.id));
      app.innerHTML = `
        <div class="view">
          <div class="page-title"><h1>المفضلة</h1><p>الأقسام التي حفظتها للعودة إليها بسرعة.</p></div>
          ${items.length ? `<div class="cards-grid">${items.map(cardHTML).join("")}</div>` : `
            <div class="empty-state">
              <i class="fa-regular fa-bookmark"></i>
              <h3>لا توجد أقسام محفوظة بعد</h3>
              <p>اضغط علامة الحفظ على أي قسم لإضافته إلى المفضلة.</p>
            </div>`}
        </div>`;
    }

    function renderSettings(){
      currentSectionId = null;
      updateNav("settings");
      topProgress.style.width = "0";
      app.innerHTML = `
        <div class="view">
          <div class="page-title"><h1>الإعدادات</h1><p>خصص مظهر التطبيق وتجربة القراءة.</p></div>
          <div class="settings-grid">
            <section class="settings-card">
              <h3>الوضع الليلي</h3>
              <p>التبديل بين المظهر النهاري والليلي.</p>
              <div class="setting-control">
                <strong>${appSettings.theme === "dark" ? "الوضع الليلي":"الوضع النهاري"}</strong>
                <button class="toggle ${appSettings.theme==="dark"?"on":""}" id="themeToggle" aria-label="تبديل الوضع"></button>
              </div>
            </section>

            <section class="settings-card">
              <h3>نوع الخط</h3>
              <p>اختر الخط الأنسب لقراءتك.</p>
              <div class="setting-control">
                <label for="fontSelect">الخط</label>
                <select id="fontSelect">
                  ${Object.keys(FONT_MAP).map(f=>`<option value="${f}" ${appSettings.font===f?"selected":""}>${f}</option>`).join("")}
                </select>
              </div>
            </section>

            <section class="settings-card">
              <h3>حجم الخط</h3>
              <p>يطبق على محتوى القراءة ويُحفظ تلقائيًا.</p>
              <div class="setting-control" style="align-items:center">
                <input id="fontRange" type="range" min="16" max="34" step="1" value="${appSettings.size}">
                <strong id="fontRangeValue">${appSettings.size}px</strong>
              </div>
            </section>

            <section class="settings-card">
              <h3>إعادة الضبط</h3>
              <p>إرجاع المظهر والخط والحجم إلى القيم الافتراضية.</p>
              <button class="secondary-btn" id="resetSettings"><i class="fa-solid fa-arrow-rotate-left"></i> إعادة ضبط الإعدادات</button>
            </section>
          </div>
        </div>`;

      document.getElementById("themeToggle").onclick = () => {
        appSettings.theme = appSettings.theme === "dark" ? "light":"dark";
        saveSettings(); renderSettings();
      };
      document.getElementById("fontSelect").onchange = e => {
        appSettings.font = e.target.value; saveSettings();
      };
      const range = document.getElementById("fontRange");
      range.oninput = e => {
        appSettings.size = Number(e.target.value);
        document.getElementById("fontRangeValue").textContent = `${appSettings.size}px`;
        saveSettings();
      };
      document.getElementById("resetSettings").onclick = () => {
        appSettings = {...DEFAULT_SETTINGS};
        saveSettings(); renderSettings(); showToast("تمت إعادة الإعدادات");
      };
    }

    function renderRoute(){
      const route = parseRoute();
      window.scrollTo({top:0,behavior:"auto"});
      if(route.view === "section") renderSection(route.id);
      else if(route.view === "favorites") renderFavorites();
      else if(route.view === "settings") renderSettings();
      else renderHome();
    }

    function toggleFavorite(id){
      const route = parseRoute();
      if(route.view === "section" && currentSectionId){
        const positions = readJSON(STORAGE.positions, {});
        positions[currentSectionId] = Math.max(0,Math.round(window.scrollY));
        writeJSON(STORAGE.positions, positions);
      }
      if(favorites.has(id)){ favorites.delete(id); showToast("تمت الإزالة من المفضلة"); }
      else{ favorites.add(id); showToast("تمت الإضافة إلى المفضلة"); }
      writeJSON(STORAGE.favorites, [...favorites]);
      if(route.view === "section") renderSection(id);
      else if(route.view === "favorites") renderFavorites();
      else renderHome();
    }

    async function copyCurrentSection(){
      const section = getSection(currentSectionId); if(!section) return;
      const text = sectionPlainText(section);
      try{
        await navigator.clipboard.writeText(text);
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
      }
      showToast("تم نسخ محتوى القسم");
    }

    async function shareCurrentSection(){
      const section = getSection(currentSectionId); if(!section) return;
      const text = sectionPlainText(section).slice(0,500);
      if(navigator.share){
        try{
          await navigator.share({title:`${section.partName} - ${section.title}`, text, url:location.href});
          return;
        }catch(e){
          if(e && e.name === "AbortError") return;
        }
      }
      try{ await navigator.clipboard.writeText(location.href); showToast("تم نسخ رابط القسم"); }
      catch(e){ showToast("المشاركة غير مدعومة في هذا المتصفح"); }
    }

    function changeFont(delta){
      appSettings.size = Math.max(16, Math.min(34, Number(appSettings.size)+delta));
      saveSettings();
      const el = document.getElementById("fontIndicator");
      if(el) el.textContent = `${appSettings.size}px`;
    }

    function showToast(message){
      const el = document.getElementById("toast");
      el.textContent = message; el.classList.add("show");
      clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
    }

    function performSearch(query){
      const q = normalizeSearch(query);
      if(!q){ closeSearch(); return; }
      const scored = SECTIONS.map(section => {
        const title = normalizeSearch(`${section.partName} ${section.title}`);
        const body = normalizeSearch(section.searchText);
        let score = 0;
        if(title.includes(q)) score += 5;
        if(body.includes(q)) score += 1;
        return {section, score};
      }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);

      searchCount.textContent = `${scored.length} نتيجة للبحث عن «${query}»`;
      searchResults.innerHTML = scored.length ? scored.map(({section})=>{
        const source = sectionPlainText(section).replace(/\s+/g," ").trim();
        let snippet = source.slice(0,210);
        const rawIndex = source.toLowerCase().indexOf(query.toLowerCase());
        if(rawIndex >= 0) snippet = source.slice(Math.max(0,rawIndex-65), rawIndex+145);
        return `
          <div class="search-result" data-search-open="${section.id}">
            <small>${escapeHTML(section.partName)}</small>
            <strong>${escapeHTML(section.title)}</strong>
            <p>${escapeHTML(snippet)}${snippet.length < source.length ? "…":""}</p>
          </div>`;
      }).join("") : `<div class="empty-state" style="border:0;box-shadow:none"><i class="fa-solid fa-magnifying-glass"></i><h3>لا توجد نتائج</h3><p>جرّب كلمة أو عبارة أخرى.</p></div>`;

      searchOverlay.classList.add("open");
      searchOverlay.setAttribute("aria-hidden","false");
    }
    function closeSearch(){
      searchOverlay.classList.remove("open");
      searchOverlay.setAttribute("aria-hidden","true");
    }

    function updateScrollUI(){
      const isReader = !!currentSectionId;
      const doc = document.documentElement;
      const max = Math.max(1, doc.scrollHeight - window.innerHeight);
      const progress = isReader ? Math.min(100,(window.scrollY/max)*100) : 0;
      topProgress.style.width = `${progress}%`;
      toTop.classList.toggle("show", window.scrollY > 500);

      if(isReader){
        clearTimeout(scrollSaveTimer);
        scrollSaveTimer = setTimeout(()=>{
          const positions = readJSON(STORAGE.positions, {});
          positions[currentSectionId] = Math.max(0,Math.round(window.scrollY));
          writeJSON(STORAGE.positions, positions);
        },180);
      }
    }

    // أحداث الواجهة
    document.addEventListener("click", e => {
      const nav = e.target.closest("[data-route]");
      if(nav){ routeTo(nav.dataset.route); return; }

      const routeLink = e.target.closest("[data-route-link]");
      if(routeLink){ routeTo(routeLink.dataset.routeLink); return; }

      const fav = e.target.closest("[data-fav]");
      if(fav){ e.stopPropagation(); toggleFavorite(fav.dataset.fav); return; }

      const open = e.target.closest("[data-open-section]");
      if(open){ routeTo(`section=${open.dataset.openSection}`); return; }

      const filter = e.target.closest("[data-filter]");
      if(filter){ currentHomeFilter = filter.dataset.filter; renderHome(); return; }

      const searchOpen = e.target.closest("[data-search-open]");
      if(searchOpen){
        closeSearch(); globalSearch.value="";
        routeTo(`section=${searchOpen.dataset.searchOpen}`); return;
      }

      const action = e.target.closest("[data-action]");
      if(action){
        const a = action.dataset.action;
        if(a==="copy") copyCurrentSection();
        else if(a==="share") shareCurrentSection();
        else if(a==="favorite") toggleFavorite(currentSectionId);
        else if(a==="font-plus") changeFont(1);
        else if(a==="font-minus") changeFont(-1);
      }
    });

    document.addEventListener("keydown", e => {
      const card = e.target.closest("[data-open-section]");
      if(card && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); routeTo(`section=${card.dataset.openSection}`); }
      if(e.key==="Escape") closeSearch();
    });

    // Ripple effect
    document.addEventListener("pointerdown", e => {
      const target = e.target.closest(".ripple");
      if(!target) return;
      const rect = target.getBoundingClientRect();
      const size = Math.max(rect.width,rect.height);
      const dot = document.createElement("span");
      dot.className = "ripple-dot";
      dot.style.width = dot.style.height = `${size}px`;
      dot.style.right = `${rect.right - e.clientX - size/2}px`;
      dot.style.top = `${e.clientY - rect.top - size/2}px`;
      target.appendChild(dot);
      setTimeout(()=>dot.remove(),600);
    });

    document.getElementById("brandHome").onclick = ()=>routeTo("home");
    document.getElementById("brandHome").onkeydown = e=>{ if(e.key==="Enter"||e.key===" ") routeTo("home"); };
    document.getElementById("closeSearch").onclick = closeSearch;
    searchOverlay.addEventListener("click",e=>{ if(e.target===searchOverlay) closeSearch(); });
    globalSearch.addEventListener("input",e=>performSearch(e.target.value));
    globalSearch.addEventListener("focus",e=>{ if(e.target.value.trim()) performSearch(e.target.value); });
    toTop.onclick = ()=>window.scrollTo({top:0,behavior:"smooth"});
    window.addEventListener("scroll", updateScrollUI,{passive:true});
    window.addEventListener("hashchange", renderRoute);

    if(!location.hash) location.hash="#home";
    else renderRoute();
  </script>
</body>
</html>

لِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِى مَرَضِهِ الَّذِى تُوُفِّىَ فِيهِ وَعَلَى رَأْسِهِ عِصَابَةٌ صَفْرَاءُ فَسَلَّمْتُ فَقَالَ يَا فَضْلُ فَقُلْتُ لَبَّيْكَ يَا رَسُولَ اللَّهِ قَالَ اشْدُدْ بِهَذِهِ الْعِصَابَةِ رَأْسِى قَالَ فَفَعَلْتُ ثُمَّ قَعَدَ فَوَضَعَ كَفَّهُ عَلَى مَنْكِبِى ثُمَّ قَامَ فَدَخَلَ الْمَسْجِدَ. وَفِى الْحَدِيثِ قِصَّةٌ. "]},{"id":"section-24","title":"بَابُ مَا جَاءَ فِى صِفَةِ أَكْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["137. أَنْبَأَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِىٍّ عَنْ سُفْيَانَ عَنْ سَعْدِ بنِ إِبْرَاهِيمَ عَنِ ابْنٍ لِكَعْبِ بنِ مَالِكٍ عَنْ أَبِيهِ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَلْعَقُ أَصَابِعَهُ ثَلاثًا. ","138. حَدَّثَنَا الْحَسَنُ بنُ عَلِىٍّ الْخَلَّالُ حَدَّثَنَا عَفَّانُ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ ثَابِتٍ عَنْ أَنَسٍ قَالَ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَكَلَ طَعَامًا لَعِقَ أَصَابِعَهُ الثَّلاثَ.","139. حَدَّثَنَا الْحُسَيْنُ بنُ عَلِىِّ بنِ يَزِيدَ الصُّدَائِىُّ حَدَّثَنَا يَعْقُوبُ بنُ إِسْحَاقَ يَعْنِى الْحَضْرَمِىَّ حَدَّثَنَا شُعْبَةُ عَنْ سُفْيَانَ الثَّوْرِىِّ عَنْ عَلِىِّ بنِ الأَقْمَرِ عَنْ أَبِى جُحَيْفَةَ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَمَّا أَنَا فَلا ءَاكُلُ مُتَّكِئًا.","140. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِىٍّ حَدَّثَنَا سُفْيَانُ عَنْ عَلِىِّ بنِ الأَقْمَرِ نَحْوَهُ. ","141. حَدَّثَنَا هَارُونُ بنُ إِسْحَاقَ الْهَمْدَانِىُّ حَدَّثَنَا عَبْدَةُ بنُ سُلَيْمَانَ عَنْ هِشَامِ بنِ عُرْوَةَ عَنِ ابْنٍ لِكَعْبِ بنِ مَالِكٍ عَنْ أَبِيهِ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْكُلُ بِأَصَابِعِهِ الثَّلاثِ وَيَلْعَقُهُنَّ. ","142. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا الْفَضْلُ بنُ دُكَيْن حَدَّثَنَا مُصْعَبُ بنُ سُلَيْمٍ قَالَ سَمِعْتُ أَنَسَ بنَ مَالِكٍ يَقُولُ أُتِىَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِتَمْرٍ فَرَأَيْتُهُ يَأْكُلُ وَهُوَ مُقْعٍ مِنَ الْجُوعِ. "]},{"id":"section-25","title":"بَابٌ فِى صِفَةِ خُبْزِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["143. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى وَمُحَمَّدُ بنُ بَشَّارٍ قَالا حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ أَبِى إِسْحَاقَ قَالَ سَمِعْتُ عَبْدَ الرَّحْمٰنِ بنَ يَزِيدَ يُحَدِّثُ عَنِ الأَسْوَدِ بنِ يَزِيدَ عَنْ عَائِشَةَ أَنَّهَا قَالَتْ مَا شَبِعَ ءَالُ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ خُبْزِ الشَّعِيرِ يَوْمَيْنِ مُتَتَابِعَيْنِ حَتَّى قُبِضَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.","144. حَدَّثَنَا عَبَّاسُ بنُ مُحَمَّدٍ الدُّورِىُّ حَدَّثَنَا يَحْيَى بنُ أَبِى بُكَيْرٍ حَدَّثَنَا حَرِيزُ بنُ عُثْمَانَ عَنْ سُلَيْمِ بنِ عَامِرٍ قَالَ سَمِعْتُ أَبَا أُمَامَةَ يَقُولُ مَا كَانَ يَفْضُلُ عَنِ أَهْلِ بَيْتِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خُبْزُ الشَّعِيرِ. ","145. حَدَّثَنَا عَبْدُ اللَّهِ بنُ مُعَاوِيَةَ الْجُمَحِىُّ حَدَّثَنَا ثَابِتُ بنُ يَزِيدَ عَنْ هِلالِ بنِ خَبَّابٍ عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَبِيتُ اللَّيَالِىَ الْمُتَتَابِعَةَ طَاوِيًا وَأَهْلُهُ لا يَجِدُونُ عَشَاءً وَكَانَ أَكْثَرُ خُبْزِهِمْ خُبْزَ الشَّعِيرِ. ","146. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا عُبَيْدُ اللَّهِ بنُ عَبْدِ الْمَجِيدِ الْحَنَفِىُّ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ عَبْدِ اللَّهِ بنِ دِينَارٍ حَدَّثَنَا أَبُو حَازِمٍ عَنْ سَهْلِ بنِ سَعْدٍ أَنَّهُ قِيلَ لَهُ أَكَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ النَّقِىَّ يَعْنِى الْحُوَّارَى فَقَالَ سَهْلٌ مَا رَأَى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ النَّقِىَّ حَتَّى لَقِىَ اللَّهَ عَزَّ وَجَلَّ فَقِيلَ لَهُ هَلْ كَانَتْ لَكُمْ مَنَاخِلُ عَلَى عَهْدِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ مَا كَانَتْ لَنَا مَنَاخِلُ قِيلَ كَيْفَ كُنْتُمْ تَصْنَعُونَ بِالشَّعِيرِ قَالَ كُنَّا نَنْفُخُهُ فَيَطِيرُ مِنْهُ مَا طَارَ ثُمَّ يُعْجَنُ. ","147. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُعَاذُ بنُ هِشَامٍ أَخْبَرَنِى أَبِى عَنْ يُونُسَ عَنْ قَتَادَةَ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ مَا أَكَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى خِوَانٍ وَلا فِى سُكُرُّجَةٍ وَلا خُبِزَ لَهُ مُرَقَّقٌ. قَالَ فَقُلْتُ لِقَتَادَةَ فَعَلَى مَا كَانُوا يَأْكُلُونَ قَالَ عَلَى هَذِهِ السُّفَرِ. قَالَ مُحَمَّدُ بنُ بَشَّارٍ يُونُسُ الَّذِي رَوَى عَنْ قَتَادَةَ هُوَ يُونُسُ الإِسْكَافُ. ","148. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا عَبَّادُ بنُ عَبَّادٍ الْمُهَلَّبِىُّ عَنْ مُجَالِدٍ عَنِ الشَّعْبِىِّ عَنْ مَسْرُوقٍ قَالَ دَخَلْتُ عَلَى عَائِشَةَ فَدَعَتْ لِى بِطَعَامٍ فَقَالَتْ مَا أَشْبَعُ مِنْ طَعَامٍ فَأَشَاءُ أَنْ أَبْكِىَ إِلَّا بَكَيْتُ قَالَ قُلْتُ لِمَ قَالَتْ أَذْكُرُ الْحَالَ الَّتِى فَارَقَ عَلَيْهَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ الدُّنْيَا وَاللَّهِ مَا شَبِعَ مِنْ خُبْزٍ وَلَحْمٍ مَرَّتَيْنِ فِى يَوْمٍ وَاحِدٍ. ","149. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ أَنْبَأَنَا شُعْبَةُ عَنْ أَبِى إِسْحَاقَ قَالَ سَمِعْتُ عَبْدَ الرَّحْمٰنِ بنَ يَزِيدَ يُحَدِّثُ عَنِ الأَسْوَدِ عَنْ عَائِشَةَ قَالَتْ مَا شَبِعَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ خُبْزِ شَعِيرٍ يَوْمَيْنِ مُتَتَابِعَيْنِ حَتَّى قُبِضَ. ","150. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا عَبْدُ اللَّهِ بنُ عَمْرٍو أَبُو مَعْمَرٍ حَدَّثَنَا عَبْدُ الْوَارِثِ عَنْ سَعِيدِ بنِ أَبِى عَرُوبَةَ عَنْ قَتَادَةَ عَنْ أَنَسٍ قَالَ مَا أَكَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى خِوَانٍ وَلا أَكَلَ خُبْزًا مُرَقَّقًا حَتَّى مَاتَ. "]},{"id":"section-26","title":"بَابُ صِفَةِ إِدَامِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَمَا أَكَلَ مِنَ الأَلْوَانِ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["151. حَدَّثَنَا مُحَمَّدُ بنُ سَهْلِ بنِ عَسْكَرٍ وَعَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ قَالا أَخْبَرَنَا يَحْيَى بنُ حَسَّانَ حَدَّثَنَا سُلَيْمَانُ بنُ بِلالٍ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ نِعْمَ الإِدَامُ الْخَلُّ. قَالَ عَبْدُ اللَّهِ فِى حَدِيثِهِ نِعْمَ الأُدْمُ أَوِ الإِدَامُ الْخَلُّ. ","152. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا أَبُو الأَحْوَصِ عَنْ سِمَاكِ بنِ حَرْبٍ قَالَ سَمِعْتُ النُّعْمَانَ بنَ بَشِيرٍ يَقُولُ أَلَسْتُمْ فِى طَعَامٍ وَشَرَابٍ مَا شِئِتُمْ لَقَدْ رَأَيْتُ نَبِيَّكُمْ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَمَا يَجِدُ مِنَ الدَّقَلِ مَا يَمْلأُ بَطْنَهُ. ","153. حَدَّثَنَا عَبْدَةُ بنُ عَبْدِ اللَّهِ الْخُزَاعِىُّ حَدَّثَنَا مُعَاوِيَةُ بنُ هِشَامٍ عَنْ سُفْيَانَ عَنْ مُحَارِبِ بنِ دِثَارٍ عَنْ جَابِرِ بنِ عَبْدِ اللَّهِ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نِعْمَ الإِدَامُ الْخَلُّ. ","154. حَدَّثَنَا هَنَّادٌ حَدَّثَنَا وَكِيعٌ عَنْ سُفْيَانَ عَنْ أَيُّوبَ عَنْ أَبِى قِلابَةَ عَنْ زَهْدَمٍ الْجَرْمِىِّ قَالَ كُنَّا عِنْدَ أَبِى مُوسَى الأَشْعَرِىِّ فَأُتِىَ بِلَحْمِ دَجَاجٍ فَتَنَحَّى رَجُلٌ مِنَ الْقَوْمِ فَقَالَ مَا لَكَ فَقَالَ إِنِّى رَأَيْتُهَا تَأْكُلُ نَتِنًا فَحَلَفْتُ أَنْ لا ءَاكُلَهَا قَالَ ادْنُ فَإِنِّى رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْكُلُ لَحْمَ الدَّجَاجِ. ","155. حَدَّثَنَا الْفَضْلُ بنُ سَهْلٍ الأَعْرَجُ الْبَغْدَادِىُّ حَدَّثَنَا إِبْرَاهِيمُ بنُ عَبْدِ الرَّحْمٰنِ بنِ مَهْدِىٍّ عَنْ إِبْرَاهِيمَ بنِ عُمَرَ بنِ سَفِينَةَ عَنْ أَبِيهِ عَنْ جَدِّهِ قَالَ أَكَلْتُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَحْمَ حُبَارَى. ","156. حَدَّثَنَا عَلِىُّ بنُ حُجْرٍ حَدَّثَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ عَنْ أَيُّوبَ عَنِ الْقَاسِمِ التَّمِيمِىِّ عَنْ زَهْدَمٍ الْجَرْمِىِّ قَالَ كُنَّا عِنْدَ أَبِى مُوسَى الأَشْعَرِىِّ قَالَ فَقُدِّمَ طَعَامُهُ وَقُدِّمَ فِى طَعَامِهِ لَحْمُ دَجَاجٍ وَفِى الْقَوْمِ رَجُلٌ مِنْ بَنِى تَيْمِ اللَّه أَحْمَرُ كَأَنَّهُ مَوْلى قَالَ فَلَمْ يَدْنُ فَقَالَ لَهُ أَبُو مُوسَى ادْنُ فَإِنِّى قَدْ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَكَلَ مِنْهُ قَالَ إِنِّى رَأَيْتُهُ يَأْكُلُ شَيْئًا فَقَذِرْتُهُ فَحَلَفْتُ أَنْ لا أَطْعَمَهُ أَبَدًا. ","157. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو أَحْمَدَ الزُّبَيْرِىُّ وَأَبُو نُعَيْمٍ قَالا حَدَّثَنَا سُفْيَانُ عَنْ عَبْدِ اللَّهِ بنِ عِيسَى عَنْ رَجُلٍ مِنْ أَهْلِ الشَّامِ يُقَالُ لَهُ عَطَاءٌ عَنْ أَبِى أَسِيدٍ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كُلُوا الزَّيْتَ وَادَّهِنُوا بِهِ فَإِنَّهُ مِنْ شَجَرَةٍ مُبَارَكَةٍ. ","158. حَدَّثَنَا يَحْيَى بنُ مُوسَى حَدَّثَنَا عَبْدُ الرَّزَّاقِ حَدَّثَنَا مَعْمَرٌ عَنْ زَيْدِ بنِ أَسْلَمَ عَنْ أَبِيهِ عَنْ عُمَرَ بنِ الْخَطَّابِ رَضِىَ اللَّهُ تَعَالَى عَنْهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كُلُوا الزَّيْتَ وَادَّهِنُوا بِهِ فَإِنَّهُ مِنْ شَجَرَةٍ مُبَارَكَةٍ. ","قَالَ أَبُو عِيسَى وَعَبْدُ الرَّزَّاقِ كَانَ يَضْطَرِبُ فِى هَذَا الْحَدِيثِ فَرُبَّمَا أَسْنَدَهُ وَرُبَّمَا أَرْسَلَهُ.","159. حَدَّثَنَا السِّنْجِىُّ وَهُوَ أَبُو دَاوُدَ سُلَيْمَانُ بنُ مَعْبَدٍ الْمَرْوَزِىُّ السِّنْجِىُّ حَدَّثَنَا عَبْدُ الرَّزَّاقِ عَنْ مَعْمَرٍ عَنْ زَيْدِ بنِ أَسْلَمَ عَنْ أَبِيهِ عَنِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَحْوَهُ وَلَمْ يَذْكُرْ فِيهِ عَنْ عُمَرَ. ","160. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ وَعَبْدُ الرَّحْمٰنِ بنُ مَهْدِىٍّ قَالا حَدَّثَنَا شُعْبَةُ عَنْ قَتَادَةَ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُعْجِبُهُ الدُّبَّاءُ فَأُتِىَ بِطَعَامٍ أَوْ دُعِىَ لَهُ فَجَعَلْتُ أَتَتَبَّعُهُ فَأَضَعُهُ بَيْنَ يَدَيْهِ لِمَا أَعْلَمُ أَنَّهُ يُحِبُّهُ. ","161. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا حَفْصُ بنُ غِيَاثٍ عَنْ إِسْمَاعِيلَ بنِ أَبِى خَالِدٍ عَنْ حَكِيمِ بنِ جَابِرٍ عَنْ أَبِيهِ قَالَ دَخَلْتُ عَلَى النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَرَأَيْتُ عِنْدَهُ دُبَّاءً يُقَطَّعُ فَقُلْتُ مَا هَذَا قَالَ نُكَثِّرُ بِهِ طَعَامَنَا.","قَالَ أَبُو عِيسَى وَجَابِرٌ هَذَا هُوَ جَابِرُ بنُ طَارِقٍ وَيُقَالُ ابْنُ أَبِى طَارِقٍ وَهُوَ رَجُلٌ مِنْ أَصْحَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلا نَعْرِفُ لَهُ إِلَّا هَذَا الْحَدِيثَ الْوَاحِدَ وَأَبُو خَالِدٍ اسْمُهُ سَعْدٌ. ","162. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ عَنْ مَالِكِ بنِ أَنَسٍ عَنِ إِسْحَاقَ بنِ عَبْدِ اللَّهِ بنِ أَبِى طَلْحَةَ أَنَّهُ سَمِعَ أَنَسَ بنَ مَالِكٍ يَقُولُ إِنَّ خَيَّاطًا دَعَا رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِطَعَامٍ صَنَعَهُ قَالَ أَنَسٌ فَذَهَبْتُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَى ذَلِكَ الطَّعَامِ فَقَرَّبَ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خُبْزًا مِنْ شَعِيرٍ وَمَرَقًا فِيهِ دُبَّاءٌ وَقَدِيدٌ قَالَ أَنَسٌ فَرَأَيْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَتَتَبَّعُ الدُّبَّاءَ حَوَالَىِ الصَّحْفَةِ فَلَمْ أَزَلْ أُحِبُّ الدُّبَّاءَ مِنْ يَوْمَئِذٍ. ","163. حَدَّثَنَا أَحْمَدُ بنُ إِبْرَاهِيمَ الدَّوْرَقِىُّ وَسَلَمَةُ بنُ شَبِيبٍ وَمَحْمُودُ بنُ غَيْلانَ قَالُوا حَدَّثَنَا أَبُو أُسَامَةَ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ قَالَتْ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُحِبُّ الْحَلْوَاءَ وَالْعَسَلَ. ","164. حَدَّثَنَا الْحَسَنُ بنُ مُحَمَّدٍ الزَّعْفَرَانِىُّ حَدَّثَنَا حَجَّاجُ بنُ مُحَمَّدٍ قَالَ قَالَ ابْنُ جُرَيْجٍ أَخْبَرَنِى مُحَمَّدُ بنُ يُوسُفَ أَنَّ عَطَاءَ بنَ يَسَارٍ أَخْبَرَهُ أَنَّ أُمَّ سَلَمَةَ أَخْبَرَتْهُ أَنَّهَا قَرَّبَتْ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ جَنْبًا مَشْوِيًّا فَأَكَلَ مِنْهُ ثُمَّ قَامَ إِلَى الصَّلاةِ وَمَا تَوَضَّأَ. ","165. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا ابْنُ لَهِيعَةَ عَنْ سُلَيْمَانَ بنِ زِيَادٍ عَنْ عَبْدِ اللَّهِ بنِ الْحَارِثِ قَالَ أَكَلْنَا مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شِوَاءً فِى الْمَسْجِدِ. ","166. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا وَكِيعٌ حَدَّثَنَا مِسْعَرٌ عَنْ أَبِى صَخْرَةَ جَامِعِ بنِ شَدَّادٍ عَنِ الْمُغِيرَةِ بنِ عَبْدِ اللَّهِ عَنِ الْمُغِيرَةِ ابْنِ شُعْبَةَ قَالَ ضِفْتُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ذَاتَ لَيْلَةٍ فَأُتِىَ بِجَنْبٍ مَشْوِىٍّ فَأَخَذَ الشَّفْرَةَ فَحَزَّ لِى بِهَا مِنْهُ قَالَ فَجَاءَ بِلالٌ يُؤْذِنُهُ بِالصَّلاةِ فَأَلْقَى الشَّفْرَةَ فَقَالَ مَالَهُ تَرِبَتْ يَدَاهُ قَالَ وَكَانَ شَارِبُهُ وَفَى فَقَالَ لَهُ أَقُصُّهُ لَكَ عَلَى سِوَاكٍ أَوْ قُصَّهُ عَلَى سِوَاكٍ. ","167. حَدَّثَنَا وَاصِلُ بنُ عَبْدِ الأَعْلَى حَدَّثَنَا مُحَمَّدُ بنُ الْفُضَيْلِ عَنْ أَبِى حَيَّانَ التَّيْمِىِّ عَنْ أَبِى زُرْعَةَ عَنْ أَبِى هُرَيْرَةَ قَالَ أُتِىَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِلَحْمٍ فَرُفِعَ إِلَيْهِ الذِّرَاعُ وَكَانَتْ تُعْجِبُهُ فَنَهَسَ مِنْهَا. ","168. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا أَبُو دَاوُدَ عَنْ زُهَيْرٍ عَنِ أَبِى إِسْحَاقَ عَنْ سَعْدِ بنِ عِيَاضٍ عَنِ ابْنِ مَسْعُودٍ قَالَ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُعْجِبُهُ الذِّرَاعُ قَالَ وَسُمَّ فِى الذِّرَاعِ وَكَانَ يَرَى أَنَّ الْيَهُودَ سَمُّوهُ. ","169. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُسْلِمُ بنُ إِبْرَاهِيمَ عَنْ أَبَانَ بنِ يَزِيدَ عَنْ قَتَادَةَ عَنْ شَهْرِ بنِ حَوْشَبٍ عَنْ أَبِى عُبَيْدٍ قَالَ طَبَخْتُ لِلنَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قِدْرًا وَكَانَ يُعْجِبُهُ الذِّرَاعُ فَنَاوَلْتُهُ الذِّرَاعَ ثُمَّ قَالَ نَاوِلْنِى الذِّرَاعَ فَنَاوَلْتُهُ ثُمَّ قَالَ نَاوِلْنِى الذِّرَاعَ فَقُلْتُ يَا رَسُولَ اللَّهِ وَكَمْ لِلشَّاةِ مِنْ ذِرَاعٍ فَقَالَ وَالَّذِى نَفْسِى بِيَدِهِ لَوْ سَكَتَّ لَنَاوَلْتَنِى الذِّرَاعَ مَا دَعَوْتُ. ","170. حَدَّثَنَا الْحَسَنُ بنُ مُحَمَّدٍ الزَّعْفَرَانِىُّ حَدَّثَنَا يَحْيَى بنُ عَبَّادٍ عَنْ فُلَيْحِ بنِ سُلَيْمَانَ قَالَ أَخْبَرَنِى رَجُلٌ مِنْ بَنِى عَبَّادٍ يُقَالَ لَهُ عَبْدُ الْوَهَّابِ بنُ يَحْيَى بنِ عَبَّادٍ عَنْ عَبْدِ اللَّهِ بنِ الزُّبَيْرِ عَنْ عَائِشَةَ رَضِىَ اللَّهُ عَنْهَا قَالَتْ مَا كَانَ الذِّرَاعُ أَحَبَّ اللَّحْمِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَكِنَّهُ كَانَ لا يَجِدُ اللَّحْمَ إِلَّا غِبًّا وَكَانَ يَعْجَلُ إِلَيْهَا لِأَنَّهَا أَعْجَلُهَا نُضْجًا. ","171. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو أَحْمَدَ حَدَّثَنَا مِسْعَرٌ قَالَ سَمِعْتُ شَيْخًا مِنْ فَهْمٍ قَالَ سَمِعْتُ عَبْدَ اللَّهِ بنَ جَعْفَرٍ يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ إِنَّ أَطْيَبَ اللَّحْمِ لَحْمُ الظَّهْرِ. ","172. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا زَيْدُ بنُ حُبَابٍ عَنْ عَبْدِ اللَّهِ بنِ مَؤَمَّلٍ عَنِ ابْنِ أَبِى مُلَيْكَةَ عَنْ عَائِشَةَ رَضِىَ اللَّهُ عَنْهَا أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ نِعْمَ الإِدَامُ الْخَلُّ. ","173. حَدَّثَنَا أَبُو كُرَيْبٍ حَدَّثَنَا أَبُو بَكْرِ بنُ عَيَّاشٍ عَنْ ثَابِتٍ أَبِى حَمْزَةَ الثُّمَالِىِّ عَنِ الشَّعْبِىِّ عَنْ أُمِّ هَانِئٍ قَالَتْ دَخَلَ عَلَىَّ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ أَعِنْدَكِ شَىْءٌ فَقُلْتُ لا إِلَّا خُبْزٌ يَابِسٌ وَخَلٌّ فَقَالَ هَاتِى مَا أَقْفَرَ بَيْتٌ مِنْ أُدْمٍ فِيهِ خَلٌّ. ","174. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ عَمْرِو بنِ مُرَّةَ عَنْ مُرَّةَ الْهَمْدَانِىِّ عَنْ أَبِى مُوسَى عَنِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ قَالَ فَضْلُ عَائِشَةَ عَلَى النِّسَاءِ كَفَضْلِ الثَّرِيدِ عَلَى سَائِرِ الطَّعَامِ. ","175. حَدَّثَنَا عَلِىُّ بنُ حُجْرٍ حَدَّثَنَا إِسْمَاعِيلُ بنُ جَعْفَرٍ حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ بنِ مَعْمَرٍ الأَنْصَارِىُّ أَبُو طُوَالَةَ أَنَّهُ سَمِعَ أَنَسَ بنَ مَالِكٍ يَقُولُ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَضْلُ عَائِشَةَ عَلَى النِّسَاءِ كَفَضْلِ الثَّرِيدِ عَلَى سَائِرِ الطَّعَامِ. ","176. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا عَبْدُ الْعَزِيزِ بنُ مُحَمَّدٍ عَنْ سُهَيْلِ بنِ أَبِى صَالِحٍ عَنْ أَبِيهِ عَنْ أَبِى هُرَيْرَةَ رَضِىَ اللَّهُ عَنْهُ أَنَّهُ رَأَى رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ تَوَضَّأَ مِنْ ثَوْرِ أَقِطٍ ثُمَّ رَءَاهُ أَكَلَ مِنْ كَتِفِ شَاةٍ ثُمَّ صَلَّى وَلَمْ يَتَوَضَّأْ. ","177. حَدَّثَنَا ابْنُ أَبِى عُمَرَ حَدَّثَنَا سُفْيَانُ بنُ عُيَيْنَةَ عَنْ وَائِلِ بنِ دَاوُدَ عَنِ ابْنِهِ وَهُوَ بَكْرُ بنُ وَائِلٍ عَنِ الزُّهْرِىِّ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ أَوْلَمَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى صَفِيَّةَ بِتَمْرٍ وَسَوِيقٍ. ","178. حَدَّثَنَا حُسَيْنُ بنُ مُحَمَّدٍ الْبَصْرِىُّ حَدَّثَنَا الْفُضَيْلُ بنُ سُلَيْمَانَ حَدَّثَنَا فَائِدٌ مَوْلَى عُبَيْدِ اللَّهِ بنِ عَلِىِّ بنِ أَبِى رَافِعٍ مَوْلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ حَدَّثَنِى عُبَيْدُ اللَّهِ بنُ عَلِىٍّ عَنْ جَدَّتِهِ سَلْمَى أَنَّ الْحَسَنَ بنَ عَلِىٍّ وَابْنَ عَبَّاسٍ وَابْنَ جَعْفَرٍ أَتَوْهَا فَقَالُوا لَهَا اصْنَعِى لَنَا طَعَامًا مِمَّا كَانَ يُعْجِبُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَيُحْسِنُ أَكْلَهُ فَقَالَتْ يَا بُنَىَّ لا تَشْتَهِيهِ الْيَوْمَ قَالَ بَلَى اصْنَعِيهِ لَنَا قَالَ فَقَامَتْ فَأَخَذَتْ شَيْئًا مِنْ شَعِيرٍ فَطَحَنَتْهُ ثُمَّ جَعَلَتْهُ فِى قِدْرٍ وَصَبَّتْ عَلَيْهِ شَيْئًا مِنْ زَيْتٍ وَدَقَّتِ الْفُلْفُلَ وَالتَّوَابِلَ فَقَرَّبَتْهُ إِلَيْهِمْ فَقَالَتْ هَذَا مِمَّا كَانَ يُعْجِبُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَيُحْسِنُ أَكْلَهُ. ","179. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو أَحْمَدَ حَدَّثَنَا سُفْيَانُ عَنِ الأَسْوَدِ بنِ قَيْسٍ عَنْ نُبَيْحٍ الْعَنَزِىِّ عَنْ جَابِرِ بنِ عَبْدِ اللَّهِ الأَنْصَارِىِّ قَالَ أَتَانَا النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِى مَنْزِلِنَا فَذَبَحْنَا لَهُ شَاةً فَقَالَ كَأَنَّهُمْ عَلِمُوا أَنَّا نُحِبُّ اللَّحْمَ. وَفِى الْحَدِيثِ قِصَّةٌ. ","180. حَدَّثَنَا ابْنُ أَبِى عُمَرَ حَدَّثَنَا سُفْيَانُ حَدَّثَنَا عَبْدُ اللَّهِ بنُ مُحَمَّدِ بنِ عَقِيلٍ أَنَّهُ َسَمِعَ جَابِرًا قَالَ سُفْيَانُ وَحَدَّثَنَا مُحَمَّدُ بنُ الْمُنْكَدِرِ عَنْ جَابِرٍ قَالَ خَرَجَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا مَعَهُ فَدَخَلَ عَلَى امْرَأَةٍ مِنَ الأَنْصَارِ فذَبَحَتْ لَهُ شَاةً فَأَكَلَ مِنْهَا وَأَتَتْهُ بِقِنَاعٍ مِنْ رُطَبٍ فَأَكَلَ مِنْهُ ثُمَّ تَوَضَّأَ لِلظُّهْرِ وَصَلَّى ثُمَّ انْصَرَفَ فَأَتَتْهُ بِعُلالَةٍ مِنْ عُلالَةِ الشَّاةِ فَأَكَلَ ثُمَّ صَلَّى الْعَصْرَ وَلَمْ يَتَوَضَّأْ. ","181. حَدَّثَنَا عَبَّاسُ بنُ مُحَمَّدٍ الدُّورِىُّ حَدَّثَنَا يُونُسُ بنُ مُحَمَّدٍ حَدَّثَنَا فُلَيْحُ بْنُ سُلَيْمَانَ عَنْ عُثْمَانَ بنِ عَبْدِ الرَّحْمٰنِ عَنْ يَعْقُوبَ بنِ أَبِى يَعْقُوبَ عَنْ أُمِّ الْمُنْذِرِ قَالَتْ دَخَلَ عَلَىَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَمَعَهُ عَلِىٌّ وَلَنَا دَوَالِى مُعَلَّقَةٌ قَالَتْ فَجَعَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْكُلُ وَعَلِىٌّ مَعَهُ يَأْكُلُ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِعَلِىٍّ مَهْ يَا عَلِىُّ فَإِنَّكَ نَاقِهٌ قَالَتْ فَجَلَسَ عَلِىٌّ وَالنَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْكُلُ قَالَتْ فَجَعَلْتُ لَهُمْ سِلْقًا وَشَعِيرًا فَقَالَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَا عَلِىُّ مِنْ هَذَا فَأَصِبْ فَإِنَّهُ أَوْفَقُ لَكَ. ","182. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا بِشْرُ بنُ السَّرِىِّ عَنْ سُفْيَانَ عَنْ طَلْحَةَ بنِ يَحْيَى عَنْ عَائِشَةَ بِنْتِ طَلْحَةَ عَنْ عَائِشَةَ أُمِّ الْمُؤْمِنِينَ رَضِىَ اللَّهُ عَنْهَا قَالَتْ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْتِينِى فَيَقُولُ أَعِنْدَكِ غَدَاءٌ فَأَقُولُ لا قَالَتْ فَيَقُولُ إِنِّى صَائِمٌ قَالَتْ فَأَتَانِى يَوْمًا فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّهُ أُهْدِيَتْ لَنَا هَدِيَّةٌ قَالَ وَمَا هِى قُلْتُ حَيْسٌ قَالَ أَمَا إِنِّى أَصْبَحْتُ صَائِمًا قَالَتْ ثُمَّ أَكَلَ. ","183. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا عُمَرُ بنُ حَفْصِ بنِ غِيَاثٍ حَدَّثَنَا أَبِى عَنْ مُحَمَّدِ بنِ أَبِى يَحْيَى الأَسْلَمِىِّ عَنْ يَزِيدَ ابْنِ أَبِى أُمَيَّةَ الأَعْوَرِ عَنْ يُوسُفَ بنِ عَبْدِ اللَّهِ بنِ سَلامٍ قَالَ رَأَيْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَخَذَ كِسْرَةً مِنْ خُبْزِ شَعِيرٍ فَوَضَعَ عَلَيْهَا تَمْرَةً وَقَالَ هَذِهِ إِدَامُ هَذِهِ وَأَكَلَ. ","184. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا سَعِيدُ بنُ سُلَيْمَانَ عَنْ عَبَّادِ بنِ الْعَوَّامِ عَنْ حُمَيْدٍ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُعْجِبُهُ الثُّفْلُ. قَالَ عَبْدُ اللَّهِ يَعْنِى مَا بَقِىَ مِنَ الطَّعَامِ. "]},{"id":"section-27","title":"بَابُ مَا جَاءَ فِى صِفَةِ وَضُوءِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عِنْدَ الطَّعَامِ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["185. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ عَنْ أَيُّوبَ عَنِ ابْنِ أَبِى مُلَيْكَةَ عَنِ ابْنِ عَبَّاسٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَرَجَ مِنَ الْخَلاءِ فَقُرِّبَ إِلَيْهِ طَعَامٌ فَقَالُوا أَلا نَأْتِيكَ بِوَضُوءٍ قَالَ إِنَّمَا أُمِرْتُ بِالْوُضُوءِ إِذَا قُمْتُ إِلَى الصَّلاةِ. ","186. حَدَّثَنَا سَعِيدُ بنُ عَبْدِ الرَّحْمٰنِ الْمَخْزُومِىُّ حَدَّثَنَا سُفْيَانُ بنُ عُيَيْنَةَ عَنْ عَمْرِو بنِ دِينَارٍ عَنْ سَعِيدِ بنِ الْحُوَيْرِثِ عَنِ ابْنِ عَبَّاسٍ قَالَ خَرَجَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنَ الْغَائِطِ فَأُتِىَ بِطَعَامٍ فَقِيلَ لَهُ أَلا تَوَضَّأْ فَقَالَ أَأُصَلِّى فَأَتَوَضَّأَ. ","187. حَدَّثَنَا يَحْيَى بنُ مُوسَى حَدَّثَنَا عَبْدُ اللَّهِ بنُ نُمَيْرٍ حَدَّثَنَا قَيْسُ بنُ الرَّبِيعِ (ح) وَحَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا عَبْدُ الْكَرِيمِ الْجُرْجَانِىُّ عَنْ قَيْسِ بنِ الرَّبِيعِ عَنْ أَبِى هَاشِمٍ عَنْ زَاذَانَ عَنْ سَلْمَانَ قَالَ قَرَأْتُ فِى التَّوْرَاةِ إِنَّ بَرَكَةَ الطَّعَامِ الْوُضُوءُ بَعْدَهُ فَذَكَرْتُ ذَلِكَ لِلنَّبِىِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَأَخْبَرْتُهُ بِمَا قَرَأْتُ فِى التَّوْرَاةِ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ بَرَكَةُ الطَّعَامِ الْوُضُوءُ قَبْلَهُ وَالْوُضُوءُ بَعْدَهُ. "]},{"id":"section-28","title":"بَابُ قَوْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عِنْدَ الطَّعَامِ وَبَعْدَ مَا يَفْرُغُ مِنْهُ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["188. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا ابْنُ لَهِيعَةَ عَنْ يَزِيدَ بنِ أَبِى حَبِيبٍ عَنْ رَاشِدٍ الْيَافِعِىِّ عَنْ حَبِيبِ بنِ أَوْسٍ عَنْ أَبِى أَيُّوبَ الأَنْصَارِىِّ قَالَ كُنَّا عِنْدَ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمًا فَقُرِّبَ إِلَيْهِ طَعَامٌ فَلَمْ أَرَ طَعَامًا كَانَ أَعْظَمَ بَرَكَةً مِنْهُ أَوَّلَ مَا أَكَلْنَا وَلا أَقَلَّ بَرَكَةً فِى ءَاخِرِهِ فَقُلْنَا يَا رَسُولَ اللَّهِ كَيْفَ هَذَا قَالَ إِنَّا ذَكَرْنَا اسْمَ اللَّهِ حِينَ أَكَلْنَا ثُمَّ قَعَدَ مَنْ أَكَلَ وَلَمْ يُسَمِّ اللَّهَ تَعَالَى فَأَكَلَ مَعَهُ الشَّيْطَانُ. ","189. حَدَّثَنَا يَحْيَى بنُ مُوسَى حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا هِشَامٌ الدَّسْتَوَائِىُّ عَنْ بُدَيْلٍ الْعُقَيْلِىِّ عَنْ عَبْدِ اللَّهِ بنِ عُبَيْدِ بنِ عُمَيْرٍ عَنْ أُمِّ كُلْثُومٍ عَنْ عَائِشَةَ قَالَتْ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَكَلَ أَحَدُكُمْ فَنَسِىَ أَنْ يَذْكُرَ اللَّه تَعَالَى عَلَى طَعَامِهِ فَلْيَقُلْ بِسْمِ اللَّهِ أَوَّلَهُ وَءَاخِرَهُ. ","190. حَدَّثَنَا عَبْدُ اللَّهِ بنُ الصَّبَّاحِ الْهَاشِمِىُّ الْبَصْرِىُّ حَدَّثَنَا عَبْدُ الأَعْلَى عَنْ مَعْمَرٍ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عُمَرَ بنِ أَبِى سَلَمَةَ أَنَّهُ دَخَلَ عَلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَعِنْدَهُ طَعَامٌ فَقَالَ ادْنُ يَا بُنَىَّ فَسَمِّ اللَّهَ تَعَالَى وَكُلْ بِيَمِينِكَ وَكُلْ مِمَّا يَلِيكَ. ","191. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو أَحْمَدَ الزُّبَيْرِىُّ حَدَّثَنَا سُفْيَانُ الثَّوْرِىُّ عَنْ أَبِى هَاشِمٍ عَنْ إِسْمَاعِيلَ بنِ رِيَاحٍ عَنْ رِيَاحِ ابْنِ عَبِيدَةَ عَنْ أَبِى سَعِيدٍ الْخُدْرِىِّ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا فَرَغَ مِنْ طَعَامِهِ قَالَ الْحَمْدُ لِلَّهِ الَّذِى أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ. ","192. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا يَحْيَى بنُ سَعِيدٍ حَدَّثَنَا ثَوْرُ بنُ يَزِيدَ حَدَّثَنَا خَالِدُ بنُ مَعْدَانَ عَنْ أَبِى أُمَامَةَ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا رُفِعَتِ الْمَائِدَةُ مِنْ بَيْنِ يَدَيْهِ يَقُولُ الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ غَيْرَ مُوَدَّعٍ وَلا مُسْتَغْنًى عَنْهُ رَبُّنَا. ","193. حَدَّثَنَا أَبُو بَكْرٍ مُحَمَّدُ بنُ أَبَانَ حَدَّثَنَا وَكِيعٌ حَدَّثَنَا هِشَامٌ الدَّسْتَوَائِىُّ عَنْ بُدَيْلِ بنِ مَيْسَرَةَ الْعُقَيْلِىِّ عَنْ عَبْدِ اللَّهِ بنِ عُبَيْدِ بنِ عُمَيْرٍ عَنْ أُمِّ كُلْثُومٍ عَنْ عَائِشَةَ قَالَتْ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْكُلُ طَعَامًا فِى سِتَّةٍ مِنْ أَصْحَابِهِ فَجَاءَ أَعْرَابِىٌّ فَأَكَلَهُ بِلُقْمَتَيْنِ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَوْ سَمَّى لَكَفَاكُمْ. ","194. حَدَّثَنَا هَنَّادٌ وَمَحْمُودُ بنُ غَيْلانَ قَالا حَدَّثَنَا أَبُو أُسَامَةَ عَنْ زَكَرِيَّا بنِ أَبِى زَائِدَةَ عَنْ سَعِيدِ بنِ أَبِى بُرْدَةَ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنَّ اللَّهَ لَيَرْضَى عَنِ الْعَبْدِ أَنْ يَأْكُلَ الأُكْلَةَ أَوْ يَشْرَبَ الشَّرْبَةَ فَيَحْمَدَهُ عَلَيْهَا. "]},{"id":"section-29","title":"بَابُ مَا جَاءَ فِى قَدَحِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["195. حَدَّثَنَا الْحُسَيْنُ بنُ الأَسْوَدِ الْبَغْدَادِىُّ حَدَّثَنَا عَمْرُو بنُ مُحَمَّدٍ حَدَّثَنَا عِيسَى بنُ طَهْمَانَ عَنْ ثَابِتٍ قَالَ أَخْرَجَ إِلَيْنَا أَنَسُ بنُ مَالِكٍ قَدَحَ خَشَبٍ غَلِيظٍ مُضَبَّبٍ بِحَدِيدٍ فَقَالَ يَا ثَابِتُ هَذَا قَدَحُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.","196. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا عَمْرُو بنُ عَاصِمٍ أَخْبَرَنَا حَمَّادُ بنُ سَلَمَةَ أَخْبَرَنَا حُمَيْدٌ وَثَابِتٌ عَنْ أَنَسٍ قَالَ لَقَدْ سَقَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِهَذَا الْقَدَحِ الشَّرَابَ كُلَّهُ الْمَاءَ وَالنَّبِيذَ وَالْعَسَلَ وَاللَّبَنَ. "]},{"id":"section-30","title":"بَابُ مَا جَاءَ فِى صِفَةِ فَاكِهَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["197. حَدَّثَنَا إِسْمَاعِيلُ بنُ مُوسَى الْفَزَارِىُّ حَدَّثَنَا إِبْرَاهِيمُ بنُ سَعْدٍ عَنْ أَبِيهِ عَنْ عَبْدِ اللَّهِ بنِ جَعْفَرٍ قَالَ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْكُلُ الْقِثَّاءَ بِالرُّطَبِ. ","198. حَدَّثَنَا عَبْدَةُ بنُ عَبْدِ اللَّهِ الْخُزَاعِىُّ الْبَصْرِىُّ حَدَّثَنَا مُعَاوِيَةُ بنُ هِشَامٍ عَنْ سُفْيَانَ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ رَضِىَ اللَّهُ عَنْهَا أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَأْكُلُ الْبِطِّيخَ بِالرُّطَبِ. ","199. حَدَّثَنَا إِبْرَاهِيمُ بنُ يَعْقُوبَ حَدَّثَنَا وَهْبُ بنُ جَرِيرٍ أَخْبَرَنَا أَبِى قَالَ سَمِعْتُ حُمَيْدًا يَقُولُ أَوْ قَالَ حَدَّثَنِى حُمَيْدٌ قَالَ وَهْبٌ وَكَانَ صَدِيقًا لَهُ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَجْمَعُ بَيْنَ الْخِرْبِزِ وَالرُّطَبِ. ","200. حَدَّثَنَا مُحَمَّدُ بنُ يَحْيَى حَدَّثَنَا مُحَمَّدُ بنُ عَبْدِ الْعَزِيزِ الرَّمْلِىُّ حَدَّثَنَا عَبْدُ اللَّه بنُ يَزِيدَ بنِ الصَّلْتِ عَنْ مُحَمَّدِ بنِ إِسْحَاقَ عَنْ يَزِيدَ بنِ رُومَانَ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِىَ اللَّهُ عَنْهَا أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَكَلَ الْبِطِّيخَ بِالرُّطَبِ.& ","201 ـ حَدَّثَنَا قُتَيْبَةُ عَنْ مَالِكِ بنِ أَنَسٍ (ح) وَحَدَّثَنَا إِسْحَاقُ بنُ مُوسَى حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ سُهَيْلِ ابْنِ أَبِي صَالِحٍ عَنْ أَبِيهِ عَنْ أَبِي هُرَيْرَةَ قَالَ كَانَ النَّاسُ إِذَا رَأَوْا أَوَّلَ الثَّمَرِ جَاؤُوا بِهِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَإِذَا أَخَذَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ اللَّهُمَّ بَارِكْ لَنَا فِي ثِمَارِنَا وَبَارِكْ لَنَا فِي مَدِينَتِنَا وَبَارِكْ لَنَا فِي صَاعِنَا وَفِي مُدِّنَا اللَّهُمَّ إِنَّ إِبْرَاهِيمَ عَبْدُكَ وَخَلِيلُكَ وَنَبِيُّكَ وَإِنِّي عَبْدُكَ وَنَبِيُّكَ وَإِنَّهُ دَعَاكَ لِمَكَّةَ وَأَنَا أَدْعُوكَ لِلْمَدِينَةِ بِمِثْلِ مَا دَعَاكَ بِهِ لِمَكَّةَ وَمِثْلِهِ مَعَهُ قَالَ ثُمَّ يَدْعُو أَصْغَرَ وَلِيدٍ يَرَاهُ فَيُعْطِيهِ ذَلِكَ الثَّمَرَ.  ","202 ـ حَدَّثَنَا مُحَمَّدُ بنُ حُمَيْدٍ الرَّازِيُّ أَنْبَأَنَا إِبْرَاهِيمُ بنُ الْمُخْتَارِ عَنْ مُحَمَّدِ بنِ إِسْحَاقَ عَنْ أَبِي عُبَيْدَةَ بنِ مُحَمَّدِ ابْنِ عَمَّارِ بنِ يَاسِرٍ عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذِ بنِ عَفْرَاءَ قَالَتْ بَعَثَنِي مُعَاذٌ بِقِنَاعٍ مِنْ رُطَبٍ وَعَلَيْهِ أَجْرٍ مِنْ قِثَّاءٍ زُغْبٍ وَكَانَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُحِبُّ الْقِثَّاءَ فَأَتَيْتُهُ بِهِمَا وَعِنْدَهُ حِلْيَةٌ قَدْ قَدِمَتْ عَلَيْهِ مِنَ الْبَحْرَيْنِ فَمَلأَ يَدَهُ مِنْهَا فَأَعْطَانِيهِ.","203 ـ حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ أَخْبَرَنَا شَرِيكٌ عَنْ عَبْدِ اللَّهِ بنِ مُحَمَّدِ بنِ عَقِيلٍ عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذٍ قَالَتْ أَتيتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِقِنَاعٍ مِنْ رُطَبٍ وَأَجْرٍ زُغْبٍ فَأَعْطَانِي مِلْءَ كَفِّهِ حُلِيًّا أَوْ قَالَتْ ذَهَبًا."]},{"id":"section-31","title":"بَابُ صِفَةِ شَرَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["204 ـ حَدَّثَنَا ابْنُ أَبِي عُمَرَ حَدَّثَنَا سُفْيَانُ عَنْ مَعْمَرٍ عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عنْهَا قَالَتْ  كَانَ أَحَبُّ الشَّرَابِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْحُلْوَ الْبَارِدَ.  ","205 ـ حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ حَدَّثَنَا عَلِيُّ بنُ زَيْدٍ عَنْ عُمَرَ هُوَ ابْنُ أَبِي حَرْمَلَةَ عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ دَخَلْتُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَا وَخَالِدُ بنُ الْوَلِيدِ عَلَى مَيْمُونَةَ فَجَاءَتْنَا بِإِنَاءٍ مِنْ لَبَنٍ فَشَرِبَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا عَلَى يَمِينِهِ وَخَالِدٌ عَنْ شِمَالِهِ فَقَالَ لِي الشَّرْبَةُ لَكَ فَإِنْ شِئْتَ ءَاثَرْتَ بِهَا خَالِدًا فَقُلْتُ مَا كُنْتُ لِأُوثِرَ عَلَى سُؤْرِكَ أَحدًا ثُمَّ قَالَ رَسولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَنْ أَطْعَمَهُ اللَّهُ طَعَامًا فَلْيَقُل اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَأَطْعِمْنَا خَيْرًا مِنْهُ وَمَنْ سَقَاهُ اللَّهُ عَزَّ وَجَلَّ لَبَنًا فَلْيَقُل اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَزِدْنَا مِنْهُ ثُمَّ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَيْسَ شَىْءٌ يُجْزِئُ مَكَانَ الطَّعَامِ وَالشَّرَابِ غَيْرَ اللَّبَنِ.","قَالَ أَبُو عِيسَى هَكَذَا رُوِيَ عَنْ سُفيَانَ بنِ عُيَيْنَةَ هَذَا الحَدِيثُ عَنْ مَعْمَرٍ عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا وَرَوَاهُ عَبْدُ اللَّهِ بنُ الْمُبَارَكِ وَعَبدُ الرَّزَّاقِ وَغَيْرُ وَاحِدٍ عَنْ مَعْمَرٍ عَنِ الزُّهْرِيِّ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُرْسَلًا وَلَم يَذْكُرُوا فِيهِ عَنْ عُرْوَةَ عَن عائِشَةَ. وَهَكَذَا رَوَى يُونُسُ وَغَيرُ وَاحِدٍ عَنِ الزُّهْرِيِّ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُرْسَلًا. قَالَ أَبُو عِيسَى إِنَّمَا أَسْنَدَهُ ابْنُ عُيَيْنَةَ مِنْ بَيْنِ النَّاسِ. قَالَ أَبُو عِيسَى وَمَيْمُونَةُ بِنْتُ الْحَارِثِ زَوْجِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هيَ خَالَةُ خالدِ بنِ الوَلِيدِ وَخَالَةُ ابْنِ عَبَّاسٍ وَخَالَةُ يَزِيدَ بنِ الأَصَمِّ رَضِيَ اللَّهُ عَنْهُمْ. وَاخْتَلَفَ النَّاسُ فِي رِوَايَةِ هَذَا الحَديثِ عَنْ عَلِيِّ بنِ زَيْدِ بنِ جُدْعَانَ فَرَوَى بَعْضُهُمْ عَنْ عَلِيّ ابْنِ زَيْدٍ عَنْ عُمَرَ بنِ أَبي حَرْمَلَةَ وَرَوَى شُعْبَةُ عَنْ عَلِيِّ بنِ زَيْدٍ فَقَالَ عَنْ عَمْرِو بنِ حَرْمَلَةَ وَالصَّحِيحُ ابْنُ أَبِي حَرْمَلَةَ."]},{"id":"section-32","title":"بَابُ مَا جَاءَ فِي صِفَةِ شُرْبِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["206 ـ حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا هُشَيْمٌ أَخْبَرَنَا عَاصِمٌ الأَحْوَلُ وَمُغِيرَةُ عَنِ الشَّعْبِيِّ عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَرِبَ مِنْ زَمْزَمَ وَهُوَ قَائِمٌ.","207 ـ حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ عَنْ حُسَيْنٍ الْمُعَلِّمِ عَنْ عَمْرِو بنِ شُعَيْبٍ عَنْ أَبِيهِ عَنْ جَدِّهِ قَالَ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَشْرَبُ قَائِمًا وَقَاعِدًا.","208 ـ حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ قَالَ أَخْبَرَنَا ابْنُ الْمُبَارَكِ عَنْ عَاصِمٍ الأَحْوَلِ عَنِ الشَّعْبِيِّ عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ سَقَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ زَمْزَمَ فَشَرِبَ وَهُوَ قَائِمٌ.","209 ـ حَدَّثَنَا أَبُو كُرَيْبٍ مُحَمَّدُ بنُ الْعَلاءِ وَمُحَمَّدُ بنُ طَرِيفٍ الْكُوفِيُّ قَالا حَدَّثَنَا ابْنُ فُضَيْلٍ عَنِ الأَعْمَشِ عَنْ عَبْدِ الْمَلِكِ بنِ مَيْسَرَةَ عَنِ النَّزَّالِ بنِ سَبْرَةَ قَالَ أُتِيَ عَلِيٌّ رَضِيَ اللَّهُ عَنْهُ بِكُوزٍ مِنْ مَاءٍ وَهُوَ فِي الرَّحْبَةِ فَأَخَذَ مِنْهُ كَفًّا فَغَسَلَ يَدَيْهِ وَمَضْمَضَ وَاسْتَنْشَقَ وَمَسَحَ وَجْهَهُ وَذِرَاعَيْهِ وَرَأْسَهُ ثُمَّ شَرِبَ مِنْهُ وَهُوَ قَائِمٌ ثُمَّ قَالَ هَذَا وُضُوءُ مَنْ لَمْ يُحْدِثْ هَكَذَا رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَعَلَ.","210 ـ حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ وَيُوسُفُ بنُ حَمَّادٍ قَالا حَدَّثَنَا عَبْدُ الْوَارِثِ بنُ سَعِيدٍ عَنْ أَبِي عِصَامٍ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَتَنَفَّسُ فِي الإِنَاءِ ثَلاثًا إِذَا شَرِبَ وَيَقُولُ هُوَ أَمْرَأُ وَأَرْوَى.","211 ـ حَدَّثَنَا عَلِيُّ بنُ خَشْرَمٍ حَدَّثَنَا عِيسَى بنُ يُونُسَ عَنْ رِشْدِينِ بنِ كُرَيْبٍ عَنْ أَبِيهِ عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِذَا شَرِبَ تَنَفَّسَ مَرَّتَيْنِ.","212 ـ حَدَّثَنَا ابْنُ أَبِي عُمَرَ حَدَّثَنَا سُفْيَانُ عَنْ يَزِيدَ بنِ يَزِيدَ بنِ جَابِرٍ عَنْ عَبْدِ الرَّحْمٰنِ بنِ أَبِي عَمْرَةَ عَنْ جَدَّتِهِ كَبْشَةَ قَالَتْ دَخَلَ عَلَيَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَشَرِبَ مِنْ فِي قِرْبَةٍ مُعَلَّقَةٍ قَائِمًا فَقُمْتُ إِلَى فِيهَا فَقَطَعْتُهُ.","213 ـ حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ حَدَّثَنَا عَزْرَةُ بنُ ثَابِتٍ الأَنْصَارِيُّ عَنْ ثُمَامَةَ بنِ عَبْدِ اللهِ قَالَ كَانَ أَنَسُ بنُ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ يَتَنَفَّسُ فِي الإِنَاءِ ثَلاثًا وَزَعَمَ أَنَسٌ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَتَنَفَّسُ فِي الإِنَاءِ ثَلاثًا.","214 ـ حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخبَرَنَا أَبُو عَاصِمٍ عَنِ ابْنِ جُرَيْجٍ عَنْ عَبْدِ الْكَرِيمِ عَنِ الْبَرَاءِ بنِ زَيْدٍ ابْنِ ابْنَةِ أَنَسِ بنِ مَالِكٍ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ وَقِرْبَةٌ مُعَلَّقَةٌ فَشَرِبَ مِنْ فَمِ الْقِرْبَةِ وَهُوَ قَائِمٌ فَقَامَتْ أُمُّ سُلَيْمٍ إِلَى رَأْسِ الْقِرْبَةِ فَقَطَعَتْهَا.","215 ـ حَدَّثَنَا أَحْمَدُ بنُ نَصْرٍ النَّيْسَابُورِيُّ حَدَّثَنَا إِسْحَاقُ بنُ مُحَمَّدٍ الْفَرْوِيُّ حَدَّثَتْنَا عُبَيْدَةُ بِنْتُ نَائِلٍ عَنْ عَائِشَةَ بِنْتِ سَعْدِ بنِ أَبِي وَقَّاصٍ عَنِ أَبِيهَا أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَشْرَبُ قَائِمًا.","وَقَالَ بَعْضُهُمْ عَبِيدَةُ بِنْتُ نَائِلٍ. "]},{"id":"section-33","title":"بَابُ مَا جَاءَ فِي تَعَطُّرِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["216 ـ حَدَّثَنَا مُحَمَّدُ بنُ رَافِعٍ وَغَيْرُ وَاحِدٍ قَالُوا حَدَّثَنَا أَبُو أَحْمَدَ الزُّبَيْرِيُّ حَدَّثَنَا شَيْبَانُ عَنْ عَبْدِ اللَّهِ بنِ الْمُخْتَارِ عَنْ مُوسَى بنِ أَنَسِ بنِ مَالِكٍ عَنْ أَبِيهِ قَالَ كَانَت لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ سُكَّةٌ يَتَطَيَّبُ مِنْهَا.","217 ـ حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ حَدَّثَنَا عَزْرَةُ بنُ ثَابِتٍ عَنْ ثُمَامَةَ بنِ عَبْدِ اللَّهِ قَالَ كَانَ أَنَسُ بنُ مَالِكٍ لا يَرُدُّ الطِّيبَ وَقَالَ أَنَسٌ إِنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ لا يَرُدُّ الطِّيبَ.","218 ـ حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا ابْنُ أَبِي فُدَيْكٍ عَنْ عَبْدِ اللَّهِ بنِ مُسْلِمِ بنِ جُنْدُبٍ عَنْ أَبِيهِ عَنِ ابْنِ عُمَرَ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ثَلاثٌ لا تُرَدُّ الْوَسَائِدُ وَالدُّهْنُ وَاللَّبَنُ.","219 ـ حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ الْحَفَرِيُّ عَنْ سُفْيَانَ عَنِ الْجُرَيْرِيِّ عَنْ أَبِي نَضْرَةَ عَنْ رَجُلٍ هُوَ الطُّفَاوِيُّ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ طِيبُ الرِّجَالِ مَا ظَهَرَ رِيحُهُ وَخَفِيَ لَوْنُهُ وَطِيبُ النِّسَاءِ مَا ظَهَرَ لَوْنُهُ وَخَفِيَ رِيحُهُ.","220 ـ حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ أَخبَرَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ عَنِ الْجُرَيْرِيِّ عَنْ أَبِي نَضْرَةَ عَنِ الطُّفَاوِيِّ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِثْلَهُ بِمَعْنَاهُ.","221 ـ حَدَّثَنَا مُحَمَّدُ بنُ خَلِيفَةَ وَعَمْرُو بنُ عَلِيٍّ قَالا حَدَّثَنَا يَزِيدُ بنُ زُرَيْعٍ حَدَّثَنَا حَجَّاجٌ الصَّوَّافُ عَنْ حَنَانٍ عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أُعْطِيَ أَحَدُكُمُ الرَّيْحَانَ فَلا يَرُدَّهُ فَإِنَّهُ خَرَجَ مِنَ الْجَنَّةِ.","قَالَ أَبُو عِيسَى لا يُعْرَفُ لِحَنَانٍ غَيرُ هَذَا الْحَدِيثِ. وَقَالَ عَبدُ الرَّحْمٰنِ بنُ أَبِي حَاتِمٍ فِي كِتَابِ الْجَرْحِ وَالتَّعْدِيلِ حَنَانٌ الأَسَدِيُّ مِنْ بَنِي أَسَدِ بنِ شُرَيْكٍ وَهُوَ حَنَانٌ صَاحِبُ الرَّقِيقِ عَمُّ وَالِدِ مُسَدَّدٍ رَوَى عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ رَوَى عَنْهُ الحَجَّاجُ بنُ أَبِي عُثْمَانَ الصَّوَّافُ سَمِعْتُ أَبِي يَقُولُ ذَلِكَ.","222 ـ حَدَّثَنَا عُمَرُ بنُ إِسمَاعِيلَ بنِ مُجَالِدِ بنِ سَعِيْدٍ الهَمْدَانِيُّ البَغدَادِيُّ حَدَّثَنَا أَبِي عَنْ بَيَانٍ عَنْ قَيْسِ بنِ أَبِي حَازِمٍ عَنْ جَرِيرِ بنِ عَبْدِ اللَّهِ قَالَ عُرِضْتُ بَيْنَ يَدَيْ عُمَرَ بنِ الخَطَّابِ رَضِيَ اللَّهُ عَنْهُ فَأَلْقَى جَرِيْرٌ رِدَاءَهُ وَمَشَى فِي إِزَارٍ فَقَالَ لَهُ خُذْ رِدَاءَكَ فَقَالَ عُمَرُ لِلْقَوْمِ مَا رَأَيْتُ رَجُلًا أَحْسَنَ مِنْ صُورَةِ جَرِيرٍ إِلَّا مَا بَلَغَنَا مِنْ صُورَةِ يُوسُفَ الصِّدِّيقِ عَلَيْهِ السَّلَامُ."]},{"id":"section-34","title":"بَابُ كَيْفَ كَانَ كَلامُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["223 ـ حَدَّثَنَا حُمَيْدُ بنُ مَسْعَدَةَ الْبَصْرِيُّ حَدَّثَنَا حُمَيْدُ بنُ الأَسْوَدِ عَنْ أُسَامَةَ بنِ زَيْدٍ عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا قَالَتْ مَا كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَسْرُدُ سَرْدَكُمْ هَذَا وَلَكِنَّهُ كَانَ يَتَكَلَّمُ بِكَلامٍ يُبَيِّنُهُ فَصْلٍ يَحْفَظُهُ مَنْ جَلَسَ إِلَيْهِ.  ","224 ـ حَدَّثَنَا مُحَمَّدُ بنُ يَحْيَى حَدَّثَنَا أَبُو قُتَيْبَةَ سَلْمُ بنُ قُتَيْبَةَ عَنْ عَبْدِ اللَّهِ بنِ الْمُثَنَّى عَنْ ثُمَامَةَ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُعِيدُ الْكَلِمَةَ ثَلاثًا لِتُعْقَلَ عَنْهُ.","225 ـ حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا جُمَيْعُ بنُ عُمَرَ بنِ عَبْدِ الرَّحْمٰنِ الْعِجْلِيُّ قَالَ حدَّثَنَا رَجُلٌ مِنْ بَنِي تَمِيمٍ مِنْ وَلَدِ أَبِي هَالَةَ زَوْجِ خَدِيجَةَ يُكْنَى أَبَا عَبْدِ اللَّهِ عَنِ ابْنٍ لِأَبِي هَالَةَ عَنِ الْحَسَنِ بنِ عَلِيٍّ رَضِيَ اللَّهُ تَعَالَى عَنْهُمَا قَالَ سَأَلْتُ خَالِي هِنْدَ بنَ أَبِي هَالَةَ وَكَانَ وَصَّافًا فَقُلْتُ صِفْ لِي مَنْطِقَ رَسُولِ اللهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُتَوَاصِلَ الأَحْزَانِ دَائِمَ الْفِكْرَةِ لَيْسَتْ لَهُ رَاحَةٌ طَوِيلُ السَّكْتِ لا يَتَكَلَّمُ فِي غَيْرِ حَاجَةٍ يَفْتَتِحُ الْكَلامَ وَيَخْتِمُهُ بِأَشْدَاقِهِ وَيَتَكَلَّمُ بِجَوَامِعِ الْكَلِمِ فَصْلٌ لا فُضُولٌ وَلا تَقْصِيرٌ لَيْسَ بِالْجَافِي وَلا بِالْمَهِينِ يُعَظِّمُ النِّعْمَةَ وَإِنْ دَقَّتْ لا يَذُمُّ مِنْهَا شَيْئًا غَيْرَ أَنَّهُ لَمْ يَكُنْ يَذُمُّ ذَوَاقًا وَلا يَمْدَحُهُ وَلا تُغْضِبُهُ الدُّنْيَا وَمَا كَانَ لَهَا فَإِذَا تُعُدِّيَ الْحَقُّ لَمْ يَقُمْ لِغَضَبِهِ شَىْءٌ حَتَّى يَنْتَصِرَ لَهُ وَلا يَغْضَبُ لِنَفْسِهِ وَلا يَنْتَصِرُ لَهَا إِذَا أَشَارَ بِكَفِّهِ كُلِّهَا وَإِذَا تَعَجَّبَ قَلَبَهَا وَإِذَا تَحَدَّثَ اتَّصَلَ بِهَا وَضَرَبَ بِرَاحَتِهِ الْيُمْنَى بَطْنَ إِبْهَامِهِ الْيُسْرَى وَإِذَا غَضِبَ أَعْرَضَ وَأَشَاحَ جُلُّ ضَحِكِهِ التَّبَسُّمُ."]},{"id":"section-35","title":"بَابُ مَا جَاءَ فِي ضَحِكِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["226 ـ حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا عَبَّادُ بنُ الْعَوَّامِ حَدَّثَنَا الْحَجَّاجُ وَهُوَ ابْنُ أَرْطَاةَ عَنْ سِمَاكِ بنِ حَرْبٍ عَنْ جَابِرِ ابْنِ سَمُرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ كَانَ فِي سَاقَيْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حُمُوشَةٌ وَكَانَ لا يَضْحَكُ إِلَّا تَبَسُّمًا فَكُنْتُ إِذَا نَظَرْتُ إِلَيْهِ قُلْتُ أَكْحَلُ الْعَيْنَيْنِ وَلَيْسَ بِأَكْحَلَ.","227 ـ حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا ابْنُ لَهِيعَةَ عَنْ عُبَيْدِ اللَّهِ بنِ الْمُغِيرَةِ عَنْ عَبْدِ اللَّهِ بنِ الْحَارِثِ بنِ جَزْءٍ رَضِيَ اللَّهُ عَنْهُ أَنَّهُ قَالَ مَا رَأَيْتُ أَحَدًا أَكْثَرَ تَبَسُّمًا مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.","228 ـ حَدَّثَنَا أَحْمَدُ بنُ خَالِدٍ الْخَلَّالُ حَدَّثَنَا يَحْيَى بنُ إِسْحَاقَ السَّيْلَحَانِيُّ حَدَّثَنَا لَيْثُ بنُ سَعْدٍ عَنْ يَزِيدَ بنِ أَبِي حَبِيبٍ عَنْ عَبْدِ اللَّهِ بنِ الْحَارِثِ رَضِيَ اللَّهُ عَنْهُ قَالَ مَا كَانَ ضَحِكُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَّا تَبَسُّمًا.","قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ مِنْ حَدِيثِ لَيْثِ بنِ سَعْدٍ.","229 ـ حَدَّثَنَا أَبُو عَمَّارٍ الْحُسَيْنُ بنُ حُرَيْثٍ حَدَّثَنَا وَكِيعٌ حَدَّثَنَا الأَعْمَشُ عَنِ الْمَعْرُورِ بنِ سُوَيْدٍ عَنْ أَبِي ذَرٍّ رَضِيَ اللَّهُ عَنْهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنِّي لَأَعْلَمُ أَوَّلَ رَجُلٍ يَدْخُلُ الْجَنَّةَ وَءَاخِرَ رَجُلٍ يَخْرُجُ مِنَ النَّارِ يُؤْتَى بِالرَّجُلِ يَوْمَ الْقِيَامَةِ فَيُقَالُ اعْرِضُوا عَلَيْهِ صِغَارَ ذُنُوبِهِ وَتُخَبَّأُ عَنْهُ كِبَارُهَا فَيُقَالُ لَهُ عَمِلْتَ يَوْمَ كَذَا كَذَا وكَذَا وَهُوَ مُقِرٌّ لا يُنْكِرُ وَهُوَ مُشْفِقٌ مِنْ كِبَارِهَا فَيُقَالُ أَعْطُوهُ مَكَانَ كُلِّ سَيِّئَةٍ عَمِلَهَا حَسَنَةً فَيَقُولُ إِنَّ لِي ذُنُوبًا لا أَرَاهَا هَاهُنَا قَالَ أَبُو ذَرٍّ فَلَقَدْ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ضَحِكَ حَتَّى بَدَتْ نَوَاجِذُهُ.","230 ـ حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا مُعَاوِيَةُ بنُ عَمْرٍو حَدَّثَنَا زَائِدَةُ عَنْ بَيَانٍ عَنْ قَيْسِ بنِ أَبِي حَازِمٍ عَنْ جَرِيرِ ابْنِ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُ قَالَ مَا حَجَبَنِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُنْذُ أَسْلَمْتُ وَلا رَءَانِي إِلَّا ضَحِكَ ","231 ـ حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا مُعَاوِيَةُ بنُ عَمرٍو حَدَّثَنَا زَائِدَةُ عَنْ إِسْمَاعِيلَ بنِ أَبِي خَالِدٍ عَنْ قَيْسٍ عَنْ جَرِيرٍ قَالَ مَا حَجَبَنِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُنْذُ أَسْلَمْتُ وَلا رَءانِي إِلَّا تَبَسَّمَ. ","232 ـ حَدَّثَنَا هَنَّادُ بنُ السَّرِيِّ حَدَّثَنَا أَبُو مُعَاوِيَةَ عَنِ الأَعمَشِ عَنْ إِبْرَاهِيمَ عَنْ عَبِيدَةَ السَّلْمَانِيِّ عَنْ عَبدِ اللَّهِ ابْنِ مَسعُودٍ رَضِيَ اللَّهُ تَعَالَى عَنْهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنِّي لَأَعْرِفُ ءَاخِرَ أَهْلِ النَّارِ خُرُوجًا رَجُلٌ يَخرُجُ مِنْهَا زَحْفًا فَيُقَالُ لَهُ انْطَلِقْ فَادْخُلِ الْجَنَّةَ قَالَ فَيَذْهَبُ لِيَدْخُلَ الْجَنَّةَ فَيَجِدُ النَّاسَ قَدْ أَخَذُوا الْمَنَازِلَ فَيَرْجِعُ فَيَقُولُ رَبِّ قَدْ أَخَذَ النَّاسُ الْمَنَازِلَ فَيُقَالُ لَهُ أَتَذْكُرُ الزَّمَانَ الَّذِي كُنْتَ فِيهِ فَيَقُولُ نَعَمْ فَيُقَالُ لَهُ تَمَنَّ قَالَ فَيَتَمَنَّى قَالَ فَيُقَالُ لَهُ فَإِنَّ لَكَ الَّذِي تَمَنَّيْتَهُ وَعَشَرَةَ أَضْعَافِ الدُّنْيَا قَالَ فَيَقُولُ أَتَسْخَرُ بِي وَأَنْتَ الْمَلِكُ قَالَ فَلَقَدْ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ضَحِكَ حَتَّى بَدَتْ نَوَاجِذُهُ.","233 ـ حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا أَبُو الأَحْوَصِ عَنْ أَبِي إِسْحَاقَ عَنْ عَلِيِّ بنِ رَبِيعَةَ قَالَ شَهِدْتُ عَلِيًّا رَضِيَ اللَّهُ عَنْهُ أُتِيَ بِدَابَّةٍ لِيَرْكَبَهَا فَلَمَّا وَضَعَ رِجْلَهُ فِي الرِّكَابِ قَالَ بِسْمِ اللَّهِ فَلَمَّا اسْتَوَى عَلَى ظَهْرِهَا قَالَ الْحَمدُ لِلَّهِ ثُمَّ قَالَ ﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ﴾ ثُمَّ قَالَ الْحَمدُ لِلَّهِ ثَلاثًا وَاللَّهُ أَكبَرُ ثَلاثًا سُبْحَانَكَ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي فَإِنَّهُ لا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ ثُمَّ ضَحِكَ فَقُلْتُ مِنْ أَيِّ شَىْءٍ ضَحِكْتَ يَا أَمِيرَ الْمُؤْمِنِينَ قَالَ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَنَعَ كَمَا صَنَعْتُ ثُمَّ ضَحِكَ فَقُلْتُ مِنْ أَيِّ شَىْءٍ ضَحِكْتَ يَا رَسُولَ اللَّهِ قَالَ إِنَّ رَبَّكَ لَيَعْجَبُ مِنْ عَبْدِهِ إِذَا قَالَ رَبِّ اغْفِرْ لِي ذُنُوبِي يَعْلَمُ أَنَّهُ لا يَغْفِرُ الذُّنُوبَ أَحَدٌ غَيْرِي. ","234 ـ حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُحَمَّدُ بنُ عَبدِ اللَّهِ الأَنْصَارِيُّ حَدَّثَنَا ابْنُ عَوْنٍ عَنْ مُحَمَّدِ بنِ مُحَمَّدِ بنِ الأَسْوَدِ عَنْ عَامِرِ بنِ سَعْدٍ قَالَ قَالَ سَعْدٌ لَقَدْ رَأَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ضَحِكَ يَوْمَ الْخَنْدَقِ حَتَّى بَدَتْ نَوَاجِذُهُ قَالَ قُلْتُ كَيْفَ كَانَ قَالَ كَانَ رَجُلٌ مَعَهُ تُرْسٌ وَكَانَ سَعْدٌ رَامِيًا وَكَانَ يَقُولُ كَذَا وَكَذَا وَكَانَ بِالتُّرْسِ يُغَطِّي جَبْهَتَهُ فَنَزَعَ لَهُ سَعْدٌ بِسَهْمٍ فَلَمَّا رَفَعَ رَأْسَهُ رَمَاهُ فَلَمْ يُخْطِئْ هَذِهِ مِنْهُ يَعْنِي جَبْهَتَهُ وَانْقَلَبَ الرَّجُلُ وَشَالَ بِرِجْلِهِ فَضَحِكَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَتَّى بَدَتْ نَوَاجِذُهُ قَالَ قُلْتُ مِنْ أَيِّ شَىْءٍ ضَحِكَ قَالَ مِنْ فِعْلِهِ بِالرَّجُلِ. "]},{"id":"section-36","title":"بَابُ صِفَةِ مِزَاحِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["235 ـ حَدَّثَنَا مَحمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو أُسَامَةَ عَنْ شَرِيكٍ عَنْ عَاصِمٍ الأَحْوَلِ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لَهُ يَا ذَا الأُذُنَيْنِ. ","قَالَ أَبُو عِيسَى قَالَ مَحمُودٌ قَالَ أَبُو أُسَامَةَ يَعْنِي يُمَازِحُهُ. ","236 ـ حَدَّثَنَا هَنَّادٌ حَدَّثَنَا وَكِيعٌ عَنْ شُعْبَةَ عَنْ أَبِي التَّيَّاحِ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ إِنْ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَيُخَالِطُنَا حَتَّى يَقُولَ لِأَخٍ لَنَا صَغِيرٍ يَا أَبَا عُمَيْرٍ مَا فَعَلَ النُّغَيْرُ. ","قَالَ أَبُو عِيسَى وَفِقْهُ هَذَا الْحَدِيثِ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُمَازِحُ وَفِيهِ أَنَّهُ كَنَّى غُلامًا فَقَالَ لَهُ يَا أَبَا عُمَيْرٍ وَفِيهِ أَنَّهُ لا بَأْسَ أَنْ يُعْطَى الصَّبِيُّ الطَّيْرَ لِيَلْعَبَ بِهِ وَإِنَّمَا قَالَ لَهُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَا أَبَا عُمَيْرٍ مَا فَعَلَ النُّغَيْرُ لِأَنَّهُ كَانَ لَهُ نُغَيْرٌ يَلْعَبُ بِهِ فَمَاتَ فَحَزِنَ الْغُلامُ عَلَيْهِ فَمَازَحَهُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ يَا أَبَا عُمَيْرٍ مَا فَعَلَ النُّغَيْرُ. ","237 ـ حَدَّثَنَا عَبَّاسُ بنُ مُحَمَّدٍ الدُّورِيُّ حَدَّثَنَا عَلِيُّ بنُ الْحَسَنِ بنِ شَقِيقٍ أَخْبَرَنَا عَبْدُ اللَّهِ بنُ الْمُبَارَكِ عَنْ أُسَامَةَ ابْنِ زَيدٍ عَنْ سَعِيدٍ الْمَقْبُرِيِّ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهُ قَالَ قَالُوا يَا رَسُولَ اللَّهِ إِنَّكَ تُدَاعِبُنَا قَالَ إِنِّي لا أَقُولُ إِلَّا حَقًّا. ","238 ـ حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا خَالِدُ بنُ عَبْدِ اللَّهِ عَنْ حُمَيْدٍ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ رَجُلًا اسْتَحْمَلَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ إِنِّي حَامِلُكَ عَلَى وَلَدِ نَاقَةٍ فَقَالَ يَا رَسُولَ اللَّهِ مَا أَصْنَعُ بِوَلَدِ النَّاقَةِ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهَلْ تَلِدُ الإِبِلَ إِلَّا النُّوقُ. ","239 ـ حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ حَدَّثَنَا عَبْدُ الرَّزَّاقِ حَدَّثَنَا مَعْمَرٌ عَنْ ثَابِتٍ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ رَجُلًا مِنْ أَهْلِ الْبَادِيَةِ كَانَ اسْمُهُ زَاهِرًا وَكَانَ يُهْدِي إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هَدِيَّةً مِنَ الْبَادِيَةِ فَيُجَهِّزُهُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَرَادَ أَنْ يَخْرُجَ فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنَّ زَاهِرًا بَادِيَتُنَا وَنَحْنُ حَاضِرُوهُ وَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُمَازِحُهُ وَكَانَ رَجُلًا دَمِيمًا فَأَتَاهُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمًا وَهُوَ يَبِيعُ مَتَاعَهُ فَاحْتَضَنَهُ مِنْ خَلْفِهِ وَلا يُبْصِرُهُ فَقَالَ مَنْ هَذَا أَرْسِلْنِي فَالْتَفَتَ فَعَرَفَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَجَعَلَ لا يَأْلُو مَا أَلْصَقَ ظَهْرَهُ بِصَدْرِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حِينَ عَرَفَهُ فَجَعَلَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ مَنْ يَشْتَرِي الْعَبْدَ فَقَالَ يَا رَسُولَ اللَّهِ إِذًا تَجِدَنِي وَاللَّهِ كَاسِدًا فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَكِنْ عِنْدَ اللَّهِ لَسْتَ بِكَاسِدٍ أَوْ قَالَ أَنْتَ عِنْدَ اللَّهِ غَالٍ. ","240 ـ حَدَّثَنَا عَبْدُ بنُ حُمَيْدٍ حَدَّثَنَا مُصْعَبُ بنُ الْمِقْدَامِ حَدَّثَنَا الْمُبَارَكُ بنُ فَضَالَةَ عَنِ الْحَسَنِ قَالَ أَتَتْ عَجُوزٌ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَتْ يَا رَسُولَ اللَّهِ ادْعُ اللَّهَ أَنْ يُدْخِلَنِي الْجَنَّةَ فَقَالَ يَا أُمَّ فُلانٍ إِنَّ الْجَنَّةَ لا تَدْخُلُهَا عَجُوزٌ قَالَ فَوَلَّتْ تَبْكِي فَقَالَ أَخْبِرُوهَا أَنَّهَا لا تَدْخُلُهَا وَهِيَ عَجُوزٌ إِنَّ اللَّهَ تَعَالَى يَقُولُ ﴿إِنَّا أَنْشَأْنَاهُنَّ إِنْشَاءً فَجَعَلْنَاهُنَّ أَبْكَارًا﴾."]},{"id":"section-37","title":"بَابُ صِفَةِ كَلامِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الشِّعْرِ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["241. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ حَدَّثَنَا شَرِيكٌ عَنِ الْمِقْدَادِ بنِ شُرَيْحٍ عَنْ أَبِيهِ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَ قِيلَ لَهَا هَلْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ يَتَمَثَّلُ بِشَىْءٍ مِنَ الشِّعْرِ قَالَتْ كَانَ يَتَمَثَّلُ بِشِعْرِ ابْنِ رَوَاحَةَ وَيَتَمَثَّلُ بِقَوْلِهِ ","وَيَأْتِيكَ بِالأَخْبَارِ مَنْ لَمْ تُزَوِّدِ. ","242. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ حَدَّثَنَا سُفْيَانُ الثَّوْرِيُّ عَنْ عَبْدِ الْمَلِكِ بنِ عُمَيْرٍ حَدَّثَنَا أَبُو سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنَّ أَصْدَقَ كَلِمَةٍ قَالَهَا الشَّاعِرُ كَلِمَةُ لَبِيدٍ ","أَلا كُلُّ شَىْءٍ مَا خَلا اللَّهَ بَاطِلُ","وَكَادَ أُمَيَّةُ بنُ أَبِي الصَّلْتِ أَنْ يُسْلِمَ. ","243. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنِ الأَسْوَدِ بنِ قَيْسٍ عَنْ جُنْدُبِ بنِ سُفْيَانَ الْبَجَلِيِّ قَالَ أَصَابَ حَجَرٌ إِصْبَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَدَمِيَتْ فَقَالَ ","هَلْ أَنْتِ إِلَّا إِصْبَعٌ دَمِيتِ \t\tوَفِي سَبِيلِ اللَّهِ مَا لَقِيتِ ","244. حَدَّثَنَا ابْنُ أَبِي عُمَرَ حَدَّثَنَا سُفْيَانُ بنُ عُيَيْنَةَ عَنِ الأَسْوَدِ بنِ قَيْسٍ عَنْ جُنْدُبِ بنِ عَبْدِ اللَّهِ الْبَجَلِيِّ نَحْوَهُ.","245. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا يَحْيَى بنُ سَعِيدٍ حَدَّثَنَا سُفْيَانُ الثَّوْرِيُّ أَخْبَرَنَا أَبُو إِسْحَاقَ عَنِ الْبَرَاءِ بنِ عَازِبٍ قَالَ قَالَ لَهُ رَجُلٌ أَفَرَرْتُمْ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَا أَبَا عُمَارَةَ فَقَالَ لا وَاللَّهِ مَا وَلَّى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَكِنْ وَلَّى سَرَعَانُ النَّاسِ تَلَقَّتْهُمْ هَوَازِنُ بِالنَّبْلِ وَرَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى بَغْلَتِهِ وَأَبُو سُفْيَانَ بنُ الْحَارِثِ بنِ عَبْدِ الْمُطَّلِبِ ءَاخِذٌ بِلِجَامِهَا وَرَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ أَنَا النَّبِيُّ لا كَذِبْ أَنَا ابْنُ عَبْدِ الْمُطَّلِبْ. ","246. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ أَخْبَرَنَا عَبْدُ الرَّزَّاقِ حَدَّثَنَا جَعْفَرُ بنُ سُلَيْمَانَ حَدَّثَنَا ثَابِتٌ عَنْ أَنَسٍ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ مَكَّةَ فِي عُمْرَةِ الْقَضَاءِ وَابْنُ رَوَاحَةَ يَمْشِي بَيْنَ يَدَيْهِ وَهُوَ يَقُولُ ","خَلُّوا بَنِي الْكُفَّارِ عَنْ سَبِيلِهِ \t\tالْيَوْمَ نَضْرِبْكُمْ عَلَى تَنْزِيلِهِ  ","ضَرْبًا يُزِيلُ الْهَامَ عَنْ مَقِيلِهِ \t\tوَيُذْهِلُ الْخَلِيلَ عَنْ خَلِيلِهِ ","فَقَالَ لَهُ عُمَرُ يَا ابْنَ رَوَاحَةَ بَيْنَ يَدَيْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَفِي حَرَمِ اللَّهِ تَقُولُ الشِّعْرَ فَقَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَلِّ عَنْهُ يَا عُمَرُ فَلَهِيَ فِيهِمْ أَسْرَعُ مِنْ نَضْحِ النَّبْلِ. ","247. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ أَخْبَرَنَا شَرِيكٌ عَنْ عَبْدِ الْمَلِكِ بنِ عُمَيْرٍ عَنْ أَبِي سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ أَشْعَرُ كَلِمَةٍ تَكَلَّمَتْ بِهَا الْعَرَبُ كَلِمَةُ لَبِيدٍ ","أَلَا كُلُّ شَىْءٍ مَا خَلا اللَّهَ بَاطِلُ.","248. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا مَرْوَانُ بنُ مُعَاوِيَةَ عَنْ عَبْدِ اللَّهِ بنِ عَبْدِ الرَّحْمٰنِ الطَّائِفِيِّ عَنْ عَمْرِو بنِ الشَّرِيدِ عَنْ أَبِيهِ قَالَ كُنْتُ رِدْفَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَأَنْشَدْتُهُ مِائَةَ قَافِيَةٍ مِنْ قَوْلِ أُمَيَّةَ بنِ أَبِي الصَّلْتِ الثَّقَفِيِّ كُلَّمَا أَنْشَدْتُهُ بَيْتًا قَالَ لِيَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هِيهْ حَتَّى أَنْشَدْتُهُ مِائَةً يَعْنِي بَيْتًا فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنْ كَادَ لَيُسْلِمُ.","249. حَدَّثَنَا إِسْمَاعِيلُ بنُ مُوسَى الْفَزَارِيُّ وَعَلِيُّ بنُ حُجْرٍ الْمَعْنَى وَاحِدٌ قَالا أَخْبَرَنَا عَبْدُ الرَّحْمٰنِ بنُ أَبِي الزِّنَادِ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ قَالَتْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَضَعُ لِحَسَّانَ بنِ ثَابِتٍ مِنْبَرًا فِي الْمَسْجِدِ يَقُومُ عَلَيْهِ قَائِمًا يُفَاخِرُ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَوْ قَالَ يُنَافِخُ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَيَقُولُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنَّ اللَّهَ تَعَالَى يُؤَيِّدُ حَسَّانًا بِرُوحِ الْقُدُسِ مَا يُنَافِحُ أَوْ يُفَاخِرُ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.  ","250. حَدَّثَنَا إِسْمَاعِيلُ بنُ مُوسَى وَعَلِيُّ بنُ حُجْرٍ قَالا حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ أَبِي الزِّنَادِ عَنْ أَبِيهِ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِثْلَهُ.","251. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ حَدَّثَنَا شَرِيكٌ عَنْ سِمَاكِ بنِ حَرْبٍ عَنْ جَابِرِ بنِ سَمُرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ جَالَسْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَكْثَرَ مِنْ مِائَةِ مَرَّةٍ فَكَانَ أَصْحَابُهُ يَتَنَاشَدُونَ الشِّعْرَ وَيَتَذَاكَرُونَ أَشْيَاءَ مِنْ أَمْرِ الْجَاهِلِيَّةِ وَهُوَ سَاكِتٌ وَرُبَّمَا تَبَسَّمَ مَعَهُمْ. "]},{"id":"section-38","title":"بَابُ مَا جَاءَ فِي كَلامِ رَسُولِ اللَّهِ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ فِي السَّمَرِ ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["252. حَدَّثَنَا الْحَسَنُ بنُ الصَّبَّاحٍ الْبَزَّارُ حَدَّثَنَا أَبُو النَّضْرِ حَدَّثَنَا أَبُو عَقِيلٍ الثَّقَفِيُّ عَبْدُ اللَّهِ بنُ عَقِيلٍ عَنْ مُجَالِدٍ عَنِ الشَّعْبِيِّ عَنْ مَسْرُوقٍ عَنْ عَائِشَةَ قَالَتْ حَدَّثَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ذَاتَ لَيْلَةٍ نِسَاءَهُ حَدِيثًا فَقَالَتِ امْرَأَةٌ مِنْهُنَّ كَأَنَّ الْحَدِيثَ حَدِيثُ خُرَافَةَ فَقَالَ أَتَدْرُونَ مَا خُرَافَةُ إِنَّ خُرَافَةَ كَانَ رَجُلًا مِنْ عُذْرَةَ أَسَرَتْهُ الْجِنُّ فِي الْجَاهِلِيَّةِ فَمَكَثَ فِيهِمْ دَهْرًا ثُمَّ رَدُّوهُ إِلَى الإِنْسِ فَكَانَ يُحَدِّثُ النَّاسَ بِمَا رَأَى فِيهِمْ مِنَ الأَعَاجِيبِ فَقَالَ النَّاسُ حَدِيثُ خُرَافَةَ.","حَدِيثُ أُمِّ زَرْعٍ","253. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ أَخْبَرَنَا عِيسَى بنُ يُونُسَ عَنْ هِشَامِ بنِ عُرْوَةَ عَنِ أَخِيهِ عَبْدِ اللَّهِ بنِ عُرْوَةَ عَنْ عُرْوَةَ عَنْ عَائِشَةَ قَالَتْ جَلَسَ إِحْدَى عَشْرَةَ امْرَأَةً تَعَاهَدْنَ وَتَعَاقَدْنَ أَنْ لا يَكْتُمْنَ مِنْ أَخْبَارِ أَزْوَاجِهِنَّ شَيْئًا قَالَتِ الأُولَى زَوْجِي لَحْمُ جَمَلٍ غَثٍّ عَلَى رَأْسِ جَبَلٍ وَعْرٍ لا سَهْلٍ فَيُرْتَقَى وَلا سَمِينٍ فَيُنْتَقَى. قَالَتِ الثَّانِيَةُ زَوْجِي لا أَبُثُّ خَبَرَهُ إِنِّي أَخَافُ أَنْ لا أَذَرَهُ إِنْ أَذْكُرْهُ أَذْكُرْ عُجَرَهُ وَبُجَرَهُ. قَالَتِ الثَّالِثَةُ زَوْجِي الْعَشَنَّقُ إِنْ أَنْطِقْ أُطَلَّقْ وَإِنْ أَسْكُتْ أُعَلَّقْ. قَالَتِ الرَّابِعَةُ زَوْجِي كَلَيلِ تِهَامَةَ لا حَرٌّ وَلا قُرٌّ وَلا مَخَافَةَ وَلا سَئَامَةَ. قَالَتِ الْخَامِسَةُ زَوْجِي إِنْ دَخَلَ فَهِدَ وَإِنْ خَرَجَ أَسِدَ وَلا يَسْأَلُ عَمَّا عَهِدَ. قَالَتِ السَّادِسَةُ زَوْجِي إِنْ أَكَلَ لَفَّ وَإِنْ شَرِبَ اشْتَفَّ وَإِنِ اضْطَجَعَ الْتَفَّ وَلا يُولِجُ الْكَفَّ لِيَعْلَمَ الْبَثَّ. قَالَتِ السَّابِعَةُ زَوْجِي غَيَايَاءُ أَوْ عَيَايَاءُ طَبَاقَاءُ كُلُّ دَاءٍ لَهُ دَاءٌ شَجَّكِ أَوْ فَلَّكِ أَوْ جَمَعَ كُلًّا لَكِ. قَالَتِ الثَّامِنَةُ زَوْجِي الْمَسُّ مَسُّ أَرْنَبٍ وَالرِّيحُ رِيحُ زَرْنَب.ٍ قَالَتِ التَّاسِعَةُ زَوْجِي رَفِيعُ الْعِمَادِ عَظِيمُ الرَّمَادِ طَوِيلُ النِّجَادِ قَرِيبُ الْبَيْتِ مِنَ النَّادِ. قَالَتِ الْعَاشِرَةُ زَوْجِي مَالِكٌ وَمَا مَالِكٌ مَالِكٌ خَيْرٌ مِنْ ذَلِكِ لَهُ إِبِلٌ كَثِيرَاتُ الْمَبَارِكِ قَلِيلاتُ الْمَسَارِحِ إِذَا سَمِعْنَ صَوْتَ الْمِزْهَرِ أَيْقَنَّ أَنَّهُنَّ هَوَالِكُ. قَالَتِ الْحَادِيَةَ عَشْرَةَ زَوْجِي أَبُو زَرْعٍ وَمَا أَبُو زَرْعٍ أَنَاسَ مِنْ حُلِيٍّ أُذُنَيَّ وَمَلَأَ مِنْ شَحْمٍ عَضُدَيَّ وَبَجَّحَنِي ، فَبَجِحَتْ إِلَيَّ نَفْسِي وَجَدَنِي فِي أَهْلِ غُنَيْمَةٍ بِشَقٍّ فَجَعَلَنِي فِي أَهْلِ صَهِيلٍ وَأَطِيطٍ وَدَائِسٍ وَمُنَقٍّ فَعِنْدَهُ أَقُولُ فَلا أُقَبَّحُ وَأَرْقُدُ فَأَتَصَبَّحُ وَأَشْرَبُ فَأَتَقَمَّحُ. أُمُّ أَبِي زَرْعٍ فَمَا أُمُّ أَبِي زَرْعٍ عُكُومُهَا رَدَاحٌ وَبَيْتُهَا فَسَاحٌ. ابْنُ أَبِي زَرْعٍ فَمَا ابْنُ أَبِي زَرْعٍ مَضْجَعُهُ كَمَسَلِّ شَطْبَةٍ وَتُشْبِعُهُ ذِرَاعُ الْجَفْرَةِ. بِنْتُ أَبِي زَرْعٍ فَمَا بِنْتُ أَبِي زَرْعٍ طَوْعُ أَبِيهَا وَطَوْعُ أُمِّهَا وَمِلْءُ كِسَائِهَا وَغَيْظُ جَارَتِهَا. جَارِيَةُ أَبِي زَرْعٍ فَمَا جَارِيَةُ أَبِي زَرْعٍ لا تَبُثُّ حَدِيثَنَا تَبْثِيثًا وَلا تَنْقُثُ مِيرَتَنَا تَنْقِيثًا وَلا تَمْلأُ بَيْتَنَا تَعْشِيشًا. قَالَتْ خَرَجَ أَبُو زَرْعٍ وَالأَوْطَابُ تُمْخَضُ فَلَقِيَ امْرَأَةً مَعَهَا وَلَدَانِ لَهَا كَالْفَهْدَيْنِ يَلْعَبَانِ مِنْ تَحْتِ خَصْرِهَا بِرُمَّانَتَيْنِ فَطَلَّقَنِي وَنَكَحَهَا فَنَكَحْتُ بَعْدَهُ رَجُلا سَرِيًّا رَكِبَ شَرِيًّا وَأَخَذَ خَطِّيًّا وَأَرَاحَ عَلَيَّ نَعَمًا ثَرِيًّا وَأَعْطَانِي مِنْ كُلِّ رَائِحَةٍ زَوْجًا وَقَالَ كُلِي أُمَّ زَرْعٍ وَمِيرِي أَهْلَكِ فَلَوْ جَمَعْتُ كُلَّ شىْءٍ أَعْطَانِيهِ مَا بَلَغَ أَصْغَرَ ءَانِيَةِ أَبِي زَرْعٍ. قَالَتْ عَائِشَةُ رَضِيَ اللَّهُ عَنْهَا فَقَالَ لِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كُنْتُ لَكِ كَأَبِي زَرْعٍ لأُمِّ زَرْعٍ. "]},{"id":"section-39","title":"بَابُ صِفَةِ نَوْمِ رَسُولِ اللَّهِ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["254. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ أَخْبَرَنَا إِسْرَائِيلُ عَنْ أَبِي إِسْحَاقَ عَنْ عَبْدِ اللَّهِ بنِ يَزِيدَ عَنِ الْبَرَاءِ بنِ عَازِبٍ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِذَا أَخَذَ مَضْجَعَهُ وَضَعَ كَفَّهُ الْيُمْنَى تَحْتَ خَدِّهِ الأَيْمَنِ وَقَالَ رَبِّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ. ","255. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا عَبْدُ الرَّحْمٰنِ حَدَّثَنَا إِسْرَائِيلُ عَنْ أَبِي إِسْحَاقَ عَنْ أَبِي عُبَيْدَةَ عَنْ عَبْدِ اللَّهِ مِثْلَهُ وَقَالَ يَوْمَ تَجْمَعُ عِبَادَكَ. ","256. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا عَبْدُ الرَّزَّاقِ حَدَّثَنَا سُفْيَانُ عَنْ عَبْدِ الْمَلِكِ بنِ عُمَيْرٍ عَنْ رِبْعِيِّ بنِ حِرَاشٍ عَنْ حُذَيْفَةَ قَالَ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَوَى إِلَى فِرَاشِهِ قَالَ اللَّهمَّ بِاسْمِكَ أَمُوتُ وَأَحْيَا وَإِذَا اسْتَيْقَظَ قَالَ الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ. ","257. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا الْمُفَضَّلُ بنُ فَضَالَةَ عَنْ عُقَيْلٍ أُرَاهُ عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ عَنْ عَائِشَةَ قَالَتْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَوَى إِلَى فِرَاشِهِ كُلَّ لَيْلَةٍ جَمَعَ كَفَّيْهِ فَنَفَثَ فِيهِمَا وَقَرَأَ فِيهِمَا ﴿قُلْ هُوَ اللَّه أَحَدٌ﴾ وَ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾ وَ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾ ثُمَّ مَسَحَ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ يَبْدَأُ بِهِمَا رَأْسَهُ وَوَجْهَهُ وَمَا أَقْبَلَ مِنْ جَسَدِهِ يَصْنَعُ ذَلِكَ ثَلاثَ مَرَّاتٍ. ","258. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ حَدَّثَنَا سُفْيَانُ عَنْ سَلَمَةَ بنِ كُهَيلٍ عَنْ كُرَيْبٍ عَنِ ابْنِ عَبَّاسٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَامَ حَتَّى نَفَخَ وَكَانَ إِذَا نَامَ نَفَخَ فَأَتَاهُ بِلالٌ فَآذَنَهُ بِالصَّلاةِ فَقَامَ فَصَلَّى وَلَمْ يَتَوَضَّأْ وَفِي الْحَدِيثِ قِصَّةٌ. ","259. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ أَخْبَرَنَا عَفَّانُ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ ثَابِتٍ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِذَا أَوَى إِلَى فِرَاشِهِ قَالَ الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَكَفَانَا وءَاوَانَا فَكَمْ مِمَّنْ لا كَافِيَ لَهُ وَلا مُؤْوِيَ. ","260. حَدَّثَنَا الْحُسَيْنُ بنُ مُحَمَّدٍ الْحَرِيرِيُّ حَدَّثَنَا سُلَيْمَانُ بنُ حَرْبٍ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ حُمَيْدٍ عَنْ بَكْرِ بنِ عَبْدِ اللَّه الْمُزَنِيِّ عَنْ عَبْدِ اللَّهِ بنِ رَبَاحٍ عَنْ أَبِي قَتَادَةَ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِذَا عَرَّسَ بِلَيْلٍ اضْطَجَعَ عَلَى شِقِّهِ الأَيْمَنِ وَإِذَا عَرَّسَ قُبَيْلَ الصُّبْحِ نَصَبَ ذِرَاعَهُ وَوَضَعَ رَأْسَهُ عَلَى كَفِّهِ. "]},{"id":"section-40","title":"بَابُ عِبَادَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["261. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ وَبِشْرُ بنُ مُعَاذٍ قَالا حَدَّثَنَا أَبُو عَوَانَةَ عَنْ زِيَادِ بنِ عِلاقَةَ عَنِ الْمُغِيرَةِ بنِ شُعْبَةَ قَالَ صَلَّى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَتَّى انْتَفَخَتْ قَدَمَاهُ فَقِيلَ لَهُ أَتَتَكَلَّفُ هَذَا وَقَدْ غُفِرَ لَكَ مَا تَقَدَّمَ مِنْ ذَنْبِكَ وَمَا تَأَخَّرَ قَالَ أَفَلا أَكُونُ عَبْدًا شَكُورًا. ","262. حَدَّثَنَا أَبُو عَمَّارٍ الْحُسَيْنُ بنُ حُرَيْثٍ أَخْبَرَنَا الْفَضْلُ بنُ مُوسَى عَنْ مُحَمَّدِ بنِ عَمْرٍو عَنْ أَبِي سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي حَتَّى تَرِمَ قَدَمَاهُ فَقِيلَ لَهُ تَفْعَلُ هَذَا وَقَدْ جَاءَكَ أَنَّ اللَّهَ قَدْ غَفَرَ لَكَ مَا تَقَدَّمَ مِنْ ذَنْبِكَ وَمَا تَأَخَّرَ قَالَ أَفَلا أَكُونُ عَبْدًا شَكُورًا. ","263. حَدَّثَنَا عِيسَى بنُ عُثْمَانَ بنِ عِيسَى بنِ عَبْدِ الرَّحْمٰنِ الرَّمْلِيُّ حَدَّثَنَا عَمِّي يَحْيَى بنُ عِيسَى الرَّمْلِيُّ عَنِ الأَعْمَشِ عَنْ أَبِي صَالِحٍ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُومُ يُصَلِّي حَتَّى تَنْتَفِخَ قَدَمَاهُ فَيُقَالُ لَهُ تَفْعَلُ هَذَا وَقَدْ غَفَرَ اللَّهُ لَكَ مَا تَقَدَّمَ مِنْ ذَنْبِكَ وَمَا تَأَخَّرَ قَالَ أَفَلا أَكُونُ عَبْدًا شَكُورًا. ","264. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ أَبِي إِسْحَاقَ عَنِ الأَسْوَدِ بنِ يَزِيدَ قَالَ سَأَلْتُ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا عَنْ صَلاةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِاللَّيْلِ فَقَالَتْ كَانَ يَنَامُ أَوَّلَ اللَّيْلِ ثُمَّ يَقُومُ فَإِذَا كَانَ مِنَ السَّحَرِ أَوْتَرَ ثُمَّ أَتَى فِرَاشَهُ فَإِنْ كَانَ لَهُ حَاجَةٌ أَلَمَّ بِأَهْلِهِ فَإِذَا سَمِعَ الأَذَانَ وَثَبَ فَإِنْ كَانَ جُنُبًا أَفَاضَ عَلَيْهِ مِنَ الْمَاءِ وَإِلَّا تَوَضَّأَ وَخَرَجَ إِلَى الصَّلاةِ. ","265. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ عَنْ مَالِكِ بنِ أَنَسٍ (ح) وَحَدَّثَنَا إِسْحَاقُ بنُ مُوسَى الأَنْصَارِيُّ حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ مَخْرَمَةَ بنِ سُلَيْمَانَ عَنْ كُرَيْبٍ عَنِ ابْنِ عَبَّاسٍ أَنَّهُ أَخْبَرَهُ أَنَّهُ بَاتَ عِنْدَ مَيْمُونَةَ وَهِيَ خَالَتُهُ قَالَ فَاضْطَجَعْتُ فِي عَرْضِ الْوِسَادَةِ وَاضْطَجَعَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي طُولِهَا فَنَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَتَّى إِذَا انْتَصَفَ اللَّيْلُ أَوْ قَبْلَهُ بِقَلِيلٍ أَوْ بَعْدَهُ بِقَلِيلٍ اسْتَيْقَظَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَجَعَلَ يَمْسَحُ النَّوْمَ عَنْ وَجْهِهِ ثُمَّ قَرَأَ الْعَشْرَ الآيَاتِ الْخَوَاتِيمِ مِنْ سُورَةِ ءَالِ عِمْرَانَ ثُمَّ قَامَ إِلَى شَنٍّ مُعَلَّقٍ فَتَوَضَّأَ مِنْهَا فَأَحْسَنَ الْوُضُوءَ ثُمَّ قَامَ يُصَلِّي قَالَ عَبْدُ اللَّهِ بنُ عَبَّاسٍ فَقُمْتُ إِلَى جَنْبِهِ فَوَضَعَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَدَهُ الْيُمْنَى عَلَى رَأْسِي ثُمَّ أَخَذَ بِأُذُنِي الْيُمْنَى فَفَتَلَهَا فَصَلَّى رَكْعَتَيْنِ ثُمَّ رَكْعَتَيْنِ ثُمَّ رَكْعَتَيْنِ ثُمَّ رَكْعَتَيْنِ ثُمَّ رَكْعَتَيْنِ ثُمَّ رَكْعَتَيْنِ قَالَ مَعْنٌ سِتَّ مَرَّاتٍ ثُمَّ أَوْتَرَ ثُمَّ اضْطَجَعَ حَتَّى جَاءَ الْمُؤَذِّنُ فَقَامَ فَصَلَّى رَكْعَتَيْنِ خَفِيفَتَيْنِ ثُمَّ خَرَجَ فَصَلَّى الصُّبْحَ. ","266. حَدَّثَنَا أَبُو كُرَيْبٍ مُحَمَّدُ بنُ الْعَلاءِ حَدَّثَنَا وَكِيعٌ عَنْ شُعْبَةَ عَنْ أَبِي جَمْرَةَ عَنِ ابْنِ عَبَّاسٍ قَالَ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ يُصَلِّي مِنَ اللَّيْلِ ثَلاثَ عَشْرَةَ رَكْعَةً. ","267. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا أَبُو عَوَانَةَ عَنْ قَتَادَةَ عَنْ زُرَارَةَ بنِ أَوْفَى عَنْ سَعْدِ بنِ هِشَامٍ عَنْ عَائِشَةَ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِذَا لَمْ يُصَلِّ مِنَ اللَّيْلِ مَنَعَهُ مِنْ ذَلِكَ النَّوْمُ أَوْ غَلَبَتْهُ عَيْنَاهُ صَلَّى مِنَ النَّهَارِ ثِنْتَيْ عَشْرَةَ رَكْعَةً. ","268. حَدَّثَنَا مُحَمَّدُ بنُ الْعَلاءِ حَدَّثَنَا أَبُو أُسَامَةَ عَنْ هِشَامٍ عَنْ مُحَمَّدِ بنِ سِيرِينَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ إِذَا قَامَ أَحَدُكُمْ مِنَ اللَّيْلِ فَلْيَفْتَتِحْ صَلاتَهُ بِرَكْعَتَيْنِ خَفِيفَتَيْنِ. ","269. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ عَنْ مَالِكِ بنِ أَنَسٍ (ح) قَالَ وَحَدَّثَنَا إِسْحَاقُ بنُ مُوسَى حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ عَبْدِ اللَّهِ بنِ أَبِي بَكْرٍ عَنْ أَبِيهِ أَنَّ عَبْدَ اللَّهِ بنَ قَيْسِ بنِ مَخْرَمَةَ أَخْبَرَهُ عَنْ زَيْدِ بنِ خَالِدٍ الْجُهَنِيِّ أَنَّهُ قَالَ لَأَرْمُقَنَّ صَلاةَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَتَوَسَّدْتُ عَتَبَتَهُ أَوْ فُسْطَاطَهُ فَصَلَّى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رَكْعَتَيْنِ خَفِيفَتَيْنِ ثُمَّ صَلَّى رَكْعَتَيْنِ طَوِيلَتَيْنِ طَوِيلَتَيْنِ طَوِيلَتَيْنِ ثُمَّ صَلَّى رَكْعَتَيْنِ وَهُمَا دَونَ اللَّتَيْنِ قَبْلَهُمَا ثُمَّ صَلَّى رَكْعَتَيْنِ وَهُمَا دُونَ اللَّتَيْنِ قَبْلَهُمَا ثُمَّ صَلَّى رَكْعَتَيْنِ وَهُمَا دُونَ اللَّتَيْنِ قَبْلَهُمَا ثُمَّ صَلَّى رَكْعَتَيْنِ وَهُمَا دُونَ اللَّتَيْنِ قَبْلَهُمَا ثُمَّ أَوْتَرَ فَذَلِكَ ثَلاثَ عَشْرَةَ رَكْعَةً. ","270. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ سَعِيدِ بنِ أَبِي سَعِيدٍ الْمَقْبُرِيِّ عَنْ أَبِي سَلَمَةَ بنِ عَبْدِ الرَّحْمٰنِ أَنَّهُ أَخْبَرَهُ أَنَّهُ سَأَلَ عَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا كَيْفَ كَانَتْ صَلاةُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي رَمَضَانَ فَقَالَتْ مَا كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِيَزِيدَ فِي رَمَضَانَ وَلا فِي غَيْرِهِ عَلَى إِحْدَى عَشْرَةَ رَكْعَةً يُصَلِّي أَرْبَعًا فَلا تَسَلْ عَنْ حُسْنِهِنَّ وَطُولِهِنَّ ثُمَّ يُصَلِّي أَرْبَعًا لا تَسَلْ عَنْ حُسْنِهِنَّ وَطُولِهِنَّ ثُمَّ يُصَلِّي ثَلاثًا قَالَتْ عَائِشَةُ رَضِيَ اللَّهُ عَنْهَا قُلْتُ يَا رَسُولَ اللَّهِ أَتَنَامُ قَبْلَ أَنْ تُوتِرَ قَالَ يَا عَائِشَةُ إِنَّ عَيْنَيَّ تَنَامَانِ وَلا يَنَامُ قَلْبِي. ","271. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنِ ابْنِ شِهَابٍ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُصَلِّي مِنَ اللَّيْلِ إِحْدَى عَشْرَةَ رَكْعَةً يُوتِرُ مِنْهَا بِوَاحِدَةٍ فَإِذَا فَرَغَ مِنْهَا اضْطَجَعَ عَلَى شِقِّهِ الأَيْمَنِ. ","272. حَدَّثَنَا ابْنُ أَبِي عُمَرَ حَدَّثَنَا مَعْنٌ عَنْ مَالِكٍ عَنِ ابْنِ شِهَابٍ (ح) وَحَدَّثَنَا قُتَيْبَةُ عَنْ مَالِكٍ عَنِ ابْنِ شِهَابٍ نَحْوَهُ. ","273. حَدَّثَنَا هَنَّادٌ حَدَّثَنَا أَبُو الأَحْوَصِ عَنِ الأَعْمَشِ عَنْ إِبْرَاهِيمَ عَنِ الأَسْوَدِ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي مِنَ اللَّيْلِ تِسْعَ رَكَعَاتٍ. ","274. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا يَحْيَى بنُ ءَادَمَ حَدَّثَنَا سُفْيَانُ الثَّوْرِيُّ عَنِ الأَعْمَشِ نَحْوَهُ. ","275. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ عَمْرِو بنِ مُرَّةَ عَنْ أَبِي حَمْزَةَ رَجُلٍ مِنَ الأَنْصَارِ عَنْ رَجُلٍ مِنْ بَنِي عَبْسٍ عَنْ حُذَيْفَةَ بنِ الْيَمَانِ رَضِيَ اللَّهُ عَنْهُ أَنَّهُ صَلَّى مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنَ اللَّيْلِ قَالَ فَلَمَّا دَخَلَ فِي الصَّلاةِ قَالَ اللَّهُ أَكْبَرُ ذُو الْمَلَكُوتِ وَالْجَبَرُوتِ وَالْكِبْرِيَاءِ وَالْعَظَمَةِ قَالَ ثُمَّ قَرَأَ الْبَقَرَةَ ثُمَّ رَكَعَ فَكَانَ رُكُوعُهُ نَحْوًا مِنْ قِيَامِهِ وَكَانَ يَقُولُ سُبْحَانَ رَبِّيَ الْعَظِيمِ سُبْحَانَ رَبِّيَ الْعَظِيمِ ثُمَّ رَفَعَ رَأْسَهُ فَكَانَ قِيَامُهُ نَحْوًا مِنْ رُكُوعِهِ وَكَانَ يَقُولُ لِرَبِّيَ الْحَمْدُ لِرَبِّيَ الْحَمْدُ ثُمَّ سَجَدَ فَكَانَ سُجُودُهُ نَحْوًا مِنْ قِيَامِهِ وَكَانَ يَقُولُ سُبْحَانَ رَبِّيَ الأَعْلَى سُبْحَانَ رَبِّيَ الأَعْلَى ثُمَّ رَفَعَ رَأْسَهُ فَكَانَ مَا بَيْنَ السَّجْدَتَيْنِ نَحْوًا مِنَ السُّجُودِ وَكَانَ يَقُولُ رَبِّ اغْفِرْ لِي رَبِّ اغْفِرْ لِي حَتَّى قَرَأَ الْبَقَرَةَ وَآلَ عِمْرَانَ وَالنِّسَاءَ وَالْمَائِدَةَ أَوِ الأَنْعَامَ. شُعْبَةُ الَّذِي شَكَّ فِي الْمَائِدَةِ أَوِ الأَنْعَامِ.","قَالَ أَبُو عِيسَى أَبُو حَمْزَةَ اسْمُهُ طَلْحَةُ بنُ زَيْدٍ وَأَبُو جَمْرَةَ الضُّبَعِيُّ اسْمُهُ نَصْرُ بنُ عِمْرَانَ. ","276. حَدَّثَنَا أَبُو بَكْرٍ مُحَمَّدُ بنُ نَافِعٍ الْبَصْرِيُّ حَدَّثَنَا عَبْدُ الصَّمَدِ بنُ عَبْدِ الْوَارِثِ عَنْ إِسْمَاعِيلَ بنِ مُسْلِمٍ الْعَبْدِيِّ عَنْ أَبِي الْمُتَوَكِّلِ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ قَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِآيَةٍ مِنَ الْقُرْءَانِ لَيْلَةً. ","277. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا سُلَيْمَانُ بنُ حَرْبٍ حَدَّثَنَا شُعْبَةُ عَنِ الأَعْمَشِ عَنْ أَبِي وَائِلٍ عَنْ عَبْدِ اللَّهِ قَالَ صَلَّيْتُ لَيْلَةً مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَلَمْ يَزَلْ قَائِمًا حَتَّى هَمَمْتُ بِأَمْرِ سُوءٍ قِيلَ لَهُ وَمَا هَمَمْتَ بِهِ قَالَ هَمَمْتُ أَنْ أَقْعُدَ وَأَدَعَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","278. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا جَرِيرٌ عَنِ الأَعْمَشِ نَحْوَهُ. ","279. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى الأَنْصَارِيُّ حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ أَبِي النَّضْرِ عَنْ أَبِي سَلَمَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُصَلِّي جَالِسًا فَيَقْرَأُ وَهُوَ جَالِسٌ فَإِذَا بَقِيَ مِنْ قِرَاءَتِهِ قَدْرُ مَا يَكُونُ ثَلاثِينَ أَوْ أَرْبَعِينَ ءَايَةً قَامَ فَقَرَأَ وَهُوَ قَائِمٌ ثُمَّ رَكَعَ وَسَجَدَ ثُمَّ صَنَعَ فِي الرَّكْعَةِ الثَّانِيَةِ مِثْلَ ذَلِكَ. ","280. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا هُشَيْمٌ حَدَّثَنَا خَالِدٌ الْحَذَّاءُ عَنْ عَبْدِ اللَّهِ بنِ شَقِيقٍ قَالَ سَأَلْتُ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا عَنْ صَلاةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ تَطَوُّعِهِ فَقَالَتْ كَانَ يُصَلِّي لَيْلًا طَوِيًلا قَائِمًا وَلَيْلًا طَوِيلًا قَاعِدًا فَإِذَا قَرَأَ وَهُوَ قَائِمٌ رَكَعَ وَسَجَدَ وَهُوَ قَائِمٌ وَإِذَا قَرَأَ وَهُوَ جَالِسٌ رَكَعَ وَسَجَدَ وَهُوَ جَالِسٌ. ","281. حَدَّثَنَا الأَنْصَارِيُّ حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنِ ابْنِ شِهَابٍ عَنِ السَّائِبِ بنِ يَزِيدَ عَنِ الْمُطَّلِبِ بنِ أَبِي وَدَاعَةَ السَّهْمِيِّ عَنْ حَفْصَةَ زَوْجِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَتْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي فِي سُبْحَتِهِ قَاعِدًا وَيَقْرَأُ بِالسُّورَةِ وَيُرَتِّلُهَا حَتَّى تَكُونَ أَطْوَلَ مِنْ أَطْوَلَ مِنْهَا. ","282. حَدَّثَنَا الْحَسَنُ بنُ مُحَمَّدٍ الزَّعْفَرَانِيُّ حَدَّثَنَا الْحَجَّاجُ بنُ مُحَمَّدٍ عَنِ ابْنِ جُرَيْجٍ قَالَ أَخْبَرَنِي عُثْمَانُ بنُ أَبِي سُلَيْمَانَ أَنَّ أَبَا سَلَمَةَ بنَ عَبْدِ الرَّحْمٰنِ أَخْبَرَهُ أَنَّ عَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا أَخْبَرَتْهُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَمْ يَمُتْ حَتَّى كَانَ أَكْثَرُ صَلاتِهِ وَهُوَ جَالِسٌ. ","283. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ عَنْ أَيُّوبَ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ صَلَّيْتُ مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رَكْعَتَيْنِ قَبْلَ الظُّهْرِ وَرَكْعَتَيْنِ بَعْدَهَا وَرَكْعَتَيْنِ بَعْدَ الْمَغْرِبِ فِي بَيْتِهِ وَرَكْعَتَيْنِ بَعْدَ الْعِشَاءِ فِي بَيْتِهِ. ","284. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ حَدَّثَنَا أَيُّوبُ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ وَحَدَّثَتْنِي حَفْصَةُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُصَلِّي رَكْعَتَيْنِ حِينَ يَطْلُعُ الْفَجْرُ وَيُنَادِي الْمُنَادِي قَالَ أَيُّوبُ أُرَاهُ قَالَ خَفِيفَتَيْنِ. ","285. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا مَرْوَانُ الْفَزَارِيُّ عَنْ جَعْفَرِ بنِ بُرْقَانَ عَنْ مَيْمُونِ بنِ مِهْرَانَ عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ حَفِظْتُ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ثَمَانِ رَكَعَاتٍ رَكْعَتَيْنِ قَبْلَ الظُّهْرِ وَرَكْعَتَيْنِ بَعْدَهَا وَرَكْعَتَيْنِ بَعْدَ الْمَغْرِبِ وَرَكْعَتَيْنِ بَعْدَ الْعِشَاءِ. قَالَ ابْنُ عُمَرَ وَحَدَّثَتْنِي حَفْصَةُ بِرَكْعَتَيِ الْغَدَاةِ وَلَمْ أَكُنْ أَرَاهُمَا مِنَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","286. حَدَّثَنَا أَبُو سَلَمَةَ يَحْيَى بنُ خَلَفٍ حَدَّثَنَا بِشْرُ بنُ الْمُفَضَّلِ عَنْ خَالِدٍ الْحَذَّاءِ عَنْ عَبْدِ اللَّهِ بنِ شَقِيقٍ قَالَ سَأَلتُ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا عَنْ صَلاةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَتْ كَانَ يُصَلِّي قَبْلَ الظُّهْرِ رَكْعَتَيْنِ وَبَعْدَهَا رَكْعَتَيْنِ وَبَعْدَ الْمَغْرِبِ ثِنْتَيْنِ وَبَعْدَ الْعِشَاءِ رَكْعَتَيْنِ وَقَبْلَ الْفَجْرِ ثِنْتَيْنِ. ","287. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ أَبِي إِسْحَاقَ قَالَ سَمِعْتُ عَاصِمَ بنَ ضَمْرَةَ يَقُولُ سَأَلْنَا عَلِيًّا كَرَّمَ اللَّهُ وَجْهَهُ عَنْ صَلاةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنَ النَّهَارِ قَالَ فَقَالَ إِنَّكُمْ لا تُطِيقُونَ ذَلِكَ قَالَ قُلْنَا مَنْ أَطَاقَ ذَلِكَ مِنَّا صَلَّى فَقَالَ كَانَ إِذَا كَانَتِ الشَّمْسُ مِنْ هَاهُنَا كَهَيْئَتِهَا مِنْ هَاهُنَا عِنْدَ الْعَصْرِ صَلَّى رَكْعَتَيْنِ فَإِذَا كَانَتِ الشَّمْسُ مِنْ هَاهُنَا كَهَيْئَتِهَا مِنْ هَاهُنَا عِنْدَ الظُّهْرِ صَلَّى أَرْبَعًا وَيُصَلِّي قَبْلَ الظُّهْرِ أَرْبَعًا وَبَعْدَهَا رَكْعَتَيْنِ وَقَبْلَ الْعَصْرِ أَرْبَعًا يَفْصِلُ بَيْنَ كُلِّ رَكْعَتَيْنِ بِالتَّسْلِيمِ عَلَى الْمَلائِكَةِ الْمُقَرَّبِينَ وَالنَّبِيِّينَ وَمَنْ تَبِعَهُمْ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ. ","288. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ الطَّيَالِسِيُّ أَخْبَرَنَا شُعْبَةُ عَنْ يَزِيدَ الرِّشْكِ قَالَ سَمِعْتُ مُعَاذَةَ قَالَتْ قُلْتُ لِعَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا أَكَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي الضُّحَى قَالَتْ نَعَمْ أَرْبَعَ رَكَعَاتٍ وَيَزِيدُ مَا شَاءَ اللَّهُ عَزَّ وَجَلَّ. ","289. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا حَكِيمُ بنُ مُعَاوِيَةَ الزِّيَادِيُّ حَدَّثَنَا زِيَادُ بنُ عُبَيْدِ اللَّهِ بنِ الرَّبِيعِ الزِّيَادِيُّ عَنْ حُمَيْدٍ الطَّوِيلِ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُصَلِّي الضُّحَى سِتَّ رَكَعَاتٍ. ","290. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ أَخْبَرَنَا شُعْبَةُ عَنْ عَمْرِو بنِ مُرَّةَ عَنْ عَبْدِ الرَّحْمٰنِ بنِ أَبِي لَيْلَى قَالَ مَا أَخْبَرَنِي أَحَدٌ أَنَّهُ رَأَى النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي الضُّحَى إِلَّا أُمُّ هَانِئٍ رَضِيَ اللَّهُ تَعَالَى عَنْهَا فَإِنَّهَا حَدَّثَتْ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ عَلَيْهَا يَوْمَ فَتْحِ مَكَّةَ فَاغْتَسَلَ فَسَبَّحَ ثَمَانِيَ رَكَعَاتٍ مَا رَأَيْتُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَلَّى صَلاةً قَطُّ أَخَفَّ مِنْهَا غَيْرَ أَنَّهُ كَانَ يُتَمِّمُ الرُّكُوعَ وَالسُّجُودَ. ","291. حَدَّثَنَا ابْنُ أَبِي عُمَرَ حَدَّثَنَا وَكِيعٌ حَدَّثَنَا كَهْمَسُ بنُ الْحَسَنِ عَنْ عَبْدِ اللَّهِ بنِ شَقِيقٍ قَالَ قُلْتُ لِعَائِشَةَ رَضِيَ اللَّهُ عَنْهَا أَكَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي الضُّحَى قَالَتْ لا إِلَّا أَنْ يَجِيءَ مِنْ مَغِيبِهِ. ","292. حَدَّثَنَا زِيَادُ بنُ أَيُّوبَ حَدَّثَنَا مُحَمَّدُ بنُ رَبِيعَةَ عَنْ فُضَيْلِ بنِ مَرْزُوقٍ عَنْ عَطِيَّةَ عَنْ أَبِي سَعِيدٍ الْخُدْرِيّ رَضِيَ اللَّهُ تَعَالَى عَنْهُ قَالَ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي الضُّحَى حَتَّى نَقُولَ لا يَدَعُهَا وَيَدَعُهَا حَتَّى نَقُولَ لا يُصَلِّيهَا. ","293. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا هُشَيْمٌ أَنْبَأَنَا عُبَيْدَةُ عَنْ إِبْرَاهِيمَ عَنْ سَهْمِ بنِ مِنْجَابٍ عَنْ قَرْثَعٍ الضَّبِيِّ أَوْ عَنْ قَزَعَةَ عَنْ قَرْثَعٍ عَنْ أَبِي أَيُّوبَ الأَنْصَارِيِّ رَضِيَ اللَّهُ تَعَالَى عَنْهُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُدْمِنُ أَرْبَعَ رَكَعَاتٍ عِنْدَ الزَّوَالِ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّكَ تُدْمِنُ هَذِهِ الأَرْبَعَ رَكَعَاتٍ عِنْدَ زَوَالِ الشَّمْسِ فَقَالَ إِنَّ أَبْوَابَ السَّمَاءِ تُفْتَحُ عِنْدَ زَوَالِ الشَّمْسِ وَلا تُرْتَجُ حَتَّى يُصَلَّى الظُّهْرُ فَأُحِبُّ أَنْ يَصْعَدَ لِي فِي تِلْكَ السَّاعَةِ خَيْرٌ قُلْتُ أَفِي كُلِّهِنَّ قِرَاءَةٌ قَالَ نَعَمْ قُلْتُ هَلْ فِيهِنَّ تَسْلِيمٌ فَاصِلٌ قَالَ لا. ","294. أَخْبَرَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا أَبُو مُعَاوِيَةَ حَدَّثَنَا عُبَيْدَةُ عَنْ إِبْرَاهِيمَ عَنْ سَهْمِ بنِ مِنْجَابٍ عَنْ قَزَعَةَ عَنِ الْقَرْثَعِ عَنْ أَبِي أَيُّوبَ الأَنْصَارِيِّ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَحْوَهُ. ","295. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا مُحَمَّدُ بنُ مُسْلِمِ بنِ أَبِي الْوَضَّاحِ عَنْ عَبْدِ الْكَرِيمِ الْجَزَرِيِّ عَنْ مُجَاهِدٍ عَنْ عَبْدِ اللَّهِ بنِ السَّائِبِ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُصَلِّي أَرْبَعًا بَعْدَ أَنْ تَزُولَ الشَّمْسُ قَبْلَ الظُّهْرِ وَقَالَ إِنَّهَا سَاعَةٌ تُفْتَحُ فِيهَا أَبْوَابُ السَّمَاءِ فَأُحِبُّ أَنْ يَصْعَدَ لِي فِيهَا عَمَلٌ صَالِحٌ. ","296. حَدَّثَنَا أَبُو سَلَمَةَ يَحْيَى بنُ خَلَفٍ حَدَّثَنَا عُمَرُ بنُ عَلِيٍّ الْمُقَدَّمِيُّ عَنْ مِسْعَرِ بنِ كِدَامٍ عَنْ أَبِي إِسْحَاقَ عَنْ عَاصِمِ بنِ ضَمْرَةَ عَنْ عَلِيٍّ أَنَّهُ كَانَ يُصَلِّي قَبْلَ الظُّهْرِ أَرْبَعًا وَذَكَرَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُصَلِّيهَا عِنْدَ الزَّوَالِ وَيَمُدُّ فِيهَا. "]},{"id":"section-41","title":"41ـ بَابُ صَلاةِ التَّطَوُّعِ فِي الْبَيْتِ ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["297. حَدَّثَنَا عَبَّاسٌ الْعَنْبَرِيُّ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ عَنْ مُعَاوِيَةَ بنِ صَالِحٍ عَنِ الْعَلاءِ بنِ الْحَارِثِ عَنْ حَرَامِ بنِ مُعَاوِيَةَ عَنْ عَمِّهِ عَبْدِ اللَّهِ بنِ سَعْدٍ قَالَ سَأَلْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنِ الصَّلاةِ فِي بَيْتِي وَالصَّلاةِ فِي الْمَسْجِدِ قَالَ قَدْ تَرَى مَا أَقْرَبَ بَيْتِي مِنَ الْمَسْجِدِ فَلَأَنْ أُصَلِّيَ فِي بَيْتِي أَحَبُّ إِلَيَّ مِنْ أَنْ أُصَلِّيَ فِي الْمَسْجِدِ إِلَّا أَنْ تَكُونَ صَلاةً مَكْتُوبَةً. "]},{"id":"section-42","title":"42ـ  بَابُ مَا جَاءَ فِي صَوْمِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["298. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا حَمَّادُ بنُ زَيْدٍ عَنْ أَيُّوبَ عَنْ عَبْدِ اللَّه بنِ شَقِيقٍ قَالَ سَأَلْتُ عَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا عَنْ صِيَامِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَتْ كَانَ يَصُومُ حَتَّى نَقُولَ قَدْ صَامَ وَيُفْطِرُ حَتَّى نَقُولَ قَدْ أَفْطَرَ قَالَتْ وَمَا صَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَهْرًا كَامِلًا مُنْذُ قَدِمَ الْمَدِينَةَ إِلَّا رَمَضَانَ. ","299. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ أَخْبَرَنَا إِسْمَاعِيلُ بنُ جَعْفَرٍ عَنْ حُمَيْدٍ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّهُ سُئِلَ عَنْ صَوْمِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ كَانَ يَصُومُ مِنَ الشَّهْرِ حَتَّى نَرَى أَنْ لا يُرِيدُ أَنْ يُفْطِرَ مِنْهُ وَيُفْطِرُ حَتَّى نَرَى أَنَّهُ لا يُرِيدُ أَنْ يَصُومَ مِنْهُ شَيْئًا وَكُنْتَ لا تَشَاءُ أَنْ تَرَاهُ مِنَ اللَّيْلِ مُصَلِّيًا إِلَّا رَأَيْتَهُ مُصَلِّيًا وَلا نَائِمًا إِلَّا رَأَيْتَهُ نَائِمًا. ","300. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ أَنْبَأَنَا شُعْبَةُ عَنْ أَبِي بِشْرٍ قَالَ سَمِعْتُ سَعِيدَ بنَ جُبَيْرٍ عَنِ ابْنِ عَبَّاسٍ قَالَ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ حَتَّى نَقُولَ مَا يُرِيدُ أَنْ يُفْطِرَ مِنْهُ وَيُفْطِرُ حَتَّى نَقُولَ مَا يُرِيدُ أَنْ يَصُومَ وَمَا صَامَ شَهْرًا كَامِلًا مُنْذُ قَدِمَ الْمَدِينَةَ إِلَّا رَمَضَانَ. ","301. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ عَنْ سُفْيَانَ عَنْ مَنْصُورٍ عَنْ سَالِمِ بنِ أَبِي الْجَعْدِ عَنْ أَبِي سَلَمَةَ عَنْ أُمِّ سَلَمَةَ قَالَتْ مَا رَأَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ شَهْرَيْنِ مُتَتَابِعَيْنِ إِلَّا شَعْبَانَ وَرَمَضَانَ. قَالَ أَبُو عِيسَى هَذَا الإِسنَادُ صَحِيحٌ وَهَكَذَا قَالَ عَنْ أَبِي سَلَمَةَ عَنْ أُمِّ سَلَمَةَ وَرَوَى هَذَا الْحَدِيثَ غَيْرُ وَاحِدٍ عَنْ أَبِي سَلَمَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَيَحْتَمِلُ أَنْ يَكُونَ أَبُو سَلَمَةَ بنُ عَبْدِ الرَّحْمٰنِ قَدْ رَوَى هَذَا الْحَدِيثَ عَنْ عَائِشَةَ وَأُمِّ سَلَمَةَ جَمِيعًا عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","302. حَدَّثَنَا هَنَّادٌ حَدَّثَن

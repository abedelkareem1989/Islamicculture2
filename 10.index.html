<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6b55" />
  <meta name="description" content="تطبيق تفاعلي لقراءة متن الشمائل المحمدية" />
  <title>الشمائل المحمدية | قارئ تفاعلي</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <style>
    :root{
      --emerald:#0f6b55;
      --emerald-2:#0b5645;
      --emerald-soft:#e8f4ef;
      --gold:#b78a38;
      --gold-soft:#f7edd9;
      --bg:#f7f3ea;
      --surface:#fffdf8;
      --surface-2:#f2ede3;
      --text:#20312c;
      --muted:#6d7773;
      --border:#ded8cb;
      --shadow:0 12px 35px rgba(31,54,47,.10);
      --shadow-sm:0 7px 20px rgba(31,54,47,.08);
      --reader-size:22px;
      --reader-font:'Amiri',serif;
      --radius:22px;
      --header-h:76px;
    }

    [data-theme="dark"]{
      --bg:#101815;
      --surface:#17231f;
      --surface-2:#1e2d28;
      --text:#edf4f1;
      --muted:#aab8b3;
      --border:#30423c;
      --emerald-soft:#18352d;
      --gold-soft:#352d1e;
      --shadow:0 12px 35px rgba(0,0,0,.24);
      --shadow-sm:0 7px 20px rgba(0,0,0,.18);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:'Cairo',sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(183,138,56,.09), transparent 26rem),
        radial-gradient(circle at 100% 20%, rgba(15,107,85,.09), transparent 28rem),
        var(--bg);
      transition:background .25s,color .25s;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.025;
      background-image:
        linear-gradient(45deg,var(--emerald) 25%,transparent 25%),
        linear-gradient(-45deg,var(--emerald) 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,var(--gold) 75%),
        linear-gradient(-45deg,transparent 75%,var(--gold) 75%);
      background-size:42px 42px;
      background-position:0 0,0 21px,21px -21px,-21px 0;
      z-index:-1;
    }

    button,input,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .hidden{display:none!important}

    .app-header{
      height:var(--header-h);
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      align-items:center;
      backdrop-filter:blur(18px);
      background:color-mix(in srgb,var(--surface) 90%,transparent);
      border-bottom:1px solid color-mix(in srgb,var(--border) 78%,transparent);
    }
    .header-inner{
      width:min(1200px,calc(100% - 32px));
      margin:auto;
      display:flex;
      align-items:center;
      gap:18px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:max-content;
      font-weight:800;
    }
    .brand-mark{
      width:44px;height:44px;border-radius:14px;
      display:grid;place-items:center;
      color:white;
      background:linear-gradient(145deg,var(--emerald),var(--emerald-2));
      box-shadow:0 8px 20px rgba(15,107,85,.25);
      font-size:20px;
    }
    .brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:-2px}
    .top-nav{display:flex;gap:6px;margin-inline-start:auto}
    .nav-btn{
      border:0;background:transparent;color:var(--muted);
      border-radius:13px;padding:10px 14px;
      display:flex;align-items:center;gap:8px;
      transition:.2s;
    }
    .nav-btn:hover,.nav-btn.active{background:var(--emerald-soft);color:var(--emerald)}
    .header-search-btn{
      width:44px;height:44px;border:1px solid var(--border);border-radius:14px;
      background:var(--surface);color:var(--text);
      display:grid;place-items:center;
      transition:.2s;
    }
    .header-search-btn:hover{transform:translateY(-1px);border-color:var(--gold)}

    main{
      width:min(1200px,calc(100% - 32px));
      margin:0 auto;
      padding:34px 0 90px;
    }

    .hero{
      position:relative;
      overflow:hidden;
      border-radius:30px;
      padding:42px;
      color:#fff;
      background:
        linear-gradient(135deg,rgba(9,74,58,.96),rgba(15,107,85,.92)),
        var(--emerald);
      box-shadow:var(--shadow);
      margin-bottom:28px;
    }
    .hero::after{
      content:"✦";
      position:absolute;
      inset-inline-start:36px;
      top:8px;
      font-size:160px;
      line-height:1;
      opacity:.06;
      transform:rotate(12deg);
    }
    .eyebrow{
      display:inline-flex;align-items:center;gap:7px;
      color:#ffe9b8;background:rgba(255,255,255,.09);
      padding:7px 12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;
      font-size:13px;margin-bottom:14px;
    }
    .hero h1{font-family:'Amiri',serif;font-size:clamp(34px,6vw,58px);margin:0 0 10px;line-height:1.25}
    .hero p{margin:0;max-width:760px;color:rgba(255,255,255,.82);line-height:1.9}
    .hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
    .stat-pill{
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;padding:10px 14px;
      display:flex;gap:8px;align-items:center;font-size:13px
    }

    .search-box{
      margin:22px 0 12px;
      position:relative;
    }
    .search-box i{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .search-box input{
      width:100%;height:58px;border:1px solid var(--border);border-radius:18px;
      background:var(--surface);color:var(--text);
      padding:0 52px 0 18px;outline:none;
      box-shadow:var(--shadow-sm);
      transition:.2s;
    }
    .search-box input:focus{border-color:var(--emerald);box-shadow:0 0 0 4px color-mix(in srgb,var(--emerald) 12%,transparent)}

    .section-head{
      display:flex;align-items:end;justify-content:space-between;gap:16px;
      margin:30px 0 16px;
    }
    .section-head h2{margin:0;font-size:24px}
    .section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}

    .continue-card{
      display:flex;align-items:center;gap:16px;
      padding:18px;border:1px solid var(--border);border-radius:20px;background:var(--surface);
      box-shadow:var(--shadow-sm);margin:18px 0;
    }
    .continue-icon{width:46px;height:46px;border-radius:15px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
    .continue-card .grow{flex:1;min-width:0}
    .continue-card strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .continue-card span{font-size:12px;color:var(--muted)}
    .primary-btn,.secondary-btn,.icon-btn{
      border:0;border-radius:13px;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    }
    .primary-btn{background:var(--emerald);color:#fff;padding:10px 16px}
    .primary-btn:hover{background:var(--emerald-2);transform:translateY(-1px)}
    .secondary-btn{background:var(--surface-2);color:var(--text);padding:10px 16px}
    .secondary-btn:hover{transform:translateY(-1px)}
    .icon-btn{width:42px;height:42px;background:var(--surface-2);color:var(--text)}
    .icon-btn:hover{transform:translateY(-1px);color:var(--emerald)}

    .cards-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }
    .topic-card{
      position:relative;overflow:hidden;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--surface);
      padding:20px;
      min-height:210px;
      display:flex;flex-direction:column;
      box-shadow:var(--shadow-sm);
      transition:transform .22s,box-shadow .22s,border-color .22s;
      isolation:isolate;
    }
    .topic-card::before{
      content:"";
      position:absolute;
      width:110px;height:110px;border-radius:50%;
      inset-inline-end:-45px;top:-45px;
      background:var(--emerald-soft);
      z-index:-1;
    }
    .topic-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--emerald) 38%,var(--border))}
    .topic-card:active{transform:scale(.985)}
    .card-icon{
      width:48px;height:48px;border-radius:15px;
      background:linear-gradient(145deg,var(--emerald-soft),var(--gold-soft));
      display:grid;place-items:center;font-size:23px;margin-bottom:16px;
    }
    .topic-card h3{
      margin:0 0 8px;font-family:'Amiri',serif;font-size:22px;line-height:1.6;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .topic-card p{
      margin:0;color:var(--muted);font-size:13px;line-height:1.8;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .card-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:16px}
    .meta-chip{font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:6px 9px;display:flex;gap:6px;align-items:center}
    .fav-mini{
      position:absolute;top:14px;inset-inline-start:14px;width:35px;height:35px;border:0;border-radius:11px;
      background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted);z-index:2;
    }
    .fav-mini.active{color:#d59a20;background:var(--gold-soft)}

    .ripple-ink{
      position:absolute;border-radius:50%;transform:scale(0);
      background:rgba(255,255,255,.35);animation:ripple .55s linear;pointer-events:none;
    }
    @keyframes ripple{to{transform:scale(4);opacity:0}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .fade-up{animation:fadeUp .32s ease both}

    /* Reader */
    .reading-progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--emerald));width:0;z-index:100;transition:width .08s linear}
    .reader-shell{max-width:920px;margin:auto}
    .reader-top{
      display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;
    }
    .back-btn{border:0;background:transparent;color:var(--muted);padding:8px 0;display:flex;gap:8px;align-items:center}
    .reader-tools{
      position:sticky;top:calc(var(--header-h) + 10px);z-index:20;
      background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
      border:1px solid var(--border);border-radius:18px;padding:8px;
      display:flex;flex-wrap:wrap;gap:7px;box-shadow:var(--shadow-sm);margin-bottom:16px;
    }
    .reader-tools button{border:0;background:var(--surface-2);color:var(--text);padding:9px 12px;border-radius:11px;display:flex;gap:7px;align-items:center}
    .reader-tools button:hover{color:var(--emerald)}
    .reader-tools .favorite.active{color:#d59a20;background:var(--gold-soft)}
    .reader-hero{
      border:1px solid var(--border);
      background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--emerald-soft) 55%,var(--surface)));
      border-radius:26px;padding:28px;margin-bottom:16px;box-shadow:var(--shadow-sm)
    }
    .reader-hero h1{font-family:'Amiri',serif;font-size:clamp(28px,5vw,44px);line-height:1.55;margin:0;white-space:pre-wrap}
    .reader-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .reader-stat{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 10px}
    .reader-content{
      background:var(--surface);border:1px solid var(--border);border-radius:26px;
      padding:clamp(22px,5vw,48px);box-shadow:var(--shadow-sm);
      font-family:var(--reader-font);font-size:var(--reader-size);
      line-height:2.15;
    }
    .reader-content p{margin:0 0 1.15em;text-align:justify;white-space:pre-wrap}
    .reader-content p:last-child{margin-bottom:0}
    .hadith-number{color:var(--gold);font-weight:700}
    .back-top{
      position:fixed;left:22px;bottom:24px;width:48px;height:48px;border:0;border-radius:16px;
      background:var(--emerald);color:white;box-shadow:var(--shadow);display:grid;place-items:center;
      opacity:0;visibility:hidden;transform:translateY(10px);transition:.2s;z-index:40;
    }
    .back-top.show{opacity:1;visibility:visible;transform:none}

    /* Favorites and settings */
    .page-title{margin:2px 0 24px}
    .page-title h1{font-size:32px;margin:0 0 6px}
    .page-title p{margin:0;color:var(--muted)}
    .empty-state{
      border:1px dashed var(--border);border-radius:24px;background:var(--surface);
      min-height:260px;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)
    }
    .empty-state i{font-size:40px;color:var(--gold);margin-bottom:12px}
    .settings-wrap{max-width:760px;margin:auto}
    .settings-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:var(--shadow-sm);margin-bottom:14px}
    .setting-row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--border)}
    .setting-row:last-child{border-bottom:0}
    .setting-info strong{display:block}
    .setting-info small{color:var(--muted)}
    .setting-control select{
      background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:9px 12px;outline:none;min-width:170px
    }
    .range-wrap{display:flex;align-items:center;gap:10px;min-width:220px}
    input[type="range"]{accent-color:var(--emerald);width:160px}
    .theme-switch{
      width:58px;height:32px;border:0;border-radius:999px;background:var(--surface-2);position:relative;border:1px solid var(--border)
    }
    .theme-switch::after{
      content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:var(--gold);
      top:3px;right:4px;transition:.22s;
    }
    [data-theme="dark"] .theme-switch::after{right:28px;background:#e8d08e}

    /* Search modal */
    .modal{
      position:fixed;inset:0;z-index:120;background:rgba(8,18,14,.56);backdrop-filter:blur(5px);
      display:flex;justify-content:center;align-items:flex-start;padding:7vh 16px 24px;
    }
    .modal-panel{
      width:min(760px,100%);max-height:86vh;overflow:hidden;background:var(--surface);
      border:1px solid var(--border);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.28);
      display:flex;flex-direction:column;
    }
    .modal-search{padding:14px;border-bottom:1px solid var(--border);display:flex;gap:10px}
    .modal-search input{
      flex:1;border:0;outline:none;background:var(--surface-2);color:var(--text);border-radius:14px;padding:12px 14px
    }
    .modal-close{width:44px;border:0;border-radius:14px;background:var(--surface-2);color:var(--text)}
    .search-results{overflow:auto;padding:10px}
    .search-result{
      display:block;width:100%;text-align:right;border:0;background:transparent;color:var(--text);
      padding:14px;border-radius:14px;border-bottom:1px solid var(--border)
    }
    .search-result:last-child{border-bottom:0}
    .search-result:hover{background:var(--emerald-soft)}
    .search-result strong{font-family:'Amiri',serif;font-size:19px;display:block;margin-bottom:5px}
    .search-result span{font-size:12px;color:var(--muted);line-height:1.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    mark{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px}

    .toast{
      position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
      background:#1d2925;color:#fff;border-radius:14px;padding:11px 16px;z-index:200;
      opacity:0;visibility:hidden;transition:.2s;box-shadow:var(--shadow);font-size:13px;
    }
    .toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

    .mobile-nav{display:none}

    @media (max-width:900px){
      .cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .top-nav{display:none}
      .header-inner{width:min(100% - 24px,1200px)}
    }
    @media (max-width:640px){
      :root{--header-h:66px}
      main{width:min(100% - 22px,1200px);padding-top:20px;padding-bottom:110px}
      .brand-mark{width:40px;height:40px}
      .brand strong{font-size:14px}.brand small{display:none}
      .hero{padding:28px 22px;border-radius:24px}
      .hero p{font-size:13px}
      .cards-grid{grid-template-columns:1fr}
      .topic-card{min-height:185px}
      .reader-tools{top:calc(var(--header-h) + 7px);overflow-x:auto;flex-wrap:nowrap}
      .reader-tools button{white-space:nowrap}
      .reader-content{text-align:right;padding:22px 18px}
      .reader-content p{text-align:right}
      .continue-card{align-items:flex-start;flex-wrap:wrap}
      .continue-card .primary-btn{width:100%}
      .setting-row{align-items:flex-start;flex-direction:column}
      .setting-control,.setting-control select,.range-wrap{width:100%}
      .range-wrap input{flex:1}
      .mobile-nav{
        display:grid;grid-template-columns:repeat(3,1fr);position:fixed;right:12px;left:12px;bottom:12px;z-index:70;
        background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);
        border:1px solid var(--border);border-radius:20px;padding:7px;box-shadow:var(--shadow);
      }
      .mobile-nav button{border:0;background:transparent;color:var(--muted);padding:7px 3px;border-radius:13px;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}
      .mobile-nav button.active{background:var(--emerald-soft);color:var(--emerald)}
      .back-top{left:18px;bottom:92px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <div id="readingProgress" class="reading-progress hidden"></div>

  <header class="app-header">
    <div class="header-inner">
      <a href="#home" class="brand" aria-label="الصفحة الرئيسية">
        <span class="brand-mark"><i class="fa-solid fa-book-quran"></i></span>
        <span><strong>الشمائل المحمدية</strong><small>قارئ تفاعلي</small></span>
      </a>

      <nav class="top-nav" aria-label="التنقل الرئيسي">
        <button class="nav-btn" data-route="home"><i class="fa-solid fa-house"></i> الرئيسية</button>
        <button class="nav-btn" data-route="favorites"><i class="fa-solid fa-bookmark"></i> المفضلة</button>
        <button class="nav-btn" data-route="settings"><i class="fa-solid fa-gear"></i> الإعدادات</button>
      </nav>

      <button id="openSearch" class="header-search-btn" aria-label="بحث">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <button id="backTop" class="back-top" aria-label="العودة إلى الأعلى">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <nav class="mobile-nav" aria-label="التنقل على الهاتف">
    <button data-route="home"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
    <button data-route="favorites"><i class="fa-solid fa-bookmark"></i><span>المفضلة</span></button>
    <button data-route="settings"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></button>
  </nav>

  <div id="searchModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="البحث">
    <div class="modal-panel">
      <div class="modal-search">
        <input id="modalSearchInput" type="search" placeholder="ابحث في عناوين الأبواب ومحتواها..." autocomplete="off" />
        <button id="closeSearch" class="modal-close" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const SECTIONS = [{"id":"section-0","title":"مقدمة الكتاب","description":"مقدمة الكتاب كما وردت في المصدر.","paragraphs":["الشَّمَائِلُ الْمُحَمَّدِيَّةُ","الْحَمْدُ لِلَّهِ وَسَلامٌ عَلَى عِبَادِهِ الَّذِينَ اصْطَفَى","قَالَ الشَّيْخُ الْحَافِظُ أَبُو عِيسَى مُحَمَّدُ بنُ عِيسَى بنِ سَوْرَةَ التِّرْمِذِىُّ رَحِمَهُ اللَّه."]},{"id":"section-1","title":"بَابُ صِفَةِ خَلْقِ رَسُولِ اللَّهِ صَلَّى اللَّه عَلَيْهِ وَءَالِهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["1. أَخْبَرَنَا أَبُو رَجَاءٍ قُتَيْبَةُ بنُ سَعِيدٍ عَنْ مَالِكِ بنِ أَنَسٍ عَنْ رَبِيعَةَ بنِ أَبِى عَبْدِ الرَّحْمٰنِ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّهُ سَمِعَهُ يَقُولُ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ لَيْسَ بِالطَّوِيلِ الْبَائِنِ وَلا بِالْقَصِيرِ وَلا بِالأَبْيَضِ الأَمْهَقِ وَلا بِالآدَمِ وَلا بِالْجَعْدِ الْقَطَطِ وَلا بِالسَّبْطِ بَعَثَهُ اللَّهُ تَعَالَى عَلَى رَأْسِ أَرْبَعِينَ سَنَةً فَأَقَامَ بِمَكَّةَ عَشْرَ سِنِينَ وَبِالْمَدِينَةِ عَشْرَ سِنِينَ وَتَوَفَّاهُ اللَّهُ عَلَى رَأْسِ سِتِّينَ سَنَةً وَلَيْسَ فِى رَأْسِهِ وَلِحْيَتِهِ عِشْرُونَ شَعْرَةً بَيْضَاءَ.  ","2. حَدَّثَنَا حُمَيْدُ بنُ مَسْعَدَةَ الْبِصْرِىُّ حَدَّثَنَا عَبْدُ الْوَهَّابِّ الثَّقَفِىُّ عَنْ حُمَيْدٍ عَنْ أَنَسِ بنِ مَالِكٍ رَضِىَ اللَّه عَنْهُ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ رَبْعَةً وَلَيْسَ بِالطَّوِيلِ وَلا بِالْقَصِيرِ حَسَنَ الْجِسْمِ وَكَانَ شَعْرُهُ لَيْسَ بِجَعْدٍ وَلا سَبْطٍ أَسْمَرَ اللَّوْنِ إِذَا مَشَى يَتَكَفَّأُ. ","3. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ الْعَبْدِىُّ حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ أَبِى إِسْحَاقَ قَالَ سَمِعْتُ الْبَرَاءَ بنَ عَازِبٍ يَقُولُ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ رَجُلا مَرْبُوعًا بَعِيدَ مَا بَيْنَ الْمَنْكِبَيْنِ عَظِيمَ الْجُمَّةِ إِلَى شَحْمَةِ أُذُنَيْهِ عَلَيْهِ حُلَّةٌ حَمْرَاءُ مَا رَأَيْتُ شَيْئًا قَطُّ أَحْسَنَ مِنْهُ. ","4. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ قَالَ حَدَّثَنَا وَكِيعٌ حَدَّثَنَا سُفْيَانُ عَنْ أَبِى إِسْحَاقَ عَنِ الْبَرَاءِ بنِ عَازِبٍ قَالَ مَا رَأَيْتُ مِنْ ذِى لِمَّةٍ فِى حُلَّةٍ حَمْرَاءَ أَحْسَنَ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ لَهُ شَعَرٌ يَضْرِبُ مَنْكِبَيْهِ بَعِيدُ مَا بَيْنَ الْمَنْكِبَيْنِ لَمْ يَكُنْ بِالْقَصِيرِ وَلا بِالطَّوِيلِ. ","5. حَدَّثَنَا مُحَمَّدُ بنُ إِسْمَاعِيلَ حَدَّثَنَا أَبُو نُعَيْمٍ حَدَّثَنَا الْمَسْعُودِىُّ عَنْ عُثْمَانَ بنِ مُسْلِمِ بنِ هُرْمُزٍ عَنْ نَافِعِ بنِ جُبَيْرِ بنِ مُطْعِمٍ عَنْ عَلِىِّ بنِ أَبِى طَالِبٍ رَضِىَ اللَّه عَنْهُ قَالَ لَمْ يَكُنِ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ بِالطَّوِيلِ وَلا بِالْقَصِيرِ شَثْنُ الْكَفَّيْنِ وَالْقَدَمَيْنِ ضَخْمُ الرَّأْسِ ضَخْمُ الْكَرَادِيسِ طَوِيلُ الْمَسْرُبَةِ إِذَا مَشَى تَكَفَّأَ تَكَفُّؤًا كَأَنَّمَا يَنْحَطُّ مِنْ صَبَبٍ لَمْ أَرَ قَبْلَهُ وَلا بَعْدَهُ مِثْلَهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.","6. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا أَبِى عَنِ الْمَسْعُودِىِّ بِهَذَا الإِسْنَادِ نَحْوَهُ بِمَعْنَاهُ.","7. حَدَّثَنَا أَحْمَدُ بنُ عَبْدَةَ الضَّبِّىُّ الْبَصْرِىُّ وَعَلِىُّ بنُ حُجْرٍ وَأَبُو جَعْفَرٍ مُحَمَّدُ بنُ الْحُسَيْنِ وَهُوَ ابْنُ أَبِى حَلِيمَةَ الْمَعْنَى وَاحِدٌ قَالُوا حَدَّثَنَا عِيسَى بنُ يُونُسَ عَنْ عُمَرَ بنِ عَبْدِ اللَّهِ مَوْلَى غُفْرَةَ قَالَ حَدَّثَنِى إِبْرَاهِيمُ بنُ مُحَمَّدٍ مِنْ وُلْدِ عَلِىِّ بنِ أَبِى طَالِبٍ رَضِىَ اللَّهُ عَنْهُ قَالَ كَانَ عَلِىٌّ إِذَا وَصَفَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ قَالَ لَمْ يَكُنْ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ بِالطَّوِيلِ الْمُمَّغِطِ وَلا بِالْقَصِيرِ الْمُتَرَدِّدِ وَكَانَ رَبْعَةً مِنَ الْقَوْمِ وَلَمْ يَكُنْ بِالْجَعْدِ الْقَطِطِ وَلا بِالسَّبْطِ كَانَ جَعْدًا رَجِلًا وَلَمْ يَكُنْ بِالْمُطَهَّمِ وَلا بِالْمُكَلْثَمِ وَكَانَ فِى وَجْهِهِ تَدْوِيرٌ أَبْيَضُ مُشْرَبٌ أَدْعَجُ الْعَيْنَيْنِ أَهْدَبُ الأَشْفَارِ جَلِيلُ الْمُشَاشِ وَالْكَتِدِ أَجْرَدُ ذُو مَسْرُبَةٍ شَثْنُ الْكَفَّيْنِ وَالْقَدَمَيْنِ إِذَا مَشَى تَقَلَّعَ كَأَنَّمَا يَنْحَطُّ فِى صَبَبٍ وَإِذَا الْتَفَتَ الْتَفَتَ مَعًا بَيْنَ كَتِفَيْهِ خَاتَمُ النُّبُوَّةِ وَهُوَ خَاتَمُ النَّبِيِّينَ أَجْوَدُ النَّاسِ صَدْرًا وَأَصْدَقُ النَّاسِ لَهْجَةً وَأَلْيَنُهُمْ عَرِيكَةً وَأَكْرَمُهُمْ عِشْرَةً مَنْ رَءَاهُ بَدِيهَةً هَابَهُ وَمَنْ خَالَطَهُ مَعْرِفَةً أَحَبَّهُ يَقُولُ نَاعِتُهُ لَمْ أَرَ قَبْلَهُ وَلا بَعْدَهُ مِثْلَهُ.","قَالَ أَبُو عِيسَى سَمِعْتُ أَبَا جَعْفَرٍ مُحَمَّدَ بنَ الْحُسَيْنِ يَقُولُ سَمِعْتُ الأَصْمَعِىَّ يَقُولُ فِى تَفْسِيرِ صِفَةِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ الْمُمَّغِطُ الذَّاهِبُ طُولًا قَالَ وَسَمِعْتُ أَعْرَابِيًّا يَقُولُ فِى كَلامِهِ تَمَغَّطَ فِى نُشَّابَتِهِ أَىْ مَدَّهَا مَدًّا شَدِيدًا. وَالْمُتَرَدِّدُ الدَّاخِلُ بَعْضُهُ فِى بَعْضٍ قِصَرًا. وَأَمَّا الْقَطِطُ فَالشَّدِيدُ الْجُعُودَةِ. وَالرَّجِلُ الَّذِى فِى شَعْرِهِ حُجُونَةٌ أَىْ تَثَنٍّ قَلِيلًا. وَأَمَّا الْمُطَهَّمُ فَالْبَادِنُ الْكَثِيرُ اللَّحْمِ. وَالْمُكَلْثَمُ الْمُدَوَّرُ الْوَجْهِ. وَالْمُشْرَبُ الَّذِى فِى بَيَاضِهِ حُمْرَةٌ. وَالأَدْعَجُ الشَّدِيدُ سَوَادِ الْعَيْنِ. وَالأَهْدَبُ الطَّوِيلُ الأَشْفَارِ. وَالْكَتِدُ مُجْتَمَعُ الْكَتِفَيْنِ وَهُوَ الْكَاهِلُ. وَالْمَسْرُبَةُ هُوَ الشَّعْرُ الدَّقِيقُ الَّذِى كَأَنَّهُ قَضِيبٌ مِنَ الصَّدْرِ إِلَى السُّرَّةِ. وَالشَّثْنُ الْغَلِيظُ الأَصَابِعِ مِنَ الْكَفَّيْنِ وَالْقَدَمَيْنِ. وَالتَّقَلُّعُ أَنْ يَمْشِىَ بِقُوَّةٍ وَالصَّبَبُ الْحُدُورُ تَقُولُ انْحَدَرْنَا فِى صَبُوبٍ وَصَبَبٍ وَقَوْلُهُ جَلِيلُ الْمُشَاشِ يُرِيدُ رُؤُوسَ الْمَنَاكِبِ. وَالْعِشْرَةُ الصُّحْبَةُ وَالْعَشِيرُ الصَّاحِبُ وَالْبَدِيهَةُ الْمُفَاجَأَةُ يُقَالُ بَدَهْتُهُ بِأَمْرٍ أَىْ فَجَأْتُهُ.","8. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ قَالَ حَدَّثَنَا جُمَيْعُ بنُ عُمَرَ بنِ عَبْدِ الرَّحْمٰنِ الْعِجْلِىُّ إِمْلاءً عَلَيْنَا مِنْ كِتَابِهِ قَالَ حَدَّثَنِى رَجُلٌ مِنْ بَنِى تَمِيمٍ مِنْ وَلَدِ أَبِى هَالَةَ زَوْجِ خَدِيجَةَ يُكْنَى أَبَا عَبْدِ اللَّهِ عَنِ ابْنِ أَبِى هَالَةَ عَنِ الْحَسَنِ بنِ عَلِىٍّ رَضِىَ اللَّه عَنْهُمَا قَالَ سَأَلْتُ خَالِى هِنْدَ بنَ أَبِى هَالَةَ وَكَانَ وَصَّافًا عَنْ حِلْيَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا أَشْتَهِى أَنْ يَصِفَ لِى مِنْهَا شَيْئًا أَتَعَلَّقُ بِهِ فَقَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَخْمًا مُفَخَّمًا يَتَلَأْلَأُ وَجْهُهُ تَلَأْلُؤَ الْقَمَرِ لَيْلَةَ الْبَدْرِ أَطْوَلَ مِنَ الْمَرْبُوعِ وَأَقْصَرَ مِنَ الْمُشَذَّبِ عَظِيمَ الْهَامَةِ رَجِلَ الشَّعْرِ إِنِ انْفَرَقَتْ عَقِيقَتُهُ فَرَقَ وَإِلَّا فَلا. يُجَاوِزُ شَعْرُهُ شَحْمَةَ أُذُنَيْهِ إِذَا هُوَ وَفَّرَهُ أَزْهَرَ اللَّوْنِ وَاسِعَ الْجَبِينِ أَزَجَّ الْحَوَاجِبِ سَوَابِغَ مِنْ غَيْرِ قَرَنٍ بَيْنَهُمَا عِرْقٌ يُدِرُّهُ الْغَضَبُ أَقْنَى الْعِرْنِينِ لَهُ نُورٌ يَعْلُوهُ يَحْسَبُهُ مَنْ لَمْ يَتَأَمَّلْهُ أَشَمَّ كَثَّ اللِّحْيَةِ سَهْلَ الْخَدَّيْنِ ضَلِيعَ الْفَمِ مُفَلَّجَ الأَسْنَانِ دَقِيقَ الْمَسْرُبَةِ كَأَنَّ عُنُقَهُ جِيدُ دُمْيَةٍ فِى صَفَاءِ الْفِضَّةِ مُعْتَدِلَ الْخَلْقِ بَادِنٌ مُتَمَاسِكٌ سَوَاءُ الْبَطْنِ وَالصَّدْرِ عَرِيضُ الصَّدْرِ بَعِيدُ مَا بَيْنَ الْمَنْكِبَيْنِ ضَخْمُ الْكَرَادِيسِ أَنْوَرُ الْمُتَجَرَّدِ مَوْصُولُ مَا بَيْنَ اللَّبَّةِ وَالسُّرَّةِ بِشَعْرٍ يَجْرِى كَالْخَطِّ عَارِى الثَّدْيَيْنِ وَالْبَطْنِ مِمَّا سِوَى ذَلِكَ أَشْعَرُ الذِّرَاعَيْنِ وَالْمَنْكِبَيْنِ وَأَعَالِى الصَّدْرِ طَوِيلُ الزَّنْدَيْنِ رَحْبُ الرَّاحَةِ شَثْنُ الْكَفَّيْنِ وَالْقَدَمَيْنِ سَائِلُ الأَطْرَافِ أَوْ قَالَ شَائِلُ الأَطْرَافِ خُمْصَانُ الأَخْمَصَيْنِ مَسِيحُ الْقَدَمَيْنِ يَنْبُو عَنْهُمَا الْمَاءُ إِذَا زَالَ زَالَ قَلْعًا يَخْطُو تَكَفِّيًا وَيَمْشِى هَوْنًا ذَرِيعُ الْمِشْيَةِ إِذَا مَشَى كَأَنَّمَا يَنْحَطُّ مِنْ صَبَبٍ وَإِذَا الْتَفَتَ الْتَفَتَ جَمِيعًا خَافِضُ الطَّرْفِ نَظَرُهُ إِلَى الأَرْضِ أَطْوَلُ مِنْ نَظَرِهِ إِلَى السَّمَاءِ جُلُّ نَظَرِهِ الْمُلاحَظَةُ يَسُوقُ أَصْحَابَهُ يَبْدَأُ مَنْ لَقِىَ بِالسَّلامِ. ","9. حَدَّثَنَا أَبُو مُوسَى مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ سِمَاكِ بنِ حَرْبٍ قَالَ سَمِعْتُ جَابِرَ بنَ سَمُرَةَ يَقُولُ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ ضَلِيعَ الْفَمِ أَشْكَلَ الْعَيْنِ مَنْهُوسَ الْعَقِبِ. ","قَالَ شُعْبَةُ قُلْتُ لِسِمَاكٍ مَا ضَلِيعُ الْفَمِ قَالَ عَظِيمُ الْفَمِ قُلْتُ مَا أَشْكَلُ الْعَيْنِ قَالَ طَوِيلُ شَقِّ الْعَيْنِ. قُلْتُ مَا مَنْهُوسُ الْعَقِبِ قَالَ قَلِيلُ لَحْمِ الْعَقِبِ. ","10. حَدَّثَنَا هَنَّادُ بنُ السَّرِىِّ حَدَّثَنَا عَبْثَرُ بنُ الْقَاسِمِ عَنْ أَشْعَثَ يَعْنِى ابْنَ سَوَّارٍ عَنْ أَبِى إِسْحَاقَ عَنْ جَابِرِ بنِ سَمُرَةَ قَالَ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِى لَيْلَةِ إِضْحِيَانٍ وَعَلَيْهِ حُلَّةٌ حَمْرَاءُ فَجَعَلْتُ أَنْظُرُ إِلَيْهِ وَإِلَى الْقَمَرِ فَلَهُوَ عِنْدِى أَحْسَنُ مِنَ الْقَمَرِ صَلَوَاتُ اللَّهِ عَلَيْهِ. ","11. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا حُمَيْدُ بنُ عَبْدِ الرَّحْمٰنِ الرُّؤَاسِىُّ عَنْ زُهَيْرٍ عَنْ أَبِى إِسْحَاقَ قَالَ سَأَلَ رَجُلٌ الْبَرَاءَ بنَ عَازِبٍ أَكَانَ وَجْهُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِثْلَ السَّيْفِ قَالَ لا مِثْلَ الْقَمَرِ. ","12. حَدَّثَنَا أَبُو دَاوُدَ الْمَصَاحِفِىُّ سُلَيْمَانُ بنُ سَلْمٍ أَخْبَرَنَا النَّضْرُ بنُ شُمَيْلٍ عَنْ صَالِحِ بنِ أَبِى الأَخْضَرِ عَنِ ابْنِ شِهَابٍ عَنْ أَبِى سَلَمَةَ عَنْ أَبِى هُرَيْرَةَ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَبْيَضَ كَأَنَّمَا صِيغَ مِنْ فِضَّةٍ رَجِلَ الشَّعْرِ. ","13. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ قَالَ حَدَّثَنَا اللَّيْثُ بنُ سَعْدٍ عَنْ أَبِى الزُّبَيْرِ عَنْ جَابِرِ بنِ عَبْدِ اللَّه رَضِىَ اللَّه عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ عُرِضَ عَلَىَّ الأَنْبِيَاءُ فَإِذَا مُوسَى ضَرْبٌ مِنَ الرِّجَالِ كَأَنَّهُ مِنْ رِجَالِ شَنُوءَةَ وَرَأَيْتُ عِيسَى بنَ مَرْيَمَ عَلَيْهِ السَّلامُ فَإِذَا أَقْرَبُ مَنْ رَأَيْتُ بِهِ شَبَهًا عُرْوَةُ بنُ مَسْعُودٍ وَرَأَيْتُ إِبْرَاهِيمَ فَإِذَا أَقْرَبُ مَنْ رَأَيْتُ بِهِ شَبَهًا صَاحِبُكُمْ يَعْنِى نَفْسَهُ وَرَأَيْتُ جِبْرِيلَ فَإِذَا أَقْرَبُ مَنْ رَأَيْتُ بِهِ شَبَهًا دِحْيَةُ. ","14. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ وَمُحَمَّدُ بنُ بَشَّارٍ الْمَعْنَى وَاحِدٌ قَالا حَدَّثَنَا يَزِيدُ بنُ هَارُونَ عَنْ سَعِيدٍ الْجُرَيْرِىِّ قَالَ سَمِعْتُ أَبَا الطُّفَيْلِ يَقُولُ رَأَيْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَمَا بَقِىَ عَلَى وَجْهِ الأَرْضِ أَحَدٌ رَءَاهُ غَيْرِى قُلْتُ صِفْهُ لِى قَالَ كَانَ أَبْيَضَ مَلِيحًا مُقَصَّدًا صَلَوَاتُ اللَّهِ وَسَلامُهُ عَلَيْهِ. ","15. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا إِبْرَاهِيمُ بنُ الْمُنْذِرِ أَخْبَرَنَا عَبْدُ الْعَزِيزِ بنُ ثَابِتٍ الزُّهْرِىُّ حَدَّثَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ ابْنُ أَخِى مُوسَى بنِ عُقْبَةَ عَنْ مُوسَى بنِ عُقْبَةَ عَنْ كُرَيْبٍ عَنِ ابْنِ عَبَّاسٍ رَضِىَ اللَّهُ عَنْهُمَا قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ أَفْلَجَ الثَّنِيَّتَيْنِ إِذَا تَكَلَّمَ رُئِىَ كَالنُّورِ يَخْرُجُ مِنْ بَيْنِ ثَنَايَاهُ. "]},{"id":"section-2","title":"بَابُ مَا جَاءَ فِى خَاتَمِ النُّبُوَّةِ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["16. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا حَاتِمُ بنُ إِسْمَاعِيلَ عَنِ الْجَعْدِ بنِ عَبْدِ الرَّحْمٰنِ قَالَ سَمِعْتُ السَّائِبَ بنَ يَزِيدَ يَقُولُ ذَهَبَتْ بِى خَالَتِى إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ فَقَالَتْ يَا رَسُولَ اللَّهِ إِنَّ ابْنَ أُخْتِى وَجِعٌ فَمَسَحَ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ رَأْسِى وَدَعَا لِى بِالْبَرَكَةِ فَتَوَضَّأَ فَشَرِبْتُ مِنْ وَضُوئِهِ وَقُمْتُ خَلْفَ ظَهْرِهِ فَنَظَرْتُ إِلَى الْخَاتَمِ بَيْنَ كَتِفَيْهِ فَإِذَا هُوَ مِثْلُ زِرِّ الْحَجَلَةِ. ","17. حَدَّثَنَا سَعِيدُ بنُ يَعْقُوبَ الطَّالِقَانِىُّ حدَّثَنَا أَيُّوبُ بنُ جَابِرٍ عَنْ سِمَاكِ بنِ حَرْبٍ عَنْ جَابِرِ بنِ سَمُرَةَ قَالَ رَأَيْتُ الْخَاتَمَ بَيْنَ كَتِفَىْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ غُدَّةً حَمْرَاءَ مِثْلَ بَيْضَةِ الْحَمَامَةِ. ","18. حَدَّثَنَا أَبُو مُصْعَبٍ الْمَدِينِىُّ أَخْبَرَنَا يُوسُفُ بنُ الْمَاجِشُونِ عَنْ أَبِيهِ عَنْ عَاصِمِ بنِ عُمَرَ بنِ قَتَادَةَ عَنْ جَدَّتِهِ رُمَيْثَةَ قَالَتْ سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ وَلَوْ أَشَاءُ أَنْ أُقَبِّلَ الْخَاتَمَ الَّذِى بَيْنَ كَتِفَيْهِ مِنْ قُرْبِهِ لَفَعَلْتُ يَقُولُ لِسَعْدِ بنِ مُعَاذٍ يَوْمَ مَاتَ اهْتَزَّ لَهُ عَرْشُ الرَّحْمٰنِ. ","19. حَدَّثَنَا أَحْمَدُ بنُ عَبْدَةَ الضَّبِّىُّ وَعَلِىُّ بنُ حُجْرٍ وَغَيْرُ وَاحِدٍ قَالُوا أَخْبَرَنَا عِيسَى بنُ يُونُسَ عَنْ عُمَرَ بنِ عَبْدِ اللَّهِ مَوْلَى غُفْرَةَ قَالَ حَدَّثَنِى إِبْرَاهِيمُ بنُ مُحَمَّدٍ مِنْ وُلْدِ عَلِىِّ بنِ أَبِى طَالِبٍ قَالَ كَانَ عَلِىٌّ إِذَا وَصَفَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَذَكَرَ الْحَدِيثَ بِطُولِهِ وَقَالَ بَيْنَ كَتِفَيْهِ خَاتَمُ النُّبُوَّةِ وَهُوَ خَاتَمُ النَّبِيِّينَ. ","20. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ أَخْبَرَنَا أَبُو عَاصِمٍ حَدَّثَنَا عَزْرَةُ بنُ ثَابِتٍ حَدَّثَنَا عِلْبَاءُ بنُ أَحْمَرَ الْيَشْكُرِىُّ قَالَ أَخْبَرَنَا أَبُو زَيْدٍ عَمْرُو بنُ أَخْطَبَ الأَنْصَارِىُّ قَالَ قَالَ لِى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ يَا أَبَا زَيْدٍ ادْنُ مِنِّى فَامْسَحْ ظَهْرِى فَمَسَحْتُ ظَهْرَهُ فَوَقَعَتْ أَصَابِعِى عَلَى الْخَاتَمِ قُلْتُ وَمَا الْخَاتَمُ قَالَ شَعَرَاتٌ مُجْتَمِعَاتٌ. ","21. حَدَّثَنَا أَبُو عَمَّارٍ الْحُسَيْنُ بنُ حُرَيْثٍ الْخُزَاعِىُّ حَدَّثَنَا عَلِىُّ بنُ حُسَيْنِ بنِ وَاقِدٍ حَدَّثَنِى أَبِى حَدَّثَنِى عَبْدُ اللَّهِ بنُ بُرَيْدَةَ قَالَ سَمِعْتُ أَبِى بُرَيْدَةَ يَقُولُ جَاءَ سَلْمَانُ الْفَارِسِىُّ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حِينَ قَدِمَ الْمَدِينَةَ بِمَائِدَةٍ عَلَيْهَا رُطَبٌ فَوُضِعَتْ بَيْنَ يَدَىْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ فَقَالَ يَا سَلْمَانُ مَا هَذَا فَقَالَ صَدَقَةٌ عَلَيْكَ وَعَلَى أَصْحَابِكَ فَقَالَ ارْفَعْهَا فَإِنَّا لا نَأْكُلُ الصَّدَقَةَ قَالَ فَرَفَعَهَا فَجَاءَ الْغَدَ بِمِثْلِهِ فَوَضَعَهُ بَيْنَ يَدَيْهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ مَا هَذَا يَا سَلْمَانُ فَقَالَ هَدِيَّةٌ لَكَ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ لِأَصْحَابِهِ ابْسُطُوا ثُمَّ نَظَرَ إِلَى الْخَاتَمِ عَلَى ظَهْرِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ فَآمَنَ بِهِ. وَكَانَ لِلْيَهُودِ فَاشْتَرَاهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ بِكَذَا وَكَذَا دِرْهَمًا عَلَى أَنْ يَغْرِسَ لَهُمْ نَخِيلًا فَيَعْمَلَ سَلْمَانُ فِيهِ حَتَّى تُطْعِمَ فَغَرَسَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ النَّخْلَ لَهُ إِلَّا نَخْلَةً وَاحِدَةً غَرَسَهَا عُمَرُ فَحَمَلَتِ النَّخِيلُ مِنْ عَامِهَا وَلَمْ تَحْمِلْ نَخْلَةٌ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ مَا شَأْنُ هَذِهِ فَقَالَ عُمَرُ يَا رَسُولَ اللَّهِ أَنَا غَرَسْتُهَا فَنَزَعَهَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَغَرَسَهَا فَحَمَلَتْ مِنْ عَامِهِ. ","22. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا بِشْرُ بنُ الْوَضَّاحِ حَدَّثَنَا أَبُو عَقِيلٍ الدَّوْرَقِىُّ عَنْ أَبِى نَضْرَةَ قَالَ سَأَلْتُ أَبَا سَعِيدٍ الْخُدْرِىَّ عَنْ خَاتَمِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ يَعْنِى خَاتَمَ النُّبُوَّةِ فَقَالَ كَانَ فِى ظَهْرِهِ بِضْعَةً نَاشِزَةً. ","23. حَدَّثَنَا أَبُو الأَشْعَثِ أَحْمَدُ بنُ الْمِقْدَامِ الْعِجْلِىُّ الْبَصْرِىُّ حَدَّثَنَا حَمَّادُ بنُ زَيْدٍ عَنْ عَاصِمٍ الأَحْوَلِ عَنْ عَبْدِ اللَّهِ بنِ سَرْجِسَ قَالَ أَتَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ فِى أُنَاسٍ مِنْ أَصْحَابِهِ فَدُرْتُ هَكَذَا مِنْ خَلْفِهِ فَعَرَفَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الَّذِى أُرِيدُ فَأَلْقَى الرِّدَاءَ عَنْ ظَهْرِهِ فَرَأَيْتُ مَوْضِعَ الْخَاتَمِ عَلَى كَتِفِهِ مِثْلَ الْجُمْعِ حَوْلَهَا خِيلانٌ كَأَنَّهَا الثَّآلِيلُ فَرَجَعْتُ حَتَّى اسْتَقْبَلْتُهُ فَقُلْتُ غَفَرَ اللَّهُ لَكَ يَا رَسُولَ اللَّهِ قَالَ وَلَكَ فَقَالَ الْقَوْمُ أَسْتَغْفَرَ لَكَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ نَعَمْ وَلَكُمْ ثُمَّ تَلا هَذِهِ الآيَةَ ﴿وَاسْتَغْفِرْ لِذَنْبِكَ وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ﴾."]},{"id":"section-3","title":"بَابُ مَا جَاءَ فِى شَعَرِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["24. حَدَّثَنَا عَلِىُّ بنُ حُجْرٍ أَنْبَأَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ عَنْ حُمَيْدٍ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ كَانَ شَعْرُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَى نِصْفِ أُذُنَيْهِ. ","25. حَدَّثَنَا هَنَّادُ بنُ السَّرِىِّ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ أَبِى الزِّنَادِ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ قَالَتْ كُنْتُ أَغْتَسِلُ أَنَا وَرَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ إِنَاءٍ وَاحِدٍ وَكَانَ لَهُ شَعَرٌ فَوْقَ الْجُمَّةِ وَدُونَ الْوَفْرَةِ. ","26. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا أَبُو قَطَنٍ حَدَّثَنَا شُعْبَةُ عَنْ أَبِى إِسْحَاقَ عَنِ الْبَرَاءِ بنِ عَازِبٍ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَرْبُوعًا بُعَيْدَ مَا بَيْنَ الْمَنْكِبَيْنِ وَكَانَتْ جُمَّتُهُ تَضْرِبُ شَحْمَةَ أُذُنَيْهِ. ","27. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا وَهْبُ بنُ جَرِيرِ بنِ حَازِمٍ قَالَ حَدَّثَنِى أَبِى عَنْ قَتَادَةَ قَالَ قُلْتُ لِأَنَسٍ كَيْفَ كَانَ شَعْرُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لَمْ يَكُنْ بِالْجَعْدِ وَلا بِالسَّبِطِ كَانَ يَبْلُغُ شَعْرُهُ شَحْمَةَ أُذُنَيْهِ. ","28. حَدَّثَنَا مُحَمَّدُ بنُ يَحْيَى بنِ أَبِى عُمَرَ الْمَكِّىُّ حَدَّثَنَا سُفْيَانُ بنُ عُيَيْنَةَ عَنِ ابْنِ أَبِى نَجِيحٍ عَنْ مُجَاهِدٍ عَنْ أُمِّ هَانِئٍ بِنْتِ أَبِى طَالِبٍ قَالَتْ قَدِمَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَيْنَا مَكَّةَ قَدْمَةً وَلَهُ أَرْبَعُ غَدَائِرَ. ","29. حَدَّثَنَا سُوَيْدُ بنُ نَصْرٍ حَدَّثَنَا عَبْدُ اللَّهِ بنُ الْمُبَارَكِ عَنْ مَعْمَرٍ عَنْ ثَابِتٍ عَنْ أَنَسٍ أَنَّ شَعَرَ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِلَى أَنْصَافِ أُذُنَيْهِ. ","30. حَدَّثَنَا سُوَيْدُ بنُ نَصْرٍ أَخْبَرَنَا عَبْدُ اللَّهِ بنُ الْمُبَارَكِ عَنْ يُونُسَ بنِ يَزِيدَ عَنِ الزُّهْرِىِّ حَدَّثَنَا عُبَيْدُ اللَّهِ بنُ عَبْدِ اللَّهِ بنِ عُتْبَةَ عَنِ ابْنِ عَبَّاسٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَسْدُلُ شَعْرَهُ وَكَانَ الْمُشْرِكُونَ يَفْرِقُونَ رُؤُوسَهُمْ وَكَانَ أَهْلُ الْكِتَابِ يُسْدِلُونَ رُؤُوسَهُمْ وَكَانَ يُحِبُّ مُوَافَقَةَ أَهْلِ الْكِتَابِ فِى مَا لَمْ يُؤْمَرْ فِيهِ بِشَىْءٍ ثُمَّ فَرَقَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رَأْسَهُ. ","31. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِىٍّ عَنْ إِبْرَاهِيمَ بنِ نَافِعٍ الْمَكِّىِّ عَنِ ابْنِ أَبِى نَجِيحٍ عَنْ مُجَاهِدٍ عَنْ أُمِّ هَانِئٍ قَالَتْ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ذَا ضَفَائِرَ أَرْبَعٍ."]},{"id":"section-4","title":" بَابُ مَا جَاءَ فِى تَرَجُّلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["32. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى الأَنْصَارِىُّ حَدَّثَنَا مَعْنُ بنُ عِيسَى حَدَّثَنَا مَالِكُ بنُ أَنَسٍ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ قَالَتْ كُنْتُ أُرَجِّلُ رَأْسَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا حَائِضٌ. ","33. حَدَّثَنَا يُوسُفُ بنُ عِيسَى حَدَّثَنَا وَكِيعٌ حَدَّثَنَا الرَّبِيعُ بنُ صَبِيحٍ عَنْ يَزِيدَ بنِ أَبَانٍ هُوَ الرَّقَاشِىُّ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُكْثِرُ دَهْنَ رَأْسِهِ وَتَسْرِيحَ لِحْيَتِهِ وَيُكْثِرُ الْقِنَاعَ حَتَّى كَأَنَّ ثَوْبَهُ ثَوْبُ زَيَّاتٍ. ","34. حَدَّثَنَا هَنَّادُ بنُ السَّرِىِّ حَدَّثَنَا أَبُو الأَحْوَصِ عَنْ أَشْعَثَ بنِ أَبِى الشَّعْثَاءِ عَنْ أَبِيهِ عَنْ مَسْرُوقٍ عَنْ عَائِشَةَ قَالَتْ إِنْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَيُحِبُّ التَّيَمُّنَ فِى طُهُورِهِ إِذَا تَطَهَّرَ وَفِى تَرَجُّلِهِ إِذَا تَرَجَّلَ وَفِى انْتِعَالِهِ إِذَا انْتَعَلَ. ","35. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا يَحْيَى بنُ سَعِيدٍ عَنْ هِشَامِ بنِ حَسَّانٍ عَنِ الْحَسَنِ عَنْ عَبْدِ اللَّهِ بنِ مُغَفَّلٍ قَالَ نَهَى رَسُولُ اللَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عنِ التَّرَجُّلِ إِلَّا غِبًّا. ","36. حَدَّثَنَا الْحَسَنُ بنُ عَرَفَةَ حَدَّثَنَا عَبْدُ السَّلامِ بنُ حَرْبٍ عَنْ يَزِيدَ بنِ أَبِى خَالِدٍ عَنْ أَبِى الْعَلاءِ الأَوْدِىِّ عَنْ حُمَيْدِ بنِ عَبْدِ الرَّحْمٰنِ عَنْ رَجُلٍ مِنْ أَصْحَابِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَتَرَجَّلُ غِبًّا. "]},{"id":"section-5","title":"بَابُ مَا جَاءَ فِى شَيْبِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["37. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا هَمَّامٌ عَنْ قَتَادَةَ قَالَ قُلْتُ لِأَنَسِ بنِ مَالِكٍ هَلْ خَضَبَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لَمْ يَبْلُغْ ذَلِكَ إِنَّمَا كَانَ شَيْبًا فِى صُدْغَيْهِ وَلَكِنْ أَبُو بَكْرٍ رَضِىَ اللَّهُ تَعَالَى عَنْهُ خَضَبَ بِالْحِنَّاءِ وَالْكَتَمِ. ","38. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ وَيَحْيَى بنُ مُوسَى قَالا حَدَّثَنَا عَبْدُ الرَّزَّاقِ عَنْ مَعْمَرٍ عَنْ ثَابِتٍ عَنْ أَنَسٍ قَالَ مَا عَدَدْتُ فِى رَأْسِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلِحْيَتِهِ إِلَّا أَرْبَعَ عَشْرَةَ شَعْرَةً بَيْضَاءَ. ","39. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى أَخْبَرَنَا أَبُو دَاوُدَ حَدَّثَنَا شُعْبَةُ عَنْ سِمَاكِ بنِ حَرْبٍ قَالَ سَمِعْتُ جَابِرَ بنَ سَمُرَةَ وَقَدْ سُئِلَ عَنْ شَيْبِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ كَانَ إِذَا دَهَنَ رَأْسَهُ لَمْ يُرَ مِنْهُ شَيْبٌ وَإِذَا لَمْ يَدَّهِنْ رُئِىَ مِنْهُ. ","40. حَدَّثَنَا مُحَمَّدُ بنُ عُمَرَ بنِ الْوَلِيدِ الْكِنْدِىُّ الْكُوفِىُّ أَخْبَرَنَا يَحْيَى بنُ ءَادَمَ عَنْ شَرِيكٍ عَنْ عُبَيْدِ اللَّهِ بنِ عُمَرَ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ قَالَ إِنَّمَا كَانَ شَيْبُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَحْوًا مِنْ عِشْرِينَ شَعْرَةً بَيْضَاءَ. ","41. حَدَّثَنَا أَبُو كُرَيْبٍ مُحَمَّدُ بنُ الْعَلاءِ أَخْبَرَنَا مُعَاوِيَةُ بنُ هِشَامٍ عَنْ شَيْبَانَ عَنْ أَبِى إِسْحَاقَ عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ قَالَ قَالَ أَبُو بَكْرٍ يَا رَسُولَ اللَّهِ قَدْ شِبْتَ قَالَ شَيَّبَتْنِى هُودٌ وَالْوَاقِعَةُ وَالْمُرْسَلاتُ وَعَمَّ يَتَسَاءَلُونَ وَإِذَا الشَّمْسُ كُوِّرَتْ. ","42. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا مُحَمَّدُ بنُ بِشْرٍ عَنْ عَلِىِّ بنِ صَالِحٍ عَنْ أَبِى إِسْحَاقَ عَنْ أَبِى جُحَيْفَةَ قَالَ قَالُوا يَا رَسُولَ اللَّهِ نَرَاكَ قَدْ شِبْتَ قَالَ شَيَّبَتْنِى هُودٌ وَأَخَوَاتُهَا. ","43. حَدَّثَنَا عَلِىُّ بنُ حُجْرٍ أَخْبَرَنَا شُعَيْبُ بنُ صَفْوَانَ عَنْ عَبْدِ الْمَلِكِ بنِ عُمَيْرٍ عَنِ إِيَادِ بنِ لَقِيطٍ الْعِجْلِىِّ عَنْ أَبِى رِمْثَةَ التَّيْمِىِّ تَيْمِ الرَّبَابِ قَالَ أَتَيْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَمَعِىَ ابْنٌ لِى فَأُرِيتُهُ فَقُلْتُ لَمَّا رَأَيْتُهُ هَذَا نَبِىُّ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَعَلَيْهِ ثَوْبَانِ أَخْضَرَانِ وَلَهُ شَعَرٌ قَدْ عَلاهُ الشَّيْبُ وَشَيْبُهُ أَحْمَرُ. ","44. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا سُرَيْجُ بنُ النُّعْمَانِ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ سِمَاكِ بنِ حَرْبٍ قَالَ قِيلَ لِجَابِرِ بنِ سَمُرَةَ أَكَانَ فِى رَأْسِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَيْبٌ قَالَ لَمْ يَكُنْ فِى رَأْسِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَيْبٌ إِلَّا شَعَرَاتٌ فِى مَفْرِقِ رَأْسِهِ إِذَا ادَّهَنَ وَارَاهُنَّ الدُّهْنُ."]},{"id":"section-6","title":"بَابُ مَا جَاءَ فِى خِضَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["45. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا هُشَيْمٌ أَخْبَرَنَا عَبْدُ الْمَلِكِ بنُ عُمَيْرٍ عَنِ إِيَادِ بنِ لَقِيطٍ قَالَ أَخْبَرَنِى أَبُو رِمْثَةَ قَالَ أَتَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَعَ ابْنٍ لِى فَقَالَ ابْنُكَ فَقُلْتُ نَعَمْ اشْهَدْ بِهِ قَالَ لا يَجْنِى عَلَيْكَ وَلا تَجْنِى عَلَيْهِ قَالَ وَرَأَيْتُ الشَّيْبَ أَحْمَرَ. ","قَالَ أَبُو عِيسَى هَذَا أَحْسَنُ شَىْءٍ رُوِىَ فِى هَذَا الْبَابِ وَأَفْسَرُهُ لِأَنَّ الرِّوَايَاتِ الصَّحِيحَةَ أَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ لَمْ يَبْلُغِ الشَّيْبَ. وَأَبُو رِمْثَةَ التَّيْمِىُّ اسْمُهُ رِفَاعَةُ ابْنُ يَثْرِبِىٍّ. ","46. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا أَبِى عَنْ شَرِيكٍ عَنْ عُثْمَانَ بنِ مَوْهَبٍ قَالَ سُئِلَ أَبُو هُرَيْرَةَ هَلْ خَضَبَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ نَعَمْ. وَرَوَى أَبُو عَوَانَةَ هَذَا الْحَدِيثَ عَنْ عُثْمَانَ بنِ عَبْدِ اللَّهِ بنِ مَوْهَبٍ فَقَالَ عَنْ أُمِّ سَلَمَةَ. ","47. حَدَّثَنَا إِبْرَاهِيمُ بنُ هَارُونَ حَدَّثَنَا النَّضْرُ بنُ زُرَارَةَ عَنْ أَبِى جَنَابٍ عَنْ إِيَادِ ابْنِ لَقِيطٍ عَنِ الْجَهْدَمَةِ امْرَأَةِ بِشَيرِ ابْنِ الْخَصَاصِيَةِ قَالَتْ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَخْرُجُ مِنْ بَيْتِهِ يَنْفُضُ رَأْسَهُ وَقَدِ اغْتَسَلَ وَبِرَأْسِهِ رَدْعٌ أَوْ قَالَ رَدْغٌ مِنْ حِنَّاءٍ شَكَّ فِى هَذَا الشَّيْخُ. ","48. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا عَمْرُو بنُ عَاصِمٍ أَخْبَرَنَا حَمَّادُ بنُ سَلَمَةَ أَخْبَرَنَا حُمَيْدٌ عَنْ أَنَسٍ قَالَ رَأَيْتُ شَعَرَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَخْضُوبًا. قَالَ حَمَّادٌ وَأَخْبَرَنِى عَبْدُ اللَّهِ بنُ مُحَمَّدِ بنِ عَقِيلٍ قَالَ رَأَيْتُ شَعَرَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عِنْدَ أَنَسِ بنِ مَالِكٍ مَخْضُوبًا."]},{"id":"section-7","title":"بَابُ مَا جَاءَ فِى كُحْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["49. حَدَّثَنَا مُحَمَّدُ بنُ حُمَيْدٍ الرَّازِىُّ حَدَّثَنَا أَبُو دَاوُدَ الطَّيَالِسِىُّ عَنْ عَبَّادِ بنِ مَنْصُورٍ عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ اكْتَحِلُوا بِالإِثْمِدِ فَإِنَّهُ يَجْلُو الْبَصَرَ وَيُنْبِتُ الشَّعَرَ. وَزَعَمَ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَتْ لَهُ مُكْحُلَةٌ يَكْتَحِلُ بِهَا كُلَّ لَيْلَةٍ ثَلاثَةً فِى هَذِهِ وَثَلاثَةً فِى هَذِهِ. ","50. حَدَّثَنَا عَبْدُ اللَّهِ بنُ الصَّبَّاحِ الْهَاشِمِىُّ الْبَصْرِىُّ حَدَّثَنَا عُبَيْدُ اللَّهِ بنُ مُوسَى أَخْبَرَنَا إِسْرَائِيلُ بنُ يُونُسَ عَنْ عَبَّادِ بنِ مَنْصُورٍ (ح) قَالَ وَحَدَّثَنَا عَلِىُّ بنُ حُجْرٍ حَدَّثَنَا يَزِيدُ بنُ هَارُونَ حَدَّثَنَا عَبَّادُ بنُ مَنْصُورٍ عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَكْتَحِلُ قَبْلَ أَنْ يَنَامَ بِالإِثْمِدِ ثَلاثًا فِى كُلِّ عَيْن.ٍ وَقَالَ يَزِيدُ بنُ هَارُونَ فِى حَدِيثِهِ إِنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَتْ لَهُ مُكْحُلَةٌ يَكْتَحِلُ بِهَا عِنْدَ النَّوْمِ ثَلاثًا فِى كُلِّ عَيْنٍ. ","51. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ أَخْبَرَنَا مُحَمَّدُ بنُ يَزِيدَ عَنْ مُحَمَّدِ بنِ إِسْحَاقَ عَنْ مُحَمَّدِ بنِ الْمُنْكَدِرِ عَنْ جَابِرٍ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ عَلَيْكُمْ بِالإِثْمِدِ عِنْدَ النَّوْمِ فَإِنَّهُ يَجْلُو الْبَصَرَ وَيُنْبِتُ الشَّعَرَ. ","52. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا بِشْرُ بنُ الْمُفَضَّلِ عَنْ عَبْدِ اللَّه بنِ عُثْمَانَ بنِ خُثَيْمٍ عَنْ سَعِيدِ بنِ جُبَيْرٍ عَنِ ابْنِ عَبَّاسٍ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنَّ خَيْرَ أَكْحَالِكُمُ الإِثْمِدُ يَجْلُو الْبَصَرَ وَيُنْبِتُ الشَّعْرَ. ","53. حَدَّثَنَا إِبْرَاهِيمُ بنُ الْمُسْتَمِرِّ الْبَصْرِىُّ أَخْبَرَنَا أَبُو عَاصِمٍ عَنْ عُثْمَانَ بنِ عَبْدِ الْمَلِكِ عَنْ سَالِمٍ عَنِ ابْنِ عُمَرَ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَيْكُمْ بِالإِثْمِدِ فَإِنَّهُ يَجْلُو الْبَصَرَ وَيُنْبِتُ الشَّعَرَ. "]},{"id":"section-8","title":"بَابُ مَا جَاءَ فِى لِبَاسِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["54. حَدَّثَنَا مُحَمَّدُ بنُ حُمَيْدٍ الرَّازِىُّ حَدَّثَنَا الْفَضْلُ بنُ مُوسَى وَأَبُو تُمَيْلَةَ وَزَيْدُ بنُ حُبَابٍ عَنْ عَبْدِ الْمُؤْمِنِ بنِ خَالِدٍ عَنْ عَبْدِ اللَّهِ بنِ بُرَيْدَةَ عَنْ أُمِّ سَلَمَةَ قَالَتْ كَانَ أَحَبَّ الثِّيَابِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْقَمِيصُ. ","55. حَدَّثَنَا عَلِىُّ بنُ حُجْرٍ حَدَّثَنَا الْفَضْلُ بنُ مُوسَى عَنْ عَبْدِ الْمُؤْمِنِ بنِ خَالِدٍ عَنْ عَبْدِ اللَّهِ بنِ بُرَيْدَةَ عَنْ أُمِّ سَلَمَةَ قَالَتْ كَانَ أَحَبُّ الثِّيَابِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْقَمِيصَ. ","56. حَدَّثَنَا زِيَادُ بنُ أَيُّوبَ الْبَغْدَادِىُّ حَدَّثَنَا أَبُو تُمَيْلَةَ عَنْ عَبْدِ الْمُؤْمِنِ بنِ خَالِدٍ عَنْ عَبْدِ اللَّهِ بنِ بُرَيْدَةَ عَنْ أُمِّهِ عَنْ أُمِّ سَلَمَةَ قَالَتْ كَانَ أَحَبَّ الثِّيَابِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَلْبَسُهُ الْقَمِيصُ. ","قَالَ هَكَذَا قَالَ زِيَادُ بنُ أَيُّوبَ فِى حَدِيثِهِ عَنْ عَبْدِ اللَّهِ بنِ بُرَيْدَةَ عَنْ أُمِّهِ عَنْ أُمِّ سَلَمَةَ وَهَكَذَا رَوَى غَيْرُ وَاحِدٍ عَنْ أَبِى تُمَيْلَةَ مِثْلَ رِوَايَةِ زِيَادِ بنِ أَيُّوبَ وَأَبُو تُمَيْلَةَ يَزِيدُ فِى هَذَا الْحَدِيثِ عَنْ أُمِّهِ وَهُوَ أَصَحُّ. ","57. حَدَّثَنَا عَبْدُ اللَّهِ بنُ مُحَمَّدِ بنِ الْحَجَّاجِ حَدَّثَنَا مُعَاذُ بنُ هِشَامٍ حَدَّثَنِى أَبِى عَنْ بُدَيْلِ بنِ مَيْسَرَةَ الْعُقَيْلِىِّ عَنْ شَهْرِ بنِ حَوْشَبٍ عَنْ أَسْمَاءَ بِنْتِ يَزِيدَ قَالَتْ كَانَ كُمُّ قَمِيصِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَى الرُّسْغِ. ","58. حَدَّثَنَا أَبُو عَمَّارٍ الْحُسَيْنُ بنُ حُرَيْثٍ حَدَّثَنَا أَبُو نُعَيْمٍ حَدَّثَنَا زُهَيْرٌ عَنْ عُرْوَةَ بنِ عَبْدِ اللَّهِ بنِ قُشَيْرٍ عَنْ مُعَاوِيَةَ بنِ قُرَّةَ عَنْ أَبِيهِ قَالَ أَتَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِى رَهْطٍ مِنْ مُزَيْنَةَ لِنُبَايِعَهُ وَإِنَّ قَمِيصَهُ لَمُطْلَقٌ أَوْ قَالَ زِرُّ قَمِيصِهِ مُطْلَقٌ قَالَ فَأَدْخَلْتُ يَدِى فِى جَيْبِ قَمِيصِهِ فَمَسَسْتُ الْخَاتَمَ. ","59. حَدَّثَنَا عَبْدُ بنُ حُمَيْدٍ حَدَّثَنَا مُحَمَّدُ بنُ الْفَضْلِ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ حَبِيبِ بنِ الشَّهِيدِ عَنِ الْحَسَنِ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَرَجَ وَهُوَ مُتَّكِئٌ عَلَى أُسَامَةَ بنِ زَيْدٍ عَلَيْهِ ثَوْبٌ قِطْرِىٌّ قَدْ تَوَشَّحَ بِهِ فَصَلَّى بِهِمْ. ","   وَقَالَ عَبْدُ بنُ حُمَيْدٍ قَالَ مُحَمَّدُ بنُ الْفَضْلِ سَأَلَنِى يَحْيَى بنُ مَعِينٍ عَنْ هَذَا الْحَدِيثِ أَوَّلَ مَا جَلَسَ إِلَىَّ فَقُلْتُ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ قَالَ لَوْ كَانَ مِنْ كِتَابِكَ فَقُمْتُ لِأَخْرُجَ فَقَبَضَ عَلَى ثَوْبِى ثُمَّ قَالَ أَمْلِهِ عَلَىَّ فَإِنِّى أَخَافُ أَنْ لا أَلْقَاكَ فَأَمْلَيْتُ عَلَيْهِ ثُمَّ أَخْرَجْتُ كِتَابِى فَقَرَأْتُ عَلَيْهِ. ","60. حَدَّثَنَا سُوَيْدُ بنُ نَصْرٍ أَخْبَرَنَا عَبْدُ اللَّهِ بنُ الْمُبَارَكِ عَنْ سَعِيدِ بنِ إِيَاسٍ الْجُرَيْرِىِّ عَنْ أَبِى نَضْرَةَ عَنْ أَبِى سَعِيدٍ الْخُدْرِىِّ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا اسْتَجَدَّ ثَوْبًا سَمَّاهُ بِاسْمِهِ عِمَامَةً أَوْ قَمِيصًا أَوْ رِدَاءً ثُمَّ يَقُولُ اللَّهمَّ لَكَ الْحَمْدُ كَمَا كَسَوْتَنِيهِ أَسْأَلُكَ خَيْرَهُ وَخَيْرَ مَا صُنِعَ لَهُ وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ. ","61. حَدَّثَنَا هِشَامُ بنُ يُونُسَ الْكُوفِىُّ حَدَّثَنَا الْقَاسِمُ بنُ مَالِكٍ الْمُزَنِىُّ عَنِ الْجُرَيْرِىِّ عَنْ أَبِى نَضْرَةَ عَنْ أَبِى سَعِيدٍ الْخُدْرِىِّ عَنِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَحْوَهُ. ","62. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُعَاذُ بنُ هِشَامٍ حَدَّثَنَا أَبِى عَنْ قَتَادَةَ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ كَانَ أَحَبُّ الثِّيَابِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَلْبَسُهُ الْحِبَرَةَ. ","63. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ أَخْبَرَنَا عَبْدُ الرَّزَّاقِ أَخْبَرَنَا سُفْيَانُ عَنْ عَوْنِ بنِ أَبِى جُحَيْفَةَ عَنْ أَبِيهِ قَالَ رَأَيْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَعَلَيْهِ حُلَّةٌ حَمْرَاءُ كَأَنِّى أَنْظُرُ إِلَى بَرِيقِ سَاقَيْهِ. قَالَ سُفْيَانُ نُرَاهُ حِبَرَةً. ","64. حَدَّثَنَا عَلِىُّ بنُ خَشْرَمٍ حَدَّثَنَا عِيسَى بنُ يُونُسَ عَنْ إِسْرَائِيلَ عَنْ أَبِى إِسْحَاقَ عَنِ الْبَرَاءِ بنِ عَازِبٍ قَالَ مَا رَأَيْتُ أَحَدًا مِنَ النَّاسِ أَحْسَنَ فِى حُلَّةٍ حَمْرَاءَ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنْ كَانَتْ جُمَّتُهُ لَتَضْرِبُ قَرِيبًا مِنْ مَنْكِبَيْهِ. ","65. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ أَنْبَأَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِىٍّ حَدَّثَنَا عُبَيْدُ اللَّهِ بنُ إِيَادٍ هُوَ ابْنُ لَقِيطٍ عَنْ أَبِيهِ عَنْ أَبِى رِمْثَةَ قَالَ رَأَيْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَءَالِهِ وَسَلَّمَ وَعَلَيْهِ بُرْدَانِ أَخْضَرَانِ. ","66. حَدَّثَنَا عَبْدُ بنُ حُمَيْدٍ قَالَ أَخْبَرَنَا عَفَّانُ بنُ مُسْلِمٍ حَدَّثَنَا عَبْدُ اللَّهِ بنُ حَسَّانٍ الْعَنْبَرِىُّ عَنْ جَدَّتَيْهِ دُحَيْبَةَ وَعُلَيْبَةَ عَنْ قَيْلَةَ بِنْتِ مَخْرَمَةَ قَالَتْ رَأَيْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَعَلَيْهِ أَسْمَالُ مُلَيَّتَيْنِ كَانَتَا بِزَعْفَرَانٍ وَقَدْ نَفَضَتْهُ وَفِى الْحَدِيثِ قِصَّةٌ طَوِيلَةٌ. ","67. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا بِشْرُ بنُ الْمُفَضَّلِ عَنْ عَبْدِ اللَّهِ بنِ عُثْمَانَ بنِ خُثَيْمٍ عَنْ سَعِيدِ بنِ جُبَيْرٍ عَنِ ابْنِ عَبَّاسٍ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَيْكُمْ بِالْبَيَاضِ مِنَ الثِّيَابِ لِيَلْبَسْهَا أَحْيَاؤُكُمْ وَكَفِّنُوا فِيهَا مَوْتَاكُمْ فَإِنَّهَا مِنْ خَيْرِ ثِيَابِكُمْ. ","68. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِىٍّ حَدَّثَنَا سُفْيَانُ عَنْ حَبِيبِ بنِ أَبِى ثَابِتٍ عَنْ مَيْمُونِ بنِ أَبِى شَبِيبٍ عَنْ سَمُرَةَ بنِ جُنْدُبٍ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْبَسُوا الْبَيَاضَ فَإِنَّهَا أَطْهَرُ وَأَطْيَبُ وَكَفِّنُوا فِيهَا مَوْتَاكُمْ. ","69. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا يَحْيَى بنُ زَكَرِيَّا بنِ أَبِى زَائِدَةَ حَدَّثَنَا أَبِى عَنْ مُصْعَبِ بنِ شَيْبَةَ عَنْ صَفِيَّةَ بِنْتِ شَيْبَةَ عَنْ عَائِشَةَ قَالَتْ خَرَجَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ذَاتَ غَدَاةٍ وَعَلَيْهِ مِرْطُ شَعَرٍ أَسْودَ. ","70. حَدَّثَنَا يُوسُفُ بنُ عِيسَى حَدَّثَنَا وَكِيعٌ حَدَّثَنَا يُونُسُ بنُ أَبِى إِسْحَاقَ عَنْ أَبِيهِ عَنِ الشَّعْبِىِّ عَنْ عُرْوَةَ بنِ الْمُغِيرَةِ بنِ شُعْبَةَ عَنْ أَبِيهِ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَبِسَ جُبَّةً رُومِيَّةً ضَيِّقَةَ الْكُمَّيْنِ."]},{"id":"section-9","title":"بَابٌ فِى صِفَةِ عَيْشِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["71. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا حَمَّادُ بنُ زَيْدٍ عَنْ أَيُّوبَ عَنْ مُحَمَّدِ بنِ سِيرِينَ قَالَ كُنَّا عِنْدَ أَبِى هُرَيْرَةَ وَعَلَيْهِ ثَوْبَانِ مُمَشَّقَانِ مِنْ كَتَّانٍ فَتَمَخَّطَ فِى أَحَدِهِمَا فَقَالَ بَخْ بَخْ يَتَمَخَّطُ أَبُو هُرَيْرَةَ فِى الْكَتَّانِ لَقَدْ رَأَيْتُنِى وَإِنِّى لَأَخِرُّ فِيمَا بَيْنَ مِنْبَرِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وحُجْرَةِ عَائِشَةَ رَضِىَ اللَّهُ تَعَالَى عَنْهَا مَغْشِيًّا عَلَىَّ فَيَجِىءُ الْجَائِى فَيَضَعُ رِجْلَهُ عَلَى عُنُقِى يُرَى أَنَّ بِى جُنُونًا وَمَا بِى جُنُونٌ ومَا هُوَ إِلَّا الْجُوعُ.","72. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا جَعْفَرُ بنُ سُلَيْمَانَ الضُّبَعِىُّ عَنْ مَالِكِ بنِ دِينَارٍ قَالَ مَا شَبِعَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ خُبْزٍ قَطُّ وَلا مِنْ لَحْمٍ إِلَّا عَلَى ضَفَفٍ. قَالَ مَالِكٌ سَأَلْتُ رَجُلًا مِنْ أَهْلِ الْبَادِيَةِ مَا الضَّفَفُ قَالَ أَنْ يَتَنَاوَلَ مَعَ النَّاسِ."]},{"id":"section-10","title":"بَابُ مَا جَاءَ فِى خُفِّ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["73. حَدَّثَنَا هَنَّادُ بنُ السَّرِىِّ حَدَّثَنَا وَكِيعٌ عَنْ دَلْهَمِ بنِ صَالِحٍ عَنْ حُجَيْرِ بنِ عَبْدِ اللَّهِ عَنِ ابْنِ بُرَيْدَةَ عَنْ أَبِيهِ أَنَّ النَّجَاشِىَ أَهْدَى لِلنَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خُفَّيْنِ أَسْوَدَيْنِ سَاذَجَيْنِ فَلَبِسَهُمَا ثُمَّ تَوَضَّأَ وَمَسَحَ عَلَيْهِمَا. ","74. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا يَحْيَى بنُ زَكَرِيَّا بنِ أَبِى زَائِدَةَ عَنِ الْحَسَنِ بنِ عَيَّاشٍ عَنْ أَبِى إِسْحَاقَ عَنِ الشَّعْبِىِّ قَالَ قَالَ الْمُغِيرَةُ بنُ شُعْبَةَ أَهْدَى دِحْيَةُ لِلنَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خُفَّيْنِ فَلَبِسَهُمَا وَقَالَ إِسْرَائِيلُ عَنْ جَابِرٍ عَنْ عَامِرٍ وَجُبَّةً فَلَبِسَهُمَا حَتَّى تَخَرَّقَا لا يَدْرِى النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَذَكِىٌّ هُمَا أَمْ لا. قَالَ وَأَبُو إِسْحَاقَ هَذَا هُوَ أَبُو إِسْحَاقَ الشَّيْبَانِىُّ وَاسْمُهُ سُلَيْمَانُ."]},{"id":"section-11","title":"بَابُ مَا جَاءَ فِى نَعْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["75. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا هَمَّامٌ عَنْ قَتَادَةَ قَالَ قُلْتُ لِأَنَسِ بنِ مَالِكٍ كَيْفَ كَانَ نَعْلُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لَهُمَا قِبَالانِ. ","76. حَدَّثَنَا أَبُو كُرَيْبٍ مُحَمَّدُ بنُ الْعَلاءِ حَدَّثَنَا وَكِيعٌ عَنْ سُفْيَانَ عَنْ خَالِدٍ الْحَذَّاءِ عَنْ عَبْدِ اللَّهِ بنِ الْحَارِثِ عَنِ ابْنِ عَبَّاسٍ قَالَ كَانَ لِنَعْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قِبَالانِ مُثَنًّى شِرَاكُهُمَا. ","77. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا أَبُو أَحْمَدَ الزُّبَيْرِىُّ حَدَّثَنَا عِيسَى بنُ طَهْمَانَ قَالَ أَخْرَجَ إِلَيْنَا أَنَسُ بنُ مَالِكٍ نَعْلَيْنِ جَرْدَاوَيْنِ لَهُمَا قِبَالانِ فَحَدَّثَنِى ثَابِتٌ بَعْدُ عَنْ أَنَسٍ أَنَّهُمَا كَانَتَا نَعْلَىِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","78. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى الأَنْصَارِىُّ حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ سَعِيدِ بنِ أَبِى سَعِيدٍ الْمَقْبُرِىِّ عَنْ عُبَيْدِ بنِ جُرَيْجٍ أَنَّهُ قَالَ لِابْنِ عُمَرَ رَأَيْتُكَ تَلْبَسُ النِّعَالَ السِّبْتِيَّةَ قَالَ إِنِّى رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَلْبَسُ النِّعَالَ الَّتِى لَيْسَ فِيهَا شَعَرٌ وَيَتَوَضَّأُ فِيهَا فَأَنَا أُحِبُّ أَنْ أَلْبَسَهَا. ","79. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ أَخْبَرَنَا عَبْدُ الرَّزَّاقِ عَنْ مَعْمَرٍ عَنِ ابْنِ أَبِى ذِئْبٍ عَنْ صَالِحٍ مَوْلَى التَّوْأَمَةِ عَنْ أَبِى هُرَيْرَةَ قَالَ كَانَ لِنَعْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قِبَالانِ. ","80. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا أَبُو أَحْمَدَ قَالَ حَدَّثَنَا سُفْيَانُ عَنِ السُّدِّىِّ قَالَ حَدَّثَنِى مَنْ سَمِعَ عَمْرَو بنَ حُرَيْثٍ يَقُولُ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّى فِى نَعْلَيْنِ مَخْصُوفَتَيْنِ. ","81. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى الأَنْصَارِىُّ حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ أَبِى الزِّنَادِ عَنِ الأَعْرَجِ عَنْ أَبِى هُرَيْرَةَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لا يَمْشِى أَحَدُكُمْ فِى نَعْلٍ وَاحِدَةٍ لِيَنْعَلْهُمَا جَمِيعًا أَوْ لِيَحْفِهِمَا جَمِيعًا.","82. حَدَّثَنَا قُتَيْبَةُ عَنْ مَالِكِ بنِ أَنَسٍ عَنْ أَبِى الزِّنَادِ نَحْوَهُ. ","83. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ أَبِى الزُّبَيْرِ عَنْ جَابِرٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَهَى أَنْ يَأْكُلَ يَعْنِى الرَّجُلَ بِشِمَالِهِ أَوْ يَمْشِىَ فِى نَعْلٍ وَاحِدَةٍ. ","84. حَدَّثَنَا قُتَيْبَةُ عَنْ مَالِكٍ (ح) وَحَدَّثَنَا إِسْحَاقُ حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكٌ عَنْ أَبِى الزِّنَادِ عَنِ الأَعْرَجِ عَنْ أَبِى هُرَيْرَةَ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ إِذَا انْتَعَلَ أَحَدُكُمْ فَلْيَبْدَأْ بِالْيَمِينِ وَإِذَا نَزَعَ فَلْيَبْدَأْ بِالشِّمَالِ فَلْتَكُنِ الْيُمْنَى أَوَّلَهُمَا تُنْعَلُ وَءَاخِرَهُمَا تُنْزَعُ. ","85. حَدَّثَنَا أَبُو مُوسَى مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ قَالَ حَدَّثَنَا شُعْبَةُ عَنْ أَشْعَث وَهُوَ ابْنُ أَبِى الشَّعْثَاء عَنْ أَبِيهِ عَنْ مَسْرُوقٍ عَنْ عَائِشَةَ قَالَتْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُحِبُّ التَّيَمُّنَ مَا اسْتَطَاعَ فِى تَرَجُّلِهِ وَتَنَعُّلِهِ وَطَهُورِهِ. ","86. حَدَّثَنَا مُحَمَّدُ بنُ مَرْزُوقٍ أَبُو عَبْدِ اللَّهِ عَنْ عَبْدِ الرَّحْمٰنِ بنِ قَيْسٍ أَبِى مُعَاوِيَةَ حَدَّثَنَا هِشَامٌ عَنْ مُحَمَّدٍ عَنْ أَبِى هُرَيْرَةَ قَالَ كَانَ لِنَعْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قِبَالانِ وَأَبِى بَكْرٍ وَعُمَرَ رَضِىَ اللَّهُ تَعَالَى عَنْهُمَا وَأَوَّلُ مَنْ عَقَدَ عَقْدًا وَاحِدًا عُثْمَانُ رَضِيَ اللَّهُ عَنْهُ."]},{"id":"section-12","title":"بَابُ ذِكْرِ خَاتَمِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["87. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ وَغَيْرُ وَاحِدٍ عَنْ عَبْدِ اللَّهِ بنِ وَهْبٍ عَنْ يُونُسَ عَنِ ابْنِ شِهَابٍ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ كَانَ خَاتَمُ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ وَرِقٍ وَكَانَ فَصُّهُ حَبَشِيًّا. ","88. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا أَبُو عَوَانَةَ عَنْ أَبِى بِشْرٍ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اتَّخَذَ خَاتَمًا مِنْ فِضَّةٍ فَكَانَ يَخْتِمُ بِهِ وَلا يَلْبَسُهُ.","قَالَ أَبُو عِيسَى أَبُو بِشْرٍ اسْمُهُ جَعْفَرُ بنُ أَبِى وَحْشِيَّةَ.","89. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا حَفْصُ بنُ عُمَرَ بنِ عُبَيْدٍ هُوَ الطَّنَافِسِىُّ حَدَّثَنَا زُهَيْرٌ أَبُو خَيْثَمَةَ عَنْ حُمَيْدٍ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ كَانَ خَاتَمُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ فِضَّةٍ فَصُّهُ مِنْهُ. ","90. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ حَدَّثَنَا مُعَاذُ بنُ هِشَامٍ قَالَ حَدَّثَنِى أَبِى عَنْ قَتَادَةَ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ لَمَّا أَرَادَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنْ يَكْتُبَ إِلَى الْعَجَمِ قِيلَ لَهُ إِنَّ الْعَجَمَ لا يَقْبَلُونَ إِلَّا كِتَابًا عَلَيْهِ خَاتَمٌ فَاصْطَنَعَ خَاتَمًا فَكَأَنِّى أَنْظُرُ إِلَى بَيَاضِهِ فِى كَفِّهِ. ","91. حَدَّثَنَا مُحَمَّدُ بنُ يَحْيَى حَدَّثَنَا مُحَمَّدُ بنُ عَبْدِ اللَّهِ الأَنْصَارِىُّ حَدَّثَنِى أَبِى عَنْ ثُمَامَةَ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ نَقْشُ خَاتَمِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُحَمَّدٌ سَطْرٌ وَرَسُولُ سَطْرٌ وَاللَّهِ سَطْرٌ. ","92. حَدَّثَنَا نَصْرُ بنُ عَلِىٍّ الْجَهْضَمِىُّ أَبُو عَمْرٍو حَدَّثَنَا نُوحُ بنُ قَيْسٍ عَنْ خَالِدِ بنِ قَيْسٍ عَنْ قَتَادَةَ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَتَبَ إِلَى كِسْرَى وَقَيْصَرَ وَالنَّجَاشِى فَقِيلَ لَهُ إِنَّهُمْ لا يَقْبَلُونَ كِتَابًا إِلَّا بِخَاتَمٍ فَصَاغَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَاتَمًا حَلْقَةَ فِضَّةٍ وَنَقَشَ فِيهِ مُحَمَّدٌ رَسُولُ اللَّهِ. ","93. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ أَخْبَرَنَا سَعِيدُ بنُ عَامِرٍ وَالْحَجَّاجُ بنُ مِنْهَالٍ عَنْ هَمَّامٍ عَنِ ابْنِ جُرَيْجٍ عَنِ الزُّهْرِى عَنْ أَنَسٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِذَا دَخَلَ الْخَلاءَ نَزَعَ خَاتَمَهُ. ","94. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ حَدَّثَنَا عَبْدُ اللَّهِ بنُ نُمَيْرٍ حَدَّثَنَا عُبَيْدُ اللَّهِ بنُ عُمَرَ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ قَالَ اتَّخَذَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَاتَمًا مِنْ وَرِقٍ فَكَانَ فِى يَدِهِ ثُمَّ كَانَ فِى يَدِ أَبِى بَكْرٍ وَعُمَرَ ثُمَّ كَانَ فِى يَدِ عُثْمَانَ حَتَّى وَقَعَ فِى بِئْرِ أَرِيسٍ نَقْشُهُ مُحَمَّدٌ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. "]},{"id":"section-13","title":"بَابُ تَخَتُّمِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["95. حَدَّثَنَا مُحَمَّدُ بنُ سَهْلِ بنِ عَسْكَرٍ الْبَغْدَادِىُّ وَعَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ قَالا أَخْبَرَنَا يَحْيَى بنُ حَسَّانٍ حَدَّثَنَا سُلَيْمَانُ بنُ بِلالٍ عَنْ شَرِيكِ بنِ عَبْدِ اللَّهِ بنِ أَبِى نَمِرٍ عَنْ إِبْرَاهِيمَ بنِ عَبْدِ اللَّهِ بنِ حُنَيْنٍ عَنْ أَبِيهِ عَنْ عَلِىٍّ رَضِىَ اللَّهُ تَعَالَى عَنْهُ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَلْبَسُ خَاتَمَهُ فِى يَمِينِهِ.","96. حَدَّثَنَا مُحَمَّدُ بنُ يَحْيَى حَدَّثَنَا أَحْمَدُ بنُ صَالِحٍ حَدَّثَنَا عَبْدُ اللَّهِ بنُ وَهْبٍ عَنْ سُلَيْمَانَ بنِ بِلالٍ عَنْ شَرِيكِ بنِ عَبْدِ اللَّهِ ابْنِ أَبِى نَمِرٍ نَحْوَهُ. ","97. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا يَزِيدُ بنُ هَارُونَ عَنْ حَمَّادِ بنِ سَلَمَةَ قَالَ رَأَيْتُ ابْنَ أَبِى رَافِعٍ يَتَخَتَّمُ فِى يَمِينِهِ فَسَأَلْتُهُ عَنْ ذَلِكَ فَقَالَ رَأَيْتُ عَبْدَ اللَّهِ بنَ جَعْفَرٍ يَتَخَتَّمُ فِى يَمِينِهِ وَقَالَ عَبْدُ اللَّهِ بنُ جَعْفَرٍ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَتَخَتَّمُ فِى يَمِينِهِ.","98. حَدَّثَنَا يَحْيَى بنُ مُوسَى حَدَّثَنَا عَبْدُ اللَّهِ بنُ نُمَيْرٍ أَخْبَرَنَا إِبْرَاهِيمُ بنُ الْفَضْلِ عَنْ عَبْدِ اللَّهِ بنِ مُحَمَّدِ بنِ عَقِيلٍ عَنْ عَبْدِ اللَّهِ ابْنِ جَعْفَرٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَتَخَتَّمُ فِي يَمِينِهِ. ","99. حَدَّثَنَا أَبُو الْخَطَّابِ زِيَادُ بنُ يَحْيَى حَدَّثَنَا عَبْدُ اللَّهِ بنُ مَيْمُونٍ عَنْ جَعْفَرِ بنِ مُحَمَّدٍ عَنْ أَبِيهِ عَنْ جَابِرٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَتَخَتَّمُ فِى يَمِينِهِ.","100. حَدَّثَنَا مُحَمَّدُ بنُ حُمَيْدٍ الرَّازِىُّ حَدَّثَنَا جَرِيرٌ عَنْ مُحَمَّدِ بنِ إِسْحَاقَ عَنِ الصَّلْتِ بنِ عَبْدِ اللَّهِ قَالَ كَانَ ابْنُ عَبَّاسٍ يَتَخَتَّمُ فِى يَمِينِهِ وَلا إِخَالُهُ إِلَّا قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَتَخَتَّمُ فِى يَمِينِهِ. ","101. حَدَّثَنَا ابْنُ أَبِى عُمَرَ حَدَّثَنَا سُفْيَانُ عَنْ أَيُّوبَ بنِ مُوسَى عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اتَّخَذَ خَاتَمًا مِنْ فِضَّةٍ وَجَعَلَ فَصَّهُ مِمَّا يَلِى كَفَّهُ وَنَقَشَ فِيهِ مُحَمَّدٌ رَسُولُ اللَّهِ وَنَهَى أَنْ يَنْقُشَ أَحَدٌ عَلَيْهِ وَهُوَ الَّذِى سَقَطَ مِنْ مُعَيْقِيبٍ فِى بِئْرِ أَرِيسٍ. ","102. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا حَاتِمُ بنُ إِسْمَاعِيلَ عَنْ جَعْفَرِ بنِ مُحَمَّدٍ عَنْ أَبِيهِ قَالَ كَانَ الْحَسَنُ وَالْحُسَيْنُ يَتَخَتَّمَانِ فِى يَسَارِهِمَا.","103. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا مُحَمَّدُ بنُ عِيسَى وَهُوَ ابْنُ الطَّبَّاعِ حَدَّثَنَا عَبَّادُ بنُ الْعَوَّامِ عَنْ سَعِيدِ ابْنِ أَبِى عَرُوبَةَ عَنْ قَتَادَةَ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ تَخَتَّمَ فِى يَمِينِهِ.","104. حَدَّثَنَا مُحَمَّدُ بنُ عُبَيْدٍ الْمُحَارِبِىُّ حَدَّثَنَا عَبْدُ الْعَزِيزِ بنُ أَبِى حَازِمٍ عَنْ مُوسَى بنِ عُقْبَةَ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ قَالَ اتَّخَذَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَاتَمًا مِنْ ذَهَبٍ فَكَانَ يَلْبَسُهُ فِى يَمِينِهِ فَاتَّخَذَ النَّاسُ خَوَاتِيمَ مِنْ ذَهَبٍ فَطَرَحَهُ رَسُولُ اللَّهِ وَقَالَ لا أَلْبَسُهُ أَبدًا فَطَرَحَ النَّاسُ خَوَاتِيمَهُمْ."]},{"id":"section-14","title":"بَابُ مَاجَاءَ فِى صِفَةِ سَيْفِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["105. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا وَهْبُ بنُ جَرِيرٍ حَدَّثَنَا أَبِى عَنْ قَتَادَةَ عَنْ أَنَسٍ قَالَ كَانَتْ قَبِيعَةُ سَيْفِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ فِضَّةٍ. ","106. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُعَاذُ بنُ هِشَامٍ حَدَّثَنَا أَبِى عَنْ قَتَادَةَ عَنْ سَعِيدِ بنِ أَبِى الْحَسَنِ قَالَ كَانَتْ قَبِيعَةُ سَيْفِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ فِضَّةٍ. ","107. حَدَّثَنَا أَبُو جَعْفَرٍ مُحَمَّدُ بنُ صُدْرَانَ حَدَّثَنَا طَالِبُ بنُ حُجَيْرٍ عَنْ هُودٍ وَهُوَ ابْنُ عَبْدِ اللَّهِ بنِ سَعْدٍ عَنْ جَدِّهِ قَالَ دَخَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَكَّةَ يَوْمَ الْفَتْحِ وَعَلَى سَيْفِهِ ذَهَبٌ وَفِضَّةٌ. قَالَ طَالِبٌ فَسَأَلْتُهُ عَنِ الْفِضَّةِ فَقَالَ كَانَتْ قَبِيعَةُ السَّيْفِ فِضَّةً.","108. حَدَّثَنَا مُحَمَّدُ بنُ شُجَاعٍ الْبَغْدَادِىُّ حَدَّثَنَا أَبُو عُبَيْدَةَ الْحَدَّادُ عَنْ عُثْمَانَ بنِ سَعْدٍ عَنِ ابْنِ سِيرِينَ قَالَ صُغْتُ سَيْفِى عَلَى سَيْفِ سَمُرَةَ بنِ جُنْدُبٍ وَزَعَمَ سَمُرَةُ أَنَّهُ صَنَعَ سَيْفَهُ عَلَى سَيْفِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَكَانَ حَنَفِيًّا. ","109. حَدَّثَنَا عُقْبَةُ بنُ مُكْرَمٍ الْبَصْرِىُّ حَدَّثَنَا مُحَمَّدُ بنُ بَكْرٍ عَنْ عُثْمَانَ بنِ سَعْدٍ بِهَذَا الإِسْنَادِ نَحْوَهُ."]},{"id":"section-15","title":"بَابُ صِفَةِ دِرْعِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["110. حَدَّثَنَا أَبُو سَعِيدٍ الأَشَجُّ عَبْدُ اللَّهِ بنُ سَعِيدٍ حَدَّثَنَا يُونُسُ بنُ بُكَيْرٍ عَنْ مُحَمَّدِ بنِ إِسْحَاقَ عَنْ يَحْيَى بنِ عَبَّادِ بنِ عَبْدِ اللَّهِ بنِ الزُّبَيْر عَنْ أَبِيهِ عَنْ جَدِّهِ عَبْدِ اللَّهِ بنِ الزُّبَيْر عَنِ الزُّبَيْرِ بنِ الْعَوَّامِ قَالَ كَانَ عَلَى النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دِرْعَانِ يَوْمَ أُحُدٍ فَنَهَضَ إِلَى الصَّخْرَةِ فَلَمْ يَسْتَطِعْ فَأَقْعَدَ طَلْحَةَ تَحْتَهُ فَصَعِدَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَتَّى اسْتَوَى عَلَى الصَّخْرَة قَالَ سَمِعْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ أَوْجَبَ طَلْحَةُ. ","111. حَدَّثَنَا مُحَمَّدُ بنُ أَبِى عُمَرَ حَدَّثَنَا سُفْيَانُ بنُ عُيَيْنَةَ عَنْ يَزِيدَ بنِ خُصَيْفَةَ عَنِ السَّائِبِ بنِ يَزِيدَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ عَلَيْهِ يَوْمَ أُحُدٍ دِرْعَانِ قَدْ ظَاهَرَ بَيْنَهُمَا."]},{"id":"section-16","title":"بَابُ مَا جَاءَ فِى صِفَةِ مِغْفَرِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["112. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا مَالِكُ بنُ أَنَسٍ عَنِ ابْنِ شِهَابٍ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ مَكَّةَ وَعَلَيْهِ مِغْفَرٌ فَقِيلَ لَهُ هَذَا ابْنُ خَطَلٍ مُتَعَلِّقٌ بِأَسْتَارِ الْكَعْبَةِ فَقَالَ اقْتُلُوهُ. ","113. حَدَّثَنَا عِيسَى بنُ أَحْمَدَ حَدَّثَنَا عَبْدُ اللَّهِ بنُ وَهْبٍ حَدَّثَنِى مَالِكُ بنُ أَنَسٍ عَنِ ابْنِ شِهَابٍ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ مَكَّةَ عَامَ الْفَتْحِ وَعَلَى رَأْسِهِ الْمِغْفَرُ قَالَ فَلَمَّا نَزَعَهُ جَاءَ رَجُلٌ فَقَالَ ابْنُ خَطَلٍ مُتَعَلِّقٌ بِأَسْتَارِ الْكَعْبَةِ فَقَالَ اقْتُلُوهُ. ","قَالَ ابْنُ شِهَابٍ وَبَلَغَنِى أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَمْ يَكُنْ يَوْمَئِذٍ مُحْرِمًا. "]},{"id":"section-17","title":"بَابُ مَا جَاءَ فِى عِمَامَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["114. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِىِّ عَنْ حَمَّادِ بنِ سَلَمَةَ. (ح) وَحَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا وَكِيعٌ عَنْ حَمَّادِ بنِ سَلَمَةَ عَنْ أَبِى الزُّبَيْرِ عَنْ جَابِرٍ قَالَ دَخَلَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَكَّةَ يَوْمَ الْفَتْحِ وَعَلَيْهِ عِمَامَةٌ سَوْدَاءُ. ","115. حَدَّثَنَا ابْنُ أَبِى عُمَرَ حَدَّثَنَا سُفْيَانُ عَنْ مُسَاوِرٍ الْوَرَّاقِ عَنْ جَعْفَرِ بنِ عَمْرِو بنِ حُرَيْثٍ عَنْ أَبِيهِ قَالَ رَأَيْتُ عَلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عِمَامَةً سَوْدَاءَ. ","116. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ وَيُوسُفُ بنُ عِيسَى قَالا حَدَّثَنَا وَكِيعٌ عَنْ مُسَاوِرٍ الْوَرَّاقِ عَنْ جَعْفَرِ بنِ عَمْرِو بنِ حُرَيْثٍ عَنْ أَبِيهِ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَطَبَ النَّاسَ وَعَلَيْهِ عِمَامَةٌ سَوْدَاءُ. ","117. حَدَّثَنَا هَارُونُ بنُ إِسْحَاقَ الْهَمْدَانِىُّ حَدَّثَنَا يَحْيَى بنُ مُحَمَّدٍ الْمَدِينِىُّ عَنْ عَبْدِ الْعَزِيزِ بنِ مُحَمَّدٍ عَنْ عُبَيْدِ اللَّهِ بنِ عُمَرَ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ قَالَ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا اعْتَمَّ سَدَلَ عِمَامَتَهُ بَيْنَ كَتِفَيْهِ. ","قَالَ نَافِعٌ وَكَانَ ابْنُ عُمَرَ يَفْعَلُ ذَلِكَ. قَالَ عُبَيْدُ اللَّهِ وَرَأَيْتُ الْقَاسِمَ بنَ مُحَمَّدٍ وَسَالِمًا يَفْعَلانِ ذَلِكَ. ","118. حَدَّثَنَا يُوسُفُ بنُ عِيسَى حَدَّثَنَا وَكِيعٌ حَدَّثَنَا أَبُو سُلَيْمَانَ وَهُوَ عَبْدُ الرَّحْمٰنِ بنُ الْغَسِيلِ عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَطَبَ النَّاسَ وَعَلَيْهِ عِصَابَةٌ دَسْمَاءُ. "]},{"id":"section-18","title":"بَابٌ فِى صِفَةِ إِزَارِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["119. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا إِسْمَاعِيلُ بنُ إِبْرَاهِيمَ حَدَّثَنَا أَيُّوبُ عَنْ حُمَيْدِ بنِ هِلالٍ عَنْ أَبِى بُرْدَةَ قَالَ أَخْرَجَتْ إِلَيْنَا عَائِشَةُ رَضِىَ اللَّهُ عَنْهَا كِسَاءً مُلَبَّدًا وَإِزَارًا غَلِيظًا فَقَالَتْ قُبِضَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِى هَذَيْنِ. ","120. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ عَنْ شُعْبَةَ عَنِ الأَشْعَثِ بنِ سُلَيْمٍ قَالَ سَمِعْتُ عَمَّتِى تُحَدِّثُ عَنْ عَمِّهَا قَالَ بَيْنَا أَنَا أَمشِى بِالْمَدِينَةِ إِذَا إِنْسَانٌ خَلْفِى يَقُولُ ارْفَعْ إِزَارَكَ فَإِنَّهُ أَنْقَى وَأَبْقَى فَإِذَا هُوَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّمَا هِىَ بُرْدَةٌ مَلْحَاءُ قَالَ أَمَا لَكَ فِىَّ أُسْوَةٌ فَنَظَرْتُ فَإِذَا إِزَارُهُ إِلَى نِصْفِ سَاقَيْهِ. ","121. حَدَّثَنَا سُوَيْدُ بنُ نَصْرٍ أَخْبَرَنَا عَبْدُ اللَّهِ بنُ الْمُبَارَكِ عَنْ مُوسَى بنِ عُبَيْدَةَ عَنِ إِيَاسِ بنِ سَلَمَةَ بنِ الأَكْوَعِ عَنْ أَبِيهِ قَالَ كَانَ عُثْمَانُ بنُ عَفَّانَ يَأْتَزِرُ إِلَى أَنْصَافِ سَاقَيْهِ قَالَ هَكَذَا كَانَتْ إِزْرَةُ صَاحِبِى يَعْنِى النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","122. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا أَبُو الأَحْوَصِ عَنْ أَبِى إِسْحَاقَ عَنْ مُسْلِمِ بنِ نُذَيْرٍ عَنْ حُذَيْفَةَ بنِ الْيَمَانِ قَالَ أَخَذَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِعَضَلَةِ سَاقِى أَوْ سَاقِهِ فَقَالَ هَذَا مَوْضِعُ الإِزَارِ فَإِنْ أَبَيْتَ فَأَسْفَلُ فَإِنْ أَبَيْتَ فَلا حَقَّ لِلإِزَارِ فِى الْكَعْبَيْنِ. "]},{"id":"section-19","title":"بَابُ مَا جَاءَ فِى مِشْيَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["123. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا ابْنُ لَهِيعَةَ عَنْ أَبِى يُونُسَ عَنْ أَبِى هُرَيْرَةَ قَالَ مَا رَأَيْتُ شَيْئًا أَحْسَنَ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَأَنَّ الشَّمْسَ تَجْرِي فِى وَجْهِهِ وَمَا رَأَيْتُ أَحَدًا أَسْرَعَ فِى مَشْيِهِ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَأَنَّمَا الأَرْضُ تُطْوَى لَهُ إِنَّا لَنُجْهِدُ أَنْفُسَنَا وَإِنَّهُ لَغَيْرُ مُكْتَرِثٍ. ","124. حَدَّثَنَا عَلِىُّ بنُ حُجْرٍ وَغَيْرُ وَاحِدٍ قَالُوا حَدَّثَنَا عِيسَى بنُ يُونُسَ عَنْ عُمَرَ بنِ عَبْدِ اللَّهِ مَوْلَى غُفْرَةَ قَالَ أَخْبَرَنِى إِبْرَاهِيمُ ابْنُ مُحَمَّدٍ مِنْ وُلْدِ عَلِىِّ بنِ أَبِى طَالِبٍ قَالَ كَانَ عَلِىٌّ إِذَا وَصَفَ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ كَانَ إِذَا مَشَى تَقَلَّعَ كَأَنَّمَا يَنْحَطُّ فِى صَبَبٍ.","125. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا أَبِى عَنِ الْمَسْعُودِىِّ عَنْ عُثْمَانَ بنِ مُسْلِمِ بنِ هُرْمُزَ عَنْ نَافِعِ بنِ جُبَيْرِ بنِ مُطْعِمٍ عَنْ عَلِىٍّ كَرَّمَ اللَّهُ وَجْهَهُ قَالَ كَانَ النَّبِىُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا مَشَى تَكَفَّا تَكَفِّيًا كَأَنَّمَا يَنْحَطُّ مِنْ صَبَبٍ. "]},{"id":"section-20","title":"بَابُ تَقَنُّعِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["126. حَدَّثَنَا يُوسُفُ بنُ عِيسَى حَدَّثَنَا وَكِيعٌ حَدَّثَنَا الرَّبِيعُ بنُ صَبِيحٍ عَنْ يَزِيدَ بنِ أَبَانٍ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُكْثِرُ الْقِنَاعَ كَأَنَّ ثَوْبَهُ ثَوْبُ زَيَّاتٍ. "]},{"id":"section-21","title":"بَابُ مَا جَاءَ فِى جِلْسَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["127. حَدَّثَنَا عَبْدُ بنُ حُمَيْدٍ حَدَّثَنَا عَفَّانُ بنُ مُسْلِمٍ حَدَّثَنَا عَبْدُ اللَّهِ بنُ حَسَّانٍ عَنْ جَدَّتَيْهِ عَنْ قَيْلَةَ بِنْتِ مَخْرَمَةَ أَنَّهَا رَأَتْ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِى الْمَسْجِدِ وَهُوَ قَاعِدٌ الْقُرْفُصَاءَ قَالَتْ فَلَمَّا رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْمُتَخَشِّعَ فِى الْجِلْسَةِ أُرْعِدْتُ مِنَ الْفَرَقِ. ","128. حَدَّثَنَا سَعِيدُ بنُ عَبْدِ الرَّحْمٰنِ الْمَخْزُومِىُّ وَغَيْرُ وَاحِدٍ قَالُوا حَدَّثَنَا سُفْيَانُ عَنِ الزُّهْرِىِّ عَنْ عَبَّادِ بنِ تَمِيمٍ عَنْ عَمِّهِ أَنَّهُ رَأَى النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُسْتَلْقِيًا فِى الْمَسْجِدِ وَاضِعًا إِحْدَى رِجْلَيْهِ عَلَى الأُخْرَى.","129. حَدَّثَنَا سَلَمَةُ بنُ شَبِيبٍ حَدَّثَنَا عَبْدُ اللَّهِ بنُ إِبْرَاهِيمَ الْمَدَنِىُّ حَدَّثَنَا إِسْحَاقُ بنُ مُحَمَّدٍ الأَنْصَارِىُّ عَنْ رُبَيْحِ بنِ عَبْدِ الرَّحْمٰنِ بنِ أَبِى سَعِيدٍ عَنْ أَبِيهِ عَنْ جَدِّهِ أَبِى سَعِيدٍ الْخُدْرِىِّ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا جَلَس فِى الْمَجْلِسِ احْتَبَى بِيَدَيْهِ."]},{"id":"section-22","title":"بَابُ مَا جَاءَ فِى تُكَأَةِ النَّبِىِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["130. حَدَّثَنَا عَبَّاسُ بنُ مُحَمَّدٍ الدُّورِىُّ حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ عَنْ إِسْرَائِيلَ عَنْ سِمَاكِ بنِ حَرْبٍ عَنْ جَابِرِ بنِ سَمُرَةَ قَالَ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُتَّكِئًا عَلَى وِسَادَةٍ عَلَى يَسَارِهِ. ","131. حَدَّثَنَا حُمَيْدُ بنُ مَسْعَدَةَ حَدَّثَنَا بِشْرُ بنُ الْمُفَضَّلِ حَدَّثَنَا الْجُرَيْرِىُّ عَنْ عَبْدِ الرَّحْمٰنِ بنِ أَبِى بَكْرَةَ عَنْ أَبِيهِ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَلا أُخْبِرُكُمْ بِأَكْبَرِ الْكَبَائِرِ قَالُوا بَلَى يَا رَسُولَ اللَّهِ قَالَ الإِشْرَاكُ بِاللَّهِ وَعُقُوقُ الْوَالِدَيْنِ قَالَ وَجَلَسَ وَكَانَ مُتَّكِئًا قَالَ وَشَهَادَةُ الزُّورِ أَوْ قَوْلُ الزُّورِ قَالَ فَمَا زَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُهَا حَتَّى قُلْنَا لَيْتَهُ سَكَتَ. ","132. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا شَرِيكٌ عَنْ عَلِىِّ بنِ الأَقْمَرِ عَنْ أَبِى جُحَيْفَةَ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَمَّا أَنَا فَلا ءَاكُلُ مُتَّكِئًا. ","133. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ أَخْبَرَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِىٍّ أَخْبَرَنَا سُفْيَانُ عَنْ عَلِىِّ بنِ الأَقْمَرِ قَالَ سَمِعْتُ أَبَا جُحَيْفَةَ يَقُولُ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا ءَاكُلُ مُتَّكِئًا. ","134. حَدَّثَنَا يُوسُفُ بنُ عِيسَى حَدَّثَنَا وَكِيعٌ حَدَّثَنَا إِسْرَائِيلُ عَنْ سِمَاكِ بنِ حَرْبٍ عَنْ جَابِرِ بنِ سَمُرَةَ قَالَ رَأَيْتُ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُتَّكِئًا عَلَى وِسَادَةٍ. ","قَالَ أَبُو عِيسَى لَمْ يَذْكُرْ وَكِيعٌ فِيهِ عَلَى يَسَارِهِ وَهَكَذَا رَوَى غَيْرُ وَاحِدٍ عَنِ إِسْرَائِيلَ نَحْوَ رِوَايَةِ وَكِيعٍ وَلا نَعْلَمُ أَحَدًا ذَكَرَ فِيهِ عَلَى يَسَارِهِ إِلا مَا رَوَى إِسْحَاقُ بنُ مَنْصُورٍ عَنِ إِسْرَائِيلَ. "]},{"id":"section-23","title":"اتِّكَاءُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["135. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا عَمْرُو بنُ عَاصِمٍ أَخْبَرَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ حُمَيْدٍ عَنْ أَنَسٍ أَنَّ النَّبِىَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ شَاكِيًا فَخَرَجَ يَتَوَكَّأُ عَلَى أُسَامَةَ وَعَلَيْهِ ثَوْبٌ قِطْرِىٌّ قَدْ تَوَشَّحَ بِهِ فَصَلَّى بِهِمْ. ","136. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا مُحَمَّدُ بنُ الْمُبَارَكِ حَدَّثَنَا عَطَاءُ بنُ مُسْلِمٍ الْخَفَّافُ الْحَلَبِىُّ أَخْبَرَنَا جَعْفَرُ بنُ بُرْقَانَ عَنْ عَطَاءِ بنِ أَبِى رَبَاحٍ عَنِ الْفَضْلِ بنِ عَبَّاسٍ قَالَ دَخَلْتُ عَلَى رَسُو

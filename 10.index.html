َا عَبْدَةُ عَنْ مُحَمَّدِ بنِ عَمْرٍو حَدَّثَنَا أَبُو سَلَمَةَ عَنْ عَائِشَةَ قَالَتْ لَمْ أَرَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ فِي شَهْرٍ أَكْثَرَ مِنْ صِيَامِهِ فِي شَعْبَانَ كَانَ يَصُومُ شَعْبَانَ إِلَّا قَلِيلًا بَلْ كَانَ يَصُومُ كُلَّهُ. ","303. حَدَّثَنَا الْقَاسِمُ بنُ دِينَارٍ الْكُوفِيُّ حَدَّثَنَا عُبَيْدُ اللَّهِ بنُ مُوسَى وَطَلْقُ بنُ غَنَّامٍ عَنْ شَيْبَانَ عَنْ عَاصِمٍ عَنْ زِرِّ بنِ حُبَيْشٍ عَنْ عَبْدِ اللَّهِ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ مِنْ غُرَّةِ كُلِّ شَهْرٍ ثَلاثَةَ أَيَامٍ وَقَلَّمَا كَانَ يُفْطِرُ يَوْمَ الْجُمُعَةِ. ","304. حَدَّثَنَا أَبُو حَفْصٍ عَمْرُو بنُ عَلِيٍّ حَدَّثَنَا عَبْدُ اللَّهِ بنُ دَاوُدَ عَنْ ثَوْرِ بنِ يَزِيدَ عَنْ خَالِدِ بنِ مَعْدَانَ عَنْ رَبِيعَةَ الْجُرَشِيِّ عَنْ عَائِشَةَ قَالَتْ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَتَحَرَّى صَوْمَ الِاثْنَيْنِ وَالْخَمِيسِ. ","305. حَدَّثَنَا مُحَمَّدُ بنُ يَحْيَى حَدَّثَنَا أَبُو عَاصِمٍ عَنْ مُحَمَّدِ بنِ رِفَاعَةَ عَنْ سُهَيْلِ بنِ أَبِي صَالِحٍ عَنْ أَبِيهِ عَنْ أَبِي هُرَيْرَةَ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ تُعْرَضُ الأَعْمَالُ يَوْمَ الِاثْنَيْنِ وَالْخَمِيسِ فَأُحِبُّ أَنْ يُعْرَضَ عَمَلِي وَأَنَا صَائِمٌ. ","306. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو أَحْمَدَ وَمُعَاوِيَةُ بنُ هِشَامٍ قَالا حَدَّثَنَا سُفْيَانُ عَنْ مَنْصُورٍ عَنْ خَيْثَمَةَ عَنْ عَائِشَةَ قَالَتْ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ مِنَ الشَّهْرِ السَّبْتَ وَالأَحَدَ وَالِاثْنَيْنِ وَمِنَ الشَّهْرِ الآخَرِ الثَّلاثَاءَ وَالأَرْبَعَاءَ وَالْخَمِيسَ. ","307. حَدَّثَنَا أَبُو مُصْعَبٍ الْمَدِينِيُّ عَنْ مَالِكِ بنِ أَنَسٍ عَنْ أَبِي النَّضْرِ عَنْ أَبِي سَلَمَةَ بنِ عَبْدِ الرَّحْمٰنِ عَنْ عَائِشَةَ قَالَتْ مَا كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ فِي شَهْرٍ أَكْثَرَ مِنْ صِيَامِهِ فِي شَعْبَانَ. ","308. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا شُعْبَةُ عَنْ يَزِيدَ الرِّشْكِ قَالَ سَمِعْتُ مُعَاذَةَ قَالَتْ قُلْتُ لِعَائِشَةَ أَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ ثَلاثَةَ أَيَّامٍ مِنْ كُلِّ شَهْرٍ قَالَتْ نَعَمْ قُلْتُ مِنْ أَيِّهِ كَانَ يَصُومُ قَالَتْ كَانَ لا يُبَالِي مِنْ أَيِّهِ صَامَ.","قَالَ أَبُو عِيسَى يَزِيدُ الرِّشْكُ هُوَ يَزِيدُ الضُّبَعِيُّ الْبَصْرِيُّ وَهُوَ ثِقَةٌ رَوَى عَنْهُ شُعْبَةُ وَعَبْدُ الْوَارِثِ بنُ سَعِيدٍ وَحَمَّادُ ابْنُ زَيْدٍ وَإِسْمَاعِيلُ بنُ إِبْرَاهِيمَ وَغَيْرُ وَاحِدٍ مِنَ الأَئِمَّةِ وَهُوَ يَزِيدُ الْقَاسِمُ وَيُقَالُ الْقَسَّامُ. وَالرِّشْكُ بِلُغَةِ أَهْلِ الْبَصْرَةِ هُوَ الْقَسَّامُ. ","309. حَدَّثَنَا هَارُونُ بنُ إِسْحَاقَ الْهَمْدَانِيُّ حَدَّثَنَا عَبْدَةُ بنُ سُلَيْمَانَ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ قَالَتْ كَانَ عَاشُورَاءُ يَوْمًا تَصُومُهُ قُرَيْشٌ فِي الْجَاهِلِيَّةِ وَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُهُ فَلَمَّا قَدِمَ الْمَدِينَةَ صَامَهُ وَأَمَرَ بِصِيَامِهِ فَلَمَّا افْتُرِضَ رَمَضَانُ كَانَ رَمَضَانُ هُوَ الْفَرِيضَةَ وَتُرِكَ عَاشُورَاءُ فَمَنْ شَاءَ صَامَهُ وَمَنْ شَاءَ تَرَكَهُ. ","310. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ حَدَّثَنَا سُفْيَانُ عَنْ مَنْصُورٍ عَنْ إِبْرَاهِيمَ عَنْ عَلْقَمَةَ قَالَ سَأَلْتُ عَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا أَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَخُصُّ مِنَ الأَيَامِ شَيْئًا قَالَتْ كَانَ عَمَلُهُ دِيمَةً وَأَيُّكُمْ يُطِيقُ مَا كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُطِيقُ. ","311. حَدَّثَنَا هَارُونُ بنُ إِسْحَاقَ حَدَّثَنَا عَبْدَةُ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ قَالَتْ دَخَلَ عَلَيَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَعِنْدِي امْرَأَةٌ فَقَالَ مَنْ هَذِهِ قُلْتُ فُلانَةُ لا تَنَامُ اللَّيْلَ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَيْكُمْ مِنَ الأَعْمَالِ مَا تُطِيقُونَ فَوَاللَّهِ لا يَمَلُّ اللَّهُ حَتَّى تَمَلُّوا وَكَانَ أَحَبَّ ذَلِكَ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الَّذِي يَدُومُ عَلَيْهِ صَاحِبُهُ. ","312. حَدَّثَنَا أَبُو هِشَامٍ مُحَمَّدُ بنُ يَزِيدَ الرِّفَاعِيُّ حَدَّثَنَا ابْنُ فُضَيْلٍ عَنِ الأَعْمَشِ عَنْ أَبِي صَالِحٍ قَالَ سُئِلَتْ عَائِشَةُ وَأُمُّ سَلَمَةَ أَيُّ الْعَمَلِ كَانَ أَحَبَّ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَتَا مَا دِيمَ عَلَيْهِ وَإِنْ قَلَّ. ","313. حَدَّثَنَا مُحَمَّدُ بنُ إِسْمَاعِيلَ حَدَّثَنَا عَبْدُ اللَّهِ بنُ صَالِحٍ حَدَّثَنِي مُعَاوِيَةُ بنُ صَالِحٍ عَنْ عَمْرِو بنِ قَيْسٍ أَنَّهُ سَمِعَ عَاصِمَ بنَ حُمَيْدٍ قَالَ سَمِعْتُ عَوْفَ بنَ مَالِكٍ يَقُولُ كُنْتُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَيْلَةً فَاسْتَاكَ ثُمَّ تَوَضَّأَ ثُمَّ قَامَ يُصَلِّي فَقُمْتُ مَعَهُ فَبَدَأَ فَاسْتَفْتَحَ الْبَقَرَةَ فَلا يَمُرُّ بِآيَةِ رَحْمَةٍ إِلَّا وَقَفَ فَسَأَلَ وَلا يَمُرُّ بِآيَةِ عَذَابٍ إِلَّا وَقَفَ فَتَعَوَّذَ ثُمَّ رَكَعَ فَمَكَثَ رَاكِعًا بِقَدْرِ قِيَامِهِ وَيَقُولُ فِي رُكُوعِهِ سُبْحَانَ ذِي الْجَبَرُوتِ وَالْمَلَكُوتِ وَالْكِبْرِيَاءِ وَالْعَظَمَةِ ثُمَّ سَجَدَ بِقَدْرِ رُكُوعِهِ وَيَقُولُ فِي سُجُودِهِ سُبْحَانَ ذِي الْجَبَرُوتِ وَالْمَلَكُوتِ وَالْكِبْرِيَاءِ وَالْعَظَمَةِ ثُمَّ قَرَأَ ءَالَ عِمْرَانَ ثُمَّ سُورَةً سُورَةً يَفْعَلُ مِثْلَ ذَلِكَ."]},{"id":"section-43","title":"بَابُ مَا جَاءَ فِي قِرَاءَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["314. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا اللَّيْثُ عَنِ ابْنِ أَبِي مُلَيْكَةَ عَنْ يَعْلَى بنِ مَمْلَكٍ أَنَّهُ سَأَلَ أُمَّ سَلَمَةَ عَنْ قِرَاءَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَإِذَا هِيَ تَنْعَتُ قِرَاءَةً مُفَسَّرَةً حَرْفًا حَرْفًا. ","315. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا وَهْبُ بنُ جَرِيرِ بنِ حَازِمٍ حَدَّثَنَا أَبِي عَنْ قَتَادَةَ قَالَ قُلْتُ لِأَنَسِ بنِ مَالِكٍ كَيْفَ كَانَتْ قِرَاءَةُ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ مَدًّا. ","316. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ حَدَّثَنَا يَحْيَى بنُ سَعِيدٍ الأُمَوِيُّ عَنِ ابْنِ جُرَيْجٍ عَنِ ابْنِ أَبِي مُلَيْكَةَ عَنْ أُمِّ سَلَمَةَ قَالَتْ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُقَطِّعُ قِرَاءَتَهُ يَقُولُ ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾ ثُمَّ يَقِفُ ثُمَّ يَقُولُ ﴿الرَّحْمٰنِ الرَّحِيمِ﴾ ثُمَّ يَقِفُ وَكَانَ يَقْرَأُ ﴿مَالِكِ يَوْمِ الدِّينِ﴾. ","317. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا اللَّيْثُ عَنْ مُعَاوِيَةَ بنِ صَالِحٍ عَنْ عَبْدِ اللَّهِ بنِ أَبِي قَيْسٍ قَالَ سَأَلْتُ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا عَنْ قِرَاءَةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَكَانَ يُسِرُّ بِالْقِرَاءَةِ أَمْ يَجْهَرُ قَالَتْ كُلُّ ذَلِكَ قَدْ كَانَ يَفْعَلُ قَدْ كَانَ رُبَّمَا أَسَرَّ وَرُبَّمَا جَهَرَ فَقُلْتُ الْحَمْدُ لِلَّهِ الَّذِي جَعَلَ فِي الأَمْرِ سَعَةً. ","318. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا وَكِيعٌ حَدَّثَنَا مِسْعَرٌ عَنْ أَبِي الْعَلاءِ الْعَبْدِيِّ عَنْ يَحْيَى بنِ جَعْدَةَ عَنْ أُمِّ هَانِئٍ قَالَتْ كُنْتُ أَسْمَعُ قِرَاءَةَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِاللَّيْلِ وَأَنَا عَلَى عَرِيشِي. ","319. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا شُعْبَةُ عَنْ مُعَاوِيَةَ بنِ قُرَّةَ قَالَ سَمِعْتُ عَبْدَ اللَّهِ بنَ مُغَفَّلٍ يَقُولُ رَأَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى نَاقَتِهِ يَوْمَ الْفَتْحِ وَهُوَ يَقْرَأُ ﴿إِنَّا فَتَحْنَا لَكَ فَتْحًا مُّبِينًا لِيَغْفِرَ لَكَ اللَّهُ مَا تَقَدَّمَ مِنْ ذَنْبِكَ وَمَا تَأَخَّرَ﴾ قَالَ فَقَرَأَ وَرَجَّعَ قَالَ وَقَالَ مُعَاوِيَةُ بنُ قُرَّةَ لَوْلا أَنْ يَجْتَمِعَ النَّاسُ عَلَيَّ لأَخَذْتُ لَكُمْ فِي ذَلِكَ الصَّوْتِ أَوْ قَالَ اللَّحْنِ. ","320. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا نُوحُ بنُ قَيْسٍ الْحُدَّانِيُّ عَنْ حُسَامِ بنِ مِصَكٍّ عَنْ قَتَادَةَ قَالَ مَا بَعَثَ اللَّهُ نَبِيًّا إِلَّا حَسَنَ الْوَجْهِ حَسَنَ الصَّوْتِ وَكَانَ نَبِيُّكُمْ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَسَنَ الْوَجْهِ حَسَنَ الصَّوْتِ وَكَانَ لا يُرَجِّعُ. ","321. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ حَدَّثَنَا يَحْيَى بنُ حَسَّانَ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ أَبِي الزِّنَادِ عَنْ عَمْرِو بنِ أَبِي عَمْرٍو عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ كَانَ قِرَاءَةُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رُبَّمَا يَسْمَعُهُ مَنْ فِي الْحُجْرَةِ وَهُوَ فِي الْبَيْتِ. "]},{"id":"section-44","title":"بَابٌ فِي بُكَاءِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["322. حَدَّثَنَا سُوَيْدُ بنُ نَصْرٍ حَدَّثَنَا عَبْدُ اللَّهِ بنُ الْمُبَارِكِ عَنْ حَمَّادِ بنِ سَلَمَةَ عَنْ ثَابِتٍ عَنْ مُطَرِّفٍ وَهُوَ ابْنُ عَبْدِ اللَّهِ بنِ الشِّخِّيرِ عَنْ أَبِيهِ قَالَ أَتَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ يُصَلِّي وَلِجَوْفِهِ أَزِيزٌ كَأَزِيزِ الْمِرْجَلِ مِنَ الْبُكَاءِ. ","323. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا مُعَاوِيَةُ بنُ هِشَامٍ حَدَّثَنَا سُفْيَانُ عَنِ الأَعْمَشِ عَنْ إِبْرَاهِيمَ عَنْ عَبِيدَةَ عَنْ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُ قَالَ قَالَ لِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اقْرَأْ عَلَيَّ فَقُلْتُ يَا رَسُولَ اللَّهِ أَقْرَأُ عَلَيْكَ وَعَلَيْكَ أُنْزِلَ قَالَ أُحِبُّ أَنْ أَسْمَعَهُ مِنْ غَيْرِي فَقَرَأْتُ سُورَةَ النِّسَاءِ ﴿وَجِئْنَا بِكَ عَلَى هَؤُلاءِ شَهِيدًا﴾ قَالَ فَرَأَيْتُ عَيْنَيْ رَسُولِ اللَّهِ تَهْمُلانِ. ","324. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا جَرِيرٌ عَنْ عَطَاءِ بنِ السَّائِبِ عَنْ أَبِيهِ عَنْ عَبْدِ اللَّهِ بنِ عَمْرٍو قَالَ انْكَسَفَتِ الشَّمْسُ يَوْمًا عَلَى عَهْدِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي حَتَّى لَمْ يَكَدْ يَرْكَعُ ثُمَّ رَكَعَ فَلَمْ يَكَدْ يَرْفَعُ رَأْسَهُ ثُمَّ رَفَعَ رَأْسَهُ فَلَمْ يَكَدْ أَنْ يَسْجُدَ ثُمَّ سَجَدَ فَلَمْ يَكَدْ أَنْ يَرْفَعَ رَأْسَهُ ثُمَّ رَفَعَ رَأْسَهُ فَلَمْ يَكَدْ أَنْ يَسْجُدَ ثُمَّ سَجَدَ فَلَمْ يَكَدْ أَنْ يَرْفَعَ رَأْسَهُ فَجَعَلَ يَنْفُخُ وَيَبْكِي وَيَقُولُ رَبِّ أَلَمْ تَعِدْنِي أَنْ لا تُعَذِّبَهُمْ وَأَنَا فِيهِمْ رَبِّ أَلَمْ تَعِدْنِي أَنْ لا تُعَذِّبَهُمْ وَهُمْ يَسْتَغْفِرُونَ وَنَحْنُ نَسْتَغْفِرُكَ فَلَمَّا صَلَّى رَكْعَتَيْنِ انْجَلَتِ الشَّمْسُ فَقَامَ فَحَمِدَ اللَّهَ تَعَالَى وَأَثْنَى عَلَيْهِ ثُمَّ قَالَ إِنَّ الشَّمْسَ وَالْقَمَرَ ءَايَتَانِ مِنْ ءَايَاتِ اللَّهِ فَإِذَا انْكَسَفَا فَافْزَعُوا إِلَى ذِكْرِ اللَّهِ. ","325. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو أَحْمَدَ حَدَّثَنَا سُفْيَانُ عَنْ عَطَاءِ بنِ السَّائِبِ عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ أَخَذَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ابْنَةً لَهُ تَقْضِي فَاحْتَضَنَهَا فَوَضَعَهَا بَيْنَ يَدَيْهِ فَمَاتَتْ وَهِيَ بَيْنَ يَدَيْهِ وَصَاحَتْ أُمُّ أَيْمَنَ فَقَالَ يَعْنِي النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَتَبْكِينَ عِنْدَ رَسُولِ اللَّهِ فَقَالَتْ أَلَسْتُ أَرَاكَ تَبْكِي قَالَ إِنِّي لَسْتُ أَبْكِي إِنَّمَا هِيَ رَحْمَةٌ إِنَّ الْمُؤْمِنَ بِكُلِّ خَيْرٍ عَلَى كُلِّ حَالٍ إِنَّ نَفْسَهُ تُنْزَعُ مِنْ بَيْنِ جَنْبَيْهِ وَهُوَ يَحْمَدُ اللَّهَ عَزَّ وَجَلَّ.  ","326. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ حَدَّثَنَا سُفْيَانُ عَنْ عَاصِمِ بنِ عُبَيْدِ اللَّهِ عَنِ الْقَاسِمِ ابْنِ مُحَمَّدٍ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَبَّلَ عُثْمَانَ بنَ مَظْعُونٍ وَهُوَ مَيِّتٌ وَهُوَ يَبْكِي أَوْ قَالَ عَيْنَاهُ تُهْرَاقَانِ. ","327. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ حَدَّثَنَا أَبُو عَامِرٍ حَدَّثَنَا فُلَيْحٌ وَهُوَ ابْنُ سُلَيْمَانَ عَنْ هِلالِ بنِ عَلِيٍّ عَنْ أَنَسِ ابْنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ شَهِدْنَا ابْنَةً لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَرَسُولُ اللَّهِ جَالِسٌ عَلَى الْقَبْرِ فَرَأَيْتُ عَيْنَيْهِ تَدْمَعَانِ فَقَالَ أَفِيكُمْ رَجُلٌ لَمْ يُقَارِفِ اللَّيْلَةَ قَالَ أَبُو طَلْحَةَ أَنَا قَالَ انْزِلْ فَنَزَلَ فِي قَبْرِهَا. "]},{"id":"section-45","title":"بَابٌ فِي فِرَاشِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["328. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ أَخْبَرَنَا عَلِيُّ بنُ مُسْهِرٍ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ إِنَّمَا كَانَ فِرَاشُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الَّذِي يَنَامُ عَلَيْهِ أَدَمًا حَشْوُهُ لِيفٌ. ","329. حَدَّثَنَا أَبُو الْخَطَّابِ زِيَادُ بنُ يَحْيَى الْبَصْرِيُّ حَدَّثَنَا عَبْدُ اللَّهِ بنُ مَيْمُونٍ حَدَّثَنَا جَعْفَرُ بنُ مُحَمَّدٍ عَنْ أَبِيهِ قَالَ سُئِلَتْ عَائِشَةُ مَا كَانَ فِرَاشُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَتْ مِنْ أَدَمٍ حَشْوُهُ لِيفٌ.","وَسُئِلَتْ حَفْصَةُ مَا كَانَ فِرَاشُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي بَيْتِكِ قَالَتْ مِسْحٌ نَثْنِيهِ ثِنْيَتَيْنِ فَيَنَامُ عَلَيْهِ فَلَمَّا كَانَ ذَاتَ لَيْلَةٍ قُلْتُ لَوْ ثَنَيْتُهُ بِأَرْبَعِ ثِنْيَاتٍ لَكَانَ أَوْطَأَ لَهُ فَثَنَيْنَاهُ لَهُ بِأَرْبَعِ ثِنْيَاتٍ فَلَمَّا أَصْبَحَ قَالَ مَافَرَشْتُمُولِي اللَّيْلَةَ قَالَتْ قُلْنَا هُوَ فِرَاشُكَ إِلَّا أَنَّا ثَنَيْنَاهُ بِأَرْبَعِ ثِنْيَاتٍ قُلْنَا هُوَ أَوْطَأُ لَكَ قَالَ رُدُّوهُ لِحَالِهِ الأُولَى فَإِنَّهُ مَنَعَنِي وَطَاءَتُهُ صَلاتِيَ اللَّيْلَةَ. "]},{"id":"section-46","title":"بَابُ مَا جَاءَ فِي تَوَاضُعِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["330. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ وَسَعِيدُ بنُ عَبْدِ الرَّحْمٰنِ الْمَخْزُومِيُّ وَغَيْرُ وَاحِدٍ قَالُوا أَخْبَرَنَا سُفْيَانُ بنُ عُيَيْنَةَ عَنِ الزُّهْرِيِّ عَنْ عُبَيْدِ اللَّهِ عَنِ ابْنِ عَبَّاسٍ عَنْ عُمَرَ بنِ الْخَطَّابِ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا تُطْرُونِي كَمَا أَطْرَتِ النَّصَارَى ابْنَ مَرْيَمَ إِنَّمَا أَنَا عَبْدٌ فَقُولُوا عَبْدُ اللَّهِ وَرَسُولُهُ. ","331. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ حَدَّثَنَا سُوَيْدُ بنُ عَبْدِ الْعَزِيزِ عَنْ حُمَيْدٍ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ أَنَّ امْرَأَةً جَاءَتْ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَتْ إِنَّ لِي إِلَيْكَ حَاجَةً فَقَالَ اجْلِسِي فِي أَيِّ طَرِيقِ الْمَدِينَةِ شِئْتِ أَجْلِسْ إِلَيْكِ. ","332. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ أَنْبَأَنَا عَلِيُّ بنُ مُسْهِرٍ عَنْ مُسْلِمٍ الأَعْوَرِ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَعُودُ الْمَرِيضَ وَيَشْهَدُ الْجِنَازَةَ وَيَرْكَبُ الْحِمَارَ وَيُجِيبُ دَعْوَةَ الْعَبْدِ وَكَانَ يَوْمَ بَنِي قُرَيْظَةَ عَلَى حِمَارٍ مَخْطُومٍ بِحَبْلٍ مِنْ لِيفٍ وَعَلَيْهِ إِكَافُ لِيفٍ. ","333. حَدَّثَنَا وَاصِلُ بنُ عَبْدِ الأَعْلَى الْكُوفِيُّ حَدَّثَنَا مُحَمَّدُ بنُ فُضَيْلٍ عَنِ الأَعْمَشِ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُدْعَى إِلَى خُبْزِ الشَّعِيرِ وَالإِهَالَةِ السَّنِخَةِ فَيُجِيبُ وَلَقَدْ كَانَ لَهُ دِرْعٌ عِنْدَ يَهُودِيٍّ فَمَا وَجَدَ مَا يَفُكُّهَا حَتَّى مَاتَ. ","334. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ الْحَفَرِيُّ عَنْ سُفْيَانَ عَنِ الرَّبِيعِ بنِ صَبِيحٍ عَنْ يَزِيدَ بنِ أَبَانَ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ حَجَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى رَحْلٍ رَثٍّ وَعَلَيْهِ قَطِيفَةٌ لا تُسَاوِي أَرْبَعَةَ دَرَاهِمَ فَقَالَ اللَّهُمَّ اجْعَلْهُ حَجًّا لا رِيَاءَ فِيهِ وَلا سُمْعَةَ. ","335. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَنْبَأَنَا عَفَّانُ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ حُمَيْدٍ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ لَمْ يَكُنْ شَخْصٌ أَحَبَّ إِلَيْهِمْ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. قَالَ وَكَانُوا إِذَا رَأَوْهُ لَمْ يَقُومُوا لِمَا يَعْلَمُونَ مِنْ كَرَاهَتِهِ لِذَلِكَ. ","336. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا جُمَيْعُ بنُ عُمَرَ بنِ عَبْدِ الرَّحْمٰنِ الْعِجْلِيُّ أَخْبَرَنِي رَجُلٌ مِنْ بَنِي تَمِيمٍ مِنْ وَلَدِ أَبِي هَالَةَ زَوْجِ خَدِيجَةَ رَضِيَ اللَّهُ عَنْهَا يُكْنَى أَبَا عَبْدِ اللَّهِ عَنِ ابْنٍ لِأَبِي هَالَةَ عَنِ الْحَسَنِ بنِ عَلِيٍّ قَالَ سَأَلْتُ خَالِي هِنْدَ بنَ أَبِي هَالَةَ وَكَانَ وَصَّافًا عَنْ حِلْيَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا أَشْتَهِي أَنْ يَصِفَ لِي مِنْهَا شَيْئًا فَقَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَخْمًا مُفَخَّمًا يَتَلَأْلَأُ وَجْهُهُ تَلَأْلُؤَ الْقَمَرِ لَيْلَةَ الْبَدْرِ فَذَكَرَ الْحَدِيثَ بِطُولِهِ. قَالَ الْحَسَنُ فَكَتَمْتُهَا الْحُسَيْنَ زَمَانًا ثُمَّ حَدَّثْتُهُ فَوَجَدْتُهُ قَدْ سَبَقَنِي إِلَيْهِ فَسَأَلَهُ عَمَّا سَأَلْتُهُ عَنْهُ وَوَجَدْتُهُ قَدْ سَأَلَ أَبَاهُ عَنْ مَدْخَلِهِ وَعَنْ مَخْرَجِهِ وَشَكْلِهِ فَلَمْ يَدَعْ مِنْهُ شَيْئًا. قَالَ الْحُسَيْنُ فَسَأَلْتُ أَبِي عَنْ دُخُولِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ كَانَ إِذَا أَوَى إِلَى مَنْزِلِهِ جَزَّأَ دُخُولَهُ ثَلاثَةَ أَجْزَاءٍ جُزْءًا لِلَّهِ وَجُزْءًا لِأَهْلِهِ وَجُزْءًا لِنَفْسِهِ ثُمَّ جَزَّأَ جُزْأَهُ بَيْنَهُ وَبَيْنَ النَّاسِ وَيَرُدُّ ذَلِكَ بِالْخَاصَّةِ عَلَى الْعَامَّةِ وَلا يَدَّخِرُ عَنْهُمْ شَيْئًا. وَكَانَ مِنْ سِيرَتِهِ فِي جُزْءِ الأُمَّةِ إِيثَارُ أَهْلِ الْفَضْلِ بِإِذْنِهِ وَقَسْمُهُ عَلَى قَدْرِ فَضْلِهِمْ فِي الدِّينِ فَمِنْهُمْ ذُو الْحَاجَةِ وَمِنْهُمْ ذُو الْحَاجَتَيْنِ وَمِنْهُمْ ذُو الْحَوَائِجِ فَيَتَشَاغَلُ بِهِمْ وَيُشْغِلُهُمْ فِيمَا أَصْلَحَهُمْ وَالأُمَّةَ مِنْ مَسْأَلَتِهِمْ عَنْهُمْ وَإِخْبَارِهِمْ بِالَّذِي يَنْبَغِي لَهُمْ وَيَقُولُ لِيُبَلِّغِ الشَّاهِدُ مِنْكُمُ الْغَائِبَ وَأَبْلِغُونِي حَاجَةَ مَنْ لا يَسْتَطِيعُ إِبْلاغَهَا فَإِنَّهُ مَنْ أَبْلَغَ سُلْطَانًا حَاجَةَ مَنْ لا يَسْتَطِيعُ إِبْلاغَهَا ثَبَّتَ اللَّهُ قَدَمَيْهِ يَوْمَ الْقِيَامَةِ. لا يُذْكَرُ عِنْدَهُ إِلَّا ذَلِكَ وَلا يَقْبَلُ مِنْ أَحَدٍ غَيْرَهُ. يَدْخُلُونَ رُوَّادًا وَلا يَفْتَرِقُونَ إِلَّا عَنْ ذَوَاقٍ وَيَخْرُجُونَ أَدِلَّةً يَعْنِي عَلَى الْخَيْرِ. قَالَ فَسَأَلْتُهُ عَنْ مَخْرَجِهِ كَيْفَ كَانَ يَصْنَعُ فِيهِ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَخْزِنُ لِسَانَهُ إِلَّا فِيمَا يَعْنِيهِ. وَيُؤَلِّفُهُمْ وَلا يُنَفِّرُهُمْ. وَيُكْرِمُ كَرِيمَ كُلِّ قَوْمٍ وَيُوَلِّيهِ عَلَيْهِمْ. وَيَحْذَرُ النَّاسَ وَيَحْتَرِسُ مِنْهُمْ مِنْ غَيْرِ أَنْ يَطْوِيَ عَنْ أَحَدٍ مِنْهُمْ بِشْرَهُ وَلا خُلُقَهُ. وَيَتَفَقَّدُ أَصْحَابَهُ. وَيَسْأَلُ النَّاسَ عَمَّا فِي النَّاسِ. وَيُحَسِّنُ الْحَسَنَ وَيُقَوِّيهِ وَيُقَبِّحُ الْقَبِيحَ وَيُوَهِّنُهُ. مُعْتَدِلُ الأَمْرِ غَيْرُ مُخْتَلِفٍ. لا يَغْفُلُ مَخَافَةَ أَنْ يَغْفُلُوا أَوْ يَمِيلُوا. لِكُلِّ حَالٍ عِنْدَهُ عَتَادٌ. لا يُقَصِّرُ عَنِ الْحَقِّ وَلا يُجَاوِزُهُ. الَّذِينَ يَلُونَهُ مِنَ النَّاسِ خِيَارُهُمْ. أَفْضَلُهُمْ عِنْدَهُ أَعَمُّهُمْ نَصِيحَةً وَأَعْظَمُهُمْ عِنْدَهُ مَنْزِلَةً أَحْسَنُهُمْ مُوَاسَاةً وَمُؤَازَرَةً. قَالَ فَسَأَلْتُهُ عَنْ مَجْلِسِهِ فَقَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا يَقُومُ وَلا يَجَلِسُ إِلَّا عَلَى ذِكْرٍ وَإِذَا انْتَهَى إِلَى قَوْمٍ جَلَسَ حَيْثُ يَنْتَهِي بِهِ الْمَجْلِسُ وَيَأْمُرُ بِذَلِكَ. يُعْطِي كُلَّ جُلَسَائِهِ بِنَصِيبِهِ لا يَحْسَبُ جَلِيسُهُ أَنَّ أَحَدًا أَكْرَمُ عَلَيْهِ مِمَّنْ جَالَسَهُ وَمَنْ سَأَلَهُ حَاجَةً لَمْ يَرُدَّهُ إِلَّا بِهَا أَوْ بِمَيْسُورٍ مِنَ الْقَوْلِ. قَدْ وَسِعَ النَّاسَ بَسْطُهُ وَخُلُقُهُ فَصَارَ لَهُمْ أَبًا وَصَارُوا عِنْدَهُ فِي الْحَقِّ سَوَاءً. مَجْلِسُهُ مَجْلِسُ حِلْمٍ وَحَيَاءٍ وَصَبْرٍ وَأَمَانَةٍ لا تُرْفَعُ فِيهِ الأَصْوَاتُ وَلا تُؤْبَنُ فِيهِ الْحُرَمُ يَتَعَاطَفُونَ فِيهِ بِالتَّقْوَى مُتَوَاضِعِينَ يُوَقِّرُونَ فِيهِ الْكَبِيرَ وَيَرْحَمُونَ فِيهِ الصَّغِيرَ وَيُؤْثِرُونَ ذَا الْحَاجَةِ وَيَحْفَظُونَ الْغَرِيبَ. ","337. حَدَّثَنَا مُحَمَّدُ بنُ عَبْدِ اللَّهِ بنِ بَزِيعٍ حَدَّثَنَا بِشْرُ بنُ الْمُفَضَّلِ حَدَّثَنَا سَعِيدٌ عَنْ قَتَادَةَ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَوْ أُهْدِيَ إِلَيَّ كُرَاعٌ لَقَبِلْتُ وَلَوْ دُعِيتُ عَلَيْهِ لَأَجَبْتُ. ","338. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ حَدَّثَنَا سُفْيَانُ عَنْ مُحَمَّدِ بنِ الْمُنْكَدِرِ عَنْ جَابِرِ بنِ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُ قَالَ جَاءَنِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَيْسَ برَاكِبِ بَغْلٍ وَلا بِرْذَوْنٍ. ","339. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ حَدَّثَنَا أَبُو نُعَيْمٍ حَدَّثَنَا يَحْيَى بنُ أَبِي الْهَيْثَمِ الْعَطَّارُ قَالَ سَمِعْتُ يُوسُفَ بنَ عَبْدِ اللَّهِ بنِ سَلامٍ قَالَ سَمَّانِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُوسُفَ وَأَقْعَدَنِي فِي حِجْرِهِ وَمَسَحَ عَلَى رَأْسِي. ","340. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا الرَّبِيعُ بنُ صَبِيحٍ حَدَّثَنَا يَزِيدُ الرَّقَاشِيُّ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَجَّ عَلَى رَحْلٍ رَثٍّ وَقَطِيفَةٍ كُنَّا نُرَى ثَمَنَهَا أَرْبَعَةَ دَرَاهِمَ فَلَمَّا اسْتَوَتْ بِهِ رَاحِلَتُهُ قَالَ لَبَّيْكَ بِحَجٍّ لا سُمْعَةَ فِيهِ وَلا رِيَاءَ. ","341. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ حَدَّثَنَا عَبْدُ الرَّزَّاقِ أَخْبَرَنَا مَعْمَرٌ عَنْ ثَابِتٍ الْبُنَانِيِّ وَعَاصِمٍ الأَحْوَلِ عَنْ أَنَسِ ابْنِ مَالِكٍ أَنَّ رَجُلًا خَيَّاطًا دَعَا رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَرَّبَ إِلَيْهِ ثَرِيدًا عَلَيْهِ دُبَّاءٌ قَالَ فَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْخُذُ الدُّبَّاءَ قَالَ وَكَانَ يُحِبُّ الدُّبَّاءَ. ","قَالَ ثَابِتٌ فَسَمِعْتُ أَنَسًا يَقُولُ فَمَا صُنِعَ لِي طَعَامٌ أَقْدِرُ عَلَى أَنْ يُصْنَعَ فِيهِ دُبَّاءٌ إِلَّا صُنِعَ. ","342. حَدَّثَنَا مُحَمَّدُ بنُ إِسْمَاعِيلَ حَدَّثَنَا عَبْدُ اللَّهِ بنُ صَالِحٍ حَدَّثَنِي مُعَاوِيَةُ بنُ صَالِحٍ عَنْ يَحْيَى بنِ سَعِيدٍ عَنْ عَمْرَةَ قَالَتْ قِيلَ لِعَائِشَةَ رَضِيَ اللَّهُ عَنْهَا مَاذَا كَانَ يَعْمَلُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي بَيْتِهِ قَالَتْ كَانَ بَشَرًا مِنَ الْبَشَرِ يَفْلِي ثَوْبَهُ وَيَحْلِبُ شَاتَهُ وَيَخْدِمُ نَفْسَهُ. "]},{"id":"section-47","title":"بَابٌ فِي خُلُقِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["343. حَدَّثَنَا عَبَّاسُ بنُ مُحَمَّدٍ الدُّورِيُّ حَدَّثَنَا عَبْدُ اللَّهِ بنُ يَزِيدَ الْمُقْرِئُ حَدَّثَنَا لَيْثُ بنُ سَعْدٍ حَدَّثَنَا أَبُو عُثْمَانَ الْوَلِيدُ بنُ أَبِي الْوَلِيدِ عَنْ سُلَيْمَانَ بنِ خَارِجَةَ عَنْ خَارِجَةَ بنِ زَيْدِ بنِ ثَابِتٍ قَالَ دَخَلَ نَفَرٌ عَلَى زَيْدِ بنِ ثَابِتٍ فَقَالُوا لَهُ حَدِّثْنَا أَحَادِيثَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ مَاذَا أُحَدِّثُكُمْ كُنْتُ جَارَهُ فَكَانَ إِذَا نَزَلَ عَلَيْهِ الْوَحْيُ بَعَثَ إِلَيَّ فَكَتَبْتُهُ لَهُ فَكُنَّا إِذَا ذَكَرْنَا الدُّنْيَا ذَكَرَهَا مَعَنَا وَإِذَا ذَكَرْنَا الآخِرَةَ ذَكَرَهَا مَعَنَا وَإِذَا ذَكَرْنَا الطَّعَامَ ذَكَرَهُ مَعَنَا فَكُلُّ هَذَا أُحَدِّثُكُمْ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","344. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى حَدَّثَنَا يُونُسُ بنُ بُكَيْرٍ عَنْ مُحَمَّدِ بنِ إِسْحَاقَ عَنْ زِيَادِ بنِ أَبِي زِيَادٍ عَنْ مُحَمَّدِ ابْنِ كَعْبٍ الْقُرَظِيِّ عَنْ عَمْرِو بنِ الْعَاصِي قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُقْبِلُ بِوَجْهِهِ وَحَدِيثِهِ عَلَى أَشَرِّ الْقَوْمِ يَتَأَلَّفُهُمْ بِذَلِكَ فَكَانَ يُقْبِلُ بِوَجْهِهِ وَحَدِيثِهِ عَلَيَّ حَتَّى ظَنَنْتُ أَنِّي خَيْرُ الْقَوْمِ فَقُلْتُ يَا رَسُولَ اللَّهِ أَنَا خَيْرٌ أَوْ أَبُو بَكْرٍ فَقَالَ أَبُو بَكْرٍ فَقُلْتُ يَا رَسُولَ اللَّهِ أَنَا خَيْرٌ أَوْ عُمَرُ فَقَالَ عُمَرُ فَقُلْتُ يَا رَسُولَ اللَّهِ أَنَا خَيْرٌ أَمْ عُثْمَانُ فَقَالَ عُثْمَانُ فَلَمَّا سَأَلْتُ رَسُولَ اللَّهِ فَصَدَقَنِي فَلَوَدِدْتُ أَنِّي لَمْ أَكُنْ سَأَلْتُهُ. ","345. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا جَعْفَرُ بنُ سُلَيْمَانَ الضُّبَعِيُّ عَنْ ثَابِتٍ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ خَدَمْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَشْرَ سِنِينَ فَمَا قَالَ لِي أُفٍّ قَطُّ وَمَا قَالَ لِي لِشَىْءٍ صَنَعْتُهُ لِمَ صَنَعْتَهُ وَلا لِشَىْءٍ تَرَكْتُهُ لِمَ تَرَكْتَهُ وَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ أَحْسَنِ النَّاسِ خُلُقًا وَلا مَسِسْتُ خَزًّا وَلا حَرِيرًا وَلا شَيْئًا كَانَ أَلْيَنَ مِنْ كَفِّ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلا شَمَمْتُ مِسْكًا قَطُّ وَلا عِطْرًا كَانَ أَطْيَبَ مِنْ عَرَقِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","346. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ وَأَحَمْدُ بنُ عَبْدَةَ هُوَ الضَّبِّيُّ الْمَعْنَى وَاحِدٌ قَالا حَدَّثَنَا حَمَّادُ بنُ زَيْدٍ عَنْ سَلْمٍ الْعَلَوِيِّ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ كَانَ عِنْدَهُ رَجُلٌ بِهِ أَثَرُ صُفْرَةٍ قَالَ وَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا يَكَادُ يُواجِهُ أَحَدًا بِشَىْءٍ يَكْرَهُهُ فَلَمَّا قَامَ قَالَ لِلْقَوْمِ لَوْ قُلْتُمْ لَهُ يَدَعُ هَذِهِ الصُّفْرَةَ. ","347. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ أَبِي إِسْحَاقَ عَنْ أَبِي عَبْدِ اللَّهِ الْجَدَلِيِّ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا أَنَّهَا قَالَتْ لَمْ يَكُنْ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَاحِشًا وَلا مُتَفَحِّشًا وَلا صَخَّابًا فِي الأَسْوَاقِ وَلا يَجْزِي بِالسَّيِّئَةِ السَّيِّئَةَ وَلَكِنْ يَعْفُو وَيَصْفَحُ. ","348. حَدَّثَنَا هَارُونُ بنُ إِسْحَاقَ الْهَمْدَانِيُّ حَدَّثَنَا عَبْدَةُ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ مَا ضَرَبَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِيَدِهِ شَيْئًا قَطُّ إِلَّا أَنْ يُجَاهِدَ فِي سَبِيلِ اللَّهِ وَلا ضَرَبَ خَادِمًا وَلا امْرَأَةً. ","349. حَدَّثَنَا أَحْمَدُ بنُ عَبْدَةَ الضَّبِّيُّ حَدَّثَنَا فُضَيْلُ بنُ عِيَاضٍ عَنْ مَنْصُورٍ عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ مَا رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُنْتَصِرًا مِنْ مَظْلَمَةٍ ظُلِمَهَا قَطُّ مَا لَمْ يُنْتَهَكْ مِنْ مَحَارِمِ اللَّهِ شَىْءٌ فَإِذَا انْتُهِكَ مِنْ مَحَارِمِ اللَّهِ شَىْءٌ كَانَ مِنْ أَشَدِّهِمْ فِي ذَلِكَ غَضَبًا وَمَا خُيِّرَ بَيْنَ أَمْرَيْنِ إِلَّا اخْتَارَ أَيْسَرَهُمَا مَا لَمْ يَكُنْ مَأْثَمًا. ","350. حَدَّثَنَا ابْنُ أَبِي عُمَرَ حَدَّثَنَا سُفْيَانُ عَنْ مُحَمَّدِ بنِ الْمُنْكَدِرِ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتِ اسْتَأْذَنَ رَجُلٌ عَلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا عِنْدَهُ فَقَالَ بِئْسَ ابْنُ الْعَشِيرَةِ أَوْ أَخُو الْعَشِيرَةِ ثُمَّ أَذِنَ لَهُ فَأَلانَ لَهُ الْقَوْلَ فَلَمَّا خَرَجَ قُلْتُ يَا رَسُولَ اللَّهِ قُلْتَ مَا قُلْتَ ثُمَّ أَلَنْتَ لَهُ الْقَوْلَ فَقَالَ يَا عَائِشَةُ إِنَّ مِنْ شَرِّ النَّاسِ مَنْ تَرَكَهُ النَّاسُ أَوْ وَدَعَهُ النَّاسُ اتِّقَاءَ فُحْشِهِ. ","351. حَدَّثَنَا سُفْيَانُ بنُ وَكِيعٍ حَدَّثَنَا جُمَيْعُ بنُ عُمَرَ بنِ عَبْدِ الرَّحْمٰنِ الْعِجْلِيُّ حَدَّثَنِي رَجُلٌ مِنْ بَنِي تَمِيمٍ مِنْ وَلَدِ أَبِي هَالَةَ زَوْجِ خَدِيجَةَ يُكْنَى أَبَا عَبْدِ اللَّهِ عَنِ ابْنٍ لِأَبِي هَالَةَ عَنِ الْحَسَنِ بنِ عَلِيٍّ قَالَ قَالَ الْحُسَيْنُ سَأَلْتُ أَبِي عَنْ سِيرَةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي جُلَسَائِهِ فَقَالَ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَائِمَ الْبِشْرِ سَهْلَ الْخُلُقِ لَيِّنَ الْجَانِبِ لَيْسَ بِفَظٍّ وَلا غَلِيظٍ وَلا سَخَّابٍ وَلا فَحَّاشٍ وَلا عَيَّابٍ وَلا مَدَّاحٍ يَتَغَافَلُ عَمَّا لا يَشْتَهِي وَلا يُؤْيَسُ مِنْهُ وَلا يُجِيبُ فِيهِ. ","قَدْ تَرَكَ نَفْسَهُ مِنْ ثَلاثٍ الرِّيَاءِ وَالإِكْثَارِ وَمَا لا يَعْنِيهِ. وَتَرَكَ النَّاسَ مِنْ ثَلاثٍ كَانَ لا يَذُمُّ أَحَدًا وَلا يَعِيبُهُ وَلا يَطْلُبُ عَوْرتَهُ. وَلا يَتَكَلَّمُ إِلَّا فِيمَا رَجَا ثَوَابَهُ وَإِذَا تَكَلَّمَ أَطْرَقَ جُلَسَاؤُهُ كَأَنَّمَا عَلَى رُؤُوسِهِمُ الطَّيْرُ فَإِذَا سَكَتَ تَكَلَّمُوا لا يَتَنَازَعُونَ عِنْدَهُ الْحَدِيثَ مَنْ تَكَلَّمَ عِنْدَهُ أَنْصَتُوا لَهُ حَتَّى يَفْرُغَ، حَدِيثُهُمْ عِنْدَهُ حَدِيثُ أَوَّلِيَّتِهِمْ يَضْحَكُ مِمَّا يَضْحَكُونَ مِنْهُ وَيَتَعَجَّبُ مِمَّا يَتَعَجَّبُونَ مِنْهُ وَيَصْبِرُ لِلْغَرِيبِ عَلَى الْجَفْوَةِ فِي مَنْطِقِهِ وَمَسْأَلَتِهِ حَتَّى إِنْ كَانَ أَصْحَابُهُ لِيَسْتَجْلِبُونَهُمْ وَيَقُولُ إِذَا رَأَيْتُمْ طَالِبَ حَاجَةٍ يِطْلُبُهَا فَأَرْفِدُوهُ. وَلا يَقْبَلُ الثَّنَاءَ إِلَّا مِنْ مُكَافِئٍ. وَلا يَقْطَعُ عَلَى أَحَدٍ حَدِيثَهُ حَتَّى يَجُوزَ فَيَقْطَعُهُ بِنَهْيٍ أَوْ قِيَامٍ. ","352. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ حَدَّثَنَا سُفْيَانُ عَنْ مُحَمَّدِ بنِ الْمُنْكَدِرِ قَالَ سَمِعْتُ جَابِرَ بنَ عَبْدِ اللَّهِ يَقُولُ مَا سُئِلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَيْئًا قَطُّ فَقَالَ لا. ","353. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عِمْرَانَ أَبُو الْقَاسِمِ الْقُرَشِيُّ الْمَكِّيُّ حَدَّثَنَا إِبْرَاهِيمُ بنُ سَعْدٍ عَنِ ابْنِ شِهَابٍ عَنْ عُبَيْدِ اللَّهِ عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَجْوَدَ النَّاسِ بِالْخَيْرِ وَكَانَ أَجْوَدَ مَا يَكُونُ فِي شَهْرِ رَمَضَانَ حَتَّى يَنْسَلِخَ فَيَأْتِيهِ جِبْرِيلُ فَيَعْرِضُ عَلَيْهِ الْقُرْءَانَ فَإِذَا لَقِيَهُ جِبْرِيلُ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَجْوَدَ بِالْخَيْرِ مِنَ الرِّيحِ الْمُرْسَلَةِ. ","354. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا جَعْفَرُ بنُ سُلَيْمَانَ عَنْ ثَابِتٍ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا يَدَّخِرُ شَيْئًا لِغَدٍ. ","355. حَدَّثَنَا هَارُونُ بنُ مُوسَى بنِ أَبِي عَلْقَمَةَ الْمَدَنِيُّ حَدَّثَنِي أَبِي عَنْ هِشَامِ بنِ سَعْدٍ عَنْ زَيْدِ بنِ أَسْلَمَ عَنْ أَبِيهِ عَنْ عُمَرَ بنِ الْخَطَّابِ رَضِيَ اللَّهُ تَعَالَى عَنْهُ أَنَّ رَجُلًا جَاءَ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَسَأَلَهُ أَنْ يُعْطِيَهُ فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَا عِنْدِي شَىْءٌ وَلَكِنِ ابْتَعْ عَلَيَّ فَإِذَا جَاءَنِي شَىْءٌ قَضَيْتُهُ فَقَالَ عُمَرُ يَا رَسُولَ اللَّهِ قَدْ أَعْطَيْتَهُ فَمَا كَلَّفَكَ اللَّهُ مَا لا تَقْدِرُ عَلَيْهِ فَكَرِهَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَوْلَ عُمَرَ فَقَالَ رَجُلٌ مِنَ الأَنْصَارِ يَا رَسُولَ اللَّهِ أَنْفِقْ وَلا تَخَفْ مِنْ ذِي الْعَرْشِ إِقْلالًا فَتَبَسَّمَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَعُرِفَ الْبِشْرُ فِي وَجْهِهِ لِقَوْلِ الأَنْصَارِيِّ ثُمَّ قَالَ بِهَذَا أُمِرْتُ. ","356. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ أَنْبَأَنَا شَرِيكٌ عَنْ عَبْدِ اللَّهِ بنِ مُحَمَّدِ بنِ عَقِيلٍ عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذٍ ابْنِ عَفْرَاءَ قَالَتْ أَتَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِقِنَاعٍ مِنْ رُطَبٍ وَأَجْرٍ زُغْبٍ فَأَعْطَانِي مِلْءَ كَفِّهِ حُلِيًّا أَوْ ذَهَبًا. ","357. حَدَّثَنَا عَلِيُّ بنُ خَشْرَمٍ وَغَيْرُ وَاحِدٍ قَالُوا حَدَّثَنَا عِيسَى بنُ يُونُسَ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَقْبَلُ الْهَدِيَّةَ وَيُثِيبُ عَلَيْهَا. "]},{"id":"section-48","title":"بَابُ مَا جَاءَ فِي حَيَاءِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["358. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا شُعْبَةُ عَنْ قَتَادَةَ قَالَ سَمِعْتُ عَبْدَ اللَّهِ بنَ أَبِي عُتْبَةَ يُحَدِّثُ عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَشدَّ حَيَاءً مِنَ الْعَذْرَاءِ فِي خِدْرِهَا وَكَانَ إِذَا كَرِهَ شَيْئًا عَرَفْنَاهُ فِي وَجْهِهِ. ","359. حَدَّثَنَا مَحْمُودُ بنُ غَيْلانَ حَدَّثَنَا وَكِيعٌ حَدَّثَنَا سُفْيَانُ عَنْ مَنْصُورٍ عَنْ مُوسَى بنِ عَبْدِ اللَّهِ بنِ يَزِيدَ الْخَطْمِيِّ عَنْ مَوْلًى لِعَائِشَةَ قَالَ قَالَتْ عَائِشَةُ مَا نَظَرْتُ إِلَى فَرْجِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَوْ قَالَتْ مَا رَأَيْتُ فَرْجَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَطُّ. "]},{"id":"section-49","title":"بَابُ مَا جَاءَ فِي حِجَامَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["360. حَدَّثَنَا عَلِيُّ بنُ حُجْرٍ حَدَّثَنَا إِسْمَاعِيلُ بنُ جَعْفَرٍ عَنْ حُمَيْدٍ قَالَ سُئِلَ أَنَسُ بنُ مَالِكٍ عَنْ كَسْبِ الْحَجَّامِ فَقَالَ احْتَجَمَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَجَمَهُ أَبُو طَيْبَةَ فَأَمَرَ لَهُ بِصَاعَيْنِ مِنْ طَعَامٍ وَكَلَّمَ أَهْلَهُ فَوَضَعُوا عَنْهُ مِنْ خَرَاجِهِ وَقَالَ إِنَّ أَفْضَلَ مَا تَدَاوَيْتُمْ بِهِ الْحِجَامَةُ أَوْ إِنَّ أَمْثَلَ دَوَائِكُمُ الْحِجَامَةُ. ","361. حَدَّثَنَا عَمْرُو بنُ عَلِيٍّ حَدَّثَنَا أَبُو دَاوُدَ حَدَّثَنَا وَرْقَاءُ بنُ عُمَرَ عَنْ عَبْدِ الأَعْلَى عَنْ أَبِي جَمِيلَةَ عَنْ عَلِيٍّ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ احْتَجَمَ وَأَمَرَنِي فَأَعْطَيْتُ الْحَجَّامَ أَجْرَهُ. ","362. حَدَّثَنَا هَارُونُ بنُ إِسْحَاقَ الْهَمْدَانِيُّ حَدَّثَنَا عَبْدَةُ عَنْ سُفْيَانَ الثَّوْرِيِّ عَنْ جَابِرٍ عَنِ الشَّعْبِيِّ عَنِ ابْنِ عَبَّاسٍ أَظُنُّهُ قَالَ إِنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ احْتَجَمَ فِي الأَخْدَعَيْنِ وَبَيْنَ الْكَتِفَيْنِ وَأَعْطَى الْحَجَّامَ أَجْرَهُ وَلَوْ كَانَ حَرَامًا لَمْ يُعْطِهِ. ","363. حَدَّثَنَا هَارُونُ بنُ إِسْحَاقَ حَدَّثَنَا عَبْدَةُ عَنِ ابْنِ أَبِي لَيْلَى عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَعَا حَجَّامًا فَحَجَمَهُ وَسَأَلَهُ كَمْ خَرَاجُكَ قَالَ ثَلاثَةُ ءَاصُعٍ فَوَضَعَ عَنْهُ صَاعًا وَأَعْطَاهُ أَجْرَهُ. ","364. حَدَّثَنَا عَبْدُ الْقُدُّوسِ بنُ مُحَمَّدٍ الْعَطَّارُ الْبَصْرِيُّ حَدَّثَنَا عَمْرُو بنُ عَاصِمٍ حَدَّثَنَا هَمَّامٌ وَجَرِيرُ بنُ حَازِمٍ قَالا حَدَّثَنَا قَتَادَةُ عَنْ أَنَسِ بنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَحْتَجِمُ فِي الأَخْدَعَيْنِ وَالْكَاهِلِ وَكَانَ يَحْتَجِمُ لِسَبْعَ عَشْرَةَ وَتِسْعَ عَشْرَةَ وَإِحْدَى وَعِشْرِينَ. ","365. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ حَدَّثَنَا عَبْدُ الرَّزَّاقِ عَنْ مَعْمَرٍ عَنْ قَتَادَةَ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ احْتَجَمَ وَهُوَ مُحْرِمٌ بَمَلَلٍ عَلَى ظَهْرِ الْقَدَمِ."]},{"id":"section-50","title":"بَابُ مَا جَاءَ فِي أَسْمَاءِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["366. حَدَّثَنَا سَعِيدُ بنُ عَبْدِ الرَّحْمٰنِ الْمَخْزُومِيُّ وَغَيْرُ وَاحِدٍ قَالُوا حَدَّثَنَا سُفْيَانُ عَنِ الزُّهْرِيِّ عَنْ مُحَمَّدِ بنِ جُبَيْرِ ابْنِ مُطْعِمٍ عَنْ أَبِيهِ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنَّ لِي أَسْمَاءً أَنَا مُحَمَّدٌ وَأَنَا أَحْمَدُ وَأَنَا الْمَاحِي الَّذِي يَمْحُو اللَّهُ بِيَ الْكُفْرَ وَأَنَا الْحَاشِرُ الَّذِي يُحْشَرُ النَّاسُ عَلَى قَدَمِي وَأَنَا الْعَاقِبُ وَالْعَاقِبُ الَّذِي لَيْسَ بَعْدَهُ نَبِيٌّ. ","367. حَدَّثَنَا مُحَمَّدُ بنُ طَرِيفٍ الْكُوفِيُّ حَدَّثَنَا أَبُو بَكْرِ بنُ عَيَّاشٍ عَنْ عَاصِمٍ عَنْ أَبِي وَائِلٍ عَنْ حُذَيْفَةَ قَالَ لَقِيتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي بَعْضِ طُرُقِ الْمَدِينَةِ فَقَالَ أَنَا مُحَمَّدٌ وَأَنَا أَحْمَدُ وَأَنَا نَبِيُّ الرَّحْمَةِ وَنَبِيُّ التَّوْبَةِ وَأَنَا الْمُقَفَّى وَأَنَا الْحَاشِرُ وَنَبِيُّ الْمَلاحِمِ. ","368. حَدَّثَنَا إِسْحَاقُ بنُ مَنْصُورٍ حَدَّثَنَا النَّضْرُ بنُ شُمَيْلٍ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ عَاصِمٍ عَنْ زِرٍّ عَنْ حُذَيْفَةَ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَحْوَهُ بِمَعْنَاهُ. هَكَذَا قَالَ حَمَّادُ بنُ سَلَمَةَ عَنْ عَاصِمٍ عَنْ زِرٍّ عَنْ حُذَيْفَةَ رَضِيَ اللَّهُ عَنْهُ."]},{"id":"section-51","title":"51. بَابُ صِفَةِ عَيْشِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["369. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا أَبُو الأَحْوَصِ عَنْ سِمَاكِ بنِ حَرْبٍ قَالَ سَمِعْتُ النُّعْمَانَ بنَ بَشِيرٍ يَقُولُ أَلَسْتُمْ فِي طَعَامٍ وَشَرَابٍ مَا شِئْتُمْ لَقَدْ رَأَيْتُ نَبِيَّكُمْ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَمَا يَجِدُ مِنَ الدَّقَلِ مَا يَمْلأُ بَطْنَهُ.","370. حَدَّثَنَا هَارُونُ بنُ إِسْحَاقَ حَدَّثَنَا عَبْدَةُ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ قَالَتْ إِنْ كُنَّا ءَالَ مُحَمَّدٍ نَمْكُثُ شَهْرًا مَا نَسْتَوْقِدُ بِنَارٍ إِنْ هُوَ إِلَّا الأَسْوَدَانِ التَّمْرُ وَالْمَاءُ. ","371. حَدَّثَنَا عَبْدُ اللَّهِ بنُ أَبِي زِيَادٍ حَدَّثَنَا سَيَّارٌ حَدَّثَنَا سَهْلُ بنُ أَسْلَمَ عَنْ يَزِيدَ بنِ أَبِي مَنْصُورٍ عَنْ أَنَسٍ عَنْ أَبِي طَلْحَةَ قَالَ شَكَوْنَا إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْجُوعَ وَرَفَعْنَا عَنْ بُطُونِنَا عَنْ حَجَرٍ حَجَرٍ فَرَفَعَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ بَطْنِهِ عَنْ حَجَرَيْنِ. ","هَذَا حَدِيثٌ غَرِيبٌ مِنْ حَدِيثِ أَبِي طَلْحَةَ لا نَعْرِفُهُ إِلَّا مِنْ هَذَا الْوَجْهِ. ","وَمَعْنَى قَوْلِهِ وَرَفَعْنَا عَنْ بُطُونِنَا عَنْ حَجَرٍ حَجَرٍ قَالَ كَانَ أَحَدُهُمْ يَشُدُّ فِي بَطْنِهِ الْحَجَرَ مِنَ الْجَهْدِ وَالضَّعْفِ الَّذِي بِهِ مِنَ الْجُوعِ. ","372. حَدَّثَنَا مُحَمَّدُ بنُ إِسْمَاعِيلَ حَدَّثَنَا ءَادَمُ بنُ أَبِي إِيَاسٍ حَدَّثَنَا شَيْبَانُ أَبُو مُعَاوِيَةَ حَدَّثَنَا عَبْدُ الْمَلِكِ بنُ عُمَيْرٍ عَنْ أَبِي سَلَمَةَ بنِ عَبْدِ الرَّحْمٰنِ عَنْ أَبِي هُرَيْرَةَ قَالَ خَرَجَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي سَاعَةٍ لا يَخْرُجُ فِيهَا وَلا يَلْقَاهُ فِيهَا أَحَدٌ فَأَتَاهُ أَبُو بَكْرٍ فَقَالَ مَا جَاءَ بِكَ يَا أَبَا بَكْرٍ قَالَ خَرَجْتُ أَلْقَى رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنْظُرُ فِي وَجْهِهِ وَالتَّسْلِيمَ عَلَيْهِ فَلَمْ يَلْبَثْ أَنْ جَاءَ عُمَرُ فَقَالَ مَا جَاءَ بِكَ يَا عُمَرُ فَقَالَ الْجُوعُ يَا رَسُولَ اللَّهِ قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا قَدْ وَجَدْتُ بَعْضَ ذَلِكَ فَانْطَلَقُوا إِلَى مَنْزِلِ أَبِي الْهَيْثَمِ بنِ التَّيِّهَانِ الأَنْصَارِيِّ وَكَانَ رَجُلًا كَثِيرَ النَّخْلِ وَالشَّاءِ وَلَمْ يَكُنْ لَهُ خَدَمٌ فَلَمْ يَجِدُوهُ فَقَالُوا لِامْرَأَتِهِ أَيْنَ صَاحِبُكِ فَقَالَتِ انْطَلَقَ يَسْتَعْذِبُ لَنَا الْمَاءَ فَلَمْ يَلْبَثْ أَنْ جَاءَ أَبُو الْهَيْثَمِ بِقِرْبَةٍ يَزْعَبُهَا فَوَضَعَهَا ثُمَّ جَاءَ يَلْتَزِمُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَيُفَدِّيهِ بِأَبِيهِ وَأُمِّهِ ثُمَّ انْطَلَقَ بِهِمْ إِلَى حَدِيقَتِهِ فَبَسَطَ لَهُمْ بِسَاطًا ثُمَّ انْطَلَقَ إِلَى نَخْلَةٍ فَجَاءَ بِقِنْوٍ فَوَضَعَهُ فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَفَلا تَنَقَّيْتَ لَنَا مِنْ رُطَبِهِ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي أَرَدْتُ أَنْ تَخْتَارُوا أَوْ تَخَيَّرُوا مِنْ رُطَبِهِ وَبُسْرِهِ فَأَكَلُوا وَشَرِبُوا مِنْ ذَلِكَ الْمَاءِ فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هَذَا وَالَّذِي نَفْسِي بِيَدِهِ مِنَ النَّعِيمِ الَّذِي تُسْأَلُونَ عَنْهُ يَوْمَ الْقِيَامَةِ ظِلٌّ بَارِدٌ وَرُطَبٌ طَيِّبٌ وَمَاءٌ بَارِدٌ فَانْطَلَقَ أَبُو الْهَيْثَمِ لِيَصْنَعَ لَهُمْ طَعَامًا فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا تَذْبَحَنَّ ذَاتَ دَرٍّ فَذَبَحَ لَهُمْ عَنَاقًا أَوْ جَدْيًا فَأَتَاهُمْ بِهَا فَأَكَلُوا فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هَلْ لَكَ خَادِمٌ قَالَ لا قَالَ فَإِذَا أَتَانَا سَبْيٌ فَأْتِنَا فَأُتِيَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِرَأْسَيْنِ لَيْسَ مَعَهُمَا ثَالِثٌ فَأَتَاهُ أَبُو الْهَيْثَمِ فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اخْتَرْ مِنْهُمَا قَالَ يَا رَسُولَ اللَّهِ اخْتَرْ لِي فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنَّ الْمُسْتَشَارَ مُؤْتَمَنٌ خُذْ هَذَا فَإِنِّي رَأَيْتُهُ يُصَلِّي وَاسْتَوْصِ بِهِ مَعْرُوفًا فَانْطَلَقَ أَبُو الْهَيْثَمِ إِلَى امْرَأَتِهِ فَأَخْبَرَهَا بِقَوْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَتِ امْرَأَتُهُ مَا أَنْتَ بِبَالِغٍ مَا قَالَ فِيهِ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَّا أَنْ تُعْتِقَهُ قَالَ فَهُوَ عَتِيقٌ فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ غَفَرَ اللَّهُ لَهُمْ إِنَّ اللَّهَ لَمْ يَبْعَثْ نَبِيًّا وَلا خَلِيفَةً إِلَّا وَلَهُ بِطَانَتَانِ بِطَانَةٌ تَأْمُرُهُ بِالْمَعْرُوفِ وَتَنْهَاهُ عَنِ الْمُنْكَرِ وَبِطَانَةٌ لا تَأْلُوهُ خَبَالًا وَمَنْ يُوقَ بِطَانَةَ السُّوءِ فَقَدْ وُقِيَ.","373. حَدَّثَنَا عُمَرُ بنُ إِسْمَاعِيلَ بنِ مُجَالِدِ بنِ سَعِيدٍ حَدَّثَنَا أَبِي عَنْ بَيَانِ بنِ بِشْرٍ حَدَّثَنِي قَيْسُ بنُ أَبِي حَازِمٍ قَالَ سَمِعْتُ سَعْدَ بنَ أَبِي وَقَّاصٍ يَقُولُ إِنِّي لَأَوَّلُ رَجُلٍ أَهَرَاقَ دَمًا فِي سَبِيلِ اللَّهِ عَزَّ وَجَلَّ وَإِنِّي لَأَوَّلُ رَجُلٍ رَمَى بِسَهْمٍ فِي سَبِيلِ اللَّهِ وَلَقَدْ رَأَيْتُنِي أَغْزُو فِي الْعِصَابَةِ مِنْ أَصْحَابِ مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ مَا نَأْكُلُ إِلَّا وَرَقَ الشَّجَرِ وَالْحُبْلَةِ حَتَّى إِنَّ أَحَدَنَا لَيَضَعُ كَمَا تَضَعُ الشَّاةُ وَالْبَعِيرُ وَأَصْبَحَتْ بَنُو أَسَدٍ يُعَزِّرُونَنِي فِي الدِّينِ لَقَدْ خِبْتُ وَخَسِرْتُ إِذَنْ وَضَلَّ عَمَلِي.","374 ـ حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا صَفْوَانُ بنُ عِيسَى حَدَّثَنَا عُمَرُو بنُ عِيسَى أَبُو نَعَامَةَ الْعَدَوِيُّ قَالَ سَمِعْتُ  خَالِدَ بنَ عُمَيْرٍ وَشُوَيْسًا أَبَا الرُّقَادِ قَالا بَعَثَ عُمَرُ بنُ الْخَطَّابِ عُتْبَةَ بنَ غَزْوَانَ وَقَالَ انْطَلِقْ أَنْتَ وَمَنْ مَعَكَ حَتَّى إِذَا كُنْتُمْ فِي أَقْصَى بِلادِ الْعَرَبِ وَأَدْنَى أَرْضِ الْعَجَمِ فَأَقْبَلُوا حَتَّى إِذَا كَانُوا بِالْمِرْبَدِ وَجَدُوا هَذَا الْكَذَّانَ فَقَالُوا مَا هَذِهِ قَالَ هَذَا الْبَصْرَةُ فَسَارُوا حَتَّى بَلَغُوا حِيَالَ الْجِسْرِ الصَّغِيرِ فَقَالُوا هَاهُنَا أُمِرْتُمْ فَنَزَلُوا فَذَكَرُوا الْحَدِيثَ بِطُولِهِ قَالَ فَقَالَ عُتْبَةُ بنُ غَزْوَانَ لَقَدْ رَأَيْتُنِي وَإِنِّي لَسَابِعُ سَبْعَةٍ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَا لَنَا طَعَامٌ إِلَّا وَرَقُ الشَّجَرِ حَتَّى تَقَرَّحَتْ أَشْدَاقُنَا فَالْتَقَطْتُ بُرْدَةً قَسَمْتُهَا بَيْنِي وَبَيْنَ سَعْدٍ فَمَا مِنَّا مِنْ أُولَئِكَ السَّبْعَةِ أَحَدٌ إِلَّا وَهُوَ أَمِيرُ مِصْرٍ مِنَ الأَمْصَارِ وَسَتُجَرِّبُونَ الأُمَرَاءَ بَعْدَنَا. ","375. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ حَدَّثَنَا رَوْحُ بنُ أَسْلَمَ أَبُو حَاتِمٍ الْبَصْرِيُّ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ أَخْبَرَنَا ثَابِتٌ عَنْ أَنَسٍ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَقَدْ أُخِفْتُ فِي اللَّهِ وَمَا يُخَافُ أَحَدٌ وَلَقَدْ أُوذِيتُ فِي اللَّهِ وَمَا يُؤْذَى أَحَدٌ وَلَقَدْ أَتَتْ عَلَيَّ ثَلاثُونَ مِنْ بَيْنِ لَيْلَةٍ وَيَوْمٍ وَمَا لِي وَلِبِلالٍ طَعَامٌ يَأْكُلُهُ ذُو كَبِدٍ إِلَّا شىْءٌ يُوَارِيهِ إِبِطُ بِلالٍ. ","376. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَنْبَأَنَا عَفَّانُ بنُ مُسْلِمٍ حَدَّثَنَا أَبَانُ بنُ يَزِيدَ الْعَطَّارُ حَدَّثَنَا قَتَادَةُ عَنْ أَنَسِ ابْنِ مَالِكٍ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَمْ يَجْتَمِعْ عِنْدَهُ غَدَاءٌ وَلا عَشَاءٌ مِنْ خُبْزٍ وَلَحْمٍ إِلَّا عَلَى ضَفَفٍ. ","قَالَ عَبْدُ اللَّهِ قَالَ بَعْضُهُمْ هُوَ كَثْرَةُ الأَيْدِي. ","377. حَدَّثَنَا عَبْدُ بنُ حُمَيْدٍ حَدَّثَنَا مُحَمَّدُ بنُ إِسْمَاعِيلَ بنِ أَبِي فُدَيْكٍ أَخْبَرَنِي ابْنُ أَبِي ذِئْبٍ عَنْ مُسْلِمِ بنِ جُنْدُبٍ عَنْ نَوْفَلِ بنِ إِيَاسٍ الْهُذَلِيِّ قَال كَانَ عَبْدُ الرَّحْمٰنِ بنُ عَوْفٍ لَنَا جَلِيسًا وَكَانَ نِعْمَ الْجَلِيسُ وَإِنَّهُ انْقَلَبَ بِنَا ذَاتَ يَوْمٍ حَتَّى إِذَا دَخَلْنَا بَيْتَهُ وَدَخَلَ فَاغْتَسَلَ ثُمَّ خَرَجَ وَأُتِينَا بِصَحْفَةٍ فِيهَا خُبْزٌ وَلَحْمٌ فَلَمَّا وُضِعَتْ بَكَى عَبْدُ الرَّحْمٰنِ فَقُلْتُ يَا أَبَا مُحَمَّدٍ مَا يُبْكِيكَ قَالَ هَلَكَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَمْ يَشْبَعْ هُوَ وَأَهْلُ بَيْتِهِ مِنْ خُبْزِ الشَّعِيرِ فَلا أُرَانَا أُخِّرْنَا لِمَا هُوَ خَيْرٌ لَنَا. "]},{"id":"section-52","title":"بَابُ مَا جَاءَ فِي سِنِّ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["378. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا رَوْحُ بنُ عُبَادَةَ حَدَّثَنَا زَكَرِيَّا بنُ إِسْحَاقَ حَدَّثَنَا عَمْرُو بنُ دِينَارٍ عَنِ ابْنِ عَبَّاسٍ قَالَ مَكَثَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِمَكَّةَ ثَلاثَ عَشْرَةَ سَنَةً يَعْنِي يُوحَى إِلَيْهِ وَبِالْمَدِينَةِ عَشْرًا وَتُوُفِّيَ وَهُوَ ابْنُ ثَلاثٍ وَسِتِّينَ. ","379. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ عَنْ شُعْبَةَ عَنْ أَبِي إِسْحَاقَ عَنْ عَامِرِ بنِ سَعْدٍ عَنْ جَرِيرٍ عَنْ مُعَاوِيَةَ أَنَّهُ سَمِعَهُ يَخْطُبُ قَالَ مَاتَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ ابْنُ ثَلاثٍ وَسِتِّينَ سَنَة وَأَبُو بَكْرٍ وَعُمَرُ وَأَنَا ابْنُ ثَلاثٍ وَسِتِّينَ.","380. حَدَّثَنَا حُسَيْنُ بنُ مَهْدِيٍّ الْبَصْرِيُّ حَدَّثَنَا عَبْدُ الرَّزَّاقِ عَنِ ابْنِ جُرَيْجٍ عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ عَنْ عَائِشَةَ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَاتَ وَهُوَ ابْنُ ثَلاثٍ وَسِتِّينَ.","381. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ وَيَعْقُوبُ بنُ إِبْرَاهِيمَ الدَّوْرَقِيُّ قَالا حَدَّثَنَا إِسْمَاعِيلُ بنُ عُلَيَّةَ عَنْ خَالِدٍ الْحَذَّاءِ حَدَّثَنِي عَمَّارٌ مَوْلَى بَنِي هَاشِمٍ قَالَ سَمِعْتُ ابْنَ عَبَّاسٍ يَقُولُ تُوُفِّيَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ ابْنُ خَمْسٍ وَسِتِّينَ. ","382. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ وَمُحَمَّدُ بنُ أَبَانَ قَالا حَدَّثَنَا مُعَاذُ بنُ هِشَامٍ حَدَّثَنِي أَبِي عَنْ قَتَادَةَ عَنِ الْحَسَنِ عَنْ دَغْفَلِ بنِ حَنْظَلَةَ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قُبِضَ وَهُوَ ابْنُ خَمْسٍ وَسِتِّينَ. ","قَالَ أَبُو عِيسَى دَغْفَلٌ لا نَعْرِفُ لَهُ سَمَاعًا مِنَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَكَانَ فِي زَمَانِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رَجُلًا.","383. حَدَّثَنَا إِسْحَاقُ بنُ مُوسَى الأَنْصَارِيُّ حَدَّثَنَا مَعْنٌ حَدَّثَنَا مَالِكُ بنُ أَنَسٍ عَنْ رَبِيعَةَ بنِ أَبِي عَبْدِ الرَّحْمٰنِ عَنْ أَنَسِ بنِ مَالِكٍ أَنَّهُ سَمِعَهُ يَقُولُ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَيْسَ بِالطَّوِيلِ الْبَائِنِ وَلا بِالْقَصِيرِ وَلا بِالأَبْيَضِ الأَمْهَقِ وَلا بِالآدَمِ وَلا بِالْجَعْدِ الْقَطَطِ وَلا بِالسَّبِطِ بَعَثَهُ اللَّهُ تَعَالَى عَلَى رَأْسِ أَرْبَعِينَ سَنَةً فَأَقَامَ بِمَكَّةَ عَشْرَ سِنِينَ وَبِالْمَدِينَةِ عَشْرَ سِنِينَ وَتَوَفَّاهُ اللَّهُ عَلَى رَأْسِ سِتِّينَ سَنَةً وَلَيْسَ فِي رَأْسِهِ وَلِحْيَتِهِ عِشْرُونَ شَعْرَةً بَيْضَاءَ. ","384. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ عَنْ مَالِكِ بنِ أَنَسٍ عَنْ رَبِيعَةَ بنِ أَبِي عَبْدِ الرَّحْمٰنِ عَنْ أَنَسِ بنِ مَالِكٍ نَحْوَهُ. "]},{"id":"section-53","title":"بَابُ مَا جَاءَ فِي وَفَاةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["385. حَدَّثَنَا أَبُو عَمَّارٍ الْحُسَيْنُ بنُ حُرَيْثٍ وَقُتَيْبَةُ بنُ سَعِيدٍ وَغَيْرُ وَاحِدٍ قَالُوا حَدَّثَنَا سُفْيَانُ بنُ عُيَيْنَةَ عَنِ الزُّهْرِيِّ عَنْ أَنَسِ بنِ مَالِكٍ قَالَ ءَاخِرُ نَظْرَةٍ نَظَرْتُهَا إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَشَفَ السِّتَارَةَ يَوْمَ الِاثْنَيْنِ فَنَظَرْتُ إِلَى وَجْهِهِ كَأَنَّهُ وَرَقَةُ مُصْحَفٍ وَالنَّاسُ خَلْفَ أَبِي بَكْرٍ فَأَشَارَ إِلَى النَّاسِ أَنِ اثْبُتُوا وَأَبُو بَكْرٍ يَؤُمُّهُمْ وَأَلْقَى السِّجْفَ وَتُوُفِّيَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ ءَاخِرِ ذَلِكَ الْيَوْمِ. ","386. حَدَّثَنَا حُمَيْدُ بنُ مَسْعَدَةَ الْبَصْرِيُّ حَدَّثَنَا سُلَيْمُ بنُ أَخْضَرَ عَنِ ابْنِ عَوْنٍ عَنْ إِبْرَاهِيمَ عَنِ الأَسْوَدِ عَنْ عَائِشَةَ قَالَتْ كُنْتُ مُسْنِدَةً النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَى صَدْرِي أَوْ قَالَتْ إِلَى حِجْرِي فَدَعَا بِطَسْتٍ لِيَبُولَ فِيهِ ثُمَّ بِالَ فَمَاتَ. ","387. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا اللَّيْثُ عَنِ ابْنِ الْهَادِ عَنْ مُوسَى بنِ سَرْجِسَ عَنِ الْقَاسِمِ بنِ مُحَمَّدٍ عَنْ عَائِشَةَ أَنَّهَا قَالَتْ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ بِالْمَوْتِ وَعِنْدَهُ قَدَحٌ فِيهِ مَاءٌ وَهُوَ يُدْخِلُ يَدَهُ فِي الْقَدَحِ ثُمَّ يَمْسَحُ وَجْهَهُ بِالْمَاءِ ثُمَّ يَقُولُ اللَّهُمَّ أَعِنِّي عَلَى مُنْكَرَاتِ الْمَوْتِ أَوْ سَكَرَاتِ الْمَوْتِ. ","388. حَدَّثَنَا الْحَسَنُ بنُ الصَّبَّاحِ الْبَزَّارُ حَدَّثَنَا مُبَشِّرُ بنُ إِسْمَاعِيلَ عَنْ عَبْدِ الرَّحْمٰنِ بنِ الْعَلاءِ عَنْ أَبِيهِ عَنِ ابْنِ عُمَرَ عَنْ عَائِشَةَ قَالَتْ لا أَغْبِطُ أَحَدًا بَهَوْنِ مَوْتٍ بَعْدَ الَّذِي رَأَيْتُ مِنْ شِدَّةِ مَوْتِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.","قَالَ أَبُو عِيسَى سَأَلْتُ أَبَا زُرْعَةَ فَقُلْتُ لَهُ مَنْ عَبْدُ الرَّحْمٰنِ بنُ الْعَلاءِ هَذَا فَقَالَ هُوَ عَبْدُ الرَّحْمٰنِ بنُ الْعَلاءِ بنِ اللَّجْلاجِ.","389. حَدَّثَنَا أَبُو كُرَيْبٍ مُحَمَّدُ بنُ الْعَلاءِ حَدَّثَنَا أَبُو مُعَاوِيَةَ عَنْ عَبْدِ الرَّحْمٰنِ بنِ أَبِي بَكْرٍ هُوَ الْمُلَيْكِيُّ عَنِ ابْنِ أَبِي مُلَيْكَةَ عَنْ عَائِشَةَ قَالَتْ لَمَّا قُبِضَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اخْتَلَفُوا فِي دَفْنِهِ فَقَالَ أَبُو بَكْرٍ سَمِعْتُ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَيْئًا مَا نَسِيتُهُ قَالَ مَا قَبَضَ اللَّهُ نَبِيًّا إِلَّا فِي الْمَوْضِعِ الَّذِي يُحِبُّ أَنْ يُدْفَنَ فِيهِ ادْفِنُوهُ فِي مَوْضِعِ فِرَاشِهِ. ","390. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ وَعَبَّاسٌ الْعَنْبَرِيُّ وَسَوَّارُ بنُ عَبْدِ اللَّهِ وَغَيْرُ وَاحِدٍ قَالُوا حَدَّثَنَا يَحْيَي بنُ سَعِيدٍ عَنْ سُفْيَانَ الثَّوْرِيِّ عَنْ مُوسَى بنِ أَبِي عَائِشَةَ عَنْ عُبَيْدِ اللَّهِ بنِ عَبْدِ اللَّهِ عَنِ ابْنِ عَبَّاسٍ وَعَائِشَةَ أَنَّ أَبَا بَكْرٍ قَبَّلَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بَعْدَ مَا مَاتَ. ","391. حَدَّثَنَا نَصْرُ بنُ عَلِيٍّ الْجَهْضَمِيُّ حَدَّثَنَا مَرْحُومُ بنُ عَبْدِ الْعَزِيزِ الْعَطَّارُ عَنْ أَبِي عِمْرَانَ الْجَوْنِيِّ عَنْ يَزِيدَ بنِ بَابَنُوسَ عَنْ عَائِشَةَ أَنَّ أَبَا بَكْرٍ دَخَلَ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بَعْدَ وَفَاتِهِ فَوَضَعَ فَمَهُ بَيْنَ عَيْنَيْهِ وَوَضَعَ يَدَيْهِ عَلَى سَاعِدَيْهِ وَقَالَ وَانَبِيَّاهُ وَاصَفِيَّاهُ وَاخَلِيلاهُ. ","392. حَدَّثَنَا بِشْرُ بنُ هِلالٍ الصَّوَّافُ الْبَصْرِيُّ حَدَّثَنَا جَعْفَرُ بنُ سُلَيْمَانَ عَنْ ثَابِتٍ عَنْ أَنَسٍ قَالَ لَمَّا كَانَ الْيَوْمُ الَّذِي دَخَلَ فِيهِ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْمَدِينَةَ أَضَاءَ مِنْهَا كُلُّ شَىْءٍ فَلَمَّا كَانَ الْيَوْمُ الَّذِي مَاتَ فِيهِ أَظْلَمَ مِنْهَا كُلُّ شَىْءٍ. وَمَا نَفَضْنَا أَيْدِيَنَا عَنِ التُّرَابِ وَإِنَّا لَفِي دَفْنِهِ حَتَّى أَنْكَرْنَا قُلُوبَنَا. ","393. حَدَّثَنَا مُحَمَّدُ بنُ حَاتِمٍ حَدَّثَنَا عَامِرُ بنُ صَالِحٍ عَنْ هِشَامِ بنِ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ قَالَتْ تُوُفِّيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمَ الِاثْنَيْنِ. ","394. حَدَّثَنَا ابْنُ أَبِي عُمَرَ حَدَّثَنَا سُفْيَانُ بنُ عُيَيْنَةَ عَنْ جَعْفَرِ بنِ مُحَمَّدٍ عَنْ أَبِيهِ قَالَ لَمَّا قُبِضَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمَ الِاثْنَيْنِ فَمَكَثَ ذَلِكَ الْيَوْمَ وَلَيْلَةَ الثُّلاثَاءِ وَيَوْمَ الثُّلاثَاءِ وَدُفِنَ مِنَ اللَّيْلِ. ","قَالَ سُفْيَانُ وَقَالَ غَيْرُهُ سُمِعُ صَوْتُ الْمَسَاحِي مِنْ ءَاخِرِ اللَّيْلِ. ","395. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا عَبْدُ الْعَزِيزِ بنُ مُحَمَّدٍ عَنْ شَرِيكِ بنِ عَبْدِ اللَّهِ بنِ أَبِي نَمِرٍ عَنْ أَبِي سَلَمَةَ بنِ عَبْدِ الرَّحْمٰنِ بنِ عَوْفٍ قَالَ تُوُفِّيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمَ الِاثْنَيْنِ وَدُفِنَ يَوْمَ الثُّلاثَاءِ.","قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ. ","396. حَدَّثَنَا نَصْرُ بنُ عَلِيٍّ الْجَهْضَمِيُّ حَدَّثَنَا عَبْدُ اللَّهِ بنُ دَاوُدَ حَدَّثَنَا سَلَمَةُ بنُ نُبَيْطٍ أَخْبَرَنَا نُعَيْمُ بنُ أَبِي هِنْدٍ عَنْ نُبَيْطِ بنِ شَرِيطٍ عَنْ سَالِمِ بنِ عُبَيْدٍ لَهُ صُحْبَةٌ قَالَ أُغْمِيَ عَلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي مَرَضِهِ فَأَفَاقَ فَقَالَ حَضَرَتِ الصَّلاةُ فَقَالُوا نَعَمْ فَقَالَ مُرُوا بِلالًا فَلْيُؤَذِّنْ وَمُرُوا أَبَا بَكْرٍ فَلْيُصَلِّ لِلنَّاسِ أَوْ بِالنَّاسِ قَالَ ثُمَّ أُغْمِيَ عَلَيْهِ فَأَفَاقَ فَقَالَ حَضَرَتِ الصَّلاةُ قَالُوا نَعَمْ قَالَ مُرُوا بِلالًا فَلْيُؤَذِّنْ وَمُرُوا أَبَا بَكْرٍ فَلْيُصَلِّ بِالنَّاسِ ثُمَّ أُغْمِيَ عَلَيْهِ فَأَفَاقَ فَقَالَ مُرُوا بِلالًا فَلْيُؤَذِّنْ وَمُرُوا أَبَا بَكْرٍ فَلْيُصَلِّ بِالنَّاسِ فَقَالَتْ عَائِشَةُ إِنَّ أَبِي رَجُلٌ أَسِيفٌ إِذَا قَامَ ذَاكَ الْمَقَامَ بَكَى فَلا يَسْتَطِيعُ فَلَوْ أَمَرْتَ غَيْرَهُ قَالَ ثُمَّ أُغْمِيَ عَلَيْهِ فَأَفَاقَ فَقَالَ مُرُوا بِلالًا فَلْيُؤَذِّنْ وَمُرُوا أَبَا بَكْرٍ فَلْيُصَلِّ بِالنَّاسِ فَإِنَّكُنَّ صَوَاحِبُ أَوْ صَوَاحِبَاتُ يُوسُفَ قَالَ فَأُمِرَ بِلالٌ فَأَذَّنَ وَأُمِرَ أَبُو بَكْرٍ فَصَلَّى بِالنَّاسِ ثُمَّ إِنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَجَدَ خِفَّةً فَقَالَ انْظُرُوا لِي مَنْ أَتَّكِئُ عَلَيْهِ فَجَاءَتْ بَرِيرَةُ وَرَجُلٌ ءَاخَرُ فَاتَّكَأَ عَلَيْهِمَا فَلَمَّا رَءَاهُ أَبُو بَكْرٍ ذَهَبَ لِينْكِصَ فَأَوْمَأَ إِلَيْهِ أَنْ يَثْبُتَ مَكَانَهُ حَتَّى قَضَى أَبُو بَكْرٍ صَلاتَهُ ثُمَّ إِنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قُبِضَ فَقَالَ عُمَرُ وَاللَّهِ لا أَسْمَعُ أَحَدًا يَذْكُرُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قُبِضَ إِلَّا ضَرَبْتُهُ بِسَيْفِي هَذَا قَالَ وَكَانَ النَّاسُ أُمِّيِّينَ لَمْ يَكُنْ فِيهِمْ نَبِيٌّ قَبْلَهُ فَأَمْسَكَ النَّاسُ قَالُوا يَا سَالِمُ انْطَلِقْ إِلَى صَاحِبِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَادْعُهُ فَأَتَيْتُ أَبَا بَكْرٍ وَهُوَ فِي الْمَسْجِدِ فَأَتَيْتُهُ أَبْكِي دَهِشًا فَلَمَّا رَءَانِي قَالَ لِي أَقُبِضَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قُلْتُ إِنَّ عُمَرَ يَقُولُ لا أَسْمَعُ أَحَدًا يَذْكُرُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قُبِضَ إِلا ضَرَبْتُهُ بِسَيْفِي هَذَا فَقَالَ لِي انْطَلِقْ فَانْطَلَقْتُ مَعَهُ فَجَاءَ وَالنَّاسُ قَدْ حَفُّوا عَلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ يَا أَيُّهَا النَّاسُ أَفْرِجُوا لِي فَأَفْرَجُوا لَهُ فَجَاءَ حَتَّى أَكَبَّ عَلَيْهِ وَمَسَّهُ فَقَالَ ﴿إِنَّكَ مَيِّتٌ وَإِنَّهُمْ مَيِّتُونَ﴾ ثُمَّ قَالُوا يَا صَاحِبَ رَسُولِ اللَّهِ أَقُبِضَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ نَعَمْ فَعَلِمُوا أَنْ قَدْ صَدَقَ قَالُوا يَا صَاحِبَ رَسُولِ اللَّهِ أَيُصَلَّى عَلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ نَعَمْ قَالُوا وَكَيْفَ قَالَ يَدْخُلُ قَوْمٌ فَيُكَبِّرُونَ وَيُصَلُّونَ وَيَدْعُونَ ثُمَّ يَخْرُجُونَ ثُمَّ يَدْخُلُ قَوْمٌ فَيُكَبِّرُونَ وَيُصَلُّونَ وَيَدْعُونَ ثُمَّ يَخْرُجُونَ حَتَّى يَدْخُلَ النَّاسُ قَالُوا يَا صَاحِبَ رَسُولِ اللَّهِ أَيُدْفَنُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ نَعَمْ قَالُوا أَينَ قَالَ فِي الْمكَانِ الَّذِي قُبِضَ فِيهِ رُوحُهُ فَإِنَّ اللَّهَ لَمْ يَقْبِضْ رُوحَهُ إِلَّا فِي مَكَانٍ طَيِّبٍ فَعَلِمُوا أَنْ قَدْ صَدَقَ ثُمَّ أَمَرَهُمْ أَنْ يُغَسِّلَهُ بَنُو أَبِيهِ وَاجْتَمَعَ الْمُهَاجِرُونَ يَتَشَاوَرُونَ فَقَالُوا انْطَلِقُوا بِنَا إِلَى إِخْوانِنَا مِنَ الأَنْصَارِ نُدْخِلْهُمْ مَعَنَا فِي هَذَا الأَمْرِ فَقَالَتِ الأَنْصَارُ مِنَّا أَمِيرٌ وَمِنْكُمْ أَمِيرٌ فَقَالَ عُمَرُ بنُ الْخَطَّابِ مَنْ لَهُ مِثْلُ هَذِهِ الثَّلاثِ ﴿ثَانِيَ اثْنَيْنِ إِذْ هُمَا فِي الْغَارِ إِذْ يَقُولُ لِصَاحِبِهِ لا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا﴾ مَنْ هُمَا ثُمَّ بَسَطَ يَدَهُ فَبَايَعَهُ وَبَايَعَهُ النَّاسُ بَيْعَةً حَسَنَةً جَمِيلَةً. ","397. حَدَّثَنَا نَصْرُ بنُ عَلِيٍّ حَدَّثَنَا عَبْدُ اللَّهِ بنُ الزُّبَيْرِ بَاهِلِيٌّ شَيْخٌ قَدِيمٌ بَصْرِيٌّ حَدَّثَنَا ثَابِتٌ الْبُنَانِيُّ عَنْ أَنَسِ ابْنِ مَالِكٍ قَالَ لَمَّا وَجَدَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ كَرْبِ الْمَوْتِ مَا وَجَدَ قَالَتْ فَاطِمَةُ رَضِيَ اللَّهُ تَعَالَى عَنْهَا وَاكَرْبَاهُ فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا كَرْبَ عَلَى أَبِيكِ بَعْدَ الْيَوْمِ إِنَّهُ قَدْ حَضَرَ مِنْ أَبِيكِ مَا لَيْسَ بِتَارِكٍ مِنْهُ أَحَدًا الْمُوافَاةُ يَوْمَ الْقِيَامَةِ. ","398. حَدَّثَنَا أَبُو الْخَطَّابِ زِيَادُ بنُ يَحْيَى الْبَصْرِيُّ وَنَصْرُ بنُ عَلِيٍّ قَالا حَدَّثَنَا عَبْدُ رَبِّهِ بنُ بَارِقٍ الْحَنَفِيُّ قَالَ سَمِعْتُ جَدِّي أَبَا أُمِّي سِمَاكَ بنَ الْوَلِيدِ يُحَدِّثُ أَنَّهُ سَمِعَ ابْنَ عَبَّاسٍ رَضِيَ اللَّهُ تَعَالَى عَنْهُمَا يُحَدِّثُ أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ مَنْ كَانَ لَهُ فَرَطَانِ مِنْ أُمَّتِي أَدْخَلَهُ اللَّهُ تَعَالَى بِهِمَا الْجَنَّة.َ ","قَالَتْ عَائِشَةُ رَضِيَ اللَّهُ عَنْهَا فَمَنْ كَانَ لَهُ فَرَطٌ مِنْ أُمَّتِكَ قَالَ وَمَنْ كَانَ لَهُ فَرَطٌ يَا مُوَفَّقَةُ قَالَتْ فَمَنْ لَمْ يَكُنْ لَهُ فَرَطٌ مِنْ أُمَّتِكَ قَالَ فَأَنَا فَرَطٌ لِأُمَّتِي لَنْ يُصَابُوا بِمِثْلِي. "]},{"id":"section-54","title":"بَابٌ فِي مِيرَاثِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["399. حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ حَدَّثَنَا حُسَيْنُ بنُ مُحَمَّدٍ حَدَّثَنَا إِسْرَائِيلُ عَنْ أَبِي إِسْحَاقَ عَنْ عَمْرِو بنِ الْحَارِثِ أَخِي جُوَيْرِيَةَ لَهُ صُحْبَةٌ قَالَ مَا تَرَكَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَّا سِلاحَهُ وَبَغْلَتَهُ وَأَرْضًا جَعَلَهَا صَدَقَةً. ","400. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا أَبُو الْوَلِيدِ حَدَّثَنَا حَمَّادُ بنُ سَلَمَةَ عَنْ مُحَمَّدِ بنِ عَمْرٍو عَنْ أَبِي سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ جَاءَتْ فَاطِمَةُ إِلَى أَبِي بَكْرٍ فَقَالَتْ مَنْ يَرِثُكَ فَقَالَ أَهْلِي وَوَلَدِي فَقَالَتْ مَا لِي لا أَرِثُ أَبِي فَقَالَ أَبُو بَكْرٍ سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ لا نُورَثُ وَلَكِنِّي أَعُولُ مَنْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَعُولُهُ وَأُنْفِقُ عَلَى مَنْ كَانَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُنْفِقُ عَلَيْهِ. ","401. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا يَحْيَى بنُ كَثِيرٍ الْعَنْبَرِيُّ حَدَّثَنَا شُعْبَةُ عَنْ عَمْرِو بنِ مُرَّةَ عَنْ أَبِي الْبَخْتَرِيِّ أَنَّ الْعَبَّاسَ وَعَلِيًّا جَاءَا إِلَى عُمَرَ يَخْتَصِمَانِ يَقُولُ كُلُّ وَاحِدٍ مِنْهُمَا لِصَاحِبِهِ أَنْتَ كَذَا أَنْتَ كَذَا فَقَالَ عُمَرُ لِطَلْحَةَ وَالزُّبَيْرِ وَعَبْدِ الرَّحْمٰنِ بنِ عَوْفٍ وَسَعْدٍ رَضِيَ اللَّهُ تَعَالَى عَنْهُمْ نَشَدْتُكُمْ بِاللَّهِ أَسَمِعْتُمْ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ كُلُّ مَالِ نَبِيٍّ صَدَقَةٌ إِلَّا مَا أَطْعَمَهُ إِنَّا لا نُورَثُ. وَفِي الْحَدِيثِ قِصَّةٌ. ","402. حَدَّثَنَا مُحَمَّدُ بنُ الْمُثَنَّى حَدَّثَنَا صَفْوَانُ بنُ عِيسَى عَنْ أُسَامَةَ بنِ زَيْدٍ عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ عَنْ عَائِشَةَ رَضِيَ اللَّهُ تَعَالَى عَنْهَا أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لا نُورَثُ مَا تَرَكْنَا فَهُوَ صَدَقَةٌ. ","403. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ حَدَّثَنَا سُفْيَانُ عَنْ أَبِي الزِّنَادِ عَنِ الأَعْرَجِ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لا يَقْسِمُ وَرَثَتِي دِينَارًا وَلا دِرْهَمًا مَا تَرَكْتُ بَعْدَ نَفَقَةِ نِسَائِي وَمُؤْنَةِ عَامِلِي فَهُوَ صَدَقَةٌ. ","404. حَدَّثَنَا الْحَسَنُ بنُ عَلِيٍّ الْخَلَّالُ حَدَّثَنَا بِشْرُ بنُ عُمَرَ قَالَ سَمِعْتُ مَالِكَ بنَ أَنَسٍ عَنِ الزُّهْرِيِّ عَنْ مَالِكِ ابْنِ أَوْسِ بنِ الْحَدَثَانِ قَالَ دَخَلْتُ عَلَى عُمَرَ فَدَخَلَ عَلَيْهِ عَبْدُ الرَّحْمٰنِ بنُ عَوْفٍ وَطَلْحَةُ وَسَعْدٌ وَجَاءَ عَلِيٌّ وَالْعَبَّاسُ يَخْتَصِمَانِ فَقَالَ لَهُمْ عُمَرُ أَنْشُدُكُمْ بِالَّذِي بِإِذْنِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ تَعْلَمُونَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لا نُورَثُ مَا تَرَكْنَاهُ صَدَقَةٌ فَقَالُوا اللَّهُمَّ نَعَمْ وَفِي الْحَدِيثِ قِصَّةٌ طَوِيلَةٌ. ","405. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ حَدَّثَنَا سُفْيَانُ عَنْ عَاصِمِ بنِ بَهْدَلَةَ عَنْ زِرِّ بنِ حُبَيْشٍ عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ مَا تَرَكَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دِينَارًا وَلا دِرْهَمًا وَلا شَاةً وَلا بَعِيرًا قَالَ وَأَشُكُّ فِي الْعَبْدِ وَالأَمَةِ. "]},{"id":"section-55","title":"بَابٌ فِي رُؤْيَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الْمَنَامِ ","description":"النص الكامل لهذا الباب كما ورد في متن الشمائل المحمدية.","paragraphs":["406. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمٰنِ بنُ مَهْدِيٍّ حَدَّثَنَا سُفْيَانُ عَنْ أَبِي إِسْحَاقَ عَنْ أَبِي الأَحْوَصِ عَنْ عَبْدِ اللَّهِ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ مَنْ رَءَانِي فِي الْمَنَامِ فَقَدْ رَءَانِي فَإِنَّ الشَّيْطَانَ لا يَتَمَثَّلُ بِي.","407. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ وَمُحَمَّدُ بنُ الْمُثَنَّى قَالا حَدَّثَنَا مُحَمَّدُ بنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ عَنْ أَبِي حَصِينٍ عَنْ أَبِي صَالِحٍ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَنْ رَءَانِي فِي الْمَنَامِ فَقَدْ رَءَانِي فَإِنَّ الشَّيْطَانَ لا يَتَصَوَّرُ أَوْ قَالَ لا يَتَشَبَّهُ بِي.","408. حَدَّثَنَا قُتَيْبَةُ بنُ سَعِيدٍ حَدَّثَنَا خَلَفُ بنُ خَلِيفَةَ حَدَّثَنَا أَبُو مَالِكٍ الأَشْجَعِيُّ عَنْ أَبِيهِ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَنْ رَءَانِي فِي الْمَنَامِ فَقَدْ رَءَانِي. ","قَالَ أَبُو عِيسَى وَأَبُو مَالِكٍ هَذَا هُوَ سَعْدُ بنُ طَارِقِ بنِ أَشْيَمَ وَطَارِقُ بنُ أَشْيَمَ مِنْ أَصْحَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَقَدْ رَوَى عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَحَادِيثَ. ","قَالَ وَسَمِعْتُ عَلِيَّ بنَ حُجْرٍ يَقُولُ قَالَ خَلَفُ بنُ خَلِيفَةَ رَأَيْتُ عَمْرَو بنَ حُرَيْثٍ صَاحِبَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا غُلامٌ صَغِيرٌ. ","409. حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا عَبْدُ الْوَاحِدِ بنُ زِيَادٍ عَنْ عَاصِمِ بنِ كُلَيْبٍ قَالَ حَدَّثَنِي أَبِي أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يَقُولُ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَنْ رَءَانِي فِي الْمَنَامِ فَقَدْ رَءَانِي فَإِنَّ الشَّيْطَانَ لا يَتَمَثَّلُنِي. ","قَالَ أَبِي فَحَدَّثْتُ بِهِ ابْنَ عَبَّاسٍ وَقُلْتُ قَدْ رَأَيْتُهُ فَذَكَرْتُ الْحَسَنَ بنَ عَلِيٍّ فَقُلْتُ شَبَّهْتُهُ بِهِ فَقَالَ ابْنُ عَبَّاسٍ إِنَّهُ كَانَ يُشْبِهُهُ.","410. حَدَّثَنَا مُحَمَّدُ بنُ بَشَّارٍ حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وَمُحَمَّدُ بنُ جَعْفَرٍ قَالا حَدَّثَنَا عَوْفُ بنُ أَبِي جَمِيلَةَ عَنْ يَزِيدَ الْفَارِسِيِّ وَكَانَ يَكْتُبُ الْمَصَاحِفَ قَالَ رَأَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الْمَنَامِ زَمَنَ ابْنِ عَبَّاسٍ فَقُلْتُ لِابْنِ عَبَّاسٍ إِنِّي رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي النَّوْمِ فَقَالَ ابْنُ عَبَّاسٍ إِنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَقُولُ إِنَّ الشَّيْطَانَ لا يَسْتَطِيعُ أَنْ يَتَشَبَّهَ بِي فَمَنْ رَءَانِي فِي النَّوْمِ فَقَدْ رَءَانِي هَلْ تَسْتَطِيعُ أَنْ تَنْعَتَ هَذَا الرَّجُلَ الَّذِي رَأَيْتَهُ فِي النَّوْمِ قَالَ نَعَمْ أَنْعَتُ لَكَ رَجُلٌ بَيْنَ الرَّجُلَيْنِ جِسْمُهُ وَلَحْمُهُ أَسْمَرُ إِلَى الْبَيَاضِ أَكْحَلُ الْعَيْنَيْنِ حَسَنُ الضَّحِكِ جَمِيلُ دَوَائِرِ الْوَجْهِ قَدْ مَلأَتْ لِحْيَتُهُ مَا بَيْنَ هَذِهِ إِلَى هَذِهِ قَدْ مَلأَتْ نَحْرَهُ قَالَ عَوْفٌ وَلا أَدْرِي مَا كَانَ مَعَ هَذَا النَّعْتِ فَقَالَ ابْنُ عَبَّاسٍ لَوْ رَأَيْتَهُ فِي الْيَقَظَةِ مَا اسْتَطَعْتَ أَنْ تَنْعَتَهُ فَوْقَ هَذَا.","قَالَ أَبُو عِيسَى وَيَزِيدُ الْفَارِسِيُّ هُوَ يَزِيدُ بنُ هُرْمُزَ وَهُوَ أَقْدَمُ مِنْ يَزِيدَ الرَّقَاشِيِّ وَرَوَى يَزِيدُ الْفَارِسِيُّ عَنِ ابْنِ عَبَّاسٍ أَحَادِيثَ وَيَزِيدُ الرَّقَاشِيُّ لَمْ يُدْرِكِ ابْنَ عَبَّاسٍ.","وَهُوَ يَزِيدُ بنُ أَبَانَ الرَّقَاشِيُّ وَهُوَ يَرْوِي عَنْ أَنَسِ بنِ مَالِكٍ. وَيَزِيدُ الرَّقَاشِيُّ وَيَزِيدُ الْفَارِسِيُّ كِلاهُمَا مِنْ أَهْلِ الْبَصْرَةِ. وَعَوْفُ بنُ أَبِي جَمِيلَةَ هُوَ عَوْفٌ الأَعْرَابِيُّ.","411. حَدَّثَنَا أَبُو دَاوُدَ سُلَيْمَانُ بنُ سَلْمٍ الْبَلْخِيُّ حَدَّثَنَا النَّضْرُ بنُ شُمَيْلٍ قَالَ قَالَ عَوْفٌ الأَعْرَابِيُّ أَنَا أَكْبَرُ مِنْ قَتَادَةَ.","412. حَدَّثَنَا عَبْدُ اللَّهِ بنُ أَبِي زِيَادٍ حَدَّثَنَا يَعْقُوبُ بنُ إِبْرَاهِيمَ بنِ سَعْدٍ حَدَّثَنَا ابْنُ أَخِي ابْنِ شِهَابٍ الزُّهْرِيُّ عَنْ عَمِّهِ قَالَ قَالَ أَبُو سَلَمَةَ قَالَ أَبُو قَتَادَةَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَنْ رَءَانِي يَعْنِي فِي النَّوْمِ فَقَدْ رَأَى الْحَقَّ.","413. حَدَّثَنَا عَبْدُ اللَّهِ بنُ عَبْدِ الرَّحْمٰنِ أَخْبَرَنَا الْمُعَلَّى بنُ أَسَدٍ حَدَّثَنَا عَبْدُ الْعَزِيزِ بنُ الْمُخْتَارِ حَدَّثَنَا ثَابِتٌ عَنْ أَنَسٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ مَنْ رَءَانِي فِي الْمَنَامِ فَقَدْ رءَانِي فَإِنَّ الشَّيْطَانَ لا يَتَمَثَّلُ بِي قَالَ وَرُؤْيَا الْمُؤْمِنِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ.","414. حَدَّثَنَا مُحَمَّدُ بنُ عَلِيٍّ قَالَ سَمِعْتُ أَبِي يَقُولُ قَالَ عَبْدُ اللَّهِ بنُ الْمُبَارَكِ إِذَا ابْتُلِيتَ بِالْقَضَاءِ فَعَلَيْكَ بِالأَثَرِ.","415. حَدَّثَنَا مُحَمَّدُ بنُ عَلِيٍّ قَالَ سَمِعْتُ النَّضْرَ بنَ شُمَيْلٍ حَدَّثَنَا ابْنُ عَوْنٍ عَنِ ابْنِ سِيرِينَ قَالَ هَذَا الْحَدِيثُ دِينٌ فَانْظُرُوا عَمَّنْ تَأْخُذُونَ دِينَكُمْ.","بلغ عن الحاج هادي وعن الشيخ ضياء عن الشيخ سمير القاضي"," "]}];

    const STORAGE = {
      favorites: 'shamail_favorites_v1',
      settings: 'shamail_settings_v1',
      lastSection: 'shamail_last_section_v1',
      scroll: 'shamail_scroll_positions_v1'
    };

    const DEFAULTS = {
      theme: 'light',
      font: 'Amiri',
      fontSize: 22
    };

    const app = document.getElementById('app');
    const progressBar = document.getElementById('readingProgress');
    const backTop = document.getElementById('backTop');
    const searchModal = document.getElementById('searchModal');
    const modalSearchInput = document.getElementById('modalSearchInput');
    const searchResults = document.getElementById('searchResults');
    const toastEl = document.getElementById('toast');

    let currentSectionId = null;
    let scrollSaveTimer = null;
    let settings = loadSettings();

    function safeParse(value, fallback){
      try { return value ? JSON.parse(value) : fallback; } catch { return fallback; }
    }

    function loadSettings(){
      return {...DEFAULTS, ...safeParse(localStorage.getItem(STORAGE.settings), {})};
    }

    function saveSettings(){
      localStorage.setItem(STORAGE.settings, JSON.stringify(settings));
      applySettings();
    }

    function applySettings(){
      document.documentElement.dataset.theme = settings.theme;
      const fontMap = {
        Cairo: "'Cairo', sans-serif",
        Tajawal: "'Tajawal', sans-serif",
        'Noto Kufi Arabic': "'Noto Kufi Arabic', sans-serif",
        Amiri: "'Amiri', serif"
      };
      document.documentElement.style.setProperty('--reader-font', fontMap[settings.font] || fontMap.Amiri);
      document.documentElement.style.setProperty('--reader-size', `${settings.fontSize}px`);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', settings.theme === 'dark' ? '#101815' : '#0f6b55');
    }

    function getFavorites(){
      return safeParse(localStorage.getItem(STORAGE.favorites), []);
    }

    function isFavorite(id){ return getFavorites().includes(id); }

    function toggleFavorite(id){
      const set = new Set(getFavorites());
      if(set.has(id)) set.delete(id); else set.add(id);
      localStorage.setItem(STORAGE.favorites, JSON.stringify([...set]));
      showToast(set.has(id) ? 'تمت الإضافة إلى المفضلة' : 'تمت الإزالة من المفضلة');
      return set.has(id);
    }

    function normalizeArabic(text=''){
      return text
        .normalize('NFD')
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'')
        .replace(/ـ/g,'')
        .replace(/[إأآٱ]/g,'ا')
        .replace(/ى/g,'ي')
        .replace(/ؤ/g,'و')
        .replace(/ئ/g,'ي')
        .toLowerCase()
        .trim();
    }

    function wordCount(section){
      return section.paragraphs.join(' ').trim().split(/\s+/).filter(Boolean).length;
    }

    function readMinutes(section){
      return Math.max(1, Math.ceil(wordCount(section) / 180));
    }

    function totalParagraphs(){
      return SECTIONS.reduce((sum,s)=>sum+s.paragraphs.length,0);
    }

    function escapeHTML(value=''){
      return value.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function highlight(text, query){
      if(!query) return escapeHTML(text);
      const plain = normalizeArabic(query);
      if(!plain) return escapeHTML(text);
      // Keep source text untouched; highlight is visual only.
      const target = normalizeArabic(text);
      const idx = target.indexOf(plain);
      if(idx < 0) return escapeHTML(text);
      // Arabic normalization can shift indices because of diacritics, so use a safe escaped snippet without forced marking.
      return escapeHTML(text);
    }

    function showToast(message){
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(()=>toastEl.classList.remove('show'), 1800);
    }

    function go(route){
      location.hash = route.startsWith('#') ? route : `#${route}`;
    }

    function getRoute(){
      const hash = location.hash.replace(/^#/,'') || 'home';
      if(hash.startsWith('section/')) return {page:'section', id:hash.split('/')[1]};
      return {page:hash};
    }

    function updateNav(page){
      document.querySelectorAll('[data-route]').forEach(btn=>{
        btn.classList.toggle('active', btn.dataset.route === page);
      });
    }

    function sectionCard(section){
      const fav = isFavorite(section.id);
      return `
        <article class="topic-card ripple fade-up" tabindex="0" role="button" data-section="${section.id}" aria-label="فتح ${escapeHTML(section.title)}">
          <button class="fav-mini ${fav?'active':''}" data-fav="${section.id}" aria-label="المفضلة">
            <i class="${fav?'fa-solid':'fa-regular'} fa-bookmark"></i>
          </button>
          <div class="card-icon">📖</div>
          <h3>${escapeHTML(section.title)}</h3>
          <p>${escapeHTML(section.description)}</p>
          <div class="card-meta">
            <span class="meta-chip"><i class="fa-regular fa-file-lines"></i>${section.paragraphs.length} فقرة</span>
            <span class="meta-chip"><i class="fa-regular fa-clock"></i>${readMinutes(section)} د قراءة</span>
          </div>
        </article>`;
    }

    function renderHome(){
      currentSectionId = null;
      progressBar.classList.add('hidden');
      updateNav('home');
      const lastId = localStorage.getItem(STORAGE.lastSection);
      const last = SECTIONS.find(s=>s.id===lastId);

      app.innerHTML = `
        <section class="hero fade-up">
          <span class="eyebrow"><i class="fa-solid fa-star-and-crescent"></i> قراءة مرتبة وسهلة</span>
          <h1>الشَّمَائِلُ الْمُحَمَّدِيَّةُ</h1>
          <p>تصفّح أبواب الكتاب في واجهة عربية هادئة، مع البحث الفوري، المفضلة، أدوات القراءة، وحفظ موضعك تلقائيًا.</p>
          <div class="hero-stats">
            <span class="stat-pill"><i class="fa-solid fa-layer-group"></i>${SECTIONS.length} قسمًا</span>
            <span class="stat-pill"><i class="fa-regular fa-file-lines"></i>${totalParagraphs()} فقرة</span>
            <span class="stat-pill"><i class="fa-solid fa-book-open-reader"></i>حفظ تلقائي للقراءة</span>
          </div>
        </section>

        <div class="search-box fade-up">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="homeSearch" type="search" placeholder="ابحث في جميع الأبواب والمحتوى..." autocomplete="off" />
        </div>

        ${last ? `
          <div class="continue-card fade-up">
            <div class="continue-icon"><i class="fa-solid fa-book-open"></i></div>
            <div class="grow">
              <span>متابعة القراءة</span>
              <strong>${escapeHTML(last.title)}</strong>
            </div>
            <button class="primary-btn ripple" data-open="${last.id}"><i class="fa-solid fa-arrow-left"></i> متابعة</button>
          </div>` : ''}

        <div class="section-head">
          <div><h2>أبواب الكتاب</h2><p>اضغط على أي بطاقة لفتح محتوى الباب كاملًا.</p></div>
        </div>
        <section class="cards-grid">${SECTIONS.map(sectionCard).join('')}</section>
      `;

      document.getElementById('homeSearch').addEventListener('input', e=>{
        openSearch(e.target.value);
      });
      bindCards();
      bindRipples();
      window.scrollTo(0,0);
    }

    function bindCards(){
      document.querySelectorAll('[data-section]').forEach(card=>{
        card.addEventListener('click', e=>{
          if(e.target.closest('[data-fav]')) return;
          go(`section/${card.dataset.section}`);
        });
        card.addEventListener('keydown', e=>{
          if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(`section/${card.dataset.section}`); }
        });
      });
      document.querySelectorAll('[data-fav]').forEach(btn=>{
        btn.addEventListener('click', e=>{
          e.stopPropagation();
          const active = toggleFavorite(btn.dataset.fav);
          btn.classList.toggle('active',active);
          btn.innerHTML = `<i class="${active?'fa-solid':'fa-regular'} fa-bookmark"></i>`;
        });
      });
      document.querySelectorAll('[data-open]').forEach(btn=>{
        btn.addEventListener('click',()=>go(`section/${btn.dataset.open}`));
      });
    }

    function decorateParagraph(text){
      const escaped = escapeHTML(text);
      return escaped.replace(/^(\s*\d+\.)/, '<span class="hadith-number">$1</span>');
    }

    function renderSection(id){
      const section = SECTIONS.find(s=>s.id===id);
      if(!section){ go('home'); return; }

      currentSectionId = id;
      localStorage.setItem(STORAGE.lastSection,id);
      progressBar.classList.remove('hidden');
      updateNav('');
      const fav = isFavorite(id);
      const words = wordCount(section);

      app.innerHTML = `
        <section class="reader-shell fade-up">
          <div class="reader-top">
            <button class="back-btn" id="readerBack"><i class="fa-solid fa-arrow-right"></i> الرجوع للأبواب</button>
          </div>

          <div class="reader-tools" aria-label="أدوات القراءة">
            <button id="copyContent"><i class="fa-regular fa-copy"></i> نسخ</button>
            <button id="shareContent"><i class="fa-solid fa-share-nodes"></i> مشاركة</button>
            <button id="favoriteContent" class="favorite ${fav?'active':''}"><i class="${fav?'fa-solid':'fa-regular'} fa-bookmark"></i> <span>${fav?'محفوظ':'مفضلة'}</span></button>
            <button id="fontPlus"><i class="fa-solid fa-plus"></i> تكبير</button>
            <button id="fontMinus"><i class="fa-solid fa-minus"></i> تصغير</button>
          </div>

          <header class="reader-hero">
            <h1>${escapeHTML(section.title)}</h1>
            <div class="reader-stats">
              <span class="reader-stat"><i class="fa-solid fa-font"></i> ${words.toLocaleString('ar')} كلمة</span>
              <span class="reader-stat"><i class="fa-regular fa-clock"></i> ${readMinutes(section)} دقيقة تقريبًا</span>
              <span class="reader-stat"><i class="fa-regular fa-file-lines"></i> ${section.paragraphs.length} فقرة</span>
            </div>
          </header>

          <article id="readerContent" class="reader-content">
            ${section.paragraphs.map(p=>`<p>${decorateParagraph(p)}</p>`).join('')}
          </article>
        </section>`;

      document.getElementById('readerBack').addEventListener('click',()=>go('home'));
      document.getElementById('copyContent').addEventListener('click',()=>copySection(section));
      document.getElementById('shareContent').addEventListener('click',()=>shareSection(section));
      document.getElementById('favoriteContent').addEventListener('click',e=>{
        const active=toggleFavorite(id);
        e.currentTarget.classList.toggle('active',active);
        e.currentTarget.innerHTML=`<i class="${active?'fa-solid':'fa-regular'} fa-bookmark"></i> <span>${active?'محفوظ':'مفضلة'}</span>`;
      });
      document.getElementById('fontPlus').addEventListener('click',()=>adjustFont(1));
      document.getElementById('fontMinus').addEventListener('click',()=>adjustFont(-1));

      const positions=safeParse(localStorage.getItem(STORAGE.scroll),{});
      requestAnimationFrame(()=>{
        const y=Math.max(0, Number(positions[id]||0));
        window.scrollTo({top:y,behavior:'auto'});
        updateReadingProgress();
      });
    }

    async function copySection(section){
      const text=[section.title,...section.paragraphs].join('\n\n');
      try{
        await navigator.clipboard.writeText(text);
        showToast('تم نسخ محتوى القسم');
      }catch{
        const ta=document.createElement('textarea');
        ta.value=text;document.body.appendChild(ta);ta.select();
        document.execCommand('copy');ta.remove();
        showToast('تم نسخ محتوى القسم');
      }
    }

    async function shareSection(section){
      const payload={title:section.title,text:section.title,url:location.href};
      if(navigator.share){
        try{ await navigator.share(payload); }catch{}
      }else{
        try{ await navigator.clipboard.writeText(location.href); showToast('تم نسخ رابط القسم'); }
        catch{ showToast('المشاركة غير مدعومة في هذا المتصفح'); }
      }
    }

    function adjustFont(delta){
      settings.fontSize=Math.min(34,Math.max(16,Number(settings.fontSize)+delta));
      saveSettings();
      showToast(`حجم الخط: ${settings.fontSize}`);
    }

    function renderFavorites(){
      currentSectionId=null;
      progressBar.classList.add('hidden');
      updateNav('favorites');
      const ids=getFavorites();
      const list=ids.map(id=>SECTIONS.find(s=>s.id===id)).filter(Boolean);
      app.innerHTML=`
        <div class="page-title fade-up">
          <h1>المفضلة</h1>
          <p>الأبواب التي حفظتها للعودة إليها سريعًا.</p>
        </div>
        ${list.length
          ? `<section class="cards-grid">${list.map(sectionCard).join('')}</section>`
          : `<div class="empty-state fade-up"><div><i class="fa-regular fa-bookmark"></i><h3>لا توجد عناصر في المفضلة</h3><p>أضف أي باب من الصفحة الرئيسية أو أثناء القراءة.</p></div></div>`}
      `;
      bindCards();bindRipples();window.scrollTo(0,0);
    }

    function renderSettings(){
      currentSectionId=null;
      progressBar.classList.add('hidden');
      updateNav('settings');
      app.innerHTML=`
        <section class="settings-wrap fade-up">
          <div class="page-title">
            <h1>الإعدادات</h1>
            <p>خصّص تجربة القراءة بالشكل المريح لك.</p>
          </div>

          <div class="settings-card">
            <div class="setting-row">
              <div class="setting-info"><strong>الوضع الليلي</strong><small>التبديل بين المظهر النهاري والليلي.</small></div>
              <div class="setting-control"><button id="themeSwitch" class="theme-switch" aria-label="تبديل الوضع"></button></div>
            </div>

            <div class="setting-row">
              <div class="setting-info"><strong>نوع خط القراءة</strong><small>يُطبَّق على نصوص الأبواب.</small></div>
              <div class="setting-control">
                <select id="fontSelect">
                  ${['Cairo','Tajawal','Noto Kufi Arabic','Amiri'].map(f=>`<option value="${f}" ${settings.font===f?'selected':''}>${f}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="setting-row">
              <div class="setting-info"><strong>حجم خط القراءة</strong><small>من 16 إلى 34 بكسل.</small></div>
              <div class="setting-control range-wrap">
                <input id="fontRange" type="range" min="16" max="34" step="1" value="${settings.fontSize}">
                <strong id="fontRangeValue">${settings.fontSize}px</strong>
              </div>
            </div>
          </div>

          <div class="settings-card">
            <button id="resetSettings" class="secondary-btn"><i class="fa-solid fa-rotate-left"></i> إعادة ضبط جميع الإعدادات</button>
          </div>
        </section>`;

      document.getElementById('themeSwitch').addEventListener('click',()=>{
        settings.theme=settings.theme==='dark'?'light':'dark';saveSettings();
      });
      document.getElementById('fontSelect').addEventListener('change',e=>{
        settings.font=e.target.value;saveSettings();
      });
      document.getElementById('fontRange').addEventListener('input',e=>{
        settings.fontSize=Number(e.target.value);
        document.getElementById('fontRangeValue').textContent=`${settings.fontSize}px`;
        saveSettings();
      });
      document.getElementById('resetSettings').addEventListener('click',()=>{
        settings={...DEFAULTS};
        localStorage.removeItem(STORAGE.settings);
        applySettings();
        renderSettings();
        showToast('تمت إعادة الإعدادات الافتراضية');
      });
      window.scrollTo(0,0);
    }

    function renderRoute(){
      saveCurrentScroll();
      const route=getRoute();
      if(route.page==='section') renderSection(route.id);
      else if(route.page==='favorites') renderFavorites();
      else if(route.page==='settings') renderSettings();
      else renderHome();
    }

    function saveCurrentScroll(){
      if(!currentSectionId) return;
      const positions=safeParse(localStorage.getItem(STORAGE.scroll),{});
      positions[currentSectionId]=Math.round(window.scrollY);
      localStorage.setItem(STORAGE.scroll,JSON.stringify(positions));
    }

    function updateReadingProgress(){
      if(!currentSectionId){ progressBar.style.width='0%';return; }
      const article=document.getElementById('readerContent');
      if(!article) return;
      const start=article.offsetTop-window.innerHeight*.15;
      const end=article.offsetTop+article.offsetHeight-window.innerHeight*.8;
      const pct=Math.min(100,Math.max(0,((window.scrollY-start)/(end-start))*100));
      progressBar.style.width=`${pct}%`;
    }

    function createSnippet(section, query){
      const nq=normalizeArabic(query);
      const hay=[section.title,...section.paragraphs];
      const match=hay.find(t=>normalizeArabic(t).includes(nq)) || section.paragraphs[0] || '';
      if(match.length<=180) return match;
      const normalized=normalizeArabic(match);
      const idx=normalized.indexOf(nq);
      const approx=Math.max(0,idx-55);
      return `${approx>0?'…':''}${match.slice(approx,approx+180)}${match.length>approx+180?'…':''}`;
    }

    function searchSections(query){
      const q=normalizeArabic(query);
      if(!q) return [];
      return SECTIONS.filter(s=>{
        if(normalizeArabic(s.title).includes(q)) return true;
        return s.paragraphs.some(p=>normalizeArabic(p).includes(q));
      }).slice(0,18);
    }

    function openSearch(initial=''){
      searchModal.classList.remove('hidden');
      modalSearchInput.value=initial;
      renderSearchResults(initial);
      setTimeout(()=>modalSearchInput.focus(),30);
    }
    function closeSearch(){ searchModal.classList.add('hidden'); }
    function renderSearchResults(query){
      const q=query.trim();
      if(!q){
        searchResults.innerHTML='<div class="empty-state" style="min-height:180px"><div><i class="fa-solid fa-magnifying-glass"></i><p>ابدأ بكتابة كلمة للبحث في الكتاب.</p></div></div>';
        return;
      }
      const found=searchSections(q);
      searchResults.innerHTML=found.length ? found.map(s=>`
        <button class="search-result" data-search-open="${s.id}">
          <strong>${highlight(s.title,q)}</strong>
          <span>${escapeHTML(createSnippet(s,q))}</span>
        </button>`).join('') :
        '<div class="empty-state" style="min-height:180px"><div><i class="fa-regular fa-face-frown"></i><p>لم يتم العثور على نتائج.</p></div></div>';
      document.querySelectorAll('[data-search-open]').forEach(btn=>{
        btn.addEventListener('click',()=>{closeSearch();go(`section/${btn.dataset.searchOpen}`)});
      });
    }

    function bindRipples(){
      document.querySelectorAll('.ripple').forEach(el=>{
        el.addEventListener('click',function(e){
          const r=this.getBoundingClientRect();
          const ink=document.createElement('span');
          const size=Math.max(r.width,r.height);
          ink.className='ripple-ink';
          ink.style.width=ink.style.height=size+'px';
          ink.style.left=(e.clientX-r.left-size/2)+'px';
          ink.style.top=(e.clientY-r.top-size/2)+'px';
          this.appendChild(ink);
          setTimeout(()=>ink.remove(),600);
        });
      });
    }

    document.querySelectorAll('[data-route]').forEach(btn=>{
      btn.addEventListener('click',()=>go(btn.dataset.route));
    });
    document.getElementById('openSearch').addEventListener('click',()=>openSearch());
    document.getElementById('closeSearch').addEventListener('click',closeSearch);
    searchModal.addEventListener('click',e=>{ if(e.target===searchModal) closeSearch(); });
    modalSearchInput.addEventListener('input',e=>renderSearchResults(e.target.value));
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape') closeSearch();
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}
    });

    backTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
    window.addEventListener('scroll',()=>{
      backTop.classList.toggle('show',window.scrollY>600);
      updateReadingProgress();
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer=setTimeout(saveCurrentScroll,180);
    },{passive:true});
    window.addEventListener('beforeunload',saveCurrentScroll);
    window.addEventListener('hashchange',renderRoute);

    applySettings();
    if(!location.hash) history.replaceState(null,'','#home');
    renderRoute();
  </script>
</body>
</html>

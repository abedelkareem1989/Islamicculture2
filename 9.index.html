نْدَ الإِمَامِ أَبِي حَنِيفَةَ فَهَذِهِ الْعُمْلَةُ الْمُسْتَعْمَلَةُ فِي هَذَا الْعَصْرِ لا تَجِبُ فِيهَا الزَّكَاةُ عِنْدَ الإِمَامَيْنِ الشَّافِعِيِّ وَمَالِكٍ وَتَجِبُ عِنْدَ أَبِي حَنِيفَةَ لِأَنَّهَا تَرُوجُ رَوَاجَ الذَّهَبِ وَالْفِضَّةِ، وَمَنْ أَخَذَ بِمَذْهَبِ أَبِي حَنِيفَةَ فَزَكَّاهَا أَخَذَ بِالِاحْتِيَاطِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":537},{"type":"p","text":"   وَتَجِبُ فِي الْمَعْدِنِ وَالرِّكَازِ. أَمَّا الْمَعْدِنُ فَهُوَ الذَّهَبُ أَوِ الْفِضَّةُ إِذَا اسْتُخْرِجَا مِنَ الْمَكَانِ الَّذِي خَلَقَهُمَا اللَّهُ فِيهِ بَعْدَ التَّنْقِيَةِ مِنَ التُّرَابِ وَأَمَّا الرِّكَازُ فَهُوَ الذَّهَبُ أَوِ الْفِضَّةُ الْمَدْفُونَانِ قَبْلَ بِعْثَةِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَيْسَ الدَّفِينَ الإِسْلامِيَّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":538},{"type":"p","text":"   وَتَجِبُ الزَّكَاةُ أَيْضًا فِي أَمْوَالِ التِّجَارَةِ الَّتِي لا زَكَاةَ فِي أَعْيَانِهَا كَالثِّيَابِ وَالسُّكَّرِ وَالْمِلْحِ وَالْخَيْلِ وَالْحُمُرِ وَالدَّجَاجِ لِمَنْ يَتْجَرُ بِهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":539},{"type":"p","text":"   فَلا زَكَاةَ فِي غَيْرِ مَا ذُكِرَ مِنَ الأَمْوَالِ مِنْ نَحْوِ الْبَيْتِ الَّذِي يَمْتَلِكُهُ الشَّخْصُ لِيَسْتَغِلَّهُ بِالإِيجَارِ، وَلَوْ كَانَ يَمْلِكُ عِدَّةَ أَبْنِيَةٍ يَسْتَغِلُّهَا بِالإِيجَارِ، وَكَذَلِكَ السَّيَّارَاتُ الَّتِي يَمْتَلِكُهَا الشَّخْصُ لِاسْتِغْلالِهَا بِالإِيجَارِ أَوْ لِيَسْتَعْمِلَهَا بِالرُّكُوبِ لِنَفْسِهِ كُلُّ ذَلِكَ لا زَكَاةَ فِي عَيْنِهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":540},{"type":"p","text":"وَأَمَّا الْحُلِيُّ الْمُبَاحُ مِنْ ذَهَبٍ أَوْ فِضَّةٍ فَقَدِ اخْتَلَفَ فِيهِ الأَئِمَّةُ فَأَبُو حَنِيفَةَ يَرَى وُجُوبَ الزَّكَاةِ فِي حُلِيِّ النِّسَاءِ وَأَمَّا الشَّافِعِيُّ فَقَالَ فِيهِ قَوْلَيْنِ مَرَّةً قَال تَجِبُ الزَّكَاةُ فِي حُلُيِّ النِّسَاءِ وَمَرَّةً قَالَ لا تَجِبُ، وَالِاحْتِيَاطُ أَنْ يُزَكَّى الْحُلِيُّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":541},{"type":"p","text":"   وَأَمَّا الْفِطْرَةُ فَلا تُعَدُّ مِنْ زَكَاةِ الْمَالِ لِأَنَّهَا تَجِبُ فِي حَقِّ الطِّفْلِ الْمَوْلُودِ وَهُوَ لا يُعَدُّ مَالًا. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":542},{"type":"p","text":"   ثُمَّ إِنَّ الْمُؤَلِّفُ بَدَأَ بِتَفْصِيلِ زَكَاةِ الأَنْعَامِ فَقَالَ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":543},{"type":"source","text":"   وَأَوَّلُ نِصَابِ الإِبِلِ خَمْسٌ وَالْبَقَرِ ثَلاثُونَ وَالْغَنَمِ أَرْبَعُونَ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":544},{"type":"p","text":"   الشَّرْحُ أَنَّ أَوَّلَ نِصَابِ الإِبِلِ أَيْ أَوَّلَ قَدْرٍ تَجِبُ فِيهِ الزَّكَاةُ عَلَى مَنْ مَلَكَ مِنَ الإِبِلِ شَيْئًا هُوَ خَمْسٌ مِنَ الإِبِلِ فَلا زَكَاةَ عَلَى مَنْ مَلَكَ أَقَلَّ مِنَ الْخَمْسِ، وَأَنَّ الْبَقَرَ أَوَّلَ نِصَابِهَا ثَلاثُونَ فَلا زَكَاةَ فِيمَا دُونَ ذَلِكَ فَلا زَكَاةَ فِيمَا كَانَ أَقَلَّ مِنْ ثَلاثِينَ بَقَرَةٍ، وَأَنَّ الْغَنَمَ أَوَّلَ نِصَابِهَا أَرْبَعُونَ مِنْهَا فَلا زَكَاةَ قَبْلَ بُلُوغِهَا ذَلِكَ، وَالْغَنَمُ فِي اللُّغَةِ شَامِلٌ لِلضَّأْنِ وَالْمَعْزِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":545},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَلا زَكَاةَ قَبْلَ ذَلِكَ وَلا بُدَّ مِنَ الْحَولِ بَعْدَ ذَلِكَ وَلا بُدَّ مِنَ السَّوْمِ فِي كَلَإٍ مُبَاحٍ أَيْ أَنْ يَرْعَاهَا مَالِكُهَا أَوْ مَنْ أَذِنَ لَهُ فِي كَلَإٍ مُبَاحٍ أَيْ مَرْعًى لا مَالِكَ لَهُ وَأَنْ لا تَكُونَ عَامِلَةً فَالْعَامِلَةُ فِي نَحْوِ الْحَرْثِ لا زَكَاةَ فِيهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":546},{"type":"p","text":"   الشَّرْحُ يُشْتَرَطُ لِوُجُوبِ الزَّكَاةِ فِي الأَنْعَامِ النِّصَابُ. وَالأَنْعَامُ هِيَ الإِبِلُ وَالْبَقَرُ وَالْغَنَمُ وَلا يُطْلَقُ هَذَا اللَّفْظُ عَلَى غَيْرِ هَؤُلاءِ الثَّلاثِ. وَمُفْرَدُ الأَنْعَامِ نَعَمٌ فَلا زَكَاةَ فِي الأَنْعَامِ قَبْلَ بُلُوغِ النِّصَابِ فَمَنْ أَخْرَجَ مِنْهَا شَيْئًا بِنِيَّةِ الزَّكَاةِ قَبْلَ النِّصَابِ فَهُوَ عَمَلٌ فَاسِدٌ كَمَنْ يُصَلِّي صَلاةً فَاسِدَةً لَكِنْ إِنْ نَوَى الصَّدَقَةَ تَطَوُّعًا كَانَ ذَلِكَ عَمَلًا حَسَنًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":547},{"type":"p","text":"   وَلا بُدَّ أَيْضًا فِي زَكَاةِ الأَنْعَامِ مِنَ الْحَوْلِ أَيْ مِنْ مُضِيِّ سَنَةٍ قَمَرِيَّةٍ ابْتِدَاءً مِنْ تَمَامِ النِّصَابِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":548},{"type":"p","text":"   وَلا بُدَّ أَيْضًا لِوُجُوبِ زَكَاةِ الأَنْعَامِ مِنَ السَّوْمِ مِنَ الْمَالِكِ أَوْ نَائِبِهِ فِي كَلَإٍ مُبَاحٍ فَلا زَكَاةَ فِي الْمَعْلُوفَةِ أَوِ السَّائِمَةِ بِنَفْسِهَا. وَالسَّائِمَةُ مَعْنَاهَا الرَّاعِيَةُ فَالْغَنَمُ إِنْ كَانَتْ تَرْعى بِنَفْسِهَا بِأَنْ تُسَرَّحَ إِلَى الْمَرْعَى فَتَرْعَى بِنَفْسِهَا فَتَأْكُلَ مِنْ نَبَاتِ الأَرْضِ وَلا يَكُونُ مَعَهَا صَاحِبُهَا وَلا وَكِيلُهُ فَلا زَكَاةَ فِيهَا إِنَّمَا الزَّكَاةُ فِي الأَنْعَامِ الَّتِي يُسِيمُهَا صَاحِبُهَا أَيْ هُوَ أَوْ نَائِبُهُ يَأْخُذُهَا إِلَى مَحَلِّ الْمَرْعَى حَتَّى تَأْكُلَ مِنْ هَذَا الْكَلَإِ الْمُبَاحِ أَيِ الْكَلَإِ الَّذِي لا مَالِكَ لَهُ إِنَّمَا هُوَ مُشْتَرَكٌ بَيْنَ النَّاسِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":549},{"type":"p","text":"   وَلا بُدَّ أَيْضًا لِوُجُوبِ زَكَاةِ الأَنْعَامِ مِنْ أَنْ لا تَكُونَ عَامِلَةً فِي نَحْوِ حَرْثٍ لِمَالِكِهَا أَوْ بِأُجْرَةٍ فَلا زَكَاةَ فِي الْعَامِلَةِ وَإِنْ أُسِيمَتْ فِي كَلَإٍ مُبَاحٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":550},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَيَجِبُ فِي كُلِّ خَمْسٍ مِنَ الإِبِلِ شَاةٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":551},{"type":"p","text":"   الشَّرْحُ أَوَّلُ نِصَابِ الإِبِلِ خَمْسٌ مِنَ الإِبِلِ وَلا زَكَاةَ فِيهَا إِلَّا شَاةٌ وَاحِدَةٌ، ثُمَّ هَذِهِ الشَّاةُ إِمَّا جَذَعَةُ ضَأْنٍ وَهِيَ الضَّأْنُ الَّتِي أَكْمَلَتْ سَنَةً أَوْ أَسْقَطَتْ مُقَدَّمَ أَسْنَانِهَا قَبْلَ ذَلِكَ وَإِمَّا ثَنِيَّةُ الْمَعْزِ وَهِيَ الأُنْثَى مِنَ الْمَعْزِ الَّتِي أَكْمَلَتْ سَنَتَيْنِ، فَصَاحِبُ الإِبِلِ الْخَمْسِ مُخَيَّرٌ بَيْنَ أَنْ يُخْرِجَ عَنِ الْخَمْسِ جَذَعَةَ ضَأْنِ وَبَيْنَ أَنْ يُخْرِجَ عَنْهَا ثَنِيَّةَ مَعْزٍ. ثُمَّ لا يُزَادُ عَلَى الشَّاةِ الْوَاحِدَةِ إِلَى أَنْ تَبْلُغَ إِبِلُهُ عَشْرًا فَفِي الْعَشْرِ ثِنْتَانِ. ثُمَّ لا يُزَادُ عَلَى الثِّنْتَيْنِ إِلَى أَنْ تَبْلُغَ خَمْسَ عَشْرَةَ وَفِيهَا ثَلاثُ شِيَاهٍ. ثُمَّ لا يُزَادُ عَلَيْهَا إِلَى عِشْرِينَ وَفِيهَا أَرْبَعٌ. ثُمَّ لا يُزَادُ إِلَى أَنْ تَبْلُغَ إِبِلُهُ خَمْسَةً وَعِشْرِينَ وَفِيهَا بِنْتُ مَخَاضٍ مِنَ الإِبِلِ.  ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":552},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَفِي أَرْبَعِينَ مِنَ الْغَنَمِ شَاةٌ جَذَعَةُ ضَأْنٍ أَوْ ثَنِيَّةُ مَعْزٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":553},{"type":"p","text":"   الشَّرْحُ الْوَاجِبُ إِخْرَاجُهُ فِي أَرْبَعِينَ مِنَ الْغَنَمِ هُوَ شَاةٌ أُنْثَى جَذَعَةُ ضَأْنٍ أَوْ ثَنِيَّةُ مَعْزٍ وَهِيَ مَا لَهَا سَنَتَانِ كَامِلَتَانِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":554},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَفِي كُلِّ ثَلاثِينَ مِنَ الْبَقَرِ تَبِيعٌ ذَكَرٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":555},{"type":"p","text":"   الشَّرْحُ الْوَاجِبُ فِي أَوَّلِ نِصَابِ الْبَقَرِ الَّذِي هُوَ ثَلاثُونَ تَبِيعٌ وَاحِدٌ أَيْ ذَكَرٌ مِنَ الْبَقَرِ لَهُ سَنَةٌ كَامِلَةٌ، وَيُجْزِئُ أَنْ يُخْرِجَ عَنِ الثَّلاثِينَ مِنَ الْبَقَرِ تَبِيعَةً أَيْ أُنْثَى لَهَا سَنَةٌ كَامِلَةٌ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":556},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: ثُمَّ إِنْ زَادَتْ مَاشِيَتُهُ عَلَى ذَلِكَ فَفِي ذَلِكَ الزَّائِدِ. وَيَجِبُ عَلَيْهِ أَنْ يَتَعَلَّمَ مَا أَوْجَبَهُ اللَّهُ تَعَالَى عَلَيْهِ فِيهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":557},{"type":"p","text":"   الشَّرْحُ لَمَّا كَانَ الْمُؤَلِّفُ لَمْ يَذْكُرْ فِي الْمَتْنِ إِلَّا النِّصَابَ الأَوَّلَ فِي الأَنْعَامِ الثَّلاثَةِ بَيَّنَ فِي قَوْلِهِ هَذَا أَنَّ عَلَى الْمُكَلَّفِ الَّذِي تَزِيدُ مَاشِيَتُهُ عَلَى أَوَّلِ النِّصَابِ أَنْ يَتَعَلَّمَ وُجُوبًا عَيْنِيًّا حُكْمَ مَا زَادَ عَلَى أَوَّلِ النِّصَابِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":558},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَمَّا التَّمْرُ وَالزَّبِيبُ وَالزُّرُوعُ  فَأَوَّلُ نِصَابِهَا خَمْسَةُ أَوْسُقٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":559},{"type":"p","text":"   الشَّرْحُ نِصَابُ التَّمْرِ وَالزَّبِيبِ وَالزُّرُوعِ خَمْسَةُ أَوْسُقٍ وَلَيْسَ فِيمَا دُونَ ذَلِكَ زَكَاةٌ لِقَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لَيْسَ فِيمَا دُونَ خَمْسَةِ أَوْسُقٍ صَدَقَةٌ» رَوَاهُ الْبُخَارِيُّ وَمُسْلِمٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":560},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَهِيَ ثَلاثُمِائَةِ صَاعٍ بِصَاعِهِ عَلَيْهِ الصَّلاةُ وَالسَّلامُ وَمِعْيَارُهُ مَوْجُودٌ بِالْحِجَازِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":561},{"type":"p","text":"   الشَّرْحُ خَمْسَةُ أَوْسُقٍ هِيَ ثَلاثُمِائَةِ صَاعٍ لِأَنَّ كُلَّ وَسْقٍ سِتُّونَ صَاعًا فَمَجْمُوعُ الْخَمْسَةِ الأَوْسُقِ ثَلاثُمِائَةِ صَاعٍ، وَمِعْيَارُ الصَّاعِ النَّبَوِيِّ الَّذِي كَانَ مَعْرُوفًا فِي عَهْدِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا يَزَالُ مَوْجُودًا فِي الْحِجَازِ وَهُوَ أَرْبَعَةُ أَمْدَادٍ، وَالْمُدُّ هُوَ الْحَفْنَةُ بِكَفَّيِ رَجُلٍ مُعْتَدِلٍ لا طَوِيلِ الْكَفِّ وَلا قَصِيرِهَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":562},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيُضَمُّ زَرْعُ الْعَامِ بَعْضُهُ إِلَى بَعْضٍ فِي إِكْمَالِ النِّصَابِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":563},{"type":"p","text":"   الشَّرْحُ يَجِبُ ضَمُّ زَرْعِ الْعَامِ بَعْضِهِ إِلَى بَعْضٍ فِي إِكْمَالِ النِّصَابِ وَكَذَلِكَ الثَّمَرُ، مِثَالُ ذَلِكَ أَنْ يَكُونَ عِنْدَهُ نَخْلٌ يُثْمِرُ بَعْضُهُ فِي الرَّبِيعِ وَبَعْضُهُ فِي الصَّيْفِ أَوْ يُثْمِرُ نَخْلُهُ فِي الْعَامِ مَرَّتَيْنِ وَيَكُونُ إِطْلاعُ الثَّانِي قَبْلَ جَدَادِ الأَوَّلِ وَجَدَادُ الْكُلِّ فِي عَامٍ وَاحِدٍ فَالْحُكْمُ فِي ذَلِكَ أَنَّهُ إِنْ كَمَلَ النِّصَابُ بِضَمِّ الأَوَّلِ إِلَى الثَّانِي وَجَبَ إِخْرَاجُ الزَّكَاةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":564},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلا يُكَمَّلُ جِنْسٌ بِجِنْسٍ كَالشَّعِيرِ مَعَ الْحِنْطَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":565},{"type":"p","text":"   الشَّرْحُ لا يُكَمَّلُ النِّصَابُ مِنْ جِنْسَيْنِ كَالتَّمْرِ وَالزَّبِيبِ، وَالْقَمْحِ وَالشَّعِيرِ، فَإِذَا كَانَتْ كَمِيَّةُ التَّمْرِ أَقَلَّ مِنْ خَمْسَةِ أَوْسُقٍ فَلا يُكَمَّلُ نِصَابُهَا بِالزَّبِيبِ، كَذَلِكَ إِذَا كَانَ عِنْدَهُ قَمْحٌ أَقَلُّ مِنْ خَمْسَةِ أَوْسُقٍ وَكَانَ عِنْدَهُ مِنَ الشَّعِيرِ مَا يُكَمَّلُ بِهِ النِّصَابُ فَلا يُكَمَّلُ هَذَا بِهَذَا فَلا زَكَاةَ عَلَيْهِ، لَكِنَّ النَّوْعَ يُكَمَّلُ بِالنَّوْعِ الآخَرِ فَإِذَا كَانَ لَهُ نَوْعَانِ مِنَ التَّمْرِ كَالْبَرْنِيِّ وَالْعَجْوَةِ فَإِنَّهُ يُكَمَّلُ النِّصَابُ مِنَ النَّوْعَيْنِ فَتَجِبُ الزَّكَاةُ فِي ذَلِكَ إِنْ بَلَغَ مَجْمُوعُهُمَا نِصَابًا وَكَذَلِكَ الْبُرُّ فَالْمِصْرِيُّ مِنْهُ يُكَمَّلُ نِصَابُهُ بِالْبُرِّ الشَّامِيِّ لِاتِّحَادِ الِاسْمِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":566},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَجِبُ الزَّكَاةُ بِبُدُوِّ الصَّلاحِ وَاشْتِدَادِ الْحَبِّ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":567},{"type":"p","text":"   الشَّرْحُ زَكَاةُ الثَّمَرِ أَيْ ثَمَرِ النَّخْلِ وَالْكَرْمِ لا تَجِبُ عَلَى مَالِكِهِمَا إِلَّا أَنْ يَبْدُوَ صَلاحُ الثَّمَرِ فَمَتَى بَدَا صَلاحُ الثَّمَرِ وَلَوْ فِي حَبَّةٍ وَاحِدَةٍ وَجَبَتِ الزَّكَاةُ. وَمَعْنَى بُدُوِّ الصَّلاحِ أَنْ تَظْهَرَ عَلامَةُ بُلُوغِهِ صِفَةً يُطْلَبُ فِيهَا لِلأَكْلِ غَالِبًا فَفِي حَالِ كَوْنِ ثَمَرَةِ الْكَرْمِ حِصْرِمًا لا تَجِبُ فِيهِ الزَّكَاةُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":568},{"type":"p","text":"   وَكَذَلِكَ الْحَبُّ مِنَ الْقَمْحِ وَغَيْرِهِ لا تَجِبُ فِيهِ الزَّكَاةُ إِلَّا بَعْدَ أَنْ يَشْتَدَّ الْحَبُّ لِأَنَّهُ عِنْدَهَا يَصِيرُ مَقْصُودًا لِلأَكْلِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":569},{"type":"p","text":"   وَلا يَصِحُّ الإِخْرَاجُ إِلَّا بَعْدَ الْجَفَافِ فِي الثَّمَرِ وَالتَّصْفِيَةِ فِي الزَّرْعِ فَلا يُخْرَجُ مِنْهُ مُخْتَلِطًا بِسُنْبُلِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":570},{"type":"p","text":"   تَنْبِيهٌ. مَا كَانَ مِنَ الْعِنَبِ مِنَ الصِّنْفِ الَّذِي لا يَتَزَبَّبُ يُخْرَجُ مِنْهُ وَهُوَ عِنَبٌ رَطْبٌ قَبْلَ الْجَفَافِ، وَكَذَلِكَ مَا لا يَتَتَمَّرُ مِنْ ثَمَرِ النَّخْلِ يُخْرَجُ مِنْهُ زَكَاتُهُ وَهُوَ رَطْبٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":571},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ فِيهَا الْعُشْرُ إِنْ لَمْ تُسْقَ بِمُؤْنَةٍ وَنِصْفُهُ إِنْ سُقِيَتْ بِهَا، وَمَا زَادَ عَلَى النِّصَابِ أُخْرِجَ مِنْهُ بِقِسْطِهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":572},{"type":"p","text":"   الشَّرْحُ زَكَاةُ الثَّمَرِ أَيْ ثَمَرِ النَّخْلِ وَالْكَرْمِ أَيِ التَّمْرِ وَالزَّبِيبِ وَالزَّرْعِ أَيِ الْحَبِّ مِنَ الْقَمْحِ وَالشَّعِيرِ وَالأَرُزِّ وَنَحْوِ ذَلِكَ عُشْرُ الْمَحْصُولِ وَهُوَ ثَلاثُونَ صَاعًا عَنْ ثَلاثِمِائَةٍ، هَذَا إِنْ سُقِيَتْ بِلا مُؤْنَةٍ كَأَنْ سُقِيَتْ بِمَطَرٍ أَوْ نَحْوِهِ كَمَاءِ النَّهْرِ أَوِ الْعُيُونِ أَوِ الثَّلْجِ أَوْ بِمَا يَجْرِي فِي السَّوَاقِي الْمَحْفُورَةِ مِنَ النَّهْرِ وَإِنِ احْتَاجَتْ لِمُؤْنَةٍ، وَأَمَّا مَا سُقِيَ بِالْمُؤْنَةِ فَيَجِبُ فِيهِ نِصْفُ الْعُشْرِ أَيْ خَمْسَةَ عَشَرَ صَاعًا عَنِ الثَّلاثِمِائَةٍ وَذَلِكَ كَالْمَسْقِيِّ بِالنَّوَاضِحِ [أَيِ الدَّوَّابِ الَّتِي يُحْمَلُ عَلَيْهَا الْمَاءُ] مِنَ الإِبِلِ وَالْبَقَرِ وَالدَّوَالِيبِ، وَكَذَلِكَ الْمَسْقِيُّ بِالْمَاءِ الْمَمْلُوكِ. قَالَ الْقَاضِي ابْنُ كَجٍّ لَوِ اشْتَرَى الْمَاءَ كَانَ الْوَاجِبُ نِصْفَ الْعُشْرِ وَكَذَا لَوْ سَقَاهُ بِمَاءٍ مَغْصُوبٍ لِأَنَّ عَلَيْهِ ضَمَانَهُ اهـ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":573},{"type":"p","text":"   وَذَكَرَ الْمُؤَلِّفُ حُكْمَ مَا زَادَ عَلَى النِّصَابِ فِي الثِّمَارِ وَالزُّرُوعِ أَنَّهُ يَجِبُ الإِخْرَاجُ مِنْهُ بِحِسَابِهِ وَلَوْ كَانَ يَسِيرًا وَهُوَ الْعُشْرُ أَوْ نِصْفُهُ بِخِلافِ مَا يَزِيدُ فِي النَّعَمِ عَلَى النِّصَابِ مِنْ غَيْرِ أَنْ يَبْلُغَ النِّصَابُ الَّذِي يَلِيهِ فَإِنَّهُ عَفْوٌ لَيْسَ فِيهِ زَكَاةٌ.","style":"Body Text 3","align":"justify","bold":false,"size":18.0,"index":574},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلا زَكَاةَ فِيمَا دُونَ النِّصَابِ إِلَّا أَنْ يَتَطَوَّعَ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":575},{"type":"p","text":"   الشَّرْحُ لا زَكَاةَ فِيمَا كَانَ مِنَ الْحَبِّ وَالثَّمَرِ أَقَلَّ مِنَ النِّصَابِ إِلَّا أَنْ يَتَطَوَّعَ مَالِكُهُ خِلافًا لِمَذْهَبِ أَبِي حَنِيفَةَ فَإِنَّهُ يُوجِبُ الزَّكَاةَ فِيمَا دُونَ النِّصَابِ فِي الثِّمَارِ وَالزُّرُوعِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":576},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَمَّا الذَّهَبُ فَنِصَابُهُ عِشْرُونَ مِثْقَالًا وَالْفِضَّةُ مِائَتَا دِرْهَمٍ وَيَجِبُ فِيهِمَا رُبْعُ الْعُشْرِ وَمَا زَادَ فَبِحِسَابِهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":577},{"type":"p","text":"   الشَّرْحُ الْقَدْرُ الَّذِي تَجِبُ فِيهِ الزَّكَاةُ مِنَ الذَّهَبِ عِشْرُونَ مِثْقَالًا، وَالْمِثْقَالُ هُوَ مَا كَانَ وَزْنُهُ اثْنَتَيْنِ وَسَبْعِينَ حَبَّةَ شَعِيرٍ مُتَوَسِّطَةً لَمْ تُقْشَرْ وَقُطِعَ مِنْ طَرَفَيْهَا مَا دَقَّ وَطَالَ بِاعْتِبَارِ الْوَسَطِ مِنَ الْحَبَّةِ. وَأَمَّا الْفِضَّةُ فَنِصَابُهَا أَيِ الْقَدْرُ الَّذِي تَجِبُ الزَّكَاةُ فِيهِ مِنْهَا مِائَتَا دِرْهَمٍ، وَالدِّرْهَمُ الإِسْلامِيُّ وَزْنُهُ خَمْسُونَ حَبَّةَ شَعِيرٍ مُتَوَسِّطَةً وَخُمُسَا حَبَّةٍ. وَلا يَجِبُ فِيهِمَا إِلَّا رُبْعُ الْعُشْرِ. وَمَا زَادَ مِنَ الذَّهَبِ وَالْفِضَّةِ عَلَى النِّصَابِ وَإِنْ قَلَّ فَبِحِسَابِهِ. وَالِاعْتِبَارُ فِي النِّصَابِ بِخَالِصِ الذَّهَبِ وَالْفِضَّةِ. وَيُكَمَّلُ نَوْعٌ بِنَوْعٍ لا جِنْسٌ بِجِنْسٍ فَلَوْ كَانَ عِنْدَهُ فِي مِلْكِهِ مِقْدَارٌ مِنَ الذَّهَبِ أَقَلُّ مِنَ النِّصَابِ وَمِقْدَارٌ مِنَ الْفِضَّةِ أَقَلُّ مِنَ النِّصَابِ وَلَوْ بِقَدْرٍ يَسِيرٍ فَلا زَكَاةَ فِي ذَلِكَ لِأَنَّهُ لَمْ يَكْمُلِ النِّصَابُ مِنَ الذَّهَبِ بِمُفْرَدِهِ وَلا مِنَ الْفِضَّةِ بِمُفْرَدِهَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":578},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلا بُدَّ فِيهِمَا مِنَ الْحَوْلِ إِلَّا مَا حَصَلَ مِنْ مَعْدِنٍ أَوْ رِكَازٍ فَيُخْرِجُهَا حَالًا وَفِي الرِّكَازِ الْخُمُسُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":579},{"type":"p","text":"   الشَّرْحُ لا بُدَّ فِي وُجُوبِ زَكَاةِ الذَّهَبِ وَالْفِضَّةِ مِنَ الْحَوْلِ أَيْ مِنْ حَوَلانِ عَامٍ كَامِلٍ بِاعْتِبَارِ السَّنَةِ الْقَمَرِيَّةِ وَذَلِكَ لِحَدِيثِ «لا زَكَاةَ فِي مَالٍ حَتَّى يَحُولَ عَلَيْهِ الْحَوْلُ» فَإِذَا لَمْ يَسْتَمِرَّ سَنَةً كَامِلَةً فِي مِلْكِهِ فَقَدِ انْقَطَعَ الْحَوْلُ فَإِنْ عَادَ إِلَى مِلْكِهِ يَسْتَأْنِفُ لَهُ سَنَةً كَامِلَةً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":580},{"type":"p","text":"   وَالْمَعْدِنُ فِي عُرْفِ الْفُقَهَاءِ فِي بَابِ الزَّكَاةِ هُوَ الذَّهَبُ أَوِ الْفِضَّةُ اللَّذَانِ يُوجَدَانِ فِي الْمَوْضِعِ الَّذِي خَلَقَهُمَا اللَّهُ فِيهِ أَيْ لَيْسَ دَفِينًا بَلِ الدَّفِينُ يُسَمَّى رِكَازًا كَمَا تَقَدَّمَ، فَهَذَا الْمَعْدِنُ يُزَكَّى بَعْدَ تَحْصِيلِهِ وَتَنْقِيَتِهِ وَلا يُنْتَظَرُ لَهُ حَوَلانُ حَوْلٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":581},{"type":"p","text":"   وَأَمَّا الرِّكَازُ فَهُوَ الدَّفِينُ الْجَاهِلِيُّ أَيِ الَّذِي كَانَ دُفِنَ قَبْلَ بِعْثَةِ سَيِّدِنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَيْ مَا دَفَنَهُ النَّاسُ قَبْلَ بِعْثَةِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَمَنْ عَثَرَ عَلَيْهِ فِي أَرْضٍ مَوَاتٍ أَوْ مَلَكَهَا بِالإِحْيَاءِ أَيْ كَانَتْ غَيْرَ مَمْلُوكَةٍ لِأَحَدٍ إِنَّمَا هُوَ أَحْيَاهَا أَيِ اتَّخَذَهَا مَزْرَعَةً أَوْ بُسْتَانًا أَوْ مَسْكَنًا أَوْ نَحْوَ ذَلِكَ فَمَلَكَهَا بِذَلِكَ وَجَبَ عَلَيْهِ أَنْ يُزَكِّيَهُ فِي الْحَالِ أَيْ مَعَ بُلُوغِ النِّصَابِ أَيِ الْقَدْرِ الَّذِي تَجِبُ فِيهِ الزَّكَاةُ مِنَ الذَّهَبِ أَوِ الْفِضَّةِ. وَيُعْرَفُ كَوْنُهُ دَفِينًا جَاهِلِيًّا بِوُجُودِ اسْمِ مَلِكٍ مِنْ مُلُوكِ تِلْكَ الأَزْمَانِ عَلَيْهِ. ثُمَّ حُكْمُ الرِّكَازِ أَنَّهُ يُخْرَجُ مِنْهُ الْخُمُسُ لَيْسَ رُبْعَ الْعُشْرِ بِخِلافِ الْمَعْدِنِ فَإِنَّهُ يُخْرَجُ مِنْهُ رُبْعُ الْعُشْرِ وَذَلِكَ لِأَنَّهُ لا مُؤْنَةَ فِي الرِّكَازِ بِخِلافِ الْمَعْدِنِ فَإِنَّ فِيهِ مُؤْنَةً لِتَصْفِيَتِهِ وَتَنْقِيَتِهِ مِنَ التُّرَابِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":582},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَمَّا زَكَاةُ التِّجَارَةِ فَنِصَابُهَا نِصَابُ مَا اشْتُرِيَتْ بِهِ مِنَ النَّقْدَيْنِ وَالنَّقْدَانِ هُمَا الذَّهَبُ وَالْفِضَّةُ وَلا يُعْتَبَرُ إِلَّا ءَاخِرُ الْحَوْلِ وَيَجِبُ فِيهَا رُبْعُ عُشْرِ الْقِيمَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":583},{"type":"p","text":"   الشَّرْحُ هَذَا بَيَانُ حُكْمِ زَكَاةِ التِّجَارَةِ. وَمَعْنَى التِّجَارَةِ تَقْلِيبُ الْمَالِ لِغَرَضِ الِاسْتِرْبَاحِ بِأَنْ يَشْتَرِيَ وَيَبِيعَ ثُمَّ يَشْتَرِيَ وَيَبِيعَ لِغَرَضِ الرِّبْحِ. وَأَمَّا نِصَابُهَا فَهُوَ مُعْتَبَرٌ بِنِصَابِ مَا اشْتُرِيَتْ بِهِ مِنَ النَّقْدَيْنِ أَيِ الذَّهَبِ وَالْفِضَّةِ لِأَنَّ عُرُوضَ التِّجَارَةِ تُقَوَّمُ بِمَا اشْتُرِيَتْ بِهِ فَإِنِ اشْتُرِيَتْ بِذَهَبٍ قُوِّمَتْ بِالذَّهَبِ وَإِنِ اشْتُرِيَتْ بِفِضَّةٍ فَبِالْفِضَّةِ وَإِنِ اشْتُرِيَتْ بِغَيْرِهِمَا قُوِّمَتْ بِالنَّقْدِ الْغَالِبِ فِي ذَلِكَ الْبَلَدِ فَإِنْ كَانَ الْغَالِبُ فِي ذَلِكَ الْبَلَدِ نَقْدَ الذَّهَبِ فَبِالذَّهَبِ وَإِنْ كَانَ الْغَالِبُ فِيهِ نَقْدَ الْفِضَّةِ فَبِنَقْدِ الْفِضَّةِ. أَمَّا مَا يَصْرِفُهُ الإِنْسَانُ مِنْ هَذَا الْمَالِ فِي أَثْنَاءِ الْحَوْلِ قَبْلَ حَوَلانِ الْحَوْلِ لِحَاجَاتِهِ أَوْ يَتَصَدَّقُ بِهِ عَلَى النَّاسِ أَوْ يَأْخُذُهُ لِيَتَّخِذَهُ قِنْيَةً أَيْ يُمْسِكُهُ لِلِانْتِفَاعِ بِعَيْنِهِ أَكْلًا أَوْ شُرْبًا أَوْ لُبْسًا أَوْ غَيْرَ ذَلِكَ فَهَذَا لا يَدْخُلُ فِي الْحِسَابِ عِنْدَ الزَّكَاةِ. ثُمَّ إِذَا بَلَغَتْ قِيمَةُ الْعُرُوضِ نِصَابًا ءَاخِرَ الْحَوْلِ وَجَبَتِ الزَّكَاةُ فِيهَا وَإِلَّا فَلا. وَلَوْ كَانَ لَهُ عَلَى غَيْرِهِ دَيْنٌ فَإِنَّهُ يَدْخُلُ فِي حِسَابِ الزَّكَاةِ وَتُضَافُ قِيمَتُهُ إِلَى قِيمَةِ الْعُرُوضِ. ثُمَّ إِنَّهُ لا يَجِبُ فِيهَا إِلَّا رُبْعُ الْعُشْرِ وَهُوَ بِالنِّسْبَةِ لِمِائَتَيْ دِرْهَمِ فِضَّةٍ إِسْلامِيٍّ خَمْسَةُ دَرَاهِمَ وَبِالنِّسْبَةِ لِعِشْرِينَ دِينَارًا ذَهَبِيًّا نِصْفُ دِينَارٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":584},{"type":"p","text":"   ثُمَّ يَجِبُ فِي مَذْهَبِ الإِمَامِ الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ إِخْرَاجُ عَيْنِ الذَّهَبِ أَوْ عَيْنِ الْفِضَّةِ عِنْدَ الزَّكَاةِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":585},{"type":"p","text":"   ثُمَّ يُشْتَرَطُ لِوُجُوبِ الزَّكَاةِ فِي عُرُوضِ التِّجَارَةِ أَنْ لا يَقْطَعَ نِيَّةَ التِّجَارَةِ فِي أَثْنَاءِ الْحَوْلِ فَإِنْ قَطَعَهَا فَلا زَكَاةَ عَلَيْهِ، أَمَّا إِنْ قَطَعَ نِيَّةَ التِّجَارَةِ بَعْدَمَا حَالَ الْحَوْلُ فَفِي مَالِهِ زَكَاةٌ لِهَذَا الْعَامِ الْمَاضِي، أَمَّا بِالنِّسْبَةِ لِلْمُسْتَقْبَلِ فَقَدْ خَرَجَ عَنْ كَوْنِهِ مَالَ زَكَاةٍ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":586},{"type":"p","text":"   وَالْعِبْرَةُ فِي زَكَاةِ التِّجَارَةِ بِثَمَنِ الْبِضَاعَةِ عِنْدَ حَوَلانِ الْحَوْلِ بِاعْتِبَارِ شِرَاءِ النَّاسِ لِلْبِضَاعَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":587},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَالُ الْخَلِيطَيْنِ أَوِ الْخُلَطَاءِ كَمَالِ الْمُنْفَرِدِ فِي النِّصَابِ وَالْمُخْرَجِ إِذَا كَمَلَتْ شُرُوطُ الْخُلْطَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":588},{"type":"p","text":"   الشَّرْحُ إِذَا اخْتَلَطَ مَالُ شَخْصٍ بِمَالِ شَخْصٍ ءَاخَرَ أَوْ بِمَالِ أَكْثَرَ مِنْ شَخْصٍ وَكَانَ الْخُلَطَاءُ مِنْ أَهْلِ الزَّكَاةِ وَالْمَجْمُوعُ نِصَابًا مِنْ جِنْسٍ وَاحِدٍ وَإِنِ اخْتَلَفَ النَّوْعُ وَلَوْ غَيْرَ مَاشِيَةٍ يَكُونُ حُكْمُ هَذَا الْمَالِ كَمَالِ الشَّخْصِ الْمُنْفَرِدِ مِنْ حَيْثُ النِّصَابُ وَمِنْ حَيْثُ قَدْرُ الْمُخْرَجِ فَتَجِبُ عَلَيْهِمُ الزَّكَاةُ كَزَكَاةِ الْمَالِ الْوَاحِدِ إِذَا كَمَلَتْ شُرُوطُ الْخُلْطَةِ. وَتُطْلَبُ شُرُوطُ الْخُلْطَةِ فِي النَّقْدِ وَالْحَبِّ وَالثَّمَرِ وَالْمَاشِيَةِ فِي مَوَاضِعِهَا مِنَ الْمَبْسُوطَاتِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":589},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَزَكَاةُ الْفِطْرِ تَجِبُ بِإِدْرَاكِ جُزْءٍ مِنْ رَمَضَانَ وَجُزْءٍ مِنْ شَوَّالٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":590},{"type":"p","text":"   الشَّرْحُ زَكَاةُ الْفِطْرِ تَجِبُ عَلَى مَنْ أَدْرَكَ ءَاخِرَ جُزْءٍ مِنْ رَمَضَانَ وَأَوَّلَ جُزْءٍ مِنْ شَوَّالٍ وَذَلِكَ بِإِدْرَاكِ غُرُوبِ شَمْسِ ءَاخِرِ يَوْمٍ مِنْ رَمَضَانَ وَهُوَ حَيٌّ حَيَاةً مُسْتَقِرَّةً فَلا تَجِبُ فِيمَا حَدَثَ بَعْدَ الْغُرُوبِ مِنْ وَلَدٍ أَوْ غِنًى أَوْ نِكَاحِ الزَّوْجَةِ أَوْ إِسْلامِ الشَّخْصِ أَوْ شُكَّ فِي حُدُوثِهِ بَعْدَ الْغُرُوبِ. وَالْمُرَادُ بِالْغِنَى فِي هَذَا الْمَوْضِعِ أَنْ يَكُونَ لِلشَّخْصِ مَالٌ يُخْرِجُهُ زَكَاةً فَاضِلًا عَنْ دَيْنِهِ وَمَسْكَنِهِ وَعَنْ قُوتِهِ وَقُوتِ مَنْ عَلَيْهِ نَفَقَتُهُ يَوْمَ الْعِيدِ وَلَيْلَتَهُ فَمَنْ كَانَ عِنْدَ الْغُرُوبِ حَيًّا وَكَانَ لَهُ مَالٌ يَفْضُلُ عَنْ ذَلِكَ فَهُوَ غَنِيٌّ فِي بَابِ زَكَاةِ الْفِطْرَةِ فَإِنْ كَانَ حَالَ الْغُرُوبِ بِصِفَةِ الْوُجُوبِ ثُمَّ حَدَثَ لَهُ مَوْتٌ أَوْ طَلاقٌ لَمْ تَسْقُطْ زَكَاتُهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":591},{"type":"p","text":"   ثُمَّ شَرَعَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ فِي بَيَانِ شُرُوطِ الْمُخْرَجِ عَنْهُ فَقَالَ عَلَى كُلِّ مُسْلِمٍ عَلَيْهِ وَعَلَى مَنْ عَلَيْهِ نَفَقَتُهُمْ إِذَا كَانُوا مُسْلِمِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":592},{"type":"p","text":"   الشَّرْحُ تَجِبُ زَكَاةُ الْفِطْرَةِ عَلَى الْمُسْلِمِ الْحُرِّ وَلَوْ كَانَ مُبَعَّضًا أَيْ بَعْضُهُ حُرٌّ وَبَعْضُهُ عَبْدٌ مَمْلُوكٌ. وَيَجِبُ عَلَيْهِ إِخْرَاجُهَا عَمَّنْ تَلْزَمُهُ نَفَقَتُهُمْ بِالشُّرُوطِ الْمُقَرَّرَةِ. وَمِمَّنْ عَلَيْهِ نَفَقَتُهُمْ الزَّوْجَةُ وَلَوْ رَجْعِيَّةً أَيْ طُلِّقَتْ بِطَلْقَةٍ أَوْ طَلْقَتَيْنِ وَلَمْ تَنْتَهِ عِدَّتُهَا وَالْبَائِنُ الْحَامِلُ وَعَبْدُ الزَّوْجَةِ الْمَمْلُوكُ لَهَا إِنْ أَخْدَمَهَا إِيَّاهُ فَإِنَّهُ يَجِبُ عَلَى الزَّوْجِ فِطْرَةُ زَوْجَتِهِ وَفِطْرَةُ خَادِمِهَا الَّذِي هُوَ مَمْلُوكٌ لَهَا إِذَا كَانَتْ مِمَّنْ يَسْتَحِقُّ الإِخْدَامَ كَأَنْ كَانَتْ فِي أَهْلِهَا مِمَّنْ تُخْدَمُ أَيْ يُتَّخَذُ لَهَا خَادِمٌ، وَمِنْهُمُ الْوَلَدُ الصَّغِيرُ وَإِنْ سَفُلَ وَالْوَالِدُ وَإِنْ عَلا إِذَا كَانَا فَقِيرَيْنِ أَمَّا إِنْ كَانَا غَنِيَّيْنِ بِمَالٍ فَلا تَجِبُ عَلَيْهِ زَكَاتُهُمَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":593},{"type":"p","text":"   وَلا يَصِحُّ إِخْرَاجُ الْفِطْرَةِ عَنِ الأَصْلِ الْغَنِيِّ وَالْوَلَدِ الْبَالِغِ إِلَّا بِإِذْنِهِ فَلْيُتَنَبَّهْ لِذَلِكَ فَإِنَّ كَثِيرًا مِنَ النَّاسِ يَغْفُلُونَ عَنْ هَذَا الْحُكْمِ فَيُخْرِجُونَ عَنِ الْوَلَدِ الْبَالِغِ بِدُونِ إِذْنِهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":594},{"type":"p","text":"   وَمِمَّنْ يَجِبُ إِخْرَاجُ الزَّكَاةِ عَنْهُ الْمَمْلُوكُ وَلَوْ كَانَ هَذَا الْمَمْلُوكُ مَرْهُونًا أَوْ ءَابِقًا هَارِبًا وَإِنِ انْقَطَعَ خَبَرُهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":595},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: عَلَى كُلِّ وَاحِدٍ صَاعٌ مِنْ غَالِبِ قُوتِ الْبَلَدِ إِذَا فَضَلَتْ عَنْ دَيْنِهِ وَكِسْوَتِهِ وَمَسْكَنِهِ وَقُوتِهِ وَقُوتِ مَنْ عَلَيْهِ نَفَقَتُهُمْ يَوْمَ الْعِيدِ وَلَيْلَتَهُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":596},{"type":"p","text":"   الشَّرْحُ لا تَجِبُ الزَّكَاةُ عَلَى مَنْ ذُكِرَ إِلَّا إِذَا فَضَلَ مَا يُخْرِجُهُ لِلْفِطْرَةِ عَنْ دَيْنِهِ وَلَوْ كَانَ ذَلِكَ الدَّيْنُ مُؤَجَّلًا، وَعَنْ كِسْوَتِهِ وَكِسْوَةِ مَنْ عَلَيْهِ نَفَقَتُهُ اللَّائِقَيْنِ بِهِمَا مَنْصِبًا وَمُرُوءَةً وَقَدْرًا وَنَوْعًا زَمَانًا وَمَكَانًا حَتَّى مَا يُتَجَمَّلُ بِهِ مِمَّا جَرَتْ بِهِ عَادَةُ مِثْلِهِ يَوْمَ الْعِيدِ أَوْ يَحْتَاجُهُ لِنَحْوِ بَرْدٍ، وَعَنْ مَسْكَنِهِ وَمَسْكَنِ مَنْ عَلَيْهِ نَفَقَتُهُمُ اللَّائِقَيْنِ بِهِمْ وَإِنِ اعْتَادَ السَّكَنَ بِأُجْرَةٍ وَكَذَا عَنْ خَادِمِهِ وَخَادِمِ زَوْجَتِهِ الَّذِي أَخْدَمَهَا إِيَّاهُ، وَعَنْ قُوتِهِ وَقُوتِ مَنْ عَلَيْهِ نَفَقَتُهُمْ وَلَوْ مَا اعْتِيدَ لِلْعِيدِ كَالْحَلْوَى لَيْلَةَ الْعِيدِ الْمُتَأَخِّرَةَ عَنْ يَوْمِهِ وَيَوْمَهُ. وَأَمَّا مَنْ طَرَأَ لَهُ الْقُدْرَةُ عَلَى ذَلِكَ بَعْدَ غُرُوبِ شَمْسِ ءَاخِرِ يَوْمٍ مِنْ رَمَضَانَ فِي أَثْنَاءِ اللَّيْلَةِ أَوْ فِي أَثْنَاءِ يَوْمِ الْعِيدِ أَخْرَجَهَا مِنْ غَيْرِ أَنْ تَكُونَ فَرْضًا عَلَيْهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":597},{"type":"p","text":"   وَيَجُوزُ إِخْرَاجُهَا فِي رَمَضَانَ وَلَوْ أَوَّلَ لَيْلَةٍ مِنْ رَمَضَانَ. وَالسُّنَّةُ إِخْرَاجُهَا يَوْمَ الْعِيدِ وَقَبْلَ الصَّلاةِ أَيْ صَلاةِ الْعِيدِ، وَيَحْرُمُ تَأْخِيرُهَا عَنْ يَوْمِ الْعِيدِ بِلا عُذْرٍ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":598},{"type":"p","text":"   وَزَكَاةُ الْفِطْرِ عَنْ كُلِّ شَخْصٍ هِيَ صَاعٌ مِنْ غَالِبِ قُوتِ الْبَلَدِ وَالصَّاعُ أَرْبَعَةُ أَمْدَادٍ وَالْمُدُّ مِلْءُ الْكَّفَيْنِ الْمُعْتَدِلَتَيْنِ كَمَا تَقَدَّمَ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":599},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَكْفِي النِّيَّةُ فِي جَمِيعِ أَنْوَاعِ الزَّكَاةِ مَعَ الإِفْرَازِ لِلْقَدْرِ الْمُخْرَجِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":600},{"type":"p","text":"   الشَّرْحُ تَجِبُ النِّيَّةُ الْقَلْبِيَّةُ فِي جَمِيعِ أَنْوَاعِ الزَّكَاةِ كَأَنْ يَقُولَ بِقَلْبِهِ هَذِهِ زَكَاةُ مَالِي أَوْ بَدَنِي أَوْ صَدَقَةُ مَالِي الْمَفْرُوضَةُ أَوْ صَدَقَةُ الْمَالِ الْمَفْرُوضَةُ أَوِ الْوَاجِبَةُ وَلا يَجِبُ تَعْيِينُ الْمُخْرَجِ عَنْهُ فِي النِّيَّةِ فَلَوْ لَمْ يَنْوِ إِلَّا بَعْدَ الدَّفْعِ لَمْ تَصِحَّ. وَالإِفْرَازُ هُوَ عَزْلُ الْقَدْرِ الَّذِي يَكُونُ زَكَاةً عَنْ مَالِهِ فَتَكْفِي النِّيَّةُ عِنْدَ عَزْلِ الزَّكَاةِ عَنِ الْمَالِ أَوْ بَعْدَ الْعَزْلِ وَقَبْلَ التَّفْرِقَةِ أَوْ عِنْدَ التَّفْرِقَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":601},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ صَرْفُهَا إِلَى مَنْ وُجِدَ فِي بَلَدِ الْمَالِ مِنَ الأَصْنَافِ الثَّمَانِيَةِ مِنَ الْفُقُرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِي الرِّقَابِ وَالْغَارِمِينَ وَهُمُ الْمَدِينُونَ الْعَاجِزُونَ عَنِ الْوَفَاءِ وَفِي سَبِيلِ اللَّهِ وَهُمُ الْغُزَاةُ الْمُتَطَوِّعُونَ وَلَيْسَ مَعْنَاهُ كُلَّ عَمَلٍ خَيْرِيٍّ وَابْنِ السَّبِيلِ وَهُوَ الْمُسَافِرُ الَّذِي لَيْسَ مَعَهُ مَا يُوصِلُهُ إِلَى مَقْصِدِهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":602},{"type":"p","text":"   الشَّرْحُ لا يَجُوزُ دَفْعُ الزَّكَاةِ إِلَى غَيْرِ هَؤُلاءِ الأَصْنَافِ الثَّمَانِيَةِ الَّذِينَ ذَكَرَهُمُ اللَّهُ فِي الْقُرْءَانِ بِقَوْلِهِ ﴿إِنَّمَـا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِي الرِّقَابِ وَالْغَارِمِينَ وَفِي سَبِيلِ اللَّهِ وَابْنِ السَّبِيلِ﴾ [سُورَةَ التَّوْبَة/60] وَلا يَجُوزُ صَرْفُهَا عِنْدَ الإِمَامِ الشَّافِعِيِّ إِلَّا إِلَى ثَلاثَةٍ مِنْ كُلِّ صِنْفٍ فَأَكْثَرَ مِنْ هَؤُلاءِ الثَّمَانِيَةِ أَيْ إِلَى مَنْ يُوجَدُ مِنْهُمْ فِي بَلَدِ الزَّكَاةِ أَيْ فِي بَلَدِ الْمَالِ لَكِنِ اخْتَارَ جَمْعٌ مِنَ الشَّافِعِيَّةِ جَوَازَ صَرْفِ زَكَاةِ الْفِطْرِ لِثَلاثَةِ فُقَرَاءَ أَوْ مَسَاكِينَ، وَجَمْعٌ ءَاخَرُونَ اخْتَارُوا جَوَازَ صَرْفِ زَكَاةِ شَخْصٍ وَاحِدٍ لِمُسْتَحِقٍّ وَاحِدٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":603},{"type":"p","text":"   وَالْفَقِيرُ هُوَ مَنْ لا نَفَقَةَ عَلَى غَيْرِهِ وَاجِبَةٌ لَهُ وَلا يَجِدُ إِلَّا أَقَلَّ مِنْ نِصْفِ كِفَايَتِهِ كَالَّذِي يَحْتَاجُ لِعَشَرَةٍ وَلا يَجِدُ إِلَّا أَرْبَعَةً فَأَقَلَّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":604},{"type":"p","text":"   وَالْمِسْكِينُ هُوَ الَّذِي لَهُ مَا يَسُدُّ مَسَدًّا مِنْ حَاجَتِهِ إِمَّا بِمِلْكٍ أَوْ بِعَمَلٍ يُغِلُّ لَهُ لَكِنَّهُ لا يَكْفِيهِ كِفَايَةً لائِقَةً بِحَالِهِ كَمَنْ يَحْتَاجُ لِعَشَرَةٍ فَلا يَجِدُ إِلَّا ثَمَانِيَةً فَيُعْطَى كِفَايَتُهُ. فَمَنْ كَانَ عِنْدَهُ مِلْكٌ يَجِدُ مِنْهُ كِفَايَتَهُ فَلا يَجُوزُ لَهُ بَعْدَ ذَلِكَ أَخْذُ الزَّكَاةِ بِاسْمِ الْمَسْكَنَةِ أَوِ الْفَقْرِ، وَكَذَلِكَ مَنْ كَانَ لَهُ عَمَلٌ يَكْفِيهِ دَخْلُهُ لا يَجُوزُ لَهُ أَنْ يَأْخُذَ الزَّكَاةَ بِاسْمِ الْفَقْرِ أَوِ الْمَسْكَنَةِ لِأَنَّ هَذَا غَنِيٌّ بِعَمَلِهِ كَمَا أَنَّ الأَوَّلَ غَنِيٌّ بِمَالِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":605},{"type":"p","text":"   وَالْعَامِلُونَ عَلَيْهَا هُمُ الَّذِينَ نَصَبَهُمُ الْخَلِيفَةُ أَوِ السُّلْطَانُ لِأَخْذِ الزَّكَوَاتِ مِنْ أَصْحَابِ الأَمْوَال وَلَمْ يَجْعَلْ لَهُمْ أُجْرَةً مِنْ بَيْتِ الْمَالِ وَإِلَّا فَلا يَجُوزُ إِعْطَاؤُهُمْ مِنَ الزَّكَاةِ. ثُمَّ إِذَا دَفَعَ الْمَالِكُ الزَّكَاةَ بِنَفْسِهِ سَقَطَ الْعَامِلُ وَكَذَلِكَ إِذَا وَكَّلَ إِنْسَانًا يُوَزِّعُ عَنْهُ يَسْقُطُ سَهْمُ الْعَامِلِ فَتَصِيرُ الزَّكَاةُ لِسَبْعَةِ أَصْنَافٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":606},{"type":"p","text":"   وَالْمُؤَلَّفَةُ قُلُوبُهُمْ هُمْ مَنْ كَانَ ضَعِيفَ النِّيَّةِ فِي أَهْلِ الإِسْلامِ أَيْ بَيْنَ الْمُسْلِمِينَ بِأَنْ يَكُونَ دَخَلَ فِي الإِسْلامِ وَفِي نَفْسِهِ وَحْشَةٌ مِنَ الْمُسْلِمِينَ أَيْ لَمْ يَتَآلَفْ مَعَ الْمُسْلِمِينَ فَيُعْطَى حَتَّى تَقْوَى نِيَّتُهُ بِالإِسْلامِ مِنَ الزَّكَاةِ أَوْ يَكُونَ شَرِيفًا فِي قَوْمِهِ يُتَوَقَّعُ بِإِعْطَائِهِ إِسْلامُ نُظَرَائِهِ فَهَذَا أَيْضًا دَاخِلٌ فِي الْمُؤَلَّفَةِ قُلُوبُهُمْ حَتَّى إِذَا أُعْطِيَ هَذَا يَرْغَبُ أُولَئِكَ الَّذِينَ هُمْ أَمْثَالُهُ مِنَ الْكُفَّارِ أَنْ يَدْخُلُوا فِي الإِسْلامِ. وَكَذَلِكَ يُعَدُّ مِنَ الْمُؤَلَّفَةِ قُلُوبُهُمْ مَنْ يَكُفُّ عَنَّا شَرَّ مَنْ يَلِيهِ مِنْ كُفَّارٍ وَمَانِعِي الزَّكَاةِ فَيُعْطَى لِهَذِهِ الْمَصْلَحَةِ مِنَ الزَّكَاةِ .","style":"Normal","align":"justify","bold":false,"size":18.0,"index":607},{"type":"p","text":"   وَأَمَّا الرِّقَابُ فَهُمُ الْمُكَاتَبُونَ كِتَابَةً صَحِيحَةً وَهَؤُلاءِ هُمُ الَّذِينَ تَشَارَطُوا مَعَ أَسْيَادِهِمْ أَيِ الأُنَاسِ الَّذِينَ يَمْلِكُونَهُمْ عَلَى أَنْ يَدْفَعُوا كَذَا مِنَ الْمَالِ فَإِذَا دَفَعُوا ذَلِكَ الْمَبْلَغَ يَكُونُونَ أَحْرَارًا فَاللَّهُ تَعَالَى جَعَلَ لَهُمْ حَقًّا فِي الزَّكَاةِ إِذَا لَمْ يَكُنْ مَعَهُمْ مَا يَفِي بِالْمَالِ الَّذِي اشْتُرِطَ عَلَيْهِمْ لِتَحَرُّرِهِمْ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":608},{"type":"p","text":"   وَأَمَّا الْغَارِمُونَ فَهُمُ الْمَدِينُونَ الْعَاجِزُونَ عَنْ رَدِّ الدَّيْنِ وَذَلِكَ كَالَّذِي اسْتَدَانَ لِنَفْسِهِ وَصَرَفَهُ فِي غَيْرِ مَعْصِيَةٍ أَوْ صَرَفَهُ فِي مَعْصِيَةٍ وَتَابَ وَظَهَرَتْ عَلامَاتُ صِدْقِهِ فَيُعْطَى مِنَ الزَّكَاةِ قَدْرُ دَيْنِهِ إِنْ كَانَ الدَّيْنُ حَالًّا وَعَجَزَ عَنْ وَفَائِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":609},{"type":"p","text":"   وَأَمَّا وَفِي سَبِيلِ اللَّهِ فَالْمُرَادُ بِهِ الْغُزَاةُ الْمُتَطَوِّعُونَ بِالْجِهَادِ بِأَنْ لَمْ يَكُنْ لَهُمْ سَهْمٌ فِي دِيوَانِ الْمُرْتَزِقَةِ مِنَ الْفَىْءِ فَيُعْطَوْنَ مَا يَحْتَاجُونَهُ لِلْجِهَادِ وَلَوْ كَانُوا أَغْنِيَاءَ إِعَانَةً لَهُمْ عَلَى الْغَزْوِ. وَالْمُرْتَزِقَةُ الأَجْنَادُ الْمَرْصُودُونَ فِي الدِّيوَانِ لِلْجِهَادِ وَسُمُّوا بِذَلِكَ لِأَنَّهُمْ أَرْصَدُوا نُفُوسَهُمْ لِلذَّبِّ عَنِ الدِّينِ وَطَلَبِ الرِّزْقِ مِنْ مَالِهِ تَعَالَى.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":610},{"type":"p","text":"   وَأَمَّا الْمُتَطَوِّعُونَ بِالْغَزْوِ إِذَا نَشِطُوا فَهُمُ الْمُرَادُونَ بِسَبِيلِ اللَّهِ فَيُعْطَوْنَ مِنَ الزَّكَاةِ مِنْ سَهْمِ فِي سَبِيلِ اللَّهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":611},{"type":"p","text":"   وَأَمَّا ابْنُ السَّبِيلِ فَالْمُرَادُ بِهِ الْمُسَافِرُ أَوْ مُرِيدُ السَّفَرِ الْمُحْتَاجُ بِأَنْ لَمْ يَكُنْ مَعَهُ مَا يَكْفِيهِ لِسَفَرِهِ فَيُعْطَى مِنَ الزَّكَاةِ بِشَرْطِ أَنْ يَكُونَ سَفَرُهُ غَيْرَ مُحَرَّمٍ فَمَنْ سَافَرَ لِغَيْرِ مَعْصِيَةٍ وَلَوْ لِنُـزْهَةٍ أَوْ كَانَ غَرِيبًا مُجْتَازًا بِمَحَلِّ الزَّكَاةِ وَكَانَ مُحْتَاجًا أُعْطِيَ مَا يَكْفِيهِ فِي سَفَرِهِ ذَهَابًا وَإِيَّابًا إِنْ كَانَ يَقْصِدُ الرُّجُوعَ إِلَى الْمَكَانِ الَّذِي يُسَافِرُ مِنْهُ وَلَوْ كَانَ لَهُ مَالٌ بِغَيْرِ مَحَلِّ الزَّكَاةِ أَوْ وَجَدَ مَنْ يُقْرِضُهُ فَإِنَّهُ يُعْطَى. أَمَّا الْمُسَافِرُ سَفَرًا مُحَرَّمًا فَلا يُعْطَى لِأَنَّ فِيهِ إِعَانَةً عَلَى مَعْصِيَةٍ فَإِنْ تَابَ مِنَ الْمَعْصِيَةِ أُعْطِيَ مَا يَحْتَاجُهُ لِبَقِيَّةِ سَفَرِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":612},{"type":"p","text":"   وَيُشْتَرَطُ لِصِحَّةِ الدَّفْعِ أَنْ يَكُونَ الآخِذُ غَيْرَ هَاشِمِيٍّ وَلا مُطَّلِبِيٍّ وَلا مَوْلًى لَهُمْ فَالْهَاشِمِيُّ وَالْمُطَّلِبِيُّ وَمَوَالِيهِمْ لا يَجُوزُ دَفْعُ الزَّكَاةِ إِلَيْهِمْ [قَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «إِنَّمَا بَنُو هَاشِمٍ وَبَنُو الْمُطَّلِبِ شَىْءٌ وَاحِدٌ» رَوَاهُ الْبُخَارِيُّ]، وَالْهَاشِمِيُّ هُوَ مَنْ كَانَ مُؤْمِنًا مِنْ ذُرِّيَّةِ هَاشِمِ بنِ عَبْدِ مَنَافٍ وَالْمُطَّلِبِيُّ هُوَ مَنْ كَانَ مُؤْمِنًا مِنْ ذُرِّيَّةِ الْمُطَّلِبِ، وَهَاشِمٌ وَمُطَّلِبٌ أَخَوَانِ، فَمَنْ كَانَ مِنَ الْمُؤْمِنِينَ مِنْ ذُرِّيَّتِهِمَا فَلَيْسَ لَهُ حَقٌّ فِي الزَّكَاةِ إِنَّمَا حَقُّهُ فِي خُمُسِ الْخُمُسِ مِنَ الْغَنِيمَةِ وَالْفَىْءِ، وَالْفَىْءُ هُوَ مَا هَرَبَ عَنْهُ الْكُفَّارُ مِنْ مَالٍ خَوْفًا مِنَ الْمُسْلِمِينَ مِنْ غَيْرِ قِتَالِهِمْ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":613},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلا يَجُوزُ وَلا يُجْزِئُ صَرْفُهَا لِغَيْرِهِمْ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":614},{"type":"p","text":"   الشَّرْحُ لا يَجُوزُ صَرْفُ الزَّكَاةِ إِلَّا لِمَنْ عُلِمَ أَنَّهُ مِنَ الْمُسْتَحِقِّينَ مِنَ الأَصْنَافِ الثَّمَانِيَةِ. وَقَوْلُهُ «وَلا يَجُوزُ وَلا يُجْزِئُ صَرْفُهَا لِغَيْرِهِمْ» أَفَادَ بِهِ أَنَّهُ لا يَجُوزُ أَيْ يَحْرُمُ وَلا يَصِحُّ دَفْعُ الزَّكَاةِ إِلَى غَيْرِ هَؤُلاءِ الأَصْنَافِ الثَّمَانِيَةِ الْمَذْكُورِينَ فِي ءَايَةِ بَرَاءَةَ فَإِنْ وُجِدُوا كُلُّهُمْ وَكَانَ الإِمَامُ هُوَ الْقَاسِمَ لِلزَّكَاةِ وَجَبَ تَعْمِيمُهُمْ عِنْدَ الإِمَامِ الشَّافِعِيِّ وَإِنْ لَمْ يَكُنِ الإِمَامُ هُوَ الْقَاسِمَ فَمَنْ عَدَا الْعَامِلَ يَجِبُ تَعْمِيمُهُمْ فِي الْمَذْهَبِ إِنْ كَانُوا مَحْصُورِينَ فِي الْبَلَدِ وَكَانَ الْمَالُ يَكْفِي حَاجَاتِهِمُ النَّاجِزَةَ، وَإِنْ لَمْ يُوجَدْ فِي بَلَدِ الزَّكَاةِ إِلَّا بَعْضُهُمْ دُفِعَ لِمَنْ وُجِدَ مِنْهُمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":615},{"type":"p","text":"   وَأَقَلُّ الْعَدَدِ الَّذِي يُدْفَعُ إِلَيْهِ عِنْدَ الشَّافِعِيِّ ثَلاثَةُ أَشْخَاصٍ مِنْ كُلِّ صِنْفٍ، وَاخْتَارَ جَمْعٌ مِنْ أَتْبَاعِ الشَّافِعِيِّ جَوَازَ دَفْعِ زَكَاةِ وَاحِدٍ لِمُسْتَحِقٍّ وَاحِدٍ كَمَا تَقَدَّمَ وَهُوَ قَوْلُ الأَئِمَّةِ الثَّلاثَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":616},{"type":"p","text":"   وَمِمَّا تَقَدَّمَ يُعْلَمُ أَنَّهُ لا يَجُوزُ دَفْعُ الزَّكَاةِ لِبِنَاءِ الْمَسَاجِدِ وَالْمُسْتَشْفَيَاتِ وَالْمَدَارِسِ فَمَنْ دَفَعَ مِنْ زَكَاتِهِ لِبِنَاءِ مَدْرَسَةٍ أَوْ مُسْتَشْفًى أَوْ لِبِنَاءِ مَسْجِدٍ فَلْيَعْلَمْ أَنَّ زَكَاتَهُ مَا صَحَّتْ فَيَجِبُ عَلَيْهِ إِعَادَةُ الدَّفْعِ لِلْمُسْتَحِقِّينَ. وَالدَّلِيلُ عَلَى أَنَّهُ لا يَجُوزُ دَفْعُ الزَّكَاةِ لِكُلِّ مَا هُوَ بِرٌّ وَخَيْرٌ مِمَّا عَدَا الأَصْنَافَ الثَّمَانِيَةَ وَأَنَّ الْمُرَادَ بِقَوْلِهِ تَعَالَى ﴿وَفِي سَبِيلِ اللَّهِ﴾ لَيْسَ كُلَّ أَنْوَاعِ الْبِرِّ وَالإِحْسَانِ مِنْ بِنَاءِ مَسْجِدٍ وَمَدْرَسَةٍ وَمَارَسْتَان وَنَحْوِ ذَلِكَ هُوَ قَوْلُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَقَدْ ذَكَرَ الزَّكَاةَ «إِنَّهَا لا تَحِلُّ لِغَنِيٍّ وَلا لِذِي مِرَّةٍ سَـوِيٍّ» وَقَوْلُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِرَجُلَيْنِ جَاءَا يَسْأَلانِهِ الزَّكَاةَ وَكَانَا قَوِيَيْنِ «إِنْ شِئْتُمَا أَعْطَيْتُكُمَا وَلَيْسَ فِيهَا حَقٌّ لِغَنِيٍّ وَلا لِقَوِيٍّ مُكْتَسِبٍ» رَوَاهُمَا أَبُو دَاوُدَ وَالْبَيْهَقِيُّ [الرَّسُولُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَسَّنَ بِهِمَا الظَّنَّ أَنَّهُمَا لا يَجِدَانِ عَمَلًا يَكْتَسِبَانِ مِنْهُ كِفَايَتَهُمَا مَعَ كَوْنِهِمَا قَوِيَّيْنِ]. وَلَمْ يَقُلْ إِنَّ كَلِمَةَ ﴿وَفِي سَبِيلِ اللَّهِ﴾ تَعُمُّ كُلَّ مَشْرُوعٍ خَيْرِيٍّ أَحَدٌ مِنَ الأَئِمَّةِ الْمُجْتَهِدِينَ إِنَّمَا ذَلِكَ ذَكَرَهُ بَعْضُ الْحَنَفِيَّةِ مِنَ الْمُتَأَخِّرِينَ مِمَّنْ لَيْسَ مِنْ أَصْحَابِ أَبِي حَنِيفَةَ الَّذِينَ هُمْ مُجْتَهِدُونَ بَلْ قَوْلُهُ يُخَالِفُ أَقْوَالَ الْمُجْتَهِدِينَ وَأَصْحَابِ الْوُجُوهِ مِنْ أَهْلِ الْمَذْهَبِ فَحَرَامٌ أَنْ يُؤْخَذَ بِقَوْلِ هَذَا الْعَالِمِ. وَلْيُحْذَرْ مِنْ هَؤُلاءِ الَّذِينَ يَجْمَعُونَ أَمْوَالَ الزَّكَوَاتِ بِاسْمِ بِنَاءِ جَامِعٍ أَوْ بِنَاءِ مَدْرَسَةٍ فَإِنَّ هَذَا حَرَامٌ عَلَيْهِمْ وَحَرَامٌ عَلَى الَّذِينَ يُعْطُونَهُمْ أَنْ يَعْطُوهُمْ لِأَنَّهُ لَوْ كَانَ كُلُّ عَمَلٍ خَيْرِيٍّ يَدْخُلُ فِي قَوْلِهِ تَعَالَى ﴿وَفِي سَبِيلِ اللَّهِ﴾ [سُورَةَ التَّوْبَة/60] مَا قَالَ الرَّسُولُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لَيْسَ فِيهَا حَقٌّ لِغَنِيٍّ وَلا لِقَوِيٍّ مُكْتَسِبٍ» وَقَدْ رَوَى الْبُخَارِيُّ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «إِنَّ رِجَالًا يَتَخَوَّضُونَ فِي مَالِ اللَّهِ بِغَيْرِ حَقٍّ فَلَهُمُ النَّارُ يَوْمَ الْقِيَامَةِ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":617},{"type":"blank","text":""}]},{"id":"fasting","title":"كِتَابُ الصِّيَامِ","description":"النص الكامل المتعلق بأحكام الصيام ومسائله.","icon":"fa-moon","start":619,"end":657,"paragraphCount":36,"wordCount":1843,"readMinutes":11,"blocks":[{"type":"heading","text":"كِتَابُ الصِّيَامِ","style":"Normal","align":"center","bold":false,"size":18.0,"index":619},{"type":"blank","text":""},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ صَوْمُ شَهْرِ رَمَضَانَ عَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ وَلا يَصِحُّ مِنْ حَائِضٍ وَنُفَسَاءَ وَيَجِبُ عَلَيْهِمَا الْقَضَاءُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":621},{"type":"p","text":"   الشَّرْحُ صَوْمُ رَمَضَانَ وَاجِبٌ لِأَنَّهُ أَحَدُ أَعْظَمِ أُمُورِ الإِسْلامِ الْخَمْسَةِ وَهُوَ أَفْضَلُ الشُّهُورِ. وَإِنَّمَا يَجِبُ الصَّوْمُ بِاسْتِكْمَالِ شَعْبَانَ ثَلاثِينَ يَوْمًا أَيْ مِنِ ابْتِدَاءِ رُؤْيَةِ هِلالِ شَعْبَانَ [وَالْمُرَادُ الرُّؤْيَةُ بِالْعَيْنِ الْمُجَرَّدَةِ] أَوْ بِرُؤْيَةِ عَدْلِ شَهَادَةٍ أَيْ ظَاهِرِ الْعَدَالَةِ [فَلا تُشْتَرَطُ الْعَدَالَةُ الْبَاطِنَةُ بَلْ يُكْتَفَى بِالْعَدَالَةِ الظَّاهِرَةِ وَهُوَ الْمُرَادُ بِالْمَسْتُورِ] هِلالَ رَمَضَانَ بَعْدَ غُرُوبِ شَمْسِ التَّاسِعِ وَالْعِشْرِينَ مِنْ شَعْبَانَ وَالْعَدْلُ الْمَقْصُودُ هُنَا هُوَ الْمُسْلِمُ الذَّكَرُ الْحُرُّ الَّذِي سَلِمَ مِنَ الْكَبَائِرِ وَمِنْ غَلَبَةِ الصَّغَائِرِ عَلَى طَاعَاتِهِ مَعَ كَوْنِهِ مُلْتَزِمًا بِمُرُوءَةِ أَمْثَالِهِ [أَيْ مُحَافِظًا عَلَى أَخْلاقِ أَهْلِ الْفَضْلِ مِنْ أَمْثَالِهِ] أَيْ فَلا يَشْتَغِلُ بِتَطْيِيرِ الْحَمَامِ وَلا الإِكْثَارِ مِنَ الرِّوَايَاتِ الْمُضْحِكَةِ الَّتِي مَا فِيهَا ثَمَرَةٌ وَلَوْ كَانَتْ مُبَاحَةً وَلا الإِكْثَارِ مِنْ لَعِبِ الشِّطْرَنْجِ وَنَحْوِ ذَلِكَ، فَإِذَا شَهِدَ عَدْلٌ عَلَى هَذِهِ الصِّفَةِ بِأَنَّهُ شَاهَدَ هِلالَ رَمَضَانَ بِقَوْلِهِ أَشْهَدُ أَنِّي رَأَيْتُ هِلالَ رَمَضَانَ اللَّيْلَةَ ثَبَتَ الصِّيَامُ فِي حَقِّ نَفْسِهِ وَفِي حَقِّ غَيْرِهِ. أَمَّا إِذَا قَالَ أَهْلُ الْفَلَكِ غَدًا أَوَّلُ رَمَضَانَ اعْتِمَادًا عَلَى الْحِسَابِ فَلا يَجُوزُ الصَّوْمُ اعْتِمَادًا عَلَى قَوْلِهِمْ. وَهَذَا الْحُكْمُ فِي الْمَذَاهِبِ الأَرْبَعَةِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":622},{"type":"p","text":"   وَيُشْتَرَطُ فِيمَنْ يَجِبُ عَلَيْهِ الصَّوْمُ الإِسْلامُ وَالتَّكْلِيفُ أَيِ الْبُلُوغُ وَالْعَقْلُ فَلا يُطَالَبُ الْكَافِرُ الأَصْلِيُّ بِأَدَائِهِ فِي الدُّنْيَا وَإِنْ كَانَ يَجِبُ عَلَيْهِ وُجُوبَ عِقَابٍ عَلَى تَرْكِهِ فِي الآخِرَةِ [وَيُعَاقَبُ الْكَافِرُ الأَصْلِيُّ عَلَى تَرْكِ الصِّيَامِ فِي الآخِرَةِ كَمَا يُعَاقَبُ عَلَى تَرْكِ الصَّلاةِ. وَالرَّاجِحُ أَنَّ الْكُفَّارَ مُخَاطَبُونَ بِفُرُوعِ الشَّرِيعَةِ]. وَلا يَجِبُ عَلَى الصَّبِيِّ لَكِنْ يَجِبُ عَلَى الأَبَوَيْنِ أَنْ يَأْمُرَاهُ بِالصَّوْمِ بَعْدَ سَبْعِ سِنِينَ إِنْ أَطَاقَ جِسْمُهُ وَتَحَمَّلَ، وَلا يَجِبُ أَيْضًا عَلَى الْمَجْنُونِ، وَأَمَّا الْمُرْتَدُّ فَيَجِبُ عَلَيْهِ أَنْ يَقْضِيَ مَا فَاتَهُ مِنَ الصِّيَامِ فِي أَيَّامِ رِدَّتِهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":623},{"type":"p","text":"   وَلا يَجِبُ الصَّوْمُ أَيْضًا عَلَى مَنْ لا يُطِيقُهُ حِسًّا لِكِبَرٍ أَوْ مَرَضٍ لا يُرْجَى بُرْؤُهُ، وَكَذَا مَنْ لا يُطِيقُهُ شَرْعًا كَالْحَائِضِ وَالنُّفَسَاءِ فَإِنَّهُمَا لا يَجِبُ عَلَيْهِمَا وُجُوبَ أَدَاءٍ بَلْ يَجِبُ عَلَيْهِمَا وُجُوبَ قَضَاءٍ، وَكَذَلِكَ الْمَرِيضُ الَّذِي يُرْجَى بُرْؤُهُ. وَيَحْرُمُ الإِمْسَاكُ عَلَى الْحَائِضِ وَالنُّفَسَاءِ بِنِيَّةِ الصِّيَامِ وَلا يَجِبُ عَلَيْهِمَا تَعَاطِي مُفَطِّرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":624},{"type":"p","text":"   وَيَجِبُ عَلَى الْحَائِضِ وَالنُّفَسَاءِ وَعَلَى كُلِّ مَنْ أَفْطَرَ لِعُذْرٍ أَوْ غَيْرِهِ الْقَضَاءُ إِلَّا مَنْ أَفْطَرَ لِكِبَرٍ أَوْ مَرَضٍ لا يُرْجَى بُرْؤُهُ فَإِنَّهُ لَيْسَ عَلَيْهِمَا إِلَّا الْفِدْيَةُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":625},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجُوزُ الْفِطْرُ لِمُسَافِرٍ سَفَرَ قَصْرٍ وَإِنْ لَمْ يَشُقَّ عَلَيْهِ الصَّوْمُ. وَلِمَرِيضٍ وَحَامِلٍ وَمُرْضِعٍ يَشُقُّ عَلَيْهِمْ مَشَقَّةً لا تُحْتَمَلُ الْفِطْرُ وَيَجِبُ عَلَيْهِمُ الْقَضَاءُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":626},{"type":"p","text":"   الشَّرْحُ يَجُوزُ الْفِطْرُ فِي صَوْمِ الْفَرْضِ بِأَسْبَابٍ مِنْهَا السَّفَرُ إِلَى مَسَافَةِ قَصْرٍ أَيْ سَفَرٌ يَجُوزُ فِيهِ قَصْرُ الصَّلاةِ الرُّبَاعِيَّةِ إِلَى رَكْعَتَيْنِ وَهُوَ مَسَافَةُ مَرْحَلَتَيْنِ فَإِذَا كَانَ السَّفَرُ إِلَى مَرْحَلَتَيْنِ أَيْ مَسِيرِ يَوْمَيْنِ بِسَيْرِ الأَثْقَالِ وَدَبِيبِ الأَقْدَامِ يَجُوزُ لِلْمُسَافِرِ الْفِطْرُ وَلَوْ لَمْ يَشُقَّ عَلَيْهِ الصَّوْمُ، لَكِنْ إِنْ لَمْ يَشُقَّ عَلَيْهِ الصَّوْمُ فَالْمُثَابَرَةُ عَلَى الصِّيَامِ أَفْضَلُ مِنْ أَنْ يُفْطِرَ. وَشَرْطُ السَّفَرِ الَّذِي يُبِيحُ الإِفْطَارَ أَنْ يَكُونَ حَدَثَ قَبْلَ الْفَجْرِ فَمَنْ صَارَ فِي حُكْمِ الْمُسَافِرِ بَعْدَ الْفَجْرِ لَمْ يَجُزْ لَهُ الإِفْطَارُ، وَمِنْهَا الْمَرَضُ إِنْ كَانَ فِيهِ مَشَقَّةٌ مَعَ الصَّوْمِ تُبِيحُ التَّيَمُّمَ أَيْ كَانَ فِي الْمُثَابَرَةِ عَلَى الصَّوْمِ مَعَ هَذَا الْمَرَضِ مَشَقَّةً كَمَشَقَّةِ اسْتِعْمَالِ الْمَاءِ لِلطُّهْرِ فَعِنْدَئِذٍ يَجُوزُ لَهُ الإِفْطَارُ كَمَا أَنَّ الَّذِي يَشُقُّ عَلَيْهِ اسْتِعْمَالُ الْمَاءِ لِلْوُضُوءِ أَوْ لِلِاغْتِسَالِ يَجُوزُ لَهُ التَّيَمُّمُ مِنْ أَجْلِ الْمَشَقَّةِ، وَمِنْهَا الْحَمْلُ وَالإِرْضَاعُ إِذَا خَافَتِ الْحَامِلُ وَالْمُرْضِعُ عَلَى نَفْسَيْهِمَا أَوْ عَلَى وَلَدَيْهِمَا، وَيَجِبُ عَلَيْهِمَا وَلَوْ مَرِيضَتَيْنِ أَوْ مُسَافِرَتَيْنِ إِذَا أَفْطَرَتَا خَوْفًا عَلَى الْوَلَدِ فَقَطْ أَنْ يُجْهَضَ أَوْ يَقِلَّ اللَّبَنُ فَيَتَضَرَّرَ مَعَ الْقَضَاءِ الْفِدْيَةُ لِكُلِّ يَوْمٍ مُدٌّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":627},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ التَّبْيِيتُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":628},{"type":"p","text":"   الشَّرْحُ يَجِبُ تَبْيِيتُ النِّيَّةِ أَيْ إِيقَاعُ النِّيَّةِ لَيْلًا فِيمَا بَيْنَ غُرُوبِ الشَّمْسِ وَطُلُوعِ الْفَجْرِ لِكُلِّ يَوْمٍ مِنْ رَمَضَانَ بِالْقَلْبِ وَلَوْ قَبْلَ أَنْ يُفْطِرَ بَعْدَ الْغُرُوبِ فَإِنْ نَسِيَ تَبْيِيتَ النِّيَّةِ لَزِمَهُ الإِمْسَاكُ بَقِيَّةَ النَّهَارِ وَقَضَاءُ هَذَا الْيَوْمِ، أَمَّا صَوْمُ النَّفْلِ فَتُجْزِئُ فِيهِ النِّيَّةُ قَبْلَ زَوَالِ الشَّمْسِ إِنْ لَمْ يَتَعَاطَ مُفَطِّرًا قَبْلَهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":629},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّعْيِينُ فِي النِّيَّةِ لِكُلِّ يَوْمٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":630},{"type":"p","text":"   الشَّرْحُ مِنْ أَحْكَامِ الصِّيَامِ الْمُتَعَلِّقَةِ بِالنِّيَّةِ أَنَّهُ يَجِبُ تَعْيِينُ الصَّوْمِ الْمَنْوِيِّ بِالنِّيَّةِ كَتَعْيِينِ أَنَّهُ مِنْ رَمَضَانَ أَوْ أَنَّهُ عَنْ نَذْرٍ أَوْ أَنَّهُ عَنْ كَفَّارَةٍ وَلَوْ لَمْ يُبَيِّنْ سَبَبَهَا. ثُمَّ إِنَّهُ يَجِبُ أَنْ يَنْوِيَ لِكُلِّ يَوْمٍ فَلا يَكْفِي أَنْ يَنْوِيَ أَوَّلَ الشَّهْرِ عَنِ الشَّهْرِ كُلِّهِ وَذَلِكَ لِأَنَّ كُلَّ يَوْمٍ عِبَادَةٌ مُسْتَقِلَّةٌ لِتَخَلُّلِ الْيَوْمَيْنِ بِمَا يُنَاقِضُ الصَّوْمَ كَالصَّلاتَيْنِ يَتَخَلَّلُهُمَا السَّلامُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":631},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالإِمْسَاكُ عَنِ الْجِمَاعِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":632},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ شُرُوطِ صِحَّةِ الصَّوْمِ الإِمْسَاكَ عَنِ الْجِمَاعِ أَيْ أَنْ يَكُفَّ الصَّائِمُ نَفْسَهُ عَنِ الْجِمَاعِ فِي فَرْجٍ وَلَوْ لِبَهِيمَةٍ فَمَنْ فَعَلَ مَعَ الْعِلْمِ وَالتَّعَمُّدِ وَالِاخْتِيَارِ أَفْطَرَ، أَمَّا إِذَا كَانَ لَمْ يَعْلَمْ حُرْمَةَ الْجِمَاعِ فِي الصَّوْمِ لِكَوْنِهِ قَرِيبَ عَهْدٍ بِإِسْلامٍ مَثَلًا أَوْ كَوْنِهِ نَشَأَ بِبَادِيَةٍ بَعِيدَةٍ عَنْ أَهْلِ الْعِلْمِ أَوْ نَسِيَ أَنَّهُ صَائِمٌ أَوْ جَامَعَ مُكْرَهًا أَيْ مُهَدَّدًا بِالْقَتْلِ وَنَحْوِهِ فَإِنَّهُ لا يُفْطِرُ. وَسَوَاءٌ فِي هَذَا الْحُكْمِ الْوَاطِئُ وَالْمَوْطُوءَةُ فَإِنَّ صِيَامَ كُلٍّ مِنْهُمَا يَفْسُدُ وَإِنَّمَا يَخْتَلِفُ الْحُكْمُ فِي الْوَاطِئِ وَالْمَوْطُوءَةِ فِي كَفَّارَةِ الإِفْسَادِ بِالْجِمَاعِ فَالْكَفَّارَةُ عَلَى الْوَاطِئِ أَيِ الرَّجُلِ لَيْسَ عَلَى الْمَرْأَةِ الْمَوْطُوءَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":633},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالِاسْتِمْنَاءِ وَهُوَ اسْتِخْرَاجُ الْمَنِيِّ بِنَحْوِ الْيَدِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":634},{"type":"p","text":"   الشَّرْحُ أَنَّ الِاسْتِمْنَاءَ وَهُوَ إِخْرَاجُ الْمَنِيِّ بِغَيْرِ الْجِمَاعِ مُفَطِّرٌ سَوَاءٌ كَانَ بِيَدِ نَفْسِهِ أَوْ بِيَدِ زَوْجَتِهِ أَوْ بِسَبَبِ الْقُبْلَةِ أَوِ الْمُضَاجَعَةِ بِلا حَائِلٍ فَإِنَّهُ يُفْطِرُ بِهِ مَعَ الْعِلْمِ وَالتَّعَمُّدِ وَالِاخْتِيَارِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":635},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالِاسْتِقَاءَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":636},{"type":"p","text":"   الشَّرْحُ أَنَّ الِاسْتِقَاءَةَ مُفَطِّرَةٌ فَمَنْ قَاءَ بِطَلَبٍ مِنْهُ بِنَحْوِ إِدْخَالِ إِصْبَعِهِ أَوْ إِدْخَالِ نَحْوِ رِيشَةٍ فَإِنَّهُ يُفْطِرُ مَعَ الْعِلْمِ بِالتَّحْريِمِ وَذِكْرِ الصَّوْمِ وَعَدَمِ الإِكْرَاهِ سَوَاءٌ عَادَ مِنَ الْقَىْءِ إِلَى الْجَوْفِ شَىْءٌ أَمْ لا بِخِلافِ قَلْعِ النُّخَامَةِ مِنَ الدِّمَاغِ أَوْ مِنَ الْبَاطِنِ فَإِنَّهُ لا يُفَطِّرُ وَفِي ذَلِكَ فُسْحَةٌ لِلنَّاسِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":637},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَنِ الرِّدَّةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":638},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ شُرُوطِ الصِّيَامِ الإِمْسَاكَ أَيْ كَفَّ النَّفْسِ عَنِ الرِّدَّةِ أَيْ عَنْ قَطْعِ الإِسْلامِ وَالْعِيَاذُ بِاللَّهِ تَعَالَى مِنْهَا جَمِيعَ النَّهَارِ فَمَنِ ارْتَدَّ وَلَوْ لَحْظَةً مِنَ النَّهَارِ بَطَلَ صَوْمُهُ كَالصَّلاةِ سَوَاءٌ كَانَ كُفْرُهُ بِالْقَوْلِ أَوِ الْفِعْلِ أَوِ الِاعْتِقَادِ وَيَلْزَمُهُ الرُّجُوعُ فَوْرًا إِلَى الإِسْلامِ وَالإِمْسَاكُ عَنِ الْمُفَطِّرَاتِ بَاقِيَ النَّهَارِ وَقَضَاءُ هَذَا الْيَوْمِ فَوْرًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":639},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَنْ دُخُولِ عَيْنٍ جَوْفًا إِلَّا رِيقَهُ الْخَالِصَ الطَّاهِرَ مِنْ مَعْدِنِهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":640},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى الصَّائِمِ أَنْ يَكُفَّ عَنْ إِدْخَالِ عَيْنٍ إِلَى جَوْفِهِ مِنْ مَنْفَذٍ مَفْتُوحٍ وَلَوْ كَانَتْ تِلْكَ الْعَيْنُ قَلِيلَةً كَحَبَّةِ سِمْسِمٍ وَلَوْ كَانَتْ مِمَّا لا يُؤْكَلُ كَحَصَاةٍ، وَسَوَاءٌ فِي ذَلِكَ الْجَوْفُ الَّذِي يُحِيلُ الْغِذَاءَ وَغَيْرُهُ، فَمَنْ تَنَاوَلَ عَيْنًا فَدَخَلَتْ إِلَى جَوْفِهِ مِنْ مَنْفَذٍ مَفْتُوحٍ عَالِمًا بِأَنَّ ذَلِكَ حَرَامٌ مُتَعَمِّدًا لا نَاسِيًا وَمُخْتَارًا لا مُكْرَهًا بِالْقَتْلِ وَنَحْوِهِ أَفْطَرَ. وَحَدُّ الظَّاهِرِ عَلَى الرَّاجِحِ مَخْرَجُ الْحَاءِ فَمَا جَاوَزَ مِنَ الْفَمِ إِلَى مَا بَعْدَ مَخْرَجِ الْحَاءِ مُفَطِّرٌ وَكَذَلِكَ مَا جَاوَزَ الْخَيْشُومَ وَالْخَيْشُومُ مُنْتَهَى الأَنْفِ. وَلا يُفَطِّرُ مَا لَمْ يُجَاوِزِ الْخَيْشُومَ. وَلا يَضُرُّ دُخُولُ مَا سِوَى الْعَيْنِ كَرَائِحَةِ الْبَخُورِ وَلَوْ تَعَمَّدَهُ إِلَّا أَنَّ شُرْبَ السِيكَارَةِ وَابْتِلاعَ مَا يَنْحَلُّ مِنَ التُّنْبَاكِ يُفَطِّرُ لِأَنَّ السِّيكَارَةَ يَنْفَصِلُ مِنْهَا أَجْزَاءٌ لَطِيفَةٌ تَدْخُلُ الْجَوْفَ. وَالدَّوَاءُ الَّذِي يَسْتَعْمِلُهُ مَنْ أُصِيبَ بِالرَّبْوِ مُفَطِّرٌ لِأَنَّهُ وَإِنِ احْتَاجَ إِلَيْهِ يَنْفَصِلُ مِنْهُ عَيْنٌ تَصِلُ إِلَى الْجَوْفِ مَعَ سُهُولَةِ الِاحْتِرَازِ عَنْ ذَلِكَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":641},{"type":"p","text":"   وَلا يَضُرُّ أَيْضًا مَا تَتَشَرَّبُهُ الْمَسَامُّ مِنَ الدُّهْنِ وَالْكُحْلِ وَنَحْوِ ذَلِكَ. وَيُعْفَى عَنِ الرِّيقِ الْخَالِصِ الطَّاهِرِ مِنْ مَعْدِنِهِ أَيْ مَا لَمْ يَخْرُجْ عَنِ الْفَمِ بِأَنْ يَنْفَصِلَ عَنِ اللِّسَانِ وَلَوْ إِلَى ظَاهِرِ الشَّفَةِ. وَأَمَّا الرِّيقُ الْمُخْتَلِطُ بِغَيْرِهِ مِنَ الطَّاهِرَاتِ فَإِنَّهُ يُفَطِّرُ إِذَا وَصَلَ إِلَى الْجَوْفِ وَكَذَلِكَ الرِّيقُ النَّجِسُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":642},{"type":"p","text":"   وَأَمَّا مَنْ أَكَلَ أَوْ شَرِبَ وَهُوَ نَاسٍ وَلَوْ فِي صِيَامِ النَّفْلِ فَلا يَفْسُدُ صَوْمُهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":643},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ لا يُجَنَّ وَلَوْ لَحْظَةً وَأَنْ لا يُغْمَى عَلَيْهِ كُلَّ الْيَوْمِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":644},{"type":"p","text":"   الشَّرْحُ يُشْتَرَطُ لِصِحَّةِ الصَّوْمِ أَنْ لا يَطْرَأَ عَلَى الصَّائِمِ جُنُونٌ فِي جُزْءٍ مِنَ النَّهَارِ فَمَنْ جُنَّ فِي بَعْضِ النَّهَارِ وَلَوْ لَحْظَةً فَإِنَّهُ يُفْطِرُ وَلَوْ كَانَ سَبَبُ جُنُونِهِ أَنَّهُ شَرِبَ قَبْلَ الْفَجْرِ شَيْئًا مُجَنِّنًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":645},{"type":"p","text":"   وَمِنْ شُرُوطِهِ أَيْضًا أَنْ لا يَحْصُلَ لَهُ إِغْمَاءٌ يَسْتَغْرِقُ كُلَّ النَّهَارِ فَإِنْ لَمْ يَسْتَغْرِقْ كُلَّ النَّهَارِ فَلا يَضُرُّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":646},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلا يَصِحُّ صَوْمُ الْعِيدَيْنِ وَأَيَّامِ التَّشْرِيقِ وَكَذَا النِّصْفُ الأَخِيرُ مِنْ شَعْبَانَ وَيَوْمِ الشَّكِّ إِلَّا أَنْ يَصِلَهُ بِمَا قَبْلَهُ أَوْ لِقَضَاءٍ أَوْ نَذْرٍ أَوْ وِرْدٍ. ","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":647},{"type":"p","text":"   الشَّرْحُ لا يَصِحُّ وَلا يَجُوزُ صَوْمُ الْعِيدَيْنِ الْفِطْرِ وَالأَضْحَى وَلا صَوْمُ يَوْمٍ مِنْ أَيَّامِ التَّشْرِيقِ الثَّلاثَةِ وَلَوْ كَانَ ذَلِكَ الصَّوْمُ لِفِدْيَةِ التَّمَتُّعِ. وَكَذَلِكَ لا يَصِحُّ وَلا يَجُوزُ صَوْمُ النِّصْفِ الأَخِيرِ مِنْ شَعْبَانَ لِوُرُودِ النَّهْيِ عَنْ صَوْمِهِ فِي حَدِيثِ أَبِي دَاوُدَ مَرْفُوعًا «إِذَا انْتَصَفَ شَعْبَانُ فَلا تَصُومُوا». وَكَذَلِكَ لا يَصِحُّ وَلا يَجُوزُ صَوْمُ يَوْمِ الشَّكِّ وَلَوْ بِنِيَّةِ الِاحْتِيَاطِ وَذَلِكَ لِقَوْلِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا تَقَدَّمُوا رَمَضَانَ بِيَوْمٍ أَوْ يَوْمَيْنِ صُومُوا لِرُؤْيَتِهِ وَأَفْطِرُوا لِرُؤْيَتِهِ فَإِنْ غُمَّ عَلَيْكُمْ فَأَكْمِلُوا عِدَّةَ شَعْبَانَ ثَلاثِينَ» رَوَاهُ الْبُخَارِيُّ وَمُسْلِمٌ وَأَصْحَابُ السُّنَنِ وَغَيْرُهُمْ. وَرَوَى الْبَيْهَقِيُّ عَنْ عَمَّارِ ابْنِ يَاسِرٍ رَضِيَ اللَّهُ عَنْهُ أَنَّهُ قَالَ «مَنْ صَامَ يَوْمَ الشَّكِّ فَقَدْ عَصَى أَبَا الْقَاسِمِ» اهـ يَعْنِي رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. وَيَوْمُ الشَّكِّ هُوَ يَوْمُ الثَّلاثِينَ مِنْ شَعْبَانَ الَّذِي يَتَحَدَّثُ النَّاسُ الَّذِينَ لا يَثْبُتُ الصِّيَامُ بِشَهَادَتِهِمْ كَالصِّبْيَانِ وَنَحْوِهِمْ كَالْفَسَقَةِ وَالْعَبِيدِ وَالنِّسَاءِ أَنَّهُمْ رَأَوْا هِلالَ رَمَضَانَ فِي لَيْلَتِهِ فَيَوْمُ الشَّكِّ هُوَ يَوْمُ ثَلاثِيْ شَعْبَانَ هَذَا فَلا يَجُوزُ أَنْ يُصَامَ عَلَى أَنَّهُ مِنْ رَمَضَانَ. وَإِنَّمَا يَحْرُمُ صَوْمُ يَوْمِ الشَّكِّ وَصَوْمُ مَا بَعْدَ نِصْفِ شَعْبَانَ لِمَنْ لَمْ يُوَافِقْ عَادَةً لَهُ. وَلا يَحْرُمُ لِمَنْ وَصَلَ مَا بَعْدَ النِّصْفِ بِالنِّصْفِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":648},{"type":"benefit","text":"   فَائِدَةٌ. يُكْرَهُ إِفْرَادُ صَوْمِ يَوْمِ الْجُمُعَةِ فِي النَّفْلِ بِلا سَبَبٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":649},{"type":"p","text":"   تَنْبِيهٌ. مِمَّا يَثْبُتُ بِهِ الصِّيَامُ حُصُولُ مَا جَرَتْ بِهِ الْعَادَةُ فِي بِلادِ الْمُسْلِمِينَ أَنَّهُ عَلامَةٌ عَلَى ثُبُوتِ رَمَضَانَ كَأَنْ جَرَتْ عَادَتُهُمُ الْمُطَّرِدَةُ بِضَرْبِ الْمِدْفَعِ بَعْدَ ثُبُوتِهِ عَلَى الْوَجْهِ الشَّرْعِيِّ فَإِنَّ هَذَا يَثْبُتُ بِهِ الصِّيَامُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":650},{"type":"p","text":"   تَنْبِيهٌ ثَانٍ. مَنْ أَخْبَرَهُ عَبْدٌ أَوِ امْرَأَةٌ بِرُؤْيَةِ الْهِلالِ صَامَ إِنْ وَثِقَ بِهِ وَصَدَّقَهُ وَكَذَا لَوْ أَخْبَرَهُ صَبِيٌّ أَوْ فَاسِقٌ فَصَدَّقَهُ وَإِنْ كَانَ لا يَثْبُتُ عِنْدَ الْقَاضِي بِقَوْلِهِ وَإِنَّمَا يَثْبُتُ بِالْبَالِغِ الْعَدْلِ الْحُرِّ بِقَوْلِهِ «أَشْهَدُ أَنِّي رَأَيْتُ اللَّيْلَةَ هِلالَ رَمَضَانَ»، وَالْعَدْلُ مَنْ يُؤَدِّي الْفَرَائِضَ وَيَجْتَنِبُ الْمُحَرَّمَاتِ الْكَبَائِرَ وَلا يُكْثِرُ مِنَ الصَّغَائِرِ حَتَّى تَغْلِبَ حَسَنَاتِهِ وَيُحَافِظُ عَلَى مُرُوءَةِ أَمْثَالِهِ كَمَا تَقَدَّمَ، فَإِذَا شَهِدَ الْعَدْلُ بِرُؤْيَةِ الْهِلالِ عِنْدَ الْقَاضِي فَأَثْبَتَ الْقَاضِي هَذِهِ الشَّهَادَةَ وَجَبَ الصِّيَامُ عَلَى أَهْلِ بَلَدِ الإِثْبَاتِ وَسَائِرِ أَهْلِ الْبِلادِ الْقَرِيبَةِ مِنْ بَلَدِ الرُّؤْيَةِ بِاتِّحَادِ الْمَطَالِعِ لا مَنْ خَالَفَ مَطْلَعُهُمْ مَطْلَعَهَا بِأَنْ لَمْ يَتَّحِدِ الْبَلَدَانِ فِي الشُّرُوقِ وَالْغُرُوبِ كَدِمَشْقَ وَبَغْدَادَ فَلا يَعُمُّهَا الْحُكْمُ بَلْ لا يَجُوزُ لِأَهْلِهَا أَنْ يَصُومُوا. أَمَّا عِنْدَ الإِمَامِ أَبِي حَنِيفَةَ رَضِيَ اللَّهُ عَنْهُ فَيَجِبُ الصِّيَامُ عَلَى أَهْلِ كُلِّ بَلَدٍ عَلِمُوا ثُبُوتَ الصِّيَامِ فِي بَلَدٍ مَا مَهْمَا بَعُدَتْ تِلْكَ الْبِلادُ عَنِ الْبَلَدِ الَّذِي ثَبَتَتْ فِيهِ الرُّؤْيَةُ فَلا يُشْتَرَطُ عِنْدَهُ الْقُرْبُ بِتَوَافُقِ الْبَلَدَيْنِ فِي الشُّرُوقِ وَالْغُرُوبِ فَيَجِبُ عِنْدَهُ الصِّيَامُ عَلَى أَهْلِ الْمَغْرِبِ الأَقْصَى إِذَا عَلِمُوا بِثُبُوتِ الصِّيَامِ فِي الْمَشْرِقِ وَكَذَلِكَ الْعَكْسُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":651},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَنْ أَفْسَدَ صَوْمَ يَوْمٍ مِنْ رَمَضَانَ وَلا رُخْصَةَ لَهُ فِي فِطْرِهِ بِجِمَاعٍ فَعَلَيْهِ الإِثْمُ وَالْقَضَاءُ فَوْرًا وَكَفَّارَةُ ظِهَارٍ وَهِيَ عِتْقُ رَقَبَةٍ فَإِنْ لَمْ يَسْتَطِعْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ فَإِنْ لَمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِينًا أَيْ تَمْلِيكُ كُلِّ وَاحِدٍ مِنْهُمْ مُدًّا مِنْ غَالِبِ قُوتِ الْبَلَدِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":652},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى مَنْ أَفْسَدَ بِالْجِمَاعِ وَحْدَهُ صَوْمَ يَوْمٍ مِنْ رَمَضَانَ يَقِينًا وَلَوْ حُكْمًا كَأَنْ طَلَعَ الْفَجْرُ وَهُوَ مُجَامِعٌ فَاسْتَدَامَ وَلا رُخْصَةَ لَهُ فِي فِطْرِهِ الْقَضَاءُ مَعَ الإِثْمِ وَالْكَفَّارَةُ الْفَوْرِيَّةُ وَهِيَ كَكَفَّارَةِ الظِّهَارِ فِي صِفَتِهَا أَيْ عِتْقُ رَقَبَةٍ فَإِنْ لَمْ يَسْتَطِعْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ فَإِنْ لَمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِينًا أَيْ تَمْلِيكُ كُلِّ وَاحِدٍ مِنْهُمْ مُدًّا مِنْ غَالِبِ قُوتِ الْبَلَدِ. وَالْمُدُّ هُوَ مِلْءُ الْكَّفَيْنِ الْمُعْتَدِلَتَيْنِ كَمَا تَقَدَّمَ. وَتَتَكَرَّرُ هَذِهِ الْكَفَّارَةُ بِتَكَرُّرِ الأَيَّامِ وَلا تَجِبُ عَلَى الْمَوْطُوءَةِ كَمَا تَقَدَّمَ. وَلا كَفَّارَةَ عَلَى الْوَاطِئِ إِنْ كَانَ نَاسِيًا لِلصَّوْمِ أَوْ جَاهِلًا مَعْذُورًا كَأَنْ يَكُونَ قَرِيبَ عَهْدٍ بِالإِسْلامِ أَوْ نَشَأَ بِبَادِيَةٍ بَعِيدَةٍ مِنَ الْعُلَمَاءِ، وَكَذَلِكَ إِنْ جَامَعَ مُكْرَهًا فَلا كَفَّارَةَ عَلَيْهِ كَمَا أَنَّهُ لا يَفْسُدُ صَوْمُهُ وَقَدْ تَقَدَّمَ كُلُّ ذَلِكَ. وَمَنْ أَفْسَدَ صَوْمَ يَوْمٍ فِي غَيْرِ رَمَضَانَ وَلَوْ كَانَ صَوْمًا وَاجِبًا بِنَذْرٍ أَوْ نَحْوِهِ فَلا كَفَّارَةَ عَلَيْهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":653},{"type":"p","text":"   يُعْلَمُ مِنْ ذَلِكَ أَنَّهُ لا تَجِبُ الْكَفَّارَةُ عَلَى مَنْ أَفْسَدَ صَوْمَهُ بِالتَّعَدِّي بِغَيْرِ الْجِمَاعِ، وَأَنَّهُ لا كَفَّارَةَ وَلا إِثْمَ عَلَى مَنْ جَامَعَ فِي نَهَارِ رَمَضَانَ بِنِيَّةِ التَّرَخُّصِ بِسَفَرٍ أَوْ مَرَضٍ بِأَنْ كَانَ مُسَافِرًا سَفَرًا يُبِيحُ الْفِطْرَ أَوْ مَرِيضًا يَجُوزُ لَهُ الإِفْطَارُ فَأَرَادَ أَنْ يَتَرَخَّصَ بِالإِفْطَارِ بِالْجِمَاعِ أَمَّا إِذَا جَامَعَ الْمَرِيضُ أَوِ الْمُسَافِرُ فِي نَهَارِ رَمَضَانَ بِغَيْرِ نِيَّةِ التَّرَخُّصِ فَعَلَيْهِمَا الإِثْمُ لَكِنْ بِلا كَفَّارَةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":654},{"type":"p","text":"   بَيَانٌ. التَّرَخُّصُ مَعْنَاهُ الْعَمَلُ بِالرُّخْصَةِ الشَّرْعِيَّةِ وَهِيَ هُنَا أَنْ يَأْخُذَ الْمَرِيضُ وَالْمُسَافِرُ بِالرُّخْصَةِ الشَّرْعِيَّةِ لِيُفْطِرَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":655},{"type":"blank","text":""}]},{"id":"hajj","title":"كِتَابُ الْحَجِّ","description":"أحكام الحج والعمرة وما يتصل بالمناسك والزيارة.","icon":"fa-kaaba","start":657,"end":762,"paragraphCount":101,"wordCount":5236,"readMinutes":30,"blocks":[{"type":"heading","text":"كِتَابُ الْحَجِّ","style":"Normal","align":"center","bold":false,"size":18.0,"index":657},{"type":"blank","text":""},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ الْحَجُّ وَالْعُمْرَةُ فِي الْعُمُرِ مَرَّةً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":659},{"type":"p","text":"   الشَّرْحُ الْحَجُّ قَصْدُ الْكَعْبَةِ بِأَفْعَالٍ مَخْصُوصَةٍ، وَالْعُمْرَةُ زِيَارَةُ الْكَعْبَةِ لِأَفْعَالٍ مَخْصُوصَةٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":660},{"type":"p","text":"   وَالْحَجُّ فَرْضٌ بِالإِجْمَاعِ عَلَى الْمُسْتَطِيعِ [وَوُجُوبُ الْحَجِّ عَلَى التَّرَاخِي لا عَلَى الْفَوْرِ] وَمَنْ أَنْكَرَ وُجُوبَهُ كَفَرَ وَأَمَّا مُجَرَّدُ تَرْكِهِ لِلْمُسْتَطِيعِ مَعَ اعْتِقَادِ وُجُوبِهِ وَفَرْضِيَّتِهِ فَلا يَكُونُ كُفْرًا. وَأَمَّا الْعُمْرَةُ فَقَدِ اخْتُلِفَ فِيهَا فَذَهَبَ بَعْضُ الأَئِمَّةِ وَمِنْهُمُ الشَّافِعِيُّ رَضِيَ اللَّهُ عَنْهُ إِلَى أَنَّهَا فَرْضٌ كَالْحَجِّ وَذَهَبَ بَعْضٌ إِلَى أَنَّهَا سُنَّةٌ لَيْسَتْ فَرْضًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":661},{"type":"p","text":"   وَقَدْ جَعَلَ اللَّهُ لِلْحَجِّ مَزِيَّةً لَيْسَتْ لِلصَّلاةِ وَلا لِلصِّيَامِ وَلا لِلزَّكَاةِ وَهِيَ أَنَّهُ يُكَفِّرُ الْكَبَائِرَ وَالصَّغَائِرَ لِقَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «مَنْ حَجَّ فَلَمْ يَرْفُثْ وَلَمْ يَفْسُقْ خَرَجَ مِنْ ذُنُوبِهِ كَيَوْمَ وَلَدَتْهُ أُمُّهُ» رَوَاهُ الْبُخَارِيُّ وَمَعْنَى «فَلَمْ يَرْفُثْ» كَفَّ نَفْسَهُ عَنِ الْجِمَاعِ مَا دَامَ فِي الإِحْرَامِ بِخِلافِ الصَّلَوَاتِ الْخَمْسِ وَالزَّكَاةِ وَالصِّيَامِ فَإِنَّهَا لا تُكَفِّرُ الْكَبَائِرَ وَمَعَ ذَلِكَ الصَّلَوَاتُ الْخَمْسُ مَرْتَبَتُهَا فِي الدِّينِ أَعْلَى مِنْ مَرْتَبَةِ الْحَجِّ، فَإِنْ قِيلَ كَيْفَ يَكُونُ ذَلِكَ فَالْجَوَابُ أَنَّ الْمَزِيَّةَ لا تَقْتَضِي التَّفْضِيلَ أَيْ أَنَّ الْحَجَّ وَإِنْ كَانَ لَهُ مَزِيَّةُ أَنَّهُ يُكَفِّرُ الْكَبَائِرَ وَالصَّغَائِرَ بِخِلافِ الصَّلَوَاتِ الْخَمْسِ فَلَيْسَ ذَلِكَ دَلِيلًا عَلَى أَنَّهُ أَفْضَلُ مِنْهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":662},{"type":"p","text":"   ثُمَّ الشَّرْطُ فِي كَوْنِ الْحَجِّ يُكَفِّرُ الْكَبَائِرَ وَالصَّغَائِرَ وَيَجْعَلُ الإِنْسَانَ كَيَوْمَ وَلَدَتْهُ أُمُّهُ أَنْ تَكُونَ نِيَّتُهُ خَالِصَةً لِلَّهِ تَعَالَى، وَأَنْ يَحْفَظَ نَفْسَهُ مِنَ الْفُسُوقِ أَيْ مِنْ كَبَائِرِ الذُّنُوبِ وَالْجِمَاعِ، وَأَنْ يَكُونَ الْمَالُ الَّذِي يَتَزَوَّدُهُ لِحَجِّهِ حَلالًا، فَأَمَّا مَنْ لَمْ يَكُنْ بِهَذِهِ الصِّفَةِ فَلا يَجْعَلُهُ حَجُّهُ كَيَوْمَ وَلَدَتْهُ أُمُّهُ لَكِنَّهُ لَوْ لَمْ يَحْفَظْ نَفْسَهُ مِنْ صَغَائِرِ الذُّنُوبِ فَلا يَمْنَعُهُ ذَلِكَ مِنْ تِلْكَ الْفَضِيلَةِ [أَيْ أَنْ يَخْرُجَ مِنْ ذُنُوبِهِ كَيَوْمَ وَلَدَتْهُ أُمُّهُ]، فَلا يُقَالُ لِلَّذِي تَحْصُلُ مِنْهُ الصَّغَائِرُ وَهُوَ فِي الْحَجِّ كَكَذْبَةٍ مِنَ الصَّغَائِرِ وَنَظْرَةٍ بِشَهْوَةٍ ذَهَبَ ثَوَابُ حَجِّكَ فَإِنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَجَدَ صَبِيحَةَ الْعِيدِ بِمِنًى امْرَأَةً شَابَّةً جَمِيلَةً تَسْأَلُهُ عَنْ مَسْأَلَةٍ فِي الْحَجِّ فَجَعَلَ ابْنُ عَمِّهِ يَنْظُرُ إِلَيْهَا أَعْجَبَهُ حُسْنُهَا وَجَعَلَتْ هِيَ تَنْظُرُ إِلَيْهِ أَعْجَبَهَا حُسْنُهُ فَصَرَفَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عُنُقَ ابْنِ عَمِّهِ الَّذِي كَانَ رَاكِبًا خَلْفَهُ عَلَى الْبَعِيرِ إِلَى الشِّقِّ الآخَرِ وَلَمْ يَقُلْ لَهُ أَنْتَ أَذْهَبْتَ ثَوَابَ حَجِّكَ لِأَنَّكَ نَظَرْتَ نَظْرَةً مُحَرَّمَةً. هَذَا الْحَدِيثُ رَوَاهُ الْبُخَارِيُّ وَالتِّرْمِذِيُّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":663},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: عَلَى الْمُسْلِمِ الْحُرِّ الْمُكَلَّفِ الْمُسْتَطِيعِ بِمَا يُوصِلُهُ وَيَرُدُّهُ إِلَى وَطَنِهِ فَاضِلًا عَنْ دَيْنِهِ وَمَسْكَنِهِ وَكِسْوَتِهِ اللَّائِقَيْنِ بِهِ وَمُؤْنَةِ مَنْ عَلَيْهِ مُؤْنَتُهُ مُدَّةَ ذَهَابِهِ وَإِيَّابِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":664},{"type":"p","text":"   الشَّرْحُ لِلْحَجِّ شُرُوطُ وُجُوبٍ وَشَرْطُ صِحَّةٍ، فَأَمَّا شُرُوطُ الْوُجُوبِ فَهِيَ الإِسْلامُ وَالْبُلُوغُ وَالْعَقْلُ وَالِاسْتِطَاعَةُ وَالْحُرِّيَّةُ، وَأَمَّا شَرْطُ الصِحَّةِ فَهُوَ الإِسْلامُ فَيَصِحُّ الْحَجُّ مِنَ الْمُسْلِمِ الْبَالِغِ الْمُسْتَطِيعِ وَغَيْرِ الْمُسْتَطِيعِ وَمِنَ الصَّبِيِّ فَيَصِحُّ مِنَ الْمُمَيِّزِ بِمُبَاشَرَةِ الأَعْمَالِ بِنَفْسِهِ كَالْبَالِغِ وَمِنْ غَيْرِ الْمُمَيِّزِ بِطَرِيقِ وَلِيِّهِ فِيمَا لا يَتَأَتَّى مِنْهُ، فَإِذَا أَحْرَمَ وَلِيُّ الصَّبِيِّ الَّذِي لَيْسَ مُمَيِّزًا عَنْهُ أَيْ نَوَى جَعْلَهُ مُحْرِمًا وَلَوْ كَانَ الصَّبِيُّ غَيْرَ حَاضِرٍ عِنْدَ إِحْرَامِهِ ثُمَّ أَحْضَرَهُ الْمَشَاهِدَ أَيْ طَافَ بِهِ الْكَعْبَةَ وَسَعَى بِهِ بَيْنَ الصَّفَا وَالْمَرْوَةِ وَأَشْهَدَهُ عَرَفَةَ صَحَّ لِهَذَا الطِّفْلِ حَجُّهُ لِحَدِيثِ الْمَرْأَةِ الَّتِي أَتَتْ بِوَلَدٍ تَحْمِلُهُ فَقَالَتْ يَا رَسُولَ اللَّهِ أَلِهَذَا حَجٌّ قَالَ «نَعَمْ وَلَكِ أَجْرٌ»، فَإِذَا جَعَلَ الْوَلِيُّ الصَّبِيَّ مُحْرِمًا يَفْعَلُ عَنْهُ مَا لا يَتَأَتَّى مِنَ الطِّفْلِ مِثْلَ رَكْعَتَيِ الطَّوَافِ، وَيَلْزَمُهُ أَنْ يَمْنَعَهُ مِنَ الْمَحْظُورَاتِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":665},{"type":"p","text":"   أَمَّا صِحَّةُ الْمُبَاشَرَةِ فَشَرْطُهَا التَّمْيِيزُ وَإِذْنُ الْوَلِيِّ. وَأَمَّا صِحَّةُ وُقُوعِ الْحَجِّ عَنْ نَذْرٍ فَيُشْتَرَطُ فِيهِ التَّكْلِيفُ. وَأَمَّا وُقُوعُ الْحَجِّ عَنْ فَرْضِ الإِسْلامِ بِحَيْثُ لا يَجِبُ إِعَادَتُهُ فِي الْعُمُرِ مَرَّةً أُخْرَى فَشَرْطُهُ مَعَ التَّكْلِيفِ الْحُرِّيَّةُ التَّامَّةُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":666},{"type":"p","text":"   يُعْلَمُ مِنْ ذَلِكَ أَنَّ الْحَجَّ وَالْعُمْرَةَ لا يَجِبَانِ إِلَّا عَلَى الْمُسْلِمِ الْحُرِّ الْكَامِلِ الْحُرِّيَّةِ الْمُكَلَّفِ الْمُسْتَطِيعِ فَلا يُطَالَبُ الْكَافِرُ الأَصْلِيُّ بِأَدَائِهِمَا حَتَّى لَوْ زَالَتْ عَنْهُ الِاسْتِطَاعَةُ ثُمَّ أَسْلَمَ لا يَجِبَانِ عَلَيْهِ لِأَنَّ اسْتِطَاعَتَهُ فِي حَالِ كُفْرِهِ كَلا اسْتِطَاعَةٍ لَكِنَّهُ يُخَاطَبُ بِهِمَا خِطَابَ عِقَابٍ فِي الآخِرَةِ وَأَمَّا الْمُرْتَدُّ فَيُخَاطَبُ بِهِمَا خِطَابَ لُزُومٍ فَإِنْ كَانَ مُسْتَطِيعًا فِي حَالِ رِدَّتِهِ ثُمَّ أَسْلَمَ وَقَدِ افْتَقَرَ قَبْلَ أَنْ يُسْلِمَ ثَبَتَا فِي ذِمَّتِهِ، وَلَوْ مَاتَ فِي زَمَنِ اسْتِطَاعَتِهِ مُرْتَدًّا لَمْ يُحَجَّ وَلَمْ يُعْتَمَرَ عَنْهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":667},{"type":"p","text":"   وَيُعْلَمُ أَيْضًا أَنَّ الْحَجَّ وَالْعُمْرَةَ لا يَجِبَانِ عَلَى الْقِنِّ وَالْقِنُّ هُوَ الْعَبْدُ الْمَمْلُوكُ كُلُّهُ. وَكَذَلِكَ غَيْرُ الْمُكَلَّفِ لا يَجِبَانِ عَلَيْهِ. وَكَذَلِكَ غَيْرُ الْمُسْتَطِيعِ وَإِنْ كَانَ لَوْ تَكَلَّفَ بِاسْتِدَانَةٍ أَوْ غَيْرِهَا أَجْزَأَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":668},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ فِي شَرْحِ الِاسْتِطَاعَةِ «فَاضِلًا عَنْ دَيْنِهِ وَمَسْكَنِهِ وَكِسْوَتِهِ اللَّائِقَيْنِ بِهِ وَمُؤْنَةِ مَنْ عَلَيْهِ مُؤْنَتُهُ مُدَّةَ ذَهَابِهِ وَإِيَّابِهِ» مَعْنَاهُ أَنَّ مِنْ شُرُوطِ وُجُوبِ الْحَجِّ الِاسْتِطَاعَةُ. وَالِاسْتِطَاعَةُ نَوْعَانِ اسْتِطَاعَةٌ حِسِّيَّةٌ وَاسْتِطَاعَةٌ مَعْنَوِيَّةٌ، فَالِاسْتِطَاعَةُ الْحِسِّيَّةُ أَنْ يَجِدَ الشَّخْصُ مَا يُوصِلُهُ إِلَى مَكَّةَ وَيَرُدُّهُ إِلَى وَطَنِهِ مِنْ زَادٍ وَمَا يَتْبَعُ ذَلِكَ فَاضِلًا عَنْ دَيْنِهِ وَمَسْكَنِهِ وَكِسْوَتِهِ اللَّائِقَيْنِ بِهِ وَمُؤْنَةِ مَنْ عَلَيْهِ مُؤْنَتُهُ مُدَّةَ ذَهَابِهِ وَإِيَّابِهِ مَعَ الأَمْنِ عَلَى نَفْسِهِ وَمَالِهِ. وَأَمَّا الِاسْتِطَاعَةُ الْمَعْنَوِيَّةُ أَيِ الِاسْتِطَاعَةُ الْحُكْمِيَّةُ فَمِنْهَا أَنْ تَجِدَ الْمَرْأَةُ مَحْرَمًا يُرَافِقُهَا أَوْ نِسْوَةً ثِقَاتٍ بِالِغَاتٍ أَوْ مُرَاهِقَاتٍ، قَالَ بَعْضُهُمْ لَوْ وَجَدَتْ ثِقَةً وَاحِدَةً يَكْفِي لِحُصُولِ الِاسْتِطَاعَةِ، فَإِنْ كَانَ مَحْرَمُهَا لا يُسَافِرُ مَعَهَا لِلْحَجِّ إِلَّا بِالأُجْرَةِ فَيُشْتَرَطُ أَنْ تَكُونَ وَاجِدَةً لِهَذِهِ الأُجْرَةِ أَيْ قَادِرَةً عَلَيْهَا، فَلا يَجِبُ عَلَى الْمَرْأَةِ أَنْ تَحُجَّ إِلَّا بِهَذَا الشَّرْطِ فَإِنْ لَمْ تَحْصُلْ عَلَى هَذَا الشَّرْطِ جَازَ لَهَا أَنْ تَخْرُجَ لِحَجِّ الْفَرْضِ وَحْدَهَا، أَمَّا لِغَيْرِ الْحَجِّ الْوَاجِبِ وَهُوَ النَّفْلُ فَلا يَجُوزُ لَهَا السَّفَرُ مِنْ أَجْلِهِ وَحْدَهَا وَلا مَعَ النِّسْوَةِ الثِّقَاتِ. وَيَشْمَلُ هَذَا الْحُكْمُ سَفَرَهَا لِزِيَارَةِ الأَوْلِيَاءِ أَوْ لِزِيَارَةِ قَبْرِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَلا يَجُوزُ لَهَا أَنْ تُسَافِرَ لِغَيْرِ الْفَرْضِ مِنْ حَجٍّ أَوْ غَيْرِهِ إِلَّا مَعَ مَحْرَمٍ وَذَلِكَ لِقَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا تُسَافِرُ الْمَرْأَةُ مَسِيرَةَ ثَلاثَةِ أَيَّامٍ» وَفِي رِوَايَةٍ «مَسِيرَةَ يَوْمٍ وَلَيْلَةٍ» وَفِي رِوَايَةٍ «بَرِيدًا» [وَالْبَرِيدُ هُوَ مَسَافَةُ نِصْفِ نَهَارٍ] «إِلَّا وَمَعَهَا مَحْرَمٌ» وَكُلُّ هَذِهِ الرِّوَايَاتِ صَحِيحَةُ الإِسْنَادِ. فَإِذَا كَانَ لا يَجُوزُ لِلْمَرْأَةِ أَنْ تُسَافِرَ بِلا مَحْرَمٍ أَوْ زَوْجٍ لِحَجِّ النَّفْلِ وَزِيَارَةِ قَبْرِ الرَّسُولِ وَنَحْوِ ذَلِكَ فَبِالأَوْلَى أَنْ لا يَجُوزَ لَهَا السَّفَرُ وَحْدَهَا لِلتَّنَزُّهِ إِلَّا أَنْ يَكُونَ سَفَرُهَا لِضَرُورَةٍ كَأَنْ تَخَافَ عَلَى نَفْسِهَا فِي بَلَدِهَا أَوْ لا تَجِدَ قُوتَهَا أَوْ لا تَجِدَ مَنْ يُعَلِّمُهَا دِينَهَا أَيْ عِلْمَ دِينِهَا الضَّرُورِيَّ.","style":"Body Text 3","align":"justify","bold":true,"size":18.0,"index":669},{"type":"p","text":"   وَهَذِهِ الِاسْتِطَاعَةُ تُسَمَّى الِاسْتِطَاعَةَ بِالنَّفْسِ، وَهُنَاكَ اسْتِطَاعَةٌ بِالْغَيْرِ وَذَلِكَ فِي الْمَعْضُوبِ الَّذِي قَطَعَهُ الْمَرَضُ وَبَيْنَهُ وَبَيْنَ مَكَّةَ مَرْحَلَتَانِ فَأَكْثَر فَلا يَسْتَطِيعُ أَنْ يَحُجَّ بِنَفْسِهِ مَاشِيًا أَوْ رَاكِبًا، فَهَذَا يَجِبُ عَلَيْهِ أَنْ يُنِيبَ عَنْ نَفْسِهِ مَنْ يَحُجُّ عَنْهُ وَلَوْ بِأُجْرَةٍ إِنْ قَدَرَ عَلَيْهَا، وَهَذَا النَّائِبُ يَجِبُ أَنْ يَكُونَ قَدْ حَجَّ عَنْ نَفْسِهِ أَمَّا الَّذِي لَمْ يَحُجَّ عَنْ نَفْسِهِ فَلا يَنُوبُ عَنْ غَيْرِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":670},{"type":"p","text":"   وَيُفْهَمُ مِنْ قَوْلِ الْمُؤَلِّفِ «فَاضِلًا عَنْ دَيْنِهِ وَمَسْكَنِهِ وَكِسْوَتِهِ اللَّائِقَيْنِ بِهِ وَمُؤْنَةِ مَنْ عَلَيْهِ مُؤْنَتُهُ مُدَّةَ ذَهَابِهِ وَإِيَّابِهِ» أَنَّ الْحَجَّ لا يَجِبُ عَلَى الشَّخْصِ إِلَّا إِذَا وَجَدَ زَادًا لِلْحَجِّ فَاضِلًا عَنْ دَيْنِهِ وَلَوْ كَانَ ذَلِكَ الدَّيْنُ مُؤَجَّلًا أَوْ كَانَ حَقًّا لِلَّهِ تَعَالَى لَيْسَ حَقًّا لِلْعِبَادِ كَالْكَفَّارَةِ وَالزَّكَاةِ، فَإِذَا كَانَ الشَّخْصُ عَلَيْهِ فِي ذِمَّتِهِ دَيْنٌ لِشَخْصٍ أَوْ زَكَاةٌ مَا دَفَعَهَا وَكَانَ لَوْ حَجَّ فَاتَهُ أَدَاءُ مَا عَلَيْهِ مِنَ الدَّيْنِ أَوْ أَدَاءُ الزَّكَاةِ فَلَيْسِ بِمُسْتَطِيعٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":671},{"type":"p","text":"   وَيُشْتَرَطُ كَذَلِكَ أَنْ يَكُونَ الزَّادُ زَائِدًا أَيْضًا عَنِ الْمَسْكَنِ وَعَنِ الْكِسْوَةِ وَلَيْسَ الْمَعْنِيُّ بِقَوْلِهِ فَاضِلًا عَنْ مَسْكَنِهِ أَنْ يَكُونَ لَهُ بَيْتٌ مِلْكٌ يَسْكُنُهُ بَلْ يَكْفِي أَنْ يَكُونَ مِلْكًا أَوْ مُسْتَأْجَرًا يَسْتَطِيعُ دَفْعَ أُجْرَتِهِ. وَيُعْتَبَرُ أَنْ يَكُونَ الْمَسْكَنُ وَالْكِسْوَةُ لائِقَيْنِ بِهِ فَإِنْ كَانَ فَوْقَ مَا يَلِيقُ بِهِ فَهُوَ لا يَمْنَعُ الْوُجُوبَ وَلا يَمْنَعُ الِاسْتِطَاعَةَ، وَأَمَّا إِنْ كَانَ أَقَلَّ مِمَّا يَلِيقُ بِهِ فَيَمْنَعُ الِاسْتِطَاعَةَ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":672},{"type":"p","text":"   وَيُشْتَرَطُ أَنْ يَكُونَ الزَّادُ زَائِدًا عَنْ مُؤْنَةِ مَنْ عَلَيْهِ مُؤْنَتُهُ كَالزَّوْجَةِ وَالْقَرِيبِ الَّذِي تَجِبُ نَفَقَتُهُ عَلَيْهِ كَأَبِيهِ وَأُمِّهِ الْفَقِيرَيْنِ، وَعَنْ إِعْفَافِ أَبِيهِ أَيْ أَنَّهُ إِنْ كَانَ لَهُ أَبٌ يَحْتَاجُ لِلزِّوَاجِ وَكَانَ الِابْنُ لا يَجِدُ مَا يَكْفِي لِزَادِ الْحَجِّ مَعَ مُؤْنَةِ تَزْوِيجِ الأَبِ فَهُوَ لَيْسَ بِمُسْتَطِيعٍ. اللَّهُ تَعَالَى أَكَدَّ أَمْرَ الْوَالِدِ فَإِنْ كَانَ الأَبُ بِحَاجَةٍ لِلزِّوَاجِ فَفَرْضٌ عَلَى الْوَلَدِ أَنْ يُسَاعِدَهُ فَإِنْ لَمْ يُسَاعِدْهُ فَهُوَ فَاسِقٌ، هَذَا إِنْ لَمْ يَكُنْ لِلأَبِ مَالٌ يَسْتَطِيعُ أَنْ يُزَوِّجَ نَفْسَهُ مِنْهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":673},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَرْكَانُ الْحَجِّ سِتَّةٌ الأَوَّلُ الإِحْرَامُ وَهُوَ أَنْ يَقُولَ بِقَلْبِهِ «دَخَلْتُ فِي عَمَلِ الْحَجِّ».","style":"Normal","align":"justify","bold":false,"size":18.0,"index":674},{"type":"p","text":"   الشَّرْحُ الأَرْكَانُ هِيَ الأَعْمَالُ الَّتِي لا يَصِحُّ الْحَجُّ بِدُونِهَا وَلا تُجْبَرُ بِالدَّمِ وَهِيَ سِتَّةٌ أَوَّلُهَا الإِحْرَامُ، وَمَعْنَى الإِحْرَامِ نِيَّةُ الدُّخُولِ فِي النُّسُكِ، وَالنُّسُكُ هُوَ عَمَلُ الْحَجِّ أَوْ عَمَلُ الْعُمْرَةِ، وَلا تَجِبُ نِيَّةُ الْفَرْضِيَّةِ فِي الْحَجِّ الْفَرْضِ إِنَّمَا الْوَاجِبُ أَنْ يَقُولَ فِي قَلْبِهِ «دَخَلْتُ فِي النُّسُكِ» مَثَلًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":675},{"type":"p","text":"   تَنْبِيهٌ. قَصْدُ النُّسُكِ قَبْلَ الإِحْرَامِ لا يُسَمَّى إِحْرَامًا وَإِنَّمَا الإِحْرَامُ مَا سَبَقَ ذِكْرُهُ، وَهَذَا يَخْفَى عَلَى بَعْضِ الْجُهَّالِ يَظُنُّونَ أَنَّ الْحَجَّ رُؤْيَةُ مَكَّةَ وَحُضُورُ تِلْكَ الْمَشَاهِدِ فَإِذَا قِيلَ لِأَحَدِهِمْ مَاذَا نَوَيْتَ يَقُولُ أَنَا نَوَيْتُ مَكَّةَ أَوْ نَحْوَ ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":676},{"type":"p","text":"   ثُمَّ إِنَّ الإِحْرَامَ يَنْعَقِدُ مُطْلَقًا مِنْ دُونِ تَعْيِينٍ كَأَنْ يَقُولَ نَوَيْتُ الإِحْرَامَ ثُمَّ بَعْدَ ذَلِكَ يَصْرِفُهُ لِلْحَجِّ وَحْدَهُ أَوْ لِلْعُمْرَةِ وَحْدَهَا أَوْ يَصْرِفُهُ لَهُمَا أَيْ لِلْحَجِّ وَالْعُمْرَةِ فَإِذَا كَانَ فِي بَدْءِ الأَمْرِ نَوَى الدُّخُولَ فِي النُّسُكِ مِنْ غَيْرِ تَعْيِينِ الْحَجِّ أَوِ الْعُمْرَةِ أَوِ الْقِرَانِ بَيْنَهُمَا كَانَ إِحْرَامًا مُطْلَقًا ثُمَّ بَعْدَ ذَلِكَ لَهُ الْخِيَارُ إِنْ شَاءَ جَعَلَهُ حَجًّا مُفْرَدًا وَإِنْ شَاءَ جَعَلَهُ عُمْرَةً مُفْرَدَةً وَإِنْ شَاءَ جَعَلَهُ قِرَانًا أَيْ جَمْعًا بَيْنَ الْحَجِّ وَالْعُمْرَةِ وَلا يَصِحُّ لَهُ أَنْ يُبَاشِرَ الأَعْمَالَ قَبْلَ الصَّرْفِ أَيِ التَّعْيِينِ، لَكِنْ لَوْ صَرَفَ بَعْدَ الطَّوَافِ يَكُونُ هَذَا الطَّوَافُ طَوَافَ الْقُدُومِ وَالسَّعْيُ الَّذِي بَعْدَهُ لا يَصِحُّ، هَذَا إِذَا كَانَ فِي أَشْهُرِ الْحَجِّ أَيْ بَعْدَ دُخُولِ شَهْرِ شَوَّالٍ أَمَّا لَوْ أَحْرَمَ فِي غَيْرِ أَشْهُرِ الْحَجِّ فَيَنْصَرِفُ إِحْرَامُهُ إِلَى عُمْرَةٍ وَلَوْ لَمْ يُعَيِّنْ، حَتَّى لَوْ نَوَى الْحَجَّ قَبْلَ أَنْ تَدْخُلَ أَشْهُرُهُ انْقَلَبَ إِحْرَامُهُ إِلَى إِحْرَامٍ بِعُمْرَةٍ لِأَنَّهُ نَوَى الْحَجَّ قَبْلَ وَقْتِهِ وَالْحَجُّ لا تَصِحُّ نِيَّتُهُ إِلَّا بَعْدَ دُخُولِ أَشْهُرِهِ. وَأَشْهُرُ الْحَجِّ هِيَ شَوَّالٌ وَذُو الْقَعْدَةِ وَذُو الْحِجَّةِ وَبَعْضُهَا مِنَ الأَشْهُرِ الْحُرُمِ الأَرْبَعَةِ ذِي الْقَعْدَةِ وَذِي الْحِجَّةِ وَالْمُحَرَّمِ وَرَجَبٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":677},{"type":"p","text":"   وَيُسَنُّ قَبْلَ الإِحْرَامِ الِاغْتِسَالُ وَتَطْيِيبُ الْبَدَنِ وَهُوَ سُنَّةٌ لِلرِّجَالِ وَالنِّسَاءِ، وَأَفْضَلُ الطِّيبِ الْمِسْكُ الْمَخْلُوطُ بِمَاءِ الْوَرْدِ ثُمَّ بَعْدَ ذَلِكَ لَيْسَ عَلَيْهِ بَأْسٌ فِي اسْتِبْقَائِهِ عَلَيْهِ لِأَنَّهُ فِي سُنَنِ أَبِي دَاوُدَ وَسُنَنِ الْبَيْهَقِيِّ أَنَّ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ «كُنَّا نَخْرُجُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَى مَكَّةَ فَنُضَمِّخُ جِبَاهَنَا بِالْمِسْكِ لِلإِحْرَامِ فَإِذَا عَرِقَتْ إِحْدَانَا سَالَ عَلَى وَجْهِهَا فَيَرَى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ذَلِكَ فَلا يَنْهَانَا». أَمَّا الثَّوْبُ فَتَطْيِيبُهُ مَكْرُوهٌ لَكِنْ لَوْ فَعَلَ ذَلِكَ لا يَحْرُمُ عَلَيْهِ أَنْ يَسْتَمِرَّ عَلَى لُبْسِ هَذَا الثَّوْبِ، وَلَوْ نَزَعَ هَذَا الثَّوْبَ الْمُطَيَّبَ عَنْ جِسْمِهِ فَيَحْرُمُ عَلَيْهِ إِعَادَتُهُ إِلَيْهِ وَتَلْزَمُهُ فِدْيَةٌ إِنْ فَعَلَ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":678},{"type":"p","text":"   وَيُسَنُّ لِلرِّجَالِ أَنْ يَجْهَرُوا بِالتَّلْبِيَةِ أَيْ أَنْ يَرْفَعُوا أَصْوَاتَهُمْ رَفْعًا قَوِيًّا بِهَا بَعْدَ التَّلْبِيَةِ الأُولَى، أَمَّا النِّسَاءُ فَلا يَرْفَعْنَ أَصْوَاتَهُنَّ بِالتَّلْبِيَةِ لا فِي الْمَرَّةِ الأُولَى وَلا فِيمَا بَعْدَهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":679},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الثَّانِي الْوُقُوفُ بِعَرَفَةَ بَيْنَ زَوَالِ شَمْسِ يَوْمِ عَرَفَةَ إِلَى فَجْرِ لَيْلَةِ الْعِيدِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":680},{"type":"p","text":"   الشَّرْحُ أَنَّ الرُّكْنَ الثَّانِيَ لِلْحَجِّ الْوُقُوفُ بِعَرَفَةَ فِيمَا بَيْنَ زَوَالِ شَمْسِ الْيَوْمِ التَّاسِعِ وَطُلُوعِ الْفَجْرِ، وَيُجْزِئُ بِأَيِّ جُزْءٍ مِنْ أَرْضِ عَرَفَةَ وَلَوْ كَانَ عَلَى ظَهْرِ دَابَّةٍ أَوْ شَجَرَةٍ وَلَوْ كَانَ مَارًّا لَمْ يَمْكُثْ فِيهَا أَوْ كَانَ نَائِمًا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":681},{"type":"p","text":"   ثُمَّ الأَفْضَلُ لِلرِّجَالِ أَنْ يَقِفُوا فِي مَوْقِفِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عِنْدَ الصَّخَرَاتِ الْكِبَارِ الْمُفْتَرَشَةِ أَسْفَلَ جَبَلِ الرَّحْمَةِ وَللنِّسَاءِ حَاشِيَةُ الْمَوْقِفِ حَتَّى لا يُزَاحِمْنَ الرِّجَالَ، وَيُسَنُّ الْجَمْعُ بَيْنَ اللَّيْلِ وَالنَّهَارِ فَإِنْ تَرَكَ ذَلِكَ كَانَ مَكْرُوهًا، ثُمَّ يَرْحَلُ مِنْ عَرَفَاتَ إِلَى مُزْدَلِفَةَ [وَهِيَ أَرْضٌ بَيْنَ عَرَفَاتَ وَمِنًى].","style":"Normal","align":"justify","bold":false,"size":18.0,"index":682},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الثَّالِثُ الطَّوَافُ بِالْبَيْتِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":683},{"type":"p","text":"   الشَّرْحُ الرُّكْنُ الثَّالِثُ الطَّوَافُ بِالْبَيْتِ وَلا يَصِحُّ إِلَّا بَعْدَ انْتِصَافِ لَيْلَةِ النَّحْرِ. وَمَعْنَى الطَّوَافِ هُنَا أَنْ يَدُورَ الْحَاجُّ حَوْلَ الْكَعْبَةِ سَبْعَ مَرَّاتٍ وَقَدْ جَعَلَ الْبَيْتَ أَيِ الْكَعْبَةَ عَنْ يَسَارِهِ مَارًّا لِجِهَةِ الْحِجْرِ بِكَسْرِ الْحَاءِ وَسُكُونِ الْجِيمِ، فَإِنْ جَعَلَ الْبَيْتَ عَنْ يَمِينِهِ وَمَشَى أَمَامَهُ أَوْ مَشَى الْقَهْقَرَى أَيْ إِلَى خَلْفٍ أَوْ جَعَلَ الْبَيْتَ أَمَامَهُ وَاسْتَقْبَلَهُ بِصَدْرِهِ أَوْ جَعَلَهُ عَنْ يَسَارِهِ وَمَشَى الْقَهْقَرَى لَمْ يَصِحَّ طَوَافُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":684},{"type":"p","text":"   وَمِنْ شُرُوطِ الطَّوَافِ أَنْ يَبْدَأَ بِالْحَجَرِ الأَسْوَدِ وَأَنْ يُحَاذِيَهُ كُلَّهُ أَوْ بَعْضَهُ فِي أَوَّلِ طَوَافِهِ، فَيَجِبُ فِي الِابْتِدَاءِ أَنْ لا يَتَقَدَّمَ جُزْءٌ مِنْهُ عَلَى جُزْءٍ مِنَ الْحَجَرِ بِفَتْحِ الْحَاءِ وَالْجِيمِ مِمَّا يَلِي الْبَابَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":685},{"type":"p","text":"   وَمِنْهَا النِّيَّةُ إِنْ لَمْ يَكُنِ الطَّوَافُ دَاخِلًا فِي النُّسُكِ بِأَنْ لَمْ يَكُنْ بِإِحْرَامٍ بَلْ كَانَ بِغَيْرِ إِحْرَامٍ بِحَجٍّ أَوْ عُمْرَةٍ فَإِنَّهُ حِينَئِذٍ تَجِبُ النِّيَّةُ فَلا يَصِحُّ الطَّوَافُ بِدُونِهَا. وَمِنْهَا أَنْ يَكُونَ عَدَدُ الطَّوْفَاتِ سَبْعًا يَقِينًا فَلَوْ شَكَّ فِي الْعَدَدِ أَخَذَ بِالأَقَلِّ كَالصَّلاةِ. وَمِنْهَا أَنْ يَكُونَ دَاخِلَ الْمَسْجِدِ وَلَوْ عَلَى سَطْحِهِ وَأَنْ يَكُونَ الطَّوَافُ بِالْكَعْبَةِ خَارِجَهَا وَخَارِجَ الشَّاذَرْوَانِ وَالْحِجْرِ بِجَمِيعِ بَدَنِهِ. وَالشَّاذَرْوَانُ جُزْءٌ مِنْ أَسَاسِ الْكَعْبَةِ مُرْتَفِعٌ قَدْرَ ذِرَاعٍ تَقْرِيبًا فَهُوَ مِنَ الْكَعْبَةِ لِذَلِكَ لا يَجُوزُ أَنْ يَطُوفَ الإِنْسَانُ وَشَىْءٌ مِنْ بَدَنِهِ مُحَاذٍ لَهُ. وَمِنْهَا الطَّهَارَةُ عَنِ الْحَدَثَيْنِ وَالنَّجَاسَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":686},{"type":"p","text":"   وَلا يُشْتَرَطُ الْمَشْيُ بَلْ يَصِحُّ الطَّوَافُ لَوْ كَانَ رَاكِبًا فَقَدْ طَافَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رَاكِبًا الْبَعِيرَ وَشَرْطُ جَوَازِ ذَلِكَ أَنْ لا يَحْصُلَ بِسَبَبِهِ تَقْذِيرٌ لِأَرْضِ الْمَسْجِدِ بِرِجْلِ الْبَعِيرِ فَإِنْ كَانَ فِي حَالٍ يَحْصُلُ مِنْهُ تَقْذِيرٌ لِلْمَسْجِدِ بِمَا عَلَى رِجْلِ الْبَعِيرِ مِنْ رَوْثٍ أَوْ غَيْرِهِ حَرُمَ لِأَنَّ تَقْذِيرَ الْمَسْجِدِ وَلا سِيَّمَا الْمَسْجِدِ الْحَرَامِ حَرَامٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":687},{"type":"p","text":"   وَمِنْ سُنَنِ الطَّوَافِ اسْتِلامُ الْحَجَرِ بِفَتْحِ الْجِيمِ وَتَقْبِيلُهُ بِلا صَوْتٍ، وَالأَذْكَارُ الْمَأْثُورَةُ عَنْهُ عَلَيْهِ الصَّلاةُ وَالسَّلامُ أَوْ عَنْ أَحَدٍ مِنَ الصَّحَابَةِ فَإِنَّهَا أَفْضَلُ فِيهِ، فَمِنَ الْمَأْثُورِ «رَبَّنَا ءَاتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ» إِذْ ثَبَتَ أَنَّهَا أَكْثَرُ دَعْوَةٍ كَانَ يَدْعُو بِهَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الْحَجِّ وَغَيْرِهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":688},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الرَّابِعُ السَّعْيُ بَيْنَ الصَّفَا وَالْمَرْوَةِ سَبْعَ مَرَّاتٍ مِنَ الْعَقْدِ إِلَى الْعَقْدِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":689},{"type":"p","text":"   الشَّرْحُ أَنَّ السَّعْيَ بَيْنَ الصَّفَا وَالْمَرْوَةِ مِنْ أَرْكَانِ الْحَجِّ لا يَصِحُّ الْحَجُّ بِدُونِهِ، وَوَاجِبَاتُهُ ثَلا

ثَةٌ الأَوَّلُ الْبَدَاءَةُ فِي الأَوْتَارِ بِالصَّفَا وَفِي الأَشْفَاعِ بِالْمَرْوَةِ، وَالْعَقْدُ الَّذِي عَلَى الصَّفَا عَلامَةٌ عَلَى أَوَّلِهِمَا فَمَنْ شَاءَ اقْتَصَرَ عَلَى ذَلِكَ وَمَنْ شَاءَ يَصْعَدُ إِلَى مَا فَوْقَهُ مِنَ الصَّخَرَاتِ وَإِذَا لَمْ يَفْعَلْ ذَلِكَ وَبَدَأَ بِالْعَقْدِ صَحَّ، وَالصَّفَا جَبَلٌ وَالْمَرْوَةُ جَبَلٌ كَانَ بَيْنَهُمَا وَادٍ مُنْخَفِضٌ ثُمَّ هَذَا الْوَادِي طُمَّ بِالتُّرَابِ وَالْحِجَارَةِ فَصَارَتِ الأَرْضُ سَهْلَةً. وَالثَّانِي كَوْنُهُ بَعْدَ الطَّوَافِ وَالثَّالِثُ كَوْنُهُ سَبْعَةَ أَشْوَاطٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":690},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْخَامِسُ  الْحَلْقُ أَوِ التَّقْصِيرُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":691},{"type":"p","text":"   الشَّرْحُ الْخَامِسُ مِنْ أَرْكَانِ الْحَجِّ الْحَلْقُ أَوِ التَّقْصِيرُ. وَالْحَلْقُ هُوَ اسْتِئْصَالُ الشَّعَرِ بِالْمُوسَى، وَالتَّقْصِيرُ أَنْ يُؤْخَذَ مِنْهُ شَىْءٌ قَلِيلٌ أَوْ كَثِيرٌ مِنْ غَيْرِ اسْتِئْصَالٍ، فَفِعْلُ أَحَدِ هَذَيْنِ فَرْضٌ مِنْ فُرُوضِ الْحَجِّ. وَالْوَاجِبُ إِزَالَةُ ثَلاثِ شَعَرَاتٍ بِالْقَصِّ أَوِ النَّتْفِ أَوِ الْحَرْقِ أَوْ أَيِّ كَيْفِيَّةٍ أُخْرَى لَكِنِ اسْتِعْمَالُ الطَّرِيقَةِ الَّتِي فِيهَا ضَرَرٌ لا يَجُوزُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":692},{"type":"p","text":"   وَوَقْتُ إِجْزَاءِ الْحَلْقِ وَالتَّقْصِيرِ مِنَ النِّصْفِ الثَّانِي مِنْ لَيْلَةِ الْعِيدِ، وَقَبْلَ ذَلِكَ حَرَامٌ أَنْ يَنْتِفَ الْحَاجُّ شَعْرَةً وَاحِدَةً مِنْ شَعَرِ بَدَنِهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":693},{"type":"p","text":"   وَالتَّقْصِيرُ جَائِزٌ لِلنِّسَاءِ كَمَا هُوَ جَائِزٌ لِلرِّجَالِ لَكِنَّ الْحَلْقَ بِالْمُوسَى حَرَامٌ عَلَى الْمَرْأَةِ إِلَّا لِضَرُورَةٍ، وَقَالَ بَعْضُهُمْ مَكْرُوهٌ إِذَا لَمْ يَكُنْ لِعُذْرٍ. وَوَرَدَ أَنَّ لِلْحَالِقِ بِكُلِّ شَعْرَةٍ سَقَطَتْ مِنْ رَأْسِهِ نُورًا يَوْمَ الْقِيَامَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":694},{"type":"p","text":"   ثُمَّ إِنَّ الْحَلْقَ أَوِ التَّقْصِيرَ يُسَنُّ أَنْ يَكُونَ فِي يَوْمِ النَّحْرِ وَالأَفْضَلُ بَعْدَ طُلُوعِ الشَّمْسِ وَقَبْلَ طَوَافِ الرُّكْنِ وَالسَّعْيِ. وَيُسَنُّ الْبَدَاءَةُ بِيَمِينِ رَأْسِ الْمَحْلُوقِ وَمُقَدَّمِهِ وَاسْتِقْبَالُ الْقِبْلَةِ وَالتَّكْبِيرُ بَعْدَ الِانْتِهَاءِ مِنَ الْحَلْقِ أَوِ التَّقْصِيرِ وَحَلْقُ جَمِيعِهِ لِلذَّكَرِ وَتَقْصِيرُ جَمِيعِهِ لِغَيْرِ الذَّكَرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":695},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: السَّادِسُ التَّرْتِيبُ فِي مُعْظَمِ الأَرْكَانِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":696},{"type":"p","text":"   الشَّرْحُ إِنَّمَا قِيلَ التَّرْتِيبُ فِي الْحَجِّ فِي مُعْظَمِ الأَرْكَانِ لِأَنَّهُ لا بُدَّ مِنْ تَقْدِيمِ الإِحْرَامِ عَلَى الْكُلِّ وَتَأْخِيرِ الطَّوَافِ وَالْحَلْقِ أَوِ التَّقْصِيرِ عَنِ الْوُقُوفِ. أَمَّا السَّعْيُ فَيَجُوزُ فِعْلُهُ قَبْلَ طَوَافِ الْفَرْضِ إِنْ كَانَ طَافَ طَوَافَ الْقُدُومِ وَيَجُوزُ تَأْخِيرُهُ إِلَى مَا بَعْدَ طَوَافِ الْفَرْضِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":697},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَهِيَ إِلَّا الْوُقُوفَ أَرْكَانٌ لِلْعُمْرَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":698},{"type":"p","text":"   الشَّرْحُ هَذِهِ السِّتَّةُ الَّتِي هِيَ أَرْكَانُ الْحَجِّ هِيَ أَرْكَانُ الْعُمْرَةِ إِلَّا الْوُقُوفَ بِعَرَفَةَ فَلَيْسَ مِنْ أَرْكَانِ الْعُمْرَةِ بَلْ وَلا يُشْرَعُ لِلْعُمْرَةِ الْوُقُوفُ بِعَرَفَةَ، فَإِذًا تَلَخَّصَ أَنَّ أَرْكَانَ الْعُمْرَةِ خَمْسَةٌ الإِحْرَامُ وَالطَّوَافُ وَالسَّعْيُ وَالْحَلْقُ أَوِ التَّقْصِيرُ وَالتَّرْتِيبُ، فَالتَّرْتِيبُ هُنَا وَاجِبٌ فِي جَمِيعِ أَرْكَانِ الْعُمْرَةِ بِخِلافِ الْحَجِّ وَيَكُونُ بِالِابْتِدَاءِ بِالإِحْرَامِ ثُمَّ الطَّوَافِ ثُمَّ السَّعْيِ ثُمَّ الْحَلْقِ أَوِ التَّقْصِيرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":699},{"type":"p","text":"   ثُمَّ كُلُّ أَرْكَانِ الْحَجِّ وَالْعُمْرَةِ تَصِحُّ مَعَ الْحَدَثِ وَمَعَ النَّجَاسَةِ إِلَّا الطَّوَافَ فَهُوَ فَقَطْ لا يَجُوزُ مَعَ الْحَدَثِ أَيِ انْتِقَاضِ الْوُضُوءِ وَلا مَعَ الْجَنَابَةِ وَلا مَعَ الْحَيْضِ وَلا مَعَ النِّفَاسِ وَكَذَلِكَ لا يَصِحُّ مَعَ النَّجَسِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":700},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلِهَذِهِ الأَرْكَانِ فُرُوضٌ وَشُرُوطٌ لا بُدَّ مِنْ مُرَاعَاتِهَا. وَيُشْتَرَطُ لِلطَّوَافِ قَطْعُ مَسَافَةٍ وَهِيَ مِنَ الْحَجَرِ الأَسْوَدِ إِلَى الْحَجَرِ الأَسْوَدِ سَبْعَ مَرَّاتٍ، وَمِنْ شُرُوطِهِ سَتْرُ الْعَوْرَةِ وَالطَّهَارَةُ وَأَنْ يَجْعَلَ الْكَعْبَةَ عَنْ يَسَارِهِ لا يَسْتَقْبِلُهَا وَلا يَسْتَدْبِرُهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":701},{"type":"p","text":"   الشَّرْحُ أَنَّ لِكُلٍّ مِنَ الأَرْكَانِ فُرُوضًا كَكَوْنِ الطَّوْفَاتِ سَبْعَةَ أَشْوَاطٍ، وَيُشْتَرَطُ لَهَا شُرُوطٌ كَالسَّتْرِ وَالطَّهَارَةِ مِنَ الْحَدَثَيْنِ وَالنَّجَاسَةِ وَكَوْنِ الطَّوَافِ فِي الْمَسْجِدِ فَلا بُدَّ مِنْ مُرَاعَاتِهَا لِأَنَّهُ لا يَصِحُّ النُّسُكُ إِنْ فُقِدْ شَىْءٌ مِنْهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":702},{"type":"p","text":"   وَالْفَرْقُ بَيْنَ الْفَرْضِ وَالشَّرْطِ أَنَّ الْفَرْضَ مَا كَانَ جُزْءًا مِنَ النُّسُكِ تَتَوَقَّفُ عَلَيْهِ صِحَّةُ النُّسُكِ وَأَمَّا الشَّرْطُ فَهُوَ مَا لَيْسَ جُزْءًا مِنَ النُّسُكِ لَكِنْ تَتَوَقَّفُ صِحَّةُ النُّسُكِ عَلَيْهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":703},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَحَرُمَ عَلَى مَنْ أَحْرَمَ طِيبٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":704},{"type":"p","text":"   الشَّرْحُ مِمَّا يَحْرُمُ بِالإِحْرَامِ عَلَى مَنْ أَحْرَمَ بِحَجٍّ أَوْ عُمْرَةٍ ثَمَانِيَةُ أَشْيَاءَ، وَكُلُّ هَذِهِ مِنَ الصَّغَائِر إِلَّا الْجِمَاعَ الْمُفْسِدَ لِلْحَجِّ وَقَتْلَ الصَّيْدِ فَهُمَا مِنَ الْكَبَائِرِ، وَإِنَّمَا حُرِّمَتْ هَذِهِ الأَشْيَاءُ عَلَى الْمُحْرِمِ لِحِكَمٍ بَعْضُهَا مَعْلُومٌ لَنَا وَبَعْضُهَا غَيْرُ مَعْلُومٍ لَنَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":705},{"type":"p","text":"   الأَوَّلُ مِنَ الثَّمَانِيَةِ الطِّيبُ أَيْ يَحْرُمُ عَلَى الْمُحْرِمِ بِالْحَجِّ أَوِ الْعُمْرَةِ أَوْ إِحْرَامًا مُطْلَقًا التَّطَيُّبُ فِي مَلْبُوسٍ أَوْ بَدَنٍ وَلَوْ لِأَخْشَمَ. وَتَجِبُ الْفِدْيَةُ بِالتَّطَيُّبِ فِي بَدَنِهِ أَوْ مَلْبُوسِهِ قَصْدًا بِمَا تُقْصَدُ مِنْهُ رَائِحَتُهُ غَالِبًا كَالْمِسْكِ وَالْعُودِ وَالْوَرْدِ وَدُهْنِهِ وَالْوَرْسِ لا مَا يُقْصَدُ بِهِ الأَكْلُ أَوِ التَّدَاوِي وَإِنْ كَانَ لَهُ رَائِحَةٌ طَيِّبَةٌ كَالتُّفَاحِ، وَحُرْمَةُ ذَلِكَ بِشَرْطِ الْقَصْدِ وَالِاخْتِيَارِ وَالْعِلْمِ بِالتَّحْرِيمِ وَهَذِهِ الثَّلاثَةُ شَرْطٌ فِي سَائِرِ مُحَرَّمَاتِ الإِحْرَامِ. وَالتَّطَيُّبُ بِالْوَرْدِ أَنْ يَشَمَّهُ مَعَ اتِّصَالِهِ بِأَنْفِهِ، وَالتَّطَيُّبُ بِمِائِهِ أَنْ يَمَسَّهُ كَالْعَادَةِ بِأَنْ يَصُبَّهُ عَلَى بَدَنِهِ أَوْ مَلْبُوسِهِ فَلا يَكْفِي شَمُّهُ، وَلا فِدْيَةَ عَلَى الْمُتَطَيِّبِ النَّاسِي لِلإِحْرَامِ وَالْمُكْرَهِ عَلَى التَّطَيُّبِ وَالْجَاهِلِ بِالتَّحْرِيمِ. أَمَّا قَبْلَ الإِحْرَامِ فَقَدْ مَرَّ ذِكْرُ سُنِّيَّةِ التَّطَيُّبِ لِلإِحْرَامِ وَذَلِكَ لِقَوْلِ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا «كُنْتُ أُطَيِّبُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لإِحْرَامِهِ وَلِحِلِّهِ» وَهَذَا لِلنُّسُكِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":706},{"type":"p","text":"   تَنْبِيهٌ. التَّطَيُّبُ لِلْمَرْأَةِ عِنْدَ الْخُرُوجِ مِنَ الْبَيْتِ مَكْرُوهٌ تَنْزِيهًا وَلَيْسَ بِحَرَامٍ إِلَّا أَنْ قَصَدَتِ التَّعَرُّضَ لِلرِّجَالِ فَيَحْرُمُ وَقَدْ وَرَدَ فِي ذَلِكَ حَدِيثٌ صَحِيحٌ وَهُوَ قَوْلُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «أَيُّمَا امْرَأَةٍ خَرَجَتْ مِنْ بَيْتِهَا مُتَعَطِّرَةً فَمَرَّتْ بِقَوْمٍ لِيَجِدُوا ريِحَهَا فَهِيَ زَانِيَة» رَوَاهُ ابْنُ حِبَّانَ فَقَوْلُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لِيَجِدُوا ريِحَهَا» بَيَانٌ مِنْهُ أَنَّهُ لا يَحْرُمُ عَلَى الْمَرْأَةِ خُرُوجُهَا مُتَطَيِّبَةً إِلَّا إِذَا كَانَ قَصْدُهَا ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":707},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَدَهْنُ رَأْسٍ وَلِحْيَةٍ  بِزَيْتٍ أَوْ شَحْمٍ أَوْ شَمْعِ عَسَلٍ ذَائِبَيْنِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":708},{"type":"p","text":"   الشَّرْحُ الثَّانِي مِنْ مُحَرَّمَاتِ الإِحْرَامِ دَهْنُ الرَّأْسِ وَاللِّحْيَةِ بِمَا يُسَمَّى دُهْنًا وَلَوْ غَيْرَ مُطَيَّبٍ سَوَاءٌ كَانَ بِالزَّيْتِ أَوِ السَّمْنِ أَوِ الزُّبْدَةِ أَوْ بِشَحْمٍ أَوْ شَمْعِ عَسَلٍ ذَائِبَيْنِ أَمَّا غَيْرُ ذَلِكَ كَاسْتِعْمَالِ الدُّهْنِ غَيْرِ الْمُطَيَّبِ فِي غَيْرِ شَعَرِ الرَّأْسِ وَاللِّحْيَةِ أَوْ أَكْلِهِ فَلا يَحْرُمُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":709},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِزَالَةُ ظُفْرٍ وَشَعَرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":710},{"type":"p","text":"   الشَّرْحُ الثَّالِثُ مِنْ مُحَرَّمَاتِ الإِحْرَامِ إِزَالَةُ الظُّفْرِ لَكِنَّهُ لا يَحْرُمُ إِزَالَةُ الْمُنْكَسِرِ سَوَاءٌ كَانَ الْمُنْكَسِرُ كُلَّهُ أَمْ بَعْضَهُ أَيْ أَنَّ إِزَالَةَ الظُّفْرِ الْمُنْكَسِرِ لَيْسَ فِيهِ مَعْصِيَةٌ وَلا فِدْيَةٌ سَوَاءٌ كَانَ انْكَسَرَ كُلُّهُ أَوْ بَعْضُهُ إِنْ كَانَ يَتَأَذَّى بِبَاقِيهِ، وَوُجُوبُ الْفِدْيَةِ فِيمَا لَوْ أَزَالَهُ بِدُونِ الْمَنْبِتِ أَمَّا لَوْ أَزَالَهُ مَعَ الْمَنْبِتِ فَلَيْسَ عَلَيْهِ فِدْيَةٌ لَكِنَّهُ يَحْرُمُ إِنْ كَانَ فِيهِ إِضْرَارٌ بِنَفْسِهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":711},{"type":"p","text":"   ثُمَّ إِنَّمَا تَجِبُ الْفِدْيَةُ عَلَى مَنِ انْتَتَفَ شَىْءٌ مِنْ شَعَرِ رَأْسِهِ أَوْ غَيْرِهِ إِنْ عَلِمَ أَنَّهُ انْتَتَفَ بِفِعْلِهِ أَمَّا إِنْ شَكَّ هَلِ انْتَتَفَ بِفِعْلِهِ أَمْ كَانَ مُنْتَتِفًا قَبْلًا فَسَقَطَ مَعَ الْمِشْطِ فَلَيْسَ عَلَيْهِ فِدْيَةٌ. وَيَجُوزُ لِلْمُحْرِمِ أَنْ يَغْسِلَ شَعَرَهُ بِنَحْوِ سِدْرٍ أَوْ صَابُونٍ غَيْرِ مُطَيَّبٍ وَالأَوْلَى تَرْكُ ذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":712},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَجِمَاعٌ وَمُقَدِّمَاتُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":713},{"type":"p","text":"   الشَّرْحُ الرَّابِعُ مِنْ مُحَرَّمَاتِ الإِحْرَامِ الْجِمَاعُ فِي قُبُلٍ أَوْ دُبُرٍ وَلَوْ لِبَهِيمَةٍ. وَيَحْرُمُ عَلَى غَيْرِ الْمُحْرِمَةِ تَمْكِينُ زَوْجِهَا الْمُحْرِمِ مِنَ الْجِمَاعِ أَوْ مِنْ مُقَدِّمَاتِهِ، وَكَذَلِكَ يَحْرُمُ عَلَى الْحَلالِ أَيِ الرَّجُلِ الَّذِي هُوَ غَيْرُ مُحْرِمٍ وَطْءُ حَلِيلَتِهِ الْمُحْرِمَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":714},{"type":"p","text":"   وَأَمَّا الْمُقَدِّمَاتُ كَالْقُبْلَةِ وَالنَّظَرِ وَاللَّمْسِ ِبِشَهْوَةٍ فَهِيَ مُحَرَّمَةٌ عَلَى الْمُحْرِمِ وَيَأْثَمُ وَعَلَيْهِ فِيهَا دَمٌ وَإِنْ لَمْ يُنْزِلِ الْمَنِيَّ إِلَّا النَّظَرَ وَكَذَا الْقُبْلَةُ واللَّمْسُ بِحَائِلٍ فَلا فِدْيَةَ فِيهِمَا$. وَالشَّهْوَةُ هُنَا اشْتِيَاقُ النَّفْسِ وَمَيْلُهَا إِلَى تِلْكَ الْمُحَرَّمَاتِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":715},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَقْدُ النِّكَاحِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":716},{"type":"p","text":"   الشَّرْحُ الْخَامِسُ مِنْ مُحَرَّمَاتِ الإِحْرَامِ عَقْدُ النِّكَاحِ بِنَفْسِهِ أَوْ وَكِيلِهِ وَلا يَصِحُّ ذَلِكَ، فَلَوْ عَقَدَ الْمُحْرِمُ نِكَاحًا لَهُ أَوْ لِغَيْرِهِ كَمَوْلِيَّتِهِ أَوْ وَكَّلَ شَخْصًا بِأَنْ يَعْقِدَ كَانَ ذَلِكَ حَرَامًا وَلا يَنْعَقِدُ ذَلِكَ النِّكَاحُ وَلا يَثْبُتُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":717},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَصَيْدُ مَأْكُولٍ بَرِّيٍّ وَحْشِيٍّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":718},{"type":"p","text":"   الشَّرْحُ السَّادِسُ مِنْ مُحَرَّمَاتِ الإِحْرَامِ الِاصْطِيَادُ أَيِ التَّعَرُّضُ لِصَيْدِ مَأْكُولٍ بَرِّيٍّ وَحْشِيٍّ وَالْمُتَوَلِّدِ مِنْهُ وَلَوْ مَعَ غَيْرِ مَأْكُولٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":719},{"type":"p","text":"   وَلا يَحْرُمُ عَلَى الْمُحْرِمِ بِحَجٍّ أَوْ عُمْرَةٍ اصْطِيَادُ غَيْرِ الْمَأْكُولِ وَالْمُتَوَلِّدِ مِنْهُ، كَذَلِكَ لا يَحْرُمُ اصْطِيَادُ كُلِّ حَيَوَانٍ مُؤْذٍ طَبْعًا أَيِ الَّذِي هُوَ مِنْ طَبِيعَتِهِ الإِيذَاءُ بَلْ يُنْدَبُ قَتْلُهُ كَالْفَأْرَةِ وَالْعَقْرَبِ وَالْحَيَّةِ وَالْحِدَأَةِ [وَهِيَ طَيْرٌ يُشْبِهُ الصَّقْرَ قَدْ يَنْقَضُّ عَلَى حَامِلِ اللَّحْمِ مِنَ الْجَوِّ فَيَخْطُفُهُ مِنْ يَدِهِ وَقَدْ يَجْرَحُهُ] وَالْكَلْبِ الْعَقُورِ. أَمَّا الشَّىْءُ الَّذِي فِيهِ نَفْعٌ وَفِيهِ ضَرَرٌ كَالْفَهْدِ فَهَذَا لا يُسَنُّ قَتْلُهُ وَلا يُكْرَهُ. وَأَمَّا الْحَيَوَانُ الَّذِي لا يَظْهَرُ مِنْهُ نَفْعٌ وَلا ضَرَرٌ كَالسَّرَطَانِ فَقَتْلُهُ مَكْرُوهٌ. وَكَذَلِكَ لا يَحْرُمُ عَلَى الْمُحْرِمِ التَّعَرُّضُ لِلْحَيَوَانِ الْمَأْكُولِ الْبَحْرِيِّ وَهُوَ مَا لا يَعِيشُ فِي غَيْرِ الْمَاءِ وَلَوْ نَحْوَ بِئْرٍ وَلَوْ كَانَ فِي الْحَرَمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":720},{"type":"p","text":"   وَكَمَا يَحْرُمُ التَّعَرُّضُ لَهُ أَيْ لِلْمَأْكُولِ الْبَرِّيِّ الْوَحْشِيِّ يَحْرُمُ التَّعَرُّضُ لِنَحْوِ بَيْضِهِ وَلَبَنِهِ وَسَائِرِ أَجْزَائِهِ كَشَعَرِهِ وَرِيشِهِ. وَإِذَا أَتْلَفَ الْحَيَوَانَ يَدْفَعُ الْمِثْلَ إِنْ كَانَ لَهُ مِثْلٌ فَمَنْ قَتَلَ نَعَامَةً يَدْفَعُ مِثْلَهَا أَيْ مَا يُشْبِهُهَا مِنَ الأَنْعَامِ الثَّلاثَةِ الإِبِلِ وَالْبَقَرِ وَالْغَنَمِ فَمِثْلُ النَّعَامَةِ مِنْ بَيْنِ هَؤُلاءِ الثَّلاثَةِ الإِبِلُ فَيَذْبَحُهُ وَيَدْفَعُهُ لِثَلاثَةٍ مِنْ فُقَرَاءِ الْحَرَمِ فَأَكْثَرَ ثُمَّ هُمْ إِنْ شَاؤُوا يَأْكُلُونَهُ وَإِنْ شَاؤُوا يَبِيعُونَهُ وَيَنْتَفِعُونَ بِالثَّمَنِ. وَالضَّبُعُ مَأْكُولٌ فَمَنْ قَتَلَهُ وَهُوَ مُحْرِمٌ يَدْفَعُ كَبْشًا لِأَنَّهُ مِثْلُهُ مِنَ الأَنْعَامِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":721},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَلَى الرَّجُلِ سَتْرُ رَأْسِهِ وَلُبْسُ مُحِيطٍ بِخِيَاطَةٍ أَوْ لِبْدٍ أَوْ نَحْوِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":722},{"type":"p","text":"   الشَّرْحُ السَّابِعُ مِنْ مُحَرَّمَاتِ الإِحْرَامِ عَلَى الرَّجُلِ الْمُحْرِمِ بِالْحَجِّ أَوِ الْعُمْرَةِ أَوْ إِحْرَامًا مُطْلَقًا إِنْ كَانَ عَامِدًا عَالِمًا بِحُرْمَتِهِ مُخْتَارًا سَتْرُ شَىْءٍ مِنْ رَأْسِهِ وَإِنْ قَلَّ كَالْبَيَاضِ الْمُحَاذِي لِأَعْلَى الأُذُنِ لا الْمُحَاذِي لِشَحْمَةِ الأُذُنِ بِمَا يُعَدُّ سَاتِرًا عُرْفًا بِخِلافِ نَحْوِ خَيْطٍ دَقِيقٍ وَمَا كَانَ قَرِيبًا مِنْهُ. وَلا يَحْرُمُ عَلَى الْمُحْرِمِ وَضْعُ يَدِهِ عَلَى رَأْسِه.ِ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":723},{"type":"p","text":"   وَمِمَّا يَحْرُمُ عَلَى الْمُحْرِمِ لُبْسُ مُحِيطٍ بِخِيَاطَةٍ أَوْ لِبْدٍ أَوْ نَحْوِهِ أَيْ مَا يُحِيطُ بِالْبَدَنِ كُلِّهِ أَوْ بَعْضِهِ بِذَلِكَ وَيَجُوزُ لَهُ أَنْ يَرْبِطَ خَيْطًا عَلَى إِزَارِهِ وَأَنْ يَعْقِدَ هَذَا الْخَيْطَ عَلَى الإِزَارِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":724},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَلى الْمُحْرِمَةِ سَتْرُ وَجْهِهَا وَقُفَّازٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":725},{"type":"p","text":"   الشَّرْحُ الثَّامِنُ مِنْ مُحَرَّمَاتِ الإِحْرَامِ أَنَّهُ يَحْرُمُ عَلَى الْمَرْأَةِ الْمُحْرِمَةِ أَنْ تُغَطِّيَ وَجْهَهَا بِمَا يُعَدُّ سَاتِرًا لا بَقِيَةَ بَدَنِهَا بَلْ يَجِبُ فِيمَا عَدَا الْكَفَّيْنِ سَتْرُهُ وَلَوْ بِمُحِيطٍ لَكِنْ لا يَحْرُمُ أَنْ تَسْتُرَ وَجْهَهَا فِي حَالِ الإِحْرَامِ بِثَوْبٍ مُتَجَافٍ عَنِ الْوَجْهِ بِنَحْوِ خَشَبَةٍ أَيْ بِحَيْثُ يَمْنَعُ لُصُوقَ السَّاتِرِ بِالْوَجْهِ وَلَوْ بِلا حَاجَةٍ كَمَا يَجُوزُ سَتْرُ رَأْسِ الرَّجُلِ بِالْمِظَلَّةِ، وَكَانَتْ أَزْوَاجُ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي سَفَرِ الْحَجِّ إِذَا حَاذَيْنَ الرَّكْبَ أَيِ الرِّجَالَ يَسْتُرْنَ مَعَ الْمُجَافَاةِ أَيْ مِنْ غَيْرِ أَنْ يَلْصَقَ هَذَا السَّاتِرُ بِالْوَجْهِ لِأَنَّ سَتْرَ الْوَجْهِ بِالنِّسْبَةِ لَهُنَّ فَرْضٌ عَلَى الدَّوَامِ بِحَضْرَةِ الأَجَانِبِ، أَمَّا عَلَى غَيْرِهِنَّ فَلَيْسَ فَرْضًا إِنَّمَا الْفَرْضُ سَتْرُ الرَّأْسِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":726},{"type":"p","text":"   أُمَّهَاتُ الْمُؤْمِنِينَ رَضِيَ اللَّهُ عَنْهُنَّ لَهُنَّ أَحْكَامٌ خَصَّهُنَّ اللَّهُ بِهَا دُونَ سَائِرِ الْمُؤْمِنَاتِ فَلا يُقَاسُ غَيْرُهُنَّ عَلَيْهِنَّ فِيهَا وَبَعْضُ مَنِ ادَّعَى الْعِلْمَ أَرَادَ أَنْ يَجْعَلَ نِسَاءَ الْمُؤْمِنِينَ جَمِيعَهُنَّ كَأَزْوَاجِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي وُجُوبِ تَغْطِيَةِ الْوَجْهِ بَعْدَ نُزُولِ ءَايَةِ الْحِجَابِ، وَهَذَا غَابَ عَنْهُ أَنَّ هَذَا الْحُكْمَ خَاصٌّ بِأَزْوَاجِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَمَا قَالَهُ أَبُو دَاوُدَ فِي سُنَنِهِ فَلا يُقَالُ إِنَّهُ يَجِبُ عَلَى كُلِّ مُسْلِمَةٍ تَغْطِيَةُ الْوَجْهِ. الرَّسُولُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي حَجَّةِ الْوَدَاعِ الَّتِي مَا عَاشَ بَعْدَهَا إِلَّا نَحْوَ ثَمَانِينَ يَوْمًا جَاءَتْهُ امْرَأَةٌ يَوْمَ الْعِيدِ وَكَانَتْ شَابَّةً جَمِيلَةً فَجَعَلَتْ تَسْأَلُهُ عَنْ مَسْأَلَةٍ فِي الْحَجِّ قَالَتْ يَا رَسُولَ اللَّهِ إِنَّ أَبِي أَدْرَكَتْهُ فَرِيضَةُ الْحَجِّ وَهُوَ شَيْخٌ كَبِيرٌ لا يَثْبُتُ عَلَى الرَّاحِلَةِ أَفَأَحُجُّ عَنْهُ قَالَ «نَعَمْ» مَا قَالَ لَهَا غَطِّي وَجْهَكِ أَنْتِ شَابَّةٌ جَمِيلَةٌ لا يَجُوزُ لَكِ كَشْفُ وَجْهِكِ، وَهَذَا كَانَ بَعْدَ نُزُولِ ءَايَةِ الْحِجَابِ بِنَحْوِ خَمْسِ سَنَوَاتٍ فَلَيْسَ لِقَائِلٍ أَنْ يَقُولَ مَا كَانَ نَزَلَ الأَمْرُ بِالْحِجَابِ بَعْدُ فَلِذَلِكَ مَا أَمَرَهَا بِسَتْرِ وَجْهِهَا. هَؤُلاءِ النَّاسُ الَّذِينَ يَتَشَدَّدُونَ فِي غَيْرِ مَحَلِّ التَّشَدُّدِ فَيُحَرِّمُونَ مَا لَمْ يُحَرِّمِ اللَّهُ وَيَفْرِضُونَ مَا لَمْ يَفْرِضِ اللَّهُ عَلَى خَلْقِهِ لا تُحْمَدُ عَاقِبَةُ أَمْرِهِمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":727},{"type":"p","text":"   قَالَ بَعْضُ الأَئِمَّةِ الْمَالِكِيِّينَ كَالْقَاضِي عِيَاضٍ وَغَيْرِهِ «لِلْمَرْأَةِ كَشْفُ وَجْهِهَا إِجْمَاعًا وَعَلَى الرِّجَالِ غَضُّ الْبَصَرِ» وَقَدْ نَقَلَ ابْنُ حَجَرٍ الْهَيْتَمِيُّ كَلامَ الْقَاضِي وَأَقَرَّهُ فِي حَاشِيَتِهِ عَلَى إِيضَاحِ النَّوَوِيِّ. وَأَمَّا اسْتِحْبَابُ سَتْرِ الْوَجْهِ مِنْ غَيْرِ وُجُوبٍ فَمَحَلُّ اتِّفَاقٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":728},{"type":"p","text":"   وَمِمَّا يَحْرُمُ عَلَى الْمَرْأَةِ الْمُحْرِمَةِ لُبْسُ قُفَّازٍ وَلَوْ فِي كَفٍّ وَاحِدَةٍ، وَالْقُفَّازُ شَىْءٌ يُعْمَلُ لِلْكَفِّ وَالأَصَابِعِ يُحْشَى بِقُطْنٍ وَيَكُونُ لَهُ أَزْرَارٌ تُزَرُّ عَلَى السَّاعِدِ مِنْ أَجْلِ الْبَرْدِ، وَلا يَحْرُمُ عَلَيْهَا سَتْرُ الْكَفِّ بِغَيْرِ الْقُفَّازِ كَكُمِّهَا وَخِرْقَةٍ وَلَوْ عَقَدَتْهَا عَلَيْهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":729},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَمَنْ فَعَلَ شَيْئًا مِنْ هَذِهِ الْمُحَرَّمَاتِ فَعَلَيْهِ الإِثْمُ وَالْفِدْيَةُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":730},{"type":"p","text":"   الشَّرْحُ فِي الْفِدْيَةِ تَفْصِيلٌ فَالْفِدْيَةُ فِي الطِّيبِ وَالدُّهْنِ وَلُبْسِ الْمُحِيطِ وَإِزَالَةِ الشَّعَرِ وَالأَظْفَارِ وَمُقَدِّمَاتِ الْجِمَاعِ كَالتَّقْبِيلِ بِشَهْوَةٍ وَفِي الْجِمَاعِ الَّذِي لا يُفْسِدُ الْحَجَّ وَهُوَ مَا بَعْدَ فِعْلِ اثْنَيْنِ مِنْ طَوَافِ فَرْضٍ وَحَلْقٍ أَوْ تَقْصِيرٍ وَرَمْيِ جَمْرَةِ الْعَقَبَةِ أَيْ بَعْدَ التَّحَلُّلِ الأَوَّلِ شَاةٌ أَوِ التَّصَدُّقُ بِثَلاثَةِ ءَاصُعٍ لِسِتَّةِ مَسَاكِينَ أَوْ صَوْمُ ثَلاثَةِ أَيَّامٍ وَيُسَمَّى هَذَا دَمَ تَخْيِيرٍ وَتَقْدِيرٍ أَمَّا لَوْ أَزَالَ شَعْرَةً وَاحِدَةً أَوْ ظُفْرًا وَاحِدًا فَعَلَيْهِ مُدٌّ، وَفِي شَعْرَتَيْنِ أَوْ ظُفْرَيْنِ مُدَّانِ، وَفِي ثَلاثَةٍ فَأَكْثَرَ دَمٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":731},{"type":"p","text":"   وَأَمَّا فِدْيَةُ الصَّيْدِ فَإِنْ كَانَ هَذَا الصَّيْدُ لَهُ مِثْلٌ مِنَ الأَنْعَامِ الثَّلاثَةِ فَعَلَيْهِ ذَلِكَ الْمِثْلُ مَعَ تَخْيِيرِهِ بَيْنَ ذَبْحِهِ وَتَوْزِيعِهِ لِفُقَرَاءِ الْحَرَمِ وَبَيْنَ إِعْطَائِهِمْ طَعَامًا بِقِيمَتِهِ أَوْ صَوْمِهِ عَنْ كُلِّ مُدٍّ يَوْمًا، وَيُسَمَّى ذَلِكَ دَمَ تَخْيِيرٍ وَتَعْدِيلٍ لِأَنَّ فِيهِ اعْتِبَارَ الْقِيمَةِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":732},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَزِيدُ الْجِمَاعُ بِالإِفْسَادِ وَوُجُوبِ الْقَضَاءِ فَوْرًا وَإِتْمَامِ الْفَاسِدِ فَمَنْ أَفْسَدَ حَجَّهُ بِالْجِمَاعِ يَمْضِي فِيهِ وَلا يَقْطَعُهُ ثُمَّ يَقْضِي فِي السَّنَةِ الْقَابِلَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":733},{"type":"p","text":"   الشَّرْحُ أَنَّ ثُبُوتَ فَسَادِ الْحَجِّ وَوُجُوبَ الْقَضَاءِ فَوْرًا وَلُزُومَ إِتْمَامِ هَذَا النُّسُكِ الْفَاسِدِ هَذِهِ الأَحْكَامُ خَاصَّةٌ بِالإِفْسَادِ بِالْجِمَاعِ قَبْلَ التَّحَلُّلَيْنِ أَيْ قَبْلَ فِعْلِ اثْنَيْنِ مِنَ الثَّلاثَةِ الْمَذْكُورَةِ، وَشَرْطُ ذَلِكَ أَنْ يَكُونَ عَالِمًا بِحُرْمَةِ ذَلِكَ وَمُخْتَارًا أَيْ غَيْرَ مُكْرَهٍ وَمُتَعَمِّدًا أَيْ غَيْرَ نَاسٍ لِلإِحْرَامِ فَأَمَّا الْجَاهِلُ بِحُرْمَةِ الْجِمَاعِ فِي الإِحْرَامِ لِكَوْنِهِ بَعِيدًا مِنَ الْعُلَمَاءِ مَثَلًا فَلا يَفْسُدُ حَجُّهُ، وَهَذَا الْحُكْمُ يَثْبُتُ وَلَوْ كَانَ ذَلِكَ النُّسُكُ تَطَوُّعًا عَنِ الْغَيْرِ. وَلا فَرْقَ فِي وُجُوبِ الْقَضَاءِ عَلَى هَذَا الْمُفْسِدِ بَيْنَ الْحُرِّ وَالْعَبْدِ وَالْبَالِغِ وَالصَّغِيرِ [وَيَصِحُّ مِنْهُ الْقَضَاءُ فِي حَالِ الصِّبَا عَلَى الأَصَحِّ بِاتِّفَاقِ الأَصْحَابِ كَمَا فِي الْمَجْمُوعِ]. وَلَوْ أَحْرَمَ بِالْحَجِّ عَشْرَ مَرَّاتٍ وَأَفْسَدَ الْجَمِيعَ بِمَا ذُكِرَ لَمْ يَلْزَمْهُ إِلَّا قَضَاءٌ وَاحِدٌ عَنِ الأَوَّلِ لَكِنْ تَلْزَمُهُ عَشْرُ كَفَّارَاتٍ، وَالْكَفَّارَةُ هِيَ بَدَنَةٌ أَيْ ذَبْحُ إِبِلٍ فَبَقَرَةٌ فَسَبْعُ شِيَاهٍ مِمَّا يَصِحُّ لِلأُضْحِيَّةِ فَإِطْعَامٌ بِقِيمَةِ الْبَدَنَةِ أَيْ تَوْزِيعُ الطَّعَامِ مِمَّا هُوَ غَالِبُ قُوتِ أَهْلِ الْحَرَمِ فَالصِّيَامُ بِعَدَدِ الأَمْدَادِ فَإِنِ انْكَسَرَ مُدٌّ أَكْمَلَهُ بِصَوْمِ يَوْمٍ، هَذِهِ الْكَفَّارَةُ تَلْزَمُهُ لِكُلِّ وَاحِدٍ مِنَ الْعَشَرَةِ. فَإِنْ كَانَ قَارِنًا وَأَفْسَدَ نُسُكَهُ بِالْجِمَاعِ أَحْرَمَ بِالْعُمْرَةِ عَقِبَ النَّفْرِ مِنْ مِنًى فَإِنَّهُ يَجِبُ عَلَيْهِ الْفَوْرُ فِي قَضَائِهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":734},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ أَنْ يُحْرِمَ مِنَ الْمِيقَاتِ، وَالْمِيقَاتُ هُوَ الْمَوْضِعُ الَّذِي عَيَّنَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِيُحْرَمَ مِنْهُ كَالأَرْضِ الَّتِي تُسَمَّى ذَا الْحُلَيْفَةِ لِأَهْلِ الْمَدِينَةِ وَمَنْ يَمُرُّ بِطَرِيقِهِمْ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":735},{"type":"p","text":"   الشَّرْحُ هَذَا شُرُوعٌ فِي الْوَاجِبَاتِ وَهِيَ فِي بَابِ الْحَجِّ مَا يُجْبَرُ بِدَمٍ وَلا يَفْسُدُ النُّسُكُ بِتَرْكِهِ وَأَمَّا الرُّكْنُ فَهُوَ مَا لا يَصِحُّ الْحَجُّ بِدُونِهِ. وَاعْلَمْ أَنَّهُ لا فَرْقَ بَيْنَ الْفَرْضِ وَالْوَاجِبِ فِي غَيْرِ بَابِ الْحَجِّ عِنْدَ الشَّافِعِيَّةِ وَغَيْرِهِم إِلَّا الْحَنَفِيَّةَ. وَهِيَ أَيْ وَاجِبَاتُ الْحَجِّ أُمُورٌ مِنْهَا الإِحْرَامُ مِنَ الْمِيقَاتِ فَمِيقَاتُ مَنْ لَمْ يَكُنْ بِمَكَّةَ خَمْسَةُ أَمَاكِنَ مِيقَاتُ أَهْلِ الْمَدِينَةِ وَمَنْ يَمُرُّ بِطَرِيقِهِمْ إِلَى مَكَّةَ هُوَ ذُو الْحُلَيْفَةِ وَبِهَا الْيَوْمَ مَسْجِدٌ كَبِيرٌ، وَمِيقَاتُ أَهْلِ الشَّامِ وَمِصْرَ وَالْمَغْرِبِ وَمَنْ يَمُرُّ بِطَرِيقِهِمْ هُوَ الْجُحْفَةُ، وَمِيقَاتُ أَهْلِ نَجْدِ الْحِجَازِ وَنَجْدِ الْيَمَنِ قَرْنُ الثَّعَالِبِ وَهُوَ عَلَى مَرْحَلَتَيْنِ مِنْ مَكَّةَ، وَمِيقَاتُ أَهْلِ تِهَامَةِ الْيَمَنِ وَمَنْ يَمُرُّ بِطَرِيقِهِمْ يَلَمْلَمْ وَيُقَالُ لَهُ أَلَمْلَمْ، وَمِيقَاتُ أَهْلِ الْعِرَاقِ وَمَنْ يَمُرُّ بِطَرِيقِهِمْ ذَاتُ عِرْقٍ. وَلا يَجُوزُ مُجَاوَزَتُهَا بِلا إِحْرَامٍ. وَلَوْ مَرَّ مِنْ مِيقَاتِ غَيْرِ بَلَدِهِ لا يَجُوزُ لَهُ تَأْخِيرُ إِحْرَامِهِ إِلَى أَنْ يَأْتِيَ إِلَى مِيقَاتِ بَلَدِهِ. وَمَنْ جَاوَزَ أَحَدَ الْمَوَاقِيتِ إِلَى جِهَةِ مَكَّةَ مُرِيدًا النُّسُكَ وَلَوْ فِي الْعَامِ الْقَابِلِ بِلا إِحْرَامٍ وَلَيْسَ فِي نِيَّتِهِ الْعَوْدُ إِلَيْهِ قَبْلَ التَّلَبُّسِ بِالنُّسُكِ عَصَى وَوَجَبَ عَلَيْهِ الدَّمُ فَإِنْ عَادَ قَبْلَ التَّلَبُّسِ بِنُسُكٍ كَطَوَافِ الْقُدُومِ سَقَطَ عَنْهُ الدَّمُ. أَمَّا مَنْ جَاوَزَ الْمِيقَاتَ وَهُوَ غَيْرُ مُرِيدٍ لِلنُّسُكِ ثُمَّ بَدَا لَهُ أَنْ يَعْمَلَ النُّسُكَ فَمِيقَاتُهُ مَحَلُّهُ كَأَنْ جَاءَ مِنْ مِصْرَ أَوِ الشَّامِ إِلَى جُدَّةَ بِنِيَّةِ زِيَارَةِ قَرِيبٍ أَوْ صَدِيقٍ أَوْ نَحْوِ ذَلِكَ ثُمَّ حَصَلَتْ لَهُ نِيَّةُ النُّسُكِ فَمِيقَاتُهُ جُدَّة.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":736},{"type":"p","text":"   وَمِيقَاتُ الْمَكِّيِّ لِلْحَجِّ مَكَّةُ أَيْ يُحْرِمُ مِنْهَا لِلْحَجِّ وَأَمَّا لِلْعُمْرَةِ فَمِيقَاتُهُ مَا كَانَ خَارِجَ حُدُودِ الْحَرَمِ مِنْ أَيِّ جِهَةٍ كَانَ فَلا يَجُوزُ لِلْمَكِّيِّ أَنْ يُحْرِمَ لِلْعُمْرَةِ مِنْ مَكَّةَ بَلْ يَخْرُجُ إِلَى أَدْنَى الْحِلِّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":737},{"type":"note","text":"   وَهَذِهِ الْمَوَاقِيتُ تُسَمَّى الْمِيقَاتَ الْمَكَانِيَّ. أَمَّا الْمِيقَاتُ الزَّمَانِيُّ فَهُوَ لِلْحَجِّ شَوَّالٌ وَذُو الْقَعْدَةِ وَذُو الْحِجَّةِ كَمَا تَقَدَّمَ، قَالَ اللَّهُ تَعَالَى ﴿الْحَجُّ أَشْهُرٌ مَّعْلُومَاتٌ﴾ [سُورَةَ الْبَقَرَة/197] وَالْقَدْرُ الَّذِي هُوَ مِيقَاتٌ زَمَانِيٌّ مِنْ شَهْرِ ذِي الْحِجَّةِ هُوَ مِنْ أَوَّلِهِ إِلَى فَجْرِ لَيْلَةِ الْعِيدِ فَبِانْتِهَاءِ لَيْلَةِ الْعِيدِ يَفُوتُ الْمِيقَاتُ الزَّمَانِيُّ لِلْحَجِّ، وَأَمَّا الْعُمْرَةُ فَمِيقَاتُهَا الزَّمَانِيُّ الأَبَدُ.","style":"footnote text","align":"justify","bold":true,"size":18.0,"index":738},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَفِي الْحَجِّ مَبِيتُ مُزْدَلِفَةَ عَلَى قَوْلٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":739},{"type":"p","text":"   الشَّرْحُ مِنْ وَاجِبَاتِ الْحَجِّ فَقَطْ دُونَ الْعُمْرَةِ مَبِيتُ الْحَاجِّ أَيْ مُرُورُهُ فِي شَىْءٍ مِنْ أَرْضِ مُزْدَلِفَةَ بَعْدَ نِصْفِ لَيْلَةِ النَّحْرِ وَلَوْ لَحْظَةً وَنَائِمًا. وَلِلإِمَامِ الشَّافِعِيِّ قَوْلٌ بِأَنَّ الْمَبِيتَ بِمُزْدَلِفَةَ سُنَّةٌ لَيْسَ وَاجِبًا فَعَلَى هَذَا الْقَوْلِ تَارِكُهُ لَيْسَ عَلَيْهِ إِثْمٌ وَلا دَمٌ، وَيَجُوزُ الْعَمَلُ بِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":740},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنًى عَلَى قَوْلٍ وَلا يَجِبَانِ عَلَى قَوْلٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":741},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ وَاجِبَاتِ الْحَجِّ الْمَبِيتَ بِمِنًى، وَلَيْسَ الْمُرَادُ جَمِيعَ اللَّيْلِ بَلِ الْمُرَادُ أَنْ يَكُونَ هُنَاكَ مُعْظَمَ اللَّيْلِ أَيْ لَيْلَةِ الْيَوْمِ الأَوَّلِ مِنْ أَيَّامِ التَّشْرِيقِ وَلَيْلَةِ الثَّانِي فَإِنْ خَرَجَ مِنْ مِنًى فِي الْيَوْمِ الثَّانِي قَبْلَ الْغُرُوبِ سَقَطَ عَنْهُ مَبِيتُ وَرَمْيُ الْيَوْمِ الثَّالِثِ أَمَّا مَنْ لَمْ يَخْرُجْ مِنْهَا فَأَدْرَكَهُ غُرُوبُ لَيْلَةِ ثَالِثِ التَّشْرِيقِ وَهُوَ بِمِنًى وَجَبَ عَلَيْهِ الْمَبِيتُ بِهَا وَرَمْيُ الْيَوْمِ الثَّالِثِ، وَيُشْتَرَطُ أَنْ يَكُونَ هَذَا النَّفْرُ أَيْ مُغَادَرَةُ مِنًى بَعْدَ الزَّوَالِ وَقَبْلَ الْمَغْرِبِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":742},{"type":"p","text":"   وَهَذَا الْمَبِيتُ فِيهِ قَوْلٌ لِلإِمَامِ الشَّافِعِيِّ أَنَّهُ سُنَّةٌ لَيْسَ وَاجِبًا فَعَلَى قَوْلِ عَدَمِ الْوُجُوبِ لا إِثْمَ عَلَى مَنْ تَرَكَ الْمَبِيتَ وَلا دَمَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":743},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَرَمْيُ جَمْرَةِ الْعَقَبَةِ يَوْمَ النَّحْرِ وَرَمْيُ الْجَمَرَاتِ الثَّلاثِ أَيَّامَ التَّشْرِيقِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":744},{"type":"p","text":"   الشَّرْحُ مِنْ وَاجِبَاتِ الْحَجِّ رَمْيُ جَمْرَةِ الْعَقَبَةِ وَحْدَهَا يَوْمَ النَّحْرِ بِسَبْعِ حَصَيَاتٍ وَهِيَ أَقْرَبُ الثَّلاثِ إِلَى مَكَّةَ وَيَدْخُلُ وَقْتُ هَذَا الرَّمْيِ بِنِصْفِ اللَّيْلِ وَيَبْقَى إِلَى ءَاخِرِ أَيَّامِ التَّشْرِيقِ، وَيَجِبُ رَمْيُ الْجَمَرَاتِ الثَّلاثِ جَمْرَةِ الْعَقَبَةِ وَاللَّتَيْنِ قَبْلَهَا أَيَّامَ التَّشْرِيقِ بَعْدَ الزَّوَالِ كُلِّ وَاحِدَةٍ سَبْعًا. وَالرَّمْيُ لا خِلافَ فِي وُجُوبِهِ. وَيُشْتَرَطُ لِصِحَّةِ الرَّمْيِ تَرْتِيبُ الْجَمَرَاتِ فِي أَيَّامِ التَّشْرِيقِ فَيَبْدَأُ بِالْجَمْرَةِ الَّتِي تَلِي مَسْجِدَ الْخَيْفِ ثُمَّ يَرْمِي الَّتِي تَلِيهَا وَهِيَ الْوُسْطَى ثُمَّ يَخْتِمُ بِجَمْرَةِ الْعَقَبَةِ الَّتِي رَمَاهَا الْحَاجُّ يَوْمَ الْعِيدِ. وَيُشْتَرَطُ كَوْنُ الْمَرْمِيِّ بِهِ حَجَرًا وَلَوْ يَاقُوتًا، وَأَنْ يُسَمَّى رَمْيًا فَلا يَكْفِي الْوَضْعُ، وَكَوْنُهُ بِالْيَدِ لا بِنَحْوِ رِجْلٍ وَقَوْسٍ مَعَ الْقُدْرَةِ عَلَى الرَّمْيِ بِالْيَدِ، وَعَدَمُ الصَّارِفِ أَيْ أَنْ لا يَنْوِيَ بِهَذَا الرَّمْيِ غَيْرَهُ، وَقَصْدُ الْمَرْمَى فَلَوْ قَصَدَ غَيْرَهُ كَأَنْ قَصَدَ رَمْيَ حَيَّةٍ لَمْ يَصِحَّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":745},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَطَوَافُ الْوَدَاعِ عَلَى قَوْلٍ فِي الْمَذْهَبِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":746},{"type":"p","text":"   الشَّرْحُ هَذَا مِمَّا يَجِبُ عَلَى الْمُعْتَمِرِ وَالْحَاجِّ إِذَا أَرَادَ مُفَارَقَةَ مِنًى عَقِبَ النَّفْرِ إِلَى مَسَافَةِ قَصْرٍ أَوْ إِلَى وَطَنِهِ أَوْ مَا يُرِيدُ تَوَطُّنَهُ وَلِلشَّافِعِيِّ قَوْلٌ بِعَدَمِ وُجُوبِهِ وَعَلَيْهِ فَلا إِثْمَ عَلَى تَارِكِهِ وَلا دَمَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":747},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَهَذِهِ الأُمُورُ السِّتَّةُ مَنْ لَمْ يَأْتِ بِهَا لا يَفْسُدُ حَجُّهُ إِنَّمَا يَكُونُ عَلَيْهِ إِثْمٌ وَفِدْيَةٌ بِخِلافِ الأَرْكَانِ الَّتِي مَرَّ ذِكْرُهَا فَإِنَّ الْحَجَّ لا يَحْصُلُ بِدُونِهَا وَمَنْ تَرَكَهَا لا يَجْبُرُهُ دَمٌ أَيْ ذَبْحُ شَاةٍ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":748},{"type":"p","text":"   الشَّرْحُ يَجِبُ بِتَرْكِ الإِحْرَامِ مِنَ الْمِيقَاتِ وَمَا بَعْدَ ذَلِكَ مِنَ الْوَاجِبَاتِ دَمٌ وَهُوَ شَاةٌ فَإِنْ عَجَزَ فَصِيَامُ عَشَرَةِ أَيَّامٍ ثَلاثَةٍ فِي الْحَجِّ أَيْ فِي إِحْرَامِ الْحَجِّ وَسَبْعَةٍ إِذَا رَجَعَ إِلَى أَهْلِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":749},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَحْرُمُ صَيْدُ الْحَرَمَيْنِ وَنَبَاتُهُمَا عَلَى مُحْرِمٍ وَحَلالٍ وَتَزِيدُ مَكَّةُ بِوُجُوبِ الْفِدْيَةِ فَلا فِدْيَةَ فِي صَيْدِ حَرَمِ الْمَدِينَةِ وَقَطْعِ نَبَاتِهَا. وَحَرَمُ الْمَدِينَةِ مَا بَيْنَ جَبَلِ عَيْرٍ وَجَبَلِ ثَوْرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":750},{"type":"p","text":"   الشَّرْحُ مِنْ أَحْكَامِ الْحَرَمَيْنِ الْحَرَمِ الْمَكِّيِّ وَالْحَرَمِ الْمَدَنِيِّ حُرْمَةُ الصَّيْدِ وَحُرْمَةُ قَطْعِ الشَّجَرِ أَوْ قَلْعِهِ وَوُجُوبُ الْفِدْيَةِ فِي الصَّيْدِ وَالشَّجَرِ، لَكِنْ وُجُوبُ الْفِدْيَةِ خَاصٌّ بِحَرَمِ مَكَّةَ أَمَّا حَرَمُ الْمَدِينَةِ فَيَحْرُمُ صَيْدُهُ وَشَجَرُهُ لَكِنْ بِلا فِدْيَةٍ، وَكَذَلِكَ وَجُّ الطَّائِفِ وَهُوَ وَادٍ بِالطَّائِفِ فَلا فِدْيَةَ فِي صَيْدِهِ وَشَجَرِهِ مَعَ حُرْمَةِ ذَلِكَ لِوُرُودِ حَدِيثٍ فِيهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":751},{"type":"p","text":"   أَمَّا بَيْتُ الْمَقْدِسِ فَلَيْسَ لَهُ هَذَا الْحُكْمُ وَلا يُسَمَّى حَرَمًا كَمَا شَاعَ عَلَى أَفْوَاهِ النَّاسِ وَإِنَّمَا هُوَ مَسْجِدٌ لَهُ الأَفْضَلِيَّةُ بَعْدَ الْمَسْجِدِ الْحَرَامِ وَالْمَسْجِدِ النَّبَوِيِّ لِأَنَّ الصَّلاةَ فِيهِ بِخَمْسِمِائَةِ صَلاةٍ وَغَيْرُهُ مِنَ الْمَسَاجِدِ سِوَى حَرَمِ مَكَّةَ وَالْمَسْجِدِ النَّبَوِيِّ لَيْسَ لَهُ هَذِهِ الْمَزِيَّةُ أَيْ مُضَاعَفَةُ ثَوَابِ الصَّلاةِ فِيهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":752},{"type":"p","text":"   وَأَمَّا صَيْدُ مَكَّةَ وَشَجَرُهَا فَفِيهِ فِدْيَةٌ أَيْ ضَمَانٌ فَمَنْ قَتَلَ صَيْدًا مِنْ صَيْدِ حَرَمِ مَكَّةَ فَإِنْ كَانَ لَهُ مِثْلٌ أَيْ شَبِيهٌ فِي الإِبِلِ وَالْبَقَرِ وَالْغَنَمِ فَعَلَيْهِ أَنْ يَذْبَحَ ذَلِكَ الْمِثْلَ وَيُوَزِّعَهُ لِفُقَرَاءِ الْحَرَمِ أَوْ يُطْعِمَ بِقِيمَةِ الْمِثْلِ أَوْ يَصُومَ عَنْ كُلِّ مُدٍّ يَوْمًا، وَلا يَكْفِي ذَبْحُهُ بِغَيْرِ أَرْضِ الْحَرَمِ الشَّامِلِ لِمَكَّةَ وَمَا يَلِيهَا مِنْ جَمِيعِ جَوَانِبِهَا مِنْ كُلِّ مَا دَخَلَ فِي حُدُودِ الْحَرَمِ [وَلا يَجُوزُ تَوْزِيعُ الدِّمَاءِ عَلَى غَيْرِ فُقَرَاءِ الْحَرَمِ].","style":"Normal","align":"justify","bold":false,"size":18.0,"index":753},{"type":"p","text":"   وَأَمَّا حُكْمُ قَطْعِ شَجَرَةِ الْحَرَمِ فَفِي الْكَبِيرَةِ بَدَنَةٌ، وَفِي الصَّغِيرَةِ الَّتِي تُقَارِبُ سُبُعَ الْكَبِيرَةِ شَاةٌ، وَفِي مَا دُونَ ذَلِكَ قِيمَتُهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":754},{"type":"heading","text":"خَاتِمَةٌ فِي زِيَارَةِ قَبْرِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","style":"Normal","align":"center","bold":true,"size":18.0,"index":755},{"type":"blank","text":""},{"type":"p","text":"   تُسَنُّ زِيَارَةُ قَبْرِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِالإِجْمَاعِ أَيْ إِجْمَاعِ أَئِمَّةِ الِاجْتِهَادِ الأَرْبَعَةِ وَغَيْرِهِمْ لِلْمُقِيمِ بِالْمَدِينَةِ وَلِأَهْلِ الآفَاقِ الْقَاصِدِينَ بِسَفَرِهِمْ زِيَارَةَ قَبْرِهِ الشَّرِيفِ. وَهِيَ مِنَ الْقُرَبِ الْعَظِيمَةِ فَمَنْ خَصَّ مَشْرُوعِيَّةَ زِيَارَةِ قَبْرِهِ لِغَيْرِ الْقَاصِدِ بِالسَّفَرِ وَحَرَّمَ السَّفَرَ لِزِيَارَةِ قَبْرِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَلا يَجُوزُ الْعَمَلُ بِكَلامِهِ بَلْ يَجِبُ نَبْذُهُ وَالإِعْرَاضُ عَنْهُ. وَقَدْ رَوَى الْحَاكِمُ فِي الْمُسْتَدْرَكِ مِنْ حَدِيثِ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «لَيَهْبِطَنَّ عِيسَى ابْنُ مَرْيَمَ حَكَمًا مُقْسِطًا وَلَيَسْلُكَنَّ فَجًّا حَاجًّا أَوْ مُعْتَمِرًا وَلَيَأْتِيَنَّ قَبْرِي حَتَّى يُسَلِّمَ عَلَيَّ وَلَأَرُدَنَّ عَلَيْهِ» صَحَّحَهُ الْحَاكِمُ وَوَافَقَهُ الذَّهَبِيُّ وَرَوَاهُ ابْنُ عَسَاكِرَ بِلَفْظِ «فَلَيَسْلُكَنَّ فَجَّ الرَّوْحَاءِ». ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":757},{"type":"p","text":"   وَلَيْسَ لِلْمَانِعِينَ مِنَ السَّفَرِ لِزِيَارَةِ قَبْرِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُتَمَسَّكٌ فِي حَدِيثِ «لا تُشَدُّ الرِّحَالُ إِلَّا إِلَى ثَلاثَةِ مَسَاجِدَ الْمَسْجِدِ الْحَرَامِ وَالْمَسْجِدِ الأَقْصَى وَمَسْجِدِي هَذَا» لِأَنَّ هَذَا الْحَدِيثَ مَخْصُوصٌ بِالْمَسَاجِدِ أَيْ لا مَزِيَّةَ فِي السَّفَرِ إِلَى مَسْجِدٍ لِلصَّلاةِ فِيهِ إِلَّا فِي السَّفَرِ إِلَى أَحَدِ هَذِهِ الْمَسَاجِدِ الثَّلاثَةِ لِأَنَّ تِلْكَ الْمُضَاعَفَةَ إِلَى مِائَةِ أَلْفٍ وَأَلْفٍ وَخَمْسِمِائَةٍ خَاصَّةٌ بِهَا فَمَنْ سَافَرَ لِلصَّلاةِ إِلَى أَحَدِهَا حَصَلَ عَلَى الْمُضَاعَفَةِ الَّتِي لا تَحْصُلُ فِي مَسْجِدِ بَلَدِهِ فَلا مَزِيَّةَ فِي السَّفَرِ إِلَى مَسْجِدٍ غَيْرِهَا كَمَا يُؤْخَذُ ذَلِكَ مِنْ رِوَايَةِ الإِمَامِ أَحْمَدَ فِي مُسْنَدِهِ مِنْ طَرِيقِ شَهْرِ بنِ حَوْشَبٍ أَنَّهُ قَالَ ذَكَرْتُ عِنْدَ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللَّهُ عَنْهُ الصَّلاةَ فِي الطُّورِ فَقَالَ أَبُو سَعِيدٍ إِنِّي سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ «لا يَنْبَغِي لِلْمَطِيِّ أَنْ تُعْمَلَ إِلَى مَسْجِدٍ تُبْتَغَى فِيهِ الصَّلاةُ غَيْرِ الْمَسْجِدِ الْحَرَامِ وَالْمَسْجِدِ الأَقْصَى وَمَسْجِدِي» فَبِهَذَا الْحَدِيثِ يُفَسَّرُ حَدِيثُ «لا تُشَدُّ الرِّحَالُ إِلَّا إِلَى ثَلاثَةِ مَسَاجِدَ» لا بِقَوْلِ ابْنِ تَيْمِيَةَ فَإِنَّهُ احْتَجَّ بِهَذَا الْحَدِيثِ عَلَى تَحْرِيمِ السَّفَرِ لِزِيَارَةِ قَبْرِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، قَالَ الْحَافِظُ ابْنُ حَجَرٍ «وَهَذَا مِنْ أَبْشَعِ الْمَسَائِلِ الْمَنْقُولَةِ عَنْهُ» أَيْ ابْنِ تَيْمِيَةَ. وَخَيْرُ مَا يُفَسَّرُ بِهِ الْحَدِيثُ الْحَدِيثُ قَالَ الْحَافِظُ الْعِرَاقِيُّ فِي أَلْفِيَّتِهِ مِنَ الرِّجْزِ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":758},{"type":"blank","text":""},{"type":"heading","text":"«وَخَيْرُ مَا فَسَّرْتَهُ بِالْوَارِدِ»","style":"Normal","align":"center","bold":true,"size":18.0,"index":760},{"type":"blank","text":""}]},{"id":"transactions","title":"كِتَابُ الْمُعَامَلاتِ","description":"أحكام البيع والمعاملات والطلاق والخلع والربا والنفقة وغيرها.","icon":"fa-scale-balanced","start":762,"end":884,"paragraphCount":116,"wordCount":6142,"readMinutes":35,"blocks":[{"type":"heading","text":"كِتَابُ الْمُعَامَلاتِ","style":"Normal","align":"center","bold":true,"size":18.0,"index":762},{"type":"blank","text":""},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فصلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":764},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَهَمِيَّةِ تَعَلُّمِ أَحْكَامِ الْبَيْعِ وَغَيْرِهِ مِنَ الْمُعَامَلاتِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":765},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ عَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ أَنْ لا يَدْخُلَ فِي شَىْءٍ حَتَّى يَعْلَمَ مَا أَحَلَّ اللَّهُ تَعَالَى مِنْهُ وَمَا حَرَّمَ لِأَنَّ اللَّهَ سُبْحَانَهُ تَعَبَّدَنَا أَيْ كَلَّفَنَا بِأَشْيَاءَ فَلا بُدَّ مِنْ مُرَاعَاةِ مَا تَعَبَّدَنَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":766},{"type":"p","text":"   الشَّرْحُ عَلَى الْعَبْدِ أَنْ يُطِيعَ خَالِقَهُ بِأَدَاءِ مَا أَمَرَ بِهِ وَاجْتِنَابِ مَا نَهَى عَنْهُ لِأَنَّهُ أَهْلٌ [أَيْ يَسْتَحِقُّ] لِأَنْ يُطَاعَ، وَسَوَاءٌ فِي ذَلِكَ مَا عُقِلَتِ الْحِكْمَةُ فِيهِ لَنَا وَمَا لَمْ تُعْقَلِ الْحِكْمَةُ فِيهِ لَنَا لِأَنَّ بَعْضَ مَا تَعَبَّدَنَا بِهِ مَعْقُولُ الْمَعْنَى لَنَا وَبَعْضًا غَيْرُ مَعْقُولِ الْمَعْنَى لَنَا، وَذَلِكَ ابْتِلاءٌ مِنْهُ لِعِبَادِهِ وَاخْتِبَارٌ لِأَنَّهُ مَنْ سَلَّمَ لِلَّهِ فِي كُلِّ شَىْءٍ فَهُوَ الْعَبْدُ الْمُطِيعُ الْمُسْرِعُ فِي الطَّاعَةِ وَمَنْ لَمْ يَكُنْ كَذَلِكَ فَلَيْسَ كَامِلَ الطَّاعَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":767},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَدْ أَحَلَّ الْبَيْعَ وَحَرَّمَ الرِّبَا وَقَدْ قَيَّدَ الشَّرْعُ هَذَا الْبَيْعَ بِآلَةِ التَّعْرِيفِ لِأَنَّهُ لا يَحِلُّ كُلُّ بَيْعٍ إِلَّا مَا اسْتَوْفَى الشُّرُوطَ وَالأَرْكَانَ فَلا بُدَّ مِنْ مُرَاعَاتِهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":768},{"type":"p","text":"   الشَّرْحُ أَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لَمَّا ذَكَرَ فِي كِتَابِهِ الْبَيْعَ الَّذِي أَحَلَّهُ وَعَرَّفَهُ بِأَدَاةِ التَّعْرِيفِ وَهِيَ الِ الْعَهْدِيَّةِ أَيِ الَّتِي تُفِيدُ أَنَّ الْبَيْعَ الَّذِي أَحَلَّهُ هُوَ الْبَيْعُ الْمَعْهُودُ فِي شَرْعِهِ بِالْحِلِّ وَجَبَ عَلَى مُتَعَاطِي الْبَيْعِ وَالشِّرَاءِ مَعْرِفَةُ مَا أَحَلَّ اللَّهُ مِنْ ذَلِكَ لِأَنَّهُ بِدُونِ هَذِهِ الْمَعْرِفَةِ لا يَأْمَنُ عَلَى نَفْسِهِ مِنَ الْوُقُوعِ فِي الْبَيْعِ الَّذِي لَمْ يُحِلَّهُ اللَّهُ. فَمِنْ شُرُوطِ جَوَازِ الْبَيْعِ أَيْ صِحَّتِهِ أَنْ يَكُونَ الْعِوَضَانِ أَيِ الْمَبِيعُ وَالثَّمَنُ مُبَاحَيْنِ فِي الشَّرْعِ فَلا يَجُوزُ بَيْعُ الْمُحَرَّمِ كَبَيْعِ نَجِسِ الْعَيْنِ كَالدَّمِ وَلَحْمِ الْمَيْتَةِ وَسَائِرِ أَجْزَائِهَا مِنْ عَظْمٍ وَشَعَرٍ وَغَيْرِ ذَلِكَ. وَمِنْهَا أَنْ يَكُونَ الْبَيْعُ غَيْرَ مُوَقَّتٍ أَوْ مُعَلَّقٍ فَلا يَصِحُّ أَنْ يَقُولَ لَهُ بِعْتُكَ هَذَا الْغَرَضَ لِسَنَةٍ أَوْ أَنْ يَقُولَ لَهُ إِنْ جَاءَ أَبِي مِنْ سَفَرِهِ فَقَدْ بِعْتُكَ هَذَا الْكِتَابَ، وَمِنْهَا أَنْ يَكُونَ الْمَعْقُودُ عَلَيْهِ أَيْ كُلٌّ مِنَ الثَّمَنِ وَالْمُثْمَنِ طَاهِرًا وَأَنْ يَكُونَ مَعْلُومًا، وَأَنْ يَكُونَ الْبَائِعُ قَادِرًا عَلَى تَسْلِيمِهِ، وَأَنْ لا يَكُونَ مَعْدُومًا كَبِنَاءٍ لَمْ يُبْنَ بَعْدُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":769},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَعَلَى مَنْ أَرَادَ الْبَيْعَ وَالشِّرَاءَ أَنْ يَتَعَلَّمَ ذَلِكَ وَإِلَّا أَكَلَ الرِّبَا شَاءَ أَمْ أَبَى. وَقَدْ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «التَّاجِرُ الصَّدُوقُ يُحْشَرُ يَوْمَ الْقِيَامَةِ مَعَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ» وَمَا ذَاكَ إِلَّا لِأَجْلِ مَا يَلْقَاهُ مِنْ مُجَاهَدَةِ نَفْسِهِ وَهَوَاهُ وَقَهْرِهَا عَلَى إِجْرَاءِ الْعُقُودِ عَلَى الطَّرِيقِ الشَّرْعِيِّ وَإِلَّا فَلا يَخْفَى مَا تَوَعَّدَ اللَّهُ مَنْ تَعَدَّى الْحُدُودَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":770},{"type":"p","text":"   الشَّرْحُ لَمَّا ذَكَرَ اللَّهُ تَبَارَكَ وَتَعَالَى إِحْلالَهُ الْبَيْعَ وَتَحْرِيمَهُ الرِّبَا عَلِمْنَا أَنَّهُ لَيْسَ كُلُّ بَيْعٍ حَلالًا وَأَنَّ السَّبِيلَ لِتَجَنُّبِ الْحَرَامِ وَمُوَافَقَةِ الأَحْكَامِ الشَّرْعِيَّةِ الْمُتَعَلِّقَةِ بِالْبَيْعِ وَالشِّرَاءِ وَمَا يَتْبَعُ ذَلِكَ التَّفَقُّهُ فِي دِينِهِ لِأَنَّ مَنْ لَمْ يَتَعَلَّمْ مَا يَتَعَلَّقُ بِذَلِكَ مِنَ الأَحْكَامِ الشَّرْعِيَّةِ يُخْشَى عَلَيْهِ أَنْ يَقَعَ فِي الرِّبَا الَّذِي هُوَ مِنْ أَكْبَرِ الْكَبَائِرِ وَفِي غَيْرِ ذَلِكَ مِنَ الْمُعَامَلاتِ الْمُحَرَّمَةِ، وَقَدْ ثَبَتَ عَنْ عُمَرَ رَضِيَ اللَّهُ عَنْهُ أَنَّهُ قَالَ «لا يَقْعُدْ فِي سُوقِنَا مَنْ لَمْ يَتَفَقَّهْ» رَوَاهُ التِّرْمِذِيُّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":771},{"type":"p","text":"   وَفِي قَوْلِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «التَّاجِرُ الصَّدُوقُ يُحْشَرُ يَوْمَ الْقِيَامَةِ مَعَ النَّبِيِّينَ وَالصِّدِيقِينَ وَالشُّهَدَاءِ» بِشَارَةٌ لِمَنْ تَعَاطَى التِّجَارَةَ وَاتَّقَى اللَّهَ بِتَجَنُّبِ مَا حَرَّمَ اللَّهُ تَعَالَى مِنْ أَنْوَاعِ التِّجَارَاتِ الْمُحَرَّمَةِ وَالْخِيَانَةِ وَالْغِشِّ وَالتَّدْلِيسِ بِأَنْ يُوهِمَ الْمُشْتَرِيَ خِلافَ الْحَقِيقَةِ وَالْتَزَمَ الصِّدْقَ فِي وَصْفِهِ لِبِضَاعَتِهِ وَسِلْعَتِهِ وَفِي إِخْبَارِهِ بِالثَّمَنِ الَّذِي اشْتَرَى بِهِ بِضَاعَتَهُ إِنْ ذَكَرَهُ بِأَنَّهُ مِنَ الَّذِينَ لا خَوْفٌ عَلَيْهِمْ وَلا هُمْ يَحْزَنُونَ، وَأَمَّا مَنْ لَمْ يَكُنْ كَذَلِكَ فَهُوَ مُسْتَحِقٌّ لِلْعَذَابِ الأَلِيمِ.#","style":"Normal","align":"justify","bold":true,"size":18.0,"index":772},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: ثُمَّ إِنَّ بَقِيَّةَ الْعُقُودِ مِنَ الإِجَارَةِ وَالْقِرَاضِ وَالرَّهْنِ وَالْوَكَالَةِ وَالْوَدِيعَةِ وَالْعَارِيَّةِ وَالشَّرِكَةِ وَالْمُسَاقَاةِ كَذَلِكَ لا بُدَّ مِنْ مُرَاعَاةِ شُرُوطِهَا وَأَرْكَانِهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":773},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذِهِ الْمَذْكُورَاتِ حُكْمُهَا حُكْمُ الْبَيْعِ فِي وُجُوبِ مَعْرِفَةِ أَحْكَامِهَا الشَّرْعِيَّةِ عَلَى مَنْ أَرَادَ تَعَاطِيَهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":774},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «مِنَ الإِجَارَةِ» يُرِيدُ بِهِ أَنَّهُ يَجِبُ تَعَلُّمُ أَحْكَامِ الإِجْارَةِ عَلَى مَنْ أَرَادَ تَعَاطِيَهَا فَالإِجْارَةُ مِنْهَا مَا هُوَ جَائِزٌ وَمِنْهَا مَا هُوَ بَاطِلٌ وَالإِجَارَةُ الصَّحِيحَةُ هِيَ الَّتِي اسْتَوْفَتِ الشُّرُوطَ وَتَعْرِيفُهَا شَرْعًا أَنَّهَا تَمْلِيكُ مَنْفَعَةٍ مُبَاحَةٍ بِعِوَضٍ مَعَ بَقَاءِ الْعَيْنِ عَلَى وَجْهٍ خَاصٍّ. وَالْمُرَادُ بِالْمَنْفَعَةِ هُنَا الْمَنْفَعَةُ الْمُعْتَبَرَةُ حِسًّا وَشَرْعًا. وَتُشْتَرَطُ فِيهَا الصِّيغَةُ عِنْدَ الإِمَامِ الشَّافِعِيِّ وَأَنْ تَكُونَ مَعْلُومَةً لا مَجْهُولَةً بِأَنْ يَكُونَ كُلٌّ مِنَ الأُجْرَةِ وَالْعَمَلِ مَعْلُومًا. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":775},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «وَالْقِرَاضِ» يُرِيدُ بِهِ أَنَّهُ يَجِبُ عَلَى مَنْ أَرَادَ تَعَاطِيَ الْقِرَاضِ مَعْرِفَةُ مَا يَحْتَاجُ إِلَيْهِ مِنْ أَحْكَامِهِ. وَالْقِرَاضُ هُوَ تَفْوِيضُ الشَّخْصِ وَإِذْنُهُ لِشَخْصٍ أَنْ يَعْمَلَ فِي مَالِهِ فِي نَوْعٍ أَوْ أَنْوَاعٍ مِنَ التِّجَارَةِ عَلَى أَنْ يَكُونَ الرِّبْحُ مُشْتَرِكًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":776},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «وَالرَّهْنِ» يُرِيدُ بِهِ أَنَّ مَنْ أَرَادَ تَعَاطِيَ الرَّهْنِ يَجِبُ عَلَيْهِ مَعْرِفَةُ مَا يَحْتَاجُ إِلَيْهِ مِنْ أَحْكَامِهِ. وَالرَّهْنُ هُوَ جَعْلُ عَيْنٍ مَالِيَّةٍ وَثِيقَةً بِدَّيْنٍ يُسْتَوْفَى مِنْهَا الدَّيْنُ عِنْدَ تَعَذُّرِ الْوَفَاءِ، فَمَعْنَاهُ أَنْ يَسْتَمْسِكَ الدَّائِنُ بِشَىْءٍ مِنْ مَالِ الْمَدِينِ لِيَسْتَوْفِيَ مِنْ هَذَا حَقَّهُ إِذَا تَعَذَّرَ عَلَيْهِ الإِيفَاءُ، وَيَكُونُ الِاسْتِيفَاءُ عِنْدَ التَّنَازُعِ بِطَرِيقِ الْحَاكِمِ. وَأَمَّا مَا يُسَمِّيهِ بَعْضُ النَّاسِ اسْتِرْهَانًا وَهُوَ أَنْ يَدْفَعَ الشَّخْصُ شَيْئًا يَمْلِكُهُ لِمَنْ أَقْرَضَهُ مَبْلَغًا مِنَ الْمَالِ عَلَى أَنْ يَنْتَفِعَ بِهِ الْمُقْرِضُ مَجَّانًا إِلَى أَنْ يُوَفِيَّهُ دَيْنَهُ أَوْ يَشْرِطَ عَلَيْهِ أُجْرَةً مُخَفَّفَةً لَهُ مِنْ أَجْلِ الدَّيْنِ فَذَلِكَ حَرَامٌ بِالإِجْمَاعِ وَهُوَ نَوْعٌ مِنْ أَنْوَاعِ الرِّبَا وَكَثِيرٌ مِنَ النَّاسِ وَاقِعُونَ فِيهِ فَهَؤُلاءِ وَقَعُوا فِي هَلاكٍ عَظِيمٍ لِأَنَّهُمْ يَسْتَحِقُّونَ الْعَذَابَ بِهَذَا الْعَمَلِ وَهُمْ مُطَالَبُونَ بِدَفْعِ أُجْرَةِ مِثْلِ هَذَا الشَّىْءِ فَإِنْ كَانَ الْمَرْهُونُ الَّذِي شَرَطَ الِانْتِفَاعَ بِهِ بِسَبَبِ الدَّيْنِ بَيْتًا سَكَنَهُ الدَّائِنُ مَجَّانًا أَوْ دَابَّةً أَوْ سَيَّارَةً رَكِبَهَا مَجَّانًا وَجَبَ عَلَيْهِ أُجْرَةُ الْمِثْلِ لِلْقَدْرِ الَّذِي اسْتَعْمَلَهُ فِيهِ، وَهَذَا مَنْصُوصٌ عَلَيْهِ فِي كَثِيرٍ مِنْ مُؤَلَّفَاتِ الْفُقَهَاءِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":777},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «وَالْوَكَالَةِ» يُرِيدُ بِهِ أَنَّهُ يَجِبُ عَلَى مَنْ أَرَادَ تَعَاطِيَ الْوَكَالَةِ مَعْرِفَةُ مَا يَحْتَاجُ إِلَيْهِ مِنْ أَحْكَامِهَا وَهِيَ تَفْوِيضُ شَخْصٍ إِلَى غَيْرِهِ تَصَرُّفًا عَلَى وَجْهٍ خَاصٍّ لِيَفْعَلَهُ حَالَ حَيَاتِهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":778},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفُ «وَالْوَدِيعَةِ» يُرِيدُ بِهِ أَنَّهُ يَجِبُ مَعْرِفَةُ أَحْكَامِ الْوَدِيعَةِ عَلَى مَنْ أَرَادَ تَعَاطِيَهَا. وَالْوَدِيعَةُ هِيَ مَا يُوضَعُ عِنْدَ غَيْرِ مَالِكِهِ لِحِفْظِهِ. وَلا يَجُوزُ قَبُولُ الْوَدِيعَةِ مِمَّنْ يَعْلَمُ مِنْ نَفْسِهِ أَنَّهُ لا يَسْتَطِيعُ حِفْظَهَا، وَتُسْتَحَبُّ لِمَنْ وَثِقَ بِأَمَانَةِ نَفْسِهِ مَعَ الْقُدْرَةِ عَلَى حِفْظِهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":779},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «وَالْعَارِيَّةِ» يُرِيدُ بِهِ أَنَّهُ يَجِبُ مَعْرِفَةُ أَحْكَامِ الْعَارِيَّةِ عَلَى مَنْ أَرَادَ تَعَاطِيَهَا. وَالْعَارِيَّةُ هِيَ إِبَاحَةُ الِانْتِفَاعِ بِشَىْءٍ مَجَّانًا مَعَ بَقَاءِ عَيْنِهِ. وَيُشْتَرَطُ فِي الْمُعَارِ أَنْ يُمْكِنَ الِانْتِفَاعُ بِهِ انْتِفَاعًا مُبَاحًا مَعَ بَقَاءِ عَيْنِهِ فَلا يَصِحُّ إِعَارَةُ مَطْعُومٍ لِلأَكْلِ أَوِ الشَّمْعَةِ لِلْوَقُودِ. وَلَيْسَ لِلْمُسْتَعِيرِ أَنْ يُعِيرَ غَيْرَهُ مَا اسْتَعَارَهُ بِدُونِ إِذْنِ الْمُعِيرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":780},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «وَالشَّرِكَةِ» يُرِيدُ بِهِ أَنَّهُ يَجِبُ مَعْرِفَةُ أَحْكَامِ الشَّرِكَةِ عَلَى مَنْ أَرَادَ تَعَاطِيَهَا. وَالشَّرِكَةُ هِيَ عَقْدٌ يَتَضَمَّنُ ثُبُوتَ الْحَقِّ فِي شَىْءٍ لِاثْنَيْنِ فَأَكْثَرَ عَلَى جِهَةِ الشُّيُوعِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":781},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «وَالْمُسَاقَاةِ» يُرِيدُ بِهِ أَنَّهُ يَجِبُ مَعْرِفَةُ أَحْكَامِ الْمُسَاقَاةِ عَلَى مَنْ أَرَادَ تَعَاطِيَهَا. وَالْمُسَاقَاةُ هِيَ مُعَامَلَةُ شَخْصٍ عَلَى شَجَرٍ لِيَتَعَهَّدَهُ بِنَحْوِ سَقْيٍ عَلَى أَنْ تَكُونَ الثَّمَرَةُ بَيْنَهُمَا. وَيُشْتَرَطُ فِي الْمُسَاقَاةِ أَنْ يَكُونَ الشَّجَرُ نَخْلًا أَوْ عِنَبًا مَغْرُوسًا مُعَيَّنًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":782},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَقْدُ النِّكَاحِ يَحْتَاجُ إِلَى مَزِيدِ احْتِيَاطٍ وَتَثَبُّتٍ حَذَرًا مِمَّا يَتَرَتَّبُ عَلَى فَقْدِ ذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":783},{"type":"p","text":"   الشَّرْحُ النِّكَاحُ أَشَدُّ حَاجَةً إِلَى مَعْرِفَةِ أَحْكَامِهِ الشَّرْعِيَّةِ مِنْ كَثِيرٍ مِنَ الأُمُورِ فَإِنَّ مَنْ جَهِلَ أَحْكَامَهُ قَدْ يَظُنُّ مَا لَيْسَ بِنِكَاحٍ نِكَاحًا فَيَتَفَرَّعُ مِنْ ذَلِكَ مَفَاسِدُ فَهُوَ جَدِيرٌ بِمَزِيدِ احْتِيَاطٍ وَتَثَّبُتٍ لِأَنَّ حِفْظَ النَّسَبِ مِنَ الْكُلِّيَّاتِ الْخَمْسِ الَّتِي اتَّفَقَتْ عَلَيْهَا الشَّرَائِعُ وَهِيَ حِفْظُ النَّفْسِ وَالْمَالِ وَالْعِرْضِ وَالْعَقْلِ وَالنَّسَبِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":784},{"type":"p","text":"   وَلِصِحَّةِ النِّكَاحِ شُرُوطٌ أَحَدُهَا الصِّيغَةُ كَأَنْ يَقُولَ الْوَلِيُّ زَوَّجْتُكَ فُلانَةَ فَيَقُولَ الزَّوْجُ قَبِلْتُ زِوَاجَهَا. الثَّانِي لَفْظُ زَوَّجْتُ أَوْ أَنْكَحْتُ أَوْ تَرْجَمَتُهُمَا عِنْدَ الإِمَامِ الشَّافِعِيِّ، وَفِي بَعْضِ الْمَذَاهِبِ يَصِحُّ بِكُلِّ لَفْظٍ يَدُلُّ عَلَى الْمَقْصُودِ. الثَّالِثُ كَوْنُ الزَّوْجِ مُسْلِمًا بِالنِّسْبَةِ لِلْمُسْلِمَةِ فَلا يَجُوزُ تَزَوُّجُ الْكَافِرِ بِمُسْلِمَةٍ إِنْ كَانَ كِتَابِيًّا وَإِنْ كَانَ غَيْرَ ذَلِكَ لِقَوْلِهِ تَعَالَى ﴿فَإِنْ عَلِمْتُمُوهُنَّ مُؤْمِنَاٰتٍ فَلا تَرْجِعُوهُنَّ إِلَى الْكُفَّارِ لا هُنَّ حِلٌ لَّهُمْ وَلا هُمْ يَحِلُّونَ لَهُنَّ﴾ [سُورَةَ الْمُمْتَحِنَة/10] فَلا يَجُوزُ تَزْوِيجُ مُسْلِمَةٍ مِنَ الْمُسْلِمِ الَّذِي ارْتَدَّ بِسَبَبٍ مِنْ أَسْبَابِ الرِّدَّةِ كَسَبِّ اللَّهِ أَوْ سَبِّ الرَّسُولِ أَوِ الطَّعْنِ فِي شَرِيعَةِ اللَّهِ أَوْ إِنْكَارِ مَا هُوَ مَعْلُومٌ مِنَ الدِّينِ عِلْمًا ظَاهِرًا بَيْنَ الْخَوَاصِّ وَالْعَوَامِّ مِنْ كُلِّ مَا هُوَ عَائِدٌ إِلَى تَكْذِيبِ الدِّينِ. الرَّابِعُ كَوْنُ الزَّوْجَةِ مُسْلِمَةً أَوْ كِتَابِيَّةً يَهُودِيَّةً أَوْ نَصْرَانِيَّةً بِالنِّسْبَةِ لِلْمُسْلِمِ. الْخَامِسُ كَوْنُ الزَّوْجَةِ خَلِيَّةً مِنْ عِدَّةٍ لِغَيْرِ الزَّوْجِ فَلا يَصِحُّ عَقْدُ النِّكَاحِ عَلَى مُعْتَدَّةِ وَفَاةٍ أَوْ مُعْتَدَّةِ طَلاقٍ أَوْ فَسْخٍ مِنْ غَيْرِهِ إِلَّا بَعْدَ انْتِهَاءِ الْعِدَّةِ. السَّادِسُ عَدَمُ التَّأْقِيتِ فَلَوْ قَالَ الْوَلِيُّ زَوَّجْتُكَ بِنْتِي إِلَى سَنَةٍ مَثَلًا فَهُوَ فَاسِدٌ، أَمَّا مَنْ نَوَى فِي قَلْبِهِ أَنْ يَتَزَوَّجَ امْرَأَةً وَيُعَاشِرَهَا سَنَةً ثُمَّ يُطَلِّقَهَا وَلَمْ يُدْخِلْ ذَلِكَ فِي صُلْبِ الْعَقْدِ فَهُوَ نِكَاحٌ صَحِيحٌ، وَقَدْ نَصَّ الشَّافِعِيُّ رَحِمَهُ اللَّهُ عَلَى جَوَازِ ذَلِكَ فِي كِتَابِ الأُمِّ فَلَيْسَ هَذَا مِنَ الْمُتْعَةِ الْمُحَرَّمَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":785},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَدْ أَشَارَ الْقُرْءَانُ الْكَريِمُ إِلَى ذَلِكَ بِقَوْلِهِ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا قُوا أَنْفُسَكُمْ وَأَهْلِيكُمْ نَارًا وَقُودُهَا النَّاسُ وَالْحِجَارَةُ﴾ [سُورَةَ التَّحْرِيم/6] قَالَ عَطَاءٌ رَضِيَ اللَّهُ عَنْهُ «أَنْ تَتَعَلَّمَ كَيْفَ تُصَلِّي وَكَيْفَ تَصُومُ وَكَيْفَ تَبِيعُ وَتَشْتَرِي وَكَيْفَ تَنْكِحُ وَكَيْفَ تُطَلِّقُ».","style":"Normal","align":"justify","bold":false,"size":18.0,"index":786},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ أَهْمَلَ ذَلِكَ لَمْ يَحْفَظْ نَفْسَهُ وَلا أَهْلَهُ مِنَ النَّارِ الَّتِي عَظَّمَ اللَّهُ أَمْرَهَا. وَهَذَا عَطَاءُ بنُ أَبِي رَبَاحٍ هُوَ الإِمَامُ الْمُجْتَهِدُ الَّذِي تَلَقَّى الْعِلْمَ مِنْ عَبْدِ اللَّهِ بنِ عَبَّاسٍ وَابْنِ مَسْعُودٍ وَغَيْرِهِمَا مِنَ الصَّحَابَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":787},{"type":"blank","text":""},{"type":"heading","text":"[فَصْلٌ فِي الطَّلاقِ]","style":"Normal","align":"center","bold":true,"size":18.0,"index":789},{"type":"blank","text":""},{"type":"p","text":"   الطَّلاقُ مَعْرِفَةُ أَحْكَامِهِ مُهِمَّةٌ جِدًّا لِأَنَّ كَثِيرِينَ مِنَ النَّاسِ يَحْصُلُ مِنْهُمْ طَلاقُ زَوْجَاتِهِمْ وَلا يَدْرُونَ أَنَّهُنَّ طَلَقْنَ فَيُعَاشِرُونَهُنَّ بِالْحَرَامِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":791},{"type":"p","text":"   وَالطَّلاقُ قِسْمَانِ صَرِيحٌ وَكِنَايَةٌ فَالصَّرِيحُ مَا لا يَحْتَاجُ إِلَى نِيَّةٍ فَيَقَعُ الطَّلاقُ بِهِ سَوَاءٌ نَوَى أَمْ لَمْ يَنْوِ وَهُوَ خَمْسَةُ أَلْفَاظٍ الطَّلاقُ وَالْفِرَاقُ وَالسَّرَاحُ وَالْخُلْعُ وَلَفْظُ الْمُفَادَاةِ مِنَ الْخُلْعِ وَاللَّفْظُ الْخَامِسُ قَوْلُ الشَّخْصِ نَعَمْ فِي جَوَابِ مَنْ أَرَادَ مِنْهُ أَنْ يُطَلِّقَ زَوْجَتَهُ الآنَ. وَالْكِنَايَةُ هُوَ مَا لا يَكُونُ طَلاقًا إِلَّا بِنِيَّةٍ كَقَوْلِهِ اعْتَدِّي، اخْرُجِي، سَافِرِي، تَسَتَّرِي، لا حَاجَةَ لِي فِيكِ، أَنْتِ وَشَأْنُكِ، سَلامٌ عَلَيْكِ، لِأَنَّ هَذِهِ الأَلْفَاظَ تَحْتَمِلُ الطَّلاقَ وَغَيْرَهُ احْتِمَالًا قَرِيبًا، فَإِنْ أَتَى بِالصَّرِيحِ وَقَعَ الطَّلاقُ نَوَى بِهِ الطَّلاقَ أَمْ لَمْ يَنْوِ، وَمَنْ أَتَى بِأَلْفَاظِ الْكِنَايَةِ فَلا يَقَعُ الطَّلاقُ إِلَّا أَنْ يَنْوِيَ بِاللَّفْظِ الطَّلاقَ وَتَكُونُ النِّيَّةُ مَقْرُونَةً بِأَوَّلِ الْكِنَايَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":792},{"type":"p","text":"   وَالطَّلاقُ إِنْ كَانَ ثَلاثًا بِلَفْظٍ وَاحِدٍ أَوْ فِي أَوْقَاتٍ مُتَفَرِّقَةٍ حَتَّى لَوْ قَالَ أَنْتِ طَالِقٌ وَنَوَى بِهِ الثَّلاثَ فَهُوَ طَلاقٌ ثَلاثٌ لا تَحِلُّ لَهُ بَعْدَهُ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ بَعْدَ عِدَّةٍ مِنْهُ وَيَدْخُلَ بِهَا ثُمَّ يُطَلِّقَهَا وَتَنْقَضِيَ الْعِدَّةُ مِنْهُ فَمَنْ قَالَ لِزَوْجَتِهِ أَنْتِ طَالِقٌ ثَلاثًا طَلَقَتْ ثَلاثًا وَإِنْ قَالَ «أَنْتِ طَالِقٌ أَنْتِ طَالِقٌ أَنْتِ طَالِقٌ» وَلَمْ يَنْوِ بِتَكْرَارِ اللَّفْظِ تَأْكِيدَ الطَّلْقَةِ الْوَاحِدَةِ فَهُوَ طَلاقٌ ثَلاثٌ، وَإِنْ نَوَى بِتَكْرَارِ اللَّفْظِ تَأْكِيدَ الطَّلْقَةِ الْوَاحِدَةِ وَهِيَ الأُولَى فَلا يُعَدُّ طَلاقًا ثَلاثًا بَلْ يُعَدُّ طَلاقًا وَاحِدًا. وَكَثِيرٌ مِنَ النَّاسِ يَجْهَلُونَ هَذَا فَيَرْجِعُونَ إِلَى زَوْجَاتِهِمْ إِذَا أَوْقَعُوا طَلاقًا ثَلاثًا بِلَفْظٍ وَاحِدٍ يَظُنُّونَ أَنَّهُ طَلاقٌ وَاحِدٌ وَأَنَّهُ يَجُوزُ لَهُمْ أَنْ يَرْتَجِعُوهُنَّ قَبْلَ مُضِيِّ الْعِدَّةِ بِلا عَقْدٍ جَدِيدٍ أَوْ بَعْدَ مُضِيِّ الْعِدَّةِ بِتَجْدِيدِ الْعَقْدِ فَهَؤُلاءِ يُعَاشِرُونَ أَزْوَاجَهُمْ بِالْحَرَامِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":793},{"type":"p","text":"   وَلا فَرْقَ فِي الطَّلاقِ بَيْنَ أَنْ يَكُونَ مُنَجَّزًا وَبَيْنَ أَنْ يَكُونَ مُعَلَّقًا عَلَى شَىْءٍ فَإِذَا قَالَ أَنْتِ طَالِقٌ إِنْ دَخَلْتِ دَارَ فُلانٍ أَوْ إِنْ فَعَلْتِ كَذَا فَدَخَلَتْ أَوْ فَعَلَتْ ذَلِكَ الشَّىْءَ وَقَعَ الطَّلاقُ، فَإِنْ كَانَ قَالَ إِنْ دَخَلْتِ دَارَ فُلانٍ فَأَنْتِ طَالِقٌ بِالثَّلاثِ فَدَخَلَتْ كَانَ ثَلاثًا فَتَحْرُمُ عَلَيْهِ فَلا تَحِلُّ لَهُ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ. وَلا يَجُوزُ إِلْغَاءُ هَذَا الطَّلاقِ، وَلا عِبْرَةَ بِرَأْيِ أَحْمَدَ بنِ تَيْمِيَةَ الَّذِي خَرَقَ بِهِ الإِجْمَاعَ فِي قَوْلِهِ إِنَّ الطَّلاقَ الْمُعَلَّقَ الْمَحْلُوفَ بِهِ لا يَقَعُ مَعَ الْحِنْثِ وَلَيْسَ عَلَيْهِ إِلَّا كَفَّارَةُ الْيَمِينِ فَرَأْيُ ابْنِ تَيْمِيَةَ هَذَا خِلافُ الإِجْمَاعِ، وَقَدْ نَقَلَ الإِجْمَاعَ عَلَى هَذَا الْحُكْمِ الْفَقِيهُ الْمُحَدِّثُ الْحَافِظُ الثِّقَةُ الْجَلِيلُ مُحَمَّدُ بنُ نَصْرٍ الْمَرْوَزِيُّ وَجَمَاعَةٌ غَيْرُهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":794},{"type":"p","text":"   ثُمَّ الطَّلاقُ إِمَّا جَائِزٌ سُنِّيٌّ وَإِمَّا بِدْعِيٌّ وَإِمَّا لا وَلا. فَالطَّلاقُ السُّنِيُّ هُوَ مَا خَلا عَنِ النَّدَمِ وَاسْتَعْقَبَ الشُّرُوعَ فِي الْعِدَّةِ وَكَانَ بَعْدَ الدُّخُولِ وَهِيَ مِمَّنْ عِدَّتُهَا بِالأَقْرَاءِ فَكَانَ فِي طُهْرٍ لَمْ يَطَأْهَا فِيهِ وَلا فِي حَيْضٍ قَبْلَهُ. وَأَمَّا الْبِدْعِيُّ فَهُوَ أَنْ يُطَلِّقَ بَعْدَ الدُّخُولِ فِي حَيْضٍ أَوْ نِفَاسٍ أَوْ فِي طُهْرٍ وَطِئَهَا فِيهِ وَلَمْ يَظْهَرْ بِهَا حَمْلٌ. وَهَذَا الطَّلاقُ حَرَامٌ وَمَعَ حُرْمَتِهِ فَإِنَّهُ يَقَعُ. وَإِنَّمَا كَانَ طَلاقُ الْحَائِضِ وَالنُّفَسَاءِ بِدْعِيًّا لِأَنَّهَا تَتَضَرَّرُ بِطُولِ مُدَّةِ الِانْتِظَارِ وَأَمَّا الطَّلاقُ فِي طُهْرٍ وَطِئَ فِيهِ فَإِنَّهُ يُؤَدِّي إِلَى النَّدَمِ عِنْدَ ظُهُورِ الْحَمْلِ لِأَنَّ الإِنْسَانَ قَدْ يُطَلِّقُ الْحَائِلَ دُونَ الْحَامِلِ وَعِنْدَ النَّدَمِ قَدْ لا يُمْكِنُهُ التَّدَارُكُ فَيَتَضَرَّرُ هُوَ وَالْوَلَدُ. وَأَمَّا طَلاقُ لا وَلا أَيِ الَّذِي لا يُسَمَّى سُنِّيًّا وَلا بِدْعِيًّا فَهُوَ أَنْ يُطَلِّقَهَا قَبْلَ الدُّخُولِ أَوْ غَيْرَ بَالِغَةٍ أَوْ ءَايِسَةً أَوْ حَامِلًا مِنْهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":795},{"type":"p","text":"   وَلا فَرْقَ بَيْنَ طَلاقِ الْجِدِّ وَطَلاقِ الْهَزْلِ لِقَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «ثَلاثٌ جِدُّهُنَّ جِدٌّ وَهَزْلُهُنَّ جِدٌّ النِّكَاحُ وَالطَّلاقُ وَالرَّجْعَةُ» رَوَاهُ أَبُو دَاوُدَ فِي السُّنَنِ فَإِذَا حَصَلَ النِّكَاحُ بِشُرُوطِهِ وَكَانَ الْوَلِيُّ وَالزَّوْجُ مَازِحَيْنِ ثَبَتَ النِّكَاحُ، وَكَذَلِكَ الطَّلاقُ فَإِنْ كَانَ الزَّوْجُ وَالزَّوْجَةُ مَازِحَيْنِ أَوْ جَادَّيْنِ أَوْ أَحَدُهُمَا جَادًّا وَالآخَرُ مَازِحًا كَأَنْ طَلَبَتِ الزَّوْجَةُ الطَّلاقَ بِجِدٍّ وَهُوَ أَوْقَعَهُ بِمَزْحٍ فَقَدْ ثَبَتَ الطَّلاقُ. وَإِنْ كَانَ الطَّلاقُ وَاحِدًا أَوِ اثْنَيْنِ تَصِحُّ الرَّجْعَةُ قَبْلَ انْتِهَاءِ الْعِدَّةِ بِقَوْلِ أَرْجَعْتُكِ إِلَى نِكَاحِي وَنَحْوِهِ فَإِنِ انْتَهَتِ الْعِدَّةُ قَبْلَ أَنْ يَرْتَجِعَهَا لا تَحِلُّ لَهُ إِلَّا بِعَقْدٍ جَدِيدٍ بِوَلِيِّهَا وَشَاهِدَيْنِ مُسْلِمِيْنَ عَدْلَيْنِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":796},{"type":"p","text":"   وَالْجِدُّ خِلافُ الْهَزْلِ وَهُوَ بِكَسْرِ الْجِيمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":797},{"type":"blank","text":""},{"type":"blank","text":""},{"type":"heading","text":"[فَصْلٌ فِي الْخُلْعِ]","style":"Normal","align":"center","bold":true,"size":18.0,"index":800},{"type":"blank","text":""},{"type":"p","text":"   الْخُلْعُ بِضَمِّ الْخَاءِ مِنَ الخَلْعِ بِفَتْحِهَا وَهُوَ لُغَةً النَّزْعُ لِأَنَّ كُلًّا مِنَ الزَّوْجَيْنِ لِبَاسُ الآخَرِ فَكَأَنَّهُ بِمُفَارَقَةِ الآخَرِ نَزَعَ لِبَاسَهُ. وَهُوَ ثَابِتٌ قَبْلَ الإِجْمَاعِ بِقَوْلِهِ تَعَالَى ﴿فَإِنْ طِبْنَ لَكُمْ عَنْ شَىْءٍ مِّنْهُ نَفْسًا فَكُلُوهُ هَنِيئًا مَّرِيئًا﴾ [سُورَةَ النِّسَاء/4] وَبِقَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي امْرَأَةِ ثَابِتِ بنِ قَيْسٍ «اقْبَلِ الْحَدِيقَةَ وَطَلِّقْهَا تَطْلِيقَةً» رَوَاهُ الْبُخَارِيُّ وَالنَّسَائِيُّ. وَاخْتُلِفَ فِي الْخُلْعِ هَلْ هُوَ طَلاقٌ أَوْ فَسْخٌ، وَمَشْهُورُ مَذْهَبِ الشَّافِعِيِّ الْجَدِيدِ أَنَّهُ طَلاقٌ، وَفِي كِتَابِ أَحْكَامِ الْقُرْءَانِ لِلشَّافِعِيِّ وَهُوَ مِنْ كُتُبِهِ الْجَدِيدَةِ أَنَّهُ فَسْخٌ وَهُوَ مَذْهَبُهُ الْقَدِيمُ. وَهُوَ مَكْرُوهٌ إِلَّا عِنْدَ الشِّقَاقِ أَوْ خَوْفِ تَقْصِيرٍ مِنْ أَحَدِهِمَا فِي حَقِّ الآخَرِ أَوْ كَرَاهَةِ الزَّوْجَةِ لِلزَّوْجِ أَوْ كَرَاهَتِهِ إِيَّاهَا لِزِنَاهَا أَوْ نَحْوِهِ كَتَرْكِ الصَّلاةِ أَوْ لِلتَّخَلُّصِ مِنْ وُقُوعِ الثَّلاثِ أَوِ الثِّنْتَيْنِ بِالْفِعْلِ فِيمَا لَوْ حَلَفَ بِالطَّلاقِ ثَلاثًا أَوِ اثْنَتَيْنِ عَلَى فِعْلِ مَا لا بُدَّ مِنْهُ. وَتَعْرِيفُهُ شَرْعًا أَنَّهُ فُرْقَةٌ بِعِوَضٍ مَقْصُودٍ رَاجِعٍ لِجِهَةِ الزَّوْجِ. وَأَرْكَانُهُ خَمْسَةٌ أَحَدُهَا مُلْتَزِمٌ لِلْعِوَضِ إِنْ كَانَ زَوْجَةً أَوْ غَيْرَهَا وَالثَّانِي الْبُضْعُ وَالثَّالِثُ الْعِوَضُ وَالرَّابِعُ الصِّيغَةُ وَالْخَامِسُ الزَّوْجُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":802},{"type":"p","text":"   ثُمَّ عَلَى الْقَوْلِ بِأَنَّ الْخُلْعَ فَسْخٌ يَصْلُحُ لِمَنْ يُرِيدُ الْخَلاصَ مِنْ وُقُوعِ الطَّلاقِ الْمُعَلَّقِ إِنْ كَانَ ثَلاثًا أَوْ أَقَلَّ كَأَنْ قَالَ إِنْ كَلَّمْتِ فُلانًا أَوْ دَخَلْتِ دَارَ فُلانٍ أَوْ خَرَجْتِ بِدُونِ إِذْنِي فَأَنْتِ طَالِقٌ ثَلاثًا فَإِذَا كَانَ الزَّوْجُ لا يُرِيدُ أَنْ يَقَعَ الطَّلاقُ الْمُعَلَّقُ خَالَعَهَا بِغَيْرِ قَصْدِ الطَّلاقِ بَلْ بِقَصْدِ الْفَسْخِ أَيْ حَلِّ النِّكَاحِ فَتَصِيرُ الزَّوْجَةُ بِالْخُلْعِ بَائِنًا فَلَوْ فَعَلَتْ بَعْدَ ذَلِكَ الْمَحْلُوفَ عَلَيْهِ لَمْ يَقَعِ الطَّلاقُ بِهِ ثُمَّ يَعْمَلُ عَقْدًا جَدِيدًا بِطَرِيقِ وَلِيِّهَا أَيِ الْوَلِيِّ الْخَاصِّ أَوْ غَيْرِهِ إِنْ لَمْ يَتَيَسَّرِ الْعَقْدُ مِنْ طَرِيقِ الْوَلِيِّ الْخَاصِّ كَأَنْ يُجْرِيَ الْحَاكِمُ الْعَقْدَ فَيَكُونُ فِي حُكْمِ الْوَلِيِّ الْخَاصِّ الأَصْلِيِّ. وَهَذَا الْمَخْلَصُ الْمَذْكُورُ لا يَتَأَتَّى عَلَى مَشْهُورِ مَذْهَبِ الشَّافِعِيِّ لَكِنْ يَصِحُّ عَلَى الْقَوْلِ الْقَدِيمِ وَعَلَى قَوْلٍ قَالَهُ الشَّافِعِيُّ فِي كِتَابِ أَحْكَامِ الْقُرْءَانِ كَمَا تَقَدَّمَ فَلا بَأْسَ بِالْعَمَلِ بِهِ، فَيَنْبَغِي إِرْشَادُ مَنْ يُخْشَى مِنْهُ أَنْ يُعَاشِرَ الْمَرْأَةَ بِالْحَرَامِ بَعْدَ وُقُوعِ الْمُعَلَّقِ بِهِ إِلَى هَذَا الْمَخْلَصِ لِأَنَّ كَثِيرِينَ يَعْدِلُونَ إِلَى الْمُعَاشَرَةِ بِالْحَرَامِ بَعْدَ وُقُوعِ الطَّلاقِ الْمُعَلَّقِ الَّذِي هُوَ ثَلاثٌ مِنْ دُونِ أَنْ يَتَزَوَجَّهَا زَوْجٌ غَيْرُهُ. وَبَعْضُهُمْ يَعْدِلُونَ إِلَى طَرِيقٍ لا يَنْفَعُهُمْ وَهُوَ أَنَّهُمْ يَتَّفِقُونَ مَعَ شَخْصٍ يُجْرَى لَهُ عَلَيْهَا الْعَقْدُ بَعْدَ وُقُوعِ الثَّلاثِ ثُمَّ يَشْتَرِطُونَ عَلَيْهِ أَنْ لا يُجَامِعَهَا وَيَحْتَجُّونَ بِأَنَّ بَعْضَ الْمُجْتَهِدِينَ مِنَ التَّابِعِينَ يُجِيزُ ذَلِكَ، وَذَلِكَ الْمُجْتَهِدُ يَشْتَرِطُ أَنْ لا يَكُونَ الزَّوْجُ الثَّانِي يَقْصِدُ بِذَلِكَ إِحْلالَهَا لِلأَوَّلِ، فَهَؤُلاءِ الَّذِينَ يُرْشِدُونَ النَّاسَ إِلَى هَذَا الأَمْرِ الْفَاسِدِ يَغُشُّونَ النَّاسَ الَّذِينَ يَقْصِدُونَهُمْ لِلِاسْتِفْتَاءِ لِأَنَّهُمْ لَمْ يُوَافِقُوا ذَلِكَ الْمُجْتَهِدَ بَلْ كَانَ عَمَلُهُمْ هَذَا حَرَامًا عِنْدَ جَمِيعِ الْمُجْتَهِدِينَ فَلا وَافَقُوا الْجُمْهُورَ وَلا وَافَقُوا هَذَا الْمُجْتَهِدَ الَّذِي شَذَّ. قَالَ بَعْضُ أَكَابِرِ الْحَنَفِيَّةِ وَهُوَ صَدْرُ الشَّرِيعَةِ فِيمَنْ أَخَذَ بِقَوْلِ ذَلِكَ الْمُجْتَهِدِ «مَنْ فَعَلَ ذَلِكَ فَعَلَيْهِ لَعْنَةُ اللَّهِ وَالْمَلائِكَةِ وَالنَّاسِ أَجْمَعِينَ» اهـ وَإِنَّمَا لَمْ يُعْتَبَرْ قَوْلُ هَذَا الْمُجْتَهِدِ لِأَنَّهُ خَالَفَ حَدِيثًا صَحِيحًا بِاتِّفَاقِ عُلَمَاءِ الْحَدِيثِ وَهُوَ قَوْلُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «أَتُرِيدِينَ أَنْ تَرْجِعِي إِلَى رِفَاعَةَ لا تَحِلِّينَ لَهُ حَتَّى تَذُوقِي عُسَيْلَتَهُ وَيَذُوقَ عُسَيْلَتَكِ» أَيْ لا يَحِلُّ لَكِ أَنْ تَرْجِعِي لِلزَّوْجِ الأَوَّلِ إِلَّا بَعْدَ أَنْ يُجَامِعَكِ هَذَا الثَّانِي، وَهَذَا حَدِيثٌ صَحِيحٌ ثَابِتٌ مَشْهُورٌ رَوَاهُ الْبُخَارِيُّ فَالْفَتْوَى بِخِلافِهِ لا عِبْرَةَ بِهَا لِأَنَّ الْمُجْتَهِدَ إِذَا خَالَفَ قَوْلُهُ نَصًّا قُرْءَانِيًّا أَوْ حَدِيثِيًّا يُعَدُّ دَلِيلًا بِاتِّفَاقٍ لا يُقَلَّدُ فِي اجْتِهَادِهِ وَلَوْ كَانَ قَاضِيًا قَضَى بِذَلِكَ وَجَبَ عَلَى غَيْرِهِ مِنَ الْقُضَاةِ أَنْ يَنْقُضَ حُكْمَهُ. نَسْأَلُ اللَّهَ أَنْ يُثَبِّتَنَا عَلَى سَبِيلٍ وَسُنَّةٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":803},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":804},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَحْكَامِ الرِّبَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":805},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَحْرُمُ الرِّبَا فِعْلُهُ وَأَكْلُهُ وَأَخْذُهُ وَكِتَابَتُهُ وَشَهَادَتُهُ وَهُوَ بَيْعُ أَحَدِ النَّقْدَيْنِ بِالآخَرِ نَسِيئَةً أَوْ بِغَيْرِ تَقَابُضٍ أَوْ بِجِنْسِهِ كَذَلِكَ أَيْ نَسِيئَةً أَوِ افْتِرَاقًا بِغَيْرِ تَقَابُضٍ أَوْ مُتَفَاضِلًا أَيْ مَعَ زِيَادَةٍ فِي أَحَدِ الْجَانِبَيْنِ عَلَى الآخَرِ بِالْوَزْنِ. وَالْمَطْعُومَاتُ بَعْضُهَا بِبَعْضٍ كَذَلِكَ أَيْ لا يَحِلُّ بَيْعُهَا مَعَ اخْتِلافِ الْجِنْسِ كَالْقَمْحِ مَعَ الشَّعِيرِ إِلَّا بِشَرْطَيْنِ انْتِفَاءِ الأَجَلِ وَانْتِفَاءِ الِافْتِرَاقِ قَبْلَ التَّقَابُضِ وَمَعَ اتِّحَادِ الْجِنْسِ يُشْتَرَطُ هَذَانِ الشَّرْطَانِ مَعَ التَّمَاثُلِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":806},{"type":"p","text":"   الشَّرْحُ الرِّبَا هُوَ عَقْدٌ يَشْتَمِلُ عَلَى عِوَضٍ مَخْصُوصٍ غَيْرِ مَعْلُومِ التَّمَاثُلِ فِي الْمِعْيَارِ الشَّرْعِيِّ حَالَةَ الْعَقْدِ أَوْ مَعَ تَأْخِيرٍ فِي الْعِوَضَيْنِ أَوْ أَحَدِهِمَا. هَذَا الرِّبَا لَمْ يَكُنْ مَعْرُوفًا مَشْهُورًا بَيْنَ الْعَرَبِ فِي الْجَاهِلِيَّةِ قَبْلَ نُـزُولِ ءَايَةِ التَّحْرِيمِ وَإِنَّمَا الرِّبَا الَّذِي كَانَ مَشْهُورًا عِنْدَهُمْ هُوَ رِبَا الْقَرْضِ وَهُوَ أَنْ يَكُونَ لِلرَّجُلِ عَلَى الرَّجُلِ دَيْنٌ إِلَى أَجَلٍ ثُمَّ إِذَا حَلَّ الأَجَلُ يَقُولُ صَاحِبُ الدَّيْنِ لِلْمَدِينِ إِمَّا أَنْ تَدْفَعَ وَإِمَّا أَنْ أَزِيدَ عَلَيْكَ، قَالَ بَعْضُ الْحَنَفِيَّةِ هَذَا أَوَّلُ مَا نَـزَلَ تَحْرِيمُهُ مِنَ الرِّبَا. وَيَنْقَسِمُ ذَلِكَ الْعَقْدُ إِلَى ثَلاثَةِ أَنْوَاعٍ أَحَدُهَا رِبَا الْفَضْلِ وَهُوَ بَيْعُ أَحَدِ الْعِوَضَيْنِ الرِّبَوَيَيْنِ وَهُمَا مُتَّفِقَا الْجِنْسِ بِالآخَرِ زَائِدًا عَلَيْهِ كَبَيْعِ دِينَارٍ بِدِينَارَيْنِ أَوْ دِرْهَمٍ بِدِرْهَمَيْنِ أَوْ صَاعِ قَمْحٍ بِصَاعَيْ قَمْحٍ. وَالثَّانِي رِبَا الْيَدِ وَهُوَ بَيْعُ أَحَدِ الْعِوَضَيْنِ الرِّبَوَيَيْنِ بِالآخَرِ مَعَ تَأْخِيرِ قَبْضِهِمَا أَوْ قَبْضِ أَحَدِهِمَا بِأَنْ يَفْتَرِقَ الْمُتَبَايِعَانِ قَبْلَ الْقَبْضِ بِشَرْطِ اتِّفَاقِ الْعِوَضَيْنِ فِي عِلَّةِ الرِّبَا بِأَنْ يَكُونَ كُلٌّ مِنْهُمَا مَطْعُومًا أَيْ مَقْصُودًا لِلأَكْلِ غَالِبًا تَقَوُّتًا أَوْ تَأَدُّمًا أَوْ تَفَكُّهًا أَوْ تَدَاوِيًا أَوْ غَيْرَهَا وَذَلِكَ كَالْبُرِّ بِالشَّعِيرِ وَالْمِلْحِ بِالزَّعْفَرَانِ وَالتَّمْرِ بِالزَّبِيبِ وَالتُّفَّاحِ بِالتِّينِ، أَوْ أَنْ يَكُونَ كُلٌّ مِنْهُمَا نَقْدًا وَإِنِ اخْتَلَفَ الْجِنْسُ كَالذَّهَبِ بِالْفِضَّةِ وَالْعَكْس. وَالثَّالِثُ رِبَا النَّسَاءِ بِفَتْحِ النُّونِ أَيِ التَّأْجِيلِ وَهُوَ الْبَيْعُ لِلْمَطْعُومَيْنِ أَوْ لِلنَّقْدَيْنِ الْمُتَّفِقَيِ الْجِنْسِ أَوِ الْمُخْتَلِفَيْهِ أَحَدِهِمَا بِالآخَرِ لِأَجَلٍ وَلَوْ كَانَ الأَجَلُ قَصِيرًا جِدًّا كَلَحْظَةٍ أَوْ دَقِيقَةٍ أَيْ أَنْ يُشْرَطَ ذَلِكَ لَفْظًا بِأَنْ يَقُولَ أَحَدُهُمَا بِعْتُكَ هَذَا الدِّينَارَ بِهَذَا الدِّينَارِ أَوْ هَذَا الدِّينَارَ بِهَذِهِ الدَّرَاهِمِ أَوْ هَذَا الْقَمْحَ بِهَذَا الْقَمْحِ أَوْ هَذَا الْقَمْحَ بِهَذَا الشَّعِيرِ وَيَزِيدَ فِي كُلٍّ مِنْ ذَلِكَ شَرْطَ الأَجَلِ كَأَنْ يَقُولَ عَلَى أَنْ تُسَلِّمَنِيهِ غَدًا أَوْ فِي سَاعَةِ كَذَا أَوْ لِسَاعَةِ كَذَا أَوْ فِي الدَّقِيقَةِ السَّادِسَةِ مِنَ الآنَ أَوْ نَحْوَ ذَلِكَ فَهَذَا رِبًا مُحَرَّمٌ. وَلا يَحْصُلُ الأَجَلُ بِدُونِ الذِّكْرِ. وَإِنَّمَا كَانَ الرِّبَا خَاصًّا بِالنَّقْدِ دُونَ الْفُلُوسِ مَثَلًا مِنْ بَيْنِ الأَثْمَانِ لِأَنَّ النَّقْدَ هُوَ الْمَذْكُورُ فِي حَدِيثِ الرِّبَا الَّذِي فِيهِ قَوْلُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «الذَّهَبُ بِالذَّهَبِ رِبًا إِلَّا مِثْلًا بِمِثْلٍ وَالْفِضَّةُ بِالْفِضَّةِ رِبًا إِلَّا مِثْلًا بِمِثْلٍ» وَلِأَنَّ النَّقْدَ أَيِ الذَّهَبَ وَالْفِضَّةَ مَرْجِعُ الأَثْمَانِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":807},{"type":"p","text":"وَأَمَّا رِبَا الْقَرْضِ فَهُوَ كُلُّ قَرْضٍ شُرِطَ فِيهِ جَرُّ مَنْفَعَةٍ لِلْمُقْرِضِ سَوَاءٌ كَانَتِ الْمَنْفَعَةُ لَهُ وَحْدَهُ أَوْ لَهُ وَلِلْمُقْتَرِضِ وَسَوَاءٌ كَانَتِ الْمَنْفَعَةُ زِيَادَةً أَمْ غَيْرَ زِيَادَةٍ فَالرِّبَا الَّذِي هُوَ بِالزِّيَادَةِ هُوَ الرِّبَا الَّذِي بِالْبُنُوكِ وَنَحْوِهَا مِمَّا يُشْتَرَطُ فِيهِ الزِّيَادَةُ أَمَّا الرِّبَا الَّذِي بِغَيْرِ الزِّيَادَةِ فِي قَدْرِ الدَّيْنِ فَهُوَ مِثْلُ مَا يَفْعَلُهُ بَعْضُ النَّاسِ مِنْ أَنَّ أَحَدَهُمْ يُقْرِضُ شَخْصًا مَالًا إِلَى أَجَلٍ وَيَشْتَرِطُ عَلَيْهِ أَنْ يُسْكِنَهُ بَيْتَهُ مَجَّانًا أَوْ بِأُجْرَةٍ مُخَفَّفَةٍ إِلَى أَنْ يُؤَدِّيَ الدَّيْنَ وَيُسَمُّونَهُ فِي بَعْضِ الْبِلادِ اسْتِرْهَانًا وَقَدْ مَرَّ ذِكْرُهُ وَهُوَ حَرَامٌ بِالإِجْمَاعِ اتَّفَقَ عَلَى تَحْرِيمِهِ الْمُجْتَهِدُونَ الأَئِمَّةُ الأَرْبَعَةُ وَغَيْرُهُمْ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":808},{"type":"p","text":"   وَمِنَ الرِّبَا مَا يَفْعَلُهُ بَعْضُ النَّاسِ مِنْ أَنَّهُمْ يَبِيعُونَ الشَّىْءَ بِأَقْسَاطٍ مُؤَجَّلَةٍ إِلَى ءَاجَالٍ مَعْلُومَةٍ مَعَ شَرْطِ أَنَّهُ إِنْ أَخَّرَ شَيْئًا مِنْ هَذِهِ الأَقْسَاطِ يُضَافُ عَلَيْهِ كَذَا مِنَ الزِّيَادَةِ، وَلَوْلا هَذَا الشَّرْطُ لَكَانَ بَيْعًا جَائِزًا مَهْمَا حَصَّلَ مِنَ الرِّبْحِ بِسَبَبِ التَّقْسِيطِ مِمَّا هُوَ زَائِدٌ عَلَى الثَّمَنِ لَوْ كَانَ حَالَّا فَأَصْلُ بَيْعِ التَّقْسِيطِ جَائِزٌ إِذَا افْتَرَقَا عَلَى الْبَيَانِ أَيْ بَيَانِ أَنَّهُ يُرِيدُ بَيْعَ النَّسِيئَةِ لا الْحَالِّ أَوِ الْحَالِّ لا النَّسِيئَةِ، وَأَمَّا إِذَا تَفَرَّقَا قَبْلَ الْبَيَانِ ثُمَّ أَخَذَ الشَّىْءَ فَهُوَ حَرَامٌ وَذَلِكَ كَأَنْ يَقُولَ الْبَائِعُ لِلْمُشْتَرِي بِعْتَكَهُ بِكَذَا نَقْدًا أَوْ بِكَذَا نَس le":"Normal","align":"justify","bold":true,"size":18.0,"index":815},{"type":"benefit","text":"فَائِدَةٌ. لا يَجُوزُ بَيْعُ الْحَيَوَانِ وَزْنًا أَيْ لا يَجُوزُ بَيْعُهُ عَلَى أَنْ يَكُونَ ثَمَنُ الرِّطْلِ كَذَا لِأَنَّهُ إِذَا بِيعَ حَيَوَانٌ بِشَرْطِ الْوَزْنِ كَمَا هُوَ مَعْرُوفٌ الْيَوْمَ يَدْخُلُ الْقَذَرُ الَّذِي فِي جَوْفِهِ فِي الْمُقَابَلَةِ بِالثَّمَنِ فَيَنْصَرِفُ قِسْمٌ مِنَ الثَّمَنِ إِلَى الْقَذَرِ وَالْقِسْمُ الآخَرُ إِلَى مَا سِوَاهُ كَاللَّحْمِ وَالْعَظْمِ، وَالْقَذَرُ لا يُقَابَلُ بِمَالٍ، وَالْخَلاصُ مِنْ ذَلِكَ أَنْ لا يُعْتَبَرَ الْوَزْنُ شَرْطًا وَإِنْ ذُكِرَ لِتَخْمِينِ السِّعْرِ فَإِنَّهُ لَوْ قَالَ الْبَائِعُ هَذَا وَزْنُهُ كَذَا لِيُسَاعِدَ الْمُشْتَرِيَ عَلَى تَخْمِينِ السِّعْرِ مِنْ غَيْرِ أَنْ يَقُولَ بِعْتُكَ كُلَّ رِطْلٍ بِكَذَا ثُمَّ قَالَ بِعْتُكَهُ بِكَذَا فَقَالَ الْمُشْتَرِي اشْتَرَيْتُهُ بِمَا ذَكَرْتَ صَحَّ الْبَيْعُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":816},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالدَّيْنِ بِالدَّيْنِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":817},{"type":"p","text":"   الشَّرْحُ يَحْرُمُ بَيْعُ الدَّيْنِ بِالدَّيْنِ وَلَهُ صُوَرٌ مُتَعَدِّدَةٌ كَأَنْ أَسْلَمَ إِلَى رَجُلٍ دِينَارًا فِي قَمْحٍ مُؤَجَّلٍ إِلَى أَجَلٍ مُعَيَّنٍ ثُمَّ يَبِيعُ ذَلِكَ الْقَمْحَ مِنْ شَخْصٍ ءَاخَرَ بِدِينَارٍ مُؤَجَّلٍ وَذَلِكَ لِحَدِيثِ «نَهَى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ بَيْعِ الْكَالِئِ بِالْكَالِئِ» رَوَاهُ الْحَاكِمُ وَالْبَيْهَقِيُّ وَغَيْرُهُمَا. وَيَحْرُمُ مَا يَفْعَلُهُ بَعْضُ النَّاسِ مِنْ أَنَّ الشَّخْصَ يَكُونُ لَهُ فِي ذِمَّةِ شَخْصٍ ثَمَنُ مَبِيعٍ مُقَسَّطٌ إِلَى ءَاجَالٍ ثُمَّ يَأْتِي إِلَى مُوَظَّفِ بَنْكٍ أَوْ شَخْصٍ ءَاخَرَ قَبْلَ حُلُولِ الدَّيْنِ فَيَقُولُ لَهُ لِي كَذَا وَكَذَا فِي ذِمَّةِ فُلانٍ فَأَبِيعُكَهُ بِمَبْلَغِ كَذَا فَهَذَا حَرَامٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":818},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبَيْعُ الْفُضُولِيِّ أَيْ بَيْعُ مَا لَيْسَ لَهُ عَلَيْهِ مِلْكٌ وَلا وِلايَةٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":819},{"type":"p","text":"   الشَّرْحُ الْفُضُولِيُّ هُوَ الشَّخْصُ الَّذِي يَبِيعُ مَا لَيْسَ مِلْكًا لَهُ وَلا لَهُ عَلَيْهِ وِلايَةٌ بِطَرِيقٍ مِنَ الطُّرُقِ الشَّرْعِيَّةِ فَلا يَجُوزُ بَيْعُهُ هَذَا، وَأَمَّا مَنْ كَانَ لَهُ وِلايَةٌ عَلَى مَالِ غَيْرِهِ بِأَنْ يَكُونَ وَلِيَّ يَتِيمٍ أَوْ وَكِيلًا عَنِ الْمَالِكِ فَبَيْعُهُ صَحِيحٌ وَيُشْتَرَطُ أَنْ يُرَاعِيَ مَصْلَحَةَ مَوْلِيَّهُ أَوْ مُوَكِّلِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":820},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَالَمْ يرَهُ وَيَجُوزُ عَلَى قَوْلٍ لِلشَّافِعِيِّ مَعَ الْوَصْفِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":821},{"type":"p","text":"   الشَّرْحُ يَحْرُمُ بَيْعُ عَيْنٍ غَيْرِ مُشَاهَدَةٍ لِلْمُتَعَاقِدَيْنِ أَوْ أَحَدِهِمَا وَهَذَا مَشْهُورُ مَذْهَبِ الشَّافِعِيِّ، وَجُمْهُورُ الأَئِمَّةِ يُجَوِّزُونَهُ عَلَى أَنْ يَكُونَ لَهُ الْخِيَارُ إِذَا رَءَاهُ، وَلِلشَّافِعِيِّ قَوْلٌ بِصِحَّتِهِ إِذَا وَصَفَهُ وَصْفًا يَخْرُجُ بِهِ مِنَ الْجَهَالَةِ الْمُطْلَقَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":822},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلا يَصِحُّ بَيْعُ غَيْرِ الْمُكَلَّفِ وَعَلَيْهِ أَيْ لا يَصِحُّ بَيْعُ الْمَجْنُونِ وَالصَّبِيِّ وَيَجُوزُ بَيْعُ الصَّبِيِّ الْمُمَيِّزِ فِي مَذْهَبِ الإِمَامِ أَحْمَدَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":823},{"type":"p","text":"   الشَّرْحُ لا يَصِحُّ بَيْعُ الْمَجْنُونِ وَالصَّبِيِّ مَالَهُ مِنْ غَيْرِهِ وَلا يَجُوزُ لِلْمُكَلَّفِ أَنْ يَبِيعَهُ مَالَهُ، وَأَجَازَ بَعْضُ الأَئِمَّةِ بَيْعَ الصَّبِيِّ الْمُمَيِّزِ بِإِذْنِ وَلِيِّهِ وَذَلِكَ مَذْهَبُ أَحْمَدَ وَءَاخَرِينَ. وَيَدْخُلُ فِي حُكْمِ مَا مَرَّ مِنْ عَدَمِ صِحَّةِ بَيْعِ غَيْرِ الْمُكَلَّفِ عَدَمُ صِحَّةِ بَيْعِ الْمُكْرَهِ وَكَذَلِكَ شِرَاؤُهُ، وَالْمُكْرَهُ هُنَا هُوَ مَنْ هُدِّدَ بِنَحْوِ الْقَتْلِ أَوْ قَطْعِ الأَطْرَافِ أَوِ الضَّرْبِ الشَّدِيدِ أَوْ نَحْوِ ذَلِكَ فَلا يَصِحُّ بَيْعُهُ لِأَنَّهُ غَيْرُ مُكَلَّفٍ بِالنِّسْبَةِ لِمَا أُكْرِهَ عَلَيْهِ كَمَا يُفْهَمُ مِنْ حَدِيثِ «إِنَّ اللَّهَ تَجَاوَزَ لِي عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ» رَوَاهُ التِّرْمِذِيُّ، فَإِذَا حَرُمَ إِكْرَاهُهُ عَلَى بَيْعِهِ حَرُمَ شِرَاؤُهُ مِنْهُ مَعَ الْعِلْمِ بِأَنَّهُ مُكْرَهٌ إِلَّا أَنْ يَكُونَ أُكْرِهَ بِحَقٍّ شَرْعِيٍّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":824},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ لا قُدْرَةَ عَلَى تَسْلِيمِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":825},{"type":"p","text":"   الشَّرْحُ مِنَ الْبَيْعِ الْمُحَرَّمِ أَنْ يَبِيعَ مَا لا قُدْرَةَ لَهُ عَلَى تَسْلِيمِهِ، يُسْتَثْنَى مَا لَوْ كَانَ الْمُشْتَرِي قَادِرًا عَلَى تَسَلُّمِهِ فَيَجُوزُ وَيَصِحُّ الْبَيْعُ، فَلا يَصِحُّ بَيْعُ ضَالٍّ وَمَغْصُوبٍ وَنَادٍّ لِمَنْ لا يَقْدِرُ عَلَى رَدِّهِ بِخِلافِهِ لِقَادِرٍ عَلَى ذَلِكَ بِلا كَثِيرِ مُؤْنَةٍ أَوْ كُلْفَةٍ فَيَجُوزُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":826},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَا لا مَنْفَعَةَ فِيهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":827},{"type":"p","text":"الشَّرْحُ لا يَجُوزُ شِرَاءُ مَا لا مَنْفَعَةَ فِيهِ حِسًّا كَالْخُبْزِ الْمُحْتَرِقِ الَّذِي لا يُقْصَدُ لِلأَكْلِ أَوْ شَرْعًا مَعَ وُجُودِهَا حِسًّا كَآلاتِ اللَّهْوِ وَصُلْبَانِ الذَّهَبِ وَالْفِضَّةِ وَالصُّوَرِ الَّتِي هِيَ لِذَوِي الأَرْوَاحِ الَّتِي تَكُونُ بِهَيْئَةٍ يَعِيشُ بِهَا ذَلِكَ الْحَيَوَانُ وَكَذَلِكَ الْحَشَرَاتُ وَهِيَ صِغَارُ دَوَابِّ الأَرْضِ كَالْحَيَّةِ وَالْعَقْرَبِ وَالْفَأْرَةِ وَالْخُنْفُسَاءِ وَإِنْ ذَكَرَ لَهَا أَصْحَابُ ذِكْرِ خَوَاصِّ الْحَيَوَانَاتِ خَوَاصَّ فَلا يَجُوزُ بَيْعُهَا وَلا شِرَاؤُهَا بِخِلافِ مَا يَنْفَعُ مِنْهَا كَالضَّبِّ لِأَكْلِهِ وَالْعَلَقِ لِامْتِصَاصِهِ الدَّمَ. وَكَذَلِكَ لا يَجُوزُ بَيْعُ السِّبَاعِ الَّتِي لَيْسَ لَهَا نَفْعٌ مُعْتَبَرٌ كَالأَسَدِ وَالذِّئْبِ وَالنَّمِرِ بِخِلافِ مَا يَنْفَعُ مِنْهَا كَالضَّـبُعِ لِلأَكْلِ فِي مَذْهَبِ الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ وَالْفَهْدِ لِلصَّيْدِ وَالْفِيلِ لِلْقِتَالِ. وَيُشْتَرَطُ فِي الثَّمَنِ مِثْلُ ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":828},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلا يَصِحُّ عِنْدَ بَعْضٍ بِلا صِيغَةٍ وَيَكْفِي التَّرَاضِي عِنْدَ ءَاخَرِينَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":829},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ الْبَيْعِ عَلَى مَا هُوَ مَنْصُوصُ الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ الصِّيغَةُ أَيِ اللَّفْظُ مِنَ الْجَانِبَيْنِ، وَاخْتَارَ بَعْضُ أَصْحَابِهِ صِحَّتَهُ بِالْمُعَاطَاةِ بِدُونِ صِيغَةٍ وَهِيَ أَنْ يَدْفَعَ الثَّمَنَ وَيَأْخُذَ الْمَبِيعَ بِلا لَفْظٍ وَهُوَ مَذْهَبُ مَالِكٍ فَالْبَيْعُ عِنْدَهُ يَنْعَقِدُ بِكُلِّ مَا يَعُدُّهُ النَّاسُ بَيْعًا مِنْ غَيْرِ اشْتِرَاطِ اللَّفْظِ وَهُوَ اخْتِيَارُ بَعْضِ أَهْلِ الْمَذْهَبِ كَمَا تَقَدَّمَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":830},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبَيْعُ مَا لا يَدْخُلُ تَحْتَ الْمِلْكِ كَالْحُرِّ وَالأَرْضِ الْمَوَاتِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":831},{"type":"p","text":"الشَّرْحُ يَحْرُمُ بَيْعُ مَا لَيْسَ مَمْلُوكًا كَالإِنْسَانِ الْحُرِّ أَيْ غَيْرِ الرَّقِيقِ وَالأَرْضِ الْمَوَاتِ أَيِ الَّتِي لَمْ تُعْمَرْ لِأَنَّ الْمَوَاتَ لا يُمْلَكُ إِلَّا بِالإِحْيَاءِ أَيْ بِتَهْيِئَتِهِ لِلِانْتِفَاعِ إِمَّا لِلزِّرَاعَةِ أَوِ السَّكَنِ وَنَحْوِ ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":832},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبَيْعُ الْمَجْهُولِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":833},{"type":"p","text":"الشَّرْحُ مِنْ شُرُوطِ الْبَيْعِ أَنْ يَكُونَ الْعِوَضَانِ مَعْلُومَيْنِ فَيَحْرُمُ وَلا يَصِحُّ بَيْعُ الْمَجْهُولِ لِأَنَّهُ مِنَ الْغَرَرِ الْمَنْهِيِّ عَنْهُ كَأَنْ يَقُولَ لَهُ بِعْتُكَ أَحَدَ هَذَيْنِ الثَّوْبَيْنِ مِنْ غَيْرِ أَنْ يُبَيِّنَ لَهُ فَيَأْخُذَ أَحَدَهُمَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":834},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالنَّجِسِ كَالدَّمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":835},{"type":"p","text":"الشَّرْحُ يَحْرُمُ بَيْعُ النَّجِسِ عَلَى اخْتِلافِ أَنْوَاعِهِ وَذَلِكَ كَالدَّمِ فَإِنَّهُ مُتَّفَقٌ عَلَى نَجَاسَتِهِ وَعَلَى تَحْرِيمِ أَكْلِهِ وَقِيلَ دَمُ السَّمَكِ طَاهِرٌ. وَالْمُرَادُ بِالنَّجِسِ هُنَا نَجِسُ الْعَيْنِ. وَحُكْمُ الْمُتَنَجِّسِ الَّذِي لا يُمْكِنُ تَطْهِيرُهُ بِالْمَاءِ كَالزَّيْتِ الْمُتَنَجِّسِ مِثْلُ حُكْمِ نَجِسِ الْعَيْنِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":836},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكُلِّ مُسْكِرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":837},{"type":"p","text":"الشَّرْحُ يَحْرُمُ بَيْعُ الْمُسْكِرِ أَيْ مَا يُغَيِّرُ الْعَقْلَ مَعَ نَشْوَةٍ وَطَرَبٍ وَلَوْ كَانَ هَذَا الْمُسْكِرُ مِنْ غَيْرِ عَصِيرِ الْعِنَبِ كَالْعَسَلِ الْمَمْزُوجِ بِالْمَاءِ إِذَا غَلَى مِنَ الْمُكْثِ. قَالَ عَبْدُ اللَّهِ بنُ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا «اجْتَنِبْ كُلَّ شَىْءٍ يَنِشُّ» رَوَاهُ النَّسَائِيُّ. وَالنَّشِيشُ صَوْتُ غَلَيَانِ الشَّرَابِ وَهُوَ الْحَدُّ الْفَاصِلُ بَيْنَ النَّبِيذِ الْحَلالِ وَالنَّبِيذِ الْمُحَرَّمِ فَنَبِيذُ التَّمْرِ وَالْعَسَلِ وَالْحِنْطَةِ وَالشَّعِيرِ وَنَحْوِ ذَلِكَ لا يَحْرُمُ قَبْلَ أَنْ يَغْلِيَ وَلا يُسَمَّى خَمْرًا إِلَّا بَعْدَ أَنْ يَغْلِيَ وَلَيْسَ الْمُرَادُ بِالْغَلَيَانِ الْغَلَيَانَ بِالْوَضْعِ عَلَى النَّارِ بَلِ الْغَلَيَانُ الَّذِي يَنْشَأُ فِي الْعَصِيرِ مِنَ الْمُكْثِ مَعَ تَغْطِيَةِ إِنَائِهِ، يَحْصُلُ لِلْغَلَيَانِ صَوْتٌ وَيَرْتَفِعُ الشَّرَابُ عِنْدَ الْغَلَيَانِ إِلَى أَعْلَى وَعِنْدَ ذَلِكَ يَصِيرُ مُسْكِرًا ثُمَّ يَنْـزِلُ وَيَصْفُو فَيَسْتَطِيبُهُ شَرَبَةُ الْخُمُورِ ثُمَّ لا يَزَالُ مُحَرَّمًا إِلَى أَنْ يَصِيرَ خَلًّا وَذَلِكَ بِ

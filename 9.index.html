ْقِطَاعِ وَقَبْلَ الْغُسْلِ، وَكَذَلِكَ يَحْرُمُ بَعْدَ الْغُسْلِ الَّذِي لَمْ تَقْتَرِنْ بِهِ نِيَّةٌ، وَكَذَلِكَ بَعْدَ الْغُسْلِ بِنِيَّةٍ لَكِنْ مِنْ غَيْرِ اسْتِيفَاءِ شُرُوطِ الْغُسْلِ. وَيَقُومُ مَقَامَ الْغُسْلِ التَّيَمُّمُ بِشَرْطِهِ. قَالَ الْفُقَهَاءُ يَكْفُرُ مُسْتَحِلُّ وَطْءِ الْمَرْأَةِ فِي حَالِ الْحَيْضِ لِأَنَّ حُرْمَتَهُ مَعْلُومَةٌ مِنَ الدِّينِ بِالضَّرُورَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1133},{"type":"p","text":"أَمَّا الِاسْتِمْتَاعُ بِغَيْرِ الْوَطْءِ فَهُوَ جَائِزٌ إِنْ كَانَ فِيمَا عَدَا مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ وَيَحْرُمُ فِيمَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ إِنْ كَانَ بِلا حَائِلٍ، وَفِي الْمَذْهَبِ الشَّافِعِيِّ قَوْلٌ بِجَوَازِ الِاسْتِمْتَاعِ بِالْحَائِضِ بِغَيْرِ الْجِمَاعِ مُطْلَقًا أَيْ أَكَانَ بِحَائِلٍ أَمْ بِلا حَائِلٍ وَهُوَ ظَاهِرُ حَدِيثِ مُسْلِمٍ «اصْنَعُوا كُلَّ شَىْءٍ إِلَّا النِّكَاحَ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1134},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّكَشُّفُ عِنْدَ مَنْ يَحْرُمُ نَظَرُهُ إِلَيْهِ أَوْ فِي الْخَلْوَةِ لِغَيْرِ غَرَضٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1135},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مُحَرَّمَاتِ الْفَرْجِ كَشْفَ الْعَوْرَةِ عِنْدَ مَنْ يَحْرُمُ نَظَرُهُ إِلَيْهَا وَكَذَا فِي الْخَلْوَةِ لِغَيْرِ غَرَضٍ. وَعُلِمَ مِمَّا مَضَى أَنَّهُ يَجُوزُ التَّكَشُّفُ أَيْ كَشْفُ مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ فِي الْخَلْوَةِ حَتَّى الْعَوْرَةِ الْمُغَلَّظَةِ لِغَرَضٍ كَالتَّبَرُّدِ وَنَحْوِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1136},{"type":"p","text":"تَنْبِيهٌ مُشْتَمِلٌ عَلَى بَعْضِ مَا مَرَّ وَزِيَادَة. لا يَجُوزُ إِنْكَارُ كَشْفِ الرَّجُلِ فَخِذَهُ مَا سِوَى السَّوْأَتَيْنِ أَمَامَ غَيْرِهِ إِنْ كَانَ لا يَعْتَقِدُ حُرْمَةَ ذَلِكَ وَأَمَّا مَنْ يَعْتَقِدُ حُرْمَةَ ذَلِكَ فَيُنْكَرُ عَلَيْهِ وَذَلِكَ لِأَنَّ مِنْ شُرُوطِ إِنْكَارِ الْمُنْكَرِ أَنْ يَكُونَ الْمُنْكَرُ مُجْمَعًا عَلَى تَحْريِمِهِ وَقَدْ تَقَدَّمَ ذَلِكَ وَلَيْسَ مَا سِوَى السَّوْأَتَيْن كَالْفَخِذِ مِمَّا أُجْمِعَ عَلَى وُجُوبِ سَتْرِهِ بِالنِّسْبَةِ لِلذَّكَرِ بَلْ جَوَازُ كَشْفِهِ مَذْهَبُ الإِمَامِ الْمُجْتَهِدِ التَّابِعِيِّ الْجَلِيلِ عَطَاءِ بنِ أَبِي رَبَاحٍ الَّذِي قَالَ فِيهِ أَبُو حَنِيفَةَ مَا رَأَيْتُ أَفْقَهَ مِنْهُ وَثَبَتَ أَنَّهُ أَحَدُ قَوْلَيْ مَالِكٍ وَأَحْمَدَ بنِ حَنْبَلٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1137},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَاسْتِقْبَالُ الْقِبْلَةِ أَوِ اسْتِدْبَارُهَا بِبَوْلٍ أَوْ غَائِطٍ مِنْ غَيْرِ حَائِلٍ أَوْ بَعُدَ عَنْهُ أَكْثَرَ مِنْ ثَلاثَةِ أَذْرُعٍ أَوْ كَانَ أَقَلَّ مِنْ ثُلُثَيْ ذِرَاعٍ إِلَّا فِي الْمُعَدِّ لِذَلِكَ أَيْ إِلَّا فِي الْمَكَانِ الْمُعَدِّ لِقَضَاءِ الْحَاجَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1138},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْفَرْجِ اسْتِقْبَالَ الْقِبْلَةِ أَوِ اسْتِدْبَارَهَا بِبَوْلٍ أَوْ غَائِطٍ فِي غَيْرِ الْمَكَانِ الْمُعَدِّ لِقَضَاءِ الْحَاجَةِ مِنْ غَيْرِ حَائِلٍ بَيْنَهُ وَبَيْنَ الْقِبْلَةِ وَالأَصْلُ فِي ذَلِكَ حَدِيثُ الصَّحِيحَيْنِ «لا تَسْتَقْبِلُوا الْقِبْلَةَ وَلا تَسْتَدْبِرُوهَا بِغَائِطٍ وَلا بَوْلٍ وَلَكِنْ شَرِّقُوا أَوْ غَرِّبُوا» وَأَمَّا مَعَ الْحَائِلِ فَيَجُوزُ ذَلِكَ بِشَرْطِ أَنْ يَكُونَ ارْتِفَاعُ الْحَائِلِ ثُلُثَيْ ذِرَاعٍ فَأَكْثَرَ وَأَنْ لا يَبْعُدَ عَنْهُ أَكْثَرَ مِنْ ثَلاثَةِ أَذْرُعٍ. وَكَذَلِكَ يَجُوزُ اسْتِقْبَالُ الْقِبْلَةِ وَاسْتِدْبَارُهَا بِالْبَوْلِ أَوْ بِالْغَائِطِ فِي الْمَكَانِ الْمُعَدِّ لِقَضَاءِ الْحَاجَةِ. فَإِذَا عُلِمَ ذَلِكَ فَمَا لِهَؤُلاءِ الَّذِينَ يُحَرِّمُونَ مَدَّ الرِّجْلِ إِلَى الْقِبْلَةِ فِي حَالِ الْجُلُوسِ وَنَحْوِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1139},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّغَوُّطُ عَلَى الْقَبْرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1140},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ جُمْلَةِ الْمَعَاصِي التَّغَوُّطَ عَلَى الْقَبْرِ. قَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «لَأَنْ يَجْلِسَ أَحَدُكُمْ عَلَى جَمْرَةٍ فَتُحْرِقَ ثِيَابَهُ وَتَخْلُصَ إِلَى جِلْدِهِ خَيْرٌ لَهُ مِنْ أَنْ يَجْلِسَ عَلَى قَبْرٍ» رَوَاهُ مُسْلِمٌ مِنْ حَدِيثِ أَبِي هُرَيْرَةَ. وَالْمُرَادُ بِالْجُلُوسِ الْجُلُوسُ لِلْبَوْلِ أَوِ الْغَائِطِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1141},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْبَوْلُ فِي الْمَسْجِدِ وَلَوْ فِي إِنَاءٍ وَعَلَى الْمُعَظَّمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1142},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْفَرْجِ الْبَوْلَ فِي الْمَسْجِدِ وَلَوْ كَانَ فِي إِنَاءٍ بِخِلافِ الْفَصْدِ وَالْحِجَامَةِ فِيهِ فِي الإِنَاءِ فَإِنَّ ذَلِكَ لا يَحْرُمُ فَلَيْسَ حُكْمُهُ كَالْبَوْلِ لأِنَّ الْبَوْلَ أَفْحَشُ. وَيَحْرُمُ الْبَوْلُ عَلَى مُعَظَّمٍ أَيْ مَا يُعَظَّمُ شَرْعًا وَكَذَلِكَ قَضَاءُ الْحَاجَةِ فِي مَوْضِعِ نُسُكٍ ضَيِّقٍ كَالْجَمْرَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1143},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَرْكُ الْخِتَانِ لِلْبَالِغِ وَيَجُوزُ عِنْدَ مَالِكٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1144},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مُحَرَّمَاتِ الْفَرْجِ تَرْكَ الْخِتَانِ بَعْدَ الْبُلُوغِ فَإِنَّهُ يَجِبُ عَلَى الْمُكَلَّفِ غَيْرِ الْمَخْتُونِ الْخِتَانُ إِنْ أَطَاقَ ذَلِكَ، وَيَحْصُلُ ذَلِكَ بِقَطْعِ قُلْفَةِ الذَّكَرِ. وَيَجِبُ عِنْدَ الإِمَامِ الشَّافِعِيِّ خِتَانُ الأُنْثَى أَيْضًا بِقَطْعِ شَىْءٍ يَحْصُلُ بِهِ اسْمُ الْقَطْعِ مِنَ الْقِطْعَةِ الْمُرْتَفِعَةِ كَعُرْفِ الدِّيكِ مِنَ الأُنْثَى. وَمَذْهَبُ مَالِكٍ وَغَيْرِهِ مِنَ الأَئِمَّةِ أَنَّهُ غَيْرُ وَاجِبٍ عَلَى الذَّكَرِ وَالأُنْثَى وَإِنَّمَا هُوَ سُنَّةٌ، وَمِنْ هُنَا يَنْبَغِي التَّلَطُّفُ بِمَنْ يَدْخُلُ فِي الإِسْلامِ وَهُوَ غَيْرُ مُخْتَتِنٍ فَلا يَنْبَغِي أَنْ يُكَلَّمَ بِذَلِكَ إِنْ كَانَ يُخْشَى مِنْهُ النُّفُورُ مِنَ الإِسْلامِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1145}]},{"id":"foot-sins","title":"مَعَاصِي الرِّجْلِ","description":"الفصل المخصص لبيان معاصي الرجل.","icon":"fa-person-walking","start":1146,"end":1162,"paragraphCount":16,"wordCount":740,"readMinutes":5,"blocks":[{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1146},{"type":"p","text":"الشَّرْحُ  أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مَعَاصِي الرِّجْلِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1147},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ مَعَاصِي الرِّجْلِ الْمَشْيُ فِي مَعْصِيَةٍ كَالْمَشْيِ فِي سِعَايَةٍ بِمُسْلِمٍ أَوْ فِي قَتْلِهِ بِغَيْرِ حَقٍّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1148},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الرِّجْلِ الَّتِي مِنَ الْكَبَائِرِ السِّعَايَةَ بِالْمُسْلِمِ لِلإِضْرَارِ بِهِ لأِنَّ السِّعَايَةَ فِيهَا أَذًى كَبِيرٌ لأِنَّهُ يَحْصُلُ بِهَا إِدْخَالُ الرُّعْبِ إِلَى الْمَسْعِيِّ بِهِ وَتَرْوِيعُ أَهْلِهِ بِطَلَبِ السُّلْطَانِ، وَيَدُلُّ عَلَى ذَلِكَ حَدِيثُ التِّرْمِذِيِّ أَنَّ يَهُودِيَيْنِ سَأَلا النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ قَوْلِهِ تَعَالَى ﴿وَلَقَدْ ءَاتَيْنَا مُوسَى تِسْعَ ءَايَاتٍ بَيِّنَاتٍ﴾ [سُورَةَ الإِسْرَاء/101] فَأَجَابَهُمَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَذَكَرَ مِنْهَا «وَلا تَذْهَبُوا بِبَرِيءٍ إِلَى ذِي سُلْطَانٍ لِيَقْتُلَهُ» الْحَدِيثَ. وَهَذَا إِذَا كَانَتِ السِّعَايَةُ بِهِ بِغَيْرِ حَقٍّ أَمَّا السِّعَايَةُ بِحَقٍّ فَهِيَ جَائِزَةٌ. وَكَذَلِكَ يَحْرُمُ الْمَشْيُ بِالرِّجْلِ فِي كُلِّ مَعْصِيَةٍ كَالْمَشْيِ لِلزِّنَى بِامْرَأَةٍ أَوِ التَّلَذُّذِ الْمُحَرَّمِ بِمَا دُونَ ذَلِكَ. وَقَدْ حَصَلَ مِنَ الطَّائِفَةِ الْمُسَمَّاةِ حِزْبَ التَّحْرِيرِ الَّتِي سَبَقَ ذِكْرُهَا أَنَّهُمْ نَشَرُوا بِطَرَابُلُسَ الشَّامِ مَنْشُورًا يَتَضَمَّنُ جَوَازَ مَشْيِ الرَّجُلِ لِلزِّنَى بِامْرَأَةٍ وَزَعَمُوا أَنَّ هَذَا جَائِزٌ إِنَّمَا الْحَرَامُ الزِّنَى الْحَقِيقِيُّ بِاسْتِعْمَالِ الآلَةِ قَالُوا وَكَذَلِكَ الْمَشْيُ بِقَصْدِ الْفُجُورِ بِغُلامٍ لا يَكُونُ مَعْصِيَةً إِلاَّ بِاسْتِعْمَالِ الآلَةِ فِيهِ وَكَفَاهُمْ هَذَا خِزْيًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1149},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِبَاقُ الْعَبْدِ وَالزَّوْجَةِ وَمَنْ عَلَيْهِ حَقٌّ عَمَّا يَلْزَمُهُ مِنْ قِصَاصٍ أَوْ دَيْنٍ أَوْ نَفَقَةٍ أَوْ بِرِّ وَالِدَيْهِ أَوْ تَرْبِيَةِ الأَطْفَالِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1150},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الرِّجْلِ الَّتِي هِيَ مِنَ الْكَبَائِرِ إِبَاقَ أَيْ هُرُوبَ الْعَبْدِ أَيِ الْمَمْلُوكِ ذَكَرًا كَانَ أَوْ أُنْثَى مِنْ سَيِّدِهِ وَالزَّوْجَةِ مِنْ زَوْجِهَا وَذَلِكَ كَبِيرَةٌ إِذَا لَمْ يَكُنْ عُذْرٌ. وَكَذَلِكَ يَحْرُمُ الْهَرَبُ مِنْ أَدَاءِ الْحَقِّ الْوَاجِبِ عَلَى الشَّخْصِ الَّذِي يَلْزَمُهُ كَأَنْ لَزِمَهُ قِصَاصٌ بِأَنْ قَتَلَ نَفْسًا مَعْصُومَةً عَمْدًا ظُلْمًا أَوْ فَقَأَ عَيْنَ شَخْصٍ مَعْصُومٍ عَمْدًا ظُلْمًا، أَوْ لَزِمَهُ نَفَقَةٌ وَاجِبَةٌ لِلزَّوْجَةِ أَوْ لِلْوَالِدَيْنِ أَوْ لِلأَطْفَالِ. وَتَحْرِيمُ الْهُرُوبِ مِنَ النَّفَقَةِ الْوَاجِبَةِ يَدُلُّ عَلَيْهِ حَدِيثُ «كَفَى بِالْمَرْءِ إِثْمًا أَنْ يُضَيِّعَ مَنْ يَقُوتُ» رَوَاهُ الْحَاكِمُ وَفِي رِوَايَةٍ «مَنْ يَعُولُ» رَوَاهَا أَبُو دَاوُدَ أَيْ مَنْ تَجِبُ عَلَيْهِ نَفَقَتُهُ، فَفِي هَذَا بَيَانُ أَنَّ ذَلِكَ مِنْ كَبَائِرِ الْمَعَاصِي.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1151},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّبَخْتُرُ فِي الْمَشْيِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1152},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الرِّجْلِ الَّتِي هِيَ مِنَ الْكَبَائِرِ التَّبَخْتُرَ فِي الْمَشْيِ أَيْ مِشْيَةَ الْكِبْرِ وَالْخُيَلاءِ، قَالَ اللَّهُ تَعَالَى ﴿وَلا تَمْشِ فِي الأَرْضِ مَرَحًا﴾ [سُورَةَ الإِسْرَاء/37] أَيْ لا تَمْشِ فِي الأَرْضِ مُخْتَالًا فَخُورًا، وَقَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «مَا مِنْ رَجُلٍ يَتَعَاظَمُ فِي نَفْسِهِ وَلا اخْتَالَ فِي مَشْيِهِ إِلَّا لَقِيَ اللَّهَ وَهُوَ عَلَيْهِ غَضْبَانٌ» رَوَاهُ الْبَيْهَقِيُّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1153},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَخَطِّي الرِّقَابِ إِلَّا لِفُرْجَةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1154},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الرِّجْلِ تَخَطِّي الرِّقَابِ أَيْ إِذَا كَانَ النَّاسُ يَتَأَذَّوْنَ بِذَلِكَ وَذَلِكَ لِحَدِيثِ عَبْدِ اللَّهِ بنِ بُسْرٍ جَاءَ رَجُلٌ يَتَخَطَّى رِقَابَ النَّاسِ يَوْمَ الْجُمُعَةِ وَالنَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَخْطُبُ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «اجْلِسْ فَقَدْ ءَاذَيْتَ» رَوَاهُ أُبُو دَاوُدَ وَابْنُ حِبَّانَ وَرَوَى الْبَيْهَقِيُّ وَغَيْرُهُ «مَنْ تَخَطَّى رِقَابَ النَّاسِ يَوْمَ الْجُمُعَةِ اتَّخَذَ جِسْرًا إِلَى جَهَنَّمَ»، فَإِنْ كَانُوا لا يَتَأَذَّوْنَ بِتَخَطِّيهِ لِرِقَابِهِمْ فَهُوَ مَكْرُوهٌ . وَأَمَّا التَّخَطِّي لِفُرْجَةٍ أَيْ لِأَجْلِ سَدِّهَا فَهُوَ جَائِزٌ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1155},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْمُرُورُ بَيْنَ يَدَيِ الْمُصَلِّي إِذَا كَمَلَتْ شُرُوطُ السُّتْرَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1156},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ جُمْلَةِ مَعَاصِي الرِّجْلِ الْمُرُورَ بَيْنَ يَدَيِ الْمُصَلِّي صَلاةً صَحِيحَةً بِالنِّسْبَةِ لِمَذْهَبِ الْمُصَلِّي مَعَ حُصُولِ السُّتْرَةِ الْمُعْتَبَرَةِ بِأَنْ قَرُبَ مِنْهَا ثَلاثَةَ أَذْرُعٍ فَأَقَلَّ بِذِرَاعِ الْيَدِ الْمُعْتَدِلَةِ وَكَانَتْ مُرْتَفِعَةً ثُلُثَيْ ذِرَاعٍ فَأَكْثَرَ. وَتَحْرِيمُ ذَلِكَ لِحَدِيثِ «لَوْ يَعْلَمُ الْمَارُّ بَيْنَ يَدَيِ الْمُصَلِّي مَاذَا عَلَيْهِ مِنَ الإِثْمِ لَكَانَ أَنْ يَقِفَ أَرْبَعِينَ خَرِيفًا خَيْرًا لَهُ مِنْ أَنْ يَمُرَّ بَيْنَ يَدَيْهِ» رَوَاهُ أَبُو دَاوُدَ فَإِذَا وُجِدَتِ السُّتْرَةُ سُنَّ لِلْمُصَلِّي أَنْ يَدْفَعَ الْمَارَّ بَيْنَهُ وَبَيْنَ السُّتْرَةِ، وَإِنْ لَمْ تُوجَدِ السُّتْرَةُ فَلَيْسَ لِلْمُصَلِّي أَنْ يُزْعِجَ الْمَارَّ بَيْنَ يَدَيْهِ وَلَوِ اقْتَرَبَ مِنْهُ بِذِرَاعٍ أَوْ نَحْوِ ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1157},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَدُّ الرِّجْلِ إِلَى الْمُصْحَفِ إِذَا كَانَ غَيْرَ مُرْتَفِعٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1158},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مُحَرَّمَاتِ الرِّجْلِ مَدَّهَا إِلَى الْمُصْحَفِ إِذَا كَانَ قَرِيبًا غَيْرَ مُرْتَفِعٍ عَلَى شَىْءٍ لِأَنَّ فِي ذَلِكَ إِهَانَةً لَهُ، كَمَا يَحْرُمُ كَتْبُهُ بِنَجِسٍ وَمَسُّهُ بِعُضْوٍ مُتَنَجِّسٍ رَطْبٍ أَوْ جَافٍّ. وَمَا ذُكِرَ فِي بَعْضِ كُتُبِ الْحَنَفِيَّةِ مِنْ جَوَازِ كَتْبِ الْفَاتِحَةِ بِالْبَوْلِ لِلِاسْتِشْفَاءِ إِنْ عُلِمَ فِيهِ الشِّفَاءُ فَهُوَ ضَلالٌ مُبِينٌ. أَنَّى يَكُونُ فِي ذَلِكَ شِفَاءٌ وَكَيْفَ يَتَصَوَّرُ عَاقِلٌ ذَلِكَ، كَيْفَ وَقَدْ نَصَّ الْفُقَهَاءُ عَلَى حُرْمَةِ تَقْلِيبِ أَوْرَاقِ الْمُصْحَفِ بِالإِصْبَعِ الْمَبْلُولَةِ بِالْبُصَاقِ، كَيْفَ وَقَدْ ذَكَرَ الشَّيْخُ مُحَمَّدُ عِلَّيْش الْمَالِكِيُّ فِي فَتَاوِيهِ بِأَنَّ ذَلِكَ رِدَّةٌ مَعَ أَنَّ إِطْلاقَ هَذَا الْقَوْلِ غَيْرُ سَدِيدٍ لَكِنْ تَحْرِيمُ ذَلِكَ لَيْسَ فِيهِ تَرَدُّدٌ. وَيَحْرُمُ كِتَابَةُ شَىْءٍ مِنَ الْقُرْءَانِ الْفَاتِحَةِ أَوْ غَيْرِهَا بِدَمِ الشَّخْصِ نَفْسِهِ لِلِاسْتِشْفَاءِ وَغَيْرِهِ مِنَ الأَغْرَاضِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1159},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكُلُّ مَشْيٍ إِلَى مُحَرَّمٍ وَتَخَلُّفٍ عَنْ وَاجِبٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1160},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الرِّجْلِ الْمَشْيَ بِهَا إِلَى مَا حَرَّمَ اللَّهُ تَعَالَى عَلَى اخْتِلافِ أَنْوَاعِهِ، وَكَذَلِكَ الْمَشْيُ إِلَى مَا فِيهِ إِضَاعَةُ وَاجِبٍ كَأَنْ يَمْشِيَ مَشْيًا يَحْصُلُ بِهِ إِخْرَاجُ صَلاةٍ عَنْ وَقْتِهَا قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا لا تُلْهِكُمْ أَمْوَالُكُمْ وَلا أَوْلادُكُمْ عَنْ ذِكْرِ اللَّهِ وَمَنْ يَفْعَلْ ذَلِكَ فَأُولَئِكَ هُمُ الْخَاسِرُونَ﴾ [سُورَةَ الْمُنَافِقُونَ/9].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1161}]},{"id":"body-sins","title":"مَعَاصِي الْبَدَنِ","description":"الفصل المخصص لبيان معاصي البدن.","icon":"fa-person","start":1162,"end":1273,"paragraphCount":110,"wordCount":4981,"readMinutes":28,"blocks":[{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1162},{"type":"p","text":"الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مَعَاصِي الْبَدَنِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1163},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ مَعَاصِي الْبَدَنِ عُقُوقُ الْوَالِدَيْنِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1164},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ أَيْ مِنَ الْمَعَاصِي الَّتِي لا تَلْزَمُ جَارِحَةً مِنَ الْجَوَارِحِ بِخُصُوصِهَا عُقُوقَ الْوَالِدَيْنِ أَوْ أَحَدِهِمَا وَإِنْ عَلا وَلَوْ مَعَ وُجُودِ أَقْرَبَ مِنْهُ، قَالَ بَعْضُ الشَّافِعِيَّةِ فِي ضَبْطِهِ «هُوَ مَا يَتَأَذَّى بِهِ الْوَالِدَانِ أَوْ أَحَدُهُمَا تَأَذِّيًا لَيْسَ بِالْهَيِّنِ فِي الْعُرْفِ». وَقَدْ صَحَّ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ قَالَ «ثَلاثَةٌ لا يَدْخُلُونَ الْجَنَّةَ الْعَاقُّ لِوَالِدَيْهِ وَالدَّيُّوثُ وَرَجُلَةُ النِّسَاءِ» رَوَاهُ الْبَيْهَقِيُّ أَيْ لا يَدْخُلُ هَؤُلاءِ الثَّلاثَةُ الْجَنَّةَّ مَعَ الأَوَّلِينَ إِنْ لَمْ يَتُوبُوا وَأَمَّا إِنْ تَابُوا فَقَدْ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «التَّائِبُ مِنَ الذَّنْبِ كَمَنْ لا ذَنْبَ لَهُ» رَوَاهُ ابْنُ مَاجَهْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1165},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْفِرَارُ مِنَ الزَّحْفِ وَهُوَ أَنْ يَفِرَّ مِنْ بَيْنِ الْمُقَاتِلِينَ فِي سَبِيلِ اللَّهِ بَعْدَ حُضُورِ مَوْضِعِ الْمَعْرَكَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1166},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ جُمْلَةِ مَعَاصِي الْبَدَنِ الْفِرَارَ مِنَ الزَّحْفِ وَهُوَ مِنَ الْكَبَائِرِ إِجْمَاعًا. قَالَ الشَّافِعِيُّ رَضِيَ اللَّهُ عَنْهُ «إِذَا غَزَا الْمُسْلِمُونَ وَلَقُوا ضِعْفَهُمْ مِنَ الْعَدُوِّ حَرُمَ عَلَيْهِمْ أَنْ يُوَلُّوا أَيْ أَنْ يَفِرُّوا إِلَّا مُتَحَرِّفِينَ لِقَتَالٍ أَوْ مُتَحَيِّزِينَ إِلَى فِئَةٍ وَإِنْ كَانَ الْمُشْرِكُونَ أَكْثَرَ مِنْ ضِعْفِهِمْ لَمْ أُحِبَّ لَهُمْ أَنْ يُوَلُّوا وَلا يَسْتَوْجِبُونَ السَّخَطَ عِنْدِي مِنَ اللَّهِ لَوْ وَلَّوْا عَنْهُمْ عَلَى غَيْرِ التَّحَرُّفِ لِقَتَالٍ أَوِ التَّحَيُّزِ إِلَى فِئَةٍ» اﻫ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1167},{"type":"p","text":"قَالَ الْفُقَهَاءُ مِنَ الْمَذَاهِبِ الأَرْبَعَةِ إِذَا خَافَ الْمُسْلِمُونَ الْهَلاكَ جَازَ لَهُمْ مُصَالَحَةُ الْكُفَّارِ وَلَوْ بِدَفْعِ الْمَالِ لَهُمْ وَذَلِكَ لِأَنَّهُ لا خَيْرَ فِي إِقْدَامِ الْمُسْلِمِينِ عَلَى الْقِتَالِ إِذَا عَلِمُوا أَنَّهُمْ لا يُنْكُونَ بِالْعَدُوِّ أَيْ لا يُؤَثِّرُونَ فِيهِ، وَقَدْ قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا يَنْبَغِي لِمُؤْمِنٍ أَنْ يُذِلَّ نَفْسَهُ» قِيلَ وَكَيْفَ يُذِلُّ نَفْسَهُ يَا رَسُولَ اللَّهِ قَالَ «يَتَعَرَّضُ مِنَ الْبَلاءِ لِمَا لا يُطِيقُ» رَوَاهُ التِّرْمِذِيُّ وَابْنُ مَاجَهْ وَفِيهِ دَلِيلٌ عَلَى أَنَّ الْمُخَاطَرَةَ بِالنَّفْسِ الْمَحْمُودَةَ هِيَ الَّتِي يَحْصُلُ مِنْ وَرَائِهَا نَفْعٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1168},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَطِيعَةُ الرَّحِمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1169},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ قَطِيعَةَ الرَّحِمِ وَهِيَ مِنَ الْكَبَائِرِ بِالإِجْمَاعِ. قَالَ تَعَالَى ﴿وَاتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالأَرْحَامَ﴾ [سُورَةَ النِّسَاء/1] أَيِ اتَّقُوا الأَرْحَامَ أَنْ تَقْطَعُوهَا وَتَحْصُلُ الْقَطِيعَةُ بِإيِحَاشِ قُلُوبِ الأَرْحَامِ وَتَنْفِيرِهَا إِمَّا بِتَرْكِ الإِحْسَانِ بِالْمَالِ فِي حَالِ الْحَاجَةِ النَّازِلَةِ بِهِمْ بِلا عُذْرٍ أَوْ تَرْكِ الزِّيَارَةِ بِلا عُذْرٍ كَذَلِكَ، وَالْعُذْرُ كَأَنْ يَفْقِدَ مَا كَانَ يَصِلُهُمْ بِهِ مِنَ الْمَالِ أَوْ يَجِدَهُ لَكِنَّهُ يَحْتَاجُهُ لِمَا هُوَ أَوْلَى بِصَرْفِهِ فِيهِ مِنْهُمْ. وَالْمُرَادُ بِالرَّحِمِ الأَقَارِبُ كَالْعَمَّاتِ وَالْخَالاتِ وَأَوْلادِهِنَّ وَالأَخْوَالِ وَالأَعْمَامِ وَأَوْلادِهِمْ. قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ وَلَكِنَّ الْوَاصِلَ مَنْ وَصَلَ رَحِمَهُ إِذَا قَطَعَتْ» فَفِي هَذَا الْحَدِيثِ إِيذَانٌ بِأَنَّ صِلَةَ الرَّجُلِ رَحِمَهُ الَّتِي لا تَصِلُهُ أَفْضَلُ مِنْ صِلَتِهِ رَحِمَهُ الَّتِي تَصِلُهُ لِأَنَّ ذَلِكَ مِنْ حُسْنِ الْخُلُقِ الَّذِي حَضَّ الشَّرْعُ عَلَيْهِ حَضًّا بَالِغً، وَهَذَا الْحَدِيثُ رَوَاهُ الْبُخَارِيُّ وَالتِّرْمِذِيُّ وَغَيْرُهُمَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1170},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِيذَاءُ الْجَارِ وَلَوْ كَافِرًا لَهُ أَمَانٌ أَذًى ظَاهِرًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1171},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ إِيذَاءَ الْجَارِ وَلَوْ كَافِرًا لَهُ أَمَانٌ إِيذَاءً ظَاهِرًا كَأَنْ يُشْرِفَ عَلَى حُرَمِهِ، أَمَّا الِاسْتِرْسَالُ فِي سَبِّهِ وَضَرْبِهِ بِغَيْرِ سَبَبٍ شَرْعِيٍّ فَأَشَدُّ وِزْرًا بِحَيْثُ إِنَّ الأَذَى الْقَلِيلَ لِغَيْرِ الْجَارِ كَثِيرٌ بِالنِّسْبَةِ إِلَيْهِ، فَيَنْبَغِي الإِحْسَانُ إِلَى الْجَارِ وَالصَّبْرُ عَلَى أَذَاهُ وَبَذْلُ الْمَعْرُوفِ لَهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1172},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَخَضْبُ الشَّعَرِ بِالسَّوَادِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1173},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الْخَضْبَ بِالسَّوَادِ أَيْ دَهْنَ الشَّعَرِ وَصَبْغَهُ بِالأَسْوَدِ وَهُوَ حَرَامٌ لِلرَّجُلِ وَالْمَرْأَةِ عَلَى الْقَوْلِ الْمُخْتَارِ فِي الْمَذْهَبِ الشَّافِعِيِّ إِلَّا لِلرِّجَالِ لِلْجِهَادِ. وَأَجَازَهُ بَعْضُ الأَئِمَّةِ إِذَا لَمْ يَكُنْ يُؤَدِّي إِلَى الْغِشِّ وَالتَّلْبِيسِ وَمِثَالُهُ امْرَأَةٌ شَابَ شَعَرُهَا فَسَوَّدَتْهُ حَتَّى يَخْطُبَهَا الرِّجَالُ فَهَذهِ لا يَجُوزُ لَهَا ذَلِكَ لِكَوْنِهِ يُؤَدِّي إِلَى الْغِشِّ وَالتَّلْبِيسِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1174},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَشَبُّهُ الرِّجَالِ بِالنِّسَاءِ وَعَكْسُهُ أَيْ بِمَا هُوَ خَاصٌّ بِأَحَدِ الْجِنْسَيْنِ فِي الْمَلْبَسِ وَغَيْرِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1175},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ تَشَبُّهَ الرِّجَالِ بِالنِّسَاءِ فِي الْمَشْيِ أَوْ فِي الْكَلامِ أَوِ اللِّبَاسِ وَعَكْسَهُ لَكِنَّ تَشَبُّهَ النِّسَاءِ بِالرِّجَالِ أَشَدُّ إِثْمًا، فَمَا كَانَ فِي الأَصْلِ خَاصًّا بِأَحَدِ الصِّنْفَيْنِ مِنَ الزِّيِّ فَهُوَ حَرَامٌ عَلَى الصِّنْفِ الآخَرِ وَمَا لا فَلا. رَوَى الْبُخَارِيُّ فِي صَحِيحِهِ مِنْ حَدِيثِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ «لَعَنَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْمُتَشَبِّهِينَ مِنَ الرِّجَالِ بِالنِّسَاءِ وَالْمُتَشَبِّهَاتِ مِنَ النِّسَاءِ بِالرِّجَالِ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1176},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِسْبَالُ الثَّوْبِ لِلْخُيَلاءِ أَيْ إِنْزَالُهُ عَنِ الْكَعْبِ لِلْفَخْرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1177},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَطْوِيلَ الثَّوْبِ لِلْخُيَلاءِ أَيِ الْكِبْرِ وَيَكُونُ ذَلِكَ بِإِرْسَالِ الإِزَارِ وَنَحْوِهِ إِلَى أَسْفَلَ مِنَ الْكَعْبَيْنِ، قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِيمَا رَوَاهُ الْبُخَارِيُّ «لا يَنْظُرُ اللَّهُ إِلَى مَنْ جَرَّ ثَوْبَهُ خُيَلاءَ» أَيْ لا يُكْرِمُهُ بَلْ يُهِينُهُ يَوْمَ الْقِيَامَةِ، فَإِنْزَالُ الإِزَارِ إِلَى مَا تَحْتَ الْكَعْبَيْنِ حَرَامٌ مِنَ الْكَبَائِرِ إِنْ كَانَ لِلْبَطَرِ وَإِلَّا كَانَ مَكْرُوهًا لِلرَّجُلِ، وَالطَّرِيقَةُ الْمُسْتَحْسَنَةُ شَرْعًا لِلرَّجُلِ أَنْ يَكُونَ الإِزَارُ وَنَحْوُهُ إِلَى نِصْفِ السَّاقَيْنِ لِحَدِيثِ أَبِي دَاوُدَ «إِزْرَةُ الْمُؤْمِنِ إِلَى أَنْصَافِ سَاقَيْهِ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1178},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْحِنَّاءُ فِي الْيَدَيْنِ وَالرِّجْلَيْنِ لِلرَّجُلِ بِلا حَاجَةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1179},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ اسْتِعْمَالَ الْحِنَّاءِ أَيِ الْخِضَابَ بِهِ فِي الْيَدَيْنِ وَالرِّجْلَيْنِ لِلرَّجُلِ بِلا حَاجَةٍ إِلَيْهِ وَذَلِكَ لِمَا فِيهِ مِنَ التَّشَبُّهِ بِالنِّسَاءِ أَمَّا إِنْ كَانَ لِحَاجَةٍ كَأَنْ قَالَ لَهُ طَبِيبٌ ثِقَةٌ أَنْ يَفْعَلَ ذَلِكَ لِلتَّدَاوِي فَيَجُوزُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1180},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَطْعُ الْفَرْضِ بِلا عُذْرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1181},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ قَطْعَ الْفَرْضِ أَيِ الأَدَاءِ وَالْقَضَاءِ وَلَوْ كَانَ مُوَسَّعًا أَيْ وَلَوْ كَانَ الْوَقْتُ وَاسِعًا فَلَوْ أَحْرَمَ بِصَلاةِ الْفَرْضِ مَثَلًا ثُمَّ قَطَعَهَا بِلا عُذْرٍ وَلَوْ كَانَ بِحَيْثُ يَسْتَطِيعُ أَنْ يُصَلِّيَ مَرَّةً ثَانِيَةً ضِمْنَ الْوَقْتِ لَمْ يَجُزْ لِقَوْلِهِ تَعَالَى ﴿وَلا تُبْطِلُوا أَعْمَالَكُمْ﴾ [سُورَةَ مُحَمَّد/33] وَسَوَاءٌ أَكَانَ الْفَرْضُ صَلاةً أَمْ غَيْرَهَا كَحَجٍّ وَصَوْمٍ وَاعْتِكَافٍ مَنْذُورٍ. وَهَذَا الْحُكْمُ مَحَلُّهُ مَا إِذَا كَانَ الْقَطْعُ بِلا عُذْرٍ، وَأَمَّا إِذَا كَانَ لِعُذْرٍ فَلا يَحْرُمُ فَيَجُوزُ قَطْعُ الصَّلاةِ لإِنْقَاذِ غَرِيقٍ أَوْ طِفْلٍ مِنَ الْوُقُوعِ فِي نَارٍ أَوِ السُّقُوطِ فِي مَهْوَاةٍ بَلْ يَجِبُ ذَلِكَ إِنْ كَانَ الْغَرِيقُ مَعْصُومًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1182},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَطْعُ نَفْلِ الْحَجِّ وَالْعُمْرَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1183},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ قَطْعَ نَفْلِ الْحَجِّ وَالْعُمْرَةِ وَذَلِكَ لِأَنَّهُ بِالشُّرُوعِ فِيهِ يَصِيرُ إِتْمَامُهُ وَاجِبًا فَهُوَ كَفَرْضِهِ نِيَّةً وَكَفَّارَةً وَغَيْرَهُمَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1184},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمُحَاكَاةُ الْمُؤْمِنِ اسْتِهْزَاءً بِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1185},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ مُحَاكَاةَ الْمُؤْمِنِ أَيْ تَقْلِيدَهُ فِي قَوْلٍ أَوْ فِعْلٍ أَوْ إِشَارَةٍ عَلَى وَجْهِ الِاسْتِهْزَاءِ بِهِ، قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا لا يَسْخَرْ قَوْمٌ مِّنْ قَوْمٍ﴾ [سُورَةَ الْحُجُرَات/11] الآيَةَ، وَقَدْ قَالَ بَعْضُ الْمُفَسِّرِينَ فِي قَوْلِهِ تَعَالَى ﴿بِئْسَ الِاسْمُ الْفُسُوقُ بَعْدَ الإِيمَانِ﴾ [سُورَةَ الْحُجُرَات/11] مَنْ لَقَّبَ أَخَاهُ وَسَخِرَ بِهِ فَهُوَ فَاسِقٌ. وَقَدْ تَكُونُ الْمُحَاكَاةُ بِالضَّحِكِ عَلَى كَلامِهِ إِذَا تَخَبَّطَ فِيهِ وَغَلِطَ أَوْ عَلَى صَنْعَتِهِ أَوْ عَلَى قُبْحِ صُورَتِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1186},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّجَسُّسُ عَلَى عَوْرَاتِ النَّاسِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1187},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ التَّجَسُّسَ عَلَى عَوْرَاتِ النَّاسِ أَيِ التَّطَلُّعَ عَلَى عَوْرَاتِهِمْ وَالتَّتَبُّعَ لَهَا قَالَ تَعَالَى ﴿وَلا تَجَسَّسُوا﴾ [سُورَةَ الْحُجُرَات/12]، وَالتَّجَسُّسُ وَالتَّحَسُّسُ بِمَعْنًى وَاحِدٍ، قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا تَجَسَّسُوا وَلا تَنَافَسُوا وَلا تَحَاسَدُوا وَلا تَدَابَرُوا وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا» رَوَاهُ الشَّيْخَانِ. فَالتَّجَسُّسُ عَلَى عَوْرَاتِ النَّاسِ مَعْنَاهُ الْبَحْثُ عَنْ عُيُوبِ النَّاسِ وَعَوْرَاتِهِمْ أَيْ أَنْ يُفَتِّشَ عَمَّا لا يُرِيدُ النَّاسُ اطِّلاعَ الْغَيْرِ عَلَيْهِ أَيْ يُفَتِّشَ عَنْ مَسَاوِئِ النَّاسِ لا عَنْ مَحَاسِنِهِمْ وَيُرِيدَ أَنْ يَعْرِفَ عَنْهُمُ الْقَبِيحَ مِنَ الْقَوْلِ أَوِ الْفِعْلِ فَيَسْأَلَ عَنْهُ النَّاسَ أَوْ يَبْحَثَ عَنْهُ بِنَفْسِهِ مِنْ دُونِ سُؤَالٍ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1188},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْوَشْمُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1189},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ الْوَشْمَ وَهُوَ غَرْزُ الْجِلْدِ بِالإِبْرَةِ حَتَّى يَخْرُجَ الدَّمُ ثُمَّ يُذَرُّ عَلَى الْمَحَلِّ مَا يُحْشَى بِهِ الْمَحَلُّ مِنْ نِيلَةٍ أَوْ نَحْوِهَا لِيَزْرَقَّ أَوْ يَسْوَدَّ وَذَلِكَ لِحَدِيثِ الصَّحِيحَيْنِ «لَعَنَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْوَاصِلَةَ وَالْمُسْتَوْصِلَةَ وَالْوَاشِمَةَ وَالْمُسْتَوْشِمَةَ وَالنَّامِصَةَ وَالْمُتَنَمِّصَةَ». وَيَحْرُمُ الْوَصْلُ بِشَعَرٍ نَجِسٍ أَوْ شَعَرِ ءَادَمِيٍّ مُطْلَقًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1190},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَهَجْرُ الْمُسْلِمِ فَوْقَ ثَلاثٍ إِلَّا لِعُذْرٍ شَرْعِيٍّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1191},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ هَجْرَ الْمُسْلِمِ أَخَاهُ الْمُسْلِمَ فَوْقَ ثَلاثٍ إِذَا كَانَ بِغَيْرِ عُذْرٍ شَرْعِيٍّ، قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاثِ لَيَالٍ يَلْتَقِيَانِ فَيُعْرِضُ هَذَا وَيُعْرِضُ هَذَا وَخَيْرُهُمَا الَّذِي يَبْدَأُ بِالسَّلامِ» فَأَفْهَمَ هَذَا الْحَدِيثُ أَنَّ إِثْمَ الْهَجْرِ يَرْتَفِعُ بِالسَّلامِ. وَأَمَّا الْعُذْرُ الَّذِي يُبِيحُ الْهَجْرَ فَكَأَنْ يَكُونَ هَجَرَهُ لِفِسْقٍ فِيهِ بِتَرْكِ صَلاةٍ أَوْ شُرْبِ خَمْرٍ أَوْ نَحْوِ ذَلِكَ فَإِنَّهُ يَجُوزُ هَجْرُهُ حَتَّى يَتُوبَ وَلَوْ إِلَى الْمَمَاتِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1192},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمُجَالَسَةُ الْمُبْتَدِعِ أَوِ الْفَاسِقِ لِلإِينَاسِ لَهُ عَلَى فِسْقِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1193},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ مُجَالَسَةَ الْمُبْتَدِعِ أَوِ الْفَاسِقِ لإِينَاسِهِ عَلَى فِعْلِهِ الْمُنْكَرِ. وَالْمُرَادُ بِالْمُبْتَدِعِ الْمُبْتَدِعُ بِدْعَةً اعْتِقَادِيَّةً أَيْ مَنْ لَيْسَ عَلَى عَقِيدَةِ أَهْلِ السُّنَّةِ، وَأَمَّا الْمُرَادُ بِالْفَاسِقُ فَهُوَ مُتَعَاطِي الْكَبِيرَةِ كَشَارِبِ الْخَمْرِ، وَهَذَا أَيْضًا يُقَيَّدُ بِعَدَمِ الْعُذْرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1194},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلُبْسُ الذَّهَبِ وَالْفِضَّةِ وَالْحَرِيرِ أَوْ مَا أَكْثَرُهُ وَزْنًا مِنْهُ لِلرَّجُلِ الْبَالِغِ إِلَّا خَاتَمَ الْفِضَّةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1195},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ لُبْسَ الذَّهَبِ مُطْلَقًا وَلُبْسَ الْفِضَّةِ غَيْرِ الْخَاتَمِ مِنْهَا وَلُبْسَ الْحَرِيرِ الْخَالِصِ أَوْ مَا أَكْثَرُهُ وَزْنًا مِنْهُ لِلرَّجُلِ الْبَالِغِ وَأَمَّا خَاتَمُ الْفِضَّةِ فَجَائِزٌ لِلرَّجُلِ لِأَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَبِسَهُ. وَخَرَجَ بِالرَّجُلِ الْمَرْأَةُ لِأَنَّهُ يَجُوزُ لَهَا الذَّهَبُ وَالْفِضَّةُ وَلَوْ اتِّخَذَتْ مِنْهُمَا ثَوْبًا إِنْ لَمْ يَكُنْ مِنْهَا عَلَى وَجْهِ الْبَطَرِ وَالْفَخْرِ. رَوَى النَّسَائِيُّ وَالتِّرْمِذِيُّ وَصَحَّحَهُ مِنْ حَدِيثِ أَبِي مُوسَى رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «أُحِلَّ الذَّهَبُ وَالْحَرِيرُ لإِنَاثِ أُمَّتِي وَحُرِّمَ عَلَى ذُكُورِهَا». وَقَدِ اخْتُلِفَ فِي جَوَازِ إِلْبَاسِ الذَّهَبِ وَالْفِضَّةِ لِلصَّبِيِّ إِلَى الْبُلُوغِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1196},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْخَلْوَةُ بِالأَجْنَبِيَّةِ بِحَيْثُ لا يَرَاهُمَا ثَالِثٌ يُسْتَحَى مِنْهُ مِنْ ذَكَرٍ أَوْ أُنْثَى.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1197},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الْخَلْوَةَ بِالأَجْنَبِيَّةِ بِأَنْ لَمْ يَكُنْ مَعَهُمَا ثَالِثٌ يُسْتَحَى مِنْهُ بَصِيرٌ فَلا يَكْفِي الأَعْمَى. وَفِي صَحِيحِ مُسْلِمٍ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «لا يَدْخُلَنَّ أَحَدُكُمْ عَلَى مُغِيبَةٍ إِلَّا وَمَعَهُ رَجُلٌ أَوْ رَجُلانِ» وَالْمُغِيبَةُ بِضَمِّ الْمِيمِ وَكَسْرِ الْغَيْنِ الْمَرْأَةُ الَّتِي زَوْجُهَا غَائِبٌ فَالصَّحِيحُ جَوَازُ خَلْوَةِ رَجُلَيْنِ فَأَكْثَرَ بِامْرَأَةٍ أَجْنَبِيَّةٍ بِشَرْطِ أَنْ يَكُونَ الرَّجُلُ ثِقَةً، وَمَا ذُكِرَ فِي شَرْحِ مُسْلِمٍ وَغَيْرِهِ مِنْ بَعْضِ كُتُبِ الشَّافِعِيَّةِ مِنْ تَحْرِيمِ خَلْوَةِ رَجُلَيْنِ بِامْرَأَةٍ فَخِلافُ الصَّوَابِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1198},{"type":"benefit","text":"فَائِدَةٌ. فِي كِتَابِ التَّوَسُّطِ لِلأَذْرَعِيِّ عَنِ الْقَفَّالِ لَوْ دَخَلَتِ امْرَأَةٌ الْمَسْجِدَ عَلَى رَجُلٍ لَمْ يَكُنْ خَلْوَةً لِأَنَّهُ يَدْخُلُهُ كُلُّ أَحَدٍ. قَالَ بَعْضُهُمْ وَإِنَّمَا يَتَّجِهُ ذَلِكَ فِي مَسْجِدٍ مَطْرُوقٍ لا يَنْقَطِعُ طَارِقُوهُ عَادَةً وَمِثْلُهُ فِي ذَلِكَ الطَّرِيقُ وَغَيْرُهُ الْمَطْرُوقُ كَذَلِكَ بِخِلافِ مَا لَيْسَ مَطْرُوقًا كَذَلِكَ انْتَهَى قَالَ الشَّبْرَامَلِّسِيُّ وَيُؤْخَذُ مِنْهُ أَنَّ الْمَدَارَ فِي الْخَلْوَةِ عَلَى اجْتِمَاعٍ لا تُؤْمَنُ مَعَهُ الرِّيبَةُ أَيِ التُّهَمَةُ وَالشَّكُّ عَادَةً بِخِلافِ مَا لَوْ قُطِعَ بِانْتِفَائِهَا فِي الْعَادَةِ فَلا يُعَدُّ خَلْوَةً انْتَهَى.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1199},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَسَفَرُ الْمَرْأَةِ بِغَيْرِ نَحْوِ مَحْرَمٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1200},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ سَفَرَ الْمَرْأَةِ بِغَيْرِ نَحْوِ مَحْرَمٍ، وَقَدْ وَرَدَ النَّهْيُ عَنْ ذَلِكَ فَفِي بَعْضِ أَحَادِيثِ النَّهْيِ عَنْهُ ذِكْرُ مَسِيرَةِ ثَلاثَةِ أَيَّامٍ، وَفِي بَعْضِهَا ذِكْرُ مَسِيرَةِ يَوْمَيْنِ وَفِي بَعْضِهَا ذِكْرُ مَسِيرَةِ يَوْمٍ وَفِي بَعْضِهَا ذِكْرُ بَرِيدٍ وَالْبَرِيدُ مَسِيرَةُ نِصْفِ يَوْمٍ، وَذَلِكَ يَدُلُّ عَلَى أَنَّ الْمَقْصُودَ تَحْرِيمُ مَا يُسَمَّى سَفَرًا عَلَى الْمَرْأَةِ بِدُونِ الْمَحْرَمِ أَوِ الزَّوْجِ وَذَلِكَ بِشَرْطِ أَنْ لا تَكُونَ ضَرُورَةٌ لِلسَّفَرِ، فَأَمَّا إِذَا كَانَتْ ضَرُورَةٌ بِأَنْ كَانَ سَفَرُهَا لِحَجِّ الْفَرْضِ أَوْ عُمْرَةِ الْفَرْضِ أَوْ لِتَعَلُّمِ الْعِلْمِ الضَّرُورِيِّ إِذَا لَمْ تَجِدْ فِي بَلَدِهَا مَنْ يُعَلِّمُهَا وَنَحْوِ ذَلِكَ فَإِنَّهُ جَائِزٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1201},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَاسْتِخْدَامُ الْحُرِّ كُرْهًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1202},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ جُمْلَةِ مَعَاصِي الْبَدَنِ اسْتِخْدَامَ الْحُرِّ كُرْهًا أَيْ قَهْرًا وَذَلِكَ بِأَنْ يَسْتَرِقَّ الْحُرَّ وَيَسْتَعْبِدَهُ أَوْ يَقْهَرَهُ عَلَى عَمَلٍ لِنَفْسِهِ أَوْ لِغَيْرِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1203},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمُعَادَاةُ الْوَلِيِّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1204},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ مُعَادَاةَ وَلِيٍّ مِنْ أَوْلِيَاءِ اللَّهِ تَعَالَى. وَالْوَلِيُّ هُوَ الْمُؤْمِنُ الْمُسْتَقِيمُ بِطَاعَةِ اللَّهِ أَيِ الْمُؤَدِّي لِلْوَاجِبَاتِ وَالْمُجْتَنِبُ لِلْمُحَرَّمَاتِ وَالْمُكْثِرُ مِنَ النَّوَافِلِ. وَهَذَا التَّفْسِيرُ لِلْوَلِيِّ يُؤْخَذُ مِنْ قَوْلِ اللَّهِ تَعَالَى ﴿إِنَّ الَّذِينَ قَالُواْ رَبُّنَا اللَّهُ ثُمَّ ٱسْتَقَامُوا﴾ [سُورَةَ الأَحْقَاف/13] الآيَةَ لِأَنَّ الِاسْتِقَامَةَ هِيَ لُزُومُ طَاعَةِ اللَّهِ تَعَالَى وَمِنْ الْحَدِيثِ الْقُدْسِيِّ الَّذِي رَوَاهُ الْبُخَارِيُّ وَغَيْرُهُ عَنْ أَبِي هُرَيْرَةَ «مَنْ عَادَى لِي وَلِيًّا فَقَدْ ءَاذَنْتُهُ بِالْحَرْبِ وَمَا تَقَرَّبَ إِلَيَّ عَبْدِي بِشَىْءٍ أَحَبَّ إِلَيَّ مِمَّا افْتَرَضْتُ عَلَيْهِ وَلا يَزَالُ عَبْدِي يَتَقَرَّبُ إِلَيَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ» الْحَدِيثَ فَإِذَا كَانَ هَذَا فِي حَقِّ كُلِّ وَلِيٍّ فَكَيْفَ مُعَادَاةُ خَوَاصِّ الأَوْلِيَاءِ الصِّدِّيقِينَ الْمُقَرَّبِينَ كَأَحَدِ الْخُلَفَاءِ الأَرْبَعَةِ أَبِي بَكْرٍ وَعُمَرَ وَعُثْمَانَ وَعَلِيٍّ رَضِيَ اللَّهُ عَنْهُمْ. وَمَعْنَى ءَاذَنْتُهُ بِالْحَرْبِ أَعْلَمْتُهُ أَنِّي مُحَارِبٌ لَهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1205},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالإِعَانَةُ عَلَى الْمَعْصِيَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1206},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ جُمْلَةِ مَعَاصِي الْبَدَنِ الإِعَانَةَ عَلَى الْمَعْصِيَةِ وَذَلِكَ لِقَوْلِ اللَّهِ تَعَالَى ﴿وَلا تَعَاوَنُوا عَلَى الإِثْمِ وَالْعُدْوَانِ﴾ [سُورَةَ الْمَائِدَة/2] فَالآيَةُ دَلِيلٌ لِتَحْرِيمِ مُعَاوَنَةِ شَخْصٍ لِشَخْصٍ فِي مَعْصِيَةِ اللَّهِ كَحَمْلِ إِنْسَانٍ ذَكَرٍ أَوْ أُنْثَى إِلَى مَحَلٍّ يُعْبَدُ فِيهِ غَيْرُ اللَّهِ لِمُشَارَكَةِ الْمُشْرِكِينَ وَمُوَافَقَتِهِمْ فِي شِرْكِهِمْ وَذَلِكَ كُفْرٌ وَكَأَنْ يَأْخُذَ الرَّجُلُ زَوْجَتَهُ الْكِتَابِيَّةَ إِلَى الْكَنِيسَةِ أَوْ يُعْطِيَهَا مَا تَسْتَعِينُ بِهِ عَلَى ذَلِكَ وَغَيْرِ ذَلِكَ مِنْ كُلِّ مَا هُوَ مُعَاوَنَةٌ فِي الْمَعْصِيَةِ كَائِنَةً مَا كَانَتْ لِقَوْلِهِ تَعَالَى ﴿وَلا تَعَاوَنُوا عَلَى الإِثْمِ وَالْعُدْوَانِ﴾.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1207},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَرْوِيجُ الزَّائِفِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1208},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَرْوِيجَ الزَّائِفِ كَتَرْوِيجِ الْعُمْلَةِ الزَّائِفَةِ أَوْ طَلْيِ النُّحَاسِ بِالذَّهَبِ لإِيهَامِ النَّاسِ أَنَّهُ ذَهَبٌ وَبَيْعِهِ عَلَى أَنَّهُ كَذَلِكَ، وَذَلِكَ دَاخِلٌ فِي الْغِشِّ وَأَكْلِ أَمْوَالِ النَّاسِ بِالْبَاطِلِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1209},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَاسْتِعْمَالُ أَوَانِي الذَّهَبِ وَالْفِضَّةِ وَاتِّخَاذُهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1210},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ اسْتِعْمَالَ أَوَانِي الذَّهَبِ وَالْفِضَّةِ وَاتِّخَاذَهَا. وَالِاسْتِعْمَالُ يَكُونُ بِالأَكْلِ فِي أَوَانِيهِمَا أَوِ الشُّرْبِ وَنَحْوِهِمَا وَلَوْ مِيلًا وَمُكْحُلَةً وَهُوَ مِنَ الْكَبَائِرِ. وَأَمَّا الِاتِّخَاذُ الَّذِي هُوَ اقْتِنَاءُ أَوَانِيهِمَا بِلا اسْتِعْمَالٍ فَهُوَ حَرَامٌ كَذَلِكَ وَلَوْ لَمْ يَكُنْ فِي قَلْبِ مُقْتَنِيهِ قَصْدُ الِاسْتِعْمَالِ فَإِنْ كَانَ الِاقْتِنَاءُ لِزِينَةِ الْبَيْتِ فَخْرًا وَبَطَرًا فَهُوَ أَشَدُّ إِثْمًا. قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّ الَّذِي يَأْكُلُ وَيَشْرَبُ فِي ءَانِيَةِ الذَّهَبِ وَالْفِضَّةِ إِنَّمَا يُجَرْجِرُ فِي بَطْنِهِ نَارَ جَهَنَّمَ» رَوَاهُ مُسْلِمٌ وَذَلِكَ إِذَا لَمْ يَكُنْ هُنَاكَ ضَرُورَةٌ أَوْ عُذْرٌ. وَقِيلَ لا يَحْرُمُ الِاتِّخَاذُ إِنْ لَمْ يَكُنْ بِقَصْدِ الِاسْتِعْمَالِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1211},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَرْكُ الْفَرْضِ أَوْ فِعْلُهُ مَعَ تَرْكِ رُكْنٍ أَوْ شَرْطٍ أَوْ مَعَ فِعْلِ مُبْطِلٍ لَهُ وَتَرْكُ الْجُمُعَةِ مَعَ وُجُوبِهَا عَلَيْهِ وَإِنْ صَلَّى الظُّهْرَ وَتَرْكُ نَحْوِ أَهْلِ قَرْيَةٍ الْجَمَاعَاتِ فِي الْمَكْتُوبَاتِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1212},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَرْكَ الْفَرْضِ مِنْ صَلاةٍ أَوْ غَيْرِهَا وَفِعْلَهُ صُورَةً مَعَ الإِخْلالِ بِرُكْنٍ أَوْ شَرْطٍ أَوْ مَعَ فِعْلِ مُبْطِلٍ لَهُ. قَالَ اللَّهُ تَعَالَى فِيمَنْ يَتَهَاوَنُ بِالصَّلاةِ فَيُخْرِجُهَا عَنْ وَقْتِهَا ﴿فَوَيْلٌ لِّلْمُصَلِّينَ الَّذِينَ هُمْ عَنْ صَلاتِهِمْ سَاهُونَ﴾ [سُورَةَ الْمَاعُون] وَالْوَيْلُ هُوَ شِدَّةُ الْعَذَابِ فَقَدْ تَوَعَّدَ اللَّهُ تَعَالَى بِالْعَذَابِ الشَّدِيدِ مَنْ يَتَهَاوَنُونَ بِالصَّلاةِ بِأَنْ يُؤَخِّرُوهَا عَمْدًا حَتَّى يَدْخُلَ وَقْتُ الصَّلاةِ الأُخْرَى بِلا عُذْرٍ. وَكَذَلِكَ تَرْكُ الْجُمُعَةِ بِلا عُذْرٍ فِي حَقِّ مَنْ وَجَبَتْ عَلَيْهِ وَإِنْ صَلَّى الظُهْرَ بَدَلَهَا. وَكَذَلِكَ تَرْكُ نَحْوِ أَهْلِ بَلَدٍ أَيْ مَدِينَةٍ أَوْ قَرْيَةٍ صَغِيرَةٍ أَو مَا بَيْنَهُمَا الْجَمَاعَةَ فِي الْمَكْتُوبَاتِ الْخَمْسِ. قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «مَا مِنْ ثَلاثَةٍ فِي قَرْيَةٍ وَلا بَدْوٍ لا تُقَامُ فِيهِمُ الصَّلاةُ إِلَّا اسْتَحْوَذَ عَلَيْهِمُ الشَّيْطَانُ» رَوَاهُ أَبُو دَاوُدَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1213},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَأْخِيرُ الْفَرْضِ عَنْ وَقْتِهِ بِغَيْرِ عُذْرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1214},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَأْخِيرَ الْفَرْضِ عَنْ وَقْتِهِ بِغَيْرِ عُذْرٍ، وَقَدْ ثَبَتَ عَنْ عُمَرَ رَضِيَ اللَّهُ عَنْهُ أَنَّهُ قَالَ «مَنْ جَمَعَ بَيْنَ صَلاتَيْنِ مِنْ غَيْرِ عُذْرٍ فَقَدْ أَتَى بَابًا مِنْ أَبْوَابِ الْكَبَائِرِ» وَرُوِيَ ذَلِكَ مَرْفُوعًا لَكِنَّهُ لَمْ يَثْبُتْ إِسْنَادًا، وَأَمَّا التَّأْخِيرُ أَوِ التَّقْدِيمُ بِعُذْرٍ فَلا إِثْمَ عَلَى فَاعِلِهِ. وَالْعُذْرُ إِمَّا سَفَرٌ مُبِيحٌ لِلْجَمْعِ بَيْنَ صَلاتَيْنِ أَوْ مَطَرٌ بِشَرْطِهِ وَهُوَ يُبِيحُ الْجَمْعَ تَقْدِيمًا بَيْنَ الظُّهْرِ وَالْعَصْرِ وَبَيْنَ الْمَغْرِبِ وَالْعِشَاءِ لِمَنْ يُصَلِّي جَمَاعَةً تَهْوِينًا عَلَيْهِ مِنْ مَشَقَّةِ الْعَوْدِ لِلصَّلاةِ الثَّانِيَةِ إِلَى الْمَسْجِدِ. وَمِنَ الأَعْذَارِ أَيْضًا الْمَرَضُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1215},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَرَمْيُ الصَّيْدِ بِالْمُثَقَّلِ الْمُذَفِّفِ أَيْ بِالشَّىْءِ الَّذِي يَقْتُلُ بِثِقَلِهِ كَالْحَجَرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1216},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ رَمْيَ الصَّيْدِ بِالْمُثَقَّلِ الْمُذَفِّفِ، وَعُدَّ هَذَا مِنْ مَعَاصِي الْبَدَنِ لِأَنَّهُ يَشْتَرِكُ فِيهِ غَيْرُ الْيَدِ مَعَهَا. وَالْمُثَقَّلُ بِضَمِّ الْمِيمِ وَفَتْحِ الْمُثَلَّثَةِ وَتَشْدِيدِ الْقَافِ الْمَفْتُوحَةِ هُوَ مَا يَقْتُلُ بِثِقَلِهِ كَالصَّخْرَةِ وَأَمَّا الْمُذَفِّفُ فَهُوَ الْمُسْرِعُ لإِزْهَاقِ الرُّوحِ، وَعَلَى هَذَا فَمَا يُقْتَلُ بِبُنْدُقِ الرَّصَاصِ الَّذِي عُرِفَ اسْتِعْمَالُهُ لِلصَّيْدِ مَيْتَةٌ إِلَّا أَنْ يُدْرَكَ وَفِيهِ حَيَاةٌ مُسْتَقِرَّةٌ وَعَلامَتُهَا حَرَكَةٌ اخْتِيَارِيَّةٌ أَوْ نَحْوُهَا فَيُذَكَّى بِالسِّكِينِ أَوْ نَحْوِهَا مِمَّا لَهُ حَدٌّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1217},{"type":"p","text":"مَسْئَلَةٌ. لا يَحِلُّ الْمَقْدُورُ عَلَيْهِ وَلَوْ وَحْشِيًّا إِلَّا بِالْقَطْعِ الْمَحْضِ مِنْ مُسْلِمٍ أَوْ كِتَابِيٍّ ذِمِيٍّ أَوْ غَيْرِ ذِمِيٍّ لِجَمِيعِ الْحُلْقُومِ وَالْمَرِيءِ أَيْ مَجْرَى النَّفَسِ وَمَجْرَى الطَّعَامِ وَالشَّرَابِ مَعَ اسْتِقْرَارِ الْحَيَاةِ فِي الِابْتِدَاءِ بِمُحَدَّدٍ أَيْ بِمَا يَقْتُلُ بِحَدِّهِ غَيْرِ الْعَظْمِ وَالظُّفْرِ. وَعَلامَةُ اسْتِقْرَارِ الْحَيَاةِ أَنْ تَشْتَدَّ حَرَكَتُهُ بَعْدَ الذَّبْحِ وَيَتَدَفَّقَ دَمُهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1218},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَاتِّخَاذُ الْحَيَوَانِ غَرَضًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1219},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ اتِّخَاذَ الْحَيَوَانِ غَرَضًا أَيْ هَدَفًا كَالشَّىْءِ الَّذِي يُنْصَبُ لِيُصِيبُوهُ بِالرِّمَايَةِ مِنْ نَحْوِ الْقِرْطَاسِ كَمَا يَفْعَلُ ذَلِكَ بَعْضُ الشَّبَابِ لِلَّهْوِ أَوْ لِتَعَلُّمِ الرِّمَايَةِ. وَالْقِرْطَاسُ قِطْعَةٌ مِنْ جِلْدٍ تُنْصَبُ لِلرَّمْيِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1220},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَدَمُ مُلازَمَةِ الْمُعْتَدَّةِ لِلْمَسْكَنِ بِغَيْرِ عُذْرٍ وَتَرْكُ الإِحْدَادِ عَلَى الزَّوْجِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1221},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَرْكَ الزَّوْجَةِ الْمُتَوَفَّى عَنْهَا زَوْجُهَا الإِحْدَادَ عَلَى زَوْجِهَا، وَالإِحْدَادُ هُوَ الْتِزَامُ تَرْكِ الزِّينَةِ وَالطِّيبِ إِلَى انْتِهَاءِ الْعِدَّةِ. وَلا يَخْتَصُّ الإِحْدَادُ بِلَوْنٍ وَاحِدٍ مِنَ الثِّيَابِ بَلْ يَجُوزُ الأَبْيَضُ وَالأَسْوَدُ وَغَيْرُ ذَلِكَ إِذَا لَمْ تَكُنْ ثِيَابَ زِينَةٍ، وَيَحْرُمُ مِنَ الأَسْوَدِ مَا كَانَ فِيهِ زِينَةٌ. وَلَيْسَ مِنَ الإِحْدَادِ الْوَاجِبِ عَلَيْهَا تَرْكُ مُكَالَمَةِ الرِّجَالِ غَيْرِ الْمَحَارِمِ فَهَذَا لَيْسَ مِمَّا يَدْخُلُ فِي الإِحْدَادِ الشَّرْعِيِّ إِنَّمَا هَذِهِ عَادَةٌ أَضَافَهَا بَعْضُ النَّاسِ وَنَسَبَهَا إِلَى شَرْعِ اللَّهِ وَهِيَ لَيْسَتْ مِنْ شَرْعِ اللَّهِ فَلْيُنْشَرْ ذَلِكَ لِأَنَّ كَثِيرًا مِنَ النَّاسِ يَجْهَلُونَ ذَلِكَ وَيَعْتَقِدُونَ أَنَّهُ مِنَ الإِحْدَادِ الشَّرْعِيِّ وَذَلِكَ تَحْرِيفٌ لِلدِّينِ. وَلا يَجُوزُ لِلْمُحِدَّةِ أَنْ تَبِيتَ خَارِجَ بَيْتِهَا لَكِنْ يَجُوزُ لَهَا أَنْ تَخْرُجَ لِتَسْتَأْنِسَ بِبَعْضِ جَارَاتِهَا ثُمَّ تَعُودَ إِلَى الْبَيْتِ لِلْمَبِيتِ. وَتَحْرُمُ الزِّيَادَةُ عَلَى الْمُدَّةِ الْمَشْرُوعَةِ فِي إِحْدَادِ الزَّوْجَةِ عَلَى زَوْجِهَا وَهِيَ أَرْبَعَةُ أَشْهُرٍ وَعَشْرَةُ أَيَّامٍ لِلْحَائِلِ وَلِلْحَامِلِ حَتَّى تَضَعَ حَمْلَهَا، وَيَجُوزُ لِغَيْرِ الزَّوْجَةِ مِنَ النِّسَاءِ الإِحْدَادُ إِلَى ثَلاثَةِ أَيَّامٍ وَيَحْرُمُ عَلَيْهُنَّ الزِّيَادَةُ عَلَى ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1222},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَنْجِيسُ الْمَسْجِدِ وَتَقْذِيرُهُ وَلَوْ بِطَاهِرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1223},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَنْجِيسَ الْمَسْجِدِ وَتَقْذِيرَهُ وَلَوْ بِطَاهِرٍ فَيَحْرُمُ تَنْجِيسُهُ بِالنَّجَاسَةِ وَكَذَلِكَ تَقْذِيرُهُ بِغَيْرِ النَّجَاسَةِ كَالْبُزَاقِ وَالْمُخَاطِ لِأَنَّ حِفْظَ الْمَسْجِدِ مِنْ ذَلِكَ مِنْ تَعْظِيمِ شَعَائِرِ اللَّهِ قَالَ اللَّهُ تَعَالَى ﴿ذَلِكَ وَمَنْ يُعَظِّمْ شَعَائِرَ اللَّهِ فَإِنَّهَا مِنْ تَقْوَى الْقُلُوبِ﴾ [سُورَةَ الْحَجِّ/32]، وَمِنْ تَعْظِيمِهَا تَطْيِيبُهَا فَقَدْ جَرَتِ الْعَادَةُ فِي الْمَدِينَةِ بِتَبْخِيرِ مَسْجِدِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِالْعُودِ كُلَّ جُمُعَةٍ مِنْ زَمَانِ خِلافَةِ سَيِّدِنَا عُمَرَ رَضِيَ اللَّهُ عَنْهُ وَذَلِكَ مِنَ الْقُرُبَاتِ إِلَى اللَّهِ، وَقَدْ تَقَدَّمَ ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1224},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّهَاوُنُ بِالْحَجِّ بَعْدَ الِاسْتِطَاعَةِ إِلَى أَنْ يَمُوتَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1225},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَأْخِيرَ أَدَاءِ الْحَجِّ بَعْدَ حُصُولِ الِاسْتِطَاعَةِ إِلَى أَنْ يَمُوتَ قَبْلَ أَنْ يَحُجَّ قَالَ اللَّهُ تَعَالَى ﴿وَأَنْفِقُوا مِنْ مَّا رَزَقْنَاكُم مِّنْ قَبْلِ أَنْ يَأْتِيَ أَحَدَكُمُ الْمَوْتُ فَيَقُولَ رَبِّ لَوْلا أَخَّرْتَنِي إِلَى أَجَلٍ قَرِيبٍ فَأَصَّدَّقَ وَأَكُنْ مِّنَ الصَّالِحِينَ﴾ [سُورَةَ الْمُنَافِقُون/10] جَاءَ عَنِ ابْنِ عَبَّاسٍ فِي قَوْلِهِ تَعَالَى ﴿فَأَصَّدَّقَ﴾ أَيْ أُزَكِّيَ ﴿وَأَكُنْ مِّنَ الصَّالِحِينَ﴾ أَيْ أَحُجَّ، فَوُجُوبُ الْحَجِّ وَإِنْ كَانَ عَلَى التَّرَاخِي عِنْدَ الإِمَامِ الشَّافِعِيِّ وَءَاخَرِينَ مِنَ الأَئِمَّةِ لِكَنَّهُ إِذَا تَسَاهَلَ الْمُسْتَطِيعُ حَتَّى مَاتَ قَبْلَ أَنْ يَحُجَّ فَإِنَّهُ يُحْكَمُ عَلَيْهِ بِالْفِسْقِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1226},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالِاسْتِدَانَةُ لِمَنْ لا يَرْجُو وَفَاءً لِدَيْنِهِ مِنْ جِهَةٍ ظَاهِرَةٍ وَلَمْ يَعْلَمْ دَائِنُهُ بِذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1227},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الِاسْتِدَانَةَ لِلَّذِي لَيْسَ بِحَالَةِ الِاضْطِرَارِ إِنْ كَانَ لا يَرْجُو وَفَاءً لِلدَّيْنِ الَّذِي يَسْتَدِينُهُ مِنْ جِهَةٍ ظَاهِرَةٍ إِذَا لَمْ يُعْلِمْ دَائِنَهُ بِذَلِكَ أَيْ لَمْ يُعْلِمْهُ بِحَالِهِ أَيْ أَنَّهُ لا يَرْجُو لِهَذَا الدَّيْنِ وَفَاءً مِنْ جِهَةٍ ظَاهِرَةٍ أَيْ لَيْسَ عِنْدَهُ مِلْكٌ وَلا مِهْنَةٌ يَسْتَغِلُّهَا لِرَدِّ الدَّيْنِ، فَإِنْ كَانَ يَرْجُو لَهُ وَفَاءً مِنْ جِهَةٍ ظَاهِرَةٍ فَلا حَرَجَ عَلَيْهِ فِي الِاسْتِدَانَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1228},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَدَمُ إِنْظَارِ الْمُعْسِرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1229},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَرْكَ الدَّائِنِ إِنْظَارَ الْمُعْسِرِ أَيِ الْعَاجِزِ عَنْ قَضَاءِ مَا عَلَيْهِ مَعَ عِلْمِهِ بِإِعْسَارِهِ فَيَحْرُمُ عَلَيْهِ مُلازَمَتُهُ أَوْ حَبْسُهُ وَيَحْرُمُ عَلَيْهِ مُطَالَبَتُهُ مَعَ عِلْمِهِ بِعَجْزِهِ كَأَنْ يَقُولَ لَهُ الآنَ تُعْطِينِي مَالِي. رَوَى مُسْلِمٌ مِنْ حَدِيثِ أَبِي الْيَسَرِ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «مَنْ أَنْظَرَ مُعْسِرًا أَوْ وَضَعَ لَهُ أَظَلَّهُ اللَّهُ فِي ظِلِّهِ يَوْمَ لا ظِلَّ إِلَّا ظِلُّهُ»","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1230},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبَذْلُ الْمَالِ فِي مَعْصِيَةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1231},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ بَذْلَ الْمَالِ فِي مَعْصِيَةٍ مِنْ مَعَاصِي اللَّهِ تَعَالَى كَبِيرَةً كَانَتْ أَوْ صَغِيرَةً، وَيَلْتَحِقُ بِهَذَا الإِنْفَاقِ الْمُحَرَّمِ مَا يُبْذَلُ لِلْمُغَنِيَّاتِ وَالْمُغَنِينَ أُجْرَةً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1232},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالِاسْتِهَانَةُ بِالْمُصْحَفِ وَبِكُلِّ عِلْمٍ شَرْعِيٍّ وَتَمْكِينُ الصَّبِيِّ الْمُمَيِّزِ مِنْهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1233},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الِاسْتِهَانَةَ بِالْمُصْحَفِ أَيْ فِعْلَ مَا يُشْعِرُ بِتَرْكِ تَعْظِيمِهِ، وَكَذَلِكَ فِعْلُ ذَلِكَ بِعِلْمٍ شَرْعِيٍّ كَكُتُبِ الْفِقْهِ وَالْحَدِيثِ وَالتَّفْسِيرِ، وَكَذَلِكَ الْوَرَقَةُ الْوَاحِدَةُ الَّتِي فِيهَا قُرْءَانٌ أَوْ عِلْمٌ شَرْعِيٌّ. وَيَدْخُلُ فِيمَا ذُكِرَ تَمْكِينُ الصَّبِيِّ الْمُمَيِّزِ الْمُحْدِثِ وَلَوْ حَدَثًا أَصْغَرَ مِنَ الْمُصْحَفِ لِغَيْرِ حَاجَةِ دِرَاسَتِهِ وَحَمْلِهِ لِلتَّعَلُّمِ فِيهِ وَنَقْلِهِ إِلَى مَوْضِعِ التَّعَلُّمِ. وَأَمَّا مَا يُعْتَبَرُ اسْتِخْفَافًا بِذَلِكَ فَإِنَّهُ مَعْدُودٌ مِنْ أَسْبَابِ الرِّدَّةِ كَدَوْسِهِ عَمْدًا وَلَوْ لِتَصْفِيفِ النُّسَخِ فِي الْمَطَابِعِ أَوِ الْمَكَاتِبِ أَوْ نَحْوِ ذَلِكَ مِنَ الأَغْرَاضِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1234},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَغْيِيرُ مَنَارِ الأَرْضِ أَيْ تَغْيِيرُ الْحَدِّ الْفَاصِلِ بَيْنَ مِلْكِهِ وَمِلْكِ غَيْرِهِ وَالتَّصَرُّفُ فِي الشَّارِعِ بِمَا لا يَجُوزُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1235},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ تَغْيِيرَ حُدُودِ الأَرْضِ بِأَنْ يُدْخِلَ مِنْ حُدُودِ جَارِهِ شَيْئًا فِي حَدِّ أَرْضِهِ وَكَذَلِكَ اتِّخَاذُ أَرْضِ الْغَيْرِ طَرِيقًا. وَمِنْ ذَلِكَ التَّصَرُّفُ فِي الشَّارِعِ بِمَا لا يَجُوزُ فِعْلُهُ فِيهِ مِمَّا يَضُرُّ بِالْمَارَّةِ، وَالشَّارِعُ اسْمٌ لِلطَّرِيقِ الْنَافِذِ، وَمِثْلُهُ فِي ذَلِكَ غَيْرُ النَّافِذِ فَيَحْرُمُ التَّصَرُّفُ فِيهِ بِمَا لَمْ يَأْذَنْ فِيهِ أَهْلُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1236},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَاسْتِعْمَالُ الْمُعَارِ فِي غَيْرِ الْمَأْذُونِ لَهُ فِيهِ أَوْ زَادَ عَلَى الْمُدَّةِ الْمَأْذُونِ لَهُ فِيهَا أَوْ أَعَارَهُ لِغَيْرِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1237},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ اسْتِعْمَالَ الشَّىْءِ الَّذِي هُوَ عَارِيَّةٌ فِي غَيْرِ مَا أُذِنَ لَهُ فِيهِ، وَكَذَلِكَ الزِّيَادَةُ عَلَى الْمُدَّةِ الْمَأْذُونِ لَهُ فِيهَا إِنْ كَانَتِ الْمُدَّةُ مُقَيَّدَةً كَأَنْ قَدَّرَ لَهُ سَنَةً فَاسْتَعْمَلَهُ بَعْدَ انْقِضَائِهَا، وَكَذَلِكَ إِعَارَتُهُ لِلْغَيْرِ بِلا إِذْنٍ مِنَ الْمَالِكِ فِي ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1238},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَحْجِيرُ الْمُبَاحِ كَالْمَرْعَى وَالِاحْتِطَابِ مِنَ الْمَوَاتِ وَالْمِلْحِ مِنْ مَعْدِنِهِ وَالنَّقْدَيْنِ وَغَيْرِهِمَا وَالْمَاءِ لِلشُّرْبِ مِنَ الْمُسْتَخْلَفِ وَهُوَ الَّذِي إِذَا أُخِذَ مِنْهُ شَىْءٌ يَخْلُفُهُ غَيْرُهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1239},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ تَحْجِيرَ الْمُبَاحِ أَيْ مَنْعَ النَّاسِ مِنَ الأَشْيَاءِ الْمُبَاحَةِ لَهُمْ عَلَى الْعُمُومِ وَالْخُصُوصِ كَشَوَاطِئِ الأَنْهَارِ وَالْبِحَارِ، وَكَالْمَرْعَى الَّذِي فِي أَرْضٍ لَيْسَ مِلْكًا لِأَحَدٍ، وَكَالِاحْتِطَابِ أَيْ أَخْذِ الْحَطَبِ مِنْ أَرْضِ الْمَوَاتِ، وَكَذَلِكَ الشَّوَارِعُ وَالْمَسَاجِدُ وَالرُّبُطُ أَيِ الأَمَاكِنُ الْمَوْقُوفَةُ لِلْفُقَرَاءِ مَثَلًا فَلا يَجُوزُ لِبَعْضِهِمْ تَحْجِيرُ ذَلِكَ عَلَى غَيْرِهِ مِنَ الْمُسْتَحِقِّينَ، وَكَذَلِكَ الْمَعَادِنُ الْبَاطِنَةُ وَالظَّاهِرَةُ كَأَنْ يَمْنَعَهُمْ مِنْ أَخْذِ الْمِلْحِ مِنْ مَعْدِنِهِ، وَكَذَلِكَ الْمَنْعُ مِنَ الشُّرْبِ مِنَ الْمَاءِ الَّذِي حَفَرَهُ الشَّخْصُ فِي الأَرْضِ الْمَوَاتِ وَكَانَ إِذَا أُخِذَ مِنْهُ شَىْءٌ يَخْلُفُهُ غَيْرُهُ، رَوَى أَبُو دَاوُدَ وَغَيْرُهُ «الْمُسْلِمُونَ شُرَكَاءُ فِي ثَلاثٍ الْمَاءِ وَالْكَلَإِ وَالنَّارِ» وَالْمُرَادُ بِالْمَاءِ فِيمَا ذُكِرَ الْمَاءُ الَّذِي لَمْ يَحُزْهُ الشَّخْصُ أَيْ لَمْ يَحْتَوِهِ فِي إِنَائِهِ وَنَحْوِهِ وَأَمَّا مَا حِيزَ فِي ذَلِكَ فَهُوَ مِلْكٌ خَاصٌ لِلَّذِي حَازَهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1240},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَاسْتِعْمَالُ اللُّقَطَةِ قَبْلَ التَّعْرِيفِ بِشُرُوطِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1241},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ اسْتِعْمَالَ اللُّقَطَةِ وَهِيَ مَا ضَاعَ مِنْ مَالِكِهِ بِسُقُوطٍ أَوْ غَفْلَةٍ أَوْ نَحْوِ ذَلِكَ فِي نَحْوِ الشَّارِعِ كَالْمَسْجِدِ وَالْبَحْرِ مِمَّا لا يُعْرَفُ مَالِكُهُ قَبْلَ أَنْ يَتَمَلَّكَهَا بِشَرْطِهِ وَهُوَ أَنْ يُعَرِّفَهَا سَنَةً بِنِيَّةِ تَمَلُّكِهَا إِنْ لَمْ يَظْهَرْ صَاحِبُهَا فَإِذَا عَرَّفَهَا سَنَةً حَلَّ لَهُ أَنْ يَتَمَلَّكَهَا فَيَتَصَرَّفَ فِيهَا بِنِيَّةِ أَنْ يَغْرَمَ لِصَاحِبِهَا إِذَا ظَهَرَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1242},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْجُلُوسُ مَعَ مُشَاهَدَةِ الْمُنْكَرِ إِذَا لَمْ يُعْذَرْ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1243},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الْجُلُوسَ فِي مَحَلٍّ فِيهِ مُنْكَرٌ مِنَ الْمُحَرَّمَاتِ مَعَ الْعِلْمِ بِوُجُودِ الْمُنْكَرِ فِي ذَلِكَ الْمَكَانِ إِذَا لَمْ يَكُنْ مَعْذُورًا فِي جُلُوسِهِ فِيهِ بِأَنْ أَمْكَنَهُ أَنْ يُغَيِّرَ ذَلِكَ الْمُنْكَرَ بِنَفْسِهِ أَوْ بِغَيْرِهِ فَلَمْ يَفْعَلْ، وَكَذَلِكَ إِنْ أَمْكَنَهُ أَنْ يُفَارِقَ الْمَكَانَ فَلَمْ يَفْعَلْ. وَالأَعْذَارُ الْمُعْتَبَرَةُ فِي ذَلِكَ تُطْلَبُ مِنَ الْمَبْسُوطَاتِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1244},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّطَفُّلُ فِي الْوَلائِمِ وَهُوَ الدُّخُولُ بِغَيْرِ إِذْنٍ أَوْ أَدْخَلُوهُ حَيَاءً.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1245},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ أَنْ يَحْضُرَ الْوَلائِمَ الَّتِي لَمْ يُدْعَ إِلَيْهَا أَوْ دُعِيَ إِلَيْهَا اسْتِحْيَاءً مِنَ النَّاسِ أَوْ أُدْخِلَ حَيَاءً لِمَا رَوَاهُ ابْنُ حِبَّانَ «لا يَحِلُّ لِمُسْلِمٍ أَنْ يَأْخُذَ عَصَا أَخِيهِ بِغَيْرِ طِيبِ نَفْسٍ مِنْهُ» وَهَذَا الْحَدِيثُ فِيهِ تَحْذِيرٌ بَلِيغٌ مِنَ اسْتِعْمَالِ مَالِ الْمُسْلِمِ الْقَلِيلِ وَالْكَثِيرِ وَالْجَلِيلِ وَالْحَقِيرِ بِغَيْرِ طِيبِ نَفْسِ صَاحِبِهِ بَلْ مُجَرَّدُ دُخُولِ مِلْكِ مُسْلِمٍ بِغَيْرِ رِضَاهُ لا يَجُوزُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1246},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَدَمُ التَّسْوِيَةِ بَيْنَ الزَّوْجَاتِ فِي النَّفَقَةِ وَالْمَبِيتِ وَأَمَّا التَّفْضِيلُ فِي الْمَحَبَّةِ الْقَلْبِيَّةِ وَالْمَيْلِ فَلَيْسَ بِمَعْصِيَةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1247},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ تَرْكَ الْعَدْلِ بَيْنَ الزَّوْجَاتِ كَأَنْ يُرَجِّحَ وَاحِدَةً مِنَ الزَّوْجَتَيْنِ أَوْ الزَّوْجَاتِ عَلَى غَيْرِهَا ظُلْمًا فِي النَّفَقَةِ الْوَاجِبَةِ أَوِ الْمَبِيتِ، وَلَيْسَ عَلَيْهِ أَنْ يُسَوِّيَ بَيْنَ الزَّوْجَاتِ فِي غَيْرِ ذَلِكَ كَالْمَحَبَّةِ الْقَلْبِيَّةِ وَالْجِمَاعِ لِأَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لَمْ يَفْرِضْ عَلَى الزَّوْجِ التَّسْوِيَةَ بَيْنَهُنَّ فِي كُلِّ شَىْءٍ وَلَيْسَ مِنْ مُسْتَطَاعِ الزَّوْجِ أَنْ يُسَوِّيَ بَيْنَهُنَّ فِي كُلِّ شَىْءٍ. قَالَ اللَّهُ تَعَالَى ﴿وَلَنْ تَسْتَطِيعُوا أَنْ تَعْدِلُوا بَيْنَ النِّسَاءِ وَلَوْ حَرَصْتُمْ﴾ [سُورَةَ النِّسَاء/129].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1248},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَخُرُوجُ الْمَرْأَةِ إِنْ كَانَتْ تَمُرُّ عَلَى الرِّجَالِ الأَجَانِبِ بِقَصْدِ التَّعَرُّضِ لَهُمْ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1249},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ خُرُوجَ الْمَرْأَةِ مُتَعَطِّرَةً أَوْ غَيْرَ مُتَعَطِّرَةٍ مُتَزَيِّنَةً أَوْ غَيْرَ مُتَزَيِّنَةٍ مُتَسَتِّرَةً بِالسِّتْرِ الْوَاجِبِ أَوْ لَمْ تَكُنْ كَذَلِكَ إِنْ قَصَدَتْ بِخُرُوجِهَا أَنْ تَفْتِنَ الرِّجَالَ أَيْ تَسْتَمِيلَهُمْ لِلْمَعْصِيَةِ، وَأَمَّا إِذَا خَرَجَتْ مُتَعَطِّرَةً أَوْ مُتَزَيِّنَةً سَاتِرَةً مَا يَجِبُ عَلَيْهَا سَتْرُهُ مِنْ بَدَنِهَا وَلَمْ يَكُنْ قَصْدُهَا ذَلِكَ فَإِنَّهَا تَقَعُ فِي الْكَرَاهَةِ وَإِنْ لَمْ يَكُنْ عَلَيْهَا فِي ذَلِكَ إِثْمٌ. وَذَكَرَ الشَّافِعِيَّةُ فِي مَنَاسِكِ الْحَجِّ أَنَّهُ يُسَنُّ التَّطَيُّبُ لِلأُنْثَى كَمَا لِلذَّكَرِ لِلإِحْرَامِ لِلْحَجِّ أَوِ الْعُمْرَةِ كَمَا ثَبَتَ عِنْدَ أَبِي دَاوُدَ مِنْ حَدِيثِ عَائِشَةَ. وَرَوَى ابْنُ حِبَّانَ عَنْ أَبِي مُوسَى الأَشْعَرِيِّ مَرْفُوعًا «أَيُّمَا امْرَأَةٍ خَرَجَتْ مُتَعَطِّرَةً فَمَرَّتْ بِقَوْمٍ لِيَجِدُوا رِيحَهَا فَهِيَ زَانِيَةٌ» وَشَرْحُ الْحَدِيثِ أَنَّ الْمَرْأَةَ الَّتِي تَقْصِدُ بِخُرُوجِهَا مُتَطَيِّبَةً اسْتِمَالَةَ الرِّجَالِ إِلَيْهَا أَيْ لِلْفَاحِشَةِ أَوْ لِمَا دُونَ ذَلِكَ مِنَ الِاسْتِمْتَاعِ الْمُحَرَّمِ فَهِيَ زَانِيَةٌ أَيْ شِبْهُ زَانِيَةٍ لِأَنَّ فِعْلَهَا هَذَا مُقَدِّمَةٌ لِلزِّنَى وَلَيْسَ الْمَعْنَى أَنَّ إِثْمَهَا كَإِثْمِ الزَّانِيَةِ الزِّنَى الْحَقِيقِيَّ الْمُوجِبَ لِلْحَدِّ فَإِنَّ ذَلِكَ مِنْ أَكْبَرِ الْكَبَائِرِ. وَأَمَّا إِنْ لَمْ تَقْصِدْ بِخُرُوجِهَا مُتَعَطِّرَةً أَنْ تَفْتِنَ الرِّجَالَ فَلَيْسَ عَلَيْهَا فِي ذَلِكَ إِثْمٌ كَمَا تَقَدَّمَ لِأَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَيَّدَ حُصُولَ الإِثْمِ بِقَصْدِ الْفِتْنَةِ وَذَلِكَ بِقَوْلِهِ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فِي الْحَدِيثِ «لِيَجِدُوا رِيحَهَا» وَلَكِنَّ فِعْلَهَا مَكْرُوهٌ كَرَاهَةً تَنْزِيهِيَّةً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1250},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالسِّحْرُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1251},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ السِّحْرَ وَهُوَ مِنَ السَّبْعِ الْمُوبِقَاتِ الَّتِي ذَكَرَهَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي حَدِيثِهِ وَيَكُونُ بِمُزَاوَلَةِ أَفْعَالٍ وَأَقْوَالٍ خَبِيثَةٍ. وَهُوَ أَنْوَاعٌ مِنْهُ مَا يُحْوِجُ إِلَى عَمَلٍ كُفْرِيٍّ كَالسُّجُودِ لِلْشَّمْسِ أَوِ السُّجُودِ لإِبْلِيسَ أَوْ تَعْظِيمِ الشَّيْطَانِ بِغَيْرِ ذَلِكَ وَمِنْهُ مَا يُحْوِجُ إِلَى كُفْرٍ قَوْلِيٍّ وَمِنْهُ مَا لا يُحْوِجُ إِلَى كُفْرٍ فَمَا يُحْوِجُ إِلَى الْكُفْرِ أَيْ لا يَحْصُلُ إِلَّا بِالْكُفْرِ فَهُوَ كُفْرٌ، وَمَا لا يُحْوِجُ إِلَى الْكُفْرِ فَهُوَ كَبِيرَةٌ. وَقَدْ أَطْلَقَ بَعْضُ الْعُلَمَاءِ تَحْريِمَ تَعَلُّمِهِ وَفَصَّلَ بَعْضٌ فِي ذَلِكَ فَقَالَ إِنْ كَانَ تَعَلُّمُهُ وَتَعْلِيمُهُ لا يُحْوِجُ إِلَى الْكُفْرِ وَلا إِلَى تَعَاطِي مُحَرَّمٍ جَازَ ذَلِكَ بِشَرْطِ أَنْ لا يَكُونَ الْقَصْدُ بِذَلِكَ تَطْبِيقَهُ بِالْعَمَلِ وَإِلَّا فَتَحْرِيمُهُ مُتَّفَقٌ عَلَيْهِ وَمَنِ اسْتَحَلَّ ذَلِكَ كَفَرَ. قَاَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لَيْسَ مِنَّا مَنْ تَسَحَّرَ أَوْ تُسُحِّرَ لَهُ أَوْ تَكَهَّنَ أَوْ تُكُهِّنَ لَهُ» رَوَاهُ الطَّبَرَانِيُّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1252},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْخُرُوجُ عَنْ طَاعَةِ الإِمَامِ كَالَّذِينَ خَرَجُوا عَلَى عَلِيٍّ فَقَاتَلُوهُ. قَالَ الْبَيْهَقِيُّ «كُلُّ مَنْ قَاتَلَ عَلِيًّا فَهُمْ بُغَاةٌ» وَكَذَلِكَ قَالَ الشَّافِعِيُّ قَبْلَهُ وَلَوْ كَانَ فِيهِمْ مَنْ هُمْ مِنْ خِيَارِ الصَّحَابَةِ لِأَنَّ الْوَلِيَّ لا يَسْتَحِيلُ عَلَيْهِ الذَّنْبُ وَلَوْ كَانَ مِنَ الْكَبَائِرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1253},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الْخُرُوجَ عَنْ طَاعَةِ الإِمَامِ وَقَدْ صَحَّ حَدِيثُ أَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لِلزُّبَيْرِ رَضِيَ اللَّهُ عَنْهُ «إِنَّكَ لَتُقَاتِلُ عَلِيًّا وَأَنْتَ ظَالِمٌ لَهُ» فَلَمَّا حَضَرَ الْفَرِيقَانِ فِي الْبَصْرَةِ نَادَى عَلِيٌّ الزُّبَيْرَ فَذَكَّرَهُ بِالْحَدِيثِ فَقَالَ الزُّبَيْرُ «نَسِيتُ» فَذَهَبَ مُنْصَرِفًا لِأَنَّ اللَّهَ كَتَبَ لَهُ السَّعَادَةَ وَالْمَنْـزِلَةَ الْعَالِيَةَ فَاقْتَضَى ذَلِكَ أَنْ لا يَمُوتَ وَهُوَ مُتَلَبِّسٌ بِمَعْصِيَةِ الْخُرُوجِ عَلَى عَلِيٍّ، وَكَذَلِكَ طَلْحَةُ مَا قُتِلَ إِلَّا وَقَدِ انْصَرَفَ مِنَ الثُّبُوتِ فِي الْمُعَسْكَرِ الْمُضَادِّ لِعَلِيٍّ رَضِيَ اللَّهُ عَنِ الْجَمِيعِ. فَهَذَانِ الصَّحَابِيَّانِ الْجَلِيلانِ لا شَكَّ أَنَّهُمَا مِنَ الصِّدِّيقِينَ الْمُقَرَّبِينَ وَمَعَ ذَلِكَ نَفَذَ فِيهِمَا الْقَدَرُ بِحُضُورِهِمَا إِلَى هَذَا الْمُعَسْكَرِ الْمُضَادِّ لِعَلِيٍّ. وَحَدِيثُ الزُّبَيْرِ الْمَذْكُورُ رَوَاهُ الْحَاكِمُ بِأَكْثَرَ مِنْ طَرِيقٍ وَصَحَّحَهُ وَوَافَقَهُ الذَّهَبِيُّ. وَمِنَ الدَّلِيلِ عَلَى حُرْمَةِ الْخُرُوجِ عَنْ طَاعَةِ الإِمَامِ مَا رَوَاهُ مُسْلِمٌ مِنْ حَدِيثِ ابْنِ عَبَّاسٍ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «مَنْ كَرِهَ مِنْ أَمِيرِهِ شَيْئًا فَلْيَصْبِرْ عَلَيْهِ فَإِنَّهُ لَيْسَ أَحَدٌ مِنَ النَّاسِ يَخْرُجُ مِنَ السُّلْطَانِ شِبْرًا فَمَاتَ عَلَيْهِ إِلَّا مَاتَ مِيتَةً جَاهِلِيَّةً» أَيْ تُشْبِهُ مِيتَةَ الْجَاهِلِيِّينَ لا أَنَّهُ يَصِيرُ كَافِرًا بِذَلِكَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1254},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّوَلِّي عَلَى يَتِيمٍ أَوْ مَسْجِدٍ أَوْ لِقَضَاءٍ أَوْ نَحْوِ ذَلِكَ مَعَ عِلْمِهِ بِالْعَجْزِ عَنِ الْقِيَامِ بِتِلْكَ الْوَظِيفَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1255},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ أَنْ يَتَوَلَّى الشَّخْصُ الإِمَامَةَ الْعُظْمَى أَوْ إِمَارَةً دُونَهَا أَوْ وِلايَةً مِنَ الْوِلايَاتِ كَالتَّوَلِّي عَلَى مَالِ يَتِيمٍ أَوْ عَلَى وَقْفٍ أَوْ فِي وَظِيفَةٍ تَتَعَلَّقُ بِالْمَسْجِدِ أَوْ تَوَلِّي الْقَضَاءِ أَوْ نَحْوِ ذَلِكَ مَعَ عِلْمِهِ مِنْ نَفْسِهِ بِالْعَجْزِ عَنِ الْقِيَامِ بِتِلْكَ الْوَظِيفَةِ عَلَى مَا يَجِبُ عَلَيْهِ شَرْعًا كَأَنْ عَلِمَ مِنْ نَفْسِهِ الْخِيَانَةَ فِيهِ أَوْ عَزَمَ عَلَى ذَلِكَ فَعِنْدَئِذٍ يَحْرُمُ عَلَيْهِ سُؤَالُ ذَلِكَ الْعَمَلِ وَبِالأَحْرَى بَذْلُ الْمَالِ لِلْوُصُولِ إِلَيْهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1256},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِيوَاءُ الظَّالِمِ وَمَنْعُهُ مِمَّنْ يُرِيدُ أَخْذَ الْحَقِّ مِنْهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1257},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ إِيوَاءَ الظَّالِمِ لِمُنَاصَرَتِهِ لِيَحُولَ بَيْنَ الظَّالِمِ وَبَيْنَ مَنْ يُرِيدُ أَخْذَ الْحَقِّ مِنْهُ، وَقَدْ وَرَدَ فِي ذَلِكَ حَدِيثُ عَلِيٍّ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَفِيهِ «لَعَنَ اللَّهُ مَنْ ءَاوَى مُحْدِثًا» رَوَاهُ مُسْلِمٌ أَيْ مَنَعَ الْجَانِيَ الظَّالِمَ مِمَّنْ يُرِيدُ اسْتِيفَاءَ الْحَقِّ مِنْهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1258},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَرْوِيعُ الْمُسْلِمِينَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1259},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ الَّتِي هِيَ مِنَ الْكَبَائِرِ تَرْوِيعَ الْمُسْلِمِينَ أَيْ تَخْوِيفَهُم وَإِرْعابَهُمْ بِنَوْعٍ مِنْ أَنْوَاعِ التَّخْوِيفِ كَالتَّرْوِيعِ بِنَحْوِ حَدِيدَةٍ يُشِيرُ بِهَا إِلَيْهِ. رَوَى مُسْلِمٌ وَابْنُ حِبَّانَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «مَنْ أَشَارَ إِلَى أَخِيهِ بِحَدِيدَةٍ لَعَنَتْهُ الْمَلائِكَةُ وَإِنْ كَانَ أَخَاهُ لِأَبِيهِ وَأُمِّهِ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1260},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَطْعُ الطَّرِيقِ وَيُحَدُّ بِحَسَبِ جِنَايَتِهِ إِمَّا بِتَعْزِيرٍ أَوْ بِقَطْعِ يَدٍ وَرِجْلٍ مِنْ خِلافٍ إِنْ لَمْ يَقْتُلْ أَوْ بِقَتْلٍ وَصَلْبٍ أَيْ إِنْ قَتَلَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1261},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ قَطْعَ الطَّرِيقِ وَذَلِكَ مِنَ الْكَبَائِرِ وَلَوْ لَمْ يَحْصُلْ مَعَهُ قَتْلٌ أَوْ أَخْذُ مَالٍ فَكَيْفَ إِذَا كَانَ مَعَهُ قَتْلٌ أَوْ جَرْحٌ. قَالَ تَعَالَى ﴿إِنَّمَا جَزَاءُ الَّذِينَ  يُحَارِبُونَ اللَّهَ وَرَسُولَهُ وَيَسْعَوْنَ فِي الأَرْضِ فَسَادًا أَنْ يُقَتَّلُوا أَوْ يُصَلَّبُوا أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُم مِّنْ خِلافٍ أَوْ يُنْفَوْا مِنَ الأَرْضِ ذَلِكَ لَهُمْ خِزْيٌ فِي الدُّنْيَا وَلَهُمْ فِي الآخِرَةِ عَذَابٌ عَظِيمٌ﴾ [سُورَةَ الْمَائِدَة/33] الآيَةَ، وَفِي ذَلِكَ إِشْعَارٌ بِعِظَمِ ذَنْبِ قَطْعِ الطَّرِيقِ عَلَى الْمُؤْمِنِينَ. وَيَتَرَتَّبُ عَلَيْهِ أَحْكَامٌ فَإِنْ كَانَتْ جِنَايَتُهُ إِخَافَةَ السَّبِيلِ فَقَطْ فَيُعَزَّرُ بِحَبْسٍ أَوْ تَغْرِيبٍ أَوْ ضَرْبٍ أَوْ غَيْرِ ذَلِكَ مِمَّا يَرَاهُ الإِمَامُ، وَإِنْ كَانَتْ جِنَايَتُهُ بِأَخْذِ الْمَالِ مَعَ الإِخَافَةِ بِلا قَتْلٍ وَلا جَرْحٍ فَبِقَطْعِ يَدٍ وَرِجْلٍ مِنْ خِلافٍ بِأَنْ تُقَطَعَ يَدُهُ الْيُمْنَى وَرِجْلُهُ الْيُسْرَى فَإِنْ عَادَ فَيَدُهُ الْيُسْرَى وَرِجْلُهُ الْيُمْنَى بِشَرْطِ أَنْ يَكُونَ ذَلِكَ الْمَالُ الَّذِي أَخَذَهُ نِصَابَ سَرِقَةٍ أَيْ رُبْعَ دِينَارِ ذَهَبٍ، وَإِنْ كَانَتْ جِنَايَتُهُ بِأَخْذِ الْمَالِ وَالْقَتْلِ فَعُقُوبَتُهُ بِالْقَتْلِ وَالصَّلْبِ وَكَيْفِيَّةُ ذَلِكَ أَنْ يُقْتَلَ وَيُغَسَّلَ وَيُكَفَّنَ وَيُصَلَّى عَلَيْهِ ثُمَّ يُصْلَبَ أَيْ يُعَلَّقَ عَلَى خَشَبَةٍ مُعْتَرِضَةٍ ثَلاثَةَ أَيَّامٍ إِنْ لَمْ يَتَغَيَّرْ وَإِلَّا أُنْزِلَ، وَقِيلَ يُصْلَبُ حَيًّا ثُمَّ يُطْعَنُ حَتَّى يَمُوتَ ثُمَّ يُدْفَنُ، وَإِنْ كَانَتْ جِنَايَتُهُ الْقَتْلَ بِلا أَخْذِ مَالٍ فَعُقُوبَتُهُ بِالْقَتْلِ بِلا صَلْبٍ. وَلا يَسْقُطُ قَتْلُ الْقَاطِعِ الْمُسْتَحِقِّ لِلْقَتْلِ بِعَفْوِ الْوَلِيِّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1262},{"type":"p","text":"وَأَمَّا أَعْوَانُ الْقُطَّاعِ فَيُعَزَّرُونَ كَمَا هُوَ حُكْمُ مَنْ فَعَلَ مَعْصِيَةً لَيْسَ فِيهَا حَدٌّ فَيَفْعَلُ الإِمَامُ بِهِمْ مَا يَرَى مِنَ التَّعْزِيرِ إِمَّا بِحَبْسٍ وَإِمَّا بِضَرْبٍ وَإِمَّا بِغَيْرِ ذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1263},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْهَا عَدَمُ الْوَفَاءِ بِالنَّذْرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1264},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ تَرْكَ الْوَفَاءِ بِالنَّذْرِ. وَشَرْطُ النَّذْرِ الَّذِي يَجِبُ الْوَفَاءُ بِهِ هُوَ أَنْ يَكُونَ الْمَنْذُورُ قُرْبَةً غَيْرَ وَاجِبَةٍ فَلا يَنْعَقِدُ نَذْرُ الْقُرْبَةِ الْوَاجِبَةِ كَالصَّلَوَاتِ الْخَمْسِ وَلا نَذْرُ تَرْكِ الْمَعْصِيَةِ كَشُرْبِ الْخَمْرِ وَلا نَذْرُ مُبَاحٍ أَيْ مَا يَسْتَوِي فِعْلُهُ وَتَرْكُهُ فَلا يَلْزَمُ الْوَفَاءُ بِهِ لِأَنَّهُ لَيْسَ قُرْبَةً. قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «مَنْ نَذَرَ أَنْ يُطِيعَ اللَّهَ فَلْيُطِعْهُ وَمَنْ نَذَرَ أَنْ يَعْصِيَهُ فَلا يَعْصِهْ» رَوَاهُ الْبُخَارِيُّ. وَفِيهِ تَفَاصِيلُ أُخْرَى مَذْكُورَةٌ فِي كُتُبِ الْفِقْهِ الْمَبْسُوطَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1265},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْوِصَالُ فِي الصَّوْمِ وَهُوَ أَنْ يَصُومَ يَوْمَيْنِ فَأَكْثَرَ بِلا تَنَاوُلِ مُفَطِّرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1266},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ أَنْ يَصُومَ يَوْمَيْنِ فَأَكْثَرَ مِنْ غَيْرِ تَنَاوُلِ مَطْعُومٍ عَمْدًا بِلا عُذْرٍ لِحَدِيثِ الْبُخَارِيِّ وَمُسْلِمٍ عَنْ حَدِيثِ أَبِي هُرَيْرَةَ قَالَ نَهَى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنِ الْوِصَالِ فَقَالَ رَجُلٌ مِنَ الْمُسْلِمِينَ فَإِنَّكَ تُوَاصِلُ يَا رَسُولَ اللَّهِ فَقَالَ «وَأَيُّكُمْ مِثْلِي أَبِيتُ يُطْعِمُنِي رَبِّي وَيَسْقِينِي» مَعْنَاهُ يَجْعَلُ فِيَّ قُوَّةَ الطَّاعِمِ وَالشَّارِبِ مِنْ غَيْرِ أَنْ ءَاكُلَ، وَهَذَا مُؤَقَّتٌ لِأَنَّهٌ كَانَ يَجُوعُ فِي أَوْقَاتٍ أُخْرَى.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1267},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَخْذُ مَجْلِسِ غَيْرِهِ أَوْ زَحْمَتُهُ الْمُؤْذِيَةُ أَوْ أَخْذُ نَوْبَتِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1268},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَدَنِ أَنْ يَأْخُذَ مَجْلِسَ غَيْرِهِ وَلَوْ ذِمِيًّا إِذَا سَبَقَ إِلَيْهِ سَوَاءٌ كَانَ مِنْ شَارِعٍ أَوْ غَيْرِهِ لِأَنَّهُ يَجُوزُ لِلذِّمِيِّ كَمَا لِلْمُسْلِمِ الْوُقُوفُ فِي الشَّارِعِ وَلَوْ وَسَطَهُ وَالْجُلُوسُ بِهِ لِاسْتِرَاحَةٍ أَوْ مُعَامَلَةٍ مَثَلًا إِنِ اتَّسَعَ وَلَمْ يُضَيِّقْ بِذَلِكَ عَلَى الْمَارَّةِ سَوَاءٌ كَانَ بِإِذْنِ الإِمَامِ أَمْ لا، وَلَكِنْ إِنْ نَشَأَ مِنْ نَحْوِ وُقُوفِهِ ضَرَرٌ يُؤْمَرُ بِقَضَاءِ حَاجَتِهِ وَالِانْصِرَافِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1269},{"type":"benefit","text":"فَائِدَةٌ. رَوَى مُسْلِمٌ فِي الصَّحِيحِ «مَنْ قَامَ مِنْ مَجْلِسِهِ ثُمَّ رَجَعَ إِلَيْهِ فَهُوَ أَحَقُّ بِهِ» فَعُلِمَ مِنْ ذَلِكَ أَنَّ السَّابِقَ لِمَحَلٍّ مِنَ الْمَسْجِدِ وَنَحْوِهِ لِصَلاةٍ أَحَقُّ بِهِ حَتَّى يُفَارِقَهُ، فَإِنْ فَارَقَهُ لِعُذْرٍ كَتَجْدِيدِ وُضُوءٍ وَإِجَابَةِ دَاعٍ وَقَضَاءِ حَاجَةٍ وَنَوَى الْعَوْدَةَ لَمْ يَبْطُلْ حَقُّهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1270},{"type":"p","text":"وَالنَّاسُ سَوَاءٌ فِي الْمِيَاهِ الْمُبَاحَةِ كَالأَنْهَارِ وَتُقَدَّمُ حَاجَةُ بَهِيمَةٍ عَلَى حَاجَةِ زَرْعٍ. وَمِثْلُ الْمِيَاهِ غَيْرُهَا مِنَ الْمَعَادِنِ فَلا يَجُوزُ لِأَحَدٍ الِاسْتِيلاءُ عَلَى نَوْبَةِ ذِي النَّوْبَةِ لِأَنَّهُ ظُلْمٌ كَمَا تَقَدَّمَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1271},{"type":"blank","text":""}]},{"id":"major-sins","title":"بَيَانٌ فِي تَمْيِيزِ الْكَبَائِرِ","description":"النص الوارد في تمييز الكبائر وبيانها.","icon":"fa-list-check","start":1273,"end":1297,"paragraphCount":23,"wordCount":387,"readMinutes":3,"blocks":[{"type":"heading","text":"بَيَانٌ فِي تَمْيِيزِ الْكَبَائِرِ","style":"Normal","align":"center","bold":true,"size":18.0,"index":1273},{"type":"blank","text":""},{"type":"p","text":"اعْلَمْ أَنَّ أَهْلَ الْحَقِّ اتَّفَقُوا عَلَى أَنَّ الذُّنُوبَ كَبَائِرُ وَصَغَائِرُ قَالَ اللَّهُ تَعَالَى ﴿الَّذِينَ يَجْتَنِبُونَ كَبَائِرَ الإِثْمِ وَالْفَوَاحِشَ إِلَّا اللَّمَمَ إِنَّ رَبَّكَ وَاسِعُ الْمَغْفِرَةِ﴾ [سُورَةَ النَّجْم/32] وَقَالَ تَعَالَى ﴿إِنْ تَجْتَنِبُوا كَبَآئِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ﴾ [سُورَةَ النِّسَاء/31] وَالْمُرَادُ هُنَا بِاللَّمَمِ وَبِالسَّيِّئَاتِ الصَّغَائِرُ. وَفِي الصَّحِيحِ «الصَّلَوَاتُ الْخَمْسُ كَفَّارَاتٌ لِمَا بَيْنَهُنَّ مَا لَمْ تُغْشَ الْكَبَائِرُ» أَيْ مَا لَمْ تُرْتَكَبُ الْكَبَائِرُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1275},{"type":"p","text":"وَلَمْ يَثْبُتْ بِحَدِيثٍ حَصْرُ الْكَبَائِرِ بِعَدَدٍ مُعَيَّنٍ. رَوَى عَبْدُ الرَّزَّاقِ فِي تَفْسِيرِهِ أَنَّهُ قِيلَ لِابْنِ عَبَّاسٍ كَمِ الْكَبَائِرُ أَهِيَ سَبْعٌ قَالَ «هِيَ إِلَى السَّبْعِينَ أَقْرَبُ»، وَوَرَدَ مِمَّا ثَبَتَ أَنَّهَا تِسْعَةٌ وَلَيْسَ الْمُرَادُ بِذَلِكَ الْحَصْرَ. رَوَى الْبُخَارِيُّ فِي الأَدَبِ الْمُفْرَدِ بِسَنَدِهِ إِلَى ابْنِ عُمَرَ مَوْقُوفًا «إِنَّمَا هِيَ تِسْعٌ الإِشْرَاكُ بِاللَّهِ وَقَتْلُ نَسَمَةٍ يَعْنِي بِغَيْرِ حَقٍّ وَقَذْفُ الْمُحْصَنَةِ وَالْفِرَارُ مِنَ الزَّحْفِ وَأَكْلُ الرِّبَا وَأَكْلُ مَالِ الْيَتِيمِ وَالَّذِي يَسْتَسْحِرُ وَالإِلْحَادُ فِي الْمَسْجِدِ يَعْنِي الْحَرَامَ وَبُكَاءُ الْوَالِدَيْنِ مِنَ الْعُقُوقِ». وَأَمَّا عَدُّ نِسْيَانِ الْقُرْءَانِ مِنَ الْكَبَائِرِ فَلا يَصِحُّ لِأَنَّ حَدِيثَ «نَظَرْتُ فِي الذُّنُوبِ فَلَمْ أَرَ أَعْظَمَ مِنْ سُورَةٍ مِنَ الْقُرْءَانِ أُوتِيَهَا رَجُلٌ فَنَسِيَهَا» ضَعِيفٌ وَهُوَ مُشْكِلٌ مَعْنًى.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1276},{"type":"p","text":"وَقَدْ تَكَلَّفَ الشَّيْخُ ابْنُ حَجَرٍ الْهَيْتَمِيُّ تَعْدِيدَ الْكَبَائِرِ إِلَى أَنْ أَوْصَلَهَا إِلَى أَرْبَعِمِائَةٍ وَزِيَادَةٍ فَلَيْسَ ذَلِكَ مِنْهُ بِجَيِّدٍ لِأَنَّ فِي خِلالِ مَا عَدَّهُ مَا يَبْعُدُ أَنْ يَكُونَ كَبِيرَةً.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1277},{"type":"p","text":"ثُمَّ إِنَّهُ عُرِّفَتِ الْكَبِيرَةُ بِأَلْفَاظٍ مُتَعَدِّدَةٍ وَمِنْ أَحْسَنِ مَا قِيلَ فِي ذَلِكَ «كُلُّ ذَنْبٍ أُطْلِقَ عَلَيْهِ بِنَصِّ كِتَابٍ أَوْ سُنَّةٍ أَوْ إِجْمَاعٍ أَنَّهُ كَبِيرَةٌ أَوْ عَظِيمٌ أَوْ أُخْبِرَ فِيهِ بِشِدَّةِ الْعِقَابِ أَوْ عُلِّقَ عَلَيْهِ الْحَدُّ وَشُدِّدَ النَّكِيرُ عَلَيْهِ فَهُوَ كَبِيرَةٌ». وَقَدْ أَوْصَلَ عَدَدَهَا تَاجُ الدِّينِ السُّبْكِيُّ إِلَى خَمْسَةٍ وَثَلاثِينَ مِنْ غَيْرِ ادِّعَاءِ حَصْرٍ فِي ذَلِكَ، وَنَظَمَ ذَلِكَ السُّيُوطِيُّ فِي ثَمَانِيَةِ أَبْيَاتٍ مِنَ الرجْزِ. قَالَ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1278},{"type":"p","text":"كَالْقَتْلِ وَالزِّنَى وَشُرْبِ الْخَمْرِ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1279},{"type":"p","text":"\t\t\tوَمُطْلَقِ الْمُسْكِرِ ثُمَّ السِّحْرِ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1280},{"type":"p","text":"وَالْقَذْفِ وَاللِّوَاطِ ثُمَّ الْفِطْرِ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1281},{"type":"p","text":"\t\t\tوَيَأْسِ رَحْمَةٍ وَأَمْنِ tyle":"Normal","align":"justify","bold":true,"size":18.0,"index":1295},{"type":"p","text":"تَنْبِيهٌ. الْمَعْرُوفُ عِنْدَ الشَّافِعِيَّةِ عَدُّ الْيَأْسِ مِنْ رَحْمَةِ اللَّهِ وَالأَمْنِ مِنْ مَكْرِ اللَّهِ مِنَ الْكَبَائِرِ الَّتِي دُونَ الْكُفْرِ، وَالْمَعْرُوفُ عِنْدَ الْحَنَفِيَّةِ عَدُّهُمَا رِدَّةً أَيْ خُرُوجًا مِنَ الإِسْلامِ، وَيَزُولُ الإِشْكَالُ فِي ذَلِكَ بِأَنْ يُقَالَ مَعْنَاهُمَا عِنْدَ الشَّافِعِيَّةِ غَيْرُ مَعْنَاهُمَا عِنْدَ الْحَنَفِيَّةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1296}]},{"id":"repentance","title":"أَحْكَامُ التَّوْبَةِ","description":"الفصل الختامي المتعلق بأحكام التوبة.","icon":"fa-seedling","start":1297,"end":1306,"paragraphCount":7,"wordCount":592,"readMinutes":4,"blocks":[{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1297},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَحْكَامِ التَّوْبَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1298},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: تَجِبُ التَّوْبَةُ مِنَ الذُّنُوبِ فَوْرًا عَلَى كُلِّ مُكَلَّفٍ وَهِيَ النَّدَمُ وَالإِقْلاعُ وَالْعَزْمُ عَلَى أَنْ لا يَعُودَ إِلَيْهَا وَإِنْ كَانَ الذَّنْبُ تَرْكَ فَرْضٍ قَضَاهُ أَوْ تَبِعَةً لِآدَمِيٍّ قَضَاهُ أَوِ اسْتَرْضَاهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1299},{"type":"p","text":"الشَّرْحُ التَّوْبَةُ مَعْنَاهَا الرُّجُوعُ وَهِيَ فِي الْغَالِبِ تَكُونُ مِنْ ذَنْبٍ سَبَقَ لِلْخَلاصِ مِنَ الْمُؤَاخَذَةِ بِهِ فِي الآخِرَةِ وَقَدْ تُطْلَقُ التَّوْبَةُ لِغَيْرِ ذَلِكَ وَذَلِكَ كَحَدِيثِ «إِنِّي لَأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي الْيَوْمِ مِائَةَ مَرَّةٍ»، وَكَذَلِكَ الِاسْتِغْفَارُ فِي الْغَالِبِ يَكُونُ مِنَ الذَّنْبِ الَّذِي وَقَعَ لِلْخَلاصِ مِنَ الْمُؤَاخَذَةِ بِهِ فِي الآخِرَةِ وَقَدْ يَكُونُ لِغَيْرِ ذَلِكَ، وَقَدْ وَرَدَ ذِكْرُ الِاسْتِغْفَارِ فِي الْقُرْءَانِ بِمَعْنَى طَلَبِ مَحْوِ الذَّنْبِ بِالإِسْلامِ

فَمِنْهُمْ مَنِ اعْتَبَرَهَا كَبِيرَةً وَمِنْهُمْ مَنِ اعْتَبَرَهَا صَغِيرَةً وَالصَّوَابُ التَّفْصِيلُ فِي ذَلِكَ فَإِنْ كَانَتِ الْغِيبَةُ لِأَهْلِ الصَّلاحِ وَالتَّقْوَى فَتِلْكَ لا شَكَّ كَبِيرَةٌ وَأَمَّا لِغَيْرِهِمْ فَلا يُطْلَقُ الْقَوْلُ بِكَوْنِهَا كَبِيرَةً لَكِنْ إِذَا اغْتِيبَ الْمُسْلِمُ الْفَاسِقُ إِلَى حَدِّ الإِفْحَاشِ كَأَنْ بَالَغَ شَخْصٌ فِي ذِكْرِ مَسَاوِئِهِ عَلَى غَيْرِ وَجْهِ التَّحْذِيرِ كَانَ ذَلِكَ كَبِيرَةً، وَعَلَى ذَلِكَ يُحْمَلُ حَدِيثُ «إِنَّ أَرْبَى الرِّبَا اسْتِطَالَةُ الرَّجُلِ فِي عِرْضِ أَخِيهِ الْمُسْلِمِ» رَوَاهُ أَبُو دَاوُدَ فَإِنَّ هَذِهِ الاِسْتِطَالَةَ كَبِيرَةٌ بَلْ مِنْ أَشَدِّ الْكَبَائِرِ لِوَصْفِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَهَا بِأَنَّهَا أَرْبَى الرِّبَا أَيْ أَنَّهَا فِي شِدَّةِ إِثْمِهَا كَأَشَدِّ الرِّبَا. وَكَمَا تَحْرُمُ الْغِيبَةُ يَحْرُم السُّكُوتُ عَلَيْهَا مَعَ الْقُدْرَةِ عَلَى النَّهْيِ وَيَحْرُمُ تَرْكُ مُفَارَقَةِ الْمُغْتَابِ إِنْ كَانَ لا يَنْتَهِي مَعَ الْقُدْرَةِ عَلَى الْمُفَارَقَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":989},{"type":"p","text":"   وَقَدْ تَكُونُ الْغِيبَةُ جَائِزَةً بَلْ وَاجِبَةً وَذَلِكَ فِي التَّحْذِيرِ الشَّرْعِيِّ مِنْ ذِي فِسْقٍ عَمَلِيٍّ أَوْ بِدْعَةٍ اعْتِقَادِيَّةٍ وَلَوْ مِنَ الْبِدَعِ الَّتِي هِيَ دُونَ الْكُفْرِ كَالتَّحْذِيرِ مِنَ التَّاجِرِ الَّذِي يَغُشُّ فِي مُعَامَلاتِهِ وَتَحْذِيرِ صَاحِبِ الْعَمَلِ مِنْ عَامِلِهِ الَّذِي يَخُونُهُ وَكَالتَّحْذِيرِ مِنَ الْمُتَصَدِّرِينَ لِلإِفْتَاءِ أَوِ التَّدْرِيسِ أَوِ الإِقْرَاءِ مَعَ عَدَمِ الأَهْلِيَّةِ فَهَذِهِ الْغِيبَةُ وَاجِبَةٌ. وَمِنَ الْجَهْلِ بِأُمُورِ الدِّينِ اسْتِنْكَارُ بَعْضِ النَّاسِ التَّحْذِيرَ مِنَ الْعَامِلِ الَّذِي يَخُونُ صَاحِبَ الْعَمَلِ احْتِجَاجًا بِقَوْلِهِمْ إِنَّ هَذَا قَطْعُ الرِّزْقِ عَلَى الْغَيْرِ فَهَؤُلاءِ يُؤْثِرُونَ مُرَاعَاةَ جَانِبِ الْعَبْدِ عَلَى مُرَاعَاةِ شَرِيعَةِ اللَّهِ. وَقَدْ قَسَّمَ بَعْضُ الْفُقَهَاءِ الأَسْبَابَ الَّتِي تُبِيحُ الْغِيبَةَ إِلَى سِتَّةٍ جَمَعَهَا فِي بَيْتٍ وَاحِدٍ قَالَ مِنَ الْوَافِرِ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":990},{"type":"heading","text":"تَظَلَّمْ وَاسْتَعِنْ وَاسْتَفْتِ حَذِّرْ\t   وَعَرِّفْ وَاذْكُرَنْ فِسْقَ الْمُجَاهِرْ","style":"Normal","align":"center","bold":false,"size":18.0,"index":991},{"type":"p","text":"وَمِنَ الْجَهْلِ الْقَبِيحِ قَوْلُ بَعْضِ النَّاسِ حِينَمَا تُنْكِرُ عَلَيْهِمُ الْغِيبَةَ «إِنِّي أَقُولُ هَذَا فِي وَجْهِهِ» كَأَنَّهُمْ يَظُنُّونَ أَنَّهُ لا بَأْسَ إِذَا اغْتِيبَ الشَّخْصُ بِمَا فِيهِ، وَهُؤَلاءِ لَمْ يَعْلَمُوا تَعْرِيفَ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِلْغِيبَةِ بِقَوْلِهِ «ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ» قِيلَ أَرَأَيْتَ يَا رَسُولَ اللَّهِ إِنْ كَانَ فِي أَخِي مَا أَقُولُ قَالَ «إِنْ كَانَ فِيهِ فَقَدِ اغْتَبْتَهُ» إِلَى ءَاخِرِ الْحَدِيثِ وَقَدْ تَقَدَّمَ رَوَاهُ مُسْلِمٌ وَأَبُو دَاوُدَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":992},{"type":"p","text":"   وَالْغِيبَةُ قَدْ تَكُونَ بِالتَّصْرِيحِ أَوِ الْكِنَايَةِ أَوِ التَّعْرِيضِ. وَمِنَ التَّعْرِيضِ الَّذِي هُوَ غِيبَةٌ أَنْ تَقُولَ إِذَا سُئِلْتَ عَنْ شَخْصٍ مُسْلِمٍ اللَّهُ لا يَبْتَلِينَا مَعْنَاهُ أَنَّهُ مُبْتَلًى بِمَا يُعَابُ بِهِ وَأَنْ تَقُولَ اللَّهُ يُصْلِحُنَا لِأَنَّكَ أَرَدْتَ بِهِ التَّعْرِيضَ بِأَنَّهُ لَيْسَ عَلَى حَالَةٍ طَيِّبَةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":993},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالنَّمِيمَةُ وَهِيَ نَقْلُ الْقَوْلِ لِلإِفْسَادِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":994},{"type":"p","text":"   الشَّرْحُ النَّمِيمَةُ مِنَ الْكَبِائِرِ وَهِيَ مِنْ جُمْلَةِ مَعَاصِي اللِّسَانِ لِأَنَّهَا قَوْلٌ يُرَادُ بِهِ التَّفْرِيقُ بَيْنَ اثْنَيْنِ بِمَا يَتَضَمَّنُ الإِفْسَادَ وَالْقَطِيعَةَ بَيْنَهُمَا أَوِ الْعَدَاوَةَ، وَيُعَبَّرُ عَنْهَا بِعِبَارَةٍ أُخْرَى وَهِيَ نَقْلُ كَلامِ النَّاسِ بَعْضِهِمْ إِلَى بَعْضٍ عَلَى وَجْهِ الإِفْسَادِ بَيْنَهُمْ قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى ﴿هَمَّازٍ مَّشَّآءٍ بِنَمِيمٍ﴾ [سُورَةَ الْقَلَم/11] وَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا يَدْخُلُ الْجَنَّةَ قَتَّاتٌ» رَوَاهُ الْبُخَارِيُّ. وَالْقَتَّاتُ النَّمَّامُ. وَالنَّمِيمَةُ وَالْغِيبَةُ وَعَدَمُ التَّنَزُّهِ مِنَ الْبَوْلِ مِنْ أَكْثَرِ أَسْبَابِ عَذَابِ الْقَبْرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":995},{"type":"p","text":"تَنْبِيهٌ لِيُعْلَمْ أَنَّ قَوْلَهُ تَعَالَى ﴿وَالْفِتْنَةُ أَشَدُّ مِنَ الْقَتْلِ﴾ [سُورَةَ الْبَقَرَة/191] مَعْنَاهُ أَنَّ الشِرْكَ أَشَدُ مِنَ الْقَتْلِ وَلَيْسَ مَعْنَاهُ أَنَّ مُجَرَّدَ الإِفْسَادِ بَيْنَ اثْنَيْنِ أَشَدُّ مِنْ قَتْلِ الْمُسْلِمِ ظُلْمًا بَلِ الَّذِي يَعْتَقِدُ ذَلِكَ يَكْفُرُ وَالْعِيَاذُ بِاللَّهِ لِأَنَّ الْجَاهِلَ وَالْعَالِمَ مِنَ الْمُسْلِمِينَ يَعْرِفَانِ أَنَّ قَتْلَ الشَّخْصِ ظُلْمًا أَشَدُّ فِي شَرْعِ اللَّهِ مِنْ مُجَرَّدِ الإِفْسَادِ بَيْنَهُ وَبَيْنَ ءَاخَرَ لا يَخْفَى ذَلِكَ عَلَى مُسْلِمٍ مَهْمَا بَلَغَ بِهِ الْجَهْلُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":996},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَحْرِيشُ مِنْ غَيْرِ نَقْلِ قَوْلٍ وَلَوْ بَيْنَ الْبَهَائِمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":997},{"type":"p","text":"الشَّرْحُ مِنْ جُمْلَةِ مَعَاصِي اللِّسَانِ الَّتِي هِيَ مِنَ الْكَبَائِرِ التَّحْرِيشُ بِالْحَثِّ عَلَى فِعْلِ مُحَرَّمٍ لإِيقَاعِ الْفِتْنَةِ بَيْنَ اثْنَيْنِ، وَكَذَلِكَ التَّحْرِيشُ بَيْنَ الْكَبْشَيْنِ مَثَلًا أَوْ بَيْنَ الدِّيكَيْنِ وَلَوْ مِنْ دُونِ قَوْلٍ بَلْ بِالْيَدِ وَنَحْوِهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":998},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْكَذِبُ وَهُوَ الإِخْبَارُ بِخِلافِ الْوَاقِعِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":999},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ الْكَذِبُ وَهُوَ عِنْدَ أَهْلِ الْحَقِّ الإِخْبَارُ بِالشَّىْءِ عَلَى خِلافِ الْوَاقِعِ عَمْدًا أَيْ مَعَ الْعِلْمِ بِأَنَّ خَبَرَهُ هَذَا عَلَى خِلافِ الْوَاقِعِ فَإِنْ لَمْ يَكُنْ مَعَ الْعِلْمِ بِذَلِكَ فَلَيْسَ كَذِبًا مُحَرَّمًا. وَهُوَ حَرَامٌ بِالإِجْمَاعِ سَوَاءٌ كَانَ عَلَى وَجْهِ الْجِدِّ أَوْ عَلَى وَجْهِ الْمَزْحِ وَلَوْ لَمْ يَكُنْ فِيهِ إِضْرَارٌ بِأَحَدٍ كَمَا وَرَدَ مَرْفُوعًا إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَمَوْقُوفًا بِإِسْنَادٍ صَحِيحٍ عَلَى بَعْضِ الصَّحَابَةِ «لا يَصْلُحُ الْكَذِبُ فِي جِدٍّ وَلا فِي هَزْلٍ» وَرَوَى مُسْلِمٌ فِي الصَّحِيحِ «إِيَّاكَ وَالْكَذِبَ فَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ وَإِنَّ الْفُجُورَ يَهْدِي إِلَى النَّارِ وَلا يَزَالُ الْعَبْدُ يَكْذِبُ وَيَتَحَرَّى الْكَذِبَ حَتَّى يُكْتَبُ عِنْدَ اللَّهِ كَذَّابًا» رَوَى الْحَدِيثَيْنِ ابْنُ مَاجَهْ فِي سِيَاقٍ وَاحِدٍ عَنِ ابْنِ مَسْعُودٍ. وَمَعْنَى قَوْلِهِ عَلَيْهِ السَّلامُ «يَهْدِي إِلَى الْفُجُورِ» هُوَ وَسِيلَةٌ إِلَى ذَلِكَ أَيْ طَرِيقٌ تُوصِلُ إِلَى ذَلِكَ، وَمَا أَكْثَرَ مَنْ هَلَكَ بِاسْتِعْمَالِ الْكَذِبِ فِي الْهَزْلِ وَالْمَزْحِ. وَأَشَدُّ مَا يَكُونُ مِنْ ذَلِكَ إِذَا كَانَ يَتَضَمَّنُ تَحْلِيلَ حَرَامٍ أَوْ تَحْرِيمَ حَلالٍ أَوْ تَرْوِيعَ مُسْلِمٍ يَظُنُّ أَنَّهُ صِدْقٌ، وَمِنْ أَمْثِلَةِ ذَلِكَ أَنَّ رَجُلًا كَانَ بَيْنَ أَصْدِقَائِهِ فِي مَكَانٍ فَأَقْبَلَ أَعْمَى فَقَالَ هَذَا الرَّجُلُ قَالَ اللَّهُ تَعَالَى (إِذَا رَأَيْتَ الأَعْمَى فَكُبَّهُ إِنَّكَ لَسْتَ أَكْرَمَ مِنْ رَبِّهِ) قَالَهُ لإِضْحَاكِ الْحَاضِرِينَ لِأَنَّ هَذَا أَوْ مَا أَشْبَهَهُ عِنْدَ هَؤُلاءِ السُّفَهَاءِ الْجَاهِلِينَ بِالدِّينِ مِنَ الطُّرَفِ وَلَمْ يَدْرِ هَذَا وَمَنْ كَانَ مَعَهُ أَنَّ هَذَا يَتَضَمَّنُ كَذِبًا عَلَى اللَّهِ بِجَعْلِ هَذَا الْكَلامِ السَّفِيهِ قُرْءَانًا وَأَنَّهُ يَتَضَمَّنُ تَحْلِيلَ الْحَرَامِ الْمَعْلُومِ مِنَ الدِّينِ بِالضَّرُورَةِ حُرْمَتُهُ لِأَنَّهُ لا يَجْهَلُ حُكْمَ هَذَا الْفِعْلَ مُسْلِمٌ أَنَّهُ حَرَامٌ مَهْمَا بَلَغَ فِي الْجَهْلِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1000},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْيَمِينُ الْكَاذِبَةُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1001},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ الْيَمِينُ الْكَاذِبَةُ وَهِيَ مِنَ الْكَبَائِرِ لِأَنَّ الْحَلِفَ بِاللَّهِ تَبَارَكَ وَتَعَالَى بِخِلافِ الْوَاقِعِ بِذِكْرِ اسْمِهِ أَوْ صِفَةٍ مِنْ صِفَاتِهِ كَقَوْلِ وَحَيَاةِ اللَّهِ أَوْ وَالْقُرْءَانِ أَوْ وَعَظَمَةِ اللَّهِ أَوْ وَعِزَّةِ اللَّهِ أَوْ نَحْوِ ذَلِكَ مِنْ صِفَاتِهِ تَهَاوُنٌ فِي تَعْظِيمِ اللَّهِ تَعَالَى. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1002},{"type":"p","text":"تَنْبِيهٌ لا يَجُوزُ أَنْ يُقَالَ وَحَيَاةِ الْقُرْءَانِ لِأَنَ الْقُرْءَانَ لا يُوصَفُ بِالْحَيَاةِ وَلا بِالْمَوْتِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1003},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَلْفَاظُ الْقَذْفِ وَهِيَ كَثِيرَةٌ حَاصِلُهَا كُلُّ كَلِمَةٍ تَنْسُبُ إِنْسَانًا أَوْ وَاحِدًا مِنْ قَرَابَتِهِ إِلَى الزِّنَى فَهِيَ قَذْفٌ لِمَنْ نُسِبَ إِلَيْهِ إِمَّا صَريِحًا مُطْلقًا أَوْ كِنَايَةً بِنِيَّةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1004},{"type":"p","text":"الشَّرْحُ مِنْ جُمْلَةِ مَعَاصِي اللِّسَانِ الْكَلامُ الَّذِي يُقْذَفُ أَيْ يُرْمَى بِهِ شَخْصٌ بِالزِّنَى وَنَحْوِهِ. وَالْقَذْفُ إِنْ كَانَ بِنِسْبَةِ صَرِيحِ الزِّنَى كَأَنْ يَقُولَ فِي رَجُلٍ فُلانٌ زَانٍ أَوْ فِي امْرَأَةٍ فُلانَةُ زَانِيَةٌ وَكَذَلِكَ قَوْلُهُ فُلانٌ لاطَ بِفُلانٍ أَوْ لاطَ بِهِ فُلانٌ أَوْ فُلانٌ لائِطٌ سَوَاءٌ نَوَى بِهِ الْقَذْفَ أَوْ لَمْ يَنْوِ يُوجِبُ الْحَدَّ عَلَى الْقَاذِفِ، فَإِنْ كَانَ كِنَايَةً بِأَنْ كَانَ اللَّفْظُ غَيْرَ صَرِيحٍ بَلْ يَحْتَمِلُ الْقَذْفَ وَغَيْرَهُ كَأَنْ يَقُولَ لِشَخْصٍ يَا خَبِيثُ أَوْ يَا فَاجِرُ أَوْ يَا فَاسِقُ وَنَوَى الْقَذْفَ كَانَ قَذْفًا مُوجِبًا لِلْحَدِّ أَيْضًا. وَأَمَّا التَّعْرِيضُ كَقَوْلِهِ نَحْنُ أَوْلادُ حَلالٍ مُرِيدًا بِذَلِكَ أَنَّ فُلانًا ابْنُ زِنًى فَإِنَّهُ مَعَ حُرْمَتِهِ لا حَدَّ فِيهِ. رَوَى مُسْلِمٌ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «اجْتَنِبُوا السَّبْعَ الْمُوبِقَاتِ» أَيِ الْمُهْلِكَاتِ قِيلَ وَمَا هُنَّ يَا رَسُولَ اللَّهِ قَالَ «الشِّرْكُ بِاللَّهِ وَالسِّحْرُ وَقَتْلُ النَّفْسِ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ وَأَكْلُ مَالِ الْيَتِيمِ وَأَكْلُ الرِّبَا وَالْتَوَلِّي يَوْمَ الزَّحْفِ وَقَذْفُ الْمُحْصَنَاتِ الْغَافِلاتِ الْمُؤْمِنَاتِ» وَمَعْنَى الْمُحْصَنَاتِ الْعَفِيفَاتُ اللَّاتِي لَمْ يَمَسَّهُنَّ الزِّنَا وَلا تُعْرَفُ عَلَيْهِنَّ الْفَاحِشَةُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1005},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيُحَدُّ الْقَاذِفُ الْحُرُّ ثَمَانِينَ جَلْدَةً وَالرَّقِيقُ نِصْفَهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1006},{"type":"p","text":"الشَّرْحُ أَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى أَنْزَلَ فِي شَرْعِهِ حُكْمَ الْقَاذِفِ فَالْقَاذِفُ إِمَّا أَنْ يَكُونَ حُرًّا أَوْ عَبْدًا فَالْحُرُّ حَدُّهُ ثَمَانُونَ جَلْدَةً بِسَوْطٍ وَالْعَبْدُ حَدُّهُ نِصْفُ ذَلِكَ وَهُوَ أَرْبَعُونَ جَلْدَةً، وَهَذَا الْحُكْمُ مُجْمَعٌ عَلَيْهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1007},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْهَا سَبُّ الصَّحَابَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1008},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ سَبُّ أَصْحَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. قَالَ اللَّهُ تَعَالَى ﴿وَالسَّابِقُونَ الأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالأَنْصَارِ وَالَّذِينَ اتَّبَعُوهُمْ بِإِحْسَانٍ رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ﴾ هَؤُلاءِ هُمْ أَوْلِيَاءُ الصَّحَابَةِ وَسَبُّ أَحَدِهِمْ أَعْظَمُ إِثْمًا وَأَشَدُّ ذَنْبًا مِنْ سَبِّ غَيْرِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1009},{"type":"p","text":"وَلَيْسَ مِنْ سَبِّ الصَّحَابَةِ الْقَوْلُ إِنَّ مُقَاتِلِي عَلِيٍّ بُغَاةٌ لِأَنَّ هَذَا مِمَّا صَرَّحَ بِهِ الْحَدِيثُ بِالنِّسْبَةِ لِبَعْضِهِمْ وَهُمْ أَهْلُ صِفِّينَ فَقَدْ قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «وَيْحَ عَمَّارٍ تَقْتُلُهُ الْفِئَةُ الْبَاغِيَةُ» رَوَاهُ الْبُخَارِيُّ وَغَيْرُهُ وَهُوَ حَدِيثٌ مُتَوَاتِرٌ، وَقَالَ ذَلِكَ الإِمَامُ الشَّافِعِيُّ رَضِيَ اللَّهُ عَنْهُ. وَرَوَى الْبَيْهَقِيُّ فِي السُّنَنِ الْكُبْرَى وَابْنُ أَبِي شَيْبَةَ فِي مُصَنَّفِهِ عَنْ عَمَّارِ ابْنِ يَاسِرٍ أَنَّهُ قَالَ لا تَقُولُوا كَفَرَ أَهْلُ الشَّامِ وَلَكِنْ قُولُوا فَسَقُوا وَظَلَمُوا اﻫ يَعْنِي بِأَهْلِ الشَّامِ الْمُقَاتِلِينَ لِأَمِيرِ الْمُؤْمِنِينَ عَلِيٍّ فِي وَقْعَةِ صِفِّينَ، وَمَعْلُومٌ مَنْ هُوَ عَمَّارٌ، هُوَ أَحَدُ الثَّلاثَةِ الَّذِينَ قَالَ فِيهِمْ رَسُولُ اللَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّ الْجَنَّةَ تَشْتَاقُ إِلَى ثَلاثَةٍ» الْحَدِيثَ، وَقَالَ فِيهِ «عَمَّارٌ مُلِئَ إِيمَانًا إِلَى مُشَاشِهِ» وَالْحَاصِلُ الَّذِي تَلَخَّصَ مِمَّا تَقَدَّمَ أَنَّ سَبَّ الصَّحَابَةِ عَلَى الإِجْمَالِ كُفْرٌ وَأَمَّا سَبُّ فَرْدٍ مِنَ الأَفْرَادِ مِنْهُمْ فَهُوَ مَعْصِيَةٌ إِلَّا أَنْ يَعِيبَهُ بِشَىْءٍ لِسَبَبٍ شَرْعِيٍّ فَلا حُرْمَةَ فِي ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1010},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَشَهَادَةُ الزُّورِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1011},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي اللِّسَانِ شَهَادَةَ الزُّورِ. وَالزُّورُ الْكَذِبُ. وَشَهَادَةُ الزُّورِ مِنْ أَكْبَرِ الْكَبَائِرِ قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «عَدَلَتْ شَهَادَةُ الزُّورِ الإِشْرَاكَ بِاللَّهِ» أَيْ شُبِّهَتْ بِهِ وَلَيْسَ الْمُرَادُ أَنَّهَا تَنْقُلُ فَاعِلَهَا عَنِ الدِّينِ. وَالْحَدِيثُ رَوَاهُ الْبَيْهَقِيُّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1012},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَطْلُ الْغَنِيِّ أَيْ تَأْخِيرُ دَفْعِ الدَّيْنِ مَعَ غِنَاهُ أَيْ مَقْدِرَتِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1013},{"type":"p","text":"الشَّرْحُ أَنَّ مَطْلَ الْغَنِيِّ مِنْ جُمْلَةِ مَعَاصِي اللِّسَانِ الَّتِي هِيَ مِنَ الْكَبَائِرِ لِأَنَّهُ يَتَضَمَّنُ الْوَعْدَ بِالْقَوْلِ بِالْوَفَاءِ ثُمَّ يُخْلِفُ. رَوَى أَبُو دَاوُدَ فِي سُنَنِهِ «لَيُّ الْوَاجِدِ يُحِلُّ عِرْضَهُ وَعُقُوبَتَه». مَعْنَى الْحَدِيثِ أَنَّ لَيَّ الْوَاجِدِ أَيْ مُمَاطَلَةَ الْغَنِيِّ الْقَادِرِ عَلَى الدَّفْعِ يُحِلُّ عِرْضَهُ وَعُقُوبَتَهُ أَيْ يُحِلُ أَنْ يُذْكَرَ بَيْنَ النَّاسِ بِالْمَطْلِ وَسُوءِ الْمُعَامَلَةِ تَحْذِيرًا وَيُحِلُ عُقُوبَتَهُ بِالْحَبْسِ وَالضَّرْبِ وَنَحْوِهِمَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1014},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالشَّتْمُ وَاللَّعْنُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1015},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ شَتْمُ الْمُسْلِمِ أَيْ سَبُّهُ، رَوَى الْبُخَارِيُّ أَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «سِبَابُ الْمُسْلِمِ فُسُوقٌ وَقِتَالُهُ كُفْرٌ» أَيْ أَنَّ سَبَّ الْمُسْلِمِ مِنَ الْكَبَائِرِ بِدَلِيلِ تَسْمِيَتِهِ فُسُوقًا. وَأَطْلَقَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى قِتَالِهِ لَفْظَ الْكُفْرِ لِأَنَّهُ شَبِيهٌ بِالْكُفْرِ لا يَعْنِي أَنَّهُ يَنْقُلُ عَنِ الْمِلَّةِ لِأَنَّ اللَّهَ تَعَالَى سَمَّى كِلْتَا الطَّائِفَتَيْنِ الْمُتَقَاتِلَتَيْنِ مُؤْمِنِينَ فِي قَوْلِهِ تَعَالَى ﴿وَإِنْ طَآئِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا﴾ [سُورَةَ الْحُجُرَات/9] الآيَةَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1016},{"type":"p","text":"وَأَمَّا اللَّعْنُ فَمَعْنَاهُ الْبُعْدُ مِنَ الْخَيْرِ. وَلَعْنُ الْمُسْلِمِ مِنَ الْكَبَائِرِ قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لَعْنُ الْمُسْلِمِ كَقَتْلِهِ» رَوَاهُ مُسْلِمٌ . ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1017},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالِاسْتِهْزَاءُ بِالْمُسْلِمِ وَكُلُّ كَلامٍ مُؤْذٍ لَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1018},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي اللِّسَانِ الِاسْتِهْزَاءَ بِالْمُسْلِمِ أَيْ تَحْقِيرَهُ، وَكَذَلِكَ كُلُّ كَلامٍ مُؤْذٍ لِلْمُسْلِمِ أَيْ إِذَا كَانَ بِغَيْرِ حَقٍّ. وَفِي حُكْمِ الْكَلامِ الْمُؤْذِي الْفِعْلُ وَالإِشَارَةُ اللَّذَانِ يَتَضَمَّنَانِ ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1019},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْكَذِبُ عَلَى اللَّهِ وَعَلَى رَسُولِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1020},{"type":"p","text":"الشَّرْحُ مِنْ جُمْلَةِ مَعَاصِي اللِّسَانِ الْكَذِبُ عَلَى اللَّهِ سُبْحَانَهُ وَتَعَالَى وَكَذَا الْكَذِبُ عَلَى رَسُولِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَلا خِلافَ فِي أَنَّ ذَلِكَ مِنَ الْكَبَائِرِ بَلْ مِنَ الْكَذِبِ عَلَى اللَّهِ وَرَسُولِهِ مَا هُوَ كُفْرٌ كَأَنْ يَنْسُبَ إِلَى اللَّهِ أَوْ إِلَى رَسُولِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ تَحْرِيمَ مَا عُلِمَ حِلُّهُ بِالضَّرُورَةِ أَوْ تَحْلِيلَ مَا عُلِمَتْ حُرْمَتُهُ بِالضَّرُورَةِ. قَالَ اللَّهُ تَعَالَى ﴿وَيَوْمَ الْقِيَامَةِ تَرَى الَّذِينَ كَذَبُوا عَلَى اللَّهِ وُجُوهُهُم مُّسْوَدَّةٌ﴾ [سُورَةَ الزُّمَر/60] وَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّ كَذِبًا عَليَّ لَيْسَ كَكَذِبٍ عَلَى أَحَدٍ فَمَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ» رَوَاهُ مُسْلِمٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1021},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالدَّعْوَى الْبَاطِلَةُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1022},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ جُمَلَةِ مَعَاصِي اللِّسَانِ الدَّعْوَى الْبَاطِلَةَ كَأَنْ يَدَّعِيَ عَلَى شَخْصٍ مَا لَيْسَ لَهُ اعْتِمَادًا عَلَى شَهَادَةِ الزُّورِ أَوْ عَلَى جَاهِهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1023},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالطَّلاقُ الْبِدْعِيُّ وَهُوَ مَا كَانَ فِي حَالِ الْحَيْضِ أَوْ فِي طُهْرٍ جَامَعَ فِيهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1024},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ الطَّلاقُ الْبِدْعِيُّ وَهُوَ أَنْ يُطَلِّقَ امْرَأَتَهُ فِي طُهْرٍ جَامَعَهَا فِيهِ أَوْ فِي حَيْضٍ أَوْ نِفَاسٍ وَقَدْ تَقَدَّمَ بَيَانُهُ. وَمَعَ حُرْمَةِ ذَلِكَ فَإِنَّ الطَّلاقَ يَقَعُ فِيهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1025},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالظِّهَارُ وَهُوَ أَنْ يَقُولَ لِزَوْجَتِهِ أَنْتِ عَلَيَّ كَظَهْرِ أُمِّي أَيْ لا أُجَامِعُكِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1026},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي اللِّسَانِ الظِّهَارَ وَهُوَ أَنْ يَقُولَ لِزَوْجَتِهِ وَلَوْ رَجْعِيَّةً أَنْتِ عَلَيَّ كَظَهْرِ أُمِّي وَكَذَلِكَ قَوْلُهُ أَنْتِ كَيَدِهَا أَوْ بَطْنِهَا لِمَا فِيهِ مِنْ إِيذَاءٍ لِلْمَرْأَةِ. وَهُوَ مِنَ الْكَبَائِرِ. وَمِثْلُ الأُمِّ سَائِرُ الْمَحَارِمِ فَلَوْ قَالَ لِزَوْجَتِهِ أَنْتِ عَلَيَّ كَظَهْرِ أُخْتِي أَوْ يَدِهَا أَوْ بَطْنِهَا فَهُوَ ظِهَارٌ مُحَرَّمٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1027},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَفِيهِ كَفَّارَةٌ إِنْ لَمْ يُطَلِّقْ بَعْدَهُ فَوْرًا وَهِيَ عِتْقُ رَقَبَةٍ مُؤْمِنَةٍ سَلِيمَةٍ فَإِنْ عَجَزَ صَامَ شَهْرَيْنِ مُتَتَابِعَيْنِ فَإِنْ عَجَزَ أَطْعَمَ سِتِّينَ مِسْكِينًا سِتِّينَ مُدًّا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1028},{"type":"p","text":"الشَّرْحُ يَتَرَتَّبُ عَلَى الظِّهَارِ إِنْ لَمْ يُتْبِعْهُ الزَّوْجُ بِالطَّلاقِ فَوْرًا الْكَفَّارَةُ وَحُرْمَةُ جِمَاعِهَا قَبْلَ ذَلِكَ. وَكَفَّارَتُهُ إِحْدَى ثَلاثِ خِصَالٍ عَلَى التَّرْتِيبِ الأُولَى إِعْتَاقُ رَقَبَةٍ مُسْلِمَةٍ أَيْ نَفْسٍ مَمْلُوكَةٍ عَبْدٍ أَوْ أَمَةٍ سَلِيمَةٍ عَمَّا يُخِلُّ بِالْعَمَلِ وَالْكَسْبِ إِخْلالًا بَيِّنًا وَالثَّانِيَةُ صِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ أَيْ إِنْ عَجَزَ عَنْ إِعْتَاقِ الرَّقَبَةِ وَقْتَ الأَدَاءِ، وَيَنْقَطِعُ التَّتَابُعُ بِفَوَاتِ يَوْمٍ مِنَ الشَّهْرَيْنِ، وَالثَّالِثَةُ إِطْعَامُ سِتِّينَ مِسْكِينًا أَوْ فَقِيرًا كُلَّ مِسْكِينٍ مُدًّا مِمَّا يَصِحُّ دَفْعُهُ عَنْ زَكَاةِ الْفِطْرَةِ فَلا يَصِحُّ دَفعُهَا لِوَاحِدٍ بِعَيْنِهِ كُلَّ يَوْمٍ وَيَصِحُّ أَنْ يَجْمَعَ السِّتِّينَ فِي ءَانٍ وَاحِدٍ وَيَضَعَهَا بَيْنَهُمْ فَيُمَلِّكَهُمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1029},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْهَا اللَّحْنُ فِي الْقُرْءَانِ بِمَا يُخِلُّ بِالْمَعْنَى أَوْ بِالإِعْرَابِ وَإِنْ لَمْ يُخِلَّ بِالْمَعْنَى.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1030},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ أَنْ يَقْرَأَ الْقُرْءَانَ مَعَ اللَّحْنِ وَلَوْ كَانَ لا يُخِلُّ بِالْمَعْنَى وَلَمْ يُغَيِّرْهُ لَكِنْ تَعَمَّدَهُ، وَيَجِبُ إِنْكَارُ ذَلِكَ عَلَيْهِ فَإِنَّهُ يَجِبُ تَصْحِيحُ الْقِرَاءَةِ إِلَى الْحَدِّ الَّذِي يَسْلَمُ فِيهِ مِنْ تَغْيِيرِ الإِعْرَابِ وَالْحَرْفِ وَمِنْ قَطْعِ الْكَلِمَةِ بَعْضِهَا عَنْ بَعْضٍ وُجُوبًا عَيْنِيًّا بِالنِّسْبَةِ لِلْفَاتِحَةِ وُوُجُوبًا كِفَائِيًّا بِالنِّسْبَةِ لِغَيْرِهَا، فَيَجِبُ صَرْفُ جَمِيعِ الْوَقْتِ الَّذِي يُمْكِنُهُ لِتَحْصِيلِ تَصْحِيحِ الْفَاتِحَةِ فَإِنْ قَصَّرَ بِحَيْثُ لَمْ تَصِحَّ قِرَاءَتُهُ لِلْفَاتِحَةِ عَصَى وَلَزِمَهُ قَضَاءُ صَلَوَاتِ الْمُدَّةِ الَّتِي أَمْكَنَهُ التَّعَلُّمُ فِيهَا فَلَمْ يَتَعَلَّمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1031},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالسُّؤَالُ لِلْغَنِيِّ بِمَالٍ أَوْ حِرْفَةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1032},{"type":"p","text":"الشَّرْحُ مِنْ جُمْلَةِ مَعَاصِي اللِّسَانِ أَنْ يَسْأَلَ الشَّخْصُ الْمُكْتَفِي بِالْمَالِ أَوِ الْحِرْفَةِ بِأَنْ كَانَ مِالِكًا مَا يَكْفِيهِ لِحَاجَاتِهِ الأَصْلِيَّةِ أَوْ كَانَ قَادِرًا عَلَى تَحْصِيلِ ذَلِكَ بِكَسْبٍ حَلالٍ وَذَلِكَ لِحَدِيثِ «لا تَحِلُّ الْمَسْأَلَةُ لِغَنِيٍّ وَلا لِذِي مِرَّةٍ سَوِيٍّ» رَوَاهُ أَبُو دَاوُدَ وَالْبَيْهَقِيُّ. وَالْمِرَّةُ هِيَ الْقُوَّةُ أَيِ الْقُدْرَةُ عَلَى الِاكْتِسَابِ وَالسَّوِيُّ تَامُّ الْخَلْقِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1033},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالنَّذْرُ بِقَصْدِ حِرْمَانِ الْوَارِثِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1034},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي اللِّسَانِ أَنْ يَنْذُرَ الرَّجُلُ نَذْرًا يَقْصِدُ بِهِ أَنْ يَحْرِمَ وَارِثَهُ وَلا يَصِحُّ ذَلِكَ النَّذْرُ، أَمَّا لَوْ لَمْ يَكُنْ قَصْدُهُ بِالنَّذْرِ حِرْمَانَ الْوَارِثِ فَلا يَحْرُمُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1035},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَرْكُ الْوَصِيَةِ بِدَيْنٍ أَوْ عَيْنٍ لا يَعْلَمُهُمَا غَيْرُهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1036},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ تَرْكُ الْوَصِيَّةِ بِدَيْنٍ عَلَى الشَّخْصِ أَوْ عَيْنٍ لِغَيْرِهِ عِنْدَهُ بِطَرِيقِ الْوَدِيعَةِ أَوْ نَحْوِهَا فَيَجِبُ عَلَى مَنْ عَلَيْهِ أَوْ عِنْدَهُ ذَلِكَ أَنْ يُعْلِمَ بِهِ غَيْرَ وَارِثٍ يَثْبُتُ بِقَوْلِهِ وَلَوْ وَاحِدًا ظَاهِرَ الْعَدَالَةِ إِنْ خَافَ ضَيَاعَهُ بِمَوْتِهِ أَوْ يَرُدَّهُ حَالًا خَوْفًا مِنْ خِيَانَةِ الْوَارِثِ فَإِنْ عَلِمَ بِهَا غَيْرُهُ كَانَتِ الْوَصِيَّةُ مَنْدُوبَةً. وَيَشْمَلُ مَا ذُكِرَ مَا كَانَ دَيْنًا لِلَّهِ كَالزَّكَاةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1037},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالِانْتِمَاءُ إِلَى غَيْرِ أَبِيهِ أَوْ إِلَى غَيْرِ مَوَالِيهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1038},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ الَّتِي هِيَ مِنَ الْكَبَائِرِ أَنْ يَنْتَمِيَ الرَّجُلُ إِلَى غَيْرِ أَبِيهِ أَوْ أَنْ يَنْتَمِيَ الْمُعْتَقُ إِلَى غَيْرِ مَوَالِيهِ أَيِ الَّذِينَ هُمْ أَعْتَقُوهُ فَلَهُمْ عَلَيْهِ وَلاءُ عَتَاقِةٍ لِأَنَّ فِي ذَلِكَ تَضْيِيعَ حَقٍّ. رَوَى أَبُو دَاوُدَ وَالتِّرْمِذِيُّ وَابْنُ مَاجَهْ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «مَنِ ادَّعَى إِلَى غَيْرِ أَبِيهِ فَعَلَيْهِ لَعْنَةُ اللَّهِ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1039},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْخِطْبَةُ عَلَى خِطْبَةِ أَخِيهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1040},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ أَنْ يَخْطُبَ الرَّجُلُ عَلَى خِطْبَةِ أَخِيهِ أَيْ أَخِيهِ فِي الإِسْلامِ. وَإِنَّمَا يَحْرُمُ ذَلِكَ بَعْدَ الإِجَابَةِ مِمَّنْ تُعْتَبَرُ مِنْهُ مِنْ وَلِيٍّ مُجْبِرٍ أَوْ مِنْهَا أَوْ مِنْهَا وَمِنْ وَلِيٍّ أَيْ بِدُونِ إِذْنِ الْخَاطِبِ الأَوَّلِ وَذَلِكَ لِمَا فِي الْخِطْبَةِ عَلَى خِطْبَةِ أَخِيهِ مِنَ الإِيذَاءِ وَمَا تُسَبِّبُهُ مِنَ الْقَطِيعَةِ فَأَمَّا إِنْ أَذِنَ فَلا حُرْمَةَ فِي ذَلِكَ وَكَذَلِكَ إِنْ أَعْرَضَ عَنْهَا. وَقَدْ رَوَى الْبُخَارِيُّ وَمُسْلِمٌ مِنْ حَدِيثِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا يَخْطُبْ أَحَدُكُمْ عَلَى خِطْبَةِ أَخِيهِ حَتَّى يَتْرُكَ الْخَاطِبُ قَبْلَهُ أَوْ يَأْذَنَ لَهُ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1041},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْفَتْوَى بِغَيْرِ عِلْمٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1042},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ الَّتِي هِيَ مِنَ الْكَبَائِرِ أَنْ يُفْتِيَ الشَّخْصُ بِفَتْوًى بِغَيْرِ عِلْمٍ. قَالَ اللَّهُ تَعَالَى ﴿وَلا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَئِكَ كَانَ عَنْهُ مَسْئُولًا﴾ [سُورَةَ الإِسْرَاء/36] أَيْ لا تَقُلْ قَوْلًا بِغَيْرِ عِلْمٍ، فَمَنْ أَفْتَى فَإِنْ كَانْ مُجْتَهِدًا أَفْتَى عَلَى حَسَبِ اجْتِهَادِهِ وَإِنْ لَمْ يَكُنْ مُجْتَهِدًا فَلَيْسَ لَهُ أَنْ يُفْتِيَ إِلَّا اعْتِمَادًا عَلَى فَتْوَى إِمَامٍ مُجْتَهِدٍ أَيْ عَلَى نَصٍّ لَهُ أَوْ وَجْهٍ اسْتَخْرَجَهُ أَصْحَابُ مَذْهَبِهِ مِنْ نَصٍّ لَهُ، وَلا يُغْفِلْ كَلِمَةَ لا أَدْرِي فَقَدْ جَاءَ عَنْ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ أَنَّهُ سُئِلَ ثَمَانِيَةً وَأَرْبَعِينَ سُؤَالًا فَأَجَابَ عَنْ سِتَّةَ عَشَرَ وَقَالَ عَنِ الْبَقِيَّةِ «لا أَدْرِي» اﻫ رَوَى ذَلِكَ صَاحِبُهُ هَيْثَمُ بنُ جَمِيلٍ. وَرُوِيَ عَنْ سَيِّدِنَا عَلِيٍّ أَنَّهُ سُئِلَ عَنْ شَىْءٍ فَقَالَ «وَابَرْدَهَـا عَلَى الْكَبِدِ أَنْ أُسـْأَلَ عَنْ شَىْءٍ لا عِلْمَ لِي بِهِ فَأَقُولَ لا أَدْرِي» اﻫ رَوَاهُ الْحَافِظُ الْعَسْقَلانِيُّ فِي تَخْريِجِهِ عَلَى مُخْتَصَرِ ابْنِ الْحَاجِبِ الأَصْلِيِّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1043},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَعْلِيمُ وَتَعَلُّمُ عِلْمٍ مُضِرٍّ لِغَيْرِ سَبَبٍ شَرْعِيٍّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1044},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ تَعْلِيمُ الشَّخْصِ غَيْرَهُ كُلَّ عِلْمٍ مُضِرٍّ شَرْعًا وَتَعَلُّمُ الشَّخْصِ ذَلِكَ لِأَنَّ مِنَ الْعِلْمِ مَا هُوَ مُحَرَّمٌ كَالسِّحْرِ وَالشَّعْوَذَةِ وَعِلْمِ الْحَرْفِ الَّذِي يُقْصَدُ لِاسْتِخْرَاجِ الأُمُورِ الْمُسْتَقبَلَةِ أَوِ الأُمُورِ الْخَفِيَّةِ مِمَّا وَقَعَ وَقَدْ عَدَّ هَذَا الْعِلْمَ مِنَ الْعُلُومِ الْمُحَرَّمَةِ السُّيُوطِيُّ وَغَيْرُهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1045},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْحُكْمُ بِغَيْرِ حُكْمِ اللَّهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1046},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ الْحُكْمُ بِغَيْرِ حُكْمِ اللَّهِ أَيْ بِغَيْرِ شَرْعِهِ الَّذِي أَنْـزَلَهُ عَلَى نَبِيِّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ اللَّهُ تَعَالَى ﴿أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ﴾ [سُورَةَ الْمَائِدَة/50] الآيَةَ. وَالْحُكْمُ بِغَيْرِ مَا أَنْزَلَ اللَّهُ مِنَ الْكَبَائِرِ إِجْمَاعًا. وَأَمَّا الآيَاتُ الثَّلاثُ الَّتِي فِي سُورَةِ الْمَائِدَةِ وَهِيَ ﴿وَمَنْ لَّمْ يَحْكُم بِمَآ أَنزَلَ اللَّهُ فَأُولَئِكَ هُمُ الْكَافِرُونَ﴾ [سُورَةَ الْمَائِدَة/44] وَالَّتِي فِيهَا ﴿فَأُولَئِكَ هُمُ الظَّالِمُونَ﴾ [سُورَةَ الْمَائِدَة/45] وَالَّتِي فِيهَا ﴿فَأُولَئِكَ هُمُ الْفَاسِقُونَ﴾ [سُورَةَ الْمَائِدَة/47] فَقَدْ رَوَى مُسْلِمٌ عَنِ الْبَرَاءِ بنِ عَازِبٍ أَنَّ الْيَهُودَ حَرَّفُوا حُكْمَ اللَّهِ الَّذِي أَنْزَلَهُ فِي التَّوْرَاةِ حَيْثُ حَكَمُوا عَلَى الزَّانِي الْمُحْصَنِ بِالْجَلْدِ وَالتَّحْمِيمِ وَقَدْ أَنْزَلَ اللَّهُ الرَّجْمَ فِي التَّوْرَاةِ فَنَـزَلَتْ فِيهِمُ الآيَاتُ الْمَذْكُورَةُ، وَمَعْنَى الآيَاتِ أَنَّ مَنْ جَحَدَ حُكْمَ اللَّهِ أَوْ رَدَّهُ فَقَدْ كَفَرَ، وَلَيْسَ فِي الآيَةِ الأُولَى تَكْفِيرُ الْحَاكِمِ الْمُسْلِمِ لِمُجَرَّدِ أَنَّهُ حَكَمَ بِغَيْرِ الشَّرْعِ فَإِنَّ الْمُسْلِمَ الَّذِي يَحْكُمُ بِغَيْرِ الشَّرْعِ مِنْ غَيْرِ أَنْ يَجْحَدَ حُكْمَ الشَّرْعِ فِي قَلْبِهِ وَلا بِلِسَانِهِ وَإِنَّمَا يَحْكُمُ بِهَذِهِ الأَحْكَامِ الْعُرْفِيَّةِ الَّتِي تَعَارَفَهَا النَّاسُ فِيمَا بَيْنَهُمْ لِكَوْنِهَا مُوَافِقَةً لأِهْوَاءِ النَّاسِ مُتَدَاوَلَةً بَيْنَ الدُّوَلِ وَهُوَ غَيْرُ مُعْتَرِفٍ بِصِحَّتِهَا عَلَى الْحَقِيقَةِ وَلا مُعْتَقِدٌ لِذَلِكَ وَإِنَّمَا غَايَةُ مَا يَقُولُهُ إِنَّهُ حُكْمٌ بِالْقَانُونِ لا يَجُوزُ تَكْفِيرُهُ أَيِ اعْتِبَارُهُ خَارِجًا مِنَ الإِسْلامِ. وَقَدْ قَالَ ابْنُ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا فِي تَفْسِيرِ ءَايَةِ ﴿وَمَنْ لَّمْ يَحْكُمْ بِمَآ أَنْزَلَ اللَّهُ فَأُولَئِكَ هُمُ الْكَافِرُونَ﴾ [سُورَةَ الْمَائِدَة/44] لَيْسَ الَّذِي تَذْهَبُونَ إِلَيْهِ الْكُفْرَ الَّذِي يَنْقُلُ عَنِ الْمِلَّةِ بَلْ كُفْرٌ دُونَ كُفْرٍ اهـ أَيْ ذَنْبٌ كَبِيرٌ وَهَذَا الأَثَرُ عَنِ ابْنِ عَبَّاسٍ صَحِيحٌ ثَابِتٌ رَوَاهُ الْحَاكِمُ فِي الْمُسْتَدْرَكِ وَصَحَّحَهُ وَوَافَقَهُ عَلَى تَصْحِيحِهِ الذَّهَبِيُّ. وَهَذَا التَّفْسِيرُ لِلآيَةِ يُشْبِهُ تَفْسِيرَ الْحَدِيثِ الَّذِي رَوَاهُ الْبُخَارِيُّ أَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ عَنْ قِتَالِ الْمُسْلِمِ إِنَّهُ كُفْرٌ اهـ وَمِنْ عَقَائِدِ أَهْلِ السُّنَّةِ الْمُتَّفَقِ عَلَيْهَا أَنَّهُ لا يُكَفَّرُ مُسْلِمٌ بِذَنْبٍ إِنْ لَمْ يَسْتَحِلَّهُ وَإِنَّمَا يَكْفُرُ الَّذِي يَسْتَحِلُّهُ أَيْ عَلَى الْوَجْهِ الْمُقَرَّرِ عِنْدَ أَهْلِ الْعِلْمِ فَإِنَّ الْمَسْأَلَةَ يَدْخُلُهَا تَفْصِيلٌ فَإِنَّهُ إِنِ اسْتَحَلَّ مَعْصِيَةً مَعْلُومًا حُكْمُهَا مِنَ الدِّينِ بِالضَّرُورَةِ كَأَكْلِ لَحْمِ الْخِنْـزِيرِ وَالرِّشْوَةِ فَهُوَ كُفْرٌ أَيْ خُرُوجٌ مِنَ الإِسْلامِ وَإِنْ لَمْ يَكُنْ حُكْمُهَا مَعْلُومًا مِنَ الدِّينِ بِالضَّرُورَةِ لَمْ يَكْفُرْ مُسْتَحِلُّهَا إِلَّا أَنْ يَكُونَ إِسْتِحْلالُهُ مِنْ بَابِ رَدِّ النَّصِّ الشَّرْعِيِّ بِأَنْ عَلِمَ بِوُرُودِ الشَّرْعِ بِتَحْريِمِهَا فَعَانَدَ فَاسْتَحَلَّهَا لأِنَّ رَدَّ النُّصُوصِ كُفْرٌ كَمَا قَالَهُ النَّسَفِيُّ فِي عَقِيدَتِهِ الْمَشْهُورَةِ وَالْقَاضِي عِيَاضٌ وَالنَّوَوِيُّ وَغَيْرُهُمْ. فَإِذَا عُرِفَ ذَلِكَ عُلِمَ أَنَّ مَا يُوجَدُ فِي مُؤَلَّفَاتِ سَيِّدِ قُطْبٍ مِنْ تَكْفِيرِ مَنْ يَحْكُمُ بِغَيْرِ الشَّرْعِ تَكْفِيرًا مُطْلَقًا بِلا تَفْصِيلٍ لا يُوَافِقُ مَذْهَبًا مِنَ الْمَذَاهِبِ الإِسْلامِيَّةِ، وَإِنَّمَا هُوَ مِنْ رَأْيِ الْخَوَارِجِ الَّذِينَ قَاعِدَتُهُمْ تَكْفِيرُ مُرْتَكِبِ الْمَعْصِيَةِ، فَقَدْ ذَكَرَ الإِمَامُ أَبُو مَنْصُورٍ الْبَغْدَادِيُّ أَنَّ صِنْفًا مِنَ الطَّائِفَةِ الْبَيْهَسِيَّةِ مِنَ الْخَوَارِجِ كَانَتْ تُكَفِّرُ السُّلْطَانَ إِذَا حَكَمَ بِغَيْرِ الشَّرْعِ وَتُكَفِّرُ الرَّعَايَا مَنْ تَابَعَهُ وَمَنْ لَمْ يُتَابِعْهُ، ذَكَرَ ذَلِكَ فِي كِتَابِهِ تَفْسِيرُ الأَسْمَاءِ وَالصِّفَاتِ، فَلْيُعْلَمْ أَنَّ سَيِّدَ قُطْبٍ لَيْسَ لَهُ سَلَفٌ فِي ذَلِكَ إِلَّا الْخَوَارِجُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1047},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالنَّدْبُ وَالنِّيَاحَةُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1048},{"type":"p","text":"الشَّرْحُ مِنْ مُحَرَّمَاتِ اللِّسَانِ الَّتِي هِيَ مِنَ الْكَبَائِرِ النَّدْبُ وَالنِّيَاحَةُ فَالنَّدْبُ هُوَ ذِكْرُ مَحَاسِنِ الْمَيِّتِ بِرَفْعِ الصَّوْتِ كَوَاجَبَلاهُ وَوَاكَهْفَاهُ، وَأَمَّا النِّيَاحَةُ فَهِيَ الصِّيَاحُ عَلَى صُورَةِ الْجَزَعِ لِمُصِيبَةِ الْمَوْتِ فَتَحْرُمُ إِذَا كَانَتْ عَنِ اخْتِيَارٍ لا عَنْ غَلَبَةٍ. وَقَدْ رَوَى الْبَزَّارُ وَغَيْرُهُ مَرْفُوعًا «صَوْتَانِ مَلْعُونَانِ فِي الدُّنْيَا وَالآخِرَةِ مِزْمَارٌ عِنْدَ نِعْمَةٍ وَرَنَّةٌ عِنْدَ مُصِيبَةٍ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1049},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكُلُّ قَوْلٍ يَحُثُّ عَلَى مُحَرَّمٍ أَوْ يُفَتِّرُ عَنْ وَاجِبٍ وَكُلُّ كَلامٍ يَقْدَحُ فِي الدِّينِ أَوْ فِي أَحَدٍ مِنَ الأَنْبِيَاءِ أَوْ فِي الْعُلَمَاءِ أَوِ الْقُرْءَانِ أَوْ فِي شَىْءٍ مِنْ شَعَائِرِ اللَّهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1050},{"type":"p","text":"الشَّرْحُ كُلُّ كَلامٍ يُشَجِّعُ النَّاسَ عَلَى فِعْلِ الْمُحَرَّمَاتِ أَوْ يُثَبِّطُ هِمَمَهُمْ عَنْ فِعْلِ الْوَاجِبَاتِ كَأَنْ يَقُولَ لِمُسْلِمٍ اقْعُدْ مَعَنَا الآنَ وَلا تُصَلِّ فَإِنَّكَ تَقْضِي الصَّلاةَ فِيمَا بَعْدُ فَهُوَ مُحَرَّمٌ. وَكُلُّ كَلامٍ يَقْدَحُ فِي الدِّينِ أَيْ يُنَقِّصُ الدِّينَ أَوْ فِي أَحَدٍ مِنَ الأَنْبِيَاءِ أَوْ فِي جَمِيعِ الْعُلَمَاءِ أَوِ الْقُرْءَانِ أَوْ شَىْءٍ مِنْ شَعَائِرِ اللَّهِ كَالصَّلاةِ وَالزَّكَاةِ وَالأَذَانِ وَالْوُضُوءِ وَنَحْوِ ذَلِكَ فَهُوَ كُفْرٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1051},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْهَا التَّزْمِيرُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1052},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي اللِّسَانِ التَّزْمِيرَ وَهُوَ النَّفْخُ بِالْمِزْمَارِ وَهُوَ أَنْوَاعٌ مِنْهَا قَصَبَةٌ ضَيِّقَةُ الرَّأْسِ مُتَّسِعَةُ الآخِرِ يُزْمَرُ بِهَا فِي الْمَوَاكِبِ وَالْحُرُوبِ عَلَى وَجْهٍ مُطْرِبٍ، وَمِنْهَا مَا هِيَ قَصَبَةٌ مِثْلُ الأُولَى يُجْعَلُ فِي أَسْفَلِهَا قِطْعَةُ نُحَاسٍ مُعْوَجَّةٌ يُزْمَرُ بِهَا فِي أَعْرَاسِ الْبَوَادِي. وَتَحْرِيمُ ذَلِكَ كَسَائِرِ ءَالاتِ اللَّهْوِ الْمُطْرِبَةِ بِمُفْرَدِهَا هُوَ مَا عَلَيْهِ الْجُمْهُورُ وَلا يُلْتَفَتُ إِلَى الْقَوْلِ الشَّاذِّ الَّذِي قَالَ بِهِ بَعْضُ الشَّافِعِيَّةِ وَالْحَنَفِيَّةِ لَكِنْ لا يُكَفَّرُ مُسْتَحِلُّ ذَلِكَ إِلاَّ أَنْ يَعْتَقِدَ أَنَّ الرَّسُولَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَرَّمَ ذَلِكَ وَمَعَ ذَلِكَ يَقُولُ عَنْهُ إِنَّهُ حَلالٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1053},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالسُّكُوتُ عَنِ الأَمْرِ بالْمَعْرُوفِ وَالنَّهْيِ عَنِ الْمُنْكَرِ بغَيْرِ عُذْرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1054},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ السُّكُوتُ عَنِ الأَمْرِ بِالْمَعْرُوفِ وَعَنِ النَّهْيِ عَنِ الْمُنْكَرِ بِلا عُذْرٍ شَرْعِيٍّ بِأَنْ كَانَ قَادِرًا ءَامِنًا عَلَى نَفْسِهِ وَنَحْوِ مَالِهِ قَالَ اللَّهُ تَعَالَى ﴿لُعِنَ الَّذِينَ كَفَرُوا مِنْ بَنِي إِسْرَائِيلَ عَلَى لِسَانِ دَاوُدَ وَعِيسَى ٱبْنِ مَرْيَمَ ذَلِكَ بِمَا عَصَوْا وَّكَانُوا يَعْتَدُونَ كَانُوا لا يَتَنَاهَوْنَ عَنْ مُّنكَرٍ فَعَلُوهُ لَبِئْسَ مَا كَانُوا يَفْعَلُونَ﴾ [سُورَةَ الْمَائِدَة].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1055},{"type":"p","text":"وَقَدْ شَرَطَ الْفُقَهَاءُ لِجَوَازِ إِنْكَارِ الْمُنْكَرِ أَيِ الْمُحَرَّمَاتِ عَلَى فَاعِلِهَا كَوْنَ ذَلِكَ الْمُنْكَرِ مُحَرَّمًا بِالإِجْمَاعِ فَلا يُنْكَرُ الْمُخْتَلَفُ فِيهِ بَيْنَهُمْ إِلَّا عَلَى مَنْ يَرَى حُرْمَتَهُ وَكَوْنَهُ لا يُؤَدِّي إِلَى مَفْسَدَةٍ أَعْظَمَ فَإِنْ أَدَّى الإِنْكَارُ إِلَى ذَلِكَ حَرُمَ. لَكِنْ لا مَانِعَ مِنْ أَنْ يُرْشَدَ الشَّخْصُ إِذَا أَخَذَ بِرُخْصَةٍ فِي مَذْهَبٍ يُرَخِّصُ لَهُ مَا هُوَ مُحَرَّمٌ فِي مَذْهَبِهِ إِلَى الأَخْذِ بِالِاحْتِيَاطِ مِنْ دُونِ إِنْكَارٍ عَلَيْهِ فَيُقَالُ لَهُ لَوْ فَعَلْتَ كَذَا كَانَ أَحْسَنَ، كَمَا إِذَا رَأَى رَجُلًا يَقْتَصِرُ عَلَى سَتْرِ الْعَوْرَةِ الْمُغَلَّظَةِ وَهُوَ لا يَرَى كَشْفَ الْفَخِذِ حَرَامًا لِأَنَّهُ يُقَلِّدُ إِمَامًا يُجِيزُ ذَلِكَ فَيَجُوزُ أَنْ يُقَالَ لِهَذَا لَوْ جَعَلْتَ سُتْرَتَكَ شَامِلَةً لِمَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ أَوْ أَزْيَدَ. وَتَرْكُ الإِنْكَارِ فِي مَا اخْتَلَفَ فِي تَحْريِمِهِ الأَئِمَّةُ ذَكَرَهُ بَعْضُ الشَّافِعِيَّةِ وَالْمَالِكِيَّةِ كَابْنِ حَجَرٍ الشَّافِعِيِّ وَعِزِّ الدِّينِ الْمَالِكِيِّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1056},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَتْمُ الْعِلْمِ الْوَاجِبِ مَعَ وُجُودِ الطَّالِبِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1057},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي اللِّسَانِ الَّتِي هِيَ مِنَ الْكَبَائِرِ كَتْمُ الْعِلْمِ الْوَاجِبِ مَعَ وُجُودِ الطَّالِبِ قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الَّذِينَ يَكْتُمُونَ مَآ أَنْزَلْنَا مِنَ الْبَيِّنَاتِ وَالْهُدَى مِنْ بَعْدِ مَا بَيَّنَّاهُ لِلنَّاسِ فِي الْكِتَابِ أُولَئِكَ يَلْعَنُهُمُ اللَّهُ وَيَلْعَنُهُمُ اللَّاعِنُونَ﴾ [سُورَةَ الْبَقَرَة/159]. وَرَوَى ابْنُ مَاجَهْ وَالْحَاكِمُ وَابْنُ حِبَّانَ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ قَالَ «مَنْ سُئِلَ عَنْ عِلْمٍ فَكَتَمَهُ أُلْجِمَ يَوْمَ الْقِيَامَةِ بِلِجَامٍ مِنْ نَارٍ» وَاللِّجَامُ الْمَذْكُورُ فِي الْحَدِيثِ هُوَ مِثْلُ الَّذِي يُوضَعُ فِي فَمِ الْفَرَسِ لَكِنَّهُ مِنْ نَارٍ، فَتَعْلِيمُ الْعِلْمِ يَكُونُ فِي حَالٍ فَرْضَ كِفَايَةٍ وَفِي حَالٍ فَرْضَ عَيْنٍ وَالأَوَّلُ مَحَلُّهُ كَمَا إِذَا كَانَ يُوجَدُ أَكْثَرُ مِنْ وَاحِدٍ مِمَّنْ تَأَهَّلَ لِذَلِكَ وَتَحْصُلُ بِكُلٍّ مِنْهُمُ الْكِفَايَةُ وَالثَّانِي كَمَا إِذَا لَمْ يَكُنْ هُنَاكَ غَيْرُ شَخْصٍ وَاحِدٍ أَهْلٍ فَلا يَجُوزُ فِي هَذِهِ الْحَالِ أَنْ يُحِيلَ الْمُفْتِي الأَهْلُ أَوِ الْعَالِمُ الَّذِي هُوَ أَهْلٌ طَالِبَ الْعِلْمِ إِلَى غَيْرِهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1058},{"type":"p","text":"قَالَ الْعُلَمَاءُ مَنْ تَعَلَّمَ عِلْمَ الدِّينِ الضَّرُورِيَّ ثُمَّ نَسِيَ بَعْضَهُ يَجِبُ عَلَيْهِ اسْتِعَادَةُ مَا نَسِيَ. وَقَالُوا يَجِبُ وُجُودُ عَالِمٍ يَصْلُحُ لِلْفَتْوَى فِي كُلِّ مَسَافَةِ قَصْرٍ وَقَاضٍ فِي كُلِّ مَسَافَةِ عَدْوَى أَيْ نِصْفِ مَرْحَلَةٍ. وَذَكَرَ الْغَزَالِيُّ أَنَّهُ يَجِبُ وُجُودُ عَالِمٍ يَقُومُ بِالرَّدِّ عَلَى الْمُلْحِدِينَ وَالْمُشَكِّكِينَ فِي الْعَقِيدَةِ بِإِيرَادِ الشُّبَهِ فِي كُلِّ بَلَدٍ أَيْ بِحَيْثُ يَكُونُ ذَلِكَ الْعَالِمُ عَارِفًا بِالْحُجَجِ النَّقْلِيَّةِ وَالْعَقْلِيَّةِ، وَذَلِكَ هُوَ عِلْمُ الْكَلامِ الَّذِي عُرِفَ بِهِ أَهْلُ السُّنَّةِ لَيْسَ عِلْمَ الْكَلامِ الَّذِي عِنْدَ الْمُبْتَدِعَةِ كَالْمُعْتَزِلَةِ لِأَنَّهُمْ أَلَّفُوا كُتُبًا عَدِيدَةً أَوْرَدُوا فِيهَا شُبُهًا عَقْلِيَّةً وَتَمْوِيهَاتٍ بِالنُّصُوصِ الشَّرْعِيَّةِ لِيَغُرُّوا بِهَا الْقَاصِرِينَ فِي الْفَهْمِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1059},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالضَّحِكُ لِخُرُوجِ الرِّيحِ أَوْ عَلَى مُسْلِمٍ اسْتِحْقَارًا لَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1060},{"type":"p","text":"الشَّرْحُ مِنْ مُحَرَّمَاتِ اللِّسَانِ الضَّحِكُ لِخُرُوجِ رِيحٍ مِنْ شَخْصٍ أَيْ إِذَا لَمْ يَكُنِ الضَّاحِكُ مَغلُوبًا. وَكَذَلِكَ الضَّحِكُ لِغَيْرِ ذَلِكَ اسْتِحْقَارًا لِمَا فِيهِ مِنَ الإِيذَاءِ. وَمِثْلُ الْمُسْلِمِ فِي هَذِهِ الْمَسْئَلَةِ الذِّمِيُّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1061},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَتْمُ الشَّهَادَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1062},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ جُمْلَةِ مَعَاصِي اللِّسَانِ الَّتِي هِيَ مِنَ الْكَبَائِرِ كَتْمَ الشَّهَادَةِ بِلا عُذْرٍ. قَالَ الْجَلالُ الْبُلْقِينِيُّ إِنَّ ذَلِكَ مُقَيَّدٌ بِمَا إِذَا دُعِيَ إِلَى الشَّهَادَةِ اﻫ وَمُرَادُهُ فِي غَيْرِ شَهَادَةِ الْحِسْبَةِ فَإِنَّ شَهَادَةَ الْحِسْبَةِ لا تَتَقَيَّدُ بِالطَّلَبِ كَمَا لَوْ عَلِمَ اثْنَانِ ثِقَتَانِ بِأَنَّ فُلانًا طَلَّقَ امْرَأَتَهُ طَلاقًا يَمْنَعُ مُعَاشَرَتَهَا بِأَنْ يَكُونَ طَلاقًا بِائِنًا بِالثَّلاثِ أَوْ بِانْتِهَاءِ الْعِدَّةِ قَبْلَ الرَّجْعَةِ وَيُرِيدُ أَنْ يَعُودَ إِلَى مُعَاشَرَتِهَا بِغَيْرِ طَرِيقٍ شَرْعِيٍّ وَجَبَ عَلَيْهِمَا أَنْ يَشْهَدَا عِنْدَ الْحَاكِمِ وَلَوْ مِنْ غَيْرِ طَلَبٍ مِنْهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1063},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَرْكُ رَدِّ السَّلامِ الْوَاجِبِ عَلَيْكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1064},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي اللِّسَانِ تَرْكَ رَدِّ السَّلامِ الْوَاجِبِ رَدُّهُ وُجُوبًا عَيْنِيًّا بِأَنْ صَدَرَ ابْتِدَاؤُهُ مِنْ مُسْلِمٍ مُكَلَّفٍ عَلَى مُسْلِمٍ مُعَيَّنٍ أَوْ وُجُوبًا كِفَائِيًّا بِأَنْ صَدَرَ مِنْهُ عَلَى جَمَاعَةٍ مُكَلَّفِينَ أَيْ مَعَ اتِّحَادِ الْجِنْسِ لِقَوْلِهِ تَعَالَى ﴿وَإِذَا حُيِّيتُمْ بِتَحِيَّةٍ فَحَيُّوا بِأَحْسَنَ مِنْهَا أَوْ رُدُّوهَا﴾ [سُورَةَ النِّسَاءِ/86] أَمَّا إِذَا اخْتَلَفَ الْجِنْسُ بِأَنْ سَلَّمَتْ شَابَّةٌ عَلَى أَجْنَبِيٍّ لَمْ يَجِبِ الرَّدُّ فَيَبْقَى الْجَوَازُ إِنْ لَمْ تُخْشَ فِتْنَةٌ وَكَذَلِكَ الْعَكْسُ. وَأَمَّا السَّلامُ الْمَكْرُوهُ كَالسَّلامِ عَلَى قَاضِي الْحَاجَةِ فِي حَالِ خُرُوجِ الْخَبَثِ أَوِ الآكِلِ الَّذِي فِي فَمِهِ اللُّقْمَةُ وَنَحْوِ ذَلِكَ فَلا يَجِبُ رَدُّهُ، وَكَذَلِكَ لا يَجِبُ الرَّدُّ عَلَى الْبِدْعِيِّ الْمُخَالِفِ فِي الِاعْتِقَادِ مِمَّنْ لا تَبْلُغُ بِدْعَتُهُ إِلَى الْكُفْرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1065},{"type":"p","text":"تَنْبِيهٌ قَالَ الْحَلِيمِيُّ فِي مَسْئَلَةِ السَّلامِ عَلَى الأَجْنَبِيَّةِ كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِلْعِصْمَةِ مَأْمُونًا مِنَ الْفِتْنَةِ فَمَنْ وَثِقَ مِنْ نَفْسِهِ بِالسَّلامَةِ فَلْيُسَلِّمْ وَإِلَّا فَالصَّمْتُ أَسْلَمُ اﻫ فَتَبَيَّنَ مِنْ ذَلِكَ حُكْمُ جَوَازِ تَسْلِيمِ الْمَرْأَةِ الأَجْنَبِيَّةِ عَلَى الرَّجُلِ وَالْعَكْسِ خِلافَ مَا قَالَ بَعْضُ الْمُتَأَخِّرِينَ مِنَ الشَّافِعِيَّةِ مِمَّنْ لَيْسُوا مِنْ أَصْحَابِ الْوُجُوهِ بَلْ مَبْلَغُهُمْ فِي الْمَذْهَبِ أَنَّهُمْ مِنَ النَّقَلَةِ فَقَطْ، وَهَذِهِ الطَّبَقَةُ لا يَثْبُتُ الْمَذْهَبُ بِكَلامِهَا إِنَّمَا يَثْبُتُ الْمَذْهَبُ بِنَصِّ الإِمَامِ الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ ثُمَّ بِالْوُجُوهِ الَّتِي يَسْتَخْرِجُهَا أَصْحَابُ الْوُجُوهِ كَالْحَلِيمِيِّ. وَأَمَّا قَوْلُ عَمْرِو بنِ حُرَيْثٍ «لا تُسَلِّمُ النِّسَاءُ عَلَى الرِّجَالِ» فَلَيْسَ فِيهِ التَّحْرِيمُ الَّذِي قَالَهُ بَعْضُ الْمُتَأَخِّرِينَ إِنَّمَا غَايَةُ مَا فِيهِ الْكَرَاهَةُ التَّنْـزِيهِيَّةُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1066},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَحْرُمُ الْقُبْلَةُ لِلْحَاجِّ وَالْمُعْتَمِرِ بِشَهْوَةٍ وَلِصَائِمٍ فَرْضًا إِنْ خَشِيَ الإِنْزَالَ، وَمَنْ لا تَحِلُّ قُبْلَتُهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1067},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي اللِّسَانِ الْقُبْلَةَ بِشَهْوةٍ إِذَا كَانَتْ مِنَ الْمُحْرِمِ بِالنُّسُكِ، وَكَذَلِكَ الصَّائِمُ صَوْمَ فَرْضٍ بِأَنْ كَانَ مِنْ رَمَضَانَ أَوْ نَذْرًا أَوْ كَفَّارَةً أَوْ نَحْوَ ذَلِكَ إِنْ خَشِيَ الإِنْزَالَ وَقِيلَ يُكْرَهُ بِخِلافِ النَّفْلِ فَإِنَّهُ يَجُوزُ قَطْعُهُ وَلا يَبْطُلُ صَوْمُ الْفَرْضِ بِهَا إِنْ لَمْ يُنْزِلْ. وَمِنْ مَعَاصِيهِ أَيْضًا قُبْلَةُ مَنْ لا تَحِلُّ قُبْلَتُهُ كَالأَجْنَبِيَّةِ وَهِيَ فِي عُرْفِ الْفُقَهَاءِ مَنْ سِوَى مَحَارِمِهِ وَزَوْجَتِهِ وَأَمَتِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1068},{"type":"blank","text":""},{"type":"blank","text":""}]},{"id":"ear-sins","title":"مَعَاصِي الأُذُنِ","description":"الفصل المخصص لبيان معاصي الأذن.","icon":"fa-ear-listen","start":1071,"end":1077,"paragraphCount":6,"wordCount":213,"readMinutes":2,"blocks":[{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1071},{"type":"p","text":"الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مَعَاصِي الأُذُنِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1072},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ مَعَاصِي الأُذُنِ الِاسْتِمَاعُ إِلَى كَلامِ قَوْمٍ أَخْفَوْهُ عَنْهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1073},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الأُذُنِ الِاسْتِمَاعَ إِلَى كَلامِ قَوْمٍ عَلِمَ أَنَّهُمْ يَكْرَهُونَ اطِّلاعَهُ عَلَيْهِ وَهُوَ مِنَ الْكَبَائِرِ وَنَوْعٌ مِنَ التَّجَسُّسِ الْمُحَرَّمِ. وَقَدْ صَحَّ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «مَنِ اسْتَمَعَ إِلَى حَدِيثِ قَوْمٍ وَهُمْ لَهُ كَارِهُونَ صُبَّ فِي أُذُنَيْهِ الآنُكُ يَوْمَ الْقِيَامَةِ» رَوَاهُ الْبُخَارِيُّ، وَالآنُكُ بِمَدِّ الأَلِفِ وَضَمِّ النُّونِ الرَّصَاصُ الْمُذَابُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1074},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِلَى الْمِزْمَارِ وَالطُّنْبُورِ وَهُوَ ءَالَةٌ تُشْبِهُ الْعُودَ وَسَائِرِ الأَصْوَاتِ الْمُحَرَّمَةِ. وَكَالِاسْتِمَاعِ إِلَى الْغِيبَةِ وَالنَّمِيمَةِ وَنَحْوِهِمَا بِخِلافِ مَا إِذَا دَخَلَ عَلَيْهِ ثُمَّ إِنْ عَادَ خَامِسًا عُزِّرَ كَمَا لَوْ كَانَ سَاقِطَ الأَطْرَافِ أَوَّلًا وَلا يُقْتَلُ. وَيُغْمَسُ مَحَلُّ الْقَطْعِ فِي الزَّيْتِ الْمُغْلَى لِتَنْسَدَّ أَفْوَاهُ الْعُرُوقِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1082},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْهَا النَّهْبُ وَالْغَصْبُ وَالْمَكْسُ وَالْغُلُولُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1083},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدَيْنِ النَّهْبَ وَهُوَ أَخْذُ الْمَالِ جِهَارًا وَالْغَصْبَ وَهُوَ الِاسْتِيلاءُ عَلَى حَقِّ الْغَيْرِ ظُلْمًا وَهُمَا مِنَ الْكَبَائِرِ لِقَوْلِهِ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «مَنْ ظَلَمَ قِيدَ شِبْرٍ مِنْ أَرْضٍ طُوِّقَهُ مِنْ سَبْعِ أَرَضِينَ يَوْمَ الْقِيَامَةِ» أَيْ أَنَّ الأَرْضَ تُخْسَفُ بِهِ يَوْمَ الْقِيَامَةِ فَتَكُونُ تِلْكَ الْبُقْعَةُ فِي عُنُقِهِ كَالطَّوْقِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1084},{"type":"p","text":"وَأَمَّا الْمَكْسُ فَهُوَ مَا يُؤْخَذُ مِنَ التُّجَّارِ كَالْعُشْرِ وَمَا أَشْبَهَ ذَلِكَ وَهُوَ مِنَ الْكَبَائِرِ وَقَدْ مَرَّ الْكَلامُ عَلَيْهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1085},{"type":"p","text":"وَأَمَّا الْغُلُولُ فَهُوَ الأَخْذُ مِنَ الْغَنِيمَةِ قَبْلَ الْقِسْمَةِ الشَّرْعِيَّةِ وَهُوَ مِنَ الْكَبَائِرِ. قَالَ رَسُولُ اللَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي رَجُلٍ كَانَ عَلَى ثَقَلِهِ فِي غَزْوَةٍ مَاتَ وَقَدْ غَلَّ «إِنَّهُ فِي النَّارِ» رَوَاهُ الْبُخَارِيُّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1086},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْقَتْلُ وَفِيهِ الْكَفَّارَةُ مُطْلقًا وَهِيَ عِتْقُ رَقَبَةٍ مُؤْمِنَةٍ سَلِيمَةٍ فَإِنْ عَجَزَ صَامَ شَهْرَيْنِ مُتَتَابِعَيْنِ وَفِي عَمْدِهِ الْقِصَاصُ إِلَّا أَنْ عَفَا عَنْهُ الْوَارِثُ عَلَى الدِّيَةِ أَوْ مَجَّانًا، وَفِي الْخَطَإِ وَشِبْهِهِ الدِّيَةُ وَهِيَ مِائَةٌ مِنَ الإِبِلِ فِي الذَّكَرِ الْحُرِّ الْمُسْلِمِ وَنِصْفُهَا فِي الأُنْثَى الْحُرَّةِ الْمُسْلِمَةِ، وَتَخْتَلِفُ صِفَاتُ الدِّيَةِ بِحَسَبِ الْقَتْلِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1087},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدَيْنِ قَتْلَ الْمُسْلِمِ عَمْدًا أَوْ شِبْهَ عَمْدٍ. قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الْحَدِيثِ الَّذِي فِيهِ بَيَانُ السَّبْعِ الْمُوبِقَاتِ «وَقَتْلُ النَّفْسِ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ» أَخْرَجَهُ الْبُخَارِيُّ فِي الصَّحِيحِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1088},{"type":"p","text":"وَالْقَتْلُ ظُلْمًا هُوَ أَعْظَمُ الذُّنُوبِ بَعْدَ الْكُفْرِ كَمَا ثَبَتَ فِي حَدِيثِ الْبُخَارِيِّ وَغَيْرِهِ. وَأَمَّا قَوْلُ اللَّهِ تَعَالَى ﴿وَالْفِتْنَةُ أَشَدُّ مِنَ الْقَتْلِ﴾ [سُورَةَ الْبَقَرَة/191] فَالْمُرَادُ بِهِ أَنَّ الْكُفْرَ أَشَدُّ مِنَ الْقَتْلِ كَمَا تَقَدَّمَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1089},{"type":"p","text":"ثُمَّ مِنْ أَحْكَامِ الْقَتْلِ فِي الدُّنْيَا وُجُوبُ الْكَفَّارَةِ فِي قَتْلِ الْعَمْدِ وَغَيْرِهِ وَهِيَ عِتْقُ رَقَبَةٍ مُؤْمِنَةٍ سَلِيمَةٍ عَمَّا يُخِلُّ بِالْكَسْبِ وَالْعَمَلِ إِخْلالًا ظَاهِرًا، فَإِنْ عَجَزَ بِأَنْ لَمْ يَمْلِكْهَا وَلا ثَمَنَهَا فَاضِلًا عَنْ كِفَايَتِهِ وَكِفَايَةِ مَنْ عَلَيْهِ نَفَقَتُهُ صَامَ شَهْرَيْنِ مُتَتَابِعَيْنِ كَمَا مَرَّ فِي الظِّهَارِ غَيْرَ أَنَّهُ لا إِطْعَامَ هُنَا. وَفِي قَتْلِ الْعَمْدِ وَهُوَ مَا كَانَ بِقَصْدِ عَيْنِ مَنْ وَقَعَتْ عَلَيْهِ الْجِنَايَةُ بِمَا يُتْلِفُ غَالِبًا جَارِحًا كَانَ كَالسَّيْفِ وَالْخِنْجَرِ أَوْ مُثَقَّلًا كَالصَّخْرَةِ الْقِصَاصُ إِلَّا إِذَا عُفِيَ عَنِ الْقَاتِلِ عَلَى الدِّيَةِ أَوْ مَجَّانًا فَإِذَا عَفَا وَرَثَةُ الْقَتِيلِ عَنِ الْقَاتِلِ عَلَى الدِّيَةِ أَوْ عَلَى مَالٍ غَيْرِهَا أَوْ مَجَّانًا سَقَطَ الْقَتْلُ. وَأَمَّا الْقَتْلُ الْخَطَأُ بِأَنْ لا يَقْصِدَ عَيْنَهُ بِفِعْلٍ كَأَنْ زَلِقَ وَوَقَعَ عَلَيْهِ فَمَاتَ وَشِبْهُهُ بِأَنْ يَقْصِدَهُ بِمَا لا يُتْلِفُ فِي الْغَالِبِ كَغَرْزِهِ بِإِبْرَةٍ فِي غَيْرِ مَقْتَلٍ فَتَجِبُ الدِّيَةُ فِيهِمَا لا الْقِصَاصُ وَهِيَ مِائَةٌ مِنَ الإِبِلِ فِي الذَّكَرِ الْحُرِّ الْمَعْصُومِ الْمُسْلِمِ وَنِصْفُهَا فِي الأُنْثَى الْحُرَّةِ الْمُسْلِمَةِ الْمَعْصُومَةِ وَمِثْلُهَا الْخُنْثَى.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1090},{"type":"benefit","text":"فَائِدَةٌ يَثْبُتُ الْقِصَاصُ أَيْضًا فِي الأَطْرَافِ وَالْجِرَاحَاتِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1091},{"type":"p","text":"تِتِمَّةٌ مِنَ الْمُحَرَّمَاتِ الْكَبَائِرِ قَتْلُ الإِنْسَانِ نَفْسَهُ فَقَدْ رَوَى الْبُخَارِيُّ «مَنْ قَتَلَ نَفْسَهُ بِشَىْءٍ عُذِّبَ بِهِ فِي جَهَنَّمَ» لَكِنْ لا يَكْفُرُ قَاتِلُ نَفْسِهِ كَمَا أَنَّهُ لا يَكْفُرُ قَاتِلُ نَفْسِ غَيْرِهِ، وَأَمَّا قَوْلُ الْجُهَّالِ فِيمَنْ قَتَلَ نَفْسَهُ إِنَّهُ كَافِرٌ فَهُوَ بَاطِلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1092},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْهَا الضَّرْبُ بِغَيْرِ حَقٍّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1093},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ الَّتِي هِيَ مِنَ الْكَبَائِرِ ضَرْبَ الْمُسْلِمِ بِغَيْرِ حَقٍّ فَفِي الْحَدِيثِ الصَّحِيحِ «إِنَّ اللَّهَ يُعَذِّبُ الَّذِينَ يُعَذِّبُونَ النَّاسَ فِي الدُّنْيَا» وَمِثْلُ الضَّرْبِ تَرْوِيعُ الْمُسْلِمِ وَالإِشَارَةُ إِلَيْهِ بِنَحْوِ سِلاحٍ فَفِي الصَّحِيحِ «مَنْ أَشَارَ إِلَى أَخِيهِ بِحَدِيدَةٍ فَإِنَّ الْمَلائِكَةَ تَلْعَنُهُ وَإِنْ كَانَ أَخَاهُ لِأَبِيهِ وَأُمِّهِ» رَوَاهُ ابْنُ حِبَّانَ. هَذَا إِنْ قَصَدَ تَرْوِيعَهُ أَمَّا إِنْ لَمْ يَقْصِدْ تَرْوِيعَهُ وَظَنَّ أَنَّهُ لا يَتَرَوَّعُ فَرَفَعَ عَلَيْهِ نَحْوَ حَدِيدَةٍ فَلا إِثْمَ عَلَيْهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1094},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَخْذُ الرِّشْوَةِ وَإِعْطَاؤُهَا. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1095},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ الَّتِي هِيَ مِنَ الْكَبَائِرِ أَخْذَ الرِّشْوَةِ وَإِعْطَاءَهَا، فَأَمَّا الأَخْذُ فَيَحْرُمُ عَلَى الْحَاكِمِ وَلَوْ حَكَمَ بِحَقٍّ وَأَمَّا الإِعْطَاءُ فَإِنَّمَا يَحْرُمُ عَلَى الْمُعْطِي إِنْ كَانَ يَطْلُبُ بَاطِلًا فَأَمَّا إِذَا كَانَ الإِعْطَاءُ لِيَحْكُمَ لَهُ الْحَاكِمُ بِحَقٍّ أَوْ لِيَدْفَعَ عَنْ نَفْسِهِ ظُلْمًا أَوْ لِيَنَالَ مَا يَسْتَحِقُّهُ فَسَقَ الآخِذُ وَلَمْ يَأْثَمِ الْمُعْطِي لِاضْطِرَارِهِ إِلَى ذَلِكَ لِلتَّوَصُّلِ لِحَقِّهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1096},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِحْرَاقُ الْحَيَوَانِ إِلَّا إِذَا ءَاذَى وَتَعَيَّنَ طَرِيقًا فِي الدَّفْعِ وَالْمُثْلَةُ بِالْحَيَوَانِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1097},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ الَّتِي هِيَ مِنَ الْكَبَائِرِ إِحْرَاقَ الْحَيَوَانِ بِالنَّارِ سَوَاءٌ كَانَ مَأْكُولًا أَوْ غَيْرَ مَأْكُولٍ صَغِيرًا أَوْ غَيْرَهُ لِقَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا يُعَذِّبُ بِالنَّارِ إِلَّا رَبُّهَا» رَوَاهُ أَبُو دَاوُدَ وَهَذَا إِذَا لَمْ يَكُنِ الْحَيَوَانُ مُؤْذِيًا أَمَّا إِذَا ءَاذَى وَتَعَيَّنَ الإِحْرَاقُ طَرِيقًا لإِزَالَةِ الضَّرَرِ فَلا حُرْمَةَ فِي ذَلِكَ. وَكَذَلِكَ مِنْ مَعَاصِي الْيَدِ الْمُثْلَةُ بِالْحَيَوَانِ، وَمَعْنَى الْمُثْلَةِ تَقْطِيعُ الأَجْزَاءِ وَتَغْيِيرُ الْخِلْقَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1098},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَاللَّعِبُ بِالنَّرْدِ وَكُلِّ مَا فِيهِ قِمَارٌ حَتَّى لَعِبُ الصِّبْيَانِ بِالْجَوْزِ وَالْكِعَابِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1099},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مُحَرَّمَاتِ الْيَدِ اللَّعِبَ بِالنَّرْدِ وَهُوَ الْمُسَمَّى بِالنَّرْدَشِيرِ وَهُوَ نِسْبَةٌ لِأَوَّلِ مُلُوكِ الْفُرْسِ لِأَنَّهُ أَوَّلُ مَنْ وُضِعَ لَهُ. قَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «مَنْ لَعِبَ بِالنَّرْدَشِيرِ فَكَأَنَّمَا غَمَسَ يَدَهُ فِي لَحْمِ خِنْـزِيرٍ وَدَمِهِ» رَوَاهُ مُسْلِمٌ. وَالْمَعْنَى فِي تَحْريِمِهِ أَنَّ فِيهِ حَزْرًا وَتَخْمِينًا فَيُؤَدِّي لِلتَّخَاصُمِ وَالْفِتَنِ الَّتِي لا غَايَةَ لَهَا فَفُطِمَ النَّاسُ عَنْهُ حِذَارًا مِنَ الشُّرورِ الْمُتَرَتِّبَةِ عَلَيْهِ. وَيُقَاسُ عَلَى النَّرْدِ كُلُّ مَا كَانَ مِثْلَهُ أَيْ أَنَّ كُلَّ لُعْبَةٍ كَانَ الِاعْتِمَادُ فِي لَعِبِهَا عَلَى الْحَزْرِ وَالتَّخْمِينِ لا عَلَى الْفِكْرِ وَالْحِسَابِ فَهِيَ حَرَامٌ فَخَرَجَ الشَّطْرَنْجُ فَإِنَّهُ لَيْسَ فِي مَعْنَاهُ لِأَنَّ الْعُمْدَةَ فِيهِ عَلَى الْفِكْرِ وَالْحِسَابِ قَبْلَ النَّقْلِ. وَيَلْتَحِقُ بِالنَّرْدِ فِي الْحُكْمِ اللَّعِبُ بِالأَوْرَاقِ الْمُزَوَّقَةِ الْمُسَمَّاةِ بِالْكَنْجَفَةِ أَوِ الْكَمَنْجَفَةِ وَهِيَ الْمَعْرُوفَةُ عِنْدَ بَعْضِ النَّاسِ الْيَوْمَ فِي بَعْضِ الْبِلادِ بِوَرَقِ الشَّدَّةِ فَإِنَّهَا إِنْ كَانَتْ بِعِوَضٍ فَقِمَارٌ وَالْقِمَارُ مِنَ الْكَبَائِرِ وَإِلَّا فَهِيَ كَالنَّرْدِ الَّذِي وَرَدَ النَّهْيُ عَنْهُ بِوَجْهِ الإِطْلاقِ مِنْ غَيْرِ تَعَرُّضٍ لِلْمَالِ. وَكَذَلِكَ يَحْرُمُ اللَّعِبُ بِكُلِّ مَا فِيهِ قِمَارٌ وَصُورَتُهُ الْمُجْمَعُ عَلَيْهَا أَنْ يُخْرَجَ الْعِوَضُ مِنَ الْجَانِبَيْنِ كَمَا يَحْصُلُ فِي اللَّعِبِ بِالْجَوْزِ وَالْكِعَابِ فَيَحْرُمُ عَلَى الأَوْلِيَاءِ تَمْكِينُ الصِّبْيَانِ مِنَ اللَّعِبِ بِذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1100},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَاللَّعِبُ بِآلاتِ اللَّهْوِ الْمُحَرَّمَةِ كَالطُّنْبُورِ وَالرَّبَابِ وَالْمِزْمَارِ وَالأَوْتَارِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1101},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ اللَّعِبَ بِآلاتِ اللَّهْوِ الْمُحَرَّمَةِ وَقَدْ ذَكَرَ الْمُصَنِّفُ مِنْهَا الطُّنْبُورَ وَالْمِزْمَارَ وَقَدْ مَرَّ الْكَلامُ عَلَيْهِمَا. وَمِثْلُهُمَا فِي حُرْمَةِ اللَّعِبِ بِهِ كُلُّ ذِي وَتَرٍ كَالرَّبَابِ وَالْكَمَنْجَّةِ وَغَيْرِهِمَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1102},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلَمْسُ الأَجْنَبِيَّةِ عَمْدًا بِغَيْرِ حَائِلٍ أَوْ بِهِ بِشَهْوَةٍ وَلَوْ مَعَ جِنْسٍ أَوْ مَحْرَمِيَّةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1103},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ لَمْسَ الأَجْنَبِيَّةِ أَيْ غَيْرِ الْمَحْرَمِ وَغَيْرِ الزَّوْجَةِ وَنَحْوِهَا عَمْدًا بِغَيْرِ حَائِلٍ مُطْلَقًا أَيْ بِشَهْوَةٍ كَانَ أَوْ بِغَيْرِ شَهْوَةٍ وَكَذَا لَوِ اتَّحَدَ الْجِنْسُ وَكَانَ بِشَهْوَةٍ كَرَجُلٍ مَعَ مِثْلِهِ وَامْرَأَةٍ مَعَ مِثْلِهَا أَوْ كَانَ مَعَ مَحْرَمِيَّةٍ بِشَهْوَةٍ كَأُخْتِهِ لِقَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي أَثْنَاءِ حَدِيثٍ «وَالْيَدَانِ زِنَاهُمَا الْبَطْشُ» رَوَاهُ مُسْلِمٌ. وَالْبَطْشُ هُنَا مَعْنَاهُ الْعَمَلُ بِالْيَدِ كَمَا قَالَ الْفَيُّومِيُ فِي الْمِصْبَاحِ الْمُنِيرِ وَهُوَ مِنْ كُتُبِ اللُّغَةِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1104},{"type":"p","text":"وَمِنْ ضَلالاتِ طَائِفَةٍ نَبَغَتْ فِي هَذَا الْعَصْرِ تُسَمَّى حِزْبَ التَّحْرِيرِ تَحْلِيلُ مُصَافَحَةِ الرَّجُلِ الْمَرْأَةَ الأَجْنَبِيَّةَ اجْتِهَادًا مِنْهُمْ مَعَ وُجُودِ هَذَا النَّصِ، وَبِهَذا يُنَادُونَ عَلَى أَنْفُسِهِمْ بِالْجَهْلِ الْعَمِيقِ بِأُمُورِ الدِّينِ، قَالَ شَيْخُنَا الْعَبْدَرِيُّ رَضِيَ اللَّهُ عَنْهُ وَقَدْ صَارَحَنِي بَعْضُهُمْ بِقَوْلِهِ «هَذَا اجْتِهَادٌ مِنَّا» فَقُلْتُ لَهُ «أَتَجْتَهِدُونَ مَعَ النَّصِّ» فَسَكَتَ وَلَمْ يَرُدَّ جَوَابًا. وَمِمَّا يَدُلُّ عَلَى حُرْمَةِ مُصَافَحَةِ الرَّجُلِ الْمَرْأَةَ الأَجْنَبِيَّةَ الْحَدِيثُ الَّذِي رَوَاهُ الطَّبَرَانِيُّ وَهُوَ «لَأَنْ يُطْعَنَ أَحَدُكُمْ بِحَدِيدَةٍ فِي رَأْسِهِ خَيْرٌ لَهُ مِنْ أَنْ يَمَسَّ امْرَأَةً لا تَحِلُّ لَهُ» وَهَذَا الْحَدِيثُ إِسْنَادُهُ جَيِّدٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1105},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَصْوِيرُ ذِي رُوحٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1106},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ تَصْوِيرَ ذِي رُوحٍ سَوَاءٌ كَانَ مُجَسَّمًا أَوْ مَنْقُوشًا فِي سَقْفٍ أَوْ جِدَارٍ أَوْ مُصَوَّرًا فِي وَرَقٍ أَوْ مَنْسُوجًا فِي ثَوْبٍ أَوْ غَيْرِ ذَلِكَ وَهَذَا مُتَّفَقٌ عَلَيْهِ فِي الْمَذَاهِبِ الثَّلاثَةِ الْمَذْهَبِ الشَّافِعِيِّ وَالْمَذْهَبِ الْحَنَفِيِّ وَالْمَذْهَبِ الْحَنْبَلِيِّ. وَأَبَاحَ ذَلِكَ الْمَالِكِيَّةُ إِذَا لَمْ يَكُنْ مُجَسَّمًا. وَيُشْتَرَطُ لِتَحْرِيمِ اسْتِبْقَاءِ الصُّورَةِ أَنْ تَكُونَ الصُّورَةُ بِهَيْئَةٍ يَعِيشُ عَلَيْهَا الْحَيَوَانُ. وَصَرَّحَ الشَّافِعِيَّةُ بِجَوَازِ اسْتِبْقَائِهَا إِذَا كَانَتْ عَلَى أَرْضٍ أَوْ بِسَاطٍ يُدَاسُ وَقَدْ نُصُّوا عَلَى جَوَازِ اسْتِبْقَاءِ الصُّورَةِ الَّتِي تَكُونُ فِي الدِّرْهَمِ وَالدِّينَارِ وَالْفَلْسِ وَسَائِرِ مَا يُعَدُّ مُمْتَهَنًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1107},{"type":"p","text":"وَيُسْتَثْنَى مِنْ تَحْرِيمِ ذَلِكَ لُعَبُ الْبَنَاتِ الصِّغَارِ الَّتِي عَلَى هَيْئَةِ الْبِنْتِ الصَّغِيرَةِ، وَصَرَّحَ الْمَالِكِيَّةُ بِجَوَازِ شِرَاءِ ذَلِكَ لِلْبَنَاتِ الصِّغَارِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1108},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَنْعُ الزَّكَاةِ أَوْ بَعْضِهَا بَعْدَ الْوُجُوبِ وَالتَّمَكُّنِ، وَإِخْرَاجُ مَا لا يُجْزِئُ أَوْ إِعْطَاؤُهَا مَنْ لا يَسْتَحِقُّهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1109},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ الَّتِي هِيَ مِنَ الْكَبَائِرِ مَنْعَ الزَّكَاةِ أَيْ تَرْكَ دَفْعِهَا أَوْ إِعْطَاءَ بَعْضِهَا وَتَرْكَ بَعْضٍ، وَمِنْهَا تَأْخِيرُ إِخْرَاجِهَا بَعْدَ وَقْتِ الْوُجُوبِ وَالتَّمَكُّنِ مِنْ إِخْرَاجِهَا بِلا عُذْرٍ شَرْعِيٍّ فَلا يَجُوزُ لِمَنْ وَجَبَتْ عَلَيْهِ قَبْلَ رَمَضَانَ كَشَهْرِ رَجَبٍ أَوْ شَعْبَانَ مَثَلًا أَنْ يُؤَخِّرَ إِلَى رَمَضَانَ، وَلَيْسَ رَمَضَانُ مَوْسِمًا لإِخْرَاجِ الزَّكَاةِ بَلْ مَوْسِمُهَا فِي الْحَوْلِيِّ وَقْتُ حَوَلانِ الْحَوْلِ. وَكَذَلِكَ مِنْ مَعَاصِي الْيَدِ دَفْعُ مَا لا يُجْزِئُ إِخْرَاجُهُ وَلَوْ كَانَ أَكْثَرَ قِيمَةً مِنَ الْمُجْزِئِ. وَيَجُوزُ إِخْرَاجُ الْقِيمَةِ عِنْدَ الإِمَامِ أَبِي حَنِيفَةَ وَعَلَيْهِ عَمَلُ النَّاسِ الْيَوْمَ. وَكَذَلِكَ يَحْرُمُ إِعْطَاؤُهَا مَنْ لا يَسْتَحِقُّهَا كَإِعْطَائِهَا لِلْجَمْعِيَّاتِ الَّتِي تَصْرِفُ الزَّكَاةَ فِي غَيْرِ مَصَارِفِهَا، وَأَمَّا إِنْ وَكَّلَ الْمُزَكِّي جَمْعِيَّةً يَثِقُ بِأَنَّهَا تَصْرِفُ الزَّكَاةَ فِي مَصَارِفِهَا كَانَ ذَلِكَ جَائِزًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1110},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَنْعُ الأَجِيرِ أُجْرَتَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1111},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ الَّتِي هِيَ مِنَ الْكَبَائِرِ تَرْكَ إِعْطَاءِ الأَجِيرِ أُجْرَتَهُ. وَقَدْ صَحَّ الْحَدِيثُ الْقُدْسِيُّ «ثَلاثَةٌ أَنَا خَصْمُهُمْ يَوْمَ الْقِيَامَةِ وَمَنْ كُنْتُ خَصْمَهُ خَصَمْتُهُ رَجُلٌ أَعْطَى بِيَ الْعَهْدَ ثُمَّ غَدَرَ وَرَجُلٌ بَاعَ حُرًّا فَأَكَلَ ثَمَنَهُ وَرَجُلٌ اسْتَأْجَرَ أَجِيرًا فَاسْتَوْفَى مِنْهُ وَلَمْ يُعْطِهِ أَجْرَهُ» رَوَاهُ الْبُخَارِيُّ، وَمَعْنَى خَصَمْتُهُ أَنَّهُ مَغْلُوبٌ لا حُجَّةَ لَهُ، وَمَعْنَى أَعْطَى بِيَ الْعَهْدَ ثُمَّ غَدَرَ أَعْطَى الْعَهْدَ بِاسْمِي ثُمَّ غَدَرَ كَالَّذِي يُبَايِعُ إِمَامًا ثُمَّ يَتَمَرَّدُ عَلَيْهِ كَالَّذِينَ غَدَرُوا بِعَلِيِّ بنِ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُ مِنَ الْخَوَارِجِ وَغَيْرِهِمْ بَعْدَ أَنْ بَايَعَهُ الْمُهَاجِرُونَ وَالأَنْصَارُ فِي الْمَدِينَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1112},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَنْعُ الْمُضْطَرِّ مَا يَسُدُّهُ وَعَدَمُ إِنْقَاذِ غَرِيقٍ مِنْ غَيْرِ عُذْرٍ فِيهِمَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1113},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ الَّتِي هِيَ مِنَ الْكَبَائِرِ مَنْعَ الْمُضْطَرِّ مَا يَسُدُّهُ أَيْ مَا يَسُدُّ حَاجَتَهُ مِنْ غَيْرِ عُذْرٍ، وَلا فَرْقَ فِي الْمُضْطَرِّ بَيْنَ الْقَرِيبِ وَغَيْرِهِ وَهُوَ يَشْمَلُ الذِّمِيَّ. وَالْمُرَادُ بِالْمُضْطَرِّ مَنِ اضْطُرَّ لِكِسْوَةٍ يَدْفَعُ بِهَا الْهَلاكَ عَنْ نَفْسِهِ وَمَنِ اضْطُرَّ لِطَعَامٍ يَدْفَعُ بِهِ الْهَلاكَ عَنْ نَفْسِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1114},{"type":"p","text":"وَمِنْ مَعَاصِي الْيَدِ أَيْضًا عَدَمُ إِنْقَاذِ غَرِيقٍ مَعْصُومٍ مَعَ الْقُدْرَةِ عَلَى ذَلِكَ، وَلا إِثْمَ عَلَى مَنْ هُوَ غَيْرُ قَادِرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1115},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكِتَابَةُ مَا يَحْرُمُ النُّطْقُ بِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1116},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ كِتَابَةَ مَا يَحْرُمُ النُّطْقُ بِهِ. قَالَ الْغَزَالِيُّ فِي بِدَايَةِ الْهِدَايَةِ لِأَنَّ الْقَلَمَ أَحَدُ اللِّسَانَيْنِ فَاحْفَظْهُ عَمَّا يَجِبُ حِفْظُ اللِّسَانِ مِنْهُ مِنْ غِيبَةٍ وَغَيْرِهَا اهـ فَلا يُكْتَبُ بِهِ مَا يَحْرُمُ النُّطْقُ بِهِ مِنْ جَمِيعِ مَا سَبَقَ. وَمِثْلُ الْقَلَمِ فِي ذَلِكَ سَائِرُ أَدَوَاتِ الْكِتَابَةِ مِنْ آلاتِ طِبَاعَةٍ وَحَاسُوبٍ وَنَحْوِهَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1117},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْخِيَانَةُ وَهِيَ ضِدُّ النَّصِيحَةِ فتَشْمَلُ الأَفْعَالَ وَالأَقْوَالَ وَالأَحْوَالَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1118},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْيَدِ الْخِيَانَةَ سَوَاءٌ كَانَتْ بِالْقَوْلِ أَوْ بِالْفِعْلِ أَوْ بِالْحَالِ قَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الأَمَانَاتِ إِلَى أَهْلِهَا﴾ [سُورَةَ النِّسَاء/58]. وَتُطْلَقُ الأَمَانَةُ عَلَى مَا يَسْتَأْمِنُ النَّاسُ بَعْضُهُمْ بَعْضًا عَلَيْهِ مِنْ نَحْوِ الْوَدَائِعِ كَمَا تَشْمَلُ الأَمَانَةُ مَا يَأْتَمِنُ الرَّجُلُ عَلَيْهِ أَجِيرَهُ مِنَ الْعَمَلِ وَمَا يَأْتَمِنُ عَلَيْهِ الزَّوْجُ زَوْجَتَهُ فِي بَيْتِهِ بِأَنْ لا تَخُونَهُ فِي فِرَاشِهِ أَوْ مَالِهِ. رَوَى الإِمَامُ أَحْمَدُ وَابْنُ حِبَّانَ مِنْ حَدِيثِ أَنَسٍ «لا دِينَ لِمَنْ لا عَهْدَ لَهُ وَلا إيِمَانَ لِمَنْ لا أَمَانَةَ لَهُ» أَيْ لا يَكُونُ مَنْ لا يُحَافِظُ عَلَى الأَمَانَةِ مُؤْمِنًا كَامِلًا وَلا يَكُونُ دِينُ مَنْ يُضَيِّعُ الْعَهْدَ كَامِلًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1119}]},{"id":"private-sins","title":"مَعَاصِي الْفَرْجِ","description":"الفصل المخصص لبيان معاصي الفرج.","icon":"fa-circle-exclamation","start":1120,"end":1146,"paragraphCount":26,"wordCount":1073,"readMinutes":6,"blocks":[{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1120},{"type":"p","text":"الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مَعَاصِي الْفَرْجِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1121},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ مَعَاصِي الْفَرْجِ الزِّنَى وَاللِّوَاطُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1122},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْفَرْجِ الزِّنَى قَالَ اللَّهُ تَعَالَى ﴿وَلا تَقْرَبُوا الزِّنَى إِنَّهُ كَانَ فَاحِشَةً وَسَآءَ سَبِيلًا﴾ [سُورَةَ الإِسْرَاء/32]. وَالزِّنَى عِنْدَ الإِطْلاقِ إِدْخَالُ الْحَشَفَةِ أَيْ رَأْسِ الذَّكَرِ فِي فَرْجِ غَيْرِ زَوْجَتِهِ وَأَمَتِهِ، فَإِدْخَالُ الْحَشَفَةِ كَإِدْخَالِ كُلِّ الذَّكَرِ، فَهَذَا هُوَ الزِّنَى الَّذِي يُعَدُّ مِنْ أَكْبَرِ الْكَبَائِرِ وَيَتَرَتَّبُ الْحَدُّ عَلَيْهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1123},{"type":"p","text":"وَأَمَّا اللِّوَاطُ الَّذِي هُوَ مِنَ الْكَبَائِرِ فَهُوَ إِدْخَالُ الْحَشَفَةِ فِي الدُّبُرِ أَيْ فِي دُبُرِ امْرَأَةٍ غَيْرِ زَوْجَتِهِ وَمَمْلُوكَتِهِ أَوْ دُبُرِ ذَكَرٍ وَأَمَّا إِتْيَانُ الرَّجُلِ امْرَأَتَهُ فِي دُبُرِهَا فَهُوَ حَرَامٌ لَكِنَّهُ لَيْسَ إِلَى حَدِّ اللِّوَاطِ. رَوَى الإِمَامُ أَحْمَدُ فِي مُسْنَدِهِ وَغَيْرُهُ «لا يَنْظُرُ اللَّهُ إلى رَجُلٍ أَتَى امرَأَتَهُ في دُبُرِهَا» أَيْ لا يُكْرِمُهُ بَلْ يُهِينُهُ يَوْمَ الْقِيَامَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1124},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيُحَدُّ الْحُرُّ الْمُحْصَنُ ذَكَرًا أَوْ أُنْثَى بِالرَّجْمِ بِالْحِجَارَةِ الْمُعْتَدِلَةِ حَتَّى يَمُوتَ وَغَيْرُهُ بِمِائَةِ جَلْدَةٍ وَتَغْرِيبِ سَنَةٍ لِلْحُرِّ وَيُنَصَّفُ ذَلِكَ لِلرَّقِيقِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1125},{"type":"p","text":"الشَّرْحُ يَتَرَتَّبُ عَلَى الزِّنَى وَاللِّوَاطِ الْحَدُّ أَيْ يَجِبُ عَلَى الإِمَامِ الْخَلِيفَةِ وَمَنْ فِي مَعْنَاهُ إِقَامَتُهُ. وَيَخْتَلِفُ الْحَدُّ فِي الْمُحْصَنِ وَغَيْرِ الْمُحْصَنِ. وَالْمُحْصَنُ هُوَ الَّذِي وَطِئَ فِي نِكَاحٍ صَحِيحٍ وَكَانَ حُرًّا مُكَلَّفًا وَيُحَدُّ إِذَا زَنَى بِالرَّجْمِ بِالْحِجَارَةِ الْمُعْتَدِلَةِ وَنَحْوِهَا حَتَّى يَمُوتَ، وَذَلِكَ لِأَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رَجَمَ رَجُلًا يُسَمَّى مَاعِزًا وَرَجَمَ الْمَرْأَةَ الْغَامِدِيَّةَ رَوَاهُمَا مُسْلِمٌ. وَلَيْسَ وَاجِبًا كَوْنُ الْحِجَارَةِ مُعْتَدِلَةً لَكِنَّ ذَلِكَ يُنْدَبُ. وَأَمَّا غَيْرُ الْمُحْصَنِ وَهُوَ الَّذِي لَمْ يَطَأْ فِي نِكَاحٍ صَحِيحٍ فَيَكُونُ حَدُّهُ جَلْدَ ماِئَةٍ وَتَغْرِيبَ سَنَةٍ هِلالِيَّةٍ إِلَى مَسَافَةِ الْقَصْرِ مِنْ مَحَلِّ الزِّنَى فَمَا فَوْقَهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":1126},{"type":"p","text":"وَأَمَّا حَدُّ اللَّائِطِ وَالْمَلُوطِ بِهِ فَقَدِ اخْتُلِفَ فِيهِ وَالْمُعْتَمَدُ أَنَّ حَدَّ الْفَاعِلِ حَدُّ الزِّنَى وَأَمَّا الْمَفْعُولُ بِهِ فَحَدُّهُ جَلْدُ مِائَةٍ وَتَغْرِيبُ عَامٍ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1127},{"type":"p","text":"وَمَا مَرَّ هُوَ حَدُّ الْحُرِّ الْمُكَلَّفِ ذَكَرًا كَانَ أَوْ أُنْثَى وَأَمَّا الرَّقِيقُ كُلُّهُ أَوْ بَعْضُهُ فَحَدُّهُ نِصْفُ ذَلِكَ فَيُجْلَدُ خَمْسِينَ جَلْدَةً وَيُغَرَّبُ نِصْفَ عَامٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":1128},{"type":"p","text":"وَلا يَثْبُتُ الزِّنَى إِلَّا بِبَيِّنَةٍ أَوْ بِاعْتِرَافِ الزَّانِي. وَبَيِّنَةُ الزِّنَى أَرْبَعَةٌ مِنَ الرِّجَالِ الْعُدُول.ِ وَلا بُدَّ أَنْ تَكُونَ الْبَيِّنَةُ مُفَصَّلَةً وَذَلِكَ لِأَنَّ مِنَ النَّاسِ مَنْ يَظُنُّ أَنَّ الزِّنَى يَثْبُتُ بِمُجَرَّدِ أَنْ يُرَى رَجُلٌ وَامْرَأَةٌ تَحْتَ لِحَافٍ وَاحِدٍ أَوْ أَنْ يُرَى رَاكِبًا لَهَا مِنْ غَيْرِ رُؤْيَةِ غَيْبُوبَةِ الْحَشَفَةِ فِي الْفَرْجِ

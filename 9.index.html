function getFavs(){return BOOK_SECTIONS.filter(s=>state.favorites.has(s.id))}
function saveFavs(){localStorage.setItem(STORAGE.favorites,JSON.stringify([...state.favorites]));}
function showToast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),1800)}
function setTheme(theme){state.theme=theme;document.documentElement.dataset.theme=theme==='dark'?'dark':'light';localStorage.setItem(STORAGE.theme,theme);}
function applyReaderPrefs(){document.documentElement.style.setProperty('--reader-font',fontMap[state.font]||fontMap.Cairo);document.documentElement.style.setProperty('--reader-size',state.size+'px');}
function savePrefs(){localStorage.setItem(STORAGE.font,state.font);localStorage.setItem(STORAGE.size,state.size);applyReaderPrefs();}

function routeTo(route){location.hash=route.startsWith('#')?route:'#/'+route}
function currentRoute(){const raw=location.hash.replace(/^#\/?/,'')||'home';const [page,id]=raw.split('/');return {page,id}}
function updateNav(){const {page}=currentRoute();$$('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===page));}

function cardTemplate(s){
  const fav=state.favorites.has(s.id);
  return `<article class="card ripple" data-open-section="${s.id}" tabindex="0" role="button" aria-label="فتح ${esc(s.title)}">
    <div class="card-top"><span class="card-icon"><i class="fa-solid ${s.icon}"></i></span><button class="fav-mini ${fav?'is-fav':''} ripple" data-toggle-fav="${s.id}" aria-label="${fav?'إزالة من':'إضافة إلى'} المفضلة"><i class="fa-${fav?'solid':'regular'} fa-bookmark"></i></button></div>
    <h3>${esc(s.title)}</h3><p>${esc(s.description)}</p>
    <div class="card-stats"><span><i class="fa-regular fa-file-lines"></i>${s.paragraphCount} فقرة</span><span><i class="fa-regular fa-clock"></i>${s.readMinutes} د قراءة</span></div>
    <i class="fa-solid fa-arrow-left card-arrow"></i>
  </article>`
}
function homePage(){
  const lastId=localStorage.getItem(STORAGE.lastSection); const last=getSection(lastId);
  app.innerHTML=`<section class="page"><div class="hero"><span class="hero-badge"><i class="fa-solid fa-star-and-crescent"></i> قراءة مرتبة وسريعة</span><h1>عُمْدَةُ الرَّاغِبِ</h1><p>تصفّح الكتاب في أقسام مستقلة، وابحث في كامل النص، واحفظ المفضلة وموضع القراءة تلقائيًا على جهازك.</p><div class="hero-actions">${last?`<button class="primary-btn ripple" data-open-section="${last.id}"><i class="fa-solid fa-book-open-reader"></i>متابعة القراءة</button>`:''}<button class="soft-btn ripple" data-action="search"><i class="fa-solid fa-magnifying-glass"></i>بحث في الكتاب</button></div></div><div class="section-head"><div><h2>أقسام الكتاب</h2><p>${BOOK_SECTIONS.length} قسمًا مرتبة حسب تسلسل النص الأصلي</p></div></div><div class="cards">${BOOK_SECTIONS.map(cardTemplate).join('')}</div></section>`;
}
function favoritesPage(){const favs=getFavs();app.innerHTML=`<section class="page"><h1 class="page-title">المفضلة</h1><p class="page-subtitle">الأقسام التي حفظتها للرجوع إليها بسرعة.</p>${favs.length?`<div class="cards">${favs.map(cardTemplate).join('')}</div>`:`<div class="empty-state"><i class="fa-regular fa-bookmark"></i><h3>لا توجد أقسام مفضلة بعد</h3><p>أضف أي قسم من زر الإشارة المرجعية.</p></div>`}</section>`}
function settingsPage(){
  app.innerHTML=`<section class="page"><div class="settings-card"><h1>الإعدادات</h1><p class="lead">خصص تجربة القراءة، وتُحفظ اختياراتك تلقائيًا على هذا الجهاز.</p>
  <div class="setting-row"><div><h3>الوضع الليلي</h3><p>تبديل بين المظهر النهاري والليلي.</p></div><div class="setting-control"><button id="themeToggle" class="toggle ${state.theme==='dark'?'on':''}" aria-label="الوضع الليلي"><span></span></button></div></div>
  <div class="setting-row"><div><h3>نوع خط القراءة</h3><p>اختر الخط الأنسب للنص العربي.</p></div><div class="setting-control"><select id="fontSelect" class="select">${Object.keys(fontMap).map(f=>`<option ${state.font===f?'selected':''}>${f}</option>`).join('')}</select></div></div>
  <div class="setting-row"><div><h3>حجم الخط</h3><p><span id="sizeValue">${state.size}</span> بكسل</p></div><div class="setting-control"><input id="sizeRange" class="range" type="range" min="16" max="34" step="1" value="${state.size}"></div></div>
  <button id="resetSettings" class="reset-btn ripple"><i class="fa-solid fa-rotate-left"></i> إعادة ضبط جميع الإعدادات</button></div></section>`;
  $('#themeToggle').onclick=()=>{setTheme(state.theme==='dark'?'light':'dark');render()};
  $('#fontSelect').onchange=e=>{state.font=e.target.value;savePrefs()};
  $('#sizeRange').oninput=e=>{state.size=Number(e.target.value);$('#sizeValue').textContent=state.size;savePrefs()};
  $('#resetSettings').onclick=()=>{state.theme=DEFAULTS.theme;state.font=DEFAULTS.font;state.size=DEFAULTS.size;setTheme(state.theme);savePrefs();showToast('تمت إعادة ضبط الإعدادات');render()};
}

function blocksHtml(blocks){
  let out='', list=[];
  const flush=()=>{if(list.length){out+=`<ul class="reader-list">${list.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>`;list=[]}};
  for(const b of blocks){
    if(b.type==='li'){list.push(b);continue} flush();
    if(b.type==='blank'){out+='<div class="blank-line" aria-hidden="true"></div>';continue}
    const text=esc(b.text);
    if(b.type==='heading') out+=`<p class="book-heading">${text}</p>`;
    else if(b.type==='source') out+=`<div class="source-block">${text}</div>`;
    else if(b.type==='note') out+=`<div class="note-block">${text}</div>`;
    else if(b.type==='benefit') out+=`<div class="benefit-block">${text}</div>`;
    else out+=`<p${b.bold?' style="font-weight:700"':''}>${text}</p>`;
  }flush(); return out;
}
function sectionPage(s){
  localStorage.setItem(STORAGE.lastSection,s.id);
  const fav=state.favorites.has(s.id);
  app.innerHTML=`<article class="page reader-page"><header class="reader-head"><button class="reader-back" data-route="home"><i class="fa-solid fa-arrow-right"></i> الأقسام</button><div class="reader-title-row"><div><h1>${esc(s.title)}</h1><div class="reader-stats"><span><i class="fa-regular fa-file-word"></i>${s.wordCount.toLocaleString('ar')} كلمة</span><span><i class="fa-regular fa-clock"></i>${s.readMinutes} دقيقة تقريبًا</span><span><i class="fa-regular fa-file-lines"></i>${s.paragraphCount} فقرة</span></div></div></div></header>
  <div class="reader-actions"><button data-action="copy" title="نسخ المحتوى"><i class="fa-regular fa-copy"></i></button><button data-action="share" title="مشاركة"><i class="fa-solid fa-share-nodes"></i></button><button data-action="fav" class="${fav?'is-fav':''}" title="المفضلة"><i class="fa-${fav?'solid':'regular'} fa-bookmark"></i></button><button data-action="font-plus" title="تكبير الخط"><i class="fa-solid fa-plus"></i></button><button data-action="font-minus" title="تصغير الخط"><i class="fa-solid fa-minus"></i></button></div>
  <div class="reader-content" id="readerContent">${blocksHtml(s.blocks)}</div></article>`;
  requestAnimationFrame(()=>{const y=Number(localStorage.getItem('ur_scroll_'+s.id)||0);if(y>0)scrollTo({top:y,behavior:'instant'});updateReadingProgress()});
  app.querySelector('[data-action="copy"]').onclick=()=>copyText(s.blocks.filter(b=>b.text).map(b=>b.text).join('\n\n'));
  app.querySelector('[data-action="share"]').onclick=()=>shareSection(s);
  app.querySelector('[data-action="fav"]').onclick=()=>{toggleFavorite(s.id);sectionPage(s)};
  app.querySelector('[data-action="font-plus"]').onclick=()=>changeFontSize(1);
  app.querySelector('[data-action="font-minus"]').onclick=()=>changeFontSize(-1);
}
function changeFontSize(delta){state.size=Math.min(34,Math.max(16,state.size+delta));savePrefs();showToast(`حجم الخط ${state.size}`)}
async function copyText(text){try{await navigator.clipboard.writeText(text);showToast('تم نسخ المحتوى')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('تم نسخ المحتوى')}}
async function shareSection(s){const data={title:s.title,text:s.title,url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){if(e.name!=='AbortError')copyText(location.href)}}else{copyText(location.href);showToast('تم نسخ رابط القسم')}}
function toggleFavorite(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);saveFavs();showToast(state.favorites.has(id)?'أضيف إلى المفضلة':'أزيل من المفضلة')}

function render(){
  const {page,id}=currentRoute();window.scrollTo(0,0);progress.style.width='0';toTop.classList.remove('show');
  if(page==='section'&&getSection(id)) sectionPage(getSection(id)); else if(page==='favorites') favoritesPage(); else if(page==='settings') settingsPage(); else homePage();
  updateNav();localStorage.setItem(STORAGE.lastRoute,location.hash||'#/home');bindDynamic();
}
function bindDynamic(){
  $$('[data-route]').forEach(el=>el.onclick=()=>routeTo(el.dataset.route));
  $$('[data-open-section]').forEach(el=>{el.onclick=e=>{if(e.target.closest('[data-toggle-fav]'))return;routeTo('section/'+el.dataset.openSection)};el.onkeydown=e=>{if(e.key==='Enter')routeTo('section/'+el.dataset.openSection)}});
  $$('[data-toggle-fav]').forEach(el=>el.onclick=e=>{e.stopPropagation();toggleFavorite(el.dataset.toggleFav);render()});
  $$('[data-action="search"]').forEach(el=>el.onclick=openSearch);
  $$('.ripple').forEach(el=>el.addEventListener('pointerdown',ripple));
}
function ripple(e){const el=e.currentTarget,r=document.createElement('span'),rect=el.getBoundingClientRect(),size=Math.max(rect.width,rect.height);r.className='ripple-wave';r.style.width=r.style.height=size+'px';r.style.right=(rect.right-e.clientX-size/2)+'px';r.style.top=(e.clientY-rect.top-size/2)+'px';el.appendChild(r);setTimeout(()=>r.remove(),600)}

function searchBook(query){
  const q=stripMarks(query.trim());if(!q)return [];
  const results=[];
  for(const s of BOOK_SECTIONS){
    const titleMatch=stripMarks(s.title).includes(q); let hit=null;
    if(!titleMatch){for(const b of s.blocks){if(b.text&&stripMarks(b.text).includes(q)){hit=b.text.trim();break}}}
    if(titleMatch||hit){let snippet=hit||s.description;if(snippet.length>220)snippet=snippet.slice(0,220)+'…';results.push({s,snippet,titleMatch});}
  }
  return results.slice(0,30);
}
function highlight(text,q){const safe=esc(text);const raw=q.trim();if(!raw)return safe;try{return safe.replace(new RegExp(escReg(raw),'gi'),m=>`<mark>${m}</mark>`)}catch{return safe}}
function escReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function renderSearchResults(q){const box=$('#searchResults');if(!q.trim()){box.innerHTML='<div class="result-empty"><i class="fa-solid fa-magnifying-glass"></i><p>ابدأ بكتابة كلمة للبحث في جميع الأقسام.</p></div>';return}const rs=searchBook(q);box.innerHTML=rs.length?rs.map(({s,snippet})=>`<div class="search-result" data-result="${s.id}"><strong>${highlight(s.title,q)}</strong><p>${highlight(snippet,q)}</p></div>`).join(''):'<div class="result-empty">لا توجد نتائج مطابقة.</div>';$$('[data-result]').forEach(el=>el.onclick=()=>{closeSearch();routeTo('section/'+el.dataset.result)})}
function openSearch(){const ov=$('#searchOverlay'),inp=$('#searchInput');ov.classList.add('open');document.body.style.overflow='hidden';const header=$('#headerSearch');if(header.value&&!inp.value)inp.value=header.value;setTimeout(()=>inp.focus(),20);renderSearchResults(inp.value)}
function closeSearch(){const ov=$('#searchOverlay');ov.classList.remove('open');document.body.style.overflow='';}
$('#openSearchBox').addEventListener('click',openSearch);$('#headerSearch').addEventListener('focus',openSearch);$('#headerSearch').addEventListener('input',e=>{$('#searchInput').value=e.target.value;openSearch()});$('#closeSearch').onclick=closeSearch;$('#searchOverlay').addEventListener('click',e=>{if(e.target.id==='searchOverlay')closeSearch()});$('#searchInput').addEventListener('input',e=>{$('#headerSearch').value=e.target.value;renderSearchResults(e.target.value)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});

toTop.onclick=()=>scrollTo({top:0,behavior:'smooth'});
let scrollTick=false;window.addEventListener('scroll',()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{updateReadingProgress();const {page,id}=currentRoute();if(page==='section'&&id)localStorage.setItem('ur_scroll_'+id,String(Math.round(scrollY)));toTop.classList.toggle('show',scrollY>500);scrollTick=false})},{passive:true});
function updateReadingProgress(){const {page}=currentRoute();if(page!=='section'){progress.style.width='0';return}const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'}
window.addEventListener('hashchange',render);
setTheme(state.theme);applyReaderPrefs();if(!location.hash)location.hash='#/home';else render();
console.info('Source integrity SHA-256:',SOURCE_CHECKSUM,'Sections:',BOOK_SECTIONS.length);
</script>
</body>
</html>

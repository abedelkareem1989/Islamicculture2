ْ يَكُنْ قَبْلَهُ نَبِيٌّ وَلا رَسُولٌ بَلْ كَانَ ءَادَمُ نَبِيًّا رَسُولًا كَمَا يَشْهَدُ لِنُبُوَّتِهِ حَدِيثُ التِّرْمِذِيِّ «وَمَا مِنْ نَبِيٍّ يَوْمَئِذٍ ءَادَمُ فَمَنْ سِوَاهُ إِلَّا تَحْتَ لِوَائِي» حَسَّنَهُ التِّرْمِذِيُّ وَأَجْمَعَ الْمُسْلِمُونَ عَلَى ذَلِكَ وَعُرِفَ هَذَا الأَمْرُ بَيْنَهُمْ بِالضَّرُورَةِ [وَيَدُلُّ عَلَى نُبُوَّتِهِ مِنَ الْقُرْءَانِ الْكَرِيمِ قَوْلُهُ تَعَالَى ﴿إِنَّ اللَّهَ اصْطَفَى ءَادَمَ وَنُوحًا وَءَالَ إِبْرَاهِيمَ وَءَالَ عِمْرَانَ عَلَى الْعَالَمِينَ﴾] فَمَنْ نَفَى نُبُوَّتَهُ فَهُوَ كَافِرٌ بِالإِجْمَاعِ كَمَا فِي مَرَاتِبِ الإِجْمَاعِ، فَالَّذِي يَشُكُّ فِي نُبُوَّةِ ءَادَمَ أَوْ فِي كُفْرِ الشَّاكِّ فِيهَا كَافِرٌ وَالَّذِي يَشُكُّ فِي رِسَالَتِهِ أَيْضًا كَافِرٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":105},{"type":"p","text":"   وَالإِيمَانُ بِالْكُتُبِ وَهِيَ كَثِيرَةٌ لَكِنْ أَشْهَرُهَا هَؤُلاءِ الأَرْبَعُ التَّوْرَاةُ وَالإِنْجِيلُ وَالزَّبُورُ وَالْفُرْقَانُ أَيِ الْقُرْءَانُ. قَالَ وَهْبُ بنُ مُنَبِّهٍ قَرَأْتُ سَبْعِينَ كِتَابًا مِمَّا أَنْزَلَ اللَّهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":106},{"type":"p","text":"   وَالإِيمَانُ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ فَالْوَاجِبُ الَّذِي هُوَ أَحَدُ أَرْكَانِ الإِيمَانِ السِّتَّةِ هُوَ الرِّضَا بِقَدَرِ اللَّهِ أَيْ تَقْدِيرِهِ وَأَمَّا الْمَقْدُورُ فَيَجِبُ الإِيمَانُ بِأَنَّ كُلَّ الْمَقْدُورَاتِ أَيِ الْمَخْلُوقَاتِ بِتَقْدِيرِ اللَّهِ تَحْصُلُ مَا كَانَ خَيْرًا وَمَا كَانَ شَرًّا فَمَا كَانَ مِنَ الْمَقْدُورِ خَيْرًا يَجِبُ الرِّضَا بِهِ وَمَا كَانَ مِنْهُ شَرًّا يَجِبُ كَرَاهِيَتُهُ كَالْكُفْرِ وَالْمَعَاصِي، وَمَعْنَى ذَلِكَ أَنَّ كُلَّ مَا دَخَلَ فِي الْوُجُودِ مِنْ خَيْرٍ وَشَرٍّ هُوَ بِتَقْدِيرِ اللَّهِ الأَزَلِيِّ فَالْخَيْرُ مِنْ أَعْمَالِ الْعِبَادِ بِتَقْدِيرِ اللَّهِ وَمَحَبَّتِهِ وَرِضَاهُ وَالشَّرُّ مِنْ أَعْمَالِ الْعِبَادِ بِتَقْدِيرِ اللَّهِ لا بِمَحَبَّتِهِ وَرِضَاهُ. وَقَدْ وَرَدَ فِي حَدِيثِ جِبْرِيلَ الصَّحِيحِ الْمَشْهُورِ لَفْظُ «وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ» رَوَاهُ مُسْلِمٌ وَفِي لَفْظٍ «وَالْقَدَرِ كُلِّهِ». ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":107},{"type":"p","text":"   وَيَتَضَمَّنُ الإِيمَانُ بِرِسَالَةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الإِيمَانَ بِأَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَاتَمُ النَّبِيِّينَ لأِنَّهُ أَخْبَرَ بِذَلِكَ قَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «وَخُتِمَ بِيَ النَّبِيُّونَ» رَوَاهُ مُسْلِمٌ. وَقَوْلُهُ بِأَنَّ سَيِّدَنَا مُحَمَّدًا صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ سَيِّدُ وَلَدِ ءَادَمَ أَجْمَعِينَ هَذَا مُتَّفَقٌ عَلَيْهِ عِنْدَ الْعُلَمَاءِ وَهُوَ مَأْخُوذٌ مِنْ حَدِيثٍ رَوَاهُ التِّرْمِذِيُّ «أَنَا سَيِّدُ وَلَدِ ءَادَمَ يَوْمَ الْقِيَامَةِ وَلا فَخْرَ» أَيْ لا أَقُولُ ذَلِكَ افْتِخَارًا إِنَّمَا أَقُولُ ذَلِكَ تَحَدُّثًا بِنِعْمَةِ اللَّهِ وَفِي ذَلِكَ جَوَازُ وَصْفِهِ بِأَنَّهُ سَيِّدُ الْبَشَرِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":108},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ اعْتِقَادُ أَنَّ كُلَّ نَبِيٍّ مِنْ أَنْبِيَاءِ اللَّهِ يَجِبُ أَنْ يَكُونَ مُتَّصِفًا بِالصِّدْقِ وَالأَمَانَةِ وَالْفَطَانَةِ فَيَسْتَحِيلُ عَلَيْهِمُ الْكَذِبُ وَالْخِيَانَةُ وَالرَّذَالَةُ [قَالَ فِي الصَّحَاحِ «الرَّذْلُ الدُّونُ الْخَسِيسُ»] وَالسَّفَاهَةُ [قَالَ فِي الْمِصْبَاحِ الْمُنِيرِ «وَالسَّفَهُ نَقْصٌ فِي الْعَقْلِ وَأَصْلُهُ الْخِفَّةُ وَفِي تَهْذِيبِ اللُّغَةِ «وَقَالَ بَعْضُ أَهْلِ اللُّغَةِ أَصْلُ السَّفَهِ الْخِفَّةُ وَمَعْنَى السَّفِيهِ الْخَفِيفُ الْعَقْلِ»] وَالْبَلادَةُ [قَالَ فِي الصَّحَاحِ «وَالْبَلادَةُ ضِدُّ الذَّكَاءِ»] وَالْجُبْنُ وَكُلُّ مَا يُنَفِّرُ عَنْ قَبُولِ الدَّعْوَةِ مِنْهُمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":109},{"type":"p","text":"   الشَّرْحُ أَنَّ الأَنْبِيَاءَ يَجِبُ لِكُلٍّ مِنْهُمْ أَنْ يَكُونَ بِهَذِهِ الأَخْلاقِ وَهِيَ الصِّدْقُ فَيَسْتَحِيلُ عَلَيْهِمُ الْكَذِبُ لِأَنَّ ذَلِكَ نَقْصٌ يُنَافِي مَنْصِبَ النُّبُوَّةِ وَأَمَّا قَوْلُ إِبْرَاهِيمَ عَلَيْهِ السَّلامُ عَنْ زَوْجَتِهِ سَارَةَ «إِنَّهَا أُخْتِي» وَهِيَ لَيْسَتْ أُخْتَهُ فِي النَّسَبِ فَكَانَ لِأَنَّهَا أُخْتُهُ فِي الدِّينِ فَهُوَ لَيْسَ كَذِبًا مِنْ حَيْثُ الْبَاطِنُ وَالْحَقِيقَةُ إِنَّمَا هُوَ صِدْقٌ. وَكَذَلِكَ وَرَدَ فِي أَمْرِ إِبْرَاهِيمَ فِي الْقُرْءَانِ الْكَريِمِ أَنَّهُ قَالَ ﴿بَلْ فَعَلَهُ كَبِيرُهُمْ هَذَا فَاسْأَلُوهُمْ إِنْ كَانُوا يَنْطِقُونَ﴾ [سُورَةَ الأَنْبِيَاء/63] وَلَيْسَ هَذَا كَذِبًا حَقِيقِيًّا بَلْ هَذَا صِدْقٌ مِنْ حَيْثُ الْبَاطِنُ وَالْحَقِيقَةُ لِأَنَّ كَبِيرَ الأَصْنَامِ هُوَ الَّذِي حَمَلَهُ عَلَى الْفَتْكِ بِهِمْ أَيِ الأَصْنَامِ الأُخْرَى مِنْ شِدَّةِ اغْتِيَاظِهِ مِنْهُ لِمُبَالَغَتِهِمْ فِي تَعْظِيمِهِ بِتَجْمِيلِ هَيْئَتِهِ وَصُورَتِهِ فَحَمَلَهُ ذَلِكَ عَلَى أَنْ يُكَسِّرَ الصِّغَارَ وَيُهِينَ الْكَبِيرَ فَيَكُونُ إِسْنَادُ الْفِعْلِ إِلَى الْكَبِيرِ إِسْنَادًا مَجَازِيًّا فَلا كَذِبَ فِي ذَلِكَ أَيْ هُوَ فِي الْحَقِيقَةِ لَيْسَ كَذِبًا وَأَمَّا حَدِيثُ «كَذَبَ إِبْرَاهِيمُ ثَلاثَ كَذَبَاتٍ» فَقَدِ اعْتَرَضَ عَلَيْهِ بَعْضُ الْعُلَمَاءِ وَأَوَّلَهُ بَعْضُهُمْ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":110},{"type":"p","text":"   وَالأَمَانَةُ فَيَسْتَحِيلُ عَلَيْهِمُ الْخِيَانَةُ فَلا يَكْذِبُونَ عَلَى النَّاسِ إِنْ طَلَبُوا مِنْهُمُ النَّصِيحَةَ وَلا يَأْكُلُونَ أَمْوَالَ النَّاسِ بِالْبَاطِلِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":111},{"type":"p","text":"   وَالْفَطَانَةُ فَكُلُّ الأَنْبِيَاءِ أَذْكِيَاءُ يَسْتَحِيلُ عَلَيْهِمُ الْغَبَاوَةُ أَيْ أَنْ يَكُونُوا ضُعَفَاءَ الأَفْهَامِ لِأَنَّ الْغَبَاوَةَ تُنَافِي مَنْصِبَهُمْ لِأَنَّهُمْ لَوْ كَانُوا أَغْبِيَاءَ لَنَفَرَ مِنْهُمُ النَّاسُ لِغَبَاوَتِهِمْ وَاللَّهُ حَكِيمٌ لا يَجْعَلُ النُّبُوَّةَ وَالرِّسَالَةَ فِي الأَغْبِيَاءِ فَإِنَّهُمْ أُرْسِلُوا لِيُبَلِّغُوا النَّاسَ مَصَالِحَ ءَاخِرَتِهِمْ وَدُنْيَاهُمْ وَالْبَلادَةُ تُنَافِي هَذَا الْمَطْلُوبَ مِنْهُمْ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":112},{"type":"p","text":"   وَيَسْتَحِيلُ عَلَى الأَنْبِيَاءِ الرَّذَالَةُ وَالسَّفَاهَةُ وَالْبَلادَةُ فَلَيْسَ فِي الأَنْبِيَاءِ مَنْ هُوَ رَذِيلٌ يَخْتَلِسُ النَّظَرَ إِلَى النِّسَاءِ الأَجْنَبِيَّاتِ بِشَهْوَةٍ مَثَلًا وَلَيْسَ فِيهِمْ مَنْ يَسْرِقُ وَلَوْ حَبَّةَ عِنَبٍ وَلَيْسَ فِي الأَنْبِيَاءِ مَنْ هُوَ سَفِيهٌ يَقُولُ أَلْفَاظًا شَنِيعَةً تَسْتَقْبِحُهَا النَّفْسُ وَلَيْسَ فِي الأَنْبِيَاءِ مَنْ هُوَ بَلِيدُ الذِّهْنِ عَاجِزٌ عَنْ إِقَامَةِ الْحُجَّةِ عَلَى مَنْ يُعَارِضُهُ بِالْبَيَانِ وَلا ضَعِيفُ الْفَهْمِ لا يَفْهَمُ الْكَلامَ مِنَ الْمَرَّةِ الأُولَى إِلَّا بَعْدَ أَنْ يُكَرَّرَ عَلَيْهِ عِدَّةَ مَرَّاتٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":113},{"type":"p","text":"   وَيَسْتَحِيلُ عَلَى الأَنْبِيَاءِ سَبْقُ اللِّسَانِ فِي الشَّرْعِيَّاتِ وَالْعَادِيَّاتِ لِأَنَّهُ لَوْ جَازَ عَلَيْهِمْ لَارْتَفَعَتِ الثِّقَةُ فِي صِحَّةِ مَا يَقُولُونَهُ وَلَقَالَ قَائِلٌ عِنْدَمَا يَبْلُغُهُ كَلامٌ عَنِ النَّبِيِّ مَا يُدْرِينَا أَنْ يَكُونَ قَالَهُ عَلَى وَجْهِ سَبْقِ اللِّسَانِ لِذَلِكَ لا يَصْدُرُ مِنْ نَبِيٍّ كَلامٌ غَيْرُ الَّذِي يُرِيدُ قَوْلَهُ وَلا يَصْدُرُ مِنْهُ كَلامٌ وَهُوَ لا يُرِيدُ الْكَلامَ بِالْمَرَّةِ كَمَا يَحْصُلُ لِمَنْ يَتَكَلَّمُ وَهُوَ نَائِمٌ. وَكَذَلِكَ يَسْتَحِيلُ عَلَيْهِمُ الأَمْرَاضُ الْمُنَفِّرَةُ كَخُرُوجِ الدُّودِ مِنَ الْجِسْمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":114},{"type":"p","text":"   وَكَذَلِكَ يَسْتَحِيلُ عَلَى الأَنْبِيَاءِ الْجُبْنُ أَمَّا الْخَوْفُ الطَّبِيعِيُّ فَلا يَسْتَحِيلُ عَلَيْهِمْ بَلِ الْخَوْفُ الطَّبِيعِيُّ مَوْجُودٌ فِيهِمْ وَذَلِكَ مِثْلُ النُّفُورِ مِنَ الْحَيَّةِ فَإِنَّ طَبِيعَةَ الإِنْسَانِ تَقْتَضِي النُّفُورَ مِنَ الْحَيَّةِ وَمَا أَشْبَهَ ذَلِكَ. وَلا يُقَالُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هَرَبَ لِأَنَّ هَرَبَ يُشْعِرُ بِالْجُبْنِ أَمَّا فَرَّ مِنَ الأَذَى مَثَلًا فَلا يُشْعِرُ بِالْجُبْنِ يُقَالُ هَاجَرَ فِرَارًا مِنَ الْكُفَّارِ أَيْ مِنْ أَذَى الْكُفَّارِ هَذَا جَائِزٌ مَا فِيهِ نَقْصٌ وَعَلَى هَذَا الْمَعْنَى قَوْلُ اللَّهِ تَعَالَى إِخْبَارًا عَنْ مُوسَى أَنَّهُ قَالَ ﴿فَفَرَرْتُ مِنْكُمْ لَمَّا خِفْتُكُمْ﴾.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":115},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَجِبُ لَهُمُ الْعِصْمَةُ مِنَ الْكُفْرِ وَالْكَبَائِرِ وَصَغَائِرِ الْخِسَّةِ قَبْلَ النُّبُوَّةِ وَبَعْدَهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":116},{"type":"p","text":"   الشَّرْحُ الأَنْبِيَاءُ مَعْصُومُونَ أَيْ مَحْفُوظُونَ مِنَ الْكُفْرِ قَبْلَ أَنْ يُوحَى إِلَيْهِمْ بِالنُّبُوَّةِ وَبَعْدَ ذَلِكَ أَيْضًا وَأَمَّا قَوْلُ سَيِّدِنَا إِبْرَاهِيمَ عَنِ الْكَوْكَبِ حِينَ رَءَاهُ ﴿هَذَا رَبِّي﴾ [سُورَةَ الأَنْعَام/76] فَهُوَ عَلَى تَقْدِيرِ الِاسْتِفْهَامِ الإِنْكَارِيِّ فَكَأَنَّهُ قَالَ أَهَذَا رَبِّي كَمَا تَزْعُمُونَ ثُمَّ لَمَّا غَابَ قَالَ ﴿لا أُحِبُّ الآفِلِينَ﴾ [سُورَةَ الأَنْعَام/76] أَيْ لا يَصْلُحُ أَنْ يَكُونَ هَذَا رَبًّا فَكَيْفَ تَعْتَقِدُونَ ذَلِكَ. وَلَمَّا لَمْ يَفْهَمُوا مَقْصُودَهُ بَلْ بَقُوا عَلَى مَا كَانُوا عَلَيْهِ قَالَ حِينَمَا رَأَى الْقَمَرَ مِثْلَ ذَلِكَ فَلَمَّا لَمْ يَجِدْ مِنْهُمْ بُغْيَتَهُ أَظْهَرَ لَهُمْ أَنَّهُ بَرِيءٌ مِنْ عِبَادَتِهِ وَأَنَّهُ لا يَصْلُحُ لِلرُّبُوبِيَّةِ ثُمَّ لَمَّا لَمْ يَرَ مِنْهُمْ بُغْيَتَهُ قَالَ حِينَمَا ظَهَرَتِ الشَّمْسُ ﴿هَذَا رَبِّي هَذَا أَكْبَرُ﴾ أَيْ عَلَى زَعْمِكُمْ فَلَمْ يَرَ مِنْهُمْ بُغْيَتَهُ أَيْضًا فَأَيِسَ مِنْهُمْ مِنْ عَدَمِ انْتِبَاهِهِمْ وَفَهْمِهِمْ لِلْمُرَادِ أَيْ أَنَّ هَذِهِ الثَّلاثَةَ لا تَصْلُحُ لِلأُلُوهِيَّةِ فَتَبَرَأَ مِمَّا هُمْ عَلَيْهِ مِنَ الشِّرْكِ ثُمَّ لَمْ يَمْكُثْ فِيهِمْ بَلْ ذَهَبَ إِلَى فِلَسْطِينَ فَأَقَامَ هُنَاكَ وَتُوُفِّيَ فِيهَا وَأَمَّا إِبْرَاهِيمُ فِي حَدِّ ذَاتِهِ فَكَانَ يَعْلَمُ قَبْلَ ذَلِكَ أَنَّ الرُّبُوبِيَّةَ لا تَكُونُ إِلَّا لِلَّهِ بِدَلِيلِ قَوْلِهِ تَعَالَى ﴿وَلَقَدْ ءَاتَيْنَا إِبْرَاهِيمَ رُشْدَهُ مِنْ قَبْلُ﴾. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":117},{"type":"p","text":"   وَالأَنْبِيَاءُ عَلَيْهِمُ السَّلامُ مَعْصُومُونَ مِنَ الْوُقُوعِ فِي الْمَعَاصِي الْكَبِيرَةِ وَكَذَلِكَ عَصَمَهُمُ اللَّهُ مِنَ التَّلَبُّسِ بِالذُّنُوبِ الصَّغِيرَةِ الَّتِي فِيهَا خِسَّةٌ وَدَنَاءَةٌ كَسَرِقَةِ حَبَّةِ عِنَبٍ فَإِنَّ هَذِهِ صَغِيرَةٌ لَكِنَّهَا تَدُلُّ عَلَى دَنَاءَةِ نَفْسٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":118},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجُوزُ عَلَيْهِمْ مَا سِوَى ذَلِكَ مِنَ الْمَعَاصِي لَكِنْ يُنَبَّهُونَ فَوْرًا لِلتَّوْبَةِ قَبْلَ أَنْ يَقْتَدِيَ بِهِمْ فِيهَا غَيْرُهُمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":119},{"type":"p","text":"   الشَّرْحُ الصَّغَائِرُ الَّتِي لَيْسَ فِيهَا خِسَّةٌ وَدَنَاءَةٌ تَجُوزُ عَلَى الأَنْبِيَاءِ وَيَدُلُّ عَلَى جَوَازِ حُصُولِ ذَلِكَ مِنْهُمْ ءَايَاتٌ مِنْهَا قَوْلُهُ تَعَالَى ﴿وَعَصَى ءَادَمُ رَبَّهُ فَغَوَى﴾ وَقَوْلُهُ تَعَالَى عَنْ إِبْرَاهِيمَ عَلَيْهِ السَّلامُ أَنَّهُ قَالَ ﴿وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ﴾ وَلَكِنَّ الأَنْبِيَاءَ إِنْ حَصَلَ مِنْهُمْ شَىْءٌ مِنَ الْمَعَاصِي الصَّغِيرَةِ الَّتِي لَيْسَ فِيهَا خِسَّةٌ وَلا دَنَاءَةٌ يُنَبَّهُونَ فَوْرًا لِلتَّوْبَةِ فَيَتُوبُونَ قَبْلَ أَنْ يَقْتَدِيَ بِهِمْ فِي تِلْكَ الصَّغِيرَةِ غَيْرُهُمْ فَيَفْعَلَ مِثْلَمَا فَعَلُوا لِأَنَّهُمْ قُدْوَةٌ لِلنَّاسِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":120},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَمِنْ هُنَا يُعْلَمُ أَنَّ النُّبُوَّةَ لا تَصِحُّ لإِخْوَةِ يُوسُفَ الَّذِينَ فَعَلُوا تِلْكَ الأَفَاعِيلَ الْخَسِيسَةَ وَهُمْ مَنْ سِوَى بِنْيَامِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":121},{"type":"p","text":"   الشَّرْحُ مِنْ هَذَا الَّذِي ذَكَرْنَاهُ يُعْلَمُ أَنَّهُ لا تَصِحُّ النُّبُوَّةُ لإِخْوَةِ يُوسُفَ وَهُمُ الْعَشَرَةُ الَّذِينَ فَعَلُوا تِلْكَ الأَفَاعِيلَ الْخَسِيسَةَ مِنْ ضَرْبِهِمْ يُوسُفَ وَرَمْيهِمْ لَهُ فِي الْبِئْرِ وَتَسْفِيهِهِمْ أَبَاهُمْ بِقَوْلِهِمْ ﴿إِنَّكَ لَفِي ضَلالِكَ الْقَدِيمِ﴾ [سُورَةَ يُوسُف/95] وَنَحْوِ ذَلِكَ وَهُمْ مَنْ عَدا بِنْيَامِينَ أَيْ لَيْسَ بِنْيَامِينُ مِنْ هَؤُلاءِ الْعَشَرَةِ.    ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":122},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالأَسْبَاطُ الَّذِينَ أُنْزِلَ عَلَيْهِمُ الْوَحْيُ هُمْ مَنْ نُبِّئَ مِنْ ذُرِّيَّتِهِمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":123},{"type":"p","text":"   الشَّرْحُ الأَسْبَاطُ الَّذِينَ ذَكَرَهُمُ اللَّهُ فِي الْقُرْءَانِ أَنَّهُ أُنْزِلَ عَلَيْهِمُ الْوَحْيُ هُمْ غَيْرُ هَؤُلاءِ الَّذِينَ ءَاذَوْا سَيِّدَنَا يُوسُفَ بَلْ هُمْ مِنْ ذُرِّيَّتِهِمْ لِأَنَّ ذُرِّيَّتَهُمْ مِنْهُمْ مَنْ أُوتِيَ النُّبُوَّةَ. وَالسِّبْطُ لُغَةً يُطْلَقُ عَلَى الْوَلَدِ وَوَلَدِ الْوَلَدِ. قَالَ تَعَالَى ﴿قُولُوا ءَامَنَّا بِاللَّهِ وَمَآ أُنْزِلَ إِلَيْنَا وَمَا أُنْزِلَ إِلَى إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ وَالأَسْبَاطِ وَمَا أُوتِيَ مُوسَى وَعِيسَى وَمَا أُوتِيَ النَّبِيُّونَ مِنْ رَّبِّهِمْ لا نُفَرِّقُ بَيْنَ أَحَدٍ مِّنْهُمْ وَنَحْنُ لَهُ مُسْلِمُونَ﴾ [سُورَةَ الْبَقَرَةِ/136].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":124}]},{"id":"apostasy","title":"أَحْكَامُ الرِّدَّةِ","description":"الفصول الواردة في أحكام الردة وما يتصل بحفظ الإسلام.","icon":"fa-shield-halved","start":125,"end":246,"paragraphCount":120,"wordCount":7352,"readMinutes":41,"blocks":[{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":125},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَحْكَامِ الرِّدَّةِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":126},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ عَلَى كُلِّ مُسْلِمٍ حِفْظُ إِسْلامِهِ وَصَوْنُهُ عَمَّا يُفْسِدُهُ وَيُبْطِلُهُ وَيَقْطَعُهُ وَهُوَ الرِّدَّةُ وَالْعِيَاذُ بِاللَّهِ تَعَالَى قَالَ النَّوَوِيُّ وَغَيْرُهُ الرِّدَّةُ أَفْحَشُ أَنْوَاعِ الْكُفْرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":127},{"type":"p","text":"   الشَّرْحُ أَنَّ الرِّدَّةَ أَقْبَحُ أَنْوَاعِ الْكُفْرِ لِأَنَّ الرِّدَّةَ تُذْهِبُ كُلَّ الْحَسَنَاتِ وَتَبْقَى السَّيِّئَاتُ. وَلَوْ رَجَعَ إِلَى الإِسْلامِ بَعْدَ ذَلِكَ لا تَرْجِعُ لَهُ الْحَسَنَاتُ الَّتِي كَانَ عَمِلَهَا وَتَبْقَى السَّيِّئَاتُ فَإِنْ تَابَ مِنْهَا ذَهَبَتْ. وَلَيْسَ مَعْنَى «الرِّدَّةُ أَفْحَشُ أَنْوَاعِ الْكُفْرِ» أَنَّ كُلَّ أَنْوَاعِ الرِّدَّةِ أَشَدُّ مِنْ كُفْرِ الْكَافِرِ الأَصْلِيِّ لِأَنَّ كُفْرَ الْكَافِرِ الأَصْلِيِّ قَدْ يَكُونُ أَشَدَّ مِنْ كُفْرِ الْمُرْتَّدِ فَلَيْسَ مَعْنَى قَوْلِ النَّوَوِيِّ الْمَذْكُورِ أَنَّ الرِّدَّةَ أَشَدُّ أَنْوَاعِ الْكُفْرِ كُفْرًا إِنَّمَا مُرَادُهُ شِدَّةُ قُبْحِهَا فِي أَنَّهَا خُرُوجٌ مِنَ الإِسْلامِ الَّذِي هُوَ الْحَقُّ إِلَى الْكُفْرِ الَّذِي هُوَ بَاطِلٌ. وَإِنَّمَا أَشَدُّ أَنْوَاعِ الْكُفْرِ التَّعْطِيلُ وَهُوَ قَوْلُ الْمُلْحِدِ «لا إِلَهَ وَالْحَيَاةُ مَادَّةٌ» وَقَوْلُ أَهْلِ الْوَحْدَةِ إِنَّ اللَّهَ هُوَ جُمْلَةُ الْعَالَمِ وَعَقِيدَةُ الْحُلُولِ أَيْ أَنَّ اللَّهَ يَحُلُّ فِي غَيْرِهِ كَالْيَشْرُطِيَّةِ الْقَائِلِينَ بِأَنَّ اللَّهَ يَدْخُلُ فِي كُلِّ شَخْصٍ ذَكَرٍ أَوْ أُنْثَى حَتَّى قَالَ قَائِلُهُمْ فِي بَعْضِ الأَشْخَاصِ أَنْتَ اللَّهُ وَهَذَا الْجِدَارُ اللَّهُ وَهُمْ فِرْقَةٌ مِنْ مُتَأَخِّرِي الشَّاذِلِيَّةِ انْحَرَفُوا عَنْ أُصُولِ التَّوْحِيدِ الَّذِي هُوَ عَقِيدَةُ كُلِّ مَشَايِخِ أَهْلِ اللَّهِ الَّذِينَ عَمِلُوا الطُّرُقَ كَالسَّيِّدِ أَحْمَدَ الرِّفَاعِيِّ وَالشَّيْخِ عَبْدِ الْقَادِرِ الْجَيْلانِيِّ وَالشَّيْخِ أَبِي الْحَسَنِ الشَّاذِلِيِّ وَالشَّيْخِ أَبِي مَدْيَنَ شُعَيْبِ بنِ الْحُسَيْنِ وَغَيْرِهِمْ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":128},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَدْ كَثُرَ فِي هَذَا الزَّمَانِ التَّسَاهُلُ فِي الْكَلامِ حَتَّى إِنَّهُ يَخْرُجُ مِنْ بَعْضِهِمْ أَلْفَاظٌ تُخْرِجُهُمْ عَنِ الإِسْلامِ وَلا يَرَوْنَ ذَلِكَ ذَنْبًا فَضْلًا عَنْ كَوْنِهِ كُفْرًا وَذَلِكَ مِصْدَاقُ قَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ لا يَرَى بِهَا بِأْسًا يَهْوِي بِهَا فِي النَّارِ سَبْعِينَ خَرِيفًا» أَيْ مَسَافَةَ سَبْعِينَ عَامًا فِي النُّزُولِ وَذَلِكَ مُنْتَهَى جَهَنَّمَ وَهُوَ خَاصٌ بِالْكُفَّارِ. وَالْحَدِيثُ رَوَاهُ التِّرْمِذِيُّ وَحَسَّنَهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":129},{"type":"p","text":"   الشَّرْحُ فِي هَذَا الزَّمَانِ كَثِيرٌ مِنَ النَّاسِ يُطْلِقُونَ أَلْسِنَتَهُمْ بِالْكَلامِ الْفَاسِدِ الْمُخْرِجِ مِنَ الإِسْلامِ وَلا يَرَوْنَ ذَلِكَ خُرُوجًا مِنَ الإِسْلامِ وَهَذَا الَّذِي يَحْصُلُ مِنْ بَعْضِ النَّاسِ مِصْدَاقُ قَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ لا يَرَى بِهَا بَأْسًا يَهْوِي بِهَا فِي النَّارِ سَبْعِينَ خَرِيفًا» أَيْ أَنَّ الإِنْسَانَ قَدْ يَتَكَلَّمُ بِكَلِمَةٍ لا يَرَاهَا ضَارَّةً لَهُ وَلا يَعْتَبِرُهَا مَعْصِيَةً يَسْتَوْجِبُ بِهَا النُّزُولَ إِلَى قَعْرِ جَهَنَّمَ الَّذِي هُوَ مَحَلُّ الْكُفَّارِ لِأَنَّهُ لا يَصِلُ إِلَى قَعْرِ جَهَنَّمَ الَّذِي هُوَ مَسَافَةُ سَبْعِينَ عَامًا فِي النُّزُولِ عُصَاةُ الْمُسْلِمِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":130},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَفِي مَعْنَاهُ حَدِيثٌ رَوَاهُ الْبُخَارِيُّ وَمُسْلِمٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":131},{"type":"p","text":"   الشَّرْحُ الْحَدِيثُ هُوَ «إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ مَا يَتَبَيَّنُ فِيهَا يَزِلُّ بِهَا فِي النَّارِ أَبْعَدَ مِمَّا بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ» رَوَاهُ الشَّيْخَانِ الْبُخَارِيُّ وَمُسْلِمٌ فَحَدِيثُ التِّرْمِذِيِّ مُفَسِّرٌ لِحَدِيثِ الشَّيْخَيْنِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":132},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَهَذَا الْحَدِيثُ دَلِيلٌ عَلَى أَنَّهُ لا يُشْتَرَطُ فِي الْوُقُوعِ فِي الْكُفْرِ مَعْرِفَةُ الْحُكْمِ وَلا انْشِرَاحُ الصَّدْرِ وَلا اعْتِقَادُ مَعْنَى اللَّفْظِ كَمَا يَقُولُ كِتَابُ فِقْهِ السُّنَّةِ. وَكَذَلِكَ لا يُشْتَرَطُ فِي الْوُقُوعِ فِي الْكُفْرِ عَدَمُ الْغَضَبِ كَمَا أَشَارَ إِلَى ذَلِكَ النَّوَوِيُّ قَالَ «لَوْ غَضِبَ رَجُلٌ عَلَى وَلَدِهِ أَوْ غُلامِهِ فَضَرَبَهُ ضَرْبًا شَدِيدًا فَقَالَ لَهُ رَجُلٌ أَلَسْتَ مُسْلِمًا فَقَالَ لا مُتَعَمِّدًا كَفَرَ» وَقَالَهُ غَيْرُهُ مِنْ حَنَفِيَّةٍ وَغَيْرِهِمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":133},{"type":"p","text":"   الشَّرْحُ هَذَا مَعْنَاهُ أَنَّ الإِنْسَانَ قَدْ يَخْرُجُ مِنَ الإِسْلامِ مِنْ غَيْرِ أَنْ يَقْصِدَ الْخُرُوجَ مِنْهُ وَمِنْ غَيْرِ أَنْ يَسْتَبْدِلَ بِهِ دِينًا غَيْرَهُ كَمَا هُوَ حَالُ كَثِيرٍ مِمَّنْ يَدَّعُونَ التَّصَوُّفَ وَهُمْ يَتَخَبَّطُونَ فِي الْكُفْرِ أَيْ أَنَّ الشَّخْصَ الَّذِي يَتَلَفَّظُ بِالْكُفْرِ الصَّرِيحِ يُحْكَمُ عَلَيْهِ بِالْكُفْرِ سَوَاءٌ عَرَفَ أَنَّ هَذَا الْقَوْلَ كُفْرٌ أَمْ لَمْ يَعْرِفْ إِنَّمَا الشَّرْطُ مَعْرِفَةُ مَعْنَى اللَّفْظِ. وَكَذَلِكَ لَيْسَ شَرْطًا أَنْ يَعْتَقِدَ بِقَلْبِهِ مَعْنَى هَذَا اللَّفْظِ بَلْ بِمُجَرَّدِ أَنَّهُ قَالَ ذَلِكَ بِإِرَادَةٍ وَهُوَ يَفْهَمُ الْمَعْنَى كَفَرَ وَخَرَجَ مِنَ الإِسْلامِ. وَقَدْ شَذَّ سَيِّدُ سَابِق فَإِنَّ لَهُ كِتَابًا سَمَّاهُ «فِقْهَ السُّنَّةِ» يَقُولُ فِيهِ فِي كِتَابِ الرِّدَّةِ إِنَّ الْمُسْلِمَ لا يُعْتَبَرُ خَارِجًا عَنِ الإِسْلامِ وَلا يُحْكَمُ عَلَيْهِ بِالرِّدَّةِ إِلَّا إِذَا انْشَرَحَ صَدْرُهُ بِالْكُفْرِ وَاطْمَأَنَ قَلْبُهُ وَدَخَلَ فِي دِينٍ غَيْرِ الإِسْلامِ بِالْفِعْلِ اهـ وَيَكْفِي فِي الرَّدِّ عَلَيْهِ الْحَدِيثُ الَّذِي رَوَاهُ الْبُخَارِيُّ وَمُسْلِمٌ وَالْحَدِيثُ الَّذِي رَوَاهُ التِّرْمِذِيُّ وَقَدْ مَرَّ ذِكْرُهُمَا ءَانِفًا وَمَوْضِعُ الشَّاهِدِ فِيهِ قَوْلُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا يَرَى بِهَا بَأْسًا» أَيْ لِأَنَّهُ يَدُلُّ عَلَى أَنَّ مِنَ الْكَلامِ مَا يُخْرِجُ الإِنْسَانَ مِنَ الإِسْلامِ مِنْ غَيْرِ فَرْقٍ بَيْنَ أَنْ يَكُونَ مُنْشَرِحَ الْبَالِ وَأَنْ يَكُونَ غَيْرَ مُنْشَرِحِ الْبَالِ لِذَلِكَ الْقَوْلِ. وَلَيْسَ فِي قَوْلِ اللَّهِ تَعَالَى ﴿مَنْ كَفَرَ بِاللَّهِ مِنْ بَعْدِ إِيمَانِهِ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالإِيْمَانِ وَلَكِنْ مَّنْ شَرَحَ بِالْكُفْرِ صَدْرًا فَعَلَيْهِمْ غَضَبٌ مِّنَ اللَّهِ﴾ [سُورَةَ النَّحْل/106] دَلِيلٌ عَلَى مَا ادَّعَاهُ سَيِّدُ سَابِق لِأَنَّ هَذَا وَرَدَ فِي الْمُكْرَهِ عَلَى كَلِمَةِ الْكُفْرِ فَإِنَّهُ لا يَكْفُرُ إِنْ كَانَ نُطْقُهُ بِالْكُفْرِ بِدُونِ انْشِرَاحِ صَدْرٍ لِذَلِكَ الْكُفْرِ وَإِنَّمَا يَكْفُرُ هَذَا الْمُكْرَهُ إِنِ انْشَرَحَ صَدْرُهُ حَالَةَ النُّطْقِ بِالْكُفْرِ لِمَا قَالَهُ مِنَ الْكُفْرِ كَمَا جَاءَ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ قَالَ لِعَمَّارِ بنِ يَاسِرٍ «هَلْ كُنْتَ شَارِحًا صَدْرَكَ حِينَ قُلْتَ مَا قُلْتَ أَمْ لا» فَقَالَ لا رَوَاهُ الإِمَامُ ابْنُ الْمُنْذِرِ فِي كِتَابِهِ الإِشْرَافِ فَحَرَّفَ هَذَا الرَّجُلُ سَيِّدُ سَابِق كَلامَ اللَّهِ تَعَالَى وَقَالَ مَا لَمْ يَقُلْهُ عَالِمٌ قَطُّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":134},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالرِّدَّةُ ثَلاثَةُ أَقْسَامٍ كَمَا قَسَّمَهَا النَّوَوِيُّ وَغَيْرُهُ مِنْ شَافِعِيَّةٍ وَحَنَفِيَّةٍ وَغَيْرِهِمْ اعْتِقَادَاتٌ وَأَفْعَالٌ وَأَقْوَالٌ وَكُلٌّ يَتَشَعَّبُ شُعَبًا كَثِيرَةً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":135},{"type":"p","text":"   الشَّرْحُ الرِّدَّةُ هِيَ قَطْعُ الإِسْلامِ وَتَحْصُلُ تَارَةً بِالْقَوْلِ وَتَارَةً بِالْفِعْلِ وَتَارَةً بِالِاعْتِقَادِ كَمَا نَصَّ عَلَى ذَلِكَ الشَّافِعِيَّةُ وَالْحَنَفِيَّةُ وَالْمَالِكِيَّةُ وَالْحَنَابِلَةُ وَقَدِ اسْتَدَلُّوا عَلَى هَذَا التَّقْسِيمِ بِالْقُرْءَانِ الْكَريْمِ كَقَوْلِهِ تَعَالَى ﴿يَحْلِفُونَ بِاللَّهِ مَا قَالُوا وَلَقَدْ قَالُوا كَلِمَةَ الْكُفْرِ وَكَفَرُوا بَعْدَ إِسْلامِهِمْ﴾ [سُورَةَ التَّوْبَة/74] فَإِنَّ هَذِهِ الآيَةَ يُفْهَمُ مِنْهَا أَنَّ الْكُفْرَ مِنْهُ قَوْلِيٌّ وَقَوْلِهِ تَعَالَى ﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ ءَامَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾ [سُورَةَ الْحُجُرَات/15] أَيْ لَمْ يَشُكُّوا وَيُفْهَمُ مِنْهُ أَنَّ الْكُفْرَ مِنْهُ اعْتِقَادِيٌّ لِأَنَّ الِارْتِيَابَ أَيِ الشَّكَّ يَكُونُ بِالْقَلْبِ وَقَوْلِهِ تَعَالَى ﴿وَمِنْ ءايَاتِهِ اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ لا تَسْجُدُوا لِلشَّمْسِ وَلا لِلْقَمَرِ وَاسْجُدُوا لِلَّهِ الَّذِي خَلَقَهُنَّ إِنْ كُنْتُمْ إِيَّاهُ تَعْبُدُونَ﴾ [سُورَةَ فُصِّلَتْ/37] يُفْهَمُ مِنْهُ أَنَّ الْكُفْرَ مِنْهُ فِعْلِيٌّ وَهَذَا التَّقْسِيمُ اتَّفَقَ عَلَيْهِ عُلَمَاءُ الْمَذَاهِبِ الأَرْبَعَةِ بَلْ هُوَ مُجْمَعٌ عَلَيْهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":136},{"type":"p","text":"   وَلْيُعْلَمْ أَنَّ مِنَ الِاعْتِقَادَاتِ مَا إِذَا طَرَأَ لِلإِنْسَانِ يُخْرِجُهُ مِنَ الإِسْلامِ فَمِنْ هَذِهِ الِاعْتِقَادَاتِ اعْتِقَادُ أَنَّ الْعَالَمَ أَزَلِيٌّ بِنَوْعِهِ وَتَرْكِيبِهِ أَوْ بِنَوْعِهِ فَقَطْ أَوِ اعْتِقَادُ مَا يُوجِبُ الْحُدُوثَ فِي اللَّهِ تَعَالَى كَاعْتِقَادِ أَنَّ مَشِيئَتَهُ حَادِثَةٌ تَحْدُثُ لَهُ أَوْ أَنَّهُ تَحْدُثُ لَهُ مَشِيئَةُ شَىْءٍ بَعْدَ أَنْ لَمْ يَكُنْ شَائِيًا لَهُ أَوْ أَنَّ عِلْمَهُ حَادِثٌ أَوْ أَنَّهُ يَحْدُثُ لَهُ عِلْمُ شَىْءٍ بَعْدَ أَنْ لَمْ يَكُنْ عَالِمًا بِهِ لِأَنَّ حُدُوثَ صِفَةٍ فِي اللَّهِ يَسْتَلْزِمُ حُدُوثَ ذَاتِهِ وَالْحُدُوثُ يُنَافِي الأُلُوهِيَّةَ. وَكَذَلِكَ اعْتِقَادُ اللَّوْنِ فِي اللَّهِ تَعَالَى وَكَذَلِكَ اعْتِقَادُ الْحَرَكَةِ وَالسُّكُونِ فِي اللَّهِ تَعَالَى لِأَنَّهُ لَوْ كَانَ سَاكِنًا لَكَانَ لَهُ أَمْثَالٌ لا تُحْصَى وَلَوْ كَانَ مُتَحَرِّكًا لَكَانَ لَهُ أَمْثَالٌ لا تُحْصَى وَهَذَا يُنَافِي قَوْلَهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11]. وَلْيُعْلَمْ أَيْضًا أَنَّ مِنَ الأَفْعَالِ مَا يُخْرِجُ الإِنْسَانَ مِنَ الإِسْلامِ وَمِنْ ذَلِكَ إِلْقَاءُ الْمُصْحَفِ فِي الْقَاذُورَاتِ وَالسُّجُودُ لِصَنَمٍ وَهُوَ مَا يَعْبُدُهُ الْكُفَّارُ مِنْ حَجَرٍ كَانَ أَوْ مِنْ حَدِيدٍ أَوْ ذَهَبٍ أَوْ فِضَّةٍ أَوْ نَحْوِ ذَلِكَ فَالسُّجُودُ لَهُ كُفْرٌ وَلَوْ كَانَ الشَّخْصُ مَازِحًا وَكَذَلِكَ الشَّمْسُ مَنْ سَجَدَ لَهَا يَكْفُرُ وَكَذَلِكَ الْقَمَرُ وَكَذَلِكَ يَكْفُرُ مَنْ سَجَدَ لإِنْسَانٍ عَلَى وَجْهِ الْعِبَادَةِ لَهُ. وَمِنَ الأَفْعَالِ الْكُفْرِيَّةِ أَيْضًا كِتَابَةُ الْقُرْءَانِ بِالْبَوْلِ وَالدَّوْسُ عَمْدًا عَلَى الْكُتُبِ الشَّرْعِيَّةِ مَعَ الْعِلْمِ بِأَنَّهَا كُتُبُ شَرْعٍ. وَأَمَّا الأَقْوَالُ الَّتِي تُخْرِجُ صَاحِبَهَا مِنَ الإِسْلامِ فَهِيَ أَكْثَرُ وَأَكْثَرُ كَمَا يَدُلُّ عَلَى ذَلِكَ قَوْلُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «أَكْثَرُ خَطَايَا ابْنِ ءَادَمَ مِنْ لِسَانِهِ» رَوَاهُ الطَّبَرَانِيُّ بِإِسْنَادٍ صَحِيحٍ مِنْ حَدِيثِ عَبْدِ اللَّهِ بنِ مَسْعُودٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":137},{"type":"p","text":"   وَكُلُّ قِسْمٍ مِنْ هَؤُلاءِ الثَّلاثَةِ يُخْرِجُ مِنَ الإِسْلامِ بِمُفْرَدِهِ مِنْ غَيْرِ أَنْ يَنْضَمَّ إِلَيْهِ قِسْمٌ ءَاخَرُ أَيْ أَنَّ الأَقْوَالَ الْكُفْرِيَّةَ تُخْرِجُ مِنَ الإِسْلامِ مِنْ دُونِ أَنْ يَقْتَرِنَ بِهَا اعْتِقَادٌ أَوْ فِعْلٌ، هَذَا مَا اتَّفَقَ عَلَيْهِ الْعُلَمَاءُ وَأَجْمَعُوا عَلَيْهِ فَلا الْتِفَاتَ إِلَى مَا خَالَفَ ذَلِكَ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":138},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَمِنَ الأَوَّلِ الشَّكُّ فِي اللَّهِ أَوْ فِي رَسُولِهِ أَوِ الْقُرْءَانِ أَوِ الْيَوْمِ الآخِرِ أَوِ الْجَنَّةِ أَوِ النَّارِ أَوِ الثَّوَابِ أَوِ الْعِقَابِ أَوْ نَحْوِ ذَلِكَ مِمَّا هُوَ مُجْمَعٌ عَلَيْهِ أَوِ اعْتِقَادُ قِدَمِ الْعَالَمِ وَأَزَلِيَّتِهِ بِجِنْسِهِ وَتَرْكِيبِهِ أَوْ بِجِنْسِهِ فَقَطْ أَوْ نَفْيُ صِفَةٍ مِنَ صِفَاتِ اللَّهِ الْوَاجِبَةِ لَهُ إِجْمَاعًا كَكَوْنِهِ عَالِمًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":139},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ طَرَأَ لَهُ الشَّكُّ فِي وُجُودِ اللَّهِ كَفَرَ وَكَذَلِكَ يَكْفُرُ مَنْ شَكَّ فِي رِسَالَةِ رَسُولٍ مِنْ رُسُلِ اللَّهِ رِسَالَتُهُ مَعْلُومَةٌ مِنَ الدِّينِ بِالضَّرُورَةِ أَوْ شَكَّ فِي نُزُولِ الْقُرْءَانِ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَوْ شَكَّ فِي الْيَوْمِ الآخِرِ أَوِ الْجَنَّةِ أَوِ النَّارِ أَنَّ هَذَا هَلْ يَكُونُ أَوْ لا وَلَيْسَ الْمُرَادُ أَنَّ مُطْلَقَ التَّرَدُّدِ هَلِ الْجَنَّةُ أَوِ النَّارُ مَوْجُودَتَانِ الآنَ كُفْرٌ لِأَنَّ ذَلِكَ لَيْسَ مَعْلُومًا مِنَ الدِّينِ بِالضَّرُورَةِ وَأَهْلُ الْحَقِّ عَلَى أَنَّ الْجَنَّةَ وَالنَّارَ مَخْلُوقَتَانِ مَوْجُودَتَانِ الآنَ. وَمِنَ الْكُفْرِ أَيْضًا اعْتِقَادُ قِدَمِ الْعَالَمِ وَأَزَلِيَّتِهِ بِجِنْسِهِ وَأَفْرَادِهِ كَمَا قَالَتْ قُدَمَاءُ الْفَلاسِفَةِ أَوْ بِجِنْسِهِ فَقَطْ كَمَا قَالَ ابْنُ تَيْمِيَةَ وَوَافَقَ فِيهِ الْفَلاسِفَةَ الْمُحْدَثِينَ وَأَجْمَعَ الْمُسْلِمُونَ عَلَى كُفْرِ الْفَرِيقَيْنِ نَقَلَ ذَلِكَ الْمُحَدِّثُ الْفَقِيهُ الأُصُولِيُّ بَدْرُ الدِّينِ الزَّرْكَشِيُّ فِي تَشْنِيفِ الْمَسَامِعِ كَمَا تَقَدَّمَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":140},{"type":"p","text":"   وَكَذَلِكَ يَكْفُرُ مَنْ أَنْكَرَ صِفَةً مِنْ صِفَاتِ اللَّهِ تَعَالَى الْوَاجِبَةِ لَهُ إِجْمَاعًا كَصِفَةِ الْعِلْمِ وَالْحَيَاةِ وَالسَّمْعِ وَالْبَصَرِ وَالْقُدْرَةِ وَلا يُعْذَرُ أَحَدٌ بِالْجَهْلِ فِي ذَلِكَ. قَالَ الْحَافِظُ ابْنُ الْجَوْزِيِّ مَنْ نَفَى قُدْرَةَ اللَّهِ عَلَى كُلِّ شَىْءٍ كَافِرٌ بِالِاتِّفَاقِ اهـ أَيْ بِلا خِلافٍ فَإِنَّ الْعَقْلَ لَوْ لَمْ يَرِدْ نَصٌ بِإِثْبَاتِ الصِّفَاتِ الثَّلاثَ عَشْرَةَ يُدْرِكُ ثُبُوتَ الْقُدْرَةِ الشَّامِلَةِ لِلَّهِ وَالْعِلْمِ الشَّامِلِ وَالإِرَادَةِ الشَّامِلَةِ وَوُجُوبَ السَّمْعِ وَالْبَصَرِ لَهُ عَلَى مَا يَلِيقُ بِهِ وَهَكَذَا بَقِيَّةُ الصِّفَاتِ الثَّلاثَ عَشْرَةَ أَمَّا الْوَجْهُ وَالْيَدُ وَالْعَيْنُ وَنَحْوُهَا مِمَّا وَرَدَ فِي النُّصُوصِ إِطْلاقُهُ عَلَى اللَّهِ صِفَاتٍ لا جَوَارِحَ فَإِنَّ ذَلِكَ لا يُدْرَكُ بِالْعَقْلِ فَلا يَكْفُرُ مُنْكِرُ هَذِهِ الصِّفَاتِ جَهْلًا وَلْنَضْرِبْ لِذَلِكَ مِثَالًا شَخْصٌ سَمِعَ إِضَافَةَ الْعَيْنِ وَالْيَدِ إِلَى اللَّهِ تَعَالَى فَأَنْكَرَ لِأَنَّهُ لَمْ يَسْمَعْ بِأَنَّ النَّصَّ وَرَدَ بِذَلِكَ فَإِنَّهُ لا يُكَفَّرُ بَلْ يُعَلَّمُ أَنَّ هَذَا مِمَّا وَرَدَ بِهِ النَّصُّ فَإِنْ أَنْكَرَ بَعْدَ عِلْمِهِ بِوُرُودِ النَّصِّ فِي ذَلِكَ كُفِّرَ وَكَذَلِكَ مَنْ أَنْكَرَ أَنَّ الْمُؤْمِنَ [وَهُوَ الَّذِي يَصْدُقُ عِبَادَهُ وَعْدَهُ وَيَفِي بِمَا ضَمِنَهُ لَهُمْ مِنْ رِزْقٍ فِي الدُّنْيَا وَثَوَابٍ عَلَى أَعْمَالِهِمُ الْحَسَنَةِ فِي الآخِرَةِ] مِنْ أَسْمَاءِ اللَّهِ لِأَنَّهُ لَمْ يَعْلَمْ أَنَّ فِي الْقُرْءَانِ تَسْمِيَةَ اللَّهِ بِذَلِكَ فَلا يَكْفُرُ بَلْ يُقَالُ لَهُ هَذَا وَرَدَ شَرْعًا تَسْمِيَتُهُ بِهِ فِي قَوْلِهِ تَعَالَى ﴿هُوَ اللَّهُ الَّذِي لا إِلَهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلامُ الْمُؤْمِنُ﴾ [سُورَةَ الْحَشْرِ] الآيَةَ. فَإِذَا قِيلَ لِشَخْصٍ إِنَّ لِلَّهِ وَجْهًا وَيَدًا وَعَيْنًا فَأَنْكَرَ وَقَالَ «لا يَجُوزُ هَذَا غَيْرُ صَحِيحٍ» لِأَنَّهُ مَا عَلِمَ وُرُودَ إِضَافَةِ هَذَا فِي النُّصُوصِ الشَّرْعِيَّةِ إِلَى اللَّهِ فَلا يُكَفَّرُ إِنَّمَا يُكَفَّرُ مَنْ نَفَى ذَلِكَ بَعْدَ عِلْمِهِ بِثُبُوتِهِ فِي النَّصِّ أَمَّا إِنْ لَمْ يَعْلَمْ بِذِكْرِ ذَلِكَ فِي الْقُرْءَانِ وَالْحَدِيثِ فَإِنَّهُ يُقَالُ لَهُ هَذَا وَرَدَ ذِكْرُهُ فِي الْقُرْءَانِ وَالْحَدِيثِ فَيَجِبُ عَلَيْكَ أَنْ تُصَدِّقَ بِذَلِكَ عَلَى مَعْنَى أَنَّ الْوَجْهَ لَيْسَ جَارِحَةً كَوَجْهِ الْخَلْقِ أَيْ لَيْسَ حَجْمًا وَعَلَى أَنَّ عَيْنَ اللَّهِ لَيْسَتْ جَارِحَةً كَعَيْنِ الْخَلْقِ وَعَلَى أَنَّ يَدَ اللَّهِ لَيْسَتْ جَارِحَةً كَيَدِ الْخَلْقِ فَيُعَلَّمُ بِأَنَّ وَجْهَ اللَّهِ وَيَدَهُ وَعَيْنَهُ لَيْسَتْ جَوَارِحَ لِأَنَّ اللَّهَ مُنَزَّهٌ عَنِ الْجَوَارِحِ وَمَنِ اعْتَقَدَ أَنَّ لِلَّهِ وَجْهًا أَوْ عَيْنًا أَوْ يَدًا بِمَعْنَى الْجَارِحَةِ كَافِرٌ، فَإِذَا عُرِفَ هَذَا عُلِمَ أَنَّهُ لا يُعْذَرُ أَحَدٌ فِي الْجَهْلِ بِقُدْرَةِ اللَّهِ عَلَى كُلِّ شَىْءٍ وَنَحْوِهَا مِنْ صِفَاتِهِ مَهْمَا بَلَغَ الْجَهْلُ بِصَاحِبِهِ، وَكُنْ عَلَى ذُكْرٍ وَاسْتِحْضَارٍ لِنَقْلِ ابْنِ الْجَوْزِيِّ الإِجْمَاعَ عَلَى هَذَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":141},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ نِسْبَةُ مَا يَجِبُ تَنْزِيهُهُ عَنْهُ إِجْمَاعًا كَالْجِسْمِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":142},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ نَسَبَ إِلَى اللَّهِ الْجِسْمِيَّةَ وَاعْتَقَدَ أَنَّهُ جِسْمٌ أَوْ قَالَ ذَلِكَ كَفَرَ. وَالْجِسْمُ هُوَ كُلُّ شَىْءٍ لَهُ طُولٌ وَعَرْضٌ وَعُمْقٌ كَبُرَ كَالْعَرْشِ أَوْ صَغُرَ كَالْخَرْدَلَةِ وَكَذَلِكَ مَا كَانَ دُونَ الْخَرْدَلَةِ كَالْهَبَاءِ وَهُوَ مَا يُرَى فِي ضَوْءِ الشَّمْسِ النَّافِذِ مِنَ الْكَوَّةِ الْمَوْجُودَةِ فِي الْجِدَارِ وَمَا هُوَ أَصْغَرُ مِنْ ذَلِكَ فَمَنِ اعْتَقَدَ أَنَّ اللَّهَ جِسْمٌ أَوْ قَالَ بِلِسَانِهِ إِنَّهُ جِسْمٌ فَقَدِ ارْتَدَّ لِأَنَّ اللَّهَ يَجِبُ تَنْزِيهُهُ عَنْ ذَلِكَ لِأَنَّهُ لَوْ كَانَ جِسْمًا صَغِيرًا كَالْهَبَاءِ لَكَانَ لَهُ مِثْلٌ وَلَوْ كَانَ جِسْمًا كَبِيرًا كَالْعَرْشِ لَكَانَ مِثْلًا لَهُ فَلَمْ يَصْلُحْ لِلأُلُوهِيَّةِ وَكَذَلِكَ لَوْ كَانَ مِثْلَ شَىْءٍ مِمَّا بَيْنَهُمَا. وَلا عِبْرَةَ بِقَوْلِ بَعْضِ الْمُؤَلِّفِينَ إِنَّ الَّذِي يَعْتَقِدُ أَنَّ اللَّهَ جِسْمٌ لا يُكَفَّرُ وَذَلِكَ لِأَنَّ الْجِسْمِيَّةَ تُنَافِي الأُلُوهِيَّةَ فَإِنَّهُ لَوْ كَانَ اللَّهُ جِسْمًا لَطِيفًا كَالنُّورِ وَالظَّلامِ وَالرِّيحِ أَوْ جِسْمًا كَثِيفًا كَالإِنْسَانِ وَالنَّجْمِ وَالشَّمْسِ وَالْقَمَرِ لَمْ يَكُنْ خَالِقًا لِهَذِهِ الأَجْسَامِ لِأَنَّ الْعَقْلَ لا يَقْبَلُ أَنْ يَخْلُقَ الْجِسْمُ جِسْمًا وَلَوْ كَانَ يَصِحُّ أَنْ يَخْلُقَ الْجِسْمُ جِسْمًا لَصَحَّ لِلشَّمْسِ أَنْ تَكُونَ إِلَهًا لَكِنَّ الْعَقْلَ يَمْنَعُ ذَلِكَ وَاللَّهُ تَعَالَى أَمَرَ عِبَادَهُ بِاسْتِعْمَالِ الْعَقْلِ وَقَدْ قَالَ تَعَالَى ﴿أَوَلَمْ يَنظُرُوا فِي مَلَكُوتِ السَّمَوَاتِ وَالأَرْضِ وَمَا خَلَقَ اللَّهُ مِنْ شَىْءٍ﴾ [سُورَةَ الأَعْرَافِ/185] وَأَثْنَى اللَّهُ تَعَالَى عَلَى احْتِجَاجِ إِبْرَاهِيمَ عَلَيْهِ السَّلامُ عَلَى عَدَمِ صِحَّةِ الأُلُوهِيَّةِ لِلْكَوْكَبِ وَالْقَمَرِ وَالشَّمْسِ بِكَوْنِ الثَّلاثَةِ جِسْمًا يَتَحَوَّلُ مِنْ حَالٍ إِلَى حَالٍ وَالتَّحَوُّلُ مِنْ أَوْصَافِ الْجِسْمِ فَدَلَّ ذَلِكَ عَلَى أَنَّ اللَّهَ لَيْسَ جِسْمًا وَلا يَكُونُ مُتَّصِفًا بِصِفَاتِ الْجِسْمِ كَالتَّحَوُّلِ مِنْ حَالٍ إِلَى حَالٍ كَتَحَوُّلِ الشَّمْسِ مِنَ الْمَشْرِقِ إِلَى الْمَغْرِبِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":143},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ تَحْلِيلُ مُحَرَّمٍ بِالإِجْمَاعِ مَعْلُومٍ مِنَ الدِّينِ بِالضَّرُورَةِ مِمَّا لا يَخْفَى عَلَيْهِ كَالزِّنَى وَاللِّوَاطِ وَقَتْلِ الْمُسْلِمِ وَالسَّرِقَةِ وَالْغَصْبِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":144},{"type":"p","text":"   الشَّرْحُ أَنَّهُ يَكْفُرُ مَنِ اعْتَقَدَ حِلَّ مُحَرَّمٍ بِإِجْمَاعِ الْمُسْلِمِينَ مَعْلُومٍ ظَاهِرٍ بَيْنَهُمْ بِالضَّرُورَةِ أَيْ مِنْ غَيْرِ تَفْكِيرٍ وَاسْتِدْلالٍ وَمِنْ هَذِهِ الأَشْيَاءِ الزِّنَى وَاللِّوَاطُ وَالْقَتْلُ وَالسَّرِقَةُ وَالْغَصْبُ هَذَا إِنْ لَمْ يَكُنِ الشَّخْصُ مَعْذُورًا أَمَّا إِنْ كَانَ الشَّخْصُ مَعْذُورًا بِأَنْ كَانَ جَاهِلًا بِالْحُكْمِ كَأَنْ كَانَ أَسْلَمَ مِنْ قَرِيبٍ وَلَمْ يَعْلَمْ أَنَّ الْمُسْلِمِينَ يُحَرِّمُونَ الزِّنَى وَقَالَ بَعْدَمَا أَسْلَمَ إِنَّ الزِّنَى لَيْسَ حَرَامًا فَلا نُكَفِّرُهُ بَلْ نُعَلِّمُهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":145},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ تَحْريِمُ حَلالٍ ظَاهِرٍ كَذَلِكَ كَالْبَيْعِ وَالنِّكَاحِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":146},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ حَرَّمَ أَيْ جَعَلَ مُوجِبًا لِلْعَذَابِ فِي الآخِرَةِ شَيْئًا هُوَ حَلالٌ عِنْدَ الْمُسْلِمِينَ مَعْلُومٌ حِلُّهُ بَيْنَهُمْ عِلْمًا ظَاهِرًا يَعْرِفُ ذَلِكَ الْعَالِمُ وَالْجَاهِلُ كَالْبَيْعِ وَالنِّكَاحِ أَيِ الزِّوَاجِ فَإِنَّهُ كَافِرٌ وَلَيْسَ الْمُرَادُ بِالتَّحْريِمِ هُنَا أَنْ يَمْنَعَ نَفْسَهُ مِنْ شَىْءٍ مَعَ اعْتِقَادِ حِلِّهِ كَقَوْلِ الرَّجُلِ حَرَامٌ عَلَيَّ أَكْلُ اللَّحْمِ فَإِنَّهُ لا يَكْفُرُ عِنْدَئِذٍ .","style":"Normal","align":"justify","bold":true,"size":18.0,"index":147},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ نَفْيُ وُجُوبِ مُجْمَعٍ عَلَيْهِ كَذَلِكَ كَالصَّلَوَاتِ الْخَمْسِ أَوْ سَجْدَةٍ مِنْهَا وَالزَّكَاةِ وَالصَّوْمِ وَالْحَجِّ وَالْوُضُوءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":148},{"type":"p","text":"   الشَّرْحُ أَنَّ مِمَّا يُخْرِجُ مِنَ الإِسْلامِ نَفْيَ وُجُوبِ مَا أَجْمَعَ الْمُسْلِمُونَ عَلَى وُجُوبِهِ وَعُلِمَ بِظُهُورٍ وَوُضُوحٍ يَشْتَرِكُ فِي مَعْرِفَتِهِ الْعَالِمُ وَالْجَاهِلُ كَإِنْكَارِ الصَّلَوَاتِ الْخَمْسِ وَإِنْكَارِ سَجْدَةٍ مِنْهَا وَإِنْكَارِ الزَّكَاةِ وَإِنْكَارِ وُجُوبِ صَوْمِ رَمَضَانَ وَإِنْكَارِ وُجُوبِ الْحَجِّ عَلَى الْمُسْتَطِيعِ وَإِنْكَارِ وُجُوبِ الْغُسْلِ مِنَ الْجَنَابَةِ فَهَذَا رِدَّةٌ وَكُفْرٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":149},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ إِيجَابُ مَا لَمْ يَجِبْ إِجْمَاعًا كَذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":150},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ أَوْجَبَ مَا لَمْ يَجِبْ بِإِجْمَاعِ الْمُسْلِمِينَ وَكَانَ أَمْرًا ظَاهِرًا بَيْنَ الْمُسْلِمِينَ أَنَّهُ غَيْرُ وَاجِبٍ فَهُوَ كَافِرٌ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":151},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ نَفْيُ مَشْرُوعِيَّةِ مُجْمَعٍ عَلَيْهِ كَذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":152},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنَ الْكُفْرِ الِاعْتِقَادِيِّ النَّفْيَ بِالْقَلْبِ مَشْرُوعِيَّةَ أَمْرٍ مُجْمَعٍ عَلَيْهِ مِمَّا عَرَفَ الْمُسْلِمُونَ أَنَّهُ مَشْرُوعٌ فِي الدِّينِ بِالضَّرُورَةِ [أَيْ بِدُونِ تَأَمُّلٍ وَاسْتِدْلالٍ] أَيْ مَعْرِفَةً ظَاهِرَةً يَشْتَرِكُ فِيهَا الْعَالِمُ وَالْجَاهِلُ كَرَوَاتِبِ الْفَرَائِضِ الْخَمْسِ وَالْوِتْرِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":153},{"type":"benefit","text":"   فَائِدَةٌ الإِجْمَاعُ إِنَّمَا يَنْعَقِدُ بِاتِّفَاقِ الْمُجْتَهِدِينَ فَقَطْ فَلا يُشْتَرَطُ فِيهِ اتِّفَاقُ الْعَامَّةِ وَلا الْعُلَمَاءِ الَّذِينَ لَيْسُوا مُجْتَهِدِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":154},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ عَزَمَ عَلَى الْكُفْرِ فِي الْمُسْتَقْبَلِ أَوْ عَلَى فِعْلِ شَىْءٍ مِمَّا ذُكِرَ أَوْ تَرَدَّدَ فِيهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":155},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ عَزَمَ فِي قَلْبِهِ عَلَى أَنْ يَكْفُرَ فِي الْمُسْتَقْبَلِ أَوْ عَلَى فِعْلِ شَىْءٍ مِنَ الأُمُورِ الْكُفْرِيَّةِ الَّتِي مَرَّ ذِكْرُهَا فَإِنَّهُ يَكْفُرُ فِي الْحَالِ كَذَلِكَ مَنْ تَرَدَّدَ هَلْ يَفْعَلُ ذَلِكَ أَوْ لا فَإِنَّهُ يَكْفُرُ فِي الْحَالِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":156},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: لا خُطُورُهُ فِي الْبَالِ بِدُونِ إِرَادَةٍ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":157},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ خَطَرَ لَهُ شَىْءٌ مِنْ ذَلِكَ فِي بَالِهِ أَيْ قَلْبِهِ خُطُورًا أَيْ بِلا إِرَادَةٍ فَإِنَّهُ لا يَكْفُرُ وَلَوْ تَكَرَّرَ هَذَا الْخَاطِرُ لِأَنَّ هَذَا لَيْسَ مِمَّا يَسْتَطِيعُ الإِنْسَانُ مَنْعَهُ وَاللَّهُ لا يُكَلِّفُ الْعَبْدَ إِلَّا مَا هُوَ فِي وُسْعِهِ وَهَذَا عَامٌّ فِي كُلِّ شَىْءٍ [قَالَ اللَّهُ تَعَالَى ﴿لا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾] فَمَنْ خَطَرَ لَهُ خَاطِرٌ مِمَّا يُنَافِي إِثْبَاتَ وُجُودِ اللَّهِ أَوِ الْجَنَّةِ أَوِ النَّارِ وَهُوَ مُعْتَقِدٌ الْحَقَّ اعْتِقَادًا جَازِمًا فَلا تَأْثِيرَ لِهَذَا الْخُطُورِ فِي صِحَّةِ إِيمَانِهِ بَلْ يَزْدَادُ ثَوَابًا بِكَرَاهِيَّتِهِ لِهَذَا الَّذِي يَخْطُرُ لَهُ فَالْمُرَادُ بِالْخَاطِرِ غَيْرُ الشَّكِّ وَالِاعْتِقَاِد [وَيَتَمَيَّزُ الشَّكُّ عَنِ الْخَاطِرِ أَنَّ الْخَاطِرَ يَكُونُ بِلا إِرَادَةٍ فَلا يُنَافِي الْجَزْمَ بِالْقَلْبِ أَمَّا الشَّكُّ فَيُنَافِيهِ لِأَنَّ مَعْنَاهُ التَّرَدُّدَ فِي الْقَلْبِ].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":158},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ أَنْكَرَ صُحْبَةَ سَيِّدِنَا أَبِي بَكْرٍ رَضِيَ اللَّهُ عَنْهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":159},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ أَنْكَرَ صُحْبَةَ سَيِّدِنَا أَبِي بَكْرٍ بِالْقَلْبِ أَيِ اعْتَقَدَ أَنَّ أَبَا بَكْرٍ لَيْسَ صَاحِبًا لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَدْ كَفَرَ وَذَلِكَ لِأَنَّ اللَّهَ نَصَّ عَلَى صُحْبَتِهِ فِي الْقُرْءَانِ فَقَالَ تَعَالَى ﴿إِذْ يَقُولُ لِصَاحِبِهِ لا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا﴾ [سُورَةَ التَّوْبَةِ/40] وَقَدْ أَجْمَعَ الْمُسْلِمُونَ عَلَى أَنَّ الْمُرَادَ بِالصَّاحِبِ هُنَا هُوَ أَبُو بَكْرٍ فَمَنْ شَكَّ فِي ذَلِكَ وَفَسَّرَ هَذَا الصَّاحِبَ بِغَيْرِهِ مِنَ الصَّحَابَةِ فَقَدْ كَفَرَ لِأَنَّ ذَلِكَ يَتَضَمَّنُ تَخْوِينَ أُمَّةِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَتَضْلِيلَهُمْ وَفِي ذَلِكَ هَدْمٌ لِلدِّينِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":160},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ رِسَالَةَ وَاحِدٍ مِنَ الرُّسُلِ الْمُجْمَعِ عَلَى رِسَالَتِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":161},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ أَنْكَرَ رِسَالَةَ وَاحِدٍ مِنَ الرُّسُلِ الَّذِينَ اتَّفَقَ الْمُسْلِمُونَ عَلَى أَنَّهُ مِنْ رُسُلِ اللَّهِ فَهُوَ مُرْتَدٌّ كَافِرٌ وَالْمُرَادُ بِالرِّسَالَةِ هُنَا مَا يَعُمُّ النُّبُوَّةَ فَمَنْ أَنْكَرَ نُبُوَّةَ وَاحِدٍ مِنَ الأَنْبِيَاءِ الَّذِينَ أَجْمَعَ الْمُسْلِمُونَ عَلَى أَنَّهُ مِنَ الأَنْبِيَاءِ فَقَدِ ارْتَدَّ وَكَفَرَ إِلَّا أَنْ كَانَ لا يَعْلَمُ ذَلِكَ لِأَنَّهُ لَمْ يَشْتَهِرْ عِنْدَهُ فَلا نُكَفِّرُهُ بَلْ نُعَلِّمُهُ لِأَنَّ هَذَا لا يُتَوَصَّلُ إِلَيْهِ عَنْ طَرِيقِ الْعَقْلِ إِنَّمَا يُعْرَفُ عَنْ طَرِيقِ النَّقْلِ وَكَذَلِكَ لَوْ قَرَأَ شَخْصٌ فِي الْقُرْءَانِ أَنَّ هَارُونَ وَإِلْيَاسَ وَالْيَسَعَ أَنْبِيَاءُ ثُمَّ نَسِيَ لِطُولِ عَهْدِهِ بِالْقِرَاءَةِ لِلْقُرْءَانِ فَقَالَ عَنْ وَاحِدٍ مِنْهُمْ إِنَّهُ لَيْسَ بِنَبِيٍّ فَلا يَكْفُرُ. وَأَمَّا مَنِ اخْتُلِفَ فِيهِ هَلْ هُوَ نَبِيٌّ رَسُولٌ أَوْ هُوَ نَبِيٌّ فَقَطْ أَوْ هُوَ وَلِيٌّ فَقَطْ كَالْخَضِرِ عَلَيْهِ السَّلامُ فَمَنْ قَالَ بِوَاحِدٍ مِنْ ذَلِكَ فَلا حَرَجَ عَلَيْهِ لَكِنَّ الْقَوْلَ الرَّاجِحَ فِي الْخَضِرِ عَلَيْهِ السَّلامُ إِنَّهُ نَبِيٌّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":162},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ جَحَدَ حَرْفًا مُجْمَعًا عَلَيْهِ مِنَ الْقُرْءَانِ أَوْ زَادَ حَرْفًا فِيهِ مُجْمَعًا عَلَى نَفْيِهِ مُعْتَقِدًا أَنَّهُ مِنْهُ عِنَادًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":163},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ أَنْكَرَ حَرْفًا اتَّفَقَ الْمُسْلِمُونَ عَلَى أَنَّهُ مِنَ الْقُرْءَانِ فَقَدِ ارْتَدَّ إِلَّا أَنْ يَكُونَ إِنْكَارُهُ جَهْلًا مِنْهُ لا عَلَى وَجْهِ الْعِنَادِ. وَكَذَلِكَ مَنْ زَادَ فِيهِ حَرْفًا أَجْمَعَ الْمُسْلِمُونَ عَلَى أَنَّهُ لَيْسَ مِنَ الْقُرْءَانِ وَكَانَتْ زِيَادَتُهُ لِذَلِكَ الْحَرْفِ عِنَادًا لا ظَنًّا مِنْهُ أَنَّهُ مِنَ الْقُرْءَانِ فَهَذَا أَيْضًا يُحْكَمُ عَلَيْهِ بِالرِّدَّةِ أَمَّا مَنْ زَادَ حَرْفًا فِي الْقِرَاءَةِ جَهْلًا مِنْهُ أَوْ مِنْ أَجْلِ الصَّوْتِ مِنْ غَيْرِ أَنْ يَعْتَقِدَ أَنَّهُ قُرْءَانٌ فَإِنَّهُ لا يَكْفُرُ [أَيْ أَنَّ زِيَادَةَ حَرْفٍ فِي الْقُرْءَانِ بِلا اعْتِقَادٍ أَنَّهُ مِنْهُ بَلْ مِنْ أَجْلِ تَحْسِينِ الصَّوْتِ أَوْ مَعَ اعْتِقَادِ أَنَّهُ مِنْهُ جَهْلًا فَلَيْسَ ذَلِكَ بِرِدَّةٍ لَكِنْ هُوَ حَرَامٌ].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":164},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ كَذَّبَ رَسُولًا أَوْ نَقَّصَهُ أَوْ صَغَّرَ اسْمَهُ بِقَصْدِ تَحْقِيرِهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":165},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ كَذَّبَ نَبِيًّا مِنْ أَنْبِيَاءِ اللَّهِ فَقَدِ ارْتَّدَ وَكَذَلِكَ الَّذِي نَقَّصَهُ أَيْ نَسَبَ إِلَيْهِ نَقْصًا أَوْ صَغَّرَ اسْمَهُ بِقَصْدِ التَّحْقِيرِ وَذَلِكَ كَأَنْ يُسَمِّيَ عِيسَى عُيَيْسَى أَوْ يَقُولَ عَنْ مُوسَى مُوَيْسَى عَلَى وَجْهِ التَّحْقِيرِ أَمَّا مَنْ قَالَ ذَلِكَ عَلَى وَجْهِ إِظْهَارِ الْمَحَبَّةِ لَهُ فَلا نُكَفِّرُهُ لَكِنْ يُقَالُ لَهُ حَرَامٌ أَنْ تُصَغِّرَ اسْمَ نَبِيٍّ مِنْ أَنْبِيَاءِ اللَّهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":166},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ جَوَّزَ نُبُوَّةَ أَحَدٍ بَعْدَ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":167},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنِ اعْتَقَدَ أَنَّهُ يَجُوزُ أَنْ يَأْتِيَ نَبِيٌّ بَعْدَ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَيْ أَنْ يَنْزِلَ وَحْيٌّ بِالنُّبُوَّةِ عَلَى شَخْصٍ لَمْ يُنَبَّأْ قَبْلَ مُحَمَّدٍ كَفَرَ وَكَذَا لَوْ شَكَّ بِأَنْ قَالَ يَجُوزُ أَنْ يَكُونَ فُلانٌ نَزَلَتْ عَلَيْهِ النُّبُوَّةُ. وَقَدْ ظَهَرَ جَمَاعَةٌ يُقَالُ لَهَا الأَحْمَدِيَّةُ وَالْقَادِيَانِيَةُ ءَامَنُوا بِرَجُلٍ اسْمُهُ غُلامُ أَحْمَد كَانَ فِي الْهِنْدِ تُوُفِّيَ مُنْذُ نَحْوِ قَرْنٍ وَنِصْفٍ يَعْتَقِدُونَ أَنَّهُ نَبِيٌّ مُجَدِّدٌ وَأَحْيَانًا يَقُولُونَ نُبُوَّتُهُ نُبُوَّةٌ ظِلِّيَّةٌ أَيْ تَحْتَ ظِلِّ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَيْ لَيْسَ مُسْتَقِّلًا إِنَّمَا هُوَ مُنْتَسِبٌ إِلَى سَيِّدِنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَكُلُّ هَذَا كُفْرٌ فَإِنَّهُ لا يَجُوزُ أَنْ يُنَبَّأَ شَخْصٌ بَعْدَ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لا اسْتِقْلالًا وَلا تَجْدِيدًا لِنُبُوَّتِهِ فَإِنَّهُ قَالَ «وَخُتِمَ بِيَ النَّبِيُّونَ» وَقَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فِي الْحَدِيثِ الَّذِي رَوَاهُ الْبُخَارِيُّ «كَانَتْ بَنُو إِسْرَائِيلَ تَسُوسُهُمُ الأَنْبِيَاءُ أَيْ تَحْكُمُهُمْ كُلَّمَا هَلَكَ أَيْ مَاتَ نَبِيٌّ خَلَفَهُ نَبِيٌّ وَإِنِّي خَاتَمُ النَّبِيِّينَ فَلا نَبِيَّ بَعْدِي».  ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":168},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْقِسْمُ الثَّانِي الأَفْعَالُ كَسُجُودٍ لِصَنَمٍ أَوْ شَمْسٍ [إِنْ قَصَدَ عِبَادَتَهُمَا أَوْ لَمْ يَقْصِدْ] وَالسُّجُودِ لإِنْسَانٍ إِنْ كَانَ عَلَى وَجْهِ الْعِبَادَةِ لَهُ كَسُجُودِ بَعْضِ الْجَهَلَةِ لِبَعْضِ الْمَشَايِخِ الْمُتَصَوَّفِينَ عَلَى وَجْهِ الْعِبَادَةِ لَهُمْ فَإِنَّهُ يَكُونُ عِنْدَئِذٍ كُفْرًا وَإِنْ لَمْ يَكُنْ عَلَى وَجْهِ الْعِبَادَةِ لَهُمْ لا يَكُونُ كُفْرًا لَكِنَّهُ حَرَامٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":169},{"type":"p","text":"   الشَّرْحُ أَنَّ الْقِسْمَ الثَّانِيَ مِنَ الرِّدَّةِ الرِّدَّةُ الْفِعْلِيَّةُ وَذَلِكَ كَسُجُودٍ لِصَنَمٍ وَهُوَ مَا اتُّخِذَ لِيُعْبَدَ مِنْ دُونِ اللَّهِ إِنْ كَانَ مِنْ حَدِيدٍ أَوْ جَوْهَرٍ أَوْ خَشَبٍ أَوْ حَجَرٍ أَوْ غَيْرِ ذَلِكَ فَمَنْ سَجَدَ لِصَنَمٍ اعْتِقَادًا أَوْ بِغَيْرِ اعْتِقَادٍ فَقَدْ كَفَرَ كَذَلِكَ الَّذِي يَسْجُدُ لِلشَّمْسِ وَنَحْوِهَا فَإِنَّهُ يَكْفُرُ وَلَوْ قَالَ إِنَّهُ لَمْ يَقْصِدْ عِبَادَتَهَا أَوْ يَسْجُدُ لِأَيِّ مَخْلُوقٍ ءَاخَرَ لِعِبَادَتِهِ أَمَّا مَنْ يَسْجُدُ لِمَلِكٍ أَوْ نَحْوِهِ عَلَى وَجْهِ التَّحِيَّةِ لا عَلَى وَجْهِ الْعِبَادَةِ لَهُ فَلا يَكْفُرُ لَكِنْ ذَلِكَ حَرَامٌ فِي شَرْعِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى الإِطْلاقِ وَكَانَ جَائِزًا فِي شَرَائِعِ مَنْ قَبْلَهُ مِنَ الأَنْبِيَاءِ السُّجُودُ لِلإِنْسَانِ عَلَى وَجْهِ التَّحِيَّةِ وَالتَّعْظِيمِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":170},{"type":"p","text":"   وَمِنَ الْكُفْرِ الْفِعْلِيِّ إِلْقَاءُ الْمُصْحَفِ أَوْ نَحْوِهِ مِمَّا فِيهِ شَىْءٌ مِنَ الْقُرْءَانِ أَوْ رَمْيُ اسْمٍ مُعَظَّمٍ أَيْ كَاسْمِ مُحَمَّدٍ مُرَادًا بِهِ الرَّسُولُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَاسْمِ عِيسَى مُرَادًا بِهِ الْمَسِيحُ ابْنُ مَرْيَمَ عَلَيْهِ السَّلامُ أَوْ مَا فِيهِ شَىْءٌ مِنَ الْحَدِيثِ أَوْ مِنْ عِلْمٍ شَرْعِيٍّ بِقَاذُورَةٍ أَوْ قَذَرٍ طَاهِرٍ كَمُخَاطٍ أَوْ بُزَاقٍ لِأَنَّ فِيهِ اسْتِخْفَافًا بِالدِّينِ وَمُمَاسَّتُهُ بِشَىْءٍ مِنْ ذَلِكَ كُفْرٌ أَيْضًا وَلَيْسَ الْحُكْمُ كَذَلِكَ إِذَا كَانَ هَذَا الِاسْمُ مِنْ نَحْوِ مُحَمَّدٍ مُرَادًا بِهِ غَيْرُ اسْمِ النَّبِيِّ فَإِنَّهُ لا يَكُونُ إِلْقَاؤُهُ فِي الْقَاذُورَةِ كُفْرًا وَلا حَرَامًا إِلَّا أَنَّهُ مَكْرُوهٌ لِأَنَّ فِيهِ امْتِهَانًا لِحُرُوفِ اللُّغَةِ الْعَرَبِيَّةِ [وَالِامْتِهَانُ الِابْتِذَالُ وَهُوَ ضِدُّ الصِّيَانَةِ].","style":"Normal","align":"justify","bold":false,"size":18.0,"index":171},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْقِسْمُ الثَّالِثُ الأَقْوَالُ وَهِيَ كَثِيرَةٌ جِدًّا لا تَنْحَصِرُ مِنْهَا أَنْ يَقُولَ لِمُسْلِمٍ يَا كَافِرُ أَوْ يَا يَهُودِيُّ أَوْ يَا نَصْرَانِيُّ أَوْ يَا عَديِمَ الدِّينِ مُرِيدًا بِذَلِكَ أَنَّ الَّذِي عَلَيْهِ الْمُخَاطَبُ مِنَ الدِّينِ كُفْرٌ أَوْ يَهُودِيَّةٌ أَوْ نَصْرَانِيَّةٌ أَوْ لَيْسَ بِدِينٍ لا عَلَى قَصْدِ التَّشْبِيهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":172},{"type":"p","text":"   الشَّرْحُ أَنَّ الأَلْفَاظَ الَّتِي يَكْفُرُ مَنْ قَالَهَا وَلَوْ لَمْ يَكُنْ مُعْتَقِدًا مَعَانِيَ تِلْكَ الأَلْفَاظِ كَثِيرَةٌ كَقَوْلِ الشَّخْصِ لِمُسْلِمٍ يَعْرِفُهُ مُسْلِمًا يَا كَافِرُ أَوْ يَا نَصْرَانِيُّ أَوْ يَا يَهُودِيُّ أَوْ يَا عَديِمَ الدِّينِ مُرِيدًا بِذَلِكَ أَنَّهُ لَيْسَ عَلَى دِينِ الإِسْلامِ فَذَلِكَ رِدَّةٌ تُخْرِجُ قَائِلَهَا مِنَ الدِّينِ [أَمَّا مَنْ رَأَى شَخْصًا لا يَعْرِفُهُ فِي بَلَدٍ يَغْلِبُ الْكُفْرُ عَلَى سُكَّانِهَا فَظَنَّ فِيهِ أَنَّهُ كَافِرٌ فَلا حَرَجَ عَلَيْهِ قَالَهُ شَيْخُنَا رَحِمَهُ اللَّهُ تَعَالَى] وَأَمَّا مَنْ قَالَ هَذِهِ الْكَلِمَاتِ الأَرْبَعَ مُتَأَوِّلًا أَيْ أَنَّكَ تُشْبِهُ الْكَافِرَ فِي خَسَاسَةِ أَعْمَالِكَ أَوْ أَنَّكَ تُشْبِهُ الْيَهُودَ أَوِ النَّصَارَى لِسُوءِ عَمَلِكَ أَوْ أَنَّكَ تُعَامِلُ الْمُسْلِمِينَ كَأَنَّكَ كَافِرٌ أَوْ أَنَّكَ كَمَنْ لا دِينَ لَهُ أَيْ أَنَّكَ لَسْتَ عَامِلًا بِالدِّينِ كَمَا يَنْبَغِي لِأَنَّ الْمُسْلِمَ الْكَامِلَ هُوَ الَّذِي سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ فَلا يَكْفُرُ لَكِنَّ هَذَا حَرَامٌ يَفْسُقُ قَائِلُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":173},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَالسُّخْرِيَةِ بِاسْمٍ مِنْ أَسْمَائِهِ تَعَالَى أَوْ وَعْدِهِ أَوْ وَعِيدِهِ مِمَّنْ لا يَخْفَى عَلَيْهِ نِسْبَةُ ذَلِكَ إِلَيْهِ سُبْحَانَهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":174},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ سَخِرَ بِاسْمٍ مِنْ أَسْمَاءِ اللَّهِ أَيِ اسْتَهْزَأَ أَوْ سَخِرَ بِوَعْدِ اللَّهِ تَعَالَى لِلْمُؤْمِنِينَ فِي الآخِرَةِ بِالْجَنَّةِ وَمَا أُعِدَّ فِيهَا مَثَلًا أَوْ سَخِرَ بِوَعِيدِ اللَّهِ لِلْكَافِرِينَ وَالْعُصَاةِ بِعَذَابِ الآخِرَةِ وَكَانَ ذَلِكَ الْوَعْدُ أَوِ الْوَعِيدُ الَّذِي سَخِرَ بِهِ شَيْئًا لَيْسَ خَافِيًا عَلَيْهِ بَلْ هُوَ عَالِمٌ بِوُرُودِهِ فِي دِينِ الإِسْلامِ فَقَدْ كَفَرَ وَذَلِكَ كَقَوْلِ بَعْضِ السُّفَهَاءِ عِنْدَ ذِكْرِ جَهَنَّمَ نَتَدَفَّأُ بِهَا فِي الآخِرَةِ لِأَنَّ هَذَا يَتَضَمَّنُ تَكْذِيبَ اللَّهِ تَعَالَى فِيمَا أَخْبَرَ بِهِ مِنْ شِدَّةِ نَارِ جَهَنَّمَ. وَأَمَّا مَنْ أَنْكَرَ أَوْ سَخِرَ بِنَوْعٍ مِنَ الْوَعِيدِ يَجْهَلُ وُرُودَهُ فِي الشَّرْعِ مِمَّا هُوَ غَيْرُ ظَاهِرٍ بِحَيْثُ يَشْتَرِكُ فِي مَعْرِفَتِهِ الْعَالِمُ وَالْجَاهِلُ فَلا نُكَفِّرُهُ كَأَنْ أَنْكَرَ وُجُودَ عَقَارِبَ فِي جَهَنَّمَ. وَكَذَلِكَ لا يَكْفُرُ مَنْ كَانَ قَرِيبَ عَهْدٍ بِإِسْلامٍ فَأَنْكَرَ جَهَنَّمَ أَيْ مَا كَانَ يَسْمَعُ بِأَنَّ الْمُسْلِمِينَ يَعْتَقِدُونَ بِوُجُودِ جَهَنَّمَ دِينًا لَهُمْ أَمَّا الَّذِي كَانَ يَسْمَعُ بِأَنَّ الْمُسْلِمِينَ يَعْتَقِدُونَ بِوُجُودِ جَهَنَّمَ وَمَعَ ذَلِكَ أَنْكَرَهَا فَهَذَا يَكْفُرُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":175},{"type":"p","text":"   تَنْبِيهٌ لَيْسَ مِنَ الِاسْتِخْفَافِ بِوَعِيدِ اللَّهِ سَبُّ جَهَنَّمَ لِأَنَّ جَهَنَّمَ لَيْسَتْ مُعَظَّمَةً إِنَّمَا هِيَ شَىْءٌ شَدِيدٌ وَلَوْ كَانَتْ مُعَظَّمَةً مَا كُنَّا نَقُولُ اللَّهُمَّ أَجِرْنَا مِنَ النَّارِ فَيَجُوزُ أَنْ يُقَالَ عَنْ جَهَنَّمَ إِنَّهَا خَبِيثَةٌ إِنَّمَا الْكُفْرُ أَنْ يُقَالَ عَنْهَا لَيْسَتْ بِشَىْءٍ أَوْ هِيَ شَىْءٌ خَفِيفٌ. جَهَنَّمُ يُسْتَعَاذُ بِاللَّهِ مِنْهَا فَإِنَّ مِنْ جُمْلَةِ مَا عَلَّمَهُ الرَّسُولُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِأُمَّتِهِ أَنْ يَقُولُوهُ فِي الصَّلاةِ اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ جَهَنَّمَ. وَاللَّهُ عَزَّ وَجَلَّ ذَمَّ جَهَنَّمَ بِقَوْلِهِ ﴿وَبِئْسَ الْقَرَارُ﴾ وَبِقَوْلِهِ ﴿وَسَاءَتْ مَصِيرًا﴾ [سُورَةَ النِّسَاءِ/97]. فَلا يَجُوزُ أَنْ يُقَالَ مَثَلًا وَحَقِّ جَهَنَّمَ لِأَنَّهَا لَيْسَ لَهَا شَرَفٌ وَكَلِمَةُ «وَحَقِّ كَذَا» تُشْعِرُ بِشَرَفِ الشَّىْءِ الْمَذْكُورِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":176},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَأَنْ يَقُولَ لَوْ أَمَرَنِي اللَّهُ بِكَذَا لَمْ أَفْعَلْهُ أَوْ لَوْ صَارَتِ الْقِبْلَةُ فِي جِهَةِ كَذَا مَا صَلَّيْتُ إِلَيْهَا أَوْ لَوْ أَعْطَانِي اللَّهُ الْجَنَّةَ مَا دَخَلْتُهَا مُسْتَخِفًّا أَوْ مُظْهِرًا لِلْعِنَادِ فِي الْكُلِّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":177},{"type":"p","text":"   الشَّرْحُ أَنَّ قَائِلَ هَذِهِ الأَلْفَاظِ يَكْفُرُ إِنْ قَالَهَا عَلَى وَجْهِ الِاسْتِخْفَافِ بِأَمْرِ اللَّهِ الَّذِي أَمَرَ بِهِ عِبَادَهُ أَوْ عَلَى وَجْهِ الِاسْتِخْفَافِ بِالْقِبْلَةِ أَوْ عَلَى وَجْهِ الِاسْتِخْفَافِ بِالْجَنَّةِ أَوْ عَلَى وَجْهِ الْعِنَادِ أَيْ عَدَمِ الِاسْتِسْلامِ لِلَّهِ. وَفِي الْغَالِبِ هَذِهِ الْعِبَارَاتُ تُسْتَعْمَلُ لِلِاسْتِخْفَافِ لَكِنْ قَدْ يَقُولُهَا بَعْضُهُمْ وَلا يَفْهَمُ مِنْهَا الِاسْتِخْفَافَ فَإِنَّ مَنْ قَالَ لَوْ أَعْطَانِي اللَّهُ الْجَنَّةَ مَا دَخَلْتُهَا لا بِقَصْدِ الِاسْتِخْفَافِ وَلا الْعِنَادِ إِنَّمَا يُرِيدُ مَثَلًا لَوْ أَعْطَانِي اللَّهُ الْجَنَّةَ أَكُونُ رَاضِيًا عَنِ اللَّهِ تَعَالَى مِنْ غَيْرِ أَنْ أَدْخُلَهَا فَإِنَّهُ لا يَكْفُرُ وَكَذَلِكَ مَنْ قِيلَ لَهُ افْعَلْ كَذَا فَقَالَ أَنَا لا أَفْعَلُ لِأَجْلِ قَوْلِ فُلانٍ لِي افْعَلْهُ إِذْ لَوْ كَانَ هَذَا الأَمْرُ وَاجِبًا أَمَرَنِي اللَّهُ بِهِ أَنَا مَا كُنْتُ أَفْعَلُهُ يُرِيدُ مِنْ تَقْصِيرِهِ مِنْ غَيْرِ اسْتِخْفَافٍ وَلا عِنَادٍ مَعَ اعْتِقَادِ أَنَّ أَمْرَ اللَّهِ حَقٌّ فَإِنَّهُ لا يَكْفُرُ وَكَذَلِكَ مَنْ أَمَرَهُ شَخْصٌ بِالصَّلاةِ فَقَالَ لَوْ كَانَتِ الْقِبْلَةُ فِي جِهَةِ كَذَا مَا صَلَّيْتُ إِلَيْهَا يُرِيدُ بِذَلِكَ أَنَّهُ مِنْ شِدَّةِ كَسَلِهِ لا يُصَلِّي مَهْمَا كَانَ ذَلِكَ سَهْلًا مِنْ غَيْرِ قَصْدِ الِاسْتِخْفَافِ وَلا الْعِنَادِ وَمَعَ كَوْنِهِ يُحِبُّ أَمْرَ اللَّهِ فَإِنَّهُ لا يَكْفُرُ وَأَمَّا الَّذِي يَقُولُ أَيَّ لَفْظٍ مِنْ هَذِهِ الأَلْفَاظِ الثَّلاثَةِ اسْتِخْفَافًا بِأَمْرِ اللَّهِ وَشَرْعِهِ أَوْ عِنَادًا فَإِنَّهُ يَكْفُرُ بِلا شَكٍّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":178},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَأَنْ يَقُولَ لَوْ ءَاخَذَنِي اللَّهُ بِتَرْكِ الصَّلاةِ مَعَ مَا أَنَا فِيهِ مِنَ الْمَرَضِ ظَلَمَنِي.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":179},{"type":"p","text":"   الشَّرْحُ لَوْ أَنَّ شَخْصًا مَرِيضًا ضَجِرَ مِنْ مَرَضِهِ فَقِيلَ لَهُ صَلِّ لا تَتْرُكِ الصَّلاةَ فَإِنَّهَا فَرْضٌ عَلَيْكَ فَقَالَ لَوْ ءَاخَذَنِي اللَّهُ عَلَى تَرْكِ الصَّلاةِ وَأَنَا عَلَى هَذِهِ الْحَالِ لَكَانَ ظَالِمًا كَفَرَ لِأَنَّ فِي ذَلِكَ اسْتِخْفَافًا بِاللَّهِ تَعَالَى وَتَكْذِيبًا لِقَوْلِ اللَّهِ ﴿وَمَا رَبُّكَ بِظَلَّامٍ لِلْعَبِيدِ﴾.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":180},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ قَالَ لِفْعِلٍ حَدَثَ هَذَا بِغَيْرِ تَقْدِيرِ اللَّهِ أَوْ لَوْ شَهِدَ عِنْدِي الأَنْبِيَاءُ أَوِ الْمَلائِكَةُ أَوْ جَمِيعُ الْمُسْلِمِينَ بِكَذَا مَا قَبِلْتُهُمْ أَوْ قَالَ لا أَفْعَلُ كَذَا وَإِنْ كَانَ سُنَّةً بِقَصْدِ الِاسْتِهْزَاءِ أَوْ لَوْ كَانَ فُلانٌ نَبِيًّا مَا ءَامَنْتُ بِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":181},{"type":"p","text":"   الشَّرْحُ أَنَّهُ لَوْ قِيلَ لِشَخْصٍ «حَدَثَ هَذَا بِتَقْدِيرِ اللَّهِ كُلُّ شَىْءٍ بِتَقْدِيرِ اللَّهِ» فَقَالَ «أَنَا فَعَلْتُهُ بِغَيْرِ تَقْدِيرِ اللَّهِ أَنَا فَعَلْتُهُ وَلَمْ يُقَدِّرْهُ اللَّهُ تَعَالَى» فَقَدْ كَفَرَ وَهَذَا عَامٌّ فِي الْفِعْلِ الَّذِي هُوَ خَيْرٌ وَالَّذِي هُوَ شَرٌّ لِأَنَّ كُلَّ مَا يَعْمَلُهُ الْعَبْدُ بِتَقْدِيرِ اللَّهِ تَعَالَى. وَتَقْدِيرُ اللَّهِ لِلشَّرِّ لَيْسَ شَرًّا إِنَّمَا الشَّرُّ هَذَا الْمُقَدَّرُ وَهُوَ فِعْلُ الْعَبْدِ لِمَا نَهَاهُ اللَّهُ عَنْهُ فَالْعَبْدُ يُلامُ وَأَمَّا اللَّهُ تَعَالَى فَلا يُلامُ لِأَنَّ الْعَبْدَ فَعَلَ مَا نَهَاهُ اللَّهُ عَنْهُ وَخَالَفَ أَمْرَهُ أَمَّا اللَّهُ فَلا ءَامِرَ لَهُ وَلا نَاهِيَ. وَلا يُعْتَرَضُ عَلَى اللَّهِ لِتَقْدِيرِهِ لِذَلِكَ الْفِعْلِ فَخَلْقُ اللَّهِ لِلشَّرِّ لَيْسَ شَرًّا قَبِيحًا مِنَ اللَّهِ إِنَّمَا فِعْلُ الْقَبِيحِ قَبِيحٌ مِنَ الْعَبْدِ. خَلْقُ اللَّهِ لِلشَّرِّ كَخَلْقِهِ لِلْخَيْرِ إِنَّمَا الْمَقْدُورُ أَيِ الْمَخْلُوقُ الَّذِي قَدَّرَهُ اللَّهُ وَخَلَقَهُ الَّذِي هُوَ شَرٌّ أَيْ مَعْصِيَةٌ أَوْ مَكْرُوهٌ قَبِيحٌ مِنَ الْعَبْدِ فِعْلُهُ. خَلْقُ الْمُتَقَابِلاتِ دَلِيلٌ عَلَى كَمَالِ قُدْرَةِ اللَّهِ فَخَلْقُهُ تَعَالَى لِلأَدْوِيَةِ وَالسُّمُومِ الْقَتَّالَةِ لَيْسَ قَبِيحًا مِنْهُ بَلْ دَلِيلٌ عَلَى كَمَالِ قُدْرَتِهِ فَتَقْدِيرُ اللَّهِ لِلشَّرِّ لَيْسَ قَبِيحًا بَلْ حَسَنٌ كَمَا أَنَّ تَقْدِيرَهُ لِعَمَلِ الْخَيْرِ حَسَنٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":182},{"type":"p","text":"   وَكَذَلِكَ مَنْ قَالَ لَوْ شَهِدَ عِنْدِي الأَنْبِيَاءُ أَوِ الْمَلائِكَةُ أَوْ جَمِيعُ الْمُسْلِمِينَ بِكَذَا مَا قَبِلْتُهُمْ هُوَ كَافِرٌ مُرْتَدٌّ بِلا تَفْصِيلٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":183},{"type":"p","text":"   وَكَذَلِكَ يَكْفُرُ مَنْ قَالَ لا أَفْعَلُ كَذَا وَإِنْ كَانَ سُنَّةً بِقَصْدِ الِاسْتِخْفَافِ بِسُنَّةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَمَّا مَنْ لَمْ يَقْصِدِ الِاسْتِخْفَافَ بِالسُّنَّةِ بَلْ يَقْصِدُ أَنَّهُ لا يَفْعَلُ لِأَجْلِ قَوْلِ شَخْصٍ لَهُ افْعَلْ كَذَا أَيْ أَنَّهُ لا يُنَفِّذُ أَمْرَ هَذَا الشَّخْصِ فَلا يَكْفُرُ كَمَا لَوْ قِيلَ لِشَخْصٍ لِمَ تَتْرُكُ رَوَاتِبَ الْفَرَائِضِ وَلا تُصَلِّيهَا وَتَقْتَصِرُ عَلَى الْفَرَائِضِ فَقَالَ لا أُصَلِّيهَا وَإِنْ كَانَتْ سُنَّةً وَلَمْ يَقْصِدْ بِذَلِكَ الِاسْتِخْفَافَ بِهَا فَلا يَكْفُرُ كَمَا تَقَدَّمَ مَا يُبَيِّنُ ذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":184},{"type":"p","text":"   وَيَكْفُرُ مَنْ قَالَ «لَوْ كَانَ فُلانٌ نَبِيًّا مَا ءَامَنْتُ بِهِ» لِأَنَّهُ اسْتِخْفَافٌ بِمَنْصِبِ النُّبُوَّةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":185},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ أَعْطَاهُ عَالِمٌ فَتْوًى فَقَالَ أَيْشٍ هَذَا الشَّرْعُ مُرِيدًا الِاسْتِخْفَافَ بِحُكْمِ الشَّرْعِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":186},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ قَالَ هَذِهِ الْكَلِمَةَ بِقَصْدِ الِاسْتِخْفَافِ بِحُكْمِ الشَّرْعِ كَفَرَ أَمَّا مَنْ لَمْ يَقْصِدِ الِاسْتِخْفَافَ بِحُكْمِ الشَّرْعِ إِنَّمَا قَصَدَ الإِنْكَارَ عَلَى هَذَا الْمُفْتِي الَّذِي أَفْتَى فَتْوًى بَاطِلَةً لِأَنَّهُ أَرَادَ أَنْ يَنْسُبَهُ إِلَى أَنَّهُ غَيْرُ مُوَافِقٍ لِشَرْعِ اللَّهِ فِي فَتْوَاهُ فَقَالَ هَذِهِ الْكَلِمَةَ بِقَصْدِ الِاسْتِخْفَافِ بِكَلامِ هَذَا الْمُفْتِيِّ كَأَنَّهُ يَقُولُ أَيْشٍ هَذَا الَّذِي تَزْعُمُهُ شَرْعًا وَلَيْسَ بِشَرْعٍ فَلا يَكْفُرُ وَبَاطِنُ كَلامِهِ أَنَّ هَذَا لَيْسَ شَرْعَ اللَّهِ إِنَّمَا رَأْيُكَ يَا أَيُّهَا الْمُفْتِيُّ. وَكَلِمَةُ أَيْشٍ أَصْلُهَا أَيُّ شَىْءٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":187},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ قَالَ لَعْنَةُ اللَّهِ عَلَى كُلِّ عَالِمٍ مُرِيدًا الِاسْتِغْرَاقَ الشَّامِلَ أَمَّا مَنْ لَمْ يُرِدِ الِاسْتِغْرَاقَ الشَّامِلَ لِجَمِيعِ الْعُلَمَاءِ بَلْ أَرَادَ لَعْنَ عُلَمَاءَ مَخْصُوصِينَ وَكَانَتْ هُنَاكَ قَرِينَةٌ تَدُلُّ عَلَى ذَلِكَ لِمَا يَظُنُّ بِهِمْ مِنْ فَسَادِ أَحْوَالِهِمْ فَإِنَّهُ لا يَكْفُرُ وَإِنْ كَانَ كَلامُهُ لا يَخْلُو مِنَ الْمَعْصِيَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":188},{"type":"p","text":"   الشَّرْحُ كَلِمَةُ لَعْنَةُ اللَّهِ عَلَى كُلِّ عَالِمٍ رِدَّةٌ لِأَنَّ مَعْنَاهَا الشُّمُولُ وَالِاسْتِغْرَاقُ لِكُلِّ الْعُلَمَاءِ وَالِاسْتِغْرَاقُ مَعْنَاهُ التَّعْمِيمُ أَمَّا مَنْ لَمْ يُرِدِ الِاسْتِغْرَاقَ الشَّامِلَ لِجَمِيعِ الْعُلَمَاءِ بَلْ أَرَادَ لَعْنَ عُلَمَاءِ زَمَانِهِ أَوْ أَهْلِ نَاحِيَتِهِ أَوْ طَائِفَةٍ مِنَ الْمُسْلِمِينَ لِأَنَّهُ لا يَعْلَمُ فِيهِمْ خَيْرًا وَكَانَتْ هُنَاكَ قَرِينَةٌ تَدُلُّ عَلَى ذَلِكَ فَإِنَّهُ لا يَكْفُرُ كَمَا لَوْ قَالَ «لَعْنَةُ اللَّهِ عَلَى كُلِّ عَالِمٍ فِي هَذَا الزَّمَنِ» لِأَنَّهُ يَعْتَقِدُهُمْ فَاسِدِينَ وَإِنْ كَانَ كَلامُهُ لا يَخْلُو مِنَ الْمَعْصِيَةِ فَالَّذِي يَقُولُ «لَعْنَةُ اللَّهِ عَلَى كُلِّ عَالِمٍ» مَعَ وُجُودِ قَرِينَةٍ تَدُلُّ عَلَى أَنَّهُ مَا أَرَادَ الشُّمُولَ كَأَنْ كَانَ ذَكَرَ هُوَ أَوْ غَيْرُهُ عُلَمَاءَ فَاسِدِينَ فَقَالَ «لَعْنَةُ اللَّهِ عَلَى كُلِّ عَالِمٍ» فَيُحْمَلُ كَلامُهُ عَلَى كُلِّ عَالِمٍ يَكُونُ مِنْ هَذَا الصِّنْفِ فَلا يَكْفُرُ. وَأَمَّا إِذَا قَالَ هَذِهِ الْكَلِمَةَ مِنْ غَيْرِ قَرِينَةٍ مَا تَدُلُّ عَلَى أَنَّهُ مَا أَرَادَ الِاسْتِغْرَاقَ فَإِنَّهُ يَكْفُرُ وَالْقَصْدُ وَحْدَهُ عِنْدَئِذٍ بِلا قَرِينَةٍ لا يَدْفَعُ عَنْهُ التَّكْفِيرَ وَالَّذِي لا يُكَفِّرُهُ فِي هَذِهِ الْحَالِ هُوَ يَكْفُرُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":189},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ قَالَ أَنَا بَرِيءٌ مِنَ اللَّهِ أَوْ مِنَ الْمَلائِكَةِ أَوْ مِنَ النَّبِيِّ أَوْ مِنَ الشَّرِيعَةِ أَوْ مِنَ الإِسْلامِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":190},{"type":"p","text":"   الشَّرْحُ أَنَّ قَائِلَ هَذِهِ الْكَلِمَاتِ يَكْفُرُ وَلَوْ لَمْ يَقْصِدِ الْمَعْنَى وَلَوْ كَانَ فِي حَالِ الْغَضَبِ لِأَنَّ الْغَضَبَ لَيْسَ عُذْرًا كَمَا تَقَدَّمَ وَلَكِنْ مَنْ قَالَ أَنَا بَرِيءٌ مِنَ النَّبِيِّ إِذَا قَالَ أَنَا أَرَدْتُ الأَرْضَ الْمُرْتَفِعَةَ مَا أَرَدْتُ نَبِيَّنَا مُحَمَّدًا لا يَكْفُرُ إِنْ كَانَ صَادِقًا فِيمَا يَقُولُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":191},{"type":"p","text":"   وَالشَّرِيعَةُ هِيَ مَا شَرَعَهُ اللَّهُ لِلأَنْبِيَاءِ وَهِيَ الأَحْكَامُ الَّتِي تَنْزِلُ بِالْوَحْيِ وَأَمَّا الدِّينُ فَهُوَ الْعَقِيدَةُ وَدِينُ الأَنْبِيَاءِ وَاحِدٌ هُوَ الإِسْلامُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":192},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ قَالَ لا أَعْرِفُ الْحُكْمَ مُسْتَهْزِئًا بِحُكْمِ اللَّهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":193},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ قَالَ لا أَعْرِفُ الْحُكْمَ بَعْدَمَا حَكَمَ عَلَيْهِ قَاضٍ شَرْعِيٌّ مَثَلًا بِحُكْمٍ شَرْعِيٍّ وَكَانَ قَصْدُهُ الِاسْتِخْفَافَ بِالشَّرْعِ وَأَنَّهُ لا يَعْتَبِرُ هَذَا الْحُكْمَ فَإِنَّهُ كَافِرٌ مُرْتَدٌّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":194},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ قَالَ وَقَدْ مَلأَ وِعَاءً ﴿وَكَأْسًا دِهَاقًا﴾ [سُورَةَ النَّبَأ/34].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":195},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ قَالَ وَهُوَ يَمْلَأُ وِعَاءً شَرَابًا ﴿وَكَأْسًا دِهَاقًا﴾ بِقَصْدِ الِاسْتِخْفَافِ بِمَا وَعَدَ اللَّهُ بِهِ الْمُؤْمِنِينَ فِي الْجَنَّةِ مِنَ الْكَأْسِ الْمُمْتَلِئَةِ شَرَابًا هَنِيئًا فَقَدْ كَفَرَ كَأَنْ يَعْنِيَ بِكَلامِهِ أَنَّ ذَاكَ الَّذِي ذَكَرَهُ اللَّهُ مِثْلُ هَذَا الَّذِي أَنَا أَمْلَؤُهُ. وَمَعْنَى ﴿وَكَأْسًا دِهَاقًا﴾ أَيْ كَأْسًا مُمْتَلِئَةً بِالشَّرَابِ [وَالْوِعَاءُ إِذَا كَانَ فِيهِ شَرَابٌ يُقَالُ لَهُ كَأْسٌ وَإِذَا لَمْ يَكُنْ فِيهِ شَرَابٌ فَلا يُسَمَّى كَأْسًا].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":196},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ أَفْرَغَ شَرَابًا فَقَالَ ﴿فَكَانَتْ سَرَابًا﴾ [سُورَةَ النَّبَأ/20].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":197},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ أَفْرَغَ شَرَابًا كَأَنْ كَانَ فِي إِنَاءٍ ثُمَّ حَوَّلَهُ إِلَى إِنَاءٍ ءَاخَرَ فَقَالَ ﴿فَكَانَتْ سَرَابًا﴾ اسْتِخْفَافًا بِالآيَةِ كَفَرَ. وَهَذِهِ الآيَةُ فِيهَا أَنَّ الْجِبَالَ حِينَ تُسَيَّرُ يَوْمَ الْقِيَامَةِ تَكُونُ كَالسَّرَابِ مَعْنَاهُ تَمُرُّ مُرُورًا سَرِيعًا كَمَا أَنَّ السَّرَابَ كُلَّمَا اقْتَرَبْتَ مِنْهُ يَبْعُدُ فَمَنْ أَوْرَدَ هَذِهِ الآيَةَ عِنْدَ إِفْرَاغِ الشَّرَابِ وَقَصَدَ بِذَلِكَ أَنَّ هَذَا الَّذِي يَحْصُلُ يَوْمَ الْقِيَامَةِ مَا لَهُ شَأْنٌ يَكْفُرُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":198},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ عِنْدَ وَزْنٍ أَوْ كَيْلٍ ﴿وَإِذَا كَالُوهُمْ أَوْ وَزَنُوهُمْ يُخْسِرُونَ﴾ [سُورَةَ الْمُطَفِّفِينَ/3].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":199},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ قَالَ عِنْدَمَا يَزِنُ شَيْئًا أَوْ يَكِيلُ شَيْئًا ﴿وَإِذَا كَالُوهُمْ أَوْ وَزَنُوهُمْ يُخْسِرُونَ﴾ بِقَصْدِ الِاسْتِخْفَافِ بِمَعْنَى الآيَةِ كَفَرَ. وَهَذِهِ الآيَةُ مَعْنَاهَا ذَمٌّ لِلَّذِينَ إِذَا كَالُوا لِلنَّاسِ أَوْ وَزَنُوا لَهُمْ يَنْقُصُونَ عَلَيْهِمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":200},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ عِنْدَ رُؤْيَةِ جَمْعٍ ﴿وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِّنْهُمْ أَحَدًا﴾ [سُورَةَ الْكَهْفِ/47].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":201},{"type":"p","text":"   الشَّرْحُ أَنَّ الَّذِي يَقُولُ عِنْدَ رُؤْيَةِ جَمْعٍ مِنَ النَّاسِ كَثِيرٍ ﴿وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِّنْهُمْ أَحَدًا﴾ بِقَصْدِ الِاسْتِخْفَافِ بِهَذِهِ الآيَةِ فَقَدْ كَفَرَ. وَهَذِهِ الآيَةُ وَرَدَتْ فِي حَشْرِ النَّاسِ يَوْمَ الْقِيَامَةِ فَقَدْ أَخْبَرَ اللَّهُ تَعَالَى أَنَّهُمْ يُحْشَرُونَ وَلا يُتْرَكُ مِنْهُمْ أَحَدٌ أَيْ يُحْشَرُونَ كُلُّهُمْ بِلا اسْتِثْنَاءٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":202},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: بِقَصْدِ الِاسْتِخْفَافِ فِي الْكُلِّ بِمَعْنَى هَذِهِ الآيَاتِ وَكَذَا كُلُّ مَوْضِعٍ اسْتُعْمِلَ فِيهِ الْقُرْءَانُ بِذَلِكَ الْقَصْدِ فَإِنْ كَانَ بِغَيْرِ ذَلِكَ الْقَصْدِ فَلا يَكْفُرُ لَكِنْ قَالَ الشَّيْخُ أَحْمَدُ بنُ حَجَرٍ لا تَبْعُدُ حُرْمَتُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":203},{"type":"p","text":"   الشَّرْحُ يَقُولُ الشَّيْخُ أَحْمَدُ بنُ حَجَرٍ الْهَيْتَمِيُّ إِيرَادُ الآيَاتِ فِي هَذِهِ الْمَوَاضِعِ لَوْ لَمْ يَكُنْ عَلَى وَجْهِ الِاسْتِخْفَافِ لا يَبْعُدُ أَنْ نَحْكُمَ عَلَيْهِ بِالْحُرْمَةِ أَيْ هُوَ حَرَامٌ لِأَنَّهُ إِسَاءَةُ أَدَبٍ مَعَ الْقُرْءَانِ فَإِنْ كَانَ عَلَى وَجْهِ الِاسْتِخْفَافِ فَهُوَ كُفْرٌ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":204},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَذَا يَكْفُرُ مَنْ شَتَمَ نَبِيًّا أَوْ مَلَكًا أَوْ قَالَ أَكُونُ قَوَّادًا إِنْ صَلَّيْتُ أَوْ مَا أَصَبْتُ خَيْرًا مُنْذُ صَلَّيْتُ أَوِ الصَّلاةُ لا تَصْلُحُ لِي بِقَصْدِ الِاسْتِهْزَاءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":205},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ شَتَمَ نَبِيًّا أَوْ مَلَكًا يَخْرُجُ مِنَ الإِسْلامِ وَلا فَرْقَ فِي سَبِّ الْمَلَكِ بَيْنَ أَنْ يَكُونَ ذَلِكَ الْمَلَكُ جِبْرِيلَ أَوْ عَزْرَائِيلَ أَوْ غَيْرَهُمَا. وَمِثْلُهُ الَّذِي يَقُولُ أَكُونُ قَوَّادًا إِنْ صَلَّيْتُ فَإِنَّهُ اسْتَهْزَأَ بِالصَّلاةِ وَاسْتَخَفَّ بِهَا وَلِذَلِكَ يَكْفُرُ، وَالْقَوَّادُ هُوَ الَّذِي يَجْلِبُ الزَّبَائِنَ لِلزَّانِيَاتِ. وَكَذَلِكَ الَّذِي يَقُولُ مَا أَصَبْتُ خَيْرًا مُنْذُ صَلَّيْتُ. وَمِثْلُ ذَلِكَ قَوْلُ بَعْضِ الْعَوَامِّ صُمْ وَصَلِّ تَرْكَبْكَ الْقِلَّةُ [أَمَّا إِنْ أَرَادَ أَنَّ الْمُؤْمِنَ كُلَّمَا اجْتَهَدَ فِي الْعِبَادَةِ يَكْثُرُ عَلَيْهِ الْبَلاءُ فَهَذَا لا يَكْفُرُ]. وَكَذَلِكَ الَّذِي يَقُولُ الصَّلاةُ لا تَصْلُحُ لِي بِقَصْدِ الِاسْتِهْزَاءِ أَيْ إِنْ أَرَادَ بِذَلِكَ الِاسْتِهْزَاءَ بالصَّلاةِ وَهَذَا حَالُ مَنْ يَلْهَجُ بِهَذِهِ الْكَلِمَةِ عَادَةً. أَمَّا لَوْ قَالَتِ امْرَأَةٌ حَائِضٌ الصَّلاةُ لا تَصْلُحُ لِي وَقَصْدُهَا أَنَّهُ لا تَجُوزُ لَهَا الصَّلاةُ فِي أَيَّامِ الْحَيْضِ فَإِنَّ ذَلِكَ لَيْسَ رِدَّةً وَكَذَلِكَ لَوْ قَالَ ذَلِكَ إِنْسَانٌ مُبْتَلًى بِسَلَسِ الْبَوْلِ جَاهِلٌ لا يَعْرِفُ أَحْكَامَ السَّلَسِ يَظُنُّ أَنَّهُ لا يُصَلِّي فِي حُكْمِ الشَّرْعِ حَتَّى يَذْهَبَ عَنْهُ السَّلَسُ فَلا نُكَفِّرُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":206},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ قَالَ لِمُسْلِمٍ أَنَا عَدُوُّكَ وَعَدُوُّ نَبِيِّكَ أَوْ لِشَرِيفٍ أَنَا عَدُوُّكَ وَعَدُوُّ جَدِّكَ مُرِيدًا النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَوْ يَقُولَ شَيْئًا مِنْ نَحْوِ هَذِهِ الأَلْفَاظِ الْبَشِعَةِ الشَّنِيعَةِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":207},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ أَلْفَاظِ الْكُفْرِ الْمُثْبِتَةِ لِلرِّدَّةِ أَنْ يَقُولَ شَخْصٌ لِمُسْلِمٍ أَنَا عَدُوُّكَ وَعَدُوُّ نَبِيِّكَ وَالِاسْتِخْفَافُ فِي هَذَا ظَاهِرٌ فَلِذَلِكَ يُكَفَّرُ قَائِلُهُ. وَقَدْ قَالَ الْعُلَمَاءُ مِنْهُمْ أَبُو يُوسُفَ الْقَاضِي بِكُفْرِ مَنْ سَبَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ ابْنُ سُحْنُون الْمَالِكِيُّ «مَنْ شَكَّ فِي كُفْرِهِ وَعَذَابِهِ كَفَرَ» اهـ فَإِنْ كَانَ هَذَا فِي سَابِّ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَكَيْفَ فِي سَابِّ اللَّهِ تَعَالَى. وَكَذَلِكَ يَكْفُرُ الَّذِي قَالَ لِشَرِيفٍ أَيْ لإِنْسَانٍ حَسَنِيٍّ أَوْ حُسَيْنِيٍّ أَيْ مَنْسُوبٍ إِلَى الْحَسَنِ أَوِ الْحُسَيْنِ اللَّذَيْنِ هُمَا سِبْطَا رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَيِ ابْنَا بِنْتِهِ فَاطِمَةَ أَنَا عَدُوُّكَ وَعَدُوُّ جَدِّكَ هَذَا إِذَا أَرَادَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِقَوْلِهِ جَدِّكَ عِنْدَئِذٍ يَكُونُ قَوْلُهُ هَذَا كُفْرًا أَمَّا إِذَا أَرَادَ جَدًّا لَهُ أَدْنَى وَلَمْ يُرِدِ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَلا نُكَفِّرُهُ. وَكَذَلِكَ كُلُّ لَفْظٍ يَدُلُّ عَلَى الِاسْتِخْفَافِ بِالنَّبِيِّ أَوْ إِلْحَاقِ نَقْصٍ بِهِ عَلَيْهِ الصَّلاةُ وَالسَّلامُ أَوْ بِاللَّهِ كَالأَلْفَاظِ الَّتِي تَدُلُّ عَلَى تَغَيُّرِ مَشِيئَةِ اللَّهِ الأَزَلِيَّةِ كَأَنْ تَدُلَّ عَلَى أَنَّهُ شَاءَ فِي الأَزَلِ حُدُوثَ شَىْءٍ ثُمَّ غَيَّرَ تِلْكَ الْمَشِيئَةَ أَوْ تَدُلَّ عَلَى أَنَّ اللَّهَ كَانَ عَلِمَ أَنَّ هَذَا الأَمْرَ كَذَا ثُمَّ عَلِمَهُ عَلَى خِلافِ ذَلِكَ فَهَذَا كُلُّهُ كُفْرٌ فَمِنَ الأَلْفَاظِ الْكُفْرِيَّةِ قَوْلُ بَعْضِهِمْ كَانَ اللَّهُ يُرِيدُ أَنْ يَخْلُقَ فُلانَةَ ذَكَرًا ثُمَّ خَلَقَهَا أُنْثَى وَعَكْسُهُ فَإِنَّ فِي ذَلِكَ نِسْبَةَ الْجَهْلِ إِلَى اللَّهِ وَنِسْبَةَ تَغَيُّرِ الْمَشِيئَةِ الأَزَلِيَّةِ وَاللَّهُ لا يَجُوزُ عَلَيْهِ التَّغَيُّرُ فِي ذَاتِهِ أَوْ فِي صِفَةٍ مِنْ صِفَاتِهِ لِأَنَّ التَّغَيُّرَ عَلامَةُ الْحُدُوثِ وَالْحُدُوثُ يُنَافِي الأُلُوهِيَّةَ. وَمَا يُوهِمُ ظَاهِرُهُ مِنَ النُّصُوصِ خِلافَ ذَلِكَ هُوَ مُتَأَوَّلٌ لا يُرَادُ بِهِ ذَلِكَ الظَّاهِرُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":208},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَدْ عَدَّ كَثِيرٌ مِنَ الْفُقَهَاءِ كَالْفَقِيهِ الْحَنَفِيِّ بَدْرِ الرَّشِيدِ وَالْقَاضِي عِيَاضٍ الْمَالِكِيِّ رَحِمَهُمَا اللَّهُ أَشْيَاءَ كَثِيرَةً فَيَنْبَغِي الِاطِّلاعُ عَلَيْهَا فَإِنَّ مَنْ لَمْ يَعْرِفِ الشَّرَّ يَقَعُ فِيهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":209},{"type":"p","text":"   الشَّرْحُ أَنَّ بَعْضَ الْفُقَهَاءِ مِنْ شَافِعِيِّينَ وَمَالِكِيَّةٍ وَغَيْرِهِمْ ذَكَرُوا كَثِيرًا مِمَّا هُوَ رِدَّةٌ وَأَكْثَرُهُمْ تَعْدَادًا الْحَنَفِيَّةُ. أَمَّا بَدْرُ الرَّشِيدِ فَهُوَ فَقِيهٌ حَنَفِيٌّ مِنْ أَهْلِ الْقَرْنِ الثَّامِنِ الْهِجْرِيِّ أَلَّفَ رِسَالَةً فِي أَلْفَاظِ الْكُفْرِ وَأَمَّا الْقَاضِي عِيَاضٌ فَهُوَ مَالِكِيٌّ تُوُفِّيَ فِي الْقَرْنِ السَّادِسِ. كُلٌ مِنَ الْمَذَاهِبِ الأَرْبَعَةِ أَلَّفَ بَعْضُ فُقَهَائِهِ رَسَائِلَ فِي بَيَانِ الْكُفْرِيَّاتِ لِأَنَّهُ كَانَ ظَهَرَ فِي عُصُورِهِمْ كَلِمَاتٌ بَيْنَ النَّاسِ هِيَ كُفْرٌ فَأَرَادُوا إِنْقَاذَ النَّاسِ مِنْ خَطَرِهَا فَأَلَّفُوا تِلْكَ الرَّسَائِلَ وَهَذَا مِنْ أَفْضَلِ الأَعْمَالِ لِأَنَّ فِي ذَلِكَ إِنْقَاذًا لِمَنْ حَصَلَتْ مِنْهُ تِلْكَ الْكَلِمَاتُ مِنَ الْكُفْرِ إِلَى الإِيمَانِ وَتَحْذِيرًا لِمَنْ لَمْ يَقَعْ فِيهَا حَتَّى لا يَقَعَ فِيهَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":210},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْقَاعِدَةُ أَنَّ كُلَّ عَقْدٍ أَوْ فِعْلٍ أَوْ قَوْلٍ يَدُلُّ عَلَى اسْتِخْفَافٍ بِاللَّهِ أَوْ كُتُبِهِ أَوْ رُسُلِهِ أَوْ مَلائِكَتِهِ أَوْ شَعَائِرِهِ أَوْ مَعَالِمِ دِينِهِ أَوْ أَحْكَامِهِ أَوْ وَعْدِهِ أَوْ وَعِيدِهِ كُفْرٌ فَلْيَحْذَرِ الإِنْسَانُ مِنْ ذَلِكَ جَهْدَهُ عَلَى أَيِّ حَالٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":211},{"type":"p","text":"   الشَّرْحُ أَنَّ مَا كَانَ دَالًّا عَلَى الِاسْتِخْفَافِ وَالِاسْتِهْزَاءِ بِاللَّهِ وَأُمُورِ الدِّينِ هُوَ كُفْرٌ أَمَّا مَا كَانَ فِيهِ إِخْلالٌ بِالتَّعْظِيمِ وَالأَدَبِ مِمَّا هُوَ دُونَ الِاسْتِخْفَافِ فَإِنَّهُ حَرَامٌ كَمَسِّ الْمُصْحَفِ مِنْ غَيْرِ وُضُوءٍ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":212},{"type":"p","text":"   وَالْعَقْدُ مَعْنَاهُ الِاعْتِقَادُ. وَالْمَعَالِمُ جَمْعُ مَعْلَمٍ وَالشَّعَائِرُ جَمْعُ شَعِيرَةٍ وَالْمَعْلَمُ بِمَعْنَى الشَّعِيرَةِ وَهُوَ مَا كَانَ مَشْهُورًا مِنْ أُمُورِ الدِّينِ كَالصَّلاةِ وَالْحَجِّ وَالزَّكَاةِ وَالأَذَانِ وَالْمَسَاجِدِ وَعِيدِ الأَضْحَى وَعِيدِ الْفِطْرِ كُلُّ ذَلِكَ يُسَمَّى شَعِيرَةً مِنْ شَعَائِرِ الدِّينِ وَمَعْلَمًا مِنْ مَعَالِمِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":213},{"type":"p","text":"   وَقَالَ الْفُقَهَاءُ يُسْتَثْنَى مِنَ الْكُفْرِ الْقَوْلِيِّ حَالَةُ سَبْقِ اللِّسَانِ أَيْ أَنْ يَتَكَلَّمَ الشَّخْصُ بِشَىْءٍ مِنْ ذَلِكَ مِنْ غَيْرِ إِرَادَةٍ بَلْ جَرَى عَلَى لِسَانِهِ وَلَمْ يَقْصِدْ قَوْلَهُ بِالْمَرَّةِ، وَحَالَةُ غَيْبُوبَةِ الْعَقْلِ أَيْ عَدَمِ صَحْوِ الْعَقْلِ، وَحَالَةُ الإِكْرَاهِ فَمَنْ نَطَقَ بِالْكُفْرِ بِلِسَانِهِ مُكْرَهًا بِالْقَتْلِ وَنَحْوِهِ وَقَلْبُهُ مُطْمَئِنٌ بِالإِيمَانِ غَيْرَ شَارِحٍ صَدْرَهُ بِالْكُفْرِ الَّذِي يَجْرِي عَلَى لِسَانِهِ فَلا يَكْفُرُ، وَحَالَةُ الْحِكَايَةِ لِكُفْرِ الْغَيْرِ فَلا يَكْفُرُ الْحَاكِي كُفْرَ غَيْرِهِ. ثُمَّ الْحِكَايَةُ الْمَانِعَةُ لِكُفْرِ حَاكِي الْكُفْرِ إِمَّا أَنْ تَكُونَ فِي أَوَّلِ الْكَلِمَةِ الَّتِي يَحْكِيهَا عَمَّنْ كَفَرَ أَوْ بَعْدَ ذِكْرِهِ الْكَلِمَةَ عَقِبَهَا أَيْ وَكَانَ فِي نِيَّتِهِ أَنْ يُؤَخِّرَ أَدَاةَ الْحِكَايَةِ مِنَ الِابْتِدَاءِ فَلَوْ قَالَ اللَّهُ سَاكِنُ السَّمَاءِ قَوْلُ الْمُجَسِّمَةِ أَوْ قَالَتْهُ الْمِجَسِّمَةُ فَهِيَ حِكَايَةٌ مَانِعَةٌ لِلْكُفْرِ عَنِ الْحَاكِي. وَإِنْ قُدِّمَتْ أَدَاةُ الْحِكَايَةِ لِكَلِمَةِ الْكُفْرِ فَهِيَ أَحْسَنُ. وَقَدْ تَكُونُ أَدَاةُ الْحِكَايَةِ مُقَدَّرَةً كَالَّذِي يَقُولُ مَاذَا تَقُولُ الْيَهُودُ فِي عُزَيْرٍ فَيَقُولُ الْمَسْؤُولُ ابْنَ اللَّهِ فَلا يُشْتَرَطُ أَنْ يَقُولَ يَقُولُونَ ابْنَ اللَّهِ لِأَنَّ الْحِكَايَةَ هُنَا تَقْدِيرِيَّةٌ اهـ وَتُسْتَثْنَى حَالَةُ كَوْنِ الشَّخْصِ مُتَأَوِّلًا بِاجْتِهَادِهِ فِي فَهْمِ الشَّرْعِ فَإِنَّهُ لا يَكْفُرُ الْمُتَأَوِّلُ أَيْ فِي غَيْرِ الْقَطْعِيَّاتِ كَتَأَوُّلِ الَّذِينَ مَنَعُوا الزَّكَاةَ فِي عَهْدِ أَبِي بَكْرٍ بِأَنَّ الزَّكَاةَ وَجَبَتْ فِي عَهْدِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِأَنَّ صَلاتَهُ عَلَيْهِمْ عِنْدَ دَفْعِ الزَّكَاةِ إِلَيْهِ كَانَتْ سَكَنًا لَهُمْ وَطُهْرَةً وَأَنَّ ذَلِكَ انْقَطَعَ بِمَوْتِهِ فَإِنَّ الصَّحَابَةَ لَمْ يُكَفِّرُوهُمْ لِذَلِكَ. وَلَيْسَ كُلُّ مُتَأَوِّلٍ يَمْنَعُ عَنْهُ تَأْوِيلُهُ التَّكْفِيرَ لِأَنَّ التَّأَوُّلَ مَعَ قِيَامِ الدَّلِيلِ الْقَاطِعِ لا يَمْنَعُ التَّكْفِيرَ عَنْ صَاحِبِهِ وَإِلَّا لَلَزِمَ تَرْكُ تَكْفِيرِ الْمَجُوسِ وَعَبَدَةِ الأَوْثَانِ وَغَيْرِهِمْ مِنْ طَوَائِفِ الْكُفَّارِ لِأَنَّهُمْ عَلَى حَسَبِ زَعْمِهِمُ اجْتَهَدُوا فَالَّذِي يَعْتَقِدُ أَنَّ كُلَّ مُتَأَوِّلٍ يُعْذَرُ مَهْمَا كَانَ تَأَوُّلُهُ فَقَدْ كَذَّبَ الشَّرِيعَةَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":214},{"type":"p","text":"   وَمَعْنَى «فَلْيَحْذَرِ الإِنْسَانُ مِنْ ذَلِكَ جَهْدَهُ عَلَى أَيِّ حَالٍ» أَيْ لِيَعْمَلِ الإِنْسَانُ عَلَى تَجَنُّبِ ذَلِكَ كُلِّهِ غَايَةَ مُسْتَطَاعِهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":215},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":216},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَحْكَامِ الْمُرْتَدِّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":217},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ عَلَى مَنْ وَقَعَ فِي الرِّدَّةِ الْعَوْدُ فَوْرًا إِلَى الإِسْلامِ بِالنُّطْقِ بِالشَّهَادَتَيْنِ وَالإِقْلاعِ عَمَّا وَقَعَتْ بِهِ الرِّدَّةُ وَيَجِبُ عَلَيْهِ النَّدَمُ عَلَى مَا صَدَرَ مِنْهُ وَالْعَزْمُ عَلَى أَنْ لا يَعُودَ لِمِثْلِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":218},{"type":"p","text":"   الشَّرْحُ أَنَّ الْحُكْمَ الشَّرْعِيَّ لِمَنْ وَقَعَ فِي رِدَّةٍ أَنَّهُ يَجِبُ عَلَيْهِ الرُّجُوعُ إِلَى الإِسْلامِ بِالنُّطْقِ بِالشَّهَادَتَيْنِ مَعَ تَرْكِ مَا هُوَ سَبَبُ الرِّدَّةِ أَيِ الأَمْرِ الَّذِي حَصَلَتْ بِهِ الرِّدَّةُ. وَيُشْتَرَطُ لِصِحَّةِ الرُّجُوعِ إِلَى الإِسْلامِ أَنْ لا يَعْزِمَ عَلَى الْكُفْرِ فِي الْمُسْتَقْبَلِ وَلا يَتَرَدَّدَ فِي ذَلِكَ فَإِنَّهُ إِنْ نَوَى أَنْ يَعُودَ إِلَى الْكُفْرِ أَوْ تَرَدَّدَ فِي ذَلِكَ لَمْ تَنْفَعْهُ الشَّهَادَةُ لِأَنَّ الْعَزْمَ عَلَى الْكُفْرِ فِي الْمُسْتَقْبَلِ كُفْرٌ فِي الْحَالِ، فَلَوْ لَمْ يَنْوِ الرُّجُوعَ إِلَى الْكُفْرِ وَلا تَرَدَّدَ فِي ذَلِكَ لَكِنَّهُ لَمْ يَسْتَحْضِرِ النَّدَمَ فِي قَلْبِهِ وَلا الْعَزْمَ عَلَى أَنْ لا يَعُودَ لِمِثْلِهِ إِنَّمَا تَرَكَ الشَّىْءَ الَّذِي هُوَ رِدَّةٌ وَتَشَهَّدَ صَحَّ إِسْلامُهُ لَكِنْ يَبْقَى عَلَيْهِ أَنْ يَنْدَمَ وَيَعْزِمَ عَلَى عَدَمِ الْعَوْدِ لِأَنَّ شَأْنَ كُلِّ مَعْصِيَةٍ أَنَّهُ يَجِبُ الإِقْلاعُ عَنْهَا وَالْعَزْمُ عَلَى تَرْكِ الْعَوْدِ إِلَيْهَا وَالنَّدَمُ عَلَى فِعْلِهَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":219},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَإِنْ لَمْ يَرْجِعْ عَنْ كُفْرِهِ بِالشَّهَادَةِ وَجَبَتِ اسْتِتَابَتُهُ وَلا يُقْبَلُ مِنْهُ إِلَّا الإِسْلامُ أَوِ الْقَتْلُ بِهِ يُنَفِّذُهُ عَلَيْهِ الْخَلِيفَةُ بَعْدَ أَنْ يَعْرِضَ عَلَيْهِ الرُّجُوعَ إِلَى الإِسْلامِ. وَيَعْتَمِدُ الْخَلِيفَةُ فِي ذَلِكَ عَلَى شَهَادَةِ شَاهِدَيْنِ عَدْلَيْنِ أَوْ عَلَى اعْتِرَافِهِ وَذَلِكَ لِحَدِيثِ الْبُخَارِيِّ «مَنْ بَدَّلَ دِينَهُ فَاقْتُلُوهُ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":220},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ حَصَلَتْ مِنْهُ الرِّدَّةُ وَلَمْ يُتْبِعْهَا بِالتَّوْبَةِ أَيْ لَمْ يَرْجِعْ عَنْ رِدَّتِهِ وَجَبَتِ اسْتِتَابَتُهُ أَيْ أَنْ يُطْلَبَ مِنْهُ الرُّجُوعُ إِلَى الإِسْلامِ فَيَجِبُ عَلَى الإِمَامِ أَيِ الْخَلِيفَةِ أَوْ مَنْ يَقُومُ مَقَامَهُ أَنْ يَطْلُبَ مِنْهُ الرُّجُوعَ إِلَى الإِسْلامِ ثُمَّ لا يَقْبَلُ مِنْهُ الإِمَامُ إِلَّا الإِسْلامَ فَإِنْ أَسْلَمَ تَرَكَهُ مِنَ الْقَتْلِ وَإِلَّا قَتَلَهُ سَوَاءٌ كَانَ ذَكَرًا أَوْ أُنْثَى وَذَلِكَ لِقَوْلِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «مَنْ بَدَّلَ دِينَهُ فَاقْتُلُوهُ» رَوَاهُ الْبُخَارِيُّ أَيْ مَنْ خَرَجَ مِنَ الإِسْلامِ إِلَى غَيْرِهِ فَاقْتُلُوهُ إِنْ لَمْ يَرْجِعْ. وَلا يَجُوزُ قَتْلُهُ قَبْلَ الِاسْتِتَابَةِ وَمَنْ قَتَلَهُ قَبْلَهَا فَعَلَيْهِ ذَنْبٌ لَكِنَّهُ لا يُقْتَصُّ مِنْهُ أَيْ لا يُقْتَلُ بِهَذَا الْمُرْتَدِّ. وَيَعْتَمِدُ الْخَلِيفَةُ فِي الْحُكْمِ عَلَى الْمُرْتَدِّ بِالرِّدَّةِ عَلَى أَحَدِ أَمْرَيْنِ إِمَّا أَنْ يَعْتَرِفَ هُوَ بِأَنَّهُ قَالَ كَلِمَةَ الْكُفْرِ أَوْ فَعَلَ فِعْلَ الْكُفْرِ وَإِمَّا أَنْ يَشْهَدَ عَلَيْهِ رَجُلانِ عَدْلانِ شَهَادَةً مُفَصَّلَةً فَيُعْلَمُ مِنْ هَذَا أَنَّهُ لا يُحْكَمُ عَلَى الشَّخْصِ بِالرِّدَّةِ لِمُجَرَّدِ شَهَادَةِ وَاحِدٍ عَلَيْهِ بِذَلِكَ وَلَوْ كَانَ عَدْلًا وَكَذَلِكَ لا يُحْكَمُ عَلَيْهِ بِذَلِكَ إِذَا شَهِدَتْ عَلَيْهِ امْرَأَتَانِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":221},{"type":"p","text":"   وَأَمَّا الدَّلِيلُ عَلَى أَنَّ الدُّخُولَ فِي الإِسْلامِ يَكُونُ بِالنُّطْقِ بِالشَّهَادَتَيْنِ فَمَأْخُوذٌ مِنْ حَدِيثِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ» وَقَدْ نَصَّ عَلَى ذَلِكَ أَيْضًا فُقَهَاءُ الْمَذَاهِبِ الأَرْبَعَةِ كَالنَّوَوِيِّ فِي رَوْضَةِ الطَّالِبِينَ وَالْبُهُوتِيِّ مِنَ الْحَنَابِلَةِ فِي كَشَّافِ الْقِنَاعِ وَغَيْرِهِمَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":222},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَبْطُلُ بِهَا صَوْمُهُ وَتَيَمُّمُهُ وَنِكَاحُهُ قَبْلَ الدُّخُولِ وَكَذَا بَعْدَهُ إِنْ لَمْ يَعُدْ إِلَى الإِسْلامِ فِي الْعِدَّةِ وَلا يَصِحُّ عَقْدُ نِكَاحِهِ عَلَى مُسْلِمَةٍ وَغَيْرِهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":223},{"type":"p","text":"   الشَّرْحُ هَذِهِ الْمَذْكُورَاتُ بَعْضُ مَا يَتَعَلَّقُ بِالْمُرْتَدِّ مِنَ الأَحْكَامِ فَمِنْ ذَلِكَ أَنَّ الرِّدَّةَ تُبْطِلُ الصِّيَامَ وَالتَّيَمُّمَ أَمَّا الْوُضُوءُ فَلا يَنْتَقِضُ بِالرِّدَّةِ. وَمِنْ ذَلِكَ أَنَّ نِكَاحَهُ بَطَلَ بِمُجَرَّدِ الرِّدَّةِ مِنْ أَحَدِ الزَّوْجَيْنِ قَبْلَ الدُّخُولِ بِالزَّوْجَةِ فَالرِّدَّةُ قَبْلَ الدُّخُولِ تَقْطَعُ النِّكَاحَ وَلا تَحِلُّ لَهُ وَلَوْ عَادَ إِلَى الإِسْلامِ أَوْ عَادَتْ هِيَ إِلَى الإِسْلامِ إِلَّا بِنِكَاحٍ جَدِيدٍ وَأَمَّا إِذَا كَانَتِ الرِّدَّةُ بَعْدَ الدُّخُولِ بِهَا فَلا يَجُوزُ لَهُمَا الِاسْتِمْرَارُ فِي الْمُعَاشَرَةِ كَالزَّوْجَيْنِ بَلْ يَكُونُ نِكَاحُهُمَا مَوْقُوفًا وَيَبْدَأُ مِنْ حِينِ الرِّدَّةِ وَقْتُ الْعِدَّةِ فَإِنْ عَادَ إِلَى الإِسْلامِ قَبْلَ انْتِهَاءِ الْعِدَّةِ وَهِيَ ثَلاثَةُ أَطْهَارٍ لِذَوَاتِ الْحَيْضِ وَثَلاثَةُ أَشْهُرٍ لِمَنْ لا تَحِيضُ وَلِلْحَامِلِ حَتَّى تَضَعَ حَمْلَهَا تَبَيَّنَ بَقَاءُ النِّكَاحِ بَيْنَهُمَا بِلا تَجْدِيدٍ وَإِنِ انْتَهَتِ الْعِدَّةُ قَبْلَ عَوْدِ الَّذِي ارْتَدَّ مِنْهُمَا إِلَى الإِسْلامِ تَبَيَّنَ انْقِطَاعُ النِّكَاحِ مِنْ حِينِ الرِّدَّةِ وَلا يَعُودُ إِلَّا بِعَقْدٍ جَدِيدٍ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":224},{"type":"p","text":"   وَمِنْهَا أَنَّهُ لا يَصِحُّ عَقْدُ النِّكَاحِ لِمُرْتَدٍّ لا عَلَى مُرْتَدَّةٍ مِثْلِهِ وَلا عَلَى مُسْلِمَةٍ أَوْ يَهُودِيَّةٍ أَوْ نَصْرَانِيَّةٍ أَوْ وَثَنِيَّةٍ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":225},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَحْرُمُ ذَبِيحَتُهُ وَلا يَرِثُ وَلا يُورَثُ [وَفِي الْحَدِيثِ «لا يَرِثُ الْمُسْلِمُ الْكَافِرَ وَلا الْكَافِرُ الْمُسْلِمَ» اهـ] وَلا يُصَلَّى عَلَيْهِ وَلا يُغَسَّلُ وَلا يُكَفَّنُ وَلا يُدْفَنُ فِي مَقَابِرِ الْمُسْلِمِينَ وَمَالُهُ فَىْءٌ أَيْ لِبَيْتِ الْمَالِ إِنْ كَانَ بَيْتُ مَالٍ مُسْتَقِيمٌ أَمَّا إِنْ لَمْ يَكُنْ فَإِنْ تَمَكَّنَ رَجُلٌ صَالِحٌ مِنْ أَخْذِهِ وَصَرْفِهِ فِي مَصَالِحِ الْمُسْلِمِينَ فَعَلَ ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":226},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ جُمْلَةِ أَحْكَامِ الْمُرْتَدِّ أَنَّهُ تَحْرُمُ ذَبِيحَتُهُ فَلَوْ ذَبَحَ ذَبِيحَةً فَهِيَ مَيْتَةٌ يَحْرُمُ أَكْلُهَا [وَأَمَّا الْمُسْلِمُ فَتَحِلُّ ذَبِيحَتُهُ وَلَوِ امْرَأَةً أَوْ صَبِيًّا]. وَمِنْهَا أَنَّهُ لا يَرِثُ أَيْ لا يَرِثُ قَرِيبَهُ الْمُسْلِمَ إِذَا مَاتَ بِالإِجْمَاعِ وَلا يُورَثُ أَيْ لا يَرِثُهُ قَرِيبُهُ الْمُسْلِمُ [وَكَذَا غَيْرُ الْمُسْلِمِ] إِذَا مَاتَ هَذَا الْمُرْتَدُّ. وَمِنْهَا أَنَّهُ لا يُصَلَّى عَلَيْهِ أَيْ لا تَجُوزُ الصَّلاةُ عَلَيْهِ إِنْ مَاتَ وَلا يُغَسَّلُ أَيْ لا يَجِبُ غَسْلُهُ فَلَوْ غُسِّلَ لَمْ يَكُنْ فِي ذَلِكَ إِثْمٌ. وَلا يُكَفَّنُ فَلَوْ كُفِّنَ لَمْ يَحْرُمْ. وَلا يُدْفَنُ فِي مَقَابِرِ الْمُسْلِمِينَ أَيْ لا يَجُوز

ndex":368},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ وَتَبْطُلُ الصَّلاةُ بِالْكَلامِ وَلَوْ بِحَرْفَيْنِ أَوْ بِحَرْفٍ مُفْهِمٍ إِلَّا أَنْ نَسِيَ وَقَلَّ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":369},{"type":"p","text":"   الشَّرْحُ الصَّلاةُ تَبْطُلُ بِمَا هُوَ مِنْ كَلامِ النَّاسِ عَمْدًا مَعَ ذِكْرِ أَنَّهُ فِي الصَّلاةِ أَيْ مِنْ غَيْرِ أَنْ يَكُونَ مَغْلُوبًا لا يَسْتَطِيعُ تَرْكَ ذَلِكَ النُّطْقِ وَلَوْ كَانَ ذَلِكَ النُّطْقُ بِحَرْفَيْنِ كَهَلْ وَبَلْ وَلَوْ لَمْ يَكُنْ لَهُمَا مَعْنًى وَبِحَرْفٍ مَمْدُودٍ كَأَنْ يَقُولَ ءَا أَوْ إِيْ أَوْ أُو فَإِنَّهُ بِسَبَبِ الْمَدِّ صَارَ حَرْفَيْنِ. وَكَذَلِكَ تَبْطُلُ الصَّلاةُ بِالنُّطْقِ بِحَرْفٍ مُفْهِمٍ وَذَلِكَ كَأَنْ يَقُولَ قِ بِقَافِ مَكْسُورَةٍ لا يَتْبَعُهَا شَىْءٌ وَكَذَلِكَ عِ بِعَيْنٍ مَكْسُورَةٍ وَكَذَلِكَ فِ بِكَسْرِ الْفَاءِ لِأَنَّ هَذِهِ الْحُرُوفَ الثَّلاثَةَ كُلَّ وَاحِدٍ مِنْهَا لَهُ مَعْنًى يُفْهَمُ مِنْهُ فَقِ يُفْهَمُ مِنْهُ الأَمْرُ بِالْوِقَايَةِ وَعِ يُفْهَمُ مِنْهُ الأَمْرُ بِالْوَعْيِ وَفِ يُفْهَمُ مِنْهُ الأَمْرُ بِالْوَفَاءِ، فَهَذَا وَمَا أَشْبَهَهُ يُبْطِلُ الصَّلاةَ إِنْ كَانَ عَمْدًا أَيْ وَمَعَ ذِكْرِ أَنَّهُ فِي الصَّلاةِ وَكَانَ عَالِمًا بِالتَّحْرِيمِ. فَأَمَّا النَّاسِي أَنَّهُ فِي الصَّلاةِ إِذَا تَكَلَّمَ بِكَلامٍ قَلِيلٍ أَيْ سِتِّ كَلِمَاتٍ عُرْفِيَّةٍ فَأَقَلَّ فَلا يُبْطِلُ نُطْقُهُ هَذَا صَلاتَهُ وَهَذَا مِثْلُ أَنْ يَقُولَ اذْهَبْ إِلَى السُّوقِ وَاشْتَرِ لِي خُبْزًا ثُمَّ أَحْضِرْهُ لِي ثُمَّ ضَعْهُ فِي مَكَانِ كَذَا وَنَحْوَ هَذَا. وَمَنْ كَانَ جَاهِلًا بِحُرْمَةِ الْكَلامِ فِي الصَّلاةِ لِكَوْنِهِ مِمَّنْ أَسْلَمَ مِنْ وَقْتٍ قَرِيبٍ أَوْ لِكَوْنِهِ نَشَأَ فِي بَلَدٍ بَعِيدَةٍ عَمَّنْ يَعْرِفُ أَحْكَامَ الشَّرْعِ فَإِنَّهُ لا يُبْطِلُ كَلامُهُ فِي الصَّلاةِ صَلاتَهُ. وَأَمَّا التَّنَحْنُحُ فَفِي مَذْهَبِ الإِمَامِ الشَّافِعِيِّ فِيهِ رَأْيَانِ أَحَدُهُمَا أَنَّهُ يُبْطِلُ وَالآخَرُ لا يُبْطِلُ. وَخَرَجَ بِكَلامِ النَّاسِ ذِكْرُ اللَّهِ فَإِنَّهُ لا يُبْطِلُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":370},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبِالْفِعْلِ الْكَثِيرِ وَهُوَ عِنْدَ بَعْضِ الْفُقَهَاءِ مَا يَسَعُ قَدْرَ رَكْعَةٍ مِنَ الزَّمَنِ وَقِيلَ ثَلاثُ حَرَكَاتٍ مُتَوَالِيَاتٍ وَالأَوَّلُ أَقْوَى دَلِيلًا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":371},{"type":"p","text":"   الشَّرْحُ مِمَّا يُبْطِلُ الصَّلاةَ الْفِعْلُ الْكَثِيرُ الْمُتَوَالِي وَضَبَطُوهُ بِثَلاثِ حَرَكَاتٍ سَوَاءٌ كَانَ بِثَلاثَةِ أَعْضَاءٍ كَحَرَكَةِ يَدَيْهِ وَرَأْسِهِ عَلَى التَّعَاقُبِ أَوْ دَفْعَةً وَاحِدَةً أَوْ ثَلاثِ خَطَوَاتٍ، هَذَا هُوَ الْمَشْهُورُ عِنْدَ الشَّافِعِيَّةِ، أَمَّا ثَلاثُ حَرَكَاتٍ غَيْرُ مُتَوَالِيَاتٍ فَلا تُفْسِدُ الصَّلاةَ عِنْدَهُمْ. وَقَالَ بَعْضُهُمْ لا يُبْطِلُ الصَّلاةَ مِنَ الْفِعْل إِلَّا مَا وَسِعَ مِقْدَارَ رَكْعَةٍ مِنَ الزَّمَنِ فِي ءَانٍ وَاحِدٍ أَيْ مُتَوَالِيًا وَبَيْنَ الْقَوْلَيْنِ فَرْقٌ كَبِيرٌ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":372},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبِالْحَرَكَةِ الْمُفْرِطَةِ وَبِزِيَادَةِ رُكْنٍ فِعْلِيٍّ وَبِالْحَرَكَةِ الْوَاحِدَةِ لِلَّعِبِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":373},{"type":"p","text":"   الشَّرْحُ مِنَ الْفِعْلِ الْمُبْطِلِ الْحَرَكَةُ الْمُفْرِطَةُ كَالْوَثْبَةِ. وَمِنَ الْمُبْطِلِ أَيْضًا الْحَرَكَةُ الْوَاحِدَةُ إِذَا كَانَتْ لِلَّعِبِ وَلَوْ لَمْ تَكُنْ مُفْرِطَةً أَمَّا إِذَا ابْتَسَمَ أَوْ مَسَحَ عَلَى رَأْسِ وَلَدٍ صَغِيرٍ مَثَلًا لإِينَاسِهِ فَلا يُبْطِلُ ذَلِكَ الصَّلاةَ. وَلا يُفْسِدُ الصَّلاةَ تَحْرِيكُ الأَصَابِعِ مَعَ اسْتِقْرَارِ الْكَفِّ وَإِنْ كَثُرَ، وَكَذَلِكَ تَحْرِيكُ الْجَفْنِ أَوِ اللِّسَانِ أَوِ الأُذُنِ وَحَلُّ زِرٍّ وَعَقْدُهُ وَلَوْ كَثُرَ إِنْ كَانَ الْكَفُّ قَارًّا مَا لَمْ يَكُنْ لِلَّعِبِ. وَكَذَلِكَ تَبْطُلُ الصَّلاةُ بِزِيَادَةِ رُكْنٍ فِعْلِيٍّ كَأَنْ عَمِلَ رُكُوعَيْنِ فِي رَكْعَةٍ وَاحِدَةٍ مِنْ صَلاةِ الصُّبْحِ مَثَلًا ذَاكِرًا ذَلِكَ أَمَّا الرُّكْنُ الْقَوْلِيُّ إِذَا كَرَّرَهُ فَلا يُبْطِلُ الصَّلاةَ فَلَوْ كَرَّرَ الْفَاتِحَةَ أَرْبَعَ مَرَّاتٍ مَثَلًا فِي رَكْعَةٍ وَاحِدَةٍ لَمْ تَفْسُدْ صَلاتُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":374},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبِالأَكْلِ وَالشُّرْبِ إِلَّا أَنْ نَسِيَ وَقَلَّ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":375},{"type":"p","text":"   الشَّرْحُ مِنْ مُبْطِلاتِ الصَّلاةِ الأَكْلُ وَالشُّرْبُ إِلَّا مَا كَانَ مَعَ النِّسْيَانِ فَإِنَّهُ لا يُبْطِلُ إِنْ كَانَ أَكْلُهُ وَشُرْبُهُ قَلِيلًا. وَكَذَا تَبْطُلُ الصَّلاةُ إِذَا تَقَيَّأَ عَامِدًا أَوْ مَغْلُوبًا وَكَذَا لَوْ تَجَشَّأَ فَوَصَلَ الْجُشَاءُ إِلَى ظَاهِرِ الْفَمِ وَلَوْ لَمْ يَبْلَعْهُ أَمَّا إِنْ شَكَّ هَلْ خَرَجَ شَىْءٌ مِنَ الْجَوْفِ إِلَى ظَاهِرِ الْفَمِ عِنْدَمَا تَجَشَّأَ أَوْ لا فَلا تَفْسُدُ صَلاتُهُ بِذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":376},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبِنِيَّةِ قَطْعِ الصَّلاةِ وَبِتَعْلِيقِ قَطْعِهَا عَلَى شَىْءٍ وَبِالتَّرَدُّدِ فِيهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":377},{"type":"p","text":"   الشَّرْحُ مَنْ نَوَى فِي قَلْبِهِ أَنْ يَقْطَعَ الصَّلاةَ فِي الْحَالِ أَوْ بَعْدَ مُضِيِّ رَكْعَةٍ مَثَلًا بَطَلَتْ صَلاتُهُ. وَكَذَلِكَ تَبْطُلُ بِتَعْلِيقِ الْقَطْعِ بِشَىْءٍ كَأَنْ قَالَ فِي نَفْسِهِ إِنْ حَصَلَ كَذَا فَإِنِّي أَقْطَعُهَا فَإِنَّهَا تَبْطُلُ حَالًا، وَكَذَلِكَ بِالتَّرَدُّدِ فِيهِ كَأَنْ قَالَ «أَقْطَعُهَا أَمْ أَسْتَمِرُّ فِيهَا» فَإِنَّهَا تَبْطُلُ. هَذَا إِذَا لَمْ يَكُنْ خَاطِراً أَيْ بِحَيْثُ لَمْ يُورِثْهُ تَرَدُّدًا وَلا عَزْمًا عَلَى الْقَطْعِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":378},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبِأَنْ يَمْضِيَ رُكْنٌ مَعَ الشَّكِّ فِي نِيَّةِ التَّحَرُّمِ أَوْ يَطُولَ زَمَنُ الشَّكِّ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":379},{"type":"p","text":"   الشَّرْحُ مَنْ شَكَّ فِي نِيَّةِ الصَّلاةِ هَلْ نَوَى فِي التَّحَرُّمِ أَوْ لا وَاسْتَمَرَ هَذَا الشَّكُّ حَتَّى مَضَى رُكْنٌ وَهُوَ يَشُكُّ فَإِنَّ صَلاتَهُ تَبْطُلُ كَأَنْ قَرَأَ الْفَاتِحَةَ وَهُوَ فِي هَذَا الشَّكِّ فَإِنَّهَا تَبْطُلُ أَوْ شَكَّ فِي ذَلِكَ ثُمَّ رَكَعَ وَهُوَ شَاكٌّ فَإِنَّهَا تَبْطُلُ، وَكَذَلِكَ إِذَا طَالَ زَمَنُ الشَّكِّ وَلَوْ لَمْ يَمْضِ مَعَهُ رُكْنٌ، فَأَمَّا إِنْ تَذَكَّرَ قَبْلَ أَنْ يَمْضِيَ مَعَ الشَّكِّ رُكْنٌ أَوْ يَطُولَ وَقْتُ الشَّكِّ لَمْ تَبْطُلْ وَذَلِكَ بِأَنْ يَشُكَّ فَيَزُولَ سَرِيعًا. وَأَمَّا ظَنُّ أَنَّهُ فِي صَلاةٍ غَيْرِ الصَّلاةِ الَّتِي دَخَلَ بِنِيَّتِهَا فَلا يُبْطِلُ الصَّلاةَ وَلَوْ أَتَمَّهَا وَهُوَ عَلَى ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":380},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":381},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ شُرُوطِ قَبُولِ الصَّلاةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":382},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَشُرِطَ مَعَ مَا مَرَّ لِقَبُولِهَا عِنْدَ اللَّهِ سُبْحَانَهُ وَتَعَالَى أَنْ يَقْصِدَ بِهَا وَجْهَ اللَّهِ وَحْدَهُ وَأَنْ يَكُونَ مَأْكَلُهُ وَمَلْبُوسُهُ وَمُصَلَّاهُ حَلالًا وَأَنْ يَخْشَعَ لِلَّهِ قَلْبُهُ فِيهَا وَلَوْ لَحْظَةً فَإِنْ لَمْ يَحْصُلْ ذَلِكَ صَحَّتْ صَلاتُهُ بِلا ثَوَابٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":383},{"type":"p","text":"   الشَّرْحُ هَذَا بَيَانٌ لِشُرُوطِ الْقَبُولِ وَهِيَ غَيْرُ شُرُوطِ الصِّحَّةِ الْمَذْكُورَةِ فِيمَا قَبْلُ لِأَنَّ تِلْكَ لا تَصِحُّ الصَّلاةُ بِدُونِهَا وَأَمَّا الْمَذْكُورَةُ فِي هَذَا الْفَصْلِ فَهِيَ شَرَائِطُ لِنَيْلِ الثَّوَابِ فَلَوْ لَمْ تَحْصُلْ صَحَّتْ صَلاتُهُ لَكِنْ بِلا ثَوَابٍ وَهَذِهِ الشُّرُوطُ هِيَ الإِخْلاصُ لِلَّهِ تَعَالَى أَيْ أَنْ يَقْصِدَ بِصَلاتِهِ امْتِثَالَ أَمْرِ اللَّهِ لا أَنْ يَمْدَحَهُ النَّاسُ وَيُثْنُوا عَلَيْهِ وَأَنْ يَكُونَ مَأْكَلُهُ وَمَلْبُوسُهُ وَمَكَانُ صَلاتِهِ حَلالًا فَمَنْ كَانَ مَأْكَلُهُ أَوْ مَلْبُوسُهُ أَوْ مَكَانُ صَلاتِهِ حَرَامًا فَإِنَّهُ لا ثَوَابَ لَهُ مَعَ كَوْنِهَا صَحِيحَةً أَيْ مُجْزِئَةً. وَمِنْهَا إِحْضَارُ الْقَلْبِ أَيْ أَنْ يَخْشَعَ لِلَّهِ وَلَوْ لَحْظَةً فَمَنْ لَمْ يَخْشَعْ لِلَّهِ لَحْظَةً فِي صَلاتِهِ فَإِنَّهُ يَخْرُجُ مِنْهَا بِلا ثَوَابٍ. قَالَ اللَّهُ تَعَالَى ﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ الَّذِينَ هُمْ فِي صَلاتِهِمْ خَاشِعُونَ﴾ [سُورَةَ الْمُؤْمِنُون] وَمَعْنَى الْخُشُوعِ هُوَ اسْتِشْعَارُ الْخَوْفِ مِنَ اللَّهِ عَزَّ وَجَلَّ بِاسْتِشْعَارِ مَحَبَّتِهِ وَتَعْظِيمِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":384},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":385},{"type":"source","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَرْكَانِ الصَّلاةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":386},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَرْكَانُ الصَّلاةِ سَبْعَةَ عَشَرَ الأَوَّلُ النِّيَّةُ بِالْقَلْبِ لِلْفِعْلِ وَيُعَيِّنُ ذَاتَ السَّبَبِ أَوِ الْوَقْتِ وَيَنْوِي الْفَرْضِيَّةَ فِي الْفَرْضِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":387},{"type":"p","text":"   الشَّرْحُ أَنَّ النِّيَّةَ هِيَ رُكْنٌ مِنْ أَرْكَانِ الصَّلاةِ وَهِيَ عَمَلٌ قَلْبِيٌّ فَالنُّطْقُ بِهَا بِاللِّسَانِ لَيْسَ بِفَرْضٍ فَالأَمْرُ الضَّرُورِيُّ فِي النِّيَّةِ هُوَ أَنْ يَقْصِدَ فِعْلَ الصَّلاةِ فِي التَّكْبِيرِ. وَيَجِبُ مَعَ ذَلِكَ أَنْ يُعَيِّنَ الصَّلاةَ الَّتِي لَهَا سَبَبٌ كَالْخُسُوفِ وَالصَّلاةَ الَّتِي لَهَا وَقْتٌ كَالضُّحَى، وَأَنْ يَنْوِيَ إِنْ كَانَتِ الصَّلاةُ مَفْرُوضَةً أَنَّهَا فَرْضٌ، كُلُّ ذَلِكَ يَجِبُ تَحْصِيلُهُ مَعَ التَّكْبِيرِ أَيْ ضِمْنَهُ فِي مَذْهَبِ الإِمَامِ الشَّافِعِيِّ، يَقُولُ بِقَلْبِهِ مَثَلًا أُصَلِّي فَرْضَ الظُّهْرِ أَوْ أُصَلِّي فَرْضَ الْعَصْرِ أَوْ أُصَلِّي الضُّحَى أَوْ أُصَلِّي الْوِتْرَ. وَقَالَ بَعْضُ الشَّافِعِيَّةِ إِنَّ نِيَّةَ الْفَرْضِيَّةِ غَيْرُ لازِمَةٍ فَتَصِحُّ الصَّلاةُ بِدُونِهَا عَلَى هَذَا الْوَجْهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":388},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَقُولُ بِحَيْثُ يُسْمِعُ نَفْسَهُ كَكُلِّ رُكْنٍ قَوْلِيٍّ اللَّهُ أَكْبَرُ وَهُوَ ثَانِي أَرْكَانِهَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":389},{"type":"p","text":"   الشَّرْحُ أَنَّ مِمَّا هُوَ لازِمٌ لا يَصِحُّ التَّكْبِيرُ بِدُونِهِ أَنْ يَنْطِقَ بِهِ بِحَيْثُ يُسْمِعُ نَفْسَهُ جَمِيعَ حُرُوفِهِ، وَكَذَا كُلُّ رُكْنٍ مِنَ الْفَاتِحَةِ وَالتَّشَهُّدِ الأَخِيرِ وَالصَّلاةِ عَلَى النَّبِيِّ وَالسَّلامِ فَإِنَّهُ يُشْتَرَطُ فِيهِ أَنْ يَنْطِقَ بِهِ بِحَيْثُ يُسْمِعُ نَفْسَهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":390},{"type":"p","text":"   وَالتَّكْبِيرُ هُوَ الرُّكْنُ الثَّانِي مِنْ أَرْكَانِ الصَّلاةِ وَيُشْتَرَطُ فِيهِ أَنْ لا يَمُدَّ الْبَاءَ بِحَيْثُ يَكُونُ اللَّفْظُ «أَكْبَار» فَإِنَّهُ يُفْسِدُ الصَّلاةَ أَيْ لا تَنْعَقِدُ الصَّلاةُ بِذَلِكَ لِأَنَّ الأَكْبَارَ فِي اللُّغَةِ جَمْعُ كَبَرٍ وَهُوَ الطَّبْلُ الْكَبِيرُ، فَإِنْ قَالَ ذَلِكَ وَكَانَ جَاهِلًا بِالْمَعْنَى لَمْ تَصِحَّ صَلاتُهُ وَإِنْ كَانَ عَالِمًا بِالْمَعْنَى وَقَالَ ذَلِكَ عَمْدًا كَفَرَ وَالْعِيَاذُ بِاللَّهِ. وَقَدْ نَصَّ عَلَى أَنَّ ذَلِكَ كُفْرٌ مَعَ الْعِلْمِ بِالْمَعْنَى وَالتَّعَمُّدِ لِلنُّطْقِ بَعْضُ الشَّافِعِيَّةِ وَالْمَالِكِيَّةِ فَلْيُحْذَرْ ذَلِكَ فِي الأَذَانِ أَيْضًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":391},{"type":"p","text":"   وَكَذَلِكَ يُشْتَرَطُ أَنْ لا يَمُدَّ الْهَمْزَةَ الَّتِي هِيَ أَوَّلَ لَفْظِ الْجَلالَةِ فَلَوْ قَالَ ءَاللَّهُ أَكْبَرُ لَمْ تَنْعَقِدْ صَلاتُهُ وَيَحْرُمُ ذَلِكَ لِأَنَّ الْمَعْنَى يَتَغَيَّرُ، وَإِنْ فَهِمَ الْمَعْنَى الَّذِي هُوَ الِاسْتِفْهَامُ وَنَطَقَ بِهِ عَمْدًا فَقَدْ كَفَرَ لِأَنَّهُ يَكُونُ كَأَنَّهُ قَالَ هَلِ اللَّهُ أَكْبَرُ مِنْ غَيْرِهِ أَيْ قَدْرًا وَعِلْمًا أَوْ لَيْسَ أَكْبَر؟ وَيُشْتَرَطُ أَنْ لا يَزِيدَ وَاوًا قَبْلَ لَفْظِ الْجَلالَةِ فَلَوْ قَالَ وَاللَّهُ أَكْبَرُ لَمْ تَصِحَّ صَلاتُهُ كَذَلِكَ لَوْ زَادَ وَاوًا بَيْنَ لَفْظِ الْجَلالَةِ وَ(أَكْبَر) وَكَذَلِكَ لَوْ أَبْدَلَ هَمْزَةَ أَكْبرَ بِالْوَاوِ فَقَالَ «اللَّهُ وَكْبَر».","style":"Normal","align":"justify","bold":false,"size":18.0,"index":392},{"type":"benefit","text":"   فَائِدَةٌ لَوْ تَوَسْوَسَ الْمَأْمُومُ فِي تَكْبِيرَةِ الإِحْرَامِ فَصَارَ يُعِيدُ التَّكْبِيرَ عَلَى وَجْهٍ يُشَوِّشُ عَلَى غَيْرِهِ مِنَ الْمَأْمُومِينَ حَرُمَ عَلَيْهِ ذَلِكَ كَمَنْ قَعَدَ يَتَكَلَّمُ بِجِوَارِ الْمُصَلِّي أَيْ بِحَيْثُ يُشَوِّشُ عَلَيْهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":393},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الثَّالِثُ الْقِيَامُ فِي الْفَرْضِ لِلْقَادِرِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":394},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ أَرْكَانِ الصَّلاةِ الْقِيَامَ فِي الصَّلاةِ الْمَفْرُوضَةِ وَلَوْ نَذْرًا أَوْ صَلاةَ جِنَازَةٍ فَيُشْتَرَطُ لِصِحَّتِهَا مِنَ الصَّبِي الْقِيَامُ كَمَا يُشْتَرَطُ فِي الْكَبِيرِ فَإِنْ عَجَزَ عَنِ الْقِيَامِ بِنَفْسِهِ أَوْ بِالِاسْتِعَانَةِ بِأَنْ كَانَتْ تَلْحَقُهُ مَشَقَّةٌ شَدِيدَةٌ لا تُحْتَمَلُ عَادَةً صَحَّتْ صَلاتُهُ قَاعِدًا، وَيَكُونُ رُكُوعُ الْقَاعِدِ بِأَنْ يُحَاذِيَ رَأْسُهُ مَا قُدَّامَ رُكْبَتَيْهِ وَالأَفْضَلُ أَنْ يُحَاذِيَ مَوْضِعَ سُجُودِهِ، فَإِنْ عَجَزَ عَنِ الْقُعُودِ وَجَبَ عَلَيْهِ أَنْ يُصَلِّيَ الْفَرْضَ مُضْطَجِعًا عَلَى جَنْبٍ فَإِنْ لَمْ يَسْتَطِعْ أَنْ يُصَلِّيَهَا عَلَى جَنْبٍ وَجَبَ عَلَيْهِ أَنْ يُصَلِّيَهَا مُسْتَلْقِيًا وَيَرْفَعُ رَأْسَهُ وَمُقَدَّمَ صَدْرِهِ وُجُوبًا وَلَوْ قَلِيلًا لِيَتَوَجَّهَ بِوَجْهِهِ إِلَى الْقِبْلَةِ لِأَنَّهُ إِنْ لَمْ يَفْعَلْ ذَلِكَ يَكُونُ اسْتَقْبَلَ السَّمَاءَ فَلا تَصِحُّ صَلاتُهُ فَإِنْ لَمْ يَسْتَطِعْ رَفْعَ رَأْسِهِ اقْتَصَرَ عَلَى تَوْجِيهِ أَخْمَصَيْهِ إِلَى الْقِبْلَةِ [وَالأَخْمَصُ مَا دَخَلَ فِي بَاطِنِ الْقَدَمِ فَلَمْ يُصِبِ الأَرْضَ]، فَإِنْ عَجَزَ عَنْ ذَلِكَ كُلِّهِ كَأَنْ يَكُونَ لا يَسْتَطِيعُ إِلَّا أَنْ يَنْبَطِحَ عَلَى وَجْهِهِ صَلَّى وَهُوَ عَلَى هَذِهِ الْحَالِ وَرَفَعَ رَأْسَهُ إِنْ أَمْكَنَ وَأَشَارَ بِهِ لِلرُّكُوعِ وَلِلسُّجُودِ أَخْفَضَ فَإِنْ عَجَزَ عَنْ تَحْرِيكِ رَأْسِهِ صَلَّى بِطَرْفِهِ أَيْ بِجَفْنِهِ أَيْ يُحَرِّكُ جَفْنَهُ بِنِيَّةِ الرُّكُوعِ ثُمَّ بِنِيَّةِ السُّجُودِ وَيَخْفِضُ لِلسُّجُودِ أَشَدَّ وَلا يَصِحُّ الإِغْمَاضُ إِشَارَةً لِلرُّكُوعِ. فَإِنْ عَجَزَ عَنْ ذَلِكَ كُلِّهِ أَجْرَى الأَرْكَانَ الْفِعْلِيَّةَ عَلَى قَلْبِهِ. وَأَمَّا الأَرْكَانُ الْقَوْلِيَّةُ فَيَقْرَؤُهَا بِلِسَانِهِ فَإِنِ ارْتَبَطَ لِسَانُهُ أَجْرَاهَا أَيْضًا عَلَى قَلْبِهِ. ثُمَّ شَرْطُ الْقِيَامِ الِاعْتِمَادُ عَلَى قَدَمَيْهِ وَنَصْبُ فَقَارِ ظَهْرِهِ. وَلا يَجِبُ نَصْبُ الرَّقَبَةِ بَلْ يُسَنُّ خَفْضُ رَأْسِهِ إِلَى الأَمَامِ قَلِيلًا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":395},{"type":"p","text":"   وَيُسَنُّ وَضْعُ يَدَيْهِ بَعْدَ التَّحَرُّم ِتَحْتَ صَدْرِهِ وَفَوْقَ سُرَّتِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":396},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الرَّابِعُ قِرَاءَةُ الْفَاتِحَةِ بِالْبَسْمَلَةِ وَالتَّشْدِيدَاتِ وَيُشْتَرَطُ مُوَالاتُهَا وَتَرْتِيبُهَا وَإِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":397},{"type":"p","text":"   الشَّرْحُ هَذِهِ الْجُمْلَةُ فِيهَا بَيَانُ أَحْكَامٍ تَتَعَلَّقُ بِقِرَاءَةِ الْفَاتِحَةِ الَّتِي هِيَ الرُّكْنُ الرَّابِعُ لِلصَّلاةِ، فَهِيَ فَرْضٌ عَلَى الْمُنْفَرِدِ وَالإِمَامِ وَالْمَأْمُومِ فَلا يُسْتَثْنَى الْمَأْمُومُ عِنْدَ الشَّافِعِيِّ كَمَا يُسْتَثْنَى فِي الْمَذَاهِبِ الثَّلاثَةِ الأُخْرَى مَذْهَبِ مَالِكٍ وَمَذْهَبِ أَبِي حَنِيفَةَ وَمَذْهَبِ أَحْمَدَ بنِ حَنْبَلٍ فَإِنَّ قِرَاءَةَ الإِمَامِ قِرَاءَةٌ لِلْمَأْمُومِ عِنْدَهُمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":398},{"type":"p","text":"   ثُمَّ إِنَّ الْفَاتِحَةَ سَبْعُ ءَايَاتٍ وَالْبَسْمَلَةُ ءَايَةٌ مِنْهَا فَلَوْ تَرَكَهَا لَمْ تَصِحَّ قِرَاءَتُهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":399},{"type":"p","text":"   وَكَذَلِكَ تَجِبُ التَّشْدِيدَاتُ الأَرْبَعَ عَشْرَةَ فِيهَا فَمَنْ تَرَكَ شَيْئًا مِنْهَا لَمْ تَصِحَّ قِرَاءَتُهُ لِلْفَاتِحَةِ فَلا تَصِحُّ صَلاتُهُ، فَلَوْ خَفَّفَ مُشَدَّدًا لَمْ تَصِحَّ صَلاتُهُ إِنْ لَمْ يُعِدْ تِلْكَ الْكَلِمَةَ عَلَى الصَّوَابِ بِخِلافِ تَشْدِيدِ الْمُخَفَّفِ فَإِنَّهُ لا يُبْطِلُ الصَّلاةَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":400},{"type":"p","text":"   وَإِنْ تَرَكَ التَّشْدِيدَ عَلَى لَفْظِ إِيَّاكَ وَخَفَّفَ الْيَاءَ فَإِنْ تَعَمَّدَ ذَلِكَ وَهُوَ يَعْرِفُ مَعْنَاهُ صَارَ كَافِرًا لِأَنَّ الإِيَا ضَوْءُ الشَّمْسِ فَيَصِيرُ كَأَنَّهُ قَالَ نَعْبُدُ ضَوْءَ الشَّمْسِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":401},{"type":"p","text":"   وَتَجِبُ مُرَاعَاةُ مُوَالاتِهَا بِأَنْ لا يَفْصِلَ بَيْنَ شَىْءٍ مِنْهَا وَمَا بَعْدَهُ بِأَكْثَرَ مِنْ سَكْتَةِ التَّنَفُّسِ وَإِنْ لَمْ يَنْوِ قَطْعَ الْقِرَاءَةِ إِلَّا أَنْ كَانَ لِعُذْرٍ فَيَجُوزُ أَكْثَرَ مِنْ ذَلِكَ كَأَنْ غَلَبَهُ السُّعَالُ مَثَلًا. وَسَكْتَةُ التَّنَفُّسِ هِيَ مِقْدَارُ مَا يَسْكُتُ النَّاسُ عَادَةً أَثْنَاءَ كَلامِهِمْ إِذَا أَرَادُوا أَنْ يَتَنَفَّسُوا لَيْسَتْ مُقَدَّرَةً بِمِقْدَارِ قَوْلِ سُبْحَانَ اللَّهِ بَلْ هِيَ أَكْثَرُ مِنْ ذَلِكَ. وَتَنْقَطِعُ الْمُوَالاةُ بِالذِّكْرِ وَإِنْ قَلَّ كَالْحَمْدُ لِلَّهِ لِلْعَاطِسِ، نَعَمْ إِنْ سُنَّ فِيهَا لِمَصْلَحَتِهَا كَالتَّأْمِينِ لِقِرَاءَةِ إِمَامِهِ وَنَحْوِ قَوْلِ «بَلَى وَأَنَا عَلَى ذَلِكَ مِنَ الشَّاهِدِينَ» ءَاخِرَ قِرَاءَةِ وَالتِّينِ مِنَ الإِمَامِ فَلا تَنْقَطِعُ بِذَلِكَ مُوَالاةُ قِرَاءَةِ الْفَاتِحَةِ مِنَ الْمَأْمُومِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":402},{"type":"p","text":"   وَيَجِبُ تَرْتِيبُ الْفَاتِحَةِ أَيْضًا بِأَنْ يَأْتِيَ بِهَا عَلَى نَظْمِهَا الْمَعْرُوفِ. وَيَجِبُ أَيْضًا إِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا. وَأَوْلَى الْحُرُوفِ عِنَايَةً بِذَلِكَ الصَّادُ فَإِنَّ كَثِيرًا مِنَ النَّاسِ يُخْرِجُونَهَا غَيْرَ صَافِيَةٍ. وَقَدْ قَالَ الإِمَامُ أَبُو مُحَمَّدٍ الْجُوَيْنِيُّ بِعَدَمِ صِحَّةِ قِرَاءَةِ مَنْ يَقْرَأُ كَذَلِكَ أَيْ يَأْتِي بِالصَّادِ بَيْنَهَا وَبَيْنَ السِّينِ لا هِيَ صَادٌ مَحْضَةٌ وَلا هِيَ سِينٌ مَحْضَةٌ وَأَقَرَّهُ النَّوَوِيُّ وَغَيْرُهُ. قَالَ الشَّيْخُ زَكَرِيَا الأَنْصَارِيُّ فِي شَرْحِ الْجَزَرِيَّةِ حُرُوفُ الصَّفِيرِ صَادٌ مُهْمَلَةٌ وَزَايٌ وَسِينٌ مُهْمَلَةٌ سُمِّيَتْ بِذَلِكَ لِصَوْتٍ يَخْرُجُ مَعَهَا يُشْبِهُ صَفِيرَ الطَّائِرِ، وَفِيهَا لِأَجْلِ صَفِيرِهَا قُوَّةٌ وَأَقْوَاهَا فِي ذَلِكَ الصَّادُ لِلإِطْبَاقِ [وَهُوَ لُغَةً الِالْتِصَاقُ وَسُمِّيَتْ حُرُوفُهُ مُنْطَبِقَةً لِانْطِبَاقِ طَائِفَةٍ مِنَ اللِّسَانِ عَلَى الْحَنَكِ عِنْدَ النُّطْقِ بِهَا] وَالِاسْتِعْلاءِ [وَهُوَ لُغَةً الِارْتِفَاعُ وَسُمِّيَتْ حُرُوفُهُ مُسْتَعْلِيَةً لِأَنَّ اللِّسَانَ يَعْلُو عِنْدَ النُّطْقِ بِهَا إِلَى الْحَنَكِ] اهـ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":403},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَدَمُ اللَّحْنِ الْمُخِلِّ بِالْمَعْنَى كَضَمِّ تَاءِ أَنْعَمْتَ، وَيَحْرُمُ اللَّحْنُ الَّذِي لَمْ يُخِلَّ وَلا يُبْطِلْ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":404},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ الْفَاتِحَةِ أَنْ لا يَأْتِيَ بِلَحْنٍ يُخِلُّ بِالْمَعْنَى أَيْ يُغَيِّرُ الْمَعْنَى أَوْ يُبْطِلُهُ فَمَنْ أَتَى بِلَحْنٍ فِيهَا يُغَيِّرُ الْمَعْنَى كَأَنْ يَقُولَ صِرَاطَ الَّذِينَ أَنْعَمْتُ عَلَيْهِمْ بِضَمِّ التَّاءِ لَمْ تَصِحَّ قِرَاءَتُهُ بَلْ تَبْطُلُ صَلاتُهُ بِذَلِكَ إِنْ عَلِمَ وَتَعَمَّدَ وَإِلَّا فَقِرَاءَتُهُ فَيَجِبُ عَلَيْهِ إِعَادَتُهَا عَلَى الصَّوَابِ وَإِلَّا فَسَدَتْ صَلاتُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":405},{"type":"p","text":"وَأَمَّا اللَّحْنُ الْمُبْطِلُ لِلْمَعْنَى فَهُوَ كَقِرَاءَةِ الَّذِينَ بِالزَّايِ فَإِنَّهُ لا مَعْنَى لَهُ أَلْبَتَّةَ فَهُوَ كَالْمُغَيِّرِ لِلْمَعْنَى. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":406},{"type":"p","text":"وَأَمَّا اللَّحْنُ الَّذِي لا يُخِلُّ بِالْمَعْنَى فَتَصِحُّ مَعَهُ صَلاتُهُ كَقِرَاءَةِ نِعْبُدُ بِكَسْرِ النُّونِ فَإِنَّهَا لا تُغَيِّرُ الْمَعْنَى وَلَكِنْ يَحْرُمُ عَلَيْهِ ذَلِكَ. وَمِنَ الْمُبْطِلِ قِرَاءَةُ نَعْبَدُ بِفَتْحِ الْبَاءِ فَهُوَ مِنَ اللَّحْنِ الْمُغَيِّرِ لِلْمَعْنَى فَإِنْ تَعَمَّدَهُ بَطَلَتْ صَلاتُهُ وَإِلَّا فَقِرَاءَتُهُ فَلا تَصِحُّ الصَّلاةُ إِنْ لَمْ يُعِدِ الْكَلِمَةَ عَلَى الصَّوَابِ، وَتَعَمُّدُهَا مَعَ مَعْرِفَةِ الْمَعْنَى كُفْرٌ لِأَنَّ مَعْنَى نَعْبَدُ نَأْنَفُ وَنَغْضَبُ، يُقَالُ عَبِدَ يَعْبَدُ كَغَضِبَ يَغْضَبُ وَزْنًا وَمَعْنًى فَلْيُحْذَرْ مَا فِي كِتَابِ فَتْحِ الْعَلَّامِ مِنْ أَنَّهُ لا يُبْطِلُ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":407},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الْخَامِسُ الرُّكُوعُ بِأَنْ يَنْحَنِيَ بِحَيْثُ تَنَالُ رَاحَتَاهُ رُكْبَتَيْهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":408},{"type":"p","text":"   الشَّرْحُ أَنَّ الرُّكْنَ الْخَامِسَ هُوَ الرُّكُوعُ وَيَحْصُلُ بِالِانْحِنَاءِ إِلَى الْحَدِّ الَّذِي تَنَالُ أَيْ تَبْلُغُ الرَّاحَتَانِ رُكْبَتَيْهِ لَوْ وَضَعَهُمَا عَلَيْهِمَا مَعَ اعْتِدَالِ الْخِلْقَةِ، وَالرَّاحَتَانِ هُمَا مَا عَدَا الأَصَابِعَ مِنَ الْكَفَّيْنِ فَالرَّاحَةُ هِيَ مَا بَيْنَ الأَصَابِعِ وَالسَّاعِدِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":409},{"type":"p","text":"   وَيُشْتَرَطُ أَنْ يَكُونَ هَذَا الِانْحِنَاءُ بِلا انْخِنَاسٍ أَيْ ثَنْيِ الرُّكْبَتَيْنِ كَثِيرًا. وَلا يَكْفِي بُلُوغُ الأَصَابِعِ دُونَ الرَّاحَتَيْنِ أَوْ إِحْدَاهُمَا. وَيُشْتَرَطُ الْيَقِينُ فِي ذَلِكَ فَلَوْ شَكَّ فِي بُلُوغِهِ هَذَا الْقَدْرَ الْمُجْزِئَ لَمْ يَصِحَّ رُكُوعُهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":410},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: السَّادِسُ الطُّمَأْنِينَةُ فِيهِ بِقَدْرِ سُبْحَانَ اللَّهِ وَهِيَ سُكُونُ كُلِّ عَظْمٍ مَكَانَهُ دَفْعَةً وَاحِدَةً.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":411},{"type":"p","text":"   الشَّرْحُ أَنَّ الرُّكْنَ السَّادِسَ هُوَ الطُّمَأْنِينَةُ فِي الرُّكُوعِ وَالْمُرَادُ بِالطُّمَأْنِينَةِ اسْتِقْرَارُ الأَعْضَاءِ دَفْعَةً وَاحِدَةً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":412},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: السَّابِعُ الِاعْتِدَالُ بِأَنْ يَنْتَصِبَ بَعْدَ الرُّكُوعِ قَائِمًا الثَّامِنُ الطُّمَأْنِينَةُ فِيهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":413},{"type":"p","text":"   الشَّرْحُ مَعْنَى الِاعْتِدَالِ عَوْدُ الرَّاكِعِ إِلَى مَا كَانَ عَلَيْهِ قَبْلَ رُكُوعِهِ إِنْ كَانَ قِيَامًا أَوْ غَيْرَهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":414},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: التَّاسِعُ السُّجُودُ مَرَّتَيْنِ بِأَنْ يَضَعَ جَبْهَتَهُ كُلَّهَا أَوْ بَعْضَهَا عَلَى مُصَلَّاهُ مَكْشُوفَةً وَمُتَثَاقِلًا بِهَا وَمُنَكِّسًا أَيْ يَجْعَلُ أَسَافِلَهُ أَعْلَى مِنْ أَعَالِيهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":415},{"type":"p","text":"   الشَّرْحُ أَنَّ الرُّكْنَ التَّاسِعَ هُوَ السُّجُودُ مَرَّتَيْنِ فِي كُلِّ رَكْعَةٍ وَالسُّجُودُ فِي الشَّرْعِ هُوَ وَضْعُ الْجَبْهَةِ وَالرُّكْبَتَيْنِ وَمَا يَتْبَعُ ذَلِكَ عَلَى الأَرْضِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":416},{"type":"p","text":"   وَمِنْ شُرُوطِهِ أَنْ يَكُونَ مُتَثَاقِلًا بِجَبْهَتَهِ بِحَيْثُ لَوْ كَانَ تَحْتَهُ قُطْنٌ لَانْكَبَسَ وَظَهَرَ أَثَرُهُ عَلَى يَدِهِ لَوْ فُرِضَتْ تَحْتَ الْقُطْنِ وَتَنْكِيسُ رَأْسِهِ بِارْتِفَاعِ أَسَافِلِهِ عَلَى أَعَالِيهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":417},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَضَعَ شَيْئًا مِنْ رُكْبَتَيْهِ وَمِنْ بُطُونِ كَفَّيْهِ وَمِنْ بُطُونِ أَصَابِعِ رِجْلَيْهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":418},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ شَرْطِ صِحَّةِ السُّجُودِ أَنْ يَضَعَ جُزْءًا مِنْ رُكْبَتَيْهِ وَمِنْ بُطُونِ كَفَّيْهِ وَمِنْ بُطُونِ أَصَابِعِ رِجْلَيْهِ وَلَوْ لَمْ تَكُنْ مَكْشُوفَةً عَلَى الأَرْضِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":419},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَقَالَ بَعْضُ الْعُلَمَاءِ خَارِجَ الْمَذْهَبِ لَيْسَ شَرْطًا فِي السُّجُودِ التَّنْكِيسُ فَلَوْ كَانَ رَأْسُهُ أَعْلَى مِنْ دُبُرِهِ صَحَّتِ الصَّلاةُ عِنْدَهُمْ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":420},{"type":"source","text":"   الشَّرْحُ هَذَا مَذْهَبُ الإِمَامِ أَحْمَدَ بنِ حَنْبَلٍ وَلَكِنِ الشَّرْطُ عِنْدَهُمْ أَنْ لا يَخْرُجَ عَنِ اسْمِ السُّجُودِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":421},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الْعَاشِرُ الطُّمَأْنِينَةُ فِيهِ الْحَادِي عَشَرَ الْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ الثَّانِي عَشَرَ الطُّمَأْنِينَةُ فِيهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":422},{"type":"p","text":"   الشَّرْحُ فِي هَذِهِ الْجُمَلِ ذِكْرُ ثَلاثَةِ أَرْكَانٍ أَحَدُهَا الطُّمَأْنِينَةُ فِي السُّجُودَيْنِ وَثَانِيهَا الَّذِي هُوَ الرُّكْنُ الْحَادِي عَشَرَ الْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ وَهُوَ رُكْنٌ وَلَوْ كَانَتِ الصَّلاةُ نَفْلًا وَثَالِثُهَا الطُّمَأْنِينَةُ فِي هَذَا الْجُلُوسِ وَهِيَ رُكْنٌ مِنْ أَرْكَانِ الصَّلاةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":423},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الثَّالِثَ عَشَرَ الْجُلُوسُ لِلتَّشَهُّدِ الأَخِيرِ وَمَا بَعْدَهُ مِنَ الصَّلاةِ عَلَى النَّبِيِّ وَالسَّلامِ الرَّابِعَ عَشَرَ التَّشَهُّدُ الأَخِيرُ فَيَقُولُ التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ السَّلامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهُ وَبَرَكَاتُهُ السَّلامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ أَوْ أَقَلَّهُ وَهُوَ التَّحِيَّاتُ لِلَّهِ سَلامٌ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ سَلامٌ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":424},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ أَرْكَانِ الصَّلاةِ وَهُوَ الرُّكْنُ الثَّالِثَ عَشَرَ الْجُلُوسَ لِلتَّشَهُّدِ الأَخِيرِ وَمَا بَعْدَهُ. وَلِلتَّشَهُّدِ أَقَلُّ وَأَكْمَلُ فَأَقَلُّهُ الَّذِي لا تَصِحُّ الصَّلاةُ بِدُونِهِ التَّحِيَّاتُ لِلَّهِ سَلامٌ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ سَلامٌ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَقَدْ ذَكَرَهُ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ فِي الْمَتْنِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":425},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الْخَامِسَ عَشَرَ الصَّلاةُ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَقَلُّهَا اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":426},{"type":"p","text":"   الشَّرْحُ لَيْسَ الْمُرَادُ بِهِ تَعْيِينَ هَذَا اللَّفْظِ بِحُرُوفِهِ بِحَيْثُ لا يَجُوزُ إِبْدَالُ كَلِمَةٍ مِنْهُ بِغَيْرِهَا بَلْ يَصِحُّ صَلَّى اللَّهُ عَلَى مُحَمَّدٍ وَنَحْوُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":427},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: السَّادِسَ عَشَرَ السَّلامُ وَأَقَلُّهُ السَّلامُ عَلَيْكُمْ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":428},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ إِجْزَاءِ السَّلامِ الإِتْيَانُ بِأَلْ فَلا يَكْفِي سَلامٌ عَلَيْكُمْ. وَكَذَلِكَ لا يَكْفِي إِبْدَالُ كَلِمَةِ عَلَيْكُمْ بِعَلَيْكَ بِدُونِ مِيمٍ. وَتُشْتَرَطُ الْمُوَالاةُ بَيْنَ كَلِمَتَيْهِ وَأَنْ يَكُونَ بِحَيْثُ يُسْمِعُ نَفْسَهُ وَكَوْنُهُ مُسْتَقْبِلَ الْقِبْلَةِ بِصَدْرِهِ إِلَى تَمَامِهِ وَذَلِكَ بِالإِتْيَانِ بِمِيمِ عَلَيْكُمْ. أَمَّا أَكْمَلُهُ فَيَحْصُلُ بِزِيَادَةِ وَرَحْمَةُ اللَّهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":429},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: السَّابِعَ عَشَرَ التَّرْتِيبُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":430},{"type":"p","text":"   الشَّرْحُ أَنَّهُ لا بُدَّ مِنَ التَّرْتِيبِ لِأَرْكَانِهَا كَمَا ذُكِرَ فِي تَعْدَادِهَا وَقَدِ اشْتَمَلَ عَلَى قَرْنِ النِّيَّةِ فِي التَّكْبِيرِ بِالْقِيَامِ فِي الْفَرْضِ لِلْمُسْتَطِيعِ وَإِيقَاعِ الْقِرَاءَةِ فِي الْقِيَامِ وَإِيقَاعِ التَّشَهُّدِ وَالصَّلاةِ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الْقُعُودِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":431},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَإِنْ تَعَمَّدَ تَرْكَهُ كَأَنْ سَجَدَ قَبْلَ رُكُوعِهِ بَطَلَتْ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":432},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ تَعَمَّدَ تَرْكَ التَّرْتِيبِ بِأَنْ قَدَّمَ رُكْنًا قَوْلِيًّا هُوَ السَّلامُ أَوْ رُكْنًا فِعْلِيًّا مُطْلَقًا بَطَلَتْ صَلاتُهُ وَذَلِكَ كَأَنْ يَسْجُدَ قَبْلَ رُكُوعِهِ فَتَبْطُلُ صَلاتُهُ إِجْمَاعًا لِتَلاعُبِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":433},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِنْ سَهَا فَلْيَعُدْ إِلَيْهِ إِلَّا أَنْ يَكُونَ فِي مِثْلِهِ أَوْ بَعْدَهُ فَتَتِمُّ بِهِ رَكْعَتُهُ وَلَغَا مَا سَهَا بِهِ فَلَوْ لَمْ يَذْكُرْ تَرْكَهُ لِلرُّكُوعِ إلَّا بَعْدَ أَنْ رَكَعَ فِي الْقِيَامِ الَّذِي بَعْدَهُ أَوْ فِي السُّجُودِ الَّذِي بَعْدَهُ لَغَا مَا فَعَلَهُ بَيْنَ ذَلِكَ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":434},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ تَرَكَ التَّرْتِيبَ سَهْوًا ثُمَّ ذَكَرَ الرُّكْنَ الْمَتْرُوكَ فَمَا فَعَلَهُ بَعْدَهُ لَغْوٌ أَيْ لا يُحْسَبُ لِعَدَمِ وُقُوعِهِ فِي مَحَلِّهِ فَلْيَرْجِعْ إِلَيْهِ فَوْرًا مُحَافَظَةً عَلَى التَّرْتِيبِ، وَهَذَا إِنْ تَذَكَّرَ قَبْلَ أَنْ يَكُونَ فِي مِثْلِهِ، فَإِنْ تَذَكَّرَ وَقَدْ صَارَ فِي مِثْلِهِ تَمَّتْ بِهَذَا رَكْعَتُهُ. وَكَذَلِكَ إِذَا تَذَكَّرَ وَهُوَ فِيمَا بَعْدَ مِثْلِ الْمَتْرُوكِ فَتَتِمُّ رَكْعَتُهُ بِمَا فَعَلَ وَيُلْغِي مَا بَيْنَهُمَا. وَهَذَا الْحُكْمُ فِي غَيْرِ الْمَأْمُومِ أَمَّا الْمَأْمُومُ فَلا يَعُودُ لَهُ بَلْ يَأْتِي بِرَكْعَةٍ بَعْدَ سَلامِ إِمَامِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":435},{"type":"p","text":"   مَسْئَلَةٌ. الشَّكُّ فِي هَذِهِ الْمَسْئَلَةِ كَالتَّذَكُّرِ فَلَوْ رَكَعَ ثُمَّ شَكَّ هَلْ قَرَأَ الْفَاتِحَةَ أَوْ لا أَوْ شَكَّ وَهُوَ سَاجِدٌ هَلْ رَكَعَ وَاعْتَدَلَ أَوْ لا قَامَ فَوْرًا وُجُوبًا وَلا يَكْفِيهِ لَوْ قَامَ رَاكِعًا وَأَمَّا مَنْ شَكَّ وَهُوَ قَائِمٌ قَبْلَ أَنْ يَرْكَعَ هَلْ قَرَأَ الْفَاتِحَةَ أَوْ لا فِي رَكْعَتِهِ هَذِهِ فَلا يَجِبُ عَلَيْهِ أَنْ يَقْرَأَ فَوْرًا لِأَنَّهُ لَمْ يَنْتَقِلْ عَنْ مَحَلِّهَا لَكِنْ لا بُدَّ لَهُ أَنْ يَقْرَأَ الْفَاتِحَةَ قَبْلَ أَنْ يَرْكَعَ إِنْ لَمْ يَزُلْ شَكُّهُ قَبْلَ الرُّكُوعِ وَيَتَيَقَّنْ أَنَّهُ قَرَأَهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":436},{"type":"benefit","text":"   فَائِدَةٌ. مَذْهَبُ الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ أَنَّ مَنْ شَكَّ فِي عَدَدِ الرَّكَعَاتِ يَجِبُ عَلَيْهِ أَنْ يَأْخُذَ بِالأَقَلِّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":437},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":438},{"type":"p","text":"   الشَّرْحُ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَحْكَامِ الْجَمَاعَةِ وَالْجُمُعَةِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":439},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الْجَمَاعَةُ عَلَى الذُّكُورِ الأَحْرَارِ الْمُقِيمِينَ الْبَالِغِينَ غَيْرِ الْمَعْذُورِينَ فَرْضُ كِفَايَةٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":440},{"type":"p","text":"   الشَّرْحُ الْحَالُ الَّتِي تَكُونُ فِيهَا الْجَمَاعَةُ فَرْضَ كِفَايَةٍ هِيَ الْجَمَاعَةُ فِي الصَّلَوَاتِ الْخَمْسِ فِي حَقِّ الذُّكُورِ الأَحْرَارِ الْمُقِيمِينَ الْبَالِغِينَ غَيْرِ الْمَعْذُورِينَ فَخَرَجَ بِالذُّكُورِ النِّسَاءُ فَلَيْسَتْ فَرْضًا عَلَيْهِنَّ وَخَرَجَ بِالأَحْرَارِ الْعَبِيدُ فَلَيْسَتْ فَرْضًا عَلَيْهِمْ. وَخَرَجَ بِالْمُقِيمِينَ الْمُسَافِرُونَ فَمَنْ دَخَلَ بَلْدَةً بِنِيَّةِ الإِقَامَةِ أَقَلَّ مِنْ أَرْبَعَةِ أَيَّامٍ فَالْجَمَاعَةُ فِي حَقِّهِ غَيْرُ فَرْضٍ. وَخَرَجَ بِالْبَالِغِينَ الصِّبْيَانُ فَلَيْسَتْ فَرْضًا فِي حَقِّهِمْ لِعَدَمِ التَّكْلِيفِ لَكِنْ يَجِبُ عَلَى الْوَلِيِّ أَنْ يَأْمُرَ الطِّفْلَ الْمُمَيِّزَ بِالْجَمَاعَةِ وَالْجُمُعَةِ. وَخَرَجَ بِغَيْرِ الْمَعْذُورِينَ الْمَعْذُورُونَ بِعُذْرٍ مِنَ الأَعْذَارِ الْمُسْقِطَةِ لِوُجُوبِ الْجَمَاعَةِ كَالْمَطَرِ الَّذِي يَبُلُّ الثَّوْبَ وَالْخَوْفِ مِنَ الْعَدُوِّ بِذَهَابِهِ إِلَى مَكَانِ الْجَمَاعَةِ وَغَيْرِ ذَلِكَ مِنْ أَعْذَارِ تَرْكِ الْجَمَاعَةِ وَهِيَ كَثِيرَةٌ. وَيُشْتَرَطُ لِوُجُوبِهَا أَيْضًا الْعَقْلُ وَلَمْ يُذْكَرْ فِي الْمَتْنِ لِظُهُورِ حُكْمِهِ. وَيَحْصُلُ فَرْضُ الْكِفَايَةِ بِإِقَامَتِهَا بَحَيْثُ يَظْهَرُ الشِّعَارُ بِأَنْ تُقَامَ فِي الْبَلَدِ الصَّغِيرَةِ فِي مَحَلٍّ وَفِي الْكَبِيرَةِ فِي مَحَالَّ مُتَعَدِّدَةٍ بِحَيْثُ يُمْكِنُ قَاصِدَهَا إِدْرَاكُهَا بِلا مَشَقَّةٍ ظَاهِرَةٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":441},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَفِي الْجُمُعَةِ فَرْضُ عَيْنٍ عَلَيْهِمْ إِذَا كَانُوا أَرْبَعِينَ مُكَلَّفِينَ مُسْتَوْطِنِينَ فِي أَبْنِيَةٍ لا فِي الْخِيَامِ لِأَنَّهَا لا تَجِبُ عَلَى أَهْلِ الْخِيَامِ. وَتَجِبُ عَلَى مَنْ نَوَى الإِقَامَةَ عِنْدَهُمْ أَرْبَعَةَ أَيَّامٍ صِحَاحٍ أَيْ غَيْرَ يَوْمَيِ الدُّخُولِ وَالْخُرُوجِ وَعَلَى مَنْ بَلَغَهُ نِدَاءُ صَيِّتٍ مِنْ طَرَفٍ يَلِيهِ مِنْ بَلَدِهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":442},{"type":"p","text":"   الشَّرْحُ أَنَّ الْجَمَاعَةَ فِي الْجُمُعَةِ فَرْضُ عَيْنٍ فَلا تَصِحُّ فُرَادَى، وَفَرْضِيَّتُهَا عَلَى مَنْ كَانَ مَوْصُوفًا بِالأَوْصَافِ السَّابِقَةِ الذُّكُورَةِ وَالْحُرِّيَّةِ وَالإِقَامَةِ وَالْعَقْلِ وَالْبُلُوغِ وَفُقْدَانِ الْعُذْرِ، وَكُلُّ مَا هُوَ عُذْرٌ فِي تَرْكِ الْجَمَاعَةِ فَهُوَ عُذْرٌ فِي تَرْكِ الْجُمُعَةِ. وَإِنَّمَا تَجِبُ الْجُمُعَةُ عَلَيْهِمْ إِذَا كَانُوا أَرْبَعِينَ ذَكَرًا مُسْتَوْطِنًا إِقَامَتُهُمْ فِي خِطَّةِ أَبْنِيَةٍ أَيْ فِي مَكَانٍ مَعْدُودٍ مِنَ الْبَلَدِ وَلَوْ كَانَتِ الأَبْنِيَةُ مِنْ خَشَبٍ أَوْ قَصَبٍ أَوْ سَعَفٍ [وَالسَّعَفَةُ بِفَتْحَتَيْنِ غُصْنُ النَّخْلِ وَالْجَمْعُ سَعَفٌ]. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":443},{"type":"p","text":"   وَلا تَجِبُ عَلَى أَهْلِ الْخِيَامِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":444},{"type":"p","text":"وَتَجِبُ الْجُمُعَةُ عَلَى مَنْ نَوَى الإِقَامَةَ فِي بَلَدِ الْجُمُعَةِ أَرْبَعَةَ أَيَّامٍ صِحَاحٍ أَيْ كَوَامِلَ غَيْرَ يَوْمَيِ الدُّخُولِ وَالْخُرُوجِ فَأَكْثَرَ لِأَنَّهُ بِذَلِكَ يَنْقَطِعُ السَّفَرُ. وَتَجِبُ أَيْضًا عَلَى مَنْ تَوَطَّنَ مَحَلًّا يَبْلُغُهُ مِنْهُ النِّدَاءُ مِنْ شَخْصٍ صَيِّتٍ أَيْ عَالِي الصَّوْتِ بِاعْتِبَارِ كَوْنِهِ وَاقِفًا بِمُسْتَوٍ مِنْ طَرَفٍ يَلِي السَّامِعَ مِنَ بَلَدِ الْجُمُعَةِ مَعَ اعْتِبَارِ سُكُونِ الرِّيحِ بِحَيْثُ يَعْلَمُ أَنَّ مَا يَسْمَعُهُ نِدَاءُ الْجُمُعَةِ وَلَوْ لَمْ تَتَبَيَّنِ الْكَلِمَاتُ وَذَلِكَ بِاعْتِبَارِ مُعْتَدِلِ السَّمْعِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":445},{"type":"p","text":"وَلا تَجِبُ عَلَى مُسَافِرٍ إِلَّا أَنْ يَكُونَ عَاصِيًا بِسَفَرِهِ. وَلا يُشْتَرَطُ فِي الْمَسَافِرِ الَّذِي سَفَرُهُ مُبَاحٌ أَنْ يَكُونَ سَفَرُهُ مَسَافَةَ قَصْرٍ بِشَرْطِ أَنْ يَكُونَ فِي حُكْمِ الْمُسَافِرِ قَبْلَ الْفَجْرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":446},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَشَرْطُهَا وَقْتُ الظُّهْرِ وَخُطْبَتَانِ قَبْلَهَا فِيهِ يَسْمَعُهُمَا الأَرْبَعُونَ وَأَنْ تُصَلَّى جَمَاعَةً بِهِمْ وَأَنْ لا تُقَارِنَهَا أُخْرَى بِبَلَدٍ وَاحِدٍ فَإِنْ سَبَقَتْ إِحْدَاهُمَا بِالتَّحْرِيمَةِ صَحَّتِ السَّابِقَةُ وَلَمْ تَصِحَّ الْمَسْبُوقَةُ، هَذَا إِذَا كَانَ يُمْكِنُهُمُ الِاجْتِمَاعُ فِي مَكَانٍ وَاحِدٍ فَإِنْ شَقَّ ذَلِكَ صَحَّتِ السَّابِقَةُ وَالْمَسْبُوقَةُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":447},{"type":"p","text":"   الشَّرْحُ شَرْطُ صِحَّةِ الْجُمُعَةِ أَنْ تَقَعَ وَقْتَ الظُّهْرِ فَلا تُقْضَى الْجُمُعَةُ جُمُعَةً وَإِنَّمَا تُقْضَى إِذَا فَاتَ وَقْتُهَا ظُهْرًا. وَتُدْرَكُ الْجُمُعَةُ بِإِدْرَاكِ رَكْعَةٍ مَعَ الإِمَامِ وَأَمَّا إِذَا لَمْ يُدْرِكِ الْمَأْمُومُ الإِمَامَ إِلَّا بَعْدَ الرُّكُوعِ مِنَ الرَّكْعَةِ الثَّانِيَةِ فِي الْجُمُعَةِ فَإِنَّهُ عِنْدَئِذٍ يَنْوِي الْجُمُعَةَ وَيُصَلِّي أَرْبَعَ رَكَعَاتٍ. وَتُشْتَرَطُ خُطْبَتَانِ قَبْلَهَا بَعْدَ دُخُولِ الْوَقْتِ فَلَوْ ضَاقَ الْوَقْتُ عَنِ الْخُطْبَتَيْنِ وَالرَّكْعَتَيْنِ صَلَّوْا ظُهْرًا. وَيُشْتَرَطُ فِي الْخُطْبَتَيْنِ أَنْ يَسْمَعَهُمَا الأَرْبَعُونَ [أَيْ أَنْ يَسْمَعُوا أَرْكَانَهُمَا] وَأَنْ تُصَلَّى جَمَاعَةً بِهِمْ وَأَنْ لا تُقَارِنَهَا أَوْ تَسْبِقَهَا جُمُعَةٌ أُخْرَى بِبَلَدِهَا، قَالَ الشَّافِعِيُّ رَضِيَ اللَّهُ عَنْهُ وَإِنْ كَبُرَتِ الْبَلَدُ اهـ قَالَ أَصْحَابُهُ يَعْنِي إِذَا لَمْ يَشُقَّ اجْتِمَاعُ أَهْلِ الْبَلَدِ فَإِذَا سَبَقَتْ إِحْدَى الْجُمُعَتَيْنِ صَحَّتْ وَبَطَلَتِ الَّتِي بَعْدَهَا وَإِنْ تَقَارَنَتَا بَطَلَتَا وَكَذَلِكَ إِذَا لَمْ تُعْلَمِ السَّابِقَةُ وَالْعِبْرَةُ فِي السَّبْقِ وَالْمُقَارَنَةِ بِالرَّاءِ مِنْ تَكْبِيرَةِ الإِمَامِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":448},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَرْكَانُ الْخُطْبَتَيْنِ حَمْدُ اللَّهِ وَالصَّلاةُ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَالْوَصِيَّةُ بِالتَّقْوَى فِيهِمَا وَءَايَةٌ مُفْهِمَةٌ فِي إِحْدَاهُمَا وَالدُّعَاءُ لِلْمُؤْمِنِينَ فِي الثَّانِيَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":449},{"type":"p","text":"   الشَّرْحُ أَنَّ الْخُطْبَتَيْنِ لا تَكُونَانِ مُجْزِئَتَيْنِ إِلَّا بِهَذِهِ الأُمُورِ الْخَمْسَةِ أَوَّلُهَا حَمْدُ اللَّهِ بِلَفْظِ الْحَمْدُ لِلَّهِ أَوْ لِلَّهِ الْحَمْدُ أَوْ حَمْدًا لِلَّهِ أَوْ نَحْوِ ذَلِكَ. وَالثَّانِي الصَّلاةُ عَلَى النَّبِيِّ بِنَحْوِ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ أَوْ صَلَّى اللَّهُ عَلَى مُحَمَّدٍ. وَالثَّالِثُ الْوَصِيَةُ بِالتَّقْوَى وَهِيَ الْمَقْصُودُ الأَعْظَمُ فَلا يَكْفِي التَّحْذِيرُ مِنَ الدُّنْيَا بَلْ لا بُدَّ مِنَ الْحَثِّ عَلَى الطَّاعَةِ أَوِ الزَّجْرِ عَنِ الْمَعْصِيَةِ، وَلا يُشْتَرَطُ لَفْظُ التَّقْوَى فَلَوْ قَالَ أَطِيعُوا اللَّهَ كَفَى. وَهَذِهِ الثَّلاثَةُ يُشْتَرَطُ أَنْ تَكُونَ فِي كُلٍّ مِنَ الْخُطْبَتَيْنِ. وَالرَّابِعُ ءَايَةٌ مُفْهِمَةٌ كَامِلَةٌ وَإِنْ كَانَتْ مُتَعَلِّقَةً بِقِصَّةٍ فِي إِحْدَاهُمَا فِي ابْتِدَائِهَا أَوِ انْتِهَائِهَا أَوْ وَسَطِهَا وَالأَفْضَلُ أَنْ تَكُونَ قِرَاءَةُ الآيَةِ فِي الْخُطْبَةِ الأُولَى لِتُقَابِلَ الدُّعَاءَ فِي الثَّانِيَةِ. وَالْخَامِسُ الدُّعَاءُ لِلْمُؤْمِنِينَ الشَّامِلُ لِلْمُؤْمِنَاتِ فِي الْخُطْبَةِ الثَّانِيَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":450},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَشُرُوطُهُمَا الطَّهَارَةُ عَنِ الْحَدَثَيْنِ وَعَنِ النَّجَاسَةِ فِي الْبَدَنِ وَالْمَكَانِ وَالْمَحْمُولِ وَسَتْرُ الْعَوْرَةِ وَالْقِيَامُ وَالْجُلُوسُ بَيْنَهُمَا وَالْمُوَالاةُ بَيْنَ أَرْكَانِهِمَا وَبَيْنَهُمَا وَبَيْنَ الصَّلاةِ وَأَنْ تَكُونَا بِالْعَرَبِيَّةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":451},{"type":"p","text":"   الشَّرْحُ أَنَّ لِلْخُطْبَتَيْنِ شُرُوطًا وَهِيَ تِسْعَةٌ الأَوَّلُ الطَّهَارَةُ عَنِ الْحَدَثِ الأَصْغَرِ وَالأَكْبَرِ وَالطَّهَارَةُ عَنِ النَّجَاسَةِ غَيْرِ الْمَعْفُوِّ عَنْهَا فِي الْبَدَنِ وَالْمَكَانِ وَمَا يَحْمِلُهُ مِنْ ثَوْبٍ وَغَيْرِهِ. وَالثَّانِي سَتْرُ الْعَوْرَةِ. وَالثَّالِثُ الْقِيَامُ فِيهِمَا لِلْقَادِرِ بِالْمَعْنَى السَّابِقِ فِي قِيَامِ الْفَرْضِ فَإِنْ عَجَزَ فَجَالِسًا ثُمَّ مُضْطَجِعًا، وَالأَوْلَى فِي هَذِهِ الْحَالِ الِاسْتِخْلافُ. وَالرَّابِعُ الْجُلُوسُ بَيْنَهُمَا فَلَوْ تَرَكَهُ وَلَوْ سَهْوًا لَمْ تَصِحَّا وَأَمَّا مَنْ كَانَ يَخْطُبُ جَالِسًا بِعُذْرٍ فَيَفْصِلُ بَيْنَ الْخُطْبَتَيْنِ بِسَكْتَةٍ. وَأَقَلُّ هَذَا الْجُلُوسِ قَدْرُ الطُّمَأْنِينَةِ وَأَكْمَلُهُ قَدْرُ سُورَةِ الإِخْلاصِ. وَالْخَامِسُ الْمُوَالاةُ بَيْنَهُمَا وَبَيْنَ أَرْكَانِهِمَا وَبَيْنَهُمَا وَبَيْنَ الصَّلاةِ لِئَلَّا يَطُولَ الْفَصْلُ عُرْفًا بِمَا لا يَتَعَلَّقُ بِهِمَا. وَالسَّادِسُ أَنْ تَكُونَ أَرْكَانُ كُلٍّ مِنْهُمَا بِالْعَرَبِيَّةِ وَإِنْ كَانَ كُلُّ الْحَاضِرِينَ أَعَاجِمَ. وَالسَّابِعُ كَوْنُهُمَا بَعْدَ الزَّوَالِ. وَالثَّامِنُ سَمَاعُ الأَرْبَعِينَ الأَرْكَانَ وَلا يُشْتَرَطُ سَمَاعُهُمْ كُلَّ الْخُطْبَةِ. وَالتَّاسِعُ كَوْنُهُمَا قَبْلَ الصَّلاةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":452},{"type":"p","text":"   مَسْئَلَةٌ. يَحْرُمُ التَّشَاغُلُ عَنِ الْجُمُعَةِ بِبَيْعٍ وَنَحْوِ ذَلِكَ كَالإِجَارَةِ وَكَأَنْ يَهَبَ مَالًا لِيَهَبَهُ فِي مُقَابِلِهِ غَرَضًا بَعْدَ الأَذَانِ الثَّانِي وَيُكْرَهُ قَبْلَهُ وَبَعْدَ الزَّوَالِ، وَأَمَّا لَوْ رَكِبَ الشَّخْصُ سَيَّارَةَ الأُجْرَةِ لِلذَّهَابِ لِصَلاةِ الْجُمُعَةِ فَيَجُوزُ لِأَنَّ هَذَا لَيْسَ فِيهِ تَشَاغُلٌ عَنْهَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":453},{"type":"p","text":"   وَلا تُدْرَكُ الْجُمُعَةُ إِلَّا بِرَكْعَةٍ كَمَا تَقَدَّمَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":454},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":455},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ شُرُوطِ الِاقْتِدَاءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":456},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَى كُلِّ مَنْ صَلَّى مُقْتَدِيًا فِي جُمُعَةٍ أَوْ غَيْرِهَا أَنْ لا يَتَقَدَّمَ عَلَى إِمَامِهِ فِي الْمَوْقِفِ وَالإِحْرَامِ بَلْ تُبْطِلُ الْمُقَارَنَةُ فِي الإِحْرَامِ وَتُكْرَهُ فِي غَيْرِهِ إِلَّا التَّأْمِينَ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":457},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى مَنْ أَرَادَ الصَّلاةَ مُقْتَدِيًا بِغَيْرِهِ سَوَاءٌ كَانَ فِي جُمُعَةٍ أَوْ غَيْرِهَا أَنْ يُرَاعِيَ شُرُوطَ الِاقْتِدَاءِ فِي إِمَامِهِ الَّذِي يُرِيدُ الِاقْتِدَاءَ بِهِ وَهِيَ سِتَّةٌ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":458},{"type":"p","text":"   الأَوَّلُ أَنْ لا يَعْلَمَ بُطْلانَ صَلاتِهِ فَإِنْ عَلِمَ بُطْلانَ صَلاتِهِ بِحَدَثٍ أَوْ غَيْرِهِ كَأَنْ عَلِمَ عَلَى ثَوْبِهِ نَجَاسَةً غَيْرَ مَعْفُوٍّ عَنْهَا وَاقْتَدَى بِهِ فَسَدَتْ صَلاتُهُ لِتَلاعُبِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":459},{"type":"p","text":"   وَالثَّانِي أَنْ لا يَظُنَّ الْبُطْلانَ فَلَوِ اجْتَهَدَ اثْنَانِ فِي الْقِبْلَةِ فَاخْتَلَفَ اجْتِهَادُهُمَا فَلَيْسَ لِأَحَدِهِمَا أَنْ يَقْتَدِيَ بِالآخَرِ فَإِنِ اقْتَدَى أَحَدُهُمَا بِالآخَرِ بَطَلَتْ صَلاةُ الْمُقْتَدِي [أَيْ لَمْ تَنْعَقِدْ].","style":"Normal","align":"justify","bold":false,"size":18.0,"index":460},{"type":"p","text":"   وَالثَّالِثُ أَنْ لا يَعْتَقِدَ وُجُوبَ الْقَضَاءِ عَلَيْهِ كَمُتَيَمِّمٍ لِفَقْدِ مَاءٍ بِمَحَلٍّ يَغْلِبُ فِيهِ وُجُودُهُ فَلا يَصِحُّ أَنْ يَقْتَدِيَ بِمَنْ عَلِمَهُ مُتَيَمِّمًا لِفَقْدِ الْمَاءِ فِي هَذَا الْمَحَلِّ لِأَنَّهُ لا بُدَّ لَهُ مِنَ الْقَضَاءِ، وَمِثْلُهُ مَنْ كَانَ وَضَعَ جَبِيرَةً عَلَى مَوْضِعِ التَّيَمُّمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":461},{"type":"p","text":"   وَالرَّابِعُ أَنْ لا يَشُكَّ فِي كَوْنِهِ مَأْمُومًا أَوْ إِمَامًا فَيَحْرُمُ الِاقْتَدَاءُ بِمَنْ شَكَّ فِيهِ هَلْ هُوَ إِمَامٌ أَوْ مَأْمُومٌ وَبِالأَوْلَى إِنْ عَلِمَ أَنَّهُ مَأْمُومٌ وَهَذَا إِنْ كَانَ اقْتَدَى بِهِ قَبْلَ انْقِضَاءِ صَلاةِ إِمَامِهِ أَمَّا بَعْدَ انْتِهَاءِ صَلاةِ الإِمَامِ فَإِنِ اقْتَدَى بِمَنْ كَانَ مَأْمُومًا مَسْبُوقًا صَحَّتْ قُدْوَتُهُ مَعَ الْكَرَاهَةِ إِنْ عَلِمَ بِالْحَالِ، فَلَوْ رَأَى اثْنَيْنِ وَشَكَّ أَيُّهُمَا الإِمَامُ لَمْ يَصِحَّ الِاقْتِدَاءُ بِأَحَدِهِمَا وَلَوِ اجْتَهَدَ فِي ذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":462},{"type":"p","text":"   وَالْخَامِسُ أَنْ لا يَكُونَ أُمِّيًّا لا يُحْسِنُ الْفَاتِحَةَ كَأَنْ يَعْجِزَ عَنْ حَرْفٍ مِنْ حُرُوفِ الْفَاتِحَةِ أَوْ عَنْ إِخْرَاجِهِ مِنْ مَخْرَجِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":463},{"type":"p","text":"   وَالسَّادِسُ أَنْ لا يَقْتَدِيَ الذَّكَرُ بِالْمَرْأَةِ وَالْخُنْثَى الْمُشْكِلِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":464},{"type":"p","text":"   تَنْبِيهٌ. الْمَرْأَةُ يَصِحُّ أَنْ تَقْتَدِيَ بِرَجُلٍ وَخُنْثَى وَامْرَأَةٍ، وَأَمَّا الْخُنْثَى فَيَقْتَدِي بِالرَّجُلِ دُونَ الْمَرْأَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":465},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «أَنْ لا يَتَقَدَّمَ عَلَى إِمَامِهِ فِي الْمَوْقِفِ وَالإِحْرَامِ بَلْ تُبْطِلُ الْمُقَارَنَةُ فِي الإِحْرَامِ وَتُكْرَهُ فِي غَيْرِهِ إِلَّا التَّأْمِينَ» فِيهِ ذِكْرُ أُمُورٍ مِنَ الشُّرُوطِ الأَوَّلُ مِنْهَا أَنْ لا يَتَقَدَّمَ عَلَى إِمَامِهِ فِي الْمَوْقِفِ وَالْعِبْرَةُ بِالتَّقَدُّمِ بِعَقِبِ الرِّجْلِ فِي الْقَائِمِ الْمُعْتَمِدِ عَلَيْهَا فَإِنْ تَقَدَّمَ بِعَقِبِهِ عَلَى الإِمَامِ لَمْ تَصِحَّ صَلاتُهُ، وَالثَّانِي الْمُتَابَعَةُ لَهُ فِي التَّحَرُّمِ فَيَجِبُ أَنْ لا يَتَقَدَّمَ عَلَيْهِ بِتَكْبِيرَةِ الإِحْرَامِ بَلْ تُبْطِلُ الْمُقَارَنَةُ لِلإِمَامِ يَقِينًا أَوْ شَكًّا بِالإِحْرَامِ فَيَجِبُ تَأْخِيرُ جَمِيعِ تَكْبِيرَةِ الْمَأْمُومِ عَنْ جَمِيعِ تَكْبِيرَةِ الإِمَامِ. وَأَمَّا الْمُقَارَنَةُ فِي غَيْرِهِ مِنْ سَائِرِ الأَفْعَالِ فَمَكْرُوهةٌ وَتَفُوتُ بِهَا فَضِيلَةُ الْجَمَاعَةِ، وَيُسْتَثْنَى مِمَّا ذُكِرَ التَّأْمِينُ أَيْ قَوْلُ ءَامِينَ فَالأَفْضَلُ فِيهِ الْمُقَارَنَةُ أَيْ لا يَسْبِقُهُ وَلا يَتَأَخَّرُ عَنْهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":466},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَحْرُمُ تَقَدُّمُهُ بِرُكْنٍ فِعْلِيٍّ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":467},{"type":"p","text":"   الشَّرْحُ مِنْ أَحْكَامِ الْجَمَاعَةِ أَنْ لا يَتَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ بِرُكْنٍ فِعْلِيٍّ فَتَقَدُّمُ الْمَأْمُومِ عَلَى الإِمَامِ بِرُكْنٍ فِعْلِيٍّ كَالرُّكُوعِ وَالسُّجُودِ حَرَامٌ وَهُوَ مِنَ الْكَبَائِرِ. وَمَعْنَى السَّبْقِ بِرُكْنٍ فِعْلِيٍّ أَنْ يَكُونَ الإِمَامُ فِي الْقِيَامِ فَيَسْبِقُهُ الْمَأْمُومُ فَيَرْكَعُ ثُمَّ يَرْفَعُ رَأْسَهُ فَهَذَا حَرَامٌ مِنَ الْكَبَائِرِ وَلا تَبْطُلُ الصَّلاةُ بِذَلِكَ فَلَوْ سَبَقَ الإِمَامَ بِبَعْضِ الرُّكْنِ لا بِكُلِّهِ كَأَنْ رَكَعَ وَالإِمَامُ قَائِمٌ فَانْتَظَرَ فِي الرُّكُوعِ حَتَّى رَكَعَ الإِمَامُ فَهُوَ مَكْرُوهٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":468},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَتَبْطُلُ الصَّلاةُ بِالتَّقَدُّمِ عَلَى الإِمَامِ بِرُكْنَيْنِ فِعْلِيَيْنِ مُتَوَالِيَيْنِ طَوِيلَيْنِ أَوْ طَوِيلٍ وَقَصِيرٍ بِلا عُذْرٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":469},{"type":"p","text":"   الشَّرْحُ ذَلِكَ كَأَنْ يَرْكَعَ الْمَأْمُومُ وَيَعْتَدِلَ وَيَهْوِيَ لِلسُّجُودِ وَالإِمَامُ قَائِمٌ وَمِثْلُهُ أَنْ يَرْكَعَ الْمَأْمُومُ قَبْلَ الإِمَامِ فَلَمَّا أَرَادَ أَنْ يَرْكَعَ رَفَعَ فَلَمَّا أَرَادَ أَنْ يَرْفَعَ سَجَدَ فَلَمْ يَجْتَمِعْ مَعَهُ فِي رُكُوعٍ وَلا اعْتِدَالٍ فَهَذَا أَيْضًا تَقَدُّمٌ عَلَى الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":470},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَذَا التَّأَخُّرُ عَنْهُ بِهِمَا بِغَيْرِ عُذْرٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":471},{"type":"p","text":"   الشَّرْحُ لَوْ رَفَعَ الإِمَامُ رَأْسَهُ مِنَ الرُّكُوعِ وَاعْتَدَلَ وَبَدَأَ بِالْهُوِيِّ لِلسُّجُودِ وَالْمَأْمُومُ بَعْدُ قَائِمٌ لَمْ يَرْكَعْ بِلا عُذْرٍ فَهَذَا تَأَخُّرٌ عَنِ الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ وَهُوَ مُبْطِلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":472},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبِأَكْثَرَ مِنْ ثَلاثَةِ أَرْكَانٍ طَوِيلَةٍ وَلَوْ لِعُذْرٍ فَلَوْ تَأَخَّرَ لإِتْمَامِ الْفَاتِحَةِ حَتَّى فَرَغَ الإِمَامُ مِنَ الرُّكُوعِ وَالسُّجُودَيْنِ فَجَلَسَ لِلتَّشَهُّدِ أَوْ قَامَ وَافَقَ الإِمَامَ فِيمَا هُوَ فِيهِ وَأَتَى بِرَكْعَةٍ بَعْدَ سَلامِ إِمَامِهِ وَإِنْ أَتَمَّهَا قَبْلَ ذَلِكَ مَشَى عَلَى تَرْتِيبِ نَفْسِهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":473},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ مُبْطِلاتِ الصَّلاةِ التَّأَخُّرَ عَنِ الإِمَامِ بِأَكْثَرَ مِنْ ثَلاثَةِ أَرْكَانٍ طَوِيلَةٍ كَالرُّكُوعِ وَالسُّجُودَيْنِ كَأَنْ رَكَعَ الإِمَامُ ثُمَّ اعْتَدَلَ ثُمَّ هَوَى لِلسُّجُودِ فَسَجَدَ السُّجُودَ الأَوَّلَ وَالسُّجُودَ الثَّانِيَ وَقَعَدَ لِلتَّشَهُّدِ [أَيْ لِلتَّشَهُّدِ الأَخِيرِ أَوِ الأَوَّلِ مَعَ أَنَّهُ لَيْسَ رُكْنًا لِأَنَّهُ عَلَى صُورَةِ الرُّكْنِ] فَإِذَا كَانَ لَمْ يَنْتَهِ مِنْ قِرَاءَةِ الْفَاتِحَةِ تَرَكَ تَرْتِيبَ نَفْسِهِ وَوَافَقَ الإِمَامَ فِيمَا هُوَ فِيهِ [فَإِنْ قَامَ الإِمَامُ لِرَكْعَةٍ تَالِيَةٍ وَلَمْ يَجْلِسْ لِلتَّشَهُّدِ وَافَقَ الْمَأْمُومُ الإِمَامَ فِي الْقِيَامِ وَيَعْتَدُّ بِمَا أَتَى بِهِ مِنَ الْفَاتِحَةِ وَيَأْتِي بِرَكْعَةٍ بَعْدَ سَلامِ الإِمَامِ] وَفَاتَتْهُ رَكْعَةٌ فَيَأْتِي بِرَكْعَةٍ بَعْدَ سَلامِ إِمَامِهِ وَإِلَّا بِأَنْ لَمْ يُتَابِعِ الإِمَامَ وَلا نَوَى مُفَارَقَتَهُ بَلِ اسْتَمَرَ عَلَى تَرْتِيبِ نَفْسِهِ فَهَذَا تَبْطُلُ صَلاتُهُ لِأَنَّهُ تَأَخَّرَ بِأَكْثَرَ مِنْ ثَلاثَةِ أَرْكَانٍ طَوِيلَةٍ وَلَوْ كَانَ تَأَخُّرُهُ لِعُذْرٍ كَأَنْ كَانَ نَاسِيًا أَنَّهُ فِي الصَّلاةِ أَوْ أَنَّهُ مُقْتَدٍ أَوْ كَانَ بَطِيءَ الْقِرَاءَةِ أَيْ لا يُسَاعِدُهُ لِسَانُهُ عَلَى السُّرْعَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":474},{"type":"p","text":"   بَيَانٌ. إِنَّمَا شَرَطُوا الرُّكْنَ الْفِعْلِيَّ لِأَنَّ التَّقَدُّمَ بِالرُّكْنِ الْقَوْلِيِّ غَيْرِ السَّلامِ لا يَحْرُمُ وَلا يُبْطِلُ الصَّلاةَ كَالتَّقَدُّمِ بِالْفَاتِحَةِ قَبْلَ أَنْ يَبْدَأَ الإِمَامُ بِهَا أَوْ بِالتَّشَهُّدِ الأَخِيرِ قَبْلَ أَنْ يَبْدَأَ الإِمَامُ بِهِ فَإِذَا قَرَأَ الْمَأْمُومُ الْفَاتِحَةَ وَأَنْهَاهَا وَالإِمَامُ بَعْدُ لَمْ يَشْرَعْ فِي قِرَاءَتِهَا ثُمَّ اكْتَفَى الْمَأْمُومُ بِتِلْكَ الْقِرَاءَةِ لَمْ يَحْرُمْ ذَلِكَ وَلَمْ تَبْطُلْ صَلاتُهُ لَكِنَّهُ ارْتَكَبَ الْكَرَاهَةَ إِلَّا أَنَّ التَّقَدُّمَ بِتَكْبِيرَةِ الإِحْرَامِ عَلَى الإِمَامِ يَمْنَعُ صِحَّةَ الْقُدْوَةِ فَيُبْطِلُ الصَّلاةَ فَمَنْ أَرَادَ الِاقْتِدَاءَ بِإِمَامٍ فَكَبَّرَ قَبْلَهُ تَكْبِيرَةَ الإِحْرَامِ مَعَ نِيَّةِ الِاقْتِدَاءِ بِهِ لَمْ تَصِحَّ صَلاتُهُ إِلَّا أَنْ يُعِيدَ التَّكْبِيرَةَ بَعْدَ تَكْبِيرَةِ الإِمَامِ، وَكَذَا السَّلامُ عَمْدًا قَبْلَ الإِمَامِ يُبْطِلُ الصَّلاةَ إِلَّا أَنْ يَنْوِيَ الْمُفَارَقَةَ فَيُسَلِّمَ قَبْلَهُ فَإِنَّ صَلاتَهُ لا تَبْطُلُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":475},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يَعْلَمَ بِانْتِقَالاتِ إِمَامِهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":476},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ الْقُدْوَةِ عِلْمُ الْمَأْمُومِ بِانْتِقَالاتِ إِمَامِهِ لِيَتَمَكَّنَ مِنَ الْمُتَابَعَةِ. وَيَحْصُلُ هَذَا الْعِلْمُ بِرُؤْيَةِ الإِمَامِ أَوْ بَعْضِ الْمَأْمُومِينَ مِمَّنْ يَرَى الإِمَامَ أَوْ بِسَمَاعِ الصَّوْتِ مِنَ الإِمَامِ وَلَوْ بِوَاسِطَةِ الآلَةِ أَوْ مِنَ الْمُبَلِّغِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":477},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يَجْتَمِعَا فِي مَسْجِدٍ وَإِلَّا فَفِي مَسَافَةِ ثَلاثِمِائَةِ ذِرَاعٍ يَدَوِيَّةٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":478},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ الْقُدْوَةِ أَنْ يَجْتَمِعَ الإِمَامُ وَالْمَأْمُومُ فِي مَكَانٍ مَسْجِدٍ أَوْ غَيْرِهِ مِنْ فَضَاءٍ أَوْ بِنَاءٍ أَوْ أَحَدُهُمَا بِمَسْجِدٍ وَالآخَرُ بِغَيْرِهِ فَإِنْ كَانَا فِي مَسْجِدٍ صَحَّتِ الْقُدْوَةُ وَإِنْ بَعُدَتِ الْمَسَافَةُ جِدًّا كَأَنْ كَانَتِ الْمَسَافَةُ بَيْنَ الإِمَامِ وَالْمَأْمُومِ أَرْبَعَمِائَةِ ذِرَاعٍ أَوْ أَكْثَر، وَإِنْ كَانَا فِي غَيْرِ ذَلِكَ كَأَنْ كَانَا فِي فَضَاءٍ اشْتُرِطَ أَنْ لا تَزِيدَ الْمَسَافَةُ بَيْنَ الإِمَامِ وَالْمَأْمُومِ عَلَى ثَلاثِمِائَةِ ذِرَاعٍ بِذِرَاعِ الآدَمِيِّ الْمُعْتَدِلِ تَقْرِيبًا، فَإِنْ كَانَ الْمَأْمُومُونَ صُفُوفًا مُتَتَابِعَةً اشْتُرِطَ أَنْ لا تَزِيدَ الْمَسَافَةُ بَيْنَ الصَّفِّ الَّذِي فِيهِ الْمَأْمُومُ وَالصَّفِّ الَّذِي قَبْلَهُ عَلَى ثَلاثِمِائَةِ ذِرَاعٍ وَإِنْ بَلَغَ مَا بَيْنَ الإِمَامِ وَالصَّفِّ الأَخِيرِ فَرَاسِخَ بِشَرْطِ إِمْكَانِ الْمُتَابَعَةِ. فَإِنْ لَمْ يَرَ الإِمَامَ اشْتُرِطَ عَدَمُ تَقَدُّمِهِ عَلَى مَنْ يَرْبُطُ لَهُ صَلاتَهُ بِصَلاةِ الإِمَامِ لِأَنَّهُ لَهُ كَالإِمَامِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":479},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ لا يَحُولَ بَيْنَهُمَا حَائِلٌ يَمْنَعُ الِاسْتِطْرَاقَ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":480},{"type":"p","text":"   الشَّرْحُ يُشْتَرَطُ لِصِحَّةِ الْقُدْوَةِ فِي غَيْرِ الْمَسْجِدِ عَدَمُ وُجُودِ حَائِلٍ بَيْنَ الإِمَامِ وَالْمَأْمُومِ يَمْنَعُ الْمُرُورَ إِلَى الإِمَامِ أَوْ رُؤْيَةَ الإِمَامِ أَوْ مَنْ خَلْفَهُ كَجِدَارٍ أَوْ بَابٍ مُغْلَقٍ أَوْ مَرْدُودٍ لِمَنْعِهِ الرُّؤْيَةَ أَوْ شُبَّاكٍ لِمَنْعِهِ الِاسْتِطْرَاقَ أَيِ الْمُرُورَ أَمَّا فِي الْمَسْجِدِ فَلا تَضُرُّ أَبْنِيَةٌ حَالَتْ بِشَرْطِ أَنْ تَكُونَ نَافِذَةً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":481},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يَتَوَافَقَ نَظْمُ صَلاتَيْهِمَا فَلا تَصِحُّ قُدْوَةُ مُصَلِّي الْفَرْضِ خَلْفَ صَلاةِ الْجِنَازَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":482},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ الْجَمَاعَةِ وَالْقُدْوَةِ تَوَافُقُ نَظْمِ صَلاةِ الإِمَامِ وَنَظْمِ صَلاةِ الْمَأْمُومِ بِأَنْ يَتَّفِقَا فِي الأَفْعَالِ الظَّاهِرَةِ وَإِنِ اخْتَلَفَا عَدَدًا وَنِيَّةً فَإِنِ اخْتَلَفَا فِي ذَلِكَ كَمَكْتُوبَةٍ اقْتَدَى فَاعِلُهَا بِمَنْ يُصَلِّي صَلاةَ الْجِنَازَةِ فَإِنَّهَا لا تَصِحُّ بِهَذِهِ الْكَيْفِيَّةِ لِتَعَذُّرِ الْمُتَابَعَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":483},{"type":"p","text":"   وَيَصِحُّ اقْتِدَاءُ الْقَاضِي بِالْمُؤَدِّي وَالْمُفْتَرِضِ بِالْمُتَنَفِّلِ وَالْعَكْسُ لَكِنَّ الِانْفَرَادَ أَفْضَلُ مِنْ هَذِهِ الْجَمَاعَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":484},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ لا يُخَالِفَ الإِمَامَ فِي سُنَّةٍ تَفْحُشُ الْمُخَالَفَةُ فِيهَا فِعْلًا كَالتَّشَهُّدِ الأَوَّلِ أَيْ جُلُوسِهِ وَتَرْكًا كَسُجُودِ السَّهْوِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":485},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ الْقُدْوَةِ أَنْ لا يُخَالِفَ الْمَأْمُومُ الإِمَامَ فِي تَرْكِ سُنَّةٍ بِحَيْثُ تَفْحُشُ الْمُخَالَفَةُ مِنَ الْمَأْمُومِ لِلإِمَامِ كَأَنْ تَرَكَ الإِمَامُ التَّشَهُّدَ الأَوَّلَ وَفَعَلَهُ الْمَأْمُومُ فَإِنَّ صَلاةَ الْمَأْمُومِ تَبْطُلُ إِنْ كَانَ عَالِمًا بِالْحُرْمَةِ وَتَعَمَّدَ ذَلِكَ وَلَوْ لَحِقَهُ عَنْ قُرْبٍ لِتَرْكِهِ الْمُتَابَعَةَ الْمَفْرُوضَةَ وَأَمَّا إِنْ كَانَ جَاهِلًا بِحُرْمَةِ ذَلِكَ فَلا تَفْسُدُ صَلاتُهُ، أَمَّا لَوْ أَتَى الإِمَامُ بِالتَّشَهُّدِ الأَوَّلِ وَتَرَكَهُ الْمَأْمُومُ عَمْدًا لَمْ تَبْطُلْ صَلاةُ الْمَأْمُومِ لِأَنَّهُ خَرَجَ مِنْ فَرْضٍ إِلَى فَرْضٍ وَلَوْ فَعَلَ ذَلِكَ سَهْوًا لَزِمَهُ الْعَوْدُ وَإِلَّا بَطَلَتْ. وَلَوْ قَامَ الإِمَامُ مِنْ غَيْرِ أَنْ يَجْلِسَ لِلتَّشَهُّدِ ثُمَّ عَادَ نَاسِيًا [أَيْ عَادَ إِلَى الْجُلُوسِ نَاسِيًا أَنَّهُ فِي الصَّلاةِ] لَمْ يَجُزْ لِلْمَأْمُومِ أَنْ يَعُودَ مَعَهُ إِلَى الْقُعُودِ بَلْ يَنْتَظِرُهُ قَائِمًا أَوْ يُفَارِقُهُ بِالنِّيَّةِ. وَإِنْ سَجَدَ الإِمَامُ لِلسَّهْوِ لَزِمَ الْمَأْمُومَ مُتَابَعَتُهُ فَلَوْ لَمْ يَفْعَلْ وَانْتَظَرَهُ قَاعِدًا بَطَلَتْ صَلاتُهُ. وَأَمَّا الْمُخَالَفَةُ فِي سُنَّةٍ لا تَفْحُشُ الْمُخَالَفَةُ فِيهَا كَجِلْسَةِ الِاسْتِرَاحَةِ فَلا تَضُرُّ لِأَنَّهَا يَسِيرَةٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":486},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يَنْوِيَ الِاقْتِدَاءَ مَعَ التَّحَرُّمِ فِي الْجُمُعَةِ وَقَبْلَ الْمُتَابَعَةِ وَطُولِ الِانْتِظَارِ فِي غَيْرِهَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":487},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ الْقُدْوَةِ أَنْ يَنْوِيَ الْمَأْمُومُ الْقُدْوَةَ أَوِ الْجَمَاعَةَ فِي التَّكْبِيرَةِ أَوْ فِيمَا بَعْدَهَا، وَفِي تَكْبِيرَةِ التَّحَرُّمِ فِي الْجُمُعَةِ وَالصَّلاةِ الْمُعَادَةِ وَالْمَجْمُوعَةِ لِلْمَطَرِ فَيُشْتَرَطُ فِي هَذِهِ الْمَذْكُورَاتِ نِيَّةُ الِاقْتِدَاءِ فِي أَثْنَاءِ تَكْبِيرَةِ التَّحَرُّمِ وَكَذَلِكَ الْمَنْذُورَةُ جَمَاعَةً، وَمَا سِوَى هَؤُلاءِ الأَرْبَعِ يُشْتَرَطُ فِيهِ أَنْ تَكُونَ النِّيَّةُ قَبْلَ الْمُتَابَعَةِ بِحَيْثُ لَوْ تَابَعَ بِلا نِيَّةٍ فَسَدَتْ صَلاتُهُ أَيْ إِنْ طَالَ انْتِظَارُهُ بِخِلافِ مَا إِذَا انْتَظَرَهُ انْتِظَارًا طَوِيلًا بِلا مُتَابَعَةٍ فَإِنَّهُ لا تَفْسُدُ صَلاتُهُ، أَيْ أَنَّ الَّذِي يُتَابِعُ شَخْصًا لَمْ يَنْوِ الِاقْتِدَاءَ بِهِ قَصْدًا أَيْ يَنْتَظِرُ رُكُوعَهُ فَيَرْكَعُ بَعْدَ رُكُوعِهِ أَوْ يَنْتَظِرُ سُجُودَهُ فَيَسْجُدُ بَعْدَ سُجُودِهِ كَأَنَّهُ مَأْمُومٌ وَهُوَ لَيْسَ بِمَأْمُومٍ فَسَدَتْ صَلاتُهُ إِنْ طَالَ انْتِظَارُهُ بِخِلافِ مَا لَوْ تَابَعَهُ اتِّفَاقًا أَيْ مُصَادَفَةً لا بِقَصْدٍ فَإِنَّ صَلاتَهُ لا تَفْسُدُ وَلا تُفْسِدُ مُتَابَعَتُهُ فِي الأَقْوَالِ إِلَّا فِي السَّلامِ، وَكَذَلِكَ إِنِ انْتَظَرَهُ انْتِظَارًا طَوِيلًا وَلَمْ يُتَابِعْهُ فِي الْفِعْلِ فَلا تَفْسُدُ صَلاتُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":488},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَى الإِمَامِ نِيَّةُ الإِمَامَةِ فِي الْجُمُعَةِ وَالْمُعَادَةِ وَتُسَنُّ فِي غَيْرِهِمَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":489},{"type":"p","text":"   الشَّرْحُ أَنَّهُ لا تُشْتَرَطُ نِيَّةُ الإِمَامَةِ أَوِ الْجَمَاعَةِ مِنَ الإِمَامِ بَلْ يُسَنُّ لَهُ ذَلِكَ فَلَوْ تَرَكَهَا أَيْ نِيَّةَ الإِمَامَةِ لَمْ يَحُزْ فَضِيلَةَ الْجَمَاعَةِ، وَهَذَا فِي غَيْرِ الْجُمُعَةِ فَإِنْ تَرَكَهَا فِي الْجُمُعَةِ لَمْ تَصِحَّ جُمُعَتُهُ. وَكَذَلِكَ يَجِبُ عَلَى الإِمَامِ نِيَّةُ الإِمَامَةِ فِي التَّكْبِيرِ فِي الصَّلاةِ الْمُعَادَةِ وَفِي الْمَجْمُوعَةِ لِلْمَطَرِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":490},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْمُعَادَةُ هِيَ الصَّلاةُ الَّتِي يُصَلِّيهَا جَمَاعَةً مَرَّةً ثَانِيَةً بَعْدَ أَنْ صَلَّاهَا جَمَاعَةً أَوْ مُنْفَرِدًا. ","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":491},{"type":"p","text":"   الشَّرْحُ أَنَّهُ مَنْ صَلَّى مُنْفَرِدًا أَوْ جَمَاعَةً ثُمَّ رَأَى مَنْ يُصَلِّي مَعَهُ جَمَاعَةً يُسَنُّ لَهُ إِعَادَتُهَا لِأَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَلَّى الصُّبْحَ فَرَأَى رَجُلَيْنِ لَمْ يُصَلِّيَا مَعَهُ فَقَالَ «مَا مَنَعَكُمَا أَنْ تُصَلِّيَا مَعَنَا» قَالا صَلَّيْنَا فِي رِحَالِنَا فَقَالَ «إِذَا صَلَّيْتُمَا فِي رِحَالِكُمَا ثُمَّ أَتَيْتُمَا مَسْجِدَ جَمَاعَةٍ فَصَلِّيَاهَا مَعَهُمْ فَإِنَّهَا لَكُمَا نَافِلَة» رَوَاهُ أَبُو دَاوُدَ وَغَيْرُهُ وَصَحَّحَهُ التِّرْمِذِيُّ وَغَيْرُهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":492},{"type":"p","text":"   وَتَكُونُ نِيَّةُ الْمُعَادَةِ بِأَنْ يَقُولَ فِي قَلْبِهِ مَثَلًا أُصَلِّي فَرْضَ الظُّهْرِ مُعَادًا جَمَاعَةً.$","style":"Normal","align":"justify","bold":false,"size":18.0,"index":493},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":494},{"type":"source","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَحْكَامِ تَجْهِيزِ الْمَيِّتِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":495},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: غَسْلُ الْمَيِّتِ وَتَكْفِينُهُ وَالصَّلاةُ عَلَيْهِ وَدَفْنُهُ فَرْضُ كِفَايَةٍ إِذَا كَانَ مُسْلِمًا وُلِدَ حَيًّا، وَوَجَبَ لِذِمِيٍّ تَكْفِينٌ وَدَفْنٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":496},{"type":"p","text":"   الشَّرْحُ تَجْهِيزُ الْمَيِّتِ الْمُسْلِمِ مِنْ فُرُوضِ الْكِفَايَةِ فَإِذَا مَاتَ مَيِّتٌ مُسْلِمٌ ثُمَّ أُهْمِلَ تَجْهِيزُهُ فَلَمْ يُجَهَّزْ فَظَلَّ عَلَى الأَرْضِ حَتَّى انْتَفَخَ وَأَنْتَنَتْ رَائِحَتُهُ أَثِمَ كُلُّ مَنْ عَلِمَ بِحَالِهِ فَلَمْ يَفْعَلْ مِنْ غَيْرِ عُذْرٍ مِنْ رِجَالٍ أَوْ نِسَاءٍ، هَذَا الْحُكْمُ شَامِلٌ لِلْجَمِيعِ فَيَجِبُ غَسْلُ الْغَرِيقِ وَلا يُكْتَفَى بِغَرَقِهِ وَكَذَلِكَ قَاتِلُ نَفْسٍ مُسْلِمَةٍ وَقَاتِلُ نَفْسِهِ. أَمَّا غَيْرُ الْمُسْلِمِ فَلا يَجِبُ لَهُ ذَلِكَ فَمَنْ عَلِمَ بِمَوْتِ الْكَافِرِ فَلَمْ يَفْعَلْ شَيْئًا مِمَّا ذُكِرَ لَمْ يَكُنْ عَلَيْهِ إِثْمٌ إِلَّا أَنَّ الْكَافِرَ الذِّمِيَّ يَجِبُ تَكْفِينُهُ وَدَفْنُهُ فَقَطْ فَلا تَجُوزُ الصَّلاةُ عَلَيْهِ وَلا يَجِبُ غَسْلُهُ فَلَوْ غُسِّلَ لَمْ يَكُنْ فِيهِ إِثْمٌ. وَالْكَافِرُ الذِّمِيُّ هُوَ مَنْ كَانَ لَهُ عَهْدٌ مَعَ سُلْطَانِ الْمُسْلِمِينَ لِكَوْنِهِ الْتَزَمَ دَفْعَ الْجِزْيَةِ كُلَّ سَنَةٍ مَرَّةً وَاحِدَةً فَهَذَا الْكَافِرُ الذِّمِيُّ إِذَا مَاتَ لَهُ حَقُّ التَّكْفِينِ وَالدَّفْنِ لَكِنَّهُ لا يُدْفَنُ فِي مَقَابِرِ الْمُسْلِمِينَ فَإِنْ لَمْ يَكُنْ تَرَكَ مَالًا يُكَفَّنُ بِهِ وَيُجَهَّزُ بِهِ لِلدَّفْنِ كَانَ ذَلِكَ حَقًّا أَنْ يُؤْخَذَ مِنْ بَيْتِ مَالِ الْمُسْلِمِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":497},{"type":"p","text":"   أَمَّا الْمُرْتَدُّ فَلَيْسَ لَهُ شَىْءٌ مِنْ ذَلِكَ وَلَوْ كَانَ أَبُوهُ وَأُمُّهُ مُسْلِمَيْنِ فَلا يَسْتَحِقُّ إِذَا مَاتَ عَلَى قَرِيبِهِ الْمُسْلِمِ أَنْ يَدْفِنَهُ وَلا أَنْ يُكَفِّنَهُ، وَلَوْ تَرَكَهُ لِلْكِلابِ أَوْ لِلْوُحُوشِ وَالسِّبَاعِ لَمْ يَكُنْ عَلَيْهِ ذَنْبٌ لَكِنَّهُ يُسَنُّ أَنْ يُفْعَلَ بِهِ مَا يَكْفِي النَّاسَ رَائِحَتَهُ الْكَرِيهَةَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":498},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلِسِقْطٍ مَيِّتٍ غَسْلٌ وَكَفَنٌ وَدَفْنٌ وَلا يُصَلَّى عَلَيْهِمَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":499},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذِهِ الأُمُورَ لا تَجِبُ لِلْمَيِّتِ إِلَّا إِذَا كَانَ الْمَيِّتُ مُسْلِمًا قَدْ وُلِدَ حَيًّا بِأَنْ صَرَخَ أَوِ اخْتَلَجَ أَيْ تَحَرَّكَ اخْتِلاجًا اخْتِيَارِيًّا بَعْدَ انْفِصَالِهِ عَنِ الْبَطْنِ فَهَذَا يَجِبُ لَهُ الأُمُورُ الأَرْبَعَةُ غَسْلُهُ وَتَكْفِينُهُ وَالصَّلاةُ عَلَيْهِ وَدَفْنُهُ فَإِنْ لَمْ يَظْهَرْ مِنْهُ أَمَارَةُ الْحَيَاةِ كَالِاخْتِلاجِ الِاخْتِيَارِيِّ وَالصِّيَاحِ فَلا تَجِبُ الصَّلاةُ عَلَيْهِ لَكِنْ يَجِبُ غَسْلُهُ وَتَكْفِينُهُ وَدَفْنُهُ هَذَا إِنْ ظَهَرَ فِيهِ خِلْقَةُ ءَادَمِيٍّ وَأَمَّا إِنْ لَمْ تَظْهَرْ فِيهِ خِلْقَةُ ءَادَمِيٍّ نُدِبَ لَفُّهُ بِخِرْقَةٍ وَدَفْنُهُ وَلا يَجِبَانِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":500},{"type":"p","text":"   وَقَوْلُ الْمُؤَلِّفِ «عَلَيْهِمَا» الضَّمِيرُ فِيهِ يَعُودُ إِلَى الذِّمِيِّ وَالسِّقْطِ أَيْ لا يُصَلَّى عَلَى السِّقْطِ وَلا عَلَى الذِّمِيِّ الْمَيِّتِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":501},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَنْ مَاتَ فِي قِتَالِ الْكُفَّارِ بِسَبَبِهِ كُفِّنَ فِي ثِيَابِهِ فَإِنْ لَمْ تَكْفِهِ زِيدَ عَلَيْهَا وَدُفِنَ وَلا يُغَسَّلُ وَلا يُصَلَّى عَلَيْهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":502},{"type":"p","text":"   الشَّرْحُ الشَّهِيدُ لا يَجُوزُ غَسْلُهُ وَلا الصَّلاةُ عَلَيْهِ وَهُوَ مَنْ مَاتَ مُسْلِمًا لَوْ كَانَ أُنْثَى أَوْ عَبْدًا مُسْلِمًا مَمْلُوكًا أَوْ صَبِيًّا فِي قِتَالِ الْكُفَّارِ وَلَوْ كَانَ كَافِرًا وَاحِدًا أَوْ مُرْتَدًّا بِسَبَبِ الْقِتَالِ، فَالْمُسْلِمُ الَّذِي كَانَ مَوْتُهُ بِسَبَبِ الْقِتَالِ وَلَوْ رَمَحَتْهُ دَابَّتُهُ فَقَتَلَتْهُ أَوْ قَتَلَهُ مُسْلِمٌ خَطأً فِي حَالِ الْقِتَالِ أَوْ عَادَ سِلاحُهُ إِلَيْهِ فَقَتَلَهُ أَوْ سَقَطَ مِنْ دَابَّتِهِ فَمَاتَ فَلَهُ هَذَا الْحُكْمُ، أَمَّا مَنْ مَاتَ بِسِلاحِ الْكَافِرِ وَلَمْ يَكُنْ هُوَ مُقَاتِلًا فَإِنَّهُ يُغَسَّلُ وَيُصَلَّى عَلَيْهِ كَسَائِرِ الشُّهَدَاءِ الَّذِينَ لَمْ يَكُنْ سَبَبُ مَوْتِهِمْ قِتَالَ الْكُفَّارِ كَالْمَبْطُونِ أَيِ الَّذِي مَاتَ بِمَرَضِ بَطْنِهِ كَالإِسْهَالِ وَالْقَوْلَنْجِ وَهُوَ مَرَضٌ يَحْبِسُ الرِّيحَ وَالْغَائِطَ فَإِنَّهُمْ يُغَسَّلُونَ وَيُصَلَّى عَلَيْهِمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":503},{"type":"p","text":"   وَيُسَنُّ أَنْ يُكَفَّنَ الشَّهِيدُ فِي ثِيَابِهِ الْمُلَطَّخَةِ بِالدَّمِ، وَلَوْ نُزِعَتْ مِنْهُ ثُمَّ كُفِّنَ بِغَيْرِهَا كَانَ جَائِزًا، فَإِنْ كَانَتْ ثِيَابُهُ الَّتِي هِيَ مُلَطَّخَةٌ بِالدَّمِ لا تَكْفِيهِ زِيدَ عَلَيْهَا إِلَى ثَلاثٍ وَإِنَّمَا تُرِكَ غَسْلُ الشَّهِيدِ وَالصَّلاةُ عَلَيْهِ لِأَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى طَهَّرَهُ بِالشَّهَادَةِ [وَالْمُرَادُ بِتَطْهِيرِهِ هُنَا غُفْرَانُ ذُنُوبِهِ وَإِلَّا فَالْمَيِّتُ الشَّهِيدُ وَغَيْرُ الشَّهِيدِ لا يَنْجُسُ] وَتَوَلَّاهُ بِرَحْمَتِهِ فَأَغْنَاهُ عَنْ دُعَاءِ الْمُصَلِّينَ وَلا يُسْأَلُ الشَّهِيدُ فِي قَبْرِهِ وَلِذَلِكَ لا يُلَقَّنُ بَلْ تَصْعَدُ رُوحُهُ إِلَى الْجَنَّةِ فَيَعِيشُ فِيهَا إِلَى أَنْ يُبْعَثَ أَهْلُ الْقُبُورِ مِنْ قُبُورِهِمْ فَتُرَدُّ رُوحُهُ إِلَى جِسْمِهِ رَدًّا تَامًّا فَيَخْرُجُ مِنْ قَبْرِهِ ثُمَّ يَتَبَوَّأُ مَنْزِلَهُ فِي الْجَنَّةِ بِجَسَدِهِ وَرُوحِهِ وَلا يَأْكُلُ التُّرَابُ جَسَدَهُ لِأَنَّ أَثَرَ الْحَيَاةِ مُتَّصِلٌ بِهِ كَالشَّمْسِ تَكُونُ بَعِيدَةً عَنِ الأَرْضِ وَيَتَّصِلُ أَثَرُهَا بِالأَرْضِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":504},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَقَلُّ الْغُسْلِ إِزَالَةُ النَّجَاسَةِ وَتَعْمِيمُ جَمِيعِ بَشَرِهِ وَشَعَرِهِ وَإِنْ كَثُفَ مَرَّةً بِالْمَاءِ الْمُطَهِّرِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":505},{"type":"p","text":"   الشَّرْحُ أَنَّ الْوَاجِبَ فِي غَسْلِ الْمَيِّتِ تَعْمِيمُ جَسَدِهِ شَعَرِهِ وَبَشَرِهِ بِالْمَاءِ الْمُطَهِّرِ مَرَّةً وَاحِدَةً وَمَا زَادَ عَلَى الْغَسْلَةِ الْوَاحِدَةِ فَهُوَ سُنَّةٌ وَالأَفْضَلُ تَثْلِيثُ غَسْلِهِ. وَالْمَاءُ الْمُطَهِّرُ هُوَ الَّذِي لَمْ يَتَنَجَّسْ وَلا صَارَ مُسْتَعْمَلًا وَلا تَغَيَّرَ بِمُخَالِطٍ طَاهِرٍ تَغَيُّرًا كَثِيرًا. وَلا يَجِبُ لِهَذَا الْغُسْلِ نِيَّةٌ بَلْ تُسَنُّ وَلِذَلِكَ لَوْ غَسَلَهُ كَافِرٌ أَجْزَأَ وَيُسَنُ أَنْ يَغُضَ الْغَاسِلُ بَصَرَهُ عَنْ غَيْرِ عَوْرَتِهِ وَأَمَّا عَنْ عَوْرَتِهِ فَوَاجِبٌ أَنْ يَغُضَ بَصَرَهُ. وَيَغْسِلُ عَوْرَتَهُ بِخِرْقَةٍ وَنَحْوِهَا مِمَّا يَمْنَعُ الْمَسَّ وُجُوبًا إِنِ احْتَاجَ لِلدَّلْكِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":506},{"type":"p","text":"   وَالأَوْلَى بِغَسْلِ الذَّكَرِ الذُّكُورُ فَلَوْ غَسَلَتْهُ زَوْجَتُهُ جَازَ لَكِنَّ الذَّكَرَ يُقَدَّمُ عَلَيْهَا وَكَذَلِكَ لَوْ غَسَلَ الزَّوْجُ زَوْجَتَهُ. وَالأَوْلَى بِالْمَرْأَةِ النِّسَاءُ فَإِنْ لَمْ يَحْضُرْهَا إِلَّا أَجْنَبِيٌّ وَجَبَ أَنْ تُيَمَّمَ أَيْ بِحَائِلٍ وَكَذَلِكَ الرَّجُلُ إِذَا لَمْ يَحْضُرْهُ إِلَّا النِّسَاءُ الأَجْنَبِيَاتُ وَجَبَ أَنْ يُيَمَّمَ فَإِذَا خُشِيَ عَلَى الْمَيِّتِ أَنْ يَتَهَرَّى جِسْمُهُ إِنْ غُسِلَ لِكَوْنِهِ احْتَرَقَ أَوْ لِكَوْنِهِ مَسْمُومًا سَقَطَ غَسْلُهُ وَيُيَمَّمُ عِنْدَئِذٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":507},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَقَلُّ الْكَفَنِ سَاتِرُ جَمِيعِ الْبَدَنِ وَثَلاثُ لَفَائِفَ لِمَنْ تَرَكَ تَرِكَةً زَائِدَةً عَلَى دَيْنِهِ وَلَمْ يُوصِ بِتَرْكِهَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":508},{"type":"p","text":"   الشَّرْحُ أَقَلُّ الْكَفَنِ أَيْ أَقَلُّ وَاجِبٍ فِي تَكْفِينِ الْمَيِّتِ مَا يَسْتُرُ جَمِيعَ بَدَنِهِ، لَكِنْ يُسْتَثْنَى رَأْسُ مُحْرِمٍ بِحَجٍّ أَوْ عُمْرَةٍ مَاتَ قَبْلَ التَّحَلُّلِ مِنَ الإِحْرَامِ فَإِنَّهُ يَحْرُمُ سَتْرُ رَأْسِهِ بَلْ يُتْرَكُ مَكْشُوفًا حَتَّى يُبْعَثَ يَوْمَ الْقِيَامَةِ بِصِفَتِهِ الَّتِي مَاتَ عَلَيْهَا لِأَنَّ مَنْ مَاتَ مُحْرِمًا بِحَجٍّ أَوْ عُمْرَةٍ يُحْشَرُ مِنْ قَبْرِهِ يَوْمَ الْقِيَامَةِ بِهَيْئَةِ الإِحْرَامِ مُلَبِّيًا أَيْ قَائِلًا لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، وَكَذَلِكَ وَجْهُ الْمَرْأَةِ الْمُحْرِمَةِ أَيْ أَنَّ الْمَرْأَةَ إِذَا مَاتَتْ فِي إِحْرَامِ الْحَجِّ أَوِ الْعُمْرَةِ قَبْلَ أَنْ تَتَحَلَّلَ مِنَ الإِحْرَامِ يَحْرُمُ أَنْ يُغَطَّى وَجْهُهَا بِالْكَفَنِ بَلْ يُتْرَكُ مَكْشُوفًا. وَتَكُونُ تِلْكَ الثِّيَابُ مِنَ الثِّيَابِ الَّتِي تَحِلُّ لَهُ حَيًّا وَتَلِيقُ بِهِ، وَلا يَجِبُ تَكْفِينُهُ بِالْجَدِيدِ بَلْ يَكْفِي اللَّبِيسُ وَهُوَ الثَّوْبُ الَّذِي اسْتُعْمِلَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":509},{"type":"p","text":"   وَالتَّكْفِينُ بِالثَّلاثِ وَاجِبٌ لِمَنْ يُكَفَّنُ مِنْ مَالِهِ وَلا دَيْنَ عَلَيْهِ مُسْتَغْرِقٌ بِأَنْ تَرَكَ تَرِكَةً زَائِدَةً عَلَى دَيْنِهِ أَوْ لَمْ يَكُنْ عَلَيْهِ دَيْنٌ أَصْلًا وَلَوْ لَمْ يَمْلِكْ سِوَى هَذِهِ الثَّلاثَةَ. قَالَ بَعْضُ الْفُقَهَاءِ هَذَا إِنْ لَمْ يَكُنْ أَوْصَى بِتَرْكِ التَّكْفِينِ بِالثَّلاثِ أَمَّا إِنْ كَانَ أَوْصَى بِأَنْ يَتْرُكُوا تَكْفِينَهُ بِالثَّلاثِ فَلا تَجِبُ وَإِنَّمَا الْوَاجِبُ لَهُ حِينَئِذٍ سَاتِرُ الْبَدَنِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":510},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَقَلُّ الصَّلاةِ عَلَيْهِ أَنْ يَنْوِيَ فِعْلَ الصَّلاةِ عَلَيْهِ وَالْفَرْضَ وَيُعَيِّنَ وَيَقُولَ اللَّهُ أَكْبَرُ وَهُوَ قَائِمٌ إِنْ قَدَرَ ثُمَّ يَقْرَأَ الْفَاتِحَةَ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":511},{"type":"p","text":"   الشَّرْحُ صَلاةُ الْجِنَازَةِ لَهَا أَقَلُّ وَلَهَا أَكْمَلُ فَالأَقَلُّ هُوَ مَا يَتَأَدَّى بِهِ الْفَرْضُ الَّذِي فَرَضَهُ اللَّهُ لِلْمُسْلِمِ إِذَا مَاتَ عَلَى الْمُسْلِمِينَ، فَأَقَلُّ صَلاةِ الْجِنَازَةِ أَيِ الْقَدْرُ الضَّرُورِيُّ الَّذِي لا بُدَّ مِنْهُ بِحَيْثُ إِذَا تُرِكَ كَانَ النَّاسُ الَّذِينَ عَلِمُوا بِذَلِكَ ءَاثِمِينَ يَحْصُلُ بِالنِّيَّةِ مَعَ التَّكْبِيرِ فَيُكَبِّرُ الْمُصَلِّي أَيْ يَقُولُ اللَّهُ أَكْبَرُ وَيَنْوِي فِي قَلْبِهِ أَنْ يُصلِّيَ صَلاةَ الْجِنَازَةِ عَلَى هَذَا الْمَيِّتِ إِنْ كَانَ حَاضِرًا وَبِالتَّعْيِينِ أَيْ تَعْيِينِ أَنَّهَا صَلاةُ جِنَازَةٍ وَهُوَ فَرْضٌ لِأَنَّ نِيَّةَ مُطْلَقِ الصَّلاةِ مِنْ دُونِ أَنْ يَنْوِيَ أَنَّهَا صَلاةُ الْجِنَازَةِ لا تَكْفِي. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":512},{"type":"p","text":"   وَيُشْتَرَطُ لِصِحَّةِ هَذِهِ الصَّلاةِ الْقِيَامُ أَيْ لا بُدَّ مِنْ ذَلِكَ إِنْ قَدَرَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":513},{"type":"p","text":"   وَمِنْ لَوَازِمِ صَلاةِ الْجِنَازَةِ قِرَاءَةُ الْفَاتِحَةِ كَمَا أَنَّهَا رُكْنٌ فِي الصَّلَوَاتِ الْمَكْتُوبَاتِ، وَيُشْتَرَطُ لِصِحَّةِ قِرَاءَتِهَا فِي الْجِنَازَةِ مَا يُشْتَرَطُ لِصِحَّةِ قَرَاءَتِهَا فِي غَيْرِهَا مِنْ إِخْرَاجِ كُلِّ حَرْفٍ مِنْ مَخْرَجِهِ وَغَيْرِ ذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":514},{"type":"p","text":"   تَنْبِيهٌ. لا يُشْتَرَطُ أَنْ تَكُونَ قِرَاءَةُ الْفَاتِحَةِ عَقِبَ التَّحْريِمَةِ لَكِنَّ الأَفْضَلَ أَنْ تُقْرَأَ الْفَاتِحَةُ بَعْدَ تَكْبِيرَةِ التَّحَرُّمِ وَيَجُوزُ تَأْخِيرُهَا لِمَا بَعْدَهَا، وَلَوْ أَخَّرَهَا إِلَى مَا بَعْدَ التَّكْبِيرَةِ الرَّابِعَةِ جَازَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":515},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: ثُمَّ يَقُولَ اللَّهُ أَكْبَرُ ثُمَّ يَقُولَ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":516},{"type":"p","text":"   الشَّرْحُ تَجِبُ الصَّلاةُ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بَعْدَ التَّكْبِيرَةِ الثَّانِيَةِ وَلا يَجُوزُ تَقْدِيمُهَا وَلا تَأْخِيرُهَا. وَأَقَلُّ الصَّلاةِ عَلَى النَّبِيِّ فِي صَلاةِ الْجِنَازَةِ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":517},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: ثُمَّ يَقُولَ اللَّهُ أَكْبَرُ اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":518},{"type":"p","text":"   الشَّرْحُ الْوَاجِبُ أَنْ يُكَبِّرَ التَّكْبِيرَةَ الثَّالِثَةَ وَيَدْعُوَ بَعْدَهَا لِلْمَيِّتِ بِخُصُوصِهِ بِأَمْرٍ أُخْرَوِيٍّ وَلَوْ بِأَقَلِّ مَا يُطْلَقُ عَلَيْهِ اسْمُ الدُّعَاءِ. وَلَيْسَ الدُّعَاءُ بِالْمَغْفِرَةِ خَاصًّا بِالْبَالِغِ بَلْ يَكُونُ لِلْمَيِّتِ الطِّفْلِ وَالأَكْمَلُ الدُّعَاءُ الْمَأْثُورُ [وَهُوَ اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا وَشَاهِدِنَا وَغَائِبِنَا وَصَغِيرِنَا وَكَبِيرِنَا وَذَكَرِنَا وَأُنْثَانَا اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا فَأَحْيِهِ عَلَى الإِسْلامِ وَمَنْ تَوَفَّيْتَهُ مِنَّا فَتَوَفَّهُ عَلَى الإِيـمَانِ اهـ. هَذَا ثَبَتَ عَنِ النَّبِيّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ قَالَهُ فِي الصَّلاةِ عَلَى بَعْضِ الْمَوْتَى رَوَاهُ ابْنُ حِبَّانَ فِي صَحِيحِهِ وَالْبَيْهَقِيُّ فِي سُنَنِهِ].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":519},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: ثُمَّ يَقُولَ اللَّهُ أَكْبَرُ السَّلامُ عَلَيْكُمْ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":520},{"type":"p","text":"   الشَّرْحُ يَجِبُ بَعْدَ الدُّعَاءِ أَنْ يُكَبِّرَ تَكْبِيرًا رَابِعًا وَالسَّلامُ بَعْدَهُ كَسَلامِ الصَّلاةِ وَأَمَّا الأَكْمَلُ فَهُوَ أَنْ يَعُودَ إِلَى الدُّعَاءِ وَلَوْ أَطَالَ فِي ذَلِكَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":521},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلا بُدَّ فِيهَا مِنْ شُرُوطِ الصَّلاةِ وَتَرْكِ الْمُبْطِلاتِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":522},{"type":"p","text":"   الشَّرْحُ صَلاةُ الْجِنَازَةِ يُشْتَرَطُ فِيهَا شُرُوطُ الصَّلاةِ الْوَاجِبَةِ مِنِ اسْتِقْبَالِ الْقِبْلَةِ وَالطَّهَارَةِ عَنِ الْحَدَثَيْنِ وَعَنِ النَّجَاسَةِ الَّتِي لا يُعْفَى عَنْهَا وَغَيْرِ ذَلِكَ مِنَ الشُّرُوطِ، وَلا بُدَّ فِيهَا أَيْضًا مِنْ تَجَنُّبِ الْمُبْطِلاتِ لِلصَّلاةِ فَمَا أَبْطَلَ الصَّلاةَ أَبْطَلَهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":523},{"type":"p","text":"   وَيُنْدَبُ فِعْلُ الْمَنْدُوبَاتِ فِيهَا كَمَا يُنْدَبُ فِي الصَّلَوَاتِ الْخَمْسِ كَرَفْعِ الْيَدَيْنِ عِنْدَ التَّكْبِيرَاتِ وَالتَّعَوُّذِ قَبْلَ الْقِرَاءَةِ لَكِنْ لا يُسَنُّ فِيهَا الِافْتِتَاحُ وَلا قِرَاءَةُ السُّورَةِ بَلْ يَنْتَقِلُ مِنْ تَكْبِيرَةِ التَّحَرُّمِ إِلَى الِاسْتِعَاذَةِ ثُمَّ الْفَاتِحَة.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":524},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَقَلُّ الدَّفْنِ حُفْرَةٌ تَكْتُمُ رَائِحَتَهُ وَتَحْرُسُهُ مِنَ السِّبَاعِ وَيُسَنُّ أَنْ يُعَمَّقَ قَدْرَ قَامَةٍ وَبَسْطَةٍ وَيُوَسَّعَ وَيَجِبُ تَوْجِيهُهُ إِلَى الْقِبْلَةِ. وَلا يَجُوزُ الدَّفْنُ فِي الْفِسْقِيَّةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":525},{"type":"p","text":"   الشَّرْحُ الدَّفْنُ الَّذِي هُوَ فَرْضٌ عَلَى الْكِفَايَةِ حُفْرَةٌ تَكْتُمُ رَائِحَتَهُ بَعْدَ طَمِّهِ مِنْ أَنْ تَظْهَرَ وَتَحْرُسُهُ مِنَ السِّبَاعِ أَنْ تَنْبُشَهُ وَتَأْكُلَهُ، وَإِنْ لَمْ يَمْنَعْهُ إِلَّا الْبِنَاءُ أَوِ الصُّنْدُوقُ وَجَبَ ذَلِكَ. هَذَا أَقَلُّ الدَّفْنِ أَمَّا أَكْمَلُهُ فَهُوَ أَنْ يَكُونَ الْقَبْرُ وَاسِعًا يَسَعُ مَنْ يَنْزِلُهُ وَمُعِينَهُ وَأَنْ يَكُونَ قَدْرَ قَامَةٍ وَبَسْطَةٍ وَهِيَ أَرْبَعَةُ أَذْرُعٍ وَنِصْفٌ بِذِرَاعِ الْيَدِ وَلَوْ لِلطِّفْلِ. وَيُسَنُّ أَنْ يُلْحَدَ لَهُ لَحْدٌ إِنْ كَانَتِ الأَرْضُ صُلْبَةً وَأَنْ يُشَقَّ لَهُ شَقٌّ فِي الرِّخْوَةِ أَيِ اللَّيِنَةِ. وَيَحْرُمُ الدَّفْنُ فِي الْفَسَاقِيِّ وَالْفَسَاقِيُّ هِيَ جَمْعُ فِسْقِيَّةٍ وَالْفِسْقِيَّةُ هِيَ بِنَاءٌ تُجْمَعُ فِيهِ الْجَنَائِزُ وَقَدْ يَبْنُونَ فِيهَا طِيقَانًا وَيُوضَعُ كُلُّ مَيِّتٍ فِي طَاقٍ مِنْ هَذِهِ الطِّيقَانِ فَلَوْ أَوْصَى بِذَلِكَ لَمْ يَجُزْ تَنْفِيذُ وَصِيَّتِهِ. وَإِنَّمَا حَرُمَ الدَّفْنُ فِي الْفَسَاقِيِّ لِأَنَّ فِيهِ إِدْخَالَ مَيِّتٍ عَلَى ءَاخَرَ قَبْل بِلاهُ وَلِأَنَّهَا لا تَمْنَعُ الرَّائِحَةَ فَهِيَ إِهَانَةٌ لِلْمَيِّتِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":526},{"type":"p","text":"   وَذَكَرَ الْمُؤَلِّفُ أَنَّهُ يَجِبُ تَوْجِيهُهُ إِلَى الْقِبْلَةِ يَعْنِي أَنَّ مِنْ فَرَائِضِ الْجِنَازَةِ الَّتِي تَتْبَعُ الدَّفْنَ التَّوْجِيهَ إِلَى الْقِبْلَةِ وَذَلِكَ بِأَنْ يُضْجَعَ عَلَى جَنْبِهِ الأَيْمَنِ أَوِ الأَيْسَرِ لَكِنَّ إِضْجَاعَهُ عَلَى الأَيْسَرِ خِلافُ السُّنَّةِ فَهُوَ مَكْرُوهٌ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":527},{"type":"p","text":"   وَيُسَنُّ أَنْ يُقَالَ بَعْدَ إِتْمَامِ الدَّفْنِ «يَا عَبْدَ اللَّهِ ابْنَ أَمَةِ اللَّهِ ثَلاثَ مَرَّاتٍ اذْكُرِ الْعَهْدَ الَّذِي خَرَجْتَ عَلَيْهِ مِنَ الدُّنْيَا شَهَادَةَ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَأَنَّكَ رَضِيتَ بِاللَّهِ رَبًّا وَبِالإِسْلامِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا وَبِالْقُرْءَانِ إِمَامًا» فَإِنَّ مُنْكَرًا وَنَكِيرًا يَقُولُ أَحَدُهُمَا لِصَاحِبِهِ انْطَلِقْ بِنَا مَا يُقْعِدُنَا عِنْدَ رَجُلٍ لُقِّنَ حُجَّتَهُ اهـ رَوَاهُ الطَّبَرَانِيُّ وَحَسَّنَهُ الْحَافِظُ ابْنُ حَجَرٍ. وَأَمَّا لِلأُنْثَى فَيُقَالُ يَا أَمَةَ اللَّهِ ابْنَةَ أَمَةِ اللَّهِ. وَالتَّلْقِينُ يُسَنُّ فِي حَقِّ الْبَالِغِ وَلَوْ كَانَ شَهِيدًا أَيْ غَيْرَ شَهِيدِ الْمَعْرَكَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":528},{"type":"p","text":"   تَنْبِيهٌ. مِنَ الْهَيْئَاتِ الْمُزْرِيَةِ بِالْمَيِّتِ الَّتِي لا تَجُوزُ أَنْ يُكَبَّ الْمَيِّتُ عَلَى وَجْهِهِ عِنْدَ الْغَسْل فَذَلِكَ حَرَامٌ، وَكَذَلِكَ خِتَانُهُ إِنْ كَانَ غَيْرَ مَخْتُونٍ، وَمِنْ ذَلِكَ حَمْلُهُ عَلَى الأَكْتَافِ مِنْ غَيْرِ نَعْشٍ وَنَحْوِهِ إِلَّا أَنَّهُ يَجُوزُ حَمْلُ الطِّفْلِ الصَّغِيرِ عَلَى الْيَدِ عِنْدَ الذَّهَابِ بِهِ إِلَى الدَّفْنِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":529},{"type":"blank","text":""}]},{"id":"zakat","title":"كِتَابُ الزَّكَاةِ","description":"النص الكامل المتعلق بأحكام الزكاة وشروطها ومسائلها.","icon":"fa-hand-holding-dollar","start":531,"end":619,"paragraphCount":86,"wordCount":3891,"readMinutes":22,"blocks":[{"type":"heading","text":"كِتَابُ الزَّكَاةِ","style":"Normal","align":"center","bold":false,"size":18.0,"index":531},{"type":"p","text":" ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":532},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ وَتَجِبُ الزَّكَاةُ فِي الإِبِلِ وَالْبَقَرِ وَالْغَنَمِ وَالتَّمْرِ وَالزَّبِيبِ وَالزُّرُوعِ الْمُقْتَاتَةِ حَالَةَ الِاخْتِيَارِ وَالذَّهَبِ وَالْفِضَّةِ وَالْمَعْدِنِ وَالرِّكَازِ مِنْهُمَا وَأَمْوَالِ التِّجَارَةِ وَالْفِطْرِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":533},{"type":"p","text":"   الشَّرْحُ الزَّكَاةُ لُغَةً التَّطْهِيرُ وَالإِصْلاحُ، وَشَرْعًا اسْمٌ لِمَا يُخْرَجُ عَنْ مَالٍ أَوْ بَدَنٍ عَلَى وَجْهٍ مَخْصُوصٍ. وَهِيَ أَحَدُ الأُمُورِ الَّتِي هِيَ أَعْظَمُ أُمُورِ الإِسْلامِ، قَالَ اللَّهُ تَعَالَى ﴿وَأَقِيمُوا الصَّلاةَ وَءَاتُوا الزَّكَاةَ﴾ وَقَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي حَدِيثِ جِبْرِيلَ «الإِسْلامُ أَنْ تَشْهَدَ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَتُقِيمَ الصَّلاةَ وَتُؤْتِيَ الزَّكَاةَ» الْحَدِيثَ رَوَاهُ الْبُخَارِيُّ وَمُسْلِمٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":534},{"type":"p","text":"   وَمَنْعُ الزَّكَاةِ مِنَ الْكَبَائِرِ قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «ءَاكِلُ الرِّبَا وَمُوكِلُهُ وَلاوِي الصَّدَقَةِ مَلْعُونُونَ عَلَى لِسَانِ مُحَمَّدٍ يَوْمَ الْقِيَامَةِ» رَوَاهُ ابْنُ حِبَّانَ. وَمَنْ مَنَعَهَا وَهُوَ مُعْتَقِدٌ وُجُوبَهَا لا يُكَفَّرُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":535},{"type":"p","text":"   ثُمَّ إِنَّ وُجُوبَهَا خَاصٌّ بِالأَشْيَاءِ الْمَذْكُورَةِ هُنَا وَهِيَ الإِبِلُ وَالْبَقَرُ وَالْغَنَمُ فَلَيْسَ فِي غَيْرِهَا مِنَ الْحَيَوَانَاتِ زَكَاةٌ مِنْ حَيْثُ الْعَيْنُ وَثَمَرُ النَّخْلِ وَالْعِنَبِ وَالزُّرُوعُ الَّتِي يَتَّخِذُهَا النَّاسُ قُوتًا فِي حَالِ الِاخْتِيَارِ كَالْحِنْطَةِ وَالشَّعِيرِ وَالْحِمَّصِ وَالْفُولِ بِخِلافِ التِّينِ وَاللَّوْزِ وَالسِّمْسِمِ وَالتُّفَّاحِ وَنَحْوِهَا فَإِنَّهُ لا يُقْتَاتُ بِهَا، وَلا تَجِبُ فِيمَا لا يُقْتَاتُ إِلَّا فِي حَالِ الضَّرُورَةِ كَالْحُلْبَةِ فَهَذِهِ لا زَكَاةَ فِيهَا لِأَنَّهَا لا تُتَّخَذُ قُوتًا حَالَةَ الِاخْتِيَارِ. وَالْقُوتُ مَا يَقُومُ بِهِ الْبَدَنُ أَيْ مَا يَعِيشُ بِهِ الْبَدَنُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":536},{"type":"p","text":"   وَتَجِبُ فِي النَّقْدِ أَيِ الذَّهَبِ وَالْفِضَّةِ الْمَضْرُوبِ مِنْ ذَلِكَ وَغَيْرِهِ وَأَمَّا غَيْرُ الذَّهَبِ وَالْفِضَّةِ مِنَ الأَثْمَانِ فَلا زَكَاةَ فِيهِ عِنْدَ الإِمَامِ الشَّافِعِيِّ وَالإِمَامِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُمَا وَتَجِبُ فِيهِ عِ

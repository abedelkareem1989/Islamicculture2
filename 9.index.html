ُ ذَلِكَ فَمَنْ دَفَنَهُ فِي مَقَابِرِ الْمُسْلِمِينَ أَثِمَ. وَمِنْهَا أَنَّ مَالَهُ فَىْءٌ أَيْ أَنَّ مَالَ الْمُرْتَدِّ بَعْدَ مَوْتِهِ بِقَتْلٍ أَوْ غَيْرِهِ فَىْءٌ يَكُونُ لِمَصَالِحِ الْمُسْلِمِينَ أَيْ لِبَيْتِ الْمَالِ إِنْ كَانَ بَيْتُ مَالٍ مُسْتَقِيمٌ قَالَ الْفُقَهَاءُ أَمَّا إِنْ لَمْ يَكُنْ بَيْتُ مَالٍ لِلْمُسْلِمِينَ مُسْتَقِيمٌ فَيَتَوَلَّى رَجُلٌ صَالِحٌ صَرْفَهُ فِي مَصَالِحِ الْمُسْلِمِينَ. وَتَثْبُتُ الرِّدَّةُ إِمَّا بِالِاعْتِرَافِ أَوْ بِالْبَيِّنَةِ أَيْ شَهَادَةِ رَجُلَيْنِ عَدْلَيْنِ أَمَّا إِذَا شَهِدَ وَاحِدٌ فَقَطْ فَلا تُجْرَى عَلَيْهِ أَحْكَامُ الْمُرْتَدِّ كَمَا تَقَدَّمَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":227},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":228},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَنَّهُ يَجِبُ عَلَى كُلِّ مُكَلَّفٍ الْتِزَامُ أَوَامِرِ اللَّهِ تَعَالَى وَأَنَّهُ يَدْخُلُ فِيمَا أَوْجَبَهُ اللَّهُ الأَمْرُ بِالْمَعْرُوفِ وَالنَّهْيُ عَنِ الْمُنْكَرِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":229},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ عَلَى كُلِّ مُكَلَّفٍ أَدَاءُ جَمِيعِ مَا أَوْجَبَهُ اللَّهُ عَلَيْهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":230},{"type":"p","text":"   الشَّرْحُ قَالَ الْعُلَمَاءُ الصَّبِيُّ إِذَا بَلَغَ وَجَبَ عَلَيْهِ أَنْ يَنْوِيَ أَدَاءَ مَا أَوْجَبَ اللَّهُ عَلَيْهِ مِنْ تَرْكِ الْمَعَاصِي وَأَدَاءِ الْفَرَائِضِ أَيْ أَوَّلَ مَا يَبْلُغُ يَنْوِي فِي قَلْبِهِ يَقُولُ أَعْمَلُ مَا فَرَضَهُ اللَّهُ عَلَيَّ فَأُؤَدِّي الْوَاجِبَاتِ وَأَجْتَنِبُ الْمُحَرَّمَاتِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":231},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَيْهِ أَنْ يُؤَدِّيَهُ عَلَى مَا أَمَرَهُ اللَّهُ بِهِ مِنَ الإِتْيَانِ بِأَرْكَانِهِ وَشُرُوطِهِ وَيَجْتَنِبَ مُبْطِلاتِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":232},{"type":"p","text":"   الشَّرْحُ يَجِبُ أَدَاءُ الْفَرَائِضِ الَّتِي فَرَضَهَا اللَّهُ عَلَى عِبَادِهِ مِنْ صَلاةٍ وَصِيَامٍ وَزَكَاةٍ وَحَجٍّ وَغَيْرِ ذَلِكَ عَلَى الْوَجْهِ الَّذِي أَمَرَ اللَّهُ بِهِ أَنْ تُفْعَلَ هَذِهِ الْفَرَائِضُ مِنْ تَطْبِيقِ الأَرْكَانِ وَالشُّرُوطِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":233},{"type":"p","text":"وَقَوْلُهُ «وَيَجْتَنِبَ مُبْطِلاتِهِ» يُفْهَمُ مِنْهُ أَنَّهُ يَجِبُ عَلَى الْمَرْءِ أَنْ يَعْرِفَ مَا يُبْطِلُ هَذِهِ الْفَرَائِضَ حَتَّى يَجْتَنِبَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":234},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَيْهِ أَمْرُ مَنْ رَءَاهُ تَارِكَ شَىْءٍ مِنْهَا أَوْ يَأْتِي بِهَا عَلَى غَيْرِ وَجْهِهَا بِالإِتْيَانِ بِهَا عَلَى وَجْهِهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":235},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى الشَّخْصِ الْمُكَلَّفِ أَنْ يَأْمُرَ مَنْ رَءَاهُ تَارِكَ شَىْءٍ مِنْ فَرَائِضِ اللَّهِ بِأَدَائِهَا وَيَأْمُرَ مَنْ رَءَاهُ يَأْتِي بِشَىْءٍ مِنْ هَذِهِ الْفَرَائِضِ عَلَى غَيْرِ وَجْهِهَا أَيْ غَيْرِ الْوَجْهِ الَّذِي تَصِحُّ بِهِ أَنْ يَأْتِيَ بِهَا عَلَى الْوَجْهِ الَّذِي تَصِحُّ بِهِ هَذَا إِنْ كَانَ يُخِلُّ بِفَرْضٍ أَوْ يَأْتِي بِمُبْطِلٍ مُجْمَعٍ عَلَيْهِ عِنْدَ الأَئِمَّةِ أَمَّا مَنْ رَءَاهُ يُخِلُّ بِمُخْتَلَفٍ فِيهِ فَلا يُنْكِرُ عَلَيْهِ إِلَّا أَنْ يَعْلَمَ أَنَّهُ يَعْتَقِدُهُ فَرْضًا أَوْ مُبْطِلًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":236},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَيْهِ قَهْرُهُ عَلَى ذَلِكَ إِنْ قَدَرَ عَلَيْهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":237},{"type":"p","text":"   الشَّرْحُ مَنْ عَلِمَ أَنَّ إِنْسَانًا لا يُؤَدِّي هَذِهِ الْفَرَائِضَ صَحِيحَةً أَوْ يَتْرُكُهَا بِالْمَرَّةٍ وَكَانَ لا يَمْتَثِلُ إِلَّا بِالْقَهْرِ يَجِبُ أَنْ يَقْهَرَهُ عَلَى ذَلِكَ أَيْ أَنْ يُرْغِمَهُ إِنِ اسْتَطَاع. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":238},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَإِلَّا وَجَبَ عَلَيْهِ الإِنْكَارُ بِقَلْبِهِ إِنْ عَجَزَ عَنِ الْقَهْرِ وَالأَمْرِ وَذَلِكَ أَضْعَفُ الإِيمَانِ أَيْ أَقَلُّ مَا يَلْزَمُ الإِنْسَانَ عِنْدَ الْعَجْزِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":239},{"type":"p","text":"   الشَّرْحُ أَنَّ الَّذِي لا يَسْتَطِيعُ أَنْ يَقْهَرَ أَوْ أَنْ يَأْمُرَ الشَّخْصَ الَّذِي يَتْرُكُ بَعْضَ الْفَرَائِضِ أَوْ يَأْتِي بِهَا عَلَى غَيْرِ وَجْهِهَا بِأَنْ عَلِمَ أَنَّهُ يُصَلِّي صَلاةً فَاسِدَةً أَوْ يَصُومُ صِيَامًا فَاسِدًا أَوْ يَحُجُّ حَجًّا فَاسِدًا وَجَبَ عَلَيْهِ الإِنْكَارُ بِالْقَلْبِ أَيِ الْكَرَاهِيَةُ لِفِعْلِ هَذَا الإِنْسَانِ الْمُخَالِفِ لِلشَّرْعِ بِقَلْبِهِ فَإِنْ أَنْكَرَ بِقَلْبِهِ سَلِمَ مِنَ الْمَعْصِيَةِ وَهَذَا أَضْعَفُ الإِيمَانِ أَيْ أَقَلُّهُ ثَمَرَةً. وَالْمُرَادُ بِالرُّؤْيَةِ فِي حَدِيثِ «مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِرْهُ بِيَدِهِ» إِلَى ءَاخِرِه الْعِلْمُ بِوُجُودِ الْمُنْكَرِ لا خُصُوصُ الرُّؤْيَةِ بِالْبَصَرِ. أَمَّا إِنْ كَانَ يَسْتَطِيعُ الإِنْكَارَ بِالْيَدِ أَوِ الْقَوْلِ فَلا يَكْفِيهِ الإِنْكَارُ بِالْقَلْبِ فَهَذِهِ الْكَرَاهِيَةُ لا تُخَلِّصُهُ مِنْ مَعْصِيَةِ اللَّهِ وَالسَّالِمُ مَنْ أَنْكَرَ إِنِ اسْتَطَاعَ بِيَدِهِ فَإِنْ عَجَزَ فَبِلِسَانِهِ فَإِنْ عَجَزَ فَبِقَلْبِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":240},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ تَرْكُ جَمِيعِ الْمُحَرَّمَاتِ وَنَهيُ مُرْتَكِبِهَا وَمَنْعُهُ قَهْرًا مِنْهَا إِنْ قَدَرَ عَلَيْهِ وَإِلَّا وَجَبَ عَلَيْهِ أَنْ يُنْكِرَ ذَلِكَ بِقَلْبِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":241},{"type":"p","text":"   الشَّرْحُ أَنَّ ذَلِكَ فِيمَا إِذَا كَانَتِ الْمُنْكَرَاتُ نَحْوَ ءَالاتِ الطَّرَبِ الْمُحَرَّمَةِ وَالصُّوَرِ الْمُجَسَّمَةِ فَبِتَكْسِيرِهَا لِمَنِ اسْتَطَاعَ وَإِنْ كَانَتْ خُمُورًا فَبِإِرَاقَتِهَا وَكُلُّ ذَلِكَ يُشْتَرَطُ فِيهِ أَنْ لا يُؤَدِّيَ فِعْلُهُ إِلَى مُنْكَرٍ أَعْظَمَ مِنْ ذَلِكَ الْمُنْكَرِ وَإِلَّا فَلا يَجُوزُ لِأَنَّهُ يَكُونُ عُدُولًا عَنِ الْفَسَادِ إِلَى الأَفْسَدِ وَهَذَا مَعْنَى قَوْلِهِ «وَإِلَّا وَجَبَ عَلَيْهِ أَنْ يُنْكِرَ ذَلِكَ بِقَلْبِهِ».","style":"Normal","align":"justify","bold":true,"size":18.0,"index":242},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْحَرَامُ مَا تَوَعَّدَ اللَّهُ مُرْتِكِبَهُ بِالْعِقَابِ وَوَعَدَ تَارِكَهُ بِالثَّوَابِ وَعَكْسُهُ الْوَاجِبُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":243},{"type":"p","text":"   الشَّرْحُ هَذَا تَفْسِيرٌ لِلْحَرَامِ وَالْوَاجِبِ أَيْ أَنَّ الْحَرَامَ الَّذِي فَرَضَ اللَّهُ عَلَى عِبَادِهِ أَنْ يَجْتَنِبُوهُ مَعْنَاهُ مَا فِي ارْتِكَابِهِ عِقَابٌ فِي الآخِرَةِ وَفِي تَرْكِهِ ثَوَابٌ، وَالْوَاجِبُ بِمَعْنَى الْفَرْضِ مَا فِي فِعْلِهِ ثَوَابٌ وَفِي تَرْكِهِ عِقَابٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":244},{"type":"blank","text":""}]},{"id":"purification-prayer","title":"الطَّهَارَةُ وَالصَّلاةُ","description":"أحكام الطهارة والوضوء والغسل والتيمم والصلاة والجماعة والجمعة.","icon":"fa-mosque","start":246,"end":531,"paragraphCount":284,"wordCount":13866,"readMinutes":78,"blocks":[{"type":"heading","text":"الطَّهَارَةُ وَالصَّلاةُ","style":"Body Text","align":"center","bold":true,"size":18.0,"index":246},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":247},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ الصَّلَوَاتِ الْوَاجِبَةِ وَمَوَاقِيتِهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":248},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَمِنَ الْوَاجِبِ خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ وَاللَّيْلَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":249},{"type":"p","text":"   الشَّرْحُ أَنَّهُ لا صَلاةَ وَاجِبَةٌ غَيْرُ هَؤُلاءِ الْخَمْسِ فَيُفْهَمُ مِنْ ذَلِكَ أَنَّ الْوِتْرَ غَيْرُ وَاجِبَةٍ وَأَنَّ مَنْ تَرَكَ نَوَافِلَ الصَّلَوَاتِ كَسُنَّةِ الظُّهْرِ وَسُنَّةِ الْعَصْرِ وَغَيْرِهِمَا فَلا إِثْمَ عَلَيْهِ وَهُوَ كَذَلِكَ. وَأَمَّا حَدِيثُ الْبُخَارِيِّ «مَنْ رَغِبَ عَنْ سُنَّتِي فَلَيْسَ مِنِّي» فَمَعْنَاهُ مَنْ تَرَكَ شَرِيعَتِي وَهُوَ كَارِهٌ طَرِيقَتِي الَّتِي جِئْتُ بِهَا فَهُوَ كَافِرٌ. وَيَدُلُّ عَلَى أَنَّهُ لا صَلاةَ وَاجِبَةٌ غَيْرُ هَؤُلاءِ الْخَمْسِ وَأَنَّهُ لا مُؤَاخَذَةَ عَلَى الشَّخْصِ بِتَرْكِ النَّوَافِلِ الْحَدِيثُ الْمَرْفُوعُ حَدِيثُ طَلْحَةَ بنِ عُبَيْدِ اللَّهِ أَنَّ رَجُلًا ثَائِرَ(الرَّأْسِ جَاءَ إِلَى النَّبِيِّ فَقَالَ يَا رَسُولَ اللَّهِ أَخْبِرْنِي بِمَا افْتَرَضَ اللَّهُ عَلَيَّ مِنَ الصَّلاةِ فَقَالَ «خَمْسُ صَلَوَاتٍ» ثُمَّ قَالَ أَخْبِرْنِي بِمَا افْتَرَضَ اللَّهُ عَلَيَّ مِنَ الصِّيَامِ ثُمَّ قَالَ أَخْبِرْنِي بِمَا افْتَرَضَ اللَّهُ عَلَيَّ مِنَ الزَّكَاةِ فَعَلَّمَهُ شَرَائِعَ الإِسْلامِ فَوَلَّى الرَّجُلُ وَهُوَ يَقُولُ وَالَّذِي أَكْرَمَكَ بِالنُّبُوَّةِ لا أَتَطَوَّعُ شَيْئًا وَلا أَنْقُصُ مِمَّا افْتَرَضَ اللَّهُ عَلَيَّ شَيْئًا فَقَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «أَفْلَحَ الرَّجُلُ إِنْ صَدَقَ» رَوَاهُ الْبُخَارِيُّ فِي كِتَابِ الصِّيَامِ فَقَوْلُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «أَفْلَحَ الرَّجُلُ إِنْ صَدَقَ» أَيْ فِيمَا حَلَفَ عَلَيْهِ وَهُوَ أَنَّهُ لا يَفْعَلُ شَيْئًا مِنَ النَّوَافِلِ وَلا يَتْرُكُ شَيْئًا مِمَّا افْتَرَضَ اللَّهُ عَلَيْهِ مِنْ أَدَاءِ الْوَاجِبِ وَاجْتِنَابِ الْمُحَرَّمِ لِأَنَّهُ كَانَ عَلَّمَهُ مَا هُوَ فَرْضٌ وَمَا هُوَ حَرَامٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":250},{"type":"p","text":"   وَإِذَا عُلِمَ هَذَا ظَهَرَ بُطْلانُ مَا شَاعَ عِنْدَ بَعْضِ الْعَوَامِّ مِنْ قَوْلِ بَعْضِهِمْ إِنَّ الرَّسُولَ قَالَ مَنْ لَمْ يُصلِّ سُنَّتِي فَلَيْسَ مِنْ أُمَّتِي وَقَوْلِ بَعْضِهِمْ إِنَّهُ قَالَ مَنْ لَمْ يُصَلِّ سُنَّتِي يَأْتِي يَوْمَ الْقِيَامَةِ وَلَيْسَ عَلَى وَجْهِهِ قِطْعَةُ لَحْمٍ وَقَوْلِ بَعْضِهِمْ إِنَّهُ قَالَ مَنْ لَمْ يُصَلِّ سُنَّتِي لَمْ تَنَلْهُ شَفَاعَتِي يُرِيدُونَ بِهِ النَّوَافِلَ فَكُلُّ ذَلِكَ كَذِبٌ عَلَى الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَضَلالٌ وَلا يَنْفَعُهُمْ قَصْدُهُمْ بِذَلِكَ حَثَّ النَّاسِ عَلَى النَّوَافِلِ [وَقَدْ قَالَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِيمَا رَوَاهُ الْبُخَارِيُّ «إِنَّ كَذِبًا عَلَيَّ لَيْسَ كَكَذِبٍ عَلَى أَحَدٍ مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ»].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":251},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الظُّهْرُ وَوَقْتُهَا إِذَا زَالَتِ الشَّمْسُ إِلَى مَصِيرِ ظِلِّ كُلِّ شَىْءٍ مِثْلَهُ غَيْرَ ظِلِّ الِاسْتِوَاءِ وَالْعَصْرُ وَوَقْتُهَا مِنْ بَعْدِ وَقْتِ الظُّهْرِ إِلَى مَغِيبِ الشَّمْسِ وَالْمَغْرِبُ وَوَقْتُهَا مِنْ بَعْدِ مَغِيبِ الشَّمْسِ إِلَى مَغِيبِ الشَّفَقِ الأَحْمَرِ وَالْعِشَاءُ وَوَقْتُهَا مِنْ بَعْدِ وَقْتِ الْمَغْرِبِ إِلَى طُلُوعِ الْفَجْرِ الصَّادِقِ وَالصُّبْحُ وَوَقْتُهَا مِنْ بَعْدِ وَقْتِ الْعِشَاءِ إِلَى طُلُوعِ الشَّمْسِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":252},{"type":"p","text":"   الشَّرْحُ تَجِبُ مَعْرِفَةُ أَوْقَاتِ هَذِهِ الصَّلَوَاتِ الْخَمْسِ وَسَائِرِ مَا يَتَعَلَّقُ بِهَا مِنْ أَحْكَامِهَا الضَّرُورِيَّةِ. وَقَدْ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّ خِيَارَ عِبَادِ اللَّهِ الَّذِينَ يُرَاعُونَ الشَّمْسَ وَالقَمَرَ وَالأَظِلَّةَ لِذِكْرِ اللَّهِ» أَيْ لِلصَّلاةِ حَسَّنَهُ الْحَافِظُ ابْنُ حَجَرٍ فِي الأَمَالِي وَفِي رِوَايَةٍ أُخْرَى أَخْرَجَهَا الْحَاكِمُ فِي الْمُسْتَدْرَكِ زِيَادَةُ ذِكْرِ «النُّجُومِ» وَلَمْ يَكُنْ فِي أَيَّامِ الصَّحَابَةِ هَذِهِ الآلاتُ الْمَوْضُوعَةُ لِمَعْرِفَةِ الْوَقْتِ بَلْ كَانُوا يَعْرِفُونَهُ بِالْمُرَاقَبَةِ الْعِيَانِيَّةِ. وَمَعْرِفَةُ الْمَوَاقِيتِ الأَصْلِيَّةِ الَّتِي عَلَّمَهَا الرَّسُولُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الصَّحَابَةَ فَرْضُ عَيْنٍ عَلَى الْمُكَلَّفِ وَلا يَجُوزُ تَرْكُ تَعَلُّمِهَا اعْتِمَادًا عَلَى مَا عَمِلَهُ النَّاسُ مِنْ تَعْيِينِ مَوَاقِيتَ لِلْمُدُنِ كَالْقَاهِرَةِ وَدِمْشَقَّ وَحَلَبَ وَنَحْوِ ذَلِكَ لِأَنَّ دُخُولَ الأَوْقَاتِ يَخْتَلِفُ بِاخْتِلافِ الْبُلْدَانِ. فَالظُّهْرُ أَوَّلُ وَقْتِهَا زَوَالُ الشَّمْسِ أَيْ مَيْلُهَا عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ وَانْتِهَاءُ وَقْتِهَا أَنْ يَصِيرَ ظِلُّ كُلِّ شَىْءٍ مِثْلَهُ زَائِدًا عَلَى ظِلِّ الِاسْتِوَاءِ فَإِذَا صَارَ الظِّلُّ الْجَدِيدُ بَعْدَ طَرْحِ ظِلِّ الِاسْتِوَاءِ مِثْلَ الشَّىْءِ انْتَهَى وَقْتُ الظُّهْرِ وَدَخَلَ وَقْتُ الْعَصْرِ. وَظِلُّ الِاسْتِوَاءِ هُوَ الظِّلُّ الَّذِي يَكُونُ حِينَ تَكُونُ الشَّمْسُ فِي وَسَطِ السَّمَاءِ. وَوَسَطُ السَّمَاءِ يُعْرَفُ عَلَى حَسَبِ تَحْدِيدِ الْجِهَاتِ بِالنَّجْمِ أَوْ بِالْبُوصِلَةِ الْمُجَرَّبَةِ أَوْ نَحْوِهِمَا. نَجْمُ الْقُطْبِ مُهِمٌّ لِمَعْرِفَةِ الْجِهَاتِ الأَرْبَعِ لِأَنَّهُ يَلْزَمُ جِهَةَ الشَّمَالِ، يُضْبَطُ مَوْضِعُهُ فِي اللَّيْلِ وَتُغْرَزُ خَشَبَةٌ عَلَى اتِّجَاهِهِ ثُمَّ فِي النَّهَارِ يُنْظَرُ إِلَى الظِّلِّ عَلَى حَسَبِهِ. وَأَمَّا وَقْتُ الْمَغْرِبِ فَيَدْخُلُ بِمَغِيبِ قُرْصِ الشَّمْسِ كُلِّهِ وَيَنْتَهِي بِمَغِيبِ الشَّفَقِ الأَحْمَرِ وَالشَّفَقُ الأَحْمَرُ هُوَ الْحُمْرَةُ الَّتِي تَظْهَرُ بَعْدَ مَغِيبِ الشَّمْسِ فِي جِهَةِ الْغُرُوبِ. وَأَمَّا الْعِشَاءُ فَوَقْتُهَا مِنْ بَعْدِ وَقْتِ الْمَغْرِبِ أَيْ بَعْدَ مَغِيبِ الشَّفَقِ الأَحْمَرِ كُلِّهِ إِلَى طُلُوعِ الْفَجْرِ الصَّادِقِ. وَأَمَّا الصُّبْحُ فَوَقْتُهَا مِنْ بَعْدِ وَقْتِ الْعِشَاءِ أَيْ مِنْ طُلُوعِ الْفَجْرِ الصَّادِقِ إِلَى طُلُوعِ الشَّمْسِ. وَالْفَجْرُ الصَّادِقُ هُوَ الْبَيَاضُ الْمُعْتَرِضُ فِي الأُفُقِ الشَّرْقِيِّ الَّذِي يَبْدُو دَقِيقًا ثُمَّ يَنْتَشِرُ وَيَتَوَسَّعُ. وَيَسْبِقُ الْفَجْرَ الصَّادِقَ الْفَجْرُ الْكَاذِبُ وَهُوَ بَيَاضٌ عَمُودِيٌّ يَظْهَرُ فِي جِهَةِ الأُفُقِ الشَّرْقِيِّ وَهُوَ لا يَدُلُّ عَلَى دُخُولِ وَقْتِ الصُّبْحِ وَإِنَّمَا يَدُلُّ عَلَى اقْتِرَابِ دُخُولِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":253},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَتَجِبُ هَذِهِ الْفُرُوضُ فِي أَوْقَاتِهَا عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ طَاهِرٍ أَيْ غَيْرِ الْحَائِضِ وَالنُّفَسَاءِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":254},{"type":"p","text":"   الشَّرْحُ أَنَّ مَعْرِفَةَ هَذِهِ الأَوْقَاتِ وَإِيقَاعَ الصَّلاةِ فِيهَا لا قَبْلَهَا وَلا بَعْدَهَا فَرْضٌ فَيَجِبُ أَدَاءُ كُلٍّ مِنَ الْخَمْسِ فِي وَقْتِهَا وَلا يَجُوزُ تَقْديِمُهَا عَلَى وَقْتِهَا أَيْ فِعْلُهَا قَبْلَ دُخُولِ وَقْتِهَا وَلا تَأْخِيرُهَا عَنْ وَقْتِهَا بِلا عُذْرٍ لِأَنَّ اللَّهَ تَعَالَى قَالَ ﴿فَوَيْلٌ لِّلْمُصَلِّينَ الَّذِينَ هُمْ عَنْ صَلاتِهِمْ سَاهُونَ﴾ [سُورَةَ الْمَاعُون] وَالْمُرَادُ بِالسَّهْوِ عَنِ الصَّلاةِ فِي هَذِهِ الآيَةِ تَأْخِيرُ الصَّلاةِ عَنْ وَقْتِهَا حَتَّى يَدْخُلَ وَقْتُ الصَّلاةِ الأُخْرَى فَتَوَعَّدَ اللَّهُ مَنْ يُخْرِجُهَا عَنْ وَقْتِهَا بِالْوَيْلِ وَهُوَ الْهَلاكُ الشَّدِيدُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":255},{"type":"p","text":"وَقَوْلُ الْمُؤَلِّفِ «عَلَى كُلِّ مُسْلِمٍ» يَعْنِي بِهِ أَنَّ الْكَافِرَ لا يُقَالُ لَهُ صَلِّ وَهُوَ عَلَى كُفْرِهِ إِنَّمَا يُقَالُ لَهُ أَسْلِمْ فَإِذَا أَسْلَمَ أَمَرْنَاهُ بِالصَّلاةِ. وَيَعْنِي بِقَوْلِهِ «بَالِغٍ» أَنَّ غَيْرَ الْبَالِغِ لا تَجِبُ عَلَيْهِ الصَّلاةُ بِحَيْثُ يُعَاقَبُ عَلَى تَرْكِهَا وَهُوَ دُونَ الْبُلُوغِ وَإِنَّمَا يَجِبُ أَمْرُهُ بِالصَّلاةِ مَتَى مَا بَلَغَ سَبْعَ سِنِينَ قَمَرِيَّةً إِذَا كَانَ مُمَيِّزًا. وَيَعْنِي بِقَوْلِهِ «عَاقِلٍ» أَنَّ الْمَجْنُونَ لا تَجِبُ عَلَيْهِ الصَّلاةُ، وَالْمَجْنُونُ هُوَ مَنْ فَقَدَ عَقْلَهُ فَلا يَدْرِي مَا يَفْعَلُ أَوْ يَقُولُ. وَيَعْنِي بِقَوْلِهِ «طَاهِرٍ» أَيْ مِنَ الْحَيْضِ وَالنِّفَاسِ وَيُقَالُ امْرَأَةٌ طَاهِرٌ وَامْرَأَةٌ حَائِضٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":256},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَيَحْرُمُ تَقْدِيمُهَا عَلَى وَقْتِهَا وَتَأْخِيرُهَا عَنْهُ لِغَيْرِ عُذْرٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":257},{"type":"p","text":"   الشَّرْحُ يُفْهَمُ مِنْ هَذَا أَنَّ مَنْ قَدَّمَ الصَّلاةَ عَلَى وَقْتِهَا لا تَصِحُّ صَلاتُهُ وَمَنْ أَخَّرَهَا عَنْهُ عَصَى اللَّهَ بِتَأْخِيرِهِ. وَأَشَدُّ الْمَعْصِيَتَيْنِ مَعْصِيَةُ التَّقْدِيمِ عَلَى الْوَقْتِ لِأَنَّهُ لا تَبْرَأُ ذِمَّتُهُ وَلا تَقَعُ صَلاتُهُ أَدَاءً وَلا قَضَاءً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":258},{"type":"p","text":"وَقَوْلُ الْمُؤَلِّفِ «لِغَيْرِ عُذْرٍ» أَخْرَجَ مَا إِذَا كَانَ التَّقْدِيمُ أَوِ التَّأْخِيرُ لِعُذْرٍ فَإِنَّهُ لا إِثْمَ فِي ذَلِكَ. وَالْعُذْرُ فِي ذَلِكَ مَا يُبِيحُ الْجَمْعَ مِنْ سَفَرٍ أَوْ مَرَضٍ أَوْ نَحْوِ ذَلِكَ بِشُرُوطِهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":259},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فإِنْ طَرَأَ مَانِعٌ كَحَيْضٍ بَعْدَمَا مَضَى مِنْ وَقْتِهَا مَا يَسَعُهَا وَطُهْرَهَا لِنَحْوِ سَلِسٍ لَزِمَهُ قَضَاؤُهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":260},{"type":"p","text":"   الشَّرْحُ أَنَّ الَّذِي طَرَأَ عَلَيْهِ الْمَانِعُ بَعْدَ دُخُولِ الْوَقْتِ كَأَنْ حَاضَتِ الْمَرْأَةُ فِي أَثْنَاءِ وَقْتِ الظُّهْرِ أَوْ أُصِيبَ شَخْصٌ بِالْجُنُونِ أَوِ الإِغْمَاءِ بَعْدَمَا مَضَى مِنْ أَوَّلِ وَقْتِ الصَّلاةِ مَا يَسَعُ الصَّلاةَ مَعَ طُهْرِهَا لِمَنْ لا يُمْكِنُهُ تَقْديِمُ طُهْرِهِ عَلَى الْوَقْتِ كَسَلِسِ الْبَوْلِ يَلْزَمُهُ أَنْ يَقْضِيَهَا بَعْدَ زَوَالِ الْمَانِعِ أَيْ بَعْدَ ذَهَابِ الْحَيْضِ بِالنِّسْبَةِ لِلْحَائِضِ وَبَعْدَ زَوَالِ غَيْبُوبَةِ الْعَقْلِ بِالنِّسْبَةِ لِلْمَجْنُونِ وَالْمُغْمَى عَلَيْهِ. وَمِثْلُ السَّلِسِ فِي هَذَا الْحُكْمِ نَحْوُهُ كَالْمُسْتَحَاضَةِ. وَالْمَقْصُودُ بِالطُّهْرِ الِاسْتِنْجَاءُ وَالْوُضُوءُ أَوِ التَّيَمُّمُ لِمَنْ كَانَ مَرِيضًا وَنَحْوَهُ مِمَّنْ لا يُمْكِنُهُ اسْتِعْمَالُ الْمَاءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":261},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: أَوْ زَالَ الْمَانِعُ وَقَدْ بَقِيَ مِنَ الْوَقْتِ قَدْرُ تَكْبِيرَةٍ لَزِمَتْهُ وَكَذَا مَا قَبْلَهَا إِنْ جُمِعَتْ مَعَهَا فَيَجِبُ الْعَصْرُ مَعَ الظُّهْرِ إِنْ زَالَ الْمَانِعُ بِقَدْرِ تَكْبِيرَةٍ قَبْلَ الْغُرُوبِ وَالْعِشَاءُ مَعَ الْمَغْرِبِ بِإِدْرَاكِ قَدْرِ تَكْبِيرَةٍ قَبْلَ الْفَجْرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":262},{"type":"p","text":"   الشَّرْحُ إِنْ زَالَ الْمَانِعُ كَالْحَيْضِ أَوِ الْجُنُونِ أَوِ الإِغْمَاءِ وَكَانَ الْقَدْرُ الَّذِي بَقِيَ قَدْرَ مَا يَسَعُ تَكْبِيرَةَ الإِحْرَامِ فَقَطْ وَجَبَتْ تِلْكَ الصَّلاةُ وَالَّتِي قَبْلَهَا إِنْ كَانَتْ تُجْمَعُ مَعَهَا أَيْ فِي السَّفَرِ وَنَحْوِهِ كَأَنْ كَانَتْ تِلْكَ الصَّلاةُ الْعَصْرَ لِأَنَّ الْعَصْرَ تُجْمَعُ فِي السَّفَرِ مَعَ مَا قَبْلَهَا وَهِيَ الظُّهْرُ وَكَذَلِكَ الْعِشَاءُ لِأَنَّهَا تُجْمَعُ مَعَ مَا قَبْلَهَا وَهِيَ الْمَغْرِبُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":263},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":264},{"type":"source","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مَا يَجِبُ عَلَى أَوْلِيَاءِ الصِّبْيَانِ وَالصَّبِيَّاتِ وَغَيْرِ ذَلِكَ. ","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":265},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ عَلَى وَلِيِّ الصَّبِيِّ وَالصَّبِيَّةِ الْمُمَيِّزَيْنِ أَنْ يَأْمُرَهُمَا بِالصَّلاةِ وَيُعَلِّمَهُمَا أَحْكَامَهَا بَعْدَ سَبْعِ سِنِينَ قَمَرِيَّةٍ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":266},{"type":"p","text":"   الشَّرْحُ أَنَّهُ يَجِبُ عَلَى وَلِيِّ الصَّبِيِّ وَالصَّبِيَّةِ أَمْرُهُمَا بِالصَّلاةِ بَعْدَ سَبْعِ سِنِينَ قَمَرِيَّةٍ أَيْ بَعْدَ تَمَامِ سَبْعِ سِنِينَ عَلَى الْفَوْرِ إِنْ حَصَلَ التَّمْيِيزُ وَذَلِكَ بِأَنْ يَفْهَمَ الْخِطَابَ وَيَرُدَّ الْجَوَابَ. وَبَعْضُهُمْ فَسَّرَ التَّمْيِيزَ بِالِاسْتِقْلالِ بِالأَكْلِ وَالشُّرْبِ وَالِاسْتِنْجَاءِ. وَيَكُونُ الأَمْرُ بِالصَّلاةِ بَعْدَ تَعْلِيمِ أَحْكَامِهَا وَأُمُورِهَا فَإِنَّ تَعْلِيمَهُمَا أُمُورَهَا بَعْدَ سَبْعِ سِنِينَ وَاجِبٌ وَيَكُونُ الأَمْرُ بِالصَّلاةِ بِتَشْدِيدٍ وَلَيْسَ بِطَرِيقَةٍ لا تُشْعِرُهُمَا بِأَهَمِيَّةِ أَدَاءِ فَرَائِضِ الصَّلَوَاتِ. وَالصَّبِيُّ يُؤْمَرُ بِالْقَضَاءِ كَمَا يُؤْمَرُ بِالأَدَاءِ وَكَذَلِكَ يُؤْمَرُ بِقَضَاءِ الصَّوْمِ إِنْ كَانَ يُطِيقُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":267},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَضْرِبَهُمَا عَلَى تَرْكِهَا بَعْدَ عَشْرِ سِنِينَ كَصَوْمٍ أَطَاقَاهُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":268},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى الأَبِ وَالأُمِّ ضَرْبُ الصَّبِيِّ وَالصَّبِيَّةِ عَلَى تَرْكِ الصَّلاةِ بَعْدَ عَشْرِ سِنِينَ وَالصِّيَامُ الَّذِي يُطِيقُهُ الصَّبِيُّ وَالصَّبِيَّةُ كَذَلِكَ يَجِبُ عَلَى الآبَاءِ وَالأُمَّهَاتِ الأَمْرُ بِهِ لِسَبْعٍ وَضَرْبُهُمَا عَلَيْهِ بَعْدَ إِكْمَالِ عَشْرِ سِنِينَ. وَالْعِبْرَةُ بِالسِّنِينَ الْقَمَرِيَّةِ لا بِالسِّنِينَ الشَّمْسِيَّةِ أَمَّا إِنْ كَانَا لا يُطِيقَانِ الصِّيَامَ فَلا يَجِبُ الأَمْرُ بِالصِّيَامِ. وَهَذَا الضَّرْبُ يُشْتَرَطُ أَنْ يَكُونَ غَيْرَ مُبَرِّحٍ أَيْ غَيْرَ مُؤَدٍّ إِلَى الْهَلاكِ لِأَنَّ الضَّرْبَ الْمُؤَدِّيَ لِلْهَلاكِ حَرَامٌ عَلَى الْوَلِيِّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":269},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَيْهِ أَيْضًا تَعْلِيمُهُمَا مِنَ الْعَقَائِدِ وَالأَحْكَامِ يَجِبُ كَذَا وَيَحْرُمُ كَذَا وَمَشْرُوعِيَّةَ السِّوَاكِ وَالْجَمَاعَةِ. ","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":270},{"type":"p","text":"   الشَّرْحُ مِنَ الْوَاجِبِ عَلَى الأَبَوَيْنِ نَحْوَ أَوْلادِهِمَا تَعْلِيمُ الصَّبِيِّ وَالصَّبِيَّةِ مَا يَجِبُ عَلَيْهِمَا بَعْدَ الْبُلُوغِ أَيْ مِنْ أُمُورِ الدِّينِ الضَّرُورِيَّةِ الَّتِي يَشْتَرِكُ فِي مَعْرِفَتِهَا الْخَاصُّ وَالْعَامُّ وَهُوَ مَا كَانَ مِنْ أُصُولِ الْعَقِيدَةِ مِنْ وُجُودِ اللَّهِ وَوَحْدَانِيَّتِهِ وَقِدَمِهِ وَبَقَائِهِ وَقِيَامِهِ بِنَفْسِهِ وَمُخَالَفَتِهِ لِلْحَوَادِثِ فِي الذَّاتِ وَالصِّفَاتِ أَيْ أَنَّهُ لا يُشْبِهُ شَيْئًا مِنَ الْمَخْلُوقَاتِ لا يُشْبِهُ الضَّوْءَ وَالظَّلامَ وَالإِنْسَانَ وَالنَّبَاتَ وَالْجَمَادَاتِ مِنَ الكَوَاكِبِ وَغَيْرِهَا وَأَنَّهُ لَيْسَ جِسْمًا وَأَنَّ لِلَّهِ قُدْرَةً وَإِرَادَةً وَسَمْعًا وَبَصرًا وَعِلْمًا وَحَيَاةً وَكَلامًا وَأَنَّ مُحَمَّدًا عَبْدُ اللَّهِ وَرَسُولُهُ وَأَنَّهُ خَاتَمُ الأَنْبِيَاءِ وَأَنَّهُ عَرَبِيٌّ وَأَنَّهُ وُلِدَ بِمَكَّةَ وَهَاجَرَ إِلَى الْمَدِينَةِ وَدُفِنَ فِيهَا وَأَنَّ اللَّهَ أَرْسَلَ أَنْبِيَاءَ أَوَّلُهُمْ ءَادَمُ وَأَنَّهُ أَنْـزَلَ كُتُبًا عَلَى الأَنْبِيَاءِ وَأَنَّ لِلَّهِ مَلائِكَةً وَأَنَّهُ سَيُفْنِي الْجِنَّ وَالإِنْسَ وَالْمَلائِكَةَ وَكُلَّ ذِي رُوحٍ ثُمَّ يُعَادُونَ إِلَى الْحَيَاةِ وَأَنَّ الإِنْسَ وَالْجِنَّ يُجْزَوْنَ بَعْدَ ذَلِكَ عَلَى حَسَنَاتِهِمْ بِالنَّعِيمِ الْمُقِيمِ وَعَلَى سَيِّئَاتِهِمْ بِالْعَذَابِ الأَلِيمِ وَأَنَّ اللَّهَ أَعَدَّ لِلْمُؤْمِنِينَ دَارًا يَتَنَعَّمُونَ فِيهَا تُسَمَّى الْجَنَّةَ وَلِلْكَافِرِينَ دَارًا يَتَعَذَّبُونَ فِيهَا تُسَمَّى جَهَنَّمَ وَأَنَّ الْكَافِرَ حَرَامٌ عَلَيْهِ الْجَنَّةُ وَأَنَّ كُلَّ مَنْ لا يُؤْمِنُ بِاللَّهِ وَبِرَسُولِهِ مُحَمَّدٍ كَافِرٌ وَمَا أَشْبَهَ ذَلِكَ. وَكَذَلِكَ تَعْلِيمُهُمْ حُرْمَةَ السَّرِقَةِ وَالْكَذِبِ وَلَوْ مَزْحًا وَحُرْمَةَ الزِّنَى وَهُوَ إِدْخَالُ الذَّكَرِ فِي فَرْجِ الْمَرْأَةِ غَيْرِ زَوْجَتِهِ وَأَمَتِهِ وَاللِّوَاطِ وَهُوَ إِدْخَالُ الذَّكَرِ فِي الدُّبُرِ أَيْ دُبُرِ غَيْرِ زَوْجَتِهِ وَأَمَتِهِ [وَجِمَاعُ الزَّوْجَةِ فِي دُبُرِهَا حَرَامٌ لَكِنَّهُ لَيْسَ لِوَاطًا يَجِبُ فِيهِ الْحَدُّ] وَتَعْلِيمُهُمْ حُرْمَةَ الْغِيبَةِ وَالنَّمِيمَةِ وَضَرْبِ الْمُسْلِمِ ظُلْمًا وَنَحْوَ ذَلِكَ مِنَ الأُمُورِ الظَّاهِرَةِ. وَكَذَلِكَ تَعْلِيمُهُمْ أَنَّ اسْتِعْمَالَ السِّوَاكِ سُنَّةٌ وَأَنَّ الشَّرْعَ أَمَرَ بِصَلاةِ الْجَمَاعَةِ وَمَا أَشْبَهَ ذَلِكَ. قَالَ ابْنُ الْجَوْزِيِّ فِي كِتَابِهِ الْحَثِّ عَلَى حِفْظِ الْعِلْمِ فِي بَابِ الإِعْلامِ بِمَا يَنْبَغِي تَقْدِيمُهُ مِنَ الْمَحْفُوظَاتِ «أَوَّلُ مَا يَنْبَغِي تَقْدِيمُهُ مُقَدِّمَةٌ فِي الِاعْتِقَادِ تَشْتَمِلُ عَلَى الدَّلِيلِ عَلَى مَعْرِفَةِ اللَّهِ سُبْحَانَهُ وَيُذْكَرُ فِيهَا مَا لا بُدَّ مِنْهُ ثُمَّ يُعَرَّفُ الْوَاجِبَاتِ ثُمَّ حِفْظُ الْقُرْءَانِ ثُمَّ سَمَاعُ الْحَدِيثِ» اهـ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":271},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَى وُلاةِ الأَمْرِ قَتْلُ تَارِكِ الصَّلاةِ كَسَلًا إِنْ لَمْ يَتُبْ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":272},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى إِمَامِ الْمُسْلِمِينَ وَالسُّلْطَانِ الَّذِي وَلَّاهُ الإِمَامُ وَالْقَاضِي أَنْ يَقْتُلَ تَارِكَ الصَّلاةِ كَسَلًا بَعْدَ إِنْذَارِهِ أَنَّهُ إِنْ تَرَكَ الظُّهْرَ مَثَلًا إِلَى أَنْ تَغِيبَ الشَّمْسُ يَقْتُلُهُ فَإِذَا لَمْ يُصَلِّهَا حَتَّى غَرَبَتِ الشَّمْسُ وَجَبَ عَلَيْهِ أَنْ يَقْتُلَهُ [فَالْقَاعِدَةُ فِي ذَلِكَ أَنَّهُ إِذَا مَضَى وَقْتُ الصَّلاةِ الثَّانِيَةِ وَكَانَتْ تُجْمَعُ مَعَهَا لِلْعُذْرِ وَلَمْ يُصَلِّهَا قَضَاءً يُقْتَلُ وَإِلَّا بِأَنْ كَانَتِ الَّتِي بَعْدَهَا لا تُجْمَعُ مَعَهَا فَيُقْتَلُ بَعْدَ انْتِهَاءِ وَقْتِ الأُولَى إِنْ لَمْ يَشْرَعْ فِيهَا فَفِي صَلاةِ الصُّبْحِ مَثَلًا يُقْتَلُ بَعْدَ تَوَعُّدِهِ عَلَى تَرْكِهَا إِذَا طَلَعَتِ الشَّمْسُ وَلَمْ يَشْتَغِلْ بِالْقَضَاءِ] وَيَكُونُ هَذَا الْقَتْلُ كَفَّارَةً أَيْ تَطْهِيرًا لَهُ لِأَنَّهُ مُسْلِمٌ حَيْثُ إِنَّهُ لا يُنْكِرُ فَرْضِيَّةَ الصَّلاةِ. وَأَمَّا تَارِكُهَا جُحُودًا فَهُوَ مُرْتَدٌّ فَيُطَالِبُهُ السُّلْطَانُ بِالرُّجُوعِ إِلَى الإِسْلامِ فَإِنْ رَجَعَ وَإِلَّا قَتَلَهُ لِكُفْرِهِ لا لِلْحَدِّ. وَقَوْلُهُ إِنْ لَمْ يَتُبْ أَرَادَ بِهِ أَنَّهُ إِنْ تَابَ قَبْلَ أَنْ يُقْتَلَ تُرِكَ مِنَ الْقَتْلِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":273},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَحُكْمُهُ  أَنَّهُ مُسْلِمٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":274},{"type":"p","text":"   الشَّرْحُ أَنَّ الَّذِي يَتْرُكُ الصَّلاةَ كَسَلًا إِذَا قَتَلَهُ الإِمَامُ أَوْ نَائِبُهُ حَدًّا لِتَطْهِيرِهِ يُجْرَى عَلَيْهِ أَحْكَامُ الْمُسْلِمِينَ فَيَجِبُ تَجْهِيزُهُ بِالغَسْلِ وَالتَّكْفِينِ وَالصَّلاةِ عَلَيْهِ وَالدَّفْنِ. وَلا يَجُوزُ قَتْلُهُ لِغَيْرِ الإِمَامِ وَمَنْ فَوَّضَ إِلَيْهِ الإِمَامُ الأَمْرَ. وَمَعْنَى قَتْلِهِ حَدًّا لِتَطْهِيرِهِ أَنَّ اللَّهَ لا يُعَذِّبُهُ عَلَى هَذَا الذَّنْبِ الَّذِي أُقِيمَ عَلَيْهِ الْحَدُّ فِيهِ وَهَذَا الْحُكْمُ فِي كُلِّ الْحُدُودِ لِقَوْلِهِ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «الْحُدُودُ كَفَّارَاتٌ» رَوَاهُ الْبَيْهَقِيُّ وَرَوَى الْبُخَارِيُّ مَا يُعْطِي مَعْنَاهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":275},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَى كُلِّ مُسْلِمٍ أَمْرُ أَهْلِهِ بِالصَّلاةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":276},{"type":"p","text":"   الشَّرْحُ الْمُرَادُ بِهَذَا الْوُجُوبُ الْكِفَائِيُّ وَالْمُرَادُ بِالأَهْلِ زَوْجَتُهُ وَأَوْلادُهُ وَمَنْ فِي مَعْنَاهُمْ فَهَذَا إِنْ كَانَ عَالِمًا بِنَفْسِهِ فَيَجِبُ عَلَيْهِ أَنْ يُعَلِّمَهُمْ مَا يَجِبُ عَلَيْهِمْ عَيْنًا تَعَلُّمُهُ مِنْ عِلْمِ الدِّينِ أَوْ يُمَكِّنَهُمْ مِنَ التَّعَلُّمِ عِنْدَ مَنْ يُعَلِّمُهُمْ فَيَحْرُمُ عَلَيْهِ عِنْدَئِذٍ مَنْعُهُمْ مِنَ الْخُرُوجِ لِلتَّعَلُّمِ حَتَّى الزَّوْجَةُ لا يَجُوزُ لِلزَّوْجِ أَنْ يَمْنَعَهَا مِنَ الْخُرُوجِ لِلتَّعَلُّمِ إِذَا لَمْ يَكُنْ هُوَ عَالِمًا بِذَلِكَ أَوْ كَانَ عَالِمًا بِذَلِكَ لَكِنَّهُ أَهْمَلَ التَّعْلِيمَ وَلَمْ يَأْتِهَا بِمَنْ يُعَلِّمُهَا. وَهَذَا مَأْخُوذٌ مِنْ قَوْلِ اللَّهِ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا قُوا أَنْفُسَكُمْ وَأَهْلِيكُمْ نَارًا وَقُودُهَا النَّاسُ وَالْحِجَارَةُ﴾ [سُورَةَ التَّحْريِمِ/6] قَالَ سَيِّدُنَا عَلِيٌّ رَضِيَ اللَّهُ عَنْهُ فِي تَفْسِيرِ هَذِهِ الآيَةِ عَلِّمُوا أَنْفُسَكُمْ وَأَهْلِيكُمُ الْخَيْرَ اهـ أَيْ أُمُورَ الدِّينِ رَوَاهُ الْحَاكِمُ. فَمَنْ تَعَلَّمَ لِنَفْسِهِ ضَرُورِيَّاتِ عِلْمِ الدِّينِ وَعَلَّمَ أَهْلَهُ فَقَدْ حَفِظَ نَفْسَهُ وَأَهْلَهُ مِنْ نَارِ جَهَنَّمَ وَمَنْ لَمْ يَفْعَلْ فَقَدْ أَهْلَكَ نَفْسَهُ وَأَهْلَهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":277},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكُلِّ مَنْ قَدَرَ عَلَيْهِ مِنْ غَيْرِهِمْ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":278},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى الْمُسْلِمِ وَالْمُسْلِمَةِ الأَمْرُ بِالْمَعْرُوفِ مِنْ صَلاةٍ وَصِيَامٍ وَنَحْوِ ذَلِكَ مِنَ الْوَاجِبَاتِ مَعَ تَعْلِيمِ مَنْ يُسْتَطَاعُ تَعْلِيمُهُ أَحْكَامَهَا الضَّرُورِيَّةَ إِنْ كَانُوا لا يَعْلَمُونَ ذَلِكَ وُجُوبًا كِفَائِيًّا فِي حَقِّ غَيْرِ أَهْلِهِ مِنْ سَائِرِ الْمُسْلِمِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":279},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":280},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَرْكَانِ الْوُضُوءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":281},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ شُرُوطِ الصَّلاةِ الْوُضُوءُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":282},{"type":"p","text":"   الشَّرْحُ الْوُضُوءُ هُوَ أَوَّلُ مَقَاصِدِ الطَّهَارَة فُرِضَ عِنْدَمَا فُرِضَتِ الصَّلاةُ. وَالشَّرْطُ فِي اصْطِلاحِ الْفُقَهَاءِ غَيْرُ الرُّكْنِ وَهُوَ مَا يَتَوَقَّفُ عَلَيْهِ صِحَّةُ الشَّىْءِ وَلَيْسَ جُزْءًا مِنْهُ كَالطَّهَارَةِ وَاسْتِقْبَالِ الْقِبْلَةِ بِالنِّسْبَةِ لِلصَّلاةِ وَأَمَّا الرُّكْنُ فَهُوَ جُزْءٌ مِنَ الشَّىْءِ وَيَتَوَقَّفُ صِحَّةُ الشَّىْءِ عَلَيْهِ كَالرُّكُوعِ وَالسُّجُودِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":283},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَفُرُوضُهُ سِتَّةٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":284},{"type":"p","text":"   الشَّرْحُ أَنَّ فُرُوضَ الْوُضُوءِ سِتَّةٌ أَرْبَعَةٌ عُرِفَتْ بِالْكِتَابِ وَالسُّنَّةِ وَاثْنَانِ بِالسُّنَّةِ فَغَسْلُ الْوَجْهِ وَالْيَدَيْنِ وَمَسْحُ الرَّأْسِ وَغَسْلُ الرِّجْلَيْنِ هَذِهِ الأَرْبَعَةُ دَلِيلُهَا الْكِتَابُ وَالسُّنَّةُ أَمَّا النِّيَّةُ وَالتَّرْتِيبُ فَدَلِيلُهُمَا الْحَدِيثُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":285},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الأَوَّلُ نِيَّةُ الطَّهَارَةِ لِلصَّلاةِ أَوْ غَيْرُهَا مِنَ النِّيَّاتِ الْمُجْزِئَةِ عِنْدَ غَسْلِ الْوَجْهِ أَيْ مُقْتَرِنَةً بِغَسْلِهِ عِنْدَ الإِمَامِ الشَّافِعِيِّ وَتَكْفِي النِّيَّةُ إِنْ تَقَدَّمَتْ عَلَى غَسْلِ الْوَجْهِ بِقَلِيلٍ عِنْدَ مَالِكٍ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":286},{"type":"p","text":"   الشَّرْحُ الْفَرْضُ الأَوَّلُ مِنْ فُرُوضِ الْوُضُوءِ النِّيَّةُ وَلا بُدَّ فِيهِ لِصِحَّتِهِ مِنْ نِيَّةٍ مُجْزِئَةٍ كَأَنْ يَنْوِيَ الطَّهَارَةَ لِلصَّلاةِ بِقَلْبِهِ فَلا يَكْفِي التَّلَفُّظُ بِهَا مِنْ غَيْرِ اسْتِحْضَارِهَا بِقَلْبِهِ وَيَكْفِي أَنْ يَنْوِيَ فَرْضَ الْوُضُوءِ أَوِ الْوُضُوءَ فَقَطْ أَوْ يَنْوِيَ اسْتِبَاحَةَ مُفْتَقِرٍ إِلَى وُضُوءٍ كَأَنْ يَنْوِيَ اسْتِبَاحَةَ الصَّلاةِ أَوِ اسْتِبَاحَةَ مَسِّ الْمُصْحَفِ فَمَنْ تَوَضَّأ بِنِيَّةِ شَىْءٍ مِنْ هَذِهِ الْمَذْكُورَاتِ اسْتَبَاحَ الصَّلاةَ وَغَيْرَهَا أَيْ مِمَّا يُحْتَاجُ إِلَى الطَّهَارَةِ. وَلا تُجْزِئُ نِيَّةُ اسْتِبَاحَةِ مَا تُسْتَحَبُّ لَهُ الطَّهَارَةُ كَنَوَيْتُ اسْتِبَاحَةَ قِرَاءَةِ الْقُرْءَانِ. وَيَجِبُ أَنْ تَكُونَ هَذِهِ النِّيَّةُ فِي مَذْهَبِ الإِمَامِ الشَّافِعِيِّ عِنْدَ غَسْلِ الْوَجْهِ أَيْ مُقْتَرِنَةً بِغَسْل جُزْءٍ مِنَ الْوَجْهِ أَيْ عِنْدَ إِصَابَةِ الْمَاءِ لِأَوَّلِ جُزْءٍ مِنَ الْوَجْهِ فَإِذَا قَرَنَ النِّيَّةَ بِأَوَّلِ غَسْلِ الْوَجْهِ كَفَتْ تِلْكَ النِّيَّةُ وَلَوْ غَسَلَ جُزْءًا مِنْ وَجْهِهِ قَبْلَ هَذِهِ النِّيَّةِ ثُمَّ نَوَى فِي أَثْنَاءِ غَسْلِ الْوَجْهِ وَجَبَ عَلَيْهِ إِعَادَةُ غَسْلِ ذَلِكَ الْجُزْءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":287},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الثَّانِي غَسْلُ الْوَجْهِ جَمِيعِهِ مِنْ مَنَابِتِ شَعَرِ رَأْسِهِ إِلَى الذَّقَنِ وَمِنَ الأُذُنِ إِلَى الأُذُنِ شَعَرًا وَبَشَرًا لا بَاطِنَ لِحْيَةِ الرَّجُلِ وَعَارِضَيْهِ إِذَا كَثُفَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":288},{"type":"p","text":"   الشَّرْحُ الْفَرْضُ الثَّانِي مِنْ فَرَائِضِ الْوُضُوءِ غَسْلُ الْوَجْهِ جَمِيعِهِ وَالْمُرَادُ غَسْلُ ظَاهِرِهِ فَلا يَجِبُ غَسْلُ بَاطِنِ الْعَيْنِ وَالْفَمِ وَالأَنْفِ. وَحَدُّ الْوَجْهِ مِنْ مَنَابِتِ شَعَرِ الرَّأْسِ بِاعْتِبَارِ الْغَالِبِ إِلَى الذَّقَنِ. وَالذَّقَنُ هُوَ مُجْتَمَعُ اللَّحْيَيْنِ وَهُمَا الْعَظْمَانِ اللَّذَانِ أَسْفَلَ الأُذُنِ يَجْتَمِعَانِ فِي أَسْفَلِ الْوَجْهِ فَيُسَمَّى مُجْتَمَعُهُمَا الذَّقَنَ هَذَا حَدُّ الْوَجْهِ طُولًا وَأَمَّا حَدُّهُ عَرْضًا فَهُوَ مِنَ الأُذُنِ إِلَى الأُذُنِ أَيْ مِنْ وَتِدِ الأُذُنِ إِلَى وَتِدِ الأُذُنِ وَلا يَدْخُلُ الْوَتِدُ فِيمَا يَجِبُ غَسْلُهُ وَلا تَدْخُلُ الأُذُنَانِ فِي الْوَجْهِ وَلا يَجِبُ غَسْلُهُمَا إِنَّمَا الَّذِي يَجِبُ غَسْلُهُ مَا بَيْنَهُمَا فَمَا كَانَ ضِمْنَ هَذَا مِنْ شَعَرٍ وَبَشَرٍ أَيْ جِلْدٍ فَغَسْلُهُ فَرْضٌ فَمِمَّا يَجِبُ غَسْلُهُ الْغَمَمُ وَهُوَ الشَّعَرُ الَّذِي يَنْبُتُ عَلَى الْجَبْهَةِ لِأَنَّ هَذَا خِلافُ غَالِبِ النَّاسِ. وَلا يَجِبُ غَسْلُ مَا يَنْحَسِرُ عَنْهُ الشَّعَرُ كَالنَّاصِيَّةِ فَمَنْ كَانَ مُقَدَّمُ رَأْسِهِ انْحَسَرَ عَنْهُ الشَّعَرُ فَلا يَجِبُ عَلَيْهِ غَسْلُهُ مَعَ الْوَجْهِ. وَمِمَّا يَجِبُ غَسْلُهُ مِنَ الْوَجْهِ مَا يَظْهَرُ مِنْ حُمْرَةِ الشَّفَتَيْنِ عِنْدَ إِطْبَاقِ الْفَمِ بِخِلافِ مَا لا يَظْهَرُ عِنْدَ الإِطْبَاقِ فَإِنَّهُ لا يَجِبُ غَسْلُهُ. وَيُسْتَثْنَى مِنْ ذَلِكَ بَاطِنُ لِحْيَةِ الرَّجُلِ الْكَثِيفَةِ وَبَاطِنُ عَارِضَيْهِ [وَيُرَادُ بِهِمَا الشَّعَرُ النَّابِتُ عَلَى الْعَظْمَيْنِ جَانِبَيِ الْوَجْهِ الْمُلْتَقِيَيْنِ فِي أَسْفَلِهِ] الْكَثِيفَيْنِ وَالْكَثِيفُ هُوَ مَا لا تُرَى الْبَشَرَةُ مِنْ خِلالِهِ فَإِنْ خَفَّ شَعَرُ اللِّحْيَةِ وَالْعَارِضَيْنِ وَجَبَ غَسْلُ بَاطِنِهِ كَذَلِكَ. قَالَ الْفُقَهَاءُ يَجِبُ غَسْلُ جُزْءٍ زَائِدٍ عَلَى الْوَجْهِ مِنْ سَائِرِ جَوَانِبِ الْوَجْهِ لِلتَّحَقُّقِ مِنِ اسْتِيعَابِهِ وَهَذَا يَحْصُلُ بِقَدْرِ قُلامَةِ ظُفْرٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":289},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الثَّالِثُ غَسْلُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ وَمَا عَلَيْهِمَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":290},{"type":"note","text":"   الشَّرْحُ أَنَّ الْفَرْضَ الثَّالِثَ مِنْ فُرُوضِ الْوُضُوءِ غَسْلُ الْيَدَيْنِ وَلَوْ كَانَتْ زَائِدَةً الْتَبَسَتْ بِالأَصْلِيَّةِ مَعَ الْمِرْفَقَيْنِ وَيُقَالُ الْمَرْفِقَيْنِ وَالْمِرْفَقُ هُوَ مُجْتَمَعُ عَظْمَيِ السَّاعِدِ وَعَظْمِ الْعَضُدِ فَقَوْلُهُ تَعَالَى ﴿وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ﴾ [سُورَةَ الْمَائِدَةِ/6] أَيْ مَعَ الْمَرَافِقِ فَإِذَا تُرِكَ الْمِرْفَقَانِ لَمْ يَصِحَّ الْوُضُوءُ وَذَلِكَ لِأَنَّهُ ثَبَتَ عَنْهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ كَانَ يَغْسِلُ مِرْفَقَيْهِ وَلا يَقْتَصِرُ عَلَى مَا قَبْلَهُمَا كَمَا رَوَاهُ مُسْلِمٌ. وَلَوْ قُطِعَ بَعْضُ مَا يَجِبُ غَسْلُهُ وَجَبَ غَسْلُ مَا بَقِيَ. وَيَجِبُ أَيْضًا غَسْلُ مَا عَلَيْهِمَا مِنْ شَعَرٍ وَلَوْ كَانَ كَثِيفًا طَوِيلًا. وَيَجِبُ غَسْلُ الظُّفْرِ أَيْضًا وَأَمَّا الْوَسَخُ الَّذِي تَحْتَ الظُّفْرِ الْمَانِعُ مِنْ وُصُولِ الْمَاءِ فَقَدْ قَالَ بَعْضُهُمْ يُعْفَى عَنْهُ فِي الْوُضُوءِ وَبَعْضُهُمْ قَالَ لا يُعْفَى عَنْهُ. وَيَجِبُ غَسْلُ الشَّقِّ أَيْ إِذَا كَانَ فِي يَدِهِ شُقُوقٌ يَجِبُ إِيصَالُ الْمَاءِ إِلَيْهَا. أَمَّا الشَّوْكَةُ فَإِنِ اسْتَتَرَتْ وَتَجَاوَزَتِ الْجِلْدَ فَلا يَجِبُ إِخْرَاجُهَا لِغَسْلِ مَوْضِعِهَا أَمَّا إِنْ كَانَتْ ظَاهِرَةً لَمْ تَسْتَتِرْ فَيُخْرِجُهَا وُجُوبًا. وَيَكْفِي غَسْلُ قِشْرِ الْجُرْحِ وَلا يَجِبُ رَفْعُهُ وَإِزَالَتُهُ فَلَوْ أَزَالَهُ بَعْدَ إِتْمَامِ الْوُضُوءِ لَمْ يَجِبْ غَسْلُ مَا ظَهَرَ.","style":"footnote text","align":"justify","bold":true,"size":18.0,"index":291},{"type":"p","text":"   وَقَوْلُهُ «وَمَا عَلَيْهِمَا» أَيْ إِنْ كَانَ عَلَى يَدِهِ سِلْعَةٌ أَيْ قِطْعَةُ لَحْمٍ زَائِدَةٌ نَبَتَتْ عَلَى يَدِهِ فَإِنَّهُ يَجِبُ غَسْلُهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":292},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الرَّابِعُ مَسْحُ الرَّأْسِ أَوْ بَعْضِهِ وَلَوْ شَعْرَةً فِي حَدِّهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":293},{"type":"p","text":"   الشَّرْحُ الْفَرْضُ الرَّابِعُ مِنْ فَرَائِضِ الْوُضُوءِ مَسْحُ بَعْضِ الرَّأْسِ. وَالْوَاجِبُ فِي مَذْهَبِ الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ مَسْحُ شَىْءٍ مِنْ شَعَرِ الرَّأْسِ وَلَوْ بَعْضَ شَعْرَةٍ أَوْ جُزْءًا مِنَ الرَّأْسِ لا شَعَرَ عَلَيْهِ لَكِنَّهُ يُشْتَرَطُ فِي الشَّعَرِ أَنْ يَكُونَ فِي حَدِّ الرَّأْسِ [وَحَدُّ الرَّأْسِ مِنْ مَنَابِتِ الشَّعَرِ غَالِبًا إِلَى النُّقْرَةِ] فَلَوْ مَسَحَ الْقَدْرَ الَّذِي يَخْرُجُ عَنْ حَدِّ الرَّأْسِ عِنْدَ مَدِّهِ لِجِهَةِ نُزُولِهِ فَلا يَكْفِي. وَلَوْ وَضَعَ يَدَهُ الْمُبْتَلَّةَ أَوْ خِرْقَةً مُبْتَلَّةً بِالْمَاءِ فَوَصَلَ الْبَلَلُ مِنْهَا إِلَى الرَّأْسِ كَفَى ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":294},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الْخَامِسُ غَسْلُ الرِّجْلَيْنِ مَعَ الْكَعْبَيْنِ أَوْ مَسْحُ الْخُفِّ إِذَا كَمَلَتْ شُرُوطُهُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":295},{"type":"p","text":"   الشَّرْحُ الْفَرْضُ الْخَامِسُ مِنْ فَرَائِضِ الْوُضُوءِ غَسْلُ الرِّجْلَيْنِ مَعَ الْكَعْبَيْنِ وَمَا عَلَيْهِمَا مِنْ شَعَرٍ وَسِلْعَةٍ وَشُقُوقٍ وَنَحْوِ ذَلِكَ وَهَذَا فِي غَيْرِ لابِسِ الْخُفِّ أَمَّا مَنْ لَبِسَ الْخُفَّ الْمُسْتَوْفِيَ لِلشُّرُوطِ فَيَكْفِيهِ مَسْحُ الْخُفِّ بَدَلًا عَنْ غَسْلِ الرِّجْلَيْنِ وَذَلِكَ بِأَنْ يَكُونَ الْخُفُّ طَاهِرًا لا نَحْوَ جِلْدِ مَيْتَةٍ سَاتِرًا لِجَمِيعِ الْقَدَمِ يُمْكِنُ الْمَشْيُ عَلَيْهِ بِلا نَعْلٍ لِحَاجَاتِ الْمُسَافِرِ عِنْدَ الْحَطِّ وَالتَّرْحَالِ أَيِ الرَّحِيلِ بَعْدَ الِاسْتِرَاحَةِ فِي السَّفَرِ وَنَحْوِهِمَا وَأَنْ يَبْتَدِئَ لُبْسَهُمَا بَعْدَ كَمَالِ الطَّهَارَةِ وَأَنْ يَكُونَ الْخُفُّ مَانِعًا لِنُفُوذِ الْمَاءِ وَأَمَّا فِي غَيْرِ ذَلِكَ فَلا يَكْفِي الْمَسْحُ. وَيَمْسَحُ الْمُقِيمُ يَوْمًا وَلَيْلَةً وَالْمُسَافِرُ ثَلاثَةَ أَيَّامٍ بِلَيَالِيهِنَّ وَابْتِدَاءُ الْمُدَّةِ مِنْ حِينِ يُحْدِثُ بَعْدَ لُبْسِ الْخُفَّيْنِ وَلا يُشْتَرَطُ أَنْ يَكُونَ لِلْخُفِّ نَعْلٌ يَقِيهِ بَلْ يَجُوزُ الْمَسْحُ عَلَى الْخُفِّ الَّذِي يُمْشَى بِهِ فِي الشَّوَارِعِ فِي الطِّينِ لِأَنَّ طِينَ الشَّوَارِعِ الْمُتَنَجِّسَ يُعْفَى عَنْهُ. وَيَبْطُلُ الْمَسْحُ عَلَى الْخُفَّيْنِ بِثَلاثَةِ أَشْيَاءَ بِخَلْعِهِمَا وَانْقِضَاءِ الْمُدَّةِ وَمَا يُوجِبُ الْغُسْلَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":296},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: السَّادِسُ التَّرْتِيبُ هَكَذَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":297},{"type":"p","text":"   الشَّرْحُ الْفَرْضُ السَّادِسُ مِنْ فَرَائِضِ الْوُضُوءِ أَنْ يَبْدَأَ بِغَسْلِ الْوَجْهِ الْمَقْرُونِ بِالنِّيَّةِ ثُمَّ الْيَدَيْنِ ثُمَّ مَسْحِ الرَّأْسِ ثُمَّ غَسْلِ الرِّجْلَيْنِ فَلَوْ تَرَكَ التَّرْتِيبَ بِأَنْ قَدَّمَ شَيْئًا مِنْ هَذِهِ الْمَذْكُورَاتِ عَلَى مَا قَبْلَهُ لَمْ يَصِحَّ مَا قَدَّمَهُ أَمَّا إِنْ حَصَلَ التَّرْتِيبُ تَقْدِيرًا فَيَكْفِي ذَلِكَ كَأَنْ غَطَسَ فِي مَاءٍ مَعَ النِّيَّةِ فَخَرَجَ وَلَمْ يَمْكُثْ زَمَنًا يُمْكِنُهُ التَّرْتِيبُ الْحَقِيقِيُّ فِيهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":298},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":299},{"type":"source","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ نَوَاقِضِ الْوُضُوءِ. ","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":300},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَنْقُضُ الْوُضُوءَ مَا خَرَجَ مِنَ السَّبِيلَيْنِ غَيْرَ الْمَنِيِّ وَمَسُّ قُبُلِ الآدَمِيِّ أَوْ حَلْقَةِ دُبُرِهِ بِبَطْنِ الْكَفِّ بِلا حَائِلٍ وَلَمْسُ بَشَرَةِ الأَجْنَبِيَّةِ الَّتِي تُشْتَهى وَزَوَالُ الْعَقْلِ لا نَوْمُ قَاعِدٍ مُمَكِّنٍ مَقْعَدَتَهُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":301},{"type":"p","text":"   الشَّرْحُ أَنَّ أَسْبَابَ الْحَدَثِ الأَصْغَرِ هَذِهِ الْمَذْكُورَاتُ. أَوَّلُهَا مَا خَرَجَ مِنْ أَحَدِ السَّبِيلَيْنِ أَيِ الْقُبُلِ أَوِ الدُّبُرِ وَهُمَا مَخْرَجَا الْبَوْلِ وَالْغَائِطِ إِلَّا الْمَنِيَّ فَإِنَّهُ لا يَنْقُضُ الْوُضُوءَ عِنْدَ الإِمَامِ الشَّافِعِيِّ. وَالسَّبَبُ الثَّانِي مَسُّ قُبُلِ الآدَمِيِّ أَوْ حَلْقَةِ دُبُرِهِ فَإِنَّهُ نَاقِضٌ إِنْ كَانَ بِلا حَائِلٍ. وَالنَّاقِضُ مِنَ الدُّبُرِ مُلْتَقَى الْمَنْفَذِ فَقَطْ فَلا يَنْقُضُ مَسُّ الأَلْيَةِ. وَالنَّاقِضُ مِنْ قُبُلِ الْمَرْأَةِ مُلْتَقَى شُفْرَيْهَا عَلَى الْمَنْفَذِ فَقَطْ. وَلا يَنْقُضُ اللَّمْسُ بِظَهْرِ الْكَفِّ أَوِ اللَّمْسُ بِحَائِلٍ كَمَا أَنَّهُ لا يَنْقُضُ مَسُّ دُبُرِ أَوْ قُبُلِ غَيْرِ ءَادَمِيٍّ. وَيُعْرَفُ بَطْنُ الْكَفِّ مِنْ ظَاهِرِهَا وَسَائِرِ أَجْزَائِهَا بِوَضْعِ إِحْدَى الْكَفَّيْنِ عَلَى الأُخْرَى مَعَ تَحَامُلٍ يَسِيرٍ [أَيْ كَبْسٍ خَفِيفٍ] وَتَفْرِيقِ الأَصَابِعِ فَالْقَدْرُ الَّذِي لا يَظْهَرُ عِنْدَ ذَلِكَ هُوَ بَطْنُ الْكَفِّ. وَالسَّبَبُ الثَّالِثُ لَمْسُ بَشَرَةِ الأَجْنَبِيَّةِ مَعَ كِبَرٍ لِكُلٍّ مِنَ اللَّامِسِ وَالْمَلْمُوسِ وَالْمُرَادُ بِالْكِبَرِ بُلُوغُ حَدٍّ يُشْتَهَى فِيهِ أَوْ تُشْتَهَى فِيهِ بِالنِّسْبَةِ لِأَهْلِ الطِّبَاعِ السَّلِيمَةِ. وَلا يَنْقُضُ إِلَّا لَمْسُ الْجِلْدِ فَلَوْ لَمَسَ سِنَّ الأَجْنَبِيَّةِ أَوْ شَعَرَهَا أَوْ ظُفْرَهَا لَمْ يَنْتَقِضِ الْوُضُوءُ لَكِنْ يَحْرُمُ لَمْسُ ذَلِكَ مِنَ الأَجْنَبِيِّ وَالأَجْنَبِيَّةِ مَعَ الْكِبَرِ. وَالسَّبَبُ الرَّابِعُ زَوَالُ الْعَقْلِ أَيِ التَّمْيِيزِ بِنَحْوِ جُنُونٍ أَوْ صَرْعٍ أَوْ سُكْرٍ أَوْ نَوْمٍ إِلَّا نَوْمَ قَاعِدٍ مُمَكِّنٍ مَقْعَدَتَهُ مِنْ مَقَرِّهِ كَأَرْضٍ وَظَهْرِ دَابَّةٍ وَلَوْ سَائِرَةً لِلأَمْنِ مِنْ خُرُوجِ الرِّيحِ وَنَحْوِهِ وَإِنْ طَالَ الْوَقْتُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":302},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":303},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَحْكَامِ الِاسْتِنْجَاءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":304},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ الِاسْتِنْجَاءُ مِنْ كُلِّ رَطْبٍ خَارِجٍ مِنْ أَحَدِ السَّبِيلَيْنِ غَيْرَ الْمَنِيِّ بِالْمَاءِ إِلَى أَنْ يَطْهُرَ الْمَحَلُّ أَوْ بِمَسْحِهِ ثَلاثَ مَسَحَاتٍ أَوْ أَكْثَرَ إِلَى أَنْ يَنْقَى الْمَحَلُّ وَإِنْ بَقِيَ الأَثَرُ بِقَالِعٍ طَاهِرٍ جَامِدٍ غَيْرِ مُحْتَرَمٍ وَلَوْ مَعَ وُجُودِ الْمَاءِ مِنْ غَيْرِ انْتِقَالٍ وَقَبْلَ جَفَافٍ فَإِنِ انْتَقَلَ عَنِ الْمَكَانِ الَّذِي اسْتَقَرَّ فِيهِ أَوْ جَفَّ وَجَبَ الْمَاءُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":305},{"type":"p","text":"   الشَّرْحُ هَذَا الْفَصْلُ مَعْقُودٌ لِلِاسْتِنْجَاءِ كَمَا تَقَدَّمَ. وَأَوْجَبُ مَا يُوجِبُ الِاسْتِنْجَاءَ وَأَشَدُّهُ الْبَوْلُ لِأَنَّ التَّضَمُّخَ بِالْبَوْلِ مِنْ أَكْبَرِ الْكَبَائِرِ وَهُوَ أَكْثَرُ مَا يَكُونُ سَبَبًا لِعَذَابِ الْقَبْرِ. فَمَا كَانَ خَارِجًا مِنْ أَحَدِ السَّبِيلَيْنِ وَكَانَ رَطْبًا بِحَيْثُ لَوَّثَ الْمَخْرَجَ وَجَبَ الِاسْتِنْجَاءُ مِنْهُ إِنْ كَانَ مُعْتَادًا أَوْ غَيْرَهُ كَالدَّمِ. وَلا يَجِبُ الِاسْتِنْجَاءُ مِنَ الْخَارِجِ الْجَامِدِ كَالْحَصَى الْخَارِجِ بِلا بَلَلٍ. ثُمَّ إِنْ كَانَ الِاسْتِنْجَاءُ بِحَجَرٍ يُعْفَى عَنِ الأَثَرِ الَّذِي يَبْقَى وَهُوَ الَّذِي لا يُزِيلُهُ إِلَّا الْمَاءُ أَوْ صِغَارُ الْخَزَفِ أَيِ الْفَخَّارِ ثُمَّ إِذَا عَرِقَ الْمَحَلُّ فَأَصَابَ مَا يَلِيهِ مِنَ الثَّوْبِ عُفِيَ عَنْهُ لِأَنَّ هَذَا مِمَّا يَكْثُرُ الِابْتِلاءُ بِهِ وَلا سِيَّمَا فِي الْبِلادِ الْحَارَّةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":306},{"type":"p","text":"وَقَوْلُ الْمُؤَلِّفِ «غَيْرَ الْمَنِيِّ» أَرَادَ بِهِ أَنَّ الْمَنِيَّ لا يَجِبُ الِاسْتِنْجَاءُ مِنْهُ لِأَنَّهُ طَاهِرٌ عِنْدَ الإِمَامِ الشَّافِعِيِّ رَحِمَهُ اللَّهُ وَلَكِنَّهُ يُسَنُّ الِاسْتِنْجَاءُ مِنْهُ لِلْخُرُوجِ مِنْ خِلافِ الأَئِمَّةِ الْقَائِلِينَ بِنَجَاسَتِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":307},{"type":"p","text":"ثُمَّ الْوَاجِبُ عَلَى الْمُسْتَنْجِي الْمَاءُ فَقَطْ أَوِ الْحَجَرُ أَوْ مَا يَقُومُ مَقَامَهُ. وَكَيْفِيَّةُ الِاسْتِنْجَاءِ أَنْ يَضَعَ يَدَهُ عَلَى الْمَخْرَجِ مَعَ سَكْبِ الْمَاءِ وَيَدْلُكَ الْمَخْرَجَ إِلَى أَنْ يَذْهَبَ الْخَارِجُ عَيْنُهُ وَأَثَرُهُ وَيَكْفِي غَلَبَةُ الظَّنِّ فِي زَوَالِهِ. فَإِنْ مَسَحَ بِحَجَرٍ أَوْ نَحْوِهِ وَجَبَ أَنْ يَمْسَحَ ثَلاثَ مَسَحَاتٍ إِمَّا بِثَلاثَةِ أَحْجَارٍ وَإِمَّا بِحَجَرٍ وَاحِدٍ لَهُ ثَلاثَةُ أَطْرَافٍ أَوْ أَكْثَرَ إِلَى أَنْ يُنْقِيَ الْمَحَلَّ. وَفِي حُكْمِ الْحَجَرِ كُلُّ شَىْءٍ قَالِعٍ طَاهِرٍ جَامِدٍ غَيْرِ مُحْتَرَمٍ فَلا يُجْزِئُ أَيْ لا يَكْفِي غَيْرُ الْقَالِعِ لِمَلاسَتِهِ كَالزُّجَاجِ أَوِ الْقَصَبِ أَوْ لِغَيْرِ الْمَلاسَةِ كَالتُّرَابِ الْمُتَنَاثِرِ وَلا يَكْفِي الْجَامِدُ النَّجِسُ أَوِ الْمُتَنَجِّسُ وَلا الرَّطْبُ كَالْجِلْدِ الرَّطْبِ وَلا مَا عَلَيْهِ رُطُوبَةٌ وَلَوْ خِرْقَةً مَبْلُولَةً بِالْمَاءِ فَإِنْ كَانَتْ جَافَّةً فَهِيَ مِثْلُ الْحَجَرِ فَيَكْفِي الِاسْتِنْجَاءُ بِهَا. وَلا يَكْفِي أَيْضًا لِلِاسْتِنْجَاءِ الْقَالِعُ الْمُحْتَرَمُ كَوَرَقَةِ عِلْمٍ شَرْعِيٍّ بَلْ مَنِ اسْتَنْجَى بِهَا عَالِمًا بِمَا فِيهَا كَفَرَ. وَمِنَ الْمُحْتَرَمِ مَطْعُومُ الآدَمِيِّ كَالْخُبْزِ. ثُمَّ إِنَّمَا يَكْفِي الِاسْتِنْجَاءُ بِالْحَجَرِ وَنَحْوِهِ إِذَا لَمْ يَنْتَقِلِ الْخَارِجُ عَنِ الْمَخْرَجِ إِلَى غَيْرِهِ أَيْ لَمْ يُجَاوِزِ الْحَشَفَةَ وَالصَّفْحَتَيْنِ أَيْ مَا يَنْضَمُّ مِنَ الأَلْيَتَيْنِ عِنْدَ الْقِيَامِ. وَيُشْتَرَطُ لِكِفَايَةِ الِاسْتِنْجَاءِ بِالْحَجَرِ لِلنِّسَاءِ أَنْ لا يَصِلَ الْبَوْلُ إِلَى مَدْخَلِ الذَّكَرِ وَإِلَّا تَعَيَّنَ الْمَاءُ. وَيَكْفِي الِاسْتِنْجَاءُ بِالْحَجَرِ مِنَ الْغَائِطِ وَلَوْ كَانَ عَلَى الْمَخْرَجِ شَعَرٌ. وَيُشْتَرَطُ أَنْ يَكُونَ الْمَسْحُ قَبْلَ الْجَفَافِ وَلا يَمْنَعُ اخْتِلاطُ الْعَرَقِ بِالْخَارِجِ مِنْ إِجْزَاءِ الِاسْتِنْجَاءِ بِالْحَجَرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":308},{"type":"p","text":" وَمَا يَفْعَلُهُ بَعْضُ النَّاسِ عِنْدَ الِاسْتِنْجَاءِ مِنَ الْغَائِطِ مِنْ أَنْ يَأْخُذُوا بِالْكَفِّ الْيُسْرَى مَاءً ثُمَّ يَدْلُكُوا بِهِ الْمَخْرَجَ فَذَلِكَ قَبِيحٌ غَيْرُ كَافٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":309},{"type":"p","text":"   وَالِاسْتِبْرَاءُ وَهُوَ إِخْرَاجُ بَقِيَّةِ الْبَوْلِ بَعْدَ انْقِطَاعِهِ بِتَنَحْنُحٍ أَوْ نَحْوِهِ يَكُونُ وَاجِبًا فِي حَالٍ وَسُنَّةً فِي حَالٍ، يَكُونُ وَاجِبًا إِذَا كَانَ يَخْشَى مِنْ تَرْكِهِ تَلْوِيثَ نَفْسِهِ بِالْبَوْلِ وَيَكُونُ سُنَّةً إِذَا كَانَ لا يَخْشَى مِنْ تَرْكِهِ تَلْوِيثَ نَفْسِهِ بِالْبَوْلِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":310},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فصلٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":311},{"type":"p","text":"   الشَّرْحُ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مُوجِبَاتِ الْغُسْلِ وَأَرْكَانِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":312},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ شُرُوطِ الصَّلاةِ الطَّهَارَةُ مِنَ الْحَدَثِ الأَكْبَرِ بِالْغُسْلِ أَوِ التَّيَمُّمِ لِمَنْ عَجَزَ عَنِ الْغُسْلِ وَالَّذِي يُوجِبُهُ خَمْسَةُ أَشْيَاءَ خُرُوجُ الْمَنِيِّ وَالْجِمَاعُ وَالْحَيْضُ وَالنِّفَاسُ وَالْوِلادَةُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":313},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ شُرُوطِ الصَّلاةِ الَّتِي لا تَصِحُّ الصَّلاةُ بِدُونِهَا الطَّهَارَةَ عَنِ الْحَدَثِ الأَكْبَرِ وَتُسَمَّى هَذِهِ الطَّهَارَةُ الْغُسْلَ وَالَّذِي يُوجِبُ ذَلِكَ خَمْسَةُ أَشْيَاءَ. الأَوَّلُ خُرُوجُ الْمَنِيِّ أَيْ ظُهُورُهُ إِلَى ظَاهِرِ الْحَشَفَةِ مِنَ الرَّجُلِ وَوُصُولُهُ إِلَى ظَاهِرِ فَرْجِ الْبِكْرِ أَوْ وُصُولُهُ إِلَى مَا يَظْهَرُ مِنْ فَرْجِ الثَّيِّبِ عِنْدَ قُعُودِهَا [أَيِ الْقُرْفُصَاء] عَلَى قَدَمَيْهَا لِقَضَاءِ الْحَاجَةِ أَوْ لِلِاسْتِنْجَاءِ فَمَا لَمْ يَصِلْ إِلَى ذَلِكَ فَلا يُوجِبُ الْغُسْلَ فَلَوْ وَقَفَ الْمَنِيُّ فِيمَا دُونَ ظَاهِرِ الْحَشَفَةِ مِنَ الرَّجُلِ لا يَجِبُ الْغُسْلُ عَلَيْهِ. وَكَذَلِكَ الْبِكْرُ إِذَا لَمْ يَظْهَرِ الْمَنِيُّ إِلَى ظَاهِرِ فَرْجِهَا لا يَجِبُ عَلَيْهَا الْغُسْلُ وَكَذَا الثَّيِّبُ فَلا يَجِبُ عَلَيْهَا الْغُسْلُ إِنْ لَمْ يَصِلْ مَنِيُّهَا إِلَى مَا يَظْهَرُ مِنْ فَرْجِهَا عِنْدَمَا تَقْعُدُ لِقَضَاءِ الْحَاجَةِ. وَلِلْمَنِيِّ ثَلاثُ عَلامَاتٍ يُعْرَفُ بِهَا إِحْدَاهَا التَّدَفُّقُ أَيِ الِانْصِبَابُ بِشِدَّةٍ شَيْئًا فَشَيْئًا وَثَانِيهَا التَّلَذُّذُ بِخُرُوجِهِ بِحَيْثُ يَعْقُبُهُ فُتُورُ الشَّهْوَةِ وَثَالِثُهَا رِيحُ الْعَجِينِ فِي حَالِ الرُّطُوبَةِ وَرِيحُ بَيَاضِ الْبَيْضِ بَعْدَ الْجَفَافِ وَهِيَ عَلامَاتٌ مُشْتَرَكَةٌ بَيْنَ الرِّجَالِ وَالنِّسَاءِ. وَمَنْ رَأَى مَنِيًّا فِي ثَوْبِهِ أَوْ فِي فِرَاشِهِ الَّذِي لا يَنَامُ فِيهِ غَيْرُهُ وَجَبَ عَلَيْهِ الْغُسْلُ وَإِعَادَةُ كُلِّ فَرْضٍ صَلَّاهُ إِذَا كَانَ لا يَحْتَمِلُ حُدُوثُهُ بَعْدَهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":314},{"type":"p","text":"   وَالثَّانِي الْجِمَاعُ وَهُوَ إِيلاجُ الْحَشَفَةِ أَوْ قَدْرِهَا مِنْ فَاقِدِهَا فِي فَرْجٍ وَلَوْ دُبُرًا. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":315},{"type":"p","text":"   وَالثَّالِثُ الْحَيْضُ وَهُوَ الدَّمُ الْخَارِجُ مِنْ رَحِمِ الْمَرْأَةِ عَلَى سَبِيلِ الصِّحَّةِ مِنْ غَيْرِ سَبَبِ الْوِلادَةِ وَإِمْكَانُهُ بُلُوغُ تِسْعِ سِنِينَ تَقْرِيبًا بِالسِّنِينَ الْقَمَرِيَّةِ. وَأَقَلُّهُ يَوْمٌ وَلَيْلَةٌ أَيْ مِقْدَارُ أَرْبَعٍ وَعِشْرِينَ سَاعَةً سَوَاءٌ كَانَ مُتَّصِلًا أَوْ مُتَقَطِّعًا فِي ظَرْفِ خَمْسَةَ عَشَرَ يَوْمًا فَلَوْ رَأَتْ سِتَّةَ أَيَّامٍ كُلَّ يَوْمٍ أَرْبَعَ سَاعَاتٍ دَمًا ثُمَّ انْقَطَعَ كَانَتْ تِلْكَ الْمُدَّةُ كُلُّهَا حَيْضًا. وَأَكْثَرُهُ خَمْسَةَ عَشَرَ يَوْمًا مَعَ أَوْقَاتِ النَّقَاءِ الَّتِي تَتَخَلَّلُهَا. وَغَالِبُهُ سِتَّةٌ أَوْ سَبْعَةٌ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":316},{"type":"p","text":"   وَالرَّابِعُ النِّفَاسُ وَهُوَ الدَّمُ الْخَارِجُ بَعْدَ خُرُوجِ الْوَلَدِ وَلَوْ مَجَّةً أَيْ قَدْرَ بَزْقَةٍ وَاحِدَةٍ وَهُوَ أَقَلُّ النِّفَاسِ وَأَكْثَرُهُ سِتُّونَ يَوْمًا وَغَالِبُهُ أَرْبَعُونَ يَوْمًا. وَالْمُوجِبُ لِلْغُسْلِ مِنَ الْحَيْضِ وَالنِّفَاسِ هُوَ انْقِطَاعُ الدَّمِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":317},{"type":"p","text":"   وَالْخَامِسُ الْوِلادَةُ وَلَوْ كَانَ الَّذِي خَرَجَ مِنْهَا عَلَقَةً أَوْ مُضْغَةً أَخْبَرَتِ الْقَوَابِلُ أَنَّهَا أَصْلُ ءَادَمِيٍّ وَلَوْ بِلا بَلَلٍ وَذَلِكَ لِأَنَّ الْوَلَدَ مَنِيٌّ مُنْعَقِدٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":318},{"type":"p","text":"   فَهَذَا الْقَدْرُ مِنَ الْعَدَدِ هُوَ بِالنِّسْبَةِ لِلْحَيِّ أَمَّا الْمَيِّتُ فَيَجِبُ غَسْلُهُ عَلَى الْمُكَلَّفِينَ لَيْسَ عَلَيْهِ لِأَنَّهُ خَرَجَ عَنِ التَّكْلِيفِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":319},{"type":"p","text":"   وَمِنْ مَسَائِلِ الْحَيْضِ أَنَّ الدَّمَ لا يُعْتَبَرُ حَيْضًا إِلَّا أَنْ تَرَاهُ الْمَرْأَةُ بَعْدَ تِسْعِ سِنِينَ قَمَرِيَّةٍ أَوْ قَبْلَهَا بِأَقَلَّ مِنْ سِتَّةَ عَشَرَ يَوْمًا كَمَا تَقَدَّمَ وَمَا سِوَى ذَلِكَ فَهُوَ دَمُ فَسَادٍ تَسْتَنْجِي مِنْهُ ثُمَّ تَتَوَضَّأُ فَتُصَلِّي. وَمِنْهَا أَنَّ الْمَرْأَةَ مَتَى مَا رَأَتِ الدَّمَ فِي وَقْتِ الْحَيْضِ تَتَجَنَّبُ مَا تَجْتَنِبُهُ الْحَائِضُ مِنْ صَوْمٍ وَصَلاةٍ وَوَطْءٍ وَغَيْرِ ذَلِكَ وَلا تَنْتَظِرُ بُلُوغَهُ يَوْمًا وَلَيْلَةً ثُمَّ إِنْ نَقَصَ عَنْ يَوْمٍ وَلَيْلَةٍ قَضَتْ مَا كَانَتْ قَدْ تَرَكَتْهُ مِنْ صَوْمٍ وَصَلاةٍ وَلا يَلْزَمُهَا غُسْلٌ عِنْدَ ذَلِكَ لِعَدَمِ الْحَيْضِ. وَمِنْهَا أَنَّهُ مَتَى مَا انْقَطَعَ الدَّمُ بَعْدَ بُلُوغِ أَقَلِّهِ أَيْ أَرْبَعٍ وَعِشْرِينَ سَاعَةً تَغْتَسِلُ وَتُصَلِّي وَتَصُومُ وَيَحِلُّ وَطْؤُهَا فَإِنْ عَادَ فِي زَمَنِ الْحَيْضِ تَبَيَّنَ وُقُوعُ عِبَادَتِهَا فِي الْحَيْضِ فَتُؤْمَرُ بِقَضَاءِ الصَّوْمِ فَقَطْ وَلا إِثْمَ بِالْوَطْءِ لِبِنَاءِ الأَمْرِ عَلَى الظَّاهِرِ وَإِذَا انْقَطَعَ حُكِمَ بِطُهْرِهَا وَهَكَذَا مَا لَمْ يَعْبُرْ خَمْسَةَ عَشَرَ يَوْمًا. وَمِنْهَا أَنَّ الِانْقِطَاعَ يُعْرَفُ بِأَنْ تَكُونَ بِحَيْثُ لَوْ أَدْخَلَتِ الْقُطْنَةَ فَرْجَهَا خَرَجَتْ بَيْضَاء وَلَيْسَ شَرْطًا أَنْ تَنْظُرَ كُلَّ سَاعَةٍ لِتَتَأَكَّدَ مِنْ نَقَائِهَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":320},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَفُرُوضُ الْغُسْلِ اثْنَانِ نِيَّةُ رَفْعِ الْحَدَثِ الأَكْبَرِ أَوْ نَحْوُهَا وَتَعْمِيمُ جَمِيعِ الْبَدَنِ بَشَرًا وَشَعَرًا وَإِنْ كَثُفَ بِالْمَاءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":321},{"type":"p","text":"   الشَّرْحُ فَرْضُ الْغُسْلِ يَحْصُلُ بِأَمْرَيْنِ الأَوَّلُ النِّيَّةُ فَيَنْوِي رَفْعَ الْحَدَثِ الأَكْبَرِ بِقَلْبِهِ أَوْ يَنْوِي رَفْعَ الْحَدَثِ أَوْ يَنْوِي فَرْضَ الْغُسْلِ أَوْ يَنْوِي الْغُسْلَ الْوَاجِبَ أَوْ مَا يَقُومُ مَقَامَ ذَلِكَ كَاسْتِبَاحَةِ الصَّلاةِ أَوِ الطَّوَافِ بِالْكَعْبَةِ بِخِلافِ نِيَّةِ الْغُسْلِ فَقَطْ أَوِ الطَّهَارَةِ فَقَطْ فَإِنَّ ذَلِكَ لا يَكْفِي. وَيَجِبُ قَرْنُ النِّيَّةِ الْقَلْبِيَّةِ بِأَوَّلِ مَغْسُولٍ فَلَوْ غَسَلَ بَعْضَ جِسْمِهِ بِدُونِ هَذِهِ النِّيَّةِ ثُمَّ نَوَى فِي أَثْنَاءِ الْغُسْلِ وَجَبَ إِعَادَةُ مَا غَسَلَ قَبْلَ النِّيَّةِ. وَالثَّانِي تَعْمِيمُ جَمِيعِ الْبَدَنِ أَيْ ظَاهِرِهِ بِالْمَاءِ فَيَجِبُ تَعْمِيمُ الْبَشَرِ أَيِ الْجِلْدِ وَالشَّعَرِ ظَاهِرِهِ وَبَاطِنِهِ، وَيَجِبُ إِيصَالُ الْمَاءِ إِلَى مَا يَظْهَرُ مِنَ الصِّمَاخِ أَيْ خَرْقِ الأُذُنِ لا بَاطِنِ فَمٍ وَأَنْفٍ فَإِنَّ ذَلِكَ لا يَجِبُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":322},{"type":"p","text":"   وَيَنْبَغِي الِاعْتِنَاءُ بِالطَّهَارَتَيْنِ الْوُضُوءِ وَالْغُسْلِ لِقَوْلِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «الطُّهُورُ شَطْرُ الإِيمَانِ» أَيْ نِصْفُ الإِيْمَانِ، رَوَاهُ مُسْلِمٌ، وَلا يُتْقِنُ صَلاتَهُ مَنْ لا يُتْقِنُ طَهَارَتَهُ أَيْ مَنْ كَانَ لا يُؤَدِّي طَهَارَتَهُ عَلَى الْوَجْهِ التَّامِّ لا يَكُونُ مُؤَدِيًّا صَلاتَهُ عَلَى التَّمَامِ بَلْ لا بُدَّ مِنْ أُمُورٍ تَنْقُصُهُ قَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [سُورَةَ الْبَقَرَةِ/222].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":323},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":324},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ شُرُوطِ الطَّهَارَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":325},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: شُرُوطُ الطَّهَارَةِ الإِسْلامُ وَالتَّمْيِيزُ وَعَدَمُ الْمَانِعِ مِنْ وُصُولِ الْمَاءِ إِلَى الْمَغْسُولِ وَالسَّيَلانُ وَأَنْ يَكُونَ الْمَاءُ مُطَهِّرًا بِأَنْ لا يُسْلَبَ اسْمَهُ بِمُخَالَطَةِ طَاهِرٍ يَسْتَغْنِي الْمَاءُ عَنْهُ وَأَنْ لا يَتَغَيَّرَ بِنَجِسٍ وَلَوْ تَغَيُّرًا يَسِيرًا. وَإِنْ كَانَ الْمَاءُ دُونَ الْقُلَّتَيْنِ اشْتُرِطَ أَنْ لا يُلاقِيَهُ نَجَسٌ غَيْرُ مَعْفُوٍّ عَنْهُ وَأَنْ لا يَكُونَ اسْتُعْمِلَ فِي رَفْعِ حَدَثٍ أَوْ إِزَالَةِ نَجِسٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":326},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ شُرُوطِ الطَّهَارَةِ عَنِ الْحَدَثِ الأَصْغَرِ وَالأَكْبَرِ الإِسْلامَ فَالْكَافِرُ لا تَصِحُّ طَهَارَتُهُ مِنَ الْحَدَثَيْنِ لِعَدَمِ صِحَّةِ نِيَّتِهِ وَالتَّمْيِيزَ فَغَيْرُ الْمُمَيِّزِ لا تَصِحُّ طَهَارَتُهُ. وَيُسْتَثْنَى مِنِ اشْتِرَاطِ الإِسْلامِ لِلطَّهَارَةِ غُسْلُ الزَّوْجَةِ الْكَافِرَةِ بِلا نِيَّةٍ لِتَحِلَّ لِزَوْجِهَا الْمُسْلِمِ مِنْ حَيْضِهَا أَوْ نِفَاسِهَا فَإِنَّهُ يَصِحُّ لِلضَّرُورَةِ بِلا نِيَّةٍ مِنْهَا فَالْكِتَابِيَّةُ عِنْدَمَا تَغْتَسِلُ مِنَ الْحَيْضِ لِتَحِلَّ لِزَوْجِهَا الْمُسْلِمِ لا تَنْوِي شَيْئًا ثُمَّ لَوْ أَسْلَمَتْ وَجَبَ عَلَيْهَا إِعَادَةُ ذَلِكَ الْغُسْلِ. وَكَذَلِكَ غُسْلُ الصَّبِيِّ غَيْرِ الْمُمَيِّزِ لِلطَّوَافِ فَإِنَّهُ يَصِحُّ وَكَذَا يُوَضِئُهُ وَلِيُّهُ لِلطَّوَافِ وَتَقُومُ نِيَّةُ الْوَلِيِّ مَقَامَ نِيَّةِ الطِّفْلِ. وَيُشْتَرَطُ عَدَمُ الْمَانِعِ مِنْ وُصُولِ الْمَاءِ إِلَى الْعُضْوِ الْمَغْسُولِ أَوِ الْمَمْسُوحِ كَالشَّحْمِ اللَّاصِقِ بِالْجِلْدِ الَّذِي يَمْنَعُ وُصُولَ الْمَاءِ إِلَيْهِ وَكَالَّذِي تَضَعُهُ النِّسَاءُ عَلَى أَظَافِيرِهِنَّ الْمُسَمَّى بِالْمَنَكِيرِ. وَأَمَّا الْوَسَخُ الَّذِي يَكُونُ تَحْتَ الأَظْفَارِ فَقَدِ اخْتُلِفَ هَلْ يَمْنَعُ صِحَّةَ الطَّهَارَةِ أَوْ لا وَقَدْ تَقَدَّمَ. أَمَّا مَا يَسْتُرُ لَوْنَ الْبَشَرَةِ وَلا يَمْنَعُ الْمَاءَ مِنَ الْوُصُولِ إِلَى الْجِلْدِ فَلا يَضُرُّ كَالْحِبْرِ وَمَا يُسَمَّى بِالدَّوَاءِ الأَحْمَرِ وَالْحِنَّاءِ وَنَحْوِهَا. وَيُشْتَرَطُ السَّيَلانُ وَهُوَ أَنْ يَكُونَ الْمَاءُ جَارِيًا عَلَى الْجِلْدِ بِطَبْعِهِ وَلا يُشْتَرَطُ فِيهِ تَقَاطُرُ الْمَاءِ فَلَوْ جَرَى الْمَاءُ عَلَى الْجِلْدِ وَلَوْ بِوَاسِطَةِ إِمْرَارِ الْيَدِ أَجْزَأَ فَلا يُجْزِئُ مُجَرَّدُ الْمَسْحِ الَّذِي لا يُسَمَّى غَسْلًا. وَيُشْتَرَطُ أَنْ يَكُونَ الْمَاءُ مُطَهِّرًا مُطْلَقًا يُطْلَقُ اسْمُ الْمَاءِ عَلَيْهِ بِلا قَيْدٍ فَمَا لا يُسَمَّى إِلَّا مَاءَ الزَّهْرِ مَثَلًا لا يَكُونُ مُطَهِّرًا فَالْمُرَادُ بِقَوْلِهِمْ طَاهِرٌ مُطَهِّرٌ هُوَ مَا يَصِحُّ إِطْلاقُ اسْمِ الْمَاءِ عَلَيْهِ بِلا قَيْدٍ كَمَاءِ الْبَحْرِ وَمَاءِ الْبَرَدِ وَالثَّلْجِ بَعْدَ أَنْ يَذُوبَا. وَمَا تَغَيَّرَ بِطَاهِرٍ مُخَالِطٍ أَيْ لا يَنْفَصِلُ فِي رَأْيِ الْعَيْنِ عَنْهُ بَعْدَ مُخَالَطَتِهِ مِمَّا يُمْكِنُ [أَيْ لا يَشُقُّ وَلا يَعْسُرُ] صَوْنُ الْمَاءِ عَنْهُ فَلَيْسَ بِطَهُورٍ صَالِحٍ لِلْوُضُوءِ وَالْغُسْلِ وَإِزَالَةِ النَّجَاسَةِ إِنْ كَانَ تَغَيُّرُهُ بِهِ بِحَيْثُ يَسْلُبُ اسْمَ الْمَاءِ عَنْهُ أَيْ خَالَطَهُ طَاهِرٌ بِحَيْثُ غَيَّرَ لَوْنَهُ كَالْحِبْرِ أَوْ طَعْمَهُ كَالْعَسَلِ أَوْ ريِحَهُ كَمَاءِ الْوَرْدِ تَغْيِيرًا كَثِيرًا فَلَيْسَ مُطَهِّرًا بِخِلافِ مَا لَوْ غَيَّرَهُ قَلِيلًا فَإِنَّهُ لا يُؤَثِّرُ أَيْ إِنْ كَانَ تَغَيُّرُهُ بِهِ بِحَيْثُ لا يَسْلُبُ عَنْهُ اسْمَ الْمَاءِ فَهُوَ طَهُورٌ تَصِحُّ الطَّهَارَةُ بِهِ. وَلَوْ تَغَيَّرَ الْمَاءُ تَغَيُّرًا كَثِيرًا بِمَا لا يُمْكِنُ صَوْنُ الْمَاءِ عَنْهُ أَيْ يَشُقُّ أَوْ يَعْسُرُ لَمْ يُؤَثِّرْ ذَلِكَ كَالْمَاءِ الَّذِي مَقَرُّهُ فِيهِ مَعْدِنٌ مِنَ الْمَعَادِنِ كَالْكِبْرِيتِ فَمَهْمَا تَغَيَّرَ هَذَا الْمَاءُ بِهِ فَلا يَخْرُجُ عَنْ كَوْنِهِ مُطَهِّرًا. وَكَذَلِكَ لا يَضُرُّ التَّغَيُّرُ بِمَا لا يُخَالِطُ الْمَاءَ بَلْ يُجَاوِرُهُ كَالْمَاءِ الَّذِي تَتَغَيَّرُ رَائِحَتُهُ بِالْعُودِ الصُّلْبِ الَّذِي لا يَتَحَلَّلُ فِي الْمَاءِ لِأَنَّ هَذَا الْعُودَ الَّذِي يُتَبَخَّرُ بِهِ إِذَا وُضِعَ فِي الْمَاءِ لا يَنْحَلُّ مِنْهُ شَىْءٌ فِي الْمَاءِ فَإِذَا صَارَتْ رَائِحَةُ الْمَاءِ عَطِرَةً جَازَتِ الطَّهَارَةُ بِذَلِكَ الْمَاءِ. وَيُشْتَرَطُ لِصِحَّةِ الطَّهَارَةِ بِالْمَاءِ إِنْ كَانَ دُونَ الْقُلَّتَيْنِ أَنْ لا يُلاقِيَهُ نَجِسٌ فَالْمَاءُ الَّذِي لاقَاهُ نَجِسٌ غَيْرُ مَعْفُوٍّ عَنْهُ كَالْبَوْلِ لَيْسَ بِطَاهِرٍ إِنْ كَانَ دُونَ الْقُلَّتَيْنِ غَيَّرَهُ النَّجَسُ أَوْ لَمْ يُغَيِّرْهُ. وَإِنْ كَانَ الْمَاءُ قُلَّتَيْنِ فَأَكْثَرَ فَلا يَضُرُّ مُلاقَاةُ النَّجَاسَةِ لَهُ إِلَّا أَنْ يَتَغَيَّرَ الْمَاءُ بِهَا أَيْ بِأَنْ يَظْهَرَ فِيهِ طَعْمُ النَّجَاسَةِ أَوْ لَوْنُهَا أَوْ ريِحُهَا. وَكَذَلِكَ إِذَا اسْتُعْمِلَ مَاءٌ دُونَ الْقُلَّتَيْنِ فِي رَفْعِ حَدَثٍ أَوْ إِزَالَةِ نَجِسٍ مَعْفُوًّا عَنْهُ كَانَ أَوْ لا فَإِنَّهُ لا يَصْلُحُ لِلطَّهَارَةِ بِخِلافِ الْمَاءِ الَّذِي يَبْلُغُ الْقُلَّتَيْنِ فَإِنَّهُ لا يَخْرُجُ عَنْ كَوْنِهِ طَهُورًا بِاسْتِعْمَالِهِ فِي رَفْعِ حَدَثٍ أَوْ إِزَالَةِ نَجِسٍ إِذَا لَمْ يَتَغَيَّرْ بِالنَّجَاسَةِ أَيْ أَنَّهُ يَبْقَى طَهُورًا مُطَهِّرًا وَلَوْ تَكَرَّرَ ذَلِكَ. وَالْقُلَّتَانِ بِالْمُرَبَّعِ مَا تَسَعُهُ حُفْرَةٌ طُولُهَا ذِرَاعٌ وَرُبْعٌ وَكَذَلِكَ عَرْضُهَا وَعُمْقُهَا وَبِالْمُدَوَّرِ مَا تَسَعُهُ حُفْرَةٌ عَرْضُهَا ذِرَاعٌ وَعُمْقُهَا ذِرَاعَانِ وَنِصْفٌ بِالذِّرَاعِ الْمُعْتَدِلِ وَهُوَ نَحْوُ عَشْرِ صَفَائِحَ مِنَ الْمَاءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":327},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَنْ لَمْ يَجِدِ الْمَاءَ أَوْ كَانَ يَضُرُّهُ الْمَاءُ تَيَمَّمَ بَعْدَ دُخُولِ الْوَقْتِ وَزَوَالِ النَّجَاسَةِ الَّتِي لا يُعْفَى عَنْهَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":328},{"type":"p","text":"   الشَّرْحُ مَنْ فَقَدَ الْمَاءَ بِأَنْ فَقَدَهُ حِسًّا أَوْ مَعْنًى يَجُوزُ لَهُ التَّيَمُّمُ. أَمَّا الْفَقْدُ الْحِسِّيُّ فَهُوَ أَنْ لا يَجِدَ الْمَاءَ مَعَهُ وَلا مَعَ رُفْقَتِهِ وَلا فِي الْقَدْرِ الَّذِي يَجِبُ الطَّلَبُ فِيهِ مِنَ الْمِسَاحَةِ وَهُوَ حَدُّ الْقُرْبِ فَإِنْ كَانَ الْمَاءُ فِي مَسَافَةٍ تَبْعُدُ عَنِ الْمَكَانِ الَّذِي هُوَ فِيهِ فَوْقَ حَدِّ الْقُرْبِ فَإِنَّهُ لا يَجِبُ طَلَبُهُ فِي هَذِهِ الْحَالَةِ. وَحَدُّ الْقُرْبِ قُدِّرَ بِنَحْوِ نِصْفِ فَرْسَخٍ [وَالْفَرْسَخُ ثَلاثَةُ أَمْيَالٍ] فَمَنْ عَلِمَ وُجُودَهُ أَيْ عَلِمَ بِوُجُودِ الْمَاءِ فِي حَدِّ الْقُرْبِ فَإِنَّهُ يُعَدُّ وَاجِدًا لِلْمَاءِ فَلا يَصِحُّ تَيَمُّمُهُ. وَأَمَّا إِنْ لَمْ يَتَأَكَّدْ مِنْ وُجُودِ الْمَاءِ بَلْ كَانَ عِنْدَهُ احْتِمَالٌ فَقَطْ فَيَجِبُ عَلَيْهِ الطَّلَبُ فِي حَدِّ الْغَوْثِ وَهُوَ الْمَسَافَةُ الَّتِي يُسْمِعُ فِيهَا رُفَقَاءَهُ لَوْ نَادَى وَقُدِّرَتْ هَذِهِ الْمَسَافَةُ بِثَلاثِمِائَةِ ذِرَاعٍ شَرْعِيٍّ وَهُوَ أَيِ الذِّرَاعُ مِقْدَارُ شِبْرَيْنِ فَإِنْ لَمْ يَجِدِ الْمَاءَ فَهَذَا يُعَدُّ فَاقِدًا لَهُ. وَأَمَّا الْفَقْدُ الْمَعْنَوِيُّ فَهُوَ كَأَنْ يَحُولَ بَيْنَهُ وَبَيْنَ الْمَاءِ الَّذِي هُوَ بِالْقُرْبِ مِنْهُ سَبُعٌ أَوْ عَدُوٌّ وَكَأَنْ يَحْتَاجَ الْمَاءَ لِشُرْبِهِ أَوْ لِشُرْبِ حَيَوَانِهِ الْمُحْتَرَمِ فَيَصِحُّ لَهُ التَّيَمُّمُ مَعَ وُجُودِ الْمَاءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":329},{"type":"p","text":"   وَمَنْ تَيَمَّمَ بِدُونِ طَلَبٍ أَيْ فِي الْمَوْضِعِ الَّذِي يَجِبُ فِيهِ الطَّلَبُ فَلا يَصِحُّ تَيَمُّمُهُ لِقَوْلِهِ تَعَالَى ﴿فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا﴾ [سُورَةَ الْمَائِدَةِ/6] وَأَمَّا الضَّرَرُ الَّذِي يُبِيحُ التَّيَمُّمَ فَهُوَ أَنْ يَخَافَ عَلَى نَفْسِهِ مِنِ اسْتِعْمَالِ الْمَاءِ أَنْ يَضُرَّهُ فِي جِسْمِهِ أَوْ عَلَى عُضْوٍ مِنْ أَعْضَائِهِ أَوْ طُولَ مَرَضِهِ أَمَّا مُجَرَّدُ الأَلَمِ مِنْ بَرْدِ الْمَاءِ فَلَيْسَ عُذْرًا إِذَا كَانَ لا يُعْقِبُ ضَرَرًا. وَلا يَصِحُّ التَّيَمُّمُ إِلَّا بَعْدَ دُخُولِ الْوَقْتِ فَلَوْ تَيَمَّمَ لِلظُّهْرِ قَبْلَ الزَّوَالِ لَمْ يَصِحَّ تَيَمُّمُهُ. وَيُشْتَرَطُ أَيْضًا أَنْ يَكُونَ بَعْدَ إِزَالَةِ النَّجَاسَةِ إِنْ كَانَتْ بِبَدَنِهِ فَلَوْ تَيَمَّمَ قَبْلَ ذَلِكَ لَمْ يَصِحَّ. فَإِنْ لَمْ يَتَمَكَّنْ مِنْ إِزَالَةِ النَّجَاسَةِ بِسَبَبِ فَقْدِ الْمَاءِ فَحُكْمُهُ كَحُكْمِ فَاقِدِ الطَّهُورَيْنِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":330},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: بِتُرَابٍ خَالِصٍ طَهُورٍ لَهُ غُبَارٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":331},{"type":"p","text":"   الشَّرْحُ التَّيَمُّمُ لا يَصِحُّ إِلَّا بِالتُّرَابِ الَّذِي لَهُ غُبَارٌ وَيُشْتَرَطُ أَنْ يَكُونَ خَالِصًا مِنْ نَحْوِ الرَّمَادِ وَأَنْ يَكُونَ طَهُورًا لا مُتَنَجِّسًا بِنَحْوِ بَوْلٍ وَلا مُسْتَعْمَلًا فِي تَيَمُّمٍ بِأَنْ يَكُونَ تَنَاثَرَ مِنَ الْعُضْوِ عِنْدَ التَّيَمُّمِ فَإِنْ كَانَ اسْتُعِمَلَ لِلتَّيَمُّمِ بِأَنْ تَنَاثَرَ مِنَ الْوَجْهِ مَثَلًا فَهُوَ غَيْرُ صَالِحٍ لِلتَّيَمُّمِ مَرَّةً ثَانِيَةً. وَلا يُجْزِئُ الْحَجَرُ وَيُجْزِئُ فِي بَعْضِ الْمَذَاهِبِ وَفِي ذَلِكَ تَيْسِيرٌ وَفُسْحَةٌ فَيَجُوزُ لِلشَّافِعِيِّ أَنْ يُقَلِّدَ فِي ذَلِكَ غَيْرَ الإِمَامِ الشَّافِعِيِّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":332},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فِي الْوَجْهِ وَالْيَدَيْنِ يُرَتِّبُهُمَا بِضَرْبَتَيْنِ بِنِيَّةِ اسْتِبَاحَةِ فَرْضِ الصَّلاةِ مَعَ النَّقْلِ وَمَسْحِ أَوَّلِ الْوَجْهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":333},{"type":"p","text":"   الشَّرْحُ مَحَلُّ التَّيَمُّم ِالْوَجْهُ وَالْيَدَانِ إِلَى الْمِرْفَقَيْنِ كَالْوُضُوءِ وَيُقَدِّمُ مَسْحَ الْوَجْهِ وُجُوبًا عَلَى مَسْحِ الْيَدَيْنِ. وَلا بُدَّ فِيهِ مِنَ النَّقْلِ وَيَجِبُ أَنْ يَكُونَ النَّقْلُ إِلَى الْوَجْهِ بِنِيَّةٍ مُجْزِئَةٍ كَنِيَّةِ اسْتِبَاحَةِ فَرْضِ الصَّلاةِ. وَالنَّقْلُ مَعْنَاهُ تَحْوِيلُ التُّرَابِ إِلَى عُضْوِ التَّيَمُّمِ فَيَكُونُ مَرَّتَيْنِ عَلَى الأَقَلِّ. وَالَّذِي يُبْطِلُ التَّيَمُّمَ ثَلاثَةُ أَشْيَاءَ مَا أَبْطَلَ الْوُضُوءَ وَرُؤْيَةُ الْمَاءِ فِي غَيْرِ وَقْتِ الصَّلاةِ [أَمَّا إِذَا رَأَى الْمَاءَ فِي أَثْنَاءِ الصَّلاةِ فَإِنْ كَانَ الْمَوْضِعُ الَّذِي تَيَمَّمَ فِيهِ يَغْلِبُ فِيهِ وُجُودُ الْمَاءِ بَطَلَتْ صَلاتُهُ وَإِلَّا فَلا] وَالرِّدَّةُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":334},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":335},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مَا يَحْرُمُ عَلَى الْمُحْدِثِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":336},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَنِ انْتَقَضَ وُضُوؤُهُ حَرُمَ عَلَيْهِ الصَّلاةُ وَالطَّوَافُ وَحَمْلُ الْمُصْحَفِ وَمَسُّهُ وَيُمَكَّنُ مِنْ ذَلِكَ الصَّبِيُّ لِلدِّرَاسَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":337},{"type":"p","text":"   الشَّرْحُ الْحَدَثُ الأَصْغَرُ يُحَرِّمُ الصَّلاةَ وَلَوْ صَلاةَ جِنَازَةٍ. وَيُحَرِّمُ الْحَدَثُ أَيْضًا الطَّوَافَ بِالْبَيْتِ إِنْ كَانَ طَوَافَ الْفَرْضِ أَوْ طَوَافَ التَّطَوُّعِ. وَيُحَرِّمُ أَيْضًا حَمْلَ الْمُصْحَفِ وَكَذَلِكَ مَا كُتِبَ مِنَ الْقُرْءَانِ لِلدِّرَاسَةِ وَلا يُحَرِّمُ مَا كُتِبَ لِحِرْزٍ. وَكَذَلِكَ يُحَرِّمُ الْحَدَثُ مَسَّ الْمُصْحَفِ أَيْ وَرَقِهِ وَجِلْدِهِ الْمُتَّصِلِ بِهِ وَحَوَاشِيهِ إِلَّا لِضَرُورَةٍ كَخَوْفِ تَنَجُّسِهِ وَيُسْتَثْنَى مِنْ ذَلِكَ الصَّبِيُّ فَإِنَّهُ يُمَكَّنُ مِنْ مَسِّهِ وَحَمْلِهِ مَعَ الْحَدَثِ لِغَرَضِ الدِّرَاسَةِ وَالتَّعَلُّمِ فِيهِ لِمَشَقَّةِ دَوَامِ طُهْرِهِ لَكِنْ يُشْتَرَطُ أَنْ يَكُونَ الصَّبِيُّ مُمَيِّزًا فَلا يُمَكَّنُ غَيْرُ الْمُمَيِّزِ مِنْ ذَلِكَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":338},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَحْرُمُ عَلَى الْجُنُبِ هَذِهِ وَقِرَاءَةُ الْقُرْءَانِ وَالْمُكْثُ فِي الْمَسْجِدِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":339},{"type":"p","text":"   الشَّرْحُ الْجُنُبُ يَزِيدُ عَلَى الْمُحْدِثِ حُرْمَةَ قِرَاءَةِ الْقُرْءَانِ وَلَوْ حَرْفًا مِنْهُ بِقَصْدِ الْقِرَاءَةِ وَحْدَهَا أَوْ مَعَ غَيْرِهَا فَإِنْ قَصَدَ الذِّكْرَ جَازَ لَهُ. وَيَزِيدُ أَيْضًا حُرْمَةَ الْمُكْثِ فِي الْمَسْجِدِ أَوِ التَّرَدُّدِ فِيهِ. رَوَى أَبُو دَاوُدَ فِي السُّنَنِ أَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «إِنِّي لا أُحِلُّ الْمَسْجِدَ لِحَائِضٍ وَلا جُنُبٍ» وَهُوَ حَدِيثٌ ثَابِتٌ. وَيُخَصُّ مِنْ ذَلِكَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَإِنَّهُ يَجُوزُ لَهُ الْمُكْثُ فِي الْمَسْجِدِ مَعَ الْجَنَابَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":340},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَلَى الْحَائِضِ وَالنُّفَسَاءِ هَذِهِ وَالصَّوْمُ قَبْلَ الِانْقِطَاعِ وَتَمْكِينُ الزَّوْجِ وَالسَّيِّدِ مِنَ الِاسْتِمْتَاعِ بِمَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ قَبْلَ الْغُسْلِ وَقِيلَ لا يَحْرُمُ إِلَّا الْجِمَاعُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":341},{"type":"p","text":"   الشَّرْحُ الْحَائِضُ وَالنُّفَسَاءُ يَحْرُمُ عَلَيْهِمَا مَا يَحْرُمُ عَلَى الْجُنُبِ وَتَزِيدَانِ تَحْرِيمَ الصَّوْمِ قَبْلَ الِانْقِطَاعِ أَمَّا بَعْدَ الِانْقِطَاعِ فَيَحِلُّ لَهُمَا وَلَوْ قَبْلَ الْغُسْلِ، وَتَحْرِيمَ تَمْكِينِ الزَّوْجِ وَالسَّيِّدِ أَيْ سَيِّدِ الأَمَةِ الْمَمْلُوكَةِ مِنَ الِاسْتِمْتَاعِ بِمَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ بِلا حَائِلٍ أَمَّا بِحَائِلٍ فَيَجُوزُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":342},{"type":"p","text":"   وَأَمَّا الْمُرُورُ فِي الْمَسْجِدِ كَأَنْ كَانَ لِلْمَسْجِدِ بَابَانِ يُدْخَلُ مِنْ أَحَدِهِمَا وَيُخْرَجُ مِنَ الآخَرِ مِنْ دُونِ تَوَقُّفٍ وَلا تَرَدُّدٍ فَيَجُوزُ إِلَّا أَنْ تَخَافَا تَلْوِيثَهُ بِالدَّمِ، فَإِنْ أَمِنَتَا التَّلْوِيثَ كُرِهَ الْمُرُورُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":343},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":344},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ اشْتِرَاطِ الطَّهَارَةِ عَنِ النَّجَاسَةِ فِي الصَّلاةِ وَلِكَيْفِيَّةِ إِزَالَةِ النَّجَاسَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":345},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ شُرُوطِ الصَّلاةِ الطَّهَارَةُ عَنِ النَّجَاسَةِ فِي الْبَدَنِ وَالثَّوْبِ وَالْمَكَانِ وَالْمَحْمُولِ لَهُ كَقِنِّينَةٍ يَحْمِلُهَا فِي جَيْبِهِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":346},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ الصَّلاةِ الطَّهَارَةُ عَنِ النَّجَاسَةِ فِي الْبَدَنِ كَدَاخِلِ الْفَمِ وَالأَنْفِ وَالْعَيْنِ وَفِي الثَّوْبِ وَالْمَحْمُولِ لَهُ كَالشَّىْءِ الَّذِي يَحْمِلُهُ فِي جَيْبِهِ سَوَاءٌ كَانَ قِنِّينَةً أَوْ وَرَقَةً أَوْ غَيْرَ ذَلِكَ. وَكَذَلِكَ يُشْتَرَطُ طَهَارَةُ الْمَكَانِ الَّذِي يُلاقِي بَدَنَهُ أَيْ يُمَاسُّ ذَلِكَ فَلا تَضُرُّ الْمُحَاذَاةُ بِلا مُمَاسَّةٍ فَلَوْ كَانَ يُحَاذِي بِصَدْرِهِ نَجَاسَةً فَإِنَّ ذَلِكَ لا يَضُرُّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":347},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَإِنْ لاقَاهُ نَجَسٌ أَوْ مَحْمُولَهُ بَطَلَتْ صَلاتُهُ إِلَّا أَنْ يُلْقِيَهُ حَالًا أَوْ يَكُونَ مَعْفُوًّا عَنْهُ كَدَمِ جُرْحِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":348},{"type":"p","text":"   الشَّرْحُ أَنَّ مَنْ طَرَأَ لَهُ فِي الصَّلاةِ نَجَسٌ غَيْرُ مَعْفُوٍّ عَنْهُ لاقَاهُ أَوْ لاقَى ثَوْبَهُ أَوْ شَيْئًا يَحْمِلُهُ بَطَلَتْ صَلاتُهُ إِلَّا أَنْ يُلْقِيَهُ حَالًا بِأَنْ كَانَ يَابِسًا فَأَلْقَاهُ لا بِيَدِهِ أَوْ كُمِّهِ بَلْ بِنَفْضِ ثَوْبِهِ مَثَلًا أَوْ كَانَ رَطْبًا فَأَلْقَى الْمَحْمُولَ فِي الْحَالِ مِنْ غَيْرِ حَمْلٍ وَنَحْوِهِ فَلا تَبْطُلُ صَلاتُهُ. أَمَّا لَوْ أَزَالَ النَّجَسَ الْيَابِسَ بِيَدِهِ أَوْ كُمِّهِ أَوْ أَلْقَى عَيْنَ النَّجَاسَةِ الرَّطْبَةِ مَعَ إِبْقَاءِ مَا تَضَمَّخَ بِالنَّجَاسَةِ عَلَيْهِ فَسَدَتْ صَلاتُهُ. وَيُسْتَثْنَى مِنْ مُلاقَاةِ النَّجَسِ وَهُوَ فِي الصَّلاةِ دَمُ جُرْحِهِ فَإِنَّهُ يُعْفَى عَنْهُ أَيْ يُسَامَحُ فِيهِ وَلَوْ سَالَ وَلَوَّثَ الثَّوْبَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":349},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ إِزَالَةُ نَجِسٍ لَمْ يُعْفَ عَنْهُ بِإِزَالَةِ الْعَيْنِ مِنْ طَعْمٍ وَلَوْنٍ وَرِيحٍ بِالْمَاءِ الْمُطَهِّرِ، وَالْحُكْمِيَّةِ بِجَرْيِ الْمَاءِ عَلَيْهَا وَالنَّجَاسَةُ الْحُكْمِيَّةُ هِيَ الَّتِي لا يُدْرَكُ لَهَا لَوْنٌ وَلا طَعْمٌ وَلا رِيحٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":350},{"type":"p","text":"   الشَّرْحُ يُشْتَرَطُ لِصِحَّةِ الصَّلاةِ إِزَالَةُ النَّجَسِ غَيْرِ الْمَعْفُوِّ عَنْهُ أَمَّا الْمَعْفُوُّ عَنْهُ فَلا يُشْتَرَطُ كَدَمِ جُرْحِهِ. وَقَدْ ذَكَرَ الْمُؤَلِّفُ هُنَا أَنَّ إِزَالَةَ النَّجَاسَةِ تَكُونُ بِإِزَالَةِ عَيْنِهَا وَالْمُرَادُ هُنَا إِزَالَةُ جِرْمِهَا وَأَوْصَافِهَا مِنْ طَعْمٍ وَلَوْنٍ وَرِيحٍ فَبَعْدَ إِزَالَةِ جِرْمِهَا يُشْتَرَطُ إِزَالَةُ أَوْصَافِهَا أَيِ اللَّوْنِ وَالطَّعْمِ وَالرَّائِحَةِ. وَأَمَّا أَثَرُ لَوْنِ النَّجَاسَةِ الَّذِي يَبْقَى عَلَى الثَّوْبِ بَعْدَ غَسْلِهِ جَيِّدًا فَلا يَضُرُّ بَلْ يُعْفَى عَنْهُ [وَالْمُرَادُ هُنَا أَنَّهُ يَطْهُرُ] وَتَصِحُّ الصَّلاةُ مَعَ وُجُودِهِ [وَمِثْلُ اللَّوْنِ الرِّيحُ فَلا تَجِبُ إِزَالَتُهُ إِنْ عَسُرَ فَإِنِ اجْتَمَعَ بَقَاءُ اللَّوْنِ وَالرِّيحِ وَجَبَ إِزَالَتُهُمَا مُطْلَقًا لِقُوَّةِ دِلالَتِهِمَا عَلَى بَقَاءِ الْعَيْنِ، كَمَا يَدُلُّ عَلَى بَقَائِهَا بَقَاءُ الطَّعْمِ وَحْدَهُ وَإِنْ عَسُرَ زَوَالُهُ]. وَقَوْلُهُ «بِالْمَاءِ الْمُطَهِّرِ» يُفْهَمُ مِنْهُ أَنَّ الشَّمْسَ وَالرِّيحَ لا تُطَهِّرَانِ بَلْ الْمُطَهِّرُ هُوَ الْمَاءُ. وَقَوْلُهُ «وَالْحُكْمِيَّةِ بِجَرْيِ الْمَاءِ عَلَيْهَا» يُرِيدُ بِهِ أَنَّ النَّجَاسَةَ الْحُكْمِيَّةَ وَهِيَ الَّتِي لا يُدْرَكُ لَهَا جِرْمٌ وَلا وَصْفٌ كَبَوْلٍ جَفَّ لا رِيحَ لَهُ وَلا طَعْمَ وَلا لَوْنَ تَحْصُلُ إِزَالَتُهَا بِجَرْيِ الْمَاءِ عَلَيْهَا مَرَّةً وَاحِدَةً. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":351},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْكَلْبِيَّةِ بِغَسْلِهَا سَبْعًا إِحْدَاهُنَّ مَمْزُوجَةٌ بِالتُّرَابِ الطَّهُورِ، وَالْمُزِيلَةُ لِلْعَيْنِ وَإِنْ تَعَدَّدَتْ وَاحِدَةٌ. وَيُشْتَرَطُ وُرُودُ الْمَاءِ إِنْ كَانَ قَلِيلًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":352},{"type":"p","text":"   الشَّرْحُ النَّجَاسَةُ الْكَلْبِيَّةُ وَكَذَلِكَ الْخِنْزِيرِيَّةُ تُزَالُ بِغَسْلِهَا سَبْعَ مَرَّاتٍ إِحْدَاهُنَّ مَمْزُوجَةٌ بِالتُّرَابِ الطَّهُورِ كَأَنْ يُوضَعَ التُّرَابُ فِي الْمَاءِ فَيُكَدِّرَهُ فَإِذَا وَصَلَ هَذَا الْمَاءُ الَّذِي كَدَّرَهُ إِلَى جَمِيعِ الْمَحَلِّ الَّذِي أَصَابَتْهُ النَّجَاسَةُ الْكَلْبِيَّةُ أَوِ الْخِنْزِيرِيَّةُ أَجْزَأَ وَكَذَلِكَ لَوْ كَانَتِ الْمَرَّاتُ السَّبْعُ الَّتِي غُسِلَ بِهَا مَمْزُوجَةً بِالتُّرَابِ صَحَّ لِأَنَّ الْمَاءَ لَوْ دَخَلَهُ التُّرَابُ يَبْقَى طَهُورًا. وَمَا يُزِيلُ الْجِرْمَ مَعَ الْوَصْفِ مِنَ الْغَسَلاتِ يُعَدُّ غَسْلَةً وَاحِدَةً. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":353},{"type":"p","text":"   ثُمَّ بَيَّنَ أَنَّهُ يُشْتَرَطُ فِي طُهْرِ الْمُتَنَجِّسِ مُطْلَقًا وُرُودُ الْمَاءِ عَلَى الْمُتَنَجِّسِ إِنْ كَانَ الْمَاءُ دُونَ الْقُلَّتَيْنِ وَلا فَرْقَ بَيْنَ الْمُنْصَبِّ مِنْ نَحْوِ أُنْبُوبَةٍ وَصَاعِدٍ مِنْ نَحْوِ فَوَّارَةٍ فَإِنْ وَرَدَ الْمُتَنَجِّسُ عَلَى الْمَاءِ الَّذِي هُوَ دُونَ الْقُلَّتَيْنِ تَنَجَسَّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":354},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":355},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ شُرُوطِ صِحَّةِ الصَّلاةِ زِيَادَةً عَلَى الطَّهَارَةِ مِنَ الْحَدَثِ وَعَنِ النَّجَاسَةِ وَلِبَيَانِ مُبْطِلاتِ الصَّلاةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":356},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ شُرُوطِ الصَّلاةِ اسْتِقْبَالُ الْقِبْلَةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":357},{"type":"p","text":"   الشَّرْحُ يُشْتَرَطُ لِصِحَّةِ الصَّلاةِ اسْتِقْبَالُ الْكَعْبَةِ أَيْ جِرْمِهَا أَوْ مَا يُحَاذِي جِرْمَهَا إِلَى السَّمَاءِ السَّابِعَةِ أَوِ الأَرْضِ السَّابِعَةِ، فَلَوِ اسْتَقْبَلَ مُشَاهِدُ الْكَعْبَةِ الْكَعْبَةَ بِبَعْضِ بَدَنِهِ وَبَعْضُ بَدَنِهِ خَارِجٌ عَنْهَا لَمْ يَكْفِ. وَالْمُرَادُ بِالْكَعْبَةِ الْقَدْرُ الْقَائِمُ الآنَ. وَالْمُرَادُ بِالِاسْتِقْبَالِ أَنْ يَسْتَقْبِلَ بِالصَّدْرِ فِي الْقِيَامِ وَالْقُعُودِ وَبِمُعْظَمِ الْبَدَنِ فِي الرُّكُوعِ وَالسُّجُودِ. وَمَنْ أَمْكَنَهُ عِلْمُهَا وَلا حَائِلَ يَعْمَلُ بِعِلْمِهِ وَإِلَّا اعْتَمَدَ ثِقَةً يُخْبِرُ عَنْ عِلْمٍ لا عَنِ اجْتِهَادٍ كَقَوْلِهِ أَنَا أُشَاهِدُ الْكَعْبَةَ فَإِنْ فَقَدَهُ وَأَمْكَنَهُ اجْتِهَادٌ لَزِمَهُ الِاجْتِهَادُ، وَالْقَادِرُ عَلَى الِاجْتِهَادِ فِي الْقِبْلَةِ لا يَأْخُذُ بِقَوْلِ مُجْتَهِدٍ غَيْرِهِ وَإِنْ فَعَلَ لا تَنْعَقِدُ صَلاتُهُ بَلْ يَجْتَهِدُ هُوَ لِنَفْسِهِ فَلَوْ دَخَلَ بَيْتَ ثِقَةٍ فَقَالَ لَهُ صَاحِبُ الْبَيْتِ الثِّقَةُ عَنْ عِلْمٍ لا عَنِ اجْتِهَادِ الْقِبْلَةُ هَكَذَا يَجُوزُ لَهُ الِاعْتِمَادُ عَلَى كَلامِهِ. أَمَّا الْعَاجِزُ عَنِ الِاجْتِهَادِ كَأَعْمَى وَطِفْلٍ عَاجِزَيْنِ عَنِ الِاجْتِهَادِ فَيُقَلِّدَانِ ثِقَةً عَارِفًا بِالِاجْتِهَادِ. فَيَتَلَخَّصُ مِمَّا ذُكِرَ أَنَّ مَرَاتِبَ مَعْرِفَةِ الْقِبْلَةِ أَرْبَعَةٌ كَمَا يَلِي الأُولَى الْعِلْمُ بِالنَّفْسِ وَالثَّانِيَةُ إِخْبَارُ الثِّقَةِ الَّذِي يُخْبِرُ عَنْ عِلْمٍ وَالثَّالِثَةُ الِاجْتِهَادُ وَالرَّابِعَةُ التَّقْلِيدُ وَلا يَنْتَقِلُ مِنْ مَرْتَبَةٍ إِلَى أُخْرَى إِلَّا بَعْدَ الْعَجْزِ عَنِ الَّتِي قَبْلَهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":358},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَدُخُولُ وَقْتِ الصَّلاةِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":359},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ مَعْرِفَةُ دُخُولِ الْوَقْتِ يَقِينًا كَأَنْ يُعَايِنَ الزَّوَالَ بِرُؤْيَةِ زِيَادَةِ الظِّلِّ عَمَّا كَانَ عَلَيْهِ عِنْدَ بُلُوغِ الشَّمْسِ وَسَطَ السَّمَاءِ أَوْ يُعَايِنَ تَحَوُّلَهُ إِلَى جِهَةِ الْمَشْرِقِ بَعْدَ أَنْ كَانَتِ الشَّمْسُ فِي وَسَطِ السَّمَاءِ أَوْ ظَنًّا بِاجْتِهَادٍ كَأَنْ يَعْتَمِدَ عَلَى صِيَاحِ الدِّيكِ الْمُجَرَّبِ. وَإِذَا عَمِلَ التَّقِيُّ الثِّقَةُ الْعَارِفُ تَقْوِيمًا لِأَوْقَاتِ الصَّلاةِ اعْتِمَادًا عَلَى مُرَاقَبَتِهِ يَجُوزُ أَنْ يُعْتَمَدَ عَلَيْهِ لَكِنَّ الأَفْضَلَ أَنْ يَنْظُرَ الشَّخْصُ بِنَفْسِهِ إِلَى الظِّلِّ لِصَلاةِ الظُّهْرِ وَالْعَصْرِ وَإِلَى الأُفُقِ لِلصَّلَوَاتِ الثَّلاثِ الْمَغْرِبِ وَالْعِشَاءِ وَالصُّبْحِ. وَكَذَلِكَ يُعْرَفُ دُخُولُ الْوَقْتِ بِقَوْلِ الثِّقَةِ أَوْ بِسَمَاعِ أَذَانِهِ. وَلا يَكْفِي الْقِيَامُ لِلصَّلاةِ وَالدُّخُولُ فِيهَا بِمُجَرَّدِ التَّوَهُّمِ بَلْ تِلْكَ الصَّلاةُ فَاسِدَةٌ وَلَوْ صَادَفَتِ الْوَقْتَ. وَأَمَّا مَنِ اشْتَبَهَ عَلَيْهِ الْوَقْتُ لِأَجْلِ غَيْمٍ فَيَجْتَهِدُ بِنَاءً عَلَى مَا مَضَى مِنَ الأَيَّامِ الَّتِي رَاقَبَ فِيهَا عَلَى التَّحْقِيقِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":360},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالإِسْلامُ وَالتَّمْيِيزُ وَهُوَ أَنْ يَكُونَ الْوَلَدُ بَلَغَ مِنَ السِّنِّ إِلَى حَيْثُ يَفْهَمُ الْخِطَابَ وَيَرُدُّ الْجَوَابَ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":361},{"type":"p","text":"   الشَّرْحُ مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ أَنْ يَكُونَ الْمُصَلِّي مُسْلِمًا فَالْكَافِرُ لا تَصِحُّ مِنْهُ الصَّلاةُ. كَذَلِكَ التَّمْيِيزُ شَرْطٌ فَالْوَلَدُ غَيْرُ الْمُمَيِّزِ لا تَصِحُّ مِنْهُ الصَّلاةُ فَلا يُقَالُ لِغَيْرِ الْمُمَيِّزِ صَلِّ بَلْ يُقَالُ لَهُ انْظُرْ كَيْفَ الصَّلاة.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":362},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْعِلْمُ بِفَرْضِيَّتِهَا.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":363},{"type":"p","text":"   الشَّرْحُ كَذَلِكَ يُشْتَرَطُ لِصِحَّةِ الصَّلاةِ الْعِلْمُ بِفَرْضِيَّتِهَا فَلَوْ كَانَ يَتَرَدَّدُ فِيهَا هَلْ هِيَ فَرْضٌ أَوْ لا أَوِ اعْتَقَدَ أَنَّهَا نَفْلٌ لَيْسَتْ فَرْضًا لَمْ تَنْعَقِدْ صَلاتُهُ حَتَّى يَعْرِفَ أَنَّهَا فَرْضٌ فَتَصِحَّ مِنْهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":364},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ لا يَعْتَقِدَ فَرْضًا مِنْ فُرُوضِهَا سُنَّةً.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":365},{"type":"p","text":"   الشَّرْحُ أَنَّ مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ أَنْ لا يَعْتَقِدَ أَنَّ فَرْضًا مِنْ فُرُوضِهَا سُنَّةٌ أَيْ غَيْرُ وَاجِبٍ كَالرُّكُوعِ وَالسُّجُودِ وَالْقِرَاءَةِ لِلْفَاتِحَةِ وَغَيْرِ ذَلِكَ مِمَّا هُوَ فَرْضٌ مُتَّفَقٌ عَلَيْهِ فِي مَذْهَبِ الشَّافِعِيَّةِ، أَمَّا مَنِ اعْتَقَدَ أَنَّ أَفْعَالَهَا أَوْ أَقْوَالَهَا كُلَّهَا فُرُوضٌ صَحَّتْ صَلاتُهُ، وَمَنِ اعْتَقَدَ أَنَّ بَعْضَ أَفْعَالِهَا فَرْضٌ وَبَعْضَ أَفْعَالِهَا سُنَّةٌ وَلَمْ يَقْصِدْ بِفَرْضٍ مُعَيَّنٍ أَنَّهُ سُنَّةٌ فَإِنَّ صَلاتَهُ صَحِيحَةٌ سَوَاءٌ فِي ذَلِكَ الْعَامِيُّ وَغَيْرُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":366},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالسَّتْرُ بِمَا يَسْتُرُ لَوْنَ الْبَشَرَةِ لِجَمِيعِ بَدَنِ الْحُرَّةِ إِلَّا الْوَجْهَ وَالْكَفَّيْنِ وَبِمَا يَسْتُرُ مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ لِلذَّكَرِ وَالأَمَةِ مِنْ كُلِّ الْجَوَانِبِ لا الأَسْفَلِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":367},{"type":"p","text":"   الشَّرْحُ يُشْتَرَطُ لِصِحَّةِ الصَّلاةِ سَتْرُ الْعَوْرَةِ مَعَ الْقُدْرَةِ وَلَوْ كَانَ فِي ظُلْمَةٍ وَخَالِيًا تَأَدُّبًا مَعَ اللَّهِ تَعَالَى. وَالْعَوْرَةُ فِي الصَّلاةِ فِي حَقِّ الْمَرْأَةِ الْحُرَّةِ أَيِ الأُنْثَى الَّتِي هِيَ غَيْرُ مَمْلُوكَةٍ جَمِيعُ بَدَنِهَا إِلَّا الْوَجْهَ وَالْكَفَّيْنِ. وَالسَّتْرُ يَحْصُلُ بِمَا يَسْتُرُ لَوْنَ الْجِلْدِ وَالشَّعَرِ وَأَمَّا مَا لا يَسْتُرُ اللَّوْنَ فَلا يَكْفِي، فَلا يَكْفِي الثَّوْبُ الرَّقِيقُ الَّذِي تُمَيَّزُ مِنْ خَلْفِهِ الْبَشَرَةُ السَّمْرَاءُ مِنَ الْبَشَرَةِ الْبَيْضَاءِ. وَأَمَّا حَدُّ الْعَوْرَةِ بِالنِّسْبَةِ لِلذَّكَرِ وَالأَمَةِ فَهُوَ مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ فَلَيْسَتِ السُّرَّةُ وَالرُّكْبَةُ عَوْرَةً إِنَّمَا الْعَوْرَةُ مَا بَيْنَهُمَا. وَهَذَا السَّتْرُ الْمُشْتَرَطُ إِنَّمَا هُوَ مِنَ الأَعْلَى وَالْجَوَانِبِ لا مِنَ الأَسْفَلِ فَإِنَّهُ لَوْ صَلَّى الشَّخْصُ عَلَى مَكَانٍ مُرْتَفِعٍ وَكَانَتْ تُرَى عَوْرَتُهُ لِمَنْ نَظَرَ مِنْ أَسْفَلَ لَكِنَّهَا لا تُرَى مِنَ الأَعْلَى وَالْجَوَانِبِ صَحَّتْ صَلاتُهُ [وَلَوْ كَانَ الإِزَارُ يَسْتُرُ عَوْرَتَهُ حَالَ الْقِيَامِ ثُمَّ انْكَشَفَ عَنْ شَىْءٍ مِنْهَا بِسَبَبِ سُجُودِهِ أَوْ قُعُودِهِ بَطَلَتْ صَلاتُهُ]. ","style":"Normal","align":"justify","bold":true,"size":18.0,"i

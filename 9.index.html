18.0,"index":843},{"type":"p","text":"الشَّرْحُ يَدْخُلُ تَحْتَ عُمُومِ هَذِهِ الْجُمْلَةِ الإِسْبِيرْتُو وَلَوْ لِغَيْرِ الشُّرْبِ، وَمَنِ احْتَاجَ إِلَيْهِ فَلْيُحَصِّلْهُ بِغَيْرِ طَرِيقَةِ الْبَيْعِ وَالشِّرَاءِ كَأَنْ يَقُولَ بِعْنِي هَذِهِ الْقِنِّينَةَ بِكَذَا إِلَّا الإِسْبِيرْتُو الَّذِي فِيهَا فَإِنِّي أَسْتَعْمِلُهُ مَجَّانًا. الإِسْبِيرْتُو مُسْكِرٌ بَلْ هُوَ رُوحُ الْخَمْرِ أَيْ قُوَّتُهُ فَلا يَجُوزُ أَنْ يُسْتَرْسَلَ فِي شِرَائِهِ لِأَنَّهُ كَسَائِرِ الْمُسْكِرَاتِ حُكْمًا، فَالْحَدِيثُ الْوَارِدُ فِي تَحْرِيمِ بَيْعِ الْخَمْرِ وَهُوَ مَا رَوَاهُ الْبُخَارِيُّ وَمُسْلِمٌ مِنْ حَدِيثِ جَابِرِ بنِ عَبْدِ اللَّهِ الأَنْصَارِيِّ رَضِيَ اللَّهُ عَنْهُ أَنَّهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّ اللَّهَ وَرَسُولَهُ حَرَّمَ بَيْعَ الْخَمْرِ وَالْمَيْتَةِ وَلَحْمِ الْخِنْـزِيرِ وَالأَصْنَامِ» قِيلَ يَا رَسُولَ اللَّهِ أَرَأَيْتَ شُحُومَ الْمَيْتَةِ تُطْلَى بِهَا السُّفُنُ وَتُدْهَنُ بِهَا الْجُلُودُ وَيَسْتَصْبِحُ بِهَا النَّاسُ قَالَ «لا هُوَ حَرَامٌ» شَاهِدٌ لِتَحْرِيمِ بَيْعِ الإِسْبِيرْتُو الَّذِي هُوَ مُسْكِرٌ لِمَنْ يَقْصِدُهُ لِلسُّكْرِ أَوْ لِغَيْرِ ذَلِكَ كَالْوَقُودِ وَالتَّدَاوِي لِظَاهِرِ الْجِسْمِ لِأَنَّهُ عَلَيْهِ الصَّلاةُ وَالسَّلامُ حَرَّمَ بَيْعَ الْمَيْتَةِ بِقَصْدِ جُمْلَتِهَا أَوْ بِقَصْدِ شَحْمِهَا لِغَيْرِ الأَكْلِ كَطَلْيِ السُّفُنِ بِهَا وَدَهْنِ الْجُلُودِ وَالِاسْتِصْبَاحِ بِهَا أَيِ اتِّخَاذِهَا سِرَاجًا يُسْتَضَاءُ بِهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":844},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبَيْعُ الْمَعِيبِ بِلا إِظْهَارٍ لِعَيْبِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":845},{"type":"p","text":"الشَّرْحُ يَحْرُمُ بَيْعُ الْمَعِيبِ مَعَ كِتْمَانِ عَيْبِهِ أَيْ تَرْكِ بَيَانِهِ. وَقَدْ رَوَى مُسْلِمٌ أَنَّ الرَّسُولَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَرَّ بِرَجُلٍ يَبِيعُ الطَّعَامَ فَأَدْخَلَ يَدَهُ فِيهِ فَمَسَّتْ يَدُهُ بَلَلًا فَقَالَ «يَا صَاحِبَ الطَّعَامِ مَا هَذَا» فَقَالَ أَصَابَتْهُ السَّمَاءُ أَيِ الْمَطَرُ فَقَالَ «هَلَّا جَعَلْتَهُ ظَاهِرًا حَتَّى يَرَاهُ النَّاسُ مَنْ غَشَّنَا فَلَيْسَ مِنَّا». وَالْمُرَادُ بِالطَّعَامِ فِي الْحَدِيثِ الْقَمْحُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":846},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَائِدَةٌ. لا تَصِحُّ قِسْمَةُ تَرِكَةِ مَيِّتٍ وَلا بَيْعُ شَىْءٍ مِنْهَا مَا لَمْ تُوَفَّ دُيُونُهُ وَوَصَايَاهُ وَتُخْرَجْ أُجْرَةُ حَجَّةٍ وَعُمْرَةٍ إِنْ كَانَا عَلَيْهِ إِلَّا أَنْ يُبَاعَ شَىْءٌ لِقَضَاءِ هَذِهِ الأَشْيَاءِ فَالتَّرِكَةُ كَمَرْهُونٍ بِذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":847},{"type":"p","text":"الشَّرْحُ لا تَصِحُّ قِسْمَةُ التَّرِكَةِ الَّتِي خَلَّفَهَا الْمَيِّتُ مِنْ كُلِّ حَقٍّ مَالِيٍّ مَا لَمْ تُؤَدَّ دُيُونُ الْمَيِّتِ مِنْ دَيْنٍ لِلنَّاسِ أَوْ مِنْ دَيْنٍ لِلَّهِ كَالزَّكَاةِ الْوَاجِبَةِ فِي عَيْنِ الْمَالِ وَمَا لَمْ تُنَفَّذِ الْوَصَايَا أَيْ مَا أَوْصَى بِهِ بِأَنْ يُصْرَفَ بَعْدَ مَوْتِهِ، وَمَا لَمْ تُخْرَجْ أُجْرَةُ الْحَجِّ وَالْعُمْرَةِ الْمُسْتَقِرَّيْنِ فِي ذِمَّتِهِ كَأَنْ مَاتَ وَقَدْ كَانَ وَجَبَ عَلَيْهِ أَدَاؤُهُمَا وَتُسَلَّمْ لِمَنْ يُؤَدِّي النُّسُكَ عَنْهُ، فَلا يَجُوزُ تَصَرُّفُ الْوَرَثَةِ فِي شَىْءٍ مِنَ التَّرِكَةِ حَتَّى يُخْرَجَ ذَلِكَ قَبْلًا كَمَا أَنَّ الْمَرْهُونَ لا يَجُوزُ التَّصَرُّفُ فِيهِ بِمَا يُزِيلُ الْمِلْكَ قَبْلَ قَضَاءِ الدَّيْنِ الَّذِي رُهِنَ بِهِ إِلَّا أَنْ يَكُونَ مَا بِيعَ لِقَضَاءِ شَىْءٍ مِنْ هَذِهِ الأَشْيَاءِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":848},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: كَرَقِيقٍ جَنَى وَلَوْ بِأَخْذِ دَانَقٍ لا يَصِحُّ بَيْعُهُ حَتَّى يُؤَدَّى مَا بِرَقَبَتِهِ أَوْ يَأْذَنَ الْغَرِيمُ فِي بَيْعِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":849},{"type":"p","text":"   الشَّرْحُ الْعَبْدُ إِذَا تَعَلَّقَتْ بِرَقَبَتِهِ غَرَامَةٌ كَأَنْ سَرَقَ دَانَقًا فَأَتْلَفَهُ لا يَجُوزُ لِسَيِّدِهِ بَيْعُهُ حَتَّى يُؤَدِّيَ مَا بِرَقَبَتِهِ لِأَنَّ حَقَّ الْغَرِيمِ مُتَعَلِّقٌ بِالرَّقَبَةِ فَهِيَ مَشْغُولَةٌ تَمْنَعُ صِحَّةَ بَيْعِ السَّيِّدِ لَهَا أَوْ حَتَّى يَأْذَنَ الْغَرِيمُ وَهُوَ ذُو الْمَالِ لِسَيِّدِ الْعَبْدِ فِي بَيْعِهِ فَيَصِحُّ حِينَئِذٍ. وَالدَّانَقُ سُدُسُ الدِّرْهَمِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":850},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَحْرُمُ أَنْ يُفَتِّرَ رَغْبَةَ الْمُشْتَرِي أَوِ الْبَائِعِ بَعْدَ اسْتِقْرَارِ الثَّمَنِ لِيَبِيعَ عَلَيْهِ أَوْ لِيَشْتَرِيَهُ مِنْهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":851},{"type":"p","text":"   الشَّرْحُ يَحْرُمُ عَلَى الْمُسْلِمِ الْمُكَلَّفِ أَنْ يُفَتِّرَ رَغْبَةَ الْمُشْتَرِي مِنْ غَيْرِهِ كَأَنْ يُخْرِجَ لَهُ أَرْخَصَ مِمَّا يُرِيدُ شِرَاءَهُ أَوْ يَبِيعَ بِحَضْرَتِهِ مِثْلَ الْمَبِيعِ بِأَرْخَصَ أَوْ يَعْرِضَ عَلَيْهِ لِيَشْتَرِيَهُ كَمَا يَحْرُمُ تَفْتِيرُ رَغْبَةِ الْبَائِعِ كَأَنْ يُرَغِّبَهُ بِاسْتِرْدَادِهِ لِيَشْتَرِيَهُ مِنْهُ بِأَغْلَى أَوْ يَطْلُبَهُ مِنَ الْمُشْتَرِي بِزِيَادَةِ رِبْحٍ بِحَضْرَةِ الْبَائِعِ. وَحُرْمَةُ ذَلِكَ تَكُونُ إِنْ حَصَلَ التَّفْتِيرُ بَعْدَ اسْتِقْرَارِ الثَّمَنِ بِأَنْ يَكُونَا قَدْ صَرَّحَا بِالرِّضَا بِهِ وَإِنْ فَحُشَ نَقْصُ الْقِيمَةِ عَنِ الثَّمَنِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":852},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبَعْدَ الْعَقْدِ فِي مُدَّةِ الْخِيَارِ أَشَدُّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":853},{"type":"p","text":"الشَّرْحُ أَنَّ مَا ذُكِرَ مِنَ التَّفْتِيرِ إِنْ وَقَعَ بَعْدَ إِجْرَاءِ الْعَقْدِ وَقَبْلَ لُزُومِهِ أَيْ فِي مُدَّةِ الْخِيَارِ أَيْ خِيَارِ الْمَجْلِسِ أَوْ خِيَارِ الشَّرْطِ فَهُوَ أَشَدُّ مِنْهُ قَبْلَ الْعَقْدِ وَبَعْدَ الِاتِّفَاقِ لِأَنَّ الإِيذَاءَ هُنَا أَكْثَرُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":854},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يَشْتَرِيَ الطَّعَامَ وَقْتَ الْغَلاءِ وَالْحَاجَةِ لِيَحْبِسَهُ وَيَبِيعَهُ بِأَغْلَى.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":855},{"type":"p","text":"الشَّرْحُ يَحْرُمُ أَنْ يَشْتَرِيَ الإِنْسَانُ الطَّعَامَ أَيِ الْقُوتَ حَتَّى التَّمْرَ وَالزَّبِيبَ وَنَحْوَهُمَا وَقْتَ الْغَلاءِ وَالْحَاجَةِ إِلَيْهِ لِيَحْبِسَهُ وَيَبِيعَهُ بِأَغْلَى مِنْ ثَمَنِ الْمِثْلِ عِنْدَ اشْتِدَادِ حَاجَةِ أَهْلِ مَحَلِّهِ أَوْ غَيْرِهِمْ إِلَيْهِ، وَهَذَا يُسَمَّى الِاحْتِكَارَ وَهَذَا تَفْسِيرُهُ فِي الْمَذْهَبِ، فَخَرَجَ بِذَلِكَ احْتِكَارُ طَعَامٍ غَيْرِ قُوتٍ، وَاحْتِكَارُ قُوتٍ لَمْ يَشْتَرِهِ كَغَلَّةِ ضَيْعَتِهِ أَوِ اشْتَرَاهُ وَقْتَ الرُّخْصِ أَوِ الْغَلاءِ لِنَفْسِهِ وَعِيَالِهِ أَوْ لِيَبِيعَهُ لا بِأَكْثَرَ. وَنَقَلَ السُّبْكِيُّ عَنِ الْقَاضِي حُسَيْنٍ أَنَّهُ فِي وَقْتِ الضَّرُورَةِ يَحْرُمُ احْتِكَارُ مَا بِالنَّاسِ ضَرُورَةٌ إِلَيْهِ وَهُوَ فِي غُنْيَةٍ عَنْهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":856},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يَزِيدَ فِي ثَمَنِ سِلْعَةٍ لِيَغُرَّ غَيْرَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":857},{"type":"p","text":"الشَّرْحُ هَذَا يُسَمَّى النَّجْشَ وَقَدْ ثَبَتَ النَّهْيُ عَنْهُ فِي الصَّحِيحِ وَذَلِكَ مَا ثَبَتَ مِنْ قَوْلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «وَلا تَنَاجَشُوا» فَيَحْرُمُ النَّجْشُ وَلَوْ كَانَتِ الزِّيَادَةُ فِي مَالِ مَحْجُورٍ عَلَيْهِ لِتَرْوِيجِهِ لَهُ. وَيَلْتَحِقُ بِالنَّجْشِ مَدْحُ السِّلْعَةِ لِيُرَغِّبَ غَيْرَهُ فِيهَا بِكَذِبٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":858},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يُفَرِّقَ بَيْنَ الْجَارِيَةِ وَوَلَدِهَا قَبْلَ التَّمْيِيزِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":859},{"type":"p","text":"الشَّرْحُ يَحْرُمُ التَّفْرِيقُ بِالْبَيْعِ بَيْنَ الأَمَةِ وَوَلَدِهَا قَبْلَ أَنْ يُمَيِّزَ الْوَلَدُ وَلَوْ رَضِيَتْ بِذَلِكَ، وَكَذَلِكَ لَوْ كَانَ وَلَدُهَا مَجْنُونًا بَالِغًا فَيَحْرُمُ التَّفْرِيقُ بَيْنَهُمَا قَبْلَ إِفَاقَتِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":860},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يَغُشَّ أَوْ يَخُونَ فِي الْكَيْلِ وَالْوَزْنِ وَالذَّرْعِ وَالْعَدِّ أَوْ يَكْذِبَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":861},{"type":"p","text":"   الشَّرْحُ مِمَّا يَحْرُمُ الْغَشُّ فِي الْبَيْعِ وَالْخِيَانَةُ فِي الْكَيْلِ أَوِ الْوَزْنِ أَوِ الذَّرْعِ أَوِ الْعَدِّ وَالْكَذِبُ بِالْقَوْلِ فِي شَىْءٍ مِنْ ذَلِكَ. قَالَ اللَّهُ تَعَالَى ﴿وَيْلٌ لِّلْمُطَفِّفِينَ الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ وَإِذَا كَالُوهُمْ أَوْ وَّزَنُوهُمْ يُخْسِرُونَ أَلا يَظُنُّ أُولَئِكَ أَنَّهُمْ مَّبْعُوثُونَ لِيَوْمٍ عَظِيمٍ يَوْمَ يَقُومُ النَّاسُ لِرَبِّ الْعَالَمِينَ﴾ [سُورَةَ الْمُطَفِّفِين] أَيْ لِلْحِسَابِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":862},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَنْ يَبِيعَ الْقُطْنَ أَوْ غَيْرَهُ مِنَ الْبَضَائِعِ وَيُقْرِضَ الْمُشْتَرِيَ فَوْقَهُ دَرَاهِمَ وَيَزِيدَ فِي ثَمَنِ تِلْكَ الْبِضَاعَةِ لِأَجْلِ الْقَرْضِ، وَأَنْ يُقْرِضَ الْحَائِكَ أَوْ غَيْرَهُ مِنَ الأُجَرَاءِ وَيَسْتَخْدِمَهُ بِأَقَلَّ مِنْ أُجْرَةِ الْمِثْلِ لِأَجْلِ ذَلِكَ الْقَرْضِ أَيْ إِنْ شَرَطَ ذَلِكَ وَيُسَمُّونَ ذَلِكَ الرَّبْطَةَ أَوْ يُقْرِضَ الْحَرَّاثِينَ إِلَى وَقْتِ الْحَصَادِ وَيَشْتَرِطَ أَنْ يَبِيعُوا عَلَيْهِ طَعَامَهُمْ بِأَوْضَعَ مِنَ السِّعْرِ قَلِيلًا وَيُسَمُّونَ ذَلِكَ الْمَقْضِيَّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":863},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذِهِ الْمَذْكُورَاتِ حَرَامٌ بِشَرْطِ أَنْ يَسْبِقَ اتِّفَاقٌ عَلَى ذَلِكَ وَذَلِكَ مِنْ جُمْلَةِ رِبَا الْقَرْضِ. وَأَمَّا لَوْ أَقْرَضَ فِي هَذِهِ الْمَسَائِلِ فَأَجْرَى الْعَقْدَ بِدُونِ هَذَا الِاتِّفَاقِ لَمْ يَحْرُمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":864},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَذَا جُمْلَةٌ مِنْ مُعَامَلاتِ أَهْلِ هَذَا الزَّمَانِ وَأَكْثَرُهَا خَارِجَةٌ عَنْ قَانُونِ الشَّرْعِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":865},{"type":"p","text":"   الشَّرْحُ كُلُّ مَا كَانَ فِي مَعْنَى الْمَذْكُورَاتِ فَهُوَ حَرَامٌ لِأَنَّهُ لا يَخْلُو مِنْ مَحْظُورَاتِ الشَّرْعِ. وَمِنْ جُمْلَةِ هَذِهِ الْمُعَامَلاتِ الْفَاسِدَةِ أَنْوَاعُ التَّأْمِينَاتِ الَّتِي تَعَارَفُوهَا فِي هَذَا الزَّمَنِ كَتَأْمِينِ السَّيَّارَةِ أَوْ تَأْمِينِ الْبَضَائِعِ الْمُسْتَجْلَبَةِ وَمَا يُسَمُّونَهُ التَّأْمِينَ عَلَى الْحَيَاةِ فَيَجِبُ عَلَى مَنْ وَقَعَ فِي ذَلِكَ أَنْ يَخْرُجَ مِنْهُ بِالتَّوْبَةِ، إِلَّا أَنَّهُ يَحِلُّ لِمَنْ لا يُمَكَّنُ مِنْ شِرَاءِ السَّيَّارَةِ إِلَّا بِطَرِيقِ التَّأْمِينِ أَنْ يَدْخُلَ فِي ذَلِكَ ثُمَّ لا يَأْخُذُ بَعْدَ ذَلِكَ مِمَّنْ أَمَّنَ مِنْهُمْ إِلَّا قَدْرَ مَا دَفَعَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":866},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَعَلَى مُرِيدِ رِضَا اللَّهِ سُبْحَانَهُ وَسَلامَةِ دِينِهِ وَدُنْيَاهُ أَنْ يَتَعَلَّمَ مَا يَحِلُّ وَمَا يَحْرُمُ مِنْ عَالِمٍ وَرِعٍ نَاصِحٍ شَفِيقٍ عَلَى دِينِهِ فَإِنَّ طَلَبَ الْحَلالِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":867},{"type":"p","text":"   الشَّرْحُ يَجِبُ تَعَلُّمُ عِلْمِ الدِّينِ الَّذِي يُعْرَفُ بِهِ الْحَلالُ وَالْحَرَامُ تَلَقِّيًا مِنْ أَهْلِ الْمَعْرِفَةِ وَالثِّقَةِ فَلا يَجُوزُ اسْتِفْتَاءُ مَنْ لَيْسَ لَهُ كَفَاءَةٌ فِي عِلْمِ الدِّينِ وَلا اسْتِفْتَاءُ الْعَالِمِ الْفَاسِقِ. قَالَ الإِمَامُ الْمُجْتَهِدُ التَّابِعِيُّ الْجَلِيلُ مُحَمَّدُ بنُ سِيرِينَ رَضِيَ اللَّهُ عَنْهُ «إِنَّ هَذَا الْعِلْمَ دِينٌ فَانْظُرُوا عَمَّنْ تَأْخُذُونَ دِينَكُمْ» رَوَاهُ مُسْلِمٌ فِي مُقَدِّمَةِ صَحِيحِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":868},{"type":"p","text":"   وَمَعْنَى قَوْلِهِ إِنَّ طَلَبَ الْحَلالِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ أَنَّهُ لا يَجُوزُ تَنَاوُلُ رِزْقٍ مِنْ طَرِيقٍ حَرَامٍ بَلْ عَلَى مَنْ أَرَادَ تَحْصِيلَ الْمَالِ لِحَاجَةِ نَفْسِهِ أَوْ حَاجَةِ عِيَالِهِ أَنْ يَسْعَى لِلتَّحْصِيلِ بِطَرِيقٍ مُبَاحٍ شَرْعًا، وَلَيْسَ مَعْنَى ذَلِكَ أَنَّهُ يَحْرُمُ عَلَى الشَّخْصِ أَنْ يَمْكُثَ مِنْ دُونِ تَعَاطِي عَمَلٍ بَلْ لَوْ تَرَكَ الشَّخْصُ الْعَمَلَ وَهُوَ قَادِرٌ عَلَيْهِ غَيْرَ مُعْتَمِدٍ عَلَى السُّؤَالِ مِنْ شَخْصٍ مُعَيَّنٍ أَوْ عَلَى الشَّحَاذَةِ بَلْ كَانَ غَيْرَ مُتَعَرِّضٍ لِذَلِكَ وَاثِقًا بِرَبِّهِ أَنَّهُ يَسُوقُ إِلَيْهِ رِزْقَهُ فَلا إِثْمَ عَلَيْهِ. وَقَدْ رَوَى التِّرْمِذِيُّ بِإِسْنَادٍ صَحِيحٍ أَنَّ رَجُلًا شَكَى إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَخَاهُ لِأَنَّهُ لا يَحْتَرِفُ مَعَهُ فَقَالَ لَهُ «لَعَلَّكَ تُرْزَقُ بِهِ». الشَّاهِدُ فِي الْحَدِيثِ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَمْ يُنْكِرْ عَلَى الأَخِ تَرْكَ الِاحْتِرَافِ مَعَ أَخِيهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":869},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":870},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ أَحْكَامِ النَّفَقَةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":871},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: يَجِبُ عَلَى الْمُوسِرِ نَفَقَةُ أُصُولِهِ الْمُعْسِرِينَ أَيِ الآبَاءِ وَالأُمَّهَاتِ الْفُقَرَاءِ وَإِنْ قَدَرُوا عَلَى الْكَسْبِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":872},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى مَنِ اسْتَطَاعَ أَنْ يُنْفِقَ عَلَى أُصُولِهِ أَيِ الأَبِ وَالْجَدِّ وَإِنْ عَلا وَالأُمِّ وَالْجَدَّةِ وَإِنْ عَلَتْ إِنْ كَانُوا مُعْسِرِينَ بِالْمَعْرُوفِ بِلا تَقْدِيرٍ بِحَدٍّ مُعَيَّنٍ. وَإِنْ كَانَ لا يَمْلِكُ أَمْلاكًا تَكْفِيهِمْ وَجَبَ عَلَيْهِ أَنْ يَعْمَلَ وَيَكْسِبَ فِي تَحْصِيلِ نَفَقَتِهِمْ وَلا فَرْقَ بَيْنَ أَنْ يَكُونُوا قَادِرِينَ عَلَى الْكَسْبِ أَوْ عَاجِزِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":873},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَنَفَقَةُ فُرُوعِهِ أَيْ أَوْلادِهِ وَأَوْلادِ أَوْلادِهِ إِذَا أَعْسَرُوا وَعَجَزُوا عَنِ الْكَسْبِ لِصِغَرٍ أَوْ زَمَانَةٍ أَيْ مَرَضٍ مَانِعٍ مِنَ الْكَسْبِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":874},{"type":"p","text":"   الشَّرْحُ تَجِبُ نَفَقَةُ الْفُرُوعِ مِنَ الذُّكُورِ وَالإِنَاثِ إِنْ أَعْسَرُوا عَمَّا يَكْفِيهِمْ وَعَجَزُوا عَنِ الْكَسْبِ لِصِغَرٍ أَوْ زَمَانَةٍ وَكَذَلِكَ إِنْ كَانَ عَجْزُهُمْ عَنْ كِفَايَةِ أَنْفُسِهِمْ لِجُنُونٍ أَوْ عَمًى أَوْ مَرَضٍ وَمِنْ ثُمَّ لَوْ أَطَاقَ صَغِيرٌ الْكَسْبَ أَوْ أَطَاقَ تَعَلُّمَهُ وَكَانَ لائِقًا بِهِ جَازَ لِلْوَلِيِّ أَنْ يَحْمِلَهُ عَلَيْهِ وَيُنْفِقَ عَلَيْهِ مِنْهُ، فَإِنِ امْتَنَعَ أَوْ هَرَبَ لَزِمَ الْوَلِيَّ الإِنْفَاقُ عَلَيْهِ، وَأَمَّا الْبَالِغُ غَيْرُ الْعَاجِزِ عَنِ الْكَسْبٍ لِزَمَانَةٍ أَوْ نَحْوِهَا فَلا يَجِبُ عَلَى الأَصْلِ الإِنْفَاقُ عَلَيْهِ وَهَذَا هُوَ مَذْهَبُ الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ لا فَرْقَ فِيهِ بَيْنَ الْفَرْعِ الذَّكَرِ وَالأُنْثَى. وَالنَّفَقَةُ الَّتِي تَجِبُ فِي حَقِّ الأُصُولِ وَالْفُرُوعِ هِيَ الْكِسْوَةُ وَالسُّكْنَى اللَّائِقَةُ بِهِمْ وَالْقُوتُ وَالإِدَامُ اللَّائِقُ بِهِمْ، وَلا يَجِبُ عَلَيْهِ إِطْعَامُهُمْ إِلَى حَدِّ الْمُبَالَغَةِ فِي الشِّبَعِ لَكِنْ أَصْلُ الإِشْبَاعِ وَاجِبٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":875},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَى الزَّوْجِ نَفَقَةُ الزَّوْجَةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":876},{"type":"p","text":"   الشَّرْحُ يَجِبُ عَلَى الزَّوْجِ نَفَقَةُ زَوْجَتِهِ الْمُمَكِّنَةِ نَفْسَهَا لَهُ وَلَوْ كَانَتْ أَمَةً مَمْلُوكَةً أَوْ كَافِرَةً وَكَذَلِكَ الْعَاجِزَةُ عَنِ التَّمْكِينِ لِمَرَضٍ. وَهَذِهِ النَّفَقَةُ هِيَ فِي الْمَذْهَبِ مُدَّا طَعَامٍ لِكُلِّ يَوْمٍ عَلَى مُوسِرٍ حُرٍّ وَمُدٌّ عَلَى مُعْسِرٍ وَمُدٌّ وَنِصْفٌ عَلَى مُتَوَسِّطٍ، وَعَلَيْهِ طَحْنُهُ وَعَجْنُهُ وَخَبْزُهُ وَأُدْمُ غَالِبِ الْبَلَدِ وَيَخْتَلِفُ بِالْفُصُولِ، وَيُقَدِّرُ الأُدْمَ الْقَاضِي بِاجْتِهَادِهِ عِنْدَ الِاخْتِلافِ وَيَتَفَاوَتُ بَيْنَ مُوسِرٍ وَغَيْرِهِ. وَيَجِبُ لَهَا كِسْوَةٌ تَكْفِيهَا وَءَالَةُ تَنْظِيفٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":877},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَهْرُهَا وَعَلَيْهِ لَهَا مُتْعَةٌ إِنْ وَقَعَ الْفِرَاقُ بَيْنَهُمَا بِغَيْرِ سَبَبٍ مِنْهَا. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":878},{"type":"p","text":"الشَّرْحُ أَنَّهُ يَجِبُ عَلَى الزَّوْجِ أَدَاءُ مَهْرِ زَوْجَتِهِ فَإِنْ كَانَ حَالًّا فَمَتَى طَلَبَتْ وَإِنْ كَانَ مُؤَجَّلًا فَعِنْدَ حُلُولِ الأَجَلِ لا قَبْلَهُ. وَيُشْتَرَطُ فِي الْمَهْرِ أَنْ يَكُونَ مِمَّا يَصِحُّ جَعْلُهُ مَبِيعًا أَوْ مَا يَصِحُّ أَنْ يَكُونَ مَنْفَعَةً مَقْصُودَةً كَتَعْلِيمِ الْقُرْءَانِ أَوْ سُورَةٍ مِنْهُ فَيَصِحُّ جَعْلُ الْمَهْرِ تَعْلِيمَ أَقْصَرِ سُورَةٍ مِنَ الْقُرْءَانِ أَوْ تَعْلِيمَ حِرْفَةٍ كَخِيَاطَةٍ. وَيَجِبُ لِلزَّوْجَةِ الَّتِي وَقَعَ الْفِرَاقُ بَيْنَهَا وَبَيْنَ زَوْجِهَا بِغَيْرِ سَبَبٍ مِنْهَا مُتْعَةٌ عَلَى الزَّوْجِ وَلَيْسَتْ مِقْدَارًا مُعَيَّنًا وَلَكِنْ يُسْتَحَبُّ أَنْ تَكُونَ لِلْمُتَوَسِّطِ ثَلاثِينَ دِرْهَمًا وَأَنْ لا تَبْلُغَ نِصْفَ مَهْرِ الْمِثْلِ، وَيُجْزِئُ مَا يَتَرَاضَيَانِ عَلَيْهِ وَلَوْ أَقَلَّ مُتَمَوَّلٍ فَإِنْ تَنَازَعَا قَدَّرَهَا الْقَاضِي بِاجْتِهَادِهِ مُعْتَبِرًا حَالَهُمَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":879},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَعَلَى مَالِكِ الْعَبِيدِ وَالْبَهَائِمِ نَفَقَتُهُمْ وَأَنْ لا يُكَلِّفَهُمْ مِنَ الْعَمَلِ مَا لا يُطِيقُونَهُ وَلا يَضْرِبَهُمْ بِغَيْرِ حَقٍّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":880},{"type":"p","text":"الشَّرْحُ رَوَى الْبُخَارِيُّ فِي الصَّحِيحِ أَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «إِخْوَانُكُمْ خَوَلُكُمْ مَلَّكَكُمُ اللَّهُ إِيَّاهُمْ فَمَنْ كَانَ أَخُوهُ تَحْتَ يَدِهِ فَلْيُطْعِمْهُ مِمَّا يَأْكُلُ وَلْيُلْبِسْهُ مِمَّا يَلْبَسُ وَلا يُكَلِّفْهُ مِنَ الْعَمَلِ مَا يَغْلِبُهُ فَإِنْ كَلَّفْتُمُوهُمْ فَأَعِينُوهُمْ». وَرَوَى مَالِكٌ فِي الْمُوَطَإِ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «لِلْمَمْلُوكِ طَعَامُهُ وَكِسْوَتُهُ بِالْمَعْرُوفِ» أَيْ بِلا إِسْرَافٍ وَلا تَقْتِيرٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":881},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَيَجِبُ عَلَى الزَّوْجَةِ طَاعَتُهُ فِي نَفْسِهَا إِلَّا فِي مَا لا يَحِلُّ وَأَنْ لا تَصُومَ النَّفْلَ وَلا تَخْرُجَ مِنْ بَيْتِهِ إِلَّا بِإِذْنِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":882},{"type":"p","text":"الشَّرْحُ يَجِبُ عَلَى الزَّوْجَةِ طَاعَةُ الزَّوْجِ فِيمَا هُوَ حَقٌّ لَهُ عَلَيْهَا مِنَ الِاسْتِمْتَاعِ وَمَا يَتَعَلَّقُ بِهِ إِلَّا فِيمَا حَرَّمَهُ الشَّرْعُ مِنْ أُمُورِ الِاسْتِمْتَاعِ فَلا يَجِبُ عَلَيْهَا أَنْ تُطِيعَهُ فِي الِاسْتِمْتَاعِ الْمُحَرَّمِ كَأَنْ كَانَتْ حَائِضًا أَوْ نُفَسَاءَ وَأَرَادَ أَنْ يُجَامِعَهَا بَلْ يَحْرُمُ عَلَيْهَا، وَلا يَجِبُ عَلَيْهَا أَيْضًا طَاعَتُهُ فِي الْجِمَاعِ إِذَا كَانَتْ لا تُطِيقُ الْوَطْءَ لِمَرَضٍ. وَيَجِبُ عَلَيْهَا أَنْ تَتَزَيَّنَ لَهُ إِنْ طَلَبَ مِنْهَا ذَلِكَ وَأَنْ تَتْرُكَ مَا يُعَكِّرُ عَلَيْهِ الِاسْتِمْتَاعَ مِنَ الرَّوَائِحِ الْكَرِيهَةِ كَرَائِحَةِ الثُّومِ وَالْبَصَلِ وَالسِّيجَارَةِ إِنْ كَانَ يَتَأَذَّى بِهَا. وَيَجِبُ عَلَيْهَا أَنْ لا تَصُومَ النَّفْلَ وَهُوَ حَاضِرٌ إِلَّا بِإِذْنِهِ، أَمَّا الْوَاجِبُ كَرَمَضَانَ فَإِنَّهَا تَصُومُهُ رَضِيَ أَوْ لَمْ يَرْضَ لِأَنَّ اللَّهَ أَحَقُّ أَنْ يُطَاعَ وَقَدْ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «لا طَاعَةَ لِمَخْلُوقٍ فِي مَعْصِيَةِ الْخَالِقِ» رَوَاهُ التِّرْمِذِيُّ. وَيَجِبُ عَلَيْهَا أَنْ لا تَأْذَنَ لِأَحَدٍ فِي دُخُولِ بَيْتِهِ إِلَّا بِإِذْنِهِ، وَلا يَجُوزُ لَهَا أَنْ تَخْرُجَ مِنْ بَيْتِهِ مِنْ غَيْرِ ضَرُورَةٍ إِلَّا بِإِذْنِهِ، فَأَمَّا الْخُرُوجُ لِضَرُورَةٍ فَهُوَ جَائِزٌ وَذَلِكَ كَأَنْ أَرَادَتْ أَنْ تَسْتَفْتِيَ أَهْلَ الْعِلْمِ فِيمَا لا تَسْتَغْنِي عَنْهُ وَكَانَ الزَّوْجُ لا يَكْفِيهَا ذَلِكَ فَإِنَّهَا تَخْرُجُ بِدُونِ رِضَاهُ، وَهَذَا شَامِلٌ لِمَعْرِفَةِ مَا هُوَ مِنْ أُصُولِ الْعَقِيدَةِ وَمَا هُوَ مِنَ الأَحْكَامِ كَأُمُورِ الطَّهَارَةِ كَمَسَائِلِ الْحَيْضِ فَإِنَّ لَهَا تَشَعُّبًا. وَمِنَ الضَّرُورَةِ أَنْ تَخْشَى اقْتِحَامَ فَجَرَةٍ فِي الْمَنْـزِلِ الَّذِي أَسْكَنَهَا فِيهِ أَوِ انْهِدَامَهُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":883}]},{"id":"heart-duties","title":"الْوَاجِبَاتُ الْقَلْبِيَّةُ","description":"الفصل المخصص لبيان الواجبات القلبية.","icon":"fa-heart","start":884,"end":911,"paragraphCount":27,"wordCount":1099,"readMinutes":7,"blocks":[{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":884},{"type":"p","text":"الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ الْوَاجِبَاتِ الْقَلْبِيَّةِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":885},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ الإِيمَانُ بِاللَّهِ وَبِمَا جَاءَ عَنِ اللَّهِ وَالإِيمَانُ بِرَسُولِ اللَّهِ وَبِمَا جَاءَ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":886},{"type":"p","text":"الشَّرْحُ أَنَّ مِمَّا يَجِبُ عَلَى الْمُكَلَّفِينَ مِنْ أَعْمَالِ الْقُلُوبِ الإِيمَانَ بِاللَّهِ وَهُوَ أَصْلُ الْوَاجِبَاتِ أَيِ الِاعْتِقَادَ الْجَازِمَ بِوُجُودِهِ تَعَالَى عَلَى مَا يَلِيقُ بِهِ وَهُوَ إِثْبَاتُ وُجُودِهِ بِلا كَيْفِيَّةٍ وَلا كَمِيَّةٍ وَلا مَكَانٍ. وَوُجُوبُ هَذَا لِمَنْ بَلَغَتْهُ الدَّعْوَةُ مِمَّا اتُّفِقَ عَلَيْهِ بِلا خِلافٍ، وَيَقْرِنُ بِذَلِكَ الإِيمَانَ بِمَا جَاءَ بِهِ سَيِّدُنَا مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنِ اللَّهِ تَعَالَى مِنَ الإِيمَانِ بِهِ أَنَّهُ رَسُولُ اللَّهِ وَالإِيمَانِ بِحَقِيَّةِ مَا جَاءَ بِهِ عَنِ اللَّهِ تَعَالَى.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":887},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالإِخْلاصُ وَهُوَ الْعَمَلُ بِالطَّاعَةِ لِلَّهِ وَحْدَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":888},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ أَعْمَالِ الْقُلُوبِ الْوَاجِبَةِ الإِخْلاصَ وَهُوَ إِخْلاصُ النِّيَّةِ مِنْ أَنْ يَقْصِدَ بِهَا عِنْدَ الْعَمَلِ الصَّالِحِ مَحْمَدَةَ النَّاسِ وَالنَّظَرَ إِلَيْهِ بِعَيْنِ الِاحْتِرَامِ وَالتَّعْظِيمِ وَالإِجْلالِ قَالَ تَعَالَى ﴿فَمَنْ كَانَ يَرْجُوا لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدَا﴾ فَفِي الآيَةِ نَهْيٌ عَنِ الرِّيَاءِ لِأَنَّهُ الشِّرْكُ الأَصْغَرُ. وَقَدْ رَوَى الْحَاكِمُ فِي الْمُسْتَدْرَكِ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «اتَّقُوا الرِّيَاءَ فَإِنَّهُ الشِّرْكُ الأَصْغَرُ» صَحَّحَهُ الْحَاكِمُ وَوَافَقَهُ الذَّهَبِيُّ عَلَى تَصْحِيحِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":889},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالنَّدَمُ عَلَى الْمَعَاصِي.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":890},{"type":"p","text":"الشَّرْحُ مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ التَّوْبَةُ مِنَ الْمَعَاصِي إِنْ كَانَتْ كَبِيرَةً وَإِنْ كَانَتْ صَغِيرَةً وَرُكْنُهَا الأَكْبَرُ النَّدَمُ، وَيَجِبُ أَنْ يَكُونَ النَّدَمُ لِأَجْلِ أَنَّهُ عَصَى رَبَّهُ فَإِنَّهُ لَوْ كَانَ نَدَمُهُ لِأَجْلِ الْفَضِيحَةِ بَيْنَ النَّاسِ لَمْ يَكُنْ ذَلِكَ تَوْبَةً.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":891},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّوَكُّلُ عَلَى اللَّهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":892},{"type":"p","text":"الشَّرْحُ قَالَ اللَّهُ تَعَالَى ﴿وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ﴾ [سُورَةَ الْمُجَادِلَة/10]. التَّوَكُّلُ هُوَ الِاعْتِمَادُ فَيَجِبُ عَلَى الْعَبْدِ أَنْ يَكُونَ اعْتِمَادُهُ عَلَى اللَّهِ لِأَنَّهُ خَالِقُ كُلِّ شَىْءٍ مِنَ الْمَنَافِعِ وَالْمَضَارِّ وَسَائِرِ مَا يَدْخُلُ فِي الْوُجُودِ فَلا ضَارَّ وَلا نَافِعَ عَلَى الْحَقِيقَةِ إِلَّا اللَّهُ فَإِذَا اعْتَقَدَ الْعَبْدُ ذَلِكَ وَوَطَّنَ قَلْبَهُ عَلَيْهِ كَانَ اعْتِمَادُهُ عَلَى اللَّهِ فِي أُمُورِ الرِّزْقِ وَالسَّلامَةِ مِنَ الْمَضَارِّ فَجُمْلَةُ التَّوَكُّلِ تَفْوِيضُ الأَمْرِ إِلَى اللَّهِ تَعَالَى وَالثِّقَةُ بِهِ مَعَ مَا قُدِّرَ لِلْعَبْدِ مِنَ التَّسَبُّبِ أَيْ مُبَاشَرَةِ الأَسْبَابِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":893},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْمُرَاقَبَةُ لِلَّهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":894},{"type":"p","text":"الشَّرْحُ مِنْ وَاجِبَاتِ الْقَلْبِ الْمُرَاقَبَةُ لِلَّهِ. وَمَعْنَى الْمُرَاقَبَةِ اسْتِدَامَةُ خَوْفِ اللَّهِ تَعَالَى بِالْقَلْبِ بِتَجَنُّبِ مَا حَرَّمَهُ وَتَجَنُّبِ الْغَفْلَةِ عَنْ أَدَاءِ مَا أَوْجَبَهُ وَلِذَلِكَ يَجِبُ عَلَى الْمُكَلَّفِ أَوَّلَ مَا يَدْخُلُ فِي التَّكْلِيفِ أَنْ يَنْوِيَ وَيَعْزِمَ أَنْ يَأْتِيَ بِكُلِّ مَا فَرَضَ اللَّهُ عَلَيْهِ مِنْ أَدَاءِ الْوَاجِبَاتِ وَاجْتِنَابِ الْمُحَرَّمَاتِ. قَالَ اللَّهُ تَعَالَى ﴿فَلا تَخافُوهُمْ وَخَافُونِ إِنْ كُنْتُمْ مُّؤْمِنِينَ﴾ [سُورَةَ ءَالِ عِمْرَان/175].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":895},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالرِّضَا عَنِ اللَّهِ بِمَعْنَى التَّسْلِيمِ لَهُ وَتَرْكِ الِاعْتِرَاضِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":896},{"type":"p","text":"الشَّرْحُ يَجِبُ عَلَى الْمُكَلَّفِ أَنْ يَرْضَى عَنِ اللَّهِ أَيْ أَنْ لا يَعْتَرِضَ عَلَى اللَّهِ لا اعْتِقَادًا وَلا لَفْظًا لا بَاطِنًا وَلا ظَاهِرًا فِي قَضَائِهِ وَقَدَرِهِ فَيَرْضَى عَنِ اللَّهِ تَبَارَكَ وَتَعَالَى فِي تَقْدِيرِهِ الْخَيْرَ وَالشَّرَّ وَالْحُلْوَ وَالْمُرَّ وَالرِّضَا وَالْحُزْنَ وَالرَّاحَةَ وَالأَلَمَ مَعَ التَّمْيِيزِ فِي الْمَقْدُورِ وَالْمَقْضِيِّ فَإِنَّ الْمَقْدُورَ وَالْمَقْضِيَّ إِمَّا أَنْ يَكُونَ مِمَّا يُحِبُّهُ اللَّهُ وَإِمَّا أَنْ يَكُونَ مِمَّا يَكْرَهُهُ اللَّهُ فَالْمَقْضِيُّ الَّذِي هُوَ مَحْبُوبٌ لِلَّهِ عَلَى الْعَبْدِ أَنْ يُحِبَّهُ وَالْمَقْضِيُّ الَّذِي هُوَ مَكْرُوهٌ لِلَّهِ تَعَالَى كَالْمُحَرَّمَاتِ فَعَلَى الْعَبْدِ أَنْ يَكْرَهَهُ مِنْ غَيْرِ أَنْ يَكْرَهَ تَقْدِيرَ اللَّهِ وَقَضَاءَهُ لِذَلِكَ الْمَقْدُورِ، فَالْمَعَاصِي مِ ءٍ مِنْ ذَلِكَ فِي مَعْصِيَةِ اللَّهِ فَهُوَ الْعَبْدُ الشَّاكِرُ، ثُمَّ إِذَا تَمَكَّنَ فِي ذَلِكَ سُمِّيَّ عَبْدًا شَكُورًا قَالَ اللَّهُ تَعَالَى ﴿وَقَلِيلٌ مِّنْ عِبَادِيَ الشَّكُورُ﴾ [سُورَةَ سَبَإ/13] فَالشَّكُورُ أَقَلُّ وُجُودًا مِنَ الشَّاكِرِ الَّذِي هُوَ دُونَهُ. وَالشُّكْرُ الْمَنْدُوبُ هُوَ الثَّنَاءُ عَلَى اللَّهِ تَعَالَى الدَّالُّ عَلَى أَنَّهُ هُوَ الْمُتَفَضِّلُ عَلَى الْعِبَادِ بِالنِّعَمِ الَّتِي أَنْعَمَ بِهَا عَلَيْهِمْ مِمَّا لا يَدْخُلُ تَحْتَ إِحْصَائِنَا. وَيُطْلَقُ الشُّكْرُ شَرْعًا أَيْضًا عَلَى الْقِيَامِ بِالْمُكَافَأَةِ لِمَنْ أَسْدَى مَعْرُوفًا مِنَ الْعِبَادِ بَعْضِهِمْ لِبَعْضٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":901},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: والصَّبْرُ علَى أَدَاءِ ما أَوجَبَ الله والصَّبرُ عَمَّا حَرّمَ اللَّهُ تَعَالَى وَعَلَى مَا ابْتَلاكَ اللَّهُ بِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":902},{"type":"p","text":"الشَّرْحُ الصَّبْرُ هُوَ حَبْسُ النَّفْسِ وَقَهْرُهَا عَلَى مَكْرُوهٍ تَتَحَمَّلُهُ أَوْ لَذِيذٍ تُفَارِقُهُ، فَالصَّبْرُ الْوَاجِبُ عَلَى الْمُكَلَّفِ هُوَ الصَّبْرُ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ مِنَ الطَّاعَاتِ وَالصَّبْرُ عَمَّا حَرَّمَ اللَّهُ أَيْ كَفُّ النَّفْسِ عَمَّا حَرَّمَ اللَّهُ وَالصَّبْرُ عَلَى تَحَمُّلِ مَا ابْتَلاهُ اللَّهُ بِهِ بِمَعْنَى عَدَمِ الِاعْتِرَاضِ عَلَى اللَّهِ أَوِ الدُّخُولِ فِيمَا حَرَّمَهُ بِسَبَبِ الْمُصِيبَةِ فَإِنَّ كَثِيرًا مِنَ الْخَلْقِ يَقَعُونَ فِي الْمَعَاصِي بِتَرْكِهِمُ الصَّبْرَ عَلَى الْمَصَائِبِ وَهُمْ فِي ذَلِكَ عَلَى مَرَاتِبَ مُخْتَلِفَةٍ فَمِنْهُمْ مَنْ يَقَعُ فِي الرِّدَّةِ عِنْدَ الْمُصِيبَةِ وَمِنْهُمْ مَنْ يَقَعُ فِيمَا دُونَ ذَلِكَ مِنَ الْمَعَاصِي كَمُحَاوَلَةِ جَلْبِ الْمَالِ بِطَرِيقٍ مُحَرَّمٍ بِاكْتِسَابِ الْمَكَاسِبِ الْمُحَرَّمَةِ وَمُحَاوَلَةِ الْوُصُولِ إِلَى الْمَالِ بِالْكَذِبِ وَنَحْوِهِ كَمَا يَحْصُلُ لِكَثِيرٍ مِنَ النَّاسِ بِسَبَبِ الْفَقْرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":903},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبُغْضُ الشَّيْطَانِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":904},{"type":"p","text":"الشَّرْحُ يَجِبُ عَلَى الْمُكَلَّفِينَ بُغْضُ الشَّيْطَانِ أَيْ كَرَاهِيَتُهُ لِأَنَّ اللَّهَ تَعَالَى حَذَّرَنَا فِي كِتَابِهِ مِنْهُ تَحْذِيرًا بَالِغًا قَالَ اللَّهُ تَعَالَى ﴿فَاتَّخِذُوهُ عَدُوًّا﴾ [سُورَةَ فَاطِر/6] وَالشَّيْطَانُ هُوَ الْكَافِرُ مِنْ كُفَّارِ الْجِنِّ، وَيُطْلَقُ الشَّيْطَانُ وَيُرَادُ بِهِ إِبْلِيسُ الَّذِي هُوَ جَدُّهُمُ الأَعْلَى.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":905},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبُغْضُ الْمَعَاصِي.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":906},{"type":"p","text":"الشَّرْحُ يَجِبُ كَرَاهِيَةُ الْمَعَاصِي مِنْ حَيْثُ إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى حَرَّمَ عَلَى الْمُكَلَّفِينَ اقْتِرَافَهَا فَيَجِبُ كَرَاهِيَةُ الْمَعَاصِي وَإِنْكَارُهَا بِالْقَلْبِ مِنْ نَفْسِهِ أَوْ مِنْ غَيْرِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":907},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَحَبَّةُ اللَّهِ وَمَحَبَّةُ كَلامِهِ وَرَسُولِهِ وَالصَّحَابَةِ وَالآلِ وَالصَّالِحِينَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":908},{"type":"p","text":"الشَّرْحُ يَجِبُ عَلَى الْمُكَلَّفِ مَحَبَّةُ اللَّهِ تَعَالَى بِتَعْظِيمِهِ عَلَى مَا يَلِيقُ بِهِ وَمَحَبَّةُ كَلامِهِ بِالإِيمَانِ بِهِ وَمَحَبَّةُ رَسُولِهِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِتَعْظِيمِهِ كَمَا يَجِبُ وَمَحَبَّةُ سَائِرِ إِخْوَانِهِ الأَنْبِيَاءِ كَذَلِكَ، وَكَمَالُ هَذِهِ الْمَحَبَّةِ يَكُونُ بِالِانْقِيَادِ لِشَرْعِ اللَّهِ تَعَالَى بِاتِّبَاعِ أَوَامِرِهِ وَاجْتِنَابِ نَوَاهِيهِ قَالَ اللَّهُ تَعَالَى ﴿قُلْ إِنْ كُنْتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ﴾ [سُورَةَ ءَالِ عِمْرَان/31].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":909},{"type":"p","text":"وَأَمَّا مَعْنَى مَحَبَّةِ الصَّحَابَةِ فَهُوَ تَعْظِيمُهُمْ لِأَنَّهُمْ أَنْصَارُ دِينِ اللَّهِ وَلا سِيَّمَا السَّابِقُونَ الأَوَّلُونَ مِنْهُم مِنَ الْمُهَاجِرِينَ وَالأَنْصَارِ. وَالْمَعْنَى أَنَّهُ يَجِبُ مَحَبَّتُهُمْ مِنْ حَيْثُ الإِجْمَالُ وَلَيْسَ الْمَعْنَى أَنَّهُ يَجِبُ مَحَبَّةُ كُلِّ فَرْدٍ مِنْهُمْ. وَأَمَّا الآلُ فَإِنْ أُرِيدَ بِهِ مُطْلَقُ أَتْبَاعِ النَّبِيِّ الأَتْقِيَاءِ فَتَجِبُ مَحَبَّتُهُمْ لِأَنَّهُمْ أَحْبَابُ اللَّهِ تَبَارَكَ وَتَعَالَى لِمَا لَهُمْ مِنَ الْقُرْبِ إِلَيْهِ بِطَاعَتِهِ الْكَامِلَةِ وَإِنْ أُرِيدَ بِهِ أَزْوَاجُهُ وَأَقْرِبَاؤُهُ الْمُؤْمِنُونَ فَوُجُوبُ مَحَبَّتِهِمْ لِمَا خُصُّوا بِهِ مِنَ الْفَضْلِ قَالَ اللَّهُ تَعَالَى ﴿إِنَّمَا يُرِيدُ اللَّهُ لِيُذْهِبَ عَنْكُمُ الرِّجْسَ أَهْلَ الْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيرًا﴾ [سُورَةَ الأَحْزَاب/33] وَيَجِبُ مَحَبَّةُ عُمُومِ الصَّالِحِينَ مِنْ عِبَادِ اللَّهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":910}]},{"id":"heart-sins","title":"مَعَاصِي الْقَلْبِ","description":"الفصل المخصص لبيان معاصي القلب.","icon":"fa-heart-crack","start":911,"end":954,"paragraphCount":43,"wordCount":2025,"readMinutes":12,"blocks":[{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":911},{"type":"p","text":"الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مَعَاصِي الْقَلْبِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":912},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ مَعَاصِي الْقَلْبِ الرِّيَاءُ بِأَعْمَالِ الْبِرِّ أَيِ الْحَسَنَاتِ وَهُوَ الْعَمَلُ لِأَجْلِ النَّاسِ أَيْ لِيَمْدَحُوهُ وَيُحْبِطُ ثَوَابَهَا وَهُوَ مِنَ الْكَبَائِرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":913},{"type":"p","text":"الشَّرْحُ أَنَّ فِي هَذِهِ الْجُمْلَةِ بَيَانَ مَعْصِيَةٍ مِنْ مَعَاصِي الْقَلْبِ وَهِيَ الرِّيَاءُ وَهُوَ مِنَ الْكَبَائِرِ وَهُوَ أَنْ يَقْصِدَ الإِنْسَانُ بِأَعْمَالِ الْبِرِّ كَالصَّوْمِ وَالصَّلاةِ وَقِرَاءَةِ الْقُرْءَانِ وَالْحَجِّ وَالزَّكَاةِ وَالصَّدَقَاتِ وَالإِحْسَانِ إِلَى النَّاسِ مَدْح 0,"index":917},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالشَّكُّ فِي اللَّهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":918},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ الشَّكَّ فِي اللَّهِ أَيْ فِي وُجُودِهِ وَكَذَا الشَّكُّ فِي قُدْرَتِهِ أَوْ وَحْدَانِيَّتِهِ أَوْ حِكْمَتِهِ أَوْ عَدْلِهِ أَوْ فِي عِلْمِه أَوْ فِي صِفَةٍ أُخْرَى مِنَ الصِّفَاتِ الثَّلاثَ عَشْرَةَ فَالشَّكُّ هُنَا يَضُرُّ وَلَوْ كَانَ مُجَرَّدَ تَرَدُّدٍ مَا لَمْ يَكُنْ خَاطِرًا يَرِدُ عَلَى الْقَلْبِ بِلا إِرَادَةٍ. قَالَ اللَّهُ تَعَالَى ﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ ءَامَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾ [سُورَةَ الْحُجُرَات/15] دَلَّتِ الآيَةُ عَلَى أَنَّ مَنْ شَكَّ فِي وُجُودِ اللَّهِ أَوْ قُدْرَتِهِ أَوْ نَحْوِ ذَلِكَ لَيْسَ بِمُؤْمِنٍ وَأَنَّ الإِيمَانَ لا يَحْصُلُ إِلَّا بِالْجَزْمِ وَأَنَّ التَّرَدُّدَ يُنَافِيهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":919},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالأَمْنُ مِنْ مَكْرِ اللَّهِ وَالْقُنُوطُ مِنْ رَحْمَةِ اللَّهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":920},{"type":"p","text":"الشَّرْحُ أَنَّ مِنَ الْمَعَاصِي الْقَلْبِيَّةِ الأَمْنَ مِنْ مَكْرِ اللَّهِ وَالْقُنُوطَ مِنْ رَحْمَةِ اللَّهِ أَمَّا الأَمْنُ مِنْ مَكْرِ اللَّهِ فَمَعْنَاهُ الِاسْتِرْسَالُ فِي الْمَعَاصِي مَعَ الِاتِّكَالِ عَلَى الرَّحْمَةِ فَهَذَا مِنَ الْمَعَاصِي الْكَبَائِرِ مِمَّا لا يَنْقُلُ عَنِ الْمِلَّةِ. وَأَمَّا الْقُنُوطُ مِنْ رَحْمَةِ اللَّهِ فَهُوَ أَنْ يُسِيءَ الْعَبْدُ الظَّنَّ بِاللَّهِ فَيَعْتَقِدَ أَنَّ اللَّهَ لا يَغْفِرُ لَهُ أَلْبَتَّةَ وَأَنَّهُ لا مَحَالَةَ يُعَذِّبُهُ وَذَلِكَ نَظَرًا لَكَثْرَةِ ذُنُوبِهِ مَثَلًا فَهُوَ بِهَذَا الْمَعْنَى كَبِيرَةٌ مِنَ الْكَبَائِرِ لا يَنْقُلُ عَنِ الإِسْلامِ. وَطَرِيقُ النَّجَاةِ الَّذِي يَنْبَغِي أَنْ يَكُونَ عَلَيْهِ الْمُؤْمِنُ أَنْ يَكُونَ خَائِفًا رَاجِيًا يَخَافُ عِقَابَ اللَّهِ عَلَى ذُنُوبِهِ وَيَرْجُو رَحْمَةَ اللَّهِ أَمَّا عِنْدَ الْمَوْتِ فَيُغَلِّبُ الرَّجَاءَ عَلَى الْخَوْفِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":921},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّكَبُّرُ عَلَى عِبَادِهِ وَهُوَ رَدُّ الْحَقِّ عَلَى قَائِلِهِ وَاسْتِحْقَارُ النَّاسِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":922},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ الَّتِي هِيَ مِنَ الْكَبَائِرِ التَّكَبُّرَ عَلَى عِبَادِ اللَّهِ وَهُوَ نَوْعَانِ أَوَّلُهُمَا رَدُّ الْحَقِّ عَلَى قَائِلِهِ مَعَ الْعِلْمِ بِأَنَّ الصَّوَابَ مَعَ الْقَائِلِ لِنَحْوِ كَوْنِ الْقَائِلِ صَغِيرَ السِّنِّ فَيَسْتَعْظِمُ أَنْ يَرْجِعَ إِلَى الْحَقِّ مِنْ أَجْلِ أَنَّ قَائِلَهُ صَغِيرُ السِّنِ وَثَانِيهِمَا اسْتِحْقَارُ النَّاسِ أَيِ ازْدِرَاؤُهُمْ كَأَنْ يَتَكَبَّرَ عَلَى الْفَقِيرِ وَيَنْظُرَ إِلَيْهِ نَظَرَ احْتِقَارٍ أَوْ يُعْرِضَ عَنْهُ أَوْ يَتَرَفَّعَ عَلَيْهِ فِي الْخِطَابِ لِكَوْنِهِ أَقَلَّ مِنْهُ مَالًا. وَقَدْ نَهَى اللَّهُ تَعَالَى عِبَادَهُ عَنِ التَّكَبُّرِ قَالَ اللَّهُ تَعَالَى ﴿وَلا تُصَعِّرْ خَدَّكَ لِلنَّاسِ﴾ [سُورَةَ لُقْمَان/18] أَيْ وَلا تُعْرِضْ عَنْهُمْ مُتَكَبِّرًا وَالْمَعْنَى أَقْبِلْ عَلَى النَّاسِ بِوَجْهِكَ مُتَوَاضِعًا وَلا تُوَلِّهِمْ شِقَّ وَجْهِكَ وَصَفْحَتَهُ كَمَا يَفْعَلُهُ الْمُتَكَبِّرُونَ ﴿وَلا تَمْشِ فِي الأَرْضِ مَرَحًا﴾ [سُورَةَ الإِسْرَاء/37] أَيْ لا تَمْشِ مِشْيَةَ الْكِبْرِ وَالْفَخْرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":923},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْحِقْدُ وَهُوَ إِضْمَارُ الْعَدَاوَةِ إِذَا عَمِلَ بِمُقْتَضَاهُ وَلَمْ يَكْرَهْهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":924},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ الْحِقْدَ وَهُوَ مَصْدَرُ حَقَدَ يَحْقِدُ وَهُوَ إِضْمَارُ الْعَدَاوَةِ لِلْمُسْلِمِ مَعَ الْعَمَلِ بِمُقْتَضَاهُ تَصْمِيمًا أَوْ قَوْلًا أَوْ فِعْلًا فَإِذَا لَمْ يَعْمَلْ بِمُقْتَضَى ذَلِكَ لا يَكُونُ مَعْصِيَةً. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":925},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْحَسَدُ وَهُوَ كَرَاهِيَةُ النِّعْمَةِ لِلْمُسْلِمِ وَاسْتِثْقَالُهَا وَعَمَلٌ بِمُقْتَضَاهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":926},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ الْحَسَدَ. قَالَ اللَّهُ تَعَالَى ﴿وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾ [سُورَةَ الْفَلَق/5]  أَيْ أَسْتَجِيرُ بِاللَّهِ مِنْ شَرِّ الْحَاسِدِ إِذَا أَظْهَرَهُ أَمَّا إِذَا لَمْ يُظْهِرِ الْحَسَدَ فَلا يَتَأَذَّى بِهِ إِلَّا الْحَاسِدُ لِاغْتِمَامِهِ بِنِعْمَةِ غَيْرِهِ. وَالْحَسَدُ هُوَ أَنْ يَكْرَهَ الشَّخْصُ النِّعْمَةَ الَّتِي أَنْعَمَ اللَّهُ بِهَا عَلَى الْمُسْلِمِ دِينِيَّةً كَانَتْ أَوْ دُنْيَوِيَّةً وَيَتْمَنَّى زَوَالَهَا وَيَسْتَثْقِلُهَا لَهُ، وَإِنَّمَا يَكُونُ مَعْصِيَةً إِذَا عَمِلَ بِمُقْتَضَاهُ تَصْمِيمًا أَوْ قَوْلًا أَوْ فِعْلًا أَمَّا إِذَا لَمْ يَقْتَرِنْ بِهِ الْعَمَلُ فَلَيْسَ فِيهِ مَعْصِيَةٌ. وَيَنْبَغِي لِلْمُسْلِمِ أَنْ يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ فَفِي الصَّحِيحِ «مَنْ أَحَبَّ أَنْ يُزَحْزَحَ عَنِ النَّارِ وَيُدْخَلَ الْجَنَّةَ فَلْتَأْتِهِ مَنِيَّتُهُ وَهُوَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ وَلْيَأْتِ النَّاسَ بِمَا يُحِبُّ أَنْ يُؤْتَى إِلَيْهِ» رَوَاهُ مُسْلِمٌ وَالْبَيْهَقِيُّ وَغَيْرُهُمَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":927},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْمَنُّ بِالصَّدَقَةِ وَيُبْطِلُ ثَوَابَهَا كَأَنْ يَقُولَ لِمَنْ تَصَدَّقَ عَلَيْهِ أَلَمْ أُعْطِكَ كَذَا يَوْمَ كَذَا وَكَذَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":928},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي الْقَلْبِ الَّتِي هِيَ مِنَ الْكَبَائِرِ الْمَنُّ بِالصَّدَقَةِ وَهُوَ أَنْ يُعَدِّدَ نِعْمَتَهُ عَلَى ءَاخِذِهَا كَأَنْ يَقُولَ لَهُ أَلَمْ أَفْعَلْ لَكَ كَذَا وَكَذَا حَتَّى يَكْسِرَ قَلْبَهُ أَوْ يَذْكُرَهَا لِمَنْ لا يُحِبُّ الآخِذُ اطِّلاعَهُ عَلَيْهَا وَهُوَ يُحْبِطُ الثَّوَابَ وَيُبْطِلُهُ قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا لا تُبْطِلُوا صَدَقَاتِكُم بِالْمَنِّ وَالأَذَى﴾ [سُورَةَ الْبَقَرَة/264]. وَإِنَّمَا عَدَّهَا مِنْ مَعَاصِي الْقَلْبِ لِأَنَّ الْمَنَّ يَكُونُ أَصْلًا فِي الْقَلْبِ لِأَنَّ الْمَانَّ يَقْصِدُ إِيذَاءَ الشَّخْصِ فَيَتَفَرَّعُ مِنْ ذَلِكَ الْعَمَلُ الْبَدَنِيُّ وَهُوَ ذِكْرُ إِنْعَامِهِ عَلَى الشَّخْصِ بِلِسَانِهِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":929},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالإِصْرَارُ عَلَى الذَّنْبِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":930},{"type":"p","text":"الشَّرْحُ أَنَّ مِنَ الْمَعَاصِي الْقَلْبِيَّةِ الإِصْرَارَ عَلَى الذَّنْبِ وَعُدَّ هَذَا مِنْ مَعَاصِي الْقَلْبِ لِأَنَّهُ يَقْتَرِنُ بِهِ قَصْدُ النَّفْسِ مُعَاوَدَةَ ذَلِكَ الذَّنْبِ وَعَقْدُ الْقَلْبِ عَلَى ذَلِكَ ثُمَّ يَسْتَتْبِعُ ذَلِكَ الْعَمَلَ بِالْجَوَارِحِ. وَالإِصْرَارُ الَّذِي هُوَ مَعْدُودٌ مِنَ الْكَبَائِرِ هُوَ أَنْ تَغْلِبَ مَعَاصِيهِ طَاعَاتِهِ فَيَصِيرُ عَدَدُ مَعَاصِيهِ أَكْبَرَ مِنْ عَدَدِ طَاعَاتِهِ أَيْ بِالنِّسْبَةِ لِمَا مَضَى وَلَيْسَ بِالنِّسْبَةِ لِيَوْمِهِ فَقَطْ فَيَصِيرُ بِذَلِكَ وَاقِعًا فِي هَذِهِ الْكَبِيرَةِ. وَأَمَّا مُجَرَّدُ تَكْرَارِ الذَّنْبِ الَّذِي هُوَ مِنْ نَوْعِ الصَّغَائِرِ وَالْمُدَاوَمَةِ عَلَيْهِ فَلَيْسَ بِكَبِيرَةٍ إِذَا لَمْ يَغْلِبْ ذَلِكَ الذَّنْبُ طَاعَاتِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":931},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَسُوءُ الظَّنِّ بِاللَّهِ وَبِعِبَادِ اللَّهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":932},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي الْقَلْبِ سُوءُ الظَّنِّ بِاللَّهِ وَهُوَ أَنْ يَظُنَّ بِرَبِّهِ أَنَّهُ لا يَرْحَمُهُ بَلْ يُعَذِّبُهُ، وَسُوءُ الظَّنِّ بِعِبَادِ اللَّهِ وَهُوَ أَنْ يَظُنَّ بِعِبَادِهِ السُّوءَ بِغَيْرِ قَرِينَةٍ مُعْتَبَرَةٍ قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا ٱجْتَنِبُوا كَثِيرًا مِّنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ﴾ [سُورَةَ الْحُجُرَات/12] قَالَ الزَّجَّاجُ هُوَ ظَنُّكَ بِأَهْلِ الْخَيْرِ سُوءًا فَأَمَّا أَهْلُ الْفِسْقِ فَلَنَا أَنْ نَظُنَّ فِيهِمْ مِثْلَ الَّذِي ظَهَرَ مِنْهُمْ اهـ وَالإِثْمُ الْمَذْكُورُ فِي الآيَةِ الذَّنْبُ الَّذِي يَسْتَحِقُّ صَاحِبُهُ الْعِقَابَ. وَقَدْ رَوَى الْبُخَارِيُّ وَمُسْلِمٌ مِنْ حَدِيثِ أَبِي هُرَيْرَةَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ «إِيَّاكُمْ وَالظَّنَّ فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ» فَالظَّنُّ الَّذِي ذَمَّهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هُوَ الظَّنُّ بِلا قَرِينَةٍ مُعْتَبَرَةٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":933},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالتَّكْذِيبُ بِالْقَدَرِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":934},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ التَّكْذِيبَ بِالْقَدرِ وَهُوَ كُفْرٌ وَذَلِكَ بِأَنْ يَعْتَقِدَ الْعَبْدُ أَنَّ شَيْئًا مِنَ الْجَائِزَاتِ الْعَقْلِيَّةِ يَحْصُلُ بِغَيْرِ تَقْدِيرِ اللَّهِ قَالَ اللَّهُ تَعَالَى ﴿إِنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾ [سُورَةَ الْقَمَر/49] وَقَدْ فُسِّرَ الْقَدَرُ بِالتَّدْبِيرِ، وَمَعْنَاهُ أَنَّ اللَّهَ دَبَّرَ فِي الأَزَلِ الأَشْيَاءَ فَإِذَا وَقَعَتْ تَكُونُ عَلَى حَسَبِ تَقْدِيرِهِ الأَزَلِيِّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":935},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْفَرَحُ بِالْمَعْصِيَةِ مِنْهُ أَوْ مِنْ غَيْرِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":936},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ الْفَرَحَ بِالْمَعْصِيَةِ الصَّادِرَةِ مِنْهُ أَوْ مِنْ غَيْرِهِ فَمَنْ عَلِمَ بِمَعْصِيَةٍ حَصَلَتْ مِنْ غَيْرِهِ وَلَوْ لَمْ يَشْهَدْهَا وَلَوْ فِي مَكَانٍ بَعِيدٍ فَفَرِحَ بِذَلِكَ فَقَدْ عَصَى اللَّهَ، وَأَمَّا الْفَرَحُ بِكُفْرِ الْغَيْرِ فَهُوَ كُفْرٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":937},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْغَدْرُ وَلَوْ بِكَافِرٍ كَأَنْ يُؤَمِّنَهُ ثُمَّ يَقْتُلَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":938},{"type":"p","text":"الشَّرْحُ أَنَّ الْغَدْرَ مِنَ الْمَعَاصِي الْمُحَرَّمَةِ وَهُوَ مِنْ قِسْمِ الْكَبَائِرِ وَذَلِكَ كَأَنْ يَقُولَ لِشَخْصٍ أَنْتَ فِي حِمَايَتِي ثُمَّ يَفْتِكَ بِهِ هُوَ أَوْ يَدُلَّ عَلَيْهِ مَنْ يَفْتِكُ بِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":939},{"type":"p","text":"وَمِنَ الْغَدْرِ الْمُحَرَّمِ الَّذِي هُوَ مِنَ الْكَبَائِرِ أَنْ يَغْدِرَ بِالإِمَامِ بَعْدَ أَنْ يُبَايِعَهُ بِأَنْ يَعُودَ مُحَارِبًا لَهُ أَوْ يُعْلِنَ تَمَرُّدَهُ عَلَى طَاعَتِهِ أَيْ بَعْدَ حُصُولِ الإِمَامَةِ لَهُ شَرْعًا أَيْ بَعْدَ أَنْ يَصِيرَ خَلِيفَةً وَذَلِكَ مُتَّفَقٌ عَلَى حُرْمَتِهِ إِنْ كَانَ ذَلِكَ الإِمَامُ رَاشِدًا. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":940},{"type":"p","text":"وَأَمَّا الْغَدْرُ بِالْكَافِرِ فَهُوَ أَنَّهُ إِذَا أَمَّنَ الْكَافِرَ الإِمَامُ أَوْ غَيْرُهُ مِنَ الْمُسْلِمِينَ بِأَنْ قِيلَ لَهُ لا بَأْسَ عَلَيْكَ أَوْ أَنْتَ ءَامِنٌ فَيَحْرُمُ الْغَدْرُ بِهِ بِالْقَتْلِ أَوْ نَحْوِهِ قَالَ اللَّهُ تَعَالَى ﴿وَإِنْ أَحَدٌ مِّنَ الْمُشْرِكِينَ اسْتَجَارَكَ فَأَجِرْهُ حَتَّى يَسْمَعَ كَلامَ اللَّهِ﴾ الآيَةَ وَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «مَنْ أَمَّنَ رَجُلًا عَلَى دَمِهِ ثُمَّ قَتَلَهُ فَأَنَا بَرِيءٌ مِنْهُ وَلَوْ كَانَ الْمَقْتُولُ كَافِرًا» رَوَاهُ ابْنُ حِبَّانَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":941},{"type":"p","text":"وَمِنَ الْغَدْرِ الْمُحَرَّمِ أَنْ يُعَامِلَ الْمُسْلِمُ الْكَافِرَ بِالْبَيْعِ وَالشِّرَاءِ فَيَخُونَهُ فِي الْوَزْنِ أَوِ الْكَيْلِ وَأَنْ يُضَيِّعَ وَدِيعَةً اسْتَوْدَعَهُ إِيَّاهَا الْكَافِرُ فَيُتْلِفَهَا أَوْ يَجْحَدَهَا وَأَنْ يَشْتَرِيَ مِنْهُ شَيْئًا بِثَمَنٍ مُؤَجَّلٍ ثُمَّ يَجْحَدَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":942},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْمَكْرُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":943},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ الْمَكْرَ، وَالْمَكْرُ وَالْخَدِيعَةُ بِمَعْنًى وَاحِدٍ وَهُوَ إِيقَاعُ الضَّرَرِ بِالْمُسْلِمِ بِطَرِيقَةٍ خَفِيَّةٍ. رَوَى الْحَاكِمُ فِي الْمُسْتَدْرَكِ حَدِيثَ «الْمَكْرُ وَالْخَدِيعَةُ فِي النَّارِ» فَمَنْ مَكَرَ بِأَحَدٍ مِنَ الْمُسْلِمِينَ فَقَدْ وَقَعَ فِي كَبِيرَةٍ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":944},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبُغْضُ الصَّحَابَةِ وَالآلِ وَالصَّالِحِينَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":945},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ بُغْضَ أَصْحَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. وَالصَّحَابِيُّ هُوَ مَنْ لَقِيَهُ فِي حَيَاتِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَعَ الإِيْمَانِ بِهِ سَوَاءٌ طَالَتْ صُحْبَتُهُ لَهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَوْ لَمْ تَطُلْ وَمَاتَ عَلَى ذَلِكَ وَلَوْ تَخَلَّلَتْ بَيْنَ صُحْبَتِهِ لَهُ وَبَيْنَ مَوْتِهِ عَلَى الإِسْلامِ رِدَّةٌ. وَالَّذِي يُبْغِضُ كُلَّ الصَّحَابَةِ يَكْفُرُ. وَأَمَّا الآلُ فَالْمُرَادُ بِهِمْ هُنَا أَقْرِبَاؤُهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْمُؤْمِنُونَ وَأَزْوَاجُهُ. وَأَمَّا الصَّالِحُونَ فَالْمُرَادُ بِهِمُ الأَتْقِيَاءُ الَّذِينَ أَدَّوُا الْوَاجِبَاتِ وَاجْتَنَبُوا الْمُحَرَّمَاتِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":946},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالْبُخْلُ بِمَا أَوْجَبَ اللَّهُ وَالشُّحُّ وَالْحِرْصُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":947},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ الْبُخْلَ بِمَا أَوْجَبَ اللَّهُ تَعَالَى كَالْبُخْلِ عَنْ أَدَاءِ الزَّكَاةِ لِلْمُسْتَحِقِّينَ وَالْبُخْلِ عَنْ دَفْعِ نَفَقَةِ الزَّوْجَةِ الْوَاجِبَةِ وَالأَطْفَالِ وَالْبُخْلِ عَنْ نَفَقَةِ الأَبَوَيْنِ الْمُحْتَاجَيْنِ وَالْبُخْلِ عَنْ مُوَاسَاةِ الْقَرِيبِ مَعَ حَاجَتِهِ. وَيُرَادِفُهُ الشُّحُّ وَهُوَ بِمَعْنَاهُ إِلَّا أَنَّ الشُّحَّ يُخَصُّ بِالْبُخْلِ الشَّدِيدِ. وَقَرِيبٌ مِنْ ذَلِكَ الْحِرْصُ لِأَنَّ الْحِرْصَ هُوَ شِدَّةُ تَعَلُّقِ النَّفْسِ لِاحْتِوَاءِ الْمَالِ وَجَمْعِهِ عَلَى الْوَجِهِ الْمَذْمُومِ كَالتَّوَصُّلِ بِهِ إِلَى التَّرَفُّعِ عَلَى النَّاسِ وَالتَّفَاخُرِ وَعَدَمِ بَذْلِهِ إِلَّا فِي هَوَى النَّفْسِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":948},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالِاسْتِهَانَةُ بِمَا عَظَّمَ اللَّهُ وَالتَّصْغِيرُ لِمَا عَظَّمَ اللَّهُ مِنْ طَاعَةٍ أَوْ مَعْصِيَةٍ أَوْ قُرْءَانٍ أَوْ عِلْمٍ أَوْ جَنَّةٍ أَوْ عَذَابِ نَارٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":949},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْقَلْبِ قِلَّةَ الْمُبَالاةِ بِمَا عَظَّمَ اللَّهُ تَعَالَى مِنَ الأُمُورِ كَأَنْ يَحْتَقِرَ الْجَنَّةَ كَقَوْلِ بَعْضِ الدَّجَاجِلَةِ الْمُتَصَوِّفَةِ «الْجَنَّةُ لُعْبَةُ الصِّبْيَانِ» وَقَوْلِ بَعْضِهِمْ «الْجَنَّةُ خَشْخَاشَةُ الصِّبْيَانِ» وَهَذَا حُكْمُهُ الرِدَّةُ. وَمِنْ ذَلِكَ قَوْلُ بَعْضِهِمْ «جَهَنَّمُ مُسْتَشْفَى» أَيْ مَحَلُّ طَبَابَةٍ وَعِلاجٍ وَتَنْظِيفٍ لَيْسَتْ مَحَلَّ عِقَابٍ وَتَعْذِيبٍ وَذَلِكَ إِلْحَادٌ وَكُفْرٌ، وَهَذَا قَوْلُ جَمَاعَةِ أَمِينِ شَيْخُو الدِّمَشْقِيِّ الَّذِينَ زَعِيمُهُمُ الْيَوْمَ عَبْدُ الْهَادِي الْبَانِي فَعَلَى زَعْمِهِمُ التَّعْذِيبُ لا يَجُوزُ وَصْفُ اللَّهِ بِهِ وَيَقُولُونَ عَنِ الآيَةِ ﴿شَدِيدِ الْعِقَابِ﴾ [سُورَةَ غَافِر/3] مَعْنَاهُ شَدِيدُ التَّعَقُّبِ، وَيَقُولُونَ إِنَّ الأَنْبِيَاءَ لَمْ يُقْتَلْ أَحَدٌ مِنْهُمْ وَيَزْعُمُونَ أَنَّ قَوْلَ اللَّهِ تَعَالَى ﴿وَقَتْلَهُمُ الأَنْبِيَاءَ﴾ [سُورَةَ ءَالِ عِمْرَان/181] مَعْنَاهُ قَتْلُ الْكُفَّارِ دَعْوَتَهُمْ وَيَقُولُونَ الأَنْبِيَاءُ لا يُصَابُونَ بِجُرُوحٍ بِسِلاحِ الْكُفَّارِ وَيُنْكِرُونَ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كُسِرَتْ رَبَاعِيَتُهُ وَشُجَّ وَجْهُهُ، وَيَقُولُونَ اللَّهُ شَاءَ السَّعَادَةَ لِجَمِيعِ خَلْقِهِ وَهَذَا قَوْلُ الْمُعْتَزِلَةِ لا أَهْلِ السُّنَّةِ وَيَقُولُونَ عِلْمُ الدِّينِ يُؤْخَذُ مِنْ قُلُوبِ مَشَايِخِهِمُ النَّقْشَبَنْدِيِّينَ مِنْ قَلْبٍ إِلَى قَلْبٍ وَلَيْسَ مِنَ الْكُتُبِ فَهَؤُلاءِ يَجِبُ الْحَذَرُ وَالتَّحْذِيرُ مِنْهُمْ وَمِنْ أَمْثَالِهِمْ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":950},{"type":"p","text":"وَلا يَجُوزُ أَنْ يُقَالَ عَنْ مَعْصِيَةٍ مِنَ الْمَعَاصِي كَبِيرَةً أَوْ صَغِيرَةً «مَعْلِيش» وَهِيَ فِي اللُّغَةِ الْعَامِيَّةِ مَعْنَاهَا لا بَأْسَ بِذَلِكَ فَمَنْ قَالَ عَنْ مَعْصِيَةٍ وَهُوَ يَعْلَمُ أَنَّهَا مَعْصِيَةٌ هَذِهِ الْكَلِمَةَ بِمَعْنَى لا بَأْسَ فَهُوَ مُكَذِّبٌ لِلدِّينِ فَيَكُونُ مُرْتَدًّا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":951},{"type":"p","text":"وَمِنْ جُمْلَةِ الْمَعَاصِي الْقَلْبِيَّةِ تَصْغِيرُ مَا عَظَّمَ اللَّهُ مِنَ الْقُرْءَانِ أَوْ عِلْمِ الشَّرْعِ أَيْ عِلْمِ الدِّينِ أَوِ الْجَنَّةِ أَوِ النَّارِ وَقَدْ ذَكَرْنَا بَعْضَ الأَمْثِلَةِ لِلِاسْتِهَانَةِ بِالْجَنَّةِ وَتَصْغِيرِ عَذَابِ النَّارِ، وَأَمَّا الِاسْتِهَانَةُ بِالْقُرْءَانِ فَكَمِثْلِ مَا رَوَاهُ الإِمَامُ عَبْدُ الْكَريِمِ الْقُشَيْرِيُّ فِي الرِّسَالَةِ أَنَّ عَمْرَو بنَ عُثْمَانَ الْمَكِيَّ صُوفِيَّ مَكَّةَ فِي عَصْرِهِ رَأَى الْحَلَّاجَ الْحُسَيْنَ بنَ مَنْصُورٍ يَكْتُبُ شَيْئًا فَقَالَ لَهُ مَا هَذَا فَقَالَ هَذَا شَىْءٌ أُعَارِضُ بِهِ الْقُرْءَانَ فَمَقَتَهُ بَعْدَ أَنْ كَانَ يُحَسِّنُ بِهِ الظَّنَّ وَصَارَ يَلْعَنُهُ وَيُحَذِّرُ مِنْهُ حَتَّى بَعْدَ أَنْ غَادَرَ الْحَلَّاجُ مَكَّةَ فَإِنَّهُ كَانَ يَكْتُبُ فِي التَّحْذِيرِ مِنْهُ إِلَى النَّاحِيَةِ الَّتِي يَحِلُّ بِهَا الْحَلَّاجُ، وَكَالَّذِي حَصَلَ مِنْ بَعْضِ التِّجَّانِيَّةِ فِي الْحَبَشَةِ مِنْ إِظْهَارِ الِاسْتِغْنَاءِ بِصَلاةِ الْفَاتِحِ عَنِ الْقُرْءَانِ حَتَّى قَالَ قَائِلُهُمْ بِكَلامِهِمْ مَا مَعْنَاهُ مَا لَكُمْ تَحْمِلُونَ هَذَا الرَّغِيفَ الثَّقِيلَ يَعْنِي الْقُرْءَانَ وَنَحْنُ بِغُنْيَةٍ عَنْهُ بِصَلاةِ الْفَاتِحِ، وَصَلاةُ الْفَاتِحِ هِيَ كَلِمَةٌ وَجِيزَةٌ وَهِيَ هَذِهِ الصِّيغَةُ «اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ الْفَاتِحِ لِمَا أُغْلِقَ الْخَاتِم لِمَا سَبَقَ نَاصِرِ الْحَقِّ بِالْحَقِّ وَالْهَادِي إِلَى صِرَاطِكَ الْمُسْتَقِيمِ وَعَلَى ءَالِهِ وَصَحْبِهِ حَقَّ قَدْرِهِ وَمِقْدَارِهِ الْعَظِيمِ» وَهِيَ فِي الأَصْلِ مِنْ تَأْلِيفِ الشَّيْخِ مُصْطَفَى الْبَكْرِيِّ الصُّوفِيِّ ثُمَّ اسْتَعْمَلَهَا كَثِيرٌ مِنَ التِّجَانِيَّةِ وَاعْتَبَرَ قِسْمٌ مِنْهُمُ الْمَرَّةَ الْوَاحِدَةَ مِنْهَا تَعْدِلُ سِتَّةَ ءَالافِ خَتْمَةٍ مِنَ الْقُرْءَانِ وَادَّعَوْا أَنَّ ذَلِكَ مِمَّا شَافَهَ بِهِ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقَظَةً الشَّيْخَ أَبَا الْعَبَّاسِ التِّجَّانِيَّ الَّذِي تَنْتَسِبُ إِلَيْهِ التِّجَّانِيَّةُ، عَلَى أَنَّنَا لا نَجْزِمُ بِأَنَّ الشَّيْخَ أَبَا الْعَبَّاسِ هُوَ الْقَائِلُ لِمَا يَدَّعُونَهُ لِاحْتِمَالِ أَنْ يَكُونُوا قَدْ كَذَبُوا عَلَيْهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":952},{"type":"p","text":"وَقَدْ تَكُونُ الِاسْتِهَانَةُ بِالإِخْلالِ بِالتَّعْظِيمِ الْوَاجِبِ مِنْ غَيْرِ أَنْ يَصِلَ الإِخْلالُ إِلَى حَدِّ الْكُفْرِ كَمَسِّ الْمُصْحَفِ وَحَمْلِهِ عَلَى غَيْرِ طَهَارَةٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":953}]},{"id":"stomach-sins","title":"مَعَاصِي الْبَطْنِ","description":"الفصل المخصص لبيان معاصي البطن.","icon":"fa-bowl-food","start":954,"end":972,"paragraphCount":18,"wordCount":688,"readMinutes":4,"blocks":[{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":954},{"type":"p","text":"الشَّرْحُ أَنَّ هَذَا فَصْلٌ مَعْقُودٌ لِبَيَانِ مَعَاصِي الْبَطْنِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":955},{"type":"p","text":" قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْ مَعَاصِي الْبَطْنِ أَكْلُ الرِّبَا وَالْمَكْسِ وَالْغَصْبِ وَالسَّرِقَةِ وَكُلِّ مَأْخُوذٍ بِمُعَامَلَةٍ حَرَّمَهَا الشَّرْعُ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":956},{"type":"p","text":"الشَّرْحُ أَنَّ هَذَا الْفَصْلَ وَمَا بَعْدَهُ مِنَ الْفُصُولِ عُقِدَ لِبَيَانِ مَعَاصِي الْجَوَارِحِ فَكُلُّ مَالٍ يَدْخُلُ عَلَى الشَّخْصِ بِطَرِيقِ الرِّبَا أَكْلُهُ حَرَامٌ، وَالْمُرَادُ بِالأَكْلِ هُنَا الِانْتِفَاعُ بِهِ سَوَاءٌ كَانَ أَكْلًا وَاصِلًا لِلْبَطْنِ أَوِ انْتِفَاعًا بِاللُّبْسِ أَوِ انْتِفَاعًا بِغَيْرِ ذَلِكَ مِنْ وُجُوهِ التَّصَرُّفَاتِ بِأَنْوَاعِ الِانْتِفَاعَاتِ. وَأَخْذُ الْمَالِ مِنْ طَرِيقِ الرِّبَا كَبِيرَةٌ وَسَوَاءٌ فِي ذَلِكَ الآخِذُ وَالْعَامِلُ فِي نَحْوِ الْكِتَابَةِ لِعُقُودِ الرِّبَا بَيْنَ الْمُتَرَابِيَيْنِ وَمِثْلُهُمَا الدَّافِعُ لِحَدِيثِ «لَعَنَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ءَاكِلَ الرِّبَا وَمُوكِلَهُ وَكَاتِبَهُ وَشَاهِدَيْهِ» رَوَاهُ مُسْلِمٌ وَفِي رِوَايَةٍ لِأَبِي دَاوُدَ «وَشَاهِدَهُ» فَاللَّعْنُ الْمَذْكُورُ فِي الْحَدِيثِ شَمَلَ الْكَاتِبَ إِنْ كَانَ يَكْتُبُ بِأُجْرَةٍ أَوْ بِغَيْرِ أُجْرَةٍ وَالشَّاهِدَيْنِ سَوَاءٌ كَانَا بِأُجْرَةٍ أَوْ بِغَيْرِ أُجْرَةٍ، وَقَدْ مَرَّ بَيَانُ أَنْوَاعِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":957},{"type":"p","text":"وَمِنْ ذَلِكَ أَكْلُ الْمَكْسِ وَهُوَ مَا يَأْخُذُهُ السَّلاطِينُ الظَّلَمَةُ مِنْ أَمْوَالِ النَّاسِ بِغَيْرِ حَقٍّ عَلَى الْبَضَائِعِ وَالْمَزَارِعِ وَالْبَسَاتِينِ وَغَيْرِ ذَلِكَ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":958},{"type":"p","text":"وَمِنْ ذَلِكَ أَكْلُ الْغَصْبِ أَيِ الْمَغْصُوبِ، وَالْغَصْبُ هُوَ الِاسْتِيلاءُ عَلَى حَقِّ الْغَيْرِ ظُلْمًا اعْتِمَادًا عَلَى الْقُوَّةِ فَخَرَجَ مَا يُؤْخَذُ مِنَ النَّاسِ بِحَقٍّ كَالَّذِي يَأْخُذُهُ الْحَاكِمُ لِسَدِّ الضَّرُورَاتِ مِنْ أَمْوَالِ الأَغْنِيَاءِ إِذَا لَمْ يُوجَدْ فِي بَيْتِ الْمَالِ مَا يَكْفِي لِذَلِكَ فَإِنَّ ذَلِكَ لَيْسَ غَصْبًا بَلْ نَصَّ الْفُقَهَاءُ عَلَى أَنَّهُ يَجُوزُ أَنْ يَأْخُذَ الْحَاكِمُ مِنْ أَمْوَالِ الأَغْنِيَاءِ مَا تَقْتَضِيهِ الضَّرُورَاتُ وَلَوْ أَدَّى ذَلِكَ إِلَى أَنْ لا يَتْرُكَ لَهُمْ إِلَّا نَفَقَةَ سَنَةٍ، وَهَذَا مِنْ جُمْلَةِ النِّظَامِ الإِسْلامِيِّ وَأَيُّ نِظَامٍ أَحْسَنُ مِنْ هَذَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":959},{"type":"p","text":"وَمِنْ ذَلِكَ أَكْلُ السَّرِقَةِ وَهِيَ أَخْذُ الْمَالِ خُفْيَةً لَيْسَ اعْتِمَادًا عَلَى الْقُوَّةِ. وَيَلْتَحِقُ بِذَلِكَ أَكْلُ كُلِّ مَالٍ مَأْخُوذٍ بِمُعَامَلَةٍ حَرَّمَهَا الشَّرْعُ مِمَّا مَرَّ بَيَانُهُ. وَقَدْ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّ أُنَاسًا يَتَخَوَّضُونَ فِي مَالِ اللَّهِ بِغَيْرِ حَقٍّ فَلَهُمُ النَّارُ يَوْمَ الْقِيَامَةِ» رَوَاهُ الْبُخَارِيُّ مِنْ حَدِيثِ خَوْلَةَ الأَنْصَارِيَّةِ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":960},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَشُرْبُ الْخَمْرِ وَحَدُّ شَارِبِهَا أَرْبَعُونَ جَلْدَةً لِلْحُرِّ وَنِصْفُهَا لِلرَّقِيقِ وَلِلإِمَامِ الزِّيَادَةُ تَعْزِيرًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":961},{"type":"p","text":"الشَّرْحُ مِنْ مَعَاصِي الْبَطْنِ شُرْبُ الْخَمْرِ وَهُوَ مِنَ الْكَبَائِرِ وَهِيَ كَمَا قَالَ سَيِّدُنَا عُمَرُ «مَا خَامَرَ الْعَقْلَ» أَيْ غَيَّرَهُ رَوَاهُ عَنْهُ الْبُخَارِيُّ فِي الصَّحِيحِ فِي كِتَابِ الأَشْرِبَةِ. وَأَمَّا حَدُّ الْخَمْرِ فَهُوَ فِي الأَصْلِ بِالنِّسْبَةِ لِشَارِبِهَا الْحُرِّ أَرْبَعُونَ جَلْدَةً وَلِلرَّقِيقِ عِشْرُونَ ثُمَّ إِذَا اقْتَضَتِ الْمَصْلَحَةُ الزِّيَادَةَ عَلَى ذَلِكَ جَازَ إِلَى الثَّمَانِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":962},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمِنْهَا أَكْلُ كُلِّ مُسْكِرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":963},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَطْنِ أَكْلَ كُلِّ مُسْكِرٍ. وَلْيُعْلَمْ أَنَّ الإِسْكَارَ هُوَ تَغْيِيرُ الْعَقْلِ مَعَ الإِطْرَابِ أَيْ مَعَ النَّشْوَةِ وَالْفَرَحِ وَأَمَّا مَا يُغَيِّرُ الْعَقْلَ بِلا إِطْرَابٍ وَكَذَلِكَ مَا يُخَدِّرُ الْحَوَاسَّ مِنْ غَيْرِ تَغْيِيرِ الْعَقْلِ فَلا يُسَمَّى خَمْرًا وَلَكِنَّهُ حَرَامٌ فَالْمُخَدِّرَاتُ كَالْحَشِيشَةِ وَالأُفْيُونِ وَنَحْوِهِمَا لَيْسَتْ مُسْكِرَةً وَلَكِنَّ تَحْريِمَهَا يُفْهَمُ مِنْ قَوْلِ اللَّهِ تَعَالَى ﴿وَلا تَقْتُلُوا أَنْفُسَكُمْ﴾ [سُورَةَ النِّسَاء/29] أَفْهَمَتْنَا الآيَةُ أَنَّ كُلَّ مَا يُؤَدِّي بِالإِنْسَانِ إِلَى الْهَلاكِ فَهُوَ حَرَامٌ أَنْ يَتَعَاطَاهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":964},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكُلِّ نَجِسٍ وَمُسْتَقْذَرٍ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":965},{"type":"p","text":"الشَّرْحُ أَكْلُ النَّجَاسَاتِ مِنْ جُمْلَةِ مَعَاصِي الْبَطْنِ كَالدَّمِ الْمَسْفُوحِ أَيِ السَّائِلِ وَلَحْمِ الْخِنْزِيرِ وَالْمَيْتَةِ. وَكَذَلِكَ الْمُسْتَقْذَرُ يَحْرُمُ أَكْلُهُ وَذَلِكَ كَالْمُخَاطِ وَالْمَنِيِّ وَأَمَّا الْبُصَاقُ فَيَكُونُ مُسْتَقْذَرًا إِذَا تَجَمَّعَ عَلَى شَىْءٍ مَثَلًا بِحَيْثُ تَنْفِرُ مِنْهُ الطِّبَاعُ السَّلِيمَةُ أَيْ بَعْدَ خُرُوجِهِ مِنَ الْفَمِ أَمَّا مَا دَامَ فِي الْفَمِ فَلَيْسَ لَهُ حُكْمُ الْمُسْتَقْذَرِ وَكَذَلِكَ الْبَلَلُ لَيْسَ لَهُ حُكْمُ الْمُسْتَقْذَرِ بِالنِّسْبَةِ لِلأَكْلِ وَنَحْوِهِ فَلْيُتَنَبَّهْ لِذَلِكَ. وَالْمُسْتَقْذَرُ هُوَ الشَّىْءُ الَّذِي تَعَافُهُ النَّفْسُ أَيْ تَنْفِرُ مِنْهُ طَبِيعَةُ الإِنْسَانِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":966},{"type":"p","text":"قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَأَكْلُ مَالِ الْيَتِيمِ أَوِ الأَوْقَافِ عَلَى خِلافِ مَا شَرَطَ الْوَاقِفُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":967},{"type":"p","text":"الشَّرْحُ أَنَّ مِنْ مَعَاصِي الْبَطْنِ أَكْلَ مَالِ الْيَتِيمِ بِغَيْرِ حَقٍّ وَهُوَ مُحَرَّمٌ بِالنَّصِّ. قَالَ تَعَالَى ﴿إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَى ظُلْمًا إِنَّمَا يَأْكُلُونَ فِي بُطُونِهِمْ نَارًا وَسَيَصْلَوْنَ سَعِيرًا﴾ [سُورَةَ النِّسَاء/10]. وَلا يَجُوزُ التَّصَرُّفُ بِمَالِ الْيَتِيمِ عَلَى خِلافِ مَصْلَحَتِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":968},{"type":"p","text":"وَمِنْهَا أَكْلُ مَالِ الأَوْقَافِ عَلَى مَا يُخَالِفُ شَرْطَ الْوَاقِفِ بِأَنْ لَمْ يَدْخُلْ تَحْتَ شَرْطِ الْوَاقِفِ فَمَنْ وَقَفَ بَيْتًا لِسَكَنِ الْفُقَرَاءِ فَلا يَجُوزُ لِلأَغْنِيَاءِ أَنْ يَسْكُنُوهُ وَمَنْ وَقَفَ بَيْتًا لِسَكَنِ طَلَبَةِ الْحَدِيثِ فَلا يَجُوزُ لِغَيْرِهِمْ أَنْ يَسْكُنُوهُ وَمَنْ وَقَفَ بَيْتًا لِسَكَنِ حَفَظَةِ الْقُرْءَانِ فَلا يَجُوزُ لِغَيْرِهِمْ أَنْ

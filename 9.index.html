<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#087f5b" />
  <meta name="description" content="تطبيق تفاعلي لقراءة كتاب عمدة الراغب" />
  <title>عمدة الراغب | قارئ إسلامي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer" />
  <style>
    :root{
      --emerald:#087f5b; --emerald-2:#0b6b50; --emerald-soft:#e8f5ef;
      --gold:#c99a2e; --gold-2:#b78315; --gold-soft:#fff7df;
      --bg:#f7f4ec; --surface:#ffffff; --surface-2:#f1eee6; --text:#17211d;
      --muted:#6e7873; --border:rgba(22,67,51,.12); --shadow:0 18px 50px rgba(30,64,50,.09);
      --reader-font:'Cairo',sans-serif; --reader-size:20px;
      --header-h:76px; --nav-h:72px; --radius:22px;
    }
    [data-theme="dark"]{
      --bg:#0e1613; --surface:#14201b; --surface-2:#192820; --text:#edf5f0;
      --muted:#a5b5ae; --border:rgba(221,240,231,.12); --shadow:0 18px 50px rgba(0,0,0,.25);
      --emerald-soft:#163229; --gold-soft:#322a16;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;transition:background .25s,color .25s}
    button,input,select{font:inherit}
    button{border:0;cursor:pointer}
    a{text-decoration:none;color:inherit}
    .hidden{display:none!important}
    .app-shell{min-height:100vh}
    .topbar{height:var(--header-h);position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .topbar-inner{max-width:1220px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;gap:18px}
    .brand{display:flex;align-items:center;gap:12px;min-width:max-content}
    .brand-mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--emerald),var(--emerald-2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(8,127,91,.24);font-size:19px}
    .brand strong{display:block;font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
    .search-wrap{position:relative;flex:1;max-width:660px;margin-inline:auto}
    .search-box{height:46px;background:var(--surface-2);border:1px solid transparent;border-radius:15px;display:flex;align-items:center;gap:10px;padding:0 14px;transition:.2s}
    .search-box:focus-within{background:var(--surface);border-color:rgba(8,127,91,.38);box-shadow:0 0 0 4px rgba(8,127,91,.08)}
    .search-box i{color:var(--emerald)}.search-box input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}
    .search-box input::placeholder{color:var(--muted)}
    .desktop-nav{display:flex;gap:5px}.nav-btn,.icon-btn{background:transparent;color:var(--muted);border-radius:13px;transition:.18s;position:relative;overflow:hidden}
    .nav-btn{padding:10px 13px;display:flex;gap:8px;align-items:center}.nav-btn:hover,.nav-btn.active,.icon-btn:hover{background:var(--emerald-soft);color:var(--emerald)}
    .content{max-width:1220px;margin:auto;padding:32px 24px 110px}
    .page{animation:pageIn .32s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .hero{position:relative;overflow:hidden;border:1px solid var(--border);background:linear-gradient(135deg,var(--surface),var(--gold-soft));border-radius:30px;padding:42px;margin-bottom:28px;box-shadow:var(--shadow)}
    .hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(201,154,46,.23);transform:rotate(45deg);border-radius:24px}
    .hero:before{width:190px;height:190px;left:-72px;top:-80px}.hero:after{width:130px;height:130px;left:45px;top:-75px}
    .hero-badge{display:inline-flex;gap:7px;align-items:center;background:var(--emerald-soft);color:var(--emerald);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
    .hero h1{font-family:'Amiri',serif;font-size:clamp(36px,6vw,64px);line-height:1.15;margin:14px 0 7px;color:var(--emerald)}
    .hero p{margin:0;color:var(--muted);max-width:720px;line-height:1.9}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .primary-btn,.soft-btn{border-radius:14px;padding:11px 16px;display:inline-flex;align-items:center;gap:9px;font-weight:700;position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s}
    .primary-btn{background:var(--emerald);color:#fff;box-shadow:0 9px 24px rgba(8,127,91,.2)}.soft-btn{background:var(--surface);color:var(--text);border:1px solid var(--border)}
    .primary-btn:hover,.soft-btn:hover{transform:translateY(-2px)}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:28px 2px 16px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
    .card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 8px 28px rgba(20,70,50,.04);transition:transform .18s,box-shadow .18s,border-color .18s;cursor:pointer;isolation:isolate}
    .card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:rgba(201,154,46,.34)}.card:active{transform:scale(.985)}
    .card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card-icon{width:49px;height:49px;border-radius:16px;background:var(--emerald-soft);color:var(--emerald);display:grid;place-items:center;font-size:19px}
    .fav-mini{width:38px;height:38px;border-radius:12px;background:var(--surface-2);color:var(--muted)}.fav-mini.is-fav{background:var(--gold-soft);color:var(--gold-2)}
    .card h3{font-family:'Amiri',serif;font-size:23px;line-height:1.4;margin:15px 0 7px}.card p{color:var(--muted);font-size:13px;line-height:1.8;margin:0;min-height:46px}
    .card-stats{display:flex;gap:13px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:11px}.card-stats span{display:flex;align-items:center;gap:6px}
    .card-arrow{position:absolute;left:16px;bottom:16px;color:var(--emerald);opacity:.8}
    .empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:24px;padding:48px 24px;text-align:center;color:var(--muted)}.empty-state i{font-size:38px;color:var(--gold);margin-bottom:14px}
    .reader-page{max-width:920px;margin:auto}
    .reader-head{background:linear-gradient(135deg,var(--surface),var(--emerald-soft));border:1px solid var(--border);border-radius:27px;padding:28px;margin-bottom:16px;box-shadow:var(--shadow)}
    .reader-back{background:transparent;color:var(--emerald);font-weight:700;padding:0 0 11px}.reader-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
    .reader-head h1{font-family:'Amiri',serif;font-size:clamp(30px,5vw,48px);line-height:1.35;margin:0;color:var(--emerald)}
    .reader-stats{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}.reader-stats span{display:flex;gap:6px;align-items:center}
    .reader-actions{position:sticky;top:calc(var(--header-h) + 10px);z-index:35;display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;padding:8px;box-shadow:0 10px 24px rgba(24,60,47,.07);margin-bottom:16px}
    .reader-actions button{width:42px;height:42px;border-radius:12px;background:var(--surface-2);color:var(--text);transition:.16s}.reader-actions button:hover{background:var(--emerald-soft);color:var(--emerald)}.reader-actions button.is-fav{background:var(--gold-soft);color:var(--gold-2)}
    .reader-content{font-family:var(--reader-font);font-size:var(--reader-size);line-height:2.15;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:clamp(22px,5vw,48px);box-shadow:var(--shadow)}
    .reader-content p,.reader-content li,.reader-content .source-block,.reader-content .note-block,.reader-content .benefit-block{white-space:pre-wrap;unicode-bidi:plaintext}
    .reader-content p{margin:0 0 1.15em;text-align:justify}
    .reader-content .book-heading{text-align:center!important;font-family:'Amiri',serif;font-size:1.35em;font-weight:700;color:var(--emerald);margin:1.65em 0 1em;padding:12px;border-block:1px solid var(--border)}
    .reader-content .book-heading:first-child{margin-top:0}
    .source-block{margin:1.2em 0;padding:15px 18px;border-right:4px solid var(--gold);background:var(--gold-soft);border-radius:12px;font-weight:600}
    .note-block{margin:1.2em 0;padding:15px 18px;background:var(--surface-2);border-radius:12px;color:var(--muted);font-size:.93em}
    .benefit-block{margin:1.2em 0;padding:15px 18px;background:var(--emerald-soft);border:1px solid var(--border);border-radius:12px}
    .reader-list{margin:1.15em 0;padding:0 1.9em 0 0}.reader-list li{margin:.55em 0;padding-right:.35em}
    .blank-line{height:.7em}
    .progress-line{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--emerald));width:0;z-index:100;transition:width .08s linear}
    .to-top{position:fixed;left:22px;bottom:95px;width:45px;height:45px;border-radius:50%;background:var(--emerald);color:#fff;box-shadow:0 12px 28px rgba(8,127,91,.28);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:45}.to-top.show{opacity:1;transform:none;pointer-events:auto}
    .settings-card{max-width:760px;margin:auto;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:28px;box-shadow:var(--shadow)}
    .settings-card h1{font-size:30px;margin:0 0 6px}.settings-card>.lead{color:var(--muted);margin:0 0 28px}.setting-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--border)}.setting-row:last-of-type{border-bottom:0}
    .setting-row h3{margin:0 0 4px;font-size:15px}.setting-row p{margin:0;color:var(--muted);font-size:12px}.setting-control{display:flex;align-items:center;gap:9px}.select{background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:9px 12px;border-radius:12px;outline:0}.range{accent-color:var(--emerald);width:190px}.toggle{width:54px;height:30px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);padding:3px;transition:.2s}.toggle span{display:block;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}.toggle.on{background:var(--emerald)}.toggle.on span{transform:translateX(-24px);background:#fff}
    .reset-btn{width:100%;margin-top:20px;background:var(--gold-soft);color:var(--gold-2);padding:12px;border-radius:13px;font-weight:700}
    .search-overlay{position:fixed;inset:0;z-index:90;background:rgba(4,18,13,.32);backdrop-filter:blur(5px);display:none;padding:88px 18px 24px;align-items:flex-start;justify-content:center}.search-overlay.open{display:flex}
    .search-panel{width:min(760px,100%);max-height:min(72vh,720px);background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.22);overflow:hidden;animation:pop .2s ease}@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-7px)}to{opacity:1;transform:none}}
    .search-panel-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--border)}.search-panel-head input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:11px 13px;color:var(--text);outline:0}.close-search{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--text)}
    .search-results{overflow:auto;max-height:calc(72vh - 70px);padding:10px}.search-result{padding:13px;border-radius:15px;cursor:pointer;border:1px solid transparent}.search-result:hover{background:var(--emerald-soft);border-color:var(--border)}.search-result strong{display:block;color:var(--emerald);margin-bottom:5px}.search-result p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}.result-empty{text-align:center;color:var(--muted);padding:34px}
    mark{background:var(--gold-soft);color:var(--text);border-radius:4px;padding:0 2px}
    .toast{position:fixed;right:50%;bottom:95px;transform:translateX(50%) translateY(20px);background:#17211d;color:#fff;padding:10px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
    .ripple-wave{position:absolute;border-radius:50%;transform:scale(0);animation:ripple .55s linear;background:rgba(255,255,255,.38);pointer-events:none}@keyframes ripple{to{transform:scale(4);opacity:0}}
    .mobile-nav{display:none;position:fixed;bottom:0;right:0;left:0;height:var(--nav-h);z-index:60;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(15px);border-top:1px solid var(--border);padding:7px 10px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav button{background:transparent;color:var(--muted);min-width:72px;border-radius:12px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:10px}.mobile-nav button i{font-size:17px}.mobile-nav button.active{color:var(--emerald);background:var(--emerald-soft)}
    .page-title{margin:0 0 5px;font-size:30px}.page-subtitle{margin:0 0 22px;color:var(--muted)}
    @media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.desktop-nav .nav-btn span{display:none}.desktop-nav .nav-btn{padding:11px}.topbar-inner{padding:0 16px}}
    @media(max-width:720px){:root{--header-h:68px}.content{padding:22px 14px 110px}.topbar-inner{padding:0 13px}.brand small,.desktop-nav{display:none}.brand strong{font-size:14px}.brand-mark{width:40px;height:40px}.search-wrap{max-width:none}.search-box{height:43px}.cards{grid-template-columns:1fr}.hero{padding:28px 22px;border-radius:24px}.hero h1{font-size:42px}.mobile-nav{display:flex}.reader-head{padding:21px;border-radius:22px}.reader-title-row{display:block}.reader-content{padding:22px 18px;border-radius:21px;line-height:2.05}.reader-actions{top:calc(var(--header-h) + 7px);justify-content:space-between}.reader-actions button{width:39px;height:39px}.to-top{bottom:88px;left:14px}.setting-row{grid-template-columns:1fr}.setting-control{justify-content:stretch}.range{width:100%}.select{width:100%}.settings-card{padding:21px}.search-overlay{padding-top:75px}}
    @media(max-width:420px){.brand strong{display:none}.topbar-inner{gap:8px}.card{padding:18px}.hero-actions>*{flex:1;justify-content:center}.reader-actions{gap:4px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app-shell">
  <div id="readingProgress" class="progress-line"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/home" class="brand" aria-label="الرئيسية">
        <span class="brand-mark"><i class="fa-solid fa-book-quran"></i></span>
        <span><strong>عُمْدَةُ الرَّاغِبِ</strong><small>قارئ إسلامي تفاعلي</small></span>
      </a>
      <div class="search-wrap">
        <div class="search-box" id="openSearchBox"><i class="fa-solid fa-magnifying-glass"></i><input id="headerSearch" type="search" placeholder="ابحث في الكتاب..." autocomplete="off" aria-label="بحث" /></div>
      </div>
      <nav class="desktop-nav" aria-label="التنقل الرئيسي">
        <button class="nav-btn" data-route="home"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
        <button class="nav-btn" data-route="favorites"><i class="fa-solid fa-bookmark"></i><span>المفضلة</span></button>
        <button class="nav-btn" data-route="settings"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></button>
      </nav>
    </div>
  </header>

  <main id="app" class="content" aria-live="polite"></main>

  <nav class="mobile-nav" aria-label="التنقل السفلي">
    <button data-route="home"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
    <button data-action="search"><i class="fa-solid fa-magnifying-glass"></i><span>بحث</span></button>
    <button data-route="favorites"><i class="fa-solid fa-bookmark"></i><span>المفضلة</span></button>
    <button data-route="settings"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></button>
  </nav>

  <button id="toTop" class="to-top" aria-label="العودة إلى الأعلى"><i class="fa-solid fa-arrow-up"></i></button>
  <div id="toast" class="toast" role="status"></div>

  <div id="searchOverlay" class="search-overlay" role="dialog" aria-modal="true" aria-label="البحث في الكتاب">
    <div class="search-panel">
      <div class="search-panel-head"><input id="searchInput" type="search" placeholder="اكتب كلمة أو عبارة..." autocomplete="off" /><button class="close-search" id="closeSearch" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button></div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>
</div>

<script>
const BOOK_SECTIONS=[{"id":"intro","title":"مُقَدِّمَةُ الْكِتَابِ","description":"مدخل الكتاب وتعريفه ومنهجه ومادته العلمية.","icon":"fa-book-open","start":0,"end":25,"paragraphCount":23,"wordCount":661,"readMinutes":4,"blocks":[{"type":"p","text":"قال","style":"Normal","align":"justify","bold":false,"size":18.0,"index":0},{"type":"heading","text":"عُمْدَةُ الرَّاغِبِ","style":"Normal","align":"center","bold":true,"size":36.0,"index":1},{"type":"heading","text":"الطَّبْعَةُ الرَّابِعَةُ 2013","style":"Normal","align":"center","bold":true,"size":18.0,"index":2},{"type":"heading","text":"الْعَقِيدَةُ وَالرِّدَّةُ","style":"Normal","align":"center","bold":true,"size":18.0,"index":3},{"type":"heading","text":"بِسْمِ اللَّهِ الرَّحْمٰنِ الرَّحِيمِ","style":"Normal","align":"center","bold":true,"size":18.0,"index":4},{"type":"blank","text":""},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ رَحْمَةً وَاسِعَةً: الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ الْحَيِّ الْقَيُّومِ الْمُدَبِّرِ لِجَمِيعِ الْمَخْلُوقِينَ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":6},{"type":"p","text":"   الشَّرْحُ أَنَّ مَعْنَى بِسْمِ اللَّهِ أَبْتَدِئُ بِاسْمِ اللَّهِ. وَلَفْظُ الْجَلالَةِ اللَّهُ عَلَمٌ لِلذَّاتِ الْمُقَدَّسِ الْمُسْتَحِقِّ لِنِهَايَةِ التَّعْظِيمِ وَغَايَةِ الْخُضُوعِ وَمَعْنَاهُ مَنْ لَهُ الإِلَهِيَّةُ وَهِيَ الْقُدْرَةُ عَلَى الِاخْتِرَاعِ أَيْ إِبْرَازِ الْمَعْدُومِ إِلَى الْوُجُودِ. وَ«الرَّحْمٰنِ» أَيِ الْكَثِيرِ الرَّحْمَةِ لِلْمُؤْمِنِينَ وَالْكَافِرِينَ فِي الدُّنْيَا وَلِلْمُؤْمِنِينَ فِي الآخِرَةِ وَ«الرَّحِيمِ» أَيِ الْكَثِيرِ الرَّحْمَةِ لِلْمُؤْمِنِينَ. وَمَعْنَى «الْحَمْدُ لِلَّهِ» نُثْنِي عَلَى اللَّهِ وَنَمْدَحُهُ بِأَلْسِنَتِنَا عَلَى مَا أَنْعَمَ بِهِ عَلَيْنَا مِنَ النِّعَمِ الَّتِي لا نُحْصِيهَا مِنْ غَيْرِ وُجُوبٍ عَلَيْهِ. وَ«رَبِّ الْعَالَمِينَ» مَعْنَاهُ مَالِكُ الْعَالَمِينَ أَيْ مَالِكُ كُلِّ مَا دَخَلَ فِي الْوُجُودِ. وَ«الْمُدَبِّرِ لِجَمِيعِ الْمَخْلُوقِينَ» أَيِ الَّذِي قَدَّرَ كُلَّ مَا يَجْرِي فِي الْعَالَمِ.   ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":7},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَالصَّلاةُ وَالسَّلامُ الأَتَمَّانِ الأَكْمَلانِ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى ءَالِهِ وَصَحْبِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":8},{"type":"p","text":"   الشَّرْحُ الصَّلاةُ هُنَا مَعْنَاهَا نَطْلُبُ مِنَ اللَّهِ تَعَالَى أَنْ يَزِيدَ سَيِّدَنَا مُحَمَّدًا تَعْظِيمًا وَأَمَّا السَّلامُ فَمَعْنَاهُ نَطْلُبُ مِنَ اللَّهِ لِرَسُولِهِ الأَمَانَ مِمَّا يَخَافُهُ عَلَى أُمَّتِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":9},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَبَعْدُ فَهَذَا مُخْتَصَرٌ جَامِعٌ لِأَغْلَبِ الضَّرُورِيَّاتِ الَّتِي لا يَجُوزُ لِكُلِّ مُكَلَّفٍ جَهْلُهَا مِنَ الِاعْتِقَادِ وَمَسَائِلَ فِقْهِيَّةٍ مِنَ الطَّهَارَةِ إِلَى الْحَجِّ وَشَىْءٍ مِنْ أَحْكَامِ الْمُعَامَلاتِ عَلَى مَذْهَبِ الإِمَامِ الشَّافِعِيِّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":10},{"type":"p","text":"   الشَّرْحُ فِي هَذَا الْكِتَابِ أَغْلَبُ أُمُورِ الدِّينِ الضَّرُورِيَّةِ الَّتِي يَجِبُ عَلَى كُلِّ مُكَلَّفٍ بَالِغٍ عَاقِلٍ مَعْرِفَتُهَا فِي الْعَقِيدَةِ وَالْعِبَادَاتِ وَوَاجِبَاتِ الْقَلْبِ وَمَعَاصِي الْجَوَارِحِ وَالتَّوْبَةِ. وَلَيْسَ مَعْنَى ذَلِكَ أَنَّ كُلَّ مَا فِيهِ مَعْرِفَتُهُ فَرْضُ عَيْنٍ فَمَعْرِفَةُ نَسَبِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَى عَبْدِ مَنَافٍ الْمَذْكُورِ فِي هَذَا الْمُخْتَصَرِ لَيْسَتْ مِنْ فُرُوضِ الْعَيْنِ بَلْ مِنْ فُرُوضِ الْكِفَايَةِ وَكَذَلِكَ مَسَائِلُ أُخْرَى فِيهِ مِنَ الْعِبَادَاتِ وَالْمُعَامَلاتِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":11},{"type":"p","text":"   وَالْعِبَادَاتُ هِيَ الطَّهَارَةُ وَالصَّلاةُ وَالزَّكَاةُ وَالصِّيَامُ وَالْحَجُّ أَمَّا الْمُعَامَلاتُ فَهِيَ الْبَيْعُ وَالشِّرَاءُ وَالشَّرِكَةُ وَالْقَرْضُ وَنَحْوُ ذَلِكَ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":12},{"type":"p","text":"   وَأَمَّا الإِمَامُ الشَّافِعِيُّ رَضِيَ اللَّهُ عَنْهُ فَاسْمُهُ مُحَمَّدُ بنُ إِدْرِيسَ وَهُوَ قُرَشِيٌّ مُطَّلِبِيٌّ وُلِدَ سَنَةَ مِائَةٍ وَخَمْسِينَ وَتُوُفِّيَ سَنَةَ مِائَتَيْنِ وَأَرْبَعٍ لِلْهِجْرَةِ وَفِي أَجْدَادِهِ شَخْصٌ اسْمُهُ شَافِعٌ لِذَلِكَ لُقِّبَ بِالشَّافِعِيِّ وَمَذْهَبُهُ يُقَالُ لَهُ الْمَذْهَبُ الشَّافِعِيُّ وَمَنْ عَرَفَ مَذْهَبَهُ وَعَمِلَ بِهِ يُقَالُ لَهُ شَافِعِيٌّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":13},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: ثُمَّ بَيَانِ مَعَاصِي الْقَلْبِ وَالْجَوَارِحِ كَاللِّسَانِ وَغَيْرِهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":14},{"type":"p","text":"   الشَّرْحُ فِي هَذَا الْكِتَابِ بَيَانُ مَعَاصِي الْقَلْبِ وَالْجَوَارِحِ أَيْ بَيَانُ ذُنُوبِ الْقَلْبِ وَذُنُوبِ الْجَوَارِحِ السَّبْعَةِ. وَالْجَوَارِحُ جَمْعُ جَارِحَةٍ وَهِيَ أَعْضَاءُ الإِنْسَانِ كَالْيَدِ وَالرِّجْلِ وَالأُذُنِ وَالْعَيْنِ وَاللِّسَانِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":15},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الأَصْلُ لِبَعْضِ الْفُقَهَاءِ الْحَضْرَمِيِّينَ وَهُوَ عَبْدُ اللَّهِ بنُ حُسَيْنِ بنِ طَاهِرٍ ثُمَّ ضُمِّنَ زِيَادَاتٍ كَثِيرَةً مِنْ نَفَائِسِ الْمَسَائِلِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":16},{"type":"p","text":"   الشَّرْحُ أَصْلُ هَذَا الْكِتَابِ لِلشَّيْخِ عَبْدِ اللَّهِ بنِ حُسَيْنِ بنِ طَاهِرٍ الْعَلَوِيِّ الْحَضْرَمِيِّ تُوُفِّيَ سَنَةَ أَلْفٍ وَمِائَتَيْنِ وَاثْنَتَيْنِ وَسَبْعِينَ لِلْهِجْرَةِ. وَالْعَلَوِيُّ نِسْبَةٌ إِلَى عَلَوِيِّ بنِ عُبَيْدِ اللَّهِ فِي اصْطِلاحِ أَهْلِ حَضْرَمَوْتَ [وَهُوَ عَلَوِيُّ بنُ عُبَيْدِ اللَّهِ بنِ أَحْمَدَ بنِ عِيسَى النَّقِيبِ بنِ مُحَمَّدٍ النَّقِيبِ بنِ عَلِيٍّ الْعُرَيْضِيِّ بنِ جَعْفَرٍ الصَّادِقِ بنِ مُحَمَّدٍ الْبَاقِرِ بنِ عَلِيٍّ زَيْنِ الْعَابِدِينَ ابْنِ الإِمَامِ الْحُسَيْنِ بنِ عَلِيِّ بنِ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُمْ]. ثُمَّ زَادَ الْمُؤَلِّفُ عَلَى الأَصْلِ زِيَادَاتٍ جَيِّدَةً وَهَذَا هُوَ شَأْنُ الِاخْتِصَارِ الْمَعْرُوفِ عِنْدَ الْمُؤَلِّفِينَ لِأَنَّهُ لَيْسَ مُلْتَزَمًا عِنْدَهُمْ أَنْ لا يُبْدِلَ الْمُخْتَصِرُ فِي مُخْتَصَرِهِ بَعْضَ مَا فِي الأَصْلِ أَوْ أَنْ لا يَأْتِيَ بِزِيَادَةٍ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":17},{"type":"p","text":"   وَنَفَائِسُ الْمَسَائِلِ مَعْنَاهَا الْمَسَائِلُ الْحَسَنَةُ فَإِنَّ الشَّىْءَ الْحَسَنَ يُقَالُ لَهُ نَفِيسٌ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":18},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: مَعَ حَذْفِ مَا ذَكَرَهُ فِي التَّصَوُّفِ وَتَغْيِيرٍ لِبَعْضِ الْعِبَارَاتِ مِمَّا لا يُؤَدِّي إِلَى خِلافِ الْمَوْضُوعِ. وَقَدْ نَذْكُرُ مَا رَجَّحَهُ بَعْضٌ مِنَ الْفُقَهَاءِ الشَّافِعِيِّينَ كَالْبُلْقِينِيِّ لِتَضْعِيفِ مَا فِي الأَصْلِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":19},{"type":"p","text":"  الشَّرْحُ تَرَكَ الْمُصَنِّفُ رَحِمَهُ اللَّهُ مِنْ أَصْلِ هَذَا الْكِتَابِ مَا يَتَعَلَّقُ بِالتَّصَوُّفِ مِمَّا لَيْسَ مِنَ الْفَرْضِ الْعَيْنِيِّ وَضَعَّفَ بَعْضَ الْمَوَاضِعِ الَّتِي فِي الأَصْلِ وَذَكَرَ مَا رَجَّحَهُ الْبُلْقِينِيُّ رَحِمَهُ اللَّهُ وَهُوَ الشَّيْخُ سِرَاجُ الدِّينِ عُمَرُ بنُ رَسْلانَ وَكَانَ فِي عَصْرِهِ عَالِمَ الدُّنْيَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":20},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَيَنْبَغِي عِنَايَتُهُ بِهِ لِيُقْبَلَ عَمَلُهُ أَسْمَيْنَاهُ مُخْتَصَرَ عَبْدِ اللَّهِ الْهَرَرِيِّ الْكَافِلَ بِعِلْمِ الدِّينِ الضَّرُورِيِّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":21},{"type":"p","text":"   الشَّرْحُ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ» رَوَاهُ الْبَيْهَقِيُّ وَحَسَّنَهُ الْحَافِظُ الْمِزِّيُّ. وَالْمُرَادُ بِالْعِلْمِ فِي هَذَا الْحَدِيثِ عِلمُ الدّينِ الضَّرُورِيُّ الشَّامِلُ لِمَعْرِفَةِ اللَّهِ وَمَعْرِفَةِ رَسُولِهِ وَغَيْرِهِمَا مِنَ ضَرُورِيَّاتِ الِاعْتِقَادِ وَالشَّامِلُ أَيْضًا لِمَعْرِفَةِ أَحْكَامِ الصَّلاةِ وَالطَّهَارَةِ شُرُوطًا وَأَرْكَانًا وَمُبْطِلاتٍ وَغَيْرِهِمَا مِنْ ضَرُورِيَّاتِ عِلْمِ الدِّينِ. وَلَمَّا كَانَ هَذَا الْمُخْتَصَرُ حَاوِيًا لِهَذِهِ الأَشْيَاءِ مُشْتَمِلًا عَلَيْهَا كَانَ يَنْبَغِي لِطَالِبِ الْعِلْمِ أَنْ يَعْتَنِيَ بِتَحْصِيلِ مَا فِيهِ وَيُخْلِصَ النِّيَّةَ فِيهِ لِلَّهِ لِيَكُونَ عَمَلُهُ مَقْبُولًا عِنْدَ اللَّهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":22},{"type":"p","text":"   وَ«الْكَافِلَ بِعِلْمِ الدِّينِ الضَّرُورِيِّ» مَعْنَاهُ الْجَامِعُ لِعِلْمِ الدِّينِ الضَّرُورِيِّ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":23},{"type":"blank","text":""}]},{"id":"belief","title":"ضَرُورِيَّاتُ الِاعْتِقَادِ","description":"ما يلزم معرفته واعتقاده في أصول الاعتقاد وما يتصل بها.","icon":"fa-star-and-crescent","start":25,"end":125,"paragraphCount":99,"wordCount":6385,"readMinutes":36,"blocks":[{"type":"heading","text":"ضَرُورِيَّاتُ الِاعْتِقَادِ","style":"Normal","align":"center","bold":true,"size":18.0,"index":25},{"type":"blank","text":""},{"type":"p","text":"الشَّرْحُ أَنَّ «ضَرُورِيَّاتُ» جَمْعُ ضَرُورِيٍّ وَهُوَ هُنَا مَا لا يَجُوزُ لِلْمُكَلَّفِ جَهْلُهُ أَيْ أَنَّ هَذَا الْفَصْلَ مَعْقُودٌ لِبَيَانِ مَا يَلْزَمُ وَيَجِبُ اعْتِقَادُهُ عَلَى الْمُكَلَّفِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":27},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَصْلٌ يَجِبُ عَلَى كَافَةِ الْمُكَلَّفِينَ الدُّخُولُ فِي دِينِ الإِسْلامِ وَالثُّبُوتُ فِيهِ عَلَى الدَّوَامِ وَالْتِزَامُ مَا لَزِمَ عَلَيْهِ مِنَ الأَحْكَامِ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":28},{"type":"p","text":"   الشَّرْحُ الْمُكَلَّفُ هُوَ الْبَالِغُ الْعَاقِلُ الَّذِي بَلَغَتْهُ دَعْوَةُ الإِسْلامِ أَيْ مَنْ بَلَغَهُ أَنَّهُ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ فَهَذَا هُوَ الْمُكَلَّفُ الَّذِي هُوَ مُلْزَمٌ بِأَنْ يَدِينَ بِدِينِ الإِسْلامِ وَيَعْمَلَ بِشَرِيعَتِهِ أَيْ أَنْ يُؤَدِّيَ الْوَاجِبَاتِ وَيَجْتَنِبَ الْمُحَرَّمَاتِ [قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلامُ﴾ وَقَالَ تَعَالَى ﴿وَمَنْ يَبْتَغِ غَيْرَ الإِسْلامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ وَهُوَ فِي الآخِرَةِ مِنَ الْخَاسِرِينَ﴾]. أَمَّا مَنْ مَاتَ قَبْلَ الْبُلُوغِ فَلَيْسَ عَلَيْهِ مَسْئُولِيَّةٌ فِي الآخِرَةِ وَكَذَلِكَ مَنِ اتَّصَلَ جُنُونُهُ إِلَى مَا بَعْدَ الْبُلُوغِ فَمَاتَ وَهُوَ مَجْنُونٌ فَلَيْسَ مُكَلَّفًا وَكَذَلِكَ الَّذِي عَاشَ بَالِغًا وَلَمْ تَبْلُغْهُ دَعْوَةُ الإِسْلامِ أَيْ أَصْلُ الدَّعْوَةِ. وَلَيْسَ شَرْطًا لِبُلُوغِ الدَّعْوَةِ أَنْ تَبْلُغَهُ تَفَاصِيلُ عَقَائِدِ الإِسْلامِ بِأَدِلَّتِهَا بَلْ يَكُونُ مُكَلَّفًا بِمُجَرَّدِ أَنْ يَبْلُغَهُ أَصْلُ الدَّعْوَةِ [وَفِي رِسَالَةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِهِرَقْلَ «مِنْ مُحَمَّدٍ عَبْدِ اللَّهِ وَرَسُولِهِ إِلَى هِرَقْلَ عَظِيمِ الرُّومِ سَلامٌ عَلَى مَنِ اتَّبَعَ الْهُدَى أَمَّا بَعْدُ فَإِنِّي أَدْعُوكَ بِدِعَايَةِ الإِسْلامِ أَسْلِمْ تَسْلَمْ يُؤْتِكَ اللَّهُ أَجْرَكَ مَرَّتَيْنِ فَإِنْ تَوَلَّيْتَ فَإِنَّ عَلَيْكَ إِثْمَ الأَرِيسِيِّينَ وَ﴿قُلْ يَا أَهْلَ الْكِتَابِ تَعَالَوْا إِلَى كَلَمَةٍ سَوَاءٍ بَيْنَنَا وَبَيْنَكُمْ أَلَّا نَعْبُدَ إِلَّا اللَّهَ وَلا نُشْرِكَ بِهِ شَيْئًا وَلا يَتَّخِذَ بَعْضُنَا بَعْضًا أَرْبَابًا مِّنْ دُونِ اللَّهِ فَإِنْ تَوَلَّوْا فَقُولُوا اشْهَدُوا بِأَنَّا مُسْلِمُونَ﴾ رَوَاهُ الْبُخَارِيُّ»] وَلا يَكُونُ لَهُ عُذْرًا أَنَّهُ لَمْ يَكُنْ فَكَّرَ فِي حَقِيَّةِ الإِسْلامِ بُرْهَةً مِنَ الزَّمَنِ فَإِنَّ مَنْ سَمِعَ فِي الأَذَانِ الشَّهَادَتَيْنِ وَهُوَ يَفْهَمُ الْعَرَبِيَّةَ فَهُوَ مُكَلَّفٌ فَإِنْ مَاتَ وَلَمْ يُسْلِمِ اسْتَحَقَّ عَذَابَ اللَّهِ الْمُؤَبَّدَ فِي النَّارِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":29},{"type":"p","text":"   ثُمَّ إِنَّ نِيَّةَ الثُّبُوتِ عَلَى الإِسْلامِ ضَرُورِيَّةٌ أَيْ أَنْ يَخْلُوَ قَلْبُهُ عَنْ أَيِّ عَزْمٍ عَلَى تَرْكِ الإِسْلامِ فِي الْمُسْتَقْبَلِ أَوْ تَرَدُّدٍ فِي ذَلِكَ فَإِنَّ مَنْ نَوَى الْكُفْرَ فِي الْمُسْتَقْبَلِ كَفَرَ فِي الْحَالِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":30},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَمِمَّا يَجِبُ عِلْمُهُ وَاعْتِقَادُهُ مُطْلَقًا وَالنُّطْقُ بِهِ فِي الْحَالِ إِنْ كَانَ كَافِرًا وَإِلَّا فَفِي الصَّلاةِ الشَّهَادَتَانِ وَهُمَا أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":31},{"type":"p","text":"   الشَّرْحُ أَنَّ أَوَّلَ مَا يَجِبُ عَلَى الإِنْسَانِ مَعْرِفَةُ اللَّهِ وَمَعْرِفَةُ رَسُولِهِ وَالنُّطْقُ بِالشَّهَادَتَيْنِ مَرَّةً وَاحِدَةً لِلدُّخُولِ فِي الإِسْلامِ إِنْ لَمْ يَكُنْ مُسْلِمًا وَمَنْ حَصَلَ مِنْهُ ذَلِكَ مَعَ الِاعْتِقَادِ الْجَازِمِ فَهُوَ مُسْلِمٌ مُؤْمِنٌ ثُمَّ لا يَكْمُلُ إيِمَانُهُ وَإِسْلامُهُ إِلَّا بِأَدَاءِ الْوَاجِبَاتِ وَاجْتِنَابِ الْمُحَرَّمَاتِ. ثُمَّ اخْتَلَفَ الْعُلَمَاءُ فِي وُجُوبِ النُّطْقِ بِالشَّهَادَتَيْنِ بَعْدَ تِلْكَ الْمَرَّةِ وَأَكْثَرُ الْعُلَمَاءِ عَلَى وُجُوبِ النُّطْقِ بِالشَّهَادَتَيْنِ فِي كُلِّ صَلاةٍ. ثُمَّ إِنَّ النُّطْقَ الَّذِي يَجِبُ عَلَى الْكَافِرِ يَحْصُلُ بِلَفْظِ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ بِاللُّغَةِ الْعَرَبِيَّةِ وَبِتَرْجَمَتِهِ لِغَيْرِهَا مِنَ اللُّغَاتِ فَمَنْ كَانَ أَعْجَمِيًّا يَقُولُ «أَنَّ مُهَمَّدًا» بِالْهَاءِ يُقَالُ لَهُ قُلْ «أَبَا الْقَاسِمِ رَسُولُ اللَّهِ» وَإِذَا لَمْ يَكُنْ يَأْتِي بِهَاءِ لَفْظِ الْجَلالَةِ «اللَّه» فَيَكْفِي تَرْجَمَتُهُ بِلُغَتِهِ. وَلا يُشْتَرَطُ خُصُوصُ هَذَا اللَّفْظِ بَلْ يَكْفِي مَا يُعْطِي مَعْنَاهُ كَأَنْ يَقُولَ لا رَبَّ إِلَّا اللَّهُ أَوْ لا خَالِقَ إِلَّا اللَّهُ وَيَكْفِي مُحَمَّدٌ نَبِيُّ اللَّهِ لَكِنْ لَفْظُ أَشْهَدُ أَفْضَلُ مِنْ سَائِرِ الأَلْفَاظِ لِأَنَّ مَعْنَاهَا اللُّغَوِيَّ يَتَضَمَّنُ الْعِلْمَ وَالِاعْتِقَادَ وَالِاعْتِرَافَ. وَمَنْ عَجَزَ عَنِ النُّطْقِ بِاللِّسَانِ يَكْفِيهِ إِيمَانُهُ بِالْقَلْبِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":32},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ أَعْلَمُ وَأَعْتَقِدُ وَأَعْتَرِفُ أَنْ لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ. ","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":33},{"type":"p","text":"   الشَّرْحُ مَعْنَى قَوْلِ الْفُقَهَاءِ لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ لا يَسْتَحِقُّ أَحَدٌ أَنْ يُعْبَدَ أَيْ أَنْ يُتَذَلَّلَ لَهُ نِهَايَةُ التَّذَلُّلِ إِلَّا اللَّهُ كَمَا قَالَ ذَلِكَ الإِمَامُ الْحَافِظُ الْفَقِيهُ اللُّغَوِيُّ تَقِيُّ الدِّينِ السُّبْكِيُّ وَغَيْرُهُ وَلَفْظُهُ الْعِبَادَةُ أَقْصَى غَايَةِ الْخُشُوعِ وَالْخُضُوعِ اهـ وَلَوْ كَانَ مَعْنَى الْعِبَادَةِ مُطْلَقَ الطَّاعَةِ لِمَخْلُوقٍ فِي أَيِّ شَىْءٍ طَاعَةً كَانَ أَوْ مَعْصِيَةً لَكَانَ عُمَّالُ الْحُكَّامِ الْجَائِرِينَ كُفَّارًا فَهَلْ يَقُولُ هَؤُلاءِ الَّذِينَ يَقُولُونَ إِنَّ مُجَرَّدَ الطَّاعَةِ أَوِ التَّوَسُّلِ عِبَادَةٌ وَيُكَفِّرُونَ الْمُتَوَسِّلِينَ بِالأَنْبِيَاءِ وَالأَوْلِيَاءِ عَنْ أَنْفُسِهِمْ إِنَّهُمْ مُشْرِكُونَ. أَلَيْسَ هَؤُلاءِ أَنْفُسُهُمْ يُطِيعُونَ الْحُكَّامَ فِي بَعْضِ الْمَعَاصِي فَيَكُونُونَ كَفَّرُوا أَنْفُسَهُمْ وَإِنْ لَمْ يَشْعُرُوا. فَهَؤُلاءِ الَّذِينَ يُكَفِّرُونَ الْمُسْتَغِيثِينَ بِالأَوْلِيَاءِ وَالأَنْبِيَاءِ لِيَتَعَلَّمُوا مَعْنَى الْعِبَادَةِ فِي لُغَةِ الْعَرَبِ قَبْلَ إِطْلاقِ أَلْسِنَتِهِمْ بِالتَّكْفِيرِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":34},{"type":"note","text":"   وَمَا ذَكَرْنَاهُ هُوَ مَعْنَى الْعِبَادَةِ الْمُرَادَةِ بِقَوْلِهِ تَعَالَى ﴿لا إِلَهَ إِلَّا أَنَا فَاعْبُدُونِ﴾ [سُورَةَ الأَنْبِيَاءِ/25] وَبِقَوْلِهِ تَعَالَى ﴿إِيَّاكَ نَعْبُدُ﴾ [سُورَةَ الْفَاتِحَةِ/5] وَهَذِهِ هِيَ الْعِبَادَةُ الْمُخْتَصَّةُ لِلَّهِ تَعَالَى الَّتِي مَنْ صَرَفَهَا لِغَيْرِهِ صَارَ مُشْرِكًا وَلَيْسَ مَعْنَاهَا مُجَرَّدَ النِّدَاءِ أَوِ الِاسْتِعَانَةِ أَوِ الِاسْتِغَاثَةِ أَوِ الْخَوْفِ أَوِ الرَّجَاءِ.","style":"footnote text","align":"justify","bold":true,"size":18.0,"index":35},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الْوَاحِدُ الأَحَدُ الأَوَّلُ الْقَديِمُ الْحَيُّ الْقَيُّومُ الدَّائِمُ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":36},{"type":"p","text":"   الشَّرْحُ أَنَّ مَعْنَى الْوَاحِدِ الَّذِي لا ثَانِيَ لَهُ أَيْ لا شَرِيكَ لَهُ فِي الأُلُوهِيَّةِ فَاللَّهُ وَاحِدٌ لا مِنْ طَرِيقِ الْعَدَدِ. وَأَمَّا الأَحَدُ فَقَالَ بَعْضُ الْعُلَمَاءِ هُوَ بِمَعْنَى الْوَاحِدِ وَقَالَ بَعْضُهُمْ الأَحَدُ هُوَ الَّذِي لا يَقْبَلُ الِانْقِسَامَ وَالتَّجَزُّؤَ أَيْ لَيْسَ جِسْمًا لِأَنَّ الْجِسْمَ يَقْبَلُ الِانْقِسَامَ عَقْلًا وَاللَّهُ لَيْسَ جِسْمًا. وَالْجِسْمُ مَا لَهُ طُولٌ وَعَرْضٌ وَسَمْكٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":37},{"type":"p","text":"   وَمَعْنَى الأَوَّلِ الَّذِي لا ابْتِدَاءَ لِوُجُودِهِ فَهُوَ وَحْدَهُ الأَوَّلُ بِهَذَا الْمَعْنَى وَبِمَعْنَاهُ الْقَديِمُ إِذَا أُطْلِقَ عَلَى اللَّهِ لِأَنَّ قِدَمَ اللَّهِ ذَاتِيٌّ وَلَيْسَ زَمَنِيًّا. وَأَمَّا مَعْنَى الْحَيِّ إِذَا وُصِفَ اللَّهُ بِهِ فَهُوَ أَنَّهُ مَوْصُوفٌ بِحَيَاةٍ أَزَلِيَّةٍ أَبَدِيَّةٍ لَيْسَتْ بِرُوحٍ وَلَحْمٍ وَدَمٍ وَعَصَبٍ وَمُخٍّ بَلْ حَيَاتُهُ صِفَةٌ قَديِمَةٌ قَائِمَةٌ بِذَاتِهِ [أَيْ ثَابِتَةٌ لَهُ]. وَمَعْنَى الْقَيُّومِ الدَّائِمُ الَّذِي لا يَزُولُ. وَأَمَّا الدَّائِمُ فَمَعْنَاهُ الَّذِي لا يَلْحَقُهُ وَلا يَجُوزُ عَلَيْهِ الْفَنَاءُ وَبِمَعْنَاهُ الْبَاقِي فَاللَّهُ يَسْتَحِيلُ عَلَيْهِ الْفَنَاءُ عَقْلًا وَلا دَائِمَ بِهَذَا الْمَعْنَى إِلَّا اللَّهُ فَلا شَرِيكَ لِلَّهِ فِي الدَّيْمُومِيَّةِ [أَيِ الْبَقَاءِ إِلَى مَا لا نِهَايَةَ] لِأَنَّ دَيْمُومِيَّتَهُ اسْتَحَقَّهَا لِذَاتِهِ لا شَىْءَ غَيْرُهُ أَوْجَبَ لَهُ ذَلِكَ وَأَمَّا دَيْمُومِيَّةُ غَيْرِهِ كَالْجَنَّةِ وَالنَّارِ فَهِيَ لَيْسَتْ ذَاتِيَّةً بَلْ هُمَا شَاءَ اللَّهُ لَهُمَا الْبَقَاءَ أَمَّا مِنْ حَيْثُ ذَاتُهُمَا فَيَجُوزُ عَلَيْهِمَا عَقْلًا الْفَنَاءُ لَكِنْ وَرَدَ فِي الشَّرْعِ بَقَاؤُهُمَا بِنَصِّ الْقُرْءَانِ وَالسُّنَّةِ النَّبَوِيَّةِ وَإِجْمَاعِ الأُمَّةِ وَلِذَلِكَ فَإِنَّ الْقَوْلَ بِفَنَائِهِمَا أَوْ فَنَاءِ النَّارِ دُونَ الْجَنَّةِ كُفْرٌ. وَقَدْ قَالَ ابْنُ تَيْمِيَةَ بِفَنَاءِ النَّارِ [قَالَهُ فِي رِسَالَةٍ لَهُ سَمَّاهَا تَلْبِيسًا الرَّدَّ عَلَى مَنْ قَالَ بِفَنَاءِ الْجَنَّةِ وَالنَّارِ وَنَقَلَهُ عَنْهُ عُلَمَاءُ عَصْرِهِ وَنَقَلَهُ أَيْضًا تِلْمِيذُهُ ابْنُ قَيِّمِ الْجَوْزِيَّةِ فِي كِتَابِ حَادِي الأَرْوَاحِ إِلَى بِلادِ الأَفْرَاحِ وَأَثْبَتَهُ عَنْهُ الصَّنْعَانِيُّ وَالأَلْبَانِيُّ وَغَيْرُهُمَا مِنْ مُحَبِّيهِ فَضْلًا عَنْ مُنْتَقِدِيهِ] بَعْدَ أَنْ ذَكَرَ فِي كِتَابِهِ مِنْهَاجِ السُّنَّةِ النَّبَوِيَّةِ أَنَّ الْمُسْلِمِينَ اتَّفَقُوا عَلَى بَقَاءِ الْجَنَّةِ وَالنَّارِ وَأَنَّ جَهْمَ بنَ صَفْوَانَ خَالَفَ فِي ذَلِكَ فَقَالَ بِفَنَائِهِمَا فَكَفَّرَهُ الْمُسْلِمُونَ فَحُكْمُهُ حُكْمُ جَهْمٍ فَكِلاهُمَا كَافِرٌ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":38},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الْخَالِقُ الرَّازِقُ الْعَالِمُ الْقَدِيرُ الْفَعَّالُ لِمَا يُرِيدُ مَا شَاءَ اللَّهُ كَانَ وَمَا لَمْ يَشَأْ لَمْ يَكُنْ.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":39},{"type":"p","text":"   الشَّرْحُ مَعْنَى الْخَالِقِ الَّذِي أَبْدَعَ وَكَوَّنَ جَمِيعَ الْكَائِنَاتِ وَأَبْرَزَهَا مِنَ الْعَدَمِ إِلَى الْوُجُودِ فَلا خَلْقَ بِهَذَا الْمَعْنَى إِلَّا لِلَّهِ فَمَا سِوَى اللَّهِ تَعَالَى حَدَثَ بِخَلْقِهِ تَعَالَى وَتَكْوِينِهِ وَإِبْدَاعِهِ فَالْخَلْقُ هُوَ الإِبْرَازُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ وَلا خَالِقَ إِلَّا اللَّهُ. قَالَ اللَّهُ تَعَالَى ﴿قُلِ اللَّهُ خَالِقُ كُلِّ شَىْءٍ﴾ [سُورَةَ الرَّعْدِ/16] وَالشَّىْءُ يَشْمَلُ الأَجْسَامَ وَالأَعْمَالَ وَقَالَ ﴿وَاللَّهُ خَلَقَكُمْ وَمَا تَعْمَلُونَ﴾ [سُورَةَ الصَّافَّاتِ/96] فَالآيَتَانِ صَريِحَتَانِ فِي أَنَّ اللَّهَ هُوَ خَالِقُ الأَجْسَامِ وَالأَعْمَالِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":40},{"type":"p","text":"   وَمَعْنَى الرَّازِقِ الَّذِي يُوصِلُ الأَرْزَاقَ إِلَى عِبَادِهِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":41},{"type":"p","text":"   وَمَعْنَى الْعَالِمِ الْمُتَّصِفُ بِالْعِلْمِ فَاللَّهُ مَوْصُوفٌ بِعِلْمٍ أَزَلِيٍّ أَبَدِيٍّ لا يَتَغَيَّرُ لا يَزْدَادُ وَلا يَنْقُصُ فَهُوَ عَالِمٌ لا كَالْعُلَمَاءِ لِأَنَّ عِلْمَ غَيْرِهِ حَادِثٌ.","style":"Body Text 2","align":"justify","bold":false,"size":18.0,"index":42},{"type":"p","text":"   وَمَعْنَى الْقَدِيرِ الْمُتَّصِفُ بِالْقُدْرَةِ التَّامَّةِ وَهِيَ صِفَةٌ أَزَلِيَّةٌ أَبَدِيَّةٌ يُؤَثِّرُ بِهَا فِي الْمُمْكِنَاتِ أَيْ فِي كُلِّ مَا يَجُوزُ فِي الْعَقْلِ وُجُودُهُ وَعَدَمُهُ بِهَا يُوجِدُ وَيُعْدِمُ وَبِمَعْنَاهُ الْقَادِرُ إِلَّا أَنَّ الْقَدِيرَ أَبْلَغُ. ","style":"Body Text 2","align":"justify","bold":false,"size":18.0,"index":43},{"type":"p","text":"   وَمَعْنَى الْفَعَّالِ لِمَا يُرِيدُ أَنَّهُ يُكَوِّنُ مَا سَبَقَتْ بِهِ إِرَادَتُهُ [أَيْ مَا شَاءَ فِي الأَزَلِ أَنْ يَكُونَ] لا يُعْجِزُهُ عَنْ ذَلِكَ شَىْءٌ، يَفْعَلُ مَا يَشَاءُ بِلا مَشَقَّةٍ وَلا يُمَانِعُهُ أَحَدٌ وَلا يَحْتَاجُ إِلَى اسْتِعْمَالِ ءَالَةٍ وَحَرَكَةٍ وَلا إِلَى اسْتِعَانَةٍ بِغَيْرِهِ وَلا تَخَلُّفَ لِمُرَادِهِ [أَيْ إِذَا أَرَادَ شَيْئًا فَلا بُدَّ أَنْ يَحْصُلَ]. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":44},{"type":"p","text":"   وَمَعْنَى مَا شَاءَ اللَّهُ كَانَ وَمَا لَمْ يَشَأْ لَمْ يَكُنْ أَنَّ كُلَّ مَا شَاءَ اللَّهُ فِي الأَزَلِ أَنْ يَكُونَ كَانَ وَمَا لَمْ يَشَإِ اللَّهُ فِي الأَزَلِ أَنْ يَكُونَ لا يَكُونُ وَلا تَتَغَيَّرُ مَشِيئَتُهُ لِأَنَّ تَغَيُّرَ الْمَشِيئَةِ دَلِيلُ الْحُدُوثِ وَالْحُدُوثُ مُسْتَحِيلٌ عَلَى اللَّهِ فَهُوَ عَلَى حَسَبِ مَشِيئَتِهِ الأَزَلِيَّةِ يُغَيِّرُ الْمَخْلُوقَاتِ مِنْ غَيْرِ أَنْ تَتَغَيَّرَ مَشِيئَتُهُ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":45},{"type":"source","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: الَّذِي لا حَوْلَ وَلا قُوَّةَ إِلَّا بِهِ الْمَوْصُوفُ بِكُلِّ كَمَالٍ يَلِيقُ بِهِ الْمُنَزَّهُ عَنْ كُلِّ نَقْصٍ فِي حَقِّهِ ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾.","style":"Heading 3","align":"justify","bold":false,"size":18.0,"index":46},{"type":"p","text":"   الشَّرْحُ مَعْنَى لا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللَّهِ لا حَوْلَ عَنْ مَعْصِيَةِ اللَّهِ إِلَّا بِعِصْمَةِ اللَّهِ وَلا قُوَّةَ عَلَى طَاعَةِ اللَّهِ إِلَّا بِعَوْنِ اللَّهِ كَمَا وَرَدَ ذَلِكَ فِي الْحَدِيثِ الصَّحِيحِ الَّذِي رَوَاهُ الْبَزَّارُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":47},{"type":"note","text":"   وَاللَّهُ تَعَالَى مَوْصُوفٌ بِكُلِّ كَمَالٍ يَلِيقُ بِهِ وَإِنَّمَا قُيِّدَتْ هَذِهِ الْعِبَارَةُ بِلَفْظِ يَلِيقُ بِهِ لِأَنَّ الْكَمَالَ إِمَّا أَنْ يَكُونَ كَمَالًا فِي حَقِّ اللَّهِ وَفِي حَقِّ غَيْرِهِ كَالْعِلْمِ [وَمِنْ أَسْمَاءِ اللَّهِ تَعَالَى مَا هُوَ خَاصٌّ بِهِ لا يَجُوزُ أَنْ يُسَمَّى بِهِ غَيْرُهُ. قَالَ أَبُو مَنْصُورٍ الْبَغْدَادِيُّ فِي أُصُولِ الدِّينِ أَمَّا التَّسْمِيَةُ بِالإِلَهِ وَالرَّحْمٰنِ وَالْخَالِقِ وَالْقُدُّوسِ وَالرَّزَّاقِ وَالْمُحْيِي وَالْمُمِيتِ وَمَالِكِ الْمُلْكِ وَذِي الْجَلالِ وَالإِكْرَامِ فَلا يَلِيقُ بِغَيْرِ اللَّهِ عَزَّ وَجَلَّ وَيَجُوزُ تَسْمِيَةُ غَيْرِهِ بِمَا خَرَجَ مِنْ مَعَانِي تِلْكَ الأَسْمَاءِ الْخَاصَّةِ] أَوْ لا كَالْوَصْفِ بِالْجَبَّارِ مَدْحٌ فِي حَقِّ اللَّهِ وَذَمٌّ فِي حَقِّ الإِنْسَانِ وَكَالْوَصْفِ بِرَجَاحَةِ الْعَقْلِ هُوَ مَدْحٌ فِي حَقِّ الإِنْسَانِ وَلا يَجُوزُ أَنْ يُوصَفَ اللَّهُ بِذَلِكَ [لِأَنَّ الْعَقْلَ مِنْ صِفَاتِ الْمَخْلُوقِينَ] فَكَمَا أَنَّهُ تَعَالَى مُتَّصِفٌ بِكُلِّ كَمَالٍ فِي حَقِّهِ فَهُوَ مُنَزَّهٌ عَنْ كُلِّ نَقْصٍ أَيْ مَا لا يَلِيقُ بِهِ تَعَالَى كَالْجَهْلِ وَالْعَجْزِ وَاللَّوْنِ وَالْحَدِّ وَالتَّحَيُّزِ فِي الْمَكَانِ وَالْجِهَةِ. قَالَ أَبُو جَعْفَرٍ الطَّحَاوِيُّ أَحْمَدُ بنُ سَلامَةَ الْمُتَوَفَّى فِي أَوَّلِ الْقَرْنِ الرَّابِعِ الْهِجْرِيِّ «لا تَحْوِيهِ الْجِهَاتُ السِّتُّ كَسَائِرِ الْمُبْتَدَعَاتِ» وَذَلِكَ فِي عَقِيدَتِهِ الَّتِي ذَكَرَ أَنَّهَا بَيَانُ عَقِيدَةِ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ عَقِيدَةِ أَبِي حَنِيفَةَ وَصَاحِبَيْهِ أَبِي يُوسُفَ الْقَاضِي وَمُحَمَّدِ بنِ الْحَسَنِ الشَّيْبَانِيِّ وَهُمْ مِنْ أَئِمَّةِ السَّلَفِ وَذَلِكَ لِأَنَّهُ سَبَكَ عِبَارَتَهُ فِي هَذَا الْكِتَابِ عَلَى أُسْلُوبِ هَؤُلاءِ الأَئِمَّةِ الثَّلاثَةِ لا لِأَنَّ مَا يَذْكُرُهُ فِي هَذَا الْكِتَابِ مِمَّا انْفَرَدَ بِهِ هَؤُلاءِ الأَئِمَّةُ الثَّلاثَةُ وَمَعْنَى مَا قَالَهُ لا يَجُوزُ عَلَى اللَّهِ أَنَّ يَكُونَ مَحْدُودًا وَالْمَحْدُودُ عِنْدَ الْعُلَمَاءِ مَا لَهُ حَجْمٌ كَبِيرًا كَانَ أَوْ صَغِيرًا كَثِيفًا كَالإِنْسَانِ وَالشَّجَرِ أَوْ لَطِيفًا كَالنُّورِ وَالظَّلامِ فَإِذًا هُوَ مُنَزَّهٌ عَنْ أَنْ يَكُونَ جَالِسًا لِأَنَّ الْمُتَّصِفَ بِالْجُلُوسِ لا بُدَّ أَنْ يَكُونَ مَحْدُودًا وَالْمَحْدُودُ يَحْتَاجُ إِلَى مَنْ حَدَّهُ بِذَلِكَ الْحَدِّ وَلا يَجُوزُ أَنْ يَحُدَّ نَفْسَهُ بِحَدٍّ يَكُونُ عَلَيْهِ لِأَنَّ مَعْنَى ذَلِكَ أَنَّهُ خَلَقَ نَفْسَهُ وَذَلِكَ مُحَالٌ لِأَنَّ الشَّىْءَ لا يَخْلُقُ نَفْسَهُ.","style":"footnote text","align":"justify","bold":true,"size":18.0,"index":48},{"type":"p","text":"   أَمَّا الآيَةُ ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11] فَهِيَ أَصْرَحُ ءَايَةٍ فِي الْقُرْءَانِ فِي تَنْزِيهِ اللَّهِ تَعَالَى التَّنْزِيهَ الْكُلِّيَّ [وَلَيْسَ مَعْنَى وَصْفِ هَذِهِ الآيَةِ بِأَنَّهَا أَصْرَحُ ءَايَةٍ فِي التَّنْزِيهِ أَنَّهَا أَفْضَلُ ءَايَةٍ بَلْ وَرَدَ فِي ءَايَةِ الْكُرْسِيِّ أَنَّهَا سَيِّدَةُ ءَايِ الْقُرْءَانِ اهـ] وَتَفْسِيرُهَا أَنَّ اللَّهَ لا يُشْبِهُهُ شَىْءٌ بِأَيِّ وَجْهٍ مِنَ الْوُجُوهِ [قَالَ الإِمَامُ أَبُو جَعْفَرٍ الطَّحَاوِيُّ فِي عَقِيدَتِهِ وَمَنْ وَصَفَ اللَّهَ بِمَعْنًى مِنْ مَعَانِي الْبَشَرِ فَقَدْ كَفَرَ اهـ]، وَالْكَافُ فِي ﴿كَمِثْلِهِ﴾ لِتَأْكِيدِ النَّفْيِ فَفِي الآيَةِ نَفْيُ مَا لا يَلِيقُ بِاللَّهِ عَنِ اللَّهِ. وَأَمَّا قَوْلُهُ تَعَالَى ﴿وَهُوَ السَّمِيعُ الْبَصِيرُ﴾ فَفِيهِ إِثْبَاتُ مَا يَلِيقُ بِاللَّهِ، السَّمْعُ صِفَةٌ لائِقَةٌ بِاللَّهِ وَالْبَصَرُ كَذَلِكَ وَإِنَّمَا قَدَّمَ اللَّهُ تَعَالَى فِي هَذِهِ الآيَةِ التَّنْزِيهَ حَتَّى لا يُتَوَهَّمَ أَنَّ سَمْعَهُ وَبَصَرَهُ كَسَمْعِ وَبَصَرِ غَيْرِهِ فَاللَّهُ تَعَالَى مَوْصُوفٌ بِأَنَّهُ لَيْسَ كَمِثْلِهِ شَىْءٌ مِنَ اللَّطَائِفِ كَالنُّورِ وَالرُّوحِ وَالْهَوَاءِ وَمِنَ الْكَثَائِفِ كَالشَّجَرِ وَالإِنْسَانِ. وَالْجِسْمُ اللَّطِيفُ مَا لا يُضْبَطُ بِالْيَدِ وَالْجِسْمُ الْكَثِيفُ مَا يُضْبَطُ بِالْيَدِ أَيْ مَا يُجَسُّ بِالْيَدِ وَهُوَ تَعَالَى لا يُشْبِهُ الْعُلْوِيَّاتِ وَلا السُّفْلِيَّاتِ [وَالْعُلْوِيَّاتُ مَا كَانَ فِي السَّمَوَاتِ وَالسُّفْلِيَّاتُ مَا كَانَ فِي الأَرْضِ].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":49},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَهُوَ الْقَديِمُ وَمَا سِوَاهُ حَادِثٌ وَهُوَ الْخَالِقُ وَمَا سِوَاهُ مَخْلُوقٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":50},{"type":"p","text":"   الشَّرْحُ أَنَّ الْعَالَمَ حَادِثُ الْجِنْسِ وَالأَفْرَادِ وَخَالَفَتِ الْفَلاسِفَةُ فِي ذَلِكَ فَقَالَ قِسْمٌ مِنْهُمْ «الْعَالَمُ الْعُلْوِيُّ أَزَلِيٌّ بِمَادَّتِهِ وَأَفْرَادِهِ» وَمِنْ هَؤُلاءِ إِرَسْطُو وَتَبِعَهُ ابْنُ سِينَا وَالْفَارَابِيُّ وَقَالَ بَعْضُهُمْ «الْعَالَمُ قَديِمُ الْجِنْسِ وَالنَّوْعِ حَادِثُ الأَفْرَادِ» وَهَؤُلاءِ مُتَأَخِّرُو الْفَلاسِفَةِ وَتَبِعَهُمْ أَبُو الْعَبَّاسِ أَحْمَدُ بنُ تَيْمِيَةَ مِنْ غَيْرِ أَنْ يَنْسُبَ نَفْسَهُ إِلَى اتِّبَاعِهِمْ بَلْ نَسَبَ ذَلِكَ زُورًا وَبُهْتَانًا إِلَى أَئِمَّةِ الْحَدِيثِ. قَالَ الإِمَامُ بَدْرُ الدِّينِ الزَّرْكَشِيُّ فِي الْفَرِيقَيْنِ فِي تَشْنِيفِ الْمَسَامِعِ «وَضَلَّلَهُمُ الْمُسْلِمُونَ وَكَفَّرُوهُمْ» مَعْنَاهُ أَنَّ الْفَرِيقَيْنِ كُفَّارٌ بِالإِجْمَاعِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":51},{"type":"p","text":"   وَذَكَرَ تِلْكَ الْعَقِيدَةَ الْفَاسِدَةَ أَيْ أَنَّ الْعَالَمَ أَزَلِيٌّ بِنَوْعِهِ حَادِثٌ بِأَفْرَادِهِ ابْنُ تَيْمِيَةَ فِي سَبْعَةٍ مِنْ كُتُبِهِ مِنْهَاجِ السُّنَّةِ النَّبَوِيَّةِ وَمُوَافَقَةِ صَرِيحِ الْمَعْقُولِ لِصَحِيحِ الْمَنْقُولِ وَكِتَابِ شَرْحِ حَدِيثِ النُّزُولِ وَكِتَابِ شَرْحِ حَدِيثِ عِمْرَانَ بنِ حُصَيْنٍ وَكِتَابِ نَقْدِ مَرَاتِبِ الإِجْمَاعِ وَكِتَابِ الْفَتَاوَى وَفِي تَفْسِيرِ سُورَةِ الأَعْلَى. قَالَ شَيْخُنَا الْعَبْدَرِيُّ رَحِمَهُ اللَّهُ تَعَالَى وَقَدْ رَأَيْتُ ذَلِكَ بِعَيْنِي فِيهَا اهـ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":52},{"type":"p","text":"   وَالْقَوْلُ بِأَزَلِيَّةِ الْعَالَمِ كَالْقَوْلِ بِنَفْيِ وُجُودِ اللَّهِ تَعَالَى وَهُمَا مِنْ أَكْفَرِ الْكُفْرِ [وَنَفْيُ وُجُودِ اللَّهِ هُوَ أَشَدُّ الْكُفْرِ عَلَى الإِطْلاقِ] فَإِنَّ الأَوَّلَ وَهُوَ الْقَوْلُ بِأَزَلِيَّةِ الْعَالَمِ نَفْيٌ لِخَالِقِيَّةِ اللَّهِ وَالْقَوْلُ بِنَفْيِ وُجُودِ ذَاتِ اللَّهِ أَشَدُّ وَهُوَ تَعْطِيلٌ لِلشَّرَائِعِ كُلِّهَا لِأَنَّ الشَّرَائِعَ كُلَّهَا جَاءَتْ بِإِثْبَاتِ ذَاتِ اللَّهِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":53},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَكُلُّ حَادِثٍ دَخَلَ فِي الْوُجُودِ مِنَ الأَعْيَانِ وَالأَعْمَالِ مِنَ الذَّرَّةِ إِلَى الْعَرْشِ وَمِنْ كُلِّ حَرَكَةٍ لِلْعِبَادِ وَسُكُونٍ وَالنَّوَايَا وَالْخَوَاطِرِ فَهُوَ بِخَلْقِ اللَّهِ لَمْ يَخْلُقْهُ أَحَدٌ سِوَى اللَّهِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":54},{"type":"p","text":"   الشَّرْحُ الأَعْيَانُ هِيَ الأَشْيَاءُ الَّتِي لَهَا حَجْمٌ إِنْ كَانَتْ صَغِيرَةً كَالذَّرَّةِ أَوْ أَصْغَرَ مِنْهَا أَوْ كَبِيرَةً كَالْعَرْشِ الَّذِي هُوَ أَكْبَرُ الْمَخْلُوقَاتِ حَجْمًا وَأَوْسَعُهَا مِسَاحَةً [وَهَذَا يُفْهَمُ مِنْ حَدِيثِ «مَا السَّمَوَاتُ السَّبْعُ مَعَ الْكُرْسِيِّ إِلَّا كَحَلَقَةٍ مُلْقَاةٍ بِأَرْضٍ فَلاةٍ وَفَضْلُ الْعَرْشِ عَلَى الْكُرْسِيِّ كَفَضْلِ الْفَلاةِ عَلَى الْحَلَقَةِ» رَوَاهُ ابْنُ حِبَّانَ فِي بَابِ مَا جَاءَ فِي الطَّاعَاتِ وَثَوَابِهَا وَصَحَّحَهُ]. وَالذَّرَّةُ هِيَ أَصْغَرُ الأَجْرَامِ الَّتِي تَرَاهَا الْعَيْنُ وَتُسَمَّى أَيْضًا الْهَبَاءَ وَيُوجَدُ مَا هُوَ أَصْغَرُ مِنَ الْهَبَاءِ مِمَّا لا تَرَاهُ الْعُيُونُ [كَمَا ذَكَرَ الزَّرْكَشِيُّ فِي تَشْنِيفِ الْمَسَامِعِ] وَلَهُ حَجْمٌ وَمِنْ ذَلِكَ أَصْغَرُ حَجْمٍ خَلَقَهُ اللَّهُ وَهُوَ الَّذِي يُسَمِّيهِ عُلَمَاءُ التَّوْحِيدِ الْجَوْهَرَ الْفَرْدَ وَهُوَ الْجُزْءُ الَّذِي لا يَتَجَزَّأُ، هَذَا وَمَا زَادَ عَلَيْهِ اللَّهُ تَعَالَى هُوَ الَّذِي أَوْجَدَهُ وَكَذَلِكَ أَعْمَالُ الْعِبَادِ حَرَكَاتُهُمْ وَسَكَنَاتُهُمْ وَأَفْكَارُهُمْ وَنِيَّاتُهُمْ وَعُلُومُهُمْ وَخَوَاطِرُهُمُ الَّتِي تَطْرَأُ عَلَيْهِمْ بِدُونِ إِرَادَتِهِمْ وَنَظَرُهُمْ بِقَصْدٍ إِلَى شَىْءٍ وَطَرْفُ أَعْيُنِهِمْ بِقَصْدٍ وَبِغَيْرِ قَصْدٍ اللَّهُ تَعَالَى هُوَ خَلَقَهَا فِيهِمْ أَمَّا الْعِبَادُ فَلا يَخْلُقُونَ شَيْئًا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":55},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: لا طَبِيعَةٌ وَلا عِلَّةٌ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":56},{"type":"p","text":"   الشَّرْحُ الطَّبِيعَةُ هِيَ الصِّفَةُ الَّتِي جَعَلَ اللَّهُ عَلَيْهَا الأَجْرَامَ وَعَرَّفَهَا بَعْضُهُمْ بِأَنَّهَا الْعَادَةُ فَهَذِهِ لا يَصِحُّ أَنْ تَكُونَ خَالِقَةً لِشَىْءٍ مِنَ الأَشْيَاءِ لِأَنَّهُ لا إِرَادَةَ لَهَا وَلا مَشِيئَةَ وَلا اخْتِيَارَ. وَالسَّبَبُ هُوَ حَادِثٌ يُتَوَصَّلُ بِهِ إِلَى حَادِثٍ ءَاخَرَ وَقَدْ يَتَخَلَّفُ مُسَبَّبُهُ عَنْهُ. أَمَّا الْعِلَّةُ فَهِيَ عِنْدَ أَهْلِ الِاصْطِلاحِ مَا يُوجَدُ الْمَعْلُولُ بِوُجُودِهِ وَيُعْدَمُ بِعَدَمِهِ مِثْلُ حَرَكَةِ الإِصْبَعِ الَّذِي فِيهِ خَاتَمٌ فَحَرَكَةُ الإِصْبَعِ عِنْدَهُمْ عِلَّةٌ لِحَرَكَةِ الْخَاتَمِ لِأَنَّ حَرَكَةَ الْخَاتَمِ تَتْبَعُ حَرَكَةَ الإِصْبَعِ فَتُوجَدُ بِوُجُودِهَا وَتُعْدَمُ بِعَدَمِهَا. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":57},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: بَلْ دُخُولُهُ فِي الْوُجُودِ بِمَشِيئَةِ اللَّهِ وَقُدْرَتِهِ بِتَقْدِيرِهِ وَعِلْمِهِ الأَزَلِيِّ لِقَوْلِ اللَّهِ تَعَالَى ﴿وَخَلَقَ كُلَّ شَىْءٍ﴾ [سُورَةَ الْفُرْقَان/2] أَيْ أَحْدَثَهُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ فَلا خَلْقَ بِهَذَا الْمَعْنَى لِغَيْرِ اللَّهِ قَالَ اللَّهُ تَعَالَى ﴿هَلْ مِنْ خَالِقٍ غَيْرُ اللَّهِ﴾ [سُورَةَ فَاطِر/3].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":58},{"type":"p","text":"   الشَّرْحُ أَنَّ كُلَّ مَا دَخَلَ فِي الْوُجُودِ أَيْ وُجِدَ بَعْدَ أَنْ كَانَ مَعْدُومًا مِنَ الأَعْيَانِ أَيِ الأَجْسَامِ وَنَحْوِهَا مِمَّا يَقُومُ بِذَاتِهِ [أَيْ مِمَّا يَتَحَيَّزُ بِنَفْسِهِ] وَمِنَ الأَعْرَاضِ الَّتِي تَقُومُ بِغَيْرِهَا كَالأَعْمَالِ مَا كَانَ مِنْهَا خَيْرًا وَمَا كَانَ مِنْهَا شَرًّا وَالنِّيَّاتِ وَالْخَوَاطِرِ الَّتِي لا نَمْلِكُ مَنْعَهَا مِنْ أَنْ تَرِدَ هُوَ بِخَلْقِ اللَّهِ تَعَالَى فَيَدْخُلُ فِي ذَلِكَ أَعْمَالُ الْعِبَادِ الِاخْتِيَارِيَّةُ وَغَيْرُ الِاخْتِيَارِيَّةِ وَخَالَفَتْ فِي ذَلِكَ الْمُعْتَزِلَةُ أَيْ فِي أَفْعَالِ الْعَبْدِ الِاخْتِيَارِيَّةِ فَقَالَتْ إِنَّ الْعَبْدَ هُوَ خَالِقُهَا فَكَفَّرَهُمُ الْعُلَمَاءُ الْمُحَقِّقُونَ كَأَبِي مَنْصُورٍ الْبَغْدَادِيِّ وَالإِمَامِ الْبُلْقِينِيِّ وَهُوَ مِنْ أَكَابِرِ أَصْحَابِ الْوُجُوهِ مِنَ الشَّافِعِيَّةِ وَالإِمَامِ أَبِي الْحَسَنِ شِيثِ بنِ إِبْرَاهِيمَ الْمَالِكِيِّ وَغَيْرِهِمْ وَكَذَّبَتْ فِي ذَلِكَ الْمُعْتَزِلَةُ قَوْلَ اللَّهِ تَعَالَى ﴿وَخَلَقَ كُلَّ شَىْءٍ﴾ وَقَوْلَهُ ﴿هَلْ مِنْ خَالِقٍ غَيْرُ اللَّهِ﴾ وَغَيْرَهُمَا مِنَ الآيَاتِ. وَمَعْنَى الْخَلْقِ هُنَا الإِبْرَازُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ وَلَفْظَةُ شَىْءٍ فِي الآيَةِ الأُولَى شَامِلَةٌ لِكُلِّ مَا دَخَلَ فِي الْوُجُودِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":59},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: قَالَ النَّسَفِيُّ فَإِذَا ضَرَبَ إِنْسَانٌ زُجَاجًا بِحَجَرٍ فَكَسَرَهُ فَالضَّرْبُ وَالْكَسْرُ وَالِانْكِسَارُ بِخَلْقِ اللَّهِ تَعَالَى فَلَيْسَ لِلْعَبْدِ إِلَّا الْكَسْبُ وَأَمَّا الْخَلْقُ فَلَيْسَ لِغَيْرِ اللَّهِ [هَذَا مَعْنَى كَلامِ النَّسَفِيِّ وَنَصُّهُ فِي الْعَقِيدَةِ النَّسَفِيَّةِ وَمَا يُوجَدُ مِنَ الأَلَمِ فِي الْمَضْرُوبِ عَقِيبَ ضَرْبِ إِنْسَانٍ وَالِانْكِسَارِ فِي الزُّجَاجِ عَقِيبَ كَسْرِ إِنْسَانٍ وَمَا أَشْبَهَهُ كُلُّ ذَلِكَ مَخْلُوقٌ لِلَّهِ تَعَالَى لا صُنْعَ لِلْعَبْدِ فِي تَخْلِيقِهِ اهـ]. قَالَ اللَّهُ تَعَالَى ﴿لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ﴾ [سُورَةَ الْبَقَرَةِ/286].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":60},{"type":"p","text":"   الشَّرْحُ الضَّرْبُ هُوَ فِعْلُ الْعَبْدِ وَقَدْ يَحْصُلُ مِنْهُ انْكِسَارٌ وَقَدْ لا يَحْصُلُ وَالْكَسْرُ هُوَ فِعْلُ الْعَبْدِ الَّذِي فَعَلَهُ فِي الزُّجَاجِ بِوَاسِطَةِ الرَّمْيِ بِالْحَجَرِ وَأَمَّا الِانْكِسَارُ فَمَا يَحْصُلُ مِنَ الأَثَرِ فِي الزُّجَاجِ فَلَيْسَ لِلْعَبْدِ مِنْ عَمَلِهِ الِاخْتِيَارِيِّ إِلَّا الْكَسْبُ أَيْ تَوْجِيهُ قَصْدِهِ وَإِرَادَتِهِ نَحْوَ الْعَمَلِ الِاخْتِيَارِيِّ الَّذِي يَخْلُقُهُ اللَّهُ فِي الْعَبْدِ عِنْدَ ذَلِكَ. قَالَ تَعَالَى ﴿لَهَا مَا كَسَبَتْ﴾ أَيْ مِنَ الْخَيْرِ ﴿وَعَلَيْهَا مَا اكْتَسَبَتْ﴾ أَيْ مِنَ الشَّرِّ. قَالَ اللَّهُ تَعَالَى ﴿وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَكِنَّ اللَّهَ رَمَى﴾ [سُورَةَ الأَنْفَالِ/17] فَأَثْبَتَ اللَّهُ تَعَالَى الْخَلْقَ لِنَفْسِهِ وَتَمَدَّحَ بِذَلِكَ لِأَنَّهُ شَىْءٌ يَخْتَصُّ بِهِ وَأَثْبَتَ لِلْعَبْدِ الْكَسْبَ وَهَذَا هُوَ الْمَذْهَبُ الْحَقُّ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":61},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَكَلامُهُ قَدِيمٌ كَسَائِرِ صِفَاتِهِ لِأَنَّهُ سُبْحَانَهُ مُبَايِنٌ لِجَمِيعِ الْمَخْلُوقَاتِ فِي الذَّاتِ وَالصِّفَاتِ وَالأَفْعَالِ سُبْحَانَهُ وَتَعَالَى عَمَّا يَقُولُ الظَّالِمُونَ عُلُوًّا كَبِيرًا [أَيْ تَنَزُّهًا مُؤَكَّدًا].","style":"Normal","align":"justify","bold":true,"size":18.0,"index":62},{"type":"p","text":"   الشَّرْحُ أَنَّ كَلامَ اللَّهِ وَسَمْعَهُ وَبَصَرَهُ وَقُدْرَتَهُ وَحَيَاتَهُ وَمَشِيئَتَهُ وَعِلْمَهُ وَبَقَاءَهُ هَذِهِ الصِّفَاتُ صِفَاتٌ ثَابِتَةٌ لِذَاتِ اللَّهِ الأَزَلِيِّ الأَبَدِيِّ فَهِيَ أَزَلِيَّةٌ أَبَدِيَّةٌ لِأَنَّ الذَّاتَ الأَزَلِيَّ لا يَقُومُ بِهِ صِفَةٌ حَادِثَةٌ فَكَلامُهُ قَدِيمٌ أَزَلِيٌّ لا ابْتِدَاءَ لَهُ وَمَا كَانَ كَذَلِكَ فَلا يَكُونُ حَرْفًا وَصَوْتًا وَلُغَةً وَلا يُبْتَدَأُ وَلا يُخْتَتَمُ وَلِذَلِكَ لا يُقَالُ عَنِ اللَّهِ نَاطِقٌ لِأَنَّ النُّطْقَ لا يَكُونُ إِلَّا بِحَرْفٍ وَصَوْتٍ وَاللَّهُ لا يَتَكَلَّمُ بِحَرْفٍ وَصَوْتٍ بَلْ يُقَالُ مُتَكَلِّمٌ لِأَنَّهُ يَتَكَلَّمُ بِكَلامٍ لَيْسَ بِحَرْفٍ وَصَوْتٍ. الْقُرْءَانُ وَالتَّوْرَاةُ وَالإِنْجِيلُ وَالزَّبُورُ وَسَائِرُ كُتُبِ اللَّهِ إِنْ قُصِدَ بِهَا الْكَلامُ الذَّاتِيُّ فَهِيَ أَزَلِيَّةٌ لَيْسَتْ بِحَرْفٍ وَلا صَوْتٍ وَإِنْ قُصِدَ بِهَا اللَّفْظُ الْمُنَزَّلُ الَّذِي بَعْضُهُ بِلُغَةِ الْعَرَبِ وَبَعْضُهُ بِالْعِبْرَانِيَّةِ وَبَعْضُهُ بِالسُّرْيَانِيَّةِ فَهُوَ حَادِثٌ مَخْلُوقٌ لِلَّهِ لَكِنَّهَا لَيْسَتْ مِنْ تَصْنِيفِ مَلَكٍ وَلا بَشَرٍ وَهِيَ عِبَارَاتٌ عَنِ الْكَلامِ الذَّاتِيِّ الَّذِي لا يُوصَفُ بِأَنَّهُ عَرَبِيٌّ وَلا بِأَنَّهُ عِبْرَانِيٌّ وَلا بِأَنَّهُ سُرْيَانِيٌّ وَكُلٌّ يُطْلَقُ عَلَيْهِ كَلامُ اللَّهِ أَيْ أَنَّ صِفَةَ الْكَلامِ الْقَائِمَةَ بِذَاتِ اللَّهِ يُقَالُ لَهَا كَلامُ اللَّهِ وَاللَّفْظَ الْمُنَزَّلَ الَّذِي هُوَ عِبَارَةٌ عَنْ كَلامِ اللَّهِ الذَّاتِيِّ الأَزَلِيِّ الأَبَدِيِّ يُقَالُ لَهُ كَلامُ اللَّهِ فَتَبَيَّنَ أَنَّ الْقُرْءَانَ لَهُ إِطْلاقَانِ أَيْ لَهُ مَعْنَيَانِ الأَوَّلُ إِطْلاقُهُ عَلَى الْكَلامِ الذَّاتِيِّ الَّذِي لَيْسَ هُوَ بِحَرْفٍ وَلا صَوْتٍ وَلا لُغَةٍ عَرَبِيَّةٍ وَلا غَيْرِهَا وَالثَّانِي إِطْلاقُهُ عَلَى اللَّفْظِ الْمُنَزَّلِ الَّذِي يَقْرَؤُهُ الْمُؤْمِنُونَ. وَتَقْرِيبُ ذَلِكَ أَنَّ لَفْظَ الْجَلالَةِ (اللَّه) عِبَارَةٌ عَنْ ذَاتٍ أَزَلِيٍّ قَديِمٍ أَبَدِيٍّ فَإِذَا قُلْنَا نَعْبُدُ اللَّهَ فَذَلِكَ الذَّاتُ هُوَ الْمَقْصُودُ وَإِذَا كُتِبَ هَذَا اللَّفْظُ فَقِيلَ مَا هَذَا يُقَالُ اللَّهُ بِمَعْنَى أَنَّ هَذِهِ الْحُرُوفَ تَدُلُّ عَلَى ذَلِكَ الذَّاتِ الأَزَلِيِّ الأَبَدِيِّ لا بِمَعْنَى أَنَّ هَذِهِ الْحُرُوفَ هِيَ الذَّاتُ الَّذِي نَعْبُدُهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":63},{"type":"p","text":"   وَاللَّهُ سُبْحَانَهُ مُبَايِنٌ أَيْ غَيْرُ مُشَابِهٍ لِجَمِيعِ الْمَخْلُوقَاتِ فِي الذَّاتِ أَيْ ذَاتُهُ لا يُشْبِهُ ذَوَاتِ الْمَخْلُوقَاتِ أَيْ حَقِيقَتُهُ لا تُشْبِهُ الْحَقَائِقَ وَالصِّفَاتِ أَيْ صِفَاتُهُ لا تُشْبِهُ صِفَاتِ الْمَخْلُوقَاتِ وَالْفِعْلِ أَيْ فِعْلُهُ لا يُشْبِهُ فِعْلَ الْمَخْلُوقَاتِ لِأَنَّ فِعْلَ اللَّهِ تَعَالَى أَزَلِيٌّ أَبَدِيٌّ وَالْمَفْعُولَ حَادِثٌ. وَمَعْنَى سُبْحَانَهُ تَنْزِيهٌ لِلَّهِ تَعَالَى وَمَعْنَى تَعَالَى تَنَزَّهَ وَهُوَ تَبَارَكَ وَتَعَالَى مُتَعَالٍ أَيْ مُتَنَزِّهٌ عَمَّا يَقُولُ الظَّالِمُونَ أَيِ الْكَافِرُونَ، وَلَمَّا كَانَ الْكُفْرُ هُوَ أَعْلَى الظُّلْمِ وَأَكْبَرَهُ وَأَشَدَّهُ أَطْلَقَ اللَّهُ فِي الْقُرْءَانِ الظَّالِمِينَ وَأَرَادَ بِهِ الْكَافِرِينَ لِأَنَّ كُلَّ الظُّلْمَ الَّذِي هُوَ دُونَ الْكُفْرِ بِالنِّسْبَةِ إِلَى الْكُفْرِ كَلا ظُلْمٍ. قَالَ تَعَالَى ﴿وَالْكَافِرُونَ هُمُ الظَّالِمُونَ﴾ [سُورَةَ الْبَقَرَة/254]. الْكُفَّارُ هُمْ أَكْبَرُ ظُلْمًا أَيْ أَنَّ كُفْرَهُمْ أَكْبَرُ مِنْ كُلِّ ذَنْبٍ وَكُلُّ الظُّلْمِ دُونَهُ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":64},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَيَتَلَخَّصُ مِنْ مَعْنَى مَا مَضَى إِثْبَاتُ ثَلاثَ عَشْرَةَ صِفَةً لِلَّهِ تَعَالَى تَكَرَّرَ ذِكْرُهَا فِي الْقُرْءَانِ إِمَّا لَفْظًا وَإِمَّا مَعْنًى كَثِيرًا وَهِيَ الْوُجُودُ وَالْوَحْدَانِيَّةُ وَالْقِدَمُ أَيِ الأَزَلِيَّةُ وَالْبَقَاءُ وَقِيَامُهُ بِنَفْسِهِ وَالْقُدْرَةُ وَالإِرَادَةُ وَالْعِلْمُ وَالسَّمْعُ وَالْبَصَرُ وَالْحَيَاةُ وَالْكَلامُ وَالْمُخَالَفَةُ لِلْحَوَادِثِ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":65},{"type":"p","text":"   الشَّرْحُ أَنَّ هَذِهِ الصِّفَاتِ الثَّلاثَ عَشْرَةَ الْوَاجِبَةَ لِلَّهِ تَجِبُ مَعْرِفَتُهَا عَلَى كُلِّ مُكَلَّفٍ وَلا يَجِبُ عَلَيْهِ حِفْظُ أَلْفَاظِهَا بَلِ الْوَاجِبُ اعْتِقَادُ مَعَانِيهَا. وَيَتَلَخَّصُ مِنْ مَعْنَى مَا مَضَى اثْبِاتُ هَذِهِ الصِّفَاتِ الثَّلاثَ عَشْرَةَ لِلَّهِ تَعَالَى وَقَدْ تَكَرَّرَ ذِكْرُهَا إِمَّا بِاللَّفْظِ الظَّاهِرِ وَإِمَّا بِالْمَعْنَى الْوَارِدِ فِي النُّصُوصِ أَيْ فِي الْقُرْءَانِ وَالْحَدِيثِ وَهِيَ:","style":"Normal","align":"justify","bold":true,"size":18.0,"index":66},{"type":"li","text":"الْوُجُودُ أَيْ أَنَّ اللَّهَ تَعَالَى مَوْجُودٌ. قَالَ اللَّهُ تَعَالَى ﴿أَفِي اللَّهِ شَكٌّ﴾ [سُورَةَ إِبْرَاهِيم/10] وَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «كَانَ اللَّهُ وَلَمْ يَكُنْ شَىْءٌ غَيْرُهُ» رَوَاهُ الْبُخَارِيُّ وَغَيْرُهُ [وَهَذَا الْعَالَمُ دَلِيلٌ عَلَى وُجُودِ اللَّهِ لِأَنَّهُ لا يَصِحُّ فِي الْعَقْلِ وُجُودُ فِعْلٍ مَا بِدُونِ فَاعِلٍ]. ","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":67},{"type":"li","text":"وَالْوَحْدَانِيَّةُ أَيْ أَنَّهُ وَاحِدٌ لا شَرِيكَ لَهُ قَالَ اللَّهُ تَعَالَى ﴿لَوْ كَانَ فِيهِمَا ءَالِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا﴾ [سُورَةَ الأَنْبِيَاء/22] أَيْ لَوْ كَانَ لَهُمَا أَيْ لِلسَّمَوَاتِ وَالأَرْضِ ءَالِهَةٌ غَيْرُ اللَّهِ لَفَسَدَتَا [حَرْفُ فِي قَدْ يَكُونُ بِمَعْنَى اللَّامِ كَمَا فِي قَوْلِهِ تَعَالَى فِي سُورَةِ الْحَجِّ الآيَةَ ﴿وَجَاهِدُوا فِي اللَّهِ حَقَّ جِهَادِهِ﴾ ذَكَرَهُ الْحَافِظُ الْفَقِيهُ الْمُفَسِّرُ عَبْدُ الرَّحْمٰنِ بنُ الْجَوْزِيِّ].","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":68},{"type":"li","text":"وَالْقِدَمُ أَيْ أَنَّهُ لا ابْتِدَاءَ لِوُجُودِهِ قَالَ اللَّهُ تَعَالَى ﴿هُوَ الأَوَّلُ وَالآخِرُ﴾ [سُورَةَ الْحَدِيد/3].","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":69},{"type":"li","text":"وَالْبَقَاءُ أَيْ أَنَّهُ لا نِهَايَةَ لِوُجُودِهِ لا يَمُوتُ وَلا يَهْلِكُ وَلا يَتَغَيَّرُ قَالَ اللَّهُ تَعَالَى ﴿وَيَبْقَى وَجْهُ رَبِّكَ﴾ [سُورَةَ الرَّحْمٰن/27] أَيْ ذَاتُهُ.","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":70},{"type":"li","text":"وَالْقِيَامُ بِالنَّفْسِ أَيْ أَنَّهُ مُسْتَغْنٍ عَنْ كُلِّ مَا سِوَاهُ وَكُلُّ مَا سِوَاهُ مُحْتَاجٌ إِلَيْهِ فَالْعَالَمُ لا يَسْتَغْنِي عَنِ اللَّهِ طَرْفَةَ عَيْنٍ قَالَ اللَّهُ تَعَالَى ﴿فَإِنَّ اللَّهَ غَنِيٌّ عَنِ الْعَالَمِينَ﴾ [سُورَةَ ءَالِ عِمْرَان/97].","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":71},{"type":"li","text":"وَالْقُدْرَةُ فَاللَّهُ قَادِرٌ عَلَى كُلِّ شَىْءٍ أَيْ كُلِّ مُمْكِنٍ عَقْلِيٍّ وَهُوَ مَا يَجُوزُ عَقْلًا وُجُودُهُ وَعَدَمُهُ، فَالْقُدْرَةُ صِفَةٌ أَزَلِيَّةٌ لِلَّهِ تَعَالَى بِهَا يُوجِدُ وَيُعْدِمُ. وَاللَّهُ لا يُعْجِزُهُ شَىْءٌ قَالَ اللَّهُ تَعَالَى ﴿وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ﴾ [سُورَةَ الْحَدِيد/2].","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":72},{"type":"li","text":"وَالإِرَادَةُ أَيِ الْمَشِيئَةُ وَهِيَ تَخْصِيصُ الْمُمْكِنِ الْعَقْلِيِّ بِبَعْضِ مَا يَجُوزُ عَلَيْهِ مِنَ الصِّفَاتِ دُونَ بَعْضٍ وَبِوَقْتٍ دُونَ ءَاخَرَ قَالَ اللَّهُ تَعَالَى ﴿وَمَا تَشَاءُونَ إِلَّا أَنْ يَشَاءَ اللَّهُ رَبُّ الْعَالَمِينَ﴾ [سُورَةَ التَّكْوِير/29].","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":73},{"type":"li","text":"وَالْعِلْمُ أَيْ أَنَّ اللَّهَ يَعْلَمُ كُلَّ شَىْءٍ بِعِلْمِهِ الأَزَلِيِّ وَلا يَتَجَدَّدُ لَهُ عِلْمٌ لِأَنَّ عِلْمَهُ عِلْمٌ وَاحِدٌ شَامِلٌ لِكُلِّ الْمَعْلُومَاتِ يَعْلَمُ بِهِ سُبْحَانَهُ ذَاتَهُ وَصِفَاتِهِ وَمَا يُحْدِثُهُ مِنْ مَخْلُوقَاتِهِ يَعْلَمُ مَا كَانَ وَمَا يَكُونُ وَمَا لا يَكُونُ أَنْ لَوْ كَانَ كَيْفَ يَكُونُ قَالَ اللَّهُ تَعَالَى ﴿وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَىْءٍ عِلْمًا﴾ [سُورَةَ الطَّلاق/12].","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":74},{"type":"li","text":"وَالسَّمْعُ وَالْبَصَرُ أَيْ أَنَّ اللَّهَ يَسْمَعُ بِسَمْعِهِ الأَزَلِيِّ الَّذِي لَيْسَ كَسَمْعِ غَيْرِهِ وَيَرَى بِرُؤْيَتِهِ الَّتِي لَيْسَتْ كَرُؤْيَةِ غَيْرِهِ قَالَ اللَّهُ تَعَالَى ﴿وَهُوَ السَّمِيعُ الْبَصِيرُ﴾ [سُورَةَ الشُّورَى/11]. ","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":75},{"type":"li","text":"وَالْحَيَاةُ أَيْ أَنَّ اللَّهَ حَيٌّ بِحَيَاةٍ أَزَلِيَّةٍ أَبَدِيَّةٍ لَيْسَتْ بِرُوحٍ وَلَحْمٍ وَدَمٍ قَالَ اللَّهُ تَعَالَى ﴿اللَّهُ لا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾ [سُورَةَ الْبَقَرَة/255]. ","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":76},{"type":"li","text":"وَالْكَلامُ أَيْ أَنَّهُ سُبْحَانَهُ وَتَعَالَى مُتَكَلِّمٌ بِكَلامٍ وَاحِدٍ أَزَلِيٍّ أَبَدِيٍّ لَيْسَ حَرْفًا وَلا صَوْتًا وَلا لُغَةً قَالَ اللَّهُ تَعَالَى ﴿وَكَلَّمَ اللَّهُ مُوسَى تَكْلِيمًا﴾ [سُورَةَ النِّسَاء/164]. [وَالْمَعْنَى أَنَّ اللَّهَ أَزَالَ عَنْ سَمْعِ مُوسَى الْحِجَابَ الْمَعْنَوِيَّ الْمَانِعَ مِنْ سَمَاعِ كَلامِ اللَّهِ فَسَمِعَ مُوسَى كَلامَ اللَّهِ الذَّاتِيَّ الَّذِي لَيْسَ بِحَرْفٍ وَلا صَوْتٍ فَسَمْعُ مُوسَى حَادِثٌ وَمَسْمُوعُهُ الَّذِي هُوَ كَلامُ اللَّهِ الذَّاتِيُّ لَيْسَ بِحَادِثٍ]","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":77},{"type":"li","text":"وَالْمُخَالَفَةُ لِلْحَوَادِثِ أَيْ جَمِيعِ الْمَخْلُوقَاتِ أَيْ أَنَّهُ لا يُشْبِهُ شَيْئًا مِنْ خَلْقِهِ قَالَ اللَّهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11].","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":78},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: فَلَمَّا كَانَتْ هَذِهِ الصِّفَاتُ ذِكْرُهَا كَثِيرًا فِي النُّصُوصِ الشَّرْعِيَّةِ قَالَ الْعُلَمَاءُ تَجِبُ مَعْرِفَتُهَا وُجُوبًا عَيْنِيًّا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":79},{"type":"p","text":"   الشَّرْحُ تَجِبُ مَعْرِفَةُ هَذِهِ الصِّفَاتِ وُجُوبًا عَيْنِيًّا عَلَى كُلِّ مُكَلَّفٍ. نَصَّ عَلَى ذَلِكَ الْعَدِيدُ مِنَ الْعُلَمَاءِ الْمُتَأَخِّرِينَ مِنْهُمْ مُحَمَّدُ بنُ يُوسُفَ السَّنُوسِيُّ صَاحِبُ الْعَقِيدَةِ السَّنُوسِيَّةِ [فِي عَقِيدَتِهِ الصُّغْرَى] وَمُحَمَّدُ بنُ الْفَضَالِيِّ الشَّافِعِيُّ [فِي شَرْحِ السَّنُوسِيَّةِ] وَعَبْدُ الْمَجِيدِ الشُّرْنُوبِيُّ الْمَالِكِيُّ [فِي شَرْحِ تَائِيَّةِ السُّلُوكِ] وَقَبْلَهُمْ بِكَثِيرٍ ذَكَرَ مِثْلَ ذَلِكَ الإِمَامُ أَبُو حَنِيفَةَ فِي الْفِقْهِ الأَكْبَرِ وَمِثْلَهُ نَصَّ عَلَى ذَلِكَ الْحَافِظُ النَّوَوِيُّ فِي كِتَابِ الْمَقَاصِدِ وَغَيْرُهُمْ كَثِيرٌ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":80},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَلَمَّا ثَبَتَتِ الأَزَلِيَّةُ لِذَاتِ اللَّهِ وَجَبَ أَنْ تَكُونَ صِفَاتُهُ أَزَلِيَّةً لِأَنَّ حُدُوثَ الصِّفَةِ يَسْتَلْزِمُ حُدُوثَ الذَّاتِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":81},{"type":"p","text":"   الشَّرْحُ لَمَّا كَانَ ذَاتُ اللَّهِ أَزَلِيًّا وَجَبَ أَنْ تَكُونَ صِفَاتُهُ الْقَائِمَةُ بِذَاتِهِ أَزَلِيَّةً لِأَنَّهُ لَوْ كَانَ يَحْدُثُ فِي ذَاتِ اللَّهِ تَعَالَى حَوَادِثُ لَوَجَبَ أَنْ يَكُونَ ذَاتُهُ حَادِثًا لِأَنَّ قِيَامَ الْحَوَادِثِ بِذَاتِهِ مَعْنَاهُ أَنَّهُ يَتَغَيَّرُ مِنْ حَالٍ إِلَى حَالٍ وَالْمُتَغَيِّرُ لا يَكُونُ إِلَهًا فَلَمَّا ثَبَتَ فِي الْعَقْلِ قِدَمُ اللَّهِ تَعَالَى وَأَزَلِيَّتُهُ ثُبُوتًا قَطْعِيًّا وَجَبَ أَنْ تَكُونَ صِفَاتُهُ أَزَلِيَّةً. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":82},{"type":"p","text":"   قَالَ الْمُؤَلِّفُ رَحِمَهُ اللَّهُ: وَمَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ أَعْلَمُ وَأَعْتَقِدُ وَأَعْتَرِفُ أَنَّ مُحَمَّدَ بنَ عَبْدِ اللَّهِ بنِ عَبْدِ الْمُطَّلِبِ بنِ هَاشِمِ بنِ عَبْدِ مَنَافٍ الْقُرَشِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَبْدُ اللَّهِ وَرَسُولُهُ إِلَى جَمِيعِ الْخَلْقِ وَيَتْبَعُ ذَلِكَ اعْتِقَادُ أَنَّهُ وُلِدَ بِمَكَّةَ وَبُعِثَ بِهَا وَهَاجَرَ إِلَى الْمَدِينَةِ وَدُفِنَ فِيهَا وَيَتَضَمَّنُ ذَلِكَ أَنَّهُ صَادِقٌ فِي جَمِيعِ مَا أَخْبَرَ بِهِ وَبَلَّغَهُ عَنِ اللَّهِ فَمِنْ ذَلِكَ عَذَابُ الْقَبْرِ وَنَعِيمُهُ وَسُؤَالُ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ وَالْبَعْثُ وَالْحَشْرُ وَالْقِيَامَةُ وَالْحِسَابُ وَالثَّوَابُ وَالْعَذَابُ وَالْمِيزَانُ وَالنَّارُ وَالصِّرَاطُ وَالْحَوْضُ وَالشَّفَاعَةُ وَالْجَنَّةُ وَالرُّؤْيَةُ لِلَّهِ تَعَالَى بِالْعَيْنِ فِي الآخِرَةِ بِلا كَيْفٍ وَلا مَكَانٍ وَلا جِهَةٍ [أَيْ] لا كَمَا يُرَى الْمَخْلُوقُ وَالْخُلُودُ فِيهِمَا. وَالإِيمَانُ بِمَلائِكَةِ اللَّهِ وَرُسُلِهِ وَكُتُبِهِ وَبِالْقَدَرِ خَيْرِهِ وَشَرِّهِ وَأَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَاتَمُ النَّبِيِّينَ وَسَيِّدُ وَلَدِ ءَادَمَ أَجْمَعِينَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":83},{"type":"p","text":"   الشَّرْحُ مَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ أَعْلَمُ وَأَعْتَقِدُ وَأُصَدِّقُ وَأُؤْمِنُ وَأَعْتَرِفُ بِأَنَّ نَبِيَّنَا مُحَمَّدَ بنَ عَبْدِ اللَّهِ بنِ عَبْدِ الْمُطَّلِبِ [وَنَسَبُهُ إِلَى عَدْنَانَ مُحَمَّدُ بنُ عَبْدِ اللَّهِ بنِ عَبْدِ الْمُطَّلِبِ بنِ هَاشِمِ بنِ عَبْدِ مَنَافِ بنِ قُصَيِّ بنِ كِلابِ ابْنِ مُرَّةَ بنِ كَعْبِ بنِ لُؤَيِّ بنِ غَالِبِ بنِ فِهْرِ بنِ مَالِكِ بنِ النَّضْرِ بنِ كِنَانَةَ بنِ خُزَيْمَةَ بنِ مُدْرِكَةَ بنِ إِلْيَاسَ بنِ مُضَرَ ابْنِ نِزَارِ بنِ مَعَدِّ بنِ عَدْنَانَ] عَبْدُ اللَّهِ وَرَسُولُهُ إِلَى كَافَّةِ الْخَلْقِ وَالْمُرَادُ بِالْخَلْقِ هُنَا الإِنْسُ وَالْجِنُّ قَالَ تَعَالَى ﴿لِيَكُونَ لِلْعَالَمِينَ نَذِيرًا﴾ [سُورَةَ الْفُرْقَانِ/1]. إِذْ هَذَا الإِنْذَارُ لِلإِنْسِ وَالْجِنِّ فَقَطْ لا دُخُولَ لِلْمَلائِكَةِ فِيهِ لِأَنَّهُمْ مَجْبُولُونَ عَلَى طَاعَةِ اللَّهِ أَيْ لا يَخْتَارُونَ إِلَّا الطَّاعَةَ بِمَشِيئَةِ اللَّهِ فَلا يَحْتَاجُونَ إِلَى إِنْذَارٍ وَأَمَّا مَنْ قَبْلَهُ مِنَ الأَنْبِيَاءِ فَلَمْ يَكُنْ مُرْسَلًا إِلَى الإِنْسِ وَالْجِنِّ كَافَّةً [وَيَدُلُّ لِذَلِكَ مَا رَوَاهُ الْبُخَارِيُّ فِي صَحِيحِهِ: كِتَابُ التَّيَمُّمِ: بَابُ قَوْلِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ »جُعِلَتْ لِيَ الأَرْضُ مَسْجِدًا وَطَهُورًا« أَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ »وَكَانَ النَّبِيُّ يُبْعَثُ إِلَى قَوْمِهِ خَاصَّةً وَبُعِثْتُ إِلَى النَّاسِ كَافَّةً«، وَلَيْسَ مَعْنَاهُ أَنَّ الأَنْبِيَاءَ السَّابِقِينَ كَانُوا لا يَأْمُرُونَ بِمَعْرُوفٍ وَلا يَنْهَوْنَ عَنْ مُنْكَرٍ إِلَّا مَنْ كَانَ مِنْ أُمَمِهِمْ] فَالإِيمَانُ بِرِسَالَةِ سَيِّدِنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هُوَ أَصْلُ مَعْنَى الشَّهَادَةِ الثَّانِيَةِ لَكِنَّهَا تَتَضَمَّنُ مَسَائِلَ كَثِيرَةً وَتَتْبَعُهَا أَحْكَامٌ عَدِيدَةٌ مِنْهَا ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":84},{"type":"li","text":"كَوْنُهُ مِنْ قُرَيْشٍ وَهُمْ أَشْرَفُ قَبَائِلِ الْعَرَبِ لَهُمُ الصَّدَارَةُ بَيْنَ الْعَرَبِ.","style":"List Paragraph","align":"justify","bold":false,"size":18.0,"index":85},{"type":"li","text":"وَوُجُوبُ مَعْرِفَةِ أَنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وُلِد بِمَكَّةَ وَبُعِثَ أَيْ نَزَلَ عَلَيْهِ الْوَحْيُ بِالنُّبُوَّةِ وَهُوَ بِهَا أَيْ مُسْتَوْطِنٌ بِهَا ثُمَّ هَاجَرَ إِلَى الْمَدِينَةِ وَأَنَّهُ مَاتَ فِي الْمَدِينَةِ فَدُفِنَ فِيهَا.","style":"List Paragraph","align":"justify","bold":false,"size":18.0,"index":86},{"type":"li","text":"وَأَنَّهُ صَادِقٌ فِي كُلِّ مَا أَخْبَرَ بِهِ عَنِ اللَّهِ تَعَالَى وَلا يُخْطِئُ فِي ذَلِكَ سَوَاءٌ كَانَ مِنْ أَخْبَارِ مَنْ قَبْلَهُ مِنَ الأُمَمِ وَالأَنْبِيَاءِ وَبَدْءِ الْخَلْقِ أَوْ مِنَ التَّحْلِيلِ أَوِ التَّحْرِيمِ لِبَعْضِ أَفْعَالِ وَأَقْوَالِ الْعِبَادِ أَوْ مِمَّا أَخْبَرَ بِهِ مِمَّا يَحْدُثُ فِي الْمُسْتَقْبَلِ فِي الدُّنْيَا وَفِي الْبَرْزَخِ وَفِي الآخِرَةِ وَذَلِكَ لِقَوْلِ اللَّهِ تَعَالَى ﴿وَمَا يَنْطِقُ عَنِ الْهَوَى إِنْ هُوَ إِلَّا وَحْيٌ يُوحَى﴾ [سُورَةَ النَّجْم] فَمَنِ اعْتَقَدَ أَنَّهُ يُخْطِئُ فِي ذَلِكَ فَقَدْ كَذَّبَ الدِّينَ. أَمَّا مَا يُخْبِرُ بِهِ مِنْ أُمُورِ الدُّنْيَا بِغَيْرِ وَحْيٍ فَيَجُوزُ عَلَيْهِ الْخَطَأُ فِيهِ.","style":"List Paragraph","align":"justify","bold":true,"size":18.0,"index":87},{"type":"p","text":"   وَيَدْخُلُ فِيمَا يَجِبُ تَصْدِيقُهُ بِهِ جَزْمًا عَذَابُ الْقَبْرِ وَهُوَ بِالرُّوحِ وَالْجَسَدِ وَمِنْهُ عَرْضُ النَّارِ عَلَى الْكَافِرِ كُلَّ يَوْمٍ مَرَّتَيْنِ مَرَّةً أَوَّلَ النَّهَارِ وَمَرَّةً ءَاخِرَ النَّهَارِ يَتَعَذَّبُ بِنَظَرِهِ وَرُؤْيَتِهِ لِمَقْعَدِهِ الَّذِي يَقْعُدُهُ فِي الآخِرَةِ [وَقَدْ قَالَ تَعَالَى ﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا وَيَوْمَ تَقُومُ السَّاعَةُ أَدْخِلُوا ءَالَ فِرْعَوْنَ أَشَدَّ الْعَذَابِ﴾] وَتَضْيِيقُ الْقَبْرِ عَلَيْهِ حَتَّى تَخْتَلِفَ أَضْلاعُهُ فَالأَضْلاعُ الَّتِي فِي إِحْدَى الْجِهَتَيْنِ تَدْخُلُ فِي الأَضْلاعِ الَّتِي فِي الْجِهَةِ الأُخْرَى. وَبَعْضُ النَّاسِ تُسَلَّطُ عَلَيْهِمُ الثَّعَابِينُ وَبَعْضُ النَّاسِ يَأْتِيهِمْ رِيحُ جَهَنَّمَ إِلَى الْقَبْرِ. وَكَذَلِكَ مِنْ عَذَابِ الْقَبْرِ الِانْزِعَاجُ مِنْ ظُلْمَةِ الْقَبْرِ وَوَحْشَتِهِ وَضَرْبُ مُنْكَرٍ وَنَكِيرٍ لِلْكَافِرِ بِمِطْرَقَةٍ بَيْنَ أُذُنَيْهِ وَيَشْمَلُ ذَلِكَ مَا يَحْصُلُ لِبَعْضِ عُصَاةِ الْمُسْلِمِينَ الَّذِينَ مَاتُوا بِلا تَوْبَةٍ لا لِجَمِيعِهِمْ مِمَّا هُوَ دُونَ مَا يَحْصُلُ لِلْكَافِرِ كَضَغْطَةِ الْقَبْرِ حَتَّى تَخْتَلِفَ أَضْلاعُهُ فَهَذِهِ الضَّغْطَةُ تَحْصُلُ لِبَعْضِ عُصَاةِ الْمُسْلِمِينَ أَمَّا الأَتْقِيَاءُ وَالشُّهَدَاءُ وَالأَطْفَالُ فَلا تَحْصُلُ لَهُمْ، وَلَمْ يَصِحَّ حَدِيثُ «لَوْ نَجَا مِنْهَا أَحَدٌ لَنَجَا سَعْدٌ» كَمَا حَكَمَ بِضَعْفِهِ الْحَافِظُ ابْنُ الْجَوْزِيِّ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":88},{"type":"p","text":"   وَالإيمَانُ بِنَعِيمِ الْقَبْرِ فَإِنَّهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَخْبَرَ بِذَلِكَ أَيْضًا وَمِنْهُ تَوْسِيعُ الْقَبْرِ سَبْعِينَ ذِرَاعًا فِي سَبْعِينَ ذِرَاعًا عَلَى الْمُؤْمِنِ التَّقِيِّ وَمَنْ شَاءَ اللَّهُ لَهُ مِنْ غَيْرِ الأَتْقِيَاءِ كَبَعْضِ الشُّهَدَاءِ مِمَّن ِاسْتُشْهِدُوا وَلَمْ يَكُونُوا أَتْقِيَاءَ. وَبَعْضُ النَّاسِ يَتَّسِعُ قَبْرُهُمْ مَدَّ الْبَصَرِ. وَمِنْهُ تَنْوِيرُهُ بِنُورٍ يُشْبِهُ نُورَ الْقَمَرِ لَيْلَةَ الْبَدْرِ وَغَيْرُ ذَلِكَ كَشَمِّ رَائِحَةِ الْجَنَّةِ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":89},{"type":"p","text":"   وَالإِيمَانُ بِسُؤَالِ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ وَهُوَ يَحْصُلُ لِلْمُؤْمِنِ وَالْكَافِرِ مِنْ هَذِهِ الأُمَّةِ أَيِ الَّذِينَ أُرْسِلَ إِلَيْهِمْ مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَيُقَالُ لَهُمْ أُمَّةُ الدَّعْوَةِ أَمَّا الَّذِينَ ءَامَنُوا مِنْهُمْ يُقَالُ لَهُمْ أُمَّةُ الإِجَابَةِ. ثُمَّ الْمُؤْمِنُ الْكَامِلُ لا يَلْحَقُهُ فَزَعٌ وَلا انْزِعَاجٌ مِنْ سُؤَالِهِمَا لِأَنَّ اللَّهَ يُثَبِّتُ قَلْبَهُ فَلا يَرْتَاعُ مِنْ مَنْظَرِهِمَا الْمُخِيفِ لِأَنَّهُمَا كَمَا جَاءَ فِي الْحَدِيثِ أَسْوَدَانِ أَزْرَقَانِ بَلْ يَفْرَحُ الْمُؤْمِنُ بِرُؤْيَتِهِمَا وَسُؤَالِهِمَا. وَيُسْتَثْنَى مِنْ هَذَا السُّؤَالِ النَّبِيُّ وَالطِّفْلُ وَشَهِيدُ الْمَعْرَكَةِ. وَالْمُرَادُ بِالطِّفْلِ مَنْ مَاتَ دُونَ الْبُلُوغِ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":90},{"type":"p","text":"   وَالإِيمَانُ بِالْبَعْثِ وَهُوَ خُرُوجُ الْمَوْتَى مِنَ الْقُبُورِ بَعْدَ إِعَادَةِ الْجَسَدِ الَّذِي أَكَلَهُ التُّرَابُ إِنْ كَانَ مِنَ الأَجْسَادِ الَّتِي يَأْكُلُهَا التُّرَابُ وَهِيَ أَجْسَادُ غَيْرِ الأَنْبِيَاءِ وَشُهَدَاءِ الْمَعْرَكَةِ وَكَذَلِكَ بَعْضُ الأَوْلِيَاءِ لا يَأْكُلُ التُّرَابُ أَجْسَادَهُمْ لِمَا تَوَاتَرَ مِنْ مُشَاهَدَةِ ذَلِكَ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":91},{"type":"p","text":"   وَالإِيمَانُ بِالْحَشْرِ وَهُوَ أَنْ يُجْمَعَ النَّاسُ وَيُسَاقُوا بَعْدَ الْبَعْثِ إِلَى الْمَحْشَرِ وَقَدْ وَرَدَ أَنَّهُ الشَّامُ ثُمَّ يُنْقَلُونَ عِنْدَ دَكِّ الأَرْضِ إِلَى ظُلْمَةٍ عِنْدَ الصِّرَاطِ ثُمَّ يُعَادُونَ إِلَى الأَرْضِ الْمُبَدَّلَةِ فَيَكُونُ الْحِسَابُ عَلَيْهَا.  ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":92},{"type":"p","text":"   وَالإِيمَانُ بِالْقِيَامَةِ وَأَوَّلُهَا مِنْ خُرُوجِ النَّاسِ مِنْ قُبُورِهِمْ إِلَى اسْتِقْرَارِ أَهْلِ الْجَنَّةِ في الْجَنَّةِ وَأَهْلِ النَّارِ فِي النَّارِ وَقَدْ تُطْلَقُ الآخِرَةُ عَلَى ذَلِكَ وَعَلَى مَا بَعْدَهُ إِلَى مَا لا نِهَايَةَ لَهُ. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":93},{"type":"p","text":"   وَالإِيمَانُ بِالْحِسَابِ وَهُوَ عَرْضُ أَعْمَالِ الْعِبَادِ عَلَيْهِمْ يُعْرَضُ عَلَيْهِمْ مَا عَمِلُوا فِي الدُّنْيَا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":94},{"type":"p","text":"   وَالإِيمَانُ بِالثَّوَابِ وَالْعَذَابِ أَمَّا الثَّوَابُ فَهُوَ الْجَزَاءُ الَّذِي يُجَازَاهُ الْمُؤْمِنُ فِي الآخِرَةِ عَلَى الْعَمَلِ الصَّالِحِ مِمَّا يَسُرُّهُ وَأَمَّا الْعَذَابُ فَهُوَ مَا يَسُوءُ الْعَبْدَ ذَلِكَ الْيَوْمَ مِنْ دُخُولِ النَّارِ وَمَا دُونَ ذَلِكَ مِنَ الْعُقُوبَاتِ عَلَى الْمَعَاصِي.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":95},{"type":"p","text":"   وَالإِيمَانُ بِالْمِيزَانِ أَيْ مَا يُوزَنُ عَلَيْهِ أَعْمَالُ الْعِبَادِ فَالْكَافِرُ لَيْسَ لَهُ حَسَنَاتٌ يَوْمَ الْقِيَامَةِ إِنَّمَا تُوضَعُ سَيِّئَاتُهُ فِي كَفَّةٍ مِنَ الْكَفَّتَيْنِ وَأَمَّا الْمُؤْمِنُ فَتُوضَعُ حَسَنَاتُهُ فِي كَفَّةٍ وَسَيِّئَاتُهُ فِي الْكَفَّةِ الأُخْرَى.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":96},{"type":"p","text":"   وَالإِيْمَانُ بِالنَّارِ أَيْ جَهَنَّمَ أَيْ بِأَنَّهَا مَخْلُوقَةٌ الآنَ وَلا تَزَالُ بَاقِيَةً إِلَى مَا نِهَايَةَ لَهُ، هَذَا مَذْهَبُ أَهْلِ الْحَقِّ وَلَيْسَ الأَمْرُ كَمَا يَقُولُ ابْنُ تَيْمِيَةَ إِنَّهَا تَفْنَى لا يَبْقَى فِيهَا أَحَدٌ. وَقَدْ قَالَ قَبْلَ ذَلِكَ فِي كِتَابِهِ «مِنْهَاجُ السُّنَّةِ النَّبَوِيَّةِ» اتَّفَقَ الْمُسْلِمُونَ عَلَى بَقَاءِ الْجَنَّةِ وَالنَّارِ وَخَالَفَ فِي ذَلِكَ جَهْمُ بنُ صَفْوَانَ فَكَفَّرَهُ الْمُسْلِمُونَ اهـ ثُمَّ قَالَ بَعْدَ ذَلِكَ النَّارُ تَفْنَى وَلا يَبْقَى فِيهَا أَحَدٌ فَكَمَا كَفَّرَ هُوَ جَهْمًا لِقَوْلِهِ بِأَنَّ الْجَنَّةَ وَالنَّارَ تَفْنَيَانِ يُكَفَّرُ هُوَ لِقَوْلِهِ بِفَنَاءِ النَّارِ لِأَنَّهُ تَكْذِيبٌ لِلنَّصِّ الْقُرْءَانِيِّ وَلِلإِمَامِ السُّبْكِيِّ رَدٌّ عَلَى ابْنِ تَيْمِيَةَ سَمَّاهُ «الِاعْتِبَارُ بِبَقَاءِ الْجَنَّةِ وَالنَّارِ». وَجَهَنَّمُ دَارُ الْعَذَابِ الْمُقِيمِ لِلْكَافِرِينَ لا يَخْرُجُونَ مِنْهَا أَبَدًا وَأَمَّا بَعْضُ الْعُصَاةِ فَيُعَذَّبُونَ فِيهَا مُدَّةً ثُمَّ يُخْرَجُونَ مِنْهَا وَمَا يَذْكُرُهُ بَعْضُ الْمُنْتَسِبِينَ لِلتَّصَوُّفِ مِنْ أَنَّ الْكُفَّارَ يَتَلَذَّذُونَ بِالنَّارِ وَلا يَرْضَوْنَ الْخُرُوجَ مِنْهَا فَهُوَ كُفْرٌ تَكْذِيبٌ لِلنُّصُوصِ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":97},{"type":"p","text":"   وَالإِيمَانُ بِالصِّرَاطِ وَهُوَ جِسْرٌ يُمَدُّ عَلَى ظَهْرِ جَهَنَّمَ فَيَرِدُهُ النَّاسُ أَحَدُ طَرَفَيْهِ فِي الأَرْضِ الْمُبَدَّلَةِ وَالطَّرَفُ الآخَرُ فِيمَا يَلِي الْجَنَّةَ بَعْدَ النَّارِ فَيَمُرُّ النَّاسُ فِيمَا يُسَامِتُ الصِّرَاطَ فَالْمُؤْمِنُونَ فِي ذَلِكَ عَلَى قِسْمَيْنِ قِسْمٌ لا يَدُوسُونَ الصِّرَاطَ إِنَّمَا يَمُرُّونَ فِي هَوَائِهِ طَائِرِينَ وَهَؤُلاءِ يَصْدُقُ عَلَيْهِمْ أَنَّهُمْ وَرَدُوهَا أَيْ وَرَدُوا النَّارَ لِأَنَّهُ لَيْسَ مِنْ شَرْطِ الْوُرُودِ الْمَذْكُورِ فِي الْقُرْءَانِ بِقَوْلِهِ تَعَالَى ﴿وَإِنْ مِّنْكُمْ إِلَّا وَارِدُهَا﴾ [سُورَةَ مَرْيَم/71] دُخُولُهَا وَقِسْمٌ يَدُوسُونَهُ ثُمَّ هَؤُلاءِ قِسْمٌ مِنْهُمْ يُوقَعُونَ فِي النَّارِ وَقِسْمٌ يُنْجِيهِمُ اللَّهُ فَيَخْلُصُونَ مِنْهَا.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":98},{"type":"p","text":"   وَالإِيمَانُ بِالْحَوْضِ وَهُوَ مَكَانٌ أَعَدَّ اللَّهُ فِيهِ شَرَابًا لِأَهْلِ الْجَنَّةِ يَشْرَبُونَ مِنْهُ بَعْدَ عُبُورِ الصِّرَاطِ قَبْلَ دُخُولِ الْجَنَّةِ فَلا يُصِيبُهُمْ بَعْدَ ذَلِكَ ظَمَأٌ وَإِنَّمَا يَشْرَبُونَ مِنْ شَرَابِ الْجَنَّةِ تَلَذُّذًا.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":99},{"type":"p","text":"   وَالإِيمَانُ بِالشَّفَاعَةِ وَهِيَ تَكُونُ لِلْمُسْلِمِينَ فَقَطْ فَالأَنْبِيَاءُ يَشْفَعُونَ وَكَذَلِكَ الْعُلَمَاءُ الْعَامِلُونَ وَشُهَدَاءُ الْمَعْرَكَةِ وَالْمَلائِكَةُ. وَالشَّفَاعَةُ هِيَ طَلَبُ الْخَيْرِ مِنَ الْغَيْرِ لِلْغَيْرِ فَالشُّفَعَاءُ فِي الآخِرَةِ يَطْلُبُونَ مِنَ اللَّهِ إِسْقَاطَ الْعِقَابِ لِبَعْضِ الْعُصَاةِ مِنَ الْمُسْلِمِينَ وَذَلِكَ قَدْ يَكُونُ قَبْلَ دُخُولِ النَّارِ وَقَدْ يَكُونُ بَعْدَهُ.","style":"Normal","align":"justify","bold":false,"size":18.0,"index":100},{"type":"p","text":"   وَالإِيمَانُ بِالْجَنَّةِ وَهِيَ دَارُ السَّلامِ أَيْ دَارُ النَّعِيمِ الْمُقِيمِ الدَّائِمِ وَالنَّعِيمُ فِيهَا قِسْمَانِ نَعِيمٌ لا يَنَالُهُ إِلَّا الأَتْقِيَاءُ وَنَعِيمٌ يَنَالُهُ كُلُّ أَهْلِ الْجَنَّةِ وَمِنْ هَذَا النَّعِيمِ الْعَامِّ أَنَّ أَهْلَ الْجَنَّةِ كُلَّهُمْ شَبَابٌ لا يَهْرَمُونَ أَبَدًا وَكُلَّهُمْ أَصِحَّاءُ لا يَسْقَمُونَ أَيْ لا يَمْرَضُونَ أَبَدًا وَكُلَّهُمْ فِي سُرُورٍ لا يُصِيبُهُمْ هَمٌّ وَحَزَنٌ وَنَكَدٌ وَكَرْبٌ وَكُلَّهُمْ يَبْقَوْنَ أَحْيَاءً فِي نَعِيمٍ دَائِمٍ لا يَمُوتُونَ أَبَدًا. ","style":"Normal","align":"justify","bold":false,"size":18.0,"index":101},{"type":"p","text":"   وَالإِيمَانُ بِالرُّؤْيَةِ لِلَّهِ تَعَالَى بِالْعَيْنِ فِي الآخِرَةِ بِأَنَّهَا حَقٌّ وَهَذَا خَاصٌّ بِالْمُؤْمِنِينَ يَرَوْنَهُ وَهُمْ فِي الْجَنَّةِ بِلا كَيْفٍ وَلا تَشْبِيهٍ وَلا جِهَةٍ كَمَا نَصَّ عَلَى ذَلِكَ الإِمَامُ أَبُو حَنِيفَةَ رَضِيَ اللَّهُ عَنْهُ أَيْ أَنَّهُ تَعَالَى لا يَكُونُ فِي جِهَةٍ وَلا مَكَانٍ إِنَّمَا هُمْ فِي مَكَانِهِمْ فِي الْجَنَّةِ يَرَوْنَهُ رُؤْيَةً لا يَكُونُ عَلَيْهِمْ فِيهَا اشْتِبَاهٌ لا يَشُكُّونَ هَلِ الَّذِي رَأَوْهُ هُوَ اللَّهُ أَوْ غَيْرُهُ كَمَا لا يَشُكُّ مُبْصِرُ الْقَمَرِ لَيْلَةَ الْبَدْرِ لَيْسَ دُونَهُ سَحَابٌ أَنَّ الَّذِي رَءَاهُ هُوَ الْقَمَرُ فَفِي ذَلِكَ قَالَ الرَّسُولُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «إِنَّكُمْ سَتَرَوْنَ رَبَّكُمْ يَوْمَ الْقِيَامَةِ كَمَا تَرَوْنَ الْقَمَرَ لَيْلَةَ الْبَدْرِ لا تَضَامُّونَ فِي رُؤْيَتِهِ» رَوَاهُ مُسْلِمٌ أَيْ لا تَتَزَاحَمُونَ فِي رُؤْيَتِهِ وَفِي رِوَايَةٍ «لا تُضَامُون» أَيْ لا يَلْحَقُكُمْ ضَرَرٌ شَبَّهَ رُؤْيَتَنَا لَهُ مِنْ حَيْثُ عَدَمُ الشَّكِّ بِرُؤْيَةِ الْقَمَرِ لَيْلَةَ الْبَدْرِ وَلَمْ يُشَبِّهِ اللَّهَ تَعَالَى بِالْقَمَرِ كَمَا زَعَمَ بَعْضُ الجُهَّالِ فَإِنَّ الَّذِي لَمْ يَتَعَلَّمِ التَّوْحِيدَ إِذَا سَمِعَ هَذَا الْحَدِيثَ قَدْ يَعْتَقِدُ أَنَّ اللَّهَ يُشْبِهُ الْقَمَرَ لَيْلَةَ الْبَدْرِ وَقَدْ صَرَّحَ بَعْضُ الْعَوَامِّ بِذَلِكَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":102},{"type":"p","text":"   وَالإِيمَانُ بِالْخُلُودِ فِيهِمَا فَيَجِبُ الإِيمَانُ بِأَنَّ أَهْلَ الْجَنَّةِ يَخْلُدُونَ فِي الْجَنَّةِ وَأَهْلَ النَّارِ يَخْلُدُونَ فِيهَا وَأَنَّهُ لا مَوْتَ بَعْدَ ذَلِكَ. ","style":"Normal","align":"justify","bold":true,"size":18.0,"index":103},{"type":"p","text":"   وَالإِيمَانُ بِمَلائِكَةِ اللَّهِ أَيْ بِوُجُودِهِمْ وَأَنَّهُمْ عِبَادٌ مُكْرَمُونَ وَهُمْ أَجْسَامٌ نُورَانِيَّةٌ لَطِيفَةٌ أَلْطَفُ مِنَ الْهَوَاءِ ذَوُو أَرْوَاحٍ مُشَرَّفَةٍ لَيْسُوا ذُكُورًا وَلا إِنَاثًا لا يَأْكُلُونَ وَلا يَشْرَبُونَ وَلا يَنَامُونَ وَلا يَتَوَالَدُونَ مُكَلَّفُونَ لا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ.","style":"Normal","align":"justify","bold":true,"size":18.0,"index":104},{"type":"p","text":"   وَالإِيمَانُ بِرُسُلِهِ أَيْ أَنْبِيَائِهِ مَنْ كَانَ رَسُولًا وَمَنْ لَمْ يَكُنْ رَسُولًا فَالنَّبِيُّ غَيْرُ الرَّسُولِ هُوَ إِنْسَانٌ أُوحِيَ إِلَيْهِ لا بِشَرْعٍ جَدِيدٍ بَلْ أُوحِيَ إِلَيْهِ بِاتِّبَاعِ شَرْعِ الرَّسُولِ الَّذِي قَبْلَهُ وَأَنْ يُبَلِّغَ ذَلِكَ وَالنَّبِيُّ الرَّسُولُ مَنْ أُوحِيَ إِلَيْهِ بِشَرْعٍ جَدِيدٍ وَأُمِرَ بِتَبْلِيغِهِ. وَمِنَ الْغَلَطِ الشَّنِيعِ مَا ذَكَرَهُ بَعْضُ الْعُلَمَاءِ أَنَّ النَّبِيَّ مَنْ أُوحِيَ إِلَيْهِ بِشَرْعٍ وَلَمْ يُؤْمَرْ بِتَبْلِيغِهِ وَهَذَا كَلامٌ شَنِيعٌ كَيْفَ يُنَبَّأُ ثُمَّ لا يُؤْمَرُ بِالتَّبْلِيغِ وَكَيْفَ يَصِحُّ أَنْ يُنَبَّأَ النَّبِيُّ لِنَفْسِهِ فَقَطْ فَمَا أَشْنَعَ هَذِهِ الْغَلْطَةَ وَهَذِهِ الْغَلْطَةُ مَوْجُودَةٌ فِي تَفْسِيرِ الْجَلالَيْنِ وَفِي كُتُبٍ عَدِيدَةٍ. وَأَوَّلُ مَنْ أُرْسِلَ إِلَى الْكُفَّارِ سَيِّدُنَا نُوحٌ عَلَيْهِ السَّلامُ وَقَدْ صَحَّ أَنَّهُ أَوَّلُ الرُّسُلِ إِلَى أَهْلِ الأَرْضِ أَيْ بَعْدَ حُدُوثِ الْكُفْرِ بَيْنَ الْبَشَرِ وَلَيْسَ مَعْنَاهُ أَنَّهُ لَم

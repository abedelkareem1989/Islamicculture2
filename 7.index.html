<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b52" />
  <meta name="description" content="تطبيق تفاعلي لقراءة قصص من الماضي للصفوف الابتدائية." />
  <title>قصص من الماضي</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">

  <style>
    :root{
      --emerald:#0b6b52;
      --emerald-2:#0e8062;
      --emerald-soft:#eaf7f2;
      --gold:#b9913d;
      --gold-soft:#f6eedc;
      --bg:#f7f4ec;
      --surface:#ffffff;
      --surface-2:#fbfaf6;
      --text:#17342c;
      --muted:#6d7c77;
      --line:#e8e2d4;
      --shadow:0 16px 50px rgba(27,61,51,.10);
      --shadow-sm:0 8px 28px rgba(27,61,51,.08);
      --radius:24px;
      --reader-font:"Amiri", serif;
      --reader-size:21px;
      --header-h:72px;
    }
    [data-theme="dark"]{
      --bg:#101b18;
      --surface:#172521;
      --surface-2:#1b2b27;
      --text:#eef7f3;
      --muted:#a8bbb4;
      --line:#2e433d;
      --emerald-soft:#17382f;
      --gold-soft:#342d1e;
      --shadow:0 18px 54px rgba(0,0,0,.22);
      --shadow-sm:0 8px 28px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% -10%, rgba(185,145,61,.10), transparent 34%),
        radial-gradient(circle at 95% 8%, rgba(11,107,82,.11), transparent 30%),
        var(--bg);
      color:var(--text);
      font-family:"Cairo",Tahoma,Arial,sans-serif;
      transition:background .25s ease,color .25s ease;
    }
    body.no-scroll{overflow:hidden}
    button,input,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .hidden{display:none!important}
    .app-shell{min-height:100vh}
    .topbar{
      position:sticky; top:0; z-index:50;
      height:var(--header-h);
      display:flex; align-items:center; justify-content:space-between;
      gap:12px;
      padding:0 clamp(14px,3vw,34px);
      background:color-mix(in srgb,var(--surface) 90%,transparent);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{
      width:42px;height:42px;border-radius:14px;
      display:grid;place-items:center;
      color:white;
      background:linear-gradient(145deg,var(--emerald),var(--emerald-2));
      box-shadow:0 8px 22px rgba(11,107,82,.24);
      flex:0 0 auto;
    }
    .brand-text{min-width:0}
    .brand-title{font-size:16px;font-weight:800;white-space:nowrap}
    .brand-subtitle{font-size:11px;color:var(--muted);white-space:nowrap}
    .top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn,.soft-btn,.primary-btn,.tool-btn{
      border:0;border-radius:14px;min-height:42px;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      transition:.2s ease;
    }
    .icon-btn{
      width:42px;background:var(--surface-2);color:var(--text);
      border:1px solid var(--line);
    }
    .icon-btn:hover,.tool-btn:hover,.soft-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--emerald) 45%,var(--line))}
    .primary-btn{padding:10px 16px;background:var(--emerald);color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(11,107,82,.18)}
    .soft-btn{padding:10px 15px;background:var(--surface);color:var(--text);border:1px solid var(--line);font-weight:700}
    .page{
      width:min(1180px,calc(100% - 28px));
      margin:0 auto;
      padding:clamp(22px,4vw,48px) 0 110px;
      animation:fadeIn .28s ease;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .hero{
      padding:clamp(24px,5vw,48px);
      border:1px solid var(--line);
      border-radius:32px;
      background:
        linear-gradient(135deg,color-mix(in srgb,var(--emerald-soft) 82%,var(--surface)),var(--surface));
      box-shadow:var(--shadow-sm);
      position:relative;overflow:hidden;
    }
    .hero:after{
      content:"";position:absolute;inset:auto -70px -95px auto;width:230px;height:230px;
      border:34px solid color-mix(in srgb,var(--gold) 15%,transparent);
      border-radius:50%;pointer-events:none
    }
    .eyebrow{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.02em}
    .hero h1{font-family:"Amiri",serif;font-size:clamp(34px,6vw,60px);line-height:1.15;margin:8px 0 8px}
    .hero p{margin:0;color:var(--muted);max-width:780px;line-height:1.9}
    .search-box{
      margin-top:24px;display:flex;align-items:center;gap:10px;
      background:var(--surface);border:1px solid var(--line);border-radius:18px;
      padding:0 14px;min-height:56px;box-shadow:var(--shadow-sm);position:relative;z-index:2;
    }
    .search-box i{color:var(--emerald)}
    .search-box input{width:100%;height:54px;background:transparent;border:0;outline:0;color:var(--text);font-size:15px}
    .continue-card{
      margin-top:18px;padding:16px 18px;border-radius:18px;
      background:color-mix(in srgb,var(--gold-soft) 72%,var(--surface));
      border:1px solid color-mix(in srgb,var(--gold) 24%,var(--line));
      display:flex;align-items:center;justify-content:space-between;gap:14px;
    }
    .continue-card strong{display:block;margin-bottom:4px}
    .continue-card small{color:var(--muted)}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:34px 0 16px}
    .section-head h2{margin:0;font-size:24px}
    .section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .grade-filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
    .chip{
      border:1px solid var(--line);background:var(--surface);color:var(--text);
      border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;transition:.2s ease
    }
    .chip.active{background:var(--emerald);color:#fff;border-color:var(--emerald)}
    .grade-group{margin-top:28px}
    .grade-title{
      display:flex;align-items:center;gap:10px;margin-bottom:13px;font-weight:800;font-size:18px
    }
    .grade-title:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
    .cards{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
    }
    .card{
      position:relative;overflow:hidden;text-align:right;
      border:1px solid var(--line);background:var(--surface);color:var(--text);
      border-radius:var(--radius);padding:20px;min-height:215px;
      box-shadow:var(--shadow-sm);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    }
    .card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--emerald) 35%,var(--line))}
    .card:active{transform:scale(.985)}
    .card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .card-icon{
      width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
      color:var(--emerald);background:var(--emerald-soft);font-size:19px
    }
    .card-grade{font-size:11px;font-weight:800;color:var(--gold);background:var(--gold-soft);padding:6px 9px;border-radius:999px}
    .card h3{font-family:"Amiri",serif;font-size:22px;line-height:1.55;margin:16px 0 8px}
    .card-desc{
      margin:0;color:var(--muted);font-size:13px;line-height:1.8;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .card-meta{display:flex;gap:12px;align-items:center;margin-top:15px;color:var(--muted);font-size:11px}
    .card-meta span{display:flex;align-items:center;gap:5px}
    .fav-mini{
      position:absolute;top:14px;left:14px;width:34px;height:34px;border:0;border-radius:11px;
      background:color-mix(in srgb,var(--surface) 84%,transparent);color:var(--muted);z-index:3
    }
    .fav-mini.active{color:var(--gold)}
    .ripple-wave{
      position:absolute;border-radius:50%;transform:scale(0);
      background:color-mix(in srgb,var(--emerald) 20%,transparent);
      animation:ripple .55s linear;pointer-events:none
    }
    @keyframes ripple{to{transform:scale(4);opacity:0}}
    .empty{
      text-align:center;padding:55px 20px;border:1px dashed var(--line);
      background:var(--surface);border-radius:24px;color:var(--muted)
    }
    .empty i{font-size:38px;color:var(--gold);margin-bottom:12px}
    .reader-wrap{max-width:930px;margin:0 auto}
    .reader-top{
      display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px
    }
    .back-btn{border:0;background:transparent;color:var(--emerald);font-weight:800;padding:10px 0}
    .reader-tools{display:flex;flex-wrap:wrap;gap:8px}
    .tool-btn{padding:9px 12px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:700}
    .tool-btn.active{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,var(--line));background:var(--gold-soft)}
    .reader-card{
      border:1px solid var(--line);background:var(--surface);border-radius:30px;
      box-shadow:var(--shadow);overflow:hidden
    }
    .reader-cover{
      padding:clamp(24px,5vw,48px);
      background:linear-gradient(145deg,var(--emerald-soft),color-mix(in srgb,var(--surface) 92%,var(--gold-soft)));
      border-bottom:1px solid var(--line)
    }
    .book-label{font-size:12px;color:var(--gold);font-weight:800}
    .reader-cover h1{font-family:"Amiri",serif;font-size:clamp(30px,5vw,48px);line-height:1.45;margin:9px 0 18px}
    .stats{display:flex;flex-wrap:wrap;gap:9px}
    .stat{padding:8px 11px;border-radius:12px;background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);font-size:12px;color:var(--muted)}
    .stat i{color:var(--emerald);margin-left:5px}
    .reader-content{
      padding:clamp(24px,5vw,52px);
      font-family:var(--reader-font);
      font-size:var(--reader-size);
      line-height:2.15;
    }
    .reader-content p,.reader-content li,.reader-content h3{white-space:pre-wrap}
    .reader-content p{margin:0 0 1.15em;text-align:justify}
    .reader-content .subheading{font-size:1.06em;color:var(--emerald);margin:1.4em 0 .7em}
    .questions-heading{
      margin:2.2em 0 .7em!important;padding:13px 16px;border-radius:14px;
      background:var(--emerald-soft);color:var(--emerald);font-size:1.02em
    }
    .questions-list{list-style:none;padding:0;margin:0 0 1.4em}
    .questions-list li{
      margin:0 0 .7em;padding:11px 14px;
      background:var(--surface-2);border:1px solid var(--line);border-radius:13px;line-height:1.85
    }
    .reader-nav{
      display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 clamp(24px,5vw,52px) clamp(24px,5vw,45px)
    }
    .reader-nav button{
      min-height:64px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:16px;padding:12px;text-align:right
    }
    .reader-nav button:last-child{text-align:left}
    .reader-nav small{display:block;color:var(--muted);margin-bottom:3px}
    .progress{
      position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--emerald));
      width:0;z-index:100;transition:width .08s linear
    }
    .to-top{
      position:fixed;left:18px;bottom:88px;z-index:45;width:44px;height:44px;border-radius:15px;border:0;
      background:var(--emerald);color:#fff;box-shadow:0 10px 24px rgba(11,107,82,.28);
      opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s ease
    }
    .to-top.show{opacity:1;transform:none;pointer-events:auto}
    .settings-card{
      background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;
      box-shadow:var(--shadow-sm);margin-bottom:14px
    }
    .settings-card h3{margin:0 0 6px;font-size:17px}
    .settings-card p{margin:0 0 16px;color:var(--muted);font-size:13px}
    .setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .theme-options,.font-options{display:flex;flex-wrap:wrap;gap:8px}
    .option-btn{
      border:1px solid var(--line);background:var(--surface-2);color:var(--text);
      padding:9px 12px;border-radius:12px;font-weight:700
    }
    .option-btn.active{background:var(--emerald);border-color:var(--emerald);color:#fff}
    .range-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
    input[type="range"]{accent-color:var(--emerald);width:100%}
    .bottom-nav{
      position:fixed;z-index:60;right:50%;transform:translateX(50%);bottom:12px;
      display:flex;gap:5px;padding:7px;background:color-mix(in srgb,var(--surface) 92%,transparent);
      border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(16px)
    }
    .nav-btn{
      min-width:76px;border:0;background:transparent;color:var(--muted);
      border-radius:14px;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800
    }
    .nav-btn.active{background:var(--emerald-soft);color:var(--emerald)}
    .modal{
      position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:90px 14px 20px;
      background:rgba(5,18,14,.48);backdrop-filter:blur(5px)
    }
    .modal.open{display:flex}
    .modal-panel{
      width:min(760px,100%);max-height:min(72vh,720px);overflow:hidden;
      border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 24px 80px rgba(0,0,0,.28)
    }
    .modal-search{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
    .modal-search input{height:48px;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:14px;padding:0 14px;outline:none}
    .close-btn{width:44px;height:44px;border:0;border-radius:13px;background:var(--surface-2);color:var(--text)}
    .search-results{max-height:calc(72vh - 78px);overflow:auto;padding:10px}
    .search-result{
      width:100%;text-align:right;border:0;border-bottom:1px solid var(--line);
      background:transparent;color:var(--text);padding:14px;border-radius:13px
    }
    .search-result:hover{background:var(--emerald-soft)}
    .search-result strong{font-family:"Amiri",serif;font-size:19px;display:block;margin-bottom:4px}
    .search-result span{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .toast{
      position:fixed;z-index:120;left:50%;bottom:92px;transform:translate(-50%,16px);
      background:#182722;color:#fff;border-radius:14px;padding:11px 16px;box-shadow:var(--shadow);
      opacity:0;pointer-events:none;transition:.2s ease;font-size:13px
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .page-title{margin:0 0 6px;font-size:30px}
    .page-lead{margin:0 0 24px;color:var(--muted)}
    @media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:620px){
      :root{--header-h:64px}
      .topbar{padding:0 12px}.brand-subtitle{display:none}
      .cards{grid-template-columns:1fr}
      .page{width:min(100% - 20px,1180px);padding-top:18px}
      .hero{border-radius:24px;padding:24px 18px}
      .hero h1{font-size:38px}
      .card{min-height:190px}
      .bottom-nav{bottom:8px;width:calc(100% - 16px);justify-content:space-around}
      .nav-btn{min-width:auto;flex:1;padding:9px 7px}
      .nav-btn span{font-size:11px}
      .reader-card{border-radius:22px}
      .reader-content{font-size:var(--reader-size);padding:24px 18px}
      .reader-content p{text-align:right}
      .reader-nav{padding:0 18px 24px}
      .tool-btn span{display:none}
      .reader-top{align-items:flex-start}
      .modal{padding-top:72px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <div class="progress" id="progressBar"></div>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" role="button" tabindex="0" onclick="navigate('home')" onkeydown="if(event.key==='Enter')navigate('home')">
        <div class="brand-mark"><i class="fa-solid fa-book-quran"></i></div>
        <div class="brand-text">
          <div class="brand-title">قَصَصٌ مِنَ الْمَاضِى</div>
          <div class="brand-subtitle">مكتبة قراءة تفاعلية</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" type="button" onclick="openSearch()" aria-label="البحث"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn" type="button" id="quickThemeBtn" onclick="toggleTheme()" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
      </div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="nav-btn ripple" data-route="home" onclick="navigate('home')"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
      <button class="nav-btn ripple" data-route="favorites" onclick="navigate('favorites')"><i class="fa-solid fa-bookmark"></i><span>المفضلة</span></button>
      <button class="nav-btn ripple" data-route="settings" onclick="navigate('settings')"><i class="fa-solid fa-sliders"></i><span>الإعدادات</span></button>
    </nav>
  </div>

  <button id="toTop" class="to-top" type="button" aria-label="العودة للأعلى" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <div class="modal" id="searchModal" role="dialog" aria-modal="true" aria-label="البحث">
    <div class="modal-panel">
      <div class="modal-search">
        <input id="modalSearchInput" type="search" autocomplete="off" placeholder="ابحث في العناوين والمحتوى..." />
        <button class="close-btn" type="button" onclick="closeSearch()" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>

يَابِ وَصُنْعِ الْعُمْلَةِ الذَّهَبِيَّةِ وَالْفِضِّيَّةِ.","items":[{"type":"p","text":"عَلَّمَ اللَّهُ سَيِّدَنَا ءَادَمَ عَلَيْهِ السَّلامُ أُمُورَ الْمَعِيشَةِ مِثْلَ الزَّرْعِ وَحِيَاكَةِ الثِّيَابِ وَصُنْعِ الْعُمْلَةِ الذَّهَبِيَّةِ وَالْفِضِّيَّةِ."},{"type":"p","text":"وَعَلَّمَهُ كَيْفَ يَصْنَعُ أَدَوَاتِ الزِّرَاعَةِ مِثْلَ الرَّفْشِ وَالْمِنْجَلِ."},{"type":"p","text":"وَعَلَّمَهُ كَيْفَ يَزْرَعُ الْحُبُوبَ وَالْخُضَارَ وَالْفَاكِهَةَ وَكَيْفَ يَحْصِدُ أَىْ كَيْفَ يَقْطَعُ الزَّرْعَ."},{"type":"subheading","text":"وَعَلَّمَهُ كَيْفَ يَصْنَعُ الْخُبْزَ مِنَ الْقَمْحِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا عَلَّمَ اللَّهُ سَيِّدَنَا ءَادَمَ."},{"type":"question","text":"     (2) أَعْطِ مَثَلًا عَلَى أَدَوَاتِ الزِّرَاعَةِ."},{"type":"question","text":"     (3) مِمَّ يُصْنَعُ الْخُبْزُ."}],"paragraphCount":7},{"id":"g1-s11","grade":1,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الأَوَّلِ","title":"سَيِّدُنَا ءَادَمُ يَبْنِى الْكَعْبَةَ","description":"تَعَلَّمَ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ الْبِنَاءَ.","items":[{"type":"subheading","text":"تَعَلَّمَ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ الْبِنَاءَ."},{"type":"subheading","text":"فَكَانَ يَبْنِى الْبُيُوتَ وَيَصْنَعُ لَهَا الأَبْوَابَ وَالسُّطُوحَ."},{"type":"p","text":"سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ هُوَ أَوَّلُ مَنْ بَنَى الْكَعْبَةَ فِى مَكَّةَ."},{"type":"subheading","text":"وَفِى زَمَانِهِ بُنِىَ الْمَسْجِدُ الأَقْصَى فِى فِلَسْطِينَ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا تَعَلَّمَ سَيِّدُنَا ءَادَمُ."},{"type":"question","text":"     (2) هَلْ كَانَ يَبْنِى سَيِّدُنَا ءَادَمُ الْبُيُوتَ."},{"type":"question","text":"     (3) مَنْ هُوَ أَوَّلُ مَنْ بَنَى الْكَعْبَةَ."},{"type":"question","text":"     (4) أَيْنَ تُوجَدُ الْكَعْبَةُ."},{"type":"question","text":"     (5) أَيْنَ يُوجَدُ الْمَسْجِدُ الأَقْصَى."}],"paragraphCount":9}]},{"grade":2,"title":"قَصَصٌ مِنَ الْمَاضِى","subtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","sections":[{"id":"g2-s1","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"أَصْلُ الْبَشَرِ","description":" أَمَرَ اللَّهُ الْمَلَكَ أَنْ يَأْخُذَ قَبْضَةً مِنْ جَمِيعِ تُرَابِ الأَرْضِ مِنْ أَبْيَضِهَا وَأَسْوَدِهَا وَمِمَّا هُوَ بَيْنَ الأَبْيَضِ وَالأَسْوَدِ وَمِنْ سَهْلِهَا وَقَاسِيهَا وَمِنْ طَيِّبِهَا وَرَدِيئِهَا وَمِمَّا هُوَ بَيْنَ ذَلِكَ.","items":[{"type":"p","text":" أَمَرَ اللَّهُ الْمَلَكَ أَنْ يَأْخُذَ قَبْضَةً مِنْ جَمِيعِ تُرَابِ الأَرْضِ مِنْ أَبْيَضِهَا وَأَسْوَدِهَا وَمِمَّا هُوَ بَيْنَ الأَبْيَضِ وَالأَسْوَدِ وَمِنْ سَهْلِهَا وَقَاسِيهَا وَمِنْ طَيِّبِهَا وَرَدِيئِهَا وَمِمَّا هُوَ بَيْنَ ذَلِكَ."},{"type":"p","text":"وَمِنْ هَذَا التُّرَابِ خَلَقَ اللَّهُ سَيِّدَنَا ءَادَمَ عَلَيْهِ السَّلامُ فَجَاءَتْ أَحْوَالُ ذُرِّيَّتِهِ مُخْتَلِفَةً بِسَبَبِ اخْتِلافِ التُّرَابِ الَّذِى خُلِقَ مِنْهُ."},{"type":"p","text":"فَتَجِدُ فِيهِمُ الأَبْيَضَ وَالأَسْوَدَ وَمَنْ هُوَ بَيْنَ الْبَيَاضِ وَالسَّوَادِ وَتَجِدُ فِيهِمُ الْمُؤْمِنَ وَالْكَافِرَ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنِ الَّذِى أَخَذَ قَبْضَةً مِنْ تُرَابِ الأَرْضِ."},{"type":"question","text":"     (2) كَيْفَ كَانَ لَوْنُ التُّرَابِ الَّذِى أَخَذَهُ الْمَلَكُ."},{"type":"question","text":"     (3) مِمَّ خَلَقَ اللَّهُ سَيِّدَنَا ءَادَمَ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (4) لِمَاذَا جَاءَتْ أَحْوَالُ ذُرِّيَّةِ ءَادَمَ مُخْتَلِفَةً."}],"paragraphCount":7},{"id":"g2-s2","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"خَلْقُ ءَادَمَ","description":"أَخَذَ عَزْرَائِيلُ عَلَيْهِ السَّلامُ التُّرَابَ وَصَعِدَ بِهِ إِلَى الْجَنَّةِ وَعَجَنَهُ بِمَاءٍ مِنَ الْجَنَّةِ فَصَارَ طِينًا وَجَعَلَهُ اللَّهُ عَلَى صُورَةِ سَيِّدِنَا ءَادَمَ.","items":[{"type":"p","text":"أَخَذَ عَزْرَائِيلُ عَلَيْهِ السَّلامُ التُّرَابَ وَصَعِدَ بِهِ إِلَى الْجَنَّةِ وَعَجَنَهُ بِمَاءٍ مِنَ الْجَنَّةِ فَصَارَ طِينًا وَجَعَلَهُ اللَّهُ عَلَى صُورَةِ سَيِّدِنَا ءَادَمَ."},{"type":"p","text":"بَعْدَ فَتْرَةٍ صَارَ الطِّينُ صَلْصَالًا أَىْ طِينًا يَابِسًا ثُمَّ نُفِخَتْ فِيهِ الرُّوحُ فَتَكَلَّمَ وَكَانَ أَوَّلَ مَا قَالَهُ الْحَمْدُ لِلَّهِ."},{"type":"p","text":"وَخَلَقَ اللَّهُ تَعَالَى فِى ءَادَمَ عَلَيْهِ السَّلامُ الْمَعْرِفَةَ وَالإِيـمَانَ وَعَلَّمَهُ بِأَنَّ لَهُ رَبًّا خَالِقًا خَلَقَهُ وَخَلَقَ جَمِيعَ الأَشْيَاءِ وَأَنَّ هَذَا الرَّبَّ هُوَ الَّذِى يَسْتَحِقُّ أَنْ يُعْبَدَ وَلا يَسْتَحِقُّ أَحَدٌ غَيْرُهُ الْعِبَادَةَ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَيْفَ صَارَ التُّرَابُ طِينًا."},{"type":"question","text":"     (2) مَا هُوَ الصَّلْصَالُ."},{"type":"question","text":"     (3) مَا أَوَّلُ مَا تَكَلَّمَ بِهِ ءَادَمُ."},{"type":"question","text":"     (4) مَاذَا عَلَّمَ اللَّهُ ءَادَمَ."}],"paragraphCount":7},{"id":"g2-s3","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"خَلْقُ حَوَّاءَ","description":"خَلَقَ اللَّهُ لِسَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ زَوْجَةً اسْمُهَا حَوَّاءُ خَلَقَهَا مِنْ ضِلْعِ ءَادَمَ الأَيْسَرِ الأَقْصَرِ أَىِ الْقَصِيرِ.","items":[{"type":"p","text":"خَلَقَ اللَّهُ لِسَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ زَوْجَةً اسْمُهَا حَوَّاءُ خَلَقَهَا مِنْ ضِلْعِ ءَادَمَ الأَيْسَرِ الأَقْصَرِ أَىِ الْقَصِيرِ."},{"type":"p","text":"ثُمَّ ذُرِّيَّةُ ءَادَمَ أَىْ أَوْلادُهُ وَأَوْلادُهُمْ خَرَجَتْ مِنْهُمَا أَىْ مِنْ ءَادَمَ وَحَوَّاءَ قَالَ تَعَالَى ﴿هُوَ الَّذِى خَلَقَكُم مِّنْ نَّفْسٍ وَاحِدَةٍ﴾ [سُورَةَ الأَعْرَاف/189] أَىْ مِنْ نَبِىِّ اللَّهِ ءَادَمَ ﴿وَجَعَلَ مِنْهَا زَوْجَهَا﴾ [سُورَةَ الأَعْرَاف/189] أَىْ خَلَقَ حَوَّاءَ مِنْ جَسَدِ ءَادَمَ عَلَيْهِ السَّلامُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَا اسْمُ زَوْجَةِ ءَادَمَ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (2) مِمَّ خُلِقَتْ حَوَّاءُ."},{"type":"question","text":"     (3) مَا مَعْنَى قَوْلِهِ تَعَالَى ﴿هُوَ الَّذِى خَلَقَكُم مِّنْ نَّفْسٍ وَاحِدَةٍ﴾."},{"type":"question","text":"     (4) مَا مَعْنَى قَوْلِهِ تَعَالَى ﴿وَجَعَلَ مِنْهَا زَوْجَهَا﴾."}],"paragraphCount":6},{"id":"g2-s4","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"صِفَةُ ءَادَمَ وَحَوَّاءَ","description":" كَانَ طُولُ سَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ سِتِّينَ ذِرَاعًا بِذِرَاعِ الْيَدِ وَعَرْضُهُ سَبْعَةَ أَذْرُعٍ كَمَا جَاءَ عَنِ الرَّسُولِ ﷺ.","items":[{"type":"p","text":" كَانَ طُولُ سَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ سِتِّينَ ذِرَاعًا بِذِرَاعِ الْيَدِ وَعَرْضُهُ سَبْعَةَ أَذْرُعٍ كَمَا جَاءَ عَنِ الرَّسُولِ ﷺ."},{"type":"p","text":"أَخْرَجَ اللَّهُ تَعَالَى حَوَّاءَ مِنْ ضِلْعِ سَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ، لَمْ يَخْلُقْهَا طِفْلَةً إِنَّمَا خَلَقَهَا عَلَى هَيْئَتِهَا الَّتِى عَاشَتْ عَلَيْهَا كَبِيرَةً طَوِيلَةً مُنَاسِبَةً لِطُولِ ءَادَمَ."},{"type":"p","text":"أَسْكَنَ اللَّهُ تَعَالَى ءَادَمَ وَحَوَّاءَ الْجَنَّةَ ثُمَّ أُخْرِجَا مِنَ الْجَنَّةِ وَأُنْزِلا إِلَى هَذِهِ الأَرْضِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَمْ كَانَ طُولُ سَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ وَعَرْضُهُ."},{"type":"question","text":"     (2) مِمَّ خُلِقَتْ حَوَّاءُ."},{"type":"question","text":"     (3) عَلَى أَىِّ هَيْئَةٍ خُلِقَتْ حَوَّاءُ."},{"type":"question","text":"     (4) أَيْنَ سَكَنَ ءَادَمُ وَحَوَّاءُ فِى أَوَّلِ حَيَاتِهِمَا."}],"paragraphCount":7},{"id":"g2-s5","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"ءَادَمُ أَوَّلُ الأَنْبِيَاءِ","description":"   أَرْسَلَ اللَّهُ تَبَارَكَ وَتَعَالَى الرُّسُلَ رَحْمَةً بِعِبَادِهِ وَفَرَضَ عَلَيْهِمْ طَاعَتَهُمْ فَكَانَ يَجِبُ طَاعَةُ كُلِّ رَسُولٍ فِى زَمَانِهِ.","items":[{"type":"p","text":"   أَرْسَلَ اللَّهُ تَبَارَكَ وَتَعَالَى الرُّسُلَ رَحْمَةً بِعِبَادِهِ وَفَرَضَ عَلَيْهِمْ طَاعَتَهُمْ فَكَانَ يَجِبُ طَاعَةُ كُلِّ رَسُولٍ فِى زَمَانِهِ."},{"type":"p","text":"   وَأَوَّلُ الرُّسُلِ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ عَلَّمَهُ اللَّهُ تَعَالَى اللُّغَاتِ مِنْ دُونِ دِرَاسَةٍ فَكَانَ يَتَكَلَّمُ بِكَلامٍ فَصِيحٍ وَلَيْسَ بِالإِشَارَةِ."},{"type":"p","text":"   عَلَّمَهُ زَرْعَ الْقَمْحِ وَصِنَاعَةَ الثَّوْبِ وَصُنْعَ الْعُمْلَةِ الذَّهَبِيَّةِ وَالْفِضِّيَّةِ."},{"type":"questions_heading","text":"   الأَسْئِلَةُ:"},{"type":"question","text":"   (1) لِمَاذَا أَرْسَلَ اللَّهُ الرُّسُلَ."},{"type":"question","text":"   (2) مَنْ هُوَ أَوَّلُ الرُّسُلِ."},{"type":"question","text":"   (3) هَلْ كَانَ ءَادَمُ يَعْلَمُ جَمِيعَ اللُّغَاتِ."},{"type":"question","text":"   (4) مَاذَا عَلَّمَ اللَّهُ ءَادَمَ مِنْ أُمُورِ تَدْبِيرِ الْمَعِيشَةِ."}],"paragraphCount":7},{"id":"g2-s6","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"ذُرِّيَّةُ ءَادَمَ","description":"نَزَلَ الْمَلَكُ جِبْرِيلُ عَلَيْهِ السَّلامُ [وَهُوَ أَفْضَلُ الْمَلائِكَةِ لَهُ سِتُّمِائَةِ جَنَاحٍ كُلُّ جَنَاحٍ يَسُدُّ مَا بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ] بِالْوَحْىِ عَلَى سَيِّدِنَا ءَادَمَ [لَمَّا يَنْزِلُ جِبْرِيلُ عَلَيْهِ السَّلامُ عَلَى نَبِىٍّ مِنْ أَنْبِيَاءِ اللَّهِ تَعَالَى وَيُعَلِّمُهُ الأَحْكَامَ يُسَمَّى ذَلِكَ وَحْيًا] فَصَارَ سَيِّدُنَا ءَادَمُ نَبِيًّا يَدْعُو إِلَى الإِسْلامِ، وَعَاشَ ءَادَمُ أَلْفَ سَنَةٍ ثُمَّ مَاتَ.","items":[{"type":"p","text":"نَزَلَ الْمَلَكُ جِبْرِيلُ عَلَيْهِ السَّلامُ [وَهُوَ أَفْضَلُ الْمَلائِكَةِ لَهُ سِتُّمِائَةِ جَنَاحٍ كُلُّ جَنَاحٍ يَسُدُّ مَا بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ] بِالْوَحْىِ عَلَى سَيِّدِنَا ءَادَمَ [لَمَّا يَنْزِلُ جِبْرِيلُ عَلَيْهِ السَّلامُ عَلَى نَبِىٍّ مِنْ أَنْبِيَاءِ اللَّهِ تَعَالَى وَيُعَلِّمُهُ الأَحْكَامَ يُسَمَّى ذَلِكَ وَحْيًا] فَصَارَ سَيِّدُنَا ءَادَمُ نَبِيًّا يَدْعُو إِلَى الإِسْلامِ، وَعَاشَ ءَادَمُ أَلْفَ سَنَةٍ ثُمَّ مَاتَ."},{"type":"p","text":"ثُمَّ لَمَّا مَاتَ بَقِيَتْ ذُرِّيَّتُهُ عَلَى الإِسْلامِ وَمَا كَانُوا يَعْبُدُونَ إِلَّا اللَّهَ تَعَالَى مَا كَانُوا يَعْبُدُونَ شَمْسًا وَلا قَمَرًا وَلا شَيْئًا غَيْرَ اللَّهِ تَعَالَى وَبَقُوا عَلَى ذَلِكَ أَلْفَ سَنَةٍ أُخْرَى لَمْ يَكُنْ فِيهِمْ شِرْكٌ وَلا كُفْرٌ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَيْفَ صَارَ ءَادَمُ نَبِيًّا."},{"type":"question","text":"     (2) كَمْ سَنَةً عَاشَ ءَادَمُ."},{"type":"question","text":"     (3) كَمْ سَنَةً بَقِيَتْ ذُرِّيَّةُ ءَادَمَ عَلَى الإِسْلامِ بَعْدَهُ."}],"paragraphCount":5},{"id":"g2-s7","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"سَيِّدُنَا شِيثٌ","description":"سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ عَاشَ عَلَى الإِسْلامِ وَكَذَلِكَ حَوَّاءُ عَاشَتْ عَلَى الإِسْلامِ كَانَا يَعْبُدَانِ اللَّهَ تَعَالَى وَلا يَعْبُدَانِ غَيْرَهُ وَأَوْلادُهُمْ عَاشُوا عَلَى الإِسْلامِ.","items":[{"type":"p","text":"سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ عَاشَ عَلَى الإِسْلامِ وَكَذَلِكَ حَوَّاءُ عَاشَتْ عَلَى الإِسْلامِ كَانَا يَعْبُدَانِ اللَّهَ تَعَالَى وَلا يَعْبُدَانِ غَيْرَهُ وَأَوْلادُهُمْ عَاشُوا عَلَى الإِسْلامِ."},{"type":"p","text":"وَبَعْدَمَا مَاتَ ءَادَمُ بَعَثَ اللَّهُ نَبِيًّا مِنْ أَوْلادِ ءَادَمَ اسْمُهُ شِيثٌ فَعَاشَ الْبَشَرُ عَلَى الإِسْلامِ بَعْدَ ءَادَمَ طِيلَةَ حَيَاةِ شِيثٍ."},{"type":"p","text":"وَبَعْدَ أَنْ مَاتَ شِيثٌ جَاءَ نَبِىٌّ ءَاخَرُ نَزَلَ عَلَيْهِ الْوَحْىُ يُسَمَّى إِدْرِيسَ فَعَاشَ مُدَّةً طَوِيلَةً يُعَلِّمُ النَّاسَ شَرِيعَةَ الإِسْلامِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَا هُوَ الدِّينُ الَّذِى كَانَ عَلَيْهِ ءَادَمُ وَحَوَّاءُ."},{"type":"question","text":"     (2) مَا هُوَ الدِّينُ الَّذِى كَانَتْ عَلَيْهِ ذُرِّيَّةُ ءَادَمَ فِى حَيَاةِ ءَادَمَ."},{"type":"question","text":"     (3) مَنْ هُوَ النَّبِىُّ الَّذِى بَعَثَهُ اللَّهُ بَعْدَ وَفَاةِ ءَادَمَ."},{"type":"question","text":"     (4) مَنْ هُوَ النَّبِىُّ الَّذِى جَاءَ بَعْدَ شِيثٍ."}],"paragraphCount":7},{"id":"g2-s8","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"سَيِّدُنَا إِدْرِيسُ","description":"إِدْرِيسُ عَلَيْهِ السَّلامُ هُوَ أَحَدُ الرُّسُلِ الْكِرَامِ الَّذِينَ أَخْبَرَ اللَّهُ عَنْهُمْ فِى الْقُرْءَانِ الْكَرِيـمِ قَالَ تَعَالَى ﴿وَاذْكُرْ فِى الْكِتَابِ إِدْرِيسَ إِنَّهُ كَانَ صِدِّيقًا نَّبِيًّا وَرَفَعْنَاهُ مَكَانًا عَلِيًّا﴾ [سُورَةَ مَرْيَم].","items":[{"type":"p","text":"إِدْرِيسُ عَلَيْهِ السَّلامُ هُوَ أَحَدُ الرُّسُلِ الْكِرَامِ الَّذِينَ أَخْبَرَ اللَّهُ عَنْهُمْ فِى الْقُرْءَانِ الْكَرِيـمِ قَالَ تَعَالَى ﴿وَاذْكُرْ فِى الْكِتَابِ إِدْرِيسَ إِنَّهُ كَانَ صِدِّيقًا نَّبِيًّا وَرَفَعْنَاهُ مَكَانًا عَلِيًّا﴾ [سُورَةَ مَرْيَم]."},{"type":"p","text":"وَهُوَ مِمَّنْ يَجِبُ الإِيـمَانُ بِهِمْ تَفْصِيلًا أَىْ يَجِبُ اعْتِقَادُ أَنَّهُ نَبِىٌّ وَرَسُولٌ مِنْ عِنْدِ اللَّهِ."},{"type":"p","text":"هُوَ إِدْرِيسُ بنُ يَارِدَ بنِ مَهْلايِيلَ وَيَنْتَهِى نَسَبُهُ إِلَى شِيثِ بنِ ءَادَمَ عَلَيْهِ السَّلامُ وَهُوَ مِنْ أَجْدَادِ نُوحٍ عَلَيْهِ السَّلامُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنْ هُوَ إِدْرِيسُ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (2) اذْكُرِ الآيَةَ الَّتِى تَدُلُّ عَلَى أَنَّ إِدْرِيسَ نَبِىٌّ."},{"type":"question","text":"     (3) إِلَى مَنْ يَنْتَهِى نَسَبُ إِدْرِيسَ."},{"type":"question","text":"     (4) هَلْ إِدْرِيسُ مِنْ أَجْدَادِ نُوحٍ."}],"paragraphCount":7},{"id":"g2-s9","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"سِيرَةُ إِدْرِيسَ","description":"هُوَ ثَالِثُ الأَنْبِيَاءِ بَعْدَ ءَادَمَ وَشِيثٍ عَلَيْهِمَا السَّلامُ.","items":[{"type":"p","text":"هُوَ ثَالِثُ الأَنْبِيَاءِ بَعْدَ ءَادَمَ وَشِيثٍ عَلَيْهِمَا السَّلامُ."},{"type":"p","text":"وَهُوَ أَوَّلُ مَنْ خَطَّ بِالْقَلَمِ وَأُنْزِلَ عَلَيْهِ ثَلاثُونَ صَحِيفَةً."},{"type":"p","text":"وُلِدَ بِبَابِلَ مِنْ نَوَاحِى الْعِرَاقِ وَقَدْ أَخَذَ فِى أَوَّلِ عُمُرِهِ بِعِلْمِ شِيثِ بنِ ءَادَمَ وَلَمَّا كَبِرَ ءَاتَاهُ اللَّهُ النُّبُوَّةَ."},{"type":"p","text":"وَكَانَ النَّاسُ فِى حَيَاتِهِ عَلَى الإِسْلامِ وَلَمْ يَكُنْ فِيهِمْ شِرْكٌ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنْ هُوَ ثَالِثُ الأَنْبِيَاءِ بَعْدَ ءَادَمَ."},{"type":"question","text":"     (2) مَنْ أَوَّلُ مَنْ خَطَّ بِالْقَلَمِ."},{"type":"question","text":"     (3) أَيْنَ وُلِدَ إِدْرِيسُ."},{"type":"question","text":"     (4) أَيْنَ تَقَعُ بَابِلُ."}],"paragraphCount":8},{"id":"g2-s10","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"إِدْرِيسُ فِى مِصْرَ","description":"ثُمَّ نَوَى سَيِّدُنَا إِدْرِيسُ أَنْ يَرْحَلَ مِنْ بَلَدِهِ بَابِلَ وَخَرَجَ مَعَهُ قَوْمٌ مِنَ الْمُسْلِمِينَ وَكَانَ صَعُبَ عَلَيْهِمُ الرَّحِيلُ عَنْ وَطَنِهِمْ فَقَالُوا لَهُ وَأَيْنَ نَجِدُ مِثْلَ بَابِلَ إِذَا رَحَلْنَا.","items":[{"type":"p","text":"ثُمَّ نَوَى سَيِّدُنَا إِدْرِيسُ أَنْ يَرْحَلَ مِنْ بَلَدِهِ بَابِلَ وَخَرَجَ مَعَهُ قَوْمٌ مِنَ الْمُسْلِمِينَ وَكَانَ صَعُبَ عَلَيْهِمُ الرَّحِيلُ عَنْ وَطَنِهِمْ فَقَالُوا لَهُ وَأَيْنَ نَجِدُ مِثْلَ بَابِلَ إِذَا رَحَلْنَا."},{"type":"subheading","text":"فَقَالَ إِذَا هَاجَرْنَا ابْتِغَاءَ مَرْضَاةِ اللَّهِ رَزَقَنَا."},{"type":"p","text":"فَخَرَجُوا مَعَهُ حَتَّى وَصَلُوا إِلَى أَرْضِ مِصْرَ فَرَأَوْا نَهْرَ النِّيلِ فَوَقَفَ إِدْرِيسُ عِنْدَ شَاطِئِ النِّيلِ وَذَكَرَ اللَّهَ تَعَالَى قَائِلًا سُبْحَانَ اللَّهِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) هَلْ رَحَلَ سَيِّدُنَا إِدْرِيسُ مِنْ بِلادِهِ وَمَنْ خَرَجَ مَعَهُ، مَاذَا قَالُوا لَهُ."},{"type":"question","text":"     (2) بِمَاذَا أَجَابَهُمْ إِدْرِيسُ لِتَشْجِيعِهِمْ عَلَى الذَّهَابِ مَعَهُ."},{"type":"question","text":"     (3) إِلَى أَىِّ بَلَدٍ وَصَلَ إِدْرِيسُ."},{"type":"question","text":"     (4) مَا اسْمُ النَّهْرِ الَّذِى وَقَفَ عِنْدَهُ إِدْرِيسُ."}],"paragraphCount":7},{"id":"g2-s11","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"إِقَامَةُ إِدْرِيسَ فِى الأَرْضِ","description":"أَقَامَ إِدْرِيسُ وَمَنْ مَعَهُ بِمِصْرَ يَدْعُو النَّاسَ لِلِالْتِزَامِ بِالشَّرِيعَةِ مِنْ أَحْكَامٍ فِى الدِّينِ كَالْعِبَادَاتِ وَالْمُعَامَلاتِ.","items":[{"type":"p","text":"أَقَامَ إِدْرِيسُ وَمَنْ مَعَهُ بِمِصْرَ يَدْعُو النَّاسَ لِلِالْتِزَامِ بِالشَّرِيعَةِ مِنْ أَحْكَامٍ فِى الدِّينِ كَالْعِبَادَاتِ وَالْمُعَامَلاتِ."},{"type":"p","text":"بَقِىَ سَيِّدُنَا إِدْرِيسُ عَلَيْهِ السَّلامُ مُدَّةً مِنَ الزَّمَنِ ثُمَّ مَاتَ وَكَانَ لَهُ مَنْزِلَةٌ عَالِيَةٌ عِنْدَ اللَّهِ كَمَا قَالَ تَعَالَى ﴿وَرَفَعْنَاهُ مَكَانًا عَلِيًّا﴾."},{"type":"p","text":"وَقَدْ كَانَ إِدْرِيسُ عَلَيْهِ السَّلامُ حَسَنَ الآدَابِ [وَالآدَابُ مِثْلُ ءَادَابِ النَّوْمِ أَنْ يَنَامَ عَلَى وُضُوءٍ وَيَنَامَ عَلَى يَمِينِهِ] كَثِيرَ الْمَوَاعِظِ [وَالْمَوَاعِظُ مِثْلُ كُلِّ كَلامٍ فِيهِ تَخْوِيفٌ مِنْ عَذَابِ اللَّهِ أَوْ تَرْغِيبٌ فِى الْجَنَّةِ] وَدَعَا مِثْلُ كُلِّ الأَنْبِيَاءِ لِعِبَادَةِ الْخَالِقِ وَحْدَهُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) أَيْنَ أَقَامَ إِدْرِيسُ."},{"type":"question","text":"     (2) مَاذَا كَانَ لِإِدْرِيسَ."}],"paragraphCount":5},{"id":"g2-s12","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"دَعْوَةُ إِدْرِيسَ","description":"دَعَا إِدْرِيسُ إِلَى دِينِ اللَّهِ الَّذِى هُوَ الإِسْلامُ وَإِلَى عِبَادَةِ الْخَالِقِ وَتَخْلِيصِ النُّفُوسِ مِنَ الْعَذَابِ فِى الآخِرَةِ وَذَلِكَ بِالْعَمَلِ الصَّالِحِ فِى الدُّنْيَا.","items":[{"type":"p","text":"دَعَا إِدْرِيسُ إِلَى دِينِ اللَّهِ الَّذِى هُوَ الإِسْلامُ وَإِلَى عِبَادَةِ الْخَالِقِ وَتَخْلِيصِ النُّفُوسِ مِنَ الْعَذَابِ فِى الآخِرَةِ وَذَلِكَ بِالْعَمَلِ الصَّالِحِ فِى الدُّنْيَا."},{"type":"p","text":"وَأَمَرَ النَّاسَ بِالصَّلاةِ وَالصِّيَامِ وَالزَّكَاةِ وَحَرَّمَ الْمُسْكِرَ مِنْ كُلِّ شَىْءٍ مِنَ الْمَشْرُوبَاتِ."},{"type":"p","text":"وَقِيلَ إِنَّهُ كَانَ فِى زَمَانِهِ اثْنَتَانِ وَسَبْعُونَ لُغَةً يَتَكَلَّمُ النَّاسُ بِهَا وَقَدْ عَلَّمَهُ اللَّهُ لُغَاتِهِمْ جَمِيعَهَا لِيُعَلِّمَ كُلَّ فِرْقَةٍ مِنْهُمْ بِلِسَانِهِمْ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) إِلَى أَىِّ دِينٍ دَعَا إِدْرِيسُ."},{"type":"question","text":"     (2) مَاذَا يَفْعَلُ الإِنْسَانُ لِيُخَلِّصَ نَفْسَهُ مِنَ الْعَذَابِ فِى الآخِرَةِ."},{"type":"question","text":"     (3) بِمَاذَا أَمَرَ إِدْرِيسُ النَّاسَ."},{"type":"question","text":"     (4) كَمْ لُغَةً كَانَ فِى زَمَنِ إِدْرِيسَ."}],"paragraphCount":7},{"id":"g2-s13","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"مُدُنُ إِدْرِيسَ","description":"إِدْرِيسُ عَلَيْهِ السَّلامُ أَوَّلُ مَنْ رَسَمَ لِقَوْمِهِ قَوَاعِدَ تَمْدِينِ الْمُدُنِ فَبَنَتْ كُلُّ فِرْقَةٍ مِنَ الأُمَمِ مُدُنًا فِى أَرْضِهَا.","items":[{"type":"p","text":"إِدْرِيسُ عَلَيْهِ السَّلامُ أَوَّلُ مَنْ رَسَمَ لِقَوْمِهِ قَوَاعِدَ تَمْدِينِ الْمُدُنِ فَبَنَتْ كُلُّ فِرْقَةٍ مِنَ الأُمَمِ مُدُنًا فِى أَرْضِهَا."},{"type":"subheading","text":"وَأُنْشِئَتْ فِى زَمَانِهِ ثَمَانٍ وَثَمَانُونَ مَدِينَةً."},{"type":"p","text":"وَقَدِ اشْتُهِرَ بِالْحِكْمَةِ فَمِنْ حِكَمِهِ قَوْلُهُ «الصَّبْرُ مَعَ الإِيـمَانِ يُورِثُ الظَّفَرَ» [أَىِ الْفَلاحَ وَالنَّجَاةَ. وَالصَّبْرُ عَلَى ثَلاثَةِ أَنْوَاعٍ الصَّبْرُ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ مِنَ الطَّاعَاتِ كَإِقَامَةِ الصَّلاةِ وَالصِّيَامِ فِى شَهْرِ رَمَضَانَ وَالصَّبْرُ عَمَّا حَرَّمَ اللَّهُ كَتَرْكِ الصَّلاةِ وَشُرْبِ الْخَمْرِ وَالسَّرِقَةِ وَالصَّبْرُ عَلَى الشَّدَائِدِ وَالْبَلايَا كَالأَلَمِ أَوْ أَذَى النَّاسِ أَوِ الْفَقْرِ أَوِ الْحُزْنِ]."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنْ أَوَّلُ مَنْ رَسَمَ لِقَوْمِهِ قَوَاعِدَ تَمْدِينِ الْمُدُنِ."},{"type":"question","text":"     (2) كَمْ مَدِينَةً أُنْشِئَتْ فِى زَمَنِ إِدْرِيسَ."},{"type":"question","text":"     (3) اذْكُرْ بَعْضَ حِكَمِ إِدْرِيسَ."}],"paragraphCount":6},{"id":"g2-s14","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"الرِّدَّةُ وَالْكُفْرُ (1)","description":"مَضَتْ أَلْفُ سَنَةٍ بَعْدَ وَفَاةِ ءَادَمَ ثُمَّ بَعْدَ ذَلِكَ ظَهَرَ إِبْلِيسُ لِلنَّاسِ بِصُورَةِ إِنْسَانٍ وَطَلَبَ مِنْهُمْ أَنْ يَصْنَعُوا تَمَاثِيلَ لِخَمْسَةِ رِجَالٍ صَالِحِينَ مَيِّتِينَ حَتَّى يَتَذَكَّرُوهُمْ دَائِمًا.","items":[{"type":"p","text":"مَضَتْ أَلْفُ سَنَةٍ بَعْدَ وَفَاةِ ءَادَمَ ثُمَّ بَعْدَ ذَلِكَ ظَهَرَ إِبْلِيسُ لِلنَّاسِ بِصُورَةِ إِنْسَانٍ وَطَلَبَ مِنْهُمْ أَنْ يَصْنَعُوا تَمَاثِيلَ لِخَمْسَةِ رِجَالٍ صَالِحِينَ مَيِّتِينَ حَتَّى يَتَذَكَّرُوهُمْ دَائِمًا."},{"type":"p","text":"فَعَمِلُوا لَهُمْ هَذِهِ التَّمَاثِيلَ. ثُمَّ طَالَتِ الأَيَّامُ فَظَهَرَ لَهُمْ وَطَلَبَ مِنْهُمْ أَنْ يَكْفُرُوا بِاللَّهِ وَيَعْبُدُوا هَذِهِ التَّمَاثِيلَ فَأَطَاعَهُ قِسْمٌ مِنَ الْبَشَرِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) بَعْدَ كَمْ سَنَةٍ مِنْ وَفَاةِ ءَادَمَ ظَهَرَ إِبْلِيسُ لِلنَّاسِ بِصُورَةِ إِنْسَانٍ."},{"type":"question","text":"     (2) مَاذَا طَلَبَ إِبْلِيسُ مِنَ النَّاسِ أَنْ يَصْنَعُوا."},{"type":"question","text":"     (3) كَيْفَ كَفَرَ قِسْمٌ مِنْ قَوْمِ إِدْرِيسَ."}],"paragraphCount":5},{"id":"g2-s15","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"الرِّدَّةُ وَالْكُفْرُ (2)","description":"انْتَشَرَ الْجَهْلُ بَيْنَ النَّاسِ بَعْدَ مَوْتِ إِدْرِيسَ بِمُدَّةٍ وَلَمْ يَكُنْ بَيْنَ النَّاسِ نَبِىٌّ فِى ذَلِكَ الْوَقْتِ ثُمَّ ظَهَرَ إِبْلِيسُ لِلنَّاسِ وَقَالَ لَهُمُ اعْبُدُوا هَذِهِ التَّمَاثِيلَ الْخَمْسَةَ فَعَبَدُوهَا [أَىْ عَظَّمُوهَا نِهَايَةَ التَّعْظِيمِ وَسَجَدُوا لَهَا] فَصَارُوا كَافِرِينَ.","items":[{"type":"p","text":"انْتَشَرَ الْجَهْلُ بَيْنَ النَّاسِ بَعْدَ مَوْتِ إِدْرِيسَ بِمُدَّةٍ وَلَمْ يَكُنْ بَيْنَ النَّاسِ نَبِىٌّ فِى ذَلِكَ الْوَقْتِ ثُمَّ ظَهَرَ إِبْلِيسُ لِلنَّاسِ وَقَالَ لَهُمُ اعْبُدُوا هَذِهِ التَّمَاثِيلَ الْخَمْسَةَ فَعَبَدُوهَا [أَىْ عَظَّمُوهَا نِهَايَةَ التَّعْظِيمِ وَسَجَدُوا لَهَا] فَصَارُوا كَافِرِينَ."},{"type":"p","text":"قَالَ تَعَالَى ﴿وَقَالُوا لا تَذَرُنَّ ءَالِهَتَكُمْ وَلا تَذَرُنَّ وَدًّا وَلا سُوَاعًا وَلا يَغُوثَ وَيَعُوقَ وَنَسْرًا﴾ [سُورَةَ نُوح/23]."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَا هُوَ الْكُفْرُ الَّذِى أَمَرَ إِبْلِيسُ النَّاسَ بِهِ."},{"type":"question","text":"     (2) مَا أَسْمَاءُ الرِّجَالِ الصَّالِحِينَ الْخَمْسَةِ."}],"paragraphCount":4},{"id":"g2-s16","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"سَيِّدُنَا نُوحٌ","description":"بَعْدَ انْتِشَارِ الْكُفْرِ فِى الأَرْضِ بَعَثَ اللَّهُ تَعَالَى نَبِيًّا اسْمُهُ نُوحٌ فَصَارَ يَدْعُو النَّاسَ إِلَى الإِسْلامِ وَإِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَأَنْ لا يُشْرَكَ بِهِ شَىْءٌ وَكَانَتِ الْمُدَّةُ بَيْنَ نُوحٍ وَإِدْرِيسَ أَلْفَ سَنَةٍ.","items":[{"type":"p","text":"بَعْدَ انْتِشَارِ الْكُفْرِ فِى الأَرْضِ بَعَثَ اللَّهُ تَعَالَى نَبِيًّا اسْمُهُ نُوحٌ فَصَارَ يَدْعُو النَّاسَ إِلَى الإِسْلامِ وَإِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَأَنْ لا يُشْرَكَ بِهِ شَىْءٌ وَكَانَتِ الْمُدَّةُ بَيْنَ نُوحٍ وَإِدْرِيسَ أَلْفَ سَنَةٍ."},{"type":"p","text":"صَارَ سَيِّدُنَا نُوحٌ يَتَجَوَّلُ فِى النَّاسِ وَيَقُولُ لَهُمْ أَيُّهَا النَّاسُ اعْبُدُوا اللَّهَ وَحْدَهُ وَاتْرُكُوا مَا تَعْبُدُونَهُ مِنْ دُونِ اللَّهِ اتْرُكُوا عِبَادَةَ هَؤُلاءِ الْخَمْسَةِ الَّذِينَ تَعْبُدُونَهُمْ وَاعْبُدُوا اللَّهَ وَحْدَهُ."},{"type":"p","text":"كَانَ سَيِّدُنَا نُوحٌ عَلَيْهِ السَّلامُ أَوَّلَ رَسُولٍ أُرْسِلَ إِلَى الْكُفَّارِ يَدْعُو إِلَى عِبَادَةِ اللَّهِ الْوَاحِدِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَتَى بَعَثَ اللَّهُ تَعَالَى نَبِيَّهُ نُوحًا."},{"type":"question","text":"     (2) مَا هُوَ دِينُ نُوحٍ وَسَائِرِ الأَنْبِيَاءِ عَلَيْهِمُ السَّلامُ."},{"type":"question","text":"     (3) كَمْ هِىَ الْمُدَّةُ بَيْنَ نُوحٍ وَإِدْرِيسَ."},{"type":"question","text":"     (4) مَاذَا قَالَ سَيِّدُنَا نُوحٌ لِلنَّاسِ."},{"type":"question","text":"     (5) مَنْ هُوَ أَوَّلُ نَبِىِّ أُرْسِلَ إِلَى الْكُفَّارِ."}],"paragraphCount":8},{"id":"g2-s17","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"سَفِينَةُ نُوحٍ (1)","description":"سَيِّدُنَا نُوحٌ عَلَيْهِ السَّلامُ بَقِىَ تِسْعَمِائَةٍ وَخَمْسِينَ سَنَةً يَتَنَقَّلُ بَيْنَ النَّاسِ وَيَدْعُوهُمْ إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَأَكْثَرُ النَّاسِ كَانُوا يُكَذِّبُونَهُ وَيَسْتَهْزِءُونَ بِهِ وَيُؤْذُونَهُ.","items":[{"type":"p","text":"سَيِّدُنَا نُوحٌ عَلَيْهِ السَّلامُ بَقِىَ تِسْعَمِائَةٍ وَخَمْسِينَ سَنَةً يَتَنَقَّلُ بَيْنَ النَّاسِ وَيَدْعُوهُمْ إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَأَكْثَرُ النَّاسِ كَانُوا يُكَذِّبُونَهُ وَيَسْتَهْزِءُونَ بِهِ وَيُؤْذُونَهُ."},{"type":"p","text":"ثُمَّ أَنْزَلَ اللَّهُ تَعَالَى عَلَيْهِ وَحْيًا أَنَّهُ لا يُؤْمِنُ مِنْ قَوْمِكَ إِلَّا مَنْ قَدْ ءَامَنَ وَكَانُوا حَوَالِى ثَلاثَةٍ وَثَمَانِينَ شَخْصًا فَصَارَ يَدْعُو عَلَى الْكُفَّارِ وَيَقُولُ ﴿رَّبِّ لا تَذَرْ عَلَى الأَرْضِ مِنَ الْكَافِرِينَ دَيَّارًا﴾ [سُورَةَ نُوح/26] أَىْ لا تَتْرُكْ يَا رَبِّ أَحَدًا مِنَ الْكُفَّارِ حَيًّا."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَمْ سَنَةً بَقِىَ نُوحٌ يَدْعُو إِلَى الإِسْلامِ."},{"type":"question","text":"     (2) هَلِ اتَّبَعَ نُوحًا كَثِيرٌ مِنَ النَّاسِ."},{"type":"question","text":"     (3) كَمْ عَدَدَ الَّذِينَ ءَامَنُوا بِنُوحٍ."},{"type":"question","text":"     (4) مَا مَعْنَى الآيَةِ ﴿رَّبِّ لا تَذَرْ عَلَى الأَرْضِ مِنَ الْكَافِرِينَ دَيَّارًا﴾."}],"paragraphCount":6},{"id":"g2-s18","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"سَفِينَةُ نُوحٍ (2)","description":"أَوْحَى اللَّهُ إِلَى نُوحٍ أَنْ يَصْنَعَ سَفِينَةً وَعَلَّمَهُ كَيْفَ يَصْنَعُهَا وَبَعْدَ أَنْ صَنَعَ السَّفِينَةَ دَخَلَ فِيهَا هُوَ وَأَوْلادُهُ الثَّلاثَةُ الْمُؤْمِنُونَ وَمَعَ كُلِّ وَاحِدٍ مِنْهُمْ زَوْجَتُهُ وَدَخَلَ أُنَاسٌ ءَاخَرُونَ مِنْ غَيْرِ أَقَارِبِهِ مِمَّنْ ءَامَنَ بِهِ.","items":[{"type":"p","text":"أَوْحَى اللَّهُ إِلَى نُوحٍ أَنْ يَصْنَعَ سَفِينَةً وَعَلَّمَهُ كَيْفَ يَصْنَعُهَا وَبَعْدَ أَنْ صَنَعَ السَّفِينَةَ دَخَلَ فِيهَا هُوَ وَأَوْلادُهُ الثَّلاثَةُ الْمُؤْمِنُونَ وَمَعَ كُلِّ وَاحِدٍ مِنْهُمْ زَوْجَتُهُ وَدَخَلَ أُنَاسٌ ءَاخَرُونَ مِنْ غَيْرِ أَقَارِبِهِ مِمَّنْ ءَامَنَ بِهِ."},{"type":"p","text":"وَأَدْخَلَ مِنَ الْبَهَائِمِ أُنْثَى وَذَكَرًا مِنْ كُلِّ نَوْعٍ مِنَ الْبَقَرِ وَمِنَ الْغَنَمِ وَمِنْ غَيْرِ ذَلِكَ."},{"type":"p","text":"فَأَمَرَ اللَّهُ الأَرْضَ أَنْ تُنْبِعَ مَاءَهَا وَأَمَرَ السَّمَاءَ أَنْ تُنْزِلَ مَاءَهَا فَالْتَقَى مَاءُ السَّمَاءِ وَمَاءُ الأَرْضِ وَغَطَّى الْمَاءُ الأَرْضَ وَنَجَتِ السَّفِينَةُ وَمَنْ فِيهَا."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا أَوْحَى اللَّهُ إِلَى نُوحٍ أَنْ يَصْنَعَ."},{"type":"question","text":"     (2) مَنْ دَخَلَ إِلَى سَفِينَةِ نُوحٍ."},{"type":"question","text":"     (3) بِمَاذَا أَمَرَ اللَّهُ الأَرْضَ وَالسَّمَاءَ."},{"type":"question","text":"     (4) هَلْ غَطَّى الْمَاءُ كُلَّ الأَرْضِ."},{"type":"question","text":"     (5) مَنْ نَجَا مِنَ الطُّوفَانِ."}],"paragraphCount":8},{"id":"g2-s19","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"جَبَلُ الْجُودِىِّ","description":"أَغْرَقَ اللَّهُ تَعَالَى الْبَشَرَ كُلَّهُمُ الَّذِينَ كَذَّبُوا نَبِىَّ اللَّهِ نُوحًا وَظَلُّوا عَلَى عِبَادَةِ الأَوْثَانِ.","items":[{"type":"p","text":"أَغْرَقَ اللَّهُ تَعَالَى الْبَشَرَ كُلَّهُمُ الَّذِينَ كَذَّبُوا نَبِىَّ اللَّهِ نُوحًا وَظَلُّوا عَلَى عِبَادَةِ الأَوْثَانِ."},{"type":"p","text":"ثُمَّ بَلَعَتِ الأَرْضُ مَاءَهَا وَالسَّمَاءُ أَمْسَكَتْ عَنِ الْمَطَرِ فَنَشَفَتِ الأَرْضُ بَعْدَ مُدَّةٍ مِثْلَمَا كَانَتْ قَبْلَ الطُّوفَانِ."},{"type":"p","text":"اسْتَقَرَّتِ السَّفِينَةُ عَلَى جَبَلٍ بِالْعِرَاقِ اسْمُهُ الْجُودِىُّ وَنَزَلَ مِنْهَا نُوحٌ وَمَنْ مَعَهُ إِلَى وَجْهِ الأَرْضِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) بِمَاذَا أَهْلَكَ اللَّهُ مَنْ كَذَّبَ النَّبِىَّ نُوحًا."},{"type":"question","text":"     (2) أَيْنَ اسْتَقَرَّتْ سَفِينَةُ نُوحٍ."}],"paragraphCount":5},{"id":"g2-s20","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"ذُرِّيَّةُ أَوْلادِ نُوحٍ","description":"اسْتَقَرَّتْ سَفِينَةُ نُوحٍ عَلَى الْجُودِىِّ وَنَزَلَ نُوحٌ وَالَّذِينَ ءَامَنُوا مَعَهُ مِنْ جَدِيدٍ إِلَى الْيَابِسَةِ.","items":[{"type":"p","text":"اسْتَقَرَّتْ سَفِينَةُ نُوحٍ عَلَى الْجُودِىِّ وَنَزَلَ نُوحٌ وَالَّذِينَ ءَامَنُوا مَعَهُ مِنْ جَدِيدٍ إِلَى الْيَابِسَةِ."},{"type":"p","text":"وَلَكِنَّ هَؤُلاءِ الَّذِينَ نَزَلُوا مِنَ السَّفِينَةِ لَمْ يَتَوَالَدُوا إِلَّا أَوْلادُ نُوحٍ الثَّلاثَةُ سَامٌ وَحَامٌ وَيَافِثُ هَؤُلاءِ جَاءَتْهُمْ ذُرِّيَّةٌ وَمِنْهُمُ انْتَشَرَ الْبَشَرُ كُلُّهُمْ مِنْ عَرَبٍ وَعَجَمٍ وَهُنُودٍ وَزُنُوجٍ وَغَيْرِهِمْ، كُلُّهُمْ مِنْ ذُرِّيَّةِ أَوْلادِ نُوحٍ الْمُؤْمِنِينَ الثَّلاثَةِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) أَيْنَ اسْتَقَرَّتْ سَفِينَةُ نُوحٍ."},{"type":"question","text":"     (2) مَنْ هُمْ أَوْلادُ نُوحٍ الثَّلاثَةُ الْمُؤْمِنُونَ."},{"type":"question","text":"     (3) مِنْ ذُرِّيَّةِ مَنِ انْتَشَرَ الْبَشَرُ كُلُّهُمْ."}],"paragraphCount":5},{"id":"g2-s21","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"سَيِّدُنَا هُودٌ","description":"وَبَعْدَ أَنْ طَالَ الزَّمَنُ صَارَ بَعْضُ النَّاسِ يُشْرِكُونَ بِاللَّهِ وَيَعْبُدُونَ غَيْرَ اللَّهِ فَبَعَثَ اللَّهُ نَبِيًّا مِنَ الْعَرَبِ كَانَ بِالْيَمَنِ اسْمُهُ هُودٌ وَهُوَ أَوَّلُ نَبِىٍّ عَرَبِىٍّ.","items":[{"type":"p","text":"وَبَعْدَ أَنْ طَالَ الزَّمَنُ صَارَ بَعْضُ النَّاسِ يُشْرِكُونَ بِاللَّهِ وَيَعْبُدُونَ غَيْرَ اللَّهِ فَبَعَثَ اللَّهُ نَبِيًّا مِنَ الْعَرَبِ كَانَ بِالْيَمَنِ اسْمُهُ هُودٌ وَهُوَ أَوَّلُ نَبِىٍّ عَرَبِىٍّ."},{"type":"p","text":"فَقَامَ نَبِىُّ اللَّهِ هُودٌ يَدْعُو النَّاسَ وَيَقُولُ أَيُّهَا النَّاسُ اعْبُدُوا اللَّهَ وَحْدَهُ وَاتْرُكُوا مَا تَعْبُدُونَهُ مِنْ دُونِ اللَّهِ فَآمَنَ بِهِ قِسْمٌ وَكَذَّبَهُ الآخَرُونَ.   "},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنْ هُوَ أَوَّلُ نَبِىٍّ عَرَبِىٍّ وَمِنْ أَىِّ بَلَدٍ هُوَ."},{"type":"question","text":"     (2) مَاذَا كَانَ يَقُولُ هُودٌ عَلَيْهِ السَّلامُ لِلنَّاسِ."},{"type":"question","text":"     (3) هَلْ ءَامَنَ قَوْمُ هُودٍ كُلُّهُمْ بِهِ."}],"paragraphCount":5},{"id":"g2-s22","grade":2,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّانِى","title":"قِصَّةُ قَوْمِ هُودٍ","description":"ءَامَنَ بِسَيِّدِنَا هُودٍ عَلَيْهِ السَّلامُ بَعْضُ النَّاسِ وَكَذَّبَهُ الآخَرُونَ فَأَهْلَكَهُمُ اللَّهُ تَعَالَى بِالرِّيحِ.","items":[{"type":"p","text":"ءَامَنَ بِسَيِّدِنَا هُودٍ عَلَيْهِ السَّلامُ بَعْضُ النَّاسِ وَكَذَّبَهُ الآخَرُونَ فَأَهْلَكَهُمُ اللَّهُ تَعَالَى بِالرِّيحِ."},{"type":"p","text":"سَلَّطَ اللَّهُ تَعَالَى عَلَيْهِمْ رِيحًا قَوِيَّةً اسْتَمَرَّتْ سَبْعَ لَيَالٍ وَثَمَانِيَةَ أَيَّامٍ فَصَارَتْ تُطَيِّرُهُمْ فِى الْهَوَاءِ ثُمَّ تَرُّدُهُمْ إِلَى الأَرْضِ وَقَدِ انْفَصَلَ الرَّأْسُ عَنِ الْجَسَدِ فَمَاتُوا كُلُّهُمْ إِلَّا الْمُؤْمِنِينَ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) هَلْ ءَامَنَ كُلُّ النَّاسِ بِهُودٍ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (2) بِمَاذَا أَهْلَكَ اللَّهُ مَنْ كَذَّبَ هُودًا."},{"type":"question","text":"     (3) كَيْفَ هَلَكَ الَّذِينَ كَذَّبُوا نَبِىَّ اللَّهِ هُودًا."},{"type":"question","text":"     (4) كَمِ اسْتَمَرَّ عَذَابُ قَوْمِ هُودٍ."}],"paragraphCount":6}]},{"grade":3,"title":"قَصَصٌ مِنَ الْمَاضِى","subtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","sections":[{"id":"g3-s1","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"سَيِّدُنَا هُودٌ عَلَيْهِ السَّلامُ","description":"سَيِّدُنَا هُودٌ عَلَيْهِ السَّلامُ هُوَ أَوَّلُ نَبِىٍّ عَرَبِىٍّ وَاسْمُ قَبِيلَتِهِ عَادٌ. دَعَا النَّاسَ إِلَى الإِسْلامِ وَإِلَى عِبَادَةِ اللَّهِ وَأَنْ يَتْرُكُوا عِبَادَةَ الأَوْثَانِ فَآمَنَ بِهِ بَعْضُهُمْ وَكَذَّبَهُ الآخَرُونَ فَأَهْلَكَهُمُ اللَّهُ تَعَالَى بِالرِّيحِ صَارَتِ الرِّيحُ تَأْخُذُهُمْ وَتُطَيِّرُهُمْ فِى الْهَوَاءِ ثُمَّ تَرُدُّهُمْ إِلَى الأَرْضِ وَقَدِ انْفَصَلَ الرَّأْسُ عَنِ الْجَسَدِ مَاتُوا كُلُّهُمْ إِلَّا الْمُؤْمِنِينَ.","items":[{"type":"p","text":"سَيِّدُنَا هُودٌ عَلَيْهِ السَّلامُ هُوَ أَوَّلُ نَبِىٍّ عَرَبِىٍّ وَاسْمُ قَبِيلَتِهِ عَادٌ. دَعَا النَّاسَ إِلَى الإِسْلامِ وَإِلَى عِبَادَةِ اللَّهِ وَأَنْ يَتْرُكُوا عِبَادَةَ الأَوْثَانِ فَآمَنَ بِهِ بَعْضُهُمْ وَكَذَّبَهُ الآخَرُونَ فَأَهْلَكَهُمُ اللَّهُ تَعَالَى بِالرِّيحِ صَارَتِ الرِّيحُ تَأْخُذُهُمْ وَتُطَيِّرُهُمْ فِى الْهَوَاءِ ثُمَّ تَرُدُّهُمْ إِلَى الأَرْضِ وَقَدِ انْفَصَلَ الرَّأْسُ عَنِ الْجَسَدِ مَاتُوا كُلُّهُمْ إِلَّا الْمُؤْمِنِينَ."},{"type":"p","text":"عَاشَ هَؤُلاءِ الْمُؤْمِنُونَ زَمَانًا طَوِيلًا ثُمَّ ظَهَرَ فِيهِمُ الْكُفْرُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنْ هُوَ أَوَّلُ نَبِىٍّ عَرَبِىٍّ وَمَا اسْمُ قَبِيلَتِهِ."},{"type":"question","text":"     (2) بِمَ أَهْلَكَ اللَّهُ مَنْ كَذَّبَ هُودًا عَلَيْهِ السَّلامُ."}],"paragraphCount":4},{"id":"g3-s2","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"سَيِّدُنَا صَالِحٌ عَلَيْهِ السَّلامُ","description":"أَرْسَلَ اللَّهُ لِقَبِيلَةِ ثَمُودَ رَسُولًا اسْمُهُ صَالِحٌ يَدْعُوهُمْ إِلَى عِبَادَةِ اللَّهِ وَيُبَشِّرُهُمْ وَيُنْذِرُهُمْ فَآمَنَ بِهِ بَعْضُهُمْ وَكَذَّبَهُ الآخَرُونَ فَأَهْلَكَهُمُ اللَّهُ تَعَالَى بِنَوْعٍ مِنَ الْعَذَابِ صَاحَ بِهِمْ جِبْرِيلُ صَيْحَةً وَاحِدَةً فَتَقَطَّعَتْ قُلُوبُهُمْ فِى صُدُورِهِمْ فَأَبَادَهُمُ اللَّهُ وَأَبْقَى الْمُؤْمِنِينَ مِنْهُمْ.","items":[{"type":"p","text":"أَرْسَلَ اللَّهُ لِقَبِيلَةِ ثَمُودَ رَسُولًا اسْمُهُ صَالِحٌ يَدْعُوهُمْ إِلَى عِبَادَةِ اللَّهِ وَيُبَشِّرُهُمْ وَيُنْذِرُهُمْ فَآمَنَ بِهِ بَعْضُهُمْ وَكَذَّبَهُ الآخَرُونَ فَأَهْلَكَهُمُ اللَّهُ تَعَالَى بِنَوْعٍ مِنَ الْعَذَابِ صَاحَ بِهِمْ جِبْرِيلُ صَيْحَةً وَاحِدَةً فَتَقَطَّعَتْ قُلُوبُهُمْ فِى صُدُورِهِمْ فَأَبَادَهُمُ اللَّهُ وَأَبْقَى الْمُؤْمِنِينَ مِنْهُمْ."},{"type":"p","text":"وَقَوْمُ صَالِحٍ مِنَ الْعَرَبِ كَانَتْ بِلادُهُمْ مَا بَيْنَ الْحِجَازِ وَالأُرْدُنِّ."},{"type":"questions_heading","text":"   الأَسْئِلَةُ"},{"type":"question","text":"   (1) مَا اسْمُ قَبِيلَةِ نَبِىِّ اللَّهِ صَالِحٍ وَبِمَاذَا أُهْلِكُوا."},{"type":"question","text":"   (2) أَيْنَ تُوجَدُ بِلادُ قَوْمِ صَالِحٍ عَلَيْهِ السَّلامُ."}],"paragraphCount":4},{"id":"g3-s3","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"نَاقَةُ نَبِىِّ اللَّهِ صَالِحٍ","description":"طَلَبَ قَوْمُ سَيِّدِنَا صَالِحٍ مِنْهُ مُعْجِزَةً قَالُوا نُرِيدُ بُرْهَانًا عَلَى صِدْقِكَ فَأَخْرِجْ لَنَا مِنْ هَذِهِ الصَّخْرَةِ نَاقَةً وَمَعَهَا وَلَدُهَا فَأَخْرَجَ لَهُمْ بِقُدْرَةِ اللَّهِ مِنَ الصَّخْرَةِ نَاقَةً وَوَلَدَهَا وَالنَّاقَةُ هِىَ أُنْثَى الإِبِلِ، وَكَانَتِ الصَّخْرَةُ صَمَّاءَ غَيْرَ مَفْتُوحَةٍ فَعَجَزَ قَوْمُهُ عَنْ مُعَارَضَتِهِ وَاسْتَسْلَمُوا لَهُ وَابْتَلاهُمُ اللَّهُ تَعَالَى بِأَنْ جَعَلَ لِهَذِهِ النَّاقَةِ يَوْمًا تَرِدُ الْمَاءَ فِيهِ وَتَرِدُ مَوَاشِيهِمْ فِى الْيَوْمِ الآخَرِ وَأَمَرَهُمْ أَنْ لا يَتَعَرَّضُوا لِهَذِهِ النَّاقَةِ فَاسْتَصْعَبُوا هَذَا الأَمْرَ فَتَآمَرَ تِسْعَةُ أَشْخَاصٍ عَلَى أَنْ يَقْتُلُوا هَذِهِ النَّاقَةَ فَقَتَلُوهَا قَالَ تَعَالَى ﴿وَكَانَ فِى الْمَدِينَةِ تِسْعَةُ رَهْطٍ يُفْسِدُونَ فِى الأَرْضِ﴾ [سُورَةَ النَّمْل/48] هَؤُلاءِ كَانُوا مِنْ قَوْمِ نَبِىِّ اللَّهِ صَالِحٍ.","items":[{"type":"p","text":"طَلَبَ قَوْمُ سَيِّدِنَا صَالِحٍ مِنْهُ مُعْجِزَةً قَالُوا نُرِيدُ بُرْهَانًا عَلَى صِدْقِكَ فَأَخْرِجْ لَنَا مِنْ هَذِهِ الصَّخْرَةِ نَاقَةً وَمَعَهَا وَلَدُهَا فَأَخْرَجَ لَهُمْ بِقُدْرَةِ اللَّهِ مِنَ الصَّخْرَةِ نَاقَةً وَوَلَدَهَا وَالنَّاقَةُ هِىَ أُنْثَى الإِبِلِ، وَكَانَتِ الصَّخْرَةُ صَمَّاءَ غَيْرَ مَفْتُوحَةٍ فَعَجَزَ قَوْمُهُ عَنْ مُعَارَضَتِهِ وَاسْتَسْلَمُوا لَهُ وَابْتَلاهُمُ اللَّهُ تَعَالَى بِأَنْ جَعَلَ لِهَذِهِ النَّاقَةِ يَوْمًا تَرِدُ الْمَاءَ فِيهِ وَتَرِدُ مَوَاشِيهِمْ فِى الْيَوْمِ الآخَرِ وَأَمَرَهُمْ أَنْ لا يَتَعَرَّضُوا لِهَذِهِ النَّاقَةِ فَاسْتَصْعَبُوا هَذَا الأَمْرَ فَتَآمَرَ تِسْعَةُ أَشْخَاصٍ عَلَى أَنْ يَقْتُلُوا هَذِهِ النَّاقَةَ فَقَتَلُوهَا قَالَ تَعَالَى ﴿وَكَانَ فِى الْمَدِينَةِ تِسْعَةُ رَهْطٍ يُفْسِدُونَ فِى الأَرْضِ﴾ [سُورَةَ النَّمْل/48] هَؤُلاءِ كَانُوا مِنْ قَوْمِ نَبِىِّ اللَّهِ صَالِحٍ."},{"type":"p","text":"عِنْدَ ذَلِكَ أَنْذَرَهُمْ صَالِحٌ عَلَيْهِ السَّلامُ بِالْعَذَابِ وَبَعْدَ ثَلاثَةِ أَيَّامٍ نَزَلَ بِهِمُ الْعَذَابُ فَأَهْلَكَهُمُ اللَّهُ بِصَيْحَةٍ صَاحَهَا جِبْرِيلُ عَلَيْهِ السَّلامُ، وَمَدِينَةُ صَالِحٍ كَانَتْ بَيْنَ تَبُوكَ وَالْمَدِينَةِ الْمُنَوَّرَةِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) اذْكُرْ إِحْدَى مُعْجِزَاتِ نَبِيِّ اللَّهِ صَالِحٍ عَلَيْهِ السَّلامُ؟"},{"type":"question","text":"     (2) مَاذَا فَعَلَ قَوْمُ صَالِحٍ بِالنَّاقَةِ."},{"type":"question","text":"     (3) مَا هُوَ الْبَلاءُ الَّذِى ابْتَلاهُمُ اللَّهُ بِهِ."},{"type":"question","text":"     (4) أَيْنَ كَانَتْ تَقَعُ مَدِينَةُ صَالِحٍ عَلَيْهِ السَّلامُ."}],"paragraphCount":6},{"id":"g3-s4","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"إِبْرَاهِيمُ عَلَيْهِ السَّلامُ","description":"سَيِّدُنَا إِبْرَاهِيمُ عَلَيْهِ السَّلامُ هُوَ نَبِىٌّ رَسُولٌ أَرْسَلَهُ اللَّهُ لِيَدْعُوَ إِلَى عِبَادَةِ اللَّهِ وَعَدَمِ الإِشْرَاكِ بِهِ، ءَامَنَتْ بِهِ زَوْجَتُهُ سَارَةُ  عَلَيْهَا السَّلامُ وَهُوَ عَمُّ نَبِىِّ اللَّهِ لُوطٍ.","items":[{"type":"p","text":"سَيِّدُنَا إِبْرَاهِيمُ عَلَيْهِ السَّلامُ هُوَ نَبِىٌّ رَسُولٌ أَرْسَلَهُ اللَّهُ لِيَدْعُوَ إِلَى عِبَادَةِ اللَّهِ وَعَدَمِ الإِشْرَاكِ بِهِ، ءَامَنَتْ بِهِ زَوْجَتُهُ سَارَةُ  عَلَيْهَا السَّلامُ وَهُوَ عَمُّ نَبِىِّ اللَّهِ لُوطٍ."},{"type":"p","text":"قَوْمُ سَيِّدِنَا إِبْرَاهِيمَ عَلَيْهِ السَّلامُ كَانُوا عَلَى عِبَادَةِ الْكَوَاكِبِ وَالشَّمْسِ وَالْقَمَرِ وَهُوَ عَلَيْهِ السَّلامُ نَبَذَ دِينَهُمْ كَانَ لَهُمْ أَصْنَامٌ بِشَكْلِ الشَّمْسِ وَأَصْنَامٌ بِشَكْلِ الْقَمَرِ وَأَصْنَامٌ بِشَكْلِ الْكَوَاكِبِ فَكَسَرَ لَهُمْ هَذِهِ الأَصْنَامَ فَاشْتَدَّتْ عَدَاوَتُهُمْ لَهُ. فَأَرَادُوا أَنْ يُحْرِقُوهُ بِالنَّارِ فَجَمَعُوا لَهُ الْحَطَبَ مُدَّةً مِنَ الزَّمَنِ ثُمَّ أَضْرَمُوا النَّارَ فِى هَذَا الْحَطَبِ فَبَلَغَتْ قُوَّةُ هَذِهِ النَّارِ أَنَّهُمْ لَمْ يَسْتَطِيعُوا أَنْ يُمْسِكُوهُ بِأَيْدِيهِمْ وَيَرْمُوهُ فِيهَا بَلْ عَمِلُوا مِنْجَنِيقًا وَوَضَعُوهُ عَلَيْهِ فَرَمَوْهُ بِوَاسِطَتِهِ حَتَّى وَقَعَ فِى دَاخِلِ تِلْكَ النَّارِ الْعَظِيمَةِ فَلَمْ يَحْتَرِقْ لا هُوَ وَلا ثِيَابُهُ."},{"type":"p","text":"وَمَعَ أَنَّ قَوْمَهُ رَأَوْا هَذِهِ الْمُعْجِزَةَ لَكِنَّهُمْ لَمْ يُسْلِمُوا لِأَنَّ الْمُعْجِزَاتِ لا يَهْتَدِى بِهَا إِلَّا مَنْ هَدَى اللَّهُ قَلْبَهُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) إِلَى مَاذَا دَعَا إِبْرَاهِيمُ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (2) مَا صِلَةُ الْقُرْبَى بَيْنَ إِبْرَاهِيمَ وَلُوطٍ."},{"type":"question","text":"     (3) مَا اسْمُ زَوْجَةِ إِبْرَاهِيمَ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (4) مَاذَا كَانَ يَعْبُدُ قَوْمُ إِبْرَاهِيمَ."},{"type":"question","text":"     (5) لِمَاذَا أَرَادَ قَوْمُ إِبْرَاهِيمَ إِحْرَاقَهُ."},{"type":"question","text":"     (6) مَا هِىَ مُعْجِزَةُ إِبْرَاهِيمَ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (7) هَلْ ءَامَنَ قَوْمُ إِبْرَاهِيمَ لَمَّا رَأَوُا الْمُعْجِزَةَ."},{"type":"subheading","text":"   قِصَّةٌ."},{"type":"p","text":"   يُرْوَى أَنَّهُ لَمَّا قَالَ إِبْرَاهِيمُ عَلَيْهِ السَّلامُ لِنُمْرُودَ وَهُوَ رَجُلٌ كَافِرٌ فَإِنَّ اللَّهَ يَأْتِى بِالشَّمْسِ مِنَ الْمَشْرِقِ فَأْتِ بِهَا مِنَ الْمَغْرِبِ فَبُهِتَ نُمْرُودُ وَحَبَسَهُ سَبْعَ سِنِينَ وَجَوَّعَ لَهُ أَسَدَيْنِ وَأَرْسَلَهُمَا عَلَيْهِ فَكَانَا يَلْحَسَانِهِ وَيَسْجُدَانِ لَهُ ثُمَّ أَوْقَدَ نَارًا وَرَمَاهُ فَسَلِمَ فَكَفَّ نُمْرُودُ عَنْهُ فَخَرَجَ مُهَاجِرًا إِلَى الشَّامِ فَتَزَوَّجَ سَارَةَ وَهِىَ بِنْتُ مَلِكِ حَرَّانَ وَكَانَتْ قَدْ خَالَفَتْ دِينَ قَوْمِهَا وَأَمَّا نُمْرُودُ فَبَعَثَ اللَّهُ عَلَيْهِ بَعُوضَةً فَدَخَلَتْ فِى مِنْخَرِهِ فَمَكَثَ أَرْبَعَمِائَةِ عَامٍ يُضْرَبُ رَأْسُهُ بِالْمَطَارِقِ وَأَرْحَمُ النَّاسِ بِهِ مَنْ يَجْمَعُ يَدَيْهِ ثُمَّ يَضْرِبُ بِهِمَا رَأْسَهُ فَعُذِّبَ بِذَلِكَ حَتَّى مَاتَ."}],"paragraphCount":12},{"id":"g3-s5","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"إِبْرَاهِيمُ عَلَيْهِ السَّلامُ (2)","description":"بَعْدَ أَنْ كَذَّبَهُ قَوْمُهُ هَاجَرَ سَيِّدُنَا إِبْرَاهِيمُ نَبِىُّ اللَّهِ عَلَيْهِ السَّلامُ وَالْهِجْرَةُ فِيهَا مَشَقَّةٌ، تَرَكَ بِلادَهُ الَّتِى كَانَتْ تَحْتَ حُكْمِ جَبَّارٍ اسْمُهُ نُمْرُودُ وَجَاءَ إِلَى بَرِّ الشَّامِ فَسَكَنَ فِلَسْطِينَ وَاسْتَقَرَّ فِيهَا ثُمَّ أَمَرَهُ اللَّهُ بِأَنْ يَتَوَجَّهَ إِلَى مَكَّةَ فَصَارَ يَتَرَدَّدُ إِلَيْهَا.","items":[{"type":"p","text":"بَعْدَ أَنْ كَذَّبَهُ قَوْمُهُ هَاجَرَ سَيِّدُنَا إِبْرَاهِيمُ نَبِىُّ اللَّهِ عَلَيْهِ السَّلامُ وَالْهِجْرَةُ فِيهَا مَشَقَّةٌ، تَرَكَ بِلادَهُ الَّتِى كَانَتْ تَحْتَ حُكْمِ جَبَّارٍ اسْمُهُ نُمْرُودُ وَجَاءَ إِلَى بَرِّ الشَّامِ فَسَكَنَ فِلَسْطِينَ وَاسْتَقَرَّ فِيهَا ثُمَّ أَمَرَهُ اللَّهُ بِأَنْ يَتَوَجَّهَ إِلَى مَكَّةَ فَصَارَ يَتَرَدَّدُ إِلَيْهَا."},{"type":"p","text":"وَبَعْدَ أَنْ كَبِرَ ابْنُهُ إِسْمَاعِيلُ بَنَى مَعَهُ الْكَعْبَةَ لِأَنَّ الْكَعْبَةَ كَانَ قَدْ هَدَمَهَا طُوفَانُ نُوحٍ فَأَعَادَ إِبْرَاهِيمُ وَإِسْمَاعِيلُ بِنَاءَهَا وَأَعَانَهُمَا اللَّهُ تَعَالَى فَكَانَ إِسْمَاعِيلُ يُنَاوِلُ أَبَاهُ الأَحْجَارَ وَكُلَّمَا أَنْهَيَا صَفًّا مِنْهَا ارْتَفَعَ مَقَامُ إِبْرَاهِيمَ بِهِ حَتَّى يَبْنِىَ الَّذِى فَوْقَهُ وَهَكَذَا حَتَّى تَمَّتْ عِمَارَتُهَا [وَمَقَامُ إِبْرَاهِيمَ حَجَرٌ كَانَ يَسْتَعِينُ بِهِ إِبْرَاهِيمُ لِبِنَاءِ الْكَعْبَةِ]. "},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) لِمَاذَا هَاجَرَ إِبْرَاهِيمُ مِنْ بَلَدِهِ."},{"type":"question","text":"     (2) مَنْ كَانَ يَحْكُمُ بَلَدَ إِبْرَاهِيمَ."},{"type":"question","text":"     (3) إِلَى أَىِّ بَلَدٍ هَاجَرَ إِبْرَاهِيمُ."},{"type":"question","text":"     (4) مَنْ أَعَادَ بِنَاءَ الْكَعْبَةِ."},{"type":"question","text":"     (5) مَا هُوَ مَقَامُ إِبْرَاهِيمَ."}],"paragraphCount":7},{"id":"g3-s6","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"إِسْمَاعِيلُ عَلَيْهِ السَّلامُ","description":"كَانَتْ سَارَةُ زَوْجَةُ إِبْرَاهِيمَ عَلَيْهِ السَّلامُ لا تَلِدُ وَكَانَتْ لَهَا أَمَةٌ تُسَمَّى هَاجَرَ فَأَعْطَتْهَا لِسَيِّدِنَا إِبْرَاهِيمَ عَلَيْهِ السَّلامُ فَصَارَتْ حَلالًا لَهُ فِى شَرِيعَةِ اللَّهِ مِثْلَ الزَّوْجَةِ.","items":[{"type":"p","text":"كَانَتْ سَارَةُ زَوْجَةُ إِبْرَاهِيمَ عَلَيْهِ السَّلامُ لا تَلِدُ وَكَانَتْ لَهَا أَمَةٌ تُسَمَّى هَاجَرَ فَأَعْطَتْهَا لِسَيِّدِنَا إِبْرَاهِيمَ عَلَيْهِ السَّلامُ فَصَارَتْ حَلالًا لَهُ فِى شَرِيعَةِ اللَّهِ مِثْلَ الزَّوْجَةِ."},{"type":"p","text":"وَلَدَتْ لَهُ وَلَدًا سَمَّاهُ إِسْمَاعِيلَ فَأَخَذَهُمَا إِلَى مَكَّةَ الْمُكَرَّمَةِ فَتَرَكَهُمَا هُنَاكَ بِأَمْرِ اللَّهِ وَلَمْ يَكُنْ مَعَهُمَا إِلَّا جَرَابٌ مِنْ مَاءٍ وَءَاخَرُ مِنْ تَمْرٍ."},{"type":"p","text":"وَجَاءَتْ قَبِيلَةُ جُرْهُم إِلَيْهَا وَطَلَبُوا أَنْ تَأْذَنَ لَهُمْ بِالنُّزُولِ عِنْدَهَا فَأَذِنَتْ وَقَدْ شَبَّ إِسْمَاعِيلُ عَلَى الْخُلُقِ الْحَسَنِ وَتَعَلَّمَ مِنْهُمُ الْعَرَبِيَّةَ ثُمَّ تَزَوَّجَ مِنِ امْرَأَةٍ مِنْهُمْ."},{"type":"p","text":"ثُمَّ رَجَعَ إِبْرَاهِيمُ عَلَيْهِ السَّلامُ إِلَى فِلَسْطِينَ فَعَاشَ فِيهَا وَكَانَ كُلَّ مُدَّةٍ يَذْهَبُ إِلَى مَكَّةَ فَيَزُورُ هَاجَرَ وَإِسْمَاعِيلَ وَيَطَّلِعُ عَلَى أَحْوَالِهِمَا."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) هَلْ كَانَتْ سَارَةُ تَلِدُ."},{"type":"question","text":"     (2) مَا اسْمُ أَمَةِ سَارَةَ."},{"type":"question","text":"     (3) أَيْنَ سَكَنَ إِسْمَاعِيلُ وَأُمُّهُ هَاجَرُ."},{"type":"question","text":"     (4) مَا اسْمُ الْقَبِيلَةِ الَّتِى نَزَلَتْ عِنْدَ أُمِّ إِسْمَاعِيلَ."}],"paragraphCount":8},{"id":"g3-s7","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"مَاءُ زَمْزَمَ","description":"بَعْدَمَا وَلَدَتْ هَاجَرُ إِسْمَاعِيلَ أَخَذَهُمَا إِبْرَاهِيمُ عَلَيْهِ السَّلامُ إِلَى مَكَّةَ وَلَمْ يَكُنْ فِيهَا سُكَّانٌ. ","items":[{"type":"p","text":"بَعْدَمَا وَلَدَتْ هَاجَرُ إِسْمَاعِيلَ أَخَذَهُمَا إِبْرَاهِيمُ عَلَيْهِ السَّلامُ إِلَى مَكَّةَ وَلَمْ يَكُنْ فِيهَا سُكَّانٌ. "},{"type":"p","text":"أَوْحَى اللَّهُ إِلَيْهِ أَنْ يَتْرُكَهُمَا هُنَاكَ فَنَفَّذَ أَمْرَ اللَّهِ وَتَرَكَ مَعَهُمَا وِعَاءً فِيهِ الْمَاءُ وَرَحَلَ."},{"type":"p","text":"وَعِنْدَمَا فَرَغَ الْوِعَاءُ مِنَ الْمَاءِ صَارَ إِسْمَاعِيلُ يَبْكِى فَصَارَتْ سَيِّدَتُنَا هَاجَرُ تَبْحَثُ لَهُ عَنْ شَرَابٍ فَتَصْعَدُ إِلَى مَكَانٍ يُسَمَّى الصَّفَا ثُمَّ تَنْزِلُ وَتَصْعَدُ إِلَى مَكَانٍ يُسَمَّى الْمَرْوَةَ حَتَّى فَعَلَتْ ذَلِكَ سَبْعَ مَرَّاتٍ. ثُمَّ أَغَاثَهَا اللَّهُ تَعَالَى فَأَخْرَجَ لَهَا مَاءَ زَمْزَمَ وَمَا زَالَ إِلَى الآنَ وَهُوَ مَاءٌ مُفِيدٌ جِدًّا يَسْتَشْفِى بِهِ الْمُسْلِمُونَ وَيَتَبَرَّكُونَ بِهِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) لِمَاذَا صَارَ إِسْمَاعِيلُ يَبْكِى."},{"type":"question","text":"     (2) كَمْ مَرَّةً مَشَتْ هَاجَرُ بَيْنَ الصَّفَا وَالْمَرْوَةِ."},{"type":"question","text":"     (3) مَا هُوَ مَاءُ زَمْزَم."}],"paragraphCount":6},{"id":"g3-s8","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"إِسْحَاقُ عَلَيْهِ السَّلامُ","description":"سَارَةُ زَوْجَةُ إِبْرَاهِيمَ كَانَتْ عَقِيمًا لا تَلِدُ وَبَعْدَمَا صَارَ عُمُرُهَا تِسْعِينَ سَنَةً أَعْطَاهَا اللَّهُ تَعَالَى وَلَدًا اسْمُهُ إِسْحَاقُ ثُمَّ إِسْمَاعِيلُ عَلَيْهِ السَّلامُ صَارَ نَبِيًّا وَكَذَلِكَ إِسْحَاقُ عَلَيْهِ السَّلامُ صَارَ نَبِيًّا وَكَانَ كُلٌّ مِنْهُمَا نَبِيًّا صَالِحًا يَدْعُو إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَعَدَمِ الإِشْرَاكِ بِهِ.","items":[{"type":"p","text":"سَارَةُ زَوْجَةُ إِبْرَاهِيمَ كَانَتْ عَقِيمًا لا تَلِدُ وَبَعْدَمَا صَارَ عُمُرُهَا تِسْعِينَ سَنَةً أَعْطَاهَا اللَّهُ تَعَالَى وَلَدًا اسْمُهُ إِسْحَاقُ ثُمَّ إِسْمَاعِيلُ عَلَيْهِ السَّلامُ صَارَ نَبِيًّا وَكَذَلِكَ إِسْحَاقُ عَلَيْهِ السَّلامُ صَارَ نَبِيًّا وَكَانَ كُلٌّ مِنْهُمَا نَبِيًّا صَالِحًا يَدْعُو إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَعَدَمِ الإِشْرَاكِ بِهِ."},{"type":"p","text":"وَعَاشَ إِسْحَاقُ فِى فِلَسْطِينَ وَأَمْضَى إِسْمَاعِيلُ بَقِيَّةَ عُمُرِهِ فِى أَرْضِ الْحِجَازِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَمْ كَانَ عُمُرُ سَارَةَ لَمَّا وَلَدَتْ إِسْحَاقَ."},{"type":"question","text":"     (2) أَيْنَ عَاشَ إِسْحَاقُ وَإِسْمَاعِيلُ."}],"paragraphCount":4},{"id":"g3-s9","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"قِصَّةُ الذَّبِيحِ (1)","description":"أَوْحَى اللَّهُ تَعَالَى إِلَى إِبْرَاهِيمَ أَنْ يَذْبَحَ وَلَدَهُ إِسْمَاعِيلَ ابْتِلاءً لَهُ وَإِظْهَارًا لِطَاعَتِهِ لِرَبِّهِ فَقَالَ إِبْرَاهِيمُ لِوَلَدِهِ انْطَلِقْ فَنُقَرِّبْ قُرْبَانًا إِلَى اللَّهِ عَزَّ وَجَلَّ.","items":[{"type":"p","text":"أَوْحَى اللَّهُ تَعَالَى إِلَى إِبْرَاهِيمَ أَنْ يَذْبَحَ وَلَدَهُ إِسْمَاعِيلَ ابْتِلاءً لَهُ وَإِظْهَارًا لِطَاعَتِهِ لِرَبِّهِ فَقَالَ إِبْرَاهِيمُ لِوَلَدِهِ انْطَلِقْ فَنُقَرِّبْ قُرْبَانًا إِلَى اللَّهِ عَزَّ وَجَلَّ."},{"type":"p","text":"وَأَخَذَ سِكِّينًا وَحَبْلًا ثُمَّ انْطَلَقَا حَتَّى إِذَا ذَهَبَا بَيْنَ الْجِبَالِ قَالَ لَهُ إِسْمَاعِيلُ يَا أَبَتِ أَيْنَ قُرْبَانُكَ."},{"type":"p","text":"قَالَ يَا بُنَىَّ إِنِّى رَأَيْتُ فِى الْمَنَامِ أَنِّى أَذْبَحُكَ، وَرُؤْيَا الأَنْبِيَاءِ حَقٌّ فَقَالَ لَهُ إِسْمَاعِيلُ يَا أَبَتِ افْعَلْ مَا تُؤْمَرُ سَتَجِدُنِى إِنْ شَاءَ اللَّهُ مِنَ الصَّابِرِينَ وَاشْدُدْ رِبَاطِى حَتَّى لا أَتَحَرَّكَ وَأَبْعِدْ عَنِّى ثِيَابَكَ حَتَّى لا يُرَشَّ عَلَيْكَ مِنْ دَمِى فَتَرَاهُ أُمِّى فَتَحْزَن وَأَسْرِعْ مَرَّ السِّكِّينِ عَلَى حَلْقِى لِيَكُونَ أَهْوَنَ عَلَىَّ فَإِذَا أَتَيْتَ أُمِّى فَاقْرَأْ عَلَيْهَا السَّلامَ مِنِّى."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا أَوْحَى اللَّهُ إِلَى إِبْرَاهِيمَ."},{"type":"question","text":"     (2) مَا الْحِكْمَةُ مِنْ أَمْرِ اللَّهِ إِبْرَاهِيمَ بِذَبْحِ ابْنِهِ إِسْمَاعِيلَ."},{"type":"question","text":"     (3) مَاذَا رَأَى إِبْرَاهِيمُ فِى الْمَنَامِ."},{"type":"question","text":"     (4) مَاذَا قَالَ إِسْمَاعِيلُ لِأَبِيهِ إِبْرَاهِيمَ لَمَّا أَخْبَرَهُ بِالرُّؤْيَا."}],"paragraphCount":7},{"id":"g3-s10","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"قِصَّةُ الذَّبِيحِ (2)","description":"ثُمَّ أَقْبَلَ عَلَيْهِ سَيِّدُنَا إِبْرَاهِيمُ عَلَيْهِ السَّلامُ يُقَبِّلُهُ وَيَبْكِى وَيَقُولُ نِعْمَ الْعَوْنُ أَنْتَ يَا بُنَىَّ عَلَى أَمْرِ اللَّهِ عَزَّ وَجَلَّ.","items":[{"type":"p","text":"ثُمَّ أَقْبَلَ عَلَيْهِ سَيِّدُنَا إِبْرَاهِيمُ عَلَيْهِ السَّلامُ يُقَبِّلُهُ وَيَبْكِى وَيَقُولُ نِعْمَ الْعَوْنُ أَنْتَ يَا بُنَىَّ عَلَى أَمْرِ اللَّهِ عَزَّ وَجَلَّ."},{"type":"p","text":"ثُمَّ إِنَّهُ لَمَّا أَمَرَّ السِّكِّينَ عَلَى حَلْقِهِ انْقَلَبَتْ فَنَادَاهُ الْمَلَكُ بِأَمْرِ اللَّهِ يَا إِبْرَاهِيمُ قَدْ صَدَّقْتَ الرُّؤْيَا هَذَا فِدَاءُ ابْنِكَ فَنَظَرَ إِبْرَاهِيمُ فَإِذَا جِبْرِيلُ عَلَيْهِ السَّلامُ مَعَهُ كَبْشٌ كَانَ يَرْعَى فِى الْجَنَّةِ."},{"type":"p","text":"قَالَ اللَّهُ تَعَالَى ﴿وَفَدَيْنَاهُ بِذِبْحٍ عَظِيمٍ﴾ [سُورَةَ الصَّافَّات/107] وَالذِّبْحُ بِكَسْرِ الذَّالِ اسْمُ مَا يُذْبَحُ وَمَعْنَى الآيَةِ أَنَّ اللَّهَ خَلَّصَ وَلَدَ سَيِّدِنَا إِبْرَاهِيمَ وَهُوَ إِسْمَاعِيلُ مِنَ الذَّبْحِ بِأَنْ جَعَلَ الذِّبْحَ فِدَاءً لَهُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) هَلْ ذُبِحَ إِسْمَاعِيلُ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (2) مَاذَا قَالَ الْمَلَكُ لِإِبْرَاهِيمَ."},{"type":"question","text":"     (3) مَاذَا أَحْضَرَ جِبْرِيلُ مَعَهُ لِإِبْرَاهِيمَ."},{"type":"question","text":"     (4) مَا مَعْنَى الآيَةِ ﴿وَفَدَيْنَاهُ بِذِبْحٍ عَظِيمٍ﴾."}],"paragraphCount":7},{"id":"g3-s11","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"يَعْقُوبُ عَلَيْهِ السَّلامُ","description":"تُوُفِّىَ إِبْرَاهِيمُ وَسَارَةُ فِى أَرْضِ فِلَسْطِينَ وَأَمَّا إِسْحَاقُ فَقَدْ رَزَقَهُ اللَّهُ وَلَدًا اسْمُهُ يَعْقُوبُ وَيُسَمَّى أَيْضًا إِسْرَائِيلَ وَهُوَ أَيْضًا نَبِىٌّ، وَإِسْرَائِيلُ أَيْضًا وَلَدَ وَلَدًا اسْمُهُ يُوسُفُ وَهَؤُلاءِ الأَرْبَعَةُ إِبْرَاهِيمُ ثُمَّ ابْنُهُ إِسْحَاقُ ثُمَّ ابْنُهُ يَعْقُوبُ ثُمَّ ابْنُهُ يُوسُفُ كَانُوا أَنْبِيَاءَ.","items":[{"type":"p","text":"تُوُفِّىَ إِبْرَاهِيمُ وَسَارَةُ فِى أَرْضِ فِلَسْطِينَ وَأَمَّا إِسْحَاقُ فَقَدْ رَزَقَهُ اللَّهُ وَلَدًا اسْمُهُ يَعْقُوبُ وَيُسَمَّى أَيْضًا إِسْرَائِيلَ وَهُوَ أَيْضًا نَبِىٌّ، وَإِسْرَائِيلُ أَيْضًا وَلَدَ وَلَدًا اسْمُهُ يُوسُفُ وَهَؤُلاءِ الأَرْبَعَةُ إِبْرَاهِيمُ ثُمَّ ابْنُهُ إِسْحَاقُ ثُمَّ ابْنُهُ يَعْقُوبُ ثُمَّ ابْنُهُ يُوسُفُ كَانُوا أَنْبِيَاءَ."},{"type":"p","text":"فَلا يُوجَدُ فِى الْبَشَرِ أَرْبَعَةٌ كُلُّهُمْ أَنْبِيَاءُ مُتَنَاسِلُونَ إِلَّا هَؤُلاءِ يُوسُفُ وَيَعْقُوبُ وَإِسْحَاقُ وَإِبْرَاهِيمُ وَكُلُّهُمْ دَعَوْا إِلَى الإِسْلامِ وَإِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَأَنْ لا يُشْرَكَ بِهِ شَىْءٌ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) أَيْنَ تُوُفِّىَ إِبْرَاهِيمُ وَسَارَةُ."},{"type":"question","text":"     (2) مَا الِاسْمُ الثَّانِى لِيَعْقُوبَ."},{"type":"question","text":"     (3) سَمِّ الأَنْبِيَاءَ الْمُتَنَاسِلِينَ الأَرْبَعَةَ."}],"paragraphCount":5},{"id":"g3-s12","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"يُوسُفُ عَلَيْهِ السَّلامُ (1)","description":"سَيِّدُنَا يُوسُفُ عَلَيْهِ السَّلامُ هُوَ ابْنُ نَبِىِّ اللَّهِ يَعْقُوبَ عَلَيْهِ السَّلامُ وَكَانَ شَدِيدَ الْجَمَالِ.","items":[{"type":"p","text":"سَيِّدُنَا يُوسُفُ عَلَيْهِ السَّلامُ هُوَ ابْنُ نَبِىِّ اللَّهِ يَعْقُوبَ عَلَيْهِ السَّلامُ وَكَانَ شَدِيدَ الْجَمَالِ."},{"type":"p","text":"كَانَ وَالِدُهُ يُحِبُّهُ كَثِيرًا لِحُسْنِ خُلُقِهِ فَحَسَدَهُ إِخْوَتُهُ عَلَى ذَلِكَ فَتَآمَرُوا عَلَيْهِ لِيَقْتُلُوهُ وَلَكِنَّ أَحَدَهُمْ قَالَ لَهُمْ لا نَقْتُلُهُ بَلْ نَرْمِيهِ فِى جُبٍّ فَرَمَوْهُ فِى الْبِئْرِ ثُمَّ سَلَّمَهُ اللَّهُ تَعَالَى."},{"type":"p","text":"مَرَّتْ بِهِ قَافِلَةُ مُسَافِرِينَ فَانْتَشَلُوهُ مِنَ الْبِئْرِ وَأَخَذُوهُ مَعَهُمْ إِلَى مِصْرَ وَهُنَاكَ بَاعُوهُ لِأَحَدِ الْحُكَّامِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَا اسْمُ وَالِدِ يُوسُفَ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (2) لِمَاذَا أَحَبَّ يَعْقُوبُ ابْنَهُ يُوسُفَ كَثِيرًا."},{"type":"question","text":"     (3) لِمَاذَا حُسِدَ يُوسُفُ مِنْ قِبَلِ إِخْوَتِهِ."},{"type":"question","text":"     (4) هَلْ أَرَادَ إِخْوَةُ يُوسُفَ قَتْلَهُ وَأَيْنَ رَمَوْهُ."},{"type":"question","text":"     (5) مَنِ انْتَشَلَ يُوسُفَ مِنَ الْبِئْرِ وَلِمَنْ بَاعُوهُ."}],"paragraphCount":8},{"id":"g3-s13","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"يُوسُفُ عَلَيْهِ السَّلامُ (2)","description":"ظَهَرَتْ خِصَالُ سَيِّدِنَا يُوسُفَ الْحَسَنَةُ فِى مِصْرَ فَتَوَلَّى خَزَائِنَهَا. وَبَعْدَ أَنْ مَضَى زَمَانٌ طَوِيلٌ احْتَاجَ إِخْوَتُهُ لِلذَّهَابِ إِلَى مِصْرَ فَعَرَفَهُمْ وَأَمَّا هُمْ فَلَمْ يَعْرِفُوهُ وَمَعَ ذَلِكَ سَيِّدُنَا يُوسُفُ لَمْ يَنْتَقِمْ مِنْهُمْ لَمْ يَقُلْ هَؤُلاءِ كَانُوا تَآمَرُوا عَلَىَّ لِيَقْتُلُونِى ثُمَّ اتَّفَقُوا عَلَى أَنْ يَرْمُونِى فِى الْبِئْرِ لَأَنْتَقِمَنَّ مِنْهُمْ.","items":[{"type":"p","text":"ظَهَرَتْ خِصَالُ سَيِّدِنَا يُوسُفَ الْحَسَنَةُ فِى مِصْرَ فَتَوَلَّى خَزَائِنَهَا. وَبَعْدَ أَنْ مَضَى زَمَانٌ طَوِيلٌ احْتَاجَ إِخْوَتُهُ لِلذَّهَابِ إِلَى مِصْرَ فَعَرَفَهُمْ وَأَمَّا هُمْ فَلَمْ يَعْرِفُوهُ وَمَعَ ذَلِكَ سَيِّدُنَا يُوسُفُ لَمْ يَنْتَقِمْ مِنْهُمْ لَمْ يَقُلْ هَؤُلاءِ كَانُوا تَآمَرُوا عَلَىَّ لِيَقْتُلُونِى ثُمَّ اتَّفَقُوا عَلَى أَنْ يَرْمُونِى فِى الْبِئْرِ لَأَنْتَقِمَنَّ مِنْهُمْ."},{"type":"p","text":"إِنَّمَا بَعْدَ أَنْ عَرَّفَهُمْ أَنَّهُ هُوَ أَخُوهُمْ يُوسُفُ الَّذِى فَعَلُوا بِهِ تِلْكَ الأَفَاعِيلَ الْقَبِيحَةَ قَالَ لَهُمْ قَوْلًا حَسَنًا كَمَا وَرَدَ فِى الْقُرْءَانِ الْكَرِيمِ ﴿قَالَ لا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ وَهُوَ أَرْحَمُ الرَّاحِمِينَ﴾ [سُورَةَ يُوسُف/92] مَعْنَاهُ بَعْدَ هَذَا أَنْتُمْ حَسِّنُوا عَمَلَكُمْ تُوبُوا إِلَى اللَّهِ مِنَ الذُّنُوبِ الَّتِى فَعَلْتُمُوهَا وَأَنَا لا أُؤْذِيكُمْ فَمَا أَحْسَنَ أَخْلاقِ الأَنْبِيَاءِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا تَوَلَّى يُوسُفُ فِى مِصْرَ."},{"type":"question","text":"     (2) هَلِ انْتَقَمَ يُوسُفُ مِنْ إِخْوَتِهِ."},{"type":"question","text":"     (3) مَا مَعْنَى قَوْلِ يُوسُفَ ﴿لا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ وَهُوَ أَرْحَمُ الرَّاحِمِينَ﴾."}],"paragraphCount":5},{"id":"g3-s14","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"أَيُّوبُ عَلَيْهِ السَّلامُ","description":"كَانَ سَيِّدُنَا أَيُّوبُ عَلَيْهِ السَّلامُ نَبِيًّا مِنْ أَنْبِيَاءِ اللَّهِ وَكَانَ كَثِيرَ الْمَالِ وَالأَرَاضِى وَكَانَ لَهُ أَوْلادٌ كُثُرٌ ثُمَّ ابْتَلاهُ اللَّهُ بِأَنْ أَصَابَهُ مَرَضٌ شَدِيدٌ فِى جِسْمِهِ وَمَعَ ذَلِكَ كَانَ صَابِرًا مُحْتَسِبًا ذَاكِرًا لِلَّهِ عَزَّ وَجَلَّ فِى لَيْلِهِ وَنَهَارِهِ.","items":[{"type":"p","text":"كَانَ سَيِّدُنَا أَيُّوبُ عَلَيْهِ السَّلامُ نَبِيًّا مِنْ أَنْبِيَاءِ اللَّهِ وَكَانَ كَثِيرَ الْمَالِ وَالأَرَاضِى وَكَانَ لَهُ أَوْلادٌ كُثُرٌ ثُمَّ ابْتَلاهُ اللَّهُ بِأَنْ أَصَابَهُ مَرَضٌ شَدِيدٌ فِى جِسْمِهِ وَمَعَ ذَلِكَ كَانَ صَابِرًا مُحْتَسِبًا ذَاكِرًا لِلَّهِ عَزَّ وَجَلَّ فِى لَيْلِهِ وَنَهَارِهِ."},{"type":"p","text":"دَامَ مَرَضُ أَيُّوبَ عَلَيْهِ السَّلامُ ثَمَانِىَ عَشْرَةَ سَنَةً وَهُوَ صَابِرٌ لَمْ يَعْتَرِضْ عَلَى اللَّهِ وَلَمْ يَتَسَخَّطْ وَكَانَتِ امْرَأَتُهُ مُؤْمِنَةً صَالِحَةً تُشْفِقُ عَلَيْهِ وَتَهْتَمُّ بِهِ وَهِىَ صَابِرَةٌ مَعَهُ."},{"type":"p","text":"دَعَا أَيُّوبُ عَلَيْهِ السَّلامُ رَبَّهُ فَاسْتَجَابَ لَهُ وَأَنْبَعَ لَهُ عَيْنًا بَارِدَةً وَأَمَرَهُ أَنْ يَغْتَسِلَ مِنْهَا وَيَشْرَبَ مِنْهَا فَفَعَلَ فَأَذْهَبَ اللَّهُ عَنْهُ مَا كَانَ بِهِ مِنَ الْمَرَضِ وَأَعَادَ إِلَيْهِ صِحَّتَهُ."},{"type":"p","text":"وَفِى قِصَّةِ سَيِّدِنَا أَيُّوبَ عِبْرَةٌ لِمَنِ ابْتُلِىَ فِى جَسَدِهِ أَوْ مَالِهِ أَوْ وَلَدِهِ فَلَهُ أُسْوَةٌ بِنَبِىِّ اللَّهِ أَيُّوبَ حَيْثُ ابْتَلاهُ اللَّهُ فَصَبَرَ وَاحْتَسَبَ حَتَّى فَرَّجَ اللَّهُ عَنْهُ."},{"type":"p","text":"وَمَا يُرْوَى مِنْ أَنَّ أَيُّوبَ عَلَيْهِ السَّلامُ أَصَابَهُ مَرَضُ الْجُذَامِ حَتَّى تَنَاثَرَ الدُّودُ مِنْ بَدَنِهِ فَكَانَ يَرُدُّهُ إِلَى جَسَدِهِ فَهُوَ كَذِبٌ لا أَصْلَ لَهُ فِى كِتَابِ اللَّهِ وَلا فِى سُنَّةِ رَسُولِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهَذَا لا يَلِيقُ بِنَبِىٍّ مِنَ الأَنْبِيَاءِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) بِمَاذَا ابْتَلَى اللَّهُ نَبِيَّهُ أَيُّوبَ."},{"type":"question","text":"     (2) كَمْ سَنَةً بَقِىَ أَيُّوبُ فِى مَرَضِهِ."},{"type":"question","text":"     (3) كَيْفَ شُفِىَ أَيُّوبُ مِنْ مَرَضِهِ."},{"type":"question","text":"     (4) مَا هِىَ الْعِبْرَةُ مِنْ قِصَّةِ أَيُّوبَ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (5) مَا هِىَ الْقِصَّةُ الَّتِى تُرْوَى كَذِبًا عَلَى نَبِىِّ اللَّهِ أَيُّوبَ."}],"paragraphCount":10},{"id":"g3-s15","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"مُوسَى عَلَيْهِ السَّلامُ","description":"سَيِّدُنَا مُوسَى عَلَيْهِ السَّلامُ مِنْ نَسْلِ يَعْقُوبَ نَبِىُّ اللَّهِ، وُلِدَ وَعَاشَ فِى مِصْرَ مُدَّةً مِنَ الزَّمَنِ ثُمَّ تَرَكَهَا وَخَرَجَ مِنْهَا وَكَانَ يَحْكُمُ مِصْرَ فِرْعَوْنُ وَهُوَ رَجُلٌ كَافِرٌ.","items":[{"type":"p","text":"سَيِّدُنَا مُوسَى عَلَيْهِ السَّلامُ مِنْ نَسْلِ يَعْقُوبَ نَبِىُّ اللَّهِ، وُلِدَ وَعَاشَ فِى مِصْرَ مُدَّةً مِنَ الزَّمَنِ ثُمَّ تَرَكَهَا وَخَرَجَ مِنْهَا وَكَانَ يَحْكُمُ مِصْرَ فِرْعَوْنُ وَهُوَ رَجُلٌ كَافِرٌ."},{"type":"p","text":"نَزَلَ الْوَحْىُ عَلَى سَيِّدِنَا مُوسَى وَعَلَى أَخِيهِ هَارُونَ فَصَارَا نَبِيَّيْنِ رَسُولَيْنِ ثُمَّ أَرْسَلَهُمَا اللَّهُ إِلَى فِرْعَوْنَ لِيَدْعُوَاهُ إِلَى الإِسْلامِ."},{"type":"p","text":"كَانَ فِرْعَوْنُ يَقُولُ لِلنَّاسِ أَنَا رَبُّكُمُ الأَعْلَى وَكَانَ فِرْعَوْنُ عِنْدَهُ مِنَ الأَمْلاكِ الشَّىْءُ الْكَثِيرُ وَهَذَا دَلِيلٌ عَلَى أَنَّ اللَّهَ يُؤْتِى الْمُلْكَ مَنْ يَشَاءُ وَيَفْعَلُ مَا يُرِيدُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) أَيْنَ وُلِدَ وَعَاشَ مُوسَى."},{"type":"question","text":"     (2) مَنْ كَانَ يَحْكُمُ مِصْرَ فِى زَمَنِ مُوسَى."},{"type":"question","text":"     (3) مَا سَبَبُ كُفْرِ فِرْعَوْنَ."}],"paragraphCount":6},{"id":"g3-s16","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"سَحَرَةُ فِرْعَوْنَ","description":"فِرْعَوْنُ كَانَ عِنْدَهُ جَمَاعَةٌ مِنَ السَّحَرَةِ فَطَلَبَهُمْ لِيُوَاجِهُوا سَيِّدَنَا مُوسَى نَبِىَّ اللَّهِ عَلَيْهِ السَّلامُ، هَؤُلاءِ السَّحَرَةُ تَحَدَّوْا سَيِّدَنَا مُوسَى وَأَلْقَوْا حِبَالًا كَانَتْ مَعَهُمْ فَتَخَيَّلَ لِبَعْضِ النَّاظِرِينَ أَنَّهَا حَيَّاتٌ فَرَمَى سَيِّدُنَا مُوسَى عَصَاهُ فَصَارَتْ حَيَّةً حَقِيقِيَّةً كَبِيرَةً بِقُدْرَةِ اللَّهِ تَعَالَى.","items":[{"type":"p","text":"فِرْعَوْنُ كَانَ عِنْدَهُ جَمَاعَةٌ مِنَ السَّحَرَةِ فَطَلَبَهُمْ لِيُوَاجِهُوا سَيِّدَنَا مُوسَى نَبِىَّ اللَّهِ عَلَيْهِ السَّلامُ، هَؤُلاءِ السَّحَرَةُ تَحَدَّوْا سَيِّدَنَا مُوسَى وَأَلْقَوْا حِبَالًا كَانَتْ مَعَهُمْ فَتَخَيَّلَ لِبَعْضِ النَّاظِرِينَ أَنَّهَا حَيَّاتٌ فَرَمَى سَيِّدُنَا مُوسَى عَصَاهُ فَصَارَتْ حَيَّةً حَقِيقِيَّةً كَبِيرَةً بِقُدْرَةِ اللَّهِ تَعَالَى."},{"type":"p","text":"فَصَارَتْ تَبْتَلِعُ حِبَالَهُمْ فَانْهَزَمَ السَّحَرَةُ ثُمَّ ءَامَنُوا فَغَضِبَ فِرْعَوْنُ وَتَوَعَّدَ الَّذِينَ ءَامَنُوا بِأَنَّهُ سَيُعَذِّبُهُمْ وَيُنَكِّلُ بِهِمْ وَلَكِنَّهُمْ ثَبَتُوا عَلَى الإِسْلامِ بَعْدَ أَنْ رَأَوْا مُعْجِزَةَ سَيِّدِنَا مُوسَى فَقَتَلَهُمْ فِرْعَوْنُ فَمَاتُوا شُهَدَاءَ. "},{"type":"questions_h

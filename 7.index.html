eading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنْ تَحَدَّى سَيِّدَنَا مُوسَى وَبِمَاذَا تَحَدَّوْهُ."},{"type":"question","text":"     (2) مَا هِىَ مُعْجِزَةُ مُوسَى عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (3) هَلْ أَسْلَمَ السَّحَرَةُ لَمَّا رَأَوُا الْمُعْجِزَةَ."},{"type":"question","text":"     (4) مَاذَا أَصَابَ السَّحَرَةَ الَّذِينَ ءَامَنُوا بِمُوسَى."}],"paragraphCount":6},{"id":"g3-s17","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"قِصَّةُ غَرَقِ فِرْعَوْنَ (1)","description":"فِرْعَوْنُ كَانَ جَبَّارًا كَبِيرًا وَكَانَ هُنَاكَ أُنَاسٌ يَعْبُدُونَهُ بِمِصْرَ. اللَّهُ تَعَالَى أَرْسَلَ مُوسَى وَهَارُونَ وَهُمَا مِنَ الأَنْبِيَاءِ فَلَمَّا قَابَلاهُ دَعَيَاهُ إِلَى الإِسْلامِ فَلَمْ يُؤْمِنْ رَغْمَ مَا رَءَاهُ مِنَ الْمُعْجِزَاتِ.","items":[{"type":"p","text":"فِرْعَوْنُ كَانَ جَبَّارًا كَبِيرًا وَكَانَ هُنَاكَ أُنَاسٌ يَعْبُدُونَهُ بِمِصْرَ. اللَّهُ تَعَالَى أَرْسَلَ مُوسَى وَهَارُونَ وَهُمَا مِنَ الأَنْبِيَاءِ فَلَمَّا قَابَلاهُ دَعَيَاهُ إِلَى الإِسْلامِ فَلَمْ يُؤْمِنْ رَغْمَ مَا رَءَاهُ مِنَ الْمُعْجِزَاتِ."},{"type":"p","text":"فَخَرَجَ سَيِّدُنَا مُوسَى مِنْ مِصْرَ وَمَعَهُ مَنْ ءَامَنَ بِهِ مِنْ بَنِي إِسْرَائِيلَ وَكَانُوا سِتَّمِائَةِ أَلْفِ إِنْسَانٍ حَتَّى وَصَلُوا إِلَى الْبَحْرِ وَلَحِقَ بِهِمْ فِرْعَوْنُ لِيُبِيدَهُمْ وَمَعَهُ أَكْثَرُ مِنْ مَلْيُونٍ مِنَ الْمُقَاتِلِينَ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنِ الَّذِى دَعَا فِرْعَوْنَ لِلإسْلامِ."},{"type":"question","text":"     (2) كَمْ عَدَدَ الَّذِينَ خَرَجُوا مَعَ مُوسَى مِنْ مِصْرَ."},{"type":"question","text":"     (3) كَمْ عَدَدَ الَّذِينَ كَانُوا مَعَ فِرْعَوْنَ."}],"paragraphCount":5},{"id":"g3-s18","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"قِصَّةُ غَرَقِ فِرْعَوْنَ (2)","description":"أَوْحَى اللَّهُ إِلَى مُوسَى أَنْ يَضْرِبَ الْبَحْرَ بِعَصَاهُ فَضَرَبَ الْبَحْرَ بِعَصَاهُ فَانْفَلَقَ الْبَحْرُ اثْنَىْ عَشَرَ فِرْقًا بَيْنَ كُلِّ شَقَّيْنِ طَرِيقٌ يَبَسٌ.","items":[{"type":"p","text":"أَوْحَى اللَّهُ إِلَى مُوسَى أَنْ يَضْرِبَ الْبَحْرَ بِعَصَاهُ فَضَرَبَ الْبَحْرَ بِعَصَاهُ فَانْفَلَقَ الْبَحْرُ اثْنَىْ عَشَرَ فِرْقًا بَيْنَ كُلِّ شَقَّيْنِ طَرِيقٌ يَبَسٌ."},{"type":"p","text":"مُوسَى وَمَنْ مَعَهُ اجْتَازُوا ثُمَّ جَاءَ فِرْعَوْنُ بِعَدَدِهِ وَعُدَّتِهِ وَوَجَدَ الْبَحْرَ صَارَ فِيهِ شُقُوقٌ فَقَالَ نَدْخُلُ فِى الْبَحْرِ لِنُدْرِكَهُمْ فَلَمَّا دَخَلَ الْبَحْرَ أَمَرَ اللَّهُ الْمَاءَ أَنْ يَلْتَطِمَ فَالْتَطَمَ عَلَيْهِ فَأَهْلَكَهُ اللَّهُ تَعَالَى وَجُنُودَهُ الْكَثِيرِينَ."},{"type":"p","text":"لَكِنْ قَالَ بَعْضُ أَتْبَاعِهِ إِنَّهُ اخْتَفَى وَلَمْ يَمُتْ فَأَظْهَرَ اللَّهُ تَعَالَى جَسَدَهُ مُنْتِنًا مُنْتَفِخًا إِظْهَارًا لِكَذِبِهِمْ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) بِمَاذَا ضَرَبَ مُوسَى الْبَحْرَ وَمَاذَا حَصَلَ عِنْدَئِذٍ."},{"type":"question","text":"     (2) هَلْ سَارَ فِرْعَوْنُ وَرَاءَ مُوسَى فِى الْبَحْرِ."},{"type":"question","text":"     (3) كَيْفَ هَلَكَ فِرْعَوْنُ."},{"type":"question","text":"     (4) كَيْفَ ظَهَرَ جَسَدُ فِرْعَوْنَ بَعْدَ مَوْتِهِ."}],"paragraphCount":7},{"id":"g3-s19","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"قِصَّةُ مُوسَى","description":"خَرَجَ سَيِّدُنَا مُوسَى مِنْ مِصْرَ إِلَى صَحْرَاءِ سَيْنَاءَ وَمَعَهُ أَتْبَاعُهُ الْمُؤْمِنُونَ. فَتَنَ رَجُلٌ مِنْهُمْ يُسَمَّى مُوسَى السَّامِرِىَّ بَعْضَ أَتْبَاعِ مُوسَى عَلَيْهِ السَّلامُ فَكَفَرُوا.","items":[{"type":"p","text":"خَرَجَ سَيِّدُنَا مُوسَى مِنْ مِصْرَ إِلَى صَحْرَاءِ سَيْنَاءَ وَمَعَهُ أَتْبَاعُهُ الْمُؤْمِنُونَ. فَتَنَ رَجُلٌ مِنْهُمْ يُسَمَّى مُوسَى السَّامِرِىَّ بَعْضَ أَتْبَاعِ مُوسَى عَلَيْهِ السَّلامُ فَكَفَرُوا."},{"type":"p","text":"كَانَ سَيِّدُنَا مُوسَى تَرَكَ فِى قَوْمِهِ أَخَاهُ هَارُونَ الَّذِى هُوَ رَسُولٌ مِثْلُهُ قَالَ لَهُ اخْلُفْنِى فِى قَوْمِى أَنَا سَأَذْهَبُ إِلَى مَكَانٍ عُيِّنَ لِى لِأَسْمَعَ كَلامَ اللَّهِ."},{"type":"p","text":"فَذَهَبَ إِلَى ذَلِكَ الْمَكَانِ أَرْبَعِينَ لَيْلَةً فَلَمَّا عَادَ إِلَى قَوْمِهِ وَجَدَ هَذَا السَّامِرِىَّ قَدْ أَضَلَّ قِسْمًا مِنْهُمْ وَجَعَلَهُمْ يَعْبُدُونَ الْعِجْلَ."}],"paragraphCount":3},{"id":"g3-s20","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"قِصَّةُ مُوسَى السَّامِرِىِّ (1)","description":"مُوسَى السَّامِرِىُّ صَنَعَ لِبَنِى إِسْرَائِيلَ عِجْلًا مِنْ ذَهَبٍ وَوَضَعَ فِيهِ شَيْئًا مِنْ أَثَرِ حَافِرِ فَرَسِ جِبْرِيلَ.","items":[{"type":"p","text":"مُوسَى السَّامِرِىُّ صَنَعَ لِبَنِى إِسْرَائِيلَ عِجْلًا مِنْ ذَهَبٍ وَوَضَعَ فِيهِ شَيْئًا مِنْ أَثَرِ حَافِرِ فَرَسِ جِبْرِيلَ."},{"type":"p","text":"عِنْدَمَا أَرَادَ فِرْعَوْنُ أَنْ يَخُوضَ الْبَحْرَ كَانَ جِبْرِيلُ عَلَى فَرَسٍ، وَمُوسَى السَّامِرِىُّ الْخَبِيثُ رَأَى مَوْقِفَ فَرَسِ جِبْرِيلَ فَأَخَذَ مِنْ هَذَا التُّرَابِ شَيْئًا وَوَضَعَهُ فِى ذَلِكَ الْعِجْلِ الَّذِى صَوَّرَهُ مِنْ ذَهَبٍ فَأَحْيَا اللَّهُ تَعَالَى هَذَا الْعِجْلَ فَصَارَ يَخُورُ كَالْعِجْلِ الْحَقِيقِىِّ فَقَالَ لَهُمُ السَّامِرِىُّ هَذَا إِلَهُكُمْ وَإِلَهُ مُوسَى فَصَدَّقَهُ قِسْمٌ مِنْهُمْ وَعَبَدُوا هَذَا الْعِجْلَ فَكَفَرُوا."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا صَنَعَ مُوسَى السَّامِرِىُّ لِأَتْبَاعِهِ."},{"type":"question","text":"     (2) مَاذَا وَضَعَ مُوسَى السَّامِرِىُّ فِى الْعِجْلِ."},{"type":"question","text":"     (3) هَلْ أَحْيَا اللَّهُ الْعِجْلَ."},{"type":"question","text":"     (4) هَلْ عَبَدَ قِسْمٌ مِنَ النَّاسِ الْعِجْلَ."}],"paragraphCount":6},{"id":"g3-s21","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"قِصَّةُ مُوسَى السَّامِرِىِّ (2)","description":"لَمَّا عَرَفَ سَيِّدُنَا مُوسَى عَلَيْهِ السَّلامُ بِمَا حَصَلَ مِنَ السَّامِرِىِّ اغْتَاظَ عَلَى مَنِ اتَّبَعَهُ اغْتِيَاظًا شَدِيدًا ثُمَّ أَخَذَ هَذَا السَّامِرِىَّ فَقَالَ لَهُ انْظُرْ إِلَى إِلَهِكَ أَىْ عَلَى زَعْمِكَ الَّذِى كُنْتَ تَتَذَلَّلُ لَهُ لَنُحْرِقَنَّهُ ثُمَّ نَرْمِيهِ فِى الْبَحْرِ فَأَحْرَقَهُ سَيِّدُنَا مُوسَى وَرَمَى بِهِ فِى الْبَحْرِ. ","items":[{"type":"p","text":"لَمَّا عَرَفَ سَيِّدُنَا مُوسَى عَلَيْهِ السَّلامُ بِمَا حَصَلَ مِنَ السَّامِرِىِّ اغْتَاظَ عَلَى مَنِ اتَّبَعَهُ اغْتِيَاظًا شَدِيدًا ثُمَّ أَخَذَ هَذَا السَّامِرِىَّ فَقَالَ لَهُ انْظُرْ إِلَى إِلَهِكَ أَىْ عَلَى زَعْمِكَ الَّذِى كُنْتَ تَتَذَلَّلُ لَهُ لَنُحْرِقَنَّهُ ثُمَّ نَرْمِيهِ فِى الْبَحْرِ فَأَحْرَقَهُ سَيِّدُنَا مُوسَى وَرَمَى بِهِ فِى الْبَحْرِ. "},{"type":"p","text":"ثُمَّ اخْتَارَ سَيِّدُنَا مُوسَى مِنْ قَوْمِهِ سَبْعِينَ رَجُلًا لِيَأْخُذَهُمْ لِلتَّضَرُّعِ إِلَى اللَّهِ فَأَخَذَتْهُمُ الرَّجْفَةُ فَمَاتُوا فَقَالَ مُوسَى مُتَضَرِّعًا إِلَى اللَّهِ تَعَالَى ﴿لَوْ شِئْتَ أَهْلَكْتَهُمْ مِّنْ قَبْلُ وَإِيَّاىَ أَتُهْلِكُنَا بِمَا فَعَلَ السُّفَهَاءُ مِنَّا إِنْ هِىَ إِلَّا فِتْنَتُكَ تُضِلُّ بِهَا مَنْ تَشَاءُ وَتَهْدِى مَنْ تَشَاءُ﴾ [سُورَةَ الأَعْرَاف/155] أَىْ أَنْتَ يَا رَبُّ تَخْلُقُ الْهِدَايَةَ وَأَنْتَ يَا رَبُّ تَخْلُقُ الضَّلالَ فَارْحَمْنَا."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا فَعَلَ سَيِّدُنَا مُوسَى عَلَيْهِ السَّلامُ بِعِجْلِ مُوسَى السَّامِرِىِّ."},{"type":"question","text":"     (2) كَمْ شَخْصًا اخْتَارَ مُوسَى لِلتَّضَرُّعِ إِلَى اللَّهِ."},{"type":"question","text":"     (3) مَاذَا قَالَ مُوسَى مُتَضَرِّعًا إِلَى اللَّهِ."}],"paragraphCount":5},{"id":"g3-s22","grade":3,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الثَّالِثِ","title":"وَفَاةُ هَارُونَ وَمُوسَى عَلَيْهِمَا السَّلامُ","description":"سَارَ سَيِّدُنَا مُوسَى عَلَيْهِ السَّلامُ بِقَوْمِهِ حَتَّى أَتَوُا الأَرْضَ الْمُقَدَّسَةَ فَوَجَدُوا فِيهَا قَوْمًا جَبَّارِينَ فَقَالُوا ﴿يَا مُوسَى إِنَّ فِيهَا قَوْمًا جَبَّارِينَ وَإِنَّا لَنْ نَّدْخُلَهَا حَتَّىَ يَخْرُجُوا مِنْهَا فَإِنْ يَخْرُجُوا مِنْهَا فَإِنَّا دَاخِلُونَ﴾ [سُورَةَ الْمَائِدَة/22].","items":[{"type":"p","text":"سَارَ سَيِّدُنَا مُوسَى عَلَيْهِ السَّلامُ بِقَوْمِهِ حَتَّى أَتَوُا الأَرْضَ الْمُقَدَّسَةَ فَوَجَدُوا فِيهَا قَوْمًا جَبَّارِينَ فَقَالُوا ﴿يَا مُوسَى إِنَّ فِيهَا قَوْمًا جَبَّارِينَ وَإِنَّا لَنْ نَّدْخُلَهَا حَتَّىَ يَخْرُجُوا مِنْهَا فَإِنْ يَخْرُجُوا مِنْهَا فَإِنَّا دَاخِلُونَ﴾ [سُورَةَ الْمَائِدَة/22]."},{"type":"p","text":"وَقَالَ قِسْمٌ مِنْ بَنِى إِسْرَائِيلَ لِمُوسَى ﴿إِنَّا لَنْ نَّدْخُلَهَا أَبَدًا مَّا دَامُوا فِيهَا فَاذْهَبْ أَنْتَ وَرَبُّكَ فَقَاتِلا إِنَّا هَاهُنَا قَاعِدُونَ﴾ [سُورَةَ الْمَائِدَة/24] فَغَضِبَ مُوسَى مِنْهُمْ وَدَعَا عَلَيْهِمْ وَسَمَّاهُمْ فَاسِقِينَ فَعَاقَبَهُمُ اللَّهُ بِأَنْ حَرَّمَهَا عَلَيْهِمْ أَرْبَعِينَ سَنَةً يَتِيهُونَ فِى الأَرْضِ لَيْلًا وَنَهَارًا."},{"type":"p","text":"بَقِيَ سَيِّدُنَا مُوسَى عَلَيْهِ السَّلامُ يَدْعُو إِلَى الإِسْلامِ مُدَّةً ثُمَّ تُوُفِّىَ قَبْلَهُ أَخُوهُ هَارُونُ عَلَيْهِ السَّلامُ ثُمَّ بَعْدَهُ بِمُدَّةٍ قَبَضَ مَلَكُ الْمَوْتِ رُوحَ سَيِّدِنَا مُوسَى عَلَيْهِ السَّلامُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) إِلَى أَيْنَ وَصَلَ مُوسَى وَقَوْمُهُ الْمُؤْمِنُونَ."},{"type":"question","text":"     (2) لِمَاذَا رَفَضَ قَوْمُ مُوسَى دُخُولَ الأَرْضِ الْمُقَدَّسَةِ."},{"type":"question","text":"     (3) كَمْ سَنَةً حُرِّمَتِ الأَرْضُ الْمُقَدَّسَةُ عَلَى قَوْمِ مُوسَى."},{"type":"question","text":"     (4) مَنْ مَاتَ قَبْلَ الآخَرِ مُوسَى أَمْ أَخُوهُ هَارُونُ."}],"paragraphCount":7}]},{"grade":4,"title":"قَصَصٌ مِنَ الْمَاضِى","subtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","sections":[{"id":"g4-s1","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"زَكَرِيَّا وَيَحْيَى عَلَيْهِمَا السَّلامُ","description":"قُبَيْلَ مِيلادِ عِيسَى عَلَيْهِ السَّلامُ بَعَثَ اللَّهُ زَكَرِيَّا عَلَيْهِ السَّلامُ رَسُولًا إِلَى بَنِى إِسْرَائِيلَ فَقَامَ يَدْعُوهُمْ إِلَى عِبَادَةِ اللَّهِ وَيُخَوِّفُهُمْ مِنْ عَذَابِهِ فِى وَقْتٍ اشْتَدَّ فِيهِ الْفِسْقُ وَالْفُجُورُ فَلَقِىَ مِنْهُمُ التَّكْذِيبَ وَالْمَشَقَّةَ.","items":[{"type":"p","text":"قُبَيْلَ مِيلادِ عِيسَى عَلَيْهِ السَّلامُ بَعَثَ اللَّهُ زَكَرِيَّا عَلَيْهِ السَّلامُ رَسُولًا إِلَى بَنِى إِسْرَائِيلَ فَقَامَ يَدْعُوهُمْ إِلَى عِبَادَةِ اللَّهِ وَيُخَوِّفُهُمْ مِنْ عَذَابِهِ فِى وَقْتٍ اشْتَدَّ فِيهِ الْفِسْقُ وَالْفُجُورُ فَلَقِىَ مِنْهُمُ التَّكْذِيبَ وَالْمَشَقَّةَ."},{"type":"p","text":"وَكَانَ سَيِّدُنَا زَكَرِيَّا قَدْ تَقَدَّمَتْ بِهِ السِّنُّ وَكَانَ مُتَزَوِّجًا مِنِ امْرَأَةٍ كَبِيرَةٍ فِى السِّنِّ لا تَلِدُ فَطَلَبَ مِنَ اللَّهِ أَنْ يَرْزُقَهُ غُلامًا تَقِيًّا يَرِثُهُ فِى النُّبُوَّةِ فَبَشَّرَهُ اللَّهُ بِوَلَدٍ يُولَدُ لَهُ قَالَ تَعَالَى ﴿يَا زَكَرِيَّا إِنَّا نُبَشِّرُكَ بِغُلامٍ اسْمُهُ يَحْيَى لَمْ نَجْعَلْ لَّهُ مِنْ قَبْلُ سَمِيًّا﴾ [سُورَةَ مَرْيَم/7] ثُمَّ إِنَّ الْيَهُودَ عَزَمُوا عَلَى قَتْلِ سَيِّدِنَا زَكَرِيَّا فَأَمْسَكُوا بِهِ ثُمَّ نَشَرُوهُ بِالْمِنْشَارِ فَقُتِلَ عَلَيْهِ السَّلامُ بِأَيْدِى الْيَهُودِ الْمُجْرِمِينَ."},{"type":"p","text":"قَامَ سَيِّدُنَا يَحْيَى بنُ زَكَرِيَّا عَلَيْهِمَا السَّلامُ بَعْدَ وَالِدِهِ بِالدَّعْوَةِ إِلَى اللَّهِ وَنَشْرِ دِينِ الإِسْلامِ بَعْدَ أَنْ ءَاتَاهُ اللَّهُ النُّبُوَّةَ وَأَمَرَهُ بِالْعَمَلِ بِالتَّوْرَاةِ وَالتَّمَسُّكِ بِهَا وَأَمَرَهُ بِالصِّيَامِ وَالصَّلاةِ."},{"type":"p","text":"ثُمَّ إِنَّ مَلِكَ بَنِى إِسْرَائِيلَ أَرَادَ أَنْ يَتَزَوَّجَ مِنِ امْرَأَةٍ لا تَحِلُّ لَهُ فَنَهَاهُ سَيِّدُنَا يَحْيَى فَبَعَثَ الْمَلِكُ مَنْ قَتَلَ يَحْيَى وَأَتَى بِرَأْسِهِ عَلَى طَبَقٍ."},{"type":"p","text":"وَبَعْدَ قَتْلِ سَيِّدِنَا يَحْيَى سَلَّطَ اللَّهُ عَلَيْهِمْ أَحَدَ مُلُوكِ بَابِلَ وَهُوَ بُخْتَ نَصَّر فَقَتَلَ مِنْهُمْ عَدَدًا كَبِيرًا وَخَرَّبَ بَيْتَ الْمَقْدِسِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَنْ هُوَ النَّبِىُّ الَّذِى بُعِثَ قَبْلَ سَيِّدِنَا عِيسَى إِلامَ دَعَا قَوْمَهُ."},{"type":"question","text":"     (2) مَا اسْمُ قَوْمِ سَيِّدِنَا زَكَرِيَّا."},{"type":"question","text":"     (3) هَلْ كَانَتْ زَوْجُ سَيِّدِنَا زَكَرِيَّا تَلِدُ مَاذَا طَلَبَ مِنَ اللَّهِ."},{"type":"question","text":"     (4) مَا هِىَ الآيَةُ الَّتِى فِيهَا الْبِشَارَةُ بِسَيِّدِنَا يَحْيَى فِى أَيَّةِ سُورَةٍ."},{"type":"question","text":"     (5) كَيْفَ قَتَلَ الْيَهُودُ سَيِّدَنَا زَكَرِيَّا."},{"type":"question","text":"     (6) مَا اسْمُ النَّبِىِّ الَّذِى جَاءَ بَعْدَ زَكَرِيَّا، مَا هِىَ دَعْوَتُهُ، بِأَىِّ كِتَابٍ عَمِلَ."},{"type":"question","text":"     (7) كَيْفَ قُتِلَ سَيِّدُنَا يَحْيَى وَمَاذَا حَصَلَ لِقَتَلَتِهِ."}],"paragraphCount":12},{"id":"g4-s2","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"مَرْيَمُ عَلَيْهَا السَّلامُ","description":"كَانَتْ أُمُّ مَرْيَمَ لا تَلِدُ فَرَأَتْ ذَاتَ يَوْمٍ طَيْرًا يَزُقُّ فَرْخَهُ أَىْ يُطْعِمُهُ فَطَلَبَتْ مِنَ اللَّهِ تَعَالَى أَنْ يَرْزُقَهَا وَلَدًا وَنَذَرَتْ أَنْ تَجْعَلَهُ خَادِمًا فِى بَيْتِ الْمَقْدِسِ لِأَنَّهَا كَانَتْ تَظُنُّ أَنَّهُ ذَكَرٌ فَإِذَا هِىَ أُنْثَى فَأَسْمَتْهَا مَرْيَمَ وَتَكَفَّلَهَا نَبِىُّ اللَّهِ زَكَرِيَّا زَوْجُ خَالَةِ عِيسَى وَكَانَ يُعَلِّمُهَا الدِّينَ الإِسْلامِىَّ فَنَشَأَتْ صَالِحَةً طَاهِرَةً وَصَارَتْ وَلِيَّةً. وَذَاتَ يَوْمٍ ذَهَبَتْ مَرْيَمُ إِلَى مَكَانٍ لِتَقْضِىَ أَمْرًا فَأَرْسَلَ اللَّهُ إِلَيْهَا جِبْرِيلَ مُتَشَكِّلًا بِشَكْلِ شَابٍّ أَبْيَضِ الْوَجْهِ فَقَالَتْ لَهُ ﴿إِنِّى أَعُوذُ بِالرَّحْمٰنِ مِنْكَ إِنْ كُنْتَ تَقِيًّا﴾ [سُورَةَ مَرْيَم/18] أَىْ إِذَا كُنْتَ تَقِيًّا فَلا تَتَعَرَّضْ لِى بِالأَذَى فَقَالَ لَهَا ﴿إِنَّمَا أَنَا رَسُولُ رَبِّكِ لِأَهَبَ لَكِ غُلامًا زَكِيًّا﴾ [سُورَةَ مَرْيَم/19] أَىْ أَنَّ اللَّهَ أَرْسَلَهُ إِلَيْهَا لِيَهَبَهَا وَلَدًا صَالِحًا طَاهِرًا مِنَ الذُّنُوبِ فَقَالَتْ مَرْيَمُ أَنَّى يَكُونُ لِى غُلامٌ وَلَمْ يَقْرَبْنِى زَوْجٌ وَلَمْ أَكُنْ فَاجِرَةً زَانِيَةً فَقَالَ جِبْرِيلُ هَكَذَا قَالَ رَبُّكِ، إِنَّ خَلْقَ وَلَدٍ مِنْ غَيْرِ أَبٍ هَيِّنٌ عَلَيْهِ وَلِيَجْعَلَهُ عَلامَةً لِلنَّاسِ وَدِلالَةً عَلَى قُدْرَتِهِ سُبْحَانَهُ وَتَعَالَى وَلِيَجْعَلَهُ رَحْمَةً وَنِعْمَةً لِمَنْ تَبِعَهُ وَصَدَّقَهُ وَءَامَنَ بِهِ وَكَانَ خَلْقُهُ أَمْرًا شَاءَهُ اللَّهُ وَقَدَّرَهُ فَلا يُرَدُّ وَلا يُبَدَّلُ.","items":[{"type":"p","text":"كَانَتْ أُمُّ مَرْيَمَ لا تَلِدُ فَرَأَتْ ذَاتَ يَوْمٍ طَيْرًا يَزُقُّ فَرْخَهُ أَىْ يُطْعِمُهُ فَطَلَبَتْ مِنَ اللَّهِ تَعَالَى أَنْ يَرْزُقَهَا وَلَدًا وَنَذَرَتْ أَنْ تَجْعَلَهُ خَادِمًا فِى بَيْتِ الْمَقْدِسِ لِأَنَّهَا كَانَتْ تَظُنُّ أَنَّهُ ذَكَرٌ فَإِذَا هِىَ أُنْثَى فَأَسْمَتْهَا مَرْيَمَ وَتَكَفَّلَهَا نَبِىُّ اللَّهِ زَكَرِيَّا زَوْجُ خَالَةِ عِيسَى وَكَانَ يُعَلِّمُهَا الدِّينَ الإِسْلامِىَّ فَنَشَأَتْ صَالِحَةً طَاهِرَةً وَصَارَتْ وَلِيَّةً. وَذَاتَ يَوْمٍ ذَهَبَتْ مَرْيَمُ إِلَى مَكَانٍ لِتَقْضِىَ أَمْرًا فَأَرْسَلَ اللَّهُ إِلَيْهَا جِبْرِيلَ مُتَشَكِّلًا بِشَكْلِ شَابٍّ أَبْيَضِ الْوَجْهِ فَقَالَتْ لَهُ ﴿إِنِّى أَعُوذُ بِالرَّحْمٰنِ مِنْكَ إِنْ كُنْتَ تَقِيًّا﴾ [سُورَةَ مَرْيَم/18] أَىْ إِذَا كُنْتَ تَقِيًّا فَلا تَتَعَرَّضْ لِى بِالأَذَى فَقَالَ لَهَا ﴿إِنَّمَا أَنَا رَسُولُ رَبِّكِ لِأَهَبَ لَكِ غُلامًا زَكِيًّا﴾ [سُورَةَ مَرْيَم/19] أَىْ أَنَّ اللَّهَ أَرْسَلَهُ إِلَيْهَا لِيَهَبَهَا وَلَدًا صَالِحًا طَاهِرًا مِنَ الذُّنُوبِ فَقَالَتْ مَرْيَمُ أَنَّى يَكُونُ لِى غُلامٌ وَلَمْ يَقْرَبْنِى زَوْجٌ وَلَمْ أَكُنْ فَاجِرَةً زَانِيَةً فَقَالَ جِبْرِيلُ هَكَذَا قَالَ رَبُّكِ، إِنَّ خَلْقَ وَلَدٍ مِنْ غَيْرِ أَبٍ هَيِّنٌ عَلَيْهِ وَلِيَجْعَلَهُ عَلامَةً لِلنَّاسِ وَدِلالَةً عَلَى قُدْرَتِهِ سُبْحَانَهُ وَتَعَالَى وَلِيَجْعَلَهُ رَحْمَةً وَنِعْمَةً لِمَنْ تَبِعَهُ وَصَدَّقَهُ وَءَامَنَ بِهِ وَكَانَ خَلْقُهُ أَمْرًا شَاءَهُ اللَّهُ وَقَدَّرَهُ فَلا يُرَدُّ وَلا يُبَدَّلُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا رَأَتْ أُمُّ مَرْيَمَ وَمَاذَا طَلَبَتْ مِنَ اللَّهِ تَعَالَى."},{"type":"question","text":"     (2) هَلْ ظَنَّتْ أَنَّهُ سَيَكُونُ ذَكَرًا، مَاذَا نَذَرَتْ."},{"type":"question","text":"     (3) مَا اسْمُ الْمَوْلُودَةِ الَّتِى رَزَقَهَا اللَّهُ إِيَّاهَا وَمَنْ تَكَفَّلَهَا وَمَاذَا عَلَّمَهَا."},{"type":"question","text":"     (4) كَيْفَ نَشَأَتْ سَيِّدَتُنَا مَرْيَمُ عَلَيْهَا السَّلامُ."},{"type":"question","text":"     (5) كَيْفَ ظَهَرَ سَيِّدُنَا جِبْرِيلُ عَلَيْهِ السَّلامُ عَلَى مَرْيَمَ، مَاذَا قَالَتْ لَهُ."},{"type":"question","text":"     (6) مَا مَعْنَى قَوْلِهَا لِجِبْرِيلَ عَلَيْهِ السَّلامُ."},{"type":"question","text":"     (7) مَاذَا قَالَ لَهَا سَيِّدُنَا جِبْرِيلُ وَمَا مَعْنَى قَوْلِهِ."}],"paragraphCount":8},{"id":"g4-s3","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"وِلادَةُ عِيسَى عَلَيْهِ السَّلامُ","description":"وَنَفَخَ جِبْرِيلُ فِى جَيْبِ دِرْعِ مَرْيَمَ فَدَخَلَ الرُّوحُ مِنْ فَمِهَا فَحَمَلَتْ بِعِيسَى عَلَيْهِ السَّلامُ ثُمَّ تَنَحَّتْ بِحَمْلِهَا بَعِيدًا خَوْفَ أَنْ يُعَيِّرَهَا النَّاسُ بِوِلادَتِهَا مِنْ غَيْرِ زَوْجٍ.","items":[{"type":"p","text":"وَنَفَخَ جِبْرِيلُ فِى جَيْبِ دِرْعِ مَرْيَمَ فَدَخَلَ الرُّوحُ مِنْ فَمِهَا فَحَمَلَتْ بِعِيسَى عَلَيْهِ السَّلامُ ثُمَّ تَنَحَّتْ بِحَمْلِهَا بَعِيدًا خَوْفَ أَنْ يُعَيِّرَهَا النَّاسُ بِوِلادَتِهَا مِنْ غَيْرِ زَوْجٍ."},{"type":"p","text":"ثُمَّ أَلْجَأَهَا وَجَعُ الْوِلادَةِ إِلَى سَاقِ نَخْلَةٍ يَابِسَةٍ وَتَمَنَّتِ الْمَوْتَ اسْتِحْيَاءً مِنَ النَّاسِ فَنَادَاهَا جِبْرِيلُ يُطَمْئِنُهَا وَيُخْبِرُهَا أَنَّ اللَّهَ جَعَلَ تَحْتَهَا نَهْرًا صَغِيرًا وَطَلَبَ مِنْهَا أَنْ تَهُزَّ جِذْعَ النَّخْلَةِ لِيَتَسَاقَطَ عَلَيْهَا الرُّطَبُ الْجَنِىُّ وَأَنْ تَأْكُلَ وَتَشْرَبَ مِمَّا رَزَقَهَا اللَّهُ وَأَنْ تَقَرَّ عَيْنُهَا وَأَنْ تَقُولَ لِمَنْ رَءَاهَا وَسَأَلَهَا عَنْ حَمْلِهَا إِنِّى نَذَرْتُ لِلرَّحْمٰنِ أَنْ لا أُكَلِّمَ أَحَدًا مِنَ الْبَشَرِ."},{"type":"p","text":"وَبَعْدَ أَنْ وَلَدَتْ مَرْيَمُ عَلَيْهَا السَّلامُ ابْنَهَا عِيسَى عَلَيْهِ السَّلامُ حَمَلَتْهُ إِلَى قَوْمِهَا وَحِينَ كَلَّمُوهَا فِى شَأْنِهِ أَشَارَتْ إِلَيْهِ أَىْ كَلِّمُوهُ هُوَ فَأَنْطَقَ اللَّهُ عِيسَى عَلَيْهِ السَّلامُ وَكَانَ عُمُرُهُ أَرْبَعِينَ يَوْمًا فَقَالَ ﴿إِنِّى عَبْدُ اللَّهِ ءَاتَانِىَ الْكِتَابَ وَجَعَلَنِى نَبِيًّا وَجَعَلَنِى مُبَارَكًا أَيْنَ مَا كُنْتُ وَأَوْصَانِى بِالصَّلاةِ وَالزَّكَاةِ مَا دُمْتُ حَيًّا وَبَرًّا بِوَالِدَتِى وَلَمْ يَجْعَلْنِى جَبَّارًا شَقِيًّا وَالسَّلامُ عَلَىَّ يَوْمَ وُلِدْتُّ وَيَوْمَ أَمُوتُ وَيَوْمَ أُبْعَثُ حَيًّا﴾ [سُورَةَ مَرْيَم]."},{"type":"p","text":"أَنْطَقَهُ اللَّهُ بِهَذِهِ الْكَلِمَاتِ الْمَعْدُودَةِ وَالْحِكْمَةُ فِى ذَلِكَ أَنْ يُخَفَّفَ الأَذَى الَّذِى كَانَ لَحِقَ مَرْيَمَ وَزَكَرِيَّا وَأَهْلَهُ لِأَنَّ مَرْيَمَ  كَانَتْ تَحْتَ رِعَايَتِةِ. فَلَمَّا حَمَلَتْ اتَّهَمُوهَا وَأَسَاءُوا الظَّنَّ بِزَكَرِيَّا أَيْضًا."},{"type":"p","text":"وَهُنَاكَ حِكَمٌ أُخْرَى مِنْ جُمْلَتِهَا أَنَّ هَذَا يَكُونُ تَأْسِيسًا لِمُسْتَقْبَلِ أَمْرِ عِيسَى لِأَنَّ اللَّهَ يَعْلَمُ أَنَّ عِيسَى فِى الْمُسْتَقْبَلِ أَىْ بَعْدَ أَنْ يَقْضِىَ سِنَّ الطُّفُولَةِ يُوحَى إِلَيْهِ فَيَدْعُو النَّاسَ إِلَى الإِيـمَانِ بِاللَّهِ الْوَاحِدِ الأَحَدِ الَّذِى لا شَرِيكَ لَهُ وَإِلَى الإِيـمَانِ بِأَنَّهُ عَبْدُ اللَّهِ وَرَسُولُهُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَيْفَ دَخَلَ الرُّوحُ إِلَى جَوْفِ مَرْيَمَ وَبِمَنْ حَمَلَتْ."},{"type":"question","text":"     (2) لِمَاذَا تَنَحَّتْ بِحَمْلِهَا بَعِيدًا عَنِ النَّاسِ."},{"type":"question","text":"     (3) مَاذَا طَلَبَ سَيِّدُنَا جِبْرِيلُ مِنْ مَرْيَمَ لَمَّا كَانَتْ تَحْتَ النَّخْلَةِ."},{"type":"question","text":"     (4) كَمْ كَانَ عُمُرُ سَيِّدِنَا عِيسَى لَمَّا أَنْطَقَهُ اللَّهُ فِى الْمَهْدِ، مَاذَا قَالَ."},{"type":"question","text":"     (5) مَا الْحِكْمَةُ مِنْ إِنْطَاقِ سَيِّدِنَا عِيسَى فِى الْمَهْدِ، هَلْ هُنَاكَ حِكَمٌ أُخْرَى."}],"paragraphCount":10},{"id":"g4-s4","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"دَعْوَةُ عِيسَى عَلَيْهِ السَّلامُ","description":"اللَّهُ تَعَالَى جَعَلَ إِنْطَاقَ عِيسَى فِى الْمَهْدِ مُقَدِّمَةً لِمَا يَسْتَقْبِلُهُ الْمَسِيحُ عَلَيْهِ السَّلامُ مِنْ أَنْ يَكُونَ دَاعِيًا إِلَى اللَّهِ تَعَالَى كَمَا كَانَ الأَنْبِيَاءُ الأَوَّلُونَ الَّذِينَ سَبَقُوهُ فَكَانَ كَلامُهُ نُطْقًا كَالْكَلامِ الْعَادِىِّ لَكِنَّهُ بَعْدَ تِلْكَ الْكَلِمَاتِ عَادَ لِحَالَتِهِ الَّتِى كَانَ عَلَيْهَا فَلَمْ يَتَكَلَّمْ حَتَّى صَارَ فِى السِّنِّ الَّذِى يَتَكَلَّمُ فِيهِ الأَطْفَالُ. فَاللَّهُ تَعَالَى قَادِرٌ عَلَى كُلِّ شَىْءٍ وَلا يُعْجِزُهُ شَىْءٌ.","items":[{"type":"p","text":"اللَّهُ تَعَالَى جَعَلَ إِنْطَاقَ عِيسَى فِى الْمَهْدِ مُقَدِّمَةً لِمَا يَسْتَقْبِلُهُ الْمَسِيحُ عَلَيْهِ السَّلامُ مِنْ أَنْ يَكُونَ دَاعِيًا إِلَى اللَّهِ تَعَالَى كَمَا كَانَ الأَنْبِيَاءُ الأَوَّلُونَ الَّذِينَ سَبَقُوهُ فَكَانَ كَلامُهُ نُطْقًا كَالْكَلامِ الْعَادِىِّ لَكِنَّهُ بَعْدَ تِلْكَ الْكَلِمَاتِ عَادَ لِحَالَتِهِ الَّتِى كَانَ عَلَيْهَا فَلَمْ يَتَكَلَّمْ حَتَّى صَارَ فِى السِّنِّ الَّذِى يَتَكَلَّمُ فِيهِ الأَطْفَالُ. فَاللَّهُ تَعَالَى قَادِرٌ عَلَى كُلِّ شَىْءٍ وَلا يُعْجِزُهُ شَىْءٌ."},{"type":"p","text":"وَكَانَ أَتْبَاعُ عِيسَى عَلَيْهِ السَّلامُ عَلَى الإِسْلامِ يُؤْمِنُونَ بِاللَّهِ وَحْدَهُ وَيُؤْمِنُونَ بِعِيسَى أَنَّهُ عَبْدُ اللَّهِ وَرَسُولُهُ وَيُصَلُّونَ وَيَصُومُونَ لِلَّهِ تَعَالَى يُصَلُّونَ بِسُجُودٍ وَرُكُوعٍ وَيَتَوَضَّئُونَ، أُولَئِكَ أُمَّتُهُ عَاشُوا بَعْدَ أَنْ رُفِعَ عِيسَى إِلَى السَّمَاءِ عَلَى هَدْيِهِ وَتَعَالِيمِهِ وَطَرِيقَتِهِ مِائَتَىْ سَنَةٍ ثُمَّ بَعْدَ ذَلِكَ دَخَلَهُمُ الِانْحِرَافُ صَارَ عَدَدُ الْمُؤْمِنِينَ مِنْهُمْ يَنْقُصُ شَيْئًا فَشَيْئًا وَيَكْثُرُ الآخَرُونَ الَّذِينَ يَعْبُدُونَ عِيسَى."},{"type":"p","text":"ثُمَّ جَاءَ رَجُلٌ اسْمُهُ قِسْطَنْطِينُ كَانَ وَثَنِيًّا فِى الأَصْلِ دَخَلَ فِى هَذَا الدِّينِ الْمُحَرَّفِ فَزَادَهُمْ ضَلالًا وَوَسَّعَهُ لَهُمْ حَتَّى صَارُوا يُظْهِرُونَ فِى أَكْثَرِ بِلادِهِمْ وَأَمَاكِنِهِمْ عِبَادَةَ غَيْرِ اللَّهِ."},{"type":"p","text":"وَأَمَّا أَتْبَاعُ عِيسَى الصَّادِقُونَ الَّذِينَ بَقُوا عَلَى الإِسْلامِ فَصَارُوا فِى ضَعْفٍ شَدِيدٍ وَلَجَئُوا إِلَى الْجِبَالِ. كَانَ الْوَاحِدُ مِنْهُمْ يَبْنِى فِى الْجِبَالِ كُوخًا أَوْ يَسْكُنُ مَغَارَةً وَيَأْكُلُ أَوْرَاقَ الشَّجَرِ وَنَبَاتَاتِ الأَرْضِ هَرَبًا مِنْ أَهْلِ الْمُدُنِ الَّذِينَ كَفَرُوا وَبَغَوْا وَظَلَمُوا. ثُمَّ هَؤُلاءِ أَيْضًا فُقِدُوا وَلَمْ يَبْقَ مِنْهُمْ أَحَدٌ بَعْدَ ذَلِكَ لا فِى الْجِبَالِ وَلا فِى الْمُدُنِ وَهَذَا قَبْلَ بِعْثَةِ سَيِّدِنَا مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ. "},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) إِنْطَاقُ سَيِّدِنَا عِيسَى فِى الْمَهْدِ كَانَ مُقَدِّمَةً لِمَاذَا."},{"type":"question","text":"     (2) كَيْفَ كَانَ كَلامُهُ، هَلْ عَادَ إِلَى حَالَتِهِ الْعَادِيَّةِ."},{"type":"question","text":"     (3) أَتْبَاعُ عِيسَى الْمُسْلِمِينَ مَاذَا كَانُوا يَفْعَلُونَ."},{"type":"question","text":"     (4) مَتَى دَخَلَ الِانْحِرَافُ إِلَى الَّذِينَ كَفَرُوا بِعِيسَى."},{"type":"question","text":"     (5) مَنْ هُوَ الَّذِى زَادَهُمْ ضَلالًا، كَيْفَ."},{"type":"question","text":"     (6) أَيْنَ لَجَأَ أَتْبَاعُ عِيسَى الصَّادِقُونَ لِمَاذَا."}],"paragraphCount":10},{"id":"g4-s5","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"نُزُولُ الْوَحْىِ عَلَى عِيسَى عَلَيْهِ السَّلامُ","description":"ذَهَبَتْ مَرْيَمُ مَعَ ابْنِهَا عِيسَى إِلَى مِصْرَ فَعَاشَ هُنَاكَ اثْنَتَىْ عَشْرَةَ سَنَةً تَعَلَّمَ الْخَطَّ وَدَخَلَ مَدْرَسَةً ابْتِدَائِيَّةً ثُمَّ عَادَا إِلَى أَرْضِ فِلَسْطِينَ.","items":[{"type":"p","text":"ذَهَبَتْ مَرْيَمُ مَعَ ابْنِهَا عِيسَى إِلَى مِصْرَ فَعَاشَ هُنَاكَ اثْنَتَىْ عَشْرَةَ سَنَةً تَعَلَّمَ الْخَطَّ وَدَخَلَ مَدْرَسَةً ابْتِدَائِيَّةً ثُمَّ عَادَا إِلَى أَرْضِ فِلَسْطِينَ."},{"type":"p","text":"بَعْدَ ذَلِكَ نَزَلَ عَلَيْهِ الْوَحْىُ فَصَارَ يَقُولُ لِلنَّاسِ أَيُّهَا النَّاسُ اعْبُدُوا اللَّهَ وَحْدَهُ وَلا تُشْرِكُوا بِهِ شَيْئًا وَءَامِنُوا بِأَنِّى رَسُولُ اللَّهِ إِلَيْكُمْ فَآمَنَ بِهِ اثْنَا عَشَرَ شَخْصًا يُسَمَّوْنَ الْحَوَارِيِّينَ، ثُمَّ وَزَّعَهُمْ عَلَى النَّوَاحِى وَأَمَرَهُمْ بِالدَّعْوَةِ إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَعَدَمِ الإِشْرَاكِ بِهِ."},{"type":"p","text":"عَاشَ سَيِّدُنَا الْمَسِيحُ فِى الأَرْضِ نَحْوَ ثَلاثِينَ عَامًا وَكَانَ يَقْضِى أَيَّامَهُ فِى التَّجْوَالِ لِدَعْوَةِ النَّاسِ إِلَى الإِسْلامِ. وَكَانَ عَلَيْهِ السَّلامُ يَلْبَسُ الشَّعَرَ مِنْ غَيْرِ أَنْ يُنْسَجَ وَيَأْكُلُ مِنَ الشَّجَرِ أَىْ مِنْ بُقُولِ الأَرْضِ وَكَانَ يَبِيتُ حَيْثُ يُدْرِكُهُ الْمَسَاءُ إِمَّا فِى الْمَسْجِدِ بَيْتِ اللَّهِ أَوْ يَبِيتُ فِى الْبَرِّيَّةِ."},{"type":"p","text":"وَقَدْ دَعَا اللَّهَ ذَاتَ يَوْمٍ أَنْ يُحْيِىَ مَلِكًا مِنَ الْمُلُوكِ كَانَ مَيِّتًا مَحْمُولًا عَلَى النَّعْشِ فَأَحْيَاهُ اللَّهُ وَمَسَحَ بِيَدِهِ الشَّرِيفَةِ عَلَى وَجْهِ إِنْسَانٍ وُلِدَ أَعْمَى فَصَارَ بَصِيرًا وَشَفَى إِنْسَانًا أَصَابَهُ الْبَرَصُ."},{"type":"p","text":"وَالْيَهُودُ رَأَوْا كُلَّ هَذَا وَتَحَقَّقُوا وَتَأَكَّدُوا أَنَّهُ نَبِىٌّ وَلَكِنَّهُمْ عَانَدُوا وَتَكَبَّرُوا وَمِنْهُمْ مَنْ كَانَ مُؤْمِنًا مِنْ قَبْلُ وَلَكِنَّهُمْ كَفَرُوا بِتَكْذِيبِهِمْ لِعِيسَى عَلَيْهِ السَّلامُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَمْ سَنَةً عَاشَ الْمَسِيحُ فِى مِصْرَ، مَاذَا تَعَلَّمَ هُنَاكَ وَأَيْنَ رَجَعَ."},{"type":"question","text":"     (2) لَمَّا نَزَلَ عَلَيْهِ الْوَحْىُ مَاذَا قَالَ لِلنَّاسِ، كَمْ شَخْصًا ءَامَنَ بِهِ، مَاذَا يُسَمَّوْنَ."},{"type":"question","text":"     (3) مَاذَا فَعَلَ الْحَوَارِيُّونَ فِى النَّوَاحِى."},{"type":"question","text":"     (4) كَمْ سَنَةً عَاشَ الْمَسِيحُ فِى الأَرْضِ، كَيْفَ كَانَ يَقْضِى أَيَّامَهُ."},{"type":"question","text":"     (5) مَاذَا كَانَ يَأْكُلُ وَمَاذَا كَانَ يَلْبَسُ وَأَيْنَ كَانَ يَبِيتُ."},{"type":"question","text":"     (6) هَلْ تَعْرِفُ بَعْضَ مُعْجِزَاتِ سَيِّدِنَا عِيسَى، مَا هِىَ."},{"type":"question","text":"     (7) مَاذَا فَعَلَ الْيَهُودُ لَمَّا رَأَوْا هَذِهِ الْمُعْجِزَاتِ، لِمَاذَا كَفَرُوا."}],"paragraphCount":12},{"id":"g4-s6","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"قِصَّةُ رَفْعِ الْمَسِيحِ إِلَى السَّمَاءِ","description":"تَآمَرَ الْيَهُودُ عَلَى سَيِّدِنَا عِيسَى عَلَيْهِ السَّلامُ وَأَرَادُوا قَتْلَهُ لَكِنْ قَبْلَ أَنْ يَصِلُوا إِلَيْهِ أَوْحَى اللَّهُ تَعَالَى إِلَيْهِ بِأَنَّهُ سَيَرْفَعُهُ إِلَى السَّمَاءِ فَيُخَلِّصُهُ بِذَلِكَ مِنْ أَذَى الَّذِينَ كَفَرُوا، وَقَبْلَ أَنْ يَدْخُلَ الْيَهُودُ عَلَيْهِ كَانَ مَعَهُ اثْنَا عَشَرَ شَخْصًا مِنْ تَلامِيذِهِ الْمُسْلِمِينَ فَقَدْ أَخْرَجَ ابْنُ أَبِى حَاتِمٍ وَالنَّسَائِىُّ عَنِ ابْنِ عَبَّاسٍ قَالَ كَانَ عِيسَى مَعَ اثْنَىْ عَشَرَ مِنْ أَصْحَابِهِ فِى بَيْتٍ فَقَالَ «إِنَّ مِنْكُمْ مَنْ يَكْفُرُ بِى بَعْدَ أَنْ ءَامَنَ» ثُمَّ قَالَ «أَيُّكُمْ يُلْقَى عَلَيْهِ شَبَهِى وَيُقْتَلُ مَكَانِى فَيَكُونُ رَفِيقِى فِى الْجَنَّةِ» فَقَامَ شَابٌّ أَحَدَثُهُمْ سِنًّا فَقَالَ أَنَا قَالَ «اجْلِسْ» ثُمَّ عَادَ فَعَادَ فَقَالَ «اجْلِسْ» ثُمَّ عَادَ فَعَادَ الثَّالِثَةَ فَقَالَ «أَنْتَ هُوَ». فَأُلْقِىَ عَلَيْهِ شَبَهُهُ فَأُخِذَ الشَّابُّ فَصُلِبَ بَعْدَ أَنْ رُفِعَ عِيسَى مِنْ رَوْزَنَةٍ فِى الْبَيْتِ وَجَاءَ الطَّلَبُ مِنَ الْيَهُودِ وَأَخَذُوا الشَّابَّ فَقَتَلُوهُ وَصَلَبُوهُ قَتَلُوا هَذَا الشَّابَّ الْمُسْلِمَ الْمُؤْمِنَ وَأَذَاعُوا أَنَّهُمْ قَتَلُوا الْمَسِيحَ وَصَلَبُوهُ فَصَدَّقَهُمْ بَعْضُ النَّاسِ قَالَ اللَّهُ تَعَالَى ﴿وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَكِنْ شُبِّهَ لَهُمْ﴾ [سُورَةَ النِّسَاء/157].","items":[{"type":"p","text":"تَآمَرَ الْيَهُودُ عَلَى سَيِّدِنَا عِيسَى عَلَيْهِ السَّلامُ وَأَرَادُوا قَتْلَهُ لَكِنْ قَبْلَ أَنْ يَصِلُوا إِلَيْهِ أَوْحَى اللَّهُ تَعَالَى إِلَيْهِ بِأَنَّهُ سَيَرْفَعُهُ إِلَى السَّمَاءِ فَيُخَلِّصُهُ بِذَلِكَ مِنْ أَذَى الَّذِينَ كَفَرُوا، وَقَبْلَ أَنْ يَدْخُلَ الْيَهُودُ عَلَيْهِ كَانَ مَعَهُ اثْنَا عَشَرَ شَخْصًا مِنْ تَلامِيذِهِ الْمُسْلِمِينَ فَقَدْ أَخْرَجَ ابْنُ أَبِى حَاتِمٍ وَالنَّسَائِىُّ عَنِ ابْنِ عَبَّاسٍ قَالَ كَانَ عِيسَى مَعَ اثْنَىْ عَشَرَ مِنْ أَصْحَابِهِ فِى بَيْتٍ فَقَالَ «إِنَّ مِنْكُمْ مَنْ يَكْفُرُ بِى بَعْدَ أَنْ ءَامَنَ» ثُمَّ قَالَ «أَيُّكُمْ يُلْقَى عَلَيْهِ شَبَهِى وَيُقْتَلُ مَكَانِى فَيَكُونُ رَفِيقِى فِى الْجَنَّةِ» فَقَامَ شَابٌّ أَحَدَثُهُمْ سِنًّا فَقَالَ أَنَا قَالَ «اجْلِسْ» ثُمَّ عَادَ فَعَادَ فَقَالَ «اجْلِسْ» ثُمَّ عَادَ فَعَادَ الثَّالِثَةَ فَقَالَ «أَنْتَ هُوَ». فَأُلْقِىَ عَلَيْهِ شَبَهُهُ فَأُخِذَ الشَّابُّ فَصُلِبَ بَعْدَ أَنْ رُفِعَ عِيسَى مِنْ رَوْزَنَةٍ فِى الْبَيْتِ وَجَاءَ الطَّلَبُ مِنَ الْيَهُودِ وَأَخَذُوا الشَّابَّ فَقَتَلُوهُ وَصَلَبُوهُ قَتَلُوا هَذَا الشَّابَّ الْمُسْلِمَ الْمُؤْمِنَ وَأَذَاعُوا أَنَّهُمْ قَتَلُوا الْمَسِيحَ وَصَلَبُوهُ فَصَدَّقَهُمْ بَعْضُ النَّاسِ قَالَ اللَّهُ تَعَالَى ﴿وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَكِنْ شُبِّهَ لَهُمْ﴾ [سُورَةَ النِّسَاء/157]."},{"type":"p","text":"وَفِى الْحَقِيقَةِ سَيِّدُنَا عِيسَى لَمْ يُقْتَلْ وَلَمْ يُصْلَبْ وَلا يَزَالُ حَيًّا فِى السَّمَاءِ، وَقَبْلَ يَوْمِ الْقِيَامَةِ يَنْزِلُ إِلَى الأَرْضِ وَيَعِيشُ أَرْبَعِينَ سَنَةً وَيَعُمُّ الإِسْلامُ الأَرْضَ بَعْدَ نُزُولِهِ وَيَحْكُمُ عَلَيْهِ السَّلامُ بِشَرِيعَةِ الْقُرْءَانِ شَرِيعَةِ سَيِّدِنَا مُحَمَّدٍ ﷺ. وَقَدْ فَسَّرَ سَيِّدُنَا مُحَمَّدٌ ﷺ قَوْلَ اللَّهِ تَعَالَى ﴿وَإِنَّهُ لَعِلْمٌ لِّلسَّاعَةِ﴾ [سُورَةَ الزُّخْرُف/61] بِأَنَّهُ نُزُولُ عِيسَى بنِ مَرْيَمَ قَبْلَ يَوْمِ الْقِيَامَةِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) بَعْدَ أَنْ تَآمَرَ الْيَهُودُ عَلَى قَتْلِ سَيِّدِنَا عِيسَى كَيْفَ نَجَّاهُ اللَّهُ مِنْ شَرِّهِمْ."},{"type":"question","text":"     (2)  كَمْ شَخْصًا مِنَ الْمُسْلِمِينَ كَانَ مَعَ سَيِّدِنَا عِيسَى قَبْلَ دُخُولِ الْيَهُودِ."},{"type":"question","text":"     (3) مَاذَا قَالَ لَهُمْ سَيِّدُنَا عِيسَى، مَاذَا فَعَلَ أَحَدَثُهُمْ سِنًّا."},{"type":"question","text":"     (4) بَعْدَ أَنْ رُفِعَ سَيِّدُنَا عِيسَى مَاذَا حَصَلَ لِلشَّابِّ الْمُسْلِمِ، مَنْ قَتَلَهُ."},{"type":"question","text":"     (5) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ الْكَرِيمِ عَلَى أَنَّ سَيِّدَنَا عِيسَى لَمْ يُقْتَلْ وَلَمْ يُصْلَبْ، فِى أَيَّةِ سُورَةٍ."},{"type":"question","text":"     (6) أَيْنَ هُوَ سَيِّدُنَا عِيسَى الآنَ، مَتَى يَنْزِلُ إِلَى الأَرْضِ، كَمْ سَنَةً يَعِيشُ فِيهَا."},{"type":"question","text":"     (7) مَاذَا يَحْصُلُ بَعْدَ نُزُولِهِ إِلَى الأَرْضِ."},{"type":"question","text":"     (8) مَا الدَّلِيلُ مِنْ كِتَابِ اللَّهِ عَلَى نُزُولِ سَيِّدِنَا عِيسَى قَبْلَ يَوْمِ الْقِيَامَةِ، فِى أَيَّةِ سُورَةٍ."}],"paragraphCount":10},{"id":"g4-s7","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"وُجُوبُ اتِّبَاعِ عِيسَى عَلَيْهِ السَّلامُ فِى زَمَانِهِ","description":"بَعْدَ ثَلاثِمِائَةِ سَنَةٍ مِنْ رَفْعِ عِيسَى إِلَى السَّمَاءِ كَثُرَ الَّذِينَ حَرَّفُوا دِينَ الْمَسِيحِ وَقَلَّ الآخَرُونَ الَّذِينَ كَانُوا عَلَى الإِسْلامِ قِلَّةً ظَاهِرَةً ثُمَّ بَعْدَ خَمْسِمِائَةِ سَنَةٍ وَشَىْءٍ لَمْ يَبْقَ أَحَدٌ مِنْ أُولَئِكَ الْمُسْلِمِينَ الْمُؤْمِنِينَ.","items":[{"type":"p","text":"بَعْدَ ثَلاثِمِائَةِ سَنَةٍ مِنْ رَفْعِ عِيسَى إِلَى السَّمَاءِ كَثُرَ الَّذِينَ حَرَّفُوا دِينَ الْمَسِيحِ وَقَلَّ الآخَرُونَ الَّذِينَ كَانُوا عَلَى الإِسْلامِ قِلَّةً ظَاهِرَةً ثُمَّ بَعْدَ خَمْسِمِائَةِ سَنَةٍ وَشَىْءٍ لَمْ يَبْقَ أَحَدٌ مِنْ أُولَئِكَ الْمُسْلِمِينَ الْمُؤْمِنِينَ."},{"type":"p","text":"وَقَوْمُ مُوسَى مَا ثَبَتُوا عَلَى الإِسْلامِ كَمَا ثَبَتَتْ أُمَّةُ مُحَمَّدٍ، أُمَّةُ مُحَمَّدٍ ثَبَتَتْ عَلَى الإِسْلامِ أَكْثَرَ مِنْ أَلْفٍ وَأَرْبَعِمِائَةِ سَنَةٍ إِلَى الآنَ، قِسْمٌ كَبِيرٌ مِنْ قَوْمِ مُوسَى كَفَرُوا بَعْدَ مِئَاتٍ مِنَ السِّنِينَ وَحَرَّفُوا دِينَهُ وَلَمَّا جَاءَ الْمَسِيحُ كَذَّبُوهُ وَأَنْكَرُوا نُبُوَّتَهُ."},{"type":"p","text":"الْعِبَادُ عَلَيْهِمْ أَنْ يُصَدِّقُوا بِالنَّبِىِّ الَّذِى يَأْتِى بَعْدَ النَّبِىِّ السَّابِقِ، لا يَجُوزُ لَهُمْ أَنْ يَقُولُوا لَهُ نَحْنُ كُنَّا تَابِعِينَ لِلنَّبِىِّ السَّابِقِ فَنَحْنُ لا نَعْتَرِفُ بِكَ، فَكَانَ يَجِبُ عَلَيْهِمْ لَمَّا ظَهَرَ الْمَسِيحُ وَأَظْهَرَ الْمُعْجِزَاتِ أَنْ يَتَّبِعُوهُ."},{"type":"p","text":"وَالأَنْبِيَاءُ عَلَيْهِمُ السَّلامُ لا يُكَذِّبُ بَعْضُهُمْ بَعْضًا، كُلُّ وَاحِدٍ مِنْهُمْ كَانَ يَأْمُرُ بِتَصْدِيقِ سَائِرِ الأَنْبِيَاءِ وَعَلَى النَّاسِ أَنْ يَتَّبِعُوا شَرِيعَةَ النَّبِىِّ الَّذِى فِى زَمَنِهِمْ."},{"type":"p","text":"أَمَّا الدِّينُ الَّذِى أَنْزَلَهُ اللَّهُ فَوَاحِدٌ وَالْعَقِيدَةُ وَاحِدَةٌ وَهِىَ الإِيـمَانُ بِاللَّهِ وَبِالرَّسُولِ الَّذِى أَرْسَلَهُ اللَّهُ وَالْمَلائِكَةِ وَالْيَوْمِ الآخِرِ وَالْكُتُبِ السَّمَاوِيَّةِ الَّتِى أَنْزَلَهَا اللَّهُ عَلَى بَعْضِ أَنْبِيَائِهِ وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ أَىْ أَنَّ كُلَّ مَا يَحْصُلُ فِى هَذَا الْعَالَمِ مِنْ خَيْرٍ وَشَرٍّ فَهُوَ بِتَقْدِيرِ اللَّهِ فَالْخَيْرُ مِنْ أَعْمَالِ الْعِبَادِ بِمَحَبَّتِهِ وَرِضَاهُ وَالشَّرُّ مِنْ أَعْمَالِ الْعِبَادِ لا بِمَحَبَّتِهِ وَلا بِرِضَاهُ وَأَنَّ اللَّهَ هُوَ خَالِقُ كُلِّ شَىْءٍ وَأَنَّهُ لا يُشْبِهُ الْمَخْلُوقَاتِ. فَكُلُّ هَذِهِ الأُمُورِ يَجِبُ عَلَى كُلِّ مُكَلَّفٍ التَّصْدِيقُ بِهَا. وَالْمُكَلَّفُ هُوَ الْبَالِغُ الْعَاقِلُ الَّذِى بَلَغَتْهُ دَعْوَةُ الإِسْلامِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَتَى كَثُرَ الَّذِينَ حَرَّفُوا دِينَ الْمَسِيحِ أَىِ الإِسْلامَ."},{"type":"question","text":"     (2) بَعْدَ كَمْ سَنَةٍ مِنْ رَفْعِ الْمَسِيحِ لَمْ يَبْقَ أَحَدٌ مِنْ أَتْبَاعِهِ."},{"type":"question","text":"     (3) قَوْمُ مُوسَى هَلْ ثَبَتُوا عَلَى الإِسْلامِ، كَيْفَ."},{"type":"question","text":"     (4) هَلْ تَحْفَظُ دَلِيلًا مِنَ الْقُرْءَانِ عَلَى أَنَّ الدِّينَ الصَّحِيحَ هُوَ الإِسْلامُ."},{"type":"question","text":"     (5) مَا هِىَ عَقِيدَةُ كُلِّ الأَنْبِيَاءِ."},{"type":"question","text":"     (6) هَلْ تَعْرِفُ مَنْ هُوَ الْمُكَلَّفُ."}],"paragraphCount":11},{"id":"g4-s8","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"مِنْ وَصَايَا سَيِّدِنَا الْمَسِيحِ","description":"كَانَ مِنْ جُمْلَةِ وَصَايَا الْمَسِيحِ لِأَتْبَاعِهِ أَنَّهُ قَالَ لَهُمْ إِنَّهُ يَأْتِى بَعْدِى نَبِىٌّ اسْمُهُ أَحْمَدُ فَآمِنُوا بِهِ وَاتَّبِعُوهُ إِذَا ظَهَرَ وَكَانَ مِمَّنْ سَمِعَ وَصِيَّةَ الْمَسِيحِ وَاحِدٌ مِنَ الْجِنِّ الْمُؤْمِنِينَ وَهُوَ أَخْبَرَ بِذَلِكَ جَمَاعَةً مِنَ الْبَشَرِ مِنَ الْيَمَنِ كَانُوا خَرَجُوا مِنْ بِلادِهِمْ وَنَزَلُوا بِأَرْضٍ قَبْلَ أَنْ يَظْهَرَ اسْمُ رَسُولِ اللَّهِ مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فِى الدُّنْيَا ظُهُورًا تَامًّا. ثُمَّ أَدْرَكَهُمُ الْمَبِيتُ بِالْبَرِّيَّةِ وَفِى ءَاخِرِ اللَّيْلِ سَمِعَ أَحَدُهُمْ وَهُوَ الْجَعْدُ ابْنُ قَيْسٍ صَوْتَ هَاتِفٍ أَىْ صَوْتَ الْجِنِّىِّ مِنْ غَيْرِ أَنْ يَرَى شَخْصَهُ يَقُولُ","items":[{"type":"p","text":"كَانَ مِنْ جُمْلَةِ وَصَايَا الْمَسِيحِ لِأَتْبَاعِهِ أَنَّهُ قَالَ لَهُمْ إِنَّهُ يَأْتِى بَعْدِى نَبِىٌّ اسْمُهُ أَحْمَدُ فَآمِنُوا بِهِ وَاتَّبِعُوهُ إِذَا ظَهَرَ وَكَانَ مِمَّنْ سَمِعَ وَصِيَّةَ الْمَسِيحِ وَاحِدٌ مِنَ الْجِنِّ الْمُؤْمِنِينَ وَهُوَ أَخْبَرَ بِذَلِكَ جَمَاعَةً مِنَ الْبَشَرِ مِنَ الْيَمَنِ كَانُوا خَرَجُوا مِنْ بِلادِهِمْ وَنَزَلُوا بِأَرْضٍ قَبْلَ أَنْ يَظْهَرَ اسْمُ رَسُولِ اللَّهِ مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فِى الدُّنْيَا ظُهُورًا تَامًّا. ثُمَّ أَدْرَكَهُمُ الْمَبِيتُ بِالْبَرِّيَّةِ وَفِى ءَاخِرِ اللَّيْلِ سَمِعَ أَحَدُهُمْ وَهُوَ الْجَعْدُ ابْنُ قَيْسٍ صَوْتَ هَاتِفٍ أَىْ صَوْتَ الْجِنِّىِّ مِنْ غَيْرِ أَنْ يَرَى شَخْصَهُ يَقُولُ"},{"type":"p","text":"أَلا أَيُّهَا الرَّكْبُ الْمُعَرِّسُ [أَىِ النَّازِلُ بِاللَّيْلِ] بَلِّغُوا\t      إِذَا مَا وَقَفْتُمْ بِالْحَطِيمِ [مَكَانٌ فِى مَكَّةَ] وَزَمْزَمَا"},{"type":"p","text":"       مُحَمَّدًا الْمَبْعُوثَ مِنَّا تَحِيَّةً\t      \t            \t\tتُشَيِّعُهُ مِنْ حَيْثُ سَارَ وَيَمَّمَا"},{"type":"p","text":"وَقُولُوا لَهُ إِنَّا لِدِينِكَ شِيعَةٌ [أَىْ أَنْصَارٌ]\t      \t\tبِذَلِكَ أَوْصَانَا الْمَسِيحُ ابْنُ مَرْيَمَا"},{"type":"p","text":"وَهَذَا الْجِنِّىُّ كَانَ مُؤْمِنًا أَدْرَكَ الْمَسِيحَ قَبْلَ أَنْ يَصْعَدَ إِلَى السَّمَاءِ وَسَمِعَ كَلامَهُ فَآمَنَ وَأَسْلَمَ. ثُمَّ عَرَفَ سَيِّدَنَا مُحَمَّدًا ﷺ وَشَاهَدَهُ وَءَامَنَ بِهِ قَبْلَ أَنْ يَعْرِفَهُ هَؤُلاءِ النَّاسُ الَّذِينَ كَانُوا مُتَوَجِّهِينَ مِنَ الْيَمَنِ إِلَى مَكَّةَ لِأُمُورٍ دُنْيَوِيَّةٍ."},{"type":"p","text":"وَأَمَّا هَذَا الَّذِى سَمِعَ الْهَاتِفَ لَمَّا دَخَلَ إِلَى مَكَّةَ سَأَلَ عَنِ النَّبِىِّ حَتَّى دُلَّ عَلَيْهِ فَاجْتَمَعَ بِهِ وَءَامَنَ بِهِ وَأَسْلَمَ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَا هِىَ وَصِيَّةُ سَيِّدِنَا الْمَسِيحِ عَلَيْهِ السَّلامُ لِأَتْبَاعِهِ الْمُسْلِمِينَ."},{"type":"question","text":"     (2) هَلْ سَمِعَ أَحَدُ الْجِنِّ هَذِهِ الْوَصِيَّةَ، مَنْ أَخْبَرَ بِهَا، أَيْنَ كَانَ هَؤُلاءِ الْبَشَرُ."},{"type":"question","text":"     (3) مَا اسْمُ الرَّجُلِ الَّذِى سَمِعَ صَوْتَ الْجِنِّىِّ الَّذِى كَانَ يُنْشِدُ."},{"type":"question","text":"     (4) هَلْ تَحْفَظُ مَا قَالَ."},{"type":"question","text":"     (5) مَاذَا فَعَلَ الرَّجُلُ الَّذِى سَمِعَ الْهَاتِفَ."}],"paragraphCount":11},{"id":"g4-s9","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"قِصَّةُ أَصْحَابِ الْفِيلِ","description":"وُلِدَ رَسُولُ اللَّهِ ﷺ فِى الْعَامِ الَّذِى غَزَا فِيهِ أَبْرَهَةُ الْحَبَشِىُّ الْكَعْبَةَ فَأَهْلَكَهُ اللَّهُ وَجَيْشَهُ قَبْلَ أَنْ يَدْخُلَ مَكَّةَ.","items":[{"type":"p","text":"وُلِدَ رَسُولُ اللَّهِ ﷺ فِى الْعَامِ الَّذِى غَزَا فِيهِ أَبْرَهَةُ الْحَبَشِىُّ الْكَعْبَةَ فَأَهْلَكَهُ اللَّهُ وَجَيْشَهُ قَبْلَ أَنْ يَدْخُلَ مَكَّةَ."},{"type":"p","text":"وَكَانَ أَبْرَهَةُ قَدْ بَنَى فِى الْيَمَنِ كَنِيسَةً سَمَّاهَا الْقُلَّيْس فَلَمَّا وَجَدَ أَنَّ قُلُوبَ الْعَرَبِ مَا زَالَتْ مُتَعَلِّقَةً بِالْكَعْبَةِ سَارَ بِجُنُودِهِ إِلَيْهَا لِيَهْدِمَهَا وَكَانَ مَعَهُ فِيلٌ كَبِيرٌ فَلَمَّا دَنَا مِنْ مَكَّةَ أَمَرَ أَصْحَابَهُ بِالْغَارَةِ عَلَى الْمَوَاشِى فَأَصَابُوا إِبِلًا لِعَبْدِ الْمُطَّلِبِ وَبَعَثَ أَحَدَ جُنُودِهِ إِلَى مَكَّةَ فَلَقِىَ عَبْدَ الْمُطَّلِبِ بنَ هَاشِمٍ فَقَالَ إِنَّ الْمَلِكَ أَرْسَلَنِى إِلَيْكَ لِأُخْبِرَكَ بِأَنَّهُ لَمْ يَأْتِ لِقِتَالٍ إِلَّا أَنْ تُقَاتِلُوهُ وَإِنَّمَا جَاءَ لِهَدْمِ هَذَا الْبَيْتِ ثَمَّ يَنْصَرِفُ عَنْكُمْ فَقَالَ عَبْدُ الْمُطَّلِبِ «مَا لَهُ عِنْدَنَا قِتَالٌ وَمَا لَنَا بِهِ يَدٌ إِنَّا سَنُخْلِى بَيْنَهُ وَبَيْنَ مَا جَاءَ لَهُ»."},{"type":"p","text":"رَجَعَ مَبْعُوثُ أَبْرَهَةَ وَمَعَهُ عَبْدُ الْمُطَّلِبِ إِلَى أَبْرَهَةَ فَلَمَّا دَخَلَ عَبْدُ الْمُطَّلِبِ عَلَى أَبْرَهَةَ عَظَّمَهُ وَكَرَّمَهُ ثُمَّ قَالَ لِتَرْجُمَانِهِ قُلْ لَهُ مَا حَاجَتُكَ إِلَى الْمَلِكِ فَسَأَلَهُ التَّرْجُمَانُ فَقَالَ «حَاجَتِى أَنْ يَرُدَّ عَلَىَّ مِائَتَىْ بَعِيرٍ أَصَابَهَا». "},{"type":"p","text":"فَقَالَ أَبْرَهَةُ لِتَرْجُمَانِهِ قُلْ لَهُ لَقَدْ كُنْتَ أَعْجَبْتَنِى حِينَ رَأَيْتُكَ وَلَقَدْ زَهِدْتُ الآنَ فِيكَ جِئْتُ إِلَى بَيْتٍ هُوَ دِينُكَ لِأَهْدِمَهُ فَلَمْ تُكَلِّمْنِى فِيهِ وَتُكَلِّمُنِى فِي إِبِلٍ أَصَبْتُهَا. "},{"type":"p","text":"فَقَالَ عَبْدُ الْمُطَّلِبِ «أَنَا صَاحِبُ هَذِهِ الإِبِلِ وَلِهَذَا الْبَيْتِ رَبٌّ سَيَمْنَعُهُ» فَأَمَرَ بِإِبِلِهِ فَرُدَّتْ عَلَيْهِ فَخَرَجَ فَأَخْبَرَ قُرَيْشًا وَأَمَرَهُمْ أَنْ يَتَفَرَّقُوا فِى الشِّعَابِ وَرُءُوسِ الْجِبَالِ خَوْفًا مِنْ أَذَى الْجَيْشِ إِذَا دَخَلَ فَفَعَلُوا."},{"type":"p","text":"أَصْبَحَ أَبْرَهَةُ بَعْدَ أَنْ كَلَّمَهُ عَبْدُ الْمُطَّلِبِ مُتَهَيِّئًا لِدُخُولِ مَكَّةَ فَبَرَكَ الْفِيلُ فَحَرَّكُوهُ لِلنُّهُوضِ فَأَبَى فَضَرَبُوهُ فَأَبَى فَوَجَّهُوهُ إِلَى الْيَمَنِ رَاجِعًا فَقَامَ يُهَرْوِلُ وَوَجَّهُوهُ إِلَى الشَّامِ فَفَعَلَ مِثْلَ ذَلِكَ وَإِلَى الْمَشْرِقِ فَفَعَلَ مِثْلَ ذَلِكَ فَوَجَّهُوهُ إِلَى الْحَرَمِ فَأَبَى وَأَرْسَلَ اللَّهُ طَيْرًا مِنَ الْبَحْرِ جَمَاعَاتٍ جَمَاعَاتٍ. "},{"type":"p","text":"وَكَانَ مَعَ كُلِّ طَيْرٍ ثَلاثَةُ أَحْجَارٍ حَجَرَانِ فِى رِجْلَيْهِ وَحَجَرٌ فِى مِنْقَارِهِ وَكَانَ كُلُّ حَجَرٍ فَوْقَ حَبَّةِ الْعَدَسِ وَدُونَ حَبَّةِ الْحِمَّصِ مَكْتُوبٌ عَلَى كُلِّ حَجَرٍ اسْمُ رَجُلٍ مِنْ جَيْشِ أَبْرَهَةَ يَنْزِلُ عَلَى رَأْسِهِ وَيَخْرُجُ مِنْ دُبُرِهِ فَهَلَكُوا وَلَمْ يَدْخُلُوا الْحَرَمَ. "},{"type":"p","text":"وَمِرِضَ أَبْرَهَةُ فَتَقَطَّعَ أَنْمُلَةً أَنْمُلَةً وَمَا مَاتَ حَتَّى انْصَدَعَ صَدْرُهُ عَنْ قَلْبِهِ. وَقِيلَ كَانَ الْعَسْكَرُ سِتِّينَ أَلْفًا لَمْ يَرْجِعْ مِنْهُمْ إِلَّا أَمِيرُهُمْ فِى مَجْمُوعَةٍ قَلِيلَةٍ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَتَى وُلِدَ رَسُولُ اللَّهِ ﷺ وَأَيْنَ."},{"type":"question","text":"     (2) مَنْ هُوَ أَبْرَهَةُ، مَاذَا فَعَلَ."},{"type":"question","text":"     (3) لَمَّا دَخَلَ عَبْدُ الْمُطَّلِبِ عَلَى أَبْرَهَةَ مَاذَا حَصَلَ."},{"type":"question","text":"     (4) كَيْفَ حَاوَلَ أَبْرَهَةُ أَنْ يَهْدِمَ الْكَعْبَةَ، مَاذَا فَعَلَ الْفِيلُ."},{"type":"question","text":"     (5) مَا هِىَ قِصَّةُ الطُّيُورِ الَّتِى جَاءَتْ مِنَ الْبَحْرِ، مَاذَا كَانَ مَعَهَا، مَاذَا فَعَلَتْ بِجَيْشِ أَبْرَهَةَ."},{"type":"question","text":"     (6) كَيْفَ مَاتَ أَبْرَهَةُ، كَمْ كَانَ عَدَدُ جَيْشِهِ."}],"paragraphCount":14},{"id":"g4-s10","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"ذِكْرُ رَضَاعَتِهِ ﷺ","description":"","items":[],"paragraphCount":0},{"id":"g4-s11","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"حَلِيمَةُ السَّعْدِيَّةُ (1)","description":"وَلَدَتْ ءَامِنَةُ رَسُولَ اللَّهِ ﷺ فِى عَامِ الْفِيلِ وَأَرْضَعَتْهُ أَوَّلَ الأَمْرِ. وَكَانَ مِنْ عَادَةِ الْعَرَبِ أَنْ يَجْلِبُوا الْمُرْضِعَاتِ لِأَوْلادِهِمْ وَكَانَ بَنُو سَعْدٍ فِى ضِيقٍ مِنَ الْعَيْشِ فَقَدِمُوا إِلَى قَبِيلَةِ قُرَيْشٍ لِيَأْخُذُوا الأَوْلادَ لِلإِرْضَاعِ بِالأُجْرَةِ فَعُرِضَ النَّبِىُّ ﷺ عَلَى الْمُرْضِعَاتِ فَلَمْ تَرْضَ وَاحِدَةٌ مِنْهُنَّ بِأَخْذِهِ لِأَنَّهُ كَانَ يَتِيمًا وَكَانَتْ كُلُّ مُرْضِعَةٍ تَأْمَلُ أَنْ تَحْظَى بِوَلَدٍ مِنْ أَوْلادِ الأَغْنِيَاءِ فَأَخَذَتْ كُلُّ مُرْضِعَةٍ وَلَدًا وَلَمْ يَبْقَ سِوَى النَّبِىِّ ﷺ فَأَخَذَتْهُ حَلِيمَةُ.","items":[{"type":"p","text":"وَلَدَتْ ءَامِنَةُ رَسُولَ اللَّهِ ﷺ فِى عَامِ الْفِيلِ وَأَرْضَعَتْهُ أَوَّلَ الأَمْرِ. وَكَانَ مِنْ عَادَةِ الْعَرَبِ أَنْ يَجْلِبُوا الْمُرْضِعَاتِ لِأَوْلادِهِمْ وَكَانَ بَنُو سَعْدٍ فِى ضِيقٍ مِنَ الْعَيْشِ فَقَدِمُوا إِلَى قَبِيلَةِ قُرَيْشٍ لِيَأْخُذُوا الأَوْلادَ لِلإِرْضَاعِ بِالأُجْرَةِ فَعُرِضَ النَّبِىُّ ﷺ عَلَى الْمُرْضِعَاتِ فَلَمْ تَرْضَ وَاحِدَةٌ مِنْهُنَّ بِأَخْذِهِ لِأَنَّهُ كَانَ يَتِيمًا وَكَانَتْ كُلُّ مُرْضِعَةٍ تَأْمَلُ أَنْ تَحْظَى بِوَلَدٍ مِنْ أَوْلادِ الأَغْنِيَاءِ فَأَخَذَتْ كُلُّ مُرْضِعَةٍ وَلَدًا وَلَمْ يَبْقَ سِوَى النَّبِىِّ ﷺ فَأَخَذَتْهُ حَلِيمَةُ."},{"type":"p","text":"وَقَدْ ذَكَرَتْ حَلِيمَةُ أَمْرَ رَضَاعِهِ مِنْهَا عَلَيْهِ الصَّلاةُ وَالسَّلامُ فَقَالَتْ خَرَجْتُ فِى نِسْوَةٍ مِنْ بَنِى سَعْدِ ابْنِ بَكْرٍ نَلْتَمِسُ الرُّضَعَاءَ بِمَكَّةَ عَلَى أَتَانٍ لِى [أَىْ أُنْثَى الْحِمَارِ] فِى سَنَةِ قَحْطٍ لَمْ تُبْقِ لَنَا شَيْئًا وَمَعِى زَوْجِي وَمَعَنَا نَاقَةٌ وَاللَّهِ لا نَحْلُبُ مِنْهَا قَطْرَةَ لَبَنٍ وَاحِدَةً وَمَعِى صَبِىٌّ لِى لا نَنَامُ لَيْلَتَنَا مِنْ بُكَائِهِ وَمَا فِى ثَدْيَىَّ مَا يُشْبِعُهُ. فَلَمَّا قَدِمْنَا مَكَّةَ لَمْ يَبْقَ مِنَّا امْرَأَةٌ إِلَّا عُرِضَ عَلَيْهَا رَسُولُ اللَّهِ ﷺ فَتَأْبَاهُ لِأَنَّنَا كُنَّا نَرْجُو كَرَامَةَ الرَّضَاعَةِ مِنَ الْوَالِدِ وَكَانَ ﷺ يَتِيمًا وَكُنَّا نَقُولُ يَتِيمٌ مَا عَسَى أَنْ تَصْنَعَ أُمُّهُ بِهِ حَتَّى لَمْ يَبْقَ مِنْ صَوَاحِبِى امْرَأَةٌ إِلَّا أَخَذَتْ صَبِيًّا غَيْرِى فَكَرِهْتُ أَنْ أَرْجَعَ وَلَمْ ءَاخُذْ شَيْئًا وَقَدْ أَخَذَتْ صَوَاحِبِى فَقُلْتُ لِزَوْجِى وَاللَّهِ لَأَرْجِعَنَّ إِلَى ذَلِكَ الْيَتِيمِ فَلَآخُذَنَّهُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) هَلْ أَرْضَعَتْ ءَامِنَةُ الرَّسُولَ أَوَّلَ الأَمْرِ."},{"type":"question","text":"     (2) لِمَاذَا لَمْ تَرْضَ الْمُرْضِعَاتُ أَنْ تَأْخُذَ الرَّسُولَ، مَا مَعْنَى يَتِيمٍ."},{"type":"question","text":"     (3) مَا اسْمُ مُرْضِعَةِ الرَّسُولِ، مِنْ أَىِّ قَبِيلَةٍ."},{"type":"question","text":"   (4) كَيْفَ أَخَذَتْ حَلِيمَةُ النَّبِىَّ لإِرْضَاعِهِ، مَاذَا قَالَتْ لِزَوْجِهَا."}],"paragraphCount":6},{"id":"g4-s12","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"ذِكْرُ رَضَاعَتِهِ ﷺ","description":"","items":[],"paragraphCount":0},{"id":"g4-s13","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"حَلِيمَةُ السَّعْدِيَّةُ (2)","description":"قَالَتْ حَلِيمَةُ فَأَتَيْتُهُ فَأَخَذَتْهُ وَرَجَعْتُ إِلَى رَحْلِى فَقَالَ زَوْجِى قَدْ أَخَذْتِهِ فَقُلْتُ نَعَمْ وَاللَّهِ وَذَلِكَ أَنِّى لَمْ أَجِدْ غَيْرَهُ فَقَالَ أَصَبْتِ فَلَعَلَّ اللَّهَ أَنْ يَجْعَلَ فِيهِ خَيْرًا. قَالَتْ حَلِيمَةُ السَّعْدِيَّةُ فَوَاللَّهِ مَا هُوَ إِلَّا أَنْ جَعَلْتُهُ فِى حِجْرِى حَتَّى أَقْبَلَ عَلَى ثَدْيِى بِمَا شَاءَ اللَّهُ مِنَ اللَّبَنِ فَشَرِبَ حَتَّى رَوِىَ وَشَرِبَ أَخُوهُ (تَعْنِى ابْنَهَا) حَتَّى رَوِىَ وَقَامَ زَوْجِى إِلَى نَاقَتِنَا مِنَ اللَّيْلِ فَإِذَا بِهَا حَافِلٌ [أَىْ ضَرْعُهَا مَلْآنُ بِاللَّبَنِ]، فَحَلَبْنَا مِنَ اللَّبَنِ مَا شِئْنَا وَشَرِبْنَا حَتَّى رَوِينَا وَبِتْنَا لَيْلَتَنَا تِلْكَ شِبَاعًا وَقَدْ نَامَ صَبِيَّانَا. فَقَالَ لِى زَوْجِى وَاللَّهِ يَا حَلِيمَةُ مَا أَرَاكِ إِلَّا قَدْ أَصَبْتِ نَسَمَةً مُبَارَكَةً وَقَدْ نَامَ صَبِيَّانَا وَرَوِيَا. قَالَتْ ثُمَّ خَرَجْنَا فَسَبَقَتْ حِمَارَتِى الرَّكْبَ كُلَّهُ حَتَّى إِنَّهُمْ لَيَقُولُونَ وَيْحَكِ تَمَهَّلِى أَلَيْسَتْ هَذِهِ حِمَارَتُكِ الَّتِى خَرَجْتِ عَلَيْهَا فَأَقُولُ بَلَى وَاللَّهِ وَهِىَ لا تَزَالُ قُدَّامَنَا حَتَّى قَدِمْنَا مَنَازِلَنَا مِنْ حَاضِرِ بَنِي سَعْدِ بنِ بَكْرٍ فَقَدِمْنَا عَلَى أَجْدَبِ أَرْضٍ [وَالْجَدْبُ ضِدُّ الْخِصْبِ] فَوَالَّذِى نَفْسُ حَلِيمَةَ بِيَدِهِ إِنْهُمْ كَانُوا لَيَسْرَحُونَ أَغْنَامَهُمْ إِذَا أَصْبَحُوا وَيَسْرَحُ رَاعِى غَنَمِى فَتَرْجِعُ غَنَمِى سَمِينَةً ضُرُوعُهَا مَلِيئَةٌ بِاللَّبَنِ وَتَرْجِعُ أَغْنَامُهُمْ جِيَاعًا مَا بِهَا مِنَ اللَّبَنِ فَنَشْرَبُ مَا شِئْنَا مِنَ اللَّبَنِ وَمَا فِى الْحَاضِرِ أَحَدٌ يَحْلُبُ قَطْرَةً وَلا يَجِدُهَا.","items":[{"type":"p","text":"قَالَتْ حَلِيمَةُ فَأَتَيْتُهُ فَأَخَذَتْهُ وَرَجَعْتُ إِلَى رَحْلِى فَقَالَ زَوْجِى قَدْ أَخَذْتِهِ فَقُلْتُ نَعَمْ وَاللَّهِ وَذَلِكَ أَنِّى لَمْ أَجِدْ غَيْرَهُ فَقَالَ أَصَبْتِ فَلَعَلَّ اللَّهَ أَنْ يَجْعَلَ فِيهِ خَيْرًا. قَالَتْ حَلِيمَةُ السَّعْدِيَّةُ فَوَاللَّهِ مَا هُوَ إِلَّا أَنْ جَعَلْتُهُ فِى حِجْرِى حَتَّى أَقْبَلَ عَلَى ثَدْيِى بِمَا شَاءَ اللَّهُ مِنَ اللَّبَنِ فَشَرِبَ حَتَّى رَوِىَ وَشَرِبَ أَخُوهُ (تَعْنِى ابْنَهَا) حَتَّى رَوِىَ وَقَامَ زَوْجِى إِلَى نَاقَتِنَا مِنَ اللَّيْلِ فَإِذَا بِهَا حَافِلٌ [أَىْ ضَرْعُهَا مَلْآنُ بِاللَّبَنِ]، فَحَلَبْنَا مِنَ اللَّبَنِ مَا شِئْنَا وَشَرِبْنَا حَتَّى رَوِينَا وَبِتْنَا لَيْلَتَنَا تِلْكَ شِبَاعًا وَقَدْ نَامَ صَبِيَّانَا. فَقَالَ لِى زَوْجِى وَاللَّهِ يَا حَلِيمَةُ مَا أَرَاكِ إِلَّا قَدْ أَصَبْتِ نَسَمَةً مُبَارَكَةً وَقَدْ نَامَ صَبِيَّانَا وَرَوِيَا. قَالَتْ ثُمَّ خَرَجْنَا فَسَبَقَتْ حِمَارَتِى الرَّكْبَ كُلَّهُ حَتَّى إِنَّهُمْ لَيَقُولُونَ وَيْحَكِ تَمَهَّلِى أَلَيْسَتْ هَذِهِ حِمَارَتُكِ الَّتِى خَرَجْتِ عَلَيْهَا فَأَقُولُ بَلَى وَاللَّهِ وَهِىَ لا تَزَالُ قُدَّامَنَا حَتَّى قَدِمْنَا مَنَازِلَنَا مِنْ حَاضِرِ بَنِي سَعْدِ بنِ بَكْرٍ فَقَدِمْنَا عَلَى أَجْدَبِ أَرْضٍ [وَالْجَدْبُ ضِدُّ الْخِصْبِ] فَوَالَّذِى نَفْسُ حَلِيمَةَ بِيَدِهِ إِنْهُمْ كَانُوا لَيَسْرَحُونَ أَغْنَامَهُمْ إِذَا أَصْبَحُوا وَيَسْرَحُ رَاعِى غَنَمِى فَتَرْجِعُ غَنَمِى سَمِينَةً ضُرُوعُهَا مَلِيئَةٌ بِاللَّبَنِ وَتَرْجِعُ أَغْنَامُهُمْ جِيَاعًا مَا بِهَا مِنَ اللَّبَنِ فَنَشْرَبُ مَا شِئْنَا مِنَ اللَّبَنِ وَمَا فِى الْحَاضِرِ أَحَدٌ يَحْلُبُ قَطْرَةً وَلا يَجِدُهَا."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) لَمَّا أَخَذَتْ حَلِيمَةُ الرَّسُولَ لإِرْضَاعِهِ مَاذَا قَالَ زَوْجُهَا."},{"type":"question","text":"     (2) مَاذَا رَأَتْ مِنْ بَرَكَاتِهِ ﷺ."},{"type":"question","text":"     (3) مَاذَا حَصَلَ لِدَابَّةِ حَلِيمَةَ وَأَغْنَامِهَا."},{"type":"question","text":"     (4) مَا مَعْنَى ضَرْعُهَا حَافِلٌ أَىِ النَّاقَةِ."}],"paragraphCount":5},{"id":"g4-s14","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"شَقُّ صَدْرِهِ عَلَيْهِ الصَّلاةُ وَالسَّلامُ","description":"قَالَتْ حَلِيمَةُ السَّعْدِيَّةُ كَانَ ﷺ يَشِبُّ فِى الْيَوْمِ شِبَابَ الصَّبِىِّ فِى الشَّهْرِ وَيَشِبُّ فِى الشَّهْرِ شِبَابَ الصَّبِىِّ فِى سَنَةٍ فَبَلَغَ سَنَةً وَهُوَ غُلامٌ قَوِىٌّ عَلَى الأَكْلِ، قَالَتْ فَبَيْنَمَا هُوَ وَأَخُوهُ يَوْمًا خَلْفَ الْبُيُوتِ يَرْعَيَانِ بِهَا لَنَا إِذْ جَاءَ أَخُوهُ مُسْرِعًا فَقَالَ لِى وَلِأَبِيهِ أَدْرِكَا أَخِى الْقُرَشِىَّ فَقَدْ جَاءَهُ رَجُلانِ فَأَضْجَعَاهُ وَشَقَّا بَطْنَهُ فَخَرَجْنَا فَوَصَلْنَا إِلَيْهِ وَهُوَ قَائِمٌ مُنْتَقِعٌ لَوْنُهُ فَاعْتَنَقَهُ أَبُوهُ وَاعْتَنَقْتُهُ ثُمَّ قُلْنَا مَاذَا حَصَلَ قَالَ أَتَانِى رَجُلانِ عَلَيْهِمَا ثِيَابٌ بِيضٌ فَأَضْجَعَانِى ثُمَّ شَقَّا بَطْنِى فَوَاللَّهِ مَا أَدْرِى مَا صَنَعَا. ","items":[{"type":"p","text":"قَالَتْ حَلِيمَةُ السَّعْدِيَّةُ كَانَ ﷺ يَشِبُّ فِى الْيَوْمِ شِبَابَ الصَّبِىِّ فِى الشَّهْرِ وَيَشِبُّ فِى الشَّهْرِ شِبَابَ الصَّبِىِّ فِى سَنَةٍ فَبَلَغَ سَنَةً وَهُوَ غُلامٌ قَوِىٌّ عَلَى الأَكْلِ، قَالَتْ فَبَيْنَمَا هُوَ وَأَخُوهُ يَوْمًا خَلْفَ الْبُيُوتِ يَرْعَيَانِ بِهَا لَنَا إِذْ جَاءَ أَخُوهُ مُسْرِعًا فَقَالَ لِى وَلِأَبِيهِ أَدْرِكَا أَخِى الْقُرَشِىَّ فَقَدْ جَاءَهُ رَجُلانِ فَأَضْجَعَاهُ وَشَقَّا بَطْنَهُ فَخَرَجْنَا فَوَصَلْنَا إِلَيْهِ وَهُوَ قَائِمٌ مُنْتَقِعٌ لَوْنُهُ فَاعْتَنَقَهُ أَبُوهُ وَاعْتَنَقْتُهُ ثُمَّ قُلْنَا مَاذَا حَصَلَ قَالَ أَتَانِى رَجُلانِ عَلَيْهِمَا ثِيَابٌ بِيضٌ فَأَضْجَعَانِى ثُمَّ شَقَّا بَطْنِى فَوَاللَّهِ مَا أَدْرِى مَا صَنَعَا. "},{"type":"p","text":"قَالَتْ حَلِيمَةُ فَخِفْنَا أَنْ يَكُونَ قَدْ أُصِيبَ فِى عَقْلِهِ فَأَخَذْنَاهُ وَرَجَعْنَا بِهِ إِلَى أُمِّهِ فَقَالَتْ أُمُّهُ مَا الَّذِى رَدَّكُمَا بِهِ فَقُلْتُ إِنَّا تَخَوَّفْنَا الأَحْدَاثَ عَلَيْهِ فَقُلْنَا يَكُونُ فِى أَهْلِهِ، قَالَتْ أُمُّهُ وَاللَّهِ مَا ذَاكَ بِكُمَا فَأَخْبِرَانِى خَبَرَكُمَا وَخَبَرَهُ فَمَا زَالَتْ بِنَا حَتَّى أَخْبَرْنَاهَا خَبَرَهُ قَالَتْ فَتَخَوَّفْتُمَا عَلَيْهِ، كَلَّا وَاللَّهِ إِنَّ لِابْنِى هَذَا شَأْنًا إِنِّى حَمَلْتُ بِهِ فَكَانَ حَمْلُهُ خَفِيفًا عَظِيمَ الْبَرَكَةِ ثُمَّ رَأَيْتُ نُورًا كَأَنَّهُ شِهَابٌ خَرَجَ مِنِّى حِينَ وَضَعْتُهُ فَلَمَّا وَقَعَ كَمَا تَقَعُ الصِّبْيَانُ وَقَعَ وَاضِعًا يَدَيْهِ بِالأَرْضِ رَافِعًا رَأْسَهُ إِلَى السَّمَاءِ اتْرُكَاهُ وَاذْهَبَا."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَيْفَ كَانَ يَشِبُّ النَّبِىُّ ﷺ."},{"type":"question","text":"     (2) مَاذَا حَصَلَ لِلنَّبِىِّ لَمَّا كَانَ يَرْعَى خَلْفَ الْبُيُوتِ عِنْدَ حَلِيمَةَ."},{"type":"question","text":"     (3) لَمَّا عَلِمَتْ حَلِيمَةُ بِهَذَا الأَمْرِ مَاذَا فَعَلَتْ."},{"type":"question","text":"     (4) مَاذَا قَالَتْ ءَامِنَةُ لِحَلِيمَةَ، كَيْفَ حَمَلَتْ بِهِ."}],"paragraphCount":6},{"id":"g4-s15","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"ذِكْرُ مَا كَانَ مِنْ أَمْرِ رَسُولِ اللَّهِ ﷺ","description":"تُوُفِّيَتْ ءَامِنَةُ وَرَسُولُ اللَّهِ ابْنُ سِتِّ سَنَوَاتٍ فَأَخَذَهُ جَدُّهُ عَبْدُ الْمُطَّلِبِ وَضَمَّهُ إِلَيْهِ ثُمَّ أَوْصَى عَمَّهُ أَبَا طَالِبٍ بِحِفْظِهِ فَجَعَلَهُ أَبُو طَالِبٍ فِى بَيْتِهِ وَكَانَ يُحِبُّهُ وَيُقَدِّمُهُ عَلَى أَوْلادِهِ.","items":[{"type":"p","text":"تُوُفِّيَتْ ءَامِنَةُ وَرَسُولُ اللَّهِ ابْنُ سِتِّ سَنَوَاتٍ فَأَخَذَهُ جَدُّهُ عَبْدُ الْمُطَّلِبِ وَضَمَّهُ إِلَيْهِ ثُمَّ أَوْصَى عَمَّهُ أَبَا طَالِبٍ بِحِفْظِهِ فَجَعَلَهُ أَبُو طَالِبٍ فِى بَيْتِهِ وَكَانَ يُحِبُّهُ وَيُقَدِّمُهُ عَلَى أَوْلادِهِ."},{"type":"p","text":"فَلَمَّا بَلَغَ رَسُولُ اللَّهِ ﷺ اثْنَتَىْ عَشْرَةَ سَنَةً ارْتَحَلَ بِهِ أَبُو طَالِبٍ تَاجِرًا نَحْوَ الشَّامِ فَرَءَاهُ شَخْصٌ يُقَالُ لَهُ بَحِيرَا الرَّاهِبُ فَقَامَ إِلَى رَسُولِ اللَّهِ ﷺ وَاحْتَضَنَهُ وَأَقْبَلَ بِهِ حَتَّى أَجْلَسَهُ عَلَى الطَّعَامِ ثُمَّ جَعَلَ يَنْظُرُ بَيْنَ عَيْنَيْهِ ثُمَّ كَشَفَ عَنْ ظَهْرِهِ فَرَأَى خَاتَمَ النُّبُوَّةِ بَيْنَ كَتِفَيْهِ."},{"type":"p","text":"ثُمَّ قَالَ لِأَبِى طَالِبٍ إِنَّ لِابْنِ أَخِيكَ هَذَا شَأْنًا عَظِيمًا ارْجِعْ بِهِ إِلَى بَلَدِهِ وَاحْذَرْ عَلَيْهِ الْيَهُودَ. فَلَمَّا فَرَغُوا مِنْ تِجَارَتِهِمْ خَرَجَ بِهِ سَرِيعًا وَرَجَعَ بِهِ فَمَا خَرَجَ بِهِ سَفَرًا بَعْدَ ذَلِكَ خَوْفًا عَلَيْهِ."},{"type":"p","text":" ثُمَّ بَعْدَ زَمَنٍ عَرَضَ عَلَيْهِ عَمُّهُ أَنْ يَعْمَلَ بِالتِّجَارَةِ مَعَ خَدِيجَةَ بِنْتِ خُوَيْلِدٍ فَقَبِلَ وَخَرَجَ مَعَ غُلامِهَا مَيْسَرَةَ فِى قَافِلَةِ بَضَائِعَ إِلَى أَوَائِلِ بِلادِ الشَّامِ مِنْ نَاحِيَةِ الْحِجَازِ."},{"type":"p","text":"وَكَانَ مَيْسَرَةُ إِذَا اشْتَدَّ الْحَرُّ يَرَى مَلَكَيْنِ يُظِلَّانِ رَسُولَ اللَّهِ ﷺ مِنَ الشَّمْسِ فَلَمَّا رَجَعَ إِلَى السَّيِّدَةِ خَدِيجَةَ حَكَى لَهَا مَا رَأَى."},{"type":"p","text":"ثُمَّ بَعْدَ ذَلِكَ تَزَوَّجَ رَسُولُ اللَّهِ ﷺ مِنْ خَدِيجَةَ رَضِىَ اللَّهُ عَنْهَا وَهُوَ ابْنُ خَمْسٍ وَعِشْرِينَ سَنَةً."},{"type":"p","text":"ثُمَّ لَمَّا بَلَغَ رَسُولُ اللَّهِ ﷺ خَمْسًا وَثَلاثِينَ سَنَةً كَانَ بُنْيَانُ الْكَعْبَةِ قَدْ صَارَ ضَعِيفًا، فَجَدَّدَتْ قُرَيْشٌ بِنَاءَهَا فَلَمَّا وَصَلُوا إِلَى مَوْضِعِ الْحَجَرِ الأَسْوَدِ اخْتَلَفُوا مَنْ يَضَعُ الْحَجَرَ فَاتَّفَقُوا عَلَى أَنْ يَحْكُمَ بَيْنَهُمْ أَوَّلُ دَاخِلٍ يَدْخُلُ فَدَخَلَ رَسُولُ اللَّهِ ﷺ فَقَالُوا هَذَا الأَمِينُ قَدْ رَضِينَا حُكْمَهُ فَبَسَطَ ثَوْبَهُ وَوَضَعَ الْحَجَرَ فِيهِ وَقَالَ «لِيَأْخُذْ رَئِيسُ كُلِّ قَبِيلَةٍ بِنَاحِيَةٍ مِنْ نَوَاحِيهِ وَارْفَعُوهُ جَمِيعًا» ثُمَّ أَخَذَ الْحَجَرَ بِيَدِهِ ﷺ فَوَضَعَهُ فِى مَكَانِهِ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) كَمْ كَانَ عُمُرُ النَّبِىِّ لَمَّا تُوُفِّيَتْ ءَامِنَةُ، مَنْ كَفِلَهُ، ثُمَّ مَنْ."},{"type":"question","text":"     (2) مَتَى رَءَاهُ بَحِيرا، مَاذَا فَعَلَ مَعَهُ وَمَاذَا قَالَ لِأَبِى طَالِبٍ."},{"type":"question","text":"     (3) مَعَ مَنْ عَمِلَ بِالتِّجَارَةِ، مَنْ هُوَ مَيْسَرَةُ، مَاذَا رَأَى مَيْسَرَةُ."},{"type":"question","text":"     (4) كَمْ كَانَ عُمُرُ النَّبِىِّ لَمَّا تَزَوَّجَ وَمِمَّنْ تَزَوَّجَ."},{"type":"question","text":"     (5) كَيْفَ وَضَعَ الْحَجَرَ الأَسْوَدَ عِنْدَ الْكَعْبَةِ، اذْكُرِ الْقِصَّةَ بِاخْتِصَارٍ."}],"paragraphCount":12},{"id":"g4-s16","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"ذِكْرُ بَدْءِ الْوَحْىِ","description":"قَالَتْ عَائِشَةُ رَضِىَ اللَّهُ عَنْهَا أَوَّلُ مَا ابْتُدِئَ بِهِ رَسُولُ اللَّهِ ﷺ مِنَ الْوَحْىِ الرُّؤْيَا الصَّالِحَةُ كَانَ يَرَى الرُّؤْيَا فَتَحْصُلُ كَمَا رَءَاهَا تَمَامًا.","items":[{"type":"p","text":"قَالَتْ عَائِشَةُ رَضِىَ اللَّهُ عَنْهَا أَوَّلُ مَا ابْتُدِئَ بِهِ رَسُولُ اللَّهِ ﷺ مِنَ الْوَحْىِ الرُّؤْيَا الصَّالِحَةُ كَانَ يَرَى الرُّؤْيَا فَتَحْصُلُ كَمَا رَءَاهَا تَمَامًا."},{"type":"p","text":"ثُمَّ كَانَ يَأْتِى غَارَ حِرَاءٍ لِيَتَعَبَّدَ فِيهِ بَيْنَ الْمُدَّةِ وَالْمُدَّةِ. ثُمَّ فِى يَوْمٍ جَاءَهُ سَيِّدُنَا جِبْرِيلُ وَهُوَ فِى الْغَارِ وَكَانَ رَسُولُ اللَّه ﷺ قَدْ بَلَغَ الأَرْبَعِينَ مِنْ عُمُرِهِ فَقَالَ لَهُ اقْرَأْ فَقَالَ الرَّسُولُ «مَا أَنَا بِقَارِئٍ» فَقَالَ جِبْرِيلُ اقْرَأْ فَقَالَ رَسُولُ اللَّهِ ﷺ «مَا أَنَا بِقَارِئٍ» فَقَالَ جِبْرِيلُ عَلَيْهِ السَّلامُ فِى الثَّالِثَةِ اقْرَأْ فَقَالَ ﷺ «مَا أَنَا بِقَارِئٍ»."},{"type":"p","text":"فَقَالَ جِبْرِيلُ عَلَيْهِ السَّلامُ ﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِى خَلَقَ خَلَقَ الإِنْسَانَ مِنْ عَلَقٍ اقْرَأْ وَرَبُّكَ الأَكْرَمُ الَّذِى عَلَّمَ بِالْقَلَمِ عَلَّمَ الإِنْسَانَ مَا لَمْ يَعْلَمْ﴾ [سُورَةَ الْعَلَق]."},{"type":"p","text":"فَرَجَعَ الرَّسُولُ إِلَى خَدِيجَةَ فَقَالَ «زَمِّلُونِى زَمِّلُونِى» فَزَمَّلُوهُ ثُمَّ أَخْبَرَهَا الْخَبَرَ."},{"type":"p","text":"ثُمَّ بَعْدَ ذَلِكَ صَارَ الرَّسُولُ عَلَيْهِ الصَّلاةُ وَالسَّلامُ يَدْعُو النَّاسَ إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَيَنْهَى عَنْ عِبَادَةِ الأَصْنَامِ وَلَمْ يَكُنْ هُوَ قَدْ عَبَدَ صَنَمًا فِى حَيَاتِهِ قَطُّ بَلْ نَشَأَ عَلَى الإِيـمَانِ بِاللَّهِ تَعَالَى مُنْذُ صِغَرِهِ مِثْلُ كُلِّ الأَنْبِيَاءِ لَكِنَّهُ لَمْ يَكُنْ يَعْرِفُ التَّفَاصِيلَ كُلَّهَا قَبْلَ نُزُولِ الْوَحْىِ عَلَيْهِ."},{"type":"p","text":"وَكَانَ أَوَّلَ مَنْ ءَامَنَ بِهِ مِنَ النِّسَاءِ زَوْجَتُهُ خَدِيجَةُ وَمِنَ الصِّبْيَانِ عَلِىُّ بنُ أَبِى طَالِبٍ وَمِنَ الرِّجَالِ أَبُو بَكْرٍ الصِّدِّيقُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَا أَوَّلُ مَا ابْتُدِئَ بِهِ الرَّسُولُ مِنَ الْوَحْىِ."},{"type":"question","text":"     (2) أَيْنَ كَانَ الرَّسُولُ يَتَعَبَّدُ، كَمْ كَانَ عُمُرُهُ لَمَّا ظَهَرَ لَهُ سَيِّدُنَا جِبْرِيلُ."},{"type":"question","text":"     (3) مَاذَا قَالَ لَهُ سَيِّدُنَا جِبْرِيلُ وَمَا جَوَابُ النَّبِىِّ."},{"type":"question","text":"     (4) أَيْنَ عَادَ النَّبِىُّ لَمَّا خَرَجَ مِنَ الْغَارِ وَمَاذَا قَالَ لِخَدِيجَةَ."},{"type":"question","text":"     (5) إِلامَ دَعَا النَّبِىُّ النَّاسَ، مَنْ أَوَّلُ مَنْ ءَامَنَ بِهِ مِنَ النِّسَاءِ وَمِنَ الصِّبْيَانِ وَمِنَ الرِّجَالِ."}],"paragraphCount":11},{"id":"g4-s17","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"ذِكْرُ بَعْضِ مَا لاقَى ﷺ مِنْ أَذَى الْمُشْرِكِينَ","description":"عَلِمَ مُشْرِكُوا مَكَّةَ بِدَعْوَةِ النَّبِىِّ ﷺ فَصَارُوا يُؤْذُونَهُ وَيُؤْذُونَ أَصْحَابَهُ وَكَانَ مِمَّنْ عَادَاهُ وَءَاذَاهُ أَبُو جَهْلٍ عَمْرُو بنُ هِشَامٍ وَعَمُّهُ أَبُو لَهَبٍ وَاسْمُهُ عَبْدُ الْعُزَّى بنُ عَبْدِ الْمُطَّلِبِ وَامْرَأَتُهُ أُمُّ جَمِيلٍ بِنْتُ حَرْبٍ وَكَانَتْ تَحْتَطِبُ الشَّوْكَ فَتُلْقِيهِ فِى طَرِيقِ رَسُولِ اللَّهِ لَيْلًا.","items":[{"type":"p","text":"عَلِمَ مُشْرِكُوا مَكَّةَ بِدَعْوَةِ النَّبِىِّ ﷺ فَصَارُوا يُؤْذُونَهُ وَيُؤْذُونَ أَصْحَابَهُ وَكَانَ مِمَّنْ عَادَاهُ وَءَاذَاهُ أَبُو جَهْلٍ عَمْرُو بنُ هِشَامٍ وَعَمُّهُ أَبُو لَهَبٍ وَاسْمُهُ عَبْدُ الْعُزَّى بنُ عَبْدِ الْمُطَّلِبِ وَامْرَأَتُهُ أُمُّ جَمِيلٍ بِنْتُ حَرْبٍ وَكَانَتْ تَحْتَطِبُ الشَّوْكَ فَتُلْقِيهِ فِى طَرِيقِ رَسُولِ اللَّهِ لَيْلًا."},{"type":"p","text":"وَقَدْ رُوِىَ فِى الْحَدِيثِ أَنَّهُ لَمَّا نَزَلَ قَوْلُهُ تَعَالَى ﴿وَأَنْذِرْ عَشِيرَتَكَ الأَقْرَبِينَ﴾ [سُورَةَ الشُّعَرَاء/214] صَعِدَ الرَّسُولُ ﷺ عَلَى الصَّفَا فَقَالَ «يَا صَبَاحَاهُ» فَاجْتَمَعَتْ إِلَيْهِ قُرَيْشٌ فَقَالُوا مَا لَكَ."},{"type":"p","text":"فَقَالَ «أَرَأَيْتُمْ إِنْ أَخْبَرْتُكُمْ أَنَّ الْعَدُوَّ مُصَبِّحُكُمْ أَوْ مُمَسِّيكُمْ أَمَا كُنْتُمْ تُصَدِّقُونِى» قَالُوا بَلَى. "},{"type":"p","text":"فَقَالَ «فَإِنِّى نَذِيرٌ لَكُمْ بَيْنَ يَدَىْ عَذَابٍ شَدِيدٍ» قَالَ أَبُو لَهَبٍ «تَبًّا لَكَ أَلِهَذَا دَعَوْتَنَا» فَأَنْزَلَ اللَّهُ قَوْلَهُ تَعَالَى ﴿تَبَّتْ يَدَا أَبِى لَهَبٍ﴾ [سُورَةَ الْمَسَد/1] فَلَمَّا سَمِعَتْ أُمُّ جَمِيلٍ هَذِهِ السُّورَةَ أَتَتْ أَبَا بَكْرٍ وَهُوَ مَعَ رَسُولِ اللَّهِ فِى الْمَسْجِدِ وَبِيَدِهَا حَجَرٌ مِلْءُ الْكَفِّ فَقَالَتْ بَلَغَنِى أَنَّ صَاحِبَكَ هَجَانِى وَلَأَفْعَلَنَّ بِهِ وَأَفْعَلَنَّ، وَأَعْمَى اللَّهُ بَصَرَهَا عَنْ رَسُولِهِ فَقَالَ لَهَا أَبُو بَكْرٍ هَلْ تَرِينَ مَعِى أَحَدًا فَقَالَتْ أَتَهْزَأُ بِى لا أَرَى غَيْرَكَ وَصَارَتْ تَذُمُّ رَسُولَ اللَّهِ."},{"type":"p","text":"فَسَكَتَ أَبُو بَكْرٍ وَمَضَتْ هِىَ فَقَالَ رَسُولُ اللَّهِ ﷺ «لَقَدْ حَجَبَتْنِى عَنْهَا مَلائِكَةٌ فَمَا رَأَتْنِى وَكَفَانِى اللَّهُ شَرَّهَا»."},{"type":"p","text":"وَفِى بَعْضِ الأَيَّامِ كَانَ رَسُولُ اللَّهِ ﷺ بِفَنَاءِ الْكَعْبَةِ فَأَقْبَلَ عُقْبَةُ بنُ أَبِى مُعَيْطٍ وَكَانَ مِنْ رُءُوسِ الْكُفَّارِ فَأَخَذَ بِمَنْكِبِ رَسُولِ اللَّهِ ﷺ وَلَوَى ثَوْبَهُ فِى عُنُقِهِ فَخَنَقَهُ بِهِ خَنْقًا شَدِيدًا فَأَقْبَلَ أَبُو بَكْرٍ فَأَخَذَ بِمَنْكِبِهِ وَدَفَعَهُ عَنْ رَسُولِ اللَّهِ ﷺ وَقَالَ أَتَقْتُلُونَ رَجُلًا أَنْ يَقُولَ رَبِّىَ اللَّهُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) هَلْ تَذْكُرُ عَدَدًا مِنَ الأَشْخَاصِ الَّذِينَ ءَاذَوُا الرَّسُولَ وَأَصْحَابَهُ مَنْ هُمْ."},{"type":"question","text":"     (2) مَاذَا كَانَتْ تَفْعَلُ أُمُّ جَمِيلٍ لِلرَّسُولِ."},{"type":"question","text":"     (3) لِمَاذَا صَعِدَ الرَّسُولُ إِلَى الصَّفَا مَاذَا قَالَ لِقُرَيْشٍ."},{"type":"question","text":"     (4) هَلْ حَضَرَ أَبُو لَهَبٍ، مَاذَا قَالَ الرَّسُولُ."},{"type":"question","text":"     (5) مَا هِىَ السُّورَةُ الَّتِى فِيهَا ذَمُّ أَبِى لَهَبٍ وَامْرَأَتِهِ هَلْ تَحْفَظُهَا، اذْكُرْهَا."},{"type":"question","text":"     (6) لَمَّا سَمِعَتْ أُمُّ جَمِيلٍ بِسُورَةِ الْمَسَدِ مَاذَا فَعَلَتْ."},{"type":"question","text":"     (7) مَاذَا قَالَ لَهَا سَيِّدُنَا أَبُو بَكْرٍ."},{"type":"question","text":"     (8) هَلْ رَأَتِ الرَّسُولَ فِى الْمَسْجِدِ، مَاذَا حَصَلَ."},{"type":"question","text":"     (9) مَنْ هُوَ عُقْبَةُ بنُ أَبِى مُعَيْطٍ، مَاذَا فَعَلَ لِلرَّسُولِ."}],"paragraphCount":15},{"id":"g4-s18","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"الْهِجْرَةُ إِلَى الْحَبَشَةِ","description":"اشْتَدَّ أَذَى الْكُفَّارِ عَلَى النَّبِىِّ وَأَصْحَابِهِ فَأَمَرَ ﷺ أَصْحَابَهُ بِالْخُرُوجِ إِلَى أَرْضِ الْحَبَشَةِ فَهَاجَرَ قِسْمٌ مِنْهُمْ.","items":[{"type":"p","text":"اشْتَدَّ أَذَى الْكُفَّارِ عَلَى النَّبِىِّ وَأَصْحَابِهِ فَأَمَرَ ﷺ أَصْحَابَهُ بِالْخُرُوجِ إِلَى أَرْضِ الْحَبَشَةِ فَهَاجَرَ قِسْمٌ مِنْهُمْ."},{"type":"p","text":"وَكَانَ جُمْلَةُ مَنْ خَرَجَ إِلَى أَرْضِ الْحَبَشَةِ ثَلاثَةٌ وَثَمَانُونَ رَجُلًا وَإِحْدَى عَشْرَةَ امْرَأَةً قُرَشِيَّةً وَسَبْعُ غَرَائِبَ فَكَانَ مِمَّنْ هَاجَرَ عُثْمَانُ بنُ عَفَّانَ وَزَوْجَتُهُ رُقَيَّةُ وَالزُّبَيْرُ بنُ الْعَوَّامِ وَعَبْدُ الرَّحْمٰنِ بنُ عَوْفٍ وَعَبْدُ اللَّهِ بنُ مَسْعُودٍ وَجَعْفَرُ بنُ أَبِى طَالِبٍ وَكَانَتْ هِجْرَتُهُمْ إِلَى الْحَبَشَةِ عَلَى دَفْعَتَيْنِ وَقَدْ رَحَّبَ بِهِمْ مَلِكُ الْحَبَشَةِ وَأَكْرَمَهُمْ."},{"type":"p","text":"عِنْدَ ذَلِكَ أَرْسَلَ مُشْرِكُو قُرَيْشٍ إِلَى الْحَبَشَةِ رَجُلَيْنِ قَدَّمَا الْهَدَايَا إِلَى أَصْحَمَةَ النَّجَاشِىِّ مَلِكِ الْحَبَشَةِ وَطَلَبَا مِنْهُ أَنْ يُسَلِّمَهُمُ الْمُسْلِمِينَ فَلَمْ يَرْضَ حَتَّى يُكَلِّمَهُمْ فَأَرْسَلَ فِى طَلَبِهِمْ فَحَضَرُوا وَكَلَّمَهُ جَعْفَرُ ابْنُ أَبِى طَالِبٍ عَنِ الإِسْلامِ وَبَيَّنَ لَهُ مَا أَمَرَهُمْ بِهِ النَّبِىُّ ﷺ وَأَخْبَرَهُ أَنَّ سَيِّدَنَا عِيسَى عَلَيْهِ السَّلامُ عَبْدُ اللَّهِ وَرَسُولُهُ وَقَرَأَ عَلَيْهِ شَيْئًا مِنَ الْقُرْءَانِ فَبَكَى فَحَمَاهُمْ وَلَمْ يُمَكِّنِ الْكُفَّارَ مِنْهُمْ وَأَسْلَمَ لِلَّهِ تَعَالَى وَحَسُنَ إِسْلامُهُ وَصَارَ مِنْ أَوْلِيَاءِ اللَّهِ الصَّالِحِينَ. ثُمَّ مَاتَ عَلَى الإِسْلامِ بَعْدَ مُدَّةٍ فَصَلَّى عَلَيْهِ رَسُولُ اللَّهِ ﷺ صَلاةَ الْغَائِبِ وَقَالَ لِأَصْحَابِهِ «مَاتَ الْيَوْمَ أَخُوكُمُ النَّجَاشِىُّ وَهُوَ رَجُلٌ صَالِحٌ»."},{"type":"p","text":"وَأَمَّا فِى مَكَّةَ الْمُكَرَّمَةِ فَقَدْ قَاسَى الْمُسْلِمُونَ تَضْيِيقًا شَدِيدًا مِنَ الْكُفَّارِ حَتَّى إِنَّهُمْ حَصَرُوهُمْ فِى بَعْضِ الشِّعَابِ وَمَنَعُوا أَنْ يَبِيعَهُمْ أَحَدٌ شَيْئًا أَوْ يَبْتَاعَ مِنْهُمْ وَهُمْ مَعَ رَسُولِ اللَّهِ ﷺ صَابِرُونَ طَلَبًا لِرِضَا اللَّهِ سُبْحَانَهُ وَتَعَالَى."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) لِمَاذَا أَمَرَ النَّبِىُّ أَصْحَابَهُ بِالْهِجْرَةِ، إِلَى أَيْنَ هَاجَرُوا أَوَّلَ مَرَّةٍ."},{"type":"question","text":"     (2) كَمْ شَخْصًا هَاجَرَ إِلَى الْحَبَشَةِ مِنَ الرِّجَالِ وَمِنَ النِّسَاءِ."},{"type":"question","text":"     (3) اذْكُرْ أَسْمَاءَ بَعْضِ الَّذِينَ هَاجَرُوا."},{"type":"question","text":"     (4) مَنِ اسْتَقْبَلَهُمْ فِى الْحَبَشَةِ وَمَاذَا فَعَلَ الْكُفَّارُ لَمَّا عَلِمُوا بِهِجْرَةِ الْمُسْلِمِينَ."},{"type":"question","text":"     (5) هَلْ سَلَّمَ النَّجَاشِىُّ الْمُسْلِمِينَ وَكَيْفَ أَسْلَمَ."},{"type":"question","text":"     (6) مَاذَا فَعَلَ الرَّسُولُ لَمَّا عَلِمَ بِمَوْتِ النَّجَاشِىِّ وَمَاذَا قَالَ لِأَصْحَابِهِ."},{"type":"question","text":"     (7) مَاذَا فَعَلَ الْكُفَّارُ بِالْمُسْلِمِينَ فِى مَكَّةَ الْمُكَرَّمَةِ."}],"paragraphCount":11},{"id":"g4-s19","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"اجْتِمَاعُهُ ﷺ بِبَعْضِ أَهْلِ الْمَدِينَةِ","description":"كَانَ الرَّسُولُ ﷺ وَقْتَ مَوْسِمِ الْحَجِّ يَجْتَمِعُ إِلَى الْقَبَائِلِ وَيَدْعُوهُمْ إِلَى الإِسْلامِ فَاجْتَمَعَ ذَاتَ يَوْمٍ بِجَمَاعَةٍ مِنْ أَهْلِ الْمَدِينَةِ وَدَعَاهُمْ إِلَى الإِسْلامِ فَأَسْلَمُوا وَقَالُوا لَهُ إِنَّا سَنَرْجِعُ إِلَى الْمَدِينَةِ وَنَدْعُو قَوْمَنَا إِلَى الإِسْلامِ وَوَاعَدُوهُ إِلَى الْمَوْسِمِ مِنَ الْعَامِ الْقَابِلِ فَلَمَّا رَجَعُوا إِلَى الْمَدِينَةِ صَارُوا يَدْعُونَ النَّاسَ إِلَى الإِسْلامِ فَأَسْلَمَ قِسْمٌ مِنْ أَهْلِ الْمَدِينَةِ وَهَؤُلاءِ كَانُوا يُسَمَّوْنَ الأَنْصَارَ.","items":[{"type":"p","text":"كَانَ الرَّسُولُ ﷺ وَقْتَ مَوْسِمِ الْحَجِّ يَجْتَمِعُ إِلَى الْقَبَائِلِ وَيَدْعُوهُمْ إِلَى الإِسْلامِ فَاجْتَمَعَ ذَاتَ يَوْمٍ بِجَمَاعَةٍ مِنْ أَهْلِ الْمَدِينَةِ وَدَعَاهُمْ إِلَى الإِسْلامِ فَأَسْلَمُوا وَقَالُوا لَهُ إِنَّا سَنَرْجِعُ إِلَى الْمَدِينَةِ وَنَدْعُو قَوْمَنَا إِلَى الإِسْلامِ وَوَاعَدُوهُ إِلَى الْمَوْسِمِ مِنَ الْعَامِ الْقَابِلِ فَلَمَّا رَجَعُوا إِلَى الْمَدِينَةِ صَارُوا يَدْعُونَ النَّاسَ إِلَى الإِسْلامِ فَأَسْلَمَ قِسْمٌ مِنْ أَهْلِ الْمَدِينَةِ وَهَؤُلاءِ كَانُوا يُسَمَّوْنَ الأَنْصَارَ."},{"type":"p","text":"ثُمَّ لَمَّا كَانَ الْعَامُ الْمُقْبِلُ أَتَى الْمَوْسِمَ اثْنَا عَشَرَ رَجُلًا مِنَ الأَنْصَارِ وَبَايَعُوا رَسُولَ اللَّهِ ﷺ عَلَى أَنْ لا يُشْرِكُوا بِاللَّهِ وَلا يَسْرِقُوا وَلا يَزْنُوا وَلا يَقْتُلُوا أَوْلادَهُمْ وَلا يَأْتُوا بِبُهْتَانٍ وَلا يَعْصُوهُ فِى مَعْرُوفٍ وَأَرْسَلَ الرَّسُولُ ﷺ إِلَى الْمَدِينَةِ مُصْعَبَ بنَ عُمَيْرٍ لِيُعَلِّمَهُمْ أُمُورَ الدِّينِ فَأَسْلَمَ الْكَثِيرُ مِنْهُمْ حَتَّى لَمْ يَبْقَ دَارٌ مِنْ دُورِ الْمَدِينَةِ إِلَّا دَخَلَهَا الإِسْلامُ."},{"type":"p","text":"ثُمَّ خَرَجَ مِنَ الأَنْصَارِ إِلَى الْمَوْسِمِ فِى مَكَّةَ نَحْوُ سَبْعِينَ شَخْصًا فَبَايَعُوا رَسُولَ اللَّهِ ﷺ لَيْلًا."},{"type":"p","text":"ثُمَّ لَمَّا جَاءَ الأَمْرُ بِالْهِجْرَةِ عَلِمَتْ قُرَيْشٌ أَنَّ رَسُولَ اللَّهِ ﷺ بُويِعَ وَأَمَرَ أَصْحَابَهُ أَنْ يَلْحَقُوا بِالْمَدِينَةِ فَتَشَاوَرُوا فِيمَا بَيْنَهُمْ وَاجْتَمَعُوا عَلَى قَتْلِهِ ﷺ."},{"type":"p","text":"وَأَتَى جِبْرِيلُ إِلَى رَسُولِ اللَّهِ وَأَعْلَمَهُ بِذَلِكَ وَأَخْبَرَهُ بِأَنْ لا يَبِيتَ فِى مَكَانِهِ الَّذِى يَبِيتُ فِيهِ. فَأَمَرَ عَلِيًّا أَنْ يَنَامَ فِى فِرَاشِهِ وَيَتَغَطَّى بِرِدَائِهِ وَأَنْ يُؤَدِّىَ عَنْهُ الأَمَانَاتِ إِلَى أَصْحَابِهَا وَخَرَجَ ﷺ وَالْقَوْمُ عَلَى بَابِهِ وَمَعَهُ حَفْنَةٌ مِنْ تُرَابٍ فَجَعَلَ يَنْشُرُهَا عَلَى رُءُوسِهِمْ وَهُوَ يَقْرَأُ ﴿يس وَالْقُرْءانِ الْحَكِيمِ إِنَّكَ لَمِنَ الْمُرْسَلِينَ عَلَى صِرَاطٍ مُّسْتَقِيمٍ تَنزِيلَ الْعَزِيزِ الرَّحِيمِ لِتُنْذِرَ قَوْمًا مَّا أُنْذِرَ ءَابَاؤُهُمْ فَهُمْ غَافِلُونَ لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ فَهُمْ لا يُؤْمِنُونَ إِنَّا جَعَلْنَا فِى أَعْنَاقِهِمْ أَغْلالًا فَهِىَ إِلَى الأَذْقَانِ فَهُم مُّقْمَحُونَ وَجَعَلْنَا مِنْ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لا يُبْصِرُونَ﴾ [سُورَةَ يس] فَأَخَذَ اللَّهُ أَبْصَارَهُمْ فَلَمْ يَرَوْهُ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا كَانَ يَفْعَلُ الرَّسُولُ وَقْتَ مَوْسِمِ الْحَجِّ."},{"type":"question","text":"     (2) هَلِ اجْتَمَعَ بِجَمَاعَةٍ مِنْ أَهْلِ الْمَدِينَةِ، مَاذَا قَالَ لَهُمْ وَبِمَاذَا وَعَدُوهُ."},{"type":"question","text":"     (3) لِمَاذَا سُمِّىَ أَهْلُ الْمَدِينَةِ بِالأَنْصَارِ."},{"type":"question","text":"     (4) كَمْ شَخْصًا جَاءَ مِنَ الأَنْصَارِ إِلَى الْمَوْسِمِ فِى الْعَامِ الثَّانِى وَمَاذَا فَعَلُوا."},{"type":"question","text":"     (5) مَا اسْمُ الصَّحَابِىِّ الَّذِى أَرْسَلَهُ الرَّسُولُ إِلَى الْمَدِينَةِ، لِمَاذَا أَرْسَلَهُ."},{"type":"question","text":"     (6) عَلَى مَاذَا اجْتَمَعَتْ قُرَيْشٌ بَعْدَ مَا عَلِمُوا بِالْمُبَايَعَةِ وَمَاذَا حَصَلَ."},{"type":"question","text":"     (7) مَاذَا فَعَلَ سَيِّدُنَا عَلِىٌّ رَضِيَ اللَّهُ عَنْهُ."},{"type":"question","text":"     (8) كَيْفَ خَرَجَ الرَّسُولُ مِنْ بَيْتِهِ، هَلْ رَءَاهُ الْكُفَّارُ، لِمَاذَا."},{"type":"question","text":"     (9) هَلْ تَحْفَظُ شَيْئًا مِنْ سُورَةِ يس، مَا هُوَ."}],"paragraphCount":14},{"id":"g4-s20","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"الْهِجْرَةُ إِلَى الْمَدِينَةِ الْمُنَوَّرَةِ","description":"بَعْدَ أَنْ خَرَجَ نَبِىُّ اللَّهِ مِنْ بَيْتِهِ لِلْهِجْرَةِ ذَهَبَ إِلَى بَيْتِ أَبِى بَكْرٍ رَضِىَ اللَّهُ عَنْهُ وَأَخْبَرَهُ أَنَّهُ قَدْ أُذِنَ لَهُ بِالْهِجْرَةِ فَطَلَبَ مِنَ النَّبِىِّ ﷺ أَنْ يَصْحَبَهُ مَعَهُ فَوَافَقَ فَبَكَى أَبُو بَكْرٍ مِنْ شِدَّةِ الْفَرَحِ بِذَلِكَ ثُمَّ رَكِبَا عَلَى نَاقَتَيْنِ كَانَ قَدْ أَعَدَّهُمَا أَبُو بَكْرٍ وَانْطَلَقَا حَتَّى وَصَلا إِلَى غَارِ ثَوْرٍ فَدَخَلاهُ.","items":[{"type":"p","text":"بَعْدَ أَنْ خَرَجَ نَبِىُّ اللَّهِ مِنْ بَيْتِهِ لِلْهِجْرَةِ ذَهَبَ إِلَى بَيْتِ أَبِى بَكْرٍ رَضِىَ اللَّهُ عَنْهُ وَأَخْبَرَهُ أَنَّهُ قَدْ أُذِنَ لَهُ بِالْهِجْرَةِ فَطَلَبَ مِنَ النَّبِىِّ ﷺ أَنْ يَصْحَبَهُ مَعَهُ فَوَافَقَ فَبَكَى أَبُو بَكْرٍ مِنْ شِدَّةِ الْفَرَحِ بِذَلِكَ ثُمَّ رَكِبَا عَلَى نَاقَتَيْنِ كَانَ قَدْ أَعَدَّهُمَا أَبُو بَكْرٍ وَانْطَلَقَا حَتَّى وَصَلا إِلَى غَارِ ثَوْرٍ فَدَخَلاهُ."},{"type":"p","text":"وَأَمَرَ اللَّهُ شَجَرَةً فَنَبَتَتْ عِنْدَ مَدْخَلِ الْغَارِ فَسَتَرَتْهُ وَأَمَرَ اللَّهُ حَمَامَتَيْنِ وَحْشِيَّتَيْنِ فَوَقَفَتَا بِفَمِ الْغَارِ وَكَانَ الْكُفَّارُ يَتْبَعُونَهُمَا فَلَمَّا اقْتَرَبُوا مِنْهُمَا أَرْسَلُوا رَجُلًا لِيَنْظُرَ إِلَى الْغَارِ فَلَمَّا رَأَى الْحَمَامَتَيْنِ وَالشَّجَرَةَ رَجَعَ إِلَى أَصْحَابِهِ وَأَخْبَرَهُمْ أَنَّهُ لا يُوجَدُ أَحَدٌ فِى الْغَارِ."},{"type":"p","text":"وَبَعْدَ أَنْ ذَهَبَ الْكُفَّارُ بِمُدَّةٍ أَكْمَلَ الرَّسُولُ وَصَاحِبُهُ طَرِيقَهُمَا إِلَى الْمَدِينَةِ فَلَحِقَهُمَا سُرَاقَةُ بنُ مَالِكٍ بَعْدَ أَنْ عَلِمَ أَنَّ كُفَّارَ قُرَيْشٍ قَدْ وَضَعُوا جَائِزَةً لِمَنْ يَأْتِيهِمْ بِهِمَا فَلَمَّا اقْتَرَبَ مِنْهُمَا دَعَا النَّبِىُّ عَلَيْهِ فَسَاخَتْ فَرَسُهُ فِى الأَرْضِ فَطَلَبَ سُرَاقَةُ مِنَ النَّبِىِّ أَنْ يَدْعُوَ لَهُ وَوَعَدَ النَّبِىَّ أَنَّهُ لَنْ يُخْبِرَ أَحَدًا عَنْهُمَا فَدَعَا لَهُ النَّبِىُّ فَرَجَعَتْ فَرَسُهُ إِلَى حَالِهَا وَرَجَعَ هُوَ إِلَى أَصْحَابِهِ."},{"type":"p","text":"وَفِى طَرِيقِهِ ﷺ إِلَى الْمَدِينَةِ كَانَ مَعَهُ أَبُو بَكْرٍ وَعَامِرُ بنُ فُهَيْرَةَ مَوْلَى أَبِى بَكْرٍ وَابْنُ أُرَيْقِطٍ يَدُلُّهُمْ عَلَى الطَّرِيقِ وَمَرُّوا بِأُمِّ مَعْبَدٍ الْخُزَاعِيَّةِ وَهِىَ لا تَعْرِفُهُمْ فَقَالَ لَهَا الرَّسُولُ ﷺ «يَا أُمَّ مَعْبَدٍ هَلْ عِنْدَكِ مِنْ لَبَنٍ» فَقَالَتْ لا وَاللَّهِ، فَرَأَى شَاةً فِى الْبَيْتِ فَسَأَلَهَا عَنْهَا فَقَالَتْ شَاةٌ خَلَّفَهَا الْجُهْدُ وَهِىَ لا تُحْلَبُ فَمَسَحَ ظَهْرَهَا وَضَرْعَهَا ثُمَّ دَعَا بِإِنَاءٍ فَحَلَبَ فِيهِ فَمَلَأَهُ فَسَقَى أَصْحَابَهُ ثُمَّ حَلَبَ فِى الإِنَاءِ وَتَرَكَهُ عِنْدَهَا وَارْتَحَلَ."},{"type":"p","text":"وَكَانَ الْمُسْلِمُونَ فِى الْمَدِينَةِ قَدْ سَمِعُوا بِخُرُوجِ النَّبِىِّ ﷺ فَأَخَذُوا يَنْتَظِرُونَ قُدُومَهُ كُلَّ يَوْمٍ حَتَّى كَانَ الْيَوْمُ الَّذِى جَاءَ فِيهِ النَّبِىُّ ﷺ فَانْتَظَرُوا حَتَّى قَوِيَتْ عَلَيْهِمْ حَرَارَةُ الشَّمْسِ فَرَجَعُوا إِلَى بُيُوتِهِمْ."},{"type":"p","text":"وَبَعْدَ رُجُوعِهِمْ قَدِمَ النَّبِىُّ ﷺ وَأَبُو بَكْرٍ فَرَءَاهُمَا رَجُلٌ فَنَادَى بِأَعْلَى صَوْتِهِ يُخْبِرُ الأَنْصَارَ بِمَجِىءِ النَّبِىِّ ﷺ فَخَرَجُوا لِاسْتِقْبَالِهِ. "},{"type":"p","text":"وَدَخَلَ الرَّسُولُ ﷺ الْمَدِينَةَ وَهُوَ رَاكِبٌ عَلَى نَاقَتِهِ فَتَرَكَهَا حَتَّى بَرَكَتْ عَلَى الْبُقْعَةِ الَّتِى بَنَى عَلَيْهَا مَسْجِدَهُ الشَّرِيفَ وَأَقَامَ عِنْدَ أَبِى أَيُّوبَ الأَنْصَارِىِّ وَهُوَ خَالِدُ بنُ زَيْدٍ حَتَّى انْتَهَى مِنْ بِنَاءِ مَسْجِدِهِ وَمَسَاكِنِ أَزْوَاجِهِ. "},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) بَعْدَ أَنْ خَرَجَ الرَّسُولُ مِنْ بَيْتِهِ لِلْهِجْرَةِ إِلَى أَيْنَ ذَهَبَ وَمَاذَا أَخْبَرَ أَبَا بَكْرٍ."},{"type":"question","text":"     (2) مَاذَا طَلَبَ أَبُو بَكْرٍ مِنَ الرَّسُولِ، هَلْ وَافَقَ النَّبِىُّ وَمَاذَا فَعَلَ أَبُو بَكْرٍ."},{"type":"question","text":"     (3) هَلْ هَاجَرَ مَشْيًا، كَيْفَ."},{"type":"question","text":"     (4) مَاذَا حَصَلَ عِنْدَ بَابِ الْغَارِ."},{"type":"question","text":"     (5) مَنْ لَحِقَ بِالنَّبِىِّ وَصَاحِبِهِ وَمَاذَا حَصَلَ لِسُرَاقَةَ."},{"type":"question","text":"     (6) اذْكُرْ قِصَّةَ أُمِّ مَعْبَدٍ بِاخْتِصَارٍ."},{"type":"question","text":"     (7) مَاذَا فَعَلَ الْمُسْلِمُونَ لَمَّا عَلِمُوا بِخُرُوجِ الرَّسُولِ إِلَى الْمَدِينَةِ."},{"type":"question","text":"     (8) عِنْدَ مَنْ أَقَامَ الرَّسُولُ فِى الْمَدِينَةِ قَبْلَ أَنْ يَبْنِىَ مَسْجِدَهُ وَمَسَاكِنَ أَزْوَاجِهِ."}],"paragraphCount":15},{"id":"g4-s21","grade":4,"bookTitle":"قَصَصٌ مِنَ الْمَاضِى","bookSubtitle":"لِلصَّفِّ الِابْتِدَائِى الرَّابِعِ","title":"مِمَّا حَصَلَ بَعْدَ الْهِجْرَةِ","description":"هَاجَرَ النَّبِىُّ ﷺ مِنْ مَكَّةَ إِلَى الْمَدِينَةِ الْمُنَوَّرَةِ وَكَانَتْ تُسَمَّى يَثْرِبَ وَصَحِبَهُ أَبُو بَكْرٍ الصِّدِّيقُ رَضِىَ اللَّهُ عَنْهُ فِى هِجْرَتِهِ وَاسْتَقَرَّا هُنَاكَ وَلَحِقَ بِهِ سَائِرُ أَصْحَابِهِ بَعْدَ ذَلِكَ وَاسْتَقْبَلَهُمْ مَنْ ءَامَنَ مِنْ أَهْلِ الْمَدِينَةِ بِالتَّرْحَابِ وَنَصَرُوا دَعْوَتَهُ فَسُمُّوا الأَنْصَارَ وَسُمِّىَ الَّذِينَ هَاجَرُوا الْمُهَاجِرِينَ. وَقَوِيَتِ الدَّعْوَةُ فِى الْمَدِينَةِ وَءَاخَى النَّبِىُّ ﷺ بَيْنَ الْمُهَاجِرِينَ وَالأَنْصَارِ فَصَارُوا إِخْوَانًا مُتَحَابِّينَ مُتَعَاوِنِينَ.","items":[{"type":"p","text":"هَاجَرَ النَّبِىُّ ﷺ مِنْ مَكَّةَ إِلَى الْمَدِينَةِ الْمُنَوَّرَةِ وَكَانَتْ تُسَمَّى يَثْرِبَ وَصَحِبَهُ أَبُو بَكْرٍ الصِّدِّيقُ رَضِىَ اللَّهُ عَنْهُ فِى هِجْرَتِهِ وَاسْتَقَرَّا هُنَاكَ وَلَحِقَ بِهِ سَائِرُ أَصْحَابِهِ بَعْدَ ذَلِكَ وَاسْتَقْبَلَهُمْ مَنْ ءَامَنَ مِنْ أَهْلِ الْمَدِينَةِ بِالتَّرْحَابِ وَنَصَرُوا دَعْوَتَهُ فَسُمُّوا الأَنْصَارَ وَسُمِّىَ الَّذِينَ هَاجَرُوا الْمُهَاجِرِينَ. وَقَوِيَتِ الدَّعْوَةُ فِى الْمَدِينَةِ وَءَاخَى النَّبِىُّ ﷺ بَيْنَ الْمُهَاجِرِينَ وَالأَنْصَارِ فَصَارُوا إِخْوَانًا مُتَحَابِّينَ مُتَعَاوِنِينَ."},{"type":"p","text":"وَأَذِنَ اللَّهُ بَعْدَ الْهِجْرَةِ لِلْمُؤْمِنِينَ بِالْقِتَالِ فَقَاتَلَ ﷺ الْمُشْرِكِينَ فِى غَزَوَاتٍ كَثِيرَةٍ وَجَاهَدَ بِمَنْ مَعَهُ فِى سَبِيلِ اللَّهِ."},{"type":"p","text":"وَكَانَ رَسُولُ اللَّهِ ﷺ أَشْجَعَ النَّاسِ وَأَقْوَاهُمْ وَلَمْ تَكُنْ هِجْرَتُهُ هَرَبًا وَلا جُبْنًا وَلَكِنْ طَاعَةً لِأَمْرِ اللَّهِ لِإِقَامَةِ دَوْلَةِ الإِسْلامِ فِى الْمَدِينَةِ."},{"type":"p","text":"وَمِنْ غَزَوَاتِهِ الْمَشْهُورَةِ غَزْوَةُ بَدْرٍ وَغَزْوَةُ أُحُدٍ وَغَزْوَةُ الْخَنْدَقِ وَفَتْحُ مَكَّةَ وَغَزْوَةُ حُنَيْنٍ."},{"type":"p","text":"وَفِى السَّنَةِ الْحَادِيَةَ عَشْرَةَ لِلْهِجْرَةِ تُوُفِّىَ ﷺ بِالْمَدِينَةِ وَدُفِنَ بِهَا فِى بَيْتِ عَائِشَةَ رَضِىَ اللَّهُ عَنْهَا وَقَبْرُهُ الشَّرِيفُ مَعْرُوفٌ هُنَاكَ يُزَارُ إِلَى زَمَانِنَا هَذَا."},{"type":"p","text":"وَزِيَارَةُ قَبْرِهِ ﷺ سُنَّةٌ بِالإِجْمَاعِ أَىْ إِجْمَاعِ أَئِمَّةِ الِاجْتِهَادِ الأَرْبَعَةِ وَغَيْرِهِمْ لِلْمُقِيمِ بِالْمَدِينَةِ وَلِمَنْ يَسْكُنُ بَعِيدًا عَنْهَا."},{"type":"p","text":"قَالَ ﷺ «مَنْ زَارَ قَبْرِى وَجَبَتْ لَهُ شَفَاعَتِى» رَوَاهُ الدَّارَقُطْنِىُّ وَصَحَّحَهُ الْحَافِظُ السُّبْكِىُّ."},{"type":"questions_heading","text":"     الأَسْئِلَةُ"},{"type":"question","text":"     (1) مَاذَا كَانَ اسْمُ الْمَدِينَةِ الْمُنَوَّرَةِ قَبْلَ الْهِجْرَةِ."},{"type":"question","text":"     (2) لِمَاذَا سُمِّىَ أَهْلُهَا بِالأَنْصَارِ."},{"type":"question","text":"     (3) مَتَى نَزَلَ الإِذْنُ لِلْمُؤْمِنِينَ بِالْقِتَالِ."},{"type":"question","text":"     (4) لِمَ هَاجَرَ النَّبِىُّ ﷺ إِلَى الْمَدِينَةِ."},{"type":"question","text":"     (5) عُدَّ بَعْضَ غَزَوَاتِ الرَّسُولِ الْمَشْهُوَرَةِ."},{"type":"question","text":"     (6) مَتَى تُوُفِّىَ رَسُولُ اللَّهِ ﷺ وَأَيْنَ دُفِنَ."},{"type":"question","text":"     (7) مَا حُكْمُ زِيَارَةِ قَبْرِ النَّبِىِّ، هَلْ تَحْفَظُ حَدِيثًا يَدُلُّ عَلَى جَوَازِ ذَلِكَ."}],"paragraphCount":14}]}]</script>
  <script>
    "use strict";

    // ===== البيانات =====
    const BOOKS = JSON.parse(document.getElementById("library-data").textContent);
    const SECTIONS = BOOKS.flatMap(book => book.sections);
    const BY_ID = Object.fromEntries(SECTIONS.map(section => [section.id, section]));

    // ===== تخزين آمن في LocalStorage =====
    const Store = {
      get(key, fallback){
        try{
          const value = localStorage.getItem(key);
          return value === null ? fallback : JSON.parse(value);
        }catch(e){ return fallback; }
      },
      set(key, value){
        try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
      },
      remove(key){
        try{ localStorage.removeItem(key); }catch(e){}
      }
    };

    const DEFAULTS = { theme:"light", font:"Amiri", fontSize:21 };
    let settings = {...DEFAULTS, ...Store.get("qmp_settings", {})};
    let favorites = new Set(Store.get("qmp_favorites", []));
    let selectedGrade = "all";
    let currentSectionId = null;
    let scrollTick = null;
    let toastTimer = null;

    const FONT_MAP = {
      "Cairo": '"Cairo", sans-serif',
      "Tajawal": '"Tajawal", sans-serif',
      "Noto Kufi Arabic": '"Noto Kufi Arabic", sans-serif',
      "Amiri": '"Amiri", serif'
    };

    function normalizeArabic(text=""){
      return text
        .normalize("NFKD")
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
        .replace(/[أإآٱ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ؤ/g,"و")
        .replace(/ئ/g,"ي")
        .replace(/ء/g,"")
        .toLowerCase()
        .trim();
    }

    function escapeHTML(value=""){
      return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function sectionPlainText(section){
      return [section.title, ...section.items.map(x => x.text)].join("\n");
    }

    function getStats(section){
      const text = sectionPlainText(section).trim();
      const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
      return {words, minutes:Math.max(1,Math.ceil(words/180))};
    }

    function gradeName(n){
      return ["","الصف الأول","الصف الثاني","الصف الثالث","الصف الرابع"][n] || `الصف ${n}`;
    }

    function iconFor(title){
      const t = normalizeArabic(title);
      if(t.includes("ماء") || t.includes("زمزم")) return "fa-droplet";
      if(t.includes("جنه")) return "fa-tree";
      if(t.includes("كعبه")) return "fa-kaaba";
      if(t.includes("سفينه") || t.includes("نوح")) return "fa-ship";
      if(t.includes("مدن") || t.includes("مدينه")) return "fa-city";
      if(t.includes("زرع") || t.includes("حص")) return "fa-seedling";
      if(t.includes("فيل")) return "fa-paw";
      if(t.includes("هجره")) return "fa-route";
      if(t.includes("وحي")) return "fa-feather-pointed";
      if(t.includes("موسي") || t.includes("فرعون")) return "fa-water";
      if(t.includes("ابراهيم") || t.includes("اسماعيل") || t.includes("اسحاق")) return "fa-star-and-crescent";
      return "fa-book-open";
    }

    function toast(message){
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>el.classList.remove("show"), 1900);
    }

    function applySettings(){
      document.documentElement.dataset.theme = settings.theme;
      document.documentElement.style.setProperty("--reader-font", FONT_MAP[settings.font] || FONT_MAP.Amiri);
      document.documentElement.style.setProperty("--reader-size", `${settings.fontSize}px`);
      const themeIcon = document.querySelector("#quickThemeBtn i");
      if(themeIcon) themeIcon.className = settings.theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
      document.querySelector('meta[name="theme-color"]').setAttribute("content", settings.theme === "dark" ? "#101b18" : "#0b6b52");
      Store.set("qmp_settings", settings);
    }

    function toggleTheme(){
      settings.theme = settings.theme === "dark" ? "light" : "dark";
      applySettings();
      if(currentRoute().page === "settings") renderRoute();
    }

    function setFont(font){
      settings.font = font;
      applySettings();
      renderRoute();
    }

    function setFontSize(size){
      settings.fontSize = Math.min(32, Math.max(16, Number(size)));
      applySettings();
      const value = document.getElementById("fontSizeValue");
      if(value) value.textContent = settings.fontSize + "px";
    }

    function changeReaderSize(delta){
      settings.fontSize = Math.min(32, Math.max(16, settings.fontSize + delta));
      applySettings();
      toast(`حجم الخط: ${settings.fontSize}px`);
    }

    function resetSettings(){
      settings = {...DEFAULTS};
      applySettings();
      renderRoute();
      toast("تمت إعادة ضبط الإعدادات");
    }

    function currentRoute(){
      const raw = location.hash.replace(/^#/,"");
      if(raw.startsWith("section/")) return {page:"section", id:decodeURIComponent(raw.split("/")[1] || "")};
      if(raw === "favorites") return {page:"favorites"};
      if(raw === "settings") return {page:"settings"};
      return {page:"home"};
    }

    function navigate(target){
      if(target === "home") location.hash = "#home";
      else if(target === "favorites") location.hash = "#favorites";
      else if(target === "settings") location.hash = "#settings";
      else if(BY_ID[target]) location.hash = "#section/" + encodeURIComponent(target);
      else location.hash = "#home";
    }

    function updateNav(page){
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.route === page || (page === "section" && btn.dataset.route === "home"));
      });

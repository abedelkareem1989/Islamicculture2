    }

    function renderHome(){
      currentSectionId = null;
      document.getElementById("progressBar").style.width = "0";
      const lastId = Store.get("qmp_last_section", null);
      const last = lastId ? BY_ID[lastId] : null;
      const groups = BOOKS.map(book => `
        <section class="grade-group" data-grade="${book.grade}">
          <div class="grade-title">${escapeHTML(book.subtitle)}</div>
          <div class="cards">
            ${book.sections.map(renderCard).join("")}
          </div>
        </section>
      `).join("");

      document.getElementById("app").innerHTML = `
        <div class="page">
          <section class="hero">
            <div class="eyebrow">مكتبة إسلامية تعليمية</div>
            <h1>${escapeHTML(BOOKS[0].title)}</h1>
            <p>قراءة مرتبة حسب الصفوف والموضوعات، مع البحث والمفضلة وأدوات القراءة وحفظ موضعك تلقائيًا.</p>
            <label class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input id="homeSearch" type="search" placeholder="ابحث في جميع الأقسام والمحتوى..." autocomplete="off" />
            </label>
            ${last ? `
              <div class="continue-card">
                <div>
                  <strong>متابعة القراءة</strong>
                  <small>${escapeHTML(last.title)} · ${gradeName(last.grade)}</small>
                </div>
                <button class="primary-btn ripple" onclick="navigate('${last.id}')"><i class="fa-solid fa-book-open-reader"></i> متابعة</button>
              </div>` : ""}
          </section>

          <div class="section-head">
            <div>
              <h2>الأقسام</h2>
              <p>${SECTIONS.length} قسمًا موزعة على الصفوف الأربعة</p>
            </div>
          </div>

          <div class="grade-filters" id="gradeFilters">
            <button class="chip ${selectedGrade==="all"?"active":""}" onclick="filterGrade('all',this)">الكل</button>
            ${BOOKS.map(b => `<button class="chip ${selectedGrade===String(b.grade)?"active":""}" onclick="filterGrade('${b.grade}',this)">${gradeName(b.grade)}</button>`).join("")}
          </div>

          <div id="gradeGroups">${groups}</div>
        </div>
      `;
      filterGrade(selectedGrade);
      const input = document.getElementById("homeSearch");
      input.addEventListener("focus", () => openSearch(""));
      input.addEventListener("input", e => openSearch(e.target.value));
    }

    function renderCard(section){
      const stats = getStats(section);
      const fav = favorites.has(section.id);
      return `
        <article class="card ripple" data-id="${section.id}" onclick="if(!event.target.closest('.fav-mini')) navigate('${section.id}')">
          <button class="fav-mini ${fav?"active":""}" onclick="event.stopPropagation();toggleFavorite('${section.id}',this)" aria-label="المفضلة">
            <i class="${fav?"fa-solid":"fa-regular"} fa-bookmark"></i>
          </button>
          <div class="card-top">
            <div class="card-icon"><i class="fa-solid ${iconFor(section.title)}"></i></div>
            <div class="card-grade">${gradeName(section.grade)}</div>
          </div>
          <h3>${escapeHTML(section.title)}</h3>
          <p class="card-desc">${escapeHTML(section.description || "محتوى القسم")}</p>
          <div class="card-meta">
            <span><i class="fa-regular fa-file-lines"></i>${section.paragraphCount} فقرة</span>
            <span><i class="fa-regular fa-clock"></i>${stats.minutes} د</span>
          </div>
        </article>
      `;
    }

    function filterGrade(grade, clicked){
      selectedGrade = String(grade);
      document.querySelectorAll(".chip").forEach(chip => chip.classList.remove("active"));
      if(clicked) clicked.classList.add("active");
      else{
        const chips = [...document.querySelectorAll(".chip")];
        const idx = selectedGrade === "all" ? 0 : Number(selectedGrade);
        if(chips[idx]) chips[idx].classList.add("active");
      }
      document.querySelectorAll(".grade-group").forEach(group => {
        group.classList.toggle("hidden", selectedGrade !== "all" && group.dataset.grade !== selectedGrade);
      });
    }

    function renderFavorites(){
      currentSectionId = null;
      document.getElementById("progressBar").style.width = "0";
      const list = SECTIONS.filter(s => favorites.has(s.id));
      document.getElementById("app").innerHTML = `
        <div class="page">
          <h1 class="page-title">المفضلة</h1>
          <p class="page-lead">الأقسام التي حفظتها للعودة إليها بسرعة.</p>
          ${list.length ? `<div class="cards">${list.map(renderCard).join("")}</div>` : `
            <div class="empty">
              <i class="fa-regular fa-bookmark"></i>
              <h3>لا توجد أقسام مفضلة بعد</h3>
              <p>أضف أي قسم بالضغط على رمز الحفظ.</p>
              <button class="primary-btn" onclick="navigate('home')">تصفح الأقسام</button>
            </div>`}
        </div>
      `;
    }

    function renderSettings(){
      currentSectionId = null;
      document.getElementById("progressBar").style.width = "0";
      const fonts = ["Cairo","Tajawal","Noto Kufi Arabic","Amiri"];
      document.getElementById("app").innerHTML = `
        <div class="page" style="max-width:850px">
          <h1 class="page-title">الإعدادات</h1>
          <p class="page-lead">خصص تجربة القراءة، وسيتم حفظ اختياراتك تلقائيًا.</p>

          <section class="settings-card">
            <h3>المظهر</h3>
            <p>اختر الوضع النهاري أو الليلي.</p>
            <div class="theme-options">
              <button class="option-btn ${settings.theme==="light"?"active":""}" onclick="settings.theme='light';applySettings();renderRoute()"><i class="fa-solid fa-sun"></i> نهاري</button>
              <button class="option-btn ${settings.theme==="dark"?"active":""}" onclick="settings.theme='dark';applySettings();renderRoute()"><i class="fa-solid fa-moon"></i> ليلي</button>
            </div>
          </section>

          <section class="settings-card">
            <h3>نوع الخط</h3>
            <p>اختر خط القراءة المفضل لديك.</p>
            <div class="font-options">
              ${fonts.map(f => `<button class="option-btn ${settings.font===f?"active":""}" onclick="setFont('${f}')" style="font-family:${FONT_MAP[f]}">${f}</button>`).join("")}
            </div>
          </section>

          <section class="settings-card">
            <h3>حجم الخط</h3>
            <p>غيّر حجم نص القراءة من 16 إلى 32 بكسل.</p>
            <div class="range-row">
              <span>أ</span>
              <input type="range" min="16" max="32" step="1" value="${settings.fontSize}" oninput="setFontSize(this.value)" />
              <strong id="fontSizeValue">${settings.fontSize}px</strong>
            </div>
          </section>

          <section class="settings-card">
            <h3>إعادة الضبط</h3>
            <p>إرجاع الخط والحجم والمظهر إلى القيم الافتراضية.</p>
            <button class="soft-btn" onclick="resetSettings()"><i class="fa-solid fa-rotate-left"></i> إعادة ضبط جميع الإعدادات</button>
          </section>
        </div>
      `;
    }

    function renderContentItems(items){
      let out = "";
      let inList = false;
      const closeList = () => {
        if(inList){ out += "</ul>"; inList = false; }
      };
      for(const item of items){
        const text = escapeHTML(item.text);
        if(item.type === "question"){
          if(!inList){ out += '<ul class="questions-list">'; inList = true; }
          out += `<li>${text}</li>`;
        }else{
          closeList();
          if(item.type === "questions_heading") out += `<h3 class="questions-heading">${text}</h3>`;
          else if(item.type === "subheading") out += `<h3 class="subheading">${text}</h3>`;
          else out += `<p>${text}</p>`;
        }
      }
      closeList();
      return out;
    }

    function renderSection(id){
      const section = BY_ID[id];
      if(!section){ navigate("home"); return; }
      currentSectionId = id;
      Store.set("qmp_last_section", id);
      const stats = getStats(section);
      const idx = SECTIONS.findIndex(s => s.id === id);
      const prev = idx > 0 ? SECTIONS[idx-1] : null;
      const next = idx < SECTIONS.length-1 ? SECTIONS[idx+1] : null;
      const fav = favorites.has(id);

      document.getElementById("app").innerHTML = `
        <div class="page reader-wrap">
          <div class="reader-top">
            <button class="back-btn" onclick="history.length>1?history.back():navigate('home')"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
            <div class="reader-tools">
              <button class="tool-btn" onclick="copySection('${id}')"><i class="fa-regular fa-copy"></i><span>نسخ</span></button>
              <button class="tool-btn" onclick="shareSection('${id}')"><i class="fa-solid fa-share-nodes"></i><span>مشاركة</span></button>
              <button id="readerFavBtn" class="tool-btn ${fav?"active":""}" onclick="toggleFavorite('${id}',this)"><i class="${fav?"fa-solid":"fa-regular"} fa-bookmark"></i><span>مفضلة</span></button>
              <button class="tool-btn" onclick="changeReaderSize(1)" aria-label="تكبير الخط"><i class="fa-solid fa-plus"></i><span>تكبير</span></button>
              <button class="tool-btn" onclick="changeReaderSize(-1)" aria-label="تصغير الخط"><i class="fa-solid fa-minus"></i><span>تصغير</span></button>
            </div>
          </div>

          <article class="reader-card" id="readerArticle">
            <header class="reader-cover">
              <div class="book-label">${escapeHTML(section.bookTitle)} · ${escapeHTML(section.bookSubtitle)}</div>
              <h1>${escapeHTML(section.title)}</h1>
              <div class="stats">
                <span class="stat"><i class="fa-regular fa-file-lines"></i>${section.paragraphCount} فقرة</span>
                <span class="stat"><i class="fa-solid fa-font"></i>${stats.words} كلمة</span>
                <span class="stat"><i class="fa-regular fa-clock"></i>${stats.minutes} دقائق قراءة</span>
              </div>
            </header>
            <div class="reader-content" id="readerContent">${renderContentItems(section.items)}</div>
            <div class="reader-nav">
              ${prev ? `<button onclick="navigate('${prev.id}')"><small><i class="fa-solid fa-arrow-right"></i> السابق</small>${escapeHTML(prev.title)}</button>` : `<div></div>`}
              ${next ? `<button onclick="navigate('${next.id}')"><small>التالي <i class="fa-solid fa-arrow-left"></i></small>${escapeHTML(next.title)}</button>` : `<div></div>`}
            </div>
          </article>
        </div>
      `;

      requestAnimationFrame(() => {
        const positions = Store.get("qmp_scroll_positions", {});
        const saved = Number(positions[id] || 0);
        if(saved > 0) window.scrollTo({top:saved,behavior:"auto"});
        else window.scrollTo({top:0,behavior:"auto"});
        updateReadingProgress();
      });
    }

    function toggleFavorite(id, button){
      if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
      Store.set("qmp_favorites", [...favorites]);
      if(button){
        const active = favorites.has(id);
        button.classList.toggle("active", active);
        const icon = button.querySelector("i");
        if(icon) icon.className = `${active?"fa-solid":"fa-regular"} fa-bookmark`;
      }
      toast(favorites.has(id) ? "تمت الإضافة إلى المفضلة" : "تمت الإزالة من المفضلة");
      if(currentRoute().page === "favorites") renderFavorites();
    }

    async function copyText(text){
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
        }else{
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus(); ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        return true;
      }catch(e){ return false; }
    }

    async function copySection(id){
      const section = BY_ID[id];
      const ok = await copyText(sectionPlainText(section));
      toast(ok ? "تم نسخ محتوى القسم" : "تعذر النسخ على هذا المتصفح");
    }

    async function shareSection(id){
      const section = BY_ID[id];
      const text = sectionPlainText(section);
      if(navigator.share){
        try{
          await navigator.share({title:section.title,text});
          return;
        }catch(e){
          if(e && e.name === "AbortError") return;
        }
      }
      const ok = await copyText(text);
      toast(ok ? "تم نسخ المحتوى للمشاركة" : "المشاركة غير متاحة");
    }

    function searchSections(query){
      const q = normalizeArabic(query);
      if(!q) return SECTIONS.slice(0,20);
      return SECTIONS.filter(section => {
        const haystack = normalizeArabic(sectionPlainText(section));
        return haystack.includes(q);
      }).slice(0,60);
    }

    function openSearch(initial=""){
      const modal = document.getElementById("searchModal");
      const input = document.getElementById("modalSearchInput");
      modal.classList.add("open");
      document.body.classList.add("no-scroll");
      input.value = initial || "";
      renderSearchResults(input.value);
      setTimeout(() => {
        input.focus();
        if(input.value) input.setSelectionRange(input.value.length,input.value.length);
      }, 20);
    }

    function closeSearch(){
      document.getElementById("searchModal").classList.remove("open");
      document.body.classList.remove("no-scroll");
    }

    function renderSearchResults(query){
      const results = searchSections(query);
      const container = document.getElementById("searchResults");
      container.innerHTML = results.length ? results.map(section => `
        <button class="search-result" onclick="closeSearch();navigate('${section.id}')">
          <strong>${escapeHTML(section.title)}</strong>
          <span>${gradeName(section.grade)} · ${escapeHTML(section.description || "")}</span>
        </button>
      `).join("") : `<div class="empty" style="border:0;box-shadow:none"><i class="fa-solid fa-magnifying-glass"></i><h3>لا توجد نتائج</h3><p>جرّب كلمة أخرى.</p></div>`;
    }

    function updateReadingProgress(){
      const bar = document.getElementById("progressBar");
      const topBtn = document.getElementById("toTop");
      const route = currentRoute();
      if(route.page !== "section"){
        bar.style.width = "0";
        topBtn.classList.toggle("show", window.scrollY > 500);
        return;
      }
      const article = document.getElementById("readerArticle");
      if(!article) return;
      const rect = article.getBoundingClientRect();
      const articleTop = window.scrollY + rect.top;
      const max = Math.max(1, article.offsetHeight - window.innerHeight + 90);
      const progress = Math.min(1, Math.max(0, (window.scrollY - articleTop + 90) / max));
      bar.style.width = `${progress*100}%`;
      topBtn.classList.toggle("show", window.scrollY > 600);

      clearTimeout(scrollTick);
      scrollTick = setTimeout(() => {
        if(currentSectionId){
          const positions = Store.get("qmp_scroll_positions", {});
          positions[currentSectionId] = Math.round(window.scrollY);
          Store.set("qmp_scroll_positions", positions);
        }
      }, 160);
    }

    function renderRoute(){
      const route = currentRoute();
      updateNav(route.page);
      if(route.page === "section") renderSection(route.id);
      else if(route.page === "favorites") renderFavorites();
      else if(route.page === "settings") renderSettings();
      else renderHome();
      applySettings();
    }

    // Ripple effect
    document.addEventListener("pointerdown", e => {
      const target = e.target.closest(".ripple");
      if(!target) return;
      const rect = target.getBoundingClientRect();
      const size = Math.max(rect.width,rect.height);
      const wave = document.createElement("span");
      wave.className = "ripple-wave";
      wave.style.width = wave.style.height = size + "px";
      wave.style.left = (e.clientX - rect.left - size/2) + "px";
      wave.style.top = (e.clientY - rect.top - size/2) + "px";
      target.appendChild(wave);
      setTimeout(()=>wave.remove(),600);
    });

    document.getElementById("modalSearchInput").addEventListener("input", e => renderSearchResults(e.target.value));
    document.getElementById("searchModal").addEventListener("click", e => { if(e.target.id === "searchModal") closeSearch(); });
    document.addEventListener("keydown", e => {
      if(e.key === "Escape") closeSearch();
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openSearch(); }
    });
    window.addEventListener("scroll", updateReadingProgress, {passive:true});
    window.addEventListener("hashchange", renderRoute);

    applySettings();
    if(!location.hash) history.replaceState(null,"","#home");
    renderRoute();
  </script>
</body>
</html>

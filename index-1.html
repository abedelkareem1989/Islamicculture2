<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="حل ألفاظ القواعد التى يعرف بها الكفر - تطبيق قراءة إسلامي تفاعلي" />
  <title>حل ألفاظ القواعد التى يعرف بها الكفر</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --emerald: #0d6e4f;
      --emerald-dark: #08553c;
      --emerald-light: #e8f5f0;
      --gold: #c9a227;
      --gold-light: #f5e9c4;
      --beige: #f8f4ec;
      --beige-dark: #e8e0d0;
      --white: #ffffff;
      --gray: #5a5a5a;
      --gray-light: #f0f0f0;
      --text: #1a1a1a;
      --text-muted: #666;
      --shadow: 0 4px 20px rgba(13, 110, 79, 0.12);
      --shadow-hover: 0 8px 30px rgba(13, 110, 79, 0.2);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Cairo', sans-serif;
      --font-size-base: 18px;
      --header-h: 64px;
    }

    [data-theme="dark"] {
      --emerald: #1a9b6e;
      --emerald-dark: #0d6e4f;
      --emerald-light: #0f2e24;
      --gold: #d4af37;
      --gold-light: #3d3520;
      --beige: #121212;
      --beige-dark: #1e1e1e;
      --white: #1a1a1a;
      --gray: #b0b0b0;
      --gray-light: #2a2a2a;
      --text: #e8e8e8;
      --text-muted: #a0a0a0;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: var(--font-size-base);
    }

    body {
      font-family: var(--font);
      background: var(--beige);
      color: var(--text);
      line-height: 1.8;
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    /* ===== Header ===== */
    .app-header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: var(--header-h);
      background: var(--emerald);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-title i {
      color: var(--gold);
    }

    .header-actions {
      display: flex;
      gap: 0.4rem;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background var(--transition), transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn.active {
      color: var(--gold);
    }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      transform: scale(0);
      animation: ripple-anim 0.5s linear;
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }

    /* ===== Main Layout ===== */
    .app-main {
      padding-top: calc(var(--header-h) + 1rem);
      padding-bottom: 5rem;
      max-width: 960px;
      margin: 0 auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    /* ===== Search Bar ===== */
    .search-wrap {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 3rem;
      border: 2px solid var(--beige-dark);
      border-radius: 50px;
      background: var(--white);
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-input:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 4px rgba(13, 110, 79, 0.15);
    }

    .search-icon {
      position: absolute;
      right: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      left: 0;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
      max-height: 360px;
      overflow-y: auto;
      z-index: 50;
      display: none;
      border: 1px solid var(--beige-dark);
    }

    .search-results.show {
      display: block;
      animation: fadeSlide 0.25s ease;
    }

    .search-item {
      padding: 0.9rem 1.2rem;
      cursor: pointer;
      border-bottom: 1px solid var(--gray-light);
      transition: background var(--transition);
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: var(--emerald-light); }
    .search-item-title { font-weight: 600; color: var(--emerald); margin-bottom: 0.2rem; }
    .search-item-snippet { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Cards Grid ===== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .section-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .section-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: var(--shadow-hover);
      border-color: var(--emerald);
    }

    .section-card:active {
      transform: scale(0.98);
    }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--emerald);
      line-height: 1.4;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .card-meta span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .card-fav {
      position: absolute;
      top: 1rem;
      left: 1rem;
      color: var(--gold);
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .section-card.is-fav .card-fav { opacity: 1; }

    /* ===== Section Page ===== */
    .section-page {
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .section-header-block {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
      border-right: 5px solid var(--gold);
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--emerald);
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .section-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .section-stats span {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .section-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .tool-btn {
      background: var(--white);
      border: 1px solid var(--beige-dark);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 50px;
      font-family: var(--font);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .tool-btn:hover {
      background: var(--emerald);
      color: #fff;
      border-color: var(--emerald);
    }

    .tool-btn.fav-active {
      background: var(--gold-light);
      border-color: var(--gold);
      color: var(--emerald-dark);
    }

    .content-body {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.75rem 1.5rem;
      box-shadow: var(--shadow);
      line-height: 2;
      font-size: 1.05rem;
    }

    .content-body p {
      margin-bottom: 1.1rem;
      text-align: justify;
    }

    .content-body p:last-child { margin-bottom: 0; }

    .content-body .quran {
      color: var(--emerald);
      font-weight: 600;
    }

    /* Reading Progress */
    .read-progress {
      position: fixed;
      top: var(--header-h);
      right: 0;
      left: 0;
      height: 3px;
      background: transparent;
      z-index: 999;
    }

    .read-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--emerald));
      width: 0%;
      transition: width 0.1s linear;
    }

    /* Back to top */
    .back-top {
      position: fixed;
      bottom: 5.5rem;
      left: 1.25rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--emerald);
      color: #fff;
      border: none;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      z-index: 100;
      transition: transform var(--transition), opacity var(--transition);
    }

    .back-top.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .back-top:hover { transform: scale(1.08); }

    /* ===== Bottom Nav ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      height: 64px;
      background: var(--white);
      border-top: 1px solid var(--beige-dark);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 12px;
      transition: color var(--transition);
    }

    .nav-item i { font-size: 1.25rem; }
    .nav-item.active { color: var(--emerald); font-weight: 600; }
    .nav-item:hover { color: var(--emerald); }

    /* ===== Favorites & Settings Pages ===== */
    .page-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--emerald);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      color: var(--beige-dark);
      margin-bottom: 1rem;
    }

    /* Settings */
    .settings-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--gray-light);
    }

    .settings-row:last-child { border-bottom: none; }

    .settings-label {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toggle-switch {
      width: 52px;
      height: 28px;
      background: var(--beige-dark);
      border-radius: 50px;
      position: relative;
      cursor: pointer;
      transition: background var(--transition);
    }

    .toggle-switch.on { background: var(--emerald); }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      right: 3px;
      transition: transform var(--transition);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .toggle-switch.on::after {
      transform: translateX(-24px);
    }

    .font-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .font-opt {
      padding: 0.45rem 0.9rem;
      border: 2px solid var(--beige-dark);
      border-radius: 50px;
      background: var(--white);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all var(--transition);
    }

    .font-opt.active {
      border-color: var(--emerald);
      background: var(--emerald-light);
      color: var(--emerald);
      font-weight: 600;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 160px;
    }

    .range-wrap input[type="range"] {
      flex: 1;
      accent-color: var(--emerald);
    }

    .range-val {
      font-size: 0.85rem;
      min-width: 36px;
      text-align: center;
    }

    .reset-btn {
      width: 100%;
      padding: 0.85rem;
      background: transparent;
      border: 2px solid var(--emerald);
      color: var(--emerald);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      margin-top: 0.5rem;
    }

    .reset-btn:hover {
      background: var(--emerald);
      color: #fff;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 5.5rem;
      right: 50%;
      transform: translateX(50%) translateY(20px);
      background: var(--emerald-dark);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 2000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(50%) translateY(0);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header-title { font-size: 0.9rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .content-body { padding: 1.25rem 1rem; font-size: 1rem; }
      .section-title { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-title">
      <i class="fas fa-book-open"></i>
      <span id="headerText">حل ألفاظ القواعد التى يعرف بها الكفر</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnTheme" title="الوضع الليلي/النهاري" aria-label="تبديل الوضع">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Reading Progress -->
  <div class="read-progress" id="readProgress" style="display:none;">
    <div class="read-progress-bar" id="readProgressBar"></div>
  </div>

  <!-- Main Content -->
  <main class="app-main" id="appMain">
    <!-- Dynamic content injected here -->
  </main>

  <!-- Back to Top -->
  <button class="back-top" id="backTop" aria-label="العودة للأعلى">
    <i class="fas fa-chevron-up"></i>
  </button>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home" aria-label="الرئيسية">
      <i class="fas fa-home"></i>
      <span>الرئيسية</span>
    </button>
    <button class="nav-item" data-page="favorites" aria-label="المفضلة">
      <i class="fas fa-star"></i>
      <span>المفضلة</span>
    </button>
    <button class="nav-item" data-page="settings" aria-label="الإعدادات">
      <i class="fas fa-cog"></i>
      <span>الإعدادات</span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // DATA – Full original text preserved 100%
    // ============================================================
    const SECTIONS = [
      {
        id: "intro",
        title: "المقدمة والافتتاح",
        icon: "fa-mosque",
        desc: "بسم الله والحمد لله والصلاة على رسول الله، وبيان أهمية الأمانة في العلم والتحفظ في الفتوى",
        content: `<p>بسم الله الرحمٰن الرحيم</p>
<p>الحمد لله رب العالمين، والصلاة والسلام على سيد الأولين والآخرين، قائد الغر المحجلين، إمام الأتقياء العارفين، سيدنا وقائدنا وحبيبنا ونور أبصارنا محمد النبي العربي الأمي الأمين، العالي القدر، العظيم الجاه، وعلى آله وصحبه ومن والاه.</p>
<p>(بسم الله الرحمٰن الرحيم)</p>
<p>أى أبتدئ تصنيفى لهذا الكتاب بقول بسم الله الرحمٰن الرحيممتبركا بذكر اسم اللهوأثنى على الله على نعمه بقول (الحمد لله رب العالمين) أى المالك لكل ما دخل فى الوجود (له النعمة) أى المالك لكل نعمة أنعم بها على عباده (وله الفضل) أى المتفضل على عباده بما أنعم عليهم من غير وجوب شىء عليه وهو المتفضل على عباده المؤمنين بأن وفقهم للطاعات وهو الذى يجازيهم عليها بالنعيم المقيم فى الآخرة (وله الثناء) أى المستحق للثناء (الحسن وصلوات الله البر) أى المحسن إلى عباده (الرحيم) بهم (و)صلوات (الملائكة المقربين) عند الله (على سيدنا محمد أشرف المرسلين) أى أعظم الأنبياء قدرا، والصلاة من الله على النبى تعظيم ورفعة قدر أما من الملائكة فهى دعاء للنبى فهم يصلون عليه (وعلى ءاله) أى أزواجه وأقربائه المؤمنين (وصحابته الطيبين الطاهرين) من الشرك. والصحابى هو من لقى النبى ﷺ على وجه العادة مؤمنا به ومات على الإيمان.</p>
<p>(أما بعد) أى بعد ما تقدم (فإن الأمانة فى العلم) أى علم الدين (أهم من الأمانة فى المال) لأن العلم أهم من المال وضرر الخيانة فى العلم أعظم من ضرر الخيانة فى المال (فينبغى للإنسان أن يكون محتاطا فى كلامه) أى ينبغى أن يلزم جانب السلامة أى أن لا يتسرع فى الإجابة وأن لا يفتى بغير علم (وينبغى أن يعمل بما قال سيدنا عبد الله بن عمر بن الخطاب رضى الله عنهما العلم ثلاثة) أى لا بد لتحصيل العلم من أمور ثلاثة (كتاب ناطق وسنة ماضية ولا أدرى. يريد بالكتاب الناطق كتاب الله تعالى) المبين للأحكام (وبالسنة الماضية الحديث) الصحيح (الثابت عن رسول الله ﷺ) الذى عملت به الأمة (وبقوله لا أدرى أن يجيب بذلك حيث لا يعلم) أى إذا سئل عن شىء لا يعلمه أن يقول لا أعلم (ويتجنب الفتوى بغير علم).</p>
<p>(وعليكم بفهم السؤال) أى بفهم مراد السائل (على وجهه) الصحيح (وعدم الاستعجال فى الجواب قبل فهم السؤال) لأن المسؤول إن لم يفهم ماذا يريد السائل يجيبه على خلاف مراده فيظن السائل أن هذا هو جواب سؤاله فيعتقد الخطأ وهو لا يدرى، فالتأنى فى هذا الأمر مطلوب (كما قال سيدنا عبد الله بن عباس رضى الله عنهما أفهمونى ما تقولون وافهموا عنى ما أقول) لكم أى حتى لا تنقلوا عنى غير ما قلت بسبب سوء الفهم أو الإفهام (رواه البخارى).</p>
<p>(وعليكم بكلمة من عمل بها أحسن الإفادة) أى نفع نفعا كبيرا (ألا وهى زين العلم الحلم) أى الحلم زينة العلم والحلم معناه التأنى وعدم التسرع أى مما يزيد العلم زينة أن يكون عند العالم حلم وصبر.</p>
<p>(هذا وكثير من المصائب فى الكلام فى أمور الدين) على خلاف شريعة الله (يأتى من تجاوز الشخص حده) أى بسبب تجاوزه القدر الذى يعرفه من العلم (فيفتى بلا علم فى مسائل جانبية فى أثناء تدريسه ليست من أصل الكتاب الذى يدرسه) لإظهار سعة علمه أو جره إليها غيره (وهذا خطر كبير) كما بينه رسول الله ﷺ بقوله إن الله لا يقبض العلم انتزاعا ينتزعه من العباد ولكن يقبض العلم بقبض العلماء حتى إذا لم يبق عالما اتخذ الناس رؤوسا جهالا فسئلوا فأفتوا بغير علم فضلوا وأضلوا (فلو سأله الطالب فلا يجب فى المسائل الجانبية التى) ليست من أصل الكتاب الذى يدرسه إن (لم يجد فيها نقلا) عمن سبقه من أهل الفتوى (بل ليقل لا أدرى فيكون سلم لنفسه) بتجنبه الإفتاء بغير علم (وسلم الطالب) من اعتقاد الحكم على خلاف الصواب (ولا ينظر المدرس إلى أنه إذا لم يجب فى هذه المسائل الجانبية يستضعفه الطالب الذى يدرسه) بل ينبغى أن يكون همه أن ينجى نفسه وأن يرضى خالقه.</p>
<p>(ثم من المهم أن يستحضر المدرس) فى قلبه (أول ما يبدأ بالتدريس أن مراده) أى قصده من تدريسه (إفادة الناس بأمر دينهم لوجه الله تعالى) أى ابتغاء مرضاة الله (لا أن يقال عنه) إنه (قوى فى العلم) أى أن لا يكون قصده مدح الناس له (فإذا استحضر هذه النية أول الدرس يهون عليه أن يقول لا أدرى فى ما ليس له فيه نقل) لأن مراده أن يكسب الثواب أما إذا كان همه تعظيم الناس له فيصعب عليه أن يقول لا أدرى.</p>
<p>(ومن المهم أيضا التفكير فى حال الذى يدرس على المدرس) أى ينبغى للمدرس أن ينظر فى حال الطالب ولا يكلمه بما لا يفهم.</p>
<p>(و)ينبغى للمدرس أن يراعى حال (من يحضر مجلسه من غير طلبته) إذا كان له مجالس عامة يحضرها من يشاء (هل العبارة التى يذكرها فى أثناء درسه يفهم الحاضرون معناها كما ينبغى أو لا يفهمون ما يفهمه هو ويريده من هذه العبارة. قال الإمام على رضى الله عنه حدثوا الناس بما يفهمون أتحبون أن يكذب الله ورسوله رواه البخارى) معناه الطالب إن لم يفهم الكلام الذى سمعه من المدرس قد يظنه كلاما مخالفا للشرع فينكره فيرد حكما ثابتا فى شرع الله.</p>
<p>(ولله در القائل) وتقال للمدح كأنه يقول ما أحسن قوله هذا</p>
<p>(اعمل لنفسك صالحا لا تحتفل بظهور قيل فى الأنام وقـال</p>
<p>فالخلق لا يرجى اجتماع قلوبهم لا بـد من مثن عليك وقالى)</p>
<p>معناه تزود لآخرتك من العمل الصالح واستعمل أنفاسك فى الخير واغتنم ما بقى من العمرفى أحب الأعمال إلى اللهولا تهتم بما يقالواعلم أنك لا تستطيع أن تكسب رضا الناس جميعا فلا بد أن تجد قسما من الناس يمدحك وقسما يذمك فإرضاء كل الناس شبه مستحيل كما قال شيخنا العلامة الهررى رحمه الله.</p>
<p>(وقد قال الله تعالى فى سورة ق ﴿ما يلفظ من قول إلا لديه رقيب عتيد﴾ بينت الآية أن كل قول يتلفظ به المرء يكتبه الملكان رقيب وعتيد سواء كان هذا اللفظ خيرا أم شرا أم مباحا) أى يكتبان الحسنة والسيئة والمكروه والمباح لأن الله تعالى ذكر لفظ قول فى سياق النفى والنكرة إذا جاءت فى سياق النفى فهى للشمول ثم يمحى المكروه والمباح وتبقى الحسنات والسيئات.</p>
<p>(ويعلم من ذلك أن الإنسان يحاسب على نطقه فإن نطق بالشر جوزى عليه) أى استحق العقوبة عليه (وإن نطق بالخير كان له) أى أثيب عليهكما جاء عن الرسول ﷺ إنك لا تزال سالما ما سكت فإذا تكلمت كتب لك أو عليك(ولذلك قال العلماء إن المسلم إذا تلفظ بكلمة الكفر فى حال الاختيار) أى (من غير إكراه وعمدا) أى (من غير سبق لسان مع كونه عاقلا) أى (غير مجنون فإنه يخرج بذلك من الإسلام) لقول الله تعالى ﴿ولئن سألتهم ليقولن إنما كنا نخوض ونلعب قل أبالله وءاياته ورسوله كنتم تستهزؤون لا تعتذروا قد كفرتم بعد إيمانكم﴾ وقوله تعالى ﴿يحلفون بالله ما قالوا ولقد قالوا كلمة الكفر وكفروا بعد إسلامهم﴾ (وقد قسم العلماء) من المذاهب الأربعة (الكفر إلى ثلاثة أقسام كفر اعتقادى) محله القلب كاعتقاد أن الله جسم قاعد فوق العرش (وكفر فعلى) يحصل بالجوارح كالسجود للشيطان (وكفر لفظى) يحصل باللسان كسب الله أو نبى من أنبيائه (ووضعوا قواعد يعرف بها ما يخرج من الأقوال أو الأفعال أو الاعتقادات عن الإسلام) ليجتنبه الناس.</p>`

        content: `<p>(القاعدة الأولى)</p>
<p>(من أنكر ما علم من الدين بالضرورة أى ما علم علما ظاهرا يشترك فى معرفته العلماء والعامة من المسلمين كفر ولو كان هذا المنكر جاهلا بأن كلامه يخرج من الإسلام) أى من أنكر حكما من أحكام الشرع يشترك فى معرفته العلماء والعامة من المسلمين كفر (كأن قال إن شرب الخمر حلال بعدما عرف حرمته فى الشرع) فإنه يكفر (وإن كان يجهل أنه يكفر بقوله ذلك) أى وإن كان لا يعرف أنه يكفر بإنكاره لهذا الحكم لأنه لا يشترط فى الوقوع فى الكفر معرفة الحكم أى معرفة أن ما قاله كفر لأن النبى ﷺ حكم على قائل الكلمة الكفرية بالعذاب فى قعر النار مع كونه غير عالم بالحكم لأنه لا يظن فيها ضررا كما جاء فى حديث الترمذى إن العبد ليتكلم بالكلمة لا يرى بها بأسا يهوى بها فى النار سبعين خريفا أى مسافة سبعين عاما فى النزول وذلك منتهى جهنم أى قعرها وهو خاص بالكفار (لكن من كان قريب عهد بإسلام أى أسلم من) وقت (قريب أو كان يشبه قريب العهد بالإسلام) أى كان مثله (كأن نشأ فى بادية بعيدة عن العلماء) أى نشأ فى بلد بعيد عن أهل العلم (أو نشأ بين المسلمين ولكن) لم يعلمه أهله ولا غيرهم أمور الدين إلا الشهادتين فأنكر حكما من أحكام الشرع لأنه (لم يتردد على سمعه) هذا (الحكم الذى أنكره) كأن لم يسمع بوجوب خمس صلوات فى اليوم والليلة فأنكر وجوبها (فإنه لا يكفر) أى (بشرط أن يكون غير عالم بورود الحكم الذى أنكره فى دين الإسلام) لأن هذه الأحكام لا تعرف إلا بالنقل والسماع ولا تدرك بالعقل. و(هذا) الحكم فى عدم تكفيره فى حال (إن لم يكن الأمر الذى أنكره نحو تنزيه الله عن الشبيه وتنزيهه) عن الحجم والكمية والمقدار والحد واللون والشكل والقيام والقعود والحركة والسكون و(عن التحيز فى الجهة والمكان) وعن كل صفات المخلوقين (و)نحو (تبرئة الأنبياء من الخيانة) وهى ضد النصيحة والرذالة وهى صفات الأسافل الدون من الناس كاختلاس النظر إلى المرأة الأجنبية بشهوة (والسفاهة) وهى التصرف بخلاف الحكمة أو التلفظ بألفاظ شنيعة تستقبحها النفس فإنه لا يعذر أحد فى مثل هذا مهما بلغ الجهل بصاحبه.</p>
<p>(وأما من نسب إلى الله تعالى) الحجم أو (المكان أو الجهة) أو القيام أو القعود (أو) غير ذلك من (صفات المخلوقات أو) أنكر صفة من صفات الله الثلاث عشرة الواجبة له إجماعا كالعلم والقدرة والمشيئة فإنه يكفر ولو كان قريب عهد بإسلام ولو لم يعلم بورودها فى الشرع لأن هذه الصفات تعرف بالعقل. وكذا إن (نسب إلى الأنبياء) الكفر أو (الفسوق أو الرذالة أو الخيانة أو السفاهة) أو الكذب (فإنه يكفر ولو كان حديث عهد بإسلام أو متأولا) أى أخطأ فى تفسير ءاية أو حديث فنسب إلى الله ما لا يليق به أو نسب إلى الأنبياء ما لا يليق بمقامهم (لأن تجويز النقائص المذكورة على الله تعالى ينقض الإيمان بالله) أى يبطله (وتجويز النقائص الآنفة الذكر على الأنبياء عليهم الصلاة والسلام ينقض الإيمان برسول الله ﷺ).</p>
<p>(وأصول الدين) أى العقائد (على قسمين قسم) يتعلق بأصل معنى الشهادتين (من خالفه) أو شك فيه (ولو مع الجهل بوروده فى الشرع لا يصح إيمانه بالله أو برسول الله ﷺ وذلك كتنزه الله عن الشبيه والمثيل) واعتقاد وجود الله ووحدانيته وقدمه أى أنه لا بداية لوجوده وبقائه وقيامه بنفسه أى أنه لا يحتاج إلى غيره وقدرته وإرادته وعلمه وسمعه وبصره وحياته وكلامه واعتقاد نبوة سيدنا محمد ﷺ (وتنزه الأنبياء عن) الكفر والكبائر وعن الصفات الذميمة كالكذب والخسة و(الدناءة) والسفاهة (والرذالة فمن أنكر بقلبه أو بلسانه أصلا من أصول هذا القسم فإنه يكفر سواء كان قريب عهد بالإسلام أم لا نشأ بين المسلمين أم لا متأولا) لآية أو حديث خطأ (أم لا).</p>
<p>(وأما القسم الثانى) من أصول الاعتقاد (فهو على قسمين أيضا القسم الأول ما كان من الأصول معلوما من الدين بالضرورة) أى يشترك فى معرفته العلماء والعامة من المسلمين (كالإيمان بعذاب القبر فيكفر منكره والشاك فيه والثانى ما لم يكن معلوما من الدين بالضرورة) أى لا يشترك فى معرفته العلماء والعامة من المسلمين بل يخفى على كثير من العوام (وإن كان مجمعا عليه وذلك كالإيمان بالحوض) الذى يشرب منه المؤمنون قبل دخولهم الجنة (فلا يكفر منكره والشاك فيه ما لم يعلم منه العناد والجحود) أى ما لم يكن إنكاره على وجه العناد.</p>
<p>(والأحكام) الشرعية (من وجوب ومشروعية وكراهة وتحريم وإباحة) أى أن الأحكام الشرعية الواجب كالصلوات الخمس والمندوب أى المسنون كتشميت العاطس والمكروه كالأكل باليد اليسرى والحرام كشرب الخمر والمباح كشرب الحليب بدل الشاى هذه الأحكام (كلها تعلم عند أهل السنة بالشرع لا بالعقل وهى تنقسم كذلك إلى قسمين معلوم من الدين بالضرورة) أى معلوم عند العالم والجاهل من المسلمين (وغير معلوم من الدين بالضرورة) أى يخفى على كثير من عوام المسلمين (فالقسم الأول كوجوب الصلوات الخمس والزكاة والصوم والحج من أنكر شيئا منه كفر) لأنه يكون مكذبا للدين (إلا أن يكون) حديث عهد بإسلام أى أسلم من وقت قريب أو (نحو حديث عهد بإسلام أو متأولا) لآية أو حديث على خلاف المعنى الصحيح (تأولا يدفع عنه الكفر كتأول مانعى الزكاة فى زمن أبى بكر الصديق رضى الله عنه بعض ءايات القرءان على غير معناها) أى تأولوا قوله تعالى ﴿خذ من أموالهم صدقة تطهرهم وتزكيهم بها وصل عليهم إن صلاتك سكن لهم﴾ فظنوا أنه لا يجب عليهم دفع الزكاة بعد موته ﷺ لأنه هو الذى أمر بأخذها منهم وبالصلاة عليهم أى بالدعاء لهم بالخير (فأنكروا لذلك وجوب الزكاة عليهم بعد وفاة رسول الله ﷺ فإنهم مع خطئهم فى التأويل) للآية (دفع عنهم تأويلهم الحكم بالتكفير فلم يكفرهم الصحابة مع أنهم قاتلوهم على منع الزكاة) أى لامتناعهم عن دفع الزكاة (كما قاتلوا الذين ارتدوا عن الإسلام).</p>
<p>(ولا يدخل فى هذا القسم من تأول بعض الآيات أو الأحاديث على غير معانيها فحملها على ما فيه مناقضة وتكذيب للشهادتين أو لإحداهما كمن اعتقد أن الله جسم بسبب سوء فهمه لآية أو حديث) فإنه يكفر ولا عذر له لأن الذى يعتقدأن الله جسم ما عرف الله ولا أقر بألوهية الله إنما نسب الألوهية إلى هذا الجسم الذى تصوره وهو غير الله قطعا فلا يكون مؤمنا بالله قال سيدنا على رضى الله عنه من زعم أنإلـٰهنا محدود فقد جهل الخالق المعبود رواه الحافظ أبو نعيم فى الحلية. والمحدود عند علماء التوحيد ما له حجم إن كان صغيرا أو كبيراوقال الإمام النسفى فى تفسيره ومن الإلحاد (أى الكفر) تسمية الله بالجسم والجوهر والعقل والعلة وقال إمام أهل السنة والجماعة أبو الحسن الأشعرى فى كتابه النوادر من اعتقد أن الله جسم فهو غير عارف بربه وإنه كافر به وقال الإمام الشافعى المجسم كافر رواه الحافظ السيوطى فى الأشباه والنظائر وقال الإمام أحمد بن حنبل من قال الله جسم لا كالأجسام كفر رواه الحافظ بدر الدين الزركشى فى كتابه تشنيف المسامع(وكذلك) يكفر (من تأول ءاية أو حديثا على غير معناهما فاعتقد أن شيئا فى هذا العالم يحصل بغير مشيئة الله) كالقدرية أى المعتزلة الذين يعتقدون أنه يحصل فى ملك الله خلاف مراده وأن مشيئة الله ليست نافذة فى كل مراداته فجعلوا الله مغلوبا وغيره غالبا فكذبوا قول الله تعالى ﴿إنا كل شىء خلقناه بقدر﴾ وروى ابن أبى حاتم فى تفسيره أن رسول الله ﷺ تلا قول الله تعالى ﴿ذوقوا مس سقر إنا كل شىء خلقناه بقدر﴾ وقال نزلت فى أناس من أمتى يكونون فى ءاخر الزمان يكذبون بقدر الله. فمن زعم أن شيئا يحصل بغير مشيئة الله (أو أن أحدا غير الله تعالى يخلق ذاتا من الذوات أو فعلا من الأفعال)كفر(لأن من اعتقد مثل هذا الاعتقاد لم يعرف الله تعالى فكيف يكون مؤمنا) به. وخلاصة ما مضى أن من اعتقد فى الله الجسمية أو جعل لله شريكا فى التخليق أو زعم أنه يحصل فى ملكه ما لا يشاء أو أنكر صفة من صفات الله الثلاث عشرة الواجبة له إجماعا كفر (وسواء فى هذا الحكم من كان لم يتعلم الصواب فى هذه المسائل فأخطأ لجهله ومن كان تعلم الصواب ثم نسيه) أو تغير اعتقاده (ولذلك رد ابن الجوزى فى كتابه أخبار الصفات وغيره قول ابن قتيبة بعدم تكفير من أنكر قدرة الله على كل شىء بسبب جهله وقال أى ابن الجوزى إن إنكار قدرة الله على كل شىء كفر بالإجماع ونقل ذلك عنه الحافظ ابن حجر) فى فتح البارى (وغيره وأقروه) على ذلك أى وافقوه ولم يعترضوا عليه.</p>
<p>(والقسم الثانى) من الأحكام (ما ليس معلوما من الدين بالضرورة)أى يخفى على كثير من عوام المسلمين(سواء كان مجمعا عليه) بين الأئمة كحرمة مصافحة المرأة الأجنبية بلا حائل (أم غير مجمع عليه) ككون فخذ الرجل عورة (فمن أنكر حكما مجمعا عليه من أحكام هذا القسم لم يكفر وسواء فى ذلك التحريم والتحليل والوجوب والمشروعية) أى سواء كان الأمر مجمعا على تحريمه أو تحليله أو وجوبه أو مشروعيته (إلا أن يعلم بحكم الشرع ويرده) أى إلا إذا كان يعلم حكمه فى الشرع ويقول بخلافه فعندئذ يكفر لتكذيبه شرع اللهتعالى.(ولكنه مع ذلك يأثم إثما كبيرا) أى وإن كان لا يكفر لكنه وقع فى ذنب كبير (لخرقه إجماع الأمة وذلك كالذى يستحل مصافحة المرأة الأجنبية من غير شهوة بلا حائل) كما تقدم (أو) يستحل (الخلوة بها لغير معصية لجهله بأن الشرع يحرم ذلك).</p>
<p>(وأما ما كان مختلفا فيه بين الأئمة) المجتهدين (من أحكام هذا القسم فمن أخذ من العامة) أى الذين لم يصلوا إلى درجة الاجتهاد (بقول أى إمام منهم دون قول إمام ءاخر فلا يكفر و)لا إثم عليه بل (ذلك) جائز (كالعمرة) فقد (قال بعض الأئمة إنها فرض على المستطيع) وبه قال الشافعى وأحمد (وقال بعض بعدم فرضيتها) وبه قال أبو حنيفة ومالك (فمن أخذ بأى من القولين فلا حرج عليه) أى لا إثم عليه (إلا أن يعتقد أن الشرع جاء بإيجابها وينكره مع ذلك أو يعتقد أن الشرع جاء بعدم إيجابها ويوجبها مع ذلك) أى إلا أن يعتقد بوجوبها فى الشرع وينكر وجوبها أو يعتقد عدم وجوبها فى شرع الله ويقول بوجوبها (فإنه يكفر عندئذ لتكذيبه الشريعة، ذلك أن السبيل إلى معرفة فروع الأحكام) أى الأحكام الشرعية (إنما هو السماع والنقل) أى نقل الثقات عن النبىﷺ(ليس غير لأن الحسن ما حسنه الشرع والقبيح ما قبحه الشرع فإن الله تعالى لو لم يوجب شيئا من الواجبات لما وجب علينا منها شىء) ولذلك لم يكن واجبا على المسلمين أن يصلوا الصلوات الخمس قبل أن توجب عليهم ليلة المعراج (ولو لم يحرم) الله (شيئا من الـمحرمات لم يحرم علينا منها شىء ولا كان أى منها سببا للعذاب فى الآخرة) ولذلك لم يكن فى شرب الخمر إثم قبل نزول تحريمها (فإنه سبحانه وتعالى يحكم) فى خلقه (بما يريد)أى يفرض ما يشاء ويحرم ما يشاء(ويفعل ما يشاء لا حامل له ولا ملجئ) أى لا شىء يحمله على فعل شىء ولا مكره له (فمن اعتقد ورود حكم فى الشرع وأنكره مع ذلك فإنه يكفر سواء كان متأولا أم لا وسواء كان هذا الحكم مجمعا عليه أم لا معلوما من الدين بالضرورة أم لا).</p>
<p>(وأما من) نشأ فى بيت لا يتكلمون فيه بأمور الدين فلم يتعلم من أهله أحكام الشريعة ولم يخالط من يعلم أحكام الشرع ولا كان فى مدرسة تعلم علم الدين لذلك(خفى عليه حكم الشرع فى أمر من الأمور أى لم يعلم بحكم الشرع فيه فاعتقد أن حكمه فى الشرع على خلاف ما هو حقيقة أو قال خلاف الصواب لجهله بالحكم وظن أن ما يقوله هو حكم الشرع لا لأنه يريد أن يرده أو يعانده) كأن لم يسمع بصلاة الصبح فلذلك لم يعتقد وجوبها أو خفى عليه وجوب الغسل من الجنابة فلم يعتقد فرضيته أو خفى عليه وجوب ستر المرأة الحرة لشعرها أمام الأجانب فاعتقد جواز كشفها له أمامهم (فإنه لا يكفر) لأنه ليس رافضا للدين ولا معاندا للشرع. (ومثله من كان تعلم الحكم فى الشرع ثم نسى فظنه على خلاف ما هو فى الواقع سواء كان هذا الحكم فى الأصل معلوما من الدين بالضرورة أم لا) كأن تعلم حرمة بيع الذهب بالذهب مع الزيادة فى أحد الجانبين على الآخر بالوزن ثم نسى الحكم فظن جوازه أو سمع بنبوة إلياس ثم نسى فلم يعتقد ذلك فلا يكفر إنما يعلم.</p>`

<p>(وقد قسم العلماء اللفظ المكفر إلى ظاهر وصريح فالظاهر) فى الكفر هو (ما كان له بحسب وضع اللغة وجهان فأكثر ولكنه إلى المعنى الكفرى أقرب)أىيحتمل معنيين فأكثر بعضها كفر وبعضهاليس كفراولكن المعنى المتبادر للفظ أى أول معنى يخطر فى الذهن عند سماع اللفظ فيه كفر(وأما الصريح) فى الكفر (فليس له بحسب وضع اللغة إلا وجه واحد كفرى) أىليس له إلا معنى واحد هو كفر(قالوا) أىأهل العلم(من تكلم بلفظ ظاهر) فى الكفر أى (له معنيان فأكثر أحدهما متبادر وهو الكفروالآخر غير متبادر لا يحكم بكفره حتى يتبين مراده)أى لا يجوز تكفيره حتى يعرف منه المعنى الذى أراد فإن قال أردت المعنى الكفرى حكم عليه بالكفر أما إن لم يرد المعنى الكفرى فلا يحكم عليه بالكفر(وأما من تكلم بلفظ صريح فى الكفر فيكفر ولا يسأل عن مراده ولا يقبل له تأويل) لأن اللفظ لا يحتمل معنى غير كفرى يصرف إليه ويحمل عليه (إلا) أن العلماء استثنوا حالة وهى (أن يكون) المتلفظ بالكفر (لا يعرف أن هذا اللفظ معناه صريح فى الكفر بل يظن أن له معنى ءاخر غير كفرى فإن هذا اللفظ عند ذلك ليس له بالنسبة إليه حكم الصريح) أى أنه لا يكفر لمجرد تلفظه به إلا أن يقصد المعنى الكفرى ويعلم أن هذا اللفظ له معنى واحد هو كفر وليس له معنى ءاخر (مثال هذا قول بعض الناس ما فى الوجود إلا الله أو لا موجود إلا الله أو هو الكل) يعنون به الله (فإن هذه الألفاظ من صريح الكفر بحسب معناها اللغوى لأن معناها أن العالم هو الله) وهذا من أشد أنواع الكفر (لكن من الناس من لا يفهمون منها هذا المعنى بل يظنون) لضعف معرفتهم بالعربية (أن معناها أن الله هو مدبر كل شىء) وأنه لا يخرج شىء فى هذا العالم عن مشيئة الله وقدرته (فهؤلاء لا يكفرون إذا قالوا هذه الكلمة وإنما ينهون عنها ويبين لهم فساد معناها بخلاف) أهل الوحدة المطلقة (الذين وضعوا هذه الكلمات لأول مرة) أى أحدثوها (وكانوا يفهمون) معناها أى (هذا الـمعنى) الباطل (الذى هو توحيد الله والعالم أى جعل الله والعالم شيئا واحدا فإنهم يكفرون وهؤلاء كانوا من ملاحدة المتصوفة المنتسبين إلى الإسلام وصلت إليهم هذه الكلمة من بعض فلاسفة اليونان) الذين كانوا يرون أن جملة العالم هو الله بما فيه من ذوى الأرواح والجماد (فسرت منهم هذه الألفاظ إلى أسماع بعض العوام) من المسلمين أى انتقلت إلى أسماعهم فصاروا يقولونها (من غير أن يعرفوا معناها) بل ظنوا أن معناها أن الله مسيطر على كل شىء (ثم منذ نحو قرن ظهر من أناس ينتسبون للشاذلية اليشرطية) وهى فرقة منحرفة (القول بهذه الكلمات مع اعتقاد معناها الذى هو كفر وهو المعنى الأصلى لها وهؤلاء تارة يقولون الله حال فى كل شخص وتارة يقولون باتحاد الله فى الأشخاص) وهذا من أشنع أنواع الكفر وأشده.</p>
<p>(كذلك إن ظن شخص لجهله بالمعنى اللغوى أن الكلمة الصريحة فى الكفر) أى التى لها معنى واحد كفرى (تحمل فى اللغة وجهين) أى معنيين (أحدهما كفرى والآخر ليس فيه كفر ونطق بها ومراده غير المعنى الكفرى) أى وهو يقصد المعنى الذى ليس فيه كفر (فإنه لا يكفر) لأنه حين نطقه بالكلمة كان يظن أن لها معنيين أحدهما كفر والآخر ليس كفرا وهو لم يقصد المعنى الكفرى (بخلاف من عرف أن) هذه (الكلمة صريحة بحسب وضع اللغة وولد معنى ءاخر لها بزعمه) أى أنشأ لها معنى من عند نفسه (فقصده من غير أن يعتقد المعنى الأصلى لها) الذى هو كفر (لكن تلفظ بها عمدا مع فهمه للمعنى الأصلى) فإنه يكفر لأنه نطق بكلمة الكفر مع علمه بمعناها (وذلك كقول بعض السفهاء) لمن يخاطبه (أخت ربك أو قول بعضهم لبعض يا ابن الله فهؤلاء يكفرون مع أنهم لا يقصدون المعنى) ولا يعتقدونه (وهؤلاء قسم منهم يقولون بالعامية يا إبن ألا بدون هاء من لفظ الجلالة وهم يفهمون من هذا اللفظ الله لأن عندهم) لفظ الجلالة (الله بالهاء و)لفظ (ألا بلا هاء واحد) فيحكم عليهم بالكفر لأنهم يعتقدون أن معنى الكلمة من حيث اللغة نسبة الولد إلى الله تعالى والعياذ بالله. (فمن تلفظ بالصريح من ألفاظ الردة) أى الكفر (نظرنا فى حاله هل يفهم المعنى) أى هل يعرف أن اللفظ ليس له إلا معنى واحد هو كفر (أو يجهله ويظن أن هذه الكلمة معناها شىء ءاخر) ليس كفرا (فإن كان يجهله فإننا لا نكفره فى هذه الحال بل نعلمه) أن (معنى الكلام) الذى قاله كفر (وننهاه عنه، حتى لو نطق بالصريح) أى باللفظ الصريح فى الكفر (وهو ناس للمعنى الكفرى الذى كان يعرفه قبلا ولم يكن يفهم منه عند النطق) به (إلا معنى ليس فيه كفر فلا يكفر. ويعلم من هنا أنه لا ينبغى التسرع فى إطلاق التكفير على شخص نطق بكلام غير صريح بالكفرولكنه ظاهر فى المعنى الكفرى قبل العلم بمراده)كأن كان له معنيان ولكنالمعنى المتبادر للفظ فيه كفر(ولا إطلاق التكفير على من نطق بالصريح من غير أن يعرف معنى اللفظ ويعرف كونه صريحا قال بعض العلماء من الحنفية وغيرهم إذا كان للكلمة سبعون معنى هى كفر ومعنى واحد ليس كفرا لا يكفر الـمتلفظ بها إلا أن يعلم أنه أراد معنى من المعانى التى هى كفر، وينسب قريب من هذا إلى أبى حنيفة أو مالك ولا يصح ذلك عنهما) أى لا يصح نسبة ذلك إليهما (لكن المعنى صحيح ولولم يقله أحد من الإمامين) أما ما ينسبه بعض الناس إليهما أنه إذا كان فى المسئلة تسعة وتسعون قولا بالتكفير وقول واحد بعدم التكفيريؤخذ بهذا القول الواحد فلا يحكم بكفرهفهو افتراء على الإمامين الجليلين(والتعبير المقرر عند الفقهاء المتأخرين فى إثبات حكم الردة هو قولهم إن كان للكلمة وجوه تقتضى الكفر ووجه واحد لا يقتضى الكفر لا يكفره المفتى إلا أن يقصد المعنى الكفرى ومرادهم بالوجوه المعانى) أى إذا كان للكلمة عدة معان كلها كفر إلا معنى واحدا ليس كفرا لا يحكم المفتى بكفره إلا إذا قصد القائل المعنى الكفرى (فإن الكلمة الواحدة قد يكون لها بضعة عشر معنى) فى اللغة (ككلمة اليد فمن نسب اليد إلى الله وأراد بها الجارحة أى العضو الذى هو من الإنسان أو غيره يحكم عليه بالكفر لأنه شبه الله بخلقه) كالوهابية أدعياء السلفية فإنهم يقولونبألسنتهملله يد لا كأيديناوفى الاعتقاد يعتقدون الجسم الذى تعرفه النفوس أما أهل السنة فيقولون لله يد لا كأيدينا على معنى الصفة كما فى قوله تعالى ﴿والسماء بنيناها بأيد﴾ أى بقوة(ومن نسب اليد إلى الله وأراد بها القدرة أو النعمة أو نحو ذلك من المعانى التى ليس فيها تشبيه الله بخلقه فلا يكفر فعلى هذا التفصيل يحكم على من يفسر اليد المضافة إلى الله فى القرءان)فى قوله تعالى ﴿والسماء بنيناها بأيد﴾ (وعلى من يفسر الاستواء على العرش الوارد فيه)فى قوله تعالى ﴿الرحمٰنعلى العرش استوى﴾(والمجىء الوارد فى قوله تعالى ﴿وجاء ربك والملك﴾. فإن فسر اليد بالجارحة أو الاستواء بالجلوس أو الاستقرار) أو المحاذاةأى كون الشىء فى مقابل شىء(أو علو المكان والمسافة أى فسر) الاستواء (الوارد) فى القرءان (بالمعنى الحسى الذى هو من صفات المخلوق أو فسر المجىء بأنه كمجىء الإنسان والملائكة بالانتقال والحركة من جهة إلى جهة فإنه يكفر).أما قوله تعالى﴿الرحمٰنعلى العرش استوى﴾فقدفسره بعض العلماء بالقهر ومعنى قهر الله للعرش الذى هو أكبر المخلوقات حجما أن العرش تحت تصرف الله هو أوجده وحفظه وأبقاه، حفظه من الهوى والسقوط ولولا حفظ الله له لهوى وتحطم.وكذلك قوله تعالى ﴿وجاء ربك﴾ فقد فسره الإمام أحمد بقولهجاءت قدرته أى ءاثار قدرته من الأمور العظام التى تظهر يوم القيامة كجر الملائكة لجزء كبير من جهنم إلى الموقف حتى يراه الكفار فيفزعوا وشهادة الأيدى والأرجل بما كسبه الكفار مع الختم على أفواههم.</p>
<p>و(بناء على ما تقدم نقول لو سمعنا شخصا يقول مثلا الصلاة على النبى مكروهة فلا ينبغى التسرع فى تكفيره بل يسأل عن مراده لأن العرب يطلقون كلمة النبى على الأرض المرتفعة المحدودبة فإن تبين أن مراده أن الصلاة على الأرض المحدودبة مكروهة لكون هذه الصلاة لا خشوع فيها فكلامه صحيح وإن تبين أنمراده بقوله هذا أن الصلاة على النبى محمد مكروهة فهو كافر وفى) كتاب (القاموس) المحيطللفيروزابادى(وغيره) كلسان العرب لابن منظور (أن كلمة النبى) فى اللغة (لها هذان المعنيان) أىتأتى بمعنى الأرض المحدودبة وتأتى بمعنى من أوحى إليه بالنبوة.</p>
<p>(ويتبين لنا أيضا أنه ليس للمفتى أن يفتى فى هذه المسائل إلا أن يعلم لسان أهل البلد فى ما يستعملون من الألفاظ أى أنه ليس للمفتى أن يفتى فيما يتعلق بالألفاظ) أى فى حكم ما يقوله الناس من الألفاظ (إلا أن يعرف اصطلاحات أهل البلد).</p>`
      },
      {

        content: `<p>(القاعدة الثالثة)</p>
<p>(من اعتقد ما هو كفر بالإجماع أو فعل فعلا مجمعا على كونه كفرا أو تكلم بكلمة صريحة مجمع على كونها كفرا لا ينفعه التشهد مع الشك فى الحكم) أى مع شكه فى كون ما حصل منه كفرا لأنه لا يعرف الفرق بين الكفر والإيمان (بل لا بد أن يتشهد للتبرؤ من الكفر مع جزمه بأن ما وقع فيه) هو (كفر) أى لا بد أن يجزم بقلبه أن ما حصل منه هو كفر ويتخلى عنه وينطق بالشهادتين (ولا يفيده التشهد ما لم يرجع عن الكفر) أى ما لم يجزم بقلبه أنه وقع فى الكفر ويتخلى عنه (كما يحصل من كثير من الناس أنهم ينطقون بألفاظ كفرية) صريحة فى الكفر أو غير صريحة لكنهم يقصدون بها المعنى الكفرى (ثم يتشهدون من غير أن يرجعوا عنها أى من غير أن يعرفوا أنها كفر فيتبرأوا منها فى قلوبهم فتشهدهم هذا لا ينفعهم).مثال على ذٰلك إنسان سب الله وهو لا يعتقد أن مسبة الله تخرجه من الدين وهي كفر، فهٰذا ولو نطق بالشهادتين وهو لا يعتقد أن مسبة الله كفر، فهٰذا لا ينفعه تشهده للرجوع إلىٰ دين الإسلام العظيم.</p>
<p>(ولو تشهد شخص للتبرؤ من كل كفر إن كان حصل منه) لكونه خاف أن يكون وقع فى الكفر من غير أن ينتبه (ثم بعد فترة) من تشهده (تيقن أنه كان حصل منه قبل تشهده كفر فهل يلزمه تشهد ثان أو يكفيه التشهد الأول الحكم هنا يختلف باختلاف حاله فإن كان حين تشهده بنية التبرؤ من الكفر عالما بحكم المسئلة التى) حصلت منه و(تذكرها فيما بعد كفاه تشهده الأول) لأنه كاره للكفر بقلبه ومتبرئ منه ويريد الخلاص منه (وإلا فيلزمه أن يتشهد من جديد) أى إن لم يكن عالما بحكم المسألة وهذا (للخروج من) هذا (الكفر) بعد أن علم أن ما حصل منه هو كفر.</p>
<p>(وإذا رجع الشخص عن الكفر وتشهد) للخلاص منه (لا يشترط أن يستحضر فى قلبه عند ذلك عبارة بعينها من نحو نويت الدخول فى الإسلام بل اشتراط استحضار ذلك لا معنى لهبل إذا عرف أنه كفر فرجع) عن الكفر أى تخلى عنه (وتشهد ليخلص من الكفر فهذا) القصد (هو نية الدخول فى الإسلام وهذا هو المقصود من قولنا للكافر تشهد بنية الدخول فى الإسلام أى اعلم أنك كافر وأقلع عن الكفر) أى اتركه (وتشهد لتصير مسلما فلا ضرر فى هذا) إذ ليس معناه أخر دخولك فى الإسلام بل معناه ليكن تشهدك بقصد الخلاص من الكفر والدخول فى الإسلام.</p>
<p>(تنبيه مهم) وهو أن (من كفر ثم قال أستغفر الله قبل أن يرجع إلى الإسلام بالشهادتين لا ينفعه قول أستغفر الله شيئا) أى لا يرجعإلى الإسلام بقول أستغفر الله كما نقل الإجماع على ذلك أبو بكر بن المنذر فى كتابيه الإشراف والإجماع(بل يزداد) إثما و(كفرا لأنه يطلب المغفرة) من الله (وهو على الكفر والله لا يغفر كفر الكافر ولا ذنوبه وهو على كفره) لقوله تعالى﴿إن الذين كفروا وظلموا لم يكن الله ليغفر لهم﴾.</p>
<p>(تنبيه) مهم (ءاخر) وهو أنه (من وقع فى كفر) و(لم يعرف كونه كفرا ثم عندما تعلم الحكم أنه كفر) كرهه لكنه (لم يتذكر وقوعه فيه) ولو تذكر لتشهد فورا لأنه لا يريد لنفسه أن يكون على الكفر (وصار بعد ذلك) أى بعد أن تعلم الحكم (يتلفظ بالشهادتين دون استحضار لما حصل منه من الكفر على عادته) أى صار يتلفظ بالشهادتين على سبيل العادة (لا بنية التقرب إلى الله بالتلفظ بهما) كأن كان له عادة أن يتشهد إذا ضايقه أحد من غير أن تكون نيته طلب الثواب من الله فإنه يرجع إلى الإسلام بنطقه بالشهادتين. فإذا تشهد (ثم بعد مدة تذكر أنه وقع فى ذلك الكفر وأنه لم يكن تشهد بنية الخلاص من الكفر لكونه كان غير ذاكر وقوعه فيه فشهادته التى كان تشهدها على سبيل العادة نفعته ولا) يحتاج أن (يعيد التشهد لأنه نطق بالشهادتين فى حال كونه متراجعا عن الكفر غير معاند). أما إذا تشهد بنية التقرب إلى الله كأن صلى ظنا منه أنه على الإسلام وأن صلاته صحيحة مقبولة فتشهد فى الصلاة لا يرجع إلى الإسلام لأنه أتى بالشهادتين على أنهما جزء من عبادة فاسدة وقد نص الماوردى على أن الدخول فى الإسلام لا يكون بالصلاة مع كونها متضمنة للشهادتين.</p>
<p>(وإذا تلفظ امرؤ بكلام له أكثر من معنى وبعض معانيه كفر دون البعض الآخر وشك هل قصد عند نطقه المعنى الكفرى أو غيره) أى صار عنده احتمال أن يكون وقع فى الكفر (فإنه يجب عليه) عندئذ (التشهد احتياطا على الفور) أى يجب عليه فورا أن ينطق بالشهادتين لأجل أن يخلص من الكفر فى حال كان قد حصل منه (وكذا إذا علم حكم عبارة أنه كفر وشك هل حصلت هذه العبارة منه أو لم تحصل) أى صار عنده احتمال أن يكون واقعا فى الكفر وليس مجرد خاطر (فإنه يلزمه المبادرة إلى التشهد على سبيل الاحتياط وينفعه هذا التشهد) للخلاص من الكفر (فى حال كان قد وقع فى الكفر على الحقيقة).</p>`

        content: `<p>(القاعدة الخامسة)</p>
<p>(من عزم على الكفر فى المستقبل) كأن عزم على أن يكفر بعد سنة (أو تردد فيه) أىتردد هل يكفر أو لا(أو علق كفره بحصول أمركأن قال إن تلف مالى أو هلك ولدى تهودت) أى أدين باليهودية(أو أنتقل إلى دين) ءاخر (غير دين الإسلام كفر فى الحال وكذا) يكفر (من أمر غيره بالكفر كما يفعل بعض الناس لتمرين الطفل على الكلام فيقولون له سب لهذا ربه فإن من أمر الطفل الذى لا يفهم المعنى بهذا الكلام يكفر كما لو قال لرجل كبير سب لهذا ربه فالحكم واحد) وكذا يكفر من يسأل الكافر سؤالا وهو يعتقد أنه سيجيب بالكفر فهذا كأنه يقول له اكفر. (ويكفر من أكره إنسانا على الكفر)كأن قال له اكفر بالله وإلا قتلتك.</p>

<p>(و)أما (إذا عزم الكافر على أن يسلم) بعد وقت (ولم يسلم بالفعل فلا يجعله ذلك مؤمنا حتى ينطق بالشهادتين عن عزم وجزم فيكون مسلما) فإن مات قبل أن ينطق بهما مات كافرا وأما من عزم على الدخول فى الإسلام بالنطق بالشهادتين فى الحال ففجأه الموت ومنعه من النطق بهما فهو عند الله مؤمن ناج.</p>`
      },
      {

        content: `<p>(القاعدة السادسة)</p>
<p>(كل فعل) أجمع المسلمون أنه (لا يصدر إلا من كافر فهو كفر ومثال ذلك رمى المصحف فى القاذورات) أو دوسه أوالبول عليه وكتابة القرءان بالبول أو بدم الحيض ولو لغرض الاستشفاء(والسجود لصنم أو شمس أو قمر أو شيطان) أو نارولو لم يقصد عبادتها وكذا السجود لإنسان على وجه العبادة له كسجود أتباع فرعون له أو تعليق شعار الكفر على نفسه لاعتقاد وجود البركة فيه أو علقه تعظيما له أو جوز تعليقه من غير ضرورة. وشعار الكفر هو ما اتخذه الكفار علامة دينية خاصة بهم.</p>`
      },
      {
        id: "rule7",
        title: "القاعدة السابعة",
        icon: "fa-7",
        desc: "من تمنى حل أمر كان محرما في جميع الشرائع مع علمه بذلك كفر",
        content: `<p>(القاعدة السابعة)</p>
<p>(من تمنى) بقلبه أو بلسانه (حل أمر كان محرما فى جميع الشرائع) التى أنزلها الله على أنبيائه (مع علمه بذلك) أى مع علمه بأنه كان حراما فى كل الشرائع (كفر كأن تمنى حل الزنى أو أكل الدم والميتة ولحم الخنزير وأكل ما رفع عليه اسم غير الله عند ذبحه) أىسمى عليه اسم غير الله عند ذبحه كقول باسم اللات والعزىأو تمنى حل الظلم أو قتل المسلم بغير حق (فإن هذه الأمور حرمت فى جميع الشرائع من شريعة ءادم إلى شريعة محمد صلى الله عليهما وسلم بخلاف من تمنى حل أمر كان حلالا فى بعض الشرائع كالجمع بين الأختين فى النكاح أو تمنى حل أمر كان محرما فى جميع الشرائع لكنه جهل ذلك) أى جهل حرمته فى كل الشرائع وظن حله فى بعضها (فإنه لا يكفر).</p>`
      },
      {
        id: "rule8",
        title: "القاعدة الثامنة",
        icon: "fa-8",
        desc: "من كفر مسلما بلا تأويل كفر، وبيان حالات التأويل التي لا يكفر بها",
        content: `<p>(القاعدة الثامنة)</p>
<p>(من كفر مسلما بلا تأويل) كأن قال له يا كافر وهويعلم أنه مسلم ولا يعلم عنه شيئا يعتقده كفرا(كفر) القائل (كما صح فى حديث مسلم من قال لأخيه يا كافر فقد باء بها أحدهما(أى كان الوزر على أحدهما)فإن كان كما قال(أى إن كان كافرا حقيقة خارجا من الإسلام فالوزر عليه دون من كفره)وإلا رجعت عليه(أى وإلا كان الوزر على من كفره بغير حق فإن كفره ولا يعلم عنه شيئا يعتقده كفرا كفرالقائل(وذلك لأنه جعل الإسلام الذى عليه هذا الشخص المسلم كفرا وأما إن كان متأولا) أى كفره لأنه رأى منه معصية ظنها كفرا (كأن كفره لشرب الخمر أو للزنى أو لقتله نفسه لأنه ظن لجهله أن شربه للخمر أو زناه أو مجرد انتحاره كفر فكفره لذلك فلا يكفر إنما يفسق) أى عليه ذنب كبير. (وكذلك لو) شبهه بالكافر كأن (قال له يا كافر مريدا أن حالك وسيرتك لشدة سوئهما يشبهان حال وسيرة الكافر فإنه لا يكفر)لكن عليه ذنب كبير بخلاف ما لو قال أنا كافر فإنه يكفر ولا تأويل لكلامه.</p>
<p>والله تعالى أعلم وأحكم، والحمد لله رب العالمين</p>`

    ];

    // ============================================================
    // STATE & LOCAL STORAGE
    // ============================================================
    const STORAGE_KEY = 'qawaid_kufr_app_v1';

    let state = {
      theme: 'light',
      font: 'Cairo',
      fontSize: 18,
      favorites: [],
      lastSection: null,
      lastScroll: 0
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    // ============================================================
    // UTILITIES
    // ============================================================
    function countWords(html) {
      const text = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      return text.split(/\s+/).filter(Boolean).length;
    }

    function readingTime(words) {
      // ~180 words per minute for Arabic religious text
      const mins = Math.max(1, Math.ceil(words / 180));
      return mins;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function addRipple(e, el) {
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size / 2) + 'px';
      span.style.top = (e.clientY - rect.top - size / 2) + 'px';
      el.appendChild(span);
      setTimeout(() => span.remove(), 500);
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      const icon = document.querySelector('#btnTheme i');
      if (icon) icon.className = state.theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }

    function applyFont() {
      document.documentElement.style.setProperty('--font', `'${state.font}', sans-serif`);
      document.documentElement.style.setProperty('--font-size-base', state.fontSize + 'px');
    }

    // ============================================================
    // ROUTING / PAGES
    // ============================================================
    let currentPage = 'home';
    let currentSectionId = null;

    function navigate(page, sectionId = null) {
      // Save scroll if leaving a section
      if (currentPage === 'section' && currentSectionId) {
        state.lastSection = currentSectionId;
        state.lastScroll = window.scrollY;
        saveState();
      }

      currentPage = page;
      currentSectionId = sectionId;

      // Update nav
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === page || (page === 'section' && btn.dataset.page === 'home'));
      });

      const progress = document.getElementById('readProgress');
      const backTop = document.getElementById('backTop');

      if (page === 'section') {
        progress.style.display = 'block';
        renderSection(sectionId);
      } else {
        progress.style.display = 'none';
        backTop.classList.remove('show');
        if (page === 'home') renderHome();
        else if (page === 'favorites') renderFavorites();
        else if (page === 'settings') renderSettings();
      }

      window.scrollTo(0, 0);
      document.getElementById('headerText').textContent =
        page === 'home' ? 'حل ألفاظ القواعد التى يعرف بها الكفر' :
        page === 'favorites' ? 'المفضلة' :
        page === 'settings' ? 'الإعدادات' :
        (SECTIONS.find(s => s.id === sectionId)?.title || '');
    }

    // ============================================================
    // RENDER FUNCTIONS
    // ============================================================
    function renderHome() {
      const main = document.getElementById('appMain');
      let html = `
        <div class="search-wrap">
          <i class="fas fa-search search-icon"></i>
          <input type="search" class="search-input" id="searchInput" placeholder="ابحث في العناوين والمحتوى..." autocomplete="off" />
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="cards-grid">
      `;

      SECTIONS.forEach(sec => {
        const words = countWords(sec.content);
        const isFav = state.favorites.includes(sec.id);
        html += `
          <div class="section-card ${isFav ? 'is-fav' : ''}" data-id="${sec.id}">
            <i class="fas fa-star card-fav"></i>
            <div class="card-icon"><i class="fas ${sec.icon}"></i></div>
            <div class="card-title">${sec.title}</div>
            <div class="card-desc">${sec.desc}</div>
            <div class="card-meta">
              <span><i class="fas fa-paragraph"></i> ${sec.content.split('</p>').length - 1} فقرة</span>
              <span><i class="fas fa-clock"></i> ~${readingTime(words)} دقائق</span>
            </div>
          </div>
        `;
      });

      html += '</div>';
      main.innerHTML = html;

      // Card clicks + ripple
      main.querySelectorAll('.section-card').forEach(card => {
        card.addEventListener('click', e => {
          addRipple(e, card);
          setTimeout(() => navigate('section', card.dataset.id), 150);
        });
      });

      // Search
      const input = document.getElementById('searchInput');
      const resultsBox = document.getElementById('searchResults');
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        if (q.length < 2) {
          resultsBox.classList.remove('show');
          return;
        }
        const matches = [];
        SECTIONS.forEach(sec => {
          const titleMatch = sec.title.toLowerCase().includes(q);
          const plain = sec.content.replace(/<[^>]+>/g, ' ').toLowerCase();
          const contentMatch = plain.includes(q);
          if (titleMatch || contentMatch) {
            let snippet = '';
            if (contentMatch) {
              const idx = plain.indexOf(q);
              snippet = plain.substring(Math.max(0, idx - 40), idx + 80).trim() + '...';
            } else {
              snippet = sec.desc;
            }
            matches.push({ id: sec.id, title: sec.title, snippet });
          }
        });
        if (matches.length === 0) {
          resultsBox.innerHTML = '<div class="search-item"><div class="search-item-title">لا توجد نتائج</div></div>';
        } else {
          resultsBox.innerHTML = matches.map(m => `
            <div class="search-item" data-id="${m.id}">
              <div class="search-item-title">${m.title}</div>
              <div class="search-item-snippet">${m.snippet}</div>
            </div>
          `).join('');
          resultsBox.querySelectorAll('.search-item').forEach(item => {
            item.addEventListener('click', () => {
              resultsBox.classList.remove('show');
              input.value = '';
              navigate('section', item.dataset.id);
            });
          });
        }
        resultsBox.classList.add('show');
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.search-wrap')) resultsBox.classList.remove('show');
      });
    }

    function renderSection(id) {
      const sec = SECTIONS.find(s => s.id === id);
      if (!sec) return navigate('home');

      const words = countWords(sec.content);
      const mins = readingTime(words);
      const isFav = state.favorites.includes(id);

      const main = document.getElementById('appMain');
      main.innerHTML = `
        <div class="section-page">
          <div class="section-header-block">
            <div class="section-title">${sec.title}</div>
            <div class="section-stats">
              <span><i class="fas fa-font"></i> ${words.toLocaleString('ar-EG')} كلمة</span>
              <span><i class="fas fa-clock"></i> ~${mins} دقيقة قراءة</span>
              <span><i class="fas fa-paragraph"></i> ${sec.content.split('</p>').length - 1} فقرة</span>
            </div>
          </div>
          <div class="section-tools">
            <button class="tool-btn" id="btnCopy"><i class="fas fa-copy"></i> نسخ</button>
            <button class="tool-btn" id="btnShare"><i class="fas fa-share-alt"></i> مشاركة</button>
            <button class="tool-btn ${isFav ? 'fav-active' : ''}" id="btnFav">
              <i class="fas fa-star"></i> ${isFav ? 'إزالة من المفضلة' : 'إضافة للمفضلة'}
            </button>
            <button class="tool-btn" id="btnFontPlus"><i class="fas fa-plus"></i> تكبير</button>
            <button class="tool-btn" id="btnFontMinus"><i class="fas fa-minus"></i> تصغير</button>
          </div>
          <div class="content-body" id="contentBody">${sec.content}</div>
        </div>
      `;

      // Tools
      document.getElementById('btnCopy').addEventListener('click', () => {
        const text = document.getElementById('contentBody').innerText;
        navigator.clipboard.writeText(text).then(() => showToast('تم نسخ المحتوى'));
      });

      document.getElementById('btnShare').addEventListener('click', async () => {
        const text = sec.title + '\n\n' + document.getElementById('contentBody').innerText.substring(0, 500) + '...';
        if (navigator.share) {
          try { await navigator.share({ title: sec.title, text }); } catch (e) {}
        } else {
          navigator.clipboard.writeText(text).then(() => showToast('تم نسخ النص للمشاركة'));
        }
      });

      document.getElementById('btnFav').addEventListener('click', function () {
        toggleFavorite(id);
        const nowFav = state.favorites.includes(id);
        this.classList.toggle('fav-active', nowFav);
        this.innerHTML = `<i class="fas fa-star"></i> ${nowFav ? 'إزالة من المفضلة' : 'إضافة للمفضلة'}`;
        showToast(nowFav ? 'أُضيف إلى المفضلة' : 'أُزيل من المفضلة');
      });

      document.getElementById('btnFontPlus').addEventListener('click', () => {
        state.fontSize = Math.min(28, state.fontSize + 2);
        applyFont();
        saveState();
        showToast('حجم الخط: ' + state.fontSize);
      });

      document.getElementById('btnFontMinus').addEventListener('click', () => {
        state.fontSize = Math.max(14, state.fontSize - 2);
        applyFont();
        saveState();
        showToast('حجم الخط: ' + state.fontSize);
      });

      // Restore scroll if same section
      if (state.lastSection === id && state.lastScroll > 0) {
        setTimeout(() => window.scrollTo(0, state.lastScroll), 50);
      }
    }

    function renderFavorites() {
      const main = document.getElementById('appMain');
      const favs = SECTIONS.filter(s => state.favorites.includes(s.id));

      if (favs.length === 0) {
        main.innerHTML = `
          <div class="page-title"><i class="fas fa-star"></i> المفضلة</div>
          <div class="empty-state">
            <i class="fas fa-star"></i>
            <p>لا توجد أقسام في المفضلة بعد</p>
            <p style="font-size:0.9rem;margin-top:0.5rem;">أضف أقسامًا من صفحة القسم</p>
          </div>
        `;
        return;
      }

      let html = `<div class="page-title"><i class="fas fa-star"></i> المفضلة (${favs.length})</div><div class="cards-grid">`;
      favs.forEach(sec => {
        const words = countWords(sec.content);
        html += `
          <div class="section-card is-fav" data-id="${sec.id}">
            <i class="fas fa-star card-fav"></i>
            <div class="card-icon"><i class="fas ${sec.icon}"></i></div>
            <div class="card-title">${sec.title}</div>
            <div class="card-desc">${sec.desc}</div>
            <div class="card-meta">
              <span><i class="fas fa-clock"></i> ~${readingTime(words)} دقائق</span>
            </div>
          </div>
        `;
      });
      html += '</div>';
      main.innerHTML = html;

      main.querySelectorAll('.section-card').forEach(card => {
        card.addEventListener('click', e => {
          addRipple(e, card);
          setTimeout(() => navigate('section', card.dataset.id), 150);
        });
      });
    }

    function renderSettings() {
      const main = document.getElementById('appMain');
      main.innerHTML = `
        <div class="page-title"><i class="fas fa-cog"></i> الإعدادات</div>

        <div class="settings-card">
          <div class="settings-row">
            <div class="settings-label"><i class="fas fa-moon"></i> الوضع الليلي</div>
            <div class="toggle-switch ${state.theme === 'dark' ? 'on' : ''}" id="themeToggle"></div>
          </div>
        </div>

        <div class="settings-card">
          <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:0.75rem;">
            <div class="settings-label"><i class="fas fa-font"></i> نوع الخط</div>
            <div class="font-options">
              <button class="font-opt ${state.font === 'Cairo' ? 'active' : ''}" data-font="Cairo" style="font-family:'Cairo'">Cairo</button>
              <button class="font-opt ${state.font === 'Tajawal' ? 'active' : ''}" data-font="Tajawal" style="font-family:'Tajawal'">Tajawal</button>
              <button class="font-opt ${state.font === 'Noto Kufi Arabic' ? 'active' : ''}" data-font="Noto Kufi Arabic" style="font-family:'Noto Kufi Arabic'">Noto Kufi</button>
              <button class="font-opt ${state.font === 'Amiri' ? 'active' : ''}" data-font="Amiri" style="font-family:'Amiri'">Amiri</button>
            </div>
          </div>
        </div>

        <div class="settings-card">
          <div class="settings-row">
            <div class="settings-label"><i class="fas fa-text-height"></i> حجم الخط</div>
            <div class="range-wrap">
              <input type="range" min="14" max="28" step="1" value="${state.fontSize}" id="fontRange" />
              <span class="range-val" id="fontVal">${state.fontSize}</span>
            </div>
          </div>
        </div>

        <button class="reset-btn" id="btnReset"><i class="fas fa-undo"></i> إعادة ضبط جميع الإعدادات</button>
      `;

      document.getElementById('themeToggle').addEventListener('click', function () {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        this.classList.toggle('on');
        applyTheme();
        saveState();
      });

      document.querySelectorAll('.font-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          state.font = btn.dataset.font;
          document.querySelectorAll('.font-opt').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFont();
          saveState();
        });
      });

      const range = document.getElementById('fontRange');
      const val = document.getElementById('fontVal');
      range.addEventListener('input', () => {
        state.fontSize = +range.value;
        val.textContent = state.fontSize;
        applyFont();
        saveState();
      });

      document.getElementById('btnReset').addEventListener('click', () => {
        state.theme = 'light';
        state.font = 'Cairo';
        state.fontSize = 18;
        state.favorites = [];
        applyTheme();
        applyFont();
        saveState();
        showToast('تم إعادة الضبط');
        renderSettings();
      });
    }

    function toggleFavorite(id) {
      const idx = state.favorites.indexOf(id);
      if (idx === -1) state.favorites.push(id);
      else state.favorites.splice(idx, 1);
      saveState();
    }

    // ============================================================
    // SCROLL & PROGRESS
    // ============================================================
    window.addEventListener('scroll', () => {
      if (currentPage !== 'section') return;

      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      document.getElementById('readProgressBar').style.width = percent + '%';

      const backTop = document.getElementById('backTop');
      if (scrollTop > 400) backTop.classList.add('show');
      else backTop.classList.remove('show');

      // Auto-save scroll position
      state.lastScroll = scrollTop;
      state.lastSection = currentSectionId;
      saveState();
    });

    document.getElementById('backTop').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ============================================================
    // THEME BUTTON
    // ============================================================
    document.getElementById('btnTheme').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState();
    });

    // ============================================================
    // BOTTOM NAV
    // ============================================================
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        navigate(btn.dataset.page);
      });
    });

    // ============================================================
    // INIT
    // ============================================================
    loadState();
    applyTheme();
    applyFont();
    navigate('home');
  </script>
</body>
</html>
